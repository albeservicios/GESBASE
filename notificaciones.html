<!DOCTYPE html>
<html lang="es-AR">

<head>

<meta charset="UTF-8">

<meta
    name="viewport"
    content="width=device-width, initial-scale=1.0, viewport-fit=cover"
>

<meta name="theme-color" content="#111827">

<title>GESBASE - Notificaciones</title>

<style>

*{
    box-sizing:border-box;
}

body{
    margin:0;
    font-family:Arial,Helvetica,sans-serif;
    background:#f3f4f6;
    color:#111827;
}

header{
    background:#111827;
    color:white;
    padding:18px;
    position:sticky;
    top:0;
    z-index:10;
}

.header-contenido{
    max-width:900px;
    margin:auto;
    display:flex;
    align-items:center;
    gap:12px;
}

.btn-volver{
    width:42px;
    height:42px;
    border:1px solid #374151;
    border-radius:10px;
    background:#1f2937;
    color:white;
    font-size:20px;
    cursor:pointer;
    flex-shrink:0;
}

.titulo{
    font-size:22px;
    font-weight:800;
}

.subtitulo{
    margin-top:3px;
    font-size:13px;
    color:#d1d5db;
}

main{
    max-width:900px;
    margin:0 auto;
    padding:20px 14px 40px;
}

.estado{
    background:white;
    border-radius:14px;
    padding:16px;
    margin-bottom:16px;
    box-shadow:0 2px 8px rgba(0,0,0,.06);
}

.notificacion{
    background:white;
    border-radius:16px;
    padding:18px;
    margin-bottom:12px;
    box-shadow:0 2px 8px rgba(0,0,0,.06);
    border-left:5px solid #2563eb;
}

.notificacion.no-leida{
    border-left-color:#dc2626;
}

.notificacion.leida{
    opacity:.78;
}

.notificacion-titulo{
    font-size:17px;
    font-weight:800;
    margin-bottom:8px;
}

.notificacion-mensaje{
    font-size:15px;
    line-height:1.5;
    white-space:pre-wrap;
}

.notificacion-fecha{
    margin-top:12px;
    font-size:12px;
    color:#6b7280;
}

.acciones{
    margin-top:14px;
}

.btn{
    border:0;
    border-radius:9px;
    padding:10px 14px;
    cursor:pointer;
    font-weight:700;
}

.btn-leer{
    background:#2563eb;
    color:white;
}

.btn-leer:disabled{
    opacity:.6;
    cursor:not-allowed;
}

.btn-volver-index{
    width:100%;
    background:#111827;
    color:white;
    padding:13px;
    margin-top:15px;
}

.vacio{
    text-align:center;
    padding:50px 20px;
    background:white;
    border-radius:16px;
    color:#6b7280;
}

.cargando{
    text-align:center;
    padding:40px;
    color:#6b7280;
}

.error{
    background:#fee2e2;
    color:#991b1b;
    padding:15px;
    border-radius:12px;
    line-height:1.5;
}

.resumen{
    background:white;
    border-radius:14px;
    padding:15px;
    margin-bottom:16px;
    box-shadow:0 2px 8px rgba(0,0,0,.06);
}

</style>

</head>

<body>


<header>

    <div class="header-contenido">

        <button
            class="btn-volver"
            id="btnVolver"
            type="button"
        >
            ←
        </button>

        <div>

            <div class="titulo">
                🔔 Notificaciones
            </div>

            <div class="subtitulo">
                Mensajes y avisos de GESBASE
            </div>

        </div>

    </div>

</header>


<main>

    <div
        id="estadoUsuario"
        class="estado"
    >
        Cargando usuario...
    </div>


    <div id="contenedorNotificaciones">

        <div class="cargando">
            Cargando notificaciones...
        </div>

    </div>


    <button
        id="btnVolverIndex"
        class="btn btn-volver-index"
        type="button"
    >
        ← Volver a GESBASE
    </button>

</main>


<script type="module">


/* =========================================================
   FIREBASE
========================================================= */

import { auth, db } from "./Js/firebase.js";


import {
    collection,
    query,
    where,
    getDocs,
    doc,
    updateDoc
} from
"https://www.gstatic.com/firebasejs/12.18.0/firebase-firestore.js";


import {
    onAuthStateChanged
} from
"https://www.gstatic.com/firebasejs/12.18.0/firebase-auth.js";


/* =========================================================
   ELEMENTOS
========================================================= */

const contenedor =
    document.getElementById(
        "contenedorNotificaciones"
    );

const estadoUsuario =
    document.getElementById(
        "estadoUsuario"
    );

const btnVolver =
    document.getElementById(
        "btnVolver"
    );

const btnVolverIndex =
    document.getElementById(
        "btnVolverIndex"
    );


/* =========================================================
   VOLVER
========================================================= */

function volver(){

    window.location.href =
        "index.html";

}


btnVolver.addEventListener(
    "click",
    volver
);


btnVolverIndex.addEventListener(
    "click",
    volver
);


/* =========================================================
   ESCAPAR HTML
========================================================= */

function escaparHTML(texto){

    return String(
        texto || ""
    )
    .replace(
        /&/g,
        "&amp;"
    )
    .replace(
        /</g,
        "&lt;"
    )
    .replace(
        />/g,
        "&gt;"
    )
    .replace(
        /"/g,
        "&quot;"
    )
    .replace(
        /'/g,
        "&#039;"
    );

}


/* =========================================================
   CONVERTIR FECHA
========================================================= */

function convertirFecha(timestamp){

    if(!timestamp){

        return "Fecha no disponible";

    }


    try{

        if(
            typeof timestamp.toDate ===
            "function"
        ){

            return timestamp
                .toDate()
                .toLocaleString(
                    "es-AR",
                    {
                        dateStyle:"short",
                        timeStyle:"short"
                    }
                );

        }


        if(
            timestamp instanceof Date
        ){

            return timestamp
                .toLocaleString(
                    "es-AR",
                    {
                        dateStyle:"short",
                        timeStyle:"short"
                    }
                );

        }


        return "Fecha no disponible";

    }catch(error){

        return "Fecha no disponible";

    }

}


/* =========================================================
   FECHA PARA ORDENAR
========================================================= */

function fechaEnMilisegundos(timestamp){

    if(!timestamp){

        return 0;

    }


    try{

        if(
            typeof timestamp.toMillis ===
            "function"
        ){

            return timestamp.toMillis();

        }


        if(
            typeof timestamp.seconds ===
            "number"
        ){

            return timestamp.seconds * 1000;

        }


        if(
            timestamp instanceof Date
        ){

            return timestamp.getTime();

        }


        return 0;

    }catch(error){

        return 0;

    }

}


/* =========================================================
   CARGAR NOTIFICACIONES
========================================================= */

async function cargarNotificaciones(uid){

    contenedor.innerHTML = `

        <div class="cargando">
            Cargando notificaciones...
        </div>

    `;


    try{

        /*
         * ====================================================
         * IMPORTANTE
         *
         * SOLAMENTE FILTRAMOS POR UID.
         *
         * NO HAY orderBy().
         *
         * NO SE NECESITA ÍNDICE COMPUESTO.
         * ====================================================
         */

        const referencia =
            collection(
                db,
                "notificaciones"
            );


        const consulta =
            query(
                referencia,
                where(
                    "uid",
                    "==",
                    uid
                )
            );


        const resultado =
            await getDocs(
                consulta
            );


        /*
         * ====================================================
         * SI NO HAY NOTIFICACIONES
         * ====================================================
         */

        if(
            resultado.empty
        ){

            contenedor.innerHTML = `

                <div class="vacio">

                    <div
                        style="
                            font-size:42px;
                            margin-bottom:10px;
                        "
                    >
                        🔔
                    </div>

                    <strong>
                        No tenés notificaciones
                    </strong>

                    <div
                        style="
                            margin-top:6px;
                        "
                    >
                        Cuando GESBASE te envíe
                        un aviso, aparecerá acá.
                    </div>

                </div>

            `;

            return;

        }


        /*
         * ====================================================
         * PASAR A ARRAY
         * ====================================================
         */

        const lista = [];


        resultado.forEach(
            (documento) => {

                lista.push({

                    id:
                        documento.id,

                    ...documento.data()

                });

            }
        );


        /*
         * ====================================================
         * ORDENAR EN EL NAVEGADOR
         *
         * Más nuevas primero.
         *
         * Esto reemplaza orderBy("fecha","desc")
         * de Firebase.
         * ====================================================
         */

        lista.sort(
            (a,b) => {

                return (
                    fechaEnMilisegundos(
                        b.fecha
                    )
                    -
                    fechaEnMilisegundos(
                        a.fecha
                    )
                );

            }
        );


        /*
         * ====================================================
         * CONTADORES
         * ====================================================
         */

        const total =
            lista.length;


        const noLeidas =
            lista.filter(
                notificacion =>
                    notificacion.leida !== true
            ).length;


        /*
         * ====================================================
         * MOSTRAR RESUMEN
         * ====================================================
         */

        contenedor.innerHTML = `

            <div class="resumen">

                <strong>
                    ${total}
                    ${
                        total === 1
                        ? " notificación"
                        : " notificaciones"
                    }
                </strong>

                ${
                    noLeidas > 0
                    ?
                    `
                    <div
                        style="
                            margin-top:7px;
                            color:#dc2626;
                            font-size:13px;
                            font-weight:700;
                        "
                    >
                        🔴 ${noLeidas}
                        ${
                            noLeidas === 1
                            ? " sin leer"
                            : " sin leer"
                        }
                    </div>
                    `
                    :
                    `
                    <div
                        style="
                            margin-top:7px;
                            color:#16a34a;
                            font-size:13px;
                            font-weight:700;
                        "
                    >
                        ✓ Todas están leídas
                    </div>
                    `
                }

            </div>

        `;


        /*
         * ====================================================
         * MOSTRAR CADA NOTIFICACIÓN
         * ====================================================
         */

        lista.forEach(
            (datos) => {

                const leida =
                    datos.leida === true;


                const tarjeta =
                    document.createElement(
                        "div"
                    );


                tarjeta.className =
                    `notificacion ${
                        leida
                        ? "leida"
                        : "no-leida"
                    }`;


                tarjeta.innerHTML = `

                    <div class="notificacion-titulo">

                        ${escaparHTML(
                            datos.titulo ||
                            "Notificación"
                        )}

                    </div>


                    <div class="notificacion-mensaje">

                        ${escaparHTML(
                            datos.mensaje ||
                            ""
                        )}

                    </div>


                    <div class="notificacion-fecha">

                        ${convertirFecha(
                            datos.fecha
                        )}

                    </div>


                    <div class="acciones">

                        ${
                            !leida
                            ?
                            `
                            <button
                                class="btn btn-leer"
                                type="button"
                            >
                                ✓ Marcar como leída
                            </button>
                            `
                            :
                            `
                            <span
                                style="
                                    color:#16a34a;
                                    font-weight:700;
                                "
                            >
                                ✓ Leída
                            </span>
                            `
                        }

                    </div>

                `;


                /*
                 * =================================================
                 * BOTÓN MARCAR COMO LEÍDA
                 * =================================================
                 */

                const botonLeer =
                    tarjeta.querySelector(
                        ".btn-leer"
                    );


                if(
                    botonLeer
                ){

                    botonLeer.addEventListener(
                        "click",
                        async () => {

                            try{

                                botonLeer.disabled =
                                    true;


                                botonLeer.textContent =
                                    "Guardando...";


                                await updateDoc(

                                    doc(
                                        db,
                                        "notificaciones",
                                        datos.id
                                    ),

                                    {
                                        leida:true
                                    }

                                );


                                await cargarNotificaciones(
                                    uid
                                );


                            }catch(error){

                                console.error(
                                    "Error:",
                                    error
                                );


                                alert(
                                    "No se pudo marcar la notificación como leída."
                                );


                                botonLeer.disabled =
                                    false;


                                botonLeer.textContent =
                                    "✓ Marcar como leída";

                            }

                        }
                    );

                }


                contenedor.appendChild(
                    tarjeta
                );

            }
        );


    }catch(error){

        console.error(
            "ERROR CARGANDO NOTIFICACIONES:",
            error
        );


        contenedor.innerHTML = `

            <div class="error">

                <strong>
                    No se pudieron cargar las notificaciones.
                </strong>

                <br><br>

                ${escaparHTML(
                    error.message ||
                    "Error desconocido."
                )}

            </div>

        `;

    }

}


/* =========================================================
   AUTENTICACIÓN
========================================================= */

onAuthStateChanged(
    auth,
    async (usuario) => {

        if(!usuario){

            window.location.href =
                "login.html";

            return;

        }


        const nombre =
            usuario.displayName ||
            usuario.email ||
            "Usuario";


        estadoUsuario.innerHTML = `

            <strong>
                Usuario:
            </strong>

            ${escaparHTML(
                nombre
            )}

            <br>

            <span
                style="
                    font-size:13px;
                    color:#6b7280;
                "
            >
                ${escaparHTML(
                    usuario.email || ""
                )}
            </span>

        `;


        await cargarNotificaciones(
            usuario.uid
        );

    }
);

</script>

</body>

</html>
