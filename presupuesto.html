<!DOCTYPE html>
<html lang="es">

<head>

<meta charset="UTF-8">

<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Nuevo presupuesto - GESBASE</title>

<style>

*{
    box-sizing:border-box;
    margin:0;
    padding:0;
}

body{
    font-family:Arial,sans-serif;
    background:#f3f4f6;
    color:#111827;
}

.contenedor{
    max-width:600px;
    margin:auto;
    min-height:100vh;
    background:white;
}

header{
    background:#111827;
    color:white;
    padding:25px 20px;
}

header h1{
    font-size:25px;
}

header p{
    margin-top:6px;
    font-size:14px;
    color:#d1d5db;
}

main{
    padding:20px;
}

.estado{
    margin-bottom:18px;
    padding:12px;
    border-radius:10px;
    background:#f3f4f6;
    color:#4b5563;
    font-size:13px;
}

.empresa-info{
    margin-bottom:20px;
    padding:16px;
    background:#f9fafb;
    border:1px solid #e5e7eb;
    border-radius:12px;
}

.empresa-titulo{
    font-size:16px;
    font-weight:bold;
    margin-bottom:10px;
}

.empresa-dato{
    font-size:13px;
    color:#4b5563;
    margin-top:5px;
}

.empresa-logo{
    width:80px;
    height:80px;
    object-fit:contain;
    display:none;
    margin-bottom:10px;
    border-radius:8px;
}

.campo{
    margin-bottom:18px;
}

label{
    display:block;
    font-weight:bold;
    font-size:14px;
    margin-bottom:7px;
}

input,
textarea{
    width:100%;
    padding:13px;
    border:1px solid #d1d5db;
    border-radius:9px;
    font-size:16px;
    background:white;
}

input:focus,
textarea:focus{
    outline:none;
    border-color:#2563eb;
}

textarea{
    min-height:110px;
    resize:vertical;
}

.material-item{
    display:flex;
    gap:8px;
    align-items:center;
    margin-bottom:10px;
}

.material-tipo{
    flex:1;
}

.material-cantidad{
    width:110px;
}

.btn-quitar{
    width:45px;
    padding:13px 5px;
    margin:0;
    background:#dc2626;
    color:white;
    border:none;
    border-radius:9px;
    font-size:18px;
}

.btn-agregar{
    background:#2563eb;
    color:white;
}

.resumen{
    margin-top:20px;
    padding:18px;
    background:#f3f4f6;
    border-radius:12px;
}

.resumen-linea{
    display:flex;
    justify-content:space-between;
    gap:10px;
    padding:8px 0;
    font-size:16px;
}

.resumen-total{
    border-top:2px solid #111827;
    margin-top:10px;
    padding-top:14px;
    font-size:21px;
    font-weight:bold;
}

button{
    width:100%;
    padding:15px;
    border:none;
    border-radius:10px;
    font-size:16px;
    font-weight:bold;
    cursor:pointer;
    margin-top:10px;
}

.guardar{
    background:#111827;
    color:white;
}

.volver{
    background:#e5e7eb;
    color:#111827;
}

button:disabled{
    opacity:.6;
    cursor:not-allowed;
}

.mensaje{
    display:none;
    margin-top:15px;
    padding:13px;
    border-radius:10px;
    font-size:14px;
}

.exito{
    display:block;
    background:#dcfce7;
    color:#166534;
}

.error{
    display:block;
    background:#fee2e2;
    color:#991b1b;
}

@media(max-width:600px){

    main{
        padding:15px;
    }

    .material-item{
        align-items:stretch;
    }

    .material-cantidad{
        width:100px;
    }

}

</style>

</head>

<!-- ==========================================

========================================== -->

<div class="resumen">

Materiales

<script type="module">

// =====================================================
// FIREBASE
// MISMA VERSIÓN EN TODA LA APP: 12.18.0
// =====================================================

import {
    auth,
    db
} from "./Js/firebase.js";


import {
    onAuthStateChanged
} from "https://www.gstatic.com/firebasejs/12.18.0/firebase-auth.js";


import {
    collection,
    addDoc,
    serverTimestamp,
    getDocs,
    query,
    where,
    doc,
    getDoc
} from "https://www.gstatic.com/firebasejs/12.18.0/firebase-firestore.js";


// =====================================================
// ELEMENTOS
// =====================================================

const estadoSesion =
document.getElementById("estadoSesion");

const empresaNombre =
document.getElementById("empresaNombre");

const empresaRazonSocial =
document.getElementById("empresaRazonSocial");

const empresaCuit =
document.getElementById("empresaCuit");

const empresaTelefono =
document.getElementById("empresaTelefono");

const empresaEmail =
document.getElementById("empresaEmail");

const empresaLogo =
document.getElementById("empresaLogo");

const cliente =
document.getElementById("cliente");

const numeroAgenda =
document.getElementById("numeroAgenda");

const fecha =
document.getElementById("fecha");

const lugarTrabajo =
document.getElementById("lugarTrabajo");

const descripcion =
document.getElementById("descripcion");

const listaMateriales =
document.getElementById("listaMateriales");

const btnAgregar =
document.getElementById("btnAgregar");

const materiales =
document.getElementById("materiales");

const manoObra =
document.getElementById("manoObra");

const viaticos =
document.getElementById("viaticos");

const resumenMateriales =
document.getElementById("resumenMateriales");

const resumenManoObra =
document.getElementById("resumenManoObra");

const resumenViaticos =
document.getElementById("resumenViaticos");

const total =
document.getElementById("total");

const mensaje =
document.getElementById("mensaje");

const btnGuardar =
document.getElementById("btnGuardar");

const btnVolver =
document.getElementById("btnVolver");


// =====================================================
// VARIABLES
// =====================================================

let usuarioActual = null;

let datosEmpresa = {
    nombreEmpresa:"",
    razonSocial:"",
    cuit:"",
    telefono:"",
    email:"",
    direccion:"",
    logoUrl:""
};


// =====================================================
// UTILIDADES
// =====================================================

function texto(valor){

    if(
        valor === undefined ||
        valor === null
    ){

        return "";

    }

    return String(valor).trim();

}


function mostrarMensaje(
    textoMensaje,
    tipo
){

    mensaje.textContent =
    textoMensaje;

    mensaje.className =
    "mensaje " + tipo;

}


function formatoDinero(valor){

    return Number(
        valor || 0
    ).toLocaleString(
        "es-AR",
        {
            minimumFractionDigits:2,
            maximumFractionDigits:2
        }
    );

}


// =====================================================
// FECHA ACTUAL
// =====================================================

const ahora =
new Date();

fecha.value =
ahora.getFullYear() +
"-" +
String(
    ahora.getMonth() + 1
).padStart(2,"0") +
"-" +
String(
    ahora.getDate()
).padStart(2,"0");


// =====================================================
// OBTENER ID DE EMPRESA
// =====================================================

async function obtenerEmpresaId(){

    if(!usuarioActual){

        return "";

    }


    try{

        const referenciaUsuario =
        doc(
            db,
            "usuarios",
            usuarioActual.uid
        );


        const resultadoUsuario =
        await getDoc(
            referenciaUsuario
        );


        if(
            resultadoUsuario.exists()
        ){

            const datos =
            resultadoUsuario.data();


            const empresaId =
            texto(
                datos.empresaId ||
                datos.empresa
            );


            if(empresaId){

                return empresaId;

            }

        }

    }
    catch(error){

        console.warn(
            "No se pudo obtener empresaId desde usuarios:",
            error
        );

    }


    /*
     * Compatibilidad con la estructura
     * anterior de GESBASE.
     */

    return usuarioActual.uid;

}


// =====================================================
// CARGAR EMPRESA
// =====================================================

async function cargarEmpresa(){

    if(!usuarioActual){

        return;

    }


    try{

        const empresaId =
        await obtenerEmpresaId();


        if(!empresaId){

            throw new Error(
                "No se encontró el ID de la empresa."
            );

        }


        const referencia =
        doc(
            db,
            "empresas",
            empresaId
        );


        const resultado =
        await getDoc(
            referencia
        );


        if(
            resultado.exists()
        ){

            datosEmpresa =
            resultado.data();

        }


        empresaNombre.textContent =
        datosEmpresa.nombreEmpresa ||
        datosEmpresa.nombre ||
        "Sin informar";


        empresaRazonSocial.textContent =
        datosEmpresa.razonSocial ||
        "Sin informar";


        empresaCuit.textContent =
        datosEmpresa.cuit ||
        "Sin informar";


        empresaTelefono.textContent =
        datosEmpresa.telefono ||
        "Sin informar";


        empresaEmail.textContent =
        datosEmpresa.email ||
        usuarioActual.email ||
        "Sin informar";


        if(
            datosEmpresa.logoUrl
        ){

            empresaLogo.src =
            datosEmpresa.logoUrl;

            empresaLogo.style.display =
            "block";

        }

    }
    catch(error){

        console.error(
            "Error cargando empresa:",
            error
        );


        empresaNombre.textContent =
        "Sin informar";


        empresaRazonSocial.textContent =
        "Sin informar";


        empresaCuit.textContent =
        "Sin informar";


        empresaTelefono.textContent =
        "Sin informar";


        empresaEmail.textContent =
        usuarioActual.email ||
        "Sin informar";

    }

}


// =====================================================
// AUTENTICACIÓN
// =====================================================

onAuthStateChanged(
    auth,
    async function(usuario){

        if(!usuario){

            window.location.replace(
                "./login.html"
            );

            return;

        }


        usuarioActual =
        usuario;


        estadoSesion.textContent =
        "Sesión activa: " +
        (
            usuario.email ||
            "usuario autenticado"
        );


        await cargarEmpresa();

    }
);


// =====================================================
// AGREGAR MATERIAL
// =====================================================

function agregarMaterial(){

    const fila =
    document.createElement("div");

    fila.className =
    "material-item";


    const tipo =
    document.createElement("input");

    tipo.type =
    "text";

    tipo.className =
    "material-tipo";

    tipo.placeholder =
    "Tipo de material";


    const cantidad =
    document.createElement("input");

    cantidad.type =
    "number";

    cantidad.className =
    "material-cantidad";

    cantidad.placeholder =
    "Cantidad";

    cantidad.min =
    "0";

    cantidad.step =
    "1";


    const quitar =
    document.createElement("button");

    quitar.type =
    "button";

    quitar.className =
    "btn-quitar";

    quitar.textContent =
    "×";


    quitar.addEventListener(
        "click",
        function(){

            fila.remove();

        }
    );


    fila.appendChild(
        tipo
    );

    fila.appendChild(
        cantidad
    );

    fila.appendChild(
        quitar
    );


    listaMateriales.appendChild(
        fila
    );

}


// =====================================================
// EVENTO AGREGAR MATERIAL
// =====================================================

btnAgregar.addEventListener(
    "click",
    agregarMaterial
);


// =====================================================
// OBTENER MATERIALES
// =====================================================

function obtenerMateriales(){

    const filas =
    listaMateriales.querySelectorAll(
        ".material-item"
    );


    const lista = [];


    filas.forEach(
        function(fila){

            const campoTipo =
            fila.querySelector(
                ".material-tipo"
            );


            const campoCantidad =
            fila.querySelector(
                ".material-cantidad"
            );


            const tipo =
            texto(
                campoTipo.value
            );


            const cantidad =
            Number(
                campoCantidad.value
            ) || 0;


            if(tipo){

                lista.push({

                    tipo:
                    tipo,

                    cantidad:
                    cantidad

                });

            }

        }
    );


    return lista;

}


// =====================================================
// CALCULAR TOTAL
// =====================================================

function calcularTotal(){

    const valorMateriales =
    Number(
        materiales.value
    ) || 0;


    const valorManoObra =
    Number(
        manoObra.value
    ) || 0;


    const valorViaticos =
    Number(
        viaticos.value
    ) || 0;


    const totalGeneral =
    valorMateriales +
    valorManoObra +
    valorViaticos;


    resumenMateriales.textContent =
    formatoDinero(
        valorMateriales
    );


    resumenManoObra.textContent =
    formatoDinero(
        valorManoObra
    );


    resumenViaticos.textContent =
    formatoDinero(
        valorViaticos
    );


    total.textContent =
    formatoDinero(
        totalGeneral
    );


    return totalGeneral;

}


materiales.addEventListener(
    "input",
    calcularTotal
);


manoObra.addEventListener(
    "input",
    calcularTotal
);


viaticos.addEventListener(
    "input",
    calcularTotal
);


// =====================================================
// NÚMERO DE AGENDA
// =====================================================

async function obtenerNumeroAgenda(){

    const ingresado =
    texto(
        numeroAgenda.value
    );


    if(ingresado){

        return ingresado;

    }


    if(!usuarioActual){

        throw new Error(
            "No hay una sesión activa."
        );

    }


    /*
     * Generamos un número y comprobamos
     * que no exista para este usuario.
     */

    for(
        let intento = 0;
        intento < 20;
        intento++
    ){

        const numero =
        String(
            Math.floor(
                100000 +
                Math.random() * 900000
            )
        );


        const referencia =
        collection(
            db,
            "presupuestos"
        );


        const consulta =
        query(
            referencia,

            where(
                "uid",
                "==",
                usuarioActual.uid
            ),

            where(
                "numeroAgenda",
                "==",
                numero
            )
        );


        const resultado =
        await getDocs(
            consulta
        );


        if(
            resultado.empty
        ){

            return numero;

        }

    }


    throw new Error(
        "No se pudo generar un número de agenda único."
    );

}


// =====================================================
// GUARDAR PRESUPUESTO
// =====================================================

btnGuardar.addEventListener(
    "click",
    async function(){

        if(!usuarioActual){

            mostrarMensaje(
                "La sesión todavía no está lista.",
                "error"
            );

            return;

        }


        if(
            !cliente.value.trim()
        ){

            mostrarMensaje(
                "Ingresá el nombre del cliente.",
                "error"
            );

            cliente.focus();

            return;

        }


        if(
            !lugarTrabajo.value.trim()
        ){

            mostrarMensaje(
                "Ingresá el lugar de trabajo.",
                "error"
            );

            lugarTrabajo.focus();

            return;

        }


        if(
            !descripcion.value.trim()
        ){

            mostrarMensaje(
                "Ingresá la descripción del trabajo.",
                "error"
            );

            descripcion.focus();

            return;

        }


        const lista =
        obtenerMateriales();


        const valorMateriales =
        Number(
            materiales.value
        ) || 0;


        const valorManoObra =
        Number(
            manoObra.value
        ) || 0;


        const valorViaticos =
        Number(
            viaticos.value
        ) || 0;


        const totalGeneral =
        valorMateriales +
        valorManoObra +
        valorViaticos;


        btnGuardar.disabled =
        true;

        btnGuardar.textContent =
        "GUARDANDO...";


        try{

            const empresaId =
            await obtenerEmpresaId();


            const numeroAgendaFinal =
            await obtenerNumeroAgenda();


            await addDoc(

                collection(
                    db,
                    "presupuestos"
                ),

                {

                    uid:
                    usuarioActual.uid,


                    empresaId:
                    empresaId,


                    empresaNombre:
                    datosEmpresa.nombreEmpresa ||
                    datosEmpresa.nombre ||
                    "",


                    empresaRazonSocial:
                    datosEmpresa.razonSocial ||
                    "",


                    empresaCuit:
                    datosEmpresa.cuit ||
                    "",


                    empresaTelefono:
                    datosEmpresa.telefono ||
                    "",


                    empresaEmail:
                    datosEmpresa.email ||
                    usuarioActual.email ||
                    "",


                    empresaDireccion:
                    datosEmpresa.direccion ||
                    "",


                    empresaLogo:
                    datosEmpresa.logoUrl ||
                    "",


                    cliente:
                    texto(
                        cliente.value
                    ),


                    numeroAgenda:
                    numeroAgendaFinal,


                    fecha:
                    fecha.value,


                    lugarTrabajo:
                    texto(
                        lugarTrabajo.value
                    ),


                    descripcion:
                    texto(
                        descripcion.value
                    ),


                    materialesLista:
                    lista,


                    materiales:
                    valorMateriales,


                    manoObra:
                    valorManoObra,


                    viaticos:
                    valorViaticos,


                    total:
                    totalGeneral,


                    estado:
                    "Pendiente",


                    creado:
                    serverTimestamp()

                }

            );


            mostrarMensaje(
                "Presupuesto guardado correctamente. N.º de agenda: " +
                numeroAgendaFinal,
                "exito"
            );


            btnGuardar.disabled =
            false;

            btnGuardar.textContent =
            "GUARDAR PRESUPUESTO";


            setTimeout(
                function(){

                    window.location.href =
                    "./presupuestos.html";

                },
                800
            );

        }
        catch(error){

            console.error(
                "ERROR GUARDANDO PRESUPUESTO:",
                error
            );


            let textoError =
            error.message ||
            error.code ||
            "Error desconocido";


            if(
                error.code ===
                "permission-denied"
            ){

                textoError =
                "Firebase rechazó el acceso. Revisá las reglas de Firestore.";

            }


            mostrarMensaje(
                "No se pudo guardar el presupuesto: " +
                textoError,
                "error"
            );


            btnGuardar.disabled =
            false;

            btnGuardar.textContent =
            "GUARDAR PRESUPUESTO";

        }

    }
);


// =====================================================
// VOLVER
// =====================================================

btnVolver.addEventListener(
    "click",
    function(){

        window.location.href =
        "./presupuestos.html";

    }
);


// =====================================================
// TOTAL INICIAL
// =====================================================

calcularTotal();

</script>
