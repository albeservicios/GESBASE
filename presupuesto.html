<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#111827">

<title>Nuevo presupuesto - GESBASE</title>

<style>

*{
    box-sizing:border-box;
    margen:0;
    relleno:0;
}

cuerpo{
    font-family:Arial,sans-serif;
    fondo:#f3f4f6;
    color:#111827;
}

.contenedor{
    ancho máximo: 600px;
    margen:automático;
    altura mínima: 100vh;
    fondo:blanco;
}

encabezamiento{
    fondo:#111827;
    color:blanco;
    relleno: 25px 20px;
}

encabezado h1{
    tamaño de fuente: 25px;
}

encabezado p{
    margen superior: 6px;
    tamaño de fuente: 14px;
    color:#d1d5db;
}

principal{
    relleno: 20px;
}

.campo{
    margen inferior: 18px;
}

etiqueta{
    mostrar:bloque;
    peso de fuente: negrita;
    tamaño de fuente: 14px;
    margen inferior: 7px;
}

aporte,
área de texto{
    ancho:100%;
    relleno: 13px;
    borde:1px sólido #d1d5db;
    radio de borde: 9px;
    tamaño de fuente: 16px;
    fondo:blanco;
}

área de texto{
    altura mínima: 110px;
    redimensionar:vertical;
}

.material-item{
    pantalla:flex;
    espacio: 8px;
    alinear-elementos:centro;
    margen inferior: 10px;
}

.material-tipo{
    flex:1;
}

.material-cantidad{
    ancho:110px;
}

.btn-quitar{
    ancho: 45px;
    relleno: 13px 5px;
    margen:0;
    fondo:#dc2626;
    color:blanco;
    borde:ninguno;
    radio de borde: 9px;
    tamaño de fuente: 18px;
}

.btn-agregar{
    fondo:#2563eb;
    color:blanco;
}

.resumen{
    margen superior: 20px;
    relleno: 18px;
    fondo:#f3f4f6;
    radio de borde: 12px;
}

.resumen-linea{
    pantalla:flex;
    justificar-contenido:espacio-entre;
    espacio: 10px;
    relleno: 8px 0;
    tamaño de fuente: 16px;
}

.resumen-total{
    borde superior: 2px sólido #111827;
    margen superior: 10px;
    relleno superior: 14px;
    tamaño de fuente: 21px;
    peso de fuente: negrita;
}

botón{
    ancho:100%;
    relleno: 15px;
    borde:ninguno;
    radio de borde: 10px;
    tamaño de fuente: 16px;
    peso de fuente: negrita;
    cursor:puntero;
    margen superior: 10px;
}

.guardar{
    fondo:#111827;
    color:blanco;
}

.volver{
    fondo:#e5e7eb;
    color:#111827;
}

botón:deshabilitado{
    opacidad: 0,6;
}

.mensaje{
    mostrar:ninguno;
    margen superior: 15px;
    relleno: 13px;
    radio de borde: 10px;
    tamaño de fuente: 14px;
}

.exito{
    mostrar:bloque;
    fondo:#dcfce7;
    color:#166534;
}

.error{
    mostrar:bloque;
    fondo:#fee2e2;
    color:#991b1b;
}

</style>
</head>

<cuerpo>

<div class="contenedor">

<encabezado>

<h1>Nuevo presupuesto</h1>

<p>GESBASE</p>

</header>

<principal>

<!-- CLIENTE -->

<div class="campo">

<etiqueta para="cliente">
Cliente
</label>

<entrada
    tipo="texto"
    id="cliente"
    placeholder="Nombre del cliente"
>

</div>


<!-- NÚMERO DE AGENDA -->

<div class="campo">

<label for="numeroAgenda">
N.º de agenda (opcional)
</label>

<entrada
    tipo="texto"
    id="numeroAgenda"
    placeholder="Si te enviaron un número, ingresalo"
    modo de entrada="numérico"
>

</div>


<!-- FECHA -->

<div class="campo">

<etiqueta para="fecha">
Fecha
</label>

<entrada
    tipo="fecha"
    id="fecha"
>

</div>


<!-- LUGAR -->

<div class="campo">

<label for="lugarTrabajo">
Lugar de trabajo
</label>

<entrada
    tipo="texto"
    id="lugarTrabajo"
    placeholder="Dirección, localidad o sucursal"
>

</div>


<!-- DESCRIPCIÓN -->

<div class="campo">

<etiqueta para="descripción">
Descripción del trabajo
</label>

<textarea
    id="descripción"
    placeholder="Describe el trabajo a realizar"
></textarea>

</div>


<!-- MATERIALES -->

<div class="campo">

<etiqueta>
Materiales
</label>

<div id="listaMateriales"></div>

<botón
    tipo="botón"
    clase="btn-agregar"
    id="btnAgregar"
>
+ Agregar material
</button>

</div>


<!-- VALOR TOTAL MATERIALES -->

<div class="campo">

<label for="materiales">
Valor total de materiales
</label>

<entrada
    tipo="número"
    id="materiales"
    min="0"
    paso="0.01"
    valor="0"
    placeholder="Ingrese el valor total de materiales"
>

</div>


<!-- MANO DE OBRA -->

<div class="campo">

<etiqueta para="manoObra">
Mano de obra
</label>

<entrada
    tipo="número"
    id="manoObra"
    min="0"
    paso="0.01"
    valor="0"
>

</div>


<!-- VIÁTICOS -->

<div class="campo">

<etiqueta para="viaticos">
Viáticos
</label>

<entrada
    tipo="número"
    id="viaticos"
    min="0"
    paso="0.01"
    valor="0"
>

</div>


<!-- RESUMEN -->

<div class="resumen">

<div class="resumen-linea">

<span>
Materiales
</span>

<strong>
$ <span id="resumenMateriales">0,00</span>
</strong>

</div>


<div class="resumen-linea">

<span>
Mano de obra
</span>

<strong>
$ <span id="resumenManoObra">0,00</span>
</strong>

</div>


<div class="resumen-linea">

<span>
Viáticos
</span>

<strong>
$ <span id="resumenViaticos">0,00</span>
</strong>

</div>


<div class="resumen-linea resumen-total">

<span>
TOTAL GENERAL
</span>

<strong>
$ <span id="total">0,00</span>
</strong>

</div>

</div>


<div
    id="mensaje"
    clase="mensaje"
></div>


<botón
    tipo="botón"
    clase="guardar"
    id="btnGuardar"
>
Guardar presupuesto
</button>


<botón
    tipo="botón"
    clase="revólver"
    id="btnVolver"
>
Volver a mis presupuestos
</button>

</main>

</div>


<script type="module">

/*
====================================================
BASE DE FUEGO
====================================================
*/

importar {
    autoridad,
    base de datos
} desde "./Js/firebase.js";


importar {
    onAuthStateChanged
} desde "https://www.gstatic.com/firebasejs/12.1.0/firebase-auth.js";


importar {
    recopilación,
    agregar documento,
    marca de tiempo del servidor
} desde "https://www.gstatic.com/firebasejs/12.1.0/firebase-firestore.js";


/*
====================================================
ELEMENTOS
====================================================
*/

const cliente =
document.getElementById("cliente");

const numeroAgenda =
document.getElementById("numeroAgenda");

const fecha =
document.getElementById("fecha");

const lugarTrabajo =
document.getElementById("lugarTrabajo");

const descripción =
document.getElementById("descripcion");

const listaMateriales =
document.getElementById("listaMateriales");

const btnAgregar =
document.getElementById("btnAgregar");

const materiales =
document.getElementById("materiales");

const manoObra =
document.getElementById("manoObra");

const viaticos =
document.getElementById("viaticos");

const resumenMateriales =
document.getElementById("resumenMateriales");

const resumenManoObra =
document.getElementById("resumenManoObra");

const resumenViaticos =
document.getElementById("resumenViaticos");

constante total =
document.getElementById("total");

const mensaje =
document.getElementById("mensaje");

const btnGuardar =
document.getElementById("btnGuardar");

const btnVolver =
document.getElementById("btnVolver");


let usuarioActual = null;


/*
====================================================
FECHA ACTUAL
====================================================
*/

const hoy = new Date();

fecha.valor =
hoy.getFullYear() +
"-" +
String(hoy.getMonth() + 1).padStart(2,"0") +
"-" +
String(hoy.getDate()).padStart(2,"0");


/*
====================================================
AUTENTICACIÓN
====================================================
*/

onAuthStateChanged(
    autoridad,
    función(usuario){

        si(!usuario){

            ventana.ubicación.reemplazar(
                "login.html"
            );

            devolver;
        }

        usuarioActual = usuario;

    }
);


/*
====================================================
MATERIAL AGREGADO
====================================================
*/

función agregarMaterial(){

    const fila =
    document.createElement("div");

    fila.className =
    "elemento material";

    fila.innerHTML = `

        <entrada
            tipo="texto"
            clase="material-tipo"
            placeholder="Tipo de material"
        >

        <entrada
            tipo="número"
            clase="material-cantidad"
            placeholder="Cantidad"
            min="0"
            paso="1"
        >

        <botón
            tipo="botón"
            clase="btn-quitar"
        >
            ×
        </button>

    `;


    fila
    .querySelector(".btn-quitar")
    .addEventListener(
        "hacer clic",
        función(){

            fila.eliminar();

        }
    );


    listaMateriales.appendChild(
        fila
    );

}


btnAgregar.addEventListener(
    "hacer clic",
    agregarMaterial
);


/*
====================================================
MATERIALES OBTENEDORES
====================================================
*/

función obtenerMateriales(){

    const filas =
    listaMateriales.querySelectorAll(
        ".elemento-material"
    );

    const lista = [];


    filas.forEach(
        función(fila){

            const tipo =
            fila
            .selector de consulta(
                ".material-tipo"
            )
            .valor
            .recortar();


            const cantidad =
            Número(
                fila
                .selector de consulta(
                    ".material-cantidad"
                )
                .valor
            ) || 0;


            if(tipo !== ""){

                lista.push({

                    tipo: tipo,

                    cantidad: cantidad

                });

            }

        }
    );


    devolver lista;

}


/*
====================================================
FORMATO DINERO
====================================================
*/

función formatoDinero(valor){

    devolver Número(
        valor || 0
    ).toLocaleString(
        "es-AR",
        {
            minimumFractionDigits:2,
            máximo de dígitos de fracción: 2
        }
    );

}


/*
====================================================
TOTAL CALCULADO
====================================================
*/

función calcularTotal(){

    const valorMateriales =
    Número(
        materiales.valor
    ) || 0;


    const valorManoObra =
    Número(
        valor de manoObra
    ) || 0;


    const valorViaticos =
    Número(
        viaticos.valor
    ) || 0;


    const totalGeneral =
    valorMateriales +
    valorManoObra +
    valorViaticos;


    Material resúmenes.textContent =
    formatoDinero(
        valorMateriales
    );


    resumenManoObra.textContent =
    formatoDinero(
        valorManoObra
    );


    resumenViaticos.textContent =
    formatoDinero(
        valorViaticos
    );


    total.textContent =
    formatoDinero(
        general total
    );


    devolver totalGeneral;

}


materiales.addEventListener(
    "aporte",
    calcularTotal
);

manoObra.addEventListener(
    "aporte",
    calcularTotal
);

viaticos.addEventListener(
    "aporte",
    calcularTotal
);


/*
====================================================
NÚMERO DE AGENDA
====================================================

REGLA:

1. Si la empresa proporciona el número:
   se guarda ese número.

2. Si queda vacío:
   GESBASE genera uno automáticamente.

IMPORTANTE:
NO hacemos getDocs(),
NO hacemos query(),
NO hacemos where().

Esto evita el error:
"Permisos faltantes o insuficientes".
====================================================
*/

función obtenerNumeroAgenda(){

    const numeroIngresado =
    numeroAgenda.valor.trim();


    /*
    Número proporcionado por la empresa
    */

    if(numeroIngresado !== ""){

        devolver numeroIngresado;

    }


    /*
    Número automático
    */

    devolver cadena(

        Matemáticas.piso(

            100000+
            Math.random() * 900000

        )

    );

}


/*
====================================================
MENSAJE
====================================================
*/

función mostrarMensaje(
    texto,
    tipo
){

    mensaje.textContent =
    texto;

    mensaje.className =
    "mensaje " + tipo;

}


/*
====================================================
GUARDAR PRESUPUESTO
====================================================
*/

btnGuardar.addEventListener(
    "hacer clic",
    función asíncrona(){

        /*
        Verificar sesión
        */

        si(!usuarioActual){

            mostrarMensaje(
                "Esperará unos segundos mientras se verifica la sesión.",
                "error"
            );

            devolver;

        }


        /*
        Cliente
        */

        si(
            cliente.value.trim() === ""
        ){

            mostrarMensaje(
                "Ingresá el nombre del cliente.",
                "error"
            );

            cliente.focus();

            devolver;

        }


        /*
        Lugar
        */

        si(
            lugarTrabajo.value.trim() === ""
        ){

            mostrarMensaje(
                "Ingresá el lugar de trabajo.",
                "error"
            );

            lugarTrabajo.focus();

            devolver;

        }


        /*
        Descripción
        */

        si(
            descripcion.value.trim() === ""
        ){

            mostrarMensaje(
                "Ingresá la descripción del trabajo.",
                "error"
            );

            descripción.enfoque();

            devolver;

        }


        /*
        Materiales
        */

        const lista =
        obtenerMateriales();


        /*
        Valores
        */

        const valorMateriales =
        Número(
            materiales.valor
        ) || 0;


        const valorManoObra =
        Número(
            valor de manoObra
        ) || 0;


        const valorViaticos =
        Número(
            viaticos.valor
        ) || 0;


        /*
        Total
        */

        const totalGeneral =
        valorMateriales +
        valorManoObra +
        valorViaticos;


        /*
        Deshabilitar botón
        */

        btnGuardar.disabled =
        verdadero;

        btnGuardar.textContent =
        "Guardando...";


        intentar{

            /*
            Número de agenda.

            Si se cargó manualmente:
            utiliza ese número.

            Si está vacío:
            genera automáticamente.
            */

            const numeroAgendaFinal =
            obtenerNúmeroAgenda();


            /*
            Guardar en Firebase
            */

            esperar a agregarDoc(

                recopilación(
                    base de datos,
                    "presupuestos"
                ),

                {

                    uid:
                    usuarioActual.uid,


                    cliente:
                    cliente.valor.trim(),


                    numeroAgenda:
                    numeroAgendaFinal,


                    fecha:
                    fecha.valor,


                    lugarTrabajo:
                    lugarTrabajo.value.trim(),


                    descripción:
                    descripción.valor.recortar(),


                    materialesLista:
                    lista,


                    materiales:
                    valorMateriales,


                    manoObra:
                    valorManoObra,


                    viaticos:
                    valorViaticos,


                    total:
                    totalGeneral,


                    creado:
                    marca de tiempo del servidor()

                }

            );


            /*
            ÉXITO
            */

            mostrarMensaje(

                "Presupuesto guardado correctamente. N.º de agenda: " +
                numeroAgendaFinal,

                "éxito"

            );


            /*
            Volver a presupuestos
            */

            establecerTiempoDeEspera(

                función(){

                    ventana.ubicación.href =
                    "presupuestos.html";

                },

                800

            );


        }

        capturar(error){

            consola.error(
                "Error al guardar:",
                error
            );


            mostrarMensaje(

                "No se pudo guardar: " +
                mensaje de error,

                "error"

            );


            btnGuardar.disabled =
            FALSO;


            btnGuardar.textContent =
            "Guardar presupuesto";

        }

    }
);


/*
====================================================
VOLVER
====================================================
*/

btnVolver.addEventListener(
    "hacer clic",
    función(){

        ventana.ubicación.href =
        "presupuestos.html";

    }
);


/*
====================================================
INICIALES TOTALES
====================================================
*/

calcularTotal();

</script>

</body>
</html>
