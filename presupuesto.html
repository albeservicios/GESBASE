<!DOCTYPE html>
<html lang="es">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#111827">

<title>Nuevo presupuesto - GESBASE</title>

<style>

*{
    box-sizing:border-box;
    margin:0;
    padding:0;
}

body{
    font-family:Arial,sans-serif;
    background:#f3f4f6;
    color:#111827;
}

.contenedor{
    max-width:600px;
    margin:auto;
    min-height:100vh;
    background:white;
}

header{
    background:#111827;
    color:white;
    padding:25px 20px;
}

header h1{
    font-size:25px;
}

header p{
    margin-top:6px;
    font-size:14px;
    color:#d1d5db;
}

main{
    padding:20px;
}

.empresa-info{
    margin-bottom:20px;
    padding:16px;
    background:#f9fafb;
    border:1px solid #e5e7eb;
    border-radius:12px;
}

.empresa-titulo{
    font-size:16px;
    font-weight:bold;
    margin-bottom:10px;
}

.empresa-dato{
    font-size:13px;
    color:#4b5563;
    margin-top:5px;
}

.empresa-logo{
    width:80px;
    height:80px;
    object-fit:contain;
    display:none;
    margin-bottom:10px;
    border-radius:8px;
}

.campo{
    margin-bottom:18px;
}

label{
    display:block;
    font-weight:bold;
    font-size:14px;
    margin-bottom:7px;
}

input,
textarea{
    width:100%;
    padding:13px;
    border:1px solid #d1d5db;
    border-radius:9px;
    font-size:16px;
    background:white;
}

textarea{
    min-height:110px;
    resize:vertical;
}

.material-item{
    display:flex;
    gap:8px;
    align-items:center;
    margin-bottom:10px;
}

.material-tipo{
    flex:1;
}

.material-cantidad{
    width:110px;
}

.btn-quitar{
    width:45px;
    padding:13px 5px;
    margin:0;
    background:#dc2626;
    color:white;
    border:none;
    border-radius:9px;
    font-size:18px;
}

.btn-agregar{
    background:#2563eb;
    color:white;
}

.resumen{
    margin-top:20px;
    padding:18px;
    background:#f3f4f6;
    border-radius:12px;
}

.resumen-linea{
    display:flex;
    justify-content:space-between;
    gap:10px;
    padding:8px 0;
    font-size:16px;
}

.resumen-total{
    border-top:2px solid #111827;
    margin-top:10px;
    padding-top:14px;
    font-size:21px;
    font-weight:bold;
}

button{
    width:100%;
    padding:15px;
    border:none;
    border-radius:10px;
    font-size:16px;
    font-weight:bold;
    cursor:pointer;
    margin-top:10px;
}

.guardar{
    background:#111827;
    color:white;
}

.volver{
    background:#e5e7eb;
    color:#111827;
}

button:disabled{
    opacity:.6;
}

.mensaje{
    display:none;
    margin-top:15px;
    padding:13px;
    border-radius:10px;
    font-size:14px;
}

.exito{
    display:block;
    background:#dcfce7;
    color:#166534;
}

.error{
    display:block;
    background:#fee2e2;
    color:#991b1b;
}

.estado{
    margin-bottom:18px;
    padding:12px;
    border-radius:10px;
    background:#f3f4f6;
    color:#4b5563;
    font-size:13px;
}

</style>

</head>

<body>

<div class="contenedor">

<header>

<h1>Nuevo presupuesto</h1>

<p>GESBASE</p>

</header>

<main>

<div
    id="estadoSesion"
    class="estado"
>
Verificando sesión...
</div>


<div class="empresa-info">

<img
    id="empresaLogo"
    class="empresa-logo"
    alt="Logo de la empresa"
>

<div class="empresa-titulo">
Datos de la empresa
</div>

<div class="empresa-dato">
<strong>Empresa:</strong>
<span id="empresaNombre">Cargando...</span>
</div>

<div class="empresa-dato">
<strong>Razón social:</strong>
<span id="empresaRazonSocial">Cargando...</span>
</div>

<div class="empresa-dato">
<strong>CUIT:</strong>
<span id="empresaCuit">Cargando...</span>
</div>

<div class="empresa-dato">
<strong>Teléfono:</strong>
<span id="empresaTelefono">Cargando...</span>
</div>

<div class="empresa-dato">
<strong>Email:</strong>
<span id="empresaEmail">Cargando...</span>
</div>

</div>


<div class="campo">

<label for="cliente">
Cliente
</label>

<input
    type="text"
    id="cliente"
    placeholder="Nombre del cliente"
>

</div>


<div class="campo">

<label for="numeroAgenda">
N.º de agenda
</label>

<input
    type="text"
    id="numeroAgenda"
    placeholder="Número de agenda"
    inputmode="numeric"
>

</div>


<div class="campo">

<label for="fecha">
Fecha
</label>

<input
    type="date"
    id="fecha"
>

</div>


<div class="campo">

<label for="lugarTrabajo">
Lugar de trabajo
</label>

<input
    type="text"
    id="lugarTrabajo"
    placeholder="Dirección, localidad o sucursal"
>

</div>


<div class="campo">

<label for="descripcion">
Descripción del trabajo
</label>

<textarea
    id="descripcion"
    placeholder="Describí el trabajo a realizar"
></textarea>

</div>


<div class="campo">

<label>
Materiales
</label>

<div id="listaMateriales"></div>

<button
    type="button"
    class="btn-agregar"
    id="btnAgregar"
>
+ Agregar material
</button>

</div>


<div class="campo">

<label for="materiales">
Valor total de materiales
</label>

<input
    type="number"
    id="materiales"
    min="0"
    step="0.01"
    value="0"
>

</div>


<div class="campo">

<label for="manoObra">
Mano de obra
</label>

<input
    type="number"
    id="manoObra"
    min="0"
    step="0.01"
    value="0"
>

</div>


<div class="campo">

<label for="viaticos">
Viáticos
</label>

<input
    type="number"
    id="viaticos"
    min="0"
    step="0.01"
    value="0"
>

</div>


<div class="resumen">

<div class="resumen-linea">

<span>Materiales</span>

<strong>
$ <span id="resumenMateriales">0,00</span>
</strong>

</div>


<div class="resumen-linea">

<span>Mano de obra</span>

<strong>
$ <span id="resumenManoObra">0,00</span>
</strong>

</div>


<div class="resumen-linea">

<span>Viáticos</span>

<strong>
$ <span id="resumenViaticos">0,00</span>
</strong>

</div>


<div class="resumen-linea resumen-total">

<span>TOTAL GENERAL</span>

<strong>
$ <span id="total">0,00</span>
</strong>

</div>

</div>


<div
    id="mensaje"
    class="mensaje"
></div>


<button
    type="button"
    class="guardar"
    id="btnGuardar"
>
GUARDAR PRESUPUESTO
</button>


<button
    type="button"
    class="volver"
    id="btnVolver"
>
VOLVER A MIS PRESUPUESTOS
</button>

</main>

</div>


<script type="module">

import {
    auth,
    db
} from "./Js/firebase.js";

import {
    onAuthStateChanged
} from "https://www.gstatic.com/firebasejs/12.1.0/firebase-auth.js";

import {
    collection,
    addDoc,
    serverTimestamp,
    getDocs,
    query,
    where,
    doc,
    getDoc
} from "https://www.gstatic.com/firebasejs/12.1.0/firebase-firestore.js";


const estadoSesion =
document.getElementById("estadoSesion");

const empresaNombre =
document.getElementById("empresaNombre");

const empresaRazonSocial =
document.getElementById("empresaRazonSocial");

const empresaCuit =
document.getElementById("empresaCuit");

const empresaTelefono =
document.getElementById("empresaTelefono");

const empresaEmail =
document.getElementById("empresaEmail");

const empresaLogo =
document.getElementById("empresaLogo");

const cliente =
document.getElementById("cliente");

const numeroAgenda =
document.getElementById("numeroAgenda");

const fecha =
document.getElementById("fecha");

const lugarTrabajo =
document.getElementById("lugarTrabajo");

const descripcion =
document.getElementById("descripcion");

const listaMateriales =
document.getElementById("listaMateriales");

const btnAgregar =
document.getElementById("btnAgregar");

const materiales =
document.getElementById("materiales");

const manoObra =
document.getElementById("manoObra");

const viaticos =
document.getElementById("viaticos");

const resumenMateriales =
document.getElementById("resumenMateriales");

const resumenManoObra =
document.getElementById("resumenManoObra");

const resumenViaticos =
document.getElementById("resumenViaticos");

const total =
document.getElementById("total");

const mensaje =
document.getElementById("mensaje");

const btnGuardar =
document.getElementById("btnGuardar");

const btnVolver =
document.getElementById("btnVolver");


let usuarioActual = null;

let datosEmpresa = {
    nombreEmpresa:"",
    razonSocial:"",
    cuit:"",
    telefono:"",
    email:"",
    direccion:"",
    logoUrl:""
};


const ahora =
new Date();

fecha.value =
ahora.getFullYear() +
"-" +
String(
    ahora.getMonth() + 1
).padStart(2,"0") +
"-" +
String(
    ahora.getDate()
).padStart(2,"0");


function mostrarMensaje(
    texto,
    tipo
){

    mensaje.textContent =
    texto;

    mensaje.className =
    "mensaje " + tipo;

}


async function cargarEmpresa(){

    if(!usuarioActual){
        return;
    }

    try{

        const referencia =
        doc(
            db,
            "empresas",
            usuarioActual.uid
        );

        const resultado =
        await getDoc(
            referencia
        );

        if(
            resultado.exists()
        ){

            datosEmpresa =
            resultado.data();

        }

        empresaNombre.textContent =
        datosEmpresa.nombreEmpresa ||
        "Sin informar";

        empresaRazonSocial.textContent =
        datosEmpresa.razonSocial ||
        "Sin informar";

        empresaCuit.textContent =
        datosEmpresa.cuit ||
        "Sin informar";

        empresaTelefono.textContent =
        datosEmpresa.telefono ||
        "Sin informar";

        empresaEmail.textContent =
        datosEmpresa.email ||
        usuarioActual.email ||
        "Sin informar";

        if(
            datosEmpresa.logoUrl
        ){

            empresaLogo.src =
            datosEmpresa.logoUrl;

            empresaLogo.style.display =
            "block";

        }

    }
    catch(error){

        console.error(
            "Error cargando empresa:",
            error
        );

        empresaNombre.textContent =
        "Sin informar";

        empresaRazonSocial.textContent =
        "Sin informar";

        empresaCuit.textContent =
        "Sin informar";

        empresaTelefono.textContent =
        "Sin informar";

        empresaEmail.textContent =
        usuarioActual.email ||
        "Sin informar";

    }

}


onAuthStateChanged(
    auth,
    async function(usuario){

        if(!usuario){

            window.location.replace(
                "./login.html"
            );

            return;

        }

        usuarioActual =
        usuario;

        estadoSesion.textContent =
        "Sesión activa: " +
        (
            usuario.email ||
            "usuario autenticado"
        );

        await cargarEmpresa();

    }
);


function agregarMaterial(){

    const fila =
    document.createElement("div");

    fila.className =
    "material-item";

    fila.innerHTML = `

        <input
            type="text"
            class="material-tipo"
            placeholder="Tipo de material"
        >

        <input
            type="number"
            class="material-cantidad"
            placeholder="Cantidad"
            min="0"
            step="1"
            class="material-cantidad"
        >

        <button
            type="button"
            class="btn-quitar"
        >
            ×
        </button>

    `;

    fila
    .querySelector(".btn-quitar")
    .addEventListener(
        "click",
        function(){

            fila.remove();

        }
    );

    listaMateriales.appendChild(
        fila
    );

}


btnAgregar.addEventListener(
    "click",
    agregarMaterial
);


function obtenerMateriales(){

    const filas =
    listaMateriales.querySelectorAll(
        ".material-item"
    );

    const lista = [];

    filas.forEach(
        function(fila){

            const tipo =
            fila
            .querySelector(".material-tipo")
            .value
            .trim();

            const cantidad =
            Number(
                fila
                .querySelector(".material-cantidad")
                .value
            ) || 0;

            if(tipo){

                lista.push({
                    tipo:tipo,
                    cantidad:cantidad
                });

            }

        }
    );

    return lista;

}


function formatoDinero(valor){

    return Number(
        valor || 0
    ).toLocaleString(
        "es-AR",
        {
            minimumFractionDigits:2,
            maximumFractionDigits:2
        }
    );

}


function calcularTotal(){

    const valorMateriales =
    Number(materiales.value) || 0;

    const valorManoObra =
    Number(manoObra.value) || 0;

    const valorViaticos =
    Number(viaticos.value) || 0;

    const totalGeneral =
    valorMateriales +
    valorManoObra +
    valorViaticos;

    resumenMateriales.textContent =
    formatoDinero(
        valorMateriales
    );

    resumenManoObra.textContent =
    formatoDinero(
        valorManoObra
    );

    resumenViaticos.textContent =
    formatoDinero(
        valorViaticos
    );

    total.textContent =
    formatoDinero(
        totalGeneral
    );

    return totalGeneral;

}


materiales.addEventListener(
    "input",
    calcularTotal
);

manoObra.addEventListener(
    "input",
    calcularTotal
);

viaticos.addEventListener(
    "input",
    calcularTotal
);


async function obtenerNumeroAgenda(){

    const ingresado =
    numeroAgenda.value.trim();

    if(ingresado){

        return ingresado;

    }

    let numero;

    while(true){

        numero =
        String(
            Math.floor(
                100000 +
                Math.random() * 900000
            )
        );

        const consulta =
        query(
            collection(
                db,
                "presupuestos"
            ),
            where(
                "numeroAgenda",
                "==",
                numero
            )
        );

        const resultado =
        await getDocs(
            consulta
        );

        if(resultado.empty){

            return numero;

        }

    }

}


btnGuardar.addEventListener(
    "click",
    async function(){

        if(!usuarioActual){

            mostrarMensaje(
                "La sesión todavía no está lista.",
                "error"
            );

            return;

        }

        if(!cliente.value.trim()){

            mostrarMensaje(
                "Ingresá el nombre del cliente.",
                "error"
            );

            cliente.focus();

            return;

        }

        if(!lugarTrabajo.value.trim()){

            mostrarMensaje(
                "Ingresá el lugar de trabajo.",
                "error"
            );

            lugarTrabajo.focus();

            return;

        }

        if(!descripcion.value.trim()){

            mostrarMensaje(
                "Ingresá la descripción del trabajo.",
                "error"
            );

            descripcion.focus();

            return;

        }

        const lista =
        obtenerMateriales();

        const valorMateriales =
        Number(materiales.value) || 0;

        const valorManoObra =
        Number(manoObra.value) || 0;

        const valorViaticos =
        Number(viaticos.value) || 0;

        const totalGeneral =
        valorMateriales +
        valorManoObra +
        valorViaticos;

        btnGuardar.disabled =
        true;

        btnGuardar.textContent =
        "GUARDANDO...";

        try{

            const numeroAgendaFinal =
            await obtenerNumeroAgenda();

            await addDoc(
                collection(
                    db,
                    "presupuestos"
                ),
                {

                    uid:
                    usuarioActual.uid,

                    empresaNombre:
                    datosEmpresa.nombreEmpresa || "",

                    empresaRazonSocial:
                    datosEmpresa.razonSocial || "",

                    empresaCuit:
                    datosEmpresa.cuit || "",

                    empresaTelefono:
                    datosEmpresa.telefono || "",

                    empresaEmail:
                    datosEmpresa.email ||
                    usuarioActual.email ||
                    "",

                    empresaDireccion:
                    datosEmpresa.direccion || "",

                    empresaLogo:
                    datosEmpresa.logoUrl || "",

                    cliente:
                    cliente.value.trim(),

                    numeroAgenda:
                    numeroAgendaFinal,

                    fecha:
                    fecha.value,

                    lugarTrabajo:
                    lugarTrabajo.value.trim(),

                    descripcion:
                    descripcion.value.trim(),

                    materialesLista:
                    lista,

                    materiales:
                    valorMateriales,

                    manoObra:
                    valorManoObra,

                    viaticos:
                    valorViaticos,

                    total:
                    totalGeneral,

                    creado:
                    serverTimestamp()

                }
            );

            mostrarMensaje(
                "Presupuesto guardado correctamente.",
                "exito"
            );

            btnGuardar.disabled =
            false;

            btnGuardar.textContent =
            "GUARDAR PRESUPUESTO";

            setTimeout(
                function(){

                    window.location.href =
                    "./presupuestos.html";

                },
                800
            );

        }
        catch(error){

            console.error(
                "Error guardando presupuesto:",
                error
            );

            mostrarMensaje(
                "No se pudo guardar: " +
                error.message,
                "error"
            );

            btnGuardar.disabled =
            false;

            btnGuardar.textContent =
            "GUARDAR PRESUPUESTO";

        }

    }
);


btnVolver.addEventListener(
    "click",
    function(){

        window.location.href =
        "./presupuestos.html";

    }
);


calcularTotal();

</script>

</body>

</html>
