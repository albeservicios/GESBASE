<!DOCTYPE html>
<html lang="es">

<head>

<meta charset="UTF-8">

<meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
>

<meta
    name="theme-color"
    content="#111827"
>

<meta
    name="description"
    content="GESBASE - Nuevo presupuesto"
>

<title>Nuevo presupuesto - GESBASE</title>

<style>

*{
    box-sizing:border-box;
    margin:0;
    padding:0;
}

body{
    font-family:Arial,sans-serif;
    background:#f3f4f6;
    color:#111827;
}

.contenedor{
    width:100%;
    max-width:600px;
    margin:auto;
    min-height:100vh;
    background:#fff;
}

header{
    background:#111827;
    color:#fff;
    padding:25px 20px;
}

header h1{
    font-size:25px;
}

header p{
    margin-top:6px;
    font-size:14px;
    color:#d1d5db;
}

main{
    padding:20px;
}

.estado{
    margin-bottom:18px;
    padding:12px;
    border-radius:10px;
    background:#f3f4f6;
    color:#4b5563;
    font-size:13px;
}

.empresa-info{
    margin-bottom:20px;
    padding:16px;
    background:#f9fafb;
    border:1px solid #e5e7eb;
    border-radius:12px;
}

.empresa-titulo{
    font-size:16px;
    font-weight:bold;
    margin-bottom:10px;
}

.empresa-dato{
    font-size:13px;
    color:#4b5563;
    margin-top:6px;
    line-height:1.4;
}

.empresa-logo{
    width:80px;
    height:80px;
    object-fit:contain;
    display:none;
    margin-bottom:12px;
    border-radius:8px;
}

.campo{
    margin-bottom:18px;
}

label{
    display:block;
    font-weight:bold;
    font-size:14px;
    margin-bottom:7px;
}

input,
textarea{
    width:100%;
    padding:13px;
    border:1px solid #d1d5db;
    border-radius:9px;
    font-size:16px;
    background:#fff;
}

input:focus,
textarea:focus{
    outline:none;
    border-color:#2563eb;
}

textarea{
    min-height:110px;
    resize:vertical;
}

.material-item{
    display:flex;
    gap:8px;
    align-items:center;
    margin-bottom:10px;
}

.material-tipo{
    flex:1;
}

.material-cantidad{
    width:110px;
}

.btn-quitar{
    width:45px;
    padding:13px 5px;
    margin:0;
    background:#dc2626;
    color:#fff;
    border:none;
    border-radius:9px;
    font-size:18px;
}

.btn-agregar{
    background:#2563eb;
    color:#fff;
}

.resumen{
    margin-top:20px;
    padding:18px;
    background:#f3f4f6;
    border-radius:12px;
}

.resumen-linea{
    display:flex;
    justify-content:space-between;
    align-items:center;
    gap:10px;
    padding:8px 0;
    font-size:16px;
}

.resumen-total{
    border-top:2px solid #111827;
    margin-top:10px;
    padding-top:14px;
    font-size:21px;
    font-weight:bold;
}

button{
    width:100%;
    padding:15px;
    border:none;
    border-radius:10px;
    font-size:16px;
    font-weight:bold;
    cursor:pointer;
    margin-top:10px;
}

.guardar{
    background:#111827;
    color:#fff;
}

.volver{
    background:#e5e7eb;
    color:#111827;
}

button:disabled{
    opacity:.6;
    cursor:not-allowed;
}

.mensaje{
    display:none;
    margin-top:15px;
    padding:13px;
    border-radius:10px;
    font-size:14px;
    line-height:1.5;
}

.exito{
    display:block;
    background:#dcfce7;
    color:#166534;
}

.error{
    display:block;
    background:#fee2e2;
    color:#991b1b;
}

@media(max-width:600px){

    main{
        padding:15px;
    }

    .material-item{
        align-items:stretch;
    }

    .material-cantidad{
        width:100px;
    }

}

</style>

</head>

<body>

<div class="contenedor">

<header>

<h1>Nuevo presupuesto</h1>

<p>GESBASE</p>

</header>

<main>

<div
    id="estadoSesion"

>
Verificando sesión...
</div>


<!-- ==========================================
     EMPRESA
========================================== -->

<div class="empresa-info">

<img

    class="empresa-logo"

>

<div class="empresa-titulo">
Datos de la empresa
</div>

<div class="empresa-dato">
<strong>Empresa:</strong>
<span id="empresaNombre">Cargando...</span>
</div>

<div class="empresa-dato">
<strong>Razón social:</strong>
<span id="empresaRazonSocial">Cargando...</span>
</div>

<div class="empresa-dato">
<strong>CUIT:</strong>
<span id="empresaCuit">Cargando...</span>
</div>

<div class="empresa-dato">
<strong>Teléfono:</strong>
<span id="empresaTelefono">Cargando...</span>
</div>

<div class="empresa-dato">
<strong>Email:</strong>
<span id="empresaEmail">Cargando...</span>
</div>

<!-- ==========================================

<label for="cliente">
Cliente

<!-- ==========================================

========================================== -->

<label for="numeroAgenda">
N.º de agenda

Viáticos

<!-- ==========================================
     RESUMEN
========================================== -->

<div class="resumen">

Materiales

</strong>

Mano de obra

$ <span id="resumenManoObra">0,00</span>

<span>
Viáticos

$ <span id="resumenViaticos">0,00</span>

     GUARDAR

GUARDAR PRESUPUESTO

VOLVER A MIS PRESUPUESTOS

</div>


<script type="module">

/* =====================================================
   FIREBASE
===================================================== */

import {
    auth,
    db
} from "./Js/firebase.js";


import {
    onAuthStateChanged
} from "https://www.gstatic.com/firebasejs/12.18.0/firebase-auth.js";


import {
    collection,
    addDoc,
    serverTimestamp,
    getDocs,
    query,
    where,
    doc,
    getDoc
} from "https://www.gstatic.com/firebasejs/12.18.0/firebase-firestore.js";


/* =====================================================
   ELEMENTOS
===================================================== */

const estadoSesion =
document.getElementById("estadoSesion");

const empresaNombre =
document.getElementById("empresaNombre");

const empresaRazonSocial =
document.getElementById("empresaRazonSocial");

const empresaCuit =
document.getElementById("empresaCuit");

const empresaTelefono =
document.getElementById("empresaTelefono");

const empresaEmail =
document.getElementById("empresaEmail");

const empresaLogo =
document.getElementById("empresaLogo");

const cliente =
document.getElementById("cliente");

const numeroAgenda =
document.getElementById("numeroAgenda");

const fecha =
document.getElementById("fecha");

const lugarTrabajo =
document.getElementById("lugarTrabajo");

const descripcion =
document.getElementById("descripcion");

const listaMateriales =
document.getElementById("listaMateriales");

const btnAgregar =
document.getElementById("btnAgregar");

const materiales =
document.getElementById("materiales");

const manoObra =
document.getElementById("manoObra");

const viaticos =
document.getElementById("viaticos");

const resumenMateriales =
document.getElementById("resumenMateriales");

const resumenManoObra =
document.getElementById("resumenManoObra");

const resumenViaticos =
document.getElementById("resumenViaticos");

const total =
document.getElementById("total");

const mensaje =
document.getElementById("mensaje");

const btnGuardar =
document.getElementById("btnGuardar");

const btnVolver =
document.getElementById("btnVolver");


/* =====================================================
   VARIABLES
===================================================== */

let usuarioActual = null;

let empresaIdActual = "";

let datosEmpresa = {

    nombreEmpresa:"",
    razonSocial:"",
    cuit:"",
    telefono:"",
    email:"",
    direccion:"",
    logoUrl:""

};


/* =====================================================
   UTILIDADES
===================================================== */

function texto(valor){

    if(
        valor === undefined ||
        valor === null
    ){

        return "";

    }

    return String(valor).trim();

}


function numero(valor){

    const n =
    Number(valor);

    return Number.isFinite(n)
        ? n
        : 0;

}


function mostrarMensaje(
    textoMensaje,
    tipo
){

    mensaje.textContent =
    textoMensaje;

    mensaje.className =
    "mensaje " + tipo;

}


function formatoDinero(valor){

    return numero(
        valor
    ).toLocaleString(
        "es-AR",
        {
            minimumFractionDigits:2,
            maximumFractionDigits:2
        }
    );

}


/* =====================================================
   FECHA ACTUAL
===================================================== */

function colocarFechaActual(){

    const ahora =
    new Date();

    fecha.value =
    ahora.getFullYear() +
    "-" +
    String(
        ahora.getMonth() + 1
    ).padStart(2,"0") +
    "-" +
    String(
        ahora.getDate()
    ).padStart(2,"0");

}


/* =====================================================
   OBTENER EMPRESA ID
===================================================== */

async function obtenerEmpresaId(){

    if(!usuarioActual){

        return "";

    }


    /*
     * Primero buscamos en usuarios/{uid}.
     */

    try{

        const referenciaUsuario =
        doc(
            db,
            "usuarios",
            usuarioActual.uid
        );


        const resultadoUsuario =
        await getDoc(
            referenciaUsuario
        );


        if(
            resultadoUsuario.exists()
        ){

            const datosUsuario =
            resultadoUsuario.data();


            const empresaId =
            texto(
                datosUsuario.empresaId
            ) ||
            texto(
                datosUsuario.empresa
            );


            if(empresaId){

                return empresaId;

            }

        }

    }
    catch(error){

        console.warn(
            "No se pudo consultar usuarios:",
            error
        );

    }


    /*
     * Compatibilidad:
     * algunas estructuras anteriores
     * pueden utilizar el UID como empresa.
     */

    return usuarioActual.uid;

}


/* =====================================================
   CARGAR EMPRESA
===================================================== */

async function cargarEmpresa(){

    if(!usuarioActual){

        return;

    }


    try{

        empresaIdActual =
        await obtenerEmpresaId();


        if(!empresaIdActual){

            throw new Error(
                "No se encontró la empresa asociada a la cuenta."
            );

        }


        const referenciaEmpresa =
        doc(
            db,
            "empresas",
            empresaIdActual
        );


        const resultadoEmpresa =
        await getDoc(
            referenciaEmpresa
        );


        if(
            !resultadoEmpresa.exists()
        ){

            throw new Error(
                "No existe el registro de la empresa en Firebase."
            );

        }


        datosEmpresa =
        resultadoEmpresa.data();


        /*
         * Empresa
         */

        empresaNombre.textContent =
        texto(
            datosEmpresa.nombreEmpresa
        ) ||
        texto(
            datosEmpresa.nombre
        ) ||
        "Sin informar";


        /*
         * Razón social
         */

        empresaRazonSocial.textContent =
        texto(
            datosEmpresa.razonSocial
        ) ||
        "Sin informar";


        /*
         * CUIT
         */

        empresaCuit.textContent =
        texto(
            datosEmpresa.cuit
        ) ||
        texto(
            datosEmpresa.CUIT
        ) ||
        "Sin informar";


        /*
         * Teléfono
         */

        empresaTelefono.textContent =
        texto(
            datosEmpresa.telefono
        ) ||
        texto(
            datosEmpresa.phone
        ) ||
        "Sin informar";


        /*
         * Email
         */

        empresaEmail.textContent =
        texto(
            datosEmpresa.email
        ) ||
        texto(
            usuarioActual.email
        ) ||
        "Sin informar";


        /*
         * Logo
         */

        const logo =
        texto(
            datosEmpresa.logoUrl
        ) ||
        texto(
            datosEmpresa.logo
        );


        if(logo){

            empresaLogo.src =
            logo;

            empresaLogo.style.display =
            "block";

        }
        else{

            empresaLogo.style.display =
            "none";

        }

    }
    catch(error){

        console.error(
            "Error cargando empresa:",
            error
        );


        empresaNombre.textContent =
        "Sin informar";

        empresaRazonSocial.textContent =
        "Sin informar";

        empresaCuit.textContent =
        "Sin informar";

        empresaTelefono.textContent =
        "Sin informar";

        empresaEmail.textContent =
        usuarioActual.email ||
        "Sin informar";


        /*
         * No bloqueamos la creación
         * del presupuesto por un dato
         * visual de la empresa.
         */

        estadoSesion.textContent =
        "Sesión activa. No se pudieron cargar todos los datos de la empresa.";

    }

}


/* =====================================================
   AUTENTICACIÓN
===================================================== */

onAuthStateChanged(
    auth,
    async function(usuario){

        if(!usuario){

            window.location.replace(
                "./login.html"
            );

            return;

        }


        usuarioActual =
        usuario;


        estadoSesion.textContent =
        "Sesión activa: " +
        (
            usuario.email ||
            "usuario autenticado"
        );


        btnGuardar.disabled =
        false;


        try{

            await cargarEmpresa();

        }
        catch(error){

            console.error(error);

        }

    }
);


/* =====================================================
   AGREGAR MATERIAL
===================================================== */

function agregarMaterial(){

    const fila =
    document.createElement("div");

    fila.className =
    "material-item";


    const tipo =
    document.createElement("input");

    tipo.type =
    "text";

    tipo.className =
    "material-tipo";

    tipo.placeholder =
    "Tipo de material";


    const cantidad =
    document.createElement("input");

    cantidad.type =
    "number";

    cantidad.className =
    "material-cantidad";

    cantidad.placeholder =
    "Cantidad";

    cantidad.min =
    "0";

    cantidad.step =
    "0.01";


    const quitar =
    document.createElement("button");

    quitar.type =
    "button";

    quitar.className =
    "btn-quitar";

    quitar.textContent =
    "×";

    quitar.title =
    "Quitar material";


    quitar.addEventListener(
        "click",
        function(){

            fila.remove();

        }
    );


    fila.appendChild(
        tipo
    );

    fila.appendChild(
        cantidad
    );

    fila.appendChild(
        quitar
    );


    listaMateriales.appendChild(
        fila
    );


    tipo.focus();

}


/* =====================================================
   BOTÓN AGREGAR MATERIAL
===================================================== */

btnAgregar.addEventListener(
    "click",
    agregarMaterial
);


/* =====================================================
   OBTENER MATERIALES
===================================================== */

function obtenerMateriales(){

    const filas =
    listaMateriales.querySelectorAll(
        ".material-item"
    );


    const lista = [];


    filas.forEach(
        function(fila){

            const campoTipo =
            fila.querySelector(
                ".material-tipo"
            );


            const campoCantidad =
            fila.querySelector(
                ".material-cantidad"
            );


            const tipo =
            texto(
                campoTipo.value
            );


            const cantidad =
            numero(
                campoCantidad.value
            );


            if(tipo){

                lista.push({

                    tipo:tipo,

                    cantidad:cantidad

                });

            }

        }
    );


    return lista;

}


/* =====================================================
   CALCULAR TOTAL
===================================================== */

function calcularTotal(){

    const valorMateriales =
    numero(
        materiales.value
    );


    const valorManoObra =
    numero(
        manoObra.value
    );


    const valorViaticos =
    numero(
        viaticos.value
    );


    const totalGeneral =
    valorMateriales +
    valorManoObra +
    valorViaticos;


    resumenMateriales.textContent =
    formatoDinero(
        valorMateriales
    );


    resumenManoObra.textContent =
    formatoDinero(
        valorManoObra
    );


    resumenViaticos.textContent =
    formatoDinero(
        valorViaticos
    );


    total.textContent =
    formatoDinero(
        totalGeneral
    );


    return totalGeneral;

}


materiales.addEventListener(
    "input",
    calcularTotal
);


manoObra.addEventListener(
    "input",
    calcularTotal
);


viaticos.addEventListener(
    "input",
    calcularTotal
);


/* =====================================================
   GENERAR NÚMERO DE AGENDA
===================================================== */

async function obtenerNumeroAgenda(){

    /*
     * Si el usuario escribió uno,
     * respetamos el número.
     */

    const ingresado =
    texto(
        numeroAgenda.value
    );


    if(ingresado){

        return ingresado;

    }


    if(!usuarioActual){

        throw new Error(
            "No hay una sesión activa."
        );

    }


    /*
     * Generamos números de 6 dígitos.
     */

    for(
        let intento = 0;
        intento < 20;
        intento++
    ){

        const numeroGenerado =
        String(
            Math.floor(
                100000 +
                Math.random() * 900000
            )
        );


        const referencia =
        collection(
            db,
            "presupuestos"
        );


        /*
         * Buscamos si ya existe
         * para este usuario.
         */

        const consulta =
        query(
            referencia,

            where(
                "uid",
                "==",
                usuarioActual.uid
            ),

            where(
                "numeroAgenda",
                "==",
                numeroGenerado
            )
        );


        const resultado =
        await getDocs(
            consulta
        );


        if(
            resultado.empty
        ){

            return numeroGenerado;

        }

    }


    throw new Error(
        "No se pudo generar un número de agenda disponible."
    );

}


/* =====================================================
   GUARDAR PRESUPUESTO
===================================================== */

btnGuardar.addEventListener(
    "click",
    async function(){

        if(!usuarioActual){

            mostrarMensaje(
                "La sesión todavía no está lista.",
                "error"
            );

            return;

        }


        /*
         * Cliente
         */

        if(
            !texto(
                cliente.value
            )
        ){

            mostrarMensaje(
                "Ingresá el nombre del cliente.",
                "error"
            );

            cliente.focus();

            return;

        }


        /*
         * Lugar
         */

        if(
            !texto(
                lugarTrabajo.value
            )
        ){

            mostrarMensaje(
                "Ingresá el lugar de trabajo.",
                "error"
            );

            lugarTrabajo.focus();

            return;

        }


        /*
         * Descripción
         */

        if(
            !texto(
                descripcion.value
            )
        ){

            mostrarMensaje(
                "Ingresá la descripción del trabajo.",
                "error"
            );

            descripcion.focus();

            return;

        }


        /*
         * Fecha
         */

        if(
            !fecha.value
        ){

            mostrarMensaje(
                "Seleccioná la fecha del presupuesto.",
                "error"
            );

            fecha.focus();

            return;

        }


        const listaMateriales =
        obtenerMateriales();


        const valorMateriales =
        numero(
            materiales.value
        );


        const valorManoObra =
        numero(
            manoObra.value
        );


        const valorViaticos =
        numero(
            viaticos.value
        );


        const totalGeneral =
        valorMateriales +
        valorManoObra +
        valorViaticos;


        btnGuardar.disabled =
        true;

        btnGuardar.textContent =
        "GUARDANDO...";


        try{

            /*
             * Obtenemos la empresa.
             */

            if(!empresaIdActual){

                empresaIdActual =
                await obtenerEmpresaId();

            }


            if(!empresaIdActual){

                throw new Error(
                    "No se encontró la empresa asociada al usuario."
                );

            }


            /*
             * Número de agenda.
             */

            const numeroAgendaFinal =
            await obtenerNumeroAgenda();


            /*
             * Datos que se guardarán.
             */

            const presupuesto = {

                uid:
                usuarioActual.uid,


                empresaId:
                empresaIdActual,


                empresaNombre:
                texto(
                    datosEmpresa.nombreEmpresa
                ) ||
                texto(
                    datosEmpresa.nombre
                ) ||
                "",


                empresaRazonSocial:
                texto(
                    datosEmpresa.razonSocial
                ),


                empresaCuit:
                texto(
                    datosEmpresa.cuit
                ) ||
                texto(
                    datosEmpresa.CUIT
                ),


                empresaTelefono:
                texto(
                    datosEmpresa.telefono
                ) ||
                texto(
                    datosEmpresa.phone
                ),


                empresaEmail:
                texto(
                    datosEmpresa.email
                ) ||
                texto(
                    usuarioActual.email
                ),


                empresaDireccion:
                texto(
                    datosEmpresa.direccion
                ),


                empresaLogo:
                texto(
                    datosEmpresa.logoUrl
                ) ||
                texto(
                    datosEmpresa.logo
                ),


                cliente:
                texto(
                    cliente.value
                ),


                numeroAgenda:
                numeroAgendaFinal,


                fecha:
                fecha.value,


                lugarTrabajo:
                texto(
                    lugarTrabajo.value
                ),


                descripcion:
                texto(
                    descripcion.value
                ),


                materialesLista:
                listaMateriales,


                materiales:
                valorMateriales,


                manoObra:
                valorManoObra,


                viaticos:
                valorViaticos,


                total:
                totalGeneral,


                estado:
                "Pendiente",


                creado:
                serverTimestamp()

            };


            /*
             * Guardar en Firestore.
             */

            const referencia =
            collection(
                db,
                "presupuestos"
            );


            await addDoc(
                referencia,
                presupuesto
            );


            /*
             * Éxito.
             */

            mostrarMensaje(
                "Presupuesto guardado correctamente. N.º de agenda: " +
                numeroAgendaFinal,
                "exito"
            );


            btnGuardar.textContent =
            "PRESUPUESTO GUARDADO";


            /*
             * Ir al listado.
             */

            setTimeout(
                function(){

                    window.location.href =
                    "./presupuestos.html";

                },
                1000
            );

        }
        catch(error){

            console.error(
                "ERROR GUARDANDO PRESUPUESTO:",
                error
            );


            let textoError =
            "Error desconocido";


            if(error){

                if(
                    error.code ===
                    "permission-denied"
                ){

                    textoError =
                    "Firebase rechazó el acceso. Revisá las reglas de Firestore.";

                }
                else if(
                    error.code ===
                    "failed-precondition"
                ){

                    textoError =
                    "Firebase requiere una configuración o índice adicional.";

                }
                else if(
                    error.code ===
                    "unauthenticated"
                ){

                    textoError =
                    "La sesión expiró. Volvé a iniciar sesión.";

                }
                else if(
                    error.message
                ){

                    textoError =
                    error.message;

                }
            }


            mostrarMensaje(
                "No se pudo guardar el presupuesto: " +
                textoError,
                "error"
            );


            btnGuardar.disabled =
            false;

            btnGuardar.textContent =
            "GUARDAR PRESUPUESTO";

        }

    }
);


/* =====================================================
   VOLVER
===================================================== */

btnVolver.addEventListener(
    "click",
    function(){

        window.location.href =
        "./presupuestos.html";

    }
);


/* =====================================================
   INICIO
===================================================== */

colocarFechaActual();

calcularTotal();

btnGuardar.disabled =
false;

</script>

</body>

</html>
