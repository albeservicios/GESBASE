<!DOCTYPE html>
<html lang="es">

<head>

<meta charset="UTF-8">

<meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
>

<meta
    name="theme-color"
    content="#111827"
>

<title>Nuevo presupuesto - GESBASE</title>

<style>

* {
    box-sizing: border-box;
    margin: 0;
    padding: 0;
}

body {
    font-family: Arial, sans-serif;
    background: #f3f4f6;
    color: #111827;
}

.contenedor {
    max-width: 600px;
    margin: auto;
    min-height: 100vh;
    background: white;
}

header {
    background: #111827;
    color: white;
    padding: 25px 20px;
}

header h1 {
    font-size: 25px;
}

header p {
    margin-top: 6px;
    font-size: 14px;
    color: #d1d5db;
}

main {
    padding: 20px;
}

.campo {
    margin-bottom: 18px;
}

label {
    display: block;
    font-weight: bold;
    font-size: 14px;
    margin-bottom: 7px;
}

input,
textarea {
    width: 100%;
    padding: 13px;
    border: 1px solid #d1d5db;
    border-radius: 9px;
    font-size: 16px;
    background: white;
}

textarea {
    min-height: 110px;
    resize: vertical;
}

.total {
    margin-top: 20px;
    padding: 18px;
    background: #f3f4f6;
    border-radius: 12px;
    font-size: 20px;
    font-weight: bold;
}

.botones {
    margin-top: 20px;
}

button {
    width: 100%;
    padding: 15px;
    border: none;
    border-radius: 10px;
    font-size: 16px;
    font-weight: bold;
    cursor: pointer;
    margin-bottom: 10px;
}

.guardar {
    background: #111827;
    color: white;
}

.guardar:disabled {
    opacity: .6;
    cursor: not-allowed;
}

.volver {
    background: #e5e7eb;
    color: #111827;
}

.mensaje {
    display: none;
    margin-top: 15px;
    padding: 13px;
    border-radius: 10px;
    font-size: 14px;
}

.mensaje.exito {
    display: block;
    background: #dcfce7;
    color: #166534;
}

.mensaje.error {
    display: block;
    background: #fee2e2;
    color: #991b1b;
}

</style>

</head>

<body>

<div class="contenedor">

<header>

<h1>
Nuevo presupuesto
</h1>

<p>
GESBASE
</p>

</header>


<main>

<div class="campo">

<label for="cliente">
Cliente
</label>

<input
    type="text"
    id="cliente"
    placeholder="Nombre del cliente"
>

</div>


<div class="campo">

<label for="fecha">
Fecha
</label>

<input
    type="date"
    id="fecha"
>

</div>


<div class="campo">

<label for="descripcion">
Descripción del trabajo
</label>

<textarea
    id="descripcion"
    placeholder="Describí el trabajo a realizar"
></textarea>

</div>


<div class="campo">

<label for="materiales">
Materiales
</label>

<input
    type="number"
    id="materiales"
    min="0"
    step="0.01"
    placeholder="0"
>

</div>


<div class="campo">

<label for="manoObra">
Mano de obra
</label>

<input
    type="number"
    id="manoObra"
    min="0"
    step="0.01"
    placeholder="0"
>

</div>


<div class="campo">

<label for="viaticos">
Viáticos
</label>

<input
    type="number"
    id="viaticos"
    min="0"
    step="0.01"
    placeholder="0"
>

</div>


<div class="total">

Total:

$ <span id="total">0,00</span>

</div>


<div
    id="mensaje"
    class="mensaje"
></div>


<div class="botones">

<button
    type="button"
    class="guardar"
    id="btnGuardar"
>
Guardar presupuesto
</button>


<button
    type="button"
    class="volver"
    id="btnVolver"
>
Volver a GESBASE
</button>

</div>

</main>

</div>


<script type="module">

// ==========================================
// FIREBASE
// ==========================================

import {
    auth,
    db
} from "./Js/firebase.js";


import {
    onAuthStateChanged
} from
"https://www.gstatic.com/firebasejs/12.1.0/firebase-auth.js";


import {
    collection,
    addDoc,
    serverTimestamp
} from
"https://www.gstatic.com/firebasejs/12.1.0/firebase-firestore.js";


// ==========================================
// ELEMENTOS
// ==========================================

const cliente =
document.getElementById("cliente");

const fecha =
document.getElementById("fecha");

const descripcion =
document.getElementById("descripcion");

const materiales =
document.getElementById("materiales");

const manoObra =
document.getElementById("manoObra");

const viaticos =
document.getElementById("viaticos");

const total =
document.getElementById("total");

const mensaje =
document.getElementById("mensaje");

const btnGuardar =
document.getElementById("btnGuardar");


// ==========================================
// FECHA ACTUAL
// ==========================================

const hoy =
new Date();

const año =
hoy.getFullYear();

const mes =
String(
    hoy.getMonth() + 1
).padStart(2, "0");

const dia =
String(
    hoy.getDate()
).padStart(2, "0");

fecha.value =
`${año}-${mes}-${dia}`;


// ==========================================
// USUARIO ACTUAL
// ==========================================

let usuarioActual = null;


onAuthStateChanged(
auth,
function(usuario) {

    if (!usuario) {

        window.location.replace(
            "login.html"
        );

        return;
    }

    usuarioActual = usuario;

});


// ==========================================
// CALCULAR TOTAL
// ==========================================

function calcularTotal() {

    const valorMateriales =
        Number(
            materiales.value
        ) || 0;

    const valorManoObra =
        Number(
            manoObra.value
        ) || 0;

    const valorViaticos =
        Number(
            viaticos.value
        ) || 0;

    const resultado =
        valorMateriales +
        valorManoObra +
        valorViaticos;


    total.textContent =
        resultado.toLocaleString(
            "es-AR",
            {
                minimumFractionDigits: 2,
                maximumFractionDigits: 2
            }
        );


    return resultado;

}


materiales.addEventListener(
    "input",
    calcularTotal
);

manoObra.addEventListener(
    "input",
    calcularTotal
);

viaticos.addEventListener(
    "input",
    calcularTotal
);


// ==========================================
// MENSAJE
// ==========================================

function mostrarMensaje(
    texto,
    tipo
) {

    mensaje.textContent =
        texto;

    mensaje.className =
        "mensaje " + tipo;

}


// ==========================================
// GUARDAR PRESUPUESTO
// ==========================================

btnGuardar.addEventListener(
"click",
async function() {

    if (!usuarioActual) {

        mostrarMensaje(
            "No hay una sesión activa. Iniciá sesión nuevamente.",
            "error"
        );

        return;

    }


    if (
        !cliente.value.trim()
    ) {

        mostrarMensaje(
            "Ingresá el nombre del cliente.",
            "error"
        );

        cliente.focus();

        return;

    }


    if (
        !descripcion.value.trim()
    ) {

        mostrarMensaje(
            "Ingresá una descripción del trabajo.",
            "error"
        );

        descripcion.focus();

        return;

    }


    const valorMateriales =
        Number(
            materiales.value
        ) || 0;

    const valorManoObra =
        Number(
            manoObra.value
        ) || 0;

    const valorViaticos =
        Number(
            viaticos.value
        ) || 0;


    const valorTotal =
        valorMateriales +
        valorManoObra +
        valorViaticos;


    btnGuardar.disabled =
        true;

    btnGuardar.textContent =
        "Guardando...";


    try {

        // ==================================
        // CREAR PRESUPUESTO
        // ==================================

        const referencia =
            await addDoc(
                collection(
                    db,
                    "presupuestos"
                ),
                {

                    uid:
                        usuarioActual.uid,

                    cliente:
                        cliente.value.trim(),

                    fecha:
                        fecha.value,

                    descripcion:
                        descripcion.value.trim(),

                    materiales:
                        valorMateriales,

                    manoObra:
                        valorManoObra,

                    viaticos:
                        valorViaticos,

                    total:
                        valorTotal,

                    creado:
                        serverTimestamp()

                }
            );


        console.log(
            "Presupuesto creado:",
            referencia.id
        );


        mostrarMensaje(
            "Presupuesto guardado correctamente.",
            "exito"
        );


        btnGuardar.textContent =
            "Presupuesto guardado";


        // ==================================
        // LIMPIAR FORMULARIO
        // ==================================

        cliente.value = "";

        descripcion.value = "";

        materiales.value = "";

        manoObra.value = "";

        viaticos.value = "";

        calcularTotal();


        setTimeout(
            function() {

                btnGuardar.disabled =
                    false;

                btnGuardar.textContent =
                    "Guardar presupuesto";

            },
            2000
        );


    } catch (error) {

        console.error(
            "Error guardando presupuesto:",
            error
        );


        mostrarMensaje(
            "No se pudo guardar el presupuesto: " +
            error.message,
            "error"
        );


        btnGuardar.disabled =
            false;

        btnGuardar.textContent =
            "Guardar presupuesto";

    }

});


// ==========================================
// VOLVER
// ==========================================

document
.getElementById("btnVolver")
.addEventListener(
"click",
function() {

    window.location.href =
        "index.html";

});

</script>

</body>

</html>
