<!DOCTYPE html>
<html lang="es">

<head>

<meta charset="UTF-8">

<meta name="viewport" content="width=device-width, initial-scale=1.0">

<meta name="theme-color" content="#111827">

<title>Nuevo presupuesto - GESBASE</title>

<style>

*{
    box-sizing:border-box;
    margin:0;
    padding:0;
}

body{
    font-family:Arial,sans-serif;
    background:#f3f4f6;
    color:#111827;
}

.contenedor{
    max-width:650px;
    margin:auto;
    min-height:100vh;
    background:white;
}

header{
    background:#111827;
    color:white;
    padding:25px 20px;
}

header h1{
    font-size:25px;
}

header p{
    margin-top:6px;
    font-size:14px;
    color:#d1d5db;
}

main{
    padding:20px;
}

.campo{
    margin-bottom:18px;
}

label{
    display:block;
    font-weight:bold;
    font-size:14px;
    margin-bottom:7px;
}

input,
textarea,
select{
    width:100%;
    padding:13px;
    border:1px solid #d1d5db;
    border-radius:9px;
    font-size:16px;
    background:white;
}

textarea{
    min-height:110px;
    resize:vertical;
}

select{
    cursor:pointer;
}


/* EMPRESA */

.empresa-info{
    margin-bottom:20px;
    padding:16px;
    background:#f9fafb;
    border:1px solid #e5e7eb;
    border-radius:12px;
}

.empresa-titulo{
    font-size:16px;
    font-weight:bold;
    margin-bottom:10px;
}

.empresa-dato{
    font-size:13px;
    color:#4b5563;
    margin-top:5px;
}

.empresa-logo{
    width:90px;
    height:90px;
    object-fit:contain;
    display:none;
    margin-bottom:10px;
    border-radius:8px;
}


/* CLIENTE */

.cliente-info{
    display:none;
    margin-top:12px;
    padding:15px;
    background:#f9fafb;
    border:1px solid #e5e7eb;
    border-radius:12px;
}

.cliente-titulo{
    font-weight:bold;
    margin-bottom:8px;
}

.cliente-dato{
    font-size:14px;
    color:#4b5563;
    margin-top:5px;
}


/* MATERIALES */

.material-item{
    display:flex;
    gap:8px;
    align-items:center;
    margin-bottom:10px;
}

.material-tipo{
    flex:1;
}

.material-cantidad{
    width:110px;
}

.btn-quitar{
    width:45px;
    padding:13px 5px;
    margin:0;
    background:#dc2626;
    color:white;
    border:none;
    border-radius:9px;
    font-size:18px;
}

.btn-agregar{
    background:#2563eb;
    color:white;
}


/* RESUMEN */

.resumen{
    margin-top:20px;
    padding:18px;
    background:#f3f4f6;
    border-radius:12px;
}

.resumen-linea{
    display:flex;
    justify-content:space-between;
    gap:10px;
    padding:8px 0;
    font-size:16px;
}

.resumen-total{
    border-top:2px solid #111827;
    margin-top:10px;
    padding-top:14px;
    font-size:21px;
    font-weight:bold;
}


/* BOTONES */

button{
    width:100%;
    padding:15px;
    border:none;
    border-radius:10px;
    font-size:16px;
    font-weight:bold;
    cursor:pointer;
    margin-top:10px;
}

.guardar{
    background:#111827;
    color:white;
}

.volver{
    background:#e5e7eb;
    color:#111827;
}

button:disabled{
    opacity:.6;
}


/* MENSAJE */

.mensaje{
    display:none;
    margin-top:15px;
    padding:13px;
    border-radius:10px;
    font-size:14px;
}

.exito{
    display:block;
    background:#dcfce7;
    color:#166534;
}

.error{
    display:block;
    background:#fee2e2;
    color:#991b1b;
}


/* CARGANDO CLIENTES */

.cargando-clientes{
    margin-top:7px;
    font-size:13px;
    color:#6b7280;
}


/* MÓVIL */

@media(max-width:480px){

    main{
        padding:15px;
    }

    .material-item{
        flex-wrap:wrap;
    }

    .material-tipo{
        width:100%;
        flex:none;
    }

    .material-cantidad{
        flex:1;
    }

}

</style>

</head>

<script type="module">


// ==========================================
// FIREBASE
// ==========================================

import {
    auth,
    db
} from "./Js/firebase.js";


import {
    onAuthStateChanged
} from
"https://www.gstatic.com/firebasejs/12.1.0/firebase-auth.js";


import {
    collection,
    addDoc,
    serverTimestamp,
    getDocs,
    query,
    where,
    doc,
    getDoc
} from
"https://www.gstatic.com/firebasejs/12.1.0/firebase-firestore.js";


// ==========================================
// ELEMENTOS
// ==========================================

const empresaNombre =
document.getElementById("empresaNombre");

const empresaRazonSocial =
document.getElementById("empresaRazonSocial");

const empresaCuit =
document.getElementById("empresaCuit");

const empresaTelefono =
document.getElementById("empresaTelefono");

const empresaEmail =
document.getElementById("empresaEmail");

const empresaLogo =
document.getElementById("empresaLogo");


const clienteSeleccionado =
document.getElementById("clienteSeleccionado");

const clienteInfo =
document.getElementById("clienteInfo");

const clienteManual =
document.getElementById("clienteManual");

const cliente =
document.getElementById("cliente");


const clienteNombre =
document.getElementById("clienteNombre");

const clienteCuit =
document.getElementById("clienteCuit");

const clienteTelefono =
document.getElementById("clienteTelefono");

const clienteEmail =
document.getElementById("clienteEmail");

const clienteDireccion =
document.getElementById("clienteDireccion");

const clienteLocalidad =
document.getElementById("clienteLocalidad");


const cargandoClientes =
document.getElementById("cargandoClientes");


const numeroAgenda =
document.getElementById("numeroAgenda");

const fecha =
document.getElementById("fecha");

const lugarTrabajo =
document.getElementById("lugarTrabajo");

const descripcion =
document.getElementById("descripcion");

const listaMateriales =
document.getElementById("listaMateriales");

const btnAgregar =
document.getElementById("btnAgregar");

const materiales =
document.getElementById("materiales");

const manoObra =
document.getElementById("manoObra");

const viaticos =
document.getElementById("viaticos");

const resumenMateriales =
document.getElementById("resumenMateriales");

const resumenManoObra =
document.getElementById("resumenManoObra");

const resumenViaticos =
document.getElementById("resumenViaticos");

const total =
document.getElementById("total");

const mensaje =
document.getElementById("mensaje");

const btnGuardar =
document.getElementById("btnGuardar");

const btnVolver =
document.getElementById("btnVolver");


// ==========================================
// VARIABLES
// ==========================================

let usuarioActual = null;

let clientes = [];

let clienteActual = null;

let datosEmpresa = {

    nombreEmpresa:"",
    razonSocial:"",
    cuit:"",
    telefono:"",
    email:"",
    direccion:"",
    logoUrl:""

};


// ==========================================
// FECHA ACTUAL
// ==========================================

const hoy =
new Date();

fecha.value =
hoy.getFullYear() +
"-" +
String(
    hoy.getMonth()+1
).padStart(2,"0") +
"-" +
String(
    hoy.getDate()
).padStart(2,"0");


// ==========================================
// MENSAJE
// ==========================================

function mostrarMensaje(
    texto,
    tipo
){

    mensaje.textContent =
    texto;

    mensaje.className =
    "mensaje " + tipo;

}


// ==========================================
// CARGAR EMPRESA
// ==========================================

async function cargarEmpresa(usuario){

    try{

        /*
         * Primero buscamos por propietarioUid.
         */

        const consulta =
        query(
            collection(
                db,
                "empresas"
            ),
            where(
                "propietarioUid",
                "==",
                usuario.uid
            )
        );


        const resultado =
        await getDocs(
            consulta
        );


        if(
            !resultado.empty
        ){

            const documento =
            resultado.docs[0];


            datosEmpresa =
            documento.data();

        }else{

            /*
             * Compatibilidad con la estructura anterior.
             */

            const referencia =
            doc(
                db,
                "empresas",
                usuario.uid
            );


            const documento =
            await getDoc(
                referencia
            );


            if(
                documento.exists()
            ){

                datosEmpresa =
                documento.data();

            }

        }


        empresaNombre.textContent =
        datosEmpresa.nombreEmpresa ||
        datosEmpresa.empresa ||
        "Sin informar";


        empresaRazonSocial.textContent =
        datosEmpresa.razonSocial ||
        "Sin informar";


        empresaCuit.textContent =
        datosEmpresa.cuit ||
        "Sin informar";


        empresaTelefono.textContent =
        datosEmpresa.telefono ||
        "Sin informar";


        empresaEmail.textContent =
        datosEmpresa.email ||
        usuario.email ||
        "Sin informar";


        if(
            datosEmpresa.logoUrl
        ){

            empresaLogo.src =
            datosEmpresa.logoUrl;

            empresaLogo.onload =
            function(){

                empresaLogo.style.display =
                "block";

            };

        }

    }
    catch(error){

        console.error(
            "Error cargando empresa:",
            error
        );

        empresaNombre.textContent =
        "No disponible";

        empresaRazonSocial.textContent =
        "No disponible";

        empresaCuit.textContent =
        "No disponible";

        empresaTelefono.textContent =
        "No disponible";

        empresaEmail.textContent =
        usuario.email ||
        "No disponible";

    }

}


// ==========================================
// CARGAR CLIENTES
// ==========================================

async function cargarClientes(){

    try{

        cargandoClientes.textContent =
        "Cargando clientes...";


        const referencia =
        collection(
            db,
            "clientes"
        );


        const consulta =
        query(
            referencia,
            where(
                "uid",
                "==",
                usuarioActual.uid
            )
        );


        const resultado =
        await getDocs(
            consulta
        );


        clientes = [];


        resultado.forEach(
            function(documento){

                clientes.push({

                    id:
                    documento.id,

                    datos:
                    documento.data()

                });

            }
        );


        clientes.sort(
            function(a,b){

                const nombreA =
                String(
                    a.datos.nombre ||
                    a.datos.empresa ||
                    ""
                ).toLowerCase();


                const nombreB =
                String(
                    b.datos.nombre ||
                    b.datos.empresa ||
                    ""
                ).toLowerCase();


                return nombreA.localeCompare(
                    nombreB,
                    "es"
                );

            }
        );


        clienteSeleccionado.innerHTML = "";


        const opcionInicial =
        document.createElement(
            "option"
        );

        opcionInicial.value = "";

        opcionInicial.textContent =
        "Seleccionar cliente...";

        clienteSeleccionado.appendChild(
            opcionInicial
        );


        clientes.forEach(
            function(item){

                const datos =
                item.datos;


                const opcion =
                document.createElement(
                    "option"
                );


                opcion.value =
                item.id;


                opcion.textContent =
                datos.nombre ||
                datos.empresa ||
                "Cliente sin nombre";


                clienteSeleccionado.appendChild(
                    opcion
                );

            }
        );


        const opcionManual =
        document.createElement(
            "option"
        );

        opcionManual.value =
        "__manual__";

        opcionManual.textContent =
        "✏️ Ingresar cliente manualmente";

        clienteSeleccionado.appendChild(
            opcionManual
        );


        cargandoClientes.textContent =
        clientes.length +
        " cliente(s) disponible(s).";

    }
    catch(error){

        console.error(
            "Error cargando clientes:",
            error
        );


        clienteSeleccionado.innerHTML = `

            <option value="">
                No se pudieron cargar los clientes
            </option>

            <option value="__manual__">
                ✏️ Ingresar cliente manualmente
            </option>

        `;


        cargandoClientes.textContent =
        "Podés ingresar el cliente manualmente.";

    }

}


// ==========================================
// SELECCIONAR CLIENTE
// ==========================================

clienteSeleccionado.addEventListener(
    "change",
    function(){

        const id =
        clienteSeleccionado.value;


        clienteActual =
        null;


        clienteInfo.style.display =
        "none";


        clienteManual.style.display =
        "none";


        if(
            id === "__manual__"
        ){

            clienteManual.style.display =
            "block";

            cliente.focus();

            return;

        }


        if(
            id === ""
        ){

            return;

        }


        const encontrado =
        clientes.find(
            function(item){

                return item.id === id;

            }
        );


        if(!encontrado){

            return;

        }


        clienteActual =
        encontrado;


        const datos =
        encontrado.datos;


        clienteNombre.textContent =
        datos.nombre ||
        datos.empresa ||
        "-";


        clienteCuit.textContent =
        datos.cuit ||
        "-";


        clienteTelefono.textContent =
        datos.telefono ||
        "-";


        clienteEmail.textContent =
        datos.email ||
        "-";


        clienteDireccion.textContent =
        datos.direccion ||
        "-";


        const localidad =
        datos.localidad ||
        "";


        const provincia =
        datos.provincia ||
        "";


        clienteLocalidad.textContent =
        localidad +
        (
            localidad &&
            provincia
            ? ", "
            : ""
        ) +
        provincia;


        clienteInfo.style.display =
        "block";


        /*
         * Si el cliente tiene localidad,
         * la usamos como lugar de trabajo
         * automáticamente.
         */

        if(
            !lugarTrabajo.value.trim() &&
            (
                localidad ||
                provincia
            )
        ){

            lugarTrabajo.value =
            localidad +
            (
                localidad &&
                provincia
                ? ", "
                : ""
            ) +
            provincia;

        }

    }
);


// ==========================================
// AGREGAR MATERIAL
// ==========================================

function agregarMaterial(){

    const fila =
    document.createElement(
        "div"
    );


    fila.className =
    "material-item";


    fila.innerHTML = `

        <input
            type="text"
            class="material-tipo"
            placeholder="Tipo de material"
        >

        <input
            type="number"
            class="material-cantidad"
            placeholder="Cantidad"
            min="0"
            step="1"
        >

        <button
            type="button"
            class="btn-quitar"
        >
            ×
        </button>

    `;


    fila
    .querySelector(
        ".btn-quitar"
    )
    .addEventListener(
        "click",
        function(){

            fila.remove();

        }
    );


    listaMateriales.appendChild(
        fila
    );

}


btnAgregar.addEventListener(
    "click",
    agregarMaterial
);


// ==========================================
// OBTENER MATERIALES
// ==========================================

function obtenerMateriales(){

    const filas =
    listaMateriales.querySelectorAll(
        ".material-item"
    );


    const lista = [];


    filas.forEach(
        function(fila){

            const tipo =
            fila
            .querySelector(
                ".material-tipo"
            )
            .value
            .trim();


            const cantidad =
            Number(
                fila
                .querySelector(
                    ".material-cantidad"
                )
                .value
            ) || 0;


            if(
                tipo !== ""
            ){

                lista.push({

                    tipo:
                    tipo,

                    cantidad:
                    cantidad

                });

            }

        }
    );


    return lista;

}


// ==========================================
// FORMATO DINERO
// ==========================================

function formatoDinero(valor){

    return Number(
        valor || 0
    ).toLocaleString(
        "es-AR",
        {
            minimumFractionDigits:2,
            maximumFractionDigits:2
        }
    );

}


// ==========================================
// CALCULAR TOTAL
// ==========================================

function calcularTotal(){

    const valorMateriales =
    Number(
        materiales.value
    ) || 0;


    const valorManoObra =
    Number(
        manoObra.value
    ) || 0;


    const valorViaticos =
    Number(
        viaticos.value
    ) || 0;


    const totalGeneral =
    valorMateriales +
    valorManoObra +
    valorViaticos;


    resumenMateriales.textContent =
    formatoDinero(
        valorMateriales
    );


    resumenManoObra.textContent =
    formatoDinero(
        valorManoObra
    );


    resumenViaticos.textContent =
    formatoDinero(
        valorViaticos
    );


    total.textContent =
    formatoDinero(
        totalGeneral
    );


    return totalGeneral;

}


materiales.addEventListener(
    "input",
    calcularTotal
);


manoObra.addEventListener(
    "input",
    calcularTotal
);


viaticos.addEventListener(
    "input",
    calcularTotal
);


// ==========================================
// NÚMERO DE AGENDA
// ==========================================

async function obtenerNumeroAgenda(){

    const ingresado =
    numeroAgenda.value.trim();


    if(
        ingresado !== ""
    ){

        return ingresado;

    }


    let valido = false;

    let generado = "";


    while(!valido){

        generado =
        String(
            Math.floor(
                100000 +
                Math.random() * 900000
            )
        );


        const consulta =
        query(
            collection(
                db,
                "presupuestos"
            ),
            where(
                "numeroAgenda",
                "==",
                generado
            )
        );


        const resultado =
        await getDocs(
            consulta
        );


        if(
            resultado.empty
        ){

            valido = true;

        }

    }


    return generado;

}

btnGuardar.addEventListener(
    "click",
    async function(){

        if(!usuarioActual){

            mostrarMensaje(
                "Esperá unos segundos mientras se verifica la sesión.",
                "error"
            );

            return;

        }


        /*
         * Determinar cliente
         */

        let datosCliente = {};


        if(
            clienteSeleccionado.value === "__manual__"
        ){

            const nombreManual =
            cliente.value.trim();


            if(
                nombreManual === ""
            ){

                mostrarMensaje(
                    "Ingresá el nombre del cliente.",
                    "error"
                );

                cliente.focus();

                return;

            }


            datosCliente = {

                nombre:
                nombreManual,

                cuit:"",
                telefono:"",
                email:"",
                direccion:"",
                localidad:"",
                provincia:""

            };

        }
        else{

            if(
                !clienteActual
            ){

                mostrarMensaje(
                    "Seleccioná un cliente.",
                    "error"
                );

                clienteSeleccionado.focus();

                return;

            }


            datosCliente =
            clienteActual.datos;

        }


        if(
            lugarTrabajo.value.trim() === ""
        ){

            mostrarMensaje(
                "Ingresá el lugar de trabajo.",
                "error"
            );

            lugarTrabajo.focus();

            return;

        }


        if(
            descripcion.value.trim() === ""
        ){

            mostrarMensaje(
                "Ingresá la descripción del trabajo.",
                "error"
            );

            descripcion.focus();

            return;

        }


        const lista =
        obtenerMateriales();


        const valorMateriales =
        Number(
            materiales.value
        ) || 0;


        const valorManoObra =
        Number(
            manoObra.value
        ) || 0;


        const valorViaticos =
        Number(
            viaticos.value
        ) || 0;


        const totalGeneral =
        valorMateriales +
        valorManoObra +
        valorViaticos;


        btnGuardar.disabled =
        true;


        btnGuardar.textContent =
        "Guardando...";


        try{

            const numeroAgendaFinal =
            await obtenerNumeroAgenda();


            await addDoc(

                collection(
                    db,
                    "presupuestos"
                ),

                {

                    uid:
                    usuarioActual.uid,


                    /*
                     * EMPRESA
                     */

                    empresaId:
                    datosEmpresa.uid ||
                    datosEmpresa.empresaId ||
                    "",

                    empresaNombre:
                    datosEmpresa.nombreEmpresa ||
                    "",

                    empresaRazonSocial:
                    datosEmpresa.razonSocial ||
                    "",

                    empresaCuit:
                    datosEmpresa.cuit ||
                    "",

                    empresaTelefono:
                    datosEmpresa.telefono ||
                    "",

                    empresaEmail:
                    datosEmpresa.email ||
                    usuarioActual.email ||
                    "",

                    empresaDireccion:
                    datosEmpresa.direccion ||
                    "",

                    empresaLogo:
                    datosEmpresa.logoUrl ||
                    "",


                    /*
                     * CLIENTE
                     */

                    clienteId:
                    clienteActual
                    ? clienteActual.id
                    : "",

                    cliente:
                    datosCliente.nombre ||
                    datosCliente.empresa ||
                    "",

                    clienteCuit:
                    datosCliente.cuit ||
                    "",

                    clienteTelefono:
                    datosCliente.telefono ||
                    "",

                    clienteEmail:
                    datosCliente.email ||
                    "",

                    clienteDireccion:
                    datosCliente.direccion ||
                    "",

                    clienteLocalidad:
                    datosCliente.localidad ||
                    "",

                    clienteProvincia:
                    datosCliente.provincia ||
                    "",


                    /*
                     * PRESUPUESTO
                     */

                    numeroAgenda:
                    numeroAgendaFinal,

                    fecha:
                    fecha.value,

                    lugarTrabajo:
                    lugarTrabajo.value.trim(),

                    descripcion:
                    descripcion.value.trim(),

                    materialesLista:
                    lista,

                    materiales:
                    valorMateriales,

                    manoObra:
                    valorManoObra,

                    viaticos:
                    valorViaticos,

                    total:
                    totalGeneral,

                    creado:
                    serverTimestamp()

                }

            );


            mostrarMensaje(
                "Presupuesto guardado correctamente. N.º de agenda: " +
                numeroAgendaFinal,
                "exito"
            );


            btnGuardar.disabled =
            false;


            btnGuardar.textContent =
            "Guardar presupuesto";


            setTimeout(
                function(){

                    window.location.href =
                    "presupuestos.html";

                },
                1000
            );

        }
        catch(error){

            console.error(
                "Error guardando presupuesto:",
                error
            );


            mostrarMensaje(
                "No se pudo guardar: " +
                error.message,
                "error"
            );


            btnGuardar.disabled =
            false;


            btnGuardar.textContent =
            "Guardar presupuesto";

        }

    }
);
