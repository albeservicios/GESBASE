<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#111827">
<title>Nuevo presupuesto - GESBASE</title>

<style>
*{
    box-sizing:border-box;
    margin:0;
    padding:0;
}

body{
    font-family:Arial,sans-serif;
    background:#f3f4f6;
    color:#111827;
}

.contenedor{
    max-width:600px;
    margin:auto;
    min-height:100vh;
    background:white;
}

header{
    background:#111827;
    color:white;
    padding:25px 20px;
}

header h1{
    font-size:25px;
}

header p{
    margin-top:6px;
    font-size:14px;
    color:#d1d5db;
}

main{
    padding:20px;
}

.campo{
    margin-bottom:18px;
}

label{
    display:block;
    font-weight:bold;
    font-size:14px;
    margin-bottom:7px;
}

input,
textarea{
    width:100%;
    padding:13px;
    border:1px solid #d1d5db;
    border-radius:9px;
    font-size:16px;
    background:white;
}

textarea{
    min-height:110px;
    resize:vertical;
}

.material-item{
    display:flex;
    gap:8px;
    align-items:center;
    margin-bottom:10px;
}

.material-tipo{
    flex:1;
}

.material-cantidad{
    width:110px;
}

.btn-quitar{
    width:45px;
    padding:13px 5px;
    margin:0;
    background:#dc2626;
    color:white;
    border:none;
    border-radius:9px;
    font-size:18px;
}

.btn-agregar{
    background:#2563eb;
    color:white;
}

.resumen{
    margin-top:20px;
    padding:18px;
    background:#f3f4f6;
    border-radius:12px;
}

.resumen-linea{
    display:flex;
    justify-content:space-between;
    gap:10px;
    padding:8px 0;
    font-size:16px;
}

.resumen-total{
    border-top:2px solid #111827;
    margin-top:10px;
    padding-top:14px;
    font-size:21px;
    font-weight:bold;
}

button{
    width:100%;
    padding:15px;
    border:none;
    border-radius:10px;
    font-size:16px;
    font-weight:bold;
    cursor:pointer;
    margin-top:10px;
}

.guardar{
    background:#111827;
    color:white;
}

.volver{
    background:#e5e7eb;
    color:#111827;
}

button:disabled{
    opacity:.6;
}

.mensaje{
    display:none;
    margin-top:15px;
    padding:13px;
    border-radius:10px;
    font-size:14px;
}

.exito{
    display:block;
    background:#dcfce7;
    color:#166534;
}

.error{
    display:block;
    background:#fee2e2;
    color:#991b1b;
}
</style>
</head>

<body>

<div class="contenedor">

<header>
<h1>Nuevo presupuesto</h1>
<p>GESBASE</p>
</header>

<main>

<!-- CLIENTE -->
<div class="campo">
<label for="cliente">Cliente</label>
<input
    type="text"
    id="cliente"
    placeholder="Nombre del cliente"
>
</div>

<!-- FECHA -->
<div class="campo">
<label for="fecha">Fecha</label>
<input type="date" id="fecha">
</div>

<!-- LUGAR -->
<div class="campo">
<label for="lugarTrabajo">Lugar de trabajo</label>
<input
    type="text"
    id="lugarTrabajo"
    placeholder="Dirección, localidad o sucursal"
>
</div>

<!-- DESCRIPCIÓN -->
<div class="campo">
<label for="descripcion">Descripción del trabajo</label>
<textarea
    id="descripcion"
    placeholder="Describí el trabajo a realizar"
></textarea>
</div>

<!-- MATERIALES -->
<div class="campo">

<label>Materiales</label>

<div id="listaMateriales"></div>

<button
    type="button"
    class="btn-agregar"
    id="btnAgregar"
>
+ Agregar material
</button>

</div>

<!-- VALOR TOTAL MATERIALES -->
<div class="campo">

<label for="materiales">
Valor total de materiales
</label>

<input
    type="number"
    id="materiales"
    min="0"
    step="0.01"
    value="0"
    placeholder="Ingrese el valor total de materiales"
>

</div>

<!-- MANO DE OBRA -->
<div class="campo">

<label for="manoObra">
Mano de obra
</label>

<input
    type="number"
    id="manoObra"
    min="0"
    step="0.01"
    value="0"
>

</div>

<!-- VIÁTICOS -->
<div class="campo">

<label for="viaticos">
Viáticos
</label>

<input
    type="number"
    id="viaticos"
    min="0"
    step="0.01"
    value="0"
>

</div>

<!-- RESUMEN -->
<div class="resumen">

<div class="resumen-linea">
<span>Materiales</span>
<strong>$ <span id="resumenMateriales">0,00</span></strong>
</div>

<div class="resumen-linea">
<span>Mano de obra</span>
<strong>$ <span id="resumenManoObra">0,00</span></strong>
</div>

<div class="resumen-linea">
<span>Viáticos</span>
<strong>$ <span id="resumenViaticos">0,00</span></strong>
</div>

<div class="resumen-linea resumen-total">
<span>TOTAL GENERAL</span>
<strong>$ <span id="total">0,00</span></strong>
</div>

</div>

<div id="mensaje" class="mensaje"></div>

<button
    type="button"
    class="guardar"
    id="btnGuardar"
>
Guardar presupuesto
</button>

<button
    type="button"
    class="volver"
    id="btnVolver"
>
Volver a mis presupuestos
</button>

</main>
</div>

<script type="module">

import {
    auth,
    db
} from "./Js/firebase.js";

import {
    onAuthStateChanged
} from "https://www.gstatic.com/firebasejs/12.1.0/firebase-auth.js";

import {
    collection,
    addDoc,
    serverTimestamp
} from "https://www.gstatic.com/firebasejs/12.1.0/firebase-firestore.js";


const cliente =
document.getElementById("cliente");

const fecha =
document.getElementById("fecha");

const lugarTrabajo =
document.getElementById("lugarTrabajo");

const descripcion =
document.getElementById("descripcion");

const listaMateriales =
document.getElementById("listaMateriales");

const btnAgregar =
document.getElementById("btnAgregar");

const materiales =
document.getElementById("materiales");

const manoObra =
document.getElementById("manoObra");

const viaticos =
document.getElementById("viaticos");

const resumenMateriales =
document.getElementById("resumenMateriales");

const resumenManoObra =
document.getElementById("resumenManoObra");

const resumenViaticos =
document.getElementById("resumenViaticos");

const total =
document.getElementById("total");

const mensaje =
document.getElementById("mensaje");

const btnGuardar =
document.getElementById("btnGuardar");

const btnVolver =
document.getElementById("btnVolver");


let usuarioActual = null;


/* FECHA ACTUAL */

const hoy = new Date();

fecha.value =
hoy.getFullYear() +
"-" +
String(hoy.getMonth()+1).padStart(2,"0") +
"-" +
String(hoy.getDate()).padStart(2,"0");


/* AUTENTICACIÓN */

onAuthStateChanged(
    auth,
    function(usuario){

        if(!usuario){

            window.location.replace(
                "login.html"
            );

            return;
        }

        usuarioActual = usuario;

    }
);


/* AGREGAR MATERIAL */

function agregarMaterial(){

    const fila =
    document.createElement("div");

    fila.className =
    "material-item";

    fila.innerHTML = `

        <input
            type="text"
            class="material-tipo"
            placeholder="Tipo de material"
        >

        <input
            type="number"
            class="material-cantidad"
            placeholder="Cantidad"
            min="0"
            step="1"
        >

        <button
            type="button"
            class="btn-quitar"
        >
            ×
        </button>

    `;

    fila
    .querySelector(".btn-quitar")
    .addEventListener(
        "click",
        function(){

            fila.remove();

        }
    );

    listaMateriales.appendChild(
        fila
    );
}


btnAgregar.addEventListener(
    "click",
    agregarMaterial
);


/* OBTENER MATERIALES */

function obtenerMateriales(){

    const filas =
    listaMateriales.querySelectorAll(
        ".material-item"
    );

    const lista = [];

    filas.forEach(
        function(fila){

            const tipo =
            fila
            .querySelector(
                ".material-tipo"
            )
            .value
            .trim();

            const cantidad =
            Number(
                fila
                .querySelector(
                    ".material-cantidad"
                )
                .value
            ) || 0;

            if(tipo !== ""){

                lista.push({
                    tipo: tipo,
                    cantidad: cantidad
                });

            }

        }
    );

    return lista;
}


/* FORMATO DINERO */

function formatoDinero(valor){

    return Number(valor || 0)
    .toLocaleString(
        "es-AR",
        {
            minimumFractionDigits:2,
            maximumFractionDigits:2
        }
    );
}


/* CALCULAR TOTAL */

function calcularTotal(){

    const valorMateriales =
    Number(materiales.value) || 0;

    const valorManoObra =
    Number(manoObra.value) || 0;

    const valorViaticos =
    Number(viaticos.value) || 0;

    const totalGeneral =
    valorMateriales +
    valorManoObra +
    valorViaticos;

    resumenMateriales.textContent =
    formatoDinero(valorMateriales);

    resumenManoObra.textContent =
    formatoDinero(valorManoObra);

    resumenViaticos.textContent =
    formatoDinero(valorViaticos);

    total.textContent =
    formatoDinero(totalGeneral);

    return totalGeneral;
}


materiales.addEventListener(
    "input",
    calcularTotal
);

manoObra.addEventListener(
    "input",
    calcularTotal
);

viaticos.addEventListener(
    "input",
    calcularTotal
);


/* MENSAJE */

function mostrarMensaje(
    texto,
    tipo
){

    mensaje.textContent =
    texto;

    mensaje.className =
    "mensaje " + tipo;
}


/* GUARDAR */

btnGuardar.addEventListener(
    "click",
    async function(){

        if(!usuarioActual){

            mostrarMensaje(
                "Esperá unos segundos mientras se verifica la sesión.",
                "error"
            );

            return;
        }


        if(
            cliente.value.trim() === ""
        ){

            mostrarMensaje(
                "Ingresá el nombre del cliente.",
                "error"
            );

            cliente.focus();

            return;
        }


        if(
            lugarTrabajo.value.trim() === ""
        ){

            mostrarMensaje(
                "Ingresá el lugar de trabajo.",
                "error"
            );

            lugarTrabajo.focus();

            return;
        }


        if(
            descripcion.value.trim() === ""
        ){

            mostrarMensaje(
                "Ingresá la descripción del trabajo.",
                "error"
            );

            descripcion.focus();

            return;
        }


        const lista =
        obtenerMateriales();


        const valorMateriales =
        Number(materiales.value) || 0;

        const valorManoObra =
        Number(manoObra.value) || 0;

        const valorViaticos =
        Number(viaticos.value) || 0;

        const totalGeneral =
        valorMateriales +
        valorManoObra +
        valorViaticos;


        btnGuardar.disabled =
        true;

        btnGuardar.textContent =
        "Guardando...";


        try{

            await addDoc(
                collection(
                    db,
                    "presupuestos"
                ),
                {

                    uid:
                    usuarioActual.uid,

                    cliente:
                    cliente.value.trim(),

                    fecha:
                    fecha.value,

                    lugarTrabajo:
                    lugarTrabajo.value.trim(),

                    descripcion:
                    descripcion.value.trim(),

                    materialesLista:
                    lista,

                    materiales:
                    valorMateriales,

                    manoObra:
                    valorManoObra,

                    viaticos:
                    valorViaticos,

                    total:
                    totalGeneral,

                    creado:
                    serverTimestamp()

                }
            );


            mostrarMensaje(
                "Presupuesto guardado correctamente.",
                "exito"
            );


            setTimeout(
                function(){

                    window.location.href =
                    "presupuestos.html";

                },
                800
            );


        }catch(error){

            console.error(error);

            mostrarMensaje(
                "No se pudo guardar: " +
                error.message,
                "error"
            );

            btnGuardar.disabled =
            false;

            btnGuardar.textContent =
            "Guardar presupuesto";

        }

    }
);


/* VOLVER */

btnVolver.addEventListener(
    "click",
    function(){

        window.location.href =
        "presupuestos.html";

    }
);


/* TOTAL INICIAL */

calcularTotal();

</script>

</body>
</html>
