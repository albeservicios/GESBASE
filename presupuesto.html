<!DOCTYPE html>
<html lang="es">

<head>

<meta charset="UTF-8">

<meta name="viewport" content="width=device-width, initial-scale=1.0">

<meta name="theme-color" content="#111827">

<title>Nuevo presupuesto - GESBASE</title>

<style>

* {
    box-sizing: border-box;
    margin: 0;
    padding: 0;
}

body {
    font-family: Arial, sans-serif;
    background: #f3f4f6;
    color: #111827;
}

.contenedor {
    max-width: 600px;
    margin: auto;
    min-height: 100vh;
    background: white;
}

header {
    background: #111827;
    color: white;
    padding: 25px 20px;
}

header h1 {
    font-size: 25px;
}

header p {
    margin-top: 6px;
    font-size: 14px;
    color: #d1d5db;
}

main {
    padding: 20px;
}

.campo {
    margin-bottom: 18px;
}

label {
    display: block;
    font-weight: bold;
    font-size: 14px;
    margin-bottom: 7px;
}

input,
textarea {
    width: 100%;
    padding: 13px;
    border: 1px solid #d1d5db;
    border-radius: 9px;
    font-size: 16px;
    background: white;
}

textarea {
    min-height: 110px;
    resize: vertical;
}

/* ================================
   MATERIALES
================================ */

.materiales-box {
    margin-bottom: 20px;
}

.material-item {
    display: flex;
    gap: 8px;
    align-items: center;
    margin-bottom: 10px;
}

.material-tipo {
    flex: 1;
}

.material-cantidad {
    width: 110px;
}

.btn-quitar-material {
    width: 45px;
    padding: 13px 5px;
    margin: 0;
    background: #dc2626;
    color: white;
    border: none;
    border-radius: 9px;
    font-size: 18px;
}

.btn-agregar-material {
    background: #2563eb;
    color: white;
    margin-top: 5px;
}

.lista-vacia {
    padding: 12px;
    background: #f3f4f6;
    border-radius: 9px;
    color: #6b7280;
    font-size: 14px;
    margin-bottom: 10px;
}

/* ================================
   TOTAL
================================ */

.total {
    margin-top: 20px;
    padding: 18px;
    background: #f3f4f6;
    border-radius: 12px;
    font-size: 20px;
    font-weight: bold;
}

button {
    width: 100%;
    padding: 15px;
    border: none;
    border-radius: 10px;
    font-size: 16px;
    font-weight: bold;
    cursor: pointer;
    margin-top: 10px;
}

.guardar {
    background: #111827;
    color: white;
}

.volver {
    background: #e5e7eb;
    color: #111827;
}

button:disabled {
    opacity: .6;
    cursor: not-allowed;
}

.mensaje {
    display: none;
    margin-top: 15px;
    padding: 13px;
    border-radius: 10px;
    font-size: 14px;
}

.exito {
    display: block;
    background: #dcfce7;
    color: #166534;
}

.error {
    display: block;
    background: #fee2e2;
    color: #991b1b;
}

</style>

</head>

<body>

<div class="contenedor">

<header>

<h1>
Nuevo presupuesto
</h1>

<p>
GESBASE
</p>

</header>


<main>


<!-- ================================
     CLIENTE
================================ -->

<div class="campo">

<label for="cliente">
Cliente
</label>

<input
    type="text"
    id="cliente"
    placeholder="Nombre del cliente"
>

</div>


<!-- ================================
     FECHA
================================ -->

<div class="campo">

<label for="fecha">
Fecha
</label>

<input
    type="date"
    id="fecha"
>

</div>


<!-- ================================
     LUGAR DE TRABAJO
================================ -->

<div class="campo">

<label for="lugarTrabajo">
Lugar de trabajo
</label>

<input
    type="text"
    id="lugarTrabajo"
    placeholder="Dirección, localidad o sucursal"
>

</div>


<!-- ================================
     DESCRIPCIÓN
================================ -->

<div class="campo">

<label for="descripcion">
Descripción del trabajo
</label>

<textarea
    id="descripcion"
    placeholder="Describí el trabajo a realizar"
></textarea>

</div>


<!-- ================================
     MATERIALES
================================ -->

<div class="campo materiales-box">

<label>
Materiales
</label>

<div id="listaMateriales">

<div class="lista-vacia" id="sinMateriales">
Todavía no agregaste materiales.
</div>

</div>


<button
    type="button"
    class="btn-agregar-material"
    id="btnAgregarMaterial"
>
+ Agregar material
</button>

</div>


<!-- ================================
     MANO DE OBRA
================================ -->

<div class="campo">

<label for="manoObra">
Mano de obra
</label>

<input
    type="number"
    id="manoObra"
    min="0"
    step="0.01"
    value="0"
>

</div>


<!-- ================================
     VIÁTICOS
================================ -->

<div class="campo">

<label for="viaticos">
Viáticos
</label>

<input
    type="number"
    id="viaticos"
    min="0"
    step="0.01"
    value="0"
>

</div>


<!-- ================================
     TOTAL
================================ -->

<div class="total">

TOTAL:
$ <span id="total">0,00</span>

</div>


<div
    id="mensaje"
    class="mensaje"
></div>


<button
    type="button"
    class="guardar"
    id="btnGuardar"
>
Guardar presupuesto
</button>


<button
    type="button"
    class="volver"
    id="btnVolver"
>
Volver a mis presupuestos
</button>


</main>

</div>


<script type="module">

// ==========================================
// FIREBASE
// ==========================================

import {
    auth,
    db
} from "./Js/firebase.js";


import {
    onAuthStateChanged
} from
"https://www.gstatic.com/firebasejs/12.1.0/firebase-auth.js";


import {
    collection,
    addDoc,
    serverTimestamp
} from
"https://www.gstatic.com/firebasejs/12.1.0/firebase-firestore.js";


// ==========================================
// ELEMENTOS
// ==========================================

const cliente =
document.getElementById("cliente");

const fecha =
document.getElementById("fecha");

const lugarTrabajo =
document.getElementById("lugarTrabajo");

const descripcion =
document.getElementById("descripcion");

const listaMateriales =
document.getElementById("listaMateriales");

const sinMateriales =
document.getElementById("sinMateriales");

const btnAgregarMaterial =
document.getElementById("btnAgregarMaterial");

const manoObra =
document.getElementById("manoObra");

const viaticos =
document.getElementById("viaticos");

const total =
document.getElementById("total");

const mensaje =
document.getElementById("mensaje");

const btnGuardar =
document.getElementById("btnGuardar");

const btnVolver =
document.getElementById("btnVolver");


// ==========================================
// USUARIO
// ==========================================

let usuarioActual = null;


onAuthStateChanged(
    auth,
    function(usuario) {

        if (!usuario) {

            window.location.replace(
                "login.html"
            );

            return;

        }

        usuarioActual = usuario;

    }
);


// ==========================================
// FECHA ACTUAL
// ==========================================

const ahora =
new Date();


fecha.value =
    ahora.getFullYear() +
    "-" +
    String(
        ahora.getMonth() + 1
    ).padStart(2, "0") +
    "-" +
    String(
        ahora.getDate()
    ).padStart(2, "0");


// ==========================================
// AGREGAR MATERIAL
// ==========================================

function agregarMaterial(
    tipo = "",
    cantidad = ""
) {

    if (
        sinMateriales
    ) {

        sinMateriales.remove();

    }


    const fila =
        document.createElement(
            "div"
        );


    fila.className =
        "material-item";


    fila.innerHTML = `

        <input
            type="text"
            class="material-tipo"
            placeholder="Tipo de material"
            value="${escapeHTML(tipo)}"
        >

        <input
            type="number"
            class="material-cantidad"
            placeholder="Cantidad"
            min="0"
            step="1"
            value="${escapeHTML(cantidad)}"
        >

        <button
            type="button"
            class="btn-quitar-material"
            title="Quitar material"
        >
            ×
        </button>

    `;


    const botonQuitar =
        fila.querySelector(
            ".btn-quitar-material"
        );


    botonQuitar.addEventListener(
        "click",
        function() {

            fila.remove();

            comprobarListaMateriales();

        }
    );


    listaMateriales.appendChild(
        fila
    );

}


// ==========================================
// ESCAPAR TEXTO
// ==========================================

function escapeHTML(valor) {

    return String(valor || "")
        .replace(
            /&/g,
            "&amp;"
        )
        .replace(
            /</g,
            "&lt;"
        )
        .replace(
            />/g,
            "&gt;"
        )
        .replace(
            /"/g,
            "&quot;"
        )
        .replace(
            /'/g,
            "&#039;"
        );

}


// ==========================================
// COMPROBAR LISTA
// ==========================================

function comprobarListaMateriales() {

    const filas =
        listaMateriales.querySelectorAll(
            ".material-item"
        );


    if (
        filas.length === 0
    ) {

        listaMateriales.innerHTML = `

            <div
                class="lista-vacia"
                id="sinMateriales"
            >
                Todavía no agregaste materiales.
            </div>

        `;

    }

}


// ==========================================
// OBTENER MATERIALES
// ==========================================

function obtenerMateriales() {

    const filas =
        listaMateriales.querySelectorAll(
            ".material-item"
        );


    const materialesLista = [];


    filas.forEach(
        function(fila) {

            const tipo =
                fila.querySelector(
                    ".material-tipo"
                ).value.trim();


            const cantidad =
                Number(
                    fila.querySelector(
                        ".material-cantidad"
                    ).value
                ) || 0;


            if (
                tipo !== ""
            ) {

                materialesLista.push({

                    tipo:
                        tipo,

                    cantidad:
                        cantidad

                });

            }

        }
    );


    return materialesLista;

}


// ==========================================
// TOTAL
// ==========================================

function calcularTotal() {

    const mo =
        Number(
            manoObra.value
        ) || 0;


    const v =
        Number(
            viaticos.value
        ) || 0;


    /*
       El campo materiales monetario
       deja de utilizarse.

       El total económico queda:
       Mano de obra + Viáticos
    */

    const resultado =
        mo + v;


    total.textContent =
        resultado.toLocaleString(
            "es-AR",
            {
                minimumFractionDigits: 2,
                maximumFractionDigits: 2
            }
        );


    return resultado;

}


manoObra.addEventListener(
    "input",
    calcularTotal
);


viaticos.addEventListener(
    "input",
    calcularTotal
);


// ==========================================
// MENSAJE
// ==========================================

function mostrarMensaje(
    texto,
    tipo
) {

    mensaje.textContent =
        texto;

    mensaje.className =
        "mensaje " + tipo;

}


// ==========================================
// AGREGAR MATERIAL
// ==========================================

btnAgregarMaterial.addEventListener(
    "click",
    function() {

        agregarMaterial();

    }
);


// ==========================================
// GUARDAR
// ==========================================

btnGuardar.addEventListener(
    "click",
    async function() {


        if (!usuarioActual) {

            mostrarMensaje(
                "Esperá unos segundos mientras se verifica la sesión.",
                "error"
            );

            return;

        }


        if (
            cliente.value.trim() === ""
        ) {

            mostrarMensaje(
                "Ingresá el nombre del cliente.",
                "error"
            );

            cliente.focus();

            return;

        }


        if (
            lugarTrabajo.value.trim() === ""
        ) {

            mostrarMensaje(
                "Ingresá el lugar de trabajo.",
                "error"
            );

            lugarTrabajo.focus();

            return;

        }


        if (
            descripcion.value.trim() === ""
        ) {

            mostrarMensaje(
                "Ingresá la descripción del trabajo.",
                "error"
            );

            descripcion.focus();

            return;

        }


        const materialesLista =
            obtenerMateriales();


        const valorManoObra =
            Number(
                manoObra.value
            ) || 0;


        const valorViaticos =
            Number(
                viaticos.value
            ) || 0;


        const valorTotal =
            valorManoObra +
            valorViaticos;


        btnGuardar.disabled =
            true;


        btnGuardar.textContent =
            "Guardando...";


        try {


            await addDoc(
                collection(
                    db,
                    "presupuestos"
                ),
                {

                    uid:
                        usuarioActual.uid,

                    cliente:
                        cliente.value.trim(),

                    fecha:
                        fecha.value,

                    lugarTrabajo:
                        lugarTrabajo.value.trim(),

                    descripcion:
                        descripcion.value.trim(),

                    materialesLista:
                        materialesLista,

                    /*
                       Se conserva el campo
                       materiales para compatibilidad
                       con presupuestos anteriores.
                    */

                    materiales:
                        0,

                    manoObra:
                        valorManoObra,

                    viaticos:
                        valorViaticos,

                    total:
                        valorTotal,

                    creado:
                        serverTimestamp()

                }
            );


            mostrarMensaje(
                "Presupuesto guardado correctamente.",
                "exito"
            );


            setTimeout(
                function() {

                    window.location.href =
                        "presupuestos.html";

                },
                800
            );


        } catch (error) {


            console.error(
                "Error guardando presupuesto:",
                error
            );


            mostrarMensaje(
                "No se pudo guardar: " +
                error.message,
                "error"
            );


            btnGuardar.disabled =
                false;


            btnGuardar.textContent =
                "Guardar presupuesto";

        }

    }
);


// ==========================================
// VOLVER
// ==========================================

btnVolver.addEventListener(
    "click",
    function() {

        window.location.href =
            "presupuestos.html";

    }
);


</script>

</body>

</html>
