<!DOCTYPE html>
<html lang="es-AR">

<head>

<meta charset="UTF-8">

<meta
    name="viewport"
    content="width=device-width, initial-scale=1.0, viewport-fit=cover"
>

<meta name="theme-color" content="#12343B">

<meta
    name="description"
    content="Perfil de usuario - Red GESBASE"
>

<title>Mi perfil - Red GESBASE</title>

<style>

*{
    box-sizing:border-box;
    margin:0;
    padding:0;
}

html,
body{
    min-height:100%;
}

body{
    font-family:
        Arial,
        Helvetica,
        sans-serif;

    background:#f3f6f7;
    color:#17252b;

    padding-bottom:90px;
}

/* =========================
   HEADER
========================= */

header{
    position:sticky;
    top:0;
    z-index:100;

    height:64px;

    display:flex;
    align-items:center;
    justify-content:space-between;

    padding:0 18px;

    background:#12343B;
    color:white;

    box-shadow:
        0 2px 10px rgba(0,0,0,.18);
}

.logo{
    font-size:20px;
    font-weight:800;
}

.header-right{
    display:flex;
    align-items:center;
    gap:8px;
}

.header-btn{
    border:0;
    background:rgba(255,255,255,.12);
    color:white;

    width:40px;
    height:40px;

    border-radius:50%;

    cursor:pointer;

    font-size:18px;
}

.header-btn:active{
    transform:scale(.95);
}

/* =========================
   CONTENEDOR
========================= */

.container{
    width:100%;
    max-width:1000px;

    margin:auto;

    padding:18px;
}

/* =========================
   PERFIL
========================= */

.profile-card{
    background:white;

    border-radius:18px;

    overflow:hidden;

    box-shadow:
        0 4px 18px rgba(0,0,0,.08);
}

/* PORTADA */

.cover{
    position:relative;

    width:100%;
    height:220px;

    background:
        linear-gradient(
            135deg,
            #12343B,
            #1d5661
        );

    overflow:hidden;

    cursor:pointer;
}

.cover img{
    width:100%;
    height:100%;

    object-fit:cover;

    display:none;
}

.cover.has-image img{
    display:block;
}

.cover-overlay{
    position:absolute;

    right:15px;
    bottom:15px;

    background:rgba(0,0,0,.55);

    color:white;

    padding:9px 13px;

    border-radius:10px;

    font-size:13px;

    backdrop-filter:blur(5px);
}

/* FOTO */

.profile-main{
    position:relative;

    padding:
        0
        22px
        24px;
}

.profile-photo-wrapper{
    width:130px;
    height:130px;

    margin-top:-65px;

    position:relative;

    z-index:5;
}

.profile-photo{
    width:130px;
    height:130px;

    border-radius:50%;

    background:
        linear-gradient(
            135deg,
            #12343B,
            #1d5661
        );

    border:6px solid white;

    display:flex;
    align-items:center;
    justify-content:center;

    overflow:hidden;

    cursor:pointer;

    box-shadow:
        0 4px 15px rgba(0,0,0,.18);
}

.profile-photo img{
    width:100%;
    height:100%;

    object-fit:cover;

    display:none;
}

.profile-photo.has-image img{
    display:block;
}

.profile-placeholder{
    color:white;
    font-size:48px;
    font-weight:700;
}

.profile-photo.has-image .profile-placeholder{
    display:none;
}

.photo-camera{
    position:absolute;

    right:4px;
    bottom:4px;

    width:35px;
    height:35px;

    border-radius:50%;

    display:flex;
    align-items:center;
    justify-content:center;

    background:#12343B;
    color:white;

    border:3px solid white;

    font-size:15px;

    z-index:10;
}

/* INFORMACION */

.profile-info{
    margin-top:14px;
}

.profile-name{
    font-size:27px;
    font-weight:800;

    color:#12343B;

    word-break:break-word;
}

.profile-type{
    margin-top:5px;

    display:inline-block;

    background:#e7f0f1;

    color:#12343B;

    padding:6px 11px;

    border-radius:20px;

    font-size:13px;
    font-weight:700;
}

.profile-description{
    margin-top:14px;

    color:#53646a;

    line-height:1.5;

    white-space:pre-wrap;
}

.profile-data{
    display:flex;

    flex-wrap:wrap;

    gap:9px;

    margin-top:16px;
}

.data-item{
    background:#f1f4f5;

    padding:8px 11px;

    border-radius:10px;

    font-size:13px;

    color:#46575d;
}

/* BOTONES */

.profile-actions{
    display:flex;

    flex-wrap:wrap;

    gap:10px;

    margin-top:20px;
}

.btn{
    border:0;

    padding:12px 18px;

    border-radius:11px;

    font-weight:700;

    cursor:pointer;

    font-size:14px;
}

.btn-primary{
    background:#12343B;
    color:white;
}

.btn-secondary{
    background:#e9eef0;
    color:#12343B;
}

.btn-danger{
    background:#fce8e8;
    color:#a52828;
}

.btn:active{
    transform:scale(.98);
}

/* =========================
   ESTADISTICAS
========================= */

.stats{
    display:grid;

    grid-template-columns:
        repeat(2,1fr);

    gap:12px;

    margin-top:15px;
}

.stat{
    background:white;

    border-radius:15px;

    padding:18px;

    text-align:center;

    box-shadow:
        0 3px 12px rgba(0,0,0,.06);
}

.stat-number{
    font-size:24px;
    font-weight:800;

    color:#12343B;
}

.stat-label{
    margin-top:5px;

    font-size:13px;

    color:#65747a;
}

/* =========================
   PUBLICACIONES
========================= */

.section{
    margin-top:18px;
}

.section-title{
    font-size:20px;

    font-weight:800;

    color:#12343B;

    margin-bottom:12px;
}

.publications{
    display:flex;
    flex-direction:column;

    gap:12px;
}

.publication{
    background:white;

    border-radius:15px;

    padding:17px;

    box-shadow:
        0 3px 12px rgba(0,0,0,.06);
}

.publication-header{
    display:flex;

    align-items:center;

    gap:10px;
}

.publication-avatar{
    width:42px;
    height:42px;

    border-radius:50%;

    background:#12343B;

    color:white;

    display:flex;
    align-items:center;
    justify-content:center;

    font-weight:800;

    overflow:hidden;

    flex-shrink:0;
}

.publication-avatar img{
    width:100%;
    height:100%;

    object-fit:cover;
}

.publication-name{
    font-weight:700;
    color:#12343B;
}

.publication-date{
    font-size:11px;
    color:#7a898e;
    margin-top:2px;
}

.publication-text{
    margin-top:13px;

    line-height:1.5;

    color:#33454b;

    white-space:pre-wrap;
}

/* =========================
   MODAL
========================= */

.modal{
    position:fixed;

    inset:0;

    background:rgba(0,0,0,.58);

    display:none;

    align-items:center;
    justify-content:center;

    z-index:500;

    padding:18px;
}

.modal.show{
    display:flex;
}

.modal-box{
    width:100%;
    max-width:600px;

    max-height:
        calc(100vh - 36px);

    overflow-y:auto;

    background:white;

    border-radius:18px;

    padding:22px;
}

.modal-title{
    font-size:21px;

    font-weight:800;

    color:#12343B;

    margin-bottom:18px;
}

.form-group{
    margin-bottom:14px;
}

.form-group label{
    display:block;

    margin-bottom:6px;

    font-size:13px;

    font-weight:700;

    color:#42545a;
}

.form-group input,
.form-group select,
.form-group textarea{
    width:100%;

    border:1px solid #d7e0e3;

    border-radius:10px;

    padding:12px;

    font-size:15px;

    outline:none;

    background:white;
}

.form-group textarea{
    min-height:110px;

    resize:vertical;
}

.form-group input:focus,
.form-group select:focus,
.form-group textarea:focus{
    border-color:#12343B;
}

.modal-actions{
    display:flex;

    gap:10px;

    justify-content:flex-end;

    margin-top:18px;
}

/* =========================
   PROGRESO
========================= */

.upload-box{
    display:none;

    margin-top:14px;

    background:#f1f5f6;

    border-radius:12px;

    padding:12px;
}

.upload-box.show{
    display:block;
}

.upload-label{
    font-size:13px;

    color:#42545a;

    margin-bottom:7px;
}

.progress{
    width:100%;

    height:8px;

    background:#dce5e7;

    border-radius:20px;

    overflow:hidden;
}

.progress-bar{
    width:0%;

    height:100%;

    background:#12343B;

    transition:width .2s ease;
}

/* =========================
   LOADING
========================= */

.loading{
    padding:30px;

    text-align:center;

    color:#65747a;
}

.empty{
    background:white;

    border-radius:15px;

    padding:25px;

    text-align:center;

    color:#65747a;
}

/* =========================
   TOAST
========================= */

.toast{
    position:fixed;

    left:50%;

    bottom:95px;

    transform:
        translateX(-50%)
        translateY(20px);

    background:#12343B;

    color:white;

    padding:12px 18px;

    border-radius:12px;

    font-size:14px;

    z-index:1000;

    opacity:0;

    pointer-events:none;

    transition:
        opacity .25s,
        transform .25s;

    max-width:
        calc(100% - 30px);

    text-align:center;
}

.toast.show{
    opacity:1;

    transform:
        translateX(-50%)
        translateY(0);
}

/* =========================
   MENU INFERIOR
========================= */

.bottom-nav{
    position:fixed;

    left:0;
    right:0;
    bottom:0;

    height:74px;

    background:white;

    border-top:1px solid #dce4e6;

    display:flex;

    align-items:center;
    justify-content:space-around;

    z-index:200;

    box-shadow:
        0 -3px 14px rgba(0,0,0,.08);
}

.nav-item{
    border:0;

    background:none;

    color:#718085;

    display:flex;

    flex-direction:column;

    align-items:center;

    justify-content:center;

    gap:4px;

    min-width:60px;

    cursor:pointer;

    font-size:11px;
}

.nav-icon{
    font-size:22px;
}

.nav-item.active{
    color:#12343B;

    font-weight:800;
}

/* =========================
   RESPONSIVE
========================= */

@media (min-width:700px){

    .container{
        padding:
            25px;
    }

    .stats{
        grid-template-columns:
            repeat(4,1fr);
    }

    .cover{
        height:300px;
    }

}

@media (max-width:480px){

    header{
        height:58px;
    }

    .container{
        padding:10px;
    }

    .cover{
        height:170px;
    }

    .profile-main{
        padding:
            0
            15px
            20px;
    }

    .profile-photo-wrapper,
    .profile-photo{
        width:105px;
        height:105px;
    }

    .profile-photo-wrapper{
        margin-top:-52px;
    }

    .profile-name{
        font-size:23px;
    }

    .bottom-nav{
        height:70px;
    }

}

</style>

</head>

<script type="module">

import {
    auth,
    db,
    almacenamiento
} from "./Js/firebase.js";


import {
    onAuthStateChanged,
    signOut,
    updateProfile
} from "https://www.gstatic.com/firebasejs/12.18.0/firebase-auth.js";


import {
    doc,
    getDoc,
    setDoc,
    collection,
    query,
    where,
    getDocs
} from "https://www.gstatic.com/firebasejs/12.18.0/firebase-firestore.js";


import {
    ref,
    uploadBytesResumable,
    getDownloadURL
} from "https://www.gstatic.com/firebasejs/12.18.0/firebase-storage.js";


/* ==========================================
   VARIABLES
========================================== */

let usuarioActual = null;

let perfilActual = {};

let tipoImagenActual = null;


/* ==========================================
   ELEMENTOS
========================================== */

const loading =
    document.getElementById("loading");

const contenidoPerfil =
    document.getElementById("contenidoPerfil");

const nombrePerfil =
    document.getElementById("nombrePerfil");

const tipoPerfil =
    document.getElementById("tipoPerfil");

const descripcionPerfil =
    document.getElementById("descripcionPerfil");

const datosPerfil =
    document.getElementById("datosPerfil");

const imagenPerfil =
    document.getElementById("imagenPerfil");

const imagenPortada =
    document.getElementById("imagenPortada");

const profilePhoto =
    document.getElementById("profilePhoto");

const cover =
    document.getElementById("cover");

const publicaciones =
    document.getElementById("publicaciones");

const cantidadConexiones =
    document.getElementById("cantidadConexiones");

const cantidadPublicaciones =
    document.getElementById("cantidadPublicaciones");

const modalEditar =
    document.getElementById("modalEditar");

const inputFotoPerfil =
    document.getElementById("inputFotoPerfil");

const inputFotoPortada =
    document.getElementById("inputFotoPortada");

const uploadBox =
    document.getElementById("uploadBox");

const uploadLabel =
    document.getElementById("uploadLabel");

const progressBar =
    document.getElementById("progressBar");


/* ==========================================
   TOAST
========================================== */

function mostrarToast(mensaje){

    const toast =
        document.getElementById("toast");

    toast.textContent = mensaje;

    toast.classList.add("show");

    setTimeout(() => {

        toast.classList.remove("show");

    }, 3000);
}


/* ==========================================
   NOMBRE
========================================== */

function obtenerNombreCompleto(){

    const nombre =
        perfilActual.nombre ||
        "";

    const apellido =
        perfilActual.apellido ||
        "";

    const completo =
        `${nombre} ${apellido}`.trim();

    return (
        perfilActual.nombreCompleto ||
        completo ||
        usuarioActual?.displayName ||
        "Usuario GESBASE"
    );
}


/* ==========================================
   SINCRONIZAR DIRECTORIO
========================================== */

async function sincronizarDirectorio(){

    if(!usuarioActual){
        return;
    }

    try{

        const nombreCompleto =
            obtenerNombreCompleto();

        await setDoc(
            doc(
                db,
                "directorio_red",
                usuarioActual.uid
            ),
            {

                uid:
                    usuarioActual.uid,

                nombreCompleto:
                    nombreCompleto,

                tipo:
                    perfilActual.tipoPerfil ||
                    "persona",

                rubro:
                    perfilActual.rubro ||
                    "",

                localidad:
                    perfilActual.localidad ||
                    "",

                provincia:
                    perfilActual.provincia ||
                    "",

                fotoURL:
                    perfilActual.fotoPerfil ||
                    "",

                fotoPortada:
                    perfilActual.fotoPortada ||
                    "",

                activo:
                    perfilActual.visible !== false

            },
            {
                merge:true
            }
        );

        console.log(
            "Directorio sincronizado correctamente"
        );

    }catch(error){

        console.error(
            "Error sincronizando directorio:",
            error
        );

        throw error;
    }
}


/* ==========================================
   CARGAR PERFIL
========================================== */

async function cargarPerfil(){

    if(!usuarioActual){
        return;
    }

    try{

        const referencia =
            doc(
                db,
                "usuariosRed",
                usuarioActual.uid
            );

        const snap =
            await getDoc(referencia);


        if(snap.exists()){

            perfilActual =
                snap.data();

        }else{

            perfilActual = {

                uid:
                    usuarioActual.uid,

                nombre:
                    usuarioActual.displayName ||
                    "",

                apellido:
                    "",

                nombreCompleto:
                    usuarioActual.displayName ||
                    "",

                tipoPerfil:
                    "persona",

                descripcion:
                    "",

                rubro:
                    "",

                localidad:
                    "",

                provincia:
                    "",

                fotoPerfil:
                    "",

                fotoPortada:
                    "",

                visible:
                    true

            };

        }


        /* ==========================
           SINCRONIZAR DIRECTORIO
        ========================== */

        await sincronizarDirectorio();


        /* ==========================
           MOSTRAR DATOS
        ========================== */

        renderizarPerfil();


        /* ==========================
           ESTADISTICAS
        ========================== */

        await cargarEstadisticas();


        /* ==========================
           PUBLICACIONES
        ========================== */

        await cargarPublicaciones();


        loading.style.display =
            "none";

        contenidoPerfil.style.display =
            "block";


    }catch(error){

        console.error(
            "Error cargando perfil:",
            error
        );

        loading.innerHTML =
            `
            <div style="color:#a52828;">
                No se pudo cargar el perfil.
                <br><br>
                ${error.message}
            </div>
            `;
    }
}


/* ==========================================

========================================== */

function renderizarPerfil(){

    const nombreCompleto =
        obtenerNombreCompleto();


    nombrePerfil.textContent =

    tipoPerfil.textContent =
        capitalizar(
            perfilActual.tipoPerfil ||
            "persona"
        );


    descripcionPerfil.textContent =
        perfilActual.descripcion ||
        "";


    datosPerfil.innerHTML = "";


    if(perfilActual.rubro){

        agregarDato(
            "🔧",
            perfilActual.rubro
        );

    }


    if(perfilActual.localidad){

        agregarDato(
            "📍",
            perfilActual.localidad
        );

    }


    if(perfilActual.provincia){

        agregarDato(
            "🗺️",
            perfilActual.provincia
        );

    }


    if(usuarioActual.email){

        agregarDato(
            "✉️",

    }

    if(perfilActual.fotoPerfil){

        );

    }else{

        imagenPerfil.removeAttribute(
            "src"
        );

        profilePhoto.classList.remove(
            "has-image"
        );

    }


    /* PORTADA */

    if(perfilActual.fotoPortada){

        imagenPortada.src =
            perfilActual.fotoPortada;

        cover.classList.add(
            "has-image"
        );

    }else{

        imagenPortada.removeAttribute(
            "src"
        );

        cover.classList.remove(
            "has-image"
        );

    }

}


/* ==========================================
   AGREGAR DATO

function agregarDato(icono,texto){

    const div =
        document.createElement("div");

        "data-item";

    div.textContent =
        `${icono} ${texto}`;

    datosPerfil.appendChild(div);

/* ==========================================
   CAPITALIZAR
========================================== */

function capitalizar(texto){

    if(!texto){
        return "";
    }

    return texto
        .charAt(0)
        .toUpperCase() +
        texto.slice(1);
}


/* ==========================================
   ESTADISTICAS
========================================== */

async function cargarEstadisticas(){

    try{

        let totalConexiones = 0;


        const enviados =
            await getDocs(
                query(
                    collection(
                        db,
                        "conexiones"
                    ),
                    where(
                        "emisor",
                        "==",
                        usuarioActual.uid
                    )
                )
            );


        const recibidos =
            await getDocs(
                query(
                    collection(
                        db,
                        "conexiones"
                    ),
                    where(
                        "receptor",
                        "==",
                        usuarioActual.uid
                    )
                )
            );


        enviados.forEach((item) => {

            const data =
                item.data();

            if(
                data.estado ===
                "aceptada"
            ){

                totalConexiones++;

            }

        });


        recibidos.forEach((item) => {

            const data =
                item.data();

            if(
                data.estado ===
                "aceptada"
            ){

                totalConexiones++;

            }

        });


        cantidadConexiones.textContent =
            totalConexiones;


    }catch(error){

        console.error(
            "Error conexiones:",
            error
        );

        cantidadConexiones.textContent =
            "0";
    }

}


/* ==========================================
   PUBLICACIONES
========================================== */

async function cargarPublicaciones(){

    publicaciones.innerHTML =
        `
        <div class="loading">
            Cargando publicaciones...
        </div>
        `;


    try{

        const consulta =
            query(
                collection(
                    db,
                    "publicaciones"
                ),
                where(
                    "uid",
                    "==",
                    usuarioActual.uid
                )
            );


        const snap =
            await getDocs(consulta);


        const lista =
            [];


        snap.forEach((item) => {

            lista.push({
                id:item.id,
                ...item.data()
            });

        });


        lista.sort((a,b) => {

            const fechaA =
                a.fecha?.toMillis
                    ? a.fecha.toMillis()
                    : 0;

            const fechaB =
                b.fecha?.toMillis
                    ? b.fecha.toMillis()
                    : 0;

            return fechaB - fechaA;

        });


        cantidadPublicaciones.textContent =
            lista.length;


        publicaciones.innerHTML =
            "";


        if(lista.length === 0){

            publicaciones.innerHTML =
                `
                <div class="empty">
                    Todavía no tenés publicaciones.
                </div>
                `;

            return;
        }


        lista.forEach((publicacion) => {

            const elemento =
                document.createElement("article");

            elemento.className =
                "publication";


            const fecha =
                formatearFecha(
                    publicacion.fecha
                );


            elemento.innerHTML =
                `

                <div class="publication-header">

                    <div class="publication-avatar">

                        ${
                            perfilActual.fotoPerfil

                            ?

                            `<img
                                src="${escaparHTML(
                                    perfilActual.fotoPerfil
                                )}"
                                alt=""
                            >`

                            :

                            iniciales(
                                obtenerNombreCompleto()
                            )
                        }

                    </div>


                    <div>

                        <div class="publication-name">

                            ${escaparHTML(
                                obtenerNombreCompleto()
                            )}

                        </div>

                        <div class="publication-date">

                            ${fecha}

                        </div>

                    </div>

                </div>


                <div class="publication-text">

                    ${escaparHTML(
                        publicacion.texto ||
                        ""
                    )}

                </div>

                `;


            publicaciones.appendChild(
                elemento
            );

        });


    }catch(error){

        console.error(
            "Error publicaciones:",
            error
        );

        publicaciones.innerHTML =
            `
            <div class="empty">
                No se pudieron cargar las publicaciones.
            </div>
            `;

    }

}


/* ==========================================
   ESCAPAR HTML
========================================== */

function escaparHTML(valor){

    const div =
        document.createElement("div");

    div.textContent =
        valor ?? "";

    return div.innerHTML;
}


/* ==========================================
   INICIALES
========================================== */

function iniciales(nombre){

    const partes =
        nombre
            .trim()
            .split(/\s+/)
            .filter(Boolean);


    if(partes.length === 0){
        return "U";
    }


    if(partes.length === 1){

        return partes[0]
            .substring(0,2)
            .toUpperCase();

    }


    return (
        partes[0][0] +
        partes[1][0]
    ).toUpperCase();

}


/* ==========================================
   FECHA
========================================== */

function formatearFecha(timestamp){

    if(!timestamp){
        return "";
    }


    try{

        const fecha =
            timestamp.toDate
                ? timestamp.toDate()
                : new Date(timestamp);


        return fecha.toLocaleString(
            "es-AR",
            {
                day:"2-digit",
                month:"2-digit",
                year:"numeric",
                hour:"2-digit",
                minute:"2-digit"
            }
        );


    }catch(error){

        return "";

    }

}

            ),
            datos,

        /* ==========================

        /* ==========================

/* ==========================================
   VALIDAR IMAGEN
========================================== */

function validarImagen(file){

    if(!file){
        return false;
    }


    const maximo =
        5 * 1024 * 1024;


    if(file.size > maximo){

        mostrarToast(
            "La imagen no puede superar los 5 MB."
        );

        return false;
    }


    return true;
}


/* ==========================================
   EXTENSION
========================================== */

function obtenerExtension(file){

    const nombre =
        file.name ||
        "";


    const partes =
        nombre.split(".");


    if(partes.length > 1){

        return partes
            .pop()
            .toLowerCase()
            .replace(
                /[^a-z0-9]/g,
                ""
            );

    }


    if(
        file.type ===
        "image/png"
    ){

        return "png";

    }


    if(
        file.type ===
        "image/webp"
    ){

        return "webp";

    }


    return "jpg";

}


/* ==========================================
   SUBIR IMAGEN
========================================== */

async function subirImagen(
    file,
    tipo
){

    if(!usuarioActual){
        return;
    }


    if(!validarImagen(file)){
        return;
    }


    try{

        uploadBox.classList.add(
            "show"
        );


        progressBar.style.width =
            "0%";


        uploadLabel.textContent =
            tipo === "perfil"
                ? "Subiendo foto de perfil..."
                : "Subiendo foto de portada...";


        const extension =
            obtenerExtension(file);


        const nombreArchivo =
            tipo === "perfil"

                ?

                `foto-perfil-${Date.now()}.${extension}`

                :

                `foto-portada-${Date.now()}.${extension}`;


        const ruta =
            `usuariosRed/${usuarioActual.uid}/${nombreArchivo}`;


        const referencia =
            ref(
                almacenamiento,
                ruta
            );


        const metadata = {

            contentType:
                file.type ||
                "image/jpeg",

            customMetadata:{

                uid:
                    usuarioActual.uid,

                tipo:
                    tipo

            }

        };


        const uploadTask =
            uploadBytesResumable(
                referencia,
                file,
                metadata
            );


        uploadTask.on(

            "state_changed",

            (snapshot) => {

                const progreso =
                    (
                        snapshot.bytesTransferred /
                        snapshot.totalBytes
                    ) * 100;


                progressBar.style.width =
                    `${progreso}%`;

            },


            (error) => {

                console.error(
                    "Error subida:",
                    error
                );

                uploadBox.classList.remove(
                    "show"
                );

                mostrarToast(
                    "No se pudo subir la imagen."
                );

            },


            async () => {

                try{

                    const url =
                        await getDownloadURL(
                            uploadTask.snapshot.ref
                        );


                    /* ==========================
                       FOTO DE PERFIL
                    ========================== */

                    if(
                        tipo === "perfil"
                    ){

                        await setDoc(
                            doc(
                                db,
                                "usuariosRed",
                                usuarioActual.uid
                            ),
                            {
                                fotoPerfil:
                                    url
                            },
                            {
                                merge:true
                            }
                        );


                        perfilActual.fotoPerfil =
                            url;

                    }


                    /* ==========================
                       FOTO DE PORTADA
                    ========================== */

                    if(
                        tipo === "portada"
                    ){

                        await setDoc(
                            doc(
                                db,
                                "usuariosRed",
                                usuarioActual.uid
                            ),
                            {
                                fotoPortada:
                                    url
                            },
                            {
                                merge:true
                            }
                        );


                        perfilActual.fotoPortada =
                            url;

                    }


                    /* ==========================
                       SINCRONIZAR DIRECTORIO
                    ========================== */

                    await sincronizarDirectorio();


                    renderizarPerfil();


                    uploadBox.classList.remove(
                        "show"
                    );


                    mostrarToast(
                        tipo === "perfil"
                            ? "Foto de perfil actualizada."
                            : "Foto de portada actualizada."
                    );


                }catch(error){

                    console.error(
                        "Error guardando URL:",
                        error
                    );


                    uploadBox.classList.remove(
                        "show"
                    );


                    mostrarToast(
                        "La imagen se subió, pero no se pudo actualizar el perfil."
                    );

                }

            }

        );


    }catch(error){

        console.error(
            "Error preparando subida:",
            error
        );


        uploadBox.classList.remove(
            "show"
        );


        mostrarToast(
            "No se pudo iniciar la subida."
        );

    }

}
