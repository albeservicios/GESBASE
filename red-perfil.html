<!DOCTYPE html>
<html lang="es-AR">

<head>

<meta charset="UTF-8">

<meta
    name="viewport"
    content="width=device-width, initial-scale=1.0, viewport-fit=cover"
>

<meta
    name="theme-color"
    content="#111827"
>

>

<title>Perfil - Red GESBASE</title>

<style>

*{
    box-sizing:border-box;
    margin:0;
    padding:0;
}

body{
    font-family:Arial,Helvetica,sans-serif;
    background:#f3f4f6;
    color:#111827;
    min-height:100vh;
    padding-bottom:90px;
}

/* HEADER */

.header{
    position:sticky;
    top:0;
    z-index:100;
    height:64px;
    background:#111827;
    color:#fff;
    display:flex;
    align-items:center;
    justify-content:space-between;
    padding:0 18px;
    box-shadow:0 3px 12px rgba(0,0,0,.18);
}

.header-titulo{
    font-size:20px;
    font-weight:900;
}

.header-boton{
    border:0;
    background:#1f2937;
    color:#fff;
    width:40px;
    height:40px;
    border-radius:12px;
    cursor:pointer;
    font-size:20px;
}

/* CONTENEDOR */

.contenedor{
    width:100%;
    max-width:900px;
    margin:0 auto;
    padding:20px 16px;
}

/* PERFIL */

.perfil-card{
    background:#fff;
    border-radius:22px;
    overflow:hidden;
    box-shadow:0 5px 20px rgba(0,0,0,.08);
}

/* PORTADA */

.portada{
    height:230px;
    background:
        linear-gradient(
            135deg,
            #1e3a8a,
            #4f46e5,
            #7c3aed
        );
    position:relative;
    overflow:hidden;
}

.portada img{
    width:100%;
    height:100%;
    object-fit:cover;
    display:none;
}

.portada-placeholder{
    width:100%;
    height:100%;
    display:flex;
    align-items:center;
    justify-content:center;
    color:rgba(255,255,255,.85);
    font-size:60px;
    font-weight:900;
}

/* FOTO */

.foto-contenedor{
    position:relative;
    margin-top:-70px;
    margin-left:28px;
    width:140px;
    height:140px;
    border-radius:50%;
    border:6px solid #fff;
    background:#e5e7eb;
    overflow:hidden;
    box-shadow:0 5px 20px rgba(0,0,0,.18);
}

.foto-contenedor img{
    width:100%;
    height:100%;
    object-fit:cover;
    display:none;
}

.foto-placeholder{
    width:100%;
    height:100%;
    display:flex;
    align-items:center;
    justify-content:center;
    font-size:55px;
    font-weight:900;
    color:#4f46e5;
    background:#eef2ff;
}

/* INFORMACION */

.informacion{
    padding:14px 28px 28px;
}

.nombre{
    font-size:29px;
    font-weight:900;
    color:#111827;
    margin-top:8px;
}

.tipo{
    display:inline-flex;
    align-items:center;
    margin-top:8px;
    padding:7px 12px;
    border-radius:999px;
    background:#eef2ff;
    color:#4338ca;
    font-size:13px;
    font-weight:800;
}

.descripcion{
    margin-top:18px;
    color:#4b5563;
    line-height:1.6;
    font-size:15px;
}

.datos{
    display:flex;
    flex-wrap:wrap;
    gap:10px;
    margin-top:18px;
}

.dato{
    padding:9px 12px;
    border-radius:11px;
    background:#f3f4f6;
    color:#374151;
    font-size:13px;
    font-weight:700;
}

.estadisticas{
    display:grid;
    grid-template-columns:repeat(2,1fr);
    gap:12px;
    margin-top:22px;
}

.estadistica{
    background:#f9fafb;
    border:1px solid #e5e7eb;
    border-radius:14px;
    padding:16px;
    text-align:center;
}

.estadistica-numero{
    display:block;
    font-size:23px;
    font-weight:900;
    color:#111827;
}

.estadistica-texto{
    display:block;
    margin-top:4px;
    font-size:12px;
    color:#6b7280;
}

/* BOTONES */

.botones{
    display:grid;
    grid-template-columns:1fr 1fr;
    gap:12px;
    margin-top:22px;
}

.boton{
    min-height:48px;
    border:0;
    border-radius:13px;
    padding:0 15px;
    font-size:14px;
    font-weight:800;
    cursor:pointer;
    transition:.2s;
}

.boton:hover{
    transform:translateY(-1px);
}

.boton-principal{
    background:#2563eb;
    color:#fff;
}

.boton-secundario{
    background:#e5e7eb;
    color:#111827;
}

.boton-peligro{
    width:100%;
    margin-top:12px;
    background:#fef2f2;
    color:#b91c1c;
    border:1px solid #fecaca;
}

/* MENSAJE */

.mensaje{
    display:none;
    margin-top:16px;
    padding:12px 14px;
    border-radius:12px;
    font-size:14px;
}

.mensaje.exito{
    display:block;
    background:#ecfdf5;
    color:#047857;
    border:1px solid #a7f3d0;
}

.mensaje.error{
    display:block;
    background:#fef2f2;
    color:#b91c1c;
    border:1px solid #fecaca;
}

/* MODAL */

.modal{
    position:fixed;
    inset:0;
    z-index:300;
    display:none;
    align-items:center;
    justify-content:center;
    padding:18px;
    background:rgba(0,0,0,.6);
}

.modal.activo{
    display:flex;
}

.modal-card{
    width:100%;
    max-width:600px;
    max-height:90vh;
    overflow:auto;
    background:#fff;
    border-radius:22px;
    padding:24px;
    box-shadow:0 25px 70px rgba(0,0,0,.3);
}

.modal-header{
    display:flex;
    align-items:center;
    justify-content:space-between;
    margin-bottom:22px;
}

.modal-titulo{
    font-size:23px;
    font-weight:900;
}

.cerrar{
    border:0;
    background:#f3f4f6;
    width:40px;
    height:40px;
    border-radius:10px;
    cursor:pointer;
    font-size:20px;
}

.campo{
    margin-bottom:16px;
}

.campo label{
    display:block;
    font-size:13px;
    font-weight:800;
    color:#374151;
    margin-bottom:7px;
}

.campo input,
.campo select,
.campo textarea{
    width:100%;
    border:1px solid #d1d5db;
    border-radius:12px;
    padding:12px 13px;
    font-family:Arial,Helvetica,sans-serif;
    font-size:15px;
    color:#111827;
    background:#fff;
    outline:none;
}

.campo input,
.campo select{
    height:48px;
}

.campo textarea{
    min-height:120px;
    resize:vertical;
}

.campo input:focus,
.campo select:focus,
.campo textarea:focus{
    border-color:#2563eb;
    box-shadow:0 0 0 3px rgba(37,99,235,.12);
}

.modal-botones{
    display:grid;
    grid-template-columns:1fr 1fr;
    gap:12px;
    margin-top:20px;
}

/* PUBLICACIONES */

.seccion{
    margin-top:20px;
}

.seccion-titulo{
    font-size:20px;
    font-weight:900;
    margin-bottom:12px;
}

.publicaciones-vacio{
    background:#fff;
    border-radius:18px;
    padding:28px 20px;
    text-align:center;
    color:#6b7280;
    box-shadow:0 5px 20px rgba(0,0,0,.06);
}

/* LOADING */

.cargando{
    background:#fff;
    border-radius:18px;
    padding:35px 20px;
    text-align:center;
    color:#6b7280;
}

/* NAV */

.nav-inferior{
    position:fixed;
    left:0;
    right:0;
    bottom:0;
    z-index:200;
    height:76px;
    background:#111827;
    display:grid;
    grid-template-columns:repeat(5,1fr);
    box-shadow:0 -5px 20px rgba(0,0,0,.2);
}

.nav-item{
    border:0;
    background:transparent;
    color:#9ca3af;
    display:flex;
    flex-direction:column;
    align-items:center;
    justify-content:center;
    gap:4px;
    cursor:pointer;
    font-size:11px;
    font-weight:700;
}

.nav-item span:first-child{
    font-size:21px;
}

.nav-item.activo{
    color:#fff;
}

/* TOAST */

.toast{
    position:fixed;
    left:50%;
    bottom:95px;
    transform:translateX(-50%) translateY(20px);
    background:#111827;
    color:#fff;
    padding:12px 16px;
    border-radius:12px;
    font-size:14px;
    font-weight:700;
    opacity:0;
    pointer-events:none;
    transition:.25s;
    z-index:500;
    max-width:90%;
    text-align:center;
}

.toast.mostrar{
    opacity:1;
    transform:translateX(-50%) translateY(0);
}

/* RESPONSIVE */

@media(max-width:600px){

    .header{
        height:60px;
        padding:0 14px;
    }

    .header-titulo{
        font-size:18px;
    }

    .contenedor{
        padding:12px 10px;
    }

    .portada{
        height:175px;
    }

    .foto-contenedor{
        width:112px;
        height:112px;
        margin-top:-56px;
        margin-left:18px;
    }

    .foto-placeholder{
        font-size:42px;
    }

    .informacion{
        padding:10px 18px 22px;
    }

    .nombre{
        font-size:24px;
    }

    .estadisticas{
        grid-template-columns:1fr 1fr;
    }

    .botones{
        grid-template-columns:1fr;
    }

    .modal-card{
        padding:20px 16px;
        border-radius:18px;
    }

}

@media(min-width:900px){

    .contenedor{
        padding-top:28px;
    }

    .perfil-card{
        box-shadow:0 10px 35px rgba(0,0,0,.08);
    }

}

</style>

</head>

<script type="module">

import { auth, db } from "./Js/firebase.js";

import {
    onAuthStateChanged,
    signOut
} from "https://www.gstatic.com/firebasejs/12.18.0/firebase-auth.js";

import {
    doc,
    getDoc,
    setDoc,
    collection,
    query,
    where,
    getDocs
} from "https://www.gstatic.com/firebasejs/12.18.0/firebase-firestore.js";


/* ELEMENTOS */

const cargando =
    document.getElementById("cargando");

const perfilCard =
    document.getElementById("perfilCard");

const nombreCompleto =
    document.getElementById("nombreCompleto");

const tipoPerfil =
    document.getElementById("tipoPerfil");

const descripcion =
    document.getElementById("descripcion");

const datos =
    document.getElementById("datos");

const fotoPerfil =
    document.getElementById("fotoPerfil");

const fotoPlaceholder =
    document.getElementById("fotoPlaceholder");

const fotoPortada =
    document.getElementById("fotoPortada");

const portadaPlaceholder =
    document.getElementById("portadaPlaceholder");

const cantidadConexiones =
    document.getElementById("cantidadConexiones");

const cantidadPublicaciones =
    document.getElementById("cantidadPublicaciones");

const modalEditar =
    document.getElementById("modalEditar");

const formEditar =
    document.getElementById("formEditar");

const mensaje =
    document.getElementById("mensaje");

const mensajeEditar =
    document.getElementById("mensajeEditar");

const publicaciones =
    document.getElementById("publicaciones");

let usuarioActual = null;
let perfilActual = null;


/* TOAST */

function mostrarToast(texto){

    const toast =
        document.getElementById("toast");

    toast.textContent = texto;

    toast.classList.add("mostrar");

    setTimeout(() => {

        toast.classList.remove("mostrar");

    }, 2500);

}


/* MENSAJE */

function mostrarMensaje(texto,tipo){

    mensaje.textContent = texto;

    mensaje.className =
        "mensaje " + tipo;

}


/* MENSAJE MODAL */

function mostrarMensajeEditar(texto,tipo){

    mensajeEditar.textContent = texto;

    mensajeEditar.className =
        "mensaje " + tipo;

}


/* TIPO */

function traducirTipo(tipo){

    const tipos = {

        persona:"Persona",

        profesional:"Profesional",

        trabajador:"Trabajador",

        empresa:"Empresa",

        comercio:"Comercio",

        otro:"Otro"

    };

    return tipos[tipo] || tipo || "Usuario GESBASE";

}


/* INICIALES */

function obtenerIniciales(nombre){

    if(!nombre){

        return "RG";

    }

    const partes =
        nombre.trim().split(/\s+/);

    if(partes.length === 1){

        return partes[0]
            .substring(0,2)
            .toUpperCase();

    }

    return (
        partes[0].charAt(0) +
        partes[partes.length - 1].charAt(0)
    ).toUpperCase();

}


/* CARGAR PERFIL */

async function cargarPerfil(){

    if(!usuarioActual){

        return;

    }

    try{

        const referencia =
            doc(
                db,
                "usuariosRed",
                usuarioActual.uid
            );

        const snapshot =
            await getDoc(referencia);

        if(!snapshot.exists()){

            await crearPerfilBasico();

            return;

        }

        perfilActual =
            snapshot.data();

        mostrarPerfil();

        await cargarEstadisticas();

        await cargarPublicaciones();

    }catch(error){

        console.error(
            "Error cargando perfil:",
            error
        );

        cargando.style.display =
            "block";

        cargando.textContent =
            "No se pudo cargar el perfil.";

    }

}


/* CREAR PERFIL BASICO */

async function crearPerfilBasico(){

    const nombre =
        usuarioActual.displayName ||
        "Usuario GESBASE";

    perfilActual = {

        uid:usuarioActual.uid,

        nombre:nombre.split(" ")[0],

        apellido:nombre.split(" ").slice(1).join(" "),

        nombreCompleto:nombre,

        email:
            usuarioActual.email || "",

        tipoPerfil:"persona",

        descripcion:"",

        rubro:"",

        localidad:"",

        provincia:"",

        fotoPerfil:
            usuarioActual.photoURL || "",

        fotoPortada:"",

        visible:true,

        estado:"activo"

    };

    await setDoc(
        doc(
            db,
            "usuariosRed",
            usuarioActual.uid
        ),
        perfilActual,
        {merge:true}
    );

    mostrarPerfil();

    await cargarEstadisticas();

    await cargarPublicaciones();

}


/* MOSTRAR PERFIL */

function mostrarPerfil(){

    cargando.style.display =
        "none";

    perfilCard.style.display =
        "block";


    const nombre =
        perfilActual.nombreCompleto ||
        `${perfilActual.nombre || ""} ${perfilActual.apellido || ""}`.trim() ||
        "Usuario GESBASE";


    nombreCompleto.textContent =
        nombre;


    tipoPerfil.textContent =
        traducirTipo(
            perfilActual.tipoPerfil
        );


    const textoDescripcion =
        perfilActual.descripcion?.trim();


    if(textoDescripcion){

        descripcion.textContent =
            textoDescripcion;

    }else{

        descripcion.textContent =
            "Todavía no agregaste una descripción.";

    }


    datos.innerHTML = "";


    if(perfilActual.rubro){

        agregarDato(
            "🔧",
            perfilActual.rubro
        );

    }


    if(perfilActual.localidad){

        agregarDato(
            "📍",
            perfilActual.localidad
        );

    }


    if(perfilActual.provincia){

        agregarDato(
            "🗺️",
            perfilActual.provincia
        );

    }


    if(perfilActual.email){

        agregarDato(
            "✉️",
            perfilActual.email
        );

    }


    const iniciales =
        obtenerIniciales(nombre);


    fotoPlaceholder.textContent =
        iniciales;


    if(perfilActual.fotoPerfil){

        fotoPerfil.src =
            perfilActual.fotoPerfil;

        fotoPerfil.style.display =
            "block";

        fotoPlaceholder.style.display =
            "none";

        fotoPerfil.onerror = () => {

            fotoPerfil.style.display =
                "none";

            fotoPlaceholder.style.display =
                "flex";

        };

    }else{

        fotoPerfil.style.display =
            "none";

        fotoPlaceholder.style.display =
            "flex";

    }


    if(perfilActual.fotoPortada){

        fotoPortada.src =
            perfilActual.fotoPortada;

        fotoPortada.style.display =
            "block";

        portadaPlaceholder.style.display =
            "none";

        fotoPortada.onerror = () => {

            fotoPortada.style.display =
                "none";

            portadaPlaceholder.style.display =
                "flex";

        };

    }else{

        fotoPortada.style.display =
            "none";

        portadaPlaceholder.style.display =
            "flex";

    }

}


/* DATO */

function agregarDato(icono,texto){

    const elemento =
        document.createElement("div");

    elemento.className =
        "dato";

    elemento.textContent =
        `${icono} ${texto}`;

    datos.appendChild(elemento);

}


/* ESTADISTICAS */

async function cargarEstadisticas(){

    try{

        const conexionesEnviadas =
            await getDocs(
                query(
                    collection(db,"conexiones"),
                    where(
                        "emisor",
                        "==",
                        usuarioActual.uid
                    )
                )
            );


        const conexionesRecibidas =
            await getDocs(
                query(
                    collection(db,"conexiones"),
                    where(
                        "receptor",
                        "==",
                        usuarioActual.uid
                    )
                )
            );


        const ids =
            new Set();


        conexionesEnviadas.forEach((item) => {

            const data =
                item.data();

            if(data.estado === "aceptada"){

                const otro =
                    data.receptor;

                if(otro &&
                   otro !== usuarioActual.uid){

                    ids.add(otro);

                }

            }

        });


        conexionesRecibidas.forEach((item) => {

            const data =
                item.data();

            if(data.estado === "aceptada"){

                const otro =
                    data.emisor;

                if(otro &&
                   otro !== usuarioActual.uid){

                    ids.add(otro);

                }

            }

        });


        cantidadConexiones.textContent =
            ids.size;


    }catch(error){

        console.error(
            "Error contando conexiones:",
            error
        );

        cantidadConexiones.textContent =
            "0";

    }


    try{

        const resultado =
            await getDocs(
                query(
                    collection(db,"publicaciones"),
                    where(
                        "uid",
                        "==",
                        usuarioActual.uid
                    )
                )
            );


        cantidadPublicaciones.textContent =
            resultado.size;


    }catch(error){

        console.error(
            "Error contando publicaciones:",
            error
        );

        cantidadPublicaciones.textContent =
            "0";

    }

}


/* PUBLICACIONES */

async function cargarPublicaciones(){

    try{

        const resultado =
            await getDocs(
                query(
                    collection(db,"publicaciones"),
                    where(
                        "uid",
                        "==",
                        usuarioActual.uid
                    )
                )
            );


        if(resultado.empty){

            publicaciones.textContent =
                "Todavía no publicaste nada.";

            return;

        }


        const lista = [];


        resultado.forEach((item) => {

            lista.push({

                id:item.id,

                ...item.data()

            });

        });


        lista.sort((a,b) => {

            const fechaA =
                a.fecha?.toMillis ?
                a.fecha.toMillis() :
                0;

            const fechaB =
                b.fecha?.toMillis ?
                b.fecha.toMillis() :
                0;

            return fechaB - fechaA;

        });


        publicaciones.innerHTML = "";


        lista.forEach((item) => {

            const tarjeta =
                document.createElement("div");

            tarjeta.style.background =
                "#fff";

            tarjeta.style.borderRadius =
                "18px";

            tarjeta.style.padding =
                "18px";

            tarjeta.style.marginBottom =
                "12px";

            tarjeta.style.boxShadow =
                "0 5px 20px rgba(0,0,0,.06)";


            const texto =
                document.createElement("div");

            texto.textContent =
                item.texto || "";

            texto.style.lineHeight =
                "1.6";

            texto.style.color =
                "#374151";

            texto.style.whiteSpace =
                "pre-wrap";


            const fecha =
                document.createElement("div");

            fecha.style.marginTop =
                "12px";

            fecha.style.fontSize =
                "12px";

            fecha.style.color =
                "#9ca3af";

            fecha.textContent =
                formatearFecha(item.fecha);


            tarjeta.appendChild(texto);

            tarjeta.appendChild(fecha);

            publicaciones.appendChild(tarjeta);

        });


    }catch(error){

        console.error(
            "Error cargando publicaciones:",
            error
        );

        publicaciones.textContent =
            "No se pudieron cargar tus publicaciones.";

    }

}


/* FECHA */

function formatearFecha(timestamp){

    if(!timestamp){

        return "";

    }

    try{

        const fecha =
            timestamp.toDate();

        return fecha.toLocaleString(
            "es-AR",
            {
                dateStyle:"medium",
                timeStyle:"short"
            }
        );

    }catch(error){

        return "";

    }

}

/* GUARDAR */

formEditar.addEventListener(
    "submit",
    async (event) => {

        event.preventDefault();


        const nombre =
            document.getElementById(
                "editarNombre"
            ).value.trim();


        const apellido =
            document.getElementById(
                "editarApellido"
            ).value.trim();


        const tipo =
            document.getElementById(
                "editarTipo"
            ).value;


        const rubro =
            document.getElementById(
                "editarRubro"
            ).value.trim();


        const localidad =
            document.getElementById(
                "editarLocalidad"
            ).value.trim();


        const provincia =
            document.getElementById(
                "editarProvincia"
            ).value.trim();


        const descripcionTexto =
            document.getElementById(
                "editarDescripcion"
            ).value.trim();


        const foto =
            document.getElementById(
                "editarFotoPerfil"
            ).value.trim();


        const portada =
            document.getElementById(
                "editarFotoPortada"
            ).value.trim();


        if(!nombre || !apellido){

            mostrarMensajeEditar(
                "Completá nombre y apellido.",
                "error"
            );

            return;

        }


        const nuevoNombreCompleto =
            `${nombre} ${apellido}`.trim();


        const btnGuardar =
            document.getElementById(
                "btnGuardar"
            );


        btnGuardar.disabled =
            true;

        btnGuardar.textContent =
            "Guardando...";


        try{

            const datosActualizar = {

                nombre:

                    nombre,

                apellido:

                    apellido,

                nombreCompleto:

                    nuevoNombreCompleto,

                tipoPerfil:

                    tipo,

                rubro:

                    rubro,

                localidad:

                    localidad,

                provincia:

                    provincia,

                descripcion:

                    descripcionTexto,

                fotoPerfil:

                    foto,

                fotoPortada:

                    portada

            };


            await setDoc(
                doc(
                    db,
                    "usuariosRed",
                    usuarioActual.uid
                ),
                datosActualizar,
                {
                    merge:true
                }
            );


            perfilActual = {

                ...perfilActual,

                ...datosActualizar

            };


            try{

                /*
                 * Actualizamos también el nombre visible
                 * de Firebase Authentication.
                 */

                await usuarioActual.updateProfile({

                    displayName:
                        nuevoNombreCompleto

                });

            }catch(error){

                console.warn(
                    "No se pudo actualizar displayName:",
                    error
                );

            }


            mostrarPerfil();

            cerrarModal();

            mostrarToast(
                "Perfil actualizado correctamente."
            );


        }catch(error){

            console.error(
                "Error guardando perfil:",
                error
            );


            mostrarMensajeEditar(
                "No se pudieron guardar los cambios. Intentá nuevamente.",
                "error"
            );


        }finally{

            btnGuardar.disabled =
                false;

            btnGuardar.textContent =
                "💾 Guardar cambios";

        }

    }
);

document.getElementById(
    "btnCerrarSesion"
).addEventListener(
    "click",
    async () => {

        const confirmar =
            confirm(
                "¿Querés cerrar sesión de Red GESBASE?"
            );


        if(!confirmar){

            return;

        }


        try{

            await signOut(auth);

            window.location.href =
                "red-login.html";

        }catch(error){

            console.error(
                "Error cerrando sesión:",
                error
            );

            mostrarMensaje(
                "No se pudo cerrar la sesión.",
                "error"
            );

        }

    }
);


/* AUTENTICACION */

onAuthStateChanged(
    auth,
    async (user) => {

        if(!user){

            window.location.href =
                "red-login.html";

            return;

        }


        usuarioActual =
            user;


        await cargarPerfil();

    }
);
