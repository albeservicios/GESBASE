<!DOCTYPE html>
<html lang="es-AR">
<head>
<meta charset="UTF-8">

<meta
    name="viewport"

>

<meta name="theme-color" content="#12343B">

<meta
    name="description"
    content="Perfil de usuario de la Red GESBASE."
>

<title>Perfil - Red GESBASE</title>

<style>
*{
    box-sizing:border-box;
    margin:0;
    padding:0;
}

body{
    font-family:Arial,Helvetica,sans-serif;
    background:#f3f6f7;
    color:#1f2937;
    min-height:100vh;
    padding-bottom:80px;
}

header{
    position:sticky;
    top:0;
    z-index:100;
    background:#12343B;
    color:white;
    height:60px;
    display:flex;
    align-items:center;
    justify-content:space-between;
    padding:0 16px;
    box-shadow:0 2px 8px rgba(0,0,0,.18);
}

.header-left{
    display:flex;
    align-items:center;
    gap:10px;
}

.btn-back{
    border:none;
    background:transparent;
    color:white;
    font-size:26px;
    cursor:pointer;
    padding:4px 8px;
}

.logo-text{
    font-size:20px;
    font-weight:700;
}

.btn-exit{
    border:none;
    background:#ffffff18;
    color:white;
    padding:8px 12px;
    border-radius:8px;
    cursor:pointer;
    font-size:13px;
}

main{
    width:100%;
    max-width:850px;
    margin:0 auto;
}

.profile-cover{
    height:180px;
    background:linear-gradient(135deg,#12343B,#1d5661);
    position:relative;
}

.profile-main{
    background:white;
    padding:0 20px 24px;
}

.profile-avatar-wrap{
    position:relative;
    margin-top:-65px;
    width:130px;
    height:130px;
}

.profile-avatar{
    width:130px;
    height:130px;
    border-radius:50%;
    object-fit:cover;
    background:#e5e7eb;
    border:5px solid white;
    display:block;
}

.camera-btn{
    position:absolute;
    right:2px;
    bottom:5px;
    width:38px;
    height:38px;
    border:none;
    border-radius:50%;
    background:#12343B;
    color:white;
    cursor:pointer;
    font-size:18px;
    box-shadow:0 2px 8px rgba(0,0,0,.25);
}

.profile-name{
    margin-top:12px;
    font-size:27px;
    font-weight:700;
    color:#12343B;
}

.profile-company{
    margin-top:6px;
    font-size:16px;
    color:#4b5563;
}

.profile-rubro{
    display:inline-block;
    margin-top:10px;
    background:#e7f1f3;
    color:#12343B;
    padding:7px 12px;
    border-radius:20px;
    font-size:13px;
    font-weight:600;
}

.profile-actions{
    display:flex;
    flex-wrap:wrap;
    gap:10px;
    margin-top:20px;
}

.action-btn{
    border:none;
    border-radius:9px;
    padding:11px 16px;
    font-size:14px;
    font-weight:600;
    cursor:pointer;
}

.btn-message{
    background:#12343B;
    color:white;
}

.btn-connect{
    background:#e8f1f3;
    color:#12343B;
}

.btn-edit{
    background:#eef2f7;
    color:#374151;
}

.info-card{
    background:white;
    margin-top:12px;
    padding:20px;
}

.info-title{
    font-size:19px;
    font-weight:700;
    margin-bottom:16px;
    color:#12343B;
}

.info-row{
    padding:12px 0;
    border-bottom:1px solid #edf0f2;
}

.info-row:last-child{
    border-bottom:none;
}

.info-label{
    font-size:12px;
    color:#6b7280;
    margin-bottom:4px;
}

.info-value{
    font-size:15px;
    color:#1f2937;
    word-break:break-word;
}

.stats{
    display:grid;
    grid-template-columns:repeat(3,1fr);
    gap:10px;
    margin-top:12px;
}

.stat{
    background:white;
    padding:18px 10px;
    text-align:center;
}

.stat-number{
    font-size:22px;
    font-weight:700;
    color:#12343B;
}

.stat-label{
    margin-top:5px;
    font-size:12px;
    color:#6b7280;
}

.loading{
    padding:40px 20px;
    text-align:center;
    color:#6b7280;
}

.error{
    margin:20px;
    padding:16px;
    border-radius:10px;
    background:#fee2e2;
    color:#991b1b;
}

.hidden{
    display:none !important;
}

input[type="file"]{
    display:none;
}

.bottom-nav{
    position:fixed;
    bottom:0;
    left:0;
    right:0;
    z-index:200;
    height:68px;
    background:white;
    border-top:1px solid #e5e7eb;
    display:flex;
    justify-content:space-around;
    align-items:center;
    box-shadow:0 -2px 10px rgba(0,0,0,.08);
}

.nav-item{
    border:none;
    background:transparent;
    color:#6b7280;
    font-size:11px;
    text-align:center;
    cursor:pointer;
    min-width:60px;
}

.nav-item span{
    display:block;
    font-size:22px;
    margin-bottom:2px;
}

.nav-item.active{
    color:#12343B;
    font-weight:700;
}

@media(min-width:768px){
    body{
        padding-bottom:20px;
    }

    .bottom-nav{
        position:static;
        max-width:850px;
        margin:12px auto 0;
        border:1px solid #e5e7eb;
        border-radius:12px;
        box-shadow:none;
    }

    .profile-cover{
        height:230px;
    }

    .profile-main{
        padding-left:30px;
        padding-right:30px;
    }
}
</style>
</head>

<script type="module">

import {
    onAuthStateChanged,
    signOut
} from "https://www.gstatic.com/firebasejs/12.18.0/firebase-auth.js";

import {
    doc,
    getDoc,
    collection,
    query,
    where,
    getDocs,
    updateDoc,
    serverTimestamp
} from "https://www.gstatic.com/firebasejs/12.18.0/firebase-firestore.js";

import {
    ref,
    uploadBytes,
    getDownloadURL
} from "https://www.gstatic.com/firebasejs/12.18.0/firebase-storage.js";

import {
    auth,
    db,
    almacenamiento
} from "./Js/firebase.js";


/* =========================================================
   ELEMENTOS
========================================================= */

const cargando =
    document.getElementById("cargando");

const perfil =
    document.getElementById("perfil");

const errorBox =
    document.getElementById("error");

const avatar =
    document.getElementById("avatar");

const nombreCompleto =
    document.getElementById("nombreCompleto");

const empresa =
    document.getElementById("empresa");

const rubro =
    document.getElementById("rubro");

const infoNombre =
    document.getElementById("infoNombre");

const infoEmpresa =
    document.getElementById("infoEmpresa");

const infoRubro =
    document.getElementById("infoRubro");

const filaRubro =
    document.getElementById("filaRubro");

const filaTelefono =
    document.getElementById("filaTelefono");

const infoTelefono =
    document.getElementById("infoTelefono");

const cameraContainer =
    document.getElementById("cameraContainer");

const fotoInput =
    document.getElementById("fotoInput");

const btnMensaje =
    document.getElementById("btnMensaje");

const btnConexion =
    document.getElementById("btnConexion");

const btnEditar =
    document.getElementById("btnEditar");

const cantidadConexiones =
    document.getElementById("cantidadConexiones");

const cantidadPublicaciones =
    document.getElementById("cantidadPublicaciones");

const cantidadEmpleos =
    document.getElementById("cantidadEmpleos");


/* =========================================================
   DATOS
========================================================= */

let usuarioActual = null;

let uidPerfil = null;

let perfilActual = null;


/* =========================================================
   URL
========================================================= */

const parametros =
    new URLSearchParams(
        window.location.search
    );

const uidSolicitado =
    parametros.get("uid");


/* =========================================================
   AVATAR
========================================================= */

function avatarIniciales(nombre){

    if(!nombre){
        return "U";
    }

    const partes =
        nombre
            .trim()
            .split(/\s+/)
            .filter(Boolean);

    if(partes.length === 1){
        return partes[0]
            .substring(0,1)
            .toUpperCase();
    }

    return (
        partes[0].substring(0,1) +
        partes[1].substring(0,1)
    ).toUpperCase();
}


function crearAvatar(nombre){

    const iniciales =
        avatarIniciales(nombre);

    const canvas =
        document.createElement("canvas");

    canvas.width = 300;
    canvas.height = 300;

    const ctx =
        canvas.getContext("2d");

    ctx.fillStyle = "#12343B";

    ctx.fillRect(
        0,
        0,
        300,
        300
    );

    ctx.fillStyle = "#ffffff";

    ctx.font =
        "bold 105px Arial";

    ctx.textAlign =
        "center";

    ctx.textBaseline =
        "middle";

    ctx.fillText(
        iniciales,
        150,
        150
    );

    return canvas.toDataURL("image/png");
}


/* =========================================================
   MOSTRAR ERROR
========================================================= */

function mostrarError(mensaje){

    cargando.classList.add("hidden");

    perfil.classList.add("hidden");

    errorBox.textContent =
        mensaje;

    errorBox.classList.remove("hidden");
}


/* =========================================================
   CARGAR PERFIL
========================================================= */

async function cargarPerfil(uid){

    try{

        uidPerfil = uid;

        /*
         * PERFIL PROPIO
         *
         * usuarios/{uid} es la fuente
         * principal de datos de GESBASE.
         */

        if(uid === usuarioActual.uid){

            const referencia =
                doc(
                    db,
                    "usuarios",
                    uid
                );

            const snap =
                await getDoc(referencia);

            if(!snap.exists()){

                throw new Error(
                    "No se encontró tu perfil de GESBASE."
                );
            }

            perfilActual =
                snap.data();

        }

        /*
         * PERFIL DE OTRA PERSONA
         *
         * No intentamos leer directamente
         * usuarios/{otroUid}, porque las reglas
         * actuales protegen esos documentos.
         *
         * Para la Red utilizamos el directorio
         * público generado desde el mismo usuario.
         */

        else{

            const referencia =
                doc(
                    db,
                    "directorio_red",
                    uid
                );

            const snap =
                await getDoc(referencia);

            if(!snap.exists()){

                throw new Error(
                    "No se encontró el perfil público de esta persona."
                );
            }

            perfilActual =
                snap.data();
        }


        pintarPerfil();

        await cargarEstadisticas();

        if(uid !== usuarioActual.uid){

            btnMensaje.classList.remove("hidden");

            btnConexion.classList.remove("hidden");

        }else{

            btnEditar.classList.remove("hidden");

            cameraContainer.classList.remove("hidden");

        }

        cargando.classList.add("hidden");

        perfil.classList.remove("hidden");

    }catch(error){

        console.error(
            "Error cargando perfil:",
            error
        );

        mostrarError(
            error.message ||
            "No se pudo cargar el perfil."
        );
    }
}


/* =========================================================
   PINTAR PERFIL
========================================================= */

function pintarPerfil(){

    const nombre =
        perfilActual.nombreCompleto ||
        (
            (perfilActual.nombre || "") +
            " " +
            (perfilActual.apellido || "")
        ).trim() ||
        "Usuario GESBASE";

    const nombreEmpresa =
        perfilActual.nombreEmpresa ||
        perfilActual.empresa ||
        "";

    const rubroTexto =
        perfilActual.rubro ||
        perfilActual.tipoNegocio ||
        "";


    nombreCompleto.textContent =
        nombre;

    empresa.textContent =
        nombreEmpresa;

    infoNombre.textContent =
        nombre;

    infoEmpresa.textContent =
        nombreEmpresa ||
        "Sin empresa informada";


    if(rubroTexto){

        rubro.textContent =
            rubroTexto;

        rubro.classList.remove(
            "hidden"
        );

        infoRubro.textContent =
            rubroTexto;

    }else{

        rubro.classList.add(
            "hidden"
        );

        filaRubro.classList.add(
            "hidden"
        );
    }


    /*
     * El teléfono se muestra
     * únicamente en el perfil propio.
     */

    if(
        uidPerfil === usuarioActual.uid &&
        perfilActual.telefono
    ){

        infoTelefono.textContent =
            perfilActual.telefono;

        filaTelefono.classList.remove(
            "hidden"
        );

    }else{

        filaTelefono.classList.add(
            "hidden"
        );
    }


    const foto =
        perfilActual.fotoPerfil ||
        perfilActual.photoURL ||
        perfilActual.foto ||
        "";

    if(foto){

        avatar.src = foto;

    }else{

        avatar.src =
            crearAvatar(nombre);
    }

}


/* =========================================================
   ESTADÍSTICAS
========================================================= */

async function cargarEstadisticas(){

    try{

        /*
         * CONEXIONES
         */

        const enviadasQuery =
            query(
                collection(db,"conexiones"),
                where(
                    "emisor",
                    "==",
                    uidPerfil
                )
            );

        const recibidasQuery =
            query(
                collection(db,"conexiones"),
                where(
                    "receptor",
                    "==",
                    uidPerfil
                )
            );

        const [
            enviadasSnap,
            recibidasSnap
        ] =
            await Promise.all([
                getDocs(enviadasQuery),
                getDocs(recibidasQuery)
            ]);

        const conexiones =
            new Set();

        enviadasSnap.forEach(docSnap => {

            const data =
                docSnap.data();

            if(
                data.estado === "aceptada" &&
                data.receptor
            ){

                conexiones.add(
                    data.receptor
                );
            }
        });

        recibidasSnap.forEach(docSnap => {

            const data =
                docSnap.data();

            if(
                data.estado === "aceptada" &&
                data.emisor
            ){

                conexiones.add(
                    data.emisor
                );
            }
        });

        cantidadConexiones.textContent =
            conexiones.size;


        /*
         * PUBLICACIONES
         */

        try{

            const publicacionesQuery =
                query(
                    collection(
                        db,
                        "publicaciones"
                    ),
                    where(
                        "uid",
                        "==",
                        uidPerfil
                    )
                );

            const publicacionesSnap =
                await getDocs(
                    publicacionesQuery
                );

            cantidadPublicaciones.textContent =
                publicacionesSnap.size;

        }catch(e){

            cantidadPublicaciones.textContent =
                "0";
        }


        /*
         * EMPLEOS
         */

        try{

            const empleosQuery =
                query(
                    collection(
                        db,
                        "empleos"
                    ),
                    where(
                        "uid",
                        "==",
                        uidPerfil
                    )
                );

            const empleosSnap =
                await getDocs(
                    empleosQuery
                );

            cantidadEmpleos.textContent =
                empleosSnap.size;

        }catch(e){

            cantidadEmpleos.textContent =
                "0";
        }

    }catch(error){

        console.warn(
            "No se pudieron cargar estadísticas:",
            error
        );
    }
}


/* =========================================================
   EDITAR PERFIL
========================================================= */

btnEditar.addEventListener(
    "click",
    () => {

        if(
            usuarioActual &&
            uidPerfil === usuarioActual.uid
        ){

            window.location.href =
                "perfil.html";
        }
    }
);


/* =========================================================
   MENSAJE
========================================================= */

btnMensaje.addEventListener(
    "click",
    () => {

        if(!uidPerfil) return;

        window.location.href =
            "mensajes.html?usuario=" +
            encodeURIComponent(
                uidPerfil
            );
    }
);


/* =========================================================
   CONEXIÓN
========================================================= */

btnConexion.addEventListener(
    "click",
    async () => {

        if(
            !usuarioActual ||
            !uidPerfil ||
            uidPerfil === usuarioActual.uid
        ){

            return;
        }

        btnConexion.disabled =
            true;

        btnConexion.textContent =
            "Enviando...";

        try{

            const conexionesEnviadas =
                query(
                    collection(
                        db,
                        "conexiones"
                    ),
                    where(
                        "emisor",
                        "==",
                        usuarioActual.uid
                    ),
                    where(
                        "receptor",
                        "==",
                        uidPerfil
                    )
                );

            const snapshot =
                await getDocs(
                    conexionesEnviadas
                );

            if(!snapshot.empty){

                btnConexion.textContent =
                    "Solicitud enviada";

                return;
            }


            /*
             * Se utiliza una importación dinámica
             * para mantener el código principal limpio.
             */

            const {
                addDoc
            } = await import(
                "https://www.gstatic.com/firebasejs/12.18.0/firebase-firestore.js"
            );


            await addDoc(
                collection(
                    db,
                    "conexiones"
                ),
                {
                    emisor:
                        usuarioActual.uid,

                    receptor:
                        uidPerfil,

                    estado:
                        "pendiente",

                    fecha:
                        serverTimestamp(),

                    fechaCliente:
                        Date.now()
                }
            );


            btnConexion.textContent =
                "Solicitud enviada";

        }catch(error){

            console.error(
                error
            );

            btnConexion.disabled =
                false;

            btnConexion.textContent =
                "👥 Conectar";

            alert(
                "No se pudo enviar la solicitud."
            );
        }

    }
);


/* =========================================================
   SUBIR FOTO
========================================================= */

fotoInput.addEventListener(
    "change",
    async event => {

        const archivo =
            event.target.files?.[0];

        if(
            !archivo ||
            !usuarioActual ||
            uidPerfil !== usuarioActual.uid
        ){

            return;
        }

        try{

            cameraContainer.textContent =
                "⏳";

            const ruta =
                ref(
                    almacenamiento,
                    `perfiles/${usuarioActual.uid}/foto-perfil`
                );

            await uploadBytes(
                ruta,
                archivo
            );

            const url =
                await getDownloadURL(
                    ruta
                );


            await updateDoc(
                doc(
                    db,
                    "usuarios",
                    usuarioActual.uid
                ),
                {
                    fotoPerfil:
                        url,

                    fotoPerfilActualizada:
                        serverTimestamp()
                }
            );


            avatar.src =
                url;

            /*
             * El directorio es únicamente una
             * proyección pública del mismo perfil.
             */

            try{

                await updateDoc(
                    doc(
                        db,
                        "directorio_red",
                        usuarioActual.uid
                    ),
                    {
                        fotoPerfil:
                            url,

                        fotoPerfilActualizada:
                            serverTimestamp()
                    }
                );

            }catch(e){

                console.warn(
                    "No se actualizó el directorio público:",
                    e
                );
            }


            cameraContainer.textContent =
                "📷";

            alert(
                "Foto de perfil actualizada."
            );

        }catch(error){

            console.error(
                error
            );

            cameraContainer.textContent =
                "📷";

            alert(
                "No se pudo subir la foto."
            );
        }

    }
);


/* =========================================================
   VOLVER
========================================================= */

document
    .getElementById("btnVolver")
    .addEventListener(
        "click",
        () => {

            if(
                document.referrer &&
                document.referrer.includes(
                    window.location.host
                )
            ){

                history.back();

            }else{

                window.location.href =
                    "red.html";
            }
        }
    );


/* =========================================================
   SALIR
========================================================= */

document
    .getElementById("btnSalir")
    .addEventListener(
        "click",
        async () => {

            try{

                await signOut(auth);

                window.location.href =
                    "login.html";

            }catch(error){

                console.error(
                    error
                );
            }
        }
    );


/* =========================================================
   NAVEGACIÓN
========================================================= */

window.irA =
    function(pagina){

        window.location.href =
            pagina;
    };


/* =========================================================
   AUTENTICACIÓN
========================================================= */

onAuthStateChanged(
    auth,
    async usuario => {

        if(!usuario){

            window.location.href =
                "login.html";

            return;
        }

        usuarioActual =
            usuario;

        /*
         * Si no viene ?uid=...
         * mostramos automáticamente
         * el perfil del usuario conectado.
         */

        const uidObjetivo =
            uidSolicitado ||
            usuario.uid;

        await cargarPerfil(
            uidObjetivo
        );
    }
);

</script>
