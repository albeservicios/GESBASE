<!DOCTYPE html>
<html lang="es">

<head>

<meta charset="UTF-8">

<meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
>

<meta
    name="theme-color"
    content="#111827"
>

<title>GESBASE - Paquetería</title>

<style>

* {
    box-sizing: border-box;
}

body {
    margin: 0;
    font-family:
        -apple-system,
        BlinkMacSystemFont,
        "Segoe UI",
        Roboto,
        Arial,
        sans-serif;

    background: #f3f4f6;
    color: #111827;
}

header {
    background: #111827;
    color: white;
    padding: 18px 20px;
}

.header-contenido {
    max-width: 1150px;
    margin: auto;

    display: flex;
    justify-content: space-between;
    align-items: center;

    gap: 15px;
}

.logo {
    font-size: 22px;
    font-weight: 800;
}

.subtitulo {
    font-size: 13px;
    opacity: .75;
    margin-top: 3px;
}

.contenedor {
    max-width: 1150px;
    margin: auto;
    padding: 20px;
}

.barra-superior {
    display: flex;
    justify-content: space-between;
    align-items: center;

    flex-wrap: wrap;

    gap: 15px;
    margin-bottom: 20px;
}

h1 {
    margin: 0;
    font-size: 26px;
}

.descripcion {
    color: #6b7280;
    margin-top: 5px;
}

.boton {
    border: 0;
    border-radius: 10px;

    padding: 12px 17px;

    cursor: pointer;

    font-size: 14px;
    font-weight: 700;
}

.boton-principal {
    background: #111827;
    color: white;
}

.boton-secundario {
    background: #e5e7eb;
    color: #111827;
}

.boton-verde {
    background: #16a34a;
    color: white;
}

.boton-azul {
    background: #2563eb;
    color: white;
}

.boton-rojo {
    background: #dc2626;
    color: white;
}

.boton:hover {
    opacity: .9;
}

.resumen {
    display: grid;

    grid-template-columns:
        repeat(5, 1fr);

    gap: 15px;

    margin-bottom: 20px;
}

.tarjeta-resumen {
    background: white;

    border-radius: 15px;

    padding: 18px;

    box-shadow:
        0 3px 12px rgba(0,0,0,.06);
}

.numero {
    font-size: 28px;
    font-weight: 800;
}

.texto {
    color: #6b7280;

    font-size: 14px;

    margin-top: 4px;
}

.panel {
    background: white;

    border-radius: 16px;

    padding: 20px;

    margin-bottom: 20px;

    box-shadow:
        0 3px 12px rgba(0,0,0,.06);
}

.panel h2 {
    margin-top: 0;

    font-size: 20px;
}

.formulario {
    display: grid;

    grid-template-columns:
        repeat(2, 1fr);

    gap: 15px;
}

.campo {
    display: flex;

    flex-direction: column;

    gap: 6px;
}

.campo-completo {
    grid-column: 1 / -1;
}

label {
    font-size: 13px;

    font-weight: 700;

    color: #374151;
}

input,
select,
textarea {
    width: 100%;

    padding: 12px;

    border:
        1px solid #d1d5db;

    border-radius: 9px;

    font-size: 15px;

    background: white;
}

textarea {
    min-height: 90px;

    resize: vertical;
}

input:focus,
select:focus,
textarea:focus {
    outline: none;

    border-color: #111827;
}

.info-viaje {
    grid-column: 1 / -1;

    padding: 13px;

    border-radius: 10px;

    background: #f3f4f6;

    color: #374151;

    display: none;
}

.botones-formulario {
    grid-column: 1 / -1;

    display: flex;

    gap: 10px;
}

.lista {
    display: grid;

    grid-template-columns:
        repeat(2, 1fr);

    gap: 15px;
}

.paquete {
    background: white;

    border:
        1px solid #e5e7eb;

    border-radius: 14px;

    padding: 17px;
}

.paquete-cabecera {
    display: flex;

    justify-content: space-between;

    align-items: flex-start;

    gap: 10px;
}

.remito {
    font-size: 12px;

    color: #6b7280;
}

.numero-envio {
    font-size: 19px;

    font-weight: 800;

    margin-top: 4px;
}

.estado {
    padding: 6px 10px;

    border-radius: 20px;

    font-size: 12px;

    font-weight: 800;

    white-space: nowrap;
}

.estado-recibido {
    background: #e0f2fe;
    color: #0369a1;
}

.estado-preparacion {
    background: #fef3c7;
    color: #92400e;
}

.estado-transito {
    background: #dcfce7;
    color: #166534;
}

.estado-entregado {
    background: #d1fae5;
    color: #065f46;
}

.estado-cancelado {
    background: #fee2e2;
    color: #991b1b;
}

.datos {
    display: grid;

    gap: 8px;

    margin-top: 15px;
}

.dato {
    font-size: 14px;

    color: #374151;
}

.dato strong {
    color: #111827;
}

.ruta {
    margin-top: 14px;

    padding: 12px;

    background: #f3f4f6;

    border-radius: 10px;

    font-size: 14px;
}

.viaje-info {
    margin-top: 10px;

    padding: 12px;

    background: #eff6ff;

    border-radius: 10px;

    font-size: 14px;

    color: #1e40af;
}

.acciones {
    display: flex;

    flex-wrap: wrap;

    gap: 8px;

    margin-top: 15px;
}

.mensaje {
    padding: 14px;

    border-radius: 10px;

    margin-bottom: 15px;

    display: none;
}

.mensaje-error {
    background: #fee2e2;

    color: #991b1b;
}

.mensaje-ok {
    background: #dcfce7;

    color: #166534;
}

.cargando,
.vacio {
    text-align: center;

    padding: 35px 15px;

    color: #6b7280;
}

.bloqueado {
    text-align: center;

    padding: 60px 20px;
}

.bloqueado p {
    color: #6b7280;
}

@media (max-width: 950px) {

    .resumen {
        grid-template-columns:
            repeat(3, 1fr);
    }

}

@media (max-width: 800px) {

    .lista {
        grid-template-columns: 1fr;
    }

}

@media (max-width: 600px) {

    .contenedor {
        padding: 15px;
    }

    .formulario {
        grid-template-columns: 1fr;
    }

    .campo-completo,
    .info-viaje,
    .botones-formulario {
        grid-column: auto;
    }

    .resumen {
        grid-template-columns:
            repeat(2, 1fr);
    }

}

</style>

</head>


<body>


<header>

    <div class="header-contenido">

        <div>

            <div class="logo">
                GESBASE
            </div>

            <div class="subtitulo">
                Gestión de paquetería
            </div>

        </div>


        <button
            class="boton boton-secundario"
            onclick="volver()"
        >
            ← Volver
        </button>

    </div>

</header>


<div class="contenedor">


    <div
        id="mensaje"
        class="mensaje"
    ></div>


    <div
        id="contenidoBloqueado"
        class="panel bloqueado"
        style="display:none;"
    >

        <h2>
            🚫 Módulo no habilitado
        </h2>

        <p>
            El módulo de Paquetería no está habilitado
            para esta empresa.
        </p>

    </div>


    <div
        id="contenidoPrincipal"
        style="display:none;"
    >


        <!-- CABECERA -->

        <div class="barra-superior">

            <div>

                <h1>
                    📦 Paquetería
                </h1>

                <div class="descripcion">
                    Registrá, organizá y controlá los envíos.
                </div>

            </div>


            <button
                id="botonNuevo"
                class="boton boton-principal"
                onclick="mostrarFormulario()"
            >
                + Nuevo envío
            </button>

        </div>


        <!-- RESUMEN -->

        <div class="resumen">

            <div class="tarjeta-resumen">

                <div
                    id="totalPaquetes"
                    class="numero"
                >
                    0
                </div>

                <div class="texto">
                    Total
                </div>

            </div>


            <div class="tarjeta-resumen">

                <div
                    id="recibidos"
                    class="numero"
                >
                    0
                </div>

                <div class="texto">
                    Recibidos
                </div>

            </div>


            <div class="tarjeta-resumen">

                <div
                    id="preparacion"
                    class="numero"
                >
                    0
                </div>

                <div class="texto">
                    Preparación
                </div>

            </div>


            <div class="tarjeta-resumen">

                <div
                    id="transito"
                    class="numero"
                >
                    0
                </div>

                <div class="texto">
                    En tránsito
                </div>

            </div>


            <div class="tarjeta-resumen">

                <div
                    id="entregados"
                    class="numero"
                >
                    0
                </div>

                <div class="texto">
                    Entregados
                </div>

            </div>

        </div>


        <!-- FORMULARIO -->

        <div
            id="panelFormulario"
            class="panel"
            style="display:none;"
        >

            <h2>
                📦 Registrar envío
            </h2>


            <div class="formulario">


                <div class="campo">

                    <label>
                        Número de envío / remito
                    </label>

                    <input
                        id="numeroEnvio"
                        type="text"
                        placeholder="Ej: ENV-0001"
                    >

                </div>


                <div class="campo">

                    <label>
                        Estado
                    </label>

                    <select id="estado">

                        <option value="Recibido">
                            Recibido
                        </option>

                        <option value="En preparación">
                            En preparación
                        </option>

                        <option value="En tránsito">
                            En tránsito
                        </option>

                        <option value="Entregado">
                            Entregado
                        </option>

                        <option value="Cancelado">
                            Cancelado
                        </option>

                    </select>

                </div>


                <div class="campo">

                    <label>
                        Remitente
                    </label>

                    <input
                        id="remitente"
                        type="text"
                        placeholder="Nombre del remitente"
                    >

                </div>


                <div class="campo">

                    <label>
                        Teléfono remitente
                    </label>

                    <input
                        id="telefonoRemitente"
                        type="tel"
                        placeholder="Teléfono"
                    >

                </div>


                <div class="campo">

                    <label>
                        Destinatario
                    </label>

                    <input
                        id="destinatario"
                        type="text"
                        placeholder="Nombre del destinatario"
                    >

                </div>


                <div class="campo">

                    <label>
                        Teléfono destinatario
                    </label>

                    <input
                        id="telefonoDestinatario"
                        type="tel"
                        placeholder="Teléfono"
                    >

                </div>


                <div class="campo">

                    <label>
                        Origen
                    </label>

                    <input
                        id="origen"
                        type="text"
                        placeholder="Localidad de origen"
                    >

                </div>


                <div class="campo">

                    <label>
                        Destino
                    </label>

                    <input
                        id="destino"
                        type="text"
                        placeholder="Localidad de destino"
                    >

                </div>


                <div class="campo">

                    <label>
                        Peso
                    </label>

                    <input
                        id="peso"
                        type="number"
                        min="0"
                        step="0.1"
                        placeholder="Kg"
                    >

                </div>


                <div class="campo">

                    <label>
                        Tipo de envío
                    </label>

                    <select id="tipoEnvio">

                        <option value="Paquete">
                            Paquete
                        </option>

                        <option value="Sobre">
                            Sobre
                        </option>

                        <option value="Bulto">
                            Bulto
                        </option>

                        <option value="Mercadería">
                            Mercadería
                        </option>

                        <option value="Otro">
                            Otro
                        </option>

                    </select>

                </div>


                <div class="campo">

                    <label>
                        Viaje asociado
                    </label>

                    <select id="viaje">

                        <option value="">
                            Sin viaje asignado
                        </option>

                    </select>

                </div>


                <div
                    id="infoViaje"
                    class="info-viaje"
                ></div>


                <div class="campo campo-completo">

                    <label>
                        Descripción del contenido
                    </label>

                    <textarea
                        id="descripcion"
                        placeholder="Describí el contenido del envío..."
                    ></textarea>

                </div>


                <div class="campo campo-completo">

                    <label>
                        Observaciones
                    </label>

                    <textarea
                        id="observaciones"
                        placeholder="Información adicional..."
                    ></textarea>

                </div>


                <div class="botones-formulario">

                    <button
                        class="boton boton-principal"
                        onclick="guardarPaquete()"
                    >
                        Guardar envío
                    </button>


                    <button
                        class="boton boton-secundario"
                        onclick="cerrarFormulario()"
                    >
                        Cancelar
                    </button>

                </div>

            </div>

        </div>


        <!-- LISTADO -->

        <div class="panel">

            <h2>
                📋 Envíos registrados
            </h2>


            <div
                id="listaPaquetes"
                class="lista"
            >

                <div class="cargando">
                    Cargando envíos...
                </div>

            </div>

        </div>


    </div>

</div>


<script type="module">


import {
    auth,
    db
} from "./Js/firebase.js";


import {
    onAuthStateChanged
} from "https://www.gstatic.com/firebasejs/12.18.0/firebase-auth.js";


import {
    doc,
    getDoc,
    collection,
    query,
    where,
    onSnapshot,
    addDoc,
    updateDoc,
    serverTimestamp
} from "https://www.gstatic.com/firebasejs/12.18.0/firebase-firestore.js";


const ADMIN_EMAIL =
    "julianbattauz006@gmail.com";


let usuarioActual = null;

let datosUsuario = null;

let empresaActualId = null;

let paquetes = [];

let viajes = [];


/* =========================================================
   MENSAJES
========================================================= */

function mostrarMensaje(
    texto,
    tipo = "ok"
) {

    const mensaje =
        document.getElementById(
            "mensaje"
        );


    mensaje.textContent =
        texto;


    mensaje.className =
        "mensaje " +
        (
            tipo === "error"
                ? "mensaje-error"
                : "mensaje-ok"
        );


    mensaje.style.display =
        "block";


    setTimeout(() => {

        mensaje.style.display =
            "none";

    }, 4000);

}


/* =========================================================
   AUTENTICACIÓN
========================================================= */

onAuthStateChanged(
    auth,
    async usuario => {

        if (!usuario) {

            window.location.href =
                "index.html";

            return;

        }


        usuarioActual =
            usuario;


        try {

            const usuarioRef =
                doc(
                    db,
                    "usuarios",
                    usuario.uid
                );


            const usuarioSnap =
                await getDoc(
                    usuarioRef
                );


            if (!usuarioSnap.exists()) {

                mostrarMensaje(
                    "No se encontró la información del usuario.",
                    "error"
                );

                return;

            }


            datosUsuario =
                usuarioSnap.data();


            empresaActualId =
                datosUsuario.empresaId ||
                datosUsuario.idEmpresa ||
                datosUsuario.empresa ||
                usuario.uid;


            const empresaRef =
                doc(
                    db,
                    "empresas",
                    empresaActualId
                );


            const empresaSnap =
                await getDoc(
                    empresaRef
                );


            if (!empresaSnap.exists()) {

                mostrarMensaje(
                    "No se encontró la empresa.",
                    "error"
                );

                return;

            }


            const empresa =
                empresaSnap.data();


            const esAdmin =
                usuario.email === ADMIN_EMAIL ||
                datosUsuario.rol === "admin" ||
                datosUsuario.rol === "administrador";


            const moduloHabilitado =
                empresa.modulos &&
                empresa.modulos.paqueteria === true;


            if (
                !moduloHabilitado &&
                !esAdmin
            ) {

                document
                    .getElementById(
                        "contenidoBloqueado"
                    )
                    .style.display =
                    "block";

                return;

            }


            document
                .getElementById(
                    "contenidoPrincipal"
                )
                .style.display =
                "block";


            if (!esAdmin) {

                document
                    .getElementById(
                        "botonNuevo"
                    )
                    .style.display =
                    "none";

            }


            cargarPaquetes();

            cargarViajes();


        } catch (error) {

            console.error(error);


            mostrarMensaje(
                "Ocurrió un error al cargar el módulo.",
                "error"
            );

        }

    }
);


/* =========================================================
   CARGAR PAQUETES
========================================================= */

function cargarPaquetes() {

    const consulta =
        query(
            collection(
                db,
                "paqueteria"
            ),
            where(
                "empresaId",
                "==",
                empresaActualId
            )
        );


    onSnapshot(
        consulta,
        snapshot => {

            paquetes = [];


            snapshot.forEach(
                docSnap => {

                    paquetes.push({

                        id:
                            docSnap.id,

                        ...docSnap.data()

                    });

                }
            );


            renderizarPaquetes();

            actualizarResumen();

        },
        error => {

            console.error(error);


            mostrarMensaje(
                "No se pudieron cargar los envíos.",
                "error"
            );

        }
    );

}


/* =========================================================
   CARGAR VIAJES
========================================================= */

function cargarViajes() {

    const consulta =
        query(
            collection(
                db,
                "viajes"
            ),
            where(
                "empresaId",
                "==",
                empresaActualId
            )
        );


    onSnapshot(
        consulta,
        snapshot => {

            viajes = [];


            snapshot.forEach(
                docSnap => {

                    viajes.push({

                        id:
                            docSnap.id,

                        ...docSnap.data()

                    });

                }
            );


            actualizarSelectorViajes();

        },
        error => {

            console.error(error);

        }
    );

}


/* =========================================================
   SELECTOR DE VIAJES
========================================================= */

function actualizarSelectorViajes() {

    const select =
        document.getElementById(
            "viaje"
        );


    if (!select) return;


    const valorActual =
        select.value;


    select.innerHTML = `
        <option value="">
            Sin viaje asignado
        </option>
    `;


    const viajesDisponibles =
        viajes.filter(
            viaje =>
                viaje.estado !== "Finalizado" &&
                viaje.estado !== "Cancelado"
        );


    viajesDisponibles.forEach(
        viaje => {

            const option =
                document.createElement(
                    "option"
                );


            option.value =
                viaje.id;


            option.textContent =
                `${viaje.origen || "-"} → ${viaje.destino || "-"} | ${viaje.unidadPatente || "Sin unidad"}`;


            select.appendChild(
                option
            );

        }
    );


    if (valorActual) {

        select.value =
            valorActual;

    }

}


/* =========================================================
   CAMBIO DE VIAJE
========================================================= */

document
    .getElementById("viaje")
    .addEventListener(
        "change",
        mostrarInformacionViaje
    );


function mostrarInformacionViaje() {

    const viajeId =
        document
            .getElementById(
                "viaje"
            )
            .value;


    const contenedor =
        document.getElementById(
            "infoViaje"
        );


    if (!viajeId) {

        contenedor.style.display =
            "none";

        contenedor.innerHTML =
            "";

        return;

    }


    const viaje =
        viajes.find(
            v =>
                v.id === viajeId
        );


    if (!viaje) return;


    contenedor.innerHTML = `
        🛣️
        <strong>Viaje:</strong>
        ${escapeHtml(viaje.origen || "-")}
        →
        ${escapeHtml(viaje.destino || "-")}
        <br>
        🚛
        <strong>Unidad:</strong>
        ${escapeHtml(viaje.unidadPatente || "-")}
        &nbsp; · &nbsp;
        👨‍✈️
        <strong>Chofer:</strong>
        ${escapeHtml(viaje.choferNombre || "-")}
    `;


    contenedor.style.display =
        "block";

}


/* =========================================================
   MOSTRAR FORMULARIO
========================================================= */

window.mostrarFormulario =
function mostrarFormulario() {

    limpiarFormulario();


    document
        .getElementById(
            "panelFormulario"
        )
        .style.display =
        "block";


    window.scrollTo({
        top: 0,
        behavior: "smooth"
    });

};


/* =========================================================
   GUARDAR PAQUETE
========================================================= */

window.guardarPaquete =
async function guardarPaquete() {

    const numeroEnvio =
        document
            .getElementById(
                "numeroEnvio"
            )
            .value
            .trim();


    const estado =
        document
            .getElementById(
                "estado"
            )
            .value;


    const remitente =
        document
            .getElementById(
                "remitente"
            )
            .value
            .trim();


    const telefonoRemitente =
        document
            .getElementById(
                "telefonoRemitente"
            )
            .value
            .trim();


    const destinatario =
        document
            .getElementById(
                "destinatario"
            )
            .value
            .trim();


    const telefonoDestinatario =
        document
            .getElementById(
                "telefonoDestinatario"
            )
            .value
            .trim();


    const origen =
        document
            .getElementById(
                "origen"
            )
            .value
            .trim();


    const destino =
        document
            .getElementById(
                "destino"
            )
            .value
            .trim();


    const peso =
        document
            .getElementById(
                "peso"
            )
            .value;


    const tipoEnvio =
        document
            .getElementById(
                "tipoEnvio"
            )
            .value;


    const viajeId =
        document
            .getElementById(
                "viaje"
            )
            .value;


    const descripcion =
        document
            .getElementById(
                "descripcion"
            )
            .value
            .trim();


    const observaciones =
        document
            .getElementById(
                "observaciones"
            )
            .value
            .trim();


    if (
        !numeroEnvio ||
        !remitente ||
        !destinatario ||
        !origen ||
        !destino
    ) {

        mostrarMensaje(
            "Completá número de envío, remitente, destinatario, origen y destino.",
            "error"
        );

        return;

    }


    /*
     * Evitar números de envío repetidos
     */

    const existe =
        paquetes.some(
            paquete =>
                String(
                    paquete.numeroEnvio || ""
                ).toLowerCase() ===
                numeroEnvio.toLowerCase()
        );


    if (existe) {

        mostrarMensaje(
            "Ya existe un envío con ese número.",
            "error"
        );

        return;

    }


    let datosViaje = {};


    if (viajeId) {

        const viaje =
            viajes.find(
                v =>
                    v.id === viajeId
            );


        if (viaje) {

            datosViaje = {

                viajeId:

                    viaje.id,

                viajeOrigen:

                    viaje.origen || "",

                viajeDestino:

                    viaje.destino || "",

                unidadId:

                    viaje.unidadId || null,

                unidadPatente:

                    viaje.unidadPatente || "",

                choferId:

                    viaje.choferId || null,

                choferNombre:

                    viaje.choferNombre || ""

            };

        }

    }


    try {

        await addDoc(
            collection(
                db,
                "paqueteria"
            ),
            {

                empresaId:
                    empresaActualId,

                numeroEnvio,

                estado,

                remitente,

                telefonoRemitente,

                destinatario,

                telefonoDestinatario,

                origen,

                destino,

                peso:
                    peso
                        ? Number(peso)
                        : null,

                tipoEnvio,

                descripcion,

                observaciones,

                ...datosViaje,

                creadoPor:
                    usuarioActual.uid,

                creadoEn:
                    serverTimestamp(),

                actualizadoEn:
                    serverTimestamp()

            }
        );


        mostrarMensaje(
            "Envío registrado correctamente."
        );


        cerrarFormulario();


    } catch (error) {

        console.error(error);


        mostrarMensaje(
            "No se pudo registrar el envío.",
            "error"
        );

    }

};


/* =========================================================
   CAMBIAR ESTADO
========================================================= */

async function cambiarEstado(
    id,
    nuevoEstado
) {

    try {

        await updateDoc(
            doc(
                db,
                "paqueteria",
                id
            ),
            {

                estado:
                    nuevoEstado,

                actualizadoEn:
                    serverTimestamp()

            }
        );


        mostrarMensaje(
            `Estado actualizado: ${nuevoEstado}.`
        );


    } catch (error) {

        console.error(error);


        mostrarMensaje(
            "No se pudo actualizar el estado.",
            "error"
        );

    }

}


/* =========================================================
   RENDERIZAR PAQUETES
========================================================= */

function renderizarPaquetes() {

    const contenedor =
        document.getElementById(
            "listaPaquetes"
        );


    if (
        paquetes.length === 0
    ) {

        contenedor.innerHTML = `
            <div class="vacio">
                Todavía no hay envíos registrados.
            </div>
        `;

        return;

    }


    const ordenados =
        [...paquetes].sort(
            (a, b) =>
                String(
                    b.numeroEnvio || ""
                ).localeCompare(
                    String(
                        a.numeroEnvio || ""
                    )
                )
        );


    contenedor.innerHTML =
        "";


    ordenados.forEach(
        paquete => {

            const tarjeta =
                document.createElement(
                    "div"
                );


            tarjeta.className =
                "paquete";


            const estado =
                paquete.estado ||
                "Recibido";


            let claseEstado =
                "estado-recibido";


            if (
                estado ===
                "En preparación"
            ) {

                claseEstado =
                    "estado-preparacion";

            }


            if (
                estado ===
                "En tránsito"
            ) {

                claseEstado =
                    "estado-transito";

            }


            if (
                estado ===
                "Entregado"
            ) {

                claseEstado =
                    "estado-entregado";

            }


            if (
                estado ===
                "Cancelado"
            ) {

                claseEstado =
                    "estado-cancelado";

            }


            tarjeta.innerHTML = `

                <div class="paquete-cabecera">

                    <div>

                        <div class="remito">
                            ENVÍO / REMITO
                        </div>

                        <div class="numero-envio">
                            📦
                            ${escapeHtml(
                                paquete.numeroEnvio || "-"
                            )}
                        </div>

                    </div>


                    <span
                        class="estado ${claseEstado}"
                    >
                        ${escapeHtml(estado)}
                    </span>

                </div>


                <div class="datos">

                    <div class="dato">
                        👤
                        <strong>Remitente:</strong>
                        ${escapeHtml(
                            paquete.remitente || "-"
                        )}
                    </div>


                    <div class="dato">
                        📞
                        <strong>Tel. remitente:</strong>
                        ${escapeHtml(
                            paquete.telefonoRemitente || "-"
                        )}
                    </div>


                    <div class="dato">
                        👤
                        <strong>Destinatario:</strong>
                        ${escapeHtml(
                            paquete.destinatario || "-"
                        )}
                    </div>


                    <div class="dato">
                        📞
                        <strong>Tel. destinatario:</strong>
                        ${escapeHtml(
                            paquete.telefonoDestinatario || "-"
                        )}
                    </div>


                    <div class="dato">
                        📦
                        <strong>Tipo:</strong>
                        ${escapeHtml(
                            paquete.tipoEnvio || "-"
                        )}
                    </div>


                    <div class="dato">
                        ⚖️
                        <strong>Peso:</strong>
                        ${
                            paquete.peso !== null &&
                            paquete.peso !== undefined
                            ? escapeHtml(
                                paquete.peso
                            ) + " kg"
                            : "-"
                        }
                    </div>

                </div>


                <div class="ruta">

                    📍
                    <strong>
                        ${escapeHtml(
                            paquete.origen || "-"
                        )}
                    </strong>

                    →

                    📍
                    <strong>
                        ${escapeHtml(
                            paquete.destino || "-"
                        )}
                    </strong>

                </div>


                ${
                    paquete.viajeId
                    ? `
                        <div class="viaje-info">

                            🛣️
                            <strong>Viaje asociado</strong>

                            <br>

                            🚛
                            ${escapeHtml(
                                paquete.unidadPatente || "-"
                            )}

                            &nbsp; · &nbsp;

                            👨‍✈️
                            ${escapeHtml(
                                paquete.choferNombre || "-"
                            )}

                        </div>
                    `
                    : `
                        <div class="viaje-info">
                            🛣️ Sin viaje asignado
                        </div>
                    `
                }


                ${
                    paquete.descripcion
                    ? `
                        <div class="datos">

                            <div class="dato">

                                📝
                                <strong>Contenido:</strong>

                                ${escapeHtml(
                                    paquete.descripcion
                                )}

                            </div>

                        </div>
                    `
                    : ""
                }


                <div class="acciones">

                    ${
                        estado === "Recibido"
                        ? `
                            <button
                                class="boton boton-azul"
                                data-preparar="${paquete.id}"
                            >
                                📋 Preparar
                            </button>
                        `
                        : ""
                    }


                    ${
                        estado === "En preparación"
                        ? `
                            <button
                                class="boton boton-verde"
                                data-transito="${paquete.id}"
                            >
                                🚛 Enviar
                            </button>
                        `
                        : ""
                    }


                    ${
                        estado === "En tránsito"
                        ? `
                            <button
                                class="boton boton-verde"
                                data-entregar="${paquete.id}"
                            >
                                ✓ Entregado
                            </button>
                        `
                        : ""
                    }


                    ${
                        estado !== "Entregado" &&
                        estado !== "Cancelado"
                        ? `
                            <button
                                class="boton boton-rojo"
                                data-cancelar="${paquete.id}"
                            >
                                ✕ Cancelar
                            </button>
                        `
                        : ""
                    }

                </div>

            `;


            const preparar =
                tarjeta.querySelector(
                    "[data-preparar]"
                );


            if (preparar) {

                preparar.addEventListener(
                    "click",
                    () =>
                        cambiarEstado(
                            paquete.id,
                            "En preparación"
                        )
                );

            }


            const transito =
                tarjeta.querySelector(
                    "[data-transito]"
                );


            if (transito) {

                transito.addEventListener(
                    "click",
                    () =>
                        cambiarEstado(
                            paquete.id,
                            "En tránsito"
                        )
                );

            }


            const entregar =
                tarjeta.querySelector(
                    "[data-entregar]"
                );


            if (entregar) {

                entregar.addEventListener(
                    "click",
                    () =>
                        cambiarEstado(
                            paquete.id,
                            "Entregado"
                        )
                );

            }


            const cancelar =
                tarjeta.querySelector(
                    "[data-cancelar]"
                );


            if (cancelar) {

                cancelar.addEventListener(
                    "click",
                    () =>
                        cambiarEstado(
                            paquete.id,
                            "Cancelado"
                        )
                );

            }


            contenedor.appendChild(
                tarjeta
            );

        }
    );

}

/* =========================================================
   ESCAPAR HTML
========================================================= */

function escapeHtml(valor) {

    return String(valor)
        .replace(
            /&/g,
            "&amp;"
        )
        .replace(
            /</g,
            "&lt;"
        )
        .replace(
            />/g,
            "&gt;"
        )
        .replace(
            /"/g,
            "&quot;"
        )
        .replace(
            /'/g,
            "&#039;"
        );

}
