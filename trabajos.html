/* =====================================================
   FIREBASE
===================================================== */

import {
    auth,
    db
} from "./firebase.js";


import {
    onAuthStateChanged
} from "https://www.gstatic.com/firebasejs/12.18.0/firebase-auth.js";


import {
    doc,
    getDoc,
    collection,
    query,
    where,
    getDocs,
    addDoc,
    serverTimestamp
} from "https://www.gstatic.com/firebasejs/12.18.0/firebase-firestore.js";


/* =====================================================
   ELEMENTOS
===================================================== */

const estado =
document.getElementById("estado");

const datosPresupuesto =
document.getElementById("datosPresupuesto");

const formularioTrabajo =
document.getElementById("formularioTrabajo");

const presupuestoNumero =
document.getElementById("presupuestoNumero");

const clienteNombre =
document.getElementById("clienteNombre");

const presupuestoFecha =
document.getElementById("presupuestoFecha");

const presupuestoLugar =
document.getElementById("presupuestoLugar");

const presupuestoDescripcion =
document.getElementById("presupuestoDescripcion");

const presupuestoTotal =
document.getElementById("presupuestoTotal");

const estadoTrabajo =
document.getElementById("estadoTrabajo");

const fechaInicio =
document.getElementById("fechaInicio");

const fechaFin =
document.getElementById("fechaFin");

const observaciones =
document.getElementById("observaciones");

const responsable =
document.getElementById("responsable");

const btnGuardar =
document.getElementById("btnGuardar");

const btnVolver =
document.getElementById("btnVolver");


/* =====================================================
   VARIABLES
===================================================== */

let usuarioActual = null;

let presupuestoActual = null;

let presupuestoId = "";


/* =====================================================
   OBTENER ID
===================================================== */

const parametros =
new URLSearchParams(
    window.location.search
);


/*
 * Aceptamos los dos formatos:
 *
 * trabajo.html?presupuestoId=XXXX
 *
 * trabajo.html?id=XXXX
 */

presupuestoId =
parametros.get("presupuestoId") ||
parametros.get("id") ||
"";


console.log(
    "GESBASE - presupuestoId:",
    presupuestoId
);


/* =====================================================
   TEXTO
===================================================== */

function texto(valor){

    if(
        valor === undefined ||
        valor === null
    ){

        return "";

    }

    return String(valor).trim();

}


/* =====================================================
   NUMERO
===================================================== */

function numero(valor){

    if(
        valor === undefined ||
        valor === null ||
        valor === ""
    ){

        return 0;

    }

    if(typeof valor === "number"){

        return Number.isFinite(valor)
            ? valor
            : 0;

    }

    let valorTexto =
    String(valor)
        .replace(/\$/g,"")
        .replace(/\s/g,"");


    if(valorTexto.includes(",")){

        valorTexto =
        valorTexto
            .replace(/\./g,"")
            .replace(",",".");
    }


    const resultado =
    Number(valorTexto);


    return Number.isFinite(resultado)
        ? resultado
        : 0;

}


/* =====================================================
   DINERO
===================================================== */

function dinero(valor){

    return numero(valor)
        .toLocaleString(
            "es-AR",
            {
                minimumFractionDigits:2,
                maximumFractionDigits:2
            }
        );

}


/* =====================================================
   FECHA
===================================================== */

function obtenerFecha(datos){

    if(datos.fecha){

        return texto(
            datos.fecha
        );

    }


    if(
        datos.creado &&
        typeof datos.creado.toDate === "function"
    ){

        return datos.creado
            .toDate()
            .toLocaleDateString("es-AR");

    }


    if(
        datos.fechaCreacion &&
        typeof datos.fechaCreacion.toDate === "function"
    ){

        return datos.fechaCreacion
            .toDate()
            .toLocaleDateString("es-AR");

    }


    return "Sin fecha";

}


/* =====================================================
   NOMBRE CLIENTE
===================================================== */

function obtenerCliente(datos){

    return (
        datos.cliente ||
        datos.clienteNombre ||
        datos.nombreCliente ||
        datos.nombre ||
        datos.empresaCliente ||
        datos.nombreEmpresaCliente ||
        "Sin cliente"
    );

}


/* =====================================================
   NUMERO PRESUPUESTO
===================================================== */

function obtenerNumero(datos){

    return (
        datos.numeroAgenda ||
        datos.numero ||
        datos.numeroPresupuesto ||
        datos.codigo ||
        datos.nro ||
        presupuestoId.substring(0,8)
    );

}


/* =====================================================
   TOTAL PRESUPUESTO
===================================================== */

function obtenerTotal(datos){

    const totalGuardado =
    numero(
        datos.total ??
        datos.totalFinal ??
        datos.importe ??
        datos.monto
    );


    if(totalGuardado > 0){

        return totalGuardado;

    }


    return (
        numero(
            datos.materiales ??
            datos.importeMaterial
        )
        +
        numero(
            datos.manoObra ??
            datos.importeManoObra
        )
        +
        numero(
            datos.viaticos ??
            datos.importeViaticos
        )
        +
        numero(
            datos.flete ??
            datos.importeFlete
        )
    );

}


/* =====================================================
   PERTENECE AL USUARIO
===================================================== */

function perteneceAlUsuario(datos){

    if(!usuarioActual){

        return false;

    }


    const uid =
    usuarioActual.uid;


    if(
        texto(datos.uid) === uid
    ){

        return true;

    }


    if(
        texto(datos.usuarioId) === uid
    ){

        return true;

    }


    if(
        texto(datos.userId) === uid
    ){

        return true;

    }


    /*
     * Algunos presupuestos pueden estar
     * vinculados mediante empresaId.
     *
     * No consideramos empresaId igual al UID
     * automáticamente salvo compatibilidad
     * con documentos antiguos.
     */

    if(
        texto(datos.empresaId) === uid
    ){

        return true;

    }


    return false;

}


/* =====================================================
   CARGAR PRESUPUESTO
===================================================== */

async function cargarPresupuesto(){

    if(!presupuestoId){

        mostrarEstado(
            "❌ No se recibió el ID del presupuesto.\n\n" +
            "Volvé a Presupuestos y tocá nuevamente 🔧 CREAR TRABAJO.",
            "error"
        );

        return false;

    }


    console.log(
        "GESBASE - Cargando presupuesto:",
        presupuestoId
    );


    try{

        const referencia =
        doc(
            db,
            "presupuestos",
            presupuestoId
        );


        const documento =
        await getDoc(
            referencia
        );


        if(!documento.exists()){

            mostrarEstado(
                "❌ El presupuesto no existe.\n\n" +
                "ID: " +
                presupuestoId,
                "error"
            );

            return false;

        }


        const datos =
        documento.data();


        console.log(
            "GESBASE - Datos presupuesto:",
            datos
        );


        if(!perteneceAlUsuario(datos)){

            mostrarEstado(
                "❌ No tenés permiso para utilizar este presupuesto.",
                "error"
            );

            return false;

        }


        presupuestoActual = {

            id:
            documento.id,

            datos:
            datos

        };


        /* ==========================================
           MOSTRAR PRESUPUESTO
        ========================================== */

        presupuestoNumero.textContent =
        obtenerNumero(datos);


        clienteNombre.textContent =
        obtenerCliente(datos);


        presupuestoFecha.textContent =
        obtenerFecha(datos);


        presupuestoLugar.textContent =
        datos.lugarTrabajo ||
        datos.lugar ||
        "Sin informar";


        presupuestoDescripcion.textContent =
        datos.descripcion ||
        datos.tareas ||
        datos.concepto ||
        datos.detalle ||
        "Sin descripción";


        presupuestoTotal.textContent =
        dinero(
            obtenerTotal(datos)
        );


        /* ==========================================
           FECHA INICIO AUTOMÁTICA
        ========================================== */

        if(datos.fecha){

            fechaInicio.value =
            datos.fecha;

        }
        else{

            const hoy =
            new Date();


            const anio =
            hoy.getFullYear();


            const mes =
            String(
                hoy.getMonth()+1
            ).padStart(2,"0");


            const dia =
            String(
                hoy.getDate()
            ).padStart(2,"0");


            fechaInicio.value =
            anio +
            "-" +
            mes +
            "-" +
            dia;

        }


        datosPresupuesto.classList.remove(
            "oculto"
        );


        formularioTrabajo.classList.remove(
            "oculto"
        );


        mostrarEstado(
            "✅ Presupuesto cargado correctamente. Podés crear el trabajo.",
            "exito"
        );


        return true;

    }
    catch(error){

        console.error(
            "GESBASE - ERROR CARGANDO PRESUPUESTO:",
            error
        );


        mostrarEstado(
            "❌ No se pudo cargar el presupuesto.\n\n" +
            "Código: " +
            (error?.code || "sin código") +
            "\n\n" +
            "Detalle: " +
            (error?.message || error),
            "error"
        );


        return false;

    }

}


/* =====================================================
   COMPROBAR SI YA EXISTE TRABAJO
===================================================== */

async function buscarTrabajoExistente(){

    try{

        const referencia =
        collection(
            db,
            "trabajos"
        );


        /*
         * Buscamos por presupuestoId.
         */

        const consulta =
        query(
            referencia,
            where(
                "presupuestoId",
                "==",
                presupuestoId
            )
        );


        const resultado =
        await getDocs(
            consulta
        );


        for(
            const documento
            of resultado.docs
        ){

            const datos =
            documento.data();


            /*
             * Solo consideramos el trabajo
             * si pertenece al usuario.
             */

            if(
                texto(datos.uid) ===
                usuarioActual.uid
            ){

                return {

                    existe:
                    true,

                    id:
                    documento.id,

                    datos:
                    datos

                };

            }

        }


        return {

            existe:
            false

        };

    }
    catch(error){

        /*
         * Si la consulta necesita índice,
         * no bloqueamos la creación.
         */

        console.warn(
            "No se pudo comprobar trabajo existente:",
            error
        );


        return {

            existe:
            false

        };

    }

}


/* =====================================================
   CREAR TRABAJO
===================================================== */

async function crearTrabajo(){

    if(!usuarioActual){

        mostrarEstado(
            "❌ No hay una sesión activa.",
            "error"
        );

        return;

    }


    if(!presupuestoActual){

        mostrarEstado(
            "❌ El presupuesto todavía no fue cargado.",
            "error"
        );

        return;

    }


    const estadoSeleccionado =
    estadoTrabajo.value;


    const inicio =
    fechaInicio.value;


    const fin =
    fechaFin.value;


    const observacionesTexto =
    observaciones.value.trim();


    const responsableTexto =
    responsable.value.trim();


    if(!inicio){

        mostrarEstado(
            "❌ Ingresá la fecha de inicio.",
            "error"
        );

        fechaInicio.focus();

        return;

    }


    if(
        fin &&
        fin < inicio
    ){

        mostrarEstado(
            "❌ La fecha de finalización no puede ser anterior a la fecha de inicio.",
            "error"
        );

        fechaFin.focus();

        return;

    }


    btnGuardar.disabled =
    true;

    btnGuardar.textContent =
    "⏳ Creando trabajo...";


    try{

        /* ==========================================
           COMPROBAR DUPLICADO
        ========================================== */

        const existente =
        await buscarTrabajoExistente();


        if(existente.existe){

            mostrarEstado(
                "⚠️ Este presupuesto ya tiene un trabajo creado.\n\n" +
                "No se creó otro trabajo para evitar duplicados.",
                "error"
            );


            btnGuardar.disabled =
            false;

            btnGuardar.textContent =
            "🔧 CREAR TRABAJO";


            return;

        }


        /* ==========================================
           DATOS DEL PRESUPUESTO
        ========================================== */

        const datos =
        presupuestoActual.datos;


        const nombreCliente =
        obtenerCliente(datos);


        const totalPresupuesto =
        obtenerTotal(datos);


        /*
         * Tomamos empresaId del presupuesto
         * para mantener la relación empresa.
         */

        const empresaId =
        texto(datos.empresaId);


        /* ==========================================
           CREAR DOCUMENTO
        ========================================== */

        const datosTrabajo = {

            uid:
            usuarioActual.uid,

            usuarioId:
            usuarioActual.uid,

            empresaId:
            empresaId,

            presupuestoId:
            presupuestoId,

            presupuestoNumero:
            obtenerNumero(datos),

            clienteId:
            datos.clienteId ||
            datos.idCliente ||
            datos.clienteID ||
            "",

            cliente:
            nombreCliente,

            clienteNombre:
            nombreCliente,

            clienteCuit:
            datos.clienteCuit ||
            "",

            clienteTelefono:
            datos.clienteTelefono ||
            "",

            clienteEmail:
            datos.clienteEmail ||
            "",

            clienteDireccion:
            datos.clienteDireccion ||
            "",

            clienteLocalidad:
            datos.clienteLocalidad ||
            "",

            clienteProvincia:
            datos.clienteProvincia ||
            "",

            fechaPresupuesto:
            datos.fecha ||
            "",

            lugarTrabajo:
            datos.lugarTrabajo ||
            datos.lugar ||
            "",

            descripcion:
            datos.descripcion ||
            datos.tareas ||
            datos.concepto ||
            datos.detalle ||
            "",

            totalPresupuesto:
            totalPresupuesto,

            estado:
            estadoSeleccionado,

            fechaInicio:
            inicio,

            fechaFin:
            fin,

            observaciones:
            observacionesTexto,

            responsable:
            responsableTexto,

            creado:
            serverTimestamp(),

            actualizado:
            serverTimestamp()

        };


        console.log(
            "GESBASE - Creando trabajo:",
            datosTrabajo
        );


        const referenciaTrabajos =
        collection(
            db,
            "trabajos"
        );


        const nuevoTrabajo =
        await addDoc(
            referenciaTrabajos,
            datosTrabajo
        );


        console.log(
            "GESBASE - Trabajo creado:",
            nuevoTrabajo.id
        );


        /* ==========================================
           ÉXITO
        ========================================== */

        mostrarEstado(
            "✅ Trabajo creado correctamente.\n\n" +
            "ID del trabajo: " +
            nuevoTrabajo.id,
            "exito"
        );


        btnGuardar.textContent =
        "✅ Trabajo creado";


        /*
         * Después de guardar,
         * vamos a la página del trabajo.
         */

        setTimeout(
            function(){

                window.location.href =
                "trabajo.html?id=" +
                encodeURIComponent(
                    nuevoTrabajo.id
                ) +
                "&modo=ver";

            },
            1000
        );

    }
    catch(error){

        console.error(
            "GESBASE - ERROR CREANDO TRABAJO:",
            error
        );


        let mensaje =
        error?.message ||
        String(error);


        if(
            error?.code ===
            "permission-denied"
        ){

            mensaje =
            "Firebase rechazó la creación del trabajo.\n\n" +
            "Revisá las reglas de Firestore para la colección trabajos.";

        }


        mostrarEstado(
            "❌ No se pudo crear el trabajo.\n\n" +
            "Código: " +
            (error?.code || "sin código") +
            "\n\n" +
            mensaje,
            "error"
        );


        btnGuardar.disabled =
        false;

        btnGuardar.textContent =
        "🔧 CREAR TRABAJO";

    }

}


/* =====================================================
   MOSTRAR ESTADO
===================================================== */

function mostrarEstado(mensaje,tipo){

    estado.textContent =
    mensaje;


    estado.className =
    "estado " +
    tipo;

}


/* =====================================================
   BOTÓN GUARDAR
===================================================== */

btnGuardar.addEventListener(
    "click",
    crearTrabajo
);


/* =====================================================
   BOTÓN VOLVER
===================================================== */

btnVolver.addEventListener(
    "click",
    function(){

        window.location.href =
        "presupuestos.html";

    }
);


/* =====================================================
   AUTENTICACIÓN
===================================================== */

onAuthStateChanged(
    auth,
    async function(usuario){

        console.log(
            "GESBASE AUTH:",
            usuario
                ? usuario.uid
                : "SIN SESIÓN"
        );


        if(!usuario){

            mostrarEstado(
                "❌ No hay una sesión activa.\n\nRedirigiendo al inicio de sesión...",
                "error"
            );


            setTimeout(
                function(){

                    window.location.replace(
                        "login.html"
                    );

                },
                1200
            );


            return;

        }


        usuarioActual =
        usuario;


        await cargarPresupuesto();

    }
);


/* =====================================================
   CONTROL DE TIEMPO
===================================================== */

setTimeout(
    function(){

        if(
            estado.classList.contains(
                "cargando"
            )
        ){

            mostrarEstado(
                "❌ GESBASE tardó demasiado en responder.\n\n" +
