<!DOCTYPE html>
<html lang="es">

<head>

<meta charset="UTF-8">

<meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
>

<meta
    name="theme-color"
    content="#111827"
>

<meta
    name="description"
    content="GESBASE - Crear trabajo"
>

<title>Crear trabajo - GESBASE</title>

<style>

*{
    box-sizing:border-box;
    margin:0;
    padding:0;
}

body{
    font-family:Arial,sans-serif;
    background:#f3f4f6;
    color:#111827;
}

.contenedor{
    width:100%;
    max-width:700px;
    margin:auto;
    min-height:100vh;
    background:#fff;
}

header{
    background:#111827;
    color:white;
    padding:24px 20px;
}

header h1{
    font-size:25px;
}

header p{
    margin-top:6px;
    color:#d1d5db;
    font-size:14px;
}

main{
    padding:20px;
}

.estado{
    display:block;
    padding:14px;
    border-radius:10px;
    margin-bottom:18px;
    font-size:14px;
    line-height:1.5;
    white-space:pre-wrap;
}

.estado-cargando{
    background:#f3f4f6;
    color:#4b5563;
}

.estado-exito{
    background:#dcfce7;
    color:#166534;
}

.estado-error{
    background:#fee2e2;
    color:#991b1b;
}

.info{
    background:#f9fafb;
    border:1px solid #e5e7eb;
    border-radius:12px;
    padding:18px;
    margin-bottom:20px;
}

.info-titulo{
    font-size:18px;
    font-weight:bold;
    margin-bottom:12px;
}

.dato{
    margin-top:8px;
    font-size:14px;
    line-height:1.5;
}

.campo{
    margin-bottom:18px;
}

label{
    display:block;
    font-size:14px;
    font-weight:bold;
    margin-bottom:7px;
}

input,
textarea,
select{
    width:100%;
    padding:13px;
    border:1px solid #d1d5db;
    border-radius:9px;
    font-size:16px;
    background:white;
    color:#111827;
    outline:none;
}

input:focus,
textarea:focus,
select:focus{
    border-color:#2563eb;
}

textarea{
    min-height:120px;
    resize:vertical;
}

.resumen{
    background:#f3f4f6;
    border-radius:12px;
    padding:18px;
    margin-top:20px;
    margin-bottom:20px;
}

.resumen-linea{
    display:flex;
    justify-content:space-between;
    gap:10px;
    padding:8px 0;
    font-size:15px;
}

.resumen-total{
    border-top:2px solid #111827;
    margin-top:10px;
    padding-top:14px;
    font-size:21px;
    font-weight:bold;
}

button{
    width:100%;
    padding:15px;
    border:none;
    border-radius:10px;
    font-size:16px;
    font-weight:bold;
    cursor:pointer;
    margin-top:10px;
}

.guardar{
    background:#16a34a;
    color:white;
}

.volver{
    background:#e5e7eb;
    color:#111827;
}

button:disabled{
    opacity:.6;
    cursor:not-allowed;
}

.identificador{
    background:#eff6ff;
    color:#1e40af;
    border:1px solid #bfdbfe;
    border-radius:10px;
    padding:12px;
    margin-bottom:18px;
    font-size:13px;
    word-break:break-all;
}

.oculto{
    display:none;
}

</style>

</head>

<body>

<div class="contenedor">

<header>

<h1>GESBASE</h1>

<p>Crear trabajo</p>

</header>

<main>

<div
    id="estado"
    class="estado estado-cargando"
>
Cargando trabajo...
</div>


<div
    id="contenido"
    class="oculto"
>


<div class="identificador">

<strong>ID del presupuesto:</strong>

<br>

<span id="presupuestoIdTexto">-</span>

</div>


<div class="info">

<div class="info-titulo">
Datos del presupuesto
</div>


<div class="dato">

<strong>N.º de presupuesto:</strong>

<span id="numeroPresupuesto">-</span>

</div>


<div class="dato">

<strong>Cliente:</strong>

<span id="cliente">-</span>

</div>


<div class="dato">

<strong>Fecha:</strong>

<span id="fechaPresupuesto">-</span>

</div>


<div class="dato">

<strong>Lugar de trabajo:</strong>

<span id="lugarPresupuesto">-</span>

</div>


<div class="dato">

<strong>Descripción:</strong>

<br>

<span id="descripcionPresupuesto">-</span>

</div>


<div class="dato">

<strong>Total presupuesto:</strong>

$ <span id="totalPresupuesto">0,00</span>

</div>

</div>


<div class="campo">

<label for="nombreTrabajo">

Nombre del trabajo

</label>

<input
    type="text"
    id="nombreTrabajo"
    placeholder="Ej.: Mantenimiento local comercial"
>

</div>


<div class="campo">

<label for="fechaInicio">

Fecha de inicio

</label>

<input
    type="date"
    id="fechaInicio"
>

</div>


<div class="campo">

<label for="fechaFin">

Fecha estimada de finalización

</label>

<input
    type="date"
    id="fechaFin"
>

</div>


<div class="campo">

<label for="estadoTrabajo">

Estado del trabajo

</label>

<select id="estadoTrabajo">

<option value="pendiente">
Pendiente
</option>

<option value="en curso">
En curso
</option>

<option value="finalizado">
Finalizado
</option>

<option value="cancelado">
Cancelado
</option>

</select>

</div>


<div class="campo">

<label for="descripcionTrabajo">

Descripción del trabajo

</label>

<textarea
    id="descripcionTrabajo"
    placeholder="Descripción del trabajo a realizar..."
></textarea>

</div>


<div class="campo">

<label for="observaciones">

Observaciones

</label>

<textarea
    id="observaciones"
    placeholder="Observaciones adicionales..."
></textarea>

</div>


<div class="resumen">

<div class="resumen-linea">

<span>
Cliente
</span>

<strong id="resumenCliente">
-
</strong>

</div>


<div class="resumen-linea">

<span>
Presupuesto
</span>

<strong id="resumenNumero">
-
</strong>

</div>


<div class="resumen-linea resumen-total">

<span>
VALOR
</span>

<strong>
$ <span id="resumenTotal">
0,00
</span>
</strong>

</div>

</div>


<button
    type="button"
    id="btnGuardar"
    class="guardar"
>

💾 CREAR TRABAJO

</button>


<button
    type="button"
    id="btnVolver"
    class="volver"
>

⬅️ Volver a presupuestos

</button>


</div>

</main>

</div>


<script type="module">


/* =====================================================
   FIREBASE
===================================================== */

import {

    auth,
    db

} from "./Js/firebase.js";


import {

    onAuthStateChanged

} from "https://www.gstatic.com/firebasejs/12.18.0/firebase-auth.js";


import {

    doc,
    getDoc,
    collection,
    addDoc,
    serverTimestamp

} from "https://www.gstatic.com/firebasejs/12.18.0/firebase-firestore.js";


/* =====================================================
   ELEMENTOS
===================================================== */

const estado =
document.getElementById("estado");

const contenido =
document.getElementById("contenido");

const presupuestoIdTexto =
document.getElementById("presupuestoIdTexto");

const numeroPresupuesto =
document.getElementById("numeroPresupuesto");

const cliente =
document.getElementById("cliente");

const fechaPresupuesto =
document.getElementById("fechaPresupuesto");

const lugarPresupuesto =
document.getElementById("lugarPresupuesto");

const descripcionPresupuesto =
document.getElementById("descripcionPresupuesto");

const totalPresupuesto =
document.getElementById("totalPresupuesto");

const nombreTrabajo =
document.getElementById("nombreTrabajo");

const fechaInicio =
document.getElementById("fechaInicio");

const fechaFin =
document.getElementById("fechaFin");

const estadoTrabajo =
document.getElementById("estadoTrabajo");

const descripcionTrabajo =
document.getElementById("descripcionTrabajo");

const observaciones =
document.getElementById("observaciones");

const resumenCliente =
document.getElementById("resumenCliente");

const resumenNumero =
document.getElementById("resumenNumero");

const resumenTotal =
document.getElementById("resumenTotal");

const btnGuardar =
document.getElementById("btnGuardar");

const btnVolver =
document.getElementById("btnVolver");


/* =====================================================
   VARIABLES
===================================================== */

let usuarioActual = null;

let presupuestoActual = null;


/* =====================================================
   OBTENER ID
===================================================== */

const parametros =
new URLSearchParams(
    window.location.search
);

const presupuestoId =
parametros.get("presupuestoId");


/* =====================================================
   FUNCIONES
===================================================== */

function texto(valor){

    if(
        valor === undefined ||
        valor === null
    ){

        return "";

    }

    return String(valor).trim();

}


function numero(valor){

    if(
        valor === undefined ||
        valor === null ||
        valor === ""
    ){

        return 0;

    }


    if(typeof valor === "number"){

        return Number.isFinite(valor)
            ? valor
            : 0;

    }


    let valorTexto =
    String(valor)
        .replace(/\$/g,"")
        .replace(/\s/g,"");


    if(valorTexto.includes(",")){

        valorTexto =
        valorTexto
            .replace(/\./g,"")
            .replace(",",".");
    }


    const resultado =
    Number(valorTexto);


    return Number.isFinite(resultado)
        ? resultado
        : 0;

}


function dinero(valor){

    return numero(valor)
        .toLocaleString(
            "es-AR",
            {
                minimumFractionDigits:2,
                maximumFractionDigits:2
            }
        );

}


/* =====================================================
   OBTENER CLIENTE
===================================================== */

function obtenerCliente(datos){

    return (

        datos.cliente ||

        datos.clienteNombre ||

        datos.nombreCliente ||

        datos.nombre ||

        datos.empresaCliente ||

        datos.nombreEmpresaCliente ||

        "Sin cliente"

    );

}


/* =====================================================
   OBTENER NUMERO
===================================================== */

function obtenerNumero(datos){

    return (

        datos.numeroAgenda ||

        datos.numero ||

        datos.numeroPresupuesto ||

        datos.codigo ||

        datos.nro ||

        presupuestoId.substring(0,8)

    );

}


/* =====================================================
   PERTENECE AL USUARIO
===================================================== */

function perteneceAlUsuario(datos){

    if(!usuarioActual){

        return false;

    }


    const uid =
    usuarioActual.uid;


    if(
        datos.uid === uid ||
        datos.usuarioId === uid ||
        datos.userId === uid
    ){

        return true;

    }


    /*
     * Compatibilidad con presupuestos
     * asociados directamente a empresa.
     */

    if(
        datos.empresaId &&
        datos.empresaId === uid
    ){

        return true;

    }


    /*
     * Si el presupuesto tiene empresaId,
     * también permitimos continuar si
     * coincide con el documento del usuario.
     *
     * Esta parte no concede acceso por sí sola;
     * primero se valida el usuario autenticado.
     */

    return false;

}


/* =====================================================
   CARGAR PRESUPUESTO
===================================================== */

async function cargarPresupuesto(){

    if(!presupuestoId){

        throw new Error(

            "No se recibió el ID del presupuesto.\n\n" +

            "Volvé a Presupuestos y tocá nuevamente " +

            "🔧 CREAR TRABAJO."

        );

    }


    presupuestoIdTexto.textContent =
    presupuestoId;


    const referencia =
    doc(
        db,
        "presupuestos",
        presupuestoId
    );


    const documento =
    await getDoc(
        referencia
    );


    if(!documento.exists()){

        throw new Error(

            "El presupuesto no existe en Firebase.\n\n" +

            "ID: " +
            presupuestoId

        );

    }


    const datos =
    documento.data();


    console.log(
        "GESBASE - Presupuesto cargado:",
        datos
    );


    if(!perteneceAlUsuario(datos)){

        throw new Error(

            "No tenés permiso para utilizar este presupuesto.\n\n" +

            "El presupuesto existe, pero no está asociado " +

            "al usuario actualmente autenticado."

        );

    }


    presupuestoActual =
    datos;


    /* ==========================================
       DATOS
    ========================================== */


    const numero =
    obtenerNumero(datos);


    const nombreCliente =
    obtenerCliente(datos);


    const fecha =
    datos.fecha ||

    "";


    const lugar =
    datos.lugarTrabajo ||

    datos.lugar ||

    "";


    const descripcion =
    datos.descripcion ||

    datos.tareas ||

    datos.concepto ||

    datos.detalle ||

    "";


    const total =
    numeroValorTotal(datos);


    numeroPresupuesto.textContent =
    numero;


    cliente.textContent =
    nombreCliente;


    fechaPresupuesto.textContent =
    fecha || "Sin fecha";


    lugarPresupuesto.textContent =
    lugar || "Sin informar";


    descripcionPresupuesto.textContent =
    descripcion || "Sin descripción";


    totalPresupuesto.textContent =
    dinero(total);


    resumenCliente.textContent =
    nombreCliente;


    resumenNumero.textContent =
    numero;


    resumenTotal.textContent =
    dinero(total);


    /*
     * Datos iniciales del trabajo
     */

    nombreTrabajo.value =
    descripcion
        ? "Trabajo - " + numero
        : "";


    descripcionTrabajo.value =
    descripcion;


    /*
     * Fecha de inicio por defecto:
     * fecha del presupuesto si existe.
     */

    if(fecha){

        fechaInicio.value =
        fecha;

    }
    else{

        fechaInicio.value =
        obtenerFechaActual();

    }


    contenido.classList.remove(
        "oculto"
    );


    mostrarEstado(
        "Presupuesto cargado correctamente. Podés crear el trabajo.",
        "exito"
    );

}


/* =====================================================
   TOTAL DEL PRESUPUESTO
===================================================== */

function numeroValorTotal(datos){

    const totalGuardado =
    numero(

        datos.total ??

        datos.totalFinal ??

        datos.importe ??

        datos.monto

    );


    if(totalGuardado > 0){

        return totalGuardado;

    }


    return (

        numero(
            datos.materiales ??
            datos.importeMaterial
        )

        +

        numero(
            datos.manoObra ??
            datos.importeManoObra
        )

        +

        numero(
            datos.viaticos ??
            datos.importeViaticos
        )

        +

        numero(
            datos.flete ??
            datos.importeFlete
        )

    );

}


/* =====================================================
   FECHA ACTUAL
===================================================== */

function obtenerFechaActual(){

    const fecha =
    new Date();


    const año =
    fecha.getFullYear();


    const mes =
    String(
        fecha.getMonth() + 1
    ).padStart(2,"0");


    const dia =
    String(
        fecha.getDate()
    ).padStart(2,"0");


    return (
        año +
        "-" +
        mes +
        "-" +
        dia
    );

}


/* =====================================================
   ESTADO
===================================================== */

function mostrarEstado(
    mensaje,
    tipo
){

    estado.textContent =
    mensaje;


    estado.className =
    "estado estado-" +
    tipo;

}


/* =====================================================
   GUARDAR TRABAJO
===================================================== */

btnGuardar.addEventListener(
    "click",
    async function(){

        if(!usuarioActual){

            mostrarEstado(

                "No hay una sesión activa.",

                "error"

            );

            return;

        }


        if(!presupuestoActual){

            mostrarEstado(

                "El presupuesto todavía no fue cargado.",

                "error"

            );

            return;

        }


        const nombre =
        nombreTrabajo.value.trim();


        if(!nombre){

            mostrarEstado(

                "Ingresá un nombre para el trabajo.",

                "error"

            );

            nombreTrabajo.focus();

            return;

        }


        if(!fechaInicio.value){

            mostrarEstado(

                "Ingresá la fecha de inicio.",

                "error"

            );

            fechaInicio.focus();

            return;

        }


        if(
            fechaFin.value &&
            fechaFin.value <
            fechaInicio.value
        ){

            mostrarEstado(

                "La fecha de finalización no puede ser anterior a la fecha de inicio.",

                "error"

            );

            fechaFin.focus();

            return;

        }


        btnGuardar.disabled =
        true;


        btnGuardar.textContent =
        "⏳ Creando trabajo...";


        try{

            const datosPresupuesto =
            presupuestoActual;


            const nombreCliente =
            obtenerCliente(
                datosPresupuesto
            );


            const numero =
            obtenerNumero(
                datosPresupuesto
            );


            const total =
            numeroValorTotal(
                datosPresupuesto
            );


            /*
             * Documento del trabajo.
             *
             * Queda vinculado directamente
             * al presupuesto mediante presupuestoId.
             */

            const nuevoTrabajo = {

                presupuestoId:
                presupuestoId,

                numeroPresupuesto:
                numero,

                uid:
                usuarioActual.uid,

                usuarioId:
                usuarioActual.uid,

                empresaId:
                datosPresupuesto.empresaId ||
                "",

                clienteId:
                datosPresupuesto.clienteId ||
                datosPresupuesto.idCliente ||
                "",

                cliente:
                nombreCliente,

                clienteNombre:
                nombreCliente,

                nombre:
                nombre,

                fechaInicio:
                fechaInicio.value,

                fechaFin:
                fechaFin.value || "",

                estado:
                estadoTrabajo.value,

                lugarTrabajo:
                datosPresupuesto.lugarTrabajo ||
                datosPresupuesto.lugar ||
                "",

                descripcion:
                descripcionTrabajo.value.trim(),

                observaciones:
                observaciones.value.trim(),

                totalPresupuesto:
                total,

                presupuestoTotal:
                total,

                creado:
                serverTimestamp(),

                actualizado:
                serverTimestamp()

            };


            console.log(
                "GESBASE - Guardando trabajo:",
                nuevoTrabajo
            );


            const referencia =
            collection(
                db,
                "trabajos"
            );


            const resultado =
            await addDoc(
                referencia,
                nuevoTrabajo
            );


            console.log(
                "GESBASE - Trabajo creado:",
                resultado.id
            );


            mostrarEstado(

                "✅ Trabajo creado correctamente.\n\n" +

                "ID del trabajo: " +
                resultado.id,

                "exito"

            );


            btnGuardar.textContent =
            "✅ Trabajo creado";


            /*
             * Después de crear el trabajo,
             * volvemos a presupuestos.
             */

            setTimeout(
                function(){

                    window.location.href =
                    "presupuestos.html";

                },
                1200
            );

        }
        catch(error){

            console.error(
                "GESBASE - ERROR CREANDO TRABAJO:",
                error
            );


            let mensaje =
            error?.message ||
            String(error);


            if(
                error?.code ===
                "permission-denied"
            ){

                mensaje =
                "Firebase rechazó la creación del trabajo.\n\n" +

                "Revisá las reglas de Firestore de la colección trabajos.";

            }


            mostrarEstado(

                "❌ No se pudo crear el trabajo.\n\n" +

                "Código: " +
                (
                    error?.code ||
                    "sin código"
                ) +

                "\n\n" +

                mensaje,

                "error"

            );


            btnGuardar.disabled =
            false;


            btnGuardar.textContent =
            "💾 CREAR TRABAJO";

        }

    }
);


/* =====================================================
   VOLVER
===================================================== */

btnVolver.addEventListener(
    "click",
    function(){

        window.location.href =
        "presupuestos.html";

    }
);


/* =====================================================
   AUTENTICACIÓN
===================================================== */

onAuthStateChanged(
    auth,
    async function(usuario){

        console.log(
            "GESBASE AUTH:",
            usuario
                ? usuario.uid
                : "SIN SESIÓN"
        );


        if(!usuario){

            mostrarEstado(

                "No hay una sesión activa.\n\n" +

                "Redirigiendo al inicio de sesión...",

                "error"

            );


            setTimeout(
                function(){

                    window.location.replace(
                        "login.html"
                    );

                },
                1200
            );


            return;

        }


        usuarioActual =
        usuario;


        try{

            await cargarPresupuesto();

        }
        catch(error){

            console.error(
                "GESBASE - ERROR CARGANDO TRABAJO:",
                error
            );


            mostrarEstado(

                "❌ No se pudo cargar el trabajo.\n\n" +

                "Código: " +
                (
                    error?.code ||
                    "sin código"
                ) +

                "\n\n" +

                (
                    error?.message ||
                    String(error)
                ),

                "error"

            );

        }

    }
);


/* =====================================================
   CONTROL DE TIEMPO
===================================================== */

setTimeout(
    function(){

        if(
            estado.classList.contains(
                "estado-cargando"
            )
        ){

            mostrarEstado(

                "GESBASE tardó demasiado en responder.\n\n" +

                "Verificá que firebase.js esté funcionando, " +

                "que haya una sesión iniciada y que la URL " +

                "contenga presupuestoId.",

                "error"

            );

        }

    },
    15000
);

</script>

</body>

</html>
