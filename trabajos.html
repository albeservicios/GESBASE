<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Trabajos - GESBASE</title>

<meta name="theme-color" content="#111827">

<style>
*{
    box-sizing:border-box;
    margin:0;
    padding:0;
    font-family:Arial, sans-serif;
}

body{
    background:#f3f4f6;
    color:#111827;
    min-height:100vh;
}

header{
    background:#111827;
    color:white;
    padding:18px 20px;
    position:sticky;
    top:0;
    z-index:10;
}

.header-content{
    max-width:1100px;
    margin:auto;
    display:flex;
    justify-content:space-between;
    align-items:center;
    gap:15px;
}

.logo{
    font-size:24px;
    font-weight:bold;
}

.subtitle{
    font-size:12px;
    color:#d1d5db;
    margin-top:3px;
}

.btn-back{
    border:none;
    background:#374151;
    color:white;
    padding:10px 14px;
    border-radius:8px;
    cursor:pointer;
    font-size:14px;
}

.container{
    max-width:1100px;
    margin:25px auto;
    padding:0 15px 40px;
}

.title-section{
    display:flex;
    justify-content:space-between;
    align-items:center;
    gap:15px;
    margin-bottom:20px;
    flex-wrap:wrap;
}

h1{
    font-size:28px;
}

.description{
    color:#6b7280;
    margin-top:5px;
}

.btn-primary{
    border:none;
    background:#111827;
    color:white;
    padding:12px 18px;
    border-radius:8px;
    cursor:pointer;
    font-weight:bold;
}

.btn-primary:hover{
    background:#1f2937;
}

.card{
    background:white;
    border-radius:12px;
    padding:20px;
    margin-bottom:20px;
    box-shadow:0 2px 8px rgba(0,0,0,.08);
}

.filters{
    display:grid;
    grid-template-columns:2fr 1fr;
    gap:12px;
}

input,
select,
textarea{
    width:100%;
    padding:12px;
    border:1px solid #d1d5db;
    border-radius:8px;
    font-size:15px;
    background:white;
}

textarea{
    min-height:100px;
    resize:vertical;
}

label{
    display:block;
    font-weight:bold;
    margin-bottom:6px;
}

.form-grid{
    display:grid;
    grid-template-columns:1fr 1fr;
    gap:15px;
}

.form-group{
    margin-bottom:15px;
}

.full{
    grid-column:1 / -1;
}

.form-actions{
    display:flex;
    justify-content:flex-end;
    gap:10px;
    margin-top:20px;
    flex-wrap:wrap;
}

.btn-secondary{
    border:none;
    background:#e5e7eb;
    color:#111827;
    padding:12px 18px;
    border-radius:8px;
    cursor:pointer;
    font-weight:bold;
}

.hidden{
    display:none !important;
}

.message{
    padding:15px;
    border-radius:8px;
    background:#f9fafb;
    color:#6b7280;
    text-align:center;
}

.jobs{
    display:grid;
    gap:15px;
}

.job{
    border:1px solid #e5e7eb;
    border-radius:10px;
    padding:18px;
    background:white;
}

.job-header{
    display:flex;
    justify-content:space-between;
    align-items:flex-start;
    gap:10px;
    flex-wrap:wrap;
    margin-bottom:12px;
}

.job-title{
    font-size:18px;
    font-weight:bold;
}

.job-info{
    display:grid;
    grid-template-columns:repeat(2,1fr);
    gap:8px;
    color:#4b5563;
    font-size:14px;
}

.status{
    display:inline-block;
    padding:6px 10px;
    border-radius:20px;
    background:#e5e7eb;
    font-size:12px;
    font-weight:bold;
}

.job-actions{
    display:flex;
    gap:8px;
    margin-top:15px;
    flex-wrap:wrap;
}

.btn-small{
    border:none;
    padding:8px 12px;
    border-radius:7px;
    cursor:pointer;
    background:#e5e7eb;
}

.btn-small.primary{
    background:#111827;
    color:white;
}

.footer{
    text-align:center;
    color:#6b7280;
    font-size:12px;
    margin-top:30px;
}

@media(max-width:700px){

    .header-content{
        align-items:flex-start;
    }

    .filters{
        grid-template-columns:1fr;
    }

    .form-grid{
        grid-template-columns:1fr;
    }

    .full{
        grid-column:auto;
    }

    h1{
        font-size:24px;
    }

    .title-section{
        align-items:stretch;
    }

    .btn-primary{
        width:100%;
    }

    .job-info{
        grid-template-columns:1fr;
    }

}
</style>
</head>

<body>

<header>
    <div class="header-content">

        <div>
            <div class="logo">GESBASE</div>
            <div class="subtitle">Tu empresa. Todo organizado.</div>
        </div>

        <button class="btn-back" onclick="volverPanel()">
            ← Volver
        </button>

    </div>
</header>


<main class="container">

    <section class="title-section">

        <div>
            <h1>Trabajos</h1>
            <p class="description">
                Administrá los trabajos de tu empresa.
            </p>
        </div>

        <button class="btn-primary" onclick="mostrarFormulario()">
            + Nuevo trabajo
        </button>

    </section>


    <!-- FILTROS -->

    <section class="card">

        <div class="filters">

            <input
                type="search"
                id="buscarTrabajo"
                placeholder="Buscar trabajo, cliente o lugar..."
                oninput="filtrarTrabajos()"
            >

            <select id="filtroEstado" onchange="filtrarTrabajos()">

                <option value="">Todos los estados</option>

                <option value="Pendiente">
                    Pendiente
                </option>

                <option value="Asignado">
                    Asignado
                </option>

                <option value="En curso">
                    En curso
                </option>

                <option value="Pausado">
                    Pausado
                </option>

                <option value="Terminado">
                    Terminado
                </option>

                <option value="Cobrado">
                    Cobrado
                </option>

            </select>

        </div>

    </section>


    <!-- FORMULARIO -->

    <section id="formularioTrabajo" class="card hidden">

        <h2>Nuevo trabajo</h2>

        <br>

        <form id="trabajoForm">

            <div class="form-grid">

                <div class="form-group">
                    <label for="clienteId">
                        Cliente
                    </label>

                    <select id="clienteId">

                        <option value="">
                            Seleccionar cliente
                        </option>

                    </select>
                </div>


                <div class="form-group">
                    <label for="presupuestoId">
                        Presupuesto
                    </label>

                    <select id="presupuestoId">

                        <option value="">
                            Sin presupuesto asociado
                        </option>

                    </select>
                </div>


                <div class="form-group full">

                    <label for="descripcion">
                        Descripción del trabajo
                    </label>

                    <input
                        type="text"
                        id="descripcion"
                        placeholder="Ej.: Instalación de Durlock"
                        required
                    >

                </div>


                <div class="form-group">

                    <label for="lugar">
                        Lugar / Dirección
                    </label>

                    <input
                        type="text"
                        id="lugar"
                        placeholder="Dirección del trabajo"
                    >

                </div>


                <div class="form-group">

                    <label for="estado">
                        Estado
                    </label>

                    <select id="estado">

                        <option value="Pendiente">
                            Pendiente
                        </option>

                        <option value="Asignado">
                            Asignado
                        </option>

                        <option value="En curso">
                            En curso
                        </option>

                        <option value="Pausado">
                            Pausado
                        </option>

                        <option value="Terminado">
                            Terminado
                        </option>

                        <option value="Cobrado">
                            Cobrado
                        </option>

                    </select>

                </div>


                <div class="form-group">

                    <label for="fechaInicio">
                        Fecha de inicio
                    </label>

                    <input
                        type="date"
                        id="fechaInicio"
                    >

                </div>


                <div class="form-group">

                    <label for="fechaFin">
                        Fecha prevista de finalización
                    </label>

                    <input
                        type="date"
                        id="fechaFin"
                    >

                </div>


                <div class="form-group full">

                    <label for="observaciones">
                        Observaciones
                    </label>

                    <textarea
                        id="observaciones"
                        placeholder="Notas relacionadas con el trabajo..."
                    ></textarea>

                </div>

            </div>


            <div class="form-actions">

                <button
                    type="button"
                    class="btn-secondary"
                    onclick="ocultarFormulario()"
                >
                    Cancelar
                </button>

                <button
                    type="submit"
                    class="btn-primary"
                >
                    Guardar trabajo
                </button>

            </div>

        </form>

    </section>


    <!-- LISTADO -->

    <section class="card">

        <h2>Mis trabajos</h2>

        <br>

        <div id="listaTrabajos" class="jobs">

            <div class="message">
                Todavía no hay trabajos cargados.
            </div>

        </div>

    </section>


    <div class="footer">
        GESBASE — Del presupuesto a la rentabilidad.
    </div>

</main>


<script>

/*
=====================================================
GESBASE — TRABAJOS
ETAPA 7
=====================================================

Este archivo contiene actualmente la interfaz.

La conexión definitiva con Firebase se realizará
en js/trabajos.js.

No se utilizan datos de ALBE Servicios Generales.
=====================================================
*/


let trabajos = [];


function mostrarFormulario(){

    document
        .getElementById("formularioTrabajo")
        .classList.remove("hidden");

    window.scrollTo({
        top:0,
        behavior:"smooth"
    });

}


function ocultarFormulario(){

    document
        .getElementById("formularioTrabajo")
        .classList.add("hidden");

}


function volverPanel(){

    /*
    No asumimos todavía que existe panel.html.
    Volvemos a index.html, que sí existe actualmente.
    */

    window.location.href = "index.html";

}


function filtrarTrabajos(){

    const texto =
        document
        .getElementById("buscarTrabajo")
        .value
        .toLowerCase();

    const estado =
        document
        .getElementById("filtroEstado")
        .value;

    const filtrados = trabajos.filter(trabajo => {

        const coincideTexto =
            !texto ||
            (trabajo.descripcion || "")
                .toLowerCase()
                .includes(texto) ||

            (trabajo.cliente || "")
                .toLowerCase()
                .includes(texto) ||

            (trabajo.lugar || "")
                .toLowerCase()
                .includes(texto);

        const coincideEstado =
            !estado ||
            trabajo.estado === estado;

        return coincideTexto && coincideEstado;

    });

    mostrarTrabajos(filtrados);

}


function mostrarTrabajos(lista = trabajos){

    const contenedor =
        document.getElementById("listaTrabajos");

    if(!lista.length){

        contenedor.innerHTML = `
            <div class="message">
                No hay trabajos para mostrar.
            </div>
        `;

        return;
    }


    contenedor.innerHTML =
        lista.map(trabajo => `

            <article class="job">

                <div class="job-header">

                    <div>

                        <div class="job-title">
                            ${trabajo.descripcion || "Trabajo sin descripción"}
                        </div>

                        <small>
                            ${trabajo.cliente || "Cliente sin asignar"}
                        </small>

                    </div>

                    <span class="status">
                        ${trabajo.estado || "Pendiente"}
                    </span>

                </div>


                <div class="job-info">

                    <div>
                        📍 ${trabajo.lugar || "Sin ubicación"}
                    </div>

                    <div>
                        📅 ${trabajo.fechaInicio || "Sin fecha"}
                    </div>

                    <div>
                        🧾 ${trabajo.presupuesto || "Sin presupuesto"}
                    </div>

                    <div>
                        🏢 GESBASE
                    </div>

                </div>


                <div class="job-actions">

                    <button
                        class="btn-small primary"
                        onclick="verTrabajo('${trabajo.id}')"
                    >
                        Ver
                    </button>

                    <button
                        class="btn-small"
                        onclick="editarTrabajo('${trabajo.id}')"
                    >
                        Editar
                    </button>

                </div>

            </article>

        `).join("");

}


function verTrabajo(id){

    const trabajo =
        trabajos.find(t => t.id === id);

    if(!trabajo){

        alert("No se encontró el trabajo.");

        return;
    }

    alert(
        "Trabajo:\n\n" +
        (trabajo.descripcion || "") +
        "\n\nEstado: " +
        (trabajo.estado || "Pendiente")
    );

}


function editarTrabajo(id){

    const trabajo =
        trabajos.find(t => t.id === id);

    if(!trabajo){

        alert("No se encontró el trabajo.");

        return;
    }

    alert(
        "La edición avanzada se conectará " +
        "con Firebase en la implementación del módulo."
    );

}


document
.getElementById("trabajoForm")
.addEventListener("submit", function(event){

    event.preventDefault();


    const nuevoTrabajo = {

        id:
            "trabajo-" +
            Date.now(),

        clienteId:
            document
            .getElementById("clienteId")
            .value,

        presupuestoId:
            document
            .getElementById("presupuestoId")
            .value,

        descripcion:
            document
            .getElementById("descripcion")
            .value.trim(),

        lugar:
            document
            .getElementById("lugar")
            .value.trim(),

        estado:
            document
            .getElementById("estado")
            .value,

        fechaInicio:
            document
            .getElementById("fechaInicio")
            .value,

        fechaFin:
            document
            .getElementById("fechaFin")
            .value,

        observaciones:
            document
            .getElementById("observaciones")
            .value.trim()

    };


    /*
    Por ahora solamente agregamos el trabajo
    a la memoria del navegador.

    NO se escribe en Firebase todavía.
    */

    trabajos.push(nuevoTrabajo);

    mostrarTrabajos();

    document
        .getElementById("trabajoForm")
        .reset();

    ocultarFormulario();


    alert(
        "Trabajo preparado correctamente.\n\n" +
        "La conexión con Firebase se realizará " +
        "en el siguiente paso de esta etapa."
    );

});

</script>

</body>
</html>
