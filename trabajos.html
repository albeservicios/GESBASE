/* =====================================================
   FIREBASE
===================================================== */

import {
    auth,
    db
} from "./Js/firebase.js";


import {
    onAuthStateChanged
} from "https://www.gstatic.com/firebasejs/12.18.0/firebase-auth.js";


import {
    collection,
    getDocs,
    getDoc,
    doc,
    addDoc,
    updateDoc,
    deleteDoc,
    query,
    where,
    serverTimestamp
} from "https://www.gstatic.com/firebasejs/12.18.0/firebase-firestore.js";


/* =====================================================
   VARIABLES
===================================================== */

let empresaIdActual = "";

let empresaNombreActual = "";

let clientes = [];

let presupuestos = [];

let trabajos = [];

let items = [];

let trabajoEditandoId = null;

===================================================== */

/* =====================================================
   MENSAJES
===================================================== */

function mostrarMensaje(texto,tipo){

    mensaje.textContent = texto;

    mensaje.className =
        "mensaje " + tipo;

    window.scrollTo({
        top:0,
        behavior:"smooth"
    });

    setTimeout(() => {

        mensaje.textContent = "";

        mensaje.className =
            "mensaje";

    },6000);

}


/* =====================================================
   FECHA HOY
===================================================== */

function fechaHoy(){

    const fecha =
        new Date();

    return (
        fecha.getFullYear() +
        "-" +
        String(
            fecha.getMonth()+1
        ).padStart(2,"0") +
        "-" +
        String(
            fecha.getDate()
        ).padStart(2,"0")
    );

}


/* =====================================================
   LIMPIAR ID
===================================================== */

function limpiarId(valor){

    if(
        valor === undefined ||
        valor === null
    ){

        return "";

    }

    return String(valor).trim();

}


/* =====================================================
   ESCAPE HTML
===================================================== */

function escapeHTML(texto){

    return String(texto ?? "")
        .replace(/&/g,"&amp;")
        .replace(/</g,"&lt;")
        .replace(/>/g,"&gt;")
        .replace(/"/g,"&quot;")
        .replace(/'/g,"&#039;");

}


/* =====================================================
   NOMBRE CLIENTE
===================================================== */

function obtenerNombreCliente(cliente){

    if(!cliente){
        return "Cliente";
    }

    if(cliente.nombreCompleto){
        return cliente.nombreCompleto;
    }

    if(cliente.razonSocial){
        return cliente.razonSocial;
    }

    if(cliente.empresa){
        return cliente.empresa;
    }

    if(
        cliente.nombre &&
        cliente.apellido
    ){

        return (
            cliente.nombre +
            " " +
            cliente.apellido
        );

    }

    if(cliente.nombre){
        return cliente.nombre;
    }

    return "Cliente sin nombre";

}


/* =====================================================
   NÚMERO PRESUPUESTO
===================================================== */

function obtenerNumeroPresupuesto(presupuesto){

    if(!presupuesto){
        return "Presupuesto";
    }

    return (
        presupuesto.numero ||
        presupuesto.numeroPresupuesto ||
        presupuesto.nro ||
        presupuesto.codigo ||
        presupuesto.numeroDocumento ||
        presupuesto.titulo ||
        presupuesto.nombre ||
        presupuesto.id
    );

}


/* =====================================================
   CLIENTE DEL PRESUPUESTO
===================================================== */

function obtenerClienteIdPresupuesto(
    presupuesto
){

    if(!presupuesto){
        return "";
    }

    const campos = [

        "clienteId",
        "idCliente",
        "clienteID",
        "cliente_id",
        "id_cliente"

    ];


    for(
        const campo of campos
    ){

        if(
            presupuesto[campo] !==
            undefined &&
            presupuesto[campo] !==
            null &&
            String(
                presupuesto[campo]
            ).trim() !== ""
        ){

            return limpiarId(
                presupuesto[campo]
            );

        }

    }


    if(
        presupuesto.cliente &&
        typeof presupuesto.cliente ===
        "object"
    ){

        return limpiarId(
            presupuesto.cliente.id ||
            presupuesto.cliente.clienteId
        );

    }


    return limpiarId(
        presupuesto.cliente
    );

}


/* =====================================================
   OBTENER EMPRESA DEL USUARIO
===================================================== */

async function obtenerEmpresa(){

    if(!usuarioActual){

        throw new Error(
            "No hay usuario autenticado."
        );

    }


    const usuarioRef =
        doc(
            db,
            "usuarios",
            usuarioActual.uid
        );


    const usuarioSnap =
        await getDoc(
            usuarioRef
        );


    if(!usuarioSnap.exists()){

        throw new Error(
            "No existe el usuario en Firestore."
        );

    }


    const datosUsuario =
        usuarioSnap.data();


    const empresaId =
        datosUsuario.empresaId ||
        datosUsuario.idEmpresa ||
        datosUsuario.companyId;


    if(!empresaId){

        throw new Error(
            "El usuario no tiene empresaId asociado."
        );

    }


    empresaIdActual =
        limpiarId(
            empresaId
        );


    empresaNombreActual =
        String(
            datosUsuario.nombreEmpresa ||
            datosUsuario.empresaNombre ||
            ""
        );


    try{

        const empresaRef =
            doc(
                db,
                "empresas",
                empresaIdActual
            );


        const empresaSnap =
            await getDoc(
                empresaRef
            );


        if(empresaSnap.exists()){

            const datosEmpresa =
                empresaSnap.data();


            empresaNombreActual =
                String(
                    datosEmpresa.nombreEmpresa ||
                    datosEmpresa.nombre ||
                    datosEmpresa.razonSocial ||
                    empresaNombreActual ||
                    "GESBASE"
                );

        }

    }
    catch(error){

        console.warn(
            "No se pudo cargar nombre de empresa:",
            error
        );

    }


    if(!empresaNombreActual){

        empresaNombreActual =
            "GESBASE";

    }

}


/* =====================================================
   AUTENTICACIÓN
===================================================== */

onAuthStateChanged(
    auth,
    async usuario => {

        if(!usuario){

            window.location.href =
                "login.html";

            return;

        }


        try{

            usuarioActual =
                usuario;


            await obtenerEmpresa();

            await cargarClientes();

            await cargarPresupuestos();

            await cargarTrabajos();

            cargarSelectClientes();

            agregarItem();


        }
        catch(error){

            console.error(
                "ERROR DE INICIO:",
                error
            );


            mostrarMensaje(
                "❌ No se pudo conectar con GESBASE: " +
                error.message,
                "error"
            );

        }

    }
);


/* =====================================================
   CARGAR CLIENTES
===================================================== */

async function cargarClientes(){

    clientes = [];


    /*
     * IMPORTANTE:
     *
     * Los clientes se buscan por empresaId.
     *
     * Esto permite que aparezcan todos los clientes
     * actuales y también los nuevos que se creen
     * posteriormente para esta empresa.
     */

    try{

        const consulta =
            query(
                collection(
                    db,
                    "clientes"
                ),
                where(
                    "empresaId",
                    "==",
                    empresaIdActual
                )
            );


        const snapshot =
            await getDocs(
                consulta
            );


        snapshot.forEach(
            documento => {

                clientes.push({

                    id:
                        documento.id,

                    ...documento.data()

                });

            }
        );

    }
    catch(error){

        console.error(
            "Error cargando clientes por empresaId:",
            error
        );


        /*
         * Compatibilidad con clientes antiguos
         * guardados solamente con uid.
         */

        const consultaUid =
            query(
                collection(
                    db,
                    "clientes"
                ),
                where(
                    "uid",
                    "==",
                    usuarioActual.uid
                )
            );


        const snapshotUid =
            await getDocs(
                consultaUid
            );


        const idsExistentes =
            new Set(
                clientes.map(
                    cliente =>
                        cliente.id
                )
            );


        snapshotUid.forEach(
            documento => {

                if(
                    !idsExistentes.has(
                        documento.id
                    )
                ){

                    clientes.push({

                        id:
                            documento.id,

                        ...documento.data()

                    });

                }

            }
        );

    }


    clientes.sort(
        (a,b) => {

            return obtenerNombreCliente(a)
                .localeCompare(
                    obtenerNombreCliente(b),
                    "es"
                );

        }
    );


    console.log(
        "GESBASE CLIENTES:",
        clientes
    );

}


/* =====================================================
   CARGAR PRESUPUESTOS
===================================================== */

async function cargarPresupuestos(){

    presupuestos = [];


    try{

        const consulta =
            query(
                collection(
                    db,
                    "presupuestos"
                ),
                where(
                    "empresaId",
                    "==",
                    empresaIdActual
                )
            );


        const snapshot =
            await getDocs(
                consulta
            );


        snapshot.forEach(
            documento => {

                presupuestos.push({

                    id:
                        documento.id,

                    ...documento.data()

                });

            }
        );

    }
    catch(error){

        console.error(
            "Error cargando presupuestos:",
            error
        );

    }


    console.log(
        "GESBASE PRESUPUESTOS:",
        presupuestos
    );

}


/* =====================================================
   CARGAR TRABAJOS
===================================================== */

async function cargarTrabajos(){

    trabajos = [];


    const consulta =
        query(
            collection(
                db,
                "trabajos"
            ),
            where(
                "empresaId",
                "==",
                empresaIdActual
            )
        );


    const snapshot =
        await getDocs(
            consulta
        );


    snapshot.forEach(
        documento => {

            trabajos.push({

                id:
                    documento.id,

                ...documento.data()

            });

        }
    );


    mostrarTrabajos();

}


/* =====================================================
   SELECT CLIENTES
===================================================== */

function cargarSelectClientes(){

    clienteSelect.innerHTML = "";

    const opcion =
        document.createElement("option");

    opcion.value = "";

    opcion.textContent =
        clientes.length
        ?
        "Seleccioná un cliente"
        :
        "No hay clientes registrados";

    clienteSelect.appendChild(
        opcion
    );


    clientes.forEach(
        cliente => {

            const option =
                document.createElement(
                    "option"
                );


            option.value =
                cliente.id;


            option.textContent =
                obtenerNombreCliente(
                    cliente
                );


            clienteSelect.appendChild(
                option
            );

        }
    );

}


/* =====================================================
   CLIENTE CAMBIA
===================================================== */

clienteSelect.addEventListener(
    "change",
    () => {

        const clienteId =
            limpiarId(
                clienteSelect.value
            );


        presupuestoSelect.innerHTML = `

            <option value="">
                Seleccioná un presupuesto
            </option>

        `;


        presupuestoSelect.disabled =
            true;


        if(!clienteId){

            return;

        }


        const lista =
            presupuestos.filter(
                presupuesto => {

                    return (
                        obtenerClienteIdPresupuesto(
                            presupuesto
                        ) ===
                        clienteId
                    );

                }
            );


        lista.forEach(
            presupuesto => {

                const option =
                    document.createElement(
                        "option"
                    );


                option.value =
                    presupuesto.id;


                option.textContent =
                    obtenerNumeroPresupuesto(
                        presupuesto
                    );


                presupuestoSelect.appendChild(
                    option
                );

            }
        );


        if(lista.length){

            presupuestoSelect.disabled =
                false;

        }
        else{

            presupuestoSelect.innerHTML = `

                <option value="">
                    No hay presupuestos para este cliente
                </option>

            `;

        }

    }
);


/* =====================================================
   AGREGAR ÍTEM
===================================================== */

btnAgregarItem.addEventListener(
    "click",
    agregarItem
);


function agregarItem(
    datos = null
){

    const itemId =
        Date.now() +
        Math.random();


    const item = {

        id:
            itemId,

        tipo:
            datos?.tipo ||
            "",

        denominacion:
            datos?.denominacion ||
            "",

        unidad:
            datos?.unidad ||
            "UN",

        cantidad:
            Number(
                datos?.cantidad ||
                0
            ),

        realizado:
            Number(
                datos?.realizado ||
                0
            )

    };


    items.push(item);

    renderItems();

}


/* =====================================================
   RENDER ITEMS
===================================================== */

function renderItems(){

    itemsTrabajo.innerHTML =
        "";


    sinItems.style.display =
        items.length
        ?
        "none"
        :
        "block";


    items.forEach(
        item => {

            const div =
                document.createElement(
                    "div"
                );


            div.className =
                "item";


            div.dataset.id =

/* =====================================================
   CALCULAR AVANCE
===================================================== */

function calcularAvance(item){

    const cantidad =
        Number(
            item.cantidad
        ) || 0;


    const realizado =
        Number(
            item.realizado
        ) || 0;


    if(cantidad <= 0){

        return 0;

    }


    let porcentaje =
        (
            realizado /
            cantidad
        ) *
        100;


    if(porcentaje < 0){
        porcentaje = 0;
    }


    if(porcentaje > 100){
        porcentaje = 100;
    }


    return porcentaje;

}


/* =====================================================
   ACTUALIZAR AVANCE VISUAL
===================================================== */

function actualizarAvance(
    item,
    elemento
){

    const porcentaje =
        calcularAvance(
            item
        );


    elemento.querySelector(
        ".avance-numero"
    ).textContent =
        porcentaje.toFixed(2) +
        "%";


    elemento.querySelector(
        ".item-avance-progreso"
    ).style.width =
        porcentaje +
        "%";

}


/* =====================================================
   VALIDAR ITEMS
===================================================== */

function validarItems(){

    if(items.length === 0){

        return "Agregá al menos un ítem de trabajo.";

    }


    for(
        let i = 0;
        i < items.length;
        i++
    ){

        const item =
            items[i];


        if(
            !String(
                item.tipo
            ).trim()
        ){

            return (
                "Completá el tipo de trabajo del ítem " +
                (i+1) +
                "."
            );

        }


        if(
            !String(
                item.denominacion
            ).trim()
        ){

            return (
                "Completá la denominación del ítem " +
                (i+1) +
                "."
            );

        }


        if(
            !item.unidad
        ){

            return (
                "Seleccioná la unidad del ítem " +
                (i+1) +
                "."
            );

        }


        if(
            Number(item.cantidad) <= 0
        ){

            return (
                "La cantidad total del ítem " +
                (i+1) +
                " debe ser mayor que cero."
            );

        }


        if(
            Number(item.realizado) < 0
        ){

            return (
                "La cantidad realizada no puede ser negativa."
            );

        }


        if(
            Number(item.realizado) >
            Number(item.cantidad)
        ){

            return (
                "La cantidad realizada no puede superar la cantidad total en el ítem " +
                (i+1) +
                "."
            );

        }

    }


    return "";

}

/* =====================================================
   AVANCE GENERAL
===================================================== */

function calcularAvanceGeneral(
    lista
){

    if(
        !lista ||
        lista.length === 0
    ){

        return 0;

    }


    let totalCantidad = 0;

    let totalRealizado = 0;


    lista.forEach(
        item => {

            totalCantidad +=
                Number(
                    item.cantidad
                ) || 0;

            totalRealizado +=
                Number(
                    item.realizado
                ) || 0;

        }
    );


    if(totalCantidad <= 0){

        return 0;

    }


    return Math.min(
        100,
        Math.max(
            0,
            (
                totalRealizado /
                totalCantidad
            ) *
            100
        )
    );

}

/* =====================================================
   BUSCAR CLIENTE
===================================================== */

function obtenerNombreClientePorId(
    id
){

    const cliente =
        clientes.find(
            item =>
                limpiarId(
                    item.id
                ) ===
                limpiarId(id)
        );


    return cliente
        ?
        obtenerNombreCliente(
            cliente
        )
        :
        "Cliente";

}


/* =====================================================
   BUSCAR PRESUPUESTO
===================================================== */

function obtenerNumeroPresupuestoPorId(
    id
){

    const presupuesto =
        presupuestos.find(
            item =>
                limpiarId(
                    item.id
                ) ===
                limpiarId(id)
        );


    return presupuesto
        ?
        obtenerNumeroPresupuesto(
            presupuesto
        )
        :
        "Presupuesto";

}


/* =====================================================
   EDITAR TRABAJO
===================================================== */

function editarTrabajo(id){

    const trabajo =
        trabajos.find(
            item =>
                limpiarId(
                    item.id
                ) ===
                limpiarId(id)
        );


    if(!trabajo){

        mostrarMensaje(
            "No se encontró el trabajo.",
            "error"
        );

        return;

    }


    trabajoEditandoId =
        id;


    clienteSelect.value =
        limpiarId(
            trabajo.clienteId
        );


    clienteSelect.dispatchEvent(
        new Event("change")
    );


    setTimeout(
        () => {

            presupuestoSelect.value =
                limpiarId(
                    trabajo.presupuestoId
                );

            presupuestoSelect.dispatchEvent(
                new Event("change")
            );

        },
        100
    );


    nombreTrabajo.value =
        trabajo.nombreTrabajo ||
        trabajo.nombre ||
        "";


    descripcion.value =
        trabajo.descripcionTrabajo ||
        trabajo.descripcion ||
        "";


    fechaInicio.value =
        trabajo.fechaInicio ||
        "";


    fechaFin.value =
        trabajo.fechaFin ||
        "";


    estadoTrabajo.value =
        trabajo.estado ||
        "pendiente";


    responsable.value =
        trabajo.responsable ||
        "";


    items =
        [];


    if(
        Array.isArray(
            trabajo.items
        )
    ){

        trabajo.items.forEach(
            item => {

                items.push({

                    id:
                        Date.now() +
                        Math.random(),

                    tipo:
                        item.tipo ||
                        "",

                    denominacion:
                        item.denominacion ||
                        "",

                    unidad:
                        item.unidad ||
                        "UN",

                    cantidad:
                        Number(
                            item.cantidad ||
                            0
                        ),

                    realizado:
                        Number(
                            item.realizado ||
                            0
                        )

                });

            }
        );

    }


    if(items.length === 0){

        agregarItem();

    }
    else{

        renderItems();

    }


    btnGuardar.textContent =
        "💾 Actualizar trabajo";


    mostrarMensaje(
        "✏️ Trabajo cargado para editar.",
        "info"
    );


    window.scrollTo({
        top:0,
        behavior:"smooth"
    });

}


/* =====================================================

===================================================== */

async function eliminarTrabajo(id){

    const confirmar =

            "¿Seguro que querés eliminar este trabajo?\n\nEsta acción no se puede deshacer."

    try{

        await deleteDoc(

                "trabajos",

            )

        mostrarMensaje(

            error.message,
