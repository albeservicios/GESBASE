<!DOCTYPE html>
<html lang="es">

<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#111827">

<title>Trabajos - GESBASE</title>

<style>

*{
    box-sizing:border-box;
    margin:0;
    padding:0;
    font-family:Arial,sans-serif;
}

body{
    background:#f3f4f6;
    color:#111827;
    min-height:100vh;
}

header{
    background:#111827;
    color:white;
    padding:18px 20px;
}

.header-content{
    max-width:1100px;
    margin:auto;
    display:flex;
    justify-content:space-between;
    align-items:center;
    gap:15px;
}

.logo{
    font-size:24px;
    font-weight:bold;
}

.subtitle{
    font-size:12px;
    color:#d1d5db;
    margin-top:3px;
}

.btn-back{
    border:none;
    background:#374151;
    color:white;
    padding:10px 14px;
    border-radius:8px;
    cursor:pointer;
}

.container{
    max-width:1100px;
    margin:25px auto;
    padding:0 15px 40px;
}

.title-section{
    display:flex;
    justify-content:space-between;
    align-items:center;
    gap:15px;
    margin-bottom:20px;
    flex-wrap:wrap;
}

h1{
    font-size:28px;
}

.description{
    color:#6b7280;
    margin-top:5px;
}

.btn-primary{
    border:none;
    background:#111827;
    color:white;
    padding:12px 18px;
    border-radius:8px;
    cursor:pointer;
    font-weight:bold;
}

.btn-secondary{
    border:none;
    background:#e5e7eb;
    color:#111827;
    padding:12px 18px;
    border-radius:8px;
    cursor:pointer;
    font-weight:bold;
}

.card{
    background:white;
    border-radius:12px;
    padding:20px;
    margin-bottom:20px;
    box-shadow:0 2px 8px rgba(0,0,0,.08);
}

.filters{
    display:grid;
    grid-template-columns:2fr 1fr;
    gap:12px;
}

input,
select,
textarea{
    width:100%;
    padding:12px;
    border:1px solid #d1d5db;
    border-radius:8px;
    font-size:15px;
    background:white;
}

textarea{
    min-height:100px;
    resize:vertical;
}

label{
    display:block;
    font-weight:bold;
    margin-bottom:6px;
}

.form-grid{
    display:grid;
    grid-template-columns:1fr 1fr;
    gap:15px;
}

.form-group{
    margin-bottom:15px;
}

.full{
    grid-column:1/-1;
}

.form-actions{
    display:flex;
    justify-content:flex-end;
    gap:10px;
    margin-top:20px;
}

.hidden{
    display:none !important;
}

.message{
    padding:15px;
    border-radius:8px;
    background:#f9fafb;
    color:#6b7280;
    text-align:center;
}

.jobs{
    display:grid;
    gap:15px;
}

.job{
    border:1px solid #e5e7eb;
    border-radius:10px;
    padding:18px;
    background:white;
}

.job-header{
    display:flex;
    justify-content:space-between;
    align-items:flex-start;
    gap:10px;
    flex-wrap:wrap;
    margin-bottom:12px;
}

.job-title{
    font-size:18px;
    font-weight:bold;
}

.job-info{
    display:grid;
    grid-template-columns:repeat(2,1fr);
    gap:8px;
    color:#4b5563;
    font-size:14px;
}

.status{
    display:inline-block;
    padding:6px 10px;
    border-radius:20px;
    background:#e5e7eb;
    font-size:12px;
    font-weight:bold;
}

.footer{
    text-align:center;
    color:#6b7280;
    font-size:12px;
    margin-top:30px;
}

@media(max-width:700px){

    .header-content{
        align-items:flex-start;
    }

    .filters{
        grid-template-columns:1fr;
    }

    .form-grid{
        grid-template-columns:1fr;
    }

    .full{
        grid-column:auto;
    }

    h1{
        font-size:24px;
    }

    .title-section{
        align-items:stretch;
    }

    .btn-primary{
        width:100%;
    }

    .form-actions{
        flex-direction:column;
    }

    .form-actions button{
        width:100%;
    }

    .job-info{
        grid-template-columns:1fr;
    }

}

</style>
</head>

<body>

<header>

<div class="header-content">

<div>

<div class="logo">
GESBASE
</div>

<div class="subtitle">
Tu empresa. Todo organizado.
</div>

</div>

<button
class="btn-back"
onclick="volverPanel()"
>
← Volver
</button>

</div>

</header>


<main class="container">


<section class="title-section">

<div>

<h1>
Trabajos
</h1>

<p class="description">
Administrá los trabajos de tu empresa.
</p>

</div>


<button
class="btn-primary"
onclick="mostrarFormulario()"
>
+ Nuevo trabajo
</button>

</section>


<!-- FILTROS -->

<section class="card">

<div class="filters">

<input
type="search"
id="buscarTrabajo"
placeholder="Buscar trabajo o lugar..."
oninput="filtrarTrabajos()"
>

<select
id="filtroEstado"
onchange="filtrarTrabajos()"
>

<option value="">
Todos los estados
</option>

<option value="Pendiente">
Pendiente
</option>

<option value="Asignado">
Asignado
</option>

<option value="En curso">
En curso
</option>

<option value="Pausado">
Pausado
</option>

<option value="Terminado">
Terminado
</option>

<option value="Cobrado">
Cobrado
</option>

</select>

</div>

</section>


<!-- FORMULARIO -->

<section
id="formularioTrabajo"
class="card hidden"
>

<h2>
Nuevo trabajo
</h2>

<br>


<form id="trabajoForm">


<div class="form-grid">


<div class="form-group">

<label for="clienteId">
Cliente
</label>

<select id="clienteId">

<option value="">
Seleccionar cliente
</option>

</select>

</div>


<div class="form-group">

<label for="presupuestoId">
Presupuesto
</label>

<select id="presupuestoId">

<option value="">
Sin presupuesto asociado
</option>

</select>

</div>


<div class="form-group full">

<label for="descripcion">
Descripción del trabajo
</label>

<input
type="text"
id="descripcion"
placeholder="Ej.: Instalación de Durlock"
required
>

</div>


<div class="form-group">

<label for="lugar">
Lugar / Dirección
</label>

<input
type="text"
id="lugar"
placeholder="Dirección del trabajo"
>

</div>


<div class="form-group">

<label for="estado">
Estado
</label>

<select id="estado">

<option value="Pendiente">
Pendiente
</option>

<option value="Asignado">
Asignado
</option>

<option value="En curso">
En curso
</option>

<option value="Pausado">
Pausado
</option>

<option value="Terminado">
Terminado
</option>

<option value="Cobrado">
Cobrado
</option>

</select>

</div>


<div class="form-group">

<label for="fechaInicio">
Fecha de inicio
</label>

<input
type="date"
id="fechaInicio"
>

</div>


<div class="form-group">

<label for="fechaFin">
Fecha prevista de finalización
</label>

<input
type="date"
id="fechaFin"
>

</div>


<div class="form-group full">

<label for="observaciones">
Observaciones
</label>

<textarea
id="observaciones"
placeholder="Notas relacionadas con el trabajo..."
></textarea>

</div>

</div>


<div class="form-actions">

<button
type="button"
class="btn-secondary"
onclick="ocultarFormulario()"
>
Cancelar
</button>


<button
type="submit"
class="btn-primary"
>
Guardar trabajo
</button>

</div>

</form>

</section>


<!-- LISTADO -->

<section class="card">

<h2>
Mis trabajos
</h2>

<br>

<div
id="listaTrabajos"
class="jobs"
>

<div class="message">
Cargando trabajos...
</div>

</div>

</section>


<div class="footer">
GESBASE — Del presupuesto a la rentabilidad.
</div>


</main>


<script>

function mostrarFormulario(){

document
.getElementById("formularioTrabajo")
.classList.remove("hidden");

window.scrollTo({
top:0,
behavior:"smooth"
});

}


function ocultarFormulario(){

document
.getElementById("formularioTrabajo")
.classList.add("hidden");

}


function volverPanel(){

window.location.href =
"index.html";

}

</script>


<!-- ÚNICO JAVASCRIPT DEL MÓDULO -->

<script
type="module"
src="Js/trabajos.js"
></script>


</body>

</html>
