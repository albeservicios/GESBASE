<!DOCTYPE html>
<html lang="es">

<head>

<meta charset="UTF-8">

<meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
>

<meta
    name="theme-color"
    content="#111827"
>

<meta
    name="description"
    content="GESBASE - Gestión de trabajos"
>

<title>Trabajos - GESBASE</title>

<style>

*{
    box-sizing:border-box;
}

body{
    margin:0;
    font-family:Arial,Helvetica,sans-serif;
    background:#f3f4f6;
    color:#111827;
}

header{
    background:#111827;
    color:white;
    padding:20px;
    text-align:center;
}

header h1{
    margin:0;
    font-size:24px;
}

header p{
    margin:6px 0 0;
    color:#d1d5db;
    font-size:14px;
}

.container{
    max-width:1100px;
    margin:auto;
    padding:18px;
}

.card{
    background:white;
    border-radius:14px;
    padding:20px;
    margin-bottom:18px;
    box-shadow:0 3px 12px rgba(0,0,0,.08);
}

.card h2{
    margin:0 0 18px;
    font-size:20px;
}

.grid{
    display:grid;
    grid-template-columns:repeat(2,1fr);
    gap:15px;
}

.full{
    grid-column:1/-1;
}

.field{
    display:flex;
    flex-direction:column;
}

label{
    font-weight:bold;
    font-size:14px;
    margin-bottom:6px;
}

input,
select,
textarea{
    width:100%;
    padding:12px;
    border:1px solid #d1d5db;
    border-radius:8px;
    font-size:16px;
    background:white;
}

textarea{
    min-height:110px;
    resize:vertical;
}

button{
    border:0;
    border-radius:8px;
    padding:12px 18px;
    font-size:15px;
    font-weight:bold;
    cursor:pointer;
}

button:disabled{
    opacity:.6;
    cursor:not-allowed;
}

.btn-primary{
    background:#2563eb;
    color:white;
}

.btn-success{
    background:#16a34a;
    color:white;
}

.btn-secondary{
    background:#374151;
    color:white;
}

.btn-danger{
    background:#dc2626;
    color:white;
}

.btn-back{
    background:#6b7280;
    color:white;
    margin-bottom:15px;
}

.buttons{
    display:flex;
    gap:10px;
    flex-wrap:wrap;
    margin-top:18px;
}

.mensaje{
    display:none;
    padding:14px;
    border-radius:8px;
    margin-bottom:15px;
    font-weight:bold;
}

.mensaje.exito{
    display:block;
    background:#dcfce7;
    color:#166534;
}

.mensaje.error{
    display:block;
    background:#fee2e2;
    color:#991b1b;
}

.mensaje.info{
    display:block;
    background:#dbeafe;
    color:#1e40af;
}

.estado{
    background:#f9fafb;
    border:1px solid #e5e7eb;
    border-radius:10px;
    padding:14px;
    margin-bottom:18px;
    line-height:1.7;
}

.fila{
    display:flex;
    justify-content:space-between;
    gap:10px;
    border-bottom:1px solid #e5e7eb;
    padding:5px 0;
}

.fila:last-child{
    border-bottom:0;
}

.valor{
    font-weight:bold;
    text-align:right;
    word-break:break-word;
}

.info{
    background:#eff6ff;
    border-left:4px solid #2563eb;
    padding:13px;
    border-radius:7px;
    margin-top:15px;
    line-height:1.5;
}

.tabla-container{
    overflow-x:auto;
}

table{
    width:100%;
    border-collapse:collapse;
    min-width:900px;
}

th,
td{
    padding:11px;
    border-bottom:1px solid #e5e7eb;
    text-align:left;
    font-size:13px;
}

th{
    background:#f9fafb;
}

.acciones{
    display:flex;
    gap:6px;
    flex-wrap:wrap;
}

.btn-small{
    padding:8px 10px;
    font-size:12px;
}

.vacio{
    text-align:center;
    padding:25px;
    color:#6b7280;
}

@media(max-width:700px){

    .container{
        padding:12px;
    }

    .card{
        padding:15px;
    }

    .grid{
        grid-template-columns:1fr;
    }

    .full{
        grid-column:auto;
    }

    .buttons{
        flex-direction:column;
    }

    .buttons button{
        width:100%;
    }

    .btn-back{
        width:100%;
    }

    .fila{
        flex-direction:column;
        gap:2px;
    }

    .valor{
        text-align:left;
    }

}

</style>

</head>

<body>

<script type="module">


/* =====================================================
   FIREBASE
===================================================== */

import {
    auth,
    db
} from "./Js/firebase.js";


import {
    onAuthStateChanged
} from "https://www.gstatic.com/firebasejs/12.18.0/firebase-auth.js";


import {
    collection,
    getDocs,
    getDoc,
    doc,
    addDoc,
    updateDoc,
    deleteDoc,
    query,
    where,
    serverTimestamp
} from "https://www.gstatic.com/firebasejs/12.18.0/firebase-firestore.js";


/* =====================================================
   VARIABLES
===================================================== */

let usuarioActual = null;

let empresaIdActual = "";

let empresaNombreActual = "";

let clientes = [];

let presupuestos = [];

let trabajos = [];

let trabajoEditandoId = null;


/* =====================================================
   ELEMENTOS
===================================================== */

const clienteSelect =
    document.getElementById("cliente");

const presupuestoSelect =
    document.getElementById("presupuesto");

const nombreTrabajo =
    document.getElementById("nombreTrabajo");

const descripcion =
    document.getElementById("descripcion");

const fechaInicio =
    document.getElementById("fechaInicio");

const fechaFin =
    document.getElementById("fechaFin");

const estadoTrabajo =
    document.getElementById("estadoTrabajo");

const responsable =
    document.getElementById("responsable");

const btnGuardar =
    document.getElementById("btnGuardar");

const btnLimpiar =
    document.getElementById("btnLimpiar");

const tablaTrabajos =
    document.getElementById("tablaTrabajos");

const mensaje =
    document.getElementById("mensaje");


/* =====================================================
   MENSAJE
===================================================== */

function mostrarMensaje(texto,tipo){

    mensaje.textContent = texto;

    mensaje.className =
        "mensaje " + tipo;

    window.scrollTo({
        top:0,
        behavior:"smooth"
    });

    setTimeout(() => {

        mensaje.textContent = "";

        mensaje.className =
            "mensaje";

    },6000);

}


/* =====================================================
   FECHA
===================================================== */

function fechaHoy(){

    const fecha =
        new Date();

    return (
        fecha.getFullYear() +
        "-" +
        String(
            fecha.getMonth()+1
        ).padStart(2,"0") +
        "-" +
        String(
            fecha.getDate()
        ).padStart(2,"0")
    );

}


/* =====================================================
   LIMPIAR ID
===================================================== */

function limpiarId(valor){

    if(
        valor === undefined ||
        valor === null
    ){

        return "";

    }

    return String(valor).trim();

}


/* =====================================================
   ESCAPE HTML
===================================================== */

function escapeHTML(texto){

    return String(texto ?? "")
        .replace(/&/g,"&amp;")
        .replace(/</g,"&lt;")
        .replace(/>/g,"&gt;")
        .replace(/"/g,"&quot;")
        .replace(/'/g,"&#039;");

}


/* =====================================================
   NOMBRE CLIENTE
===================================================== */

function obtenerNombreCliente(cliente){

    return (
        cliente.nombre ||
        cliente.nombreCliente ||
        cliente.razonSocial ||
        cliente.empresa ||
        cliente.nombreCompleto ||
        (
            cliente.apellido
            ?
            (
                cliente.nombre
                + " "
                + cliente.apellido
            )
            :
            ""
        ) ||
        "Cliente sin nombre"
    );

}


/* =====================================================
   NÚMERO PRESUPUESTO
===================================================== */

function obtenerNumeroPresupuesto(presupuesto){

    return (
        presupuesto.numero ||
        presupuesto.numeroPresupuesto ||
        presupuesto.nro ||
        presupuesto.codigo ||
        presupuesto.numeroDocumento ||
        presupuesto.nombre ||
        presupuesto.titulo ||
        presupuesto.id
    );

}


/* =====================================================
   OBTENER CLIENTE DEL PRESUPUESTO
===================================================== */

function obtenerClienteIdPresupuesto(
    presupuesto
){

    const campos = [

        "clienteId",
        "idCliente",
        "clienteID",
        "cliente_id",
        "id_cliente"

    ];


    for(
        const campo
        of campos
    ){

        if(
            presupuesto[campo] !==
            undefined &&
            presupuesto[campo] !==
            null &&
            String(
                presupuesto[campo]
            ).trim() !== ""
        ){

            return limpiarId(
                presupuesto[campo]
            );

        }

    }


    if(
        presupuesto.cliente &&
        typeof presupuesto.cliente ===
        "object"
    ){

        return limpiarId(
            presupuesto.cliente.id ||
            presupuesto.cliente.clienteId
        );

    }


    return limpiarId(
        presupuesto.cliente
    );

}


/* =====================================================
   OBTENER EMPRESA
===================================================== */

async function obtenerEmpresa(){

    if(!usuarioActual){

        throw new Error(
            "No hay usuario autenticado."
        );

    }


    const usuarioRef =
        doc(
            db,
            "usuarios",
            usuarioActual.uid
        );


    const usuarioSnap =
        await getDoc(
            usuarioRef
        );


    if(!usuarioSnap.exists()){

        throw new Error(
            "No existe el usuario en Firestore."
        );

    }


    const datosUsuario =
        usuarioSnap.data();


    const empresaId =
        datosUsuario.empresaId ||
        datosUsuario.idEmpresa ||
        datosUsuario.companyId;


    if(!empresaId){

        throw new Error(
            "El usuario no tiene empresaId asociado."
        );

    }


    empresaIdActual =
        limpiarId(
            empresaId
        );


    let nombreEmpresa =
        datosUsuario.nombreEmpresa ||
        datosUsuario.empresaNombre ||
        "";


    const empresaRef =
        doc(
            db,
            "empresas",
            empresaIdActual
        );


    const empresaSnap =
        await getDoc(
            empresaRef
        );


    if(empresaSnap.exists()){

        const datosEmpresa =
            empresaSnap.data();


        nombreEmpresa =
            datosEmpresa.nombreEmpresa ||
            datosEmpresa.nombre ||
            datosEmpresa.razonSocial ||
            nombreEmpresa;

    }


    empresaNombreActual =
        String(
            nombreEmpresa ||
            "GESBASE"
        );


    document.getElementById(
        "empresaUsuario"
    ).textContent =
        empresaNombreActual;


    document.getElementById(
        "idEmpresaUsuario"
    ).textContent =
        empresaIdActual;

}


/* =====================================================
   AUTENTICACIÓN
===================================================== */

onAuthStateChanged(
    auth,
    async usuario => {

        if(!usuario){

            document.getElementById(
                "emailUsuario"
            ).textContent =
                "Sin sesión";

            window.location.href =
                "login.html";

            return;

        }


        try{

            usuarioActual =
                usuario;


            document.getElementById(
                "emailUsuario"
            ).textContent =
                usuario.email ||
                "Usuario autenticado";


            await obtenerEmpresa();


            await cargarClientes();


            await cargarPresupuestos();


            await cargarTrabajos();


            cargarSelectClientes();


            mostrarMensaje(
                "✅ GESBASE conectado correctamente.",
                "exito"
            );

        }
        catch(error){

            console.error(
                "ERROR DE CONEXIÓN:",
                error
            );


            mostrarMensaje(
                "❌ Error al conectar con GESBASE: " +
                error.message,
                "error"
            );

        }

    }
);


/* =====================================================
   CARGAR CLIENTES
===================================================== */

async function cargarClientes(){

    clientes = [];


    const referencia =
        collection(
            db,
            "clientes"
        );


    const consulta =
        query(
            referencia,
            where(
                "empresaId",
                "==",
                empresaIdActual
            )
        );


    const snapshot =
        await getDocs(
            consulta
        );


    snapshot.forEach(
        documento => {

            clientes.push({

                id:
                    documento.id,

                ...documento.data()

            });

        }
    );


    console.log(
        "CLIENTES:",
        clientes
    );

}


/* =====================================================
   CARGAR PRESUPUESTOS
===================================================== */

async function cargarPresupuestos(){

    presupuestos = [];


    const consulta =
        query(
            collection(
                db,
                "presupuestos"
            ),
            where(
                "empresaId",
                "==",
                empresaIdActual
            )
        );


    const snapshot =
        await getDocs(
            consulta
        );


    snapshot.forEach(
        documento => {

            presupuestos.push({

                id:
                    documento.id,

                ...documento.data()

            });

        }
    );


    console.log(
        "PRESUPUESTOS:",
        presupuestos
    );

}


/* =====================================================
   CARGAR TRABAJOS
===================================================== */

async function cargarTrabajos(){

    trabajos = [];


    const consulta =
        query(
            collection(
                db,
                "trabajos"
            ),
            where(
                "empresaId",
                "==",
                empresaIdActual
            )
        );


    const snapshot =
        await getDocs(
            consulta
        );


    snapshot.forEach(
        documento => {

            trabajos.push({

                id:
                    documento.id,

                ...documento.data()

            });

        }
    );


    console.log(
        "TRABAJOS:",
        trabajos
    );


    mostrarTrabajos();

}


/* =====================================================
   SELECT CLIENTES
===================================================== */

function cargarSelectClientes(){

    clienteSelect.innerHTML = `

        <option value="">
            Seleccioná un cliente
        </option>

    `;


    clientes.forEach(
        cliente => {

            const option =
                document.createElement(
                    "option"
                );


            option.value =
                cliente.id;


            option.textContent =
                obtenerNombreCliente(
                    cliente
                );


            clienteSelect.appendChild(
                option
            );

        }
    );


    if(clientes.length === 0){

        clienteSelect.innerHTML = `

            <option value="">
                No hay clientes registrados
            </option>

        `;

    }

}


/* =====================================================
   CLIENTE CAMBIA
===================================================== */

clienteSelect.addEventListener(
    "change",
    () => {

        const clienteId =
            limpiarId(
                clienteSelect.value
            );


        presupuestoSelect.innerHTML = `

            <option value="">
                Seleccioná un presupuesto
            </option>

        `;


        presupuestoSelect.disabled =
            true;


        document.getElementById(
            "infoSeleccion"
        ).style.display =
            "none";


        if(!clienteId){

            return;

        }


        const cliente =
            clientes.find(
                item =>
                    limpiarId(
                        item.id
                    ) ===
                    clienteId
            );


        if(!cliente){

            return;

        }


        const presupuestosCliente =
            presupuestos.filter(
                presupuesto => {

                    const idCliente =
                        obtenerClienteIdPresupuesto(
                            presupuesto
                        );


                    return (
                        idCliente ===
                        clienteId
                    );

                }
            );


        presupuestosCliente.forEach(
            presupuesto => {

                const option =
                    document.createElement(
                        "option"
                    );


                option.value =
                    presupuesto.id;


                option.textContent =
                    obtenerNumeroPresupuesto(
                        presupuesto
                    );


                presupuestoSelect.appendChild(
                    option
                );

            }
        );


        if(
            presupuestosCliente.length >
            0
        ){

            presupuestoSelect.disabled =
                false;

        }
        else{

            presupuestoSelect.innerHTML = `

                <option value="">
                    No hay presupuestos para este cliente
                </option>

            `;

        }

    }
);


/* =====================================================
   PRESUPUESTO CAMBIA
===================================================== */

presupuestoSelect.addEventListener(
    "change",
    () => {

        const clienteId =
            limpiarId(
                clienteSelect.value
            );


        const presupuestoId =
            limpiarId(
                presupuestoSelect.value
            );


        const info =
            document.getElementById(
                "infoSeleccion"
            );


        if(
            !clienteId ||
            !presupuestoId
        ){

            info.style.display =
                "none";

            return;

        }


        const presupuesto =
            presupuestos.find(
                item =>
                    limpiarId(
                        item.id
                    ) ===
                    presupuestoId
            );


        if(!presupuesto){

            return;

        }


        const cliente =
            clientes.find(
                item =>
                    limpiarId(
                        item.id
                    ) ===
                    clienteId
            );


        const nombreCliente =
            cliente
            ?
            obtenerNombreCliente(
                cliente
            )
            :
            "Cliente";


        const numero =
            obtenerNumeroPresupuesto(
                presupuesto
            );


        info.innerHTML = `

            <strong>Selección actual</strong><br>

            Cliente:
            ${escapeHTML(nombreCliente)}

            <br>

            Presupuesto:
            ${escapeHTML(numero)}

        `;


        info.style.display =
            "block";

    }
);


/* =====================================================
   GUARDAR
===================================================== */

btnGuardar.addEventListener(
    "click",
    async () => {

        if(!usuarioActual){

            mostrarMensaje(
                "No hay una sesión activa.",
                "error"
            );

            return;

        }


        if(!empresaIdActual){

            mostrarMensaje(
                "No se encontró la empresa.",
                "error"
            );

            return;

        }


        const clienteId =
            limpiarId(
                clienteSelect.value
            );


        const presupuestoId =
            limpiarId(
                presupuestoSelect.value
            );


        const nombre =
            nombreTrabajo.value.trim();


        const descripcionTexto =
            descripcion.value.trim();


        if(!clienteId){

            mostrarMensaje(
                "Seleccioná un cliente.",
                "error"
            );

            return;

        }


        if(!presupuestoId){

            mostrarMensaje(
                "Seleccioná un presupuesto.",
                "error"
            );

            return;

        }


        if(!nombre){

            mostrarMensaje(
                "Ingresá el nombre del trabajo.",
                "error"
            );

            nombreTrabajo.focus();

            return;

        }


        const cliente =
            clientes.find(
                item =>
                    limpiarId(
                        item.id
                    ) ===
                    clienteId
            );


        const presupuesto =
            presupuestos.find(
                item =>
                    limpiarId(
                        item.id
                    ) ===
                    presupuestoId
            );


        if(!cliente){

            mostrarMensaje(
                "No se encontró el cliente.",
                "error"
            );

            return;

        }


        if(!presupuesto){

            mostrarMensaje(
                "No se encontró el presupuesto.",
                "error"
            );

            return;

        }


        const datosTrabajo = {

            empresaId:
                empresaIdActual,

            empresaNombre:
                empresaNombreActual,

            clienteId:
                clienteId,

            clienteNombre:
                obtenerNombreCliente(
                    cliente
                ),

            presupuestoId:
                presupuestoId,

            presupuestoNumero:
                obtenerNumeroPresupuesto(
                    presupuesto
                ),

            nombre:
                nombre,

            nombreTrabajo:
                nombre,

            descripcion:
                descripcionTexto,

            descripcionTrabajo:
                descripcionTexto,

            fechaInicio:
                fechaInicio.value ||
                "",

            fechaFin:
                fechaFin.value ||
                "",

            estado:
                estadoTrabajo.value,

            responsable:
                responsable.value.trim(),

            usuarioId:
                usuarioActual.uid,

            actualizadoEn:
                serverTimestamp()

        };


        btnGuardar.disabled =
            true;


        try{

            if(trabajoEditandoId){

                await updateDoc(
                    doc(
                        db,
                        "trabajos",
                        trabajoEditandoId
                    ),
                    datosTrabajo
                );


                mostrarMensaje(
                    "✅ Trabajo actualizado correctamente.",
                    "exito"
                );

            }
            else{

                datosTrabajo.creadoEn =
                    serverTimestamp();


                await addDoc(
                    collection(
                        db,
                        "trabajos"
                    ),
                    datosTrabajo
                );


                mostrarMensaje(
                    "✅ Trabajo guardado correctamente.",
                    "exito"
                );

            }


            limpiarFormulario();


            await cargarTrabajos();

        }
        catch(error){

            console.error(
                "ERROR GUARDANDO TRABAJO:",
                error
            );


            mostrarMensaje(
                "❌ No se pudo guardar el trabajo: " +
                error.message,
                "error"
            );

        }
        finally{

            btnGuardar.disabled =
                false;

        }

    }
);


/* =====================================================
   MOSTRAR TRABAJOS
===================================================== */

function mostrarTrabajos(){

    tablaTrabajos.innerHTML = "";


    if(trabajos.length === 0){

        tablaTrabajos.innerHTML = `

            <tr>

                <td
                    colspan="7"
                    class="vacio"
                >
                    No hay trabajos registrados.
                </td>

            </tr>

        `;

        return;

    }


    trabajos.forEach(
        trabajo => {

            const fila =
                document.createElement(
                    "tr"
                );


            fila.innerHTML = `

                <td>
                    <strong>
                        ${escapeHTML(
                            trabajo.nombreTrabajo ||
                            trabajo.nombre ||
                            "Trabajo"
                        )}
                    </strong>
                    <br>
                    <small>
                        ${escapeHTML(
                            trabajo.descripcionTrabajo ||
                            trabajo.descripcion ||
                            ""
                        )}
                    </small>
                </td>


                <td>
                    ${escapeHTML(
                        trabajo.clienteNombre ||
                        obtenerNombreClientePorId(
                            trabajo.clienteId
                        )
                    )}
                </td>


                <td>
                    ${escapeHTML(
                        trabajo.presupuestoNumero ||
                        obtenerNumeroPresupuestoPorId(
                            trabajo.presupuestoId
                        )
                    )}
                </td>


                <td>
                    ${escapeHTML(
                        trabajo.estado ||
                        ""
                    )}
                </td>


                <td>
                    ${escapeHTML(
                        trabajo.fechaInicio ||
                        ""
                    )}
                </td>


                <td>
                    ${escapeHTML(
                        trabajo.fechaFin ||
                        ""
                    )}
                </td>


                <td>

                    <div class="acciones">

                        <button
                            type="button"
                            class="btn-secondary btn-small"
                            data-editar="${trabajo.id}"
                        >
                            Editar
                        </button>


                        <button
                            type="button"
                            class="btn-danger btn-small"
                            data-eliminar="${trabajo.id}"
                        >
                            Eliminar
                        </button>

                    </div>

                </td>

            `;


            tablaTrabajos.appendChild(
                fila
            );

        }
    );


    document
        .querySelectorAll(
            "[data-editar]"
        )
        .forEach(
            boton => {

                boton.addEventListener(
                    "click",
                    () => {

                        editarTrabajo(
                            boton.dataset.editar
                        );

                    }
                );

            }
        );


    document
        .querySelectorAll(
            "[data-eliminar]"
        )
        .forEach(
            boton => {

                boton.addEventListener(
                    "click",
                    () => {

                        eliminarTrabajo(
                            boton.dataset.eliminar
                        );

                    }
                );

            }
        );

}


/* =====================================================
   BUSCAR NOMBRE CLIENTE
===================================================== */

function obtenerNombreClientePorId(
    id
){

    const cliente =
        clientes.find(
            item =>
                limpiarId(
                    item.id
                ) ===
                limpiarId(id)
        );


    return cliente
        ?
        obtenerNombreCliente(
            cliente
        )
        :
        "Cliente";

}


/* =====================================================
   BUSCAR NÚMERO PRESUPUESTO
===================================================== */

function obtenerNumeroPresupuestoPorId(
    id
){

    const presupuesto =
        presupuestos.find(
            item =>
                limpiarId(
                    item.id
                ) ===
                limpiarId(id)
        );


    return presupuesto
        ?
        obtenerNumeroPresupuesto(
            presupuesto
        )
        :
        "Presupuesto";

}


/* =====================================================
   EDITAR
===================================================== */

function editarTrabajo(id){

    const trabajo =
        trabajos.find(
            item =>
                limpiarId(
                    item.id
                ) ===
                limpiarId(id)
        );


    if(!trabajo){

        mostrarMensaje(
            "No se encontró el trabajo.",
            "error"
        );

        return;

    }


    trabajoEditandoId =
        id;


    clienteSelect.value =
        limpiarId(
            trabajo.clienteId
        );


    clienteSelect.dispatchEvent(
        new Event("change")
    );


    setTimeout(
        () => {

            presupuestoSelect.value =
                limpiarId(
                    trabajo.presupuestoId
                );


            presupuestoSelect.dispatchEvent(
                new Event("change")
            );

        },
        50
    );


    nombreTrabajo.value =
        trabajo.nombreTrabajo ||
        trabajo.nombre ||
        "";


    descripcion.value =
        trabajo.descripcionTrabajo ||
        trabajo.descripcion ||
        "";


    fechaInicio.value =
        trabajo.fechaInicio ||
        "";


    fechaFin.value =
        trabajo.fechaFin ||
        "";


    estadoTrabajo.value =
        trabajo.estado ||
        "pendiente";


    responsable.value =
        trabajo.responsable ||
        "";


    btnGuardar.textContent =
        "💾 Actualizar trabajo";


    window.scrollTo({
        top:0,
        behavior:"smooth"
    });


    mostrarMensaje(
        "✏️ Trabajo cargado para editar.",
        "info"
    );

}


/* =====================================================
   ELIMINAR
===================================================== */

async function eliminarTrabajo(id){

    const confirmar =
        confirm(
            "¿Seguro que querés eliminar este trabajo?"
        );


    if(!confirmar){

        return;

    }


    try{

        await deleteDoc(
            doc(
                db,
                "trabajos",
                id
            )
        );


        mostrarMensaje(
            "✅ Trabajo eliminado.",
            "exito"
        );


        await cargarTrabajos();

    }
    catch(error){

        console.error(
            "ERROR ELIMINANDO:",
            error
        );


        mostrarMensaje(
            "❌ No se pudo eliminar: " +
            error.message,
            "error"
        );

    }

}


/* =====================================================
   LIMPIAR FORMULARIO
===================================================== */

function limpiarFormulario(){

    trabajoEditandoId =
        null;


    clienteSelect.value =
        "";


    presupuestoSelect.innerHTML = `

        <option value="">
            Seleccioná primero un cliente
        </option>

    `;


    presupuestoSelect.disabled =
        true;


    nombreTrabajo.value =
        "";


    descripcion.value =
        "";


    fechaInicio.value =
        fechaHoy();


    fechaFin.value =
        "";


    estadoTrabajo.value =
        "pendiente";


    responsable.value =
        "";


    document.getElementById(
        "infoSeleccion"
    ).style.display =
        "none";


    btnGuardar.textContent =
        "💾 Guardar trabajo";

}


/* =====================================================
   BOTÓN LIMPIAR
===================================================== */

btnLimpiar.addEventListener(
    "click",
    limpiarFormulario
);


/* =====================================================
   VOLVER
===================================================== */

document
    .getElementById(
        "btnVolver"
    )
    .addEventListener(
        "click",
        () => {

            window.location.href =
                "index.html";

        }
    );


/* =====================================================
   FECHA INICIAL
===================================================== */

fechaInicio.value =
    fechaHoy();


/* =====================================================
   INICIO
===================================================== */

console.log(
    "GESBASE - trabajo.html cargado."
);

</script>
