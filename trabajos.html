/* =====================================================
   FIREBASE
===================================================== */

import {
    auth,
    db
} from "./Js/firebase.js";


import {
    onAuthStateChanged
} from "https://www.gstatic.com/firebasejs/12.18.0/firebase-auth.js";


import {
    doc,
    getDoc,
    collection,
    addDoc,
    serverTimestamp
} from "https://www.gstatic.com/firebasejs/12.18.0/firebase-firestore.js";


/* =====================================================
   ELEMENTOS
===================================================== */

const estado =
document.getElementById("estado");

const contenido =
document.getElementById("contenido");

const presupuestoNumero =
document.getElementById("presupuestoNumero");

const cliente =
document.getElementById("cliente");

const fechaPresupuesto =
document.getElementById("fechaPresupuesto");

const lugarTrabajo =
document.getElementById("lugarTrabajo");

const descripcion =
document.getElementById("descripcion");

const totalPresupuesto =
document.getElementById("totalPresupuesto");

const fechaInicio =
document.getElementById("fechaInicio");

const estadoTrabajo =
document.getElementById("estadoTrabajo");

const responsable =
document.getElementById("responsable");

const observaciones =
document.getElementById("observaciones");

const resumenPresupuesto =
document.getElementById("resumenPresupuesto");

const resumenEstado =
document.getElementById("resumenEstado");

const btnGuardar =
document.getElementById("btnGuardar");

const btnVolver =
document.getElementById("btnVolver");


/* =====================================================
   VARIABLES
===================================================== */

let usuarioActual = null;

let presupuestoActual = null;


/* =====================================================
   OBTENER ID DEL PRESUPUESTO
===================================================== */

/*
   Aceptamos ambos formatos:

   trabajo.html?presupuestoId=123

   trabajo.html?id=123
*/

const parametros =
new URLSearchParams(
    window.location.search
);


const presupuestoId =
parametros.get("presupuestoId") ||
parametros.get("id") ||
parametros.get("presupuestoID") ||
parametros.get("presupuesto_id");


console.log(
    "GESBASE - URL:",
    window.location.href
);


console.log(
    "GESBASE - presupuestoId:",
    presupuestoId
);


/* =====================================================
   FECHA ACTUAL
===================================================== */

function fechaHoy(){

    const ahora =
    new Date();

    const año =
    ahora.getFullYear();

    const mes =
    String(
        ahora.getMonth() + 1
    ).padStart(2,"0");

    const dia =
    String(
        ahora.getDate()
    ).padStart(2,"0");

    return (
        año +
        "-" +
        mes +
        "-" +
        dia
    );

}


fechaInicio.value =
fechaHoy();


/* =====================================================
   TEXTO
===================================================== */

function texto(valor){

    if(
        valor === undefined ||
        valor === null
    ){

        return "";

    }

    return String(valor).trim();

}


/* =====================================================
   NUMERO
===================================================== */

function numero(valor){

    if(
        valor === undefined ||
        valor === null ||
        valor === ""
    ){

        return 0;

    }

    if(typeof valor === "number"){

        return Number.isFinite(valor)
            ? valor
            : 0;

    }

    let valorTexto =
    String(valor)
        .replace(/\$/g,"")
        .replace(/\s/g,"");


    if(valorTexto.includes(",")){

        valorTexto =
        valorTexto
            .replace(/\./g,"")
            .replace(",",".");
    }


    const resultado =
    Number(valorTexto);


    return Number.isFinite(resultado)
        ? resultado
        : 0;

}


/* =====================================================
   DINERO
===================================================== */

function dinero(valor){

    return numero(valor)
        .toLocaleString(
            "es-AR",
            {
                minimumFractionDigits:2,
                maximumFractionDigits:2
            }
        );

}


/* =====================================================
   ESTADO
===================================================== */

function mostrarEstado(
    mensaje,
    tipo
){

    estado.textContent =
    mensaje;

    estado.className =
    "estado " +
    tipo;

}


/* =====================================================
   OBTENER NÚMERO
===================================================== */

function obtenerNumero(datos){

    return (
        datos.numeroAgenda ||
        datos.numero ||
        datos.numeroPresupuesto ||
        datos.codigo ||
        datos.nro ||
        presupuestoId.substring(0,8)
    );

}


/* =====================================================
   OBTENER CLIENTE
===================================================== */

function obtenerCliente(datos){

    return (
        datos.cliente ||
        datos.clienteNombre ||
        datos.nombreCliente ||
        datos.nombre ||
        datos.empresaCliente ||
        datos.nombreEmpresaCliente ||
        "Sin cliente"
    );

}


/* =====================================================
   OBTENER TOTAL
===================================================== */

function obtenerTotal(datos){

    const total =
    numero(
        datos.total ??
        datos.totalFinal ??
        datos.importe ??
        datos.monto
    );


    if(total > 0){

        return total;

    }


    return (
        numero(
            datos.materiales ??
            datos.importeMaterial
        )
        +
        numero(
            datos.manoObra ??
            datos.importeManoObra
        )
        +
        numero(
            datos.viaticos ??
            datos.importeViaticos
        )
        +
        numero(
            datos.flete ??
            datos.importeFlete
        )
    );

}


/* =====================================================
   PERTENECE AL USUARIO
===================================================== */

function perteneceAlUsuario(datos){

    if(!usuarioActual){

        return false;

    }


    const uid =
    usuarioActual.uid;


    if(
        texto(datos.uid) === uid
    ){

        return true;

    }


    if(
        texto(datos.usuarioId) === uid
    ){

        return true;

    }


    if(
        texto(datos.userId) === uid
    ){

        return true;

    }


    /*
     * Compatibilidad con presupuestos
     * guardados por empresa.
     */

    if(
        texto(datos.empresaId) &&
        texto(datos.empresaId) === uid
    ){

        return true;

    }


    /*
     * Compatibilidad con documentos
     * antiguos del administrador.
     */

    if(
        usuarioActual.email &&
        usuarioActual.email.toLowerCase() ===
        "julianbattauz006@gmail.com"
    ){

        return true;

    }


    return false;

}


/* =====================================================
   CARGAR PRESUPUESTO
===================================================== */

async function cargarPresupuesto(){

    if(!presupuestoId){

        mostrarEstado(
            "❌ No se recibió el ID del presupuesto.\n\n" +
            "La dirección debe contener:\n" +
            "trabajo.html?presupuestoId=ID\n\n" +
            "Volvé a Presupuestos y tocá nuevamente 🔧 CREAR TRABAJO.",
            "error"
        );

        return false;

    }


    mostrarEstado(
        "⏳ Cargando presupuesto...",
        "cargando"
    );


    console.log(
        "GESBASE - Buscando presupuesto:",
        presupuestoId
    );


    const referencia =
    doc(
        db,
        "presupuestos",
        presupuestoId
    );


    const documento =
    await getDoc(
        referencia
    );


    console.log(
        "GESBASE - Documento existe:",
        documento.exists()
    );


    if(!documento.exists()){

        mostrarEstado(
            "❌ El presupuesto no existe.\n\n" +
            "ID recibido:\n" +
            presupuestoId,
            "error"
        );

        return false;

    }


    const datos =
    documento.data();


    console.log(
        "GESBASE - Datos presupuesto:",
        datos
    );


    if(
        !perteneceAlUsuario(datos)
    ){

        mostrarEstado(
            "❌ No tenés permiso para crear un trabajo desde este presupuesto.",
            "error"
        );

        return false;

    }


    presupuestoActual =
    datos;


    /* =================================================
       MOSTRAR DATOS
    ================================================= */


    presupuestoNumero.textContent =
    obtenerNumero(datos);


    cliente.textContent =
    obtenerCliente(datos);


    fechaPresupuesto.textContent =
    texto(
        datos.fecha
    ) || "Sin fecha";


    lugarTrabajo.textContent =
    texto(
        datos.lugarTrabajo ||
        datos.lugar
    ) || "Sin informar";


    descripcion.textContent =
    texto(
        datos.descripcion ||
        datos.tareas ||
        datos.concepto ||
        datos.detalle
    ) || "Sin descripción";


    const total =
    obtenerTotal(datos);


    totalPresupuesto.textContent =
    dinero(total);


    resumenPresupuesto.textContent =
    dinero(total);


    contenido.classList.remove(
        "oculto"
    );


    mostrarEstado(
        "✅ Presupuesto cargado correctamente.\n\nAhora podés crear el trabajo.",
        "exito"
    );


    return true;

}


/* =====================================================
   CAMBIO DE ESTADO
===================================================== */

estadoTrabajo.addEventListener(
    "change",
    function(){

        resumenEstado.textContent =
        estadoTrabajo.value;

    }
);


/* =====================================================
   CREAR TRABAJO
===================================================== */

btnGuardar.addEventListener(
    "click",
    async function(){

        if(!usuarioActual){

            mostrarEstado(
                "❌ No hay una sesión activa.",
                "error"
            );

            return;

        }


        if(!presupuestoActual){

            mostrarEstado(
                "❌ El presupuesto todavía no fue cargado.",
                "error"
            );

            return;

        }


        if(!fechaInicio.value){

            mostrarEstado(
                "❌ Ingresá la fecha de inicio.",
                "error"
            );

            fechaInicio.focus();

            return;

        }


        btnGuardar.disabled =
        true;

        btnGuardar.textContent =
        "⏳ Creando trabajo...";


        try{

            const total =
            obtenerTotal(
                presupuestoActual
            );


            /*
             * Creamos el trabajo.
             */

            const referenciaTrabajos =
            collection(
                db,
                "trabajos"
            );


            const nuevoTrabajo = {

                /*
                 * RELACIÓN PRINCIPAL
                 */

                presupuestoId:
                presupuestoId,


                /*
                 * USUARIO
                 */

                uid:
                usuarioActual.uid,

                usuarioId:
                usuarioActual.uid,


                /*
                 * DATOS DEL PRESUPUESTO
                 */

                numeroPresupuesto:
                obtenerNumero(
                    presupuestoActual
                ),

                cliente:
                obtenerCliente(
                    presupuestoActual
                ),

                clienteId:
                presupuestoActual.clienteId ||
                presupuestoActual.idCliente ||
                "",

                fechaPresupuesto:
                presupuestoActual.fecha ||
                "",

                lugarTrabajo:
                presupuestoActual.lugarTrabajo ||
                presupuestoActual.lugar ||
                "",

                descripcion:
                presupuestoActual.descripcion ||
                presupuestoActual.tareas ||
                presupuestoActual.concepto ||
                presupuestoActual.detalle ||
                "",


                /*
                 * IMPORTES
                 */

                materiales:
                numero(
                    presupuestoActual.materiales ??
                    presupuestoActual.importeMaterial
                ),

                manoObra:
                numero(
                    presupuestoActual.manoObra ??
                    presupuestoActual.importeManoObra
                ),

                viaticos:
                numero(
                    presupuestoActual.viaticos ??
                    presupuestoActual.importeViaticos
                ),

                flete:
                numero(
                    presupuestoActual.flete ??
                    presupuestoActual.importeFlete
                ),

                totalPresupuesto:
                total,


                /*
                 * DATOS DEL TRABAJO
                 */

                fechaInicio:
                fechaInicio.value,

                estado:
                estadoTrabajo.value,

                responsable:
                responsable.value.trim(),

                observaciones:
                observaciones.value.trim(),


                /*
                 * FECHAS
                 */

                creado:
                serverTimestamp(),

                actualizado:
                serverTimestamp()

            };


            /*
             * Si existe empresaId,
             * también la guardamos.
             */

            if(
                presupuestoActual.empresaId
            ){

                nuevoTrabajo.empresaId =
                presupuestoActual.empresaId;

            }


            const resultado =
            await addDoc(
                referenciaTrabajos,
                nuevoTrabajo
            );


            console.log(
                "GESBASE - Trabajo creado:",
                resultado.id
            );


            mostrarEstado(
                "✅ TRABAJO CREADO CORRECTAMENTE.\n\n" +
                "ID del trabajo:\n" +
                resultado.id +
                "\n\n" +
                "El trabajo quedó vinculado al presupuesto.",
                "exito"
            );


            btnGuardar.textContent =
            "✅ Trabajo creado";


            /*
             * Después de crear,
             * volvemos a Presupuestos.
             */

            setTimeout(
                function(){

                    window.location.href =
                    "presupuestos.html";

                },
                1500
            );

        }
        catch(error){

            console.error(
                "GESBASE - ERROR CREANDO TRABAJO:",
                error
            );


            let mensaje =
            error?.message ||
            String(error);


            if(
                error?.code ===
                "permission-denied"
            ){

                mensaje =
                "Firebase rechazó la creación del trabajo.\n\n" +
                "Hay que revisar las reglas de Firestore para la colección trabajos.";

            }


            mostrarEstado(
                "❌ No se pudo crear el trabajo.\n\n" +
                "Código: " +
                (
                    error?.code ||
                    "sin código"
                ) +
                "\n\n" +
                mensaje,
                "error"
            );


            btnGuardar.disabled =
            false;

            btnGuardar.textContent =
            "🔧 CREAR TRABAJO";

        }

    }
);


/* =====================================================
   VOLVER
===================================================== */

btnVolver.addEventListener(
    "click",
    function(){

        window.location.href =
        "presupuestos.html";

    }
);


/* =====================================================
   AUTENTICACIÓN
===================================================== */

onAuthStateChanged(
    auth,
    async function(usuario){

        console.log(
            "GESBASE AUTH:",
            usuario
                ? usuario.email
                : "SIN SESIÓN"
        );


        if(!usuario){

            mostrarEstado(
                "❌ No hay una sesión activa.\n\n" +
                "Redirigiendo al inicio de sesión...",
                "error"
            );


            setTimeout(
                function(){

                    window.location.replace(
                        "login.html"
                    );

                },
                1200
            );


            return;

        }


        usuarioActual =
        usuario;


        try{

            /*
             * IMPORTANTE:
             * Primero esperamos a que Firebase
             * confirme la sesión y recién después
             * buscamos el presupuesto.
             */

            await cargarPresupuesto();

        }
        catch(error){

            console.error(
                "GESBASE - ERROR INICIAL:",
                error
            );


            mostrarEstado(
                "❌ No se pudo cargar el trabajo.\n\n" +
                "Código: " +
                (
                    error?.code ||
                    "sin código"
                ) +
                "\n\n" +
                (
                    error?.message ||
                    String(error)
                ),
                "error"
            );

        }

    }
);


/* =====================================================
   CONTROL DE TIEMPO
===================================================== */

setTimeout(
    function(){

        if(
            estado.classList.contains(
                "cargando"
            )
        ){

            mostrarEstado(
                "❌ GESBASE quedó esperando la respuesta de Firebase.\n\n" +
                "Verificá la sesión, Firebase y la dirección del archivo.",
                "error"
            );

        }

    },
    15000
);

</script></body></html>
