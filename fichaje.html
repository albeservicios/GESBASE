<script type="module">


// ==========================================
// FIREBASE
// ==========================================

import {
    auth,
    db
} from "./Js/firebase.js";


import {
    onAuthStateChanged,
    signOut
} from
"https://www.gstatic.com/firebasejs/12.1.0/firebase-auth.js";


import {
    collection,
    addDoc,
    getDocs,
    getDoc,
    doc,
    query,
    where,
    orderBy,
    limit,
    updateDoc,
    serverTimestamp
} from
"https://www.gstatic.com/firebasejs/12.1.0/firebase-firestore.js";


// ==========================================
// ELEMENTOS
// ==========================================

const nombreEmpleado =
document.getElementById(
    "nombreEmpleado"
);

const empresaEmpleado =
document.getElementById(
    "empresaEmpleado"
);

const tarjetaFichaje =
document.getElementById(
    "tarjetaFichaje"
);

const tarjetaHistorial =
document.getElementById(
    "tarjetaHistorial"
);

const estadoTexto =
document.getElementById(
    "estadoTexto"
);

const cronometro =
document.getElementById(
    "cronometro"
);

const btnEntrada =
document.getElementById(
    "btnEntrada"
);

const btnSalida =
document.getElementById(
    "btnSalida"
);

const horaEntrada =
document.getElementById(
    "horaEntrada"
);

const horaSalida =
document.getElementById(
    "horaSalida"
);

const tiempoTrabajado =
document.getElementById(
    "tiempoTrabajado"
);

const datosJornada =
document.getElementById(
    "datosJornada"
);

const historial =
document.getElementById(
    "historial"
);

const mensajeError =
document.getElementById(
    "mensajeError"
);

const mensajeExito =
document.getElementById(
    "mensajeExito"
);

const btnVolver =
document.getElementById(
    "btnVolver"
);


// ==========================================
// VARIABLES
// ==========================================

let usuarioActual =
null;

let empleadoActual =
null;

let empresaId =
"";

let fichajeActivo =
null;

let intervaloCronometro =
null;


// ==========================================
// MENSAJES
// ==========================================

function mostrarError(mensaje){

    mensajeError.textContent =
    mensaje;

    mensajeError.style.display =
    "block";

    mensajeExito.style.display =
    "none";

}


function mostrarExito(mensaje){

    mensajeExito.textContent =
    mensaje;

    mensajeExito.style.display =
    "block";

    mensajeError.style.display =
    "none";

}


function limpiarMensajes(){

    mensajeError.style.display =
    "none";

    mensajeExito.style.display =
    "none";

}


// ==========================================
// TEXTO
// ==========================================

function texto(valor){

    if(
        valor === undefined ||
        valor === null
    ){

        return "";

    }

    return String(valor);

}


// ==========================================
// FECHA LOCAL
// ==========================================

function fechaLocal(){

    const ahora =
    new Date();

    return (
        ahora.getFullYear() +
        "-" +
        String(
            ahora.getMonth()+1
        ).padStart(2,"0") +
        "-" +
        String(
            ahora.getDate()
        ).padStart(2,"0")
    );

}


// ==========================================
// HORA LOCAL
// ==========================================

function horaLocal(){

    const ahora =
    new Date();

    return (
        String(
            ahora.getHours()
        ).padStart(2,"0") +
        ":" +
        String(
            ahora.getMinutes()
        ).padStart(2,"0") +
        ":" +
        String(
            ahora.getSeconds()
        ).padStart(2,"0")
    );

}


// ==========================================
// DURACIÓN
// ==========================================

function formatearDuracion(
    milisegundos
){

    if(
        milisegundos < 0
    ){

        milisegundos = 0;

    }


    const segundosTotales =
    Math.floor(
        milisegundos / 1000
    );


    const horas =
    Math.floor(
        segundosTotales / 3600
    );


    const minutos =
    Math.floor(
        (
            segundosTotales % 3600
        ) / 60
    );


    const segundos =
    segundosTotales % 60;


    return (
        String(horas).padStart(2,"0") +
        ":" +
        String(minutos).padStart(2,"0") +
        ":" +
        String(segundos).padStart(2,"0")
    );

}


// ==========================================
// CONVERTIR FECHA FIREBASE
// ==========================================

function convertirFecha(valor){

    if(!valor){

        return null;

    }


    if(
        typeof valor.toDate ===
        "function"
    ){

        return valor.toDate();

    }


    if(
        valor instanceof Date
    ){

        return valor;

    }


    if(
        typeof valor ===
        "number"
    ){

        return new Date(valor);

    }


    return null;

}


// ==========================================
// BUSCAR EMPLEADO POR UID
// ==========================================

async function buscarEmpleado(){

    if(!usuarioActual){

        throw new Error(
            "No hay un usuario autenticado."
        );

    }


    const referencia =
    collection(
        db,
        "empleados"
    );


    /*
     * Primero buscamos por uid.
     */

    let resultados =
    await getDocs(
        query(
            referencia,
            where(
                "uid",
                "==",
                usuarioActual.uid
            ),
            limit(1)
        )
    );


    /*
     * Algunos sistemas pueden utilizar
     * authUid en lugar de uid.
     */

    if(
        resultados.empty
    ){

        resultados =
        await getDocs(
            query(
                referencia,
                where(
                    "authUid",
                    "==",
                    usuarioActual.uid
                ),
                limit(1)
            )
        );

    }


    if(
        resultados.empty
    ){

        throw new Error(
            "No encontramos un empleado vinculado a esta cuenta de Firebase."
        );

    }


    const documento =
    resultados.docs[0];


    empleadoActual =
    {
        id:
        documento.id,

        ...documento.data()

    };


    /*
     * Comprobamos que esté activo.
     */

    if(
        String(
            empleadoActual.estado || ""
        ).toLowerCase()
        ===
        "inactivo"
    ){

        throw new Error(
            "Tu usuario de empleado se encuentra inactivo."
        );

    }


    empresaId =
    empleadoActual.empresaId ||
    "";


    if(!empresaId){

        throw new Error(
            "El empleado no tiene una empresa asociada."
        );

    }


    nombreEmpleado.textContent =
    (
        texto(
            empleadoActual.nombre
        ) +
        " " +
        texto(
            empleadoActual.apellido
        )
    ).trim() ||
    "Empleado";


    empresaEmpleado.textContent =
    empleadoActual.empresaNombre ||
    "GESBASE";


    tarjetaFichaje.classList.remove(
        "oculto"
    );


    tarjetaHistorial.classList.remove(
        "oculto"
    );

}


// ==========================================
// BUSCAR FICHAJE ACTIVO
// ==========================================

async function buscarFichajeActivo(){

    if(
        !empleadoActual
    ){

        return;

    }


    const referencia =
    collection(
        db,
        "fichajes"
    );


    const consulta =
    query(
        referencia,
        where(
            "empleadoId",
            "==",
            empleadoActual.id
        ),
        where(
            "estado",
            "==",
            "abierto"
        ),
        limit(1)
    );


    const resultados =
    await getDocs(
        consulta
    );


    if(
        resultados.empty
    ){

        fichajeActivo =
        null;

        detenerCronometro();

        mostrarEstadoSinFichar();

        return;

    }


    const documento =
    resultados.docs[0];


    fichajeActivo =
    {
        id:
        documento.id,

        ...documento.data()

    };


    mostrarFichajeActivo();

}


// ==========================================
// SIN FICHAR
// ==========================================

function mostrarEstadoSinFichar(){

    estadoTexto.textContent =
    "SIN FICHAR";


    estadoTexto.className =
    "estado-texto";


    cronometro.textContent =
    "00:00:00";


    cronometro.className =
    "cronometro";


    btnEntrada.disabled =
    false;


    btnSalida.disabled =
    true;


    datosJornada.classList.add(
        "oculto"
    );


    horaEntrada.textContent =
    "-";


    horaSalida.textContent =
    "-";


    tiempoTrabajado.textContent =
    "-";

}


// ==========================================
// FICHAJE ACTIVO
// ==========================================

function mostrarFichajeActivo(){

    if(!fichajeActivo){

        mostrarEstadoSinFichar();

        return;

    }


    estadoTexto.textContent =
    "JORNADA EN CURSO";


    estadoTexto.className =
    "estado-texto entrada";


    cronometro.className =
    "cronometro entrada";


    btnEntrada.disabled =
    true;


    btnSalida.disabled =
    false;


    datosJornada.classList.remove(
        "oculto"
    );


    horaEntrada.textContent =
    texto(
        fichajeActivo.horaEntrada
    );


    horaSalida.textContent =
    "-";


    tiempoTrabajado.textContent =
    "En curso";


    iniciarCronometro();

}


// ==========================================
// CRONÓMETRO
// ==========================================

function iniciarCronometro(){

    detenerCronometro();


    actualizarCronometro();


    intervaloCronometro =
    setInterval(
        actualizarCronometro,
        1000
    );

}


function actualizarCronometro(){

    if(
        !fichajeActivo
    ){

        return;

    }


    const inicio =
    convertirFecha(
        fichajeActivo.entradaTimestamp
    );


    if(!inicio){

        cronometro.textContent =
        "EN CURSO";

        return;

    }


    const diferencia =
    new Date().getTime() -
    inicio.getTime();


    cronometro.textContent =
    formatearDuracion(
        diferencia
    );

}


function detenerCronometro(){

    if(
        intervaloCronometro
    ){

        clearInterval(
            intervaloCronometro
        );

        intervaloCronometro =
        null;

    }

}


// ==========================================
// FICHAR ENTRADA
// ==========================================

btnEntrada.addEventListener(
    "click",
    async function(){

        limpiarMensajes();


        if(
            !empleadoActual
        ){

            mostrarError(
                "No se encontró el empleado autenticado."
            );

            return;

        }


        btnEntrada.disabled =
        true;

        btnEntrada.textContent =
        "REGISTRANDO...";


        try{

            /*
             * Comprobamos nuevamente que
             * no exista una jornada abierta.
             */

            await buscarFichajeActivo();


            if(
                fichajeActivo
            ){

                mostrarError(
                    "Ya tenés una jornada activa."
                );

                return;

            }


            const ahora =
            new Date();


            const nombre =
            (
                texto(
                    empleadoActual.nombre
                ) +
                " " +
                texto(
                    empleadoActual.apellido
                )
            ).trim();


            const datosFichaje = {

                uid:
                usuarioActual.uid,

                empresaId:
                empresaId,

                empleadoId:
                empleadoActual.id,

                empleadoNombre:
                nombre,

                fecha:
                fechaLocal(),

                horaEntrada:
                horaLocal(),

                entradaTimestamp:
                serverTimestamp(),

                estado:
                "abierto",

                salidaTimestamp:
                null,

                horaSalida:
                "",

                duracionSegundos:
                0,

                horasTrabajadas:
                0,

                creado:
                serverTimestamp()

            };


            const referencia =
            await addDoc(
                collection(
                    db,
                    "fichajes"
                ),
                datosFichaje
            );


            fichajeActivo =
            {
                id:
                referencia.id,

                ...datosFichaje,

                entradaTimestamp:
                ahora

            };


            mostrarFichajeActivo();


            mostrarExito(
                "Entrada registrada correctamente."
            );


            await cargarHistorial();

        }
        catch(error){

            console.error(
                "Error entrada:",
                error
            );


            mostrarError(
                "No se pudo registrar la entrada: " +
                (
                    error.message ||
                    "Error desconocido."
                )
            );

        }
        finally{

            btnEntrada.textContent =
            "🟢 FICHAR ENTRADA";

            if(
                fichajeActivo
            ){

                btnEntrada.disabled =
                true;

            }
            else{

                btnEntrada.disabled =
                false;

            }

        }

    }
);


// ==========================================
// FICHAR SALIDA
// ==========================================

btnSalida.addEventListener(
    "click",
    async function(){

        limpiarMensajes();


        if(
            !fichajeActivo
        ){

            mostrarError(
                "No hay una jornada activa."
            );

            return;

        }


        const confirmar =
        confirm(
            "¿Confirmás tu salida?"
        );


        if(!confirmar){

            return;

        }


        btnSalida.disabled =
        true;

        btnSalida.textContent =
        "REGISTRANDO...";


        try{

            const ahora =
            new Date();


            const inicio =
            convertirFecha(
                fichajeActivo.entradaTimestamp
            );


            let duracionSegundos =
            0;


            if(inicio){

                duracionSegundos =
                Math.max(
                    0,
                    Math.floor(
                        (
                            ahora.getTime() -
                            inicio.getTime()
                        ) / 1000
                    )
                );

            }


            const horasTrabajadas =
            duracionSegundos /
            3600;


            const referencia =
            doc(
                db,
                "fichajes",
                fichajeActivo.id
            );


            await updateDoc(
                referencia,
                {

                    horaSalida:
                    horaLocal(),

                    salidaTimestamp:
                    serverTimestamp(),

                    estado:
                    "cerrado",

                    duracionSegundos:
                    duracionSegundos,

                    horasTrabajadas:
                    Number(
                        horasTrabajadas.toFixed(4)
                    )

                }
            );


            detenerCronometro();


            cronometro.textContent =
            formatearDuracion(
                duracionSegundos * 1000
            );


            cronometro.className =
            "cronometro salida";


            estadoTexto.textContent =
            "JORNADA FINALIZADA";


            estadoTexto.className =
            "estado-texto salida";


            horaSalida.textContent =
            horaLocal();


            tiempoTrabajado.textContent =
            formatearDuracion(
                duracionSegundos * 1000
            );


            btnEntrada.disabled =
            true;


            btnSalida.disabled =
            true;


            fichajeActivo =
            null;


            mostrarExito(
                "Salida registrada correctamente."
            );


            await cargarHistorial();

        }
        catch(error){

            console.error(
                "Error salida:",
                error
            );


            mostrarError(
                "No se pudo registrar la salida: " +
                (
                    error.message ||
                    "Error desconocido."
                )
            );


            btnSalida.disabled =
            false;

        }
        finally{

            btnSalida.textContent =
            "🔴 FICHAR SALIDA";

        }

    }
);


// ==========================================
// HISTORIAL
// ==========================================

async function cargarHistorial(){

    if(
        !empleadoActual
    ){

        return;

    }


    historial.innerHTML =
    `
    <div class="cargando">
        Cargando historial...
    </div>
    `;


    try{

        const referencia =
        collection(
            db,
            "fichajes"
        );


        let resultados;


        try{

            const consulta =
            query(
                referencia,
                where(
                    "empleadoId",
                    "==",
                    empleadoActual.id
                ),
                orderBy(
                    "creado",
                    "desc"
                ),
                limit(20)
            );


            resultados =
            await getDocs(
                consulta
            );

        }
        catch(error){

            console.warn(
                "Consulta ordenada no disponible:",
                error
            );


            const consultaSimple =
            query(
                referencia,
                where(
                    "empleadoId",
                    "==",
                    empleadoActual.id
                ),
                limit(20)
            );


            resultados =
            await getDocs(
                consultaSimple
            );

        }


        historial.innerHTML =
        "";


        if(
            resultados.empty
        ){

            historial.innerHTML =
            `
            <div class="sin-registros">
                Todavía no hay fichajes registrados.
            </div>
            `;

            return;

        }


        const registros =
        [];


        resultados.forEach(
            function(documento){

                registros.push({

                    id:
                    documento.id,

                    ...documento.data()

                });

            }
        );


        registros.sort(
            function(a,b){

                return texto(
                    b.fecha
                ).localeCompare(
                    texto(a.fecha)
                );

            }
        );


        registros
        .slice(0,20)
        .forEach(
            function(registro){

                const elemento =
                document.createElement(
                    "div"
                );


                elemento.className =
                "registro";


                const fechaElemento =
                document.createElement(
                    "div"
                );


                fechaElemento.className =
                "registro-fecha";


                fechaElemento.textContent =
                texto(
                    registro.fecha
                );


                const entradaElemento =
                document.createElement(
                    "div"
                );


                entradaElemento.className =
                "registro-linea";


                entradaElemento.textContent =
                "Entrada: " +
                (
                    texto(
                        registro.horaEntrada
                    ) ||
                    "-"
                );


                const salidaElemento =
                document.createElement(
                    "div"
                );


                salidaElemento.className =
                "registro-linea";


                salidaElemento.textContent =
                "Salida: " +
                (
                    texto(
                        registro.horaSalida
                    ) ||
                    "En curso"
                );


                const tiempoElemento =
                document.createElement(
                    "div"
                );


                tiempoElemento.className =
                "registro-linea";


                let duracion =
                "-";


                if(
                    registro.duracionSegundos
                ){

                    duracion =
                    formatearDuracion(
                        Number(
                            registro.duracionSegundos
                        ) * 1000
                    );

                }


                tiempoElemento.textContent =
                "Tiempo: " +
                duracion;


                elemento.appendChild(
                    fechaElemento
                );


                elemento.appendChild(
                    entradaElemento
                );


                elemento.appendChild(
                    salidaElemento
                );


                elemento.appendChild(
                    tiempoElemento
                );


                historial.appendChild(
                    elemento
                );

            }
        );

    }
    catch(error){

        console.error(
            "Error historial:",
            error
        );


        historial.innerHTML =
        `
        <div class="sin-registros">
            No se pudo cargar el historial.
        </div>
        `;

    }

}

btnVolver.addEventListener(
    "click",
    async function(){

        try{

            await signOut(
                auth
            );

        }
        catch(error){

            console.warn(
                "No se pudo cerrar sesión:",
                error
            );

        }


        sessionStorage.clear();


        window.location.href =
        "empleado-login.html";

    }
);


// ==========================================
// INICIO
// ==========================================

onAuthStateChanged(
    auth,
    async function(usuario){

        if(!usuario){

            window.location.href =
            "empleado-login.html";

            return;

        }


        usuarioActual =
        usuario;


        try{

            /*
             * El empleado ya está autenticado.
             * No consultamos usuarios/{uid}.
             * No cargamos toda la colección.
             * Buscamos únicamente su UID.
             */

            await buscarEmpleado();


            await buscarFichajeActivo();


            await cargarHistorial();

        }
        catch(error){

            console.error(
                "Error iniciando fichaje:",
                error
            );


            tarjetaFichaje.classList.add(
                "oculto"
            );


            tarjetaHistorial.classList.add(
                "oculto"
            );


            mostrarError(
                error.message ||
                "No se pudo iniciar el fichaje."
            );

        }

    }
);

// SEGURIDAD

window.addEventListener(
    "beforeunload",
    function(){

        detenerCronometro();

    }
);
