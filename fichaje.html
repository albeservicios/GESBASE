<script type="module">


// ==========================================
// FIREBASE
// ==========================================

import {
    auth,
    db
} from "./Js/firebase.js";


import {
    onAuthStateChanged
} from
"https://www.gstatic.com/firebasejs/12.1.0/firebase-auth.js";


import {
    collection,
    addDoc,
    getDocs,
    getDoc,
    doc,
    query,
    where,
    orderBy,
    limit,
    serverTimestamp
} from
"https://www.gstatic.com/firebasejs/12.1.0/firebase-firestore.js";


// ==========================================
// ELEMENTOS
// ==========================================

const empleadoSelect =
document.getElementById(
    "empleadoSelect"
);

const tarjetaFichaje =
document.getElementById(
    "tarjetaFichaje"
);

const tarjetaHistorial =
document.getElementById(
    "tarjetaHistorial"
);

const estadoTexto =
document.getElementById(
    "estadoTexto"
);

const cronometro =
document.getElementById(
    "cronometro"
);

const btnEntrada =
document.getElementById(
    "btnEntrada"
);

const btnSalida =
document.getElementById(
    "btnSalida"
);

const horaEntrada =
document.getElementById(
    "horaEntrada"
);

const horaSalida =
document.getElementById(
    "horaSalida"
);

const tiempoTrabajado =
document.getElementById(
    "tiempoTrabajado"
);

const datosJornada =
document.getElementById(
    "datosJornada"
);

const historial =
document.getElementById(
    "historial"
);

const mensajeError =
document.getElementById(
    "mensajeError"
);

const mensajeExito =
document.getElementById(
    "mensajeExito"
);

const btnVolver =
document.getElementById(
    "btnVolver"
);


// ==========================================
// VARIABLES
// ==========================================

let usuarioActual =
null;

let datosUsuario =
{};

let empresaId =
"";

let empleados =
[];

let fichajeActivo =
null;

let intervaloCronometro =
null;


// ==========================================
// MENSAJES
// ==========================================

function mostrarError(mensaje){

    mensajeError.textContent =
    mensaje;

    mensajeError.style.display =
    "block";

    mensajeExito.style.display =
    "none";

}


function mostrarExito(mensaje){

    mensajeExito.textContent =
    mensaje;

    mensajeExito.style.display =
    "block";

    mensajeError.style.display =
    "none";

}


function limpiarMensajes(){

    mensajeError.style.display =
    "none";

    mensajeExito.style.display =
    "none";

}


// ==========================================
// TEXTO
// ==========================================

function texto(valor){

    if(
        valor === undefined ||
        valor === null
    ){

        return "";

    }

    return String(valor);

}


// ==========================================
// FECHA LOCAL
// ==========================================

function fechaLocal(){

    const ahora =
    new Date();

    const año =
    ahora.getFullYear();

    const mes =
    String(
        ahora.getMonth()+1
    ).padStart(
        2,
        "0"
    );

    const dia =
    String(
        ahora.getDate()
    ).padStart(
        2,
        "0"
    );

    return (
        año +
        "-" +
        mes +
        "-" +
        dia
    );

}


// ==========================================
// HORA LOCAL
// ==========================================

function horaLocal(){

    const ahora =
    new Date();

    const horas =
    String(
        ahora.getHours()
    ).padStart(
        2,
        "0"
    );

    const minutos =
    String(
        ahora.getMinutes()
    ).padStart(
        2,
        "0"
    );

    const segundos =
    String(
        ahora.getSeconds()
    ).padStart(
        2,
        "0"
    );

    return (
        horas +
        ":" +
        minutos +
        ":" +
        segundos
    );

}


// ==========================================
// DURACIÓN
// ==========================================

function formatearDuracion(
    milisegundos
){

    if(
        milisegundos < 0
    ){

        milisegundos =
        0;

    }


    const segundosTotales =
    Math.floor(
        milisegundos / 1000
    );


    const horas =
    Math.floor(
        segundosTotales / 3600
    );


    const minutos =
    Math.floor(
        (
            segundosTotales % 3600
        ) / 60
    );


    const segundos =
    segundosTotales % 60;


    return (
        String(horas).padStart(2,"0") +
        ":" +
        String(minutos).padStart(2,"0") +
        ":" +
        String(segundos).padStart(2,"0")
    );

}


// ==========================================
// FECHA/HORA FIREBASE
// ==========================================

function convertirFecha(
    valor
){

    if(!valor){

        return null;

    }


    if(
        typeof valor.toDate ===
        "function"
    ){

        return valor.toDate();

    }


    if(
        valor instanceof Date
    ){

        return valor;

    }


    if(
        typeof valor ===
        "number"
    ){

        return new Date(
            valor
        );

    }


    return null;

}


// ==========================================
// CARGAR USUARIO
// ==========================================

async function cargarDatosUsuario(){

    const referencia =
    doc(
        db,
        "usuarios",
        usuarioActual.uid
    );


    const resultado =
    await getDoc(
        referencia
    );


    if(
        resultado.exists()
    ){

        datosUsuario =
        resultado.data();

    }


    empresaId =
    datosUsuario.empresaId ||
    usuarioActual.uid;

}


// ==========================================
// CARGAR EMPLEADOS
// ==========================================

async function cargarEmpleados(){

    empleadoSelect.innerHTML =
    `
    <option value="">
    Seleccioná un empleado
    </option>
    `;


    try{

        const referencia =
        collection(
            db,
            "empleados"
        );


        let resultados;


        try{

            const consulta =
            query(
                referencia,
                where(
                    "empresaId",
                    "==",
                    empresaId
                )
            );


            resultados =
            await getDocs(
                consulta
            );

        }
        catch(error){

            const consultaUID =
            query(
                referencia,
                where(
                    "uid",
                    "==",
                    usuarioActual.uid
                )
            );


            resultados =
            await getDocs(
                consultaUID
            );

        }


        empleados =
        [];


        resultados.forEach(
            function(documento){

                const empleado =
                {
                    id:documento.id,
                    ...documento.data()
                };


                if(
                    empleado.estado !==
                    "Inactivo"
                ){

                    empleados.push(
                        empleado
                    );

                }

            }
        );


        empleados.sort(
            function(a,b){

                const nombreA =
                (
                    texto(a.nombre) +
                    " " +
                    texto(a.apellido)
                ).toLowerCase();


                const nombreB =
                (
                    texto(b.nombre) +
                    " " +
                    texto(b.apellido)
                ).toLowerCase();


                return nombreA.localeCompare(
                    nombreB
                );

            }
        );


        empleados.forEach(
            function(empleado){

                const opcion =
                document.createElement(
                    "option"
                );


                opcion.value =
                empleado.id;


                opcion.textContent =
                (
                    texto(
                        empleado.nombre
                    ) +
                    " " +
                    texto(
                        empleado.apellido
                    )
                ).trim();


                empleadoSelect.appendChild(
                    opcion
                );

            }
        );


        if(
            empleados.length === 0
        ){

            mostrarError(
                "No hay empleados activos cargados."
            );

        }

    }
    catch(error){

        console.error(
            "Error empleados:",
            error
        );


        mostrarError(
            "No se pudieron cargar los empleados: " +
            error.message
        );

    }

}


// ==========================================
// OBTENER EMPLEADO SELECCIONADO
// ==========================================

function empleadoSeleccionado(){

    const id =
    empleadoSelect.value;


    if(!id){

        return null;

    }


    return empleados.find(
        function(empleado){

            return empleado.id === id;

        }
    ) || null;

}


// ==========================================
// BUSCAR FICHAJE ACTIVO
// ==========================================

async function buscarFichajeActivo(){

    const empleado =
    empleadoSeleccionado();


    if(!empleado){

        return;

    }


    try{

        const referencia =
        collection(
            db,
            "fichajes"
        );


        const consulta =
        query(
            referencia,
            where(
                "empresaId",
                "==",
                empresaId
            ),
            where(
                "empleadoId",
                "==",
                empleado.id
            ),
            where(
                "estado",
                "==",
                "abierto"
            ),
            limit(1)
        );


        const resultados =
        await getDocs(
            consulta
        );


        if(
            resultados.empty
        ){

            fichajeActivo =
            null;

            detenerCronometro();

            mostrarEstadoSinFichar();

            return;

        }


        const documento =
        resultados.docs[0];


        fichajeActivo =
        {
            id:documento.id,
            ...documento.data()
        };


        mostrarFichajeActivo();

    }
    catch(error){

        console.error(
            "Error buscando fichaje:",
            error
        );


        mostrarError(
            "No se pudo comprobar el fichaje activo: " +
            error.message
        );

    }

}


// ==========================================
// MOSTRAR SIN FICHAR
// ==========================================

function mostrarEstadoSinFichar(){

    estadoTexto.textContent =
    "SIN FICHAR";


    estadoTexto.className =
    "estado-texto";


    cronometro.textContent =
    "00:00:00";


    cronometro.className =
    "cronometro";


    btnEntrada.disabled =
    false;


    btnSalida.disabled =
    true;


    datosJornada.classList.add(
        "oculto"
    );


    horaEntrada.textContent =
    "-";


    horaSalida.textContent =
    "-";


    tiempoTrabajado.textContent =
    "-";

}


// ==========================================
// MOSTRAR FICHAJE ACTIVO
// ==========================================

function mostrarFichajeActivo(){

    if(!fichajeActivo){

        mostrarEstadoSinFichar();

        return;

    }


    estadoTexto.textContent =
    "JORNADA EN CURSO";


    estadoTexto.className =
    "estado-texto entrada";


    btnEntrada.disabled =
    true;


    btnSalida.disabled =
    false;


    datosJornada.classList.remove(
        "oculto"
    );


    horaEntrada.textContent =
    texto(
        fichajeActivo.horaEntrada
    );


    horaSalida.textContent =
    "-";


    tiempoTrabajado.textContent =
    "En curso";


    iniciarCronometro();

}


// ==========================================
// CRONÓMETRO
// ==========================================

function iniciarCronometro(){

    detenerCronometro();


    cronometro.className =
    "cronometro entrada";


    actualizarCronometro();


    intervaloCronometro =
    setInterval(
        actualizarCronometro,
        1000
    );

}


function actualizarCronometro(){

    if(
        !fichajeActivo
    ){

        return;

    }


    const inicio =
    convertirFecha(
        fichajeActivo.entradaTimestamp
    );


    if(!inicio){

        /*
         * Si todavía no existe el timestamp
         * usamos la hora guardada como
         * respaldo visual.
         */

        cronometro.textContent =
        "EN CURSO";

        return;

    }


    const ahora =
    new Date();


    const diferencia =
    ahora.getTime() -
    inicio.getTime();


    cronometro.textContent =
    formatearDuracion(
        diferencia
    );

}


function detenerCronometro(){

    if(
        intervaloCronometro
    ){

        clearInterval(
            intervaloCronometro
        );

        intervaloCronometro =
        null;

    }

}


// ==========================================
// FICHAR ENTRADA
// ==========================================

btnEntrada.addEventListener(
    "click",
    async function(){

        limpiarMensajes();


        const empleado =
        empleadoSeleccionado();


        if(!empleado){

            mostrarError(
                "Seleccioná un empleado."
            );

            return;

        }


        btnEntrada.disabled =
        true;


        btnEntrada.textContent =
        "REGISTRANDO...";


        try{

            /*
             * Verificamos nuevamente que
             * no exista una jornada abierta.
             */

            await buscarFichajeActivo();


            if(fichajeActivo){

                mostrarError(
                    "Este empleado ya tiene una entrada activa."
                );

                return;

            }


            const ahora =
            new Date();


            const datosFichaje = {

                uid:
                usuarioActual.uid,

                empresaId:
                empresaId,

                empleadoId:
                empleado.id,

                empleadoNombre:
                (
                    texto(
                        empleado.nombre
                    ) +
                    " " +
                    texto(
                        empleado.apellido
                    )
                ).trim(),

                fecha:
                fechaLocal(),

                horaEntrada:
                horaLocal(),

                entradaTimestamp:
                serverTimestamp(),

                estado:
                "abierto",

                salidaTimestamp:
                null,

                horaSalida:
                "",

                duracionSegundos:
                0,

                horasTrabajadas:
                0,

                creado:
                serverTimestamp()

            };


            const referencia =
            await addDoc(
                collection(
                    db,
                    "fichajes"
                ),
                datosFichaje
            );


            /*
             * Para que el cronómetro
             * comience inmediatamente,
             * usamos la hora local actual.
             */

            fichajeActivo =
            {
                id:
                referencia.id,

                ...datosFichaje,

                entradaTimestamp:
                ahora

            };


            mostrarFichajeActivo();


            mostrarExito(
                "Entrada registrada correctamente."
            );


            await cargarHistorial();

        }
        catch(error){

            console.error(
                "Error entrada:",
                error
            );


            mostrarError(
                "No se pudo registrar la entrada: " +
                error.message
            );

        }
        finally{

            if(
                !fichajeActivo
            ){

                btnEntrada.disabled =
                false;

            }


            btnEntrada.textContent =
            "🟢 FICHAR ENTRADA";

        }

    }
);


// ==========================================
// FICHAR SALIDA
// ==========================================

btnSalida.addEventListener(
    "click",
    async function(){

        limpiarMensajes();


        if(!fichajeActivo){

            mostrarError(
                "No hay una jornada activa."
            );

            return;

        }


        const confirmar =
        confirm(
            "¿Confirmás la salida del empleado?"
        );


        if(!confirmar){

            return;

        }


        btnSalida.disabled =
        true;


        btnSalida.textContent =
        "REGISTRANDO...";


        try{

            const ahora =
            new Date();


            const inicio =
            convertirFecha(
                fichajeActivo.entradaTimestamp
            );


            let duracionSegundos =
            0;


            if(inicio){

                duracionSegundos =
                Math.max(
                    0,
                    Math.floor(
                        (
                            ahora.getTime() -
                            inicio.getTime()
                        ) / 1000
                    )
                );

            }


            const horasTrabajadas =
            duracionSegundos /
            3600;


            await import(
                "https://www.gstatic.com/firebasejs/12.1.0/firebase-firestore.js"
            ).then(
                async function(){

                    /*
                     * Se mantiene separado para
                     * evitar modificar la estructura
                     * inicial de Firebase.
                     */

                }
            );


            const referencia =
            doc(
                db,
                "fichajes",
                fichajeActivo.id
            );


            /*
             * updateDoc ya está disponible
             * mediante import dinámico.
             */

            const modulo =
            await import(
                "https://www.gstatic.com/firebasejs/12.1.0/firebase-firestore.js"
            );


            await modulo.updateDoc(
                referencia,
                {

                    horaSalida:
                    horaLocal(),

                    salidaTimestamp:
                    serverTimestamp(),

                    estado:
                    "cerrado",

                    duracionSegundos:
                    duracionSegundos,

                    horasTrabajadas:
                    Number(
                        horasTrabajadas.toFixed(4)
                    )

                }
            );


            detenerCronometro();


            cronometro.textContent =
            formatearDuracion(
                duracionSegundos * 1000
            );


            cronometro.className =
            "cronometro salida";


            estadoTexto.textContent =
            "JORNADA FINALIZADA";


            estadoTexto.className =
            "estado-texto salida";


            horaSalida.textContent =
            horaLocal();


            tiempoTrabajado.textContent =
            formatearDuracion(
                duracionSegundos * 1000
            );


            btnEntrada.disabled =
            false;


            btnSalida.disabled =
            true;


            fichajeActivo =
            null;


            mostrarExito(
                "Salida registrada correctamente."
            );


            await cargarHistorial();

        }
        catch(error){

            console.error(
                "Error salida:",
                error
            );


            mostrarError(
                "No se pudo registrar la salida: " +
                error.message
            );


            btnSalida.disabled =
            false;

        }
        finally{

            btnSalida.textContent =
            "🔴 FICHAR SALIDA";

        }

    }
);


// ==========================================
// CAMBIO DE EMPLEADO
// ==========================================

empleadoSelect.addEventListener(
    "change",
    async function(){

        limpiarMensajes();


        detenerCronometro();


        fichajeActivo =
        null;


        const empleado =
        empleadoSeleccionado();


        if(!empleado){

            tarjetaFichaje.classList.add(
                "oculto"
            );

            tarjetaHistorial.classList.add(
                "oculto"
            );

            return;

        }


        tarjetaFichaje.classList.remove(
            "oculto"
        );


        tarjetaHistorial.classList.remove(
            "oculto"
        );


        mostrarEstadoSinFichar();


        await buscarFichajeActivo();


        await cargarHistorial();

    }
);


// ==========================================
// HISTORIAL
// ==========================================

async function cargarHistorial(){

    const empleado =
    empleadoSeleccionado();


    if(!empleado){

        return;

    }


    historial.innerHTML =
    `
    <div class="cargando">
        Cargando historial...
    </div>
    `;


    try{

        const referencia =
        collection(
            db,
            "fichajes"
        );


        let resultados;


        try{

            const consulta =
            query(
                referencia,
                where(
                    "empresaId",
                    "==",
                    empresaId
                ),
                where(
                    "empleadoId",
                    "==",
                    empleado.id
                ),
                orderBy(
                    "creado",
                    "desc"
                ),
                limit(20)
            );


            resultados =
            await getDocs(
                consulta
            );

        }
        catch(error){

            console.warn(
                "Consulta ordenada no disponible:",
                error
            );


            const consultaSimple =
            query(
                referencia,
                where(
                    "empleadoId",
                    "==",
                    empleado.id
                ),
                limit(20)
            );


            resultados =
            await getDocs(
                consultaSimple
            );

        }


        historial.innerHTML =
        "";


        if(
            resultados.empty
        ){

            historial.innerHTML =
            `
            <div class="sin-registros">
                Todavía no hay fichajes registrados.
            </div>
            `;

            return;

        }


        const registros =
        [];


        resultados.forEach(
            function(documento){

                registros.push({
                    id:documento.id,
                    ...documento.data()
                });

            }
        );


        registros.sort(
            function(a,b){

                return texto(
                    b.fecha
                ).localeCompare(
                    texto(a.fecha)
                );

            }
        );


        registros.slice(
            0,
            20
        ).forEach(
            function(registro){

                const elemento =
                document.createElement(
                    "div"
                );


                elemento.className =
                "registro";


                const fechaElemento =
                document.createElement(
                    "div"
                );


                fechaElemento.className =
                "registro-fecha";


                fechaElemento.textContent =
                texto(
                    registro.fecha
                );


                const entradaElemento =
                document.createElement(
                    "div"
                );


                entradaElemento.className =
                "registro-linea";


                entradaElemento.textContent =
                "Entrada: " +
                (
                    texto(
                        registro.horaEntrada
                    ) ||
                    "-"
                );


                const salidaElemento =
                document.createElement(
                    "div"
                );


                salidaElemento.className =
                "registro-linea";


                salidaElemento.textContent =
                "Salida: " +
                (
                    texto(
                        registro.horaSalida
                    ) ||
                    "En curso"
                );


                const tiempoElemento =
                document.createElement(
                    "div"
                );


                tiempoElemento.className =
                "registro-linea";


                let duracion =
                "-";


                if(
                    registro.duracionSegundos
                ){

                    duracion =
                    formatearDuracion(
                        Number(
                            registro.duracionSegundos
                        ) * 1000
                    );

                }


                tiempoElemento.textContent =
                "Tiempo: " +
                duracion;


                elemento.appendChild(
                    fechaElemento
                );


                elemento.appendChild(
                    entradaElemento
                );


                elemento.appendChild(
                    salidaElemento
                );


                elemento.appendChild(
                    tiempoElemento
                );


                historial.appendChild(
                    elemento
                );

            }
        );

    }
    catch(error){

        console.error(
            "Error historial:",
            error
        );


        historial.innerHTML =
        `
        <div class="sin-registros">
            No se pudo cargar el historial.
        </div>
        `;

    }

}
