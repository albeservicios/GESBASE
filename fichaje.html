<script type="module">


/* =========================================
   FIREBASE
========================================= */

import {
    auth,
    db
} from "./Js/firebase.js";


import {
    onAuthStateChanged
} from
"https://www.gstatic.com/firebasejs/12.1.0/firebase-auth.js";


import {
    collection,
    addDoc,
    getDocs,
    query,
    where,
    orderBy,
    limit,
    updateDoc,
    doc,
    serverTimestamp
} from
"https://www.gstatic.com/firebasejs/12.1.0/firebase-firestore.js";


/* =========================================
   ELEMENTOS
========================================= */

const usuarioNombre =
document.getElementById("usuarioNombre");

const usuarioCorreo =
document.getElementById("usuarioCorreo");

const listaCorreos =
document.getElementById("listaCorreos");

const tituloBandeja =
document.getElementById("tituloBandeja");

const vistaBandeja =
document.getElementById("vistaBandeja");

const vistaNuevo =
document.getElementById("vistaNuevo");

const vistaDetalle =
document.getElementById("vistaDetalle");

const btnEntrada =
document.getElementById("btnEntrada");

const btnEnviados =
document.getElementById("btnEnviados");

const btnBorradores =
document.getElementById("btnBorradores");

const btnNuevo =
document.getElementById("btnNuevo");

const btnVolver =
document.getElementById("btnVolver");

const btnCancelar =
document.getElementById("btnCancelar");

const btnResponder =
document.getElementById("btnResponder");

const btnCerrarDetalle =
document.getElementById("btnCerrarDetalle");

const formCorreo =
document.getElementById("formCorreo");

const destinatario =
document.getElementById("destinatario");

const asunto =
document.getElementById("asunto");

const mensaje =
document.getElementById("mensaje");

const btnEnviar =
document.getElementById("btnEnviar");

const mensajeError =
document.getElementById("mensajeError");

const mensajeExito =
document.getElementById("mensajeExito");

const detalleAsunto =
document.getElementById("detalleAsunto");

const detalleRemitente =
document.getElementById("detalleRemitente");

const detalleCuerpo =
document.getElementById("detalleCuerpo");


/* =========================================
   VARIABLES
========================================= */

let usuarioActual = null;

let empleadoActual = null;

let empleadoId = "";

let empresaId = "";

let correoSeleccionado = null;


/* =========================================
   UTILIDADES
========================================= */

function texto(valor){

    if(
        valor === undefined ||
        valor === null
    ){

        return "";

    }

    return String(valor);

}


function mostrarError(mensaje){

    mensajeError.textContent =
    mensaje;

    mensajeError.style.display =
    "block";

    mensajeExito.style.display =
    "none";

}


function mostrarExito(mensaje){

    mensajeExito.textContent =
    mensaje;

    mensajeExito.style.display =
    "block";

    mensajeError.style.display =
    "none";

}


function limpiarMensajes(){

    mensajeError.style.display =
    "none";

    mensajeExito.style.display =
    "none";

}


function fechaCorreo(valor){

    if(!valor){

        return "";

    }


    if(
        typeof valor.toDate ===
        "function"
    ){

        return valor.toDate()
        .toLocaleString(
            "es-AR"
        );

    }


    return "";

}


/* =========================================
   CARGAR PERFIL EMPLEADO
========================================= */

async function cargarPerfil(){

    if(!usuarioActual){

        throw new Error(
            "No hay una sesión activa."
        );

    }


    /*
     * IMPORTANTE:
     * Buscamos exactamente igual
     * que en el sistema de fichaje.
     */

    const consulta =
    query(
        collection(
            db,
            "empleados"
        ),
        where(
            "authUid",
            "==",
            usuarioActual.uid
        ),
        limit(1)
    );


    const resultados =
    await getDocs(
        consulta
    );


    if(
        resultados.empty
    ){

        throw new Error(
            "No encontramos el perfil del usuario."
        );

    }


    const documento =
    resultados.docs[0];


    empleadoId =
    documento.id;


    empleadoActual = {

        id:
        documento.id,

        ...documento.data()

    };


    empresaId =
    texto(
        empleadoActual.empresaId
    ).trim();


    const nombre =
    (
        texto(
            empleadoActual.nombre
        ) +
        " " +
        texto(
            empleadoActual.apellido
        )
    ).trim();


    usuarioNombre.textContent =
    nombre ||
    "Empleado";


    /*
     * Mostramos el correo de Firebase
     * si existe.
     */

    usuarioCorreo.textContent =
    usuarioActual.email ||
    empleadoActual.email ||
    "Sin correo";


    return empleadoActual;

}


/* =========================================
   CAMBIAR VISTA
========================================= */

function mostrarBandeja(tipo){

    vistaNuevo.classList.add(
        "oculto"
    );

    vistaDetalle.classList.add(
        "oculto"
    );

    vistaBandeja.classList.remove(
        "oculto"
    );


    btnEntrada.classList.remove(
        "activo"
    );

    btnEnviados.classList.remove(
        "activo"
    );

    btnBorradores.classList.remove(
        "activo"
    );

    btnNuevo.classList.remove(
        "activo"
    );


    if(tipo === "entrada"){

        btnEntrada.classList.add(
            "activo"
        );

        tituloBandeja.textContent =
        "📥 Entrada";

        cargarEntrada();

    }


    if(tipo === "enviados"){

        btnEnviados.classList.add(
            "activo"
        );

        tituloBandeja.textContent =
        "📤 Enviados";

        cargarEnviados();

    }


    if(tipo === "borradores"){

        btnBorradores.classList.add(
            "activo"
        );

        tituloBandeja.textContent =
        "📝 Borradores";

        cargarBorradores();

    }

}


/* =========================================
   NUEVO CORREO
========================================= */

function mostrarNuevo(){

    vistaBandeja.classList.add(
        "oculto"
    );

    vistaDetalle.classList.add(
        "oculto"
    );

    vistaNuevo.classList.remove(
        "oculto"
    );


    btnEntrada.classList.remove(
        "activo"
    );

    btnEnviados.classList.remove(
        "activo"
    );

    btnBorradores.classList.remove(
        "activo"
    );

    btnNuevo.classList.add(
        "activo"
    );


    limpiarMensajes();

}


/* =========================================
   CARGAR ENTRADA
========================================= */

async function cargarEntrada(){

    listaCorreos.innerHTML =
    `
    <div class="cargando">
        Cargando correos...
    </div>
    `;


    try{

        const consulta =
        query(
            collection(
                db,
                "correos"
            ),
            where(
                "destinatarioUid",
                "==",
                usuarioActual.uid
            ),
            limit(100)
        );


        const resultados =
        await getDocs(
            consulta
        );


        const correos = [];


        resultados.forEach(
            documento => {

                correos.push({

                    id:
                    documento.id,

                    ...documento.data()

                });

            }
        );


        correos.sort(
            (a,b) => {

                const aTiempo =
                a.creado?.seconds ||
                0;

                const bTiempo =
                b.creado?.seconds ||
                0;

                return bTiempo -
                aTiempo;

            }
        );


        mostrarLista(
            correos,
            "entrada"
        );

    }
    catch(error){

        console.error(
            error
        );

        mostrarError(
            "No se pudo cargar la bandeja de entrada."
        );

        listaCorreos.innerHTML =
        `
        <div class="vacio">
            No se pudieron cargar los correos.
        </div>
        `;

    }

}


/* =========================================
   CARGAR ENVIADOS
========================================= */

async function cargarEnviados(){

    listaCorreos.innerHTML =
    `
    <div class="cargando">
        Cargando enviados...
    </div>
    `;


    try{

        const consulta =
        query(
            collection(
                db,
                "correos"
            ),
            where(
                "remitenteUid",
                "==",
                usuarioActual.uid
            ),
            limit(100)
        );


        const resultados =
        await getDocs(
            consulta
        );


        const correos = [];


        resultados.forEach(
            documento => {

                correos.push({

                    id:
                    documento.id,

                    ...documento.data()

                });

            }
        );


        correos.sort(
            (a,b) => {

                return (
                    (b.creado?.seconds || 0)
                    -
                    (a.creado?.seconds || 0)
                );

            }
        );


        mostrarLista(
            correos,
            "enviados"
        );

    }
    catch(error){

        console.error(
            error
        );

        mostrarError(
            "No se pudieron cargar los enviados."
        );

    }

}


/* =========================================
   CARGAR BORRADORES
========================================= */

async function cargarBorradores(){

    listaCorreos.innerHTML =
    `
    <div class="cargando">
        Cargando borradores...
    </div>
    `;


    try{

        const consulta =
        query(
            collection(
                db,
                "correos"
            ),
            where(
                "remitenteUid",
                "==",
                usuarioActual.uid
            ),
            where(
                "estado",
                "==",
                "borrador"
            ),
            limit(100)
        );


        const resultados =
        await getDocs(
            consulta
        );


        const correos = [];


        resultados.forEach(
            documento => {

                correos.push({

                    id:
                    documento.id,

                    ...documento.data()

                });

            }
        );


        mostrarLista(
            correos,
            "borradores"
        );

    }
    catch(error){

        console.error(
            error
        );

        mostrarError(
            "No se pudieron cargar los borradores."
        );

    }

}


/* =========================================
   MOSTRAR LISTA
========================================= */

function mostrarLista(
    correos,
    tipo
){

    listaCorreos.innerHTML =
    "";


    if(
        correos.length === 0
    ){

        listaCorreos.innerHTML =
        `
        <div class="vacio">
            No hay correos en esta sección.
        </div>
        `;

        return;

    }


    correos.forEach(
        correo => {

            const elemento =
            document.createElement(
                "div"
            );


            elemento.className =
            "correo-item";


            if(
                tipo === "entrada" &&
                correo.leido === false
            ){

                elemento.classList.add(
                    "no-leido"
                );

            }


            const persona =
            tipo === "entrada"
            ? (
                correo.remitenteNombre ||
                correo.remitenteEmail ||
                "Remitente"
            )
            : (
                correo.destinatarioEmail ||
                "Destinatario"
            );


            const asuntoTexto =
            correo.asunto ||
            "(Sin asunto)";


            const cuerpo =
            correo.mensaje ||
            "";


            elemento.innerHTML =
            `
            <div class="correo-remitente">
                ${escapeHTML(persona)}
                ${
                    tipo === "entrada" &&
                    correo.leido === false
                    ? '<span class="badge">NUEVO</span>'
                    : ''
                }
            </div>

            <div class="correo-asunto">
                ${escapeHTML(asuntoTexto)}
            </div>

            <div class="correo-vista">
                ${escapeHTML(cuerpo)}
            </div>

            <div class="correo-fecha">
                ${fechaCorreo(correo.creado)}
            </div>
            `;


            elemento.addEventListener(
                "click",
                function(){

                    abrirCorreo(
                        correo
                    );

                }
            );


            listaCorreos.appendChild(
                elemento
            );

        }
    );

}


/* =========================================
   SEGURIDAD HTML
========================================= */

function escapeHTML(valor){

    return texto(valor)
        .replace(
            /&/g,
            "&amp;"
        )
        .replace(
            /</g,
            "&lt;"
        )
        .replace(
            />/g,
            "&gt;"
        )
        .replace(
            /"/g,
            "&quot;"
        )
        .replace(
            /'/g,
            "&#039;"
        );

}


/* =========================================
   ABRIR CORREO
========================================= */

async function abrirCorreo(
    correo
){

    correoSeleccionado =
    correo;


    vistaBandeja.classList.add(
        "oculto"
    );

    vistaNuevo.classList.add(
        "oculto"
    );

    vistaDetalle.classList.remove(
        "oculto"
    );


    detalleAsunto.textContent =
    correo.asunto ||
    "(Sin asunto)";


    if(
        correo.remitenteEmail
    ){

        detalleRemitente.textContent =
        "De: " +
        correo.remitenteEmail;

    }
    else{

        detalleRemitente.textContent =
        "De: " +
        (
            correo.remitenteNombre ||
            "Remitente"
        );

    }


    detalleCuerpo.textContent =
    correo.mensaje ||
    "";


    /*
     * Marcar como leído
     */

    if(
        correo.destinatarioUid ===
        usuarioActual.uid &&
        correo.leido === false
    ){

        try{

            await updateDoc(
                doc(
                    db,
                    "correos",
                    correo.id
                ),
                {
                    leido:true
                }
            );

        }
        catch(error){

            console.error(
                "No se pudo marcar como leído:",
                error
            );

        }

    }

}


/* =========================================
   RESPONDER
========================================= */

btnResponder.addEventListener(
    "click",
    function(){

        if(
            !correoSeleccionado
        ){

            return;

        }


        mostrarNuevo();


        destinatario.value =
        correoSeleccionado.remitenteEmail ||
        "";


        const asuntoOriginal =
        correoSeleccionado.asunto ||
        "";


        asunto.value =
        asuntoOriginal.startsWith(
            "Re:"
        )
        ? asuntoOriginal
        : "Re: " + asuntoOriginal;


        mensaje.value =
        "";

    }
);


/* =========================================
   ENVIAR CORREO
========================================= */

formCorreo.addEventListener(
    "submit",
    async function(event){

        event.preventDefault();

        limpiarMensajes();


        const para =
        destinatario.value
        .trim()
        .toLowerCase();


        const asuntoTexto =
        asunto.value.trim();


        const mensajeTexto =
        mensaje.value.trim();


        if(!para){

            mostrarError(
                "Ingresá el correo del destinatario."
            );

            return;

        }


        if(!asuntoTexto){

            mostrarError(
                "Ingresá un asunto."
            );

            return;

        }


        if(!mensajeTexto){

            mostrarError(
                "Escribí el mensaje."
            );

            return;

        }


        btnEnviar.disabled =
        true;

        btnEnviar.textContent =
        "📤 ENVIANDO...";


        try{

            /*
             * Buscamos al destinatario
             * dentro de empleados.
             */

            const consulta =
            query(
                collection(
                    db,
                    "empleados"
                ),
                where(
                    "email",
                    "==",
                    para
                ),
                limit(1)
            );


            const resultados =
            await getDocs(
                consulta
            );


            if(
                resultados.empty
            ){

                throw new Error(
                    "No encontramos un empleado con ese correo."
                );

            }


            const destinatarioDoc =
            resultados.docs[0];


            const destinatarioEmpleado =
            destinatarioDoc.data();


            const remitenteNombre =
            (
                texto(
                    empleadoActual.nombre
                ) +
                " " +
                texto(
                    empleadoActual.apellido
                )
            ).trim();


            await addDoc(
                collection(
                    db,
                    "correos"
                ),
                {

                    empresaId:
                    empresaId,

                    remitenteUid:
                    usuarioActual.uid,

                    remitenteEmpleadoId:
                    empleadoId,

                    remitenteNombre:
                    remitenteNombre,

                    remitenteEmail:
                    usuarioActual.email ||
                    empleadoActual.email ||
                    "",

                    destinatarioUid:
                    texto(
                        destinatarioEmpleado.authUid
                    ),

                    destinatarioEmpleadoId:
                    destinatarioDoc.id,

                    destinatarioNombre:
                    (
                        texto(
                            destinatarioEmpleado.nombre
                        ) +
                        " " +
                        texto(
                            destinatarioEmpleado.apellido
                        )
                    ).trim(),

                    destinatarioEmail:
                    para,

                    asunto:
                    asuntoTexto,

                    mensaje:
                    mensajeTexto,

                    estado:
                    "enviado",

                    leido:
                    false,

                    creado:
                    serverTimestamp()

                }
            );


            formCorreo.reset();


            mostrarExito(
                "Correo enviado correctamente."
            );


            setTimeout(
                function(){

                    mostrarBandeja(
                        "enviados"
                    );

                },
                1000
            );

        }
        catch(error){

            console.error(
                "Error enviando correo:",
                error
            );


            mostrarError(
                error.message ||
                "No se pudo enviar el correo."
            );

        }
        finally{

            btnEnviar.disabled =
            false;

            btnEnviar.textContent =
            "📤 ENVIAR CORREO";

        }

    }
);

onAuthStateChanged(
    auth,
    async function(usuario){

        if(!usuario){

            window.location.href =
            "empleado-login.html";

            return;

        }


        usuarioActual =
        usuario;


        try{

            limpiarMensajes();

            await cargarPerfil();

            await cargarEntrada();

        }
        catch(error){

            console.error(
                "ERROR CORREO GESBASE:",
                error
            );


            mostrarError(
                error.message
            );


            usuarioNombre.textContent =
            "No disponible";


            usuarioCorreo.textContent =
            usuario.email ||
            "Sin correo";

        }

    }
);
