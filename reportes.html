her <!DOCTYPE html>
<html lang="es-AR">

<head>

<meta charset="UTF-8">

<meta
    name="viewport"
    content="width=device-width, initial-scale=1.0, viewport-fit=cover"
>

<meta
    name="theme-color"
    content="#12343B"
>

<title>Reportes | Seguridad GESBASE</title>

<style>

*{
    box-sizing:border-box;
}

body{
    margin:0;
    font-family:Arial,Helvetica,sans-serif;
    background:#f4f6f8;
    color:#172126;
}

/* =========================================================
   HEADER
========================================================= */

header{
    background:#12343B;
    color:white;
    padding:16px;
    position:sticky;
    top:0;
    z-index:20;
    box-shadow:0 2px 8px rgba(0,0,0,.15);
}

.header-inner{
    max-width:1000px;
    margin:auto;
    display:flex;
    align-items:center;
    gap:12px;
}

.btn-volver{
    border:0;
    background:rgba(255,255,255,.12);
    color:white;
    border-radius:9px;
    padding:9px 12px;
    font-size:15px;
    cursor:pointer;
}

.header-title{
    font-size:20px;
    font-weight:bold;
}

.header-subtitle{
    font-size:12px;
    opacity:.8;
    margin-top:3px;
}

/* =========================================================
   CONTENIDO
========================================================= */

main{
    width:100%;
    max-width:1000px;
    margin:auto;
    padding:16px;
}

.resumen{
    display:grid;
    grid-template-columns:
        repeat(auto-fit,minmax(150px,1fr));
    gap:12px;
    margin-bottom:18px;
}

.resumen-card{
    background:white;
    border-radius:14px;
    padding:15px;
    box-shadow:0 2px 8px rgba(0,0,0,.07);
}

.resumen-card span{
    display:block;
    font-size:13px;
    color:#68747a;
    margin-bottom:6px;
}

.resumen-card strong{
    font-size:25px;
    color:#12343B;
}

/* =========================================================
   FILTROS
========================================================= */

.filtros{
    background:white;
    border-radius:14px;
    padding:14px;
    margin-bottom:18px;
    box-shadow:0 2px 8px rgba(0,0,0,.07);
}

.filtros label{
    display:block;
    font-size:13px;
    font-weight:bold;
    margin-bottom:7px;
}

select{
    width:100%;
    padding:11px;
    border:1px solid #d5dce0;
    border-radius:9px;
    background:white;
    font-size:14px;
}

/* =========================================================
   LISTA
========================================================= */

#lista{
    display:flex;
    flex-direction:column;
    gap:14px;
}

.reporte{
    background:white;
    border-radius:15px;
    padding:16px;
    box-shadow:0 2px 9px rgba(0,0,0,.08);
    border-left:5px solid #12343B;
}

.reporte.pendiente{
    border-left-color:#d88900;
}

.reporte.revisado{
    border-left-color:#2c8a50;
}

.reporte.bloqueado{
    border-left-color:#b3261e;
}

/* =========================================================
   ENCABEZADO REPORTE
========================================================= */

.reporte-top{
    display:flex;
    justify-content:space-between;
    align-items:flex-start;
    gap:10px;
    margin-bottom:12px;
}

.reporte-numero{
    font-size:12px;
    color:#6b7478;
}

.estado{
    display:inline-flex;
    align-items:center;
    padding:5px 10px;
    border-radius:20px;
    font-size:12px;
    font-weight:bold;
    white-space:nowrap;
}

.estado-pendiente{
    background:#fff0c7;
    color:#805700;
}

.estado-revisado{
    background:#dff3e6;
    color:#21663a;
}

.estado-bloqueado{
    background:#fde2e0;
    color:#9d211b;
}

/* =========================================================
   INFORMACIÓN
========================================================= */

.motivo{
    font-size:18px;
    font-weight:bold;
    margin:5px 0 10px;
    color:#12343B;
}

.descripcion{
    background:#f6f8f9;
    border-radius:10px;
    padding:12px;
    margin-bottom:13px;
    white-space:pre-wrap;
    overflow-wrap:anywhere;
}

.info{
    font-size:13px;
    line-height:1.6;
    color:#4e5a5f;
}

.info strong{
    color:#26343a;
}

.publicacion{
    margin-top:13px;
    padding:12px;
    background:#eef3f4;
    border-radius:10px;
    font-size:14px;
    white-space:pre-wrap;
    overflow-wrap:anywhere;
}

/* =========================================================
   ACCIONES
========================================================= */

.acciones{
    display:flex;
    flex-wrap:wrap;
    gap:8px;
    margin-top:15px;
}

button.accion{
    border:0;
    border-radius:9px;
    padding:10px 12px;
    cursor:pointer;
    font-weight:bold;
    font-size:13px;
}

.btn-revisar{
    background:#12343B;
    color:white;
}

.btn-pendiente{
    background:#fff0c7;
    color:#805700;
}

.btn-bloquear{
    background:#fde2e0;
    color:#9d211b;
}

button.accion:disabled{
    opacity:.5;
    cursor:not-allowed;
}

/* =========================================================
   VACÍO / CARGANDO
========================================================= */

.mensaje{
    background:white;
    border-radius:14px;
    padding:25px;
    text-align:center;
    color:#68747a;
    box-shadow:0 2px 8px rgba(0,0,0,.06);
}

.spinner{
    display:inline-block;
    width:25px;
    height:25px;
    border:3px solid #d8e0e2;
    border-top-color:#12343B;
    border-radius:50%;
    animation:girar .8s linear infinite;
    margin-bottom:10px;
}

@keyframes girar{
    to{
        transform:rotate(360deg);
    }
}

/* =========================================================
   TOAST
========================================================= */

#toast{
    position:fixed;
    left:50%;
    bottom:25px;
    transform:translateX(-50%) translateY(20px);
    background:#12343B;
    color:white;
    padding:12px 17px;
    border-radius:10px;
    font-size:14px;
