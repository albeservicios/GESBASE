<!DOCTYPE html>
<html lang="es-AR">

<head>

<meta charset="UTF-8">

<meta
    name="viewport"
    content="width=device-width, initial-scale=1.0, viewport-fit=cover"
>

<meta name="theme-color" content="#12343B">

<title>Reportes | Seguridad GESBASE</title>

<style>

*{
    box-sizing:border-box;
}

body{
    margin:0;
    font-family:Arial,Helvetica,sans-serif;
    background:#f4f6f8;
    color:#172126;
}

header{
    background:#12343B;
    color:white;
    padding:16px;
    position:sticky;
    top:0;
    z-index:10;
}

.header{
    max-width:1000px;
    margin:auto;
    display:flex;
    align-items:center;
    gap:12px;
}

.volver{
    border:0;
    background:rgba(255,255,255,.15);
    color:white;
    padding:9px 13px;
    border-radius:9px;
    font-size:16px;
}

.titulo{
    font-size:20px;
    font-weight:bold;
}

.subtitulo{
    font-size:12px;
    opacity:.8;
    margin-top:3px;
}

main{
    max-width:1000px;
    margin:auto;
    padding:16px;
}

.estado-acceso{
    background:white;
    border-radius:14px;
    padding:15px;
    margin-bottom:16px;
    box-shadow:0 2px 8px rgba(0,0,0,.07);
}

.estado-acceso strong{
    display:block;
    margin-bottom:6px;
}

.ok{
    color:#18753c;
}

.error{
    color:#b3261e;
}

.resumen{
    display:grid;
    grid-template-columns:
        repeat(auto-fit,minmax(140px,1fr));
    gap:12px;
    margin-bottom:16px;
}

.resumen-card{
    background:white;
    padding:15px;
    border-radius:14px;
    box-shadow:0 2px 8px rgba(0,0,0,.07);
}

.resumen-card span{
    display:block;
    color:#68747a;
    font-size:13px;
}

.resumen-card strong{
    display:block;
    margin-top:5px;
    font-size:26px;
    color:#12343B;
}

.filtros{
    background:white;
    padding:14px;
    border-radius:14px;
    margin-bottom:16px;
    box-shadow:0 2px 8px rgba(0,0,0,.07);
}

.filtros label{
    display:block;
    font-weight:bold;
    font-size:13px;
    margin-bottom:7px;
}

select{
    width:100%;
    padding:11px;
    border:1px solid #d5dce0;
    border-radius:9px;
    background:white;
}

.lista{
    display:flex;
    flex-direction:column;
    gap:14px;
}

.mensaje{
    background:white;
    padding:25px;
    border-radius:14px;
    text-align:center;
    box-shadow:0 2px 8px rgba(0,0,0,.07);
}

.reporte{
    background:white;
    border-radius:15px;
    padding:16px;
    box-shadow:0 2px 9px rgba(0,0,0,.08);
    border-left:5px solid #d88900;
}

.reporte.revisado{
    border-left-color:#2c8a50;
}

.reporte.bloqueado{
    border-left-color:#b3261e;
}

.reporte-cabecera{
    display:flex;
    justify-content:space-between;
    gap:10px;
    margin-bottom:12px;
}

.numero{
    font-size:12px;
    color:#68747a;
}

.estado{
    padding:5px 10px;
    border-radius:20px;
    font-size:11px;
    font-weight:bold;
    white-space:nowrap;
}

.estado-pendiente{
    background:#fff0c7;
    color:#805700;
}

.estado-revisado{
    background:#dff3e6;
    color:#21663a;
}

.estado-bloqueado{
    background:#fde2e0;
    color:#9d211b;
}

.motivo{
    font-size:18px;
    font-weight:bold;
    color:#12343B;
    margin-bottom:10px;
}

.descripcion,
.publicacion{
    background:#f5f7f8;
    border-radius:10px;
    padding:12px;
    margin-top:10px;
    white-space:pre-wrap;
    overflow-wrap:anywhere;
}

.info{
    margin-top:13px;
    font-size:13px;
    line-height:1.7;
}

.acciones{
    display:flex;
    flex-wrap:wrap;
    gap:8px;
    margin-top:15px;
}

.accion{
    border:0;
    border-radius:9px;
    padding:10px 13px;
    font-weight:bold;
    cursor:pointer;
}

.revisar{
    background:#12343B;
    color:white;
}

.pendiente{
    background:#fff0c7;
    color:#805700;
}

.bloquear{
    background:#fde2e0;
    color:#9d211b;
}

#toast{
    position:fixed;
    bottom:25px;
    left:50%;
    transform:translateX(-50%);
    background:#12343B;
    color:white;
    padding:12px 18px;
    border-radius:10px;
    display:none;
    z-index:100;
}

@media(max-width:600px){

    main{
        padding:12px;
    }

    .reporte-cabecera{
        flex-direction:column;
    }

    .acciones{
        flex-direction:column;
    }

    .accion{
        width:100%;
    }

}

</style>

</head>


<body>

<header>

    <div class="header">

        <button
            class="volver"
            id="btnVolver"
        >
            ←
        </button>

        <div>

            <div class="titulo">
                🚨 Reportes
            </div>

            <div class="subtitulo">
                Seguridad GESBASE
            </div>

        </div>

    </div>

</header>


<main>


    <div class="estado-acceso">

        <strong>
            Estado del panel
        </strong>

        <div id="estadoAcceso">
            Verificando acceso...
        </div>

    </div>


    <div class="resumen">

        <div class="resumen-card">

            <span>
                Total
            </span>

            <strong id="total">
                0
            </strong>

        </div>


        <div class="resumen-card">

            <span>
                Pendientes
            </span>

            <strong id="pendientes">
                0
            </strong>

        </div>


        <div class="resumen-card">

            <span>
                Revisados
            </span>

            <strong id="revisados">
                0
            </strong>

        </div>

    </div>


    <div class="filtros">

        <label for="filtro">
            Filtrar por estado
        </label>

        <select id="filtro">

            <option value="todos">
                Todos
            </option>

            <option value="pendiente">
                Pendientes
            </option>

            <option value="revisado">
                Revisados
            </option>

            <option value="bloqueado">
                Bloqueados
            </option>

        </select>

    </div>


    <div
        class="lista"
        id="lista"
    >

        <div class="mensaje">
            Cargando reportes...
        </div>

    </div>


</main>


<div id="toast"></div>


<script type="module">

console.log("REPORTES: iniciando");


/* =========================================================
   FIREBASE
========================================================= */

import {
    auth,
    db
} from "./Js/firebase.js";


import {
    onAuthStateChanged
} from "https://www.gstatic.com/firebasejs/12.18.0/firebase-auth.js";


import {
    collection,
    query,
    orderBy,
    onSnapshot,
    doc,
    getDoc,
    updateDoc
} from "https://www.gstatic.com/firebasejs/12.18.0/firebase-firestore.js";


console.log("REPORTES: Firebase cargado");


/* =========================================================
   ELEMENTOS
========================================================= */

const estadoAcceso =
    document.getElementById("estadoAcceso");

const lista =
    document.getElementById("lista");

const filtro =
    document.getElementById("filtro");

const total =
    document.getElementById("total");

const pendientes =
    document.getElementById("pendientes");

const revisados =
    document.getElementById("revisados");

const toast =
    document.getElementById("toast");


let usuarioActual = null;

let reportes = [];

let cancelar = null;


/* =========================================================
   ESCAPAR HTML
========================================================= */

function escapar(valor){

    return String(valor ?? "")
        .replace(/&/g,"&amp;")
        .replace(/</g,"&lt;")
        .replace(/>/g,"&gt;")
        .replace(/"/g,"&quot;")
        .replace(/'/g,"&#039;");

}


/* =========================================================
   ADMIN
========================================================= */

function esAdmin(user,datos){

    const email =
        String(user?.email || "")
            .toLowerCase()
            .trim();

    const rol =
        String(datos?.rol || "")
            .toLowerCase()
            .trim();

    const role =
        String(datos?.role || "")
            .toLowerCase()
            .trim();

    return (
        email === "julianbattauz006@gmail.com" ||
        rol === "administrador" ||
        rol === "admin" ||
        role === "administrador" ||
        role === "admin"
    );

}


/* =========================================================
   BUSCAR PERFIL
========================================================= */

async function buscarPerfil(uid){

    console.log(
        "REPORTES: buscando usuarios/" + uid
    );

    let datos = null;


    try{

        const snap =
            await getDoc(
                doc(db,"usuarios",uid)
            );


        if(snap.exists()){

            datos = snap.data();

            console.log(
                "REPORTES: perfil encontrado en usuarios",
                datos
            );

        }

    }catch(error){

        console.error(
            "REPORTES: error usuarios",
            error
        );

    }


    if(!datos){

        console.log(
            "REPORTES: buscando usuariosRed/" + uid
        );


        try{

            const snap =
                await getDoc(
                    doc(db,"usuariosRed",uid)
                );


            if(snap.exists()){

                datos = snap.data();

                console.log(
                    "REPORTES: perfil encontrado en usuariosRed",
                    datos
                );

            }

        }catch(error){

            console.error(
                "REPORTES: error usuariosRed",
                error
            );

        }

    }


    return datos;

}


/* =========================================================
   FECHA
========================================================= */

function fechaReporte(r){

    try{

        if(
            r.fecha &&
            typeof r.fecha.toDate === "function"
        ){

            return r.fecha.toDate()
                .toLocaleString("es-AR");

        }


        if(r.fechaCliente){

            return new Date(
                Number(r.fechaCliente)
            ).toLocaleString("es-AR");

        }

    }catch(error){

        console.error(error);

    }


    return "Fecha no disponible";

}


/* =========================================================
   RESUMEN
========================================================= */

function actualizarResumen(){

    total.textContent =
        reportes.length;


    pendientes.textContent =
        reportes.filter(
            r =>
                (r.estado || "pendiente")
                === "pendiente"
        ).length;


    revisados.textContent =
        reportes.filter(
            r =>
                (r.estado || "")
                === "revisado"
        ).length;

}


/* =========================================================
   MOSTRAR
========================================================= */

function mostrar(){

    const valor =
        filtro.value;


    let datos =
        reportes;


    if(valor !== "todos"){

        datos =
            reportes.filter(
                r =>
                    (r.estado || "pendiente")
                    === valor
            );

    }


    if(datos.length === 0){

        lista.innerHTML = `
            <div class="mensaje">
                No hay reportes para mostrar.
            </div>
        `;

        return;

    }


    lista.innerHTML = "";


    datos.forEach(r => {

        const estado =
            r.estado || "pendiente";


        const card =
            document.createElement("div");


        card.className =
            "reporte " + estado;


        let claseEstado =
            "estado-pendiente";


        if(estado === "revisado"){
            claseEstado =
                "estado-revisado";
        }


        if(estado === "bloqueado"){
            claseEstado =
                "estado-bloqueado";
        }


        card.innerHTML = `

            <div class="reporte-cabecera">

                <div>

                    <div class="numero">
                        Reporte #${escapar(r.id)}
                    </div>

                    <div class="numero">
                        ${escapar(fechaReporte(r))}
                    </div>

                </div>

                <span class="estado ${claseEstado}">
                    ${escapar(estado.toUpperCase())}
                </span>

            </div>


            <div class="motivo">
                ⚠️ ${escapar(
                    r.motivo || "Sin motivo"
                )}
            </div>


            <div class="descripcion">

                <strong>
                    Descripción
                </strong>

                <br><br>

                ${escapar(
                    r.descripcion ||
                    "Sin descripción."
                )}

            </div>


            <div class="info">

                <strong>👤 Reportó:</strong>
                ${escapar(
                    r.reportanteNombre ||
                    "Usuario GESBASE"
                )}

                <br>

                <strong>📧 Email:</strong>
                ${escapar(
                    r.reportanteEmail ||
                    "No disponible"
                )}

                <br>

                <strong>🚨 Reportado:</strong>
                ${escapar(
                    r.reportadoNombre ||
                    "Usuario GESBASE"
                )}

            </div>


            ${
                r.publicacionTexto
                ?
                `
                <div class="publicacion">

                    <strong>
                        Publicación denunciada
                    </strong>

                    <br><br>

                    ${escapar(
                        r.publicacionTexto
                    )}

                </div>
                `
                :
                ""
            }


            <div class="acciones">

                ${
                    estado !== "revisado"
                    ?
                    `
                    <button
                        class="accion revisar"
                        data-estado="revisado"
                    >
                        ✓ Marcar revisado
                    </button>
                    `
                    :
                    `
                    <button
                        class="accion pendiente"
                        data-estado="pendiente"
                    >
                        ↩ Pendiente
                    </button>
                    `
                }


                ${
                    estado !== "bloqueado"
                    ?
                    `
                    <button
                        class="accion bloquear"
                        data-estado="bloqueado"
                    >
                        🚫 Bloquear
                    </button>
                    `
                    :
                    ""
                }

            </div>

        `;


        card
            .querySelectorAll(
                "button[data-estado]"
            )
            .forEach(boton => {

                boton.addEventListener(
                    "click",
                    () => {

                        cambiarEstado(
                            r.id,
                            boton.dataset.estado
                        );

                    }
                );

            });


        lista.appendChild(card);

    });

}


/* =========================================================
   CAMBIAR ESTADO
========================================================= */

async function cambiarEstado(
    id,
    nuevoEstado
){

    if(!usuarioActual){
        return;
    }


    try{

        await updateDoc(
            doc(db,"reportes",id),
            {
                estado:nuevoEstado,
                revisadoPor:usuarioActual.uid,
                revisadoEmail:
                    usuarioActual.email || "",
                fechaRevision:
                    new Date()
            }
        );


        mostrarToast(
            "Reporte actualizado."
        );


    }catch(error){

        console.error(
            "REPORTES: error actualizando",
            error
        );


        alert(
            "No se pudo actualizar el reporte:\n\n" +
            error.message
        );

    }

}


/* =========================================================
   CARGAR REPORTES
========================================================= */

function cargarReportes(){

    console.log(
        "REPORTES: cargando colección reportes"
    );


    lista.innerHTML = `
        <div class="mensaje">
            Cargando reportes...
        </div>
    `;


    let referencia;


    try{

        referencia =
            query(
                collection(db,"reportes"),
                orderBy("fecha","desc")
            );

    }catch(error){

        console.error(error);

        lista.innerHTML = `
            <div class="mensaje error">
                Error creando consulta:<br><br>
                ${escapar(error.message)}
            </div>
        `;

        return;

    }


    cancelar =
        onSnapshot(
            referencia,

            snapshot => {

                console.log(
                    "REPORTES: documentos recibidos:",
                    snapshot.size
                );


                reportes = [];


                snapshot.forEach(
                    documento => {

                        reportes.push({

                            id:documento.id,

                            ...documento.data()

                        });

                    }
                );


                actualizarResumen();

                mostrar();

            },

            error => {

                console.error(
                    "REPORTES: error Firestore",
                    error
                );


                lista.innerHTML = `
                    <div class="mensaje error">

                        <strong>
                            Error al cargar reportes
                        </strong>

                        <br><br>

                        ${escapar(
                            error.message
                        )}

                    </div>
                `;

            }
        );

}


/* =========================================================
   AUTENTICACIÓN
========================================================= */

onAuthStateChanged(
    auth,
    async user => {

        console.log(
            "REPORTES: auth cambió",
            user
        );


        if(!user){

            estadoAcceso.textContent =
                "No hay una sesión iniciada.";

            estadoAcceso.className =
                "error";

            lista.innerHTML = `
                <div class="mensaje">
                    Debés iniciar sesión para continuar.
                </div>
            `;

            return;

        }


        usuarioActual = user;


        try{

            const datos =
                await buscarPerfil(
                    user.uid
                );


            if(
                !esAdmin(
                    user,
                    datos
                )
            ){

                estadoAcceso.textContent =
                    "Acceso no autorizado.";

                estadoAcceso.className =
                    "error";

                lista.innerHTML = `
                    <div class="mensaje">
                        Este panel es privado.
                    </div>
                `;

                setTimeout(() => {

                    location.href =
                        "red.html";

                },1500);

                return;

            }


            estadoAcceso.textContent =
                "✓ Acceso autorizado para administrador.";

            estadoAcceso.className =
                "ok";


            cargarReportes();


        }catch(error){

            console.error(
                "REPORTES: error de acceso",
                error
            );


            estadoAcceso.textContent =
                "Error: " + error.message;

            estadoAcceso.className =
                "error";


            lista.innerHTML = `
                <div class="mensaje error">

                    <strong>
                        No se pudo verificar el acceso.
                    </strong>

                    <br><br>

                    ${escapar(
                        error.message
                    )}

                </div>
            `;

        }

    }
);


/* =========================================================
   FILTRO
========================================================= */

filtro.addEventListener(
    "change",
    mostrar
);


/* =========================================================
   VOLVER
========================================================= */

document
    .getElementById("btnVolver")
    .addEventListener(
        "click",
        () => {

            location.href =
                "seguridad.html";

        }
    );


/* =========================================================
   TOAST
========================================================= */

function mostrarToast(mensaje){

    toast.textContent =
        mensaje;

    toast.style.display =
        "block";


    setTimeout(() => {

        toast.style.display =
            "none";

    },2500);

}


/* =========================================================
   LIMPIAR
========================================================= */

window.addEventListener(
    "beforeunload",
    () => {

        if(cancelar){

            cancelar();

        }

    }
);


console.log(
    "REPORTES: script terminado"
);

</script>

</body>
</html>
