*{

}

body{

.app{

header{

.header-superior{

.logo{

.subtitulo{

    font-size:13px;

.btn-salir{

    color:white;
    padding:10px 14px;
    border-radius:9px;
    font-weight:bold;
    cursor:pointer;
}

main{

.bienvenida{

}

.bienvenida h1{
    font-size:25px;
    margin-bottom:6px;
}

.empresa{
    background:white;

}

.empresa-titulo{

    margin-bottom:5px;
}

.empresa-nombre{

}

.separador{
    margin:25px 0 15px;
}

.seccion-titulo{
    font-size:19px;
    font-weight:bold;
    margin-bottom:13px;
}

.grid{
    display:grid;
    grid-template-columns:repeat(2,1fr);
    gap:13px;
}

.acceso{
    border:none;
    background:white;
    border:1px solid #e5e7eb;
    border-radius:14px;
    padding:18px 15px;
    text-align:left;
    cursor:pointer;
    box-shadow:0 2px 7px rgba(0,0,0,.04);
    transition:.15s;
}

.acceso:hover{
    border-color:#9ca3af;
    transform:translateY(-1px);
}

.acceso:active{
    transform:scale(.98);
}

.acceso-icono{
    font-size:29px;
    margin-bottom:10px;
}

.acceso-titulo{
    font-size:16px;
    font-weight:bold;
    color:#111827;
    margin-bottom:5px;
}

.acceso-descripcion{
    color:#6b7280;
    font-size:12px;
    line-height:1.4;
}

.administracion .acceso{
    border-color:#c7d2fe;
    background:#f8faff;
}

.administracion .acceso-titulo{
    color:#1e3a8a;
}

.usuario{
    background:#f3f4f6;
    border-radius:12px;
    padding:15px;
    margin-top:22px;
}

.usuario-titulo{
    font-size:12px;
    color:#6b7280;
    margin-bottom:5px;
}

.usuario-dato{
    font-size:14px;
    font-weight:bold;
    word-break:break-word;
}

.estado{
    display:none;
    padding:13px;
    border-radius:10px;
    margin-bottom:18px;
    font-size:14px;
}

.estado.visible{
    display:block;
}

.estado.error{
    background:#fee2e2;
    color:#991b1b;
}

.estado.info{
    background:#dbeafe;
    color:#1e40af;
}

.cargando{
    padding:30px;
    text-align:center;
    color:#6b7280;
}

.footer{
    text-align:center;
    color:#6b7280;
    font-size:12px;
    padding:30px 0 10px;
}

@media(max-width:600px){

    main{

    }

    }

    .header-superior{
        align-items:flex-start;
    }

    .logo{
        font-size:24px;
    }

}

</style>

<script type="module">


// ==========================================
// FIREBASE
// ==========================================

import {
    auth,
    db
} from "./Js/firebase.js";


import {
    onAuthStateChanged,
    signOut
} from
"https://www.gstatic.com/firebasejs/12.1.0/firebase-auth.js";


import {
    collection,
    getDocs
} from
"https://www.gstatic.com/firebasejs/12.1.0/firebase-firestore.js";


// ==========================================
// ELEMENTOS
// ==========================================

const cargando =
document.getElementById(
    "cargando"
);

const contenido =
document.getElementById(
    "contenido"
);

const bienvenidaNombre =
document.getElementById(
    "bienvenidaNombre"
);

const nombreEmpresa =
document.getElementById(
    "nombreEmpresa"
);

const usuarioEmail =
document.getElementById(
    "usuarioEmail"
);

const estado =
document.getElementById(
    "estado"
);

const btnSalir =
document.getElementById(
    "btnSalir"
);


// ==========================================
// NAVEGACIÓN
// ==========================================

window.ir =
function(pagina){

    window.location.href =
    pagina;

};


// ==========================================
// MENSAJE
// ==========================================

function mostrarEstado(
    texto,
    tipo
){

    estado.textContent =
    texto;

    estado.className =
    "estado visible " +
    tipo;

}


// ==========================================
// CARGAR EMPRESA
// ==========================================

async function cargarEmpresa(
    usuario
){

    try{

        const snapshot =
        await getDocs(
            collection(
                db,
                "empresas"
            )
        );


        let empresa =
        null;


        snapshot.forEach(
            function(documento){

                const datos =
                documento.data();


                if(
                    documento.id ===
                    usuario.uid
                ){

                    empresa =
                    datos;

                }


                if(
                    datos.uid ===
                    usuario.uid
                    ||
                    datos.usuarioId ===
                    usuario.uid
                ){

                    empresa =
                    datos;

                }

            }
        );


        if(empresa){

            nombreEmpresa.textContent =
            empresa.nombreEmpresa ||
            empresa.nombre ||
            empresa.razonSocial ||
            "Mi empresa";

        }

    }
    catch(error){

        console.error(
            "Error cargando empresa:",
            error
        );

    }

}


// ==========================================
// AUTENTICACIÓN
// ==========================================

onAuthStateChanged(
    auth,
    async function(usuario){

        if(!usuario){

            window.location.replace(
                "login.html"
            );

            return;

        }


        usuarioEmail.textContent =
        usuario.email ||
        "-";


        const nombre =
        usuario.displayName ||
        usuario.email?.split("@")[0] ||
        "Usuario";


        bienvenidaNombre.textContent =
        "Bienvenido, " +
        nombre;


        await cargarEmpresa(
            usuario
        );


        cargando.style.display =
        "none";


        contenido.style.display =
        "block";

    }
);


// ==========================================
// CERRAR SESIÓN
// ==========================================

btnSalir.addEventListener(
    "click",
    async function(){

        try{

            await signOut(
                auth
            );


            window.location.replace(
                "login.html"
            );

        }
        catch(error){

            console.error(
                error
            );


            mostrarEstado(
                "No se pudo cerrar la sesión.",
                "error"
            );

        }

    }
);

</script>
