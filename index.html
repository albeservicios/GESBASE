import {
    auth,
    db
} from "./Js/firebase.js";

import {
    onAuthStateChanged,
    signOut
} from "https://www.gstatic.com/firebasejs/12.18.0/firebase-auth.js";

import {
    doc,
    getDoc,
    collection,
    query,
    where,
    getDocs
} from "https://www.gstatic.com/firebasejs/12.18.0/firebase-firestore.js";


/* =====================================================
   MANEJO DEL BOTÓN / GESTO DE ATRÁS EN ANDROID
===================================================== */

document.addEventListener("backbutton", function (e) {
    e.preventDefault();

    // Si hay una página previa en el historial del navegador/app, navega hacia atrás
    if (window.history.length > 1) {
        window.history.back();
    } else {
        // Si no hay más páginas previas (estás en la raíz), minimiza la app en Android
        if (window.Capacitor && window.Capacitor.Plugins && window.Capacitor.Plugins.App) {
            window.Capacitor.Plugins.App.minimizeApp();
        }
    }
}, false);


/* =====================================================
   CONFIGURACIÓN
===================================================== */

const EMAIL_ADMIN =
    "julianbattauz006@gmail.com";


/* =====================================================

const contenido =

const panelEmpleado =

const nombreEmpresa =

const razonSocial =

const rubroEmpresa =
    document.getElementById("rubroEmpresa");

const infoEmpresa =
    document.getElementById("infoEmpresa");

const infoRazonSocial =
    document.getElementById("infoRazonSocial");

const infoRubro =

const infoEmail =

const estadoAcceso =

const alertaAcceso =

const totalIngresos =

const totalGastos =

const resultadoEmpresa =

/* =====================================================
   VARIABLES
===================================================== */

let empresaActual = null;
let empresaIdActual = null;
let usuarioActual = null;
let accesoPermitido = true;
let sesionEmpleado = null;


/* =====================================================
   NOTIFICACIÓN
===================================================== */

function mostrarNotificacion(mensaje){

    notificacion.textContent =
        mensaje;

    notificacion.classList.remove(
        "oculto"
    );

    setTimeout(() => {

        notificacion.classList.add(
            "oculto"
        );

    },3500);

}


/* =====================================================
   FORMATO DINERO
===================================================== */

function dinero(valor){

    const numero =
        Number(valor) || 0;

    return numero.toLocaleString(
        "es-AR",
        {
            style:"currency",
            currency:"ARS"
        }
    );

}


/* =====================================================
   NORMALIZAR RUBRO
===================================================== */

function normalizarRubro(rubro){

    return String(rubro || "")
        .trim()
        .toLowerCase()
        .normalize("NFD")
        .replace(
            /[\u0300-\u036f]/g,
            ""
        );

}


/* =====================================================
   RUBRO COMERCIO
===================================================== */

function esRubroComercio(rubro){

    const r =
        normalizarRubro(rubro);

    return [
        "comercio",
        "distribuidora",
        "distribucion",
        "venta",
        "ventas"
    ].includes(r);

}


/* =====================================================
   RUBRO TRANSPORTE
===================================================== */

function esRubroTransporte(rubro){

    const r =
        normalizarRubro(rubro);

    return [
        "transporte",
        "logistica",
        "paqueteria",
        "flete",
        "camion",
        "chofer"
    ].includes(r);

}


/* =====================================================
   RUBRO CONSTRUCCIÓN
===================================================== */

function esRubroConstruccion(rubro){

    const r =
        normalizarRubro(rubro);

    return [
        "construccion",
        "construcciones",
        "obra",
        "obras",
        "constructor"
    ].includes(r);

}


/* =====================================================
   RUBRO ALQUILERES
===================================================== */

function esRubroAlquilerTemporal(rubro){

    const r =
        normalizarRubro(rubro);

    return [

        "alquiler",
        "alquileres",

        "alquiler temporal",
        "alquiler temporario",

        "alquileres temporales",
        "alquileres temporarios",

        "alquiler temporal de casas",
        "alquiler temporario de casas",

        "alquiler de temporada",
        "alquileres de temporada",

        "alojamiento",
        "hospedaje",

        "cabanas",
        "cabanas y hospedaje",

        "apart",
        "apartamentos temporarios"

    ].includes(r);

}


/* =====================================================
   CONFIGURAR VISTA SEGÚN RUBRO
===================================================== */

function configurarVistaEmpresa(){

    const rubro =
        empresaActual?.rubro ||
        empresaActual?.tipoNegocio ||
        empresaActual?.tipoEmpresa ||
        "";


    const comercio =
        esRubroComercio(rubro);

    const transporte =
        esRubroTransporte(rubro);

    const construccion =
        esRubroConstruccion(rubro);

    const alquilerTemporal =
        esRubroAlquilerTemporal(rubro);


    seccionServicios.classList.toggle(
        "oculto",
        comercio ||
        transporte ||
        construccion ||
        alquilerTemporal
    );


    seccionComercio.classList.toggle(
        "oculto",
        !comercio
    );


    seccionTransporte.classList.toggle(
        "oculto",
        !transporte
    );


    seccionConstruccion.classList.toggle(
        "oculto",
        !construccion
    );


    seccionAlquilerTemporal.classList.toggle(
        "oculto",
        !alquilerTemporal
    );


    seccionPersonal.classList.remove(
        "oculto"
    );

}


/* =====================================================
   OBTENER EMPRESA
===================================================== */

async function obtenerEmpresa(usuario){

    const usuarioRef =
        doc(
            db,
            "usuarios",
            usuario.uid
        );

    const usuarioSnap =
        await getDoc(
            usuarioRef
        );


    let datosUsuario = {};

    if(usuarioSnap.exists()){

        datosUsuario =
            usuarioSnap.data() || {};

    }


    let empresaId =
        datosUsuario.empresaId ||
        datosUsuario.idEmpresa ||
        datosUsuario.empresa ||
        null;


    if(!empresaId){

        const q =
            query(
                collection(
                    db,
                    "empresas"
                ),
                where(
                    "propietarioUid",
                    "==",
                    usuario.uid
                )
            );


        const resultado =
            await getDocs(q);


        if(!resultado.empty){

            empresaId =
                resultado.docs[0].id;

        }

    }


    if(!empresaId){

        return {
            empresa:null,
            empresaId:null,
            usuario:datosUsuario
        };

    }


    const empresaRef =
        doc(
            db,
            "empresas",
            empresaId
        );


    const empresaSnap =
        await getDoc(
            empresaRef
        );


    if(!empresaSnap.exists()){

        return {
            empresa:null,
            empresaId,
            usuario:datosUsuario
        };

    }


    return {

        empresa:{
            id:empresaSnap.id,
            ...empresaSnap.data()
        },

        empresaId,

        usuario:datosUsuario

    };

}


/* =====================================================
   SESIÓN EMPLEADO
===================================================== */

async function cargarSesionEmpleado(){

    try{

        const almacenado =
            sessionStorage.getItem(
                "gesbaseEmpleado"
            );


        if(!almacenado){

            return null;

        }


        const datos =
            JSON.parse(
                almacenado
            );


        if(
            !datos ||
            !datos.uid ||
            !datos.empleadoId ||
            !datos.empresaId
        ){

            sessionStorage.removeItem(
                "gesbaseEmpleado"
            );

            return null;

        }


        if(
            auth.currentUser &&
            datos.uid !==
            auth.currentUser.uid
        ){

            sessionStorage.removeItem(
                "gesbaseEmpleado"
            );

            return null;

        }


        const empleadoRef =
            doc(
                db,
                "empleados",
                datos.empleadoId
            );


        const empleadoSnap =
            await getDoc(
                empleadoRef
            );


        if(!empleadoSnap.exists()){

            sessionStorage.removeItem(
                "gesbaseEmpleado"
            );

            return null;

        }


        const empleado =
            empleadoSnap.data() || {};


        const empresaEmpleado =
            empleado.empresaId ||
            empleado.idEmpresa;


        if(
            empresaEmpleado &&
            String(empresaEmpleado) !==
            String(datos.empresaId)
        ){

            sessionStorage.removeItem(
                "gesbaseEmpleado"
            );

            return null;

        }


        return {

            ...datos,

            empleado:{
                id:empleadoSnap.id,
                ...empleado
            }

        };

    }
    catch(error){

        console.error(
            "Error cargando sesión empleado:",
            error
        );

        sessionStorage.removeItem(
            "gesbaseEmpleado"
        );

        return null;

    }

}


/* =====================================================
   MOSTRAR PANEL EMPLEADO
===================================================== */

function mostrarPanelEmpleado(sesion){

    contenido.classList.add(
        "oculto"
    );

    panelEmpleado.classList.remove(
        "oculto"
    );

    btnCerrarSesion.classList.remove(
        "oculto"
    );


    const empleado =
        sesion.empleado || {};


    const nombre =
        [
            empleado.nombre,
            empleado.apellido
        ]
        .filter(Boolean)
        .join(" ");


    empleadoNombre.textContent =
        nombre ||
        sesion.nombre ||
        "Empleado";


    empleadoPuesto.textContent =
        empleado.puesto ||
        "Sin puesto";


    empleadoTipo.textContent =
        empleado.tipoEmpleado ||
        empleado.tipo ||
        "Empleado";

}


/* =====================================================
   CARGAR DATOS EMPRESA
===================================================== */

async function cargarDatosEmpresa(){

    if(!empresaActual){

        return;

    }


    const empresa =
        empresaActual;


    const nombre =
        empresa.nombre ||
        empresa.nombreEmpresa ||
        empresa.empresa ||
        "Mi empresa";


    const razon =
        empresa.razonSocial ||
        empresa.razon ||
        "-";


    const rubro =
        empresa.rubro ||
        empresa.tipoNegocio ||
        empresa.tipoEmpresa ||
        "Sin definir";


    nombreEmpresa.textContent =
        nombre;

    razonSocial.textContent =
        razon;

    rubroEmpresa.textContent =
        "Rubro: " + rubro;

    infoEmpresa.textContent =
        nombre;

    infoRazonSocial.textContent =
        razon;

    infoRubro.textContent =
        rubro;

    infoEmail.textContent =
        usuarioActual?.email ||
        "-";


    const esAdmin =
        usuarioActual?.email?.toLowerCase() ===
        EMAIL_ADMIN.toLowerCase()
        ||
        usuarioActual?.rol === "admin"
        ||
        usuarioActual?.rol === "administrador";


    if(esAdmin){

        accesoPermitido =
            true;

        seccionAdministrador.classList.remove(
            "oculto"
        );

    }
    else{

        seccionAdministrador.classList.add(
            "oculto"
        );

        accesoPermitido =
            empresa.accesoHabilitado !== false;

    }


    if(accesoPermitido){

        estadoAcceso.textContent =
            "ACCESO HABILITADO";

        estadoAcceso.className =
            "estado-acceso estado-ok";

        alertaAcceso.classList.add(
            "oculto"
        );

    }
    else{

        estadoAcceso.textContent =
            "ACCESO BLOQUEADO";

        estadoAcceso.className =
            "estado-acceso estado-bloqueado";

        alertaAcceso.classList.remove(
            "oculto"
        );

    }


    configurarVistaEmpresa();

}


/* =====================================================
   CARGAR INGRESOS
===================================================== */

async function cargarIngresos(){

    totalIngresos.textContent =
        dinero(0);


    if(!empresaIdActual){

        return;

    }


    try{

        const q =
            query(
                collection(
                    db,
                    "cobros"
                ),
                where(
                    "empresaId",
                    "==",
                    empresaIdActual
                )
            );


        const resultado =
            await getDocs(q);


        let total = 0;


        resultado.forEach(
            snap => {

                const datos =
                    snap.data() || {};


                const estado =
                    String(
                        datos.estado || ""
                    )
                    .trim()
                    .toLowerCase();


                if(
                    !estado ||
                    estado === "cobrado"
                ){

                    total +=
                        Number(
                            datos.importe ??
                            datos.monto ??
                            datos.total ??
                            0
                        );

                }

            }
        );


        totalIngresos.textContent =
            dinero(total);

    }
    catch(error){

        console.error(
            "Error cargando cobros:",
            error
        );

        totalIngresos.textContent =
            dinero(0);

    }

}


/* =====================================================
   CARGAR GASTOS
===================================================== */

async function cargarGastos(){

    totalGastos.textContent =
        dinero(0);

    resultadoEmpresa.textContent =
        dinero(0);


    if(!empresaIdActual){

        return;

    }


    try{

        const q =
            query(
                collection(
                    db,
                    "gastos"
                ),
                where(
                    "empresaId",
                    "==",
                    empresaIdActual
                )
            );


        const resultado =
            await getDocs(q);


        let total = 0;


        resultado.forEach(
            snap => {

                const datos =
                    snap.data() || {};


                total +=
                    Number(
                        datos.importe ??
                        datos.monto ??
                        datos.total ??
                        0
                    );

            }
        );


        totalGastos.textContent =
            dinero(total);


        const texto =
            totalIngresos.textContent
                .replace(/[^\d,-]/g,"")
                .replace(/\./g,"")
                .replace(",", ".");


        const ingresos =
            Number(texto) || 0;


        resultadoEmpresa.textContent =
            dinero(
                ingresos - total
            );

    }
    catch(error){

        console.error(
            "Error cargando gastos:",
            error
        );

        totalGastos.textContent =
            dinero(0);

        resultadoEmpresa.textContent =
            totalIngresos.textContent ||
            dinero(0);

    }

}


/* =====================================================
   NAVEGACIÓN
===================================================== */

document
.querySelectorAll(
    "[data-url]"
)
.forEach(
    boton => {

        boton.addEventListener(
            "click",
            () => {

                const url =
                    boton.dataset.url;


                if(!url){

                    return;

                }


                if(
                    !sesionEmpleado &&
                    boton.classList.contains(
                        "protegido"
                    ) &&
                    !accesoPermitido
                ){

                    mostrarNotificacion(
                        "El acceso de la empresa está bloqueado."
                    );

                    return;

                }


                window.location.href =
                    url;

            }
        );

    }
);


/* =====================================================
   CERRAR SESIÓN
===================================================== */

btnCerrarSesion.addEventListener(
    "click",
    async () => {

        try{

            sessionStorage.removeItem(
                "gesbaseEmpleado"
            );


            await signOut(
                auth
            );


            window.location.replace(
                "./login.html"
            );

        }
        catch(error){

            console.error(
                "Error cerrando sesión:",
                error
            );

            mostrarNotificacion(
                "No se pudo cerrar la sesión."
            );

        }

    }
);


/* =====================================================
   AUTENTICACIÓN
===================================================== */

onAuthStateChanged(
    auth,
    async usuario => {

        try{

            if(!usuario){

                window.location.replace(
                    "./login.html"
                );

                return;

            }


            usuarioActual =
                usuario;


            const sesion =
                await cargarSesionEmpleado();


            if(sesion){

                sesionEmpleado =
                    sesion;


                mostrarPanelEmpleado(
                    sesionEmpleado
                );


                cargando.classList.add(
                    "oculto"
                );


                return;

            }


            sesionEmpleado =
                null;


            const datos =
                await obtenerEmpresa(
                    usuario
                );


            empresaActual =
                datos.empresa;


            empresaIdActual =
                datos.empresaId;


            if(!empresaActual){

                console.warn(
                    "No se encontró una empresa asociada al usuario."
                );


                nombreEmpresa.textContent =
                    "Mi empresa";

                razonSocial.textContent =
                    "Sin empresa asociada";

                rubroEmpresa.textContent =
                    "Configurá los datos de tu empresa";

                infoEmpresa.textContent =
                    "-";

                infoRazonSocial.textContent =
                    "-";

                infoRubro.textContent =
                    "-";

                infoEmail.textContent =
                    usuario.email ||
                    "-";


                accesoPermitido =
                    true;

                estadoAcceso.textContent =
                    "SIN EMPRESA ASOCIADA";

                estadoAcceso.className =
                    "estado-acceso estado-bloqueado";


                alertaAcceso.classList.add(
                    "oculto"
                );

            }
            else{

                await cargarDatosEmpresa();

                await cargarIngresos();

                await cargarGastos();

            }


            btnCerrarSesion.classList.remove(
                "oculto"
            );


            contenido.classList.remove(
                "oculto"
            );


            cargando.classList.add(
                "oculto"
            );

        }
        catch(error){

            console.error(
                "Error iniciando GESBASE:",
                error
            );


            cargando.innerHTML = `

                <div
                    style="
                        background:#fff;
                        border-radius:16px;
                        padding:25px;
                        max-width:600px;
                        margin:auto;
                        box-shadow:0 3px 14px rgba(0,0,0,.08);
                    "
                >

                    <strong>
                        No se pudo cargar GESBASE.
                    </strong>

                    <p>
                        ${String(
                            error?.message ||
                            "Error desconocido"
                        )}
                    </p>

                    <button
                        class="btn btn-secondary"
                        type="button"
                        onclick="location.reload()"
                    >
                        Reintentar
                    </button>

                </div>

            `;

        }

    }
);

</script>
