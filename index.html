<!DOCTYPE html>
<html lang="es">

<head>

<meta charset="UTF-8">

<meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
>

<meta
    name="theme-color"
    content="#111827"
>

<meta
    name="description"

<title>GESBASE - Panel principal</title>

<style>

/* ==========================================
   RESET
========================================== */

*{
    box-sizing:border-box;
    margin:0;
    padding:0;
}


/* ==========================================
   BODY
========================================== */

body{
    font-family:Arial,sans-serif;
    background:#f3f4f6;
    color:#111827;
    min-height:100vh;
}


/* ==========================================
   APP
========================================== */

.app{
    width:100%;
    max-width:600px;
    min-height:100vh;
    margin:auto;
    background:white;
}


/* ==========================================
   HEADER
========================================== */

header{
    background:#111827;
    color:white;
    padding:28px 20px;
    text-align:center;
}

.logo{
    font-size:32px;
    font-weight:bold;
    letter-spacing:1px;
}

.subtitulo{
    margin-top:8px;
    font-size:14px;
    color:#d1d5db;
}


/* ==========================================
   CARGANDO
========================================== */

#cargando{
    text-align:center;
    padding:30px;
    color:#6b7280;
}


/* ==========================================
   ERROR
========================================== */

.error{
    background:#fee2e2 !important;
    color:#991b1b !important;
    padding:15px !important;
    border-radius:10px;
    margin:20px;
}


/* ==========================================
   MAIN
========================================== */

main{
    padding:20px;
}


/* ==========================================
   BIENVENIDA
========================================== */

.bienvenida{
    margin-bottom:20px;
}

.bienvenida h1{
    font-size:24px;
    margin-bottom:8px;
}

.bienvenida p{
    color:#6b7280;
    line-height:1.5;
}


/* ==========================================
   DATOS DE CUENTA
========================================== */

.datos-usuario{
    background:#f3f4f6;
    padding:16px;
    border-radius:12px;
    margin-bottom:24px;
}

.dato{
    margin-bottom:10px;
}

.dato:last-child{
    margin-bottom:0;
}

.etiqueta{
    font-size:12px;
    color:#6b7280;
}

.valor{
    font-weight:bold;
    margin-top:3px;
    word-break:break-word;
}


/* ==========================================
   TITULOS DE SECCIÓN
========================================== */

.titulo-seccion{
    font-size:18px;
    font-weight:bold;
    margin:24px 0 12px 0;
    color:#111827;
}

.titulo-seccion:first-child{
    margin-top:0;
}


/* ==========================================
   MENU
========================================== */

.menu{
    display:grid;
    grid-template-columns:1fr 1fr;
    gap:14px;
}


/* ==========================================
   BOTONES
========================================== */

.boton{
    border:none;
    border-radius:14px;
    padding:20px 10px;
    background:#f9fafb;
    box-shadow:0 2px 8px rgba(0,0,0,.08);
    cursor:pointer;
    font-size:15px;
    font-weight:bold;
    color:#111827;
    min-height:105px;
    transition:
        transform .15s ease,
        box-shadow .15s ease,
        background .15s ease;
}

.boton:hover{
    transform:translateY(-2px);
    box-shadow:0 4px 12px rgba(0,0,0,.12);
}

.boton:active{
    transform:scale(.98);
}


/* ==========================================
   ICONOS
========================================== */

.icono{
    display:block;
    font-size:30px;
    margin-bottom:9px;
}


/* ==========================================
   NUEVO PRESUPUESTO
========================================== */

.boton-principal{
    grid-column:span 2;
    background:#111827;
    color:white;
    min-height:115px;
}

.boton-principal:hover{
    background:#1f2937;
}


/* ==========================================
   PANEL ADMINISTRADOR
========================================== */

.panel-admin{
    grid-column:span 2;
    background:#7c3aed;
    color:white;
    box-shadow:0 3px 10px rgba(124,58,237,.25);
}

.panel-admin:hover{
    background:#6d28d9;
}


/* ==========================================
   PANEL ATENCIÓN
========================================== */

.panel-atencion{
    grid-column:span 2;
    background:#2563eb;
    color:white;
    box-shadow:0 3px 10px rgba(37,99,235,.25);
}

.panel-atencion:hover{
    background:#1d4ed8;
}


/* ==========================================
   ESTADO DE CUENTA
========================================== */

.estado{
    margin-top:24px;
    padding:14px;
    border-radius:10px;
    background:#f3f4f6;
    font-size:14px;
}

#estadoCuenta{
    text-transform:uppercase;
}


/* ==========================================
   CERRAR SESIÓN
========================================== */

#btnCerrarSesion{
    width:100%;
    margin-top:25px;
    border:none;
    background:#dc2626;
    color:white;
    font-weight:bold;
    padding:15px;
    border-radius:10px;
    cursor:pointer;
    font-size:16px;
}

#btnCerrarSesion:hover{
    background:#b91c1c;
}

#btnCerrarSesion:disabled{
    opacity:.6;
    cursor:not-allowed;
}


/* ==========================================
   RESPONSIVE
========================================== */

@media(max-width:600px){

    main{
        padding:16px;
    }

    .menu{
        grid-template-columns:1fr 1fr;
        gap:12px;
    }

    .boton{
        padding:18px 8px;
        font-size:14px;
        min-height:100px;
    }

    .boton-principal{
        min-height:110px;
    }

    .icono{
        font-size:28px;
    }

}

</style>

<script type="module">


// ==========================================
// FIREBASE
// ==========================================

import {
    auth,
    db
} from "./Js/firebase.js";


import {
    onAuthStateChanged,
    signOut
} from
"https://www.gstatic.com/firebasejs/12.1.0/firebase-auth.js";


import {
    doc,
    getDoc
} from
"https://www.gstatic.com/firebasejs/12.1.0/firebase-firestore.js";


// ==========================================
// ELEMENTOS
// ==========================================

const cargando =
document.getElementById(
    "cargando"
);


const contenido =
document.getElementById(
    "contenido"
);


const nombreUsuario =
document.getElementById(
    "nombreUsuario"
);


const empresaUsuario =
document.getElementById(
    "empresaUsuario"
);


const razonSocialUsuario =
document.getElementById(
    "razonSocialUsuario"
);


const emailUsuario =
document.getElementById(
    "emailUsuario"
);


const rolUsuario =
document.getElementById(
    "rolUsuario"
);


const estadoCuenta =
document.getElementById(
    "estadoCuenta"
);


const botonCerrarSesion =
document.getElementById(
    "btnCerrarSesion"
);


const btnPanelAdministrador =
document.getElementById(
    "btnPanelAdministrador"
);


const btnPanelAtencion =
document.getElementById(
    "btnPanelAtencion"
);


const seccionAdministrador =
document.getElementById(
    "seccionAdministrador"
);


const seccionAtencion =
document.getElementById(
    "seccionAtencion"
);


// ==========================================
// ADMINISTRADOR GESBASE
// ==========================================

const EMAIL_ADMIN =
"julianbattauz006@gmail.com";


// ==========================================
// PANEL ADMINISTRADOR
// ==========================================

btnPanelAdministrador.addEventListener(
    "click",
    function(){

        window.location.href =
        "panel-admin.html";

    }
);


// ==========================================
// PANEL DE ATENCIÓN
// ==========================================

btnPanelAtencion.addEventListener(
    "click",
    function(){

        window.location.href =
        "panel-atencion.html";

    }
);


// ==========================================
// COMPROBAR SESIÓN
// ==========================================

onAuthStateChanged(
    auth,
    async function(usuario){

        // ======================================
        // NO HAY SESIÓN
        // ======================================

        if(!usuario){

            window.location.replace(
                "login.html"
            );

            return;

        }


        try{


            // ==================================
            // 1. PERFIL DEL USUARIO
            // ==================================

            const referenciaUsuario =
            doc(
                db,
                "usuarios",
                usuario.uid
            );


            const documentoUsuario =
            await getDoc(
                referenciaUsuario
            );


            let datosUsuario = {};


            if(
                documentoUsuario.exists()
            ){

                datosUsuario =
                documentoUsuario.data();

            }


            // ==================================
            // 2. EMPRESA
            // ==================================

            const referenciaEmpresa =
            doc(
                db,
                "empresas",
                usuario.uid
            );


            const documentoEmpresa =
            await getDoc(
                referenciaEmpresa
            );


            let datosEmpresa = {};


            if(
                documentoEmpresa.exists()
            ){

                datosEmpresa =
                documentoEmpresa.data();

            }


            // ==================================
            // 3. NOMBRE
            // ==================================

            nombreUsuario.textContent =
            datosUsuario.nombre ||
            datosUsuario.nombreCompleto ||
            usuario.displayName ||
            "Usuario";


            // ==================================
            // 4. EMPRESA
            // ==================================

            empresaUsuario.textContent =
            datosEmpresa.nombreEmpresa ||
            datosUsuario.nombreEmpresa ||
            datosUsuario.empresa ||
            "Sin empresa";


            // ==================================
            // 5. RAZÓN SOCIAL
            // ==================================

            razonSocialUsuario.textContent =
            datosEmpresa.razonSocial ||
            datosUsuario.razonSocial ||
            "Sin informar";


            // ==================================
            // 6. EMAIL
            // ==================================

            emailUsuario.textContent =
            datosUsuario.email ||
            datosEmpresa.email ||
            usuario.email ||
            "Sin email";


            // ==================================
            // 7. ROL
            // ==================================

            const rol =
            String(
                datosUsuario.rol ||
                "administrador"
            )
            .trim()
            .toLowerCase();


            rolUsuario.textContent =
            datosUsuario.rol ||
            "administrador";


            // ==================================
            // 8. PANEL ADMINISTRADOR
            // ==================================

            if(
                rol === "administrador" ||
                rol === "admin"
            ){

                seccionAdministrador.style.display =
                "block";

            }
            else{

                seccionAdministrador.style.display =
                "none";

            }


            // ==================================
            // 9. PANEL DE ATENCIÓN
            // SOLO CUENTA ADMINISTRADORA
            // ==================================

            const emailActual =
            String(
                usuario.email || ""
            )
            .trim()
            .toLowerCase();


            if(
                emailActual ===
                EMAIL_ADMIN.toLowerCase()
            ){

                seccionAtencion.style.display =
                "block";

            }
            else{

                seccionAtencion.style.display =
                "none";

            }


            // ==================================
            // 10. ESTADO DE SUSCRIPCIÓN
            // ==================================

            estadoCuenta.textContent =
            datosUsuario.estadoSuscripcion ||
            datosUsuario.estado ||
            "ACTIVO";


            // ==================================
            // 11. MOSTRAR PANEL
            // ==================================

            cargando.style.display =
            "none";


            contenido.style.display =
            "block";


        }
        catch(error){

            console.error(
                "Error leyendo datos:",
                error
            );


            cargando.className =
            "error";


            cargando.textContent =
            "No se pudieron cargar los datos. " +
            error.message;

        }

    }
);


// ==========================================
// CERRAR SESIÓN
// ==========================================

botonCerrarSesion.addEventListener(
    "click",
    async function(){

        botonCerrarSesion.disabled =
        true;


        botonCerrarSesion.textContent =
        "Cerrando sesión...";


        try{

            await signOut(
                auth
            );


            window.location.replace(
                "login.html"
            );

        }
        catch(error){

            console.error(
                "Error cerrando sesión:",
                error
            );


            botonCerrarSesion.disabled =
            false;


            botonCerrarSesion.textContent =
            "Cerrar sesión";


            alert(
                "No se pudo cerrar la sesión."
            );

        }

    }
);

</script>
