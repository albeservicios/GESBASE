<!DOCTYPE html>
<html lang="es">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <meta
        name="theme-color"
        content="#111827"
    >

    <meta
        name="description"
        content="GESBASE - Gestión de presupuestos, trabajos y gastos"
    >

    <title>GESBASE</title>

    <link
        rel="manifest"
        href="manifest.json"
    >

    <style>

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: Arial, sans-serif;
            background: #f3f4f6;
            color: #111827;
            min-height: 100vh;
        }

        .app {
            max-width: 500px;
            margin: auto;
            min-height: 100vh;
            background: white;
        }

        header {
            background: #111827;
            color: white;
            padding: 28px 20px;
            text-align: center;
        }

        .logo {
            font-size: 32px;
            font-weight: bold;
            letter-spacing: 1px;
        }

        .subtitulo {
            margin-top: 8px;
            font-size: 14px;
            opacity: .8;
        }

        main {
            padding: 20px;
        }

        .bienvenida {
            margin-bottom: 25px;
        }

        .bienvenida h1 {
            font-size: 24px;
            margin-bottom: 8px;
        }

        .bienvenida p {
            color: #6b7280;
            line-height: 1.5;
        }

        .menu {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 14px;
        }

        .boton {
            border: none;
            border-radius: 14px;
            padding: 22px 12px;
            background: #f9fafb;
            box-shadow: 0 2px 8px rgba(0,0,0,.08);
            cursor: pointer;
            font-size: 16px;
            font-weight: bold;
            color: #111827;
        }

        .boton:active {
            transform: scale(.98);
        }

        .icono {
            display: block;
            font-size: 30px;
            margin-bottom: 10px;
        }

        .boton.principal {
            grid-column: span 2;
            background: #111827;
            color: white;
        }

        .estado {
            margin-top: 20px;
            padding: 14px;
            border-radius: 10px;
            background: #f3f4f6;
            font-size: 14px;
        }

        .sesion {
            margin-top: 30px;
            text-align: center;
        }

        #btnCerrarSesion {
            width: 100%;
            border: none;
            background: #dc2626;
            color: white;
            font-weight: bold;
            padding: 15px;
            border-radius: 10px;
            cursor: pointer;
            font-size: 16px;
        }

        #btnCerrarSesion:disabled {
            opacity: .6;
            cursor: not-allowed;
        }

    </style>

</head>


<body>

<div class="app">

    <header>

        <div class="logo">
            GESBASE
        </div>

        <div class="subtitulo">
            Gestión de presupuestos y trabajos
        </div>

    </header>


    <main>

        <section class="bienvenida">

            <h1>
                Bienvenido a GESBASE
            </h1>

            <p>
                Gestioná tus presupuestos,
                trabajos y gastos desde un solo lugar.
            </p>

        </section>


        <section class="menu">


            <button
                class="boton principal"
                onclick="irA('presupuesto.html')"
            >

                <span class="icono">
                    📋
                </span>

                Nuevo presupuesto

            </button>


            <button
                class="boton"
                onclick="irA('presupuestos.html')"
            >

                <span class="icono">
                    📑
                </span>

                Mis presupuestos

            </button>


            <button
                class="boton"
                onclick="irA('clientes.html')"
            >

                <span class="icono">
                    👥
                </span>

                Clientes

            </button>


            <button
                class="boton"
                onclick="irA('trabajos.html')"
            >

                <span class="icono">
                    🔧
                </span>

                Trabajos

            </button>


            <button
                class="boton"
                onclick="irA('gastos.html')"
            >

                <span class="icono">
                    💰
                </span>

                Gastos

            </button>


            <button
                class="boton"
                onclick="irA('facturas.html')"
            >

                <span class="icono">
                    🧾
                </span>

                Facturas

            </button>


            <button
                class="boton"
                onclick="irA('fotos.html')"
            >

                <span class="icono">
                    📸
                </span>

                Fotos

            </button>


            <button
                class="boton"
                onclick="irA('empresa.html')"
            >

                <span class="icono">
                    🏢
                </span>

                Mi empresa

            </button>


            <button
                class="boton"
                onclick="irA('suscripcion.html')"
            >

                <span class="icono">
                    ⭐
                </span>

                Suscripción

            </button>


        </section>


        <div class="estado">

            Estado de cuenta:

            <strong id="estadoCuenta">
                Verificando...
            </strong>

        </div>


        <div class="sesion">

            <button
                type="button"
                id="btnCerrarSesion"
            >
                Cerrar sesión
            </button>

        </div>


    </main>

</div>


<script type="module">

    // ==========================================
    // FIREBASE
    // ==========================================

    import {
        auth
    } from "./Js/firebase.js";


    import {
        onAuthStateChanged,
        signOut
    } from "https://www.gstatic.com/firebasejs/12.1.0/firebase-auth.js";


    // ==========================================
    // NAVEGACIÓN
    // ==========================================

    window.irA = function(pagina) {

        window.location.href = pagina;

    };


    // ==========================================
    // COMPROBAR SESIÓN
    // ==========================================

    onAuthStateChanged(
        auth,
        function(usuario) {

            const estado =
                document.getElementById(
                    "estadoCuenta"
                );


            if (!usuario) {

                estado.textContent =
                    "No iniciado";

                window.location.href =
                    "login.html";

                return;

            }


            estado.textContent =
                "Sesión activa";


            console.log(
                "GESBASE - Usuario conectado:",
                usuario.email
            );

        }
    );


    // ==========================================
    // CERRAR SESIÓN
    // ==========================================

    const botonCerrarSesion =
        document.getElementById(
            "btnCerrarSesion"
        );


    botonCerrarSesion.addEventListener(
        "click",
        async function() {

            botonCerrarSesion.disabled =
                true;

            botonCerrarSesion.textContent =
                "Cerrando sesión...";


            try {

                await signOut(auth);


                window.location.replace(
                    "login.html"
                );


            } catch (error) {

                console.error(
                    "Error al cerrar sesión:",
                    error
                );


                botonCerrarSesion.disabled =
                    false;

                botonCerrarSesion.textContent =
                    "Cerrar sesión";


                alert(
                    "No se pudo cerrar la sesión: " +
                    error.message
                );

            }

        }
    );

</script>


</body>

</html>
