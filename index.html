<!DOCTYPE html>
<html lang="es">

<head>

<meta charset="UTF-8">

<meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
>

<meta
    name="theme-color"
    content="#111827"
>

<title>GESBASE</title>

<style>

* {
    box-sizing: border-box;
    margin: 0;
    padding: 0;
}

body {
    font-family: Arial, sans-serif;
    background: #f3f4f6;
    color: #111827;
    min-height: 100vh;
}

.app {
    max-width: 500px;
    min-height: 100vh;
    margin: auto;
    background: white;
}

header {
    background: #111827;
    color: white;
    padding: 28px 20px;
    text-align: center;
}

.logo {
    font-size: 32px;
    font-weight: bold;
}

.subtitulo {
    margin-top: 8px;
    font-size: 14px;
    color: #d1d5db;
}

main {
    padding: 20px;
}

.bienvenida {
    margin-bottom: 25px;
}

.bienvenida h1 {
    font-size: 24px;
    margin-bottom: 8px;
}

.bienvenida p {
    color: #6b7280;
    line-height: 1.5;
}

.datos-usuario {
    background: #f3f4f6;
    padding: 15px;
    border-radius: 12px;
    margin-bottom: 20px;
}

.dato {
    margin-bottom: 8px;
}

.dato:last-child {
    margin-bottom: 0;
}

.etiqueta {
    font-size: 12px;
    color: #6b7280;
}

.valor {
    font-weight: bold;
    margin-top: 2px;
}

.menu {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 14px;
}

.boton {
    border: none;
    border-radius: 14px;
    padding: 22px 12px;
    background: #f9fafb;
    box-shadow: 0 2px 8px rgba(0,0,0,.08);
    cursor: pointer;
    font-size: 16px;
    font-weight: bold;
    color: #111827;
}

.boton-principal {
    grid-column: span 2;
    background: #111827;
    color: white;
}

.icono {
    display: block;
    font-size: 30px;
    margin-bottom: 10px;
}

.estado {
    margin-top: 20px;
    padding: 14px;
    border-radius: 10px;
    background: #f3f4f6;
    font-size: 14px;
}

#btnCerrarSesion {
    width: 100%;
    margin-top: 25px;
    border: none;
    background: #dc2626;
    color: white;
    font-weight: bold;
    padding: 15px;
    border-radius: 10px;
    cursor: pointer;
    font-size: 16px;
}

#btnCerrarSesion:disabled {
    opacity: .6;
}

#cargando {
    text-align: center;
    padding: 30px;
    color: #6b7280;
}

</style>

</head>

<body>

<div class="app">

<header>

<div class="logo">
GESBASE
</div>

<div class="subtitulo">
Gestión para empresas y profesionales
</div>

</header>


<div id="cargando">
Verificando sesión...
</div>


<main id="contenido" style="display:none;">


<section class="bienvenida">

<h1>
Bienvenido, <span id="nombreUsuario">Usuario</span>
</h1>

<p>
Gestioná tus presupuestos,
trabajos y gastos desde un solo lugar.
</p>

</section>


<!-- DATOS DEL USUARIO -->

<section class="datos-usuario">

<div class="dato">

<div class="etiqueta">
Empresa
</div>

<div
class="valor"
id="empresaUsuario"
>
Cargando...
</div>

</div>


<div class="dato">

<div class="etiqueta">
Email
</div>

<div
class="valor"
id="emailUsuario"
>
Cargando...
</div>

</div>


<div class="dato">

<div class="etiqueta">
Rol
</div>

<div
class="valor"
id="rolUsuario"
>
Cargando...
</div>

</div>

</section>


<!-- MENU -->

<section class="menu">


<button
class="boton boton-principal"
onclick="window.location.href='presupuesto.html'"
>

<span class="icono">
📋
</span>

Nuevo presupuesto

</button>


<button
class="boton"
onclick="window.location.href='presupuestos.html'"
>

<span class="icono">
📑
</span>

Mis presupuestos

</button>


<button
class="boton"
onclick="window.location.href='clientes.html'"
>

<span class="icono">
👥
</span>

Clientes

</button>


<button
class="boton"
onclick="window.location.href='trabajos.html'"
>

<span class="icono">
🔧
</span>

Trabajos

</button>


<button
class="boton"
onclick="window.location.href='gastos.html'"
>

<span class="icono">
💰
</span>

Gastos

</button>


<button
class="boton"
onclick="window.location.href='facturas.html'"
>

<span class="icono">
🧾
</span>

Facturas

</button>


<button
class="boton"
onclick="window.location.href='fotos.html'"
>

<span class="icono">
📸
</span>

Fotos

</button>


<button
class="boton"
onclick="window.location.href='empresa.html'"
>

<span class="icono">
🏢
</span>

Mi empresa

</button>


<button
class="boton"
onclick="window.location.href='suscripcion.html'"
>

<span class="icono">
⭐
</span>

Suscripción

</button>


</section>


<div class="estado">

Estado de cuenta:

<strong id="estadoCuenta">
Activo
</strong>

</div>


<button
id="btnCerrarSesion"
>
Cerrar sesión
</button>


</main>

</div>


<script type="module">


// ==========================================
// FIREBASE
// ==========================================

import {
    auth,
    db
} from "./Js/firebase.js";


import {
    onAuthStateChanged,
    signOut
} from
"https://www.gstatic.com/firebasejs/12.1.0/firebase-auth.js";


import {
    doc,
    getDoc
} from
"https://www.gstatic.com/firebasejs/12.1.0/firebase-firestore.js";


// ==========================================
// ELEMENTOS
// ==========================================

const cargando =
document.getElementById("cargando");

const contenido =
document.getElementById("contenido");

const nombreUsuario =
document.getElementById("nombreUsuario");

const empresaUsuario =
document.getElementById("empresaUsuario");

const emailUsuario =
document.getElementById("emailUsuario");

const rolUsuario =
document.getElementById("rolUsuario");

const estadoCuenta =
document.getElementById("estadoCuenta");

const botonCerrarSesion =
document.getElementById("btnCerrarSesion");


// ==========================================
// COMPROBAR USUARIO
// ==========================================

onAuthStateChanged(
auth,
async function(usuario) {

    if (!usuario) {

        window.location.replace(
            "login.html"
        );

        return;
    }


    try {

        // ==================================
        // BUSCAR USUARIO EN FIRESTORE
        // ==================================

        const referencia =
            doc(
                db,
                "usuarios",
                usuario.uid
            );


        const documento =
            await getDoc(
                referencia
            );


        if (
            documento.exists()
        ) {

            const datos =
                documento.data();


            // ==============================
            // MOSTRAR DATOS
            // ==============================

            nombreUsuario.textContent =
                datos.nombre || "Usuario";


            empresaUsuario.textContent =
                datos.empresa || "Sin empresa";


            emailUsuario.textContent =
                datos.email || usuario.email;


            rolUsuario.textContent =
                datos.rol || "usuario";


            estadoCuenta.textContent =
                datos.estado || "activo";

        }

        else {

            nombreUsuario.textContent =
                usuario.displayName ||
                "Usuario";

            empresaUsuario.textContent =
                "Sin empresa";

            emailUsuario.textContent =
                usuario.email;

            rolUsuario.textContent =
                "usuario";

        }


        // ==================================
        // MOSTRAR GESBASE
        // ==================================

        cargando.style.display =
            "none";

        contenido.style.display =
            "block";


    } catch (error) {

        console.error(
            "Error leyendo usuario:",
            error
        );

        cargando.textContent =
            "No se pudieron cargar los datos del usuario.";

    }

});


// ==========================================
// CERRAR SESIÓN
// ==========================================

botonCerrarSesion.addEventListener(
"click",
async function() {

    botonCerrarSesion.disabled =
        true;

    botonCerrarSesion.textContent =
        "Cerrando sesión...";


    try {

        await signOut(auth);


        window.location.replace(
            "login.html"
        );


    } catch (error) {

        console.error(
            "Error cerrando sesión:",
            error
        );


        botonCerrarSesion.disabled =
            false;

        botonCerrarSesion.textContent =
            "Cerrar sesión";


        alert(
            "No se pudo cerrar la sesión."
        );

    }

});

</script>

</body>

</html>
