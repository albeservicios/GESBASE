<!DOCTYPE html>
<html lang="es">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <meta
        name="theme-color"
        content="#111827"
    >

    <meta
        name="description"
        content="GESBASE - Gestión de presupuestos, trabajos y gastos"
    >

    <title>GESBASE</title>


    <style>

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }


        body {
            font-family: Arial, sans-serif;
            background: #f3f4f6;
            color: #111827;
            min-height: 100vh;
        }


        .app {
            max-width: 500px;
            min-height: 100vh;
            margin: auto;
            background: white;
        }


        header {
            background: #111827;
            color: white;
            padding: 28px 20px;
            text-align: center;
        }


        .logo {
            font-size: 32px;
            font-weight: bold;
            letter-spacing: 1px;
        }


        .subtitulo {
            margin-top: 8px;
            font-size: 14px;
            color: #d1d5db;
        }


        main {
            padding: 20px;
        }


        .bienvenida {
            margin-bottom: 25px;
        }


        .bienvenida h1 {
            font-size: 24px;
            margin-bottom: 8px;
        }


        .bienvenida p {
            color: #6b7280;
            line-height: 1.5;
        }


        .menu {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 14px;
        }


        .boton {
            border: none;
            border-radius: 14px;
            padding: 22px 12px;
            background: #f9fafb;
            box-shadow: 0 2px 8px rgba(0, 0, 0, .08);
            cursor: pointer;
            font-size: 16px;
            font-weight: bold;
            color: #111827;
        }


        .boton:active {
            transform: scale(.98);
        }


        .boton-principal {
            grid-column: span 2;
            background: #111827;
            color: white;
        }


        .icono {
            display: block;
            font-size: 30px;
            margin-bottom: 10px;
        }


        .estado {
            margin-top: 20px;
            padding: 14px;
            border-radius: 10px;
            background: #f3f4f6;
            font-size: 14px;
        }


        .usuario {
            margin-top: 10px;
            color: #6b7280;
            word-break: break-word;
        }


        #btnCerrarSesion {
            width: 100%;
            margin-top: 25px;
            border: none;
            background: #dc2626;
            color: white;
            font-weight: bold;
            padding: 15px;
            border-radius: 10px;
            cursor: pointer;
            font-size: 16px;
        }


        #btnCerrarSesion:disabled {
            opacity: .6;
            cursor: not-allowed;
        }


        .cargando {
            text-align: center;
            padding: 30px 20px;
            color: #6b7280;
        }

    </style>

</head>


<body>


<div class="app">


    <header>

        <div class="logo">
            GESBASE
        </div>

        <div class="subtitulo">
            Gestión para empresas y profesionales
        </div>

    </header>


    <main id="contenido" style="display: none;">


        <section class="bienvenida">

            <h1>
                Bienvenido a GESBASE
            </h1>

            <p>
                Gestioná tus presupuestos,
                trabajos y gastos desde un solo lugar.
            </p>

        </section>


        <section class="menu">


            <button
                class="boton boton-principal"
                type="button"
                onclick="window.location.href='presupuesto.html'"
            >

                <span class="icono">
                    📋
                </span>

                Nuevo presupuesto

            </button>


            <button
                class="boton"
                type="button"
                onclick="window.location.href='presupuestos.html'"
            >

                <span class="icono">
                    📑
                </span>

                Mis presupuestos

            </button>


            <button
                class="boton"
                type="button"
                onclick="window.location.href='clientes.html'"
            >

                <span class="icono">
                    👥
                </span>

                Clientes

            </button>


            <button
                class="boton"
                type="button"
                onclick="window.location.href='trabajos.html'"
            >

                <span class="icono">
                    🔧
                </span>

                Trabajos

            </button>


            <button
                class="boton"
                type="button"
                onclick="window.location.href='gastos.html'"
            >

                <span class="icono">
                    💰
                </span>

                Gastos

            </button>


            <button
                class="boton"
                type="button"
                onclick="window.location.href='facturas.html'"
            >

                <span class="icono">
                    🧾
                </span>

                Facturas

            </button>


            <button
                class="boton"
                type="button"
                onclick="window.location.href='fotos.html'"
            >

                <span class="icono">
                    📸
                </span>

                Fotos

            </button>


            <button
                class="boton"
                type="button"
                onclick="window.location.href='empresa.html'"
            >

                <span class="icono">
                    🏢
                </span>

                Mi empresa

            </button>


            <button
                class="boton"
                type="button"
                onclick="window.location.href='suscripcion.html'"
            >

                <span class="icono">
                    ⭐
                </span>

                Suscripción

            </button>


        </section>


        <div class="estado">

            Estado de cuenta:

            <strong id="estadoCuenta">
                Sesión activa
            </strong>


            <div class="usuario">

                Usuario:

                <strong id="usuarioEmail">
                    Cargando...
                </strong>

            </div>

        </div>


        <button
            type="button"
            id="btnCerrarSesion"
        >
            Cerrar sesión
        </button>


    </main>


    <div
        id="pantallaCargando"
        class="cargando"
    >

        Verificando sesión...

    </div>


</div>


<script type="module">


    // ==========================================
    // FIREBASE
    // ==========================================

    import {
        auth
    } from "./Js/firebase.js";


    import {
        onAuthStateChanged,
        signOut
    } from
    "https://www.gstatic.com/firebasejs/12.1.0/firebase-auth.js";


    // ==========================================
    // ELEMENTOS
    // ==========================================

    const contenido =
        document.getElementById(
            "contenido"
        );


    const pantallaCargando =
        document.getElementById(
            "pantallaCargando"
        );


    const estadoCuenta =
        document.getElementById(
            "estadoCuenta"
        );


    const usuarioEmail =
        document.getElementById(
            "usuarioEmail"
        );


    const botonCerrarSesion =
        document.getElementById(
            "btnCerrarSesion"
        );


    // ==========================================
    // CONTROL DE AUTENTICACIÓN
    // ==========================================

    onAuthStateChanged(
        auth,
        function(usuario) {


            console.log(
                "GESBASE - Estado de autenticación:",
                usuario
            );


            // ======================================
            // SIN USUARIO
            // ======================================

            if (!usuario) {

                console.log(
                    "GESBASE - No hay sesión."
                );


                window.location.replace(
                    "login.html"
                );


                return;

            }


            // ======================================
            // USUARIO CONECTADO
            // ======================================

            console.log(
                "GESBASE - Usuario conectado:",
                usuario.email
            );


            estadoCuenta.textContent =
                "Sesión activa";


            usuarioEmail.textContent =
                usuario.email;


            pantallaCargando.style.display =
                "none";


            contenido.style.display =
                "block";

        }
    );


    // ==========================================
    // CERRAR SESIÓN
    // ==========================================

    botonCerrarSesion.addEventListener(
        "click",
        async function() {


            console.log(
                "GESBASE - Cerrando sesión..."
            );


            botonCerrarSesion.disabled =
                true;


            botonCerrarSesion.textContent =
                "Cerrando sesión...";


            try {


                await signOut(auth);


                console.log(
                    "GESBASE - Sesión cerrada correctamente."
                );


                window.location.replace(
                    "login.html"
                );


            } catch (error) {


                console.error(
                    "GESBASE - Error al cerrar sesión:",
                    error
                );


                botonCerrarSesion.disabled =
                    false;


                botonCerrarSesion.textContent =
                    "Cerrar sesión";


                alert(
                    "No se pudo cerrar la sesión:\n\n" +
                    error.message
                );

            }

        }
    );


</script>


</body>

</html>
