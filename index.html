<title>GESBASE - Panel principal</title>


<style>

/* =========================================================
   RESET
========================================================= */

*{
    box-sizing:border-box;
}

body{
    margin:0;
    font-family:Arial,Helvetica,sans-serif;
    background:#f3f4f6;
    color:#111827;
}

.oculto{
    display:none !important;
}


/* =========================================================
   TOPBAR
========================================================= */

.topbar{
    background:#111827;
    color:white;
    padding:15px 20px;
    display:flex;
    align-items:center;
    justify-content:space-between;
    gap:15px;
    position:sticky;
    top:0;
    z-index:1000;
    box-shadow:0 3px 12px rgba(0,0,0,.15);
}

.marca{
    display:flex;
    align-items:center;
    gap:12px;
}

.logo{
    width:44px;
    height:44px;
    border-radius:12px;
    background:#2563eb;
    display:flex;
    align-items:center;
    justify-content:center;
    font-weight:bold;
    font-size:21px;
}

.marca-texto h1{
    margin:0;
    font-size:20px;
}

.marca-texto p{
    margin:3px 0 0;
    font-size:12px;
    color:#cbd5e1;
}

.topbar-derecha{
    display:flex;
    align-items:center;
    gap:10px;
}


/* =========================================================
   BOTONES
========================================================= */

.btn{
    border:0;
    border-radius:9px;
    padding:10px 14px;
    cursor:pointer;
    font-weight:bold;
}

.btn-secondary{
    background:#374151;
    color:white;
}


/* =========================================================
   CONTENEDOR
========================================================= */

.contenedor{
    width:calc(100% - 30px);
    max-width:1150px;
    margin:25px auto 50px;
}
