.panel-admin{

.estado{

#estadoCuenta{

#btnCerrarSesion{

    margin-top:25px;  
    border:none;

    padding:15px;  
    border-radius:10px;  
    cursor:pointer;  
    font-size:16px;

#btnCerrarSesion:disabled{  
    opacity:.6;  
}  
  
#cargando{  
    text-align:center;  
    padding:30px;  
    color:#6b7280;  
}  
  
.error{  
    background:#fee2e2;  
    color:#991b1b;  
    padding:15px;  
    border-radius:10px;  
    margin:20px;  
}  
  
</style>  </head>  <body>  <div class="app">  <header>  <div class="logo">

</main>  </div>  <script type="module">  
  
  
// ==========================================  
// FIREBASE  
// ==========================================  
  
import {  
    auth,  
    db  
} from "./Js/firebase.js";  
  
  
import {  
    onAuthStateChanged,  
    signOut  
} from  
"https://www.gstatic.com/firebasejs/12.1.0/firebase-auth.js";  
  
  
import {  
    doc,  
    getDoc  
} from  
"https://www.gstatic.com/firebasejs/12.1.0/firebase-firestore.js";  
  
  
// ==========================================  
// ELEMENTOS  
// ==========================================  
  
const cargando =  
document.getElementById("cargando");  
  
const contenido =  
document.getElementById("contenido");  
  
const nombreUsuario =  
document.getElementById("nombreUsuario");  
  
const empresaUsuario =  
document.getElementById("empresaUsuario");  
  
const razonSocialUsuario =  
document.getElementById("razonSocialUsuario");  
  
const emailUsuario =  
document.getElementById("emailUsuario");  
  
const rolUsuario =  
document.getElementById("rolUsuario");  
  
const estadoCuenta =  
document.getElementById("estadoCuenta");  
  
const botonCerrarSesion =  
document.getElementById("btnCerrarSesion");  
  
const btnPanelAdministrador =  
document.getElementById(  
    "btnPanelAdministrador"  
);  
  
  
// ==========================================  
// PANEL ADMINISTRADOR  
// ==========================================  
  
btnPanelAdministrador.addEventListener(  
    "click",  
    function(){  
  
        window.location.href =  
        "panel-admin.html";  
  
    }  
);  
  
  
// ==========================================  
// COMPROBAR SESIÓN  
// ==========================================  
  
onAuthStateChanged(  
    auth,  
    async function(usuario){  
  
        if(!usuario){  
  
            window.location.replace(  
                "login.html"  
            );  
  
            return;  
  
        }  
  
  
        try{  
  
  
            // ==================================  
            // 1. BUSCAR PERFIL DEL USUARIO  
            // ==================================  
  
            const referenciaUsuario =  
            doc(  
                db,  
                "usuarios",  
                usuario.uid  
            );  
  
  
            const documentoUsuario =  
            await getDoc(  
                referenciaUsuario  
            );  
  
  
            let datosUsuario = {};  
  
  
            if(  
                documentoUsuario.exists()  
            ){  
  
                datosUsuario =  
                documentoUsuario.data();  
  
            }  
  
  
            // ==================================  
            // 2. BUSCAR EMPRESA  
            // ==================================  
  
            const referenciaEmpresa =  
            doc(  
                db,  
                "empresas",  
                usuario.uid  
            );  
  
  
            const documentoEmpresa =  
            await getDoc(  
                referenciaEmpresa  
            );  
  
  
            let datosEmpresa = {};  
  
  
            if(  
                documentoEmpresa.exists()  
            ){  
  
                datosEmpresa =  
                documentoEmpresa.data();  
  
            }  
  
  
            // ==================================  
            // 3. MOSTRAR USUARIO  
            // ==================================  
  
            nombreUsuario.textContent =  
            datosUsuario.nombre ||  
            datosUsuario.nombreCompleto ||  
            usuario.displayName ||  
            "Usuario";  
  
  
            // ==================================  
            // 4. MOSTRAR EMPRESA  
            // ==================================  
  
            empresaUsuario.textContent =  
            datosEmpresa.nombreEmpresa ||  
            datosUsuario.nombreEmpresa ||  
            datosUsuario.empresa ||  
            "Sin empresa";  
  
  
            // ==================================  
            // 5. MOSTRAR RAZÓN SOCIAL  
            // ==================================  
  
            razonSocialUsuario.textContent =  
            datosEmpresa.razonSocial ||  
            datosUsuario.razonSocial ||  
            "Sin informar";  
  
  
            // ==================================  
            // 6. EMAIL  
            // ==================================  
  
            emailUsuario.textContent =  
            datosUsuario.email ||  
            datosEmpresa.email ||  
            usuario.email ||  
            "Sin email";  
  
  
            // ==================================  
            // 7. ROL  
            // ==================================  
  
            const rol =  
            String(  
                datosUsuario.rol ||  
                "administrador"  
            )  
            .trim()  
            .toLowerCase();  
  
  
            rolUsuario.textContent =  
            datosUsuario.rol ||  
            "administrador";  
  
  
            // ==================================  
            // 8. MOSTRAR PANEL ADMIN  
            // ==================================  
  
            if(  
                rol === "administrador" ||  
                rol === "admin"  
            ){  
  
                btnPanelAdministrador.style.display =  
                "block";  
  
            }  
            else{  
  
                btnPanelAdministrador.style.display =  
                "none";  
  
            }  
  
  
            // ==================================  
            // 9. ESTADO DE SUSCRIPCIÓN  
            // ==================================  
  
            estadoCuenta.textContent =  
            datosUsuario.estadoSuscripcion ||  
            datosUsuario.estado ||  
            "ACTIVO";  
  
  
            // ==================================  
            // 10. MOSTRAR PANEL  
            // ==================================  
  
            cargando.style.display =  
            "none";  
  
            contenido.style.display =  
            "block";  
  
  
        }  
        catch(error){  
  
            console.error(  
                "Error leyendo datos:",  
                error  
            );  
  
  
            cargando.className =  
            "error";  
  
  
            cargando.textContent =  
            "No se pudieron cargar los datos. " +  
            error.message;  
  
        }  
  
    }  
);  
  
  
// ==========================================  
// CERRAR SESIÓN  
// ==========================================  
  
botonCerrarSesion.addEventListener(  
    "click",  
    async function(){  
  
        botonCerrarSesion.disabled =  
        true;  
  
        botonCerrarSesion.textContent =  
        "Cerrando sesión...";  
  
  
        try{  
  
            await signOut(auth);  
  
  
            window.location.replace(  
                "login.html"  
            );  
  
  
        }  
        catch(error){  
  
            console.error(  
                "Error cerrando sesión:",  
                error  
            );  
  
  
            botonCerrarSesion.disabled =  
            false;  
  
            botonCerrarSesion.textContent =  
            "Cerrar sesión";  
  
  
            alert(  
                "No se pudo cerrar la sesión."  
            );  
  
        }  
  
    }  
);  
  
</script>  </body>  </html>
