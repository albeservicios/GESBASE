<!DOCTYPE html>
<html lang="es-AR">

<head>

<meta charset="UTF-8">

<meta name="viewport" content="width=device-width, initial-scale=1.0">

<meta name="theme-color" content="#111827">

<title>Asistencia - GESBASE</title>

<style>

*{
    box-sizing:border-box;
    margin:0;
    padding:0;
}

body{
    font-family:Arial,Helvetica,sans-serif;
    background:#f3f4f6;
    color:#111827;
    min-height:100vh;
}

.contenedor{
    width:100%;
    max-width:900px;
    margin:0 auto;
    padding:20px;
}

header{
    background:#111827;
    color:white;
    border-radius:16px;
    padding:22px;
    margin-bottom:20px;
}

header h1{
    font-size:25px;
    margin-bottom:7px;
}

header p{
    color:#d1d5db;
    font-size:14px;
}

.volver{
    display:inline-block;
    margin-top:15px;
    color:white;
    text-decoration:none;
    font-size:14px;
}

.card{
    background:white;
    border-radius:16px;
    padding:20px;
    margin-bottom:20px;
    box-shadow:0 4px 15px rgba(0,0,0,.06);
}

.card h2{
    font-size:19px;
    margin-bottom:18px;
}

label{
    display:block;
    font-weight:bold;
    font-size:14px;
    margin-bottom:7px;
}

select,
input,
textarea{
    width:100%;
    border:1px solid #d1d5db;
    border-radius:10px;
    padding:13px;
    font-size:15px;
    outline:none;
    background:white;
}

select:focus,
input:focus,
textarea:focus{
    border-color:#111827;
}

textarea{
    min-height:130px;
    resize:vertical;
}

.campo{
    margin-bottom:16px;
}

button{
    width:100%;
    border:none;
    border-radius:10px;
    padding:14px;
    background:#111827;
    color:white;
    font-size:15px;
    font-weight:bold;
    cursor:pointer;
}

button:hover{
    opacity:.92;
}

button:disabled{
    opacity:.6;
    cursor:not-allowed;
}

/* MENSAJE DE RESULTADO */

#resultado{
    display:none;
    margin-top:15px;
    padding:12px;
    border-radius:10px;
    font-size:14px;
}

#resultado.exito{
    display:block;
    background:#dcfce7;
    color:#166534;
}

#resultado.error{
    display:block;
    background:#fee2e2;
    color:#991b1b;
}

/* CONSULTAS */

.consulta{
    border:1px solid #e5e7eb;
    border-radius:12px;
    padding:16px;
    margin-bottom:12px;
    background:#fff;
}

.consulta-top{
    display:flex;
    justify-content:space-between;
    align-items:flex-start;
    gap:10px;
}

.asunto{
    font-weight:bold;
    font-size:16px;
}

.estado{
    padding:5px 9px;
    border-radius:20px;
    font-size:12px;
    font-weight:bold;
    white-space:nowrap;
}

.estado.pendiente{
    background:#fef3c7;
    color:#92400e;
}

.estado.en_revision{
    background:#dbeafe;
    color:#1e40af;
}

.estado.respondida{
    background:#dcfce7;
    color:#166534;
}

.estado.cerrada{
    background:#e5e7eb;
    color:#374151;
}

.info{
    margin-top:8px;
    color:#6b7280;
    font-size:13px;
}

.mensaje-consulta{
    margin-top:12px;
    line-height:1.5;
    white-space:pre-wrap;
    color:#374151;
}

.cargando,
.sin-consultas{
    text-align:center;
    color:#6b7280;
    padding:25px 10px;
}

.separador{
    height:1px;
    background:#e5e7eb;
    margin:20px 0;
}

@media(max-width:600px){

    .contenedor{
        padding:12px;
    }

    header{
        padding:18px;
        border-radius:13px;
    }

    .card{
        padding:16px;
        border-radius:13px;
    }

    .consulta-top{
        flex-direction:column;
    }

}

</style>

</head>

<body>

<div class="contenedor">

<header>

<h1>🤖 Asistencia GESBASE</h1>

<p>
Consultá sobre el funcionamiento y uso de GESBASE.
</p>

<a
    href="index.html"
    class="volver"
>
← Volver al panel
</a>

</header>


<!-- ==============================
     NUEVA CONSULTA
============================== -->

<div class="card">

<h2>💬 Nueva consulta</h2>

<form id="formConsulta">

<div class="campo">

<label for="categoria">
Categoría
</label>

<select id="categoria" required>

<option value="">
Seleccioná una categoría
</option>

<option value="Consulta sobre GESBASE">
Consulta sobre GESBASE
</option>

<option value="Clientes">
Clientes
</option>

<option value="Presupuestos">
Presupuestos
</option>

<option value="Trabajos">
Trabajos
</option>

<option value="Empleados">
Empleados
</option>

<option value="Fichajes">
Fichajes
</option>

<option value="Gastos">
Gastos
</option>

<option value="Facturación">
Facturación
</option>

<option value="Cobros">
Cobros
</option>

<option value="Ventas">
Ventas
</option>

<option value="Productos">
Productos
</option>

<option value="Suscripción">
Suscripción
</option>

<option value="Otro">
Otro
</option>

</select>

</div>


<div class="campo">

<label for="asunto">
Asunto
</label>

<input
    type="text"
    id="asunto"
    placeholder="¿En qué necesitás ayuda?"
    maxlength="150"
    required
>

</div>


<div class="campo">

<label for="mensaje">
Mensaje
</label>

<textarea
    id="mensaje"
    placeholder="Escribí tu consulta..."
    maxlength="3000"
    required
></textarea>

</div>


<button
    type="submit"
    id="btnEnviar"
>
📩 Enviar consulta
</button>

</form>


<div
    id="resultado"
></div>

</div>


<!-- ==============================
     HISTORIAL
============================== -->

<div class="card">

<h2>📋 Mis consultas</h2>

<div
    id="listaConsultas"
>
<div class="cargando">
Cargando consultas...
</div>
</div>

</div>

</div>


<script type="module">

import {
    auth,
    db
} from "./firebase.js";

import {
    onAuthStateChanged
} from "https://www.gstatic.com/firebasejs/12.18.0/firebase-auth.js";

import {
    collection,
    addDoc,
    getDocs,
    query,
    where,
    serverTimestamp
} from "https://www.gstatic.com/firebasejs/12.18.0/firebase-firestore.js";


const formConsulta =
    document.getElementById("formConsulta");

const btnEnviar =
    document.getElementById("btnEnviar");

const resultado =
    document.getElementById("resultado");

const listaConsultas =
    document.getElementById("listaConsultas");


/* ==========================================
   ESCAPAR HTML
========================================== */

function escapar(texto){

    if(
        texto === null ||
        texto === undefined
    ){
        return "";
    }

    return String(texto)
        .replace(/&/g,"&amp;")
        .replace(/</g,"&lt;")
        .replace(/>/g,"&gt;")
        .replace(/"/g,"&quot;")
        .replace(/'/g,"&#039;");

}


/* ==========================================
   FECHA
========================================== */

function fechaTexto(timestamp){

    if(!timestamp){
        return "Fecha pendiente";
    }

    try{

        if(typeof timestamp.toDate === "function"){

            return timestamp
                .toDate()
                .toLocaleString(
                    "es-AR",
                    {
                        day:"2-digit",
                        month:"2-digit",
                        year:"numeric",
                        hour:"2-digit",
                        minute:"2-digit"
                    }
                );

        }

        return "Fecha pendiente";

    }catch(error){

        return "Fecha pendiente";

    }

}


/* ==========================================
   ESTADO
========================================== */

function estadoTexto(estado){

    switch(estado){

        case "pendiente":
            return "Pendiente";

        case "en_revision":
            return "En revisión";

        case "respondida":
            return "Respondida";

        case "cerrada":
            return "Cerrada";

        default:
            return estado || "Pendiente";

    }

}


/* ==========================================
   MOSTRAR RESULTADO
========================================== */

function mostrarResultado(texto,tipo){

    resultado.textContent = texto;

    resultado.className = tipo;

}


/* ==========================================
   OCULTAR RESULTADO
========================================== */

function ocultarResultado(){

    resultado.textContent = "";

    resultado.className = "";

}


/* ==========================================
   CARGAR CONSULTAS
========================================== */

async function cargarConsultas(user){

    listaConsultas.innerHTML =
        '<div class="cargando">Cargando consultas...</div>';

    try{

        const q = query(

            collection(
                db,
                "consultas"
            ),

            where(
                "usuarioId",
                "==",
                user.uid
            )

        );


        const snapshot =
            await getDocs(q);


        if(snapshot.empty){

            listaConsultas.innerHTML =
                '<div class="sin-consultas">Todavía no tenés consultas.</div>';

            return;

        }


        const consultas = [];


        snapshot.forEach(doc => {

            consultas.push({

                id:doc.id,

                ...doc.data()

            });

        });


        consultas.sort(

            (a,b) => {

                const fechaA =
                    a.fechaCreacion?.toMillis?.() || 0;

                const fechaB =
                    b.fechaCreacion?.toMillis?.() || 0;

                return fechaB - fechaA;

            }

        );


        let html = "";


        consultas.forEach(consulta => {

            const estado =
                consulta.estado || "pendiente";


            html += `

                <div class="consulta">

                    <div class="consulta-top">

                        <div class="asunto">

                            ${escapar(
                                consulta.asunto ||
                                "Sin asunto"
                            )}

                        </div>

                        <div class="estado ${escapar(estado)}">

                            ${escapar(
                                estadoTexto(estado)
                            )}

                        </div>

                    </div>


                    <div class="info">

                        ${escapar(
                            consulta.categoria ||
                            "Sin categoría"
                        )}

                        ·

                        ${escapar(
                            fechaTexto(
                                consulta.fechaCreacion
                            )
                        )}

                    </div>


                    <div class="mensaje-consulta">

                        ${escapar(
                            consulta.mensaje ||
                            ""
                        )}

                    </div>


                    ${
                        consulta.ultimaRespuesta
                        ?
                        `

                        <div class="separador"></div>

                        <strong>
                        🤖 Respuesta de asistencia
                        </strong>

                        <div class="mensaje-consulta">

                        ${escapar(
                            consulta.ultimaRespuesta
                        )}

                        </div>

                        `
                        :
                        ""
                    }

                </div>

            `;

        });


        listaConsultas.innerHTML =
            html;


    }catch(error){

        console.error(
            "ERROR CARGANDO CONSULTAS:",
            error
        );


        listaConsultas.innerHTML = `

            <div class="sin-consultas">

                No se pudieron cargar las consultas.

            </div>

        `;

    }

}


/* ==========================================
   ENVIAR CONSULTA
========================================== */

formConsulta.addEventListener(
    "submit",
    async function(event){

        event.preventDefault();


        const user =
            auth.currentUser;


        if(!user){

            mostrarResultado(
                "No hay una sesión activa.",
                "error"
            );

            return;

        }


        const categoria =
            document
                .getElementById("categoria")
                .value
                .trim();


        const asunto =
            document
                .getElementById("asunto")
                .value
                .trim();


        const texto =
            document
                .getElementById("mensaje")
                .value
                .trim();


        if(
            !categoria ||
            !asunto ||
            !texto
        ){

            mostrarResultado(
                "Completá todos los campos.",
                "error"
            );

            return;

        }


        btnEnviar.disabled = true;

        btnEnviar.textContent =
            "Enviando...";


        try{

            /*
             * Buscamos empresaId del usuario
             * sin mostrarlo en pantalla.
             */

            let empresaId = "";


            try{

                const usuarioQuery = query(

                    collection(
                        db,
                        "usuarios"
                    ),

                    where(
                        "uid",
                        "==",
                        user.uid
                    )

                );


                const usuarioSnapshot =
                    await getDocs(
                        usuarioQuery
                    );


                if(!usuarioSnapshot.empty){

                    const datos =
                        usuarioSnapshot
                            .docs[0]
                            .data();


                    empresaId =
                        datos.empresaId ||
                        datos.idEmpresa ||
                        datos.empresa ||
                        "";

                }

            }catch(error){

                console.warn(
                    "No se pudo obtener empresaId:",
                    error
                );

            }


            await addDoc(

                collection(
                    db,
                    "consultas"
                ),

                {

                    usuarioId:
                        user.uid,

                    empresaId:
                        empresaId,

                    nombre:
                        user.displayName ||
                        "",

                    email:
                        user.email ||
                        "",

                    categoria:
                        categoria,

                    asunto:
                        asunto,

                    mensaje:
                        texto,

                    estado:
                        "pendiente",

                    prioridad:
                        "normal",

                    fechaCreacion:
                        serverTimestamp(),

                    fechaActualizacion:
                        serverTimestamp(),

                    ultimaRespuesta:
                        ""

                }

            );


            /*
             * LIMPIAMOS TODO EL FORMULARIO
             */

            formConsulta.reset();


            /*
             * OCULTAMOS EL MENSAJE
             * DESPUÉS DE ENVIAR.
             */

            ocultarResultado();


            /*
             * ACTUALIZAMOS EL HISTORIAL
             */

            await cargarConsultas(user);


        }catch(error){

            console.error(
                "ERROR ENVIANDO CONSULTA:",
                error
            );


            mostrarResultado(
                "No se pudo enviar la consulta.",
                "error"
            );

        }finally{

            btnEnviar.disabled = false;

            btnEnviar.textContent =
                "📩 Enviar consulta";

        }

    }
);


/* ==========================================
   AUTENTICACIÓN
========================================== */

onAuthStateChanged(
    auth,
    async function(user){

        if(!user){

            listaConsultas.innerHTML = `

                <div class="sin-consultas">

                    No hay una sesión activa de GESBASE.

                </div>

            `;

            return;

        }


        await cargarConsultas(user);

    }
);

</script>

</body>

</html>
