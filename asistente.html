<!DOCTYPE html>
<html lang="es-AR">

<head>

<meta charset="UTF-8">

<meta name="viewport" content="width=device-width, initial-scale=1.0">

<meta name="theme-color" content="#111827">

<title>Asistente GESBASE</title>

<style>

*{
    box-sizing:border-box;
    margin:0;
    padding:0;
}

body{
    font-family:Arial,Helvetica,sans-serif;
    background:#f3f4f6;
    color:#111827;
    min-height:100vh;
}

.header{
    background:#111827;
    color:white;
    padding:15px;
    display:flex;
    align-items:center;
    gap:12px;
}

.back{
    color:white;
    text-decoration:none;
    font-size:24px;
}

.logo{
    width:42px;
    height:42px;
    background:#2563eb;
    border-radius:12px;
    display:flex;
    align-items:center;
    justify-content:center;
    font-size:22px;
}

.header h1{
    font-size:19px;
}

.header p{
    font-size:12px;
    color:#cbd5e1;
}

.container{
    max-width:850px;
    margin:auto;
    padding:15px;
}

.card{
    background:white;
    border-radius:18px;
    padding:18px;
    margin-bottom:15px;
    box-shadow:0 2px 8px rgba(0,0,0,.06);
}

.card h2{
    font-size:20px;
    margin-bottom:8px;
}

.card p{
    color:#6b7280;
    font-size:14px;
    line-height:1.5;
}

.options-title{
    margin-top:18px;
    margin-bottom:10px;
    font-weight:bold;
}

.options{
    display:grid;
    grid-template-columns:1fr 1fr;
    gap:10px;
}

.option{
    border:1px solid #dbe2ea;
    background:#f8fafc;
    border-radius:14px;
    padding:14px;
    text-align:left;
    cursor:pointer;
}

.option-icon{
    font-size:23px;
    margin-bottom:6px;
}

.option-title{
    font-weight:bold;
    font-size:14px;
}

.option-text{
    font-size:11px;
    color:#6b7280;
    margin-top:4px;
}

.chat{
    max-height:50vh;
    overflow-y:auto;
    margin-bottom:10px;
}

.message{
    display:flex;
    margin-bottom:12px;
}

.user{
    justify-content:flex-end;
}

.bubble{
    max-width:90%;
    padding:12px 14px;
    border-radius:16px;
    font-size:14px;
    line-height:1.5;
    white-space:pre-wrap;
}

.assistant .bubble{
    background:white;
    border:1px solid #e5e7eb;
}

.user .bubble{
    background:#2563eb;
    color:white;
}

.error .bubble{
    background:#fee2e2;
    color:#991b1b;
}

.composer{
    position:sticky;
    bottom:0;
    padding:8px 0 15px;
    background:#f3f4f6;
}

.input{
    background:white;
    border:1px solid #d1d5db;
    border-radius:16px;
    padding:8px;
    display:flex;
    gap:8px;
}

textarea{
    flex:1;
    border:0;
    outline:none;
    resize:none;
    padding:10px;
    font-size:14px;
    min-height:44px;
}

.send{
    width:46px;
    height:46px;
    border:0;
    border-radius:12px;
    background:#2563eb;
    color:white;
    font-size:20px;
}

.status{
    text-align:center;
    font-size:11px;
    color:#6b7280;
    margin-top:7px;
}

@media(max-width:600px){

    .options{
        grid-template-columns:1fr;
    }

}

</style>

</head>


<body>


<header class="header">

<a href="index.html" class="back">←</a>

<div class="logo">🤖</div>

<div>

<h1>Asistente GESBASE</h1>

<p>Inteligencia artificial</p>

</div>

</header>


<main class="container">


<section class="card">

<h2>Hola 👋</h2>

<p>
Soy el asistente inteligente de GESBASE.
Elegí una opción o escribí tu consulta.
</p>


<div class="options-title">
¿Qué querés hacer?
</div>


<div class="options">


<button
class="option"
data-question="Quiero analizar un presupuesto."
>

<div class="option-icon">📊</div>

<div class="option-title">
Analizar presupuesto
</div>

<div class="option-text">
Revisar costos y margen.
</div>

</button>


<button
class="option"
data-question="Quiero analizar un trabajo."
>

<div class="option-icon">🔧</div>

<div class="option-title">
Analizar trabajo
</div>

<div class="option-text">
Revisar resultado.
</div>

</button>


<button
class="option"
data-question="Quiero analizar mis gastos."
>

<div class="option-icon">💸</div>

<div class="option-title">
Analizar gastos
</div>

<div class="option-text">
Controlar costos.
</div>

</button>


<button
class="option"
data-question="Quiero analizar mis cobros."
>

<div class="option-icon">🧾</div>

<div class="option-title">
Analizar cobros
</div>

<div class="option-text">
Cobrado y pendiente.
</div>

</button>


<button
class="option"
data-question="Quiero analizar la rentabilidad."
>

<div class="option-icon">💰</div>

<div class="option-title">
Rentabilidad
</div>

<div class="option-text">
Resultado y margen.
</div>

</button>


<button
class="option"
data-question="Quiero un resumen de mi empresa."
>

<div class="option-icon">📈</div>

<div class="option-title">
Resumen empresa
</div>

<div class="option-text">
Situación general.
</div>

</button>


<button
class="option"
data-question="Quiero consultar empleados y fichajes."
>

<div class="option-icon">👥</div>

<div class="option-title">
Empleados
</div>

<div class="option-text">
Empleados y fichajes.
</div>

</button>


<button
class="option"
data-question=""
>

<div class="option-icon">💬</div>

<div class="option-title">
Pregunta libre
</div>

<div class="option-text">
Escribí tu consulta.
</div>

</button>


</div>

</section>


<section
id="chat"
class="chat"
>

<div class="message assistant">

<div class="bubble">

🤖 Hola. Soy el asistente de GESBASE.

Inicializando...

</div>

</div>

</section>


<section class="composer">

<div class="input">

<textarea
id="message"
placeholder="Escribí tu consulta..."
></textarea>

<button
id="send"
class="send"
>
➤
</button>

</div>

<div
id="status"
class="status"
>
Iniciando...
</div>

</section>


</main>


<script type="module">


/*
==================================================
FIREBASE CONFIG
==================================================
*/

const firebaseConfig = {

    apiKey:
    "AIzaSyDDCQ7WhS9Gy8DwQGZ01VaFTmSgV2rjs9o",

    authDomain:
    "gesbase-4bf94.firebaseapp.com",

    projectId:
    "gesbase-4bf94",

    storageBucket:
    "gesbase-4bf94.firebasestorage.app",

    messagingSenderId:
    "64959778874",

    appId:
    "1:64959778874:web:c3bc129c3cee8cb77d6503",

    measurementId:
    "G-CCKGSRVGEX"

};


/*
==================================================
IMPORTACIONES
==================================================
*/

import {
    initializeApp
}
from
"https://www.gstatic.com/firebasejs/12.18.0/firebase-app.js";


import {
    initializeAppCheck,
    ReCaptchaEnterpriseProvider
}
from
"https://www.gstatic.com/firebasejs/12.18.0/firebase-app-check.js";


import {
    getAI,
    getGenerativeModel,
    GoogleAIBackend
}
from
"https://www.gstatic.com/firebasejs/12.18.0/firebase-ai.js";


/*
==================================================
ELEMENTOS
==================================================
*/

const status =
document.getElementById("status");

const chat =
document.getElementById("chat");

const message =
document.getElementById("message");

const send =
document.getElementById("send");


/*
==================================================
RECAPTCHA
==================================================
*/

const RECAPTCHA_SITE_KEY =
"6LdysqEtAAAAAPPRcPrtI97fIaSbZ6UXclDtVBhJ";


let model = null;


/*
==================================================
MENSAJES
==================================================
*/

function showMessage(
    text,
    type
){

    const row =
    document.createElement("div");

    row.className =
    "message " + type;


    const bubble =
    document.createElement("div");

    bubble.className =
    "bubble";


    bubble.textContent =
    text;


    row.appendChild(
    bubble
    );


    chat.appendChild(
    row
    );


    chat.scrollTop =
    chat.scrollHeight;

}


/*
==================================================
INICIAR
==================================================
*/

async function iniciar(){

    try{

        status.textContent =
        "1/4 Iniciando Firebase...";


        /*
        ==========================================
        FIREBASE
        ==========================================
        */

        const app =
        initializeApp(
            firebaseConfig
        );


        status.textContent =
        "2/4 Firebase iniciado. Activando reCAPTCHA...";


        /*
        ==========================================
        APP CHECK
        ==========================================
        */

        initializeAppCheck(
            app,
            {
                provider:
                new ReCaptchaEnterpriseProvider(
                    RECAPTCHA_SITE_KEY
                ),

                isTokenAutoRefreshEnabled:
                true
            }
        );


        status.textContent =
        "3/4 Conectando Firebase AI Logic...";


        /*
        ==========================================
        AI LOGIC
        ==========================================
        */

        const ai =
        getAI(
            app,
            {
                backend:
                new GoogleAIBackend()
            }
        );


        model =
        getGenerativeModel(
            ai,
            {
                model:
                "gemini-3.7-flash"
            }
        );


        status.textContent =
        "4/4 Gemini conectado";


        showMessage(
            "✅ Gemini está conectado.\n\nEscribí Hola para probarlo.",
            "assistant"
        );


    }catch(error){

        console.error(error);


        status.textContent =
        "❌ Error";


        showMessage(
            "❌ ERROR:\n\n" +
            error.message,
            "error"
        );

    }

}


/*
==================================================
ENVIAR
==================================================
*/

async function enviar(){

    const text =
    message.value.trim();


    if(!text){

        return;

    }


    showMessage(
        text,
        "user"
    );


    message.value =
    "";


    try{

        if(!model){

            throw new Error(
                "Gemini todavía no está conectado."
            );

        }


        status.textContent =
        "Consultando Gemini...";


        const result =
        await model.generateContent(
            text
        );


        showMessage(
            result.response.text(),
            "assistant"
        );


        status.textContent =
        "GESBASE IA · Gemini";


    }catch(error){

        console.error(error);


        showMessage(
            "❌ Error al consultar Gemini:\n\n" +
            error.message,
            "error"
        );


        status.textContent =
        "Error";

    }

}


/*
==================================================
BOTÓN
==================================================
*/

send.addEventListener(
    "click",
    enviar
);


/*
==================================================
ENTER
==================================================
*/

message.addEventListener(
    "keydown",
    function(event){

        if(
            event.key === "Enter" &&
            !event.shiftKey
        ){

            event.preventDefault();

            enviar();

        }

    }
);


/*
==================================================
OPCIONES
==================================================
*/

document
.querySelectorAll(".option")
.forEach(
    function(button){

        button.addEventListener(
            "click",
            function(){

                const question =
                this.dataset.question;


                if(!question){

                    message.focus();

                    return;

                }


                message.value =
                question;


                enviar();

            }
        );

    }
);


/*
==================================================
INICIAR
==================================================
*/

iniciar();


</script>

</body>

</html>
