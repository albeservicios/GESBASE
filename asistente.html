<!DOCTYPE html>
<html lang="es-AR">

<head>

<meta charset="UTF-8">

<meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
>

<meta
    name="theme-color"
    content="#111827"
>

<title>Asistente IA - GESBASE</title>

<style>

*{
    box-sizing:border-box;
    margin:0;
    padding:0;
}

body{
    font-family:Arial,Helvetica,sans-serif;
    background:#f3f4f6;
    color:#111827;
    min-height:100vh;
}

header{
    background:#111827;
    color:white;
    padding:18px 16px;
    position:sticky;
    top:0;
    z-index:10;
}

.header-inner{
    max-width:900px;
    margin:auto;
    display:flex;
    align-items:center;
    gap:12px;
}

.logo{
    width:42px;
    height:42px;
    border-radius:12px;
    background:#2563eb;
    display:flex;
    align-items:center;
    justify-content:center;
    font-size:22px;
}

.header-title{
    font-size:19px;
    font-weight:bold;
}

.header-subtitle{
    font-size:12px;
    opacity:.75;
    margin-top:3px;
}

main{
    width:100%;
    max-width:900px;
    margin:auto;
    padding:20px 14px 120px;
}

.presentacion{
    background:white;
    border-radius:18px;
    padding:22px;
    box-shadow:0 4px 18px rgba(0,0,0,.06);
    margin-bottom:18px;
}

.presentacion h1{
    font-size:22px;
    margin-bottom:8px;
}

.presentacion p{
    color:#6b7280;
    line-height:1.5;
}

.sugerencias{
    display:flex;
    flex-wrap:wrap;
    gap:8px;
    margin-top:16px;
}

.sugerencia{
    border:1px solid #d1d5db;
    background:#fff;
    border-radius:20px;
    padding:9px 13px;
    cursor:pointer;
    font-size:13px;
}

.sugerencia:hover{
    background:#f3f4f6;
}

#chat{
    display:flex;
    flex-direction:column;
    gap:12px;
}

.mensaje{
    max-width:88%;
    padding:13px 15px;
    border-radius:16px;
    line-height:1.5;
    white-space:pre-wrap;
    word-break:break-word;
}

.usuario{
    align-self:flex-end;
    background:#2563eb;
    color:white;
    border-bottom-right-radius:5px;
}

.ia{
    align-self:flex-start;
    background:white;
    color:#111827;
    border:1px solid #e5e7eb;
    border-bottom-left-radius:5px;
    box-shadow:0 2px 8px rgba(0,0,0,.04);
}

.cargando{
    display:flex;
    align-items:center;
    gap:8px;
}

.punto{
    width:7px;
    height:7px;
    background:#9ca3af;
    border-radius:50%;
    animation:subir .8s infinite alternate;
}

.punto:nth-child(2){
    animation-delay:.2s;
}

.punto:nth-child(3){
    animation-delay:.4s;
}

@keyframes subir{
    from{
        transform:translateY(0);
        opacity:.4;
    }
    to{
        transform:translateY(-5px);
        opacity:1;
    }
}

.barra{
    position:fixed;
    bottom:0;
    left:0;
    right:0;
    background:white;
    border-top:1px solid #e5e7eb;
    padding:10px;
    z-index:20;
}

.formulario{
    max-width:900px;
    margin:auto;
    display:flex;
    gap:8px;
}

#mensaje{
    flex:1;
    min-height:48px;
    max-height:140px;
    resize:none;
    border:1px solid #d1d5db;
    border-radius:14px;
    padding:13px;
    font-family:inherit;
    font-size:15px;
    outline:none;
}

#mensaje:focus{
    border-color:#2563eb;
}

#btnEnviar{
    width:52px;
    border:0;
    border-radius:14px;
    background:#2563eb;
    color:white;
    font-size:20px;
    cursor:pointer;
}

#btnEnviar:disabled{
    opacity:.5;
    cursor:not-allowed;
}

.error{
    background:#fee2e2;
    color:#991b1b;
    border:1px solid #fecaca;
}

@media(max-width:600px){

    main{
        padding:14px 10px 115px;
    }

    .presentacion{
        padding:18px;
    }

    .mensaje{
        max-width:94%;
    }

}

</style>

</head>

<body>

<header>

    <div class="header-inner">

        <div class="logo">
            🤖
        </div>

        <div>

            <div class="header-title">
                Asistente GESBASE
            </div>

            <div class="header-subtitle">
                Tu asistente inteligente de gestión
            </div>

        </div>

    </div>

</header>


<main>

    <section class="presentacion">

        <h1>
            ¿En qué puedo ayudarte?
        </h1>

        <p>
            Consultá la información de tu empresa,
            clientes, presupuestos, trabajos, empleados,
            cobros, facturas, gastos, productos, ventas
            y demás información disponible en GESBASE.
        </p>

        <div class="sugerencias">

            <button
                class="sugerencia"
                data-pregunta="¿Qué clientes tengo?"
            >
                👥 Mis clientes
            </button>

            <button
                class="sugerencia"
                data-pregunta="¿Cuánto tengo pendiente de cobrar?"
            >
                💰 Cobros pendientes
            </button>

            <button
                class="sugerencia"
                data-pregunta="¿Qué facturas tengo pendientes?"
            >
                🧾 Facturas
            </button>

            <button
                class="sugerencia"
                data-pregunta="¿Qué trabajos tengo actualmente?"
            >
                🔧 Trabajos
            </button>

            <button
                class="sugerencia"
                data-pregunta="¿Qué productos tengo con stock bajo?"
            >
                📦 Stock
            </button>

            <button
                class="sugerencia"
                data-pregunta="¿Cuánto vendí?"
            >
                🛒 Ventas
            </button>

        </div>

    </section>


    <section id="chat"></section>

</main>


<div class="barra">

    <form
        id="formulario"
        class="formulario"
    >

        <textarea
            id="mensaje"
            placeholder="Escribí tu pregunta..."
            autocomplete="off"
            required
        ></textarea>

        <button
            id="btnEnviar"
            type="submit"
            aria-label="Enviar"
        >
            ➤
        </button>

    </form>

</div>


<script type="module">

/* =====================================================
   FIREBASE AUTH
===================================================== */

import {
    auth
} from "./firebase.js";

import {
    onAuthStateChanged
} from "https://www.gstatic.com/firebasejs/12.18.0/firebase-auth.js";


/* =====================================================
   GEMINI
===================================================== */

import {
    preguntarGemini
} from "./gemini.js";


/* =====================================================
   ELEMENTOS
===================================================== */

const formulario =
    document.getElementById("formulario");

const mensajeInput =
    document.getElementById("mensaje");

const btnEnviar =
    document.getElementById("btnEnviar");

const chat =
    document.getElementById("chat");


/* =====================================================
   USUARIO
===================================================== */

let usuarioActual = null;


/* =====================================================
   AGREGAR MENSAJE
===================================================== */

function agregarMensaje(
    texto,
    tipo
){

    const div =
        document.createElement("div");

    div.className =
        "mensaje " + tipo;

    div.textContent =
        texto;

    chat.appendChild(div);

    window.scrollTo({
        top: document.body.scrollHeight,
        behavior: "smooth"
    });

    return div;

}


/* =====================================================
   CARGANDO
===================================================== */

function mostrarCargando(){

    const div =
        document.createElement("div");

    div.className =
        "mensaje ia";

    div.innerHTML = `

        <div class="cargando">

            <span>Pensando</span>

            <span class="punto"></span>
            <span class="punto"></span>
            <span class="punto"></span>

        </div>

    `;

    chat.appendChild(div);

    window.scrollTo({
        top: document.body.scrollHeight,
        behavior: "smooth"
    });

    return div;

}


/* =====================================================
   ENVIAR PREGUNTA A GEMINI
===================================================== */

async function enviarPregunta(pregunta){

    if(!usuarioActual){

        agregarMensaje(
            "Tu sesión todavía no está disponible. Volvé a iniciar sesión.",
            "ia"
        );

        return;

    }


    pregunta =
        String(pregunta || "").trim();


    if(!pregunta){

        return;

    }


    /* Mostrar pregunta */

    agregarMensaje(
        pregunta,
        "usuario"
    );


    /* Limpiar campo */

    mensajeInput.value = "";


    /* Desactivar botón */

    btnEnviar.disabled = true;


    /* Mostrar cargando */

    const cargando =
        mostrarCargando();


    try{

        /*
         * La conexión con Firebase y Gemini
         * se realiza desde gemini.js.
         */

        const respuesta =
            await preguntarGemini(
                pregunta
            );


        /* Quitar "Pensando..." */

        cargando.remove();


        /* Mostrar respuesta */

        agregarMensaje(
            respuesta ||
            "No recibí una respuesta de la inteligencia artificial.",
            "ia"
        );


    }catch(error){

        console.error(
            "ERROR GESBASE IA:",
            error
        );


        cargando.remove();


        let mensajeError =
            "No pude procesar la consulta.";


        if(error?.message){

            mensajeError +=
                "\n\n" +
                error.message;

        }


        agregarMensaje(
            mensajeError,
            "ia error"
        );


    }finally{

        btnEnviar.disabled =
            false;

        mensajeInput.focus();

    }

}


/* =====================================================
   FORMULARIO
===================================================== */

formulario.addEventListener(
    "submit",
    function(event){

        event.preventDefault();

        enviarPregunta(
            mensajeInput.value
        );

    }
);


/* =====================================================
   ENTER PARA ENVIAR
===================================================== */

mensajeInput.addEventListener(
    "keydown",
    function(event){

        if(
            event.key === "Enter" &&
            !event.shiftKey
        ){

            event.preventDefault();

            formulario.requestSubmit();

        }

    }
);


/* =====================================================
   SUGERENCIAS
===================================================== */

document
    .querySelectorAll(".sugerencia")
    .forEach(button => {

        button.addEventListener(
            "click",
            function(){

                enviarPregunta(
                    this.dataset.pregunta
                );

            }
        );

    });


/* =====================================================
   AUTENTICACIÓN FIREBASE
===================================================== */

onAuthStateChanged(
    auth,
    function(user){

        usuarioActual =
            user || null;


        if(!user){

            btnEnviar.disabled =
                true;

            mensajeInput.disabled =
                true;

            mensajeInput.placeholder =
                "Iniciá sesión para usar el asistente.";

            agregarMensaje(
                "Necesitás iniciar sesión en GESBASE para utilizar el asistente.",
                "ia"
            );

            return;

        }


        btnEnviar.disabled =
            false;

        mensajeInput.disabled =
            false;

        mensajeInput.placeholder =
            "Escribí tu pregunta...";

    }
);

</script>

</body>

</html>
