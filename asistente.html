<!DOCTYPE html>
<html lang="es-AR">

<head>

<meta charset="UTF-8">

<meta name="viewport" content="width=device-width, initial-scale=1.0">

<meta name="theme-color" content="#111827">

<title>Asistente GESBASE</title>

<style>

*{
    box-sizing:border-box;
    margin:0;
    padding:0;
}

body{
    font-family:Arial,Helvetica,sans-serif;
    background:#f3f4f6;
    color:#111827;
    min-height:100vh;
}

.header{
    background:#111827;
    color:white;
    padding:15px;
    display:flex;
    align-items:center;
    gap:12px;
}

.back{
    color:white;
    text-decoration:none;
    font-size:24px;
}

.logo{
    width:42px;
    height:42px;
    border-radius:12px;
    background:#2563eb;
    display:flex;
    align-items:center;
    justify-content:center;
    font-size:22px;
}

.header h1{
    font-size:19px;
}

.header p{
    font-size:12px;
    color:#cbd5e1;
}

.container{
    max-width:850px;
    margin:auto;
    padding:15px;
}

.card{
    background:white;
    border-radius:18px;
    padding:18px;
    margin-bottom:15px;
    box-shadow:0 2px 8px rgba(0,0,0,.06);
}

.card h2{
    font-size:20px;
    margin-bottom:8px;
}

.card p{
    color:#6b7280;
    font-size:14px;
    line-height:1.5;
}

.options-title{
    margin-top:18px;
    margin-bottom:10px;
    font-weight:bold;
}

.options{
    display:grid;
    grid-template-columns:1fr 1fr;
    gap:10px;
}

.option{
    border:1px solid #dbe2ea;
    background:#f8fafc;
    border-radius:14px;
    padding:14px;
    text-align:left;
    cursor:pointer;
}

.option:active{
    transform:scale(.98);
}

.option-icon{
    font-size:23px;
    margin-bottom:6px;
}

.option-title{
    font-weight:bold;
    font-size:14px;
}

.option-text{
    font-size:11px;
    color:#6b7280;
    margin-top:4px;
}

.chat{
    max-height:50vh;
    overflow-y:auto;
    margin-bottom:10px;
}

.message{
    display:flex;
    margin-bottom:12px;
}

.user{
    justify-content:flex-end;
}

.bubble{
    max-width:90%;
    padding:12px 14px;
    border-radius:16px;
    font-size:14px;
    line-height:1.5;
    white-space:pre-wrap;
}

.assistant .bubble{
    background:white;
    border:1px solid #e5e7eb;
}

.user .bubble{
    background:#2563eb;
    color:white;
}

.error .bubble{
    background:#fee2e2;
    color:#991b1b;
    border:1px solid #fecaca;
}

.loading .bubble{
    background:white;
    border:1px solid #e5e7eb;
}

.composer{
    position:sticky;
    bottom:0;
    background:#f3f4f6;
    padding:8px 0 15px;
}

.input{
    background:white;
    border:1px solid #d1d5db;
    border-radius:16px;
    padding:8px;
    display:flex;
    gap:8px;
    align-items:flex-end;
}

textarea{
    flex:1;
    border:0;
    outline:none;
    resize:none;
    padding:10px;
    font-family:Arial,Helvetica,sans-serif;
    font-size:14px;
    min-height:44px;
    max-height:120px;
}

.send{
    width:46px;
    height:46px;
    border:0;
    border-radius:12px;
    background:#2563eb;
    color:white;
    font-size:20px;
    cursor:pointer;
}

.send:disabled{
    opacity:.5;
}

.status{
    text-align:center;
    font-size:11px;
    color:#6b7280;
    margin-top:7px;
}

.company-info{
    background:#eff6ff;
    border:1px solid #dbeafe;
    border-radius:12px;
    padding:10px;
    margin-top:12px;
    font-size:12px;
    color:#1e40af;
}

@media(max-width:600px){

    .options{
        grid-template-columns:1fr;
    }

}

</style>

</head>


<body>


<header class="header">

<a href="index.html" class="back">
←
</a>

<div class="logo">
🤖
</div>

<div>

<h1>Asistente GESBASE</h1>

<p>Inteligencia artificial</p>

</div>

</header>


<main class="container">


<section class="card">

<h2>
Asistente inteligente 🤖
</h2>

<p>
Consultá información de tu empresa y pedile a GESBASE
que la analice.
</p>

<div
id="companyInfo"
class="company-info"
>
Identificando empresa...
</div>


<div class="options-title">
Consultas rápidas
</div>


<div class="options">


<button
class="option"
data-question="¿Qué clientes tengo?"
>

<div class="option-icon">
👥
</div>

<div class="option-title">
Mis clientes
</div>

<div class="option-text">
Consultar clientes registrados.
</div>

</button>


<button
class="option"
data-question="¿Cuántos clientes tengo?"
>

<div class="option-icon">
🔢
</div>

<div class="option-title">
Cantidad de clientes
</div>

<div class="option-text">
Contar clientes de mi empresa.
</div>

</button>


<button
class="option"
data-question="Mostrame los clientes de mi empresa."
>

<div class="option-icon">
📋
</div>

<div class="option-title">
Lista de clientes
</div>

<div class="option-text">
Ver nombres y localidades.
</div>

</button>


<button
class="option"
data-question="¿Qué clientes tengo en cada provincia?"
>

<div class="option-icon">
📍
</div>

<div class="option-title">
Clientes por provincia
</div>

<div class="option-text">
Agrupar clientes por provincia.
</div>

</button>


</div>

</section>


<section
id="chat"
class="chat"
>

<div class="message assistant">

<div class="bubble">

🤖 Hola. Soy el asistente de GESBASE.

Inicializando Gemini y verificando tu empresa...

</div>

</div>

</section>


<section class="composer">

<div class="input">

<textarea
id="message"
placeholder="Ej.: ¿Qué clientes tengo?"
></textarea>

<button
id="send"
class="send"
type="button"
>
➤
</button>

</div>

<div
id="status"
class="status"
>
Inicializando...
</div>

</section>


</main>


<script type="module">


/*
==================================================
IMPORTACIONES FIREBASE
==================================================
*/

import {
    initializeApp
}
from
"https://www.gstatic.com/firebasejs/12.18.0/firebase-app.js";


import {
    getAuth,
    onAuthStateChanged
}
from
"https://www.gstatic.com/firebasejs/12.18.0/firebase-auth.js";


import {
    getFirestore,
    doc,
    getDoc,
    collection,
    query,
    where,
    getDocs
}
from
"https://www.gstatic.com/firebasejs/12.18.0/firebase-firestore.js";


import {
    initializeAppCheck,
    ReCaptchaEnterpriseProvider
}
from
"https://www.gstatic.com/firebasejs/12.18.0/firebase-app-check.js";


import {
    getAI,
    getGenerativeModel,
    GoogleAIBackend
}
from
"https://www.gstatic.com/firebasejs/12.18.0/firebase-ai.js";


/*
==================================================
CONFIGURACIÓN
==================================================
*/

const firebaseConfig = {

    apiKey:
    "AIzaSyDDCQ7WhS9Gy8DwQGZ01VaFTmSgV2rjs9o",

    authDomain:
    "gesbase-4bf94.firebaseapp.com",

    projectId:
    "gesbase-4bf94",

    storageBucket:
    "gesbase-4bf94.firebasestorage.app",

    messagingSenderId:
    "64959778874",

    appId:
    "1:64959778874:web:c3bc129c3cee8cb77d6503",

    measurementId:
    "G-CCKGSRVGEX"

};


/*
==================================================
RECAPTCHA ENTERPRISE
==================================================
*/

const RECAPTCHA_SITE_KEY =
"6LdysqEtAAAAAPPRcPrtI97fIaSbZ6UXclDtVBhJ";


/*
==================================================
FIREBASE
==================================================
*/

const app =
initializeApp(
    firebaseConfig
);


const auth =
getAuth(
    app
);


const db =
getFirestore(
    app
);


/*
==================================================
APP CHECK
==================================================
*/

initializeAppCheck(
    app,
    {
        provider:
        new ReCaptchaEnterpriseProvider(
            RECAPTCHA_SITE_KEY
        ),

        isTokenAutoRefreshEnabled:
        true
    }
);


/*
==================================================
GEMINI
==================================================
*/

const ai =
getAI(
    app,
    {
        backend:
        new GoogleAIBackend()
    }
);


const model =
getGenerativeModel(
    ai,
    {
        model:
        "gemini-3.6-flash",

        systemInstruction: `
Sos el asistente inteligente de GESBASE.

Respondé siempre en español.

Tu función es analizar exclusivamente los datos
que GESBASE te entregue en cada consulta.

No inventes datos.

No supongas información que no haya sido enviada.

Si los datos no alcanzan para responder,
decilo claramente.

No afirmes que consultaste Firestore directamente.

Los datos que recibas pertenecen a la empresa
del usuario autenticado.

Podés ayudar a analizar clientes, presupuestos,
trabajos, gastos, cobros, facturas, empleados,
fichajes y rentabilidad cuando esos datos sean
proporcionados por GESBASE.

Sé claro, profesional y práctico.
`
    }
);


/*
==================================================
ELEMENTOS
==================================================
*/

const chat =
document.getElementById(
    "chat"
);


const message =
document.getElementById(
    "message"
);


const send =
document.getElementById(
    "send"
);


const status =
document.getElementById(
    "status"
);


const companyInfo =
document.getElementById(
    "companyInfo"
);


/*
==================================================
DATOS DE SESIÓN
==================================================
*/

let usuarioActual = null;

let empresaIdActual = null;

let clientesEmpresa = [];


/*
==================================================
MOSTRAR MENSAJE
==================================================
*/

function mostrarMensaje(
    texto,
    tipo
){

    const fila =
    document.createElement(
        "div"
    );

    fila.className =
    "message " + tipo;


    const burbuja =
    document.createElement(
        "div"
    );

    burbuja.className =
    "bubble";


    burbuja.textContent =
    texto;


    fila.appendChild(
        burbuja
    );


    chat.appendChild(
        fila
    );


    chat.scrollTop =
    chat.scrollHeight;

}


/*
==================================================
CARGANDO
==================================================
*/

function mostrarCargando(){

    const fila =
    document.createElement(
        "div"
    );

    fila.id =
    "loadingMessage";

    fila.className =
    "message loading";


    const burbuja =
    document.createElement(
        "div"
    );

    burbuja.className =
    "bubble";

    burbuja.textContent =
    "🤖 Consultando los datos de GESBASE...";


    fila.appendChild(
        burbuja
    );


    chat.appendChild(
        fila
    );


    chat.scrollTop =
    chat.scrollHeight;

}


function quitarCargando(){

    const elemento =
    document.getElementById(
        "loadingMessage"
    );


    if(elemento){

        elemento.remove();

    }

}


/*
==================================================
OBTENER EMPRESA DEL USUARIO
==================================================
*/

async function cargarEmpresa(){

    const user =
    auth.currentUser;


    if(!user){

        throw new Error(
            "No hay un usuario autenticado. Iniciá sesión en GESBASE."
        );

    }


    usuarioActual =
    user;


    const usuarioRef =
    doc(
        db,
        "usuarios",
        user.uid
    );


    const usuarioSnap =
    await getDoc(
        usuarioRef
    );


    if(!usuarioSnap.exists()){

        throw new Error(
            "No existe el perfil del usuario en la colección usuarios."
        );

    }


    const datosUsuario =
    usuarioSnap.data();


    const empresaId =
    datosUsuario.empresaId;


    if(
        !empresaId ||
        typeof empresaId !== "string" ||
        !empresaId.trim()
    ){

        throw new Error(
            "El usuario no tiene un empresaId válido."
        );

    }


    empresaIdActual =
    empresaId.trim();


    companyInfo.textContent =
    "🏢 Empresa identificada correctamente.";


    /*
    ==============================================
    CARGAR CLIENTES DE LA EMPRESA
    ==============================================
    */

    const clientesRef =
    collection(
        db,
        "clientes"
    );


    const clientesQuery =
    query(
        clientesRef,
        where(
            "empresaId",
            "==",
            empresaIdActual
        )
    );


    const snapshot =
    await getDocs(
        clientesQuery
    );


    clientesEmpresa =
    [];


    snapshot.forEach(
        function(docSnap){

            const datos =
            docSnap.data();


            clientesEmpresa.push({

                id:
                docSnap.id,

                nombre:
                datos.nombre || "",

                cuit:
                datos.cuit || "",

                direccion:
                datos.direccion || "",

                email:
                datos.email || "",

                localidad:
                datos.localidad || "",

                provincia:
                datos.provincia || "",

                telefono:
                datos.telefono || "",

                observaciones:
                datos.observaciones || ""

            });

        }
    );


    companyInfo.textContent =
    "🏢 Empresa identificada · " +
    clientesEmpresa.length +
    " cliente(s) disponible(s).";


    status.textContent =
    "4/4 Gemini conectado · Datos de empresa listos";


}


/*
==================================================
PREPARAR DATOS PARA GEMINI
==================================================
*/

function prepararDatosClientes(){

    return clientesEmpresa.map(
        function(cliente){

            return {

                nombre:
                cliente.nombre,

                cuit:
                cliente.cuit,

                localidad:
                cliente.localidad,

                provincia:
                cliente.provincia,

                telefono:
                cliente.telefono,

                email:
                cliente.email,

                direccion:
                cliente.direccion,

                observaciones:
                cliente.observaciones

            };

        }
    );

}


/*
==================================================
CONSULTAR GEMINI
==================================================
*/

async function enviar(){

    const texto =
    message.value.trim();


    if(!texto){

        message.focus();

        return;

    }


    mostrarMensaje(
        texto,
        "user"
    );


    message.value =
    "";


    send.disabled =
    true;


    status.textContent =
    "Consultando Gemini...";


    mostrarCargando();


    try{

        if(!usuarioActual){

            throw new Error(
                "No hay sesión de usuario activa."
            );

        }


        if(!empresaIdActual){

            throw new Error(
                "No se pudo identificar la empresa."
            );

        }


        const datosClientes =
        prepararDatosClientes();


        /*
        ==========================================
        CONTEXTO ENVIADO A GEMINI
        ==========================================
        */

        const contexto = {

            empresaId:
            empresaIdActual,

            cantidadClientes:
            datosClientes.length,

            clientes:
            datosClientes

        };


        const prompt = `

CONSULTA DEL USUARIO:

${texto}


DATOS DISPONIBLES DE GESBASE:

${JSON.stringify(
    contexto,
    null,
    2
)}


INSTRUCCIONES:

Respondé la consulta utilizando únicamente
los datos proporcionados arriba.

No inventes información.

Si preguntan cuántos clientes hay,
utilizá cantidadClientes.

Si preguntan por clientes, utilizá la lista
clientes.

No muestres el empresaId al usuario.

Respondé en español.

`;


        console.log(
            "Enviando consulta con datos de empresa."
        );


        const resultado =
        await model.generateContent(
            prompt
        );


        const respuesta =
        resultado.response.text();


        quitarCargando();


        if(!respuesta){

            throw new Error(
                "Gemini devolvió una respuesta vacía."
            );

        }


        mostrarMensaje(
            respuesta,
            "assistant"
        );


        status.textContent =
        "GESBASE IA · Gemini 3.6";


    }catch(error){

        console.error(
            "ERROR CONSULTANDO GEMINI:",
            error
        );


        quitarCargando();


        mostrarMensaje(
            "❌ Error al consultar Gemini:\n\n" +
            error.message,
            "error"
        );


        status.textContent =
        "❌ Error";


    }finally{

        send.disabled =
        false;

        message.focus();

    }

}


/*
==================================================
AUTENTICACIÓN
==================================================
*/

onAuthStateChanged(
    auth,
    async function(user){

        if(!user){

            companyInfo.textContent =
            "⚠️ No hay una sesión iniciada.";

            status.textContent =
            "Debés iniciar sesión en GESBASE.";

            mostrarMensaje(
                "⚠️ No hay un usuario autenticado.\n\nIniciá sesión en GESBASE y luego abrí nuevamente el asistente.",
                "error"
            );

            send.disabled =
            true;

            return;

        }


        try{

            status.textContent =
            "1/4 Usuario autenticado...";


            await cargarEmpresa();


            mostrarMensaje(
                "✅ Gemini está conectado.\n\n🏢 Empresa identificada.\n👥 Clientes cargados.\n\nProbá preguntando: “¿Qué clientes tengo?”",
                "assistant"
            );


        }catch(error){

            console.error(
                "ERROR CARGANDO EMPRESA:",
                error
            );


            companyInfo.textContent =
            "❌ No se pudieron cargar los datos de la empresa.";


            status.textContent =
            "❌ Error de datos";


            mostrarMensaje(
                "❌ No pude cargar los datos de tu empresa:\n\n" +
                error.message,
                "error"
            );


            send.disabled =
            true;

        }

    }
);


/*
==================================================
BOTÓN ENVIAR
==================================================
*/

send.addEventListener(
    "click",
    enviar
);


/*
==================================================
ENTER
==================================================
*/

message.addEventListener(
    "keydown",
    function(event){

        if(
            event.key === "Enter" &&
            !event.shiftKey
        ){

            event.preventDefault();

            enviar();

        }

    }
);


/*
==================================================
BOTONES RÁPIDOS
==================================================
*/

document
.querySelectorAll(".option")
.forEach(
    function(boton){

        boton.addEventListener(
            "click",
            function(){

                const pregunta =
                this.dataset.question;


                message.value =
                pregunta;


                enviar();

            }
        );

    }
);


</script>

</body>

</html>
