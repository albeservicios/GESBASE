<!DOCTYPE html>
<html lang="es-AR">

<head>

<meta charset="UTF-8">

<meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
>

<meta
    name="theme-color"
    content="#111827"
>

<meta
    name="description"
    content="Asistente inteligente de GESBASE"
>

<title>Asistente GESBASE</title>

<style>

*{
    box-sizing:border-box;
    margin:0;
    padding:0;
}

body{
    font-family:Arial,Helvetica,sans-serif;
    background:#f3f4f6;
    color:#111827;
    min-height:100vh;
}

header{
    background:#111827;
    color:white;
    padding:16px;
    display:flex;
    align-items:center;
    gap:12px;
}

.back{
    color:white;
    text-decoration:none;
    font-size:25px;
    width:35px;
}

.logo{
    width:44px;
    height:44px;
    border-radius:12px;
    background:#2563eb;
    display:flex;
    align-items:center;
    justify-content:center;
    font-size:24px;
}

.header-text h1{
    font-size:19px;
}

.header-text p{
    font-size:12px;
    color:#cbd5e1;
    margin-top:3px;
}

.container{
    max-width:900px;
    margin:auto;
    padding:16px;
}

.intro{
    background:white;
    border-radius:16px;
    padding:18px;
    margin-bottom:16px;
    box-shadow:0 2px 8px rgba(0,0,0,.06);
}

.intro h2{
    font-size:18px;
    margin-bottom:7px;
}

.intro p{
    color:#64748b;
    font-size:14px;
    line-height:1.5;
}

.options{
    display:grid;
    grid-template-columns:repeat(2,1fr);
    gap:10px;
    margin-top:16px;
}

.option{
    border:1px solid #e5e7eb;
    background:#f8fafc;
    border-radius:12px;
    padding:13px;
    cursor:pointer;
    text-align:left;
    font-family:inherit;
}

.option:hover{
    background:#eff6ff;
    border-color:#93c5fd;
}

.option strong{
    display:block;
    font-size:14px;
    margin-bottom:4px;
}

.option span{
    display:block;
    font-size:12px;
    color:#64748b;
}

.chat{
    background:white;
    border-radius:16px;
    padding:16px;
    min-height:300px;
    box-shadow:0 2px 8px rgba(0,0,0,.06);
    overflow-y:auto;
}

.message{
    padding:13px 15px;
    border-radius:14px;
    margin-bottom:12px;
    white-space:pre-wrap;
    line-height:1.5;
    font-size:14px;
}

.message.assistant{
    background:#eff6ff;
    border:1px solid #dbeafe;
}

.message.user{
    background:#111827;
    color:white;
    margin-left:30px;
}

.message.error{
    background:#fef2f2;
    border:1px solid #fecaca;
    color:#991b1b;
}

.composer{
    background:white;
    margin-top:16px;
    border-radius:16px;
    padding:12px;
    box-shadow:0 2px 8px rgba(0,0,0,.06);
}

textarea{
    width:100%;
    min-height:80px;
    resize:vertical;
    border:1px solid #d1d5db;
    border-radius:12px;
    padding:12px;
    font-family:inherit;
    font-size:14px;
    outline:none;
}

textarea:focus{
    border-color:#2563eb;
}

.bottom{
    display:flex;
    align-items:center;
    justify-content:space-between;
    gap:10px;
    margin-top:10px;
}

#status{
    font-size:12px;
    color:#64748b;
    flex:1;
}

#send{
    border:none;
    background:#2563eb;
    color:white;
    border-radius:12px;
    padding:12px 18px;
    font-weight:bold;
    cursor:pointer;
}

#send:hover{
    background:#1d4ed8;
}

#send:disabled{
    background:#94a3b8;
    cursor:not-allowed;
}

@media(max-width:600px){

    .options{
        grid-template-columns:1fr;
    }

    .container{
        padding:12px;
    }

    .message.user{
        margin-left:15px;
    }

}

</style>

</head>


<body>


<header>

<a
    href="index.html"
    class="back"
    aria-label="Volver"
>
←
</a>

<div class="logo">
🤖
</div>

<div class="header-text">

<h1>
Asistente GESBASE
</h1>

<p>
Inteligencia artificial
</p>

</div>

</header>


<main class="container">


<section class="intro">

<h2>
🤖 Asistente inteligente
</h2>

<p>
Consultá información, analizá presupuestos,
trabajos, gastos, cobros y rentabilidad de tu empresa.
</p>


<div class="options">


<button
    class="option"
    data-prompt="Quiero analizar un presupuesto."
>

<strong>
📋 Analizar presupuesto
</strong>

<span>
Analizar un presupuesto de GESBASE
</span>

</button>


<button
    class="option"
    data-prompt="Quiero analizar un trabajo."
>

<strong>
🔧 Analizar trabajo
</strong>

<span>
Consultar información de trabajos
</span>

</button>


<button
    class="option"
    data-prompt="Quiero analizar los gastos."
>

<strong>
💰 Analizar gastos
</strong>

<span>
Revisar gastos y costos
</span>

</button>


<button
    class="option"
    data-prompt="Quiero analizar los cobros."
>

<strong>
💵 Analizar cobros
</strong>

<span>
Consultar cobros y saldos
</span>

</button>


<button
    class="option"
    data-prompt="Quiero analizar la rentabilidad de mi empresa."
>

<strong>
📈 Rentabilidad
</strong>

<span>
Analizar ingresos, costos y rentabilidad
</span>

</button>


<button
    class="option"
    data-prompt="Quiero un resumen de mi empresa."
>

<strong>
🏢 Resumen empresa
</strong>

<span>
Obtener un resumen general
</span>

</button>


<button
    class="option"
    data-prompt="Quiero consultar información sobre empleados."
>

<strong>
👷 Empleados
</strong>

<span>
Consultar información de empleados
</span>

</button>


<button
    class="option"
    data-prompt=""
>

<strong>
💬 Pregunta libre
</strong>

<span>
Hacer cualquier consulta
</span>

</button>


</div>

</section>


<section
    id="chat"
    class="chat"
>

<div
    id="initialMessage"
    class="message assistant"
>

🤖 Asistente GESBASE

<br><br>

Preparando asistente...

</div>

</section>


<section class="composer">

<textarea
    id="message"
    placeholder="Escribí tu consulta..."
></textarea>


<div class="bottom">

<div id="status">
Conectando...
</div>


<button
    id="send"
    type="button"
    disabled
>

Enviar

</button>

</div>

</section>


</main>


<script type="module">


/* =====================================================
   GESBASE
   ASISTENTE INTELIGENTE
   VERSIÓN OPTIMIZADA
===================================================== */


/* =====================================================
   CONFIGURACIÓN FIREBASE
===================================================== */

const firebaseConfig = {

    apiKey:
        "AIzaSyDJhmtS1_DxjkkNrZ8HpreqwpSZieubZ5s",

    authDomain:
        "gesbase-4bf94.firebaseapp.com",

    projectId:
        "gesbase-4bf94",

    storageBucket:
        "gesbase-4bf94.firebasestorage.app",

    messagingSenderId:
        "64959778874",

    appId:
        "1:64959778874:web:c3bc129c3cee8cb77d6503",

    measurementId:
        "G-CCKGSRVGEX"

};


/* =====================================================
   RECAPTCHA ENTERPRISE
===================================================== */

const RECAPTCHA_SITE_KEY =
    "6LdysqEtAAAAAPPRcPrtI97fIaSbZ6UXclDtVBhJ";


/* =====================================================
   ELEMENTOS
===================================================== */

const chat =
    document.getElementById("chat");

const message =
    document.getElementById("message");

const send =
    document.getElementById("send");

const status =
    document.getElementById("status");


/* =====================================================
   VARIABLES
===================================================== */

let model = null;

let inicializado = false;


/* =====================================================
   ESTADO
===================================================== */

function setStatus(text){

    status.textContent =
        text;

    console.log(
        "GESBASE IA:",
        text
    );

}


/* =====================================================
   MENSAJES
===================================================== */

function showMessage(
    text,
    type = "assistant"
){

    const div =
        document.createElement("div");

    div.className =
        "message " + type;

    div.textContent =
        text;

    chat.appendChild(div);

    chat.scrollTop =
        chat.scrollHeight;

}


/* =====================================================
   MENSAJE INICIAL
===================================================== */

function removeInitialMessage(){

    const initial =
        document.getElementById(
            "initialMessage"
        );

    if(initial){

        initial.remove();

    }

}


/* =====================================================
   INICIALIZAR IA
===================================================== */

async function iniciarIA(){

    try{

        send.disabled = true;


        /* =============================================
           FIREBASE
        ============================================= */

        setStatus(
            "Conectando con Firebase..."
        );


        const firebase =
            await import(
                "https://www.gstatic.com/firebasejs/12.18.0/firebase-app.js"
            );


        const app =
            firebase.initializeApp(
                firebaseConfig
            );


        /* =============================================
           APP CHECK
        ============================================= */

        setStatus(
            "Verificando seguridad..."
        );


        const appCheck =
            await import(
                "https://www.gstatic.com/firebasejs/12.18.0/firebase-app-check.js"
            );


        appCheck.initializeAppCheck(
            app,
            {

                provider:
                    new appCheck.ReCaptchaEnterpriseProvider(
                        RECAPTCHA_SITE_KEY
                    ),

                isTokenAutoRefreshEnabled:
                    true

            }
        );


        /* =============================================
           FIREBASE AI
        ============================================= */

        setStatus(
            "Preparando inteligencia artificial..."
        );


        const firebaseAI =
            await import(
                "https://www.gstatic.com/firebasejs/12.18.0/firebase-ai.js"
            );


        const ai =
            firebaseAI.getAI(
                app,
                {

                    backend:
                        new firebaseAI.GoogleAIBackend()

                }
            );


        /* =============================================
           MODELO
        ============================================= */

        model =
            firebaseAI.getGenerativeModel(
                ai,
                {

                    model:
                        "gemini-3.7-flash",

                    systemInstruction:
`
Sos el asistente inteligente oficial de GESBASE.

Respondé siempre en español.

Ayudá al usuario con:

- presupuestos
- clientes
- trabajos
- gastos
- empleados
- fichajes
- facturas
- cobros
- saldos
- rentabilidad
- productos
- ventas
- administración

Sé claro, profesional y práctico.

No inventes datos.

Si no tenés acceso a un dato específico,
decí claramente que no disponés de ese dato.

No afirmes que realizaste una acción
si realmente no fue realizada.

`
                }
            );


        /* =============================================
           LISTO
        ============================================= */

        inicializado =
            true;


        removeInitialMessage();


        showMessage(
            "🤖 Hola. Soy el asistente de GESBASE.\n\n¿En qué puedo ayudarte?"
        );


        setStatus(
            "✅ Asistente listo"
        );


        send.disabled =
            false;


        message.focus();


        console.log(
            "GESBASE IA: LISTO"
        );

    }

    catch(error){

        console.error(
            "GESBASE IA ERROR:",
            error
        );


        model =
            null;

        inicializado =
            false;


        send.disabled =
            true;


        removeInitialMessage();


        setStatus(
            "❌ Error de conexión"
        );


        showMessage(

            "❌ No se pudo iniciar el asistente.\n\n" +

            "ERROR:\n\n" +

            (
                error?.message ||
                String(error)
            ),

            "error"

        );

    }

}


/* =====================================================
   ENVIAR MENSAJE
===================================================== */

async function enviarMensaje(){

    const texto =
        message.value.trim();


    if(!texto){

        return;

    }


    if(!inicializado || !model){

        showMessage(
            "⏳ El asistente todavía se está preparando.",
            "error"
        );

        return;

    }


    showMessage(
        texto,
        "user"
    );


    message.value =
        "";


    send.disabled =
        true;


    setStatus(
        "🤖 Pensando..."
    );


    try{

        const resultado =
            await model.generateContent(
                texto
            );


        const respuesta =
            resultado.response.text();


        if(
            !respuesta ||
            !respuesta.trim()
        ){

            throw new Error(
                "Gemini no devolvió ninguna respuesta."
            );

        }


        showMessage(
            respuesta,
            "assistant"
        );


        setStatus(
            "✅ Asistente listo"
        );

    }

    catch(error){

        console.error(
            "GESBASE CHAT ERROR:",
            error
        );


        showMessage(

            "❌ Error al consultar el asistente.\n\n" +

            (
                error?.message ||
                String(error)
            ),

            "error"

        );


        setStatus(
            "❌ Error al consultar Gemini"
        );

    }


    send.disabled =
        false;

}


/* =====================================================
   BOTÓN
===================================================== */

send.addEventListener(
    "click",
    enviarMensaje
);


/* =====================================================
   ENTER
===================================================== */

message.addEventListener(
    "keydown",
    function(event){

        if(
            event.key === "Enter" &&
            !event.shiftKey
        ){

            event.preventDefault();

            enviarMensaje();

        }

    }
);


/* =====================================================
   OPCIONES
===================================================== */

document
    .querySelectorAll(".option")
    .forEach(
        function(option){

            option.addEventListener(
                "click",
                function(){

                    const prompt =
                        option.dataset.prompt || "";


                    if(prompt){

                        message.value =
                            prompt;

                        message.focus();

                    }
                    else{

                        message.focus();

                    }

                }
            );

        }
    );


/* =====================================================
   ARRANCAR
===================================================== */

iniciarIA();


</script>


</body>

</html>
