<!DOCTYPE html>
<html lang="es-AR">

<head>

<meta charset="UTF-8">

<meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
>

<meta
    name="theme-color"
    content="#111827"
>

<meta
    name="description"
    content="Asistente inteligente de GESBASE"
>

<title>Asistente GESBASE</title>

<style>

*{
    box-sizing:border-box;
    margin:0;
    padding:0;
}

body{
    font-family:Arial,Helvetica,sans-serif;
    background:#f3f4f6;
    color:#111827;
    min-height:100vh;
}

header{
    background:#111827;
    color:white;
    padding:16px;
    display:flex;
    align-items:center;
    gap:12px;
    position:sticky;
    top:0;
    z-index:10;
}

.back{
    color:white;
    text-decoration:none;
    font-size:25px;
    width:35px;
}

.logo{
    width:44px;
    height:44px;
    border-radius:12px;
    background:#2563eb;
    display:flex;
    align-items:center;
    justify-content:center;
    font-size:24px;
}

.header-text h1{
    font-size:19px;
}

.header-text p{
    font-size:12px;
    color:#cbd5e1;
    margin-top:3px;
}

.container{
    max-width:900px;
    margin:auto;
    padding:16px;
}

.intro{
    background:white;
    border-radius:16px;
    padding:18px;
    margin-bottom:16px;
    box-shadow:0 2px 8px rgba(0,0,0,.06);
}

.intro h2{
    font-size:18px;
    margin-bottom:7px;
}

.intro p{
    color:#64748b;
    font-size:14px;
    line-height:1.5;
}

.options{
    display:grid;
    grid-template-columns:repeat(2,1fr);
    gap:10px;
    margin-top:16px;
}

.option{
    border:1px solid #e5e7eb;
    background:#f8fafc;
    border-radius:12px;
    padding:13px;
    cursor:pointer;
    transition:.2s;
    text-align:left;
}

.option:hover{
    background:#eff6ff;
    border-color:#93c5fd;
}

.option strong{
    display:block;
    font-size:14px;
    margin-bottom:4px;
}

.option span{
    display:block;
    font-size:12px;
    color:#64748b;
}

.chat{
    background:white;
    border-radius:16px;
    padding:16px;
    min-height:300px;
    box-shadow:0 2px 8px rgba(0,0,0,.06);
}

.message{
    padding:13px 15px;
    border-radius:14px;
    margin-bottom:12px;
    white-space:pre-wrap;
    line-height:1.5;
    font-size:14px;
}

.message.assistant{
    background:#eff6ff;
    border:1px solid #dbeafe;
}

.message.user{
    background:#111827;
    color:white;
    margin-left:30px;
}

.message.error{
    background:#fef2f2;
    border:1px solid #fecaca;
    color:#991b1b;
}

.composer{
    background:white;
    margin-top:16px;
    border-radius:16px;
    padding:12px;
    box-shadow:0 2px 8px rgba(0,0,0,.06);
}

textarea{
    width:100%;
    min-height:80px;
    resize:vertical;
    border:1px solid #d1d5db;
    border-radius:12px;
    padding:12px;
    font-family:inherit;
    font-size:14px;
    outline:none;
}

textarea:focus{
    border-color:#2563eb;
}

.bottom{
    display:flex;
    align-items:center;
    justify-content:space-between;
    gap:10px;
    margin-top:10px;
}

#status{
    font-size:12px;
    color:#64748b;
    flex:1;
}

#send{
    border:none;
    background:#2563eb;
    color:white;
    border-radius:12px;
    padding:12px 18px;
    font-weight:bold;
    cursor:pointer;
}

#send:hover{
    background:#1d4ed8;
}

#send:disabled{
    background:#94a3b8;
    cursor:not-allowed;
}

.loading{
    opacity:.7;
}

@media(max-width:600px){

    .options{
        grid-template-columns:1fr;
    }

    .container{
        padding:12px;
    }

    .message.user{
        margin-left:15px;
    }

}

</style>

</head>


<body>


<header>

<a
    href="index.html"
    class="back"
    aria-label="Volver"
>
←
</a>

<div class="logo">
🤖
</div>

<div class="header-text">

<h1>
Asistente GESBASE
</h1>

<p>
Inteligencia artificial
</p>

</div>

</header>


<main class="container">


<section class="intro">

<h2>
🤖 Asistente inteligente
</h2>

<p>
Consultá información, analizá presupuestos,
trabajos, gastos, cobros y rentabilidad de tu empresa.
</p>


<div class="options">


<button
    class="option"
    data-prompt="Quiero analizar un presupuesto."
>

<strong>
📋 Analizar presupuesto
</strong>

<span>
Analizar un presupuesto de GESBASE
</span>

</button>


<button
    class="option"
    data-prompt="Quiero analizar un trabajo."
>

<strong>
🔧 Analizar trabajo
</strong>

<span>
Consultar información de trabajos
</span>

</button>


<button
    class="option"
    data-prompt="Quiero analizar los gastos."
>

<strong>
💰 Analizar gastos
</strong>

<span>
Revisar gastos y costos
</span>

</button>


<button
    class="option"
    data-prompt="Quiero analizar los cobros."
>

<strong>
💵 Analizar cobros
</strong>

<span>
Consultar cobros y saldos
</span>

</button>


<button
    class="option"
    data-prompt="Quiero analizar la rentabilidad de mi empresa."
>

<strong>
📈 Rentabilidad
</strong>

<span>
Analizar ingresos, costos y rentabilidad
</span>

</button>


<button
    class="option"
    data-prompt="Quiero un resumen de mi empresa."
>

<strong>
🏢 Resumen empresa
</strong>

<span>
Obtener un resumen general
</span>

</button>


<button
    class="option"
    data-prompt="Quiero consultar información sobre empleados."
>

<strong>
👷 Empleados
</strong>

<span>
Consultar información de empleados
</span>

</button>


<button
    class="option"
    data-prompt=""
>

<strong>
💬 Pregunta libre
</strong>

<span>
Hacer cualquier consulta
</span>

</button>


</div>

</section>


<section
    id="chat"
    class="chat"
>

<div class="message assistant loading">

🤖 Hola. Soy el asistente de GESBASE.

Inicializando Gemini...

</div>

</section>


<section class="composer">

<textarea
    id="message"
    placeholder="Escribí tu consulta..."
></textarea>


<div class="bottom">

<div id="status">
Inicializando...
</div>


<button
    id="send"
    type="button"
    disabled
>

Enviar

</button>

</div>

</section>


</main>


<script type="module">


/* =========================================================
   FIREBASE
========================================================= */

import {
    initializeApp
} from "https://www.gstatic.com/firebasejs/12.18.0/firebase-app.js";


/* =========================================================
   FIREBASE APP CHECK
========================================================= */

import {
    initializeAppCheck,
    ReCaptchaEnterpriseProvider
} from "https://www.gstatic.com/firebasejs/12.18.0/firebase-app-check.js";


/* =========================================================
   FIREBASE AI LOGIC
========================================================= */

import {
    getAI,
    getGenerativeModel,
    GoogleAIBackend
} from "https://www.gstatic.com/firebasejs/12.18.0/firebase-ai.js";


/* =========================================================
   CONFIGURACIÓN FIREBASE
========================================================= */

import {
    firebaseConfig
} from "./firebase-config.js";


/* =========================================================
   RECAPTCHA ENTERPRISE
========================================================= */

const RECAPTCHA_SITE_KEY =
"6LdysqEtAAAAAPPRcPrtI97fIaSbZ6UXclDtVBhJ";


/* =========================================================
   ELEMENTOS
========================================================= */

const chat =
document.getElementById("chat");

const message =
document.getElementById("message");

const send =
document.getElementById("send");

const status =
document.getElementById("status");

const options =
document.querySelectorAll(".option");


/* =========================================================
   VARIABLES
========================================================= */

let app = null;

let model = null;


/* =========================================================
   MOSTRAR MENSAJE
========================================================= */

function showMessage(
    text,
    type = "assistant"
){

    const div =
    document.createElement("div");

    div.className =
    "message " + type;

    div.textContent =
    text;

    chat.appendChild(div);

    chat.scrollTop =
    chat.scrollHeight;

}


/* =========================================================
   LIMPIAR MENSAJE DE INICIALIZACIÓN
========================================================= */

function removeLoadingMessage(){

    const loading =
    chat.querySelector(".loading");

    if(loading){
        loading.remove();
    }

}


/* =========================================================
   INICIALIZAR GEMINI
========================================================= */

async function iniciarIA(){

    try{

        send.disabled = true;


        /* ---------------------------------------------
           PASO 1
        --------------------------------------------- */

        status.textContent =
        "1/5 Iniciando Firebase...";

        console.log(
            "GESBASE IA: iniciando Firebase"
        );


        app =
        initializeApp(
            firebaseConfig
        );


        console.log(
            "GESBASE IA: Firebase OK"
        );


        /* ---------------------------------------------
           PASO 2
        --------------------------------------------- */

        status.textContent =
        "2/5 Activando reCAPTCHA...";

        console.log(
            "GESBASE IA: iniciando App Check"
        );


        initializeAppCheck(
            app,
            {
                provider:
                    new ReCaptchaEnterpriseProvider(
                        RECAPTCHA_SITE_KEY
                    ),

                isTokenAutoRefreshEnabled:
                    true
            }
        );


        console.log(
            "GESBASE IA: App Check OK"
        );


        /* ---------------------------------------------
           PASO 3
        --------------------------------------------- */

        status.textContent =
        "3/5 Conectando Firebase AI...";

        console.log(
            "GESBASE IA: creando Firebase AI"
        );


        const ai =
        getAI(
            app,
            {
                backend:
                    new GoogleAIBackend()
            }
        );


        console.log(
            "GESBASE IA: Firebase AI OK"
        );


        /* ---------------------------------------------
           PASO 4
        --------------------------------------------- */

        status.textContent =
        "4/5 Cargando Gemini...";

        console.log(
            "GESBASE IA: creando modelo"
        );


        model =
        getGenerativeModel(
            ai,
            {

                model:
                    "gemini-3.7-flash",


                systemInstruction: `

Sos el asistente inteligente oficial de GESBASE.

Respondé siempre en español.

Tu función es ayudar al usuario a administrar
y analizar información relacionada con su empresa.

Podés ayudar con:

- presupuestos
- clientes
- trabajos
- gastos
- empleados
- fichajes
- facturas
- cobros
- saldos
- rentabilidad
- productos
- ventas
- administración
- organización empresarial

Sé claro, profesional y práctico.

No inventes datos.

Si no tenés acceso a un dato específico,
decí claramente que no disponés de ese dato.

Cuando corresponda, explicá los cálculos
de manera sencilla.

No afirmes que realizaste una acción en GESBASE
si realmente no fue realizada.

`

            }
        );


        console.log(
            "GESBASE IA: modelo creado correctamente"
        );


        /* ---------------------------------------------
           PASO 5
        --------------------------------------------- */

        status.textContent =
        "5/5 Probando Gemini...";


        console.log(
            "GESBASE IA: realizando prueba"
        );


        const prueba =
        await model.generateContent(
            "Respondé solamente: GESBASE IA funcionando."
        );


        const respuesta =
        prueba.response.text();


        console.log(
            "GESBASE IA: respuesta:",
            respuesta
        );


        if(
            !respuesta ||
            !respuesta.trim()
        ){

            throw new Error(
                "Gemini no devolvió texto."
            );

        }


        /* ---------------------------------------------
           CONEXIÓN CORRECTA
        --------------------------------------------- */

        removeLoadingMessage();


        status.textContent =
        "✅ Gemini conectado";


        send.disabled =
        false;


        showMessage(
            "✅ Gemini está conectado correctamente.\n\n" +
            respuesta,
            "assistant"
        );


    }

    catch(error){

        console.error(
            "================================"
        );

        console.error(
            "GESBASE IA ERROR"
        );

        console.error(
            error
        );

        console.error(
            "Mensaje:",
            error?.message
        );

        console.error(
            "Stack:",
            error?.stack
        );

        console.error(
            "================================"
        );


        model =
        null;


        send.disabled =
        true;


        status.textContent =
        "❌ Error de conexión";


        removeLoadingMessage();


        showMessage(

            "❌ No se pudo conectar con Gemini.\n\n" +

            "El sistema detectó un error durante " +
            "la inicialización.\n\n" +

            "Detalle:\n" +

            (
                error?.message ||
                String(error)
            ),

            "error"

        );

    }

}


/* =========================================================
   ENVIAR MENSAJE A GEMINI
========================================================= */

async function enviarMensaje(){

    const texto =
    message.value.trim();


    if(!texto){
        return;
    }


    if(!model){

        showMessage(
            "❌ Gemini todavía no está conectado.",
            "error"
        );

        return;

    }


    /* ---------------------------------------------
       MOSTRAR MENSAJE DEL USUARIO
    --------------------------------------------- */

    showMessage(
        texto,
        "user"
    );


    message.value =
    "";


    send.disabled =
    true;


    status.textContent =
    "🤖 Gemini está pensando...";


    try{

        const resultado =
        await model.generateContent(
            texto
        );


        const respuesta =
        resultado.response.text();


        if(
            !respuesta ||
            !respuesta.trim()
        ){

            throw new Error(
                "Gemini no devolvió una respuesta."
            );

        }


        showMessage(
            respuesta,
            "assistant"
        );


        status.textContent =
        "✅ Gemini conectado";


    }

    catch(error){

        console.error(
            "GESBASE IA CHAT ERROR:",
            error
        );


        showMessage(

            "❌ Ocurrió un error al consultar Gemini.\n\n" +

            (
                error?.message ||
                String(error)
            ),

            "error"

        );


        status.textContent =
        "❌ Error al consultar Gemini";

    }


    send.disabled =
    false;

}


/* =========================================================
   BOTÓN ENVIAR
========================================================= */

send.addEventListener(
    "click",
    enviarMensaje
);


/* =========================================================
   ENTER PARA ENVIAR
========================================================= */

message.addEventListener(
    "keydown",
    function(event){

        if(
            event.key === "Enter" &&
            !event.shiftKey
        ){

            event.preventDefault();

            enviarMensaje();

        }

    }
);


/* =========================================================
   OPCIONES
========================================================= */

options.forEach(
    function(option){

        option.addEventListener(
            "click",
            function(){

                const prompt =
                option.dataset.prompt || "";


                if(prompt){

                    message.value =
                    prompt;

                    message.focus();

                }
                else{

                    message.focus();

                }

            }
        );

    }
);


/* =========================================================
   INICIAR
========================================================= */

iniciarIA();


</script>


</body>

</html>
