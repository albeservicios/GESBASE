<!DOCTYPE html>
<html lang="es-AR">

<head>

<meta charset="UTF-8">

<meta name="viewport" content="width=device-width, initial-scale=1.0">

<meta name="theme-color" content="#111827">

<title>Asistente GESBASE</title>

<style>

*{
    box-sizing:border-box;
    margin:0;
    padding:0;
}

body{
    font-family:Arial,Helvetica,sans-serif;
    background:#f3f4f6;
    color:#111827;
    min-height:100vh;
}

.header{
    background:#111827;
    color:#fff;
    padding:15px;
    display:flex;
    align-items:center;
    gap:12px;
}

.back{
    color:#fff;
    text-decoration:none;
    font-size:24px;
}

.logo{
    width:42px;
    height:42px;
    border-radius:12px;
    background:#2563eb;
    display:flex;
    align-items:center;
    justify-content:center;
    font-size:22px;
}

.header h1{
    font-size:19px;
}

.header p{
    font-size:12px;
    color:#cbd5e1;
    margin-top:3px;
}

.container{
    max-width:850px;
    margin:auto;
    padding:15px;
}

.card{
    background:#fff;
    border-radius:18px;
    padding:18px;
    margin-bottom:15px;
    box-shadow:0 2px 8px rgba(0,0,0,.06);
}

.card h2{
    font-size:20px;
    margin-bottom:8px;
}

.card p{
    font-size:14px;
    color:#6b7280;
    line-height:1.5;
}

.options-title{
    margin-top:18px;
    margin-bottom:10px;
    font-size:15px;
    font-weight:bold;
}

.options{
    display:grid;
    grid-template-columns:1fr 1fr;
    gap:10px;
}

.option{
    width:100%;
    border:1px solid #dbe2ea;
    background:#f8fafc;
    border-radius:14px;
    padding:14px;
    text-align:left;
    cursor:pointer;
}

.option:active{
    transform:scale(.98);
}

.option-icon{
    font-size:23px;
    margin-bottom:6px;
}

.option-title{
    font-size:14px;
    font-weight:bold;
}

.option-text{
    margin-top:4px;
    font-size:11px;
    color:#6b7280;
}

.chat{
    min-height:180px;
    max-height:50vh;
    overflow-y:auto;
    margin-bottom:10px;
}

.message{
    display:flex;
    margin-bottom:12px;
}

.user{
    justify-content:flex-end;
}

.bubble{
    max-width:90%;
    padding:12px 14px;
    border-radius:16px;
    font-size:14px;
    line-height:1.5;
    white-space:pre-wrap;
}

.assistant .bubble{
    background:#fff;
    border:1px solid #e5e7eb;
}

.user .bubble{
    background:#2563eb;
    color:#fff;
}

.error .bubble{
    background:#fee2e2;
    color:#991b1b;
    border:1px solid #fecaca;
}

.loading .bubble{
    background:#fff;
    border:1px solid #e5e7eb;
}

.composer{
    position:sticky;
    bottom:0;
    background:#f3f4f6;
    padding:8px 0 15px;
}

.input{
    background:#fff;
    border:1px solid #d1d5db;
    border-radius:16px;
    padding:8px;
    display:flex;
    gap:8px;
    align-items:flex-end;
}

textarea{
    flex:1;
    border:0;
    outline:none;
    resize:none;
    padding:10px;
    font-family:Arial,Helvetica,sans-serif;
    font-size:14px;
    min-height:44px;
    max-height:120px;
}

.send{
    width:46px;
    height:46px;
    border:0;
    border-radius:12px;
    background:#2563eb;
    color:#fff;
    font-size:20px;
    cursor:pointer;
}

.send:disabled{
    opacity:.5;
}

.status{
    text-align:center;
    font-size:11px;
    color:#6b7280;
    margin-top:7px;
}

@media(max-width:600px){

    .options{
        grid-template-columns:1fr;
    }

}

</style>

</head>


<body>


<header class="header">

<a href="index.html" class="back">
←
</a>

<div class="logo">
🤖
</div>

<div>

<h1>Asistente GESBASE</h1>

<p>Inteligencia artificial</p>

</div>

</header>


<main class="container">


<section class="card">

<h2>
Hola 👋
</h2>

<p>
Soy el asistente inteligente de GESBASE.
Elegí una opción o escribí tu consulta.
</p>


<div class="options-title">
¿Qué querés hacer?
</div>


<div class="options">


<button
class="option"
data-question="Quiero analizar un presupuesto."
>

<div class="option-icon">
📊
</div>

<div class="option-title">
Analizar presupuesto
</div>

<div class="option-text">
Revisar costos y margen.
</div>

</button>


<button
class="option"
data-question="Quiero analizar un trabajo."
>

<div class="option-icon">
🔧
</div>

<div class="option-title">
Analizar trabajo
</div>

<div class="option-text">
Revisar resultado.
</div>

</button>


<button
class="option"
data-question="Quiero analizar mis gastos."
>

<div class="option-icon">
💸
</div>

<div class="option-title">
Analizar gastos
</div>

<div class="option-text">
Controlar costos.
</div>

</button>


<button
class="option"
data-question="Quiero analizar mis cobros."
>

<div class="option-icon">
🧾
</div>

<div class="option-title">
Analizar cobros
</div>

<div class="option-text">
Cobrado y pendiente.
</div>

</button>


<button
class="option"
data-question="Quiero analizar la rentabilidad."
>

<div class="option-icon">
💰
</div>

<div class="option-title">
Rentabilidad
</div>

<div class="option-text">
Resultado y margen.
</div>

</button>


<button
class="option"
data-question="Quiero un resumen de mi empresa."
>

<div class="option-icon">
📈
</div>

<div class="option-title">
Resumen empresa
</div>

<div class="option-text">
Situación general.
</div>

</button>


<button
class="option"
data-question="Quiero consultar empleados y fichajes."
>

<div class="option-icon">
👥
</div>

<div class="option-title">
Empleados
</div>

<div class="option-text">
Empleados y fichajes.
</div>

</button>


<button
class="option"
data-question=""
>

<div class="option-icon">
💬
</div>

<div class="option-title">
Pregunta libre
</div>

<div class="option-text">
Escribí tu consulta.
</div>

</button>


</div>

</section>


<section
id="chat"
class="chat"
>

<div class="message assistant">

<div class="bubble">

🤖 Hola. Soy el asistente de GESBASE.

Inicializando Gemini...

</div>

</div>

</section>


<section class="composer">

<div class="input">

<textarea
id="message"
placeholder="Escribí tu consulta..."
></textarea>

<button
id="send"
class="send"
type="button"
>
➤
</button>

</div>

<div
id="status"
class="status"
>
Inicializando...
</div>

</section>


</main>


<script type="module">


/*
==================================================
FIREBASE
==================================================
*/

import {
    initializeApp
}
from "https://www.gstatic.com/firebasejs/12.18.0/firebase-app.js";


/*
==================================================
APP CHECK
==================================================
*/

import {
    initializeAppCheck,
    ReCaptchaEnterpriseProvider
}
from "https://www.gstatic.com/firebasejs/12.18.0/firebase-app-check.js";


/*
==================================================
FIREBASE AI LOGIC
==================================================
*/

import {
    getAI,
    getGenerativeModel,
    GoogleAIBackend
}
from "https://www.gstatic.com/firebasejs/12.18.0/firebase-ai.js";


/*
==================================================
CONFIGURACIÓN
==================================================
*/

import {
    firebaseConfig
}
from "./firebase-config.js";


/*
==================================================
CLAVE DE SITIO RECAPTCHA ENTERPRISE
==================================================
*/

const RECAPTCHA_SITE_KEY =
"6LdysqEtAAAAAPPRcPrtI97fIaSbZ6UXclDtVBhJ";


/*
==================================================
ELEMENTOS
==================================================
*/

const chat =
document.getElementById("chat");

const message =
document.getElementById("message");

const send =
document.getElementById("send");

const status =
document.getElementById("status");

const options =
document.querySelectorAll(".option");


/*
==================================================
VARIABLES
==================================================
*/

let model = null;


/*
==================================================
MOSTRAR MENSAJE
==================================================
*/

function showMessage(
    text,
    type
){

    const row =
    document.createElement("div");

    row.className =
    "message " + type;


    const bubble =
    document.createElement("div");

    bubble.className =
    "bubble";


    bubble.textContent =
    text;


    row.appendChild(
        bubble
    );


    chat.appendChild(
        row
    );


    chat.scrollTop =
    chat.scrollHeight;

}


/*
==================================================
CARGANDO
==================================================
*/

function showLoading(){

    const row =
    document.createElement("div");

    row.id =
    "loadingMessage";

    row.className =
    "message loading";


    const bubble =
    document.createElement("div");

    bubble.className =
    "bubble";

    bubble.textContent =
    "🤖 Gemini está pensando...";


    row.appendChild(
        bubble
    );


    chat.appendChild(
        row
    );


    chat.scrollTop =
    chat.scrollHeight;

}


function removeLoading(){

    const loading =
    document.getElementById(
        "loadingMessage"
    );


    if(loading){

        loading.remove();

    }

}


/*
==================================================
INICIALIZAR GESBASE IA
==================================================
*/

async function iniciarIA(){

    try{

        status.textContent =
        "1/4 Iniciando Firebase...";


        /*
        ==========================================
        FIREBASE
        ==========================================
        */

        const app =
        initializeApp(
            firebaseConfig
        );


        status.textContent =
        "2/4 Activando reCAPTCHA Enterprise...";


        /*
        ==========================================
        APP CHECK
        ==========================================
        */

        initializeAppCheck(
            app,
            {
                provider:
                new ReCaptchaEnterpriseProvider(
                    RECAPTCHA_SITE_KEY
                ),

                isTokenAutoRefreshEnabled:
                true
            }
        );


        status.textContent =
        "3/4 Iniciando Firebase AI Logic...";


        /*
        ==========================================
        FIREBASE AI
        ==========================================
        */

        const ai =
        getAI(
            app,
            {
                backend:
                new GoogleAIBackend()
            }
        );


        /*
        ==========================================
        MODELO
        ==========================================
        */

        model =
        getGenerativeModel(
            ai,
            {
                model:
                "gemini-3.7-flash",

                systemInstruction: `
Sos el asistente inteligente de GESBASE.

GESBASE es un sistema de gestión empresarial.

Ayudás con:

- presupuestos
- clientes
- trabajos
- materiales
- mano de obra
- viáticos
- gastos
- empleados
- fichajes
- facturas
- cobros
- saldos
- rentabilidad

Respondé siempre en español.

Sé claro, profesional y práctico.

No inventes datos.

En esta primera versión todavía no tenés
acceso automático a los datos privados de
Firestore.

No afirmes que consultaste datos de la
empresa si no fueron proporcionados.

`
            }
        );


        status.textContent =
        "4/4 Gemini conectado";


        showMessage(
            "✅ Gemini está conectado.\n\nEscribime \"Hola\" para probarlo.",
            "assistant"
        );


    }catch(error){

        console.error(
            "ERROR GESBASE IA:",
            error
        );


        status.textContent =
        "Error de inicialización";


        showMessage(

            "❌ No se pudo iniciar la IA.\n\n" +
            "Error:\n" +
            error.message,

            "error"

        );

    }

}


/*
==================================================
ENVIAR MENSAJE
==================================================
*/

async function sendMessage(
    customText = null
){

    const text =
    customText !== null
        ? customText
        : message.value.trim();


    if(!text){

        message.focus();

        return;

    }


    showMessage(
        text,
        "user"
    );


    message.value =
    "";


    send.disabled =
    true;


    status.textContent =
    "Consultando Gemini...";


    showLoading();


    try{

        if(!model){

            await iniciarIA();

        }


        if(!model){

            throw new Error(
                "Gemini todavía no está disponible."
            );

        }


        const result =
        await model.generateContent(
            text
        );


        removeLoading();


        const answer =
        result.response.text();


        showMessage(
            answer,
            "assistant"
        );


        status.textContent =
        "GESBASE IA · Gemini";


    }catch(error){

        removeLoading();


        console.error(
            "ERROR AL CONSULTAR GEMINI:",
            error
        );


        showMessage(

            "❌ Gemini no pudo responder.\n\n" +
            error.message,

            "error"

        );


        status.textContent =
        "Error de Gemini";

    }finally{

        send.disabled =
        false;

        message.focus();

    }

}


/*
==================================================
BOTÓN ENVIAR
==================================================
*/

send.addEventListener(
    "click",
    function(){

        sendMessage();

    }
);


/*
==================================================
ENTER
==================================================
*/

message.addEventListener(
    "keydown",
    function(event){

        if(
            event.key === "Enter" &&
            !event.shiftKey
        ){

            event.preventDefault();

            sendMessage();

        }

    }
);


/*
==================================================
OPCIONES
==================================================
*/

options.forEach(
    function(option){

        option.addEventListener(
            "click",
            function(){

                const question =
                this.dataset.question;


                if(!question){

                    message.focus();

                    return;

                }


                sendMessage(
                    question
                );

            }
        );

    }
);


/*
==================================================
ARRANCAR
==================================================
*/

iniciarIA();


</script>


</body>

</html>
