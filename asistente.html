<!DOCTYPE html>
<html lang="es-AR">

<head>

<meta charset="UTF-8">

<meta name="viewport" content="width=device-width, initial-scale=1.0">

<meta name="theme-color" content="#111827">

<title>Asistente GESBASE</title>

<style>

*{
    box-sizing:border-box;
    margin:0;
    padding:0;
}

body{
    font-family:Arial,Helvetica,sans-serif;
    background:#f3f4f6;
    color:#111827;
    min-height:100vh;
}

.header{
    background:#111827;
    color:white;
    padding:15px;
    display:flex;
    align-items:center;
    gap:12px;
}

.back{
    color:white;
    text-decoration:none;
    font-size:24px;
}

.logo{
    width:42px;
    height:42px;
    border-radius:12px;
    background:#2563eb;
    display:flex;
    align-items:center;
    justify-content:center;
    font-size:22px;
}

.header h1{
    font-size:19px;
}

.header p{
    font-size:12px;
    color:#cbd5e1;
}

.container{
    max-width:850px;
    margin:auto;
    padding:15px;
}

.card{
    background:white;
    border-radius:18px;
    padding:18px;
    margin-bottom:15px;
    box-shadow:0 2px 8px rgba(0,0,0,.06);
}

.card h2{
    font-size:20px;
    margin-bottom:8px;
}

.card p{
    color:#6b7280;
    font-size:14px;
    line-height:1.5;
}

.options-title{
    margin-top:18px;
    margin-bottom:10px;
    font-weight:bold;
}

.options{
    display:grid;
    grid-template-columns:1fr 1fr;
    gap:10px;
}

.option{
    border:1px solid #dbe2ea;
    background:#f8fafc;
    border-radius:14px;
    padding:14px;
    text-align:left;
    cursor:pointer;
}

.option:active{
    transform:scale(.98);
}

.option-icon{
    font-size:23px;
    margin-bottom:6px;
}

.option-title{
    font-weight:bold;
    font-size:14px;
}

.option-text{
    font-size:11px;
    color:#6b7280;
    margin-top:4px;
}

.chat{
    max-height:50vh;
    overflow-y:auto;
    margin-bottom:10px;
}

.message{
    display:flex;
    margin-bottom:12px;
}

.user{
    justify-content:flex-end;
}

.bubble{
    max-width:90%;
    padding:12px 14px;
    border-radius:16px;
    font-size:14px;
    line-height:1.5;
    white-space:pre-wrap;
}

.assistant .bubble{
    background:white;
    border:1px solid #e5e7eb;
}

.user .bubble{
    background:#2563eb;
    color:white;
}

.error .bubble{
    background:#fee2e2;
    color:#991b1b;
    border:1px solid #fecaca;
}

.loading .bubble{
    background:white;
    border:1px solid #e5e7eb;
}

.composer{
    position:sticky;
    bottom:0;
    background:#f3f4f6;
    padding:8px 0 15px;
}

.input{
    background:white;
    border:1px solid #d1d5db;
    border-radius:16px;
    padding:8px;
    display:flex;
    gap:8px;
    align-items:flex-end;
}

textarea{
    flex:1;
    border:0;
    outline:none;
    resize:none;
    padding:10px;
    font-family:Arial,Helvetica,sans-serif;
    font-size:14px;
    min-height:44px;
    max-height:120px;
}

.send{
    width:46px;
    height:46px;
    border:0;
    border-radius:12px;
    background:#2563eb;
    color:white;
    font-size:20px;
    cursor:pointer;
}

.send:disabled{
    opacity:.5;
}

.status{
    text-align:center;
    font-size:11px;
    color:#6b7280;
    margin-top:7px;
}

@media(max-width:600px){

    .options{
        grid-template-columns:1fr;
    }

}

</style>

</head>


<body>


<header class="header">

<a href="index.html" class="back">
←
</a>

<div class="logo">
🤖
</div>

<div>

<h1>Asistente GESBASE</h1>

<p>Inteligencia artificial</p>

</div>

</header>


<main class="container">


<section class="card">

<h2>
Hola 👋
</h2>

<p>
Soy el asistente inteligente de GESBASE.
Elegí una opción o escribí tu consulta.
</p>


<div class="options-title">
¿Qué querés hacer?
</div>


<div class="options">


<button
class="option"
data-question="Hola"
>

<div class="option-icon">
👋
</div>

<div class="option-title">
Probar Gemini
</div>

<div class="option-text">
Comprobar que la IA responde.
</div>

</button>


<button
class="option"
data-question="Quiero analizar un presupuesto."
>

<div class="option-icon">
📊
</div>

<div class="option-title">
Analizar presupuesto
</div>

<div class="option-text">
Revisar costos y margen.
</div>

</button>


<button
class="option"
data-question="Quiero analizar un trabajo."
>

<div class="option-icon">
🔧
</div>

<div class="option-title">
Analizar trabajo
</div>

<div class="option-text">
Revisar resultado.
</div>

</button>


<button
class="option"
data-question="Quiero analizar mis gastos."
>

<div class="option-icon">
💸
</div>

<div class="option-title">
Analizar gastos
</div>

<div class="option-text">
Controlar costos.
</div>

</button>


<button
class="option"
data-question="Quiero analizar mis cobros."
>

<div class="option-icon">
🧾
</div>

<div class="option-title">
Analizar cobros
</div>

<div class="option-text">
Cobrado y pendiente.
</div>

</button>


<button
class="option"
data-question="Quiero analizar la rentabilidad."
>

<div class="option-icon">
💰
</div>

<div class="option-title">
Rentabilidad
</div>

<div class="option-text">
Resultado y margen.
</div>

</button>


<button
class="option"
data-question="Quiero un resumen de mi empresa."
>

<div class="option-icon">
📈
</div>

<div class="option-title">
Resumen empresa
</div>

<div class="option-text">
Situación general.
</div>

</button>


<button
class="option"
data-question="Quiero consultar empleados y fichajes."
>

<div class="option-icon">
👥
</div>

<div class="option-title">
Empleados
</div>

<div class="option-text">
Empleados y fichajes.
</div>

</button>


</div>

</section>


<section
id="chat"
class="chat"
>

<div class="message assistant">

<div class="bubble">

🤖 Hola. Soy el asistente de GESBASE.

Inicializando Gemini...

</div>

</div>

</section>


<section class="composer">

<div class="input">

<textarea
id="message"
placeholder="Escribí tu consulta..."
></textarea>

<button
id="send"
class="send"
type="button"
>
➤
</button>

</div>

<div
id="status"
class="status"
>
Inicializando...
</div>

</section>


</main>


<script type="module">


/*
==================================================
FIREBASE CONFIG
==================================================
*/

const firebaseConfig = {

    apiKey:
    "AIzaSyDDCQ7WhS9Gy8DwQGZ01VaFTmSgV2rjs9o",

    authDomain:
    "gesbase-4bf94.firebaseapp.com",

    projectId:
    "gesbase-4bf94",

    storageBucket:
    "gesbase-4bf94.firebasestorage.app",

    messagingSenderId:
    "64959778874",

    appId:
    "1:64959778874:web:c3bc129c3cee8cb77d6503",

    measurementId:
    "G-CCKGSRVGEX"

};


/*
==================================================
IMPORTACIONES FIREBASE
==================================================
*/

import {
    initializeApp
}
from
"https://www.gstatic.com/firebasejs/12.18.0/firebase-app.js";


import {
    initializeAppCheck,
    ReCaptchaEnterpriseProvider
}
from
"https://www.gstatic.com/firebasejs/12.18.0/firebase-app-check.js";


import {
    getAI,
    getGenerativeModel,
    GoogleAIBackend
}
from
"https://www.gstatic.com/firebasejs/12.18.0/firebase-ai.js";


/*
==================================================
RECAPTCHA
==================================================
*/

const RECAPTCHA_SITE_KEY =
"6LdysqEtAAAAAPPRcPrtI97fIaSbZ6UXclDtVBhJ";


/*
==================================================
ELEMENTOS
==================================================
*/

const chat =
document.getElementById("chat");

const message =
document.getElementById("message");

const send =
document.getElementById("send");

const status =
document.getElementById("status");


/*
==================================================
VARIABLE GEMINI
==================================================
*/

let model = null;


/*
==================================================
MOSTRAR MENSAJE
==================================================
*/

function mostrarMensaje(
    texto,
    tipo
){

    const fila =
    document.createElement("div");

    fila.className =
    "message " + tipo;


    const burbuja =
    document.createElement("div");

    burbuja.className =
    "bubble";


    burbuja.textContent =
    texto;


    fila.appendChild(
    burbuja
    );


    chat.appendChild(
    fila
    );


    chat.scrollTop =
    chat.scrollHeight;

}


/*
==================================================
CARGANDO
==================================================
*/

function mostrarCargando(){

    const fila =
    document.createElement("div");

    fila.id =
    "loadingMessage";

    fila.className =
    "message loading";


    const burbuja =
    document.createElement("div");

    burbuja.className =
    "bubble";

    burbuja.textContent =
    "🤖 Gemini está pensando...";


    fila.appendChild(
    burbuja
    );


    chat.appendChild(
    fila
    );


    chat.scrollTop =
    chat.scrollHeight;

}


function quitarCargando(){

    const elemento =
    document.getElementById(
        "loadingMessage"
    );


    if(elemento){

        elemento.remove();

    }

}


/*
==================================================
INICIALIZAR FIREBASE + GEMINI
==================================================
*/

async function iniciarIA(){

    try{

        status.textContent =
        "1/4 Iniciando Firebase...";


        const app =
        initializeApp(
            firebaseConfig
        );


        status.textContent =
        "2/4 Activando reCAPTCHA Enterprise...";


        initializeAppCheck(
            app,
            {
                provider:
                new ReCaptchaEnterpriseProvider(
                    RECAPTCHA_SITE_KEY
                ),

                isTokenAutoRefreshEnabled:
                true
            }
        );


        status.textContent =
        "3/4 Conectando Gemini Developer API...";


        const ai =
        getAI(
            app,
            {
                backend:
                new GoogleAIBackend()
            }
        );


        /*
        ==========================================
        MODELO GRATUITO
        ==========================================
        */

        model =
        getGenerativeModel(
            ai,
            {
                model:
                "gemini-2.5-flash",

                systemInstruction: `
Sos el asistente inteligente de GESBASE.

Respondé siempre en español.

Ayudás al usuario con:

presupuestos,
clientes,
trabajos,
materiales,
mano de obra,
viáticos,
gastos,
empleados,
fichajes,
facturas,
cobros,
saldos
y rentabilidad.

Sé claro, profesional y práctico.

No inventes información.

En esta versión todavía no tenés acceso
automático a los datos privados de Firestore.

No afirmes haber consultado datos de la empresa
si esos datos no fueron proporcionados.

`
            }
        );


        status.textContent =
        "4/4 Gemini conectado";


        mostrarMensaje(
            "✅ Gemini está conectado.\n\nEscribí Hola para probarlo.",
            "assistant"
        );


    }catch(error){

        console.error(
            "ERROR INICIALIZANDO GEMINI:",
            error
        );


        status.textContent =
        "❌ Error de inicialización";


        mostrarMensaje(
            "❌ Error al iniciar Gemini:\n\n" +
            error.message,
            "error"
        );

    }

}


/*
==================================================
ENVIAR CONSULTA
==================================================
*/

async function enviar(){

    const texto =
    message.value.trim();


    if(!texto){

        message.focus();

        return;

    }


    mostrarMensaje(
        texto,
        "user"
    );


    message.value =
    "";


    send.disabled =
    true;


    status.textContent =
    "Consultando Gemini...";


    mostrarCargando();


    try{

        if(!model){

            throw new Error(
                "El modelo Gemini no está inicializado."
            );

        }


        console.log(
            "Enviando consulta a Gemini..."
        );


        const resultado =
        await model.generateContent(
            texto
        );


        console.log(
            "Respuesta recibida:",
            resultado
        );


        quitarCargando();


        const respuesta =
        resultado.response.text();


        if(!respuesta){

            throw new Error(
                "Gemini devolvió una respuesta vacía."
            );

        }


        mostrarMensaje(
            respuesta,
            "assistant"
        );


        status.textContent =
        "GESBASE IA · Gemini";


    }catch(error){

        console.error(
            "ERROR CONSULTANDO GEMINI:",
            error
        );


        quitarCargando();


        mostrarMensaje(
            "❌ Error al consultar Gemini:\n\n" +
            error.message,
            "error"
        );


        status.textContent =
        "❌ Error de Gemini";

    }finally{

        send.disabled =
        false;

        message.focus();

    }

}


/*
==================================================
BOTÓN ENVIAR
==================================================
*/

send.addEventListener(
    "click",
    enviar
);


/*
==================================================
ENTER
==================================================
*/

message.addEventListener(
    "keydown",
    function(event){

        if(
            event.key === "Enter" &&
            !event.shiftKey
        ){

            event.preventDefault();

            enviar();

        }

    }
);


/*
==================================================
BOTONES
==================================================
*/

document
.querySelectorAll(".option")
.forEach(
    function(boton){

        boton.addEventListener(
            "click",
            function(){

                const pregunta =
                this.dataset.question;


                if(!pregunta){

                    message.focus();

                    return;

                }


                message.value =
                pregunta;


                enviar();

            }
        );

    }
);


/*
==================================================
INICIAR
==================================================
*/

iniciarIA();


</script>

</body>

</html>
