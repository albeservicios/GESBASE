<!DOCTYPE html><html lang="es-AR"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><meta name="theme-color" content="#111827"><title>Asistencia IA - GESBASE</title><style>

*{
    box-sizing:border-box;
    margin:0;
    padding:0;
}

body{
    font-family:Arial,Helvetica,sans-serif;
    background:#f3f4f6;
    color:#111827;
    min-height:100vh;
}

header{
    background:#111827;
    color:white;
    padding:18px;
    text-align:center;
}

header h1{
    font-size:22px;
}

header p{
    margin-top:5px;
    font-size:13px;
    opacity:.8;
}

.contenedor{
    width:100%;
    max-width:900px;
    margin:auto;
    padding:18px;
}

/* =========================
   IA
========================= */

.ia-box{
    background:white;
    border-radius:18px;
    padding:20px;
    box-shadow:0 5px 20px rgba(0,0,0,.08);
}

.ia-titulo{
    display:flex;
    align-items:center;
    gap:10px;
    font-size:20px;
    font-weight:bold;
    margin-bottom:15px;
}

.ia-status{
    display:none;
    margin-bottom:12px;
    padding:10px;
    border-radius:10px;
    background:#eef2ff;
    color:#3730a3;
    font-size:14px;
}

/* =========================
   CHAT
========================= */

.chat{
    display:flex;
    flex-direction:column;
    gap:12px;
    margin-bottom:15px;
    min-height:120px;
    max-height:500px;
    overflow-y:auto;
}

.mensaje{
    padding:13px 15px;
    border-radius:15px;
    line-height:1.5;
    font-size:15px;
    white-space:pre-wrap;
}

.mensaje.usuario{
    background:#111827;
    color:white;
    align-self:flex-end;
    max-width:85%;
    border-bottom-right-radius:4px;
}

.mensaje.ia{
    background:#f3f4f6;
    color:#111827;
    align-self:flex-start;
    max-width:90%;
    border-bottom-left-radius:4px;
}

.mensaje.sistema{
    background:#fff7ed;
    color:#9a3412;
    align-self:center;
    max-width:100%;
    font-size:13px;
}

/* =========================
   FORMULARIO
========================= */

.formulario{
    display:flex;
    gap:10px;
    align-items:flex-end;
}

textarea{
    flex:1;
    min-height:52px;
    max-height:140px;
    resize:vertical;
    border:1px solid #d1d5db;
    border-radius:12px;
    padding:13px;
    font-family:Arial,Helvetica,sans-serif;
    font-size:15px;
    outline:none;
}

textarea:focus{
    border-color:#111827;
}

button{
    border:none;
    border-radius:12px;
    padding:14px 18px;
    background:#111827;
    color:white;
    font-weight:bold;
    cursor:pointer;
    min-height:52px;
}

button:hover{
    opacity:.9;
}

button:disabled{
    opacity:.5;
    cursor:not-allowed;
}

/* =========================
   DATOS
========================= */

.info-usuario{
    display:none;
}

/* =========================
   ESTADO
========================= */

.error{
    background:#fee2e2;
    color:#991b1b;
}

.exito{
    background:#dcfce7;
    color:#166534;
}

@media(max-width:600px){

    .contenedor{
        padding:10px;
    }

    .ia-box{
        padding:14px;
        border-radius:14px;
    }

    .formulario{
        flex-direction:column;
    }

    textarea{
        width:100%;
    }

    button{
        width:100%;
    }

    .mensaje.usuario,
    .mensaje.ia{
        max-width:95%;
    }

}

</style></head><body><header><h1>🤖 Asistencia IA</h1>

<p>GESBASE</p>

</header><main class="contenedor"><section class="ia-box">

    <div class="ia-titulo">
        🤖 Asistente GESBASE
    </div>


    <!--
        IMPORTANTE:
        Este elemento NO muestra
        "Preparando información..."
        permanentemente.
    -->

    <div
        id="iaStatus"
        class="ia-status"
    ></div>


    <div
        id="chat"
        class="chat"
    ></div>


    <form
        id="formConsulta"
        class="formulario"
    >

        <textarea
            id="mensaje"
            placeholder="Escribí tu consulta..."
            autocomplete="off"
            required
        ></textarea>


        <button
            type="submit"
            id="btnEnviar"
        >
            📩 Enviar
        </button>

    </form>

</section>

</main><script type="module">

import {
    auth,
    db
} from "./firebase.js";

import {
    onAuthStateChanged
} from "https://www.gstatic.com/firebasejs/12.18.0/firebase-auth.js";

import {
    collection,
    query,
    where,
    getDocs,
    addDoc,
    serverTimestamp
} from "https://www.gstatic.com/firebasejs/12.18.0/firebase-firestore.js";


/* =====================================================
   ELEMENTOS
===================================================== */

const chat =
    document.getElementById("chat");

const formConsulta =
    document.getElementById("formConsulta");

const mensajeInput =
    document.getElementById("mensaje");

const btnEnviar =
    document.getElementById("btnEnviar");

const iaStatus =
    document.getElementById("iaStatus");


/* =====================================================
   VARIABLES
===================================================== */

let usuarioActual = null;

let empresaActual = "";

let datosEmpresa = {};

let datosUsuario = {};

let datosClientes = [];

let datosFacturas = [];

let datosCobros = [];

let datosTrabajos = [];

let datosPresupuestos = [];

let datosEmpleados = [];

let datosGastos = [];

let datosVentas = [];

let datosProductos = [];


/* =====================================================
   MENSAJES DEL CHAT
===================================================== */

function agregarMensaje(texto,tipo){

    const div =
        document.createElement("div");

    div.className =
        "mensaje " + tipo;

    div.textContent =
        texto;

    chat.appendChild(div);

    chat.scrollTop =
        chat.scrollHeight;

    return div;
}


/* =====================================================
   STATUS
===================================================== */

function mostrarStatus(texto){

    if(!texto){

        iaStatus.textContent = "";

        iaStatus.style.display =
            "none";

        return;

    }

    iaStatus.textContent =
        texto;

    iaStatus.style.display =
        "block";

}


function borrarStatus(){

    iaStatus.textContent =
        "";

    iaStatus.style.display =
        "none";

}


/* =====================================================
   OBTENER DATOS
===================================================== */

async function cargarDatos(){

    if(!usuarioActual){
        return;
    }


    const uid =
        usuarioActual.uid;


    try{

        /* =========================
           USUARIO
        ========================= */

        const qUsuario =
            query(
                collection(db,"usuarios"),
                where("uid","==",uid)
            );

        const snapUsuario =
            await getDocs(qUsuario);


        if(!snapUsuario.empty){

            datosUsuario =
                snapUsuario.docs[0].data();

            empresaActual =
                datosUsuario.empresaId ||
                "";

        }


        /* =========================
           EMPRESA
        ========================= */

        if(empresaActual){

            const qEmpresa =
                query(
                    collection(db,"empresas"),
                    where(
                        "uid",
                        "==",
                        empresaActual
                    )
                );

            const snapEmpresa =
                await getDocs(qEmpresa);

            if(!snapEmpresa.empty){

                datosEmpresa =
                    snapEmpresa.docs[0].data();

            }

        }


        /* =========================
           CLIENTES
        ========================= */

        datosClientes = [];

        const qClientes =
            query(
                collection(db,"clientes"),
                where(
                    "usuarioId",
                    "==",
                    uid
                )
            );

        const snapClientes =
            await getDocs(qClientes);

        snapClientes.forEach(doc => {

            datosClientes.push({
                id:doc.id,
                ...doc.data()
            });

        });


        /* =========================
           FACTURAS
        ========================= */

        datosFacturas = [];

        const qFacturas =
            query(
                collection(db,"facturas"),
                where(
                    "uid",
                    "==",
                    uid
                )
            );

        const snapFacturas =
            await getDocs(qFacturas);

        snapFacturas.forEach(doc => {

            datosFacturas.push({
                id:doc.id,
                ...doc.data()
            });

        });


        /* =========================
           COBROS
        ========================= */

        datosCobros = [];

        const qCobros =
            query(
                collection(db,"cobros"),
                where(
                    "usuarioId",
                    "==",
                    uid
                )
            );

        const snapCobros =
            await getDocs(qCobros);

        snapCobros.forEach(doc => {

            datosCobros.push({
                id:doc.id,
                ...doc.data()
            });

        });


        /* =========================
           TRABAJOS
        ========================= */

        datosTrabajos = [];

        const qTrabajos =
            query(
                collection(db,"trabajos"),
                where(
                    "usuarioId",
                    "==",
                    uid
                )
            );

        const snapTrabajos =
            await getDocs(qTrabajos);

        snapTrabajos.forEach(doc => {

            datosTrabajos.push({
                id:doc.id,
                ...doc.data()
            });

        });


        /* =========================
           PRESUPUESTOS
        ========================= */

        datosPresupuestos = [];

        const qPresupuestos =
            query(
                collection(db,"presupuestos"),
                where(
                    "uid",
                    "==",
                    uid
                )
            );

        const snapPresupuestos =
            await getDocs(qPresupuestos);

        snapPresupuestos.forEach(doc => {

            datosPresupuestos.push({
                id:doc.id,
                ...doc.data()
            });

        });


        /* =========================
           EMPLEADOS
        ========================= */

        datosEmpleados = [];

        const qEmpleados =
            query(
                collection(db,"empleados"),
                where(
                    "uid",
                    "==",
                    uid
                )
            );

        const snapEmpleados =
            await getDocs(qEmpleados);

        snapEmpleados.forEach(doc => {

            datosEmpleados.push({
                id:doc.id,
                ...doc.data()
            });

        });


        /* =========================
           GASTOS
        ========================= */

        datosGastos = [];

        const qGastos =
            query(
                collection(db,"gastos"),
                where(
                    "usuarioId",
                    "==",
                    uid
                )
            );

        const snapGastos =
            await getDocs(qGastos);

        snapGastos.forEach(doc => {

            datosGastos.push({
                id:doc.id,
                ...doc.data()
            });

        });


        /* =========================
           VENTAS
        ========================= */

        datosVentas = [];

        const qVentas =
            query(
                collection(db,"ventas"),
                where(
                    "propietarioId",
                    "==",
                    uid
                )
            );

        const snapVentas =
            await getDocs(qVentas);

        snapVentas.forEach(doc => {

            datosVentas.push({
                id:doc.id,
                ...doc.data()
            });

        });


        /* =========================
           PRODUCTOS
        ========================= */

        datosProductos = [];

        const qProductos =
            query(
                collection(db,"productos"),
                where(
                    "propietarioId",
                    "==",
                    uid
                )
            );

        const snapProductos =
            await getDocs(qProductos);

        snapProductos.forEach(doc => {

            datosProductos.push({
                id:doc.id,
                ...doc.data()
            });

        });


    }catch(error){

        console.error(
            "Error cargando datos:",
            error
        );

    }

}


/* =====================================================
   FORMATEAR DATOS PARA IA
===================================================== */

function prepararContexto(){

    return {

        usuario:{
            uid:usuarioActual?.uid || "",
            email:usuarioActual?.email || "",
            ...datosUsuario
        },

        empresa:datosEmpresa,

        clientes:datosClientes,

        facturas:datosFacturas,

        cobros:datosCobros,

        trabajos:datosTrabajos,

        presupuestos:datosPresupuestos,

        empleados:datosEmpleados,

        gastos:datosGastos,

        ventas:datosVentas,

        productos:datosProductos

    };

}


/* =====================================================
   RESPUESTAS LOCALES DE LA IA
===================================================== */

function responderConsulta(texto){

    const pregunta =
        texto
        .toLowerCase()
        .trim();


    /* =========================
       CLIENTES
    ========================= */

    if(
        pregunta.includes("qué clientes") ||
        pregunta.includes("que clientes") ||
        pregunta.includes("mis clientes") ||
        pregunta.includes("clientes tengo")
    ){

        if(!datosClientes.length){

            return "No encontré clientes registrados para tu usuario.";

        }


        const nombres =
            datosClientes
            .map(c =>
                c.nombre ||
                c.razonSocial ||
                c.cliente ||
                "Sin nombre"
            );


        return (
            "Tenés " +
            nombres.length +
            " cliente(s) registrado(s):\n\n" +
            nombres
            .map((n,i)=>
                (i+1) + ". " + n
            )
            .join("\n")
        );

    }


    /* =========================
       FACTURACIÓN
    ========================= */

    if(
        pregunta.includes("factur") ||
        pregunta.includes("facturas") ||
        pregunta.includes("facturado")
    ){

        if(!datosFacturas.length){

            return "No encontré facturas registradas en GESBASE para tu usuario.";

        }


        let total = 0;

        datosFacturas.forEach(f => {

            total +=
                Number(f.importe || 0);

        });


        return (
            "Encontré " +
            datosFacturas.length +
            " factura(s).\n\n" +
            "Total registrado: $" +
            total.toLocaleString("es-AR")
        );

    }


    /* =========================
       COBROS
    ========================= */

    if(
        pregunta.includes("cobro") ||
        pregunta.includes("cobrado") ||
        pregunta.includes("cobros")
    ){

        if(!datosCobros.length){

            return "No encontré cobros registrados en GESBASE.";

        }


        let total = 0;

        datosCobros.forEach(c => {

            total +=
                Number(c.importe || 0);

        });


        return (
            "Encontré " +
            datosCobros.length +
            " registro(s) de cobros.\n\n" +
            "Importe total registrado: $" +
            total.toLocaleString("es-AR")
        );

    }


    /* =========================
       TRABAJOS
    ========================= */

    if(
        pregunta.includes("trabajo") ||
        pregunta.includes("trabajos")
    ){

        if(!datosTrabajos.length){

            return "No encontré trabajos registrados.";

        }


        return (
            "Tenés " +
            datosTrabajos.length +
            " trabajo(s) registrado(s) en GESBASE."
        );

    }


    /* =========================
       EMPLEADOS
    ========================= */

    if(
        pregunta.includes("empleado") ||
        pregunta.includes("empleados")
    ){

        if(!datosEmpleados.length){

            return "No encontré empleados registrados.";

        }


        const nombres =
            datosEmpleados.map(e =>
                (
                    e.nombre || ""
                ) +
                " " +
                (
                    e.apellido || ""
                )
            ).map(n => n.trim());


        return (
            "Tenés " +
            nombres.length +
            " empleado(s):\n\n" +
            nombres.join("\n")
        );

    }


    /* =========================
       PRODUCTOS
    ========================= */

    if(
        pregunta.includes("producto") ||
        pregunta.includes("stock")
    ){

        if(!datosProductos.length){

            return "No encontré productos registrados.";

        }


        return (
            "Tenés " +
            datosProductos.length +
            " producto(s) registrados en GESBASE."
        );

    }


    /* =========================
       VENTAS
    ========================= */

    if(
        pregunta.includes("venta") ||
        pregunta.includes("ventas")
    ){

        if(!datosVentas.length){

            return "No encontré ventas registradas.";

        }


        let total = 0;

        datosVentas.forEach(v => {

            total +=
                Number(v.total || 0);

        });


        return (
            "Encontré " +
            datosVentas.length +
            " venta(s).\n\n" +
            "Total registrado: $" +
            total.toLocaleString("es-AR")
        );

    }


    /* =========================
       GASTOS
    ========================= */

    if(
        pregunta.includes("gasto") ||
        pregunta.includes("gastos")
    ){

        if(!datosGastos.length){

            return "No encontré gastos registrados.";

        }


        let total = 0;

        datosGastos.forEach(g => {

            total +=
                Number(g.importe || 0);

        });


        return (
            "Encontré " +
            datosGastos.length +
            " gasto(s).\n\n" +
            "Total registrado: $" +
            total.toLocaleString("es-AR")
        );

    }


    /* =========================
       EMPRESA
    ========================= */

    if(
        pregunta.includes("mi empresa") ||
        pregunta.includes("empresa")
    ){

        return (
            "Empresa: " +
            (
                datosEmpresa.nombreEmpresa ||
                datosEmpresa.razonSocial ||
                datosEmpresa.nombre ||
                "No especificada"
            )
        );

    }


    return null;

}


/* =====================================================
   ENVIAR CONSULTA
===================================================== */

formConsulta.addEventListener(
    "submit",
    async function(event){

        event.preventDefault();


        const texto =
            mensajeInput.value.trim();


        if(!texto){
            return;
        }


        if(!usuarioActual){

            agregarMensaje(
                "No hay una sesión activa.",
                "sistema"
            );

            return;

        }


        /* =========================
           MOSTRAR MENSAJE USUARIO
        ========================= */

        agregarMensaje(
            texto,
            "usuario"
        );


        /* =========================
           LIMPIAR INPUT INMEDIATAMENTE
        ========================= */

        mensajeInput.value = "";


        btnEnviar.disabled =
            true;

        btnEnviar.textContent =
            "Procesando...";


        /*
         * MUY IMPORTANTE:
         * se elimina el mensaje de estado
         * anterior.
         */

        borrarStatus();


        try{

            /*
             * Primero intentamos responder
             * usando los datos reales de GESBASE.
             */

            let respuesta =
                responderConsulta(texto);


            /*
             * Si la consulta no coincide
             * con las respuestas automáticas,
             * guardamos la consulta para
             * asistencia.
             */

            if(!respuesta){

                await addDoc(
                    collection(
                        db,
                        "consultas"
                    ),
                    {

                        usuarioId:
                            usuarioActual.uid,

                        empresaId:
                            empresaActual || "",

                        nombre:
                            datosUsuario.nombre ||
                            usuarioActual.displayName ||
                            "",

                        email:
                            usuarioActual.email ||
                            "",

                        categoria:
                            "Consulta sobre GESBASE",

                        asunto:
                            texto.substring(
                                0,
                                80
                            ),

                        mensaje:
                            texto,

                        estado:
                            "pendiente",

                        prioridad:
                            "normal",

                        fechaCreacion:
                            serverTimestamp(),

                        fechaActualizacion:
                            serverTimestamp(),

                        ultimaRespuesta:
                            ""

                    }
                );


                respuesta =
                    "Recibí tu consulta y la envié a asistencia de GESBASE. Te responderán desde el sistema.";

            }


            /*
             * Mostrar respuesta IA
             */

            agregarMensaje(
                respuesta,
                "ia"
            );


        }catch(error){

            console.error(
                "ERROR:",
                error
            );


            agregarMensaje(
                "No pude procesar la consulta. Intentá nuevamente.",
                "sistema"
            );

        }finally{

            /*
             * BORRAR CUALQUIER MENSAJE
             * DE CARGA
             */

            borrarStatus();


            btnEnviar.disabled =
                false;

            btnEnviar.textContent =
                "📩 Enviar";

        }

    }
);


/* =====================================================
   AUTENTICACIÓN
===================================================== */

onAuthStateChanged(
    auth,
    async function(user){

        if(!user){

            usuarioActual =
                null;

            borrarStatus();

            chat.innerHTML = "";

            agregarMensaje(
                "No hay una sesión activa de GESBASE.",
                "sistema"
            );

            return;

        }


        usuarioActual =
            user;


        /*
         * NO mostramos:
         * "Usuario Cargando..."
         * "Preparando información..."
         *
         * La pantalla queda directamente
         * preparada para usar la IA.
         */


        borrarStatus();


        try{

            await cargarDatos();

        }catch(error){

            console.error(
                error
            );

        }


        /*
         * Después de cargar todos los datos,
         * nuevamente eliminamos cualquier
         * mensaje de carga.
         */

        borrarStatus();


        /*
         * MENSAJE INICIAL DE LA IA
         */

        if(
            chat.children.length === 0
        ){

            agregarMensaje(
                "Hola 👋 Soy la asistencia inteligente de GESBASE. Preguntame por tus clientes, facturas, cobros, trabajos, empleados, gastos, ventas, productos o cualquier información disponible en tu sistema.",
                "ia"
            );

        }

    }
);

</script></body></html>
