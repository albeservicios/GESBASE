</main></div><script type="module">

/* ==========================================
   FIREBASE
========================================== */

import {
    auth,
    db
} from "./Js/firebase.js";

import {
    onAuthStateChanged
} from "https://www.gstatic.com/firebasejs/12.1.0/firebase-auth.js";

import {
    collection,
    getDocs,
    doc,
    getDoc,
    updateDoc,
    serverTimestamp
} from "https://www.gstatic.com/firebasejs/12.1.0/firebase-firestore.js";


/* ==========================================
   CONFIGURACIÓN PANEL PRIVADO
========================================== */

const EMAIL_JULIAN =
"julianbattauz006@gmail.com";


/* ==========================================
   ELEMENTOS
========================================== */

const estado =
document.getElementById("estado");

const panelPrivado =
document.getElementById("panelPrivado");

const empresaNombre =
document.getElementById("empresaNombre");

const empresaCuit =
document.getElementById("empresaCuit");

const empresaTelefono =
document.getElementById("empresaTelefono");

const empresaEmail =
document.getElementById("empresaEmail");

const clienteSeleccionado =
document.getElementById("clienteSeleccionado");

const clienteInfo =
document.getElementById("clienteInfo");

const clienteManual =
document.getElementById("clienteManual");

const clienteManualNombre =
document.getElementById("clienteManualNombre");

const clienteCuit =
document.getElementById("clienteCuit");

const clienteTelefono =
document.getElementById("clienteTelefono");

const clienteEmail =
document.getElementById("clienteEmail");

const clienteDireccion =
document.getElementById("clienteDireccion");

const clienteLocalidad =
document.getElementById("clienteLocalidad");

const numeroAgenda =
document.getElementById("numeroAgenda");

const fecha =
document.getElementById("fecha");

const lugarTrabajo =
document.getElementById("lugarTrabajo");

const descripcion =
document.getElementById("descripcion");

const listaMateriales =
document.getElementById("listaMateriales");

const btnAgregar =
document.getElementById("btnAgregar");

const materiales =
document.getElementById("materiales");

const manoObra =
document.getElementById("manoObra");

const viaticos =
document.getElementById("viaticos");

const flete =
document.getElementById("flete");

const resumenMateriales =
document.getElementById("resumenMateriales");

const resumenManoObra =
document.getElementById("resumenManoObra");

const resumenViaticos =
document.getElementById("resumenViaticos");

const resumenFlete =
document.getElementById("resumenFlete");

const total =
document.getElementById("total");

const btnGuardar =
document.getElementById("btnGuardar");

const btnVolver =
document.getElementById("btnVolver");


/* ==========================================
   VARIABLES
========================================== */

let usuarioActual = null;

let presupuestoActual = null;

let clientes = [];


/* ==========================================
   ID PRESUPUESTO
========================================== */

const parametros =
new URLSearchParams(
    window.location.search
);

const presupuestoId =
parametros.get("id");


/* ==========================================
   ESTADO
========================================== */

function mostrarEstado(
    texto,
    tipo
){

    estado.textContent =
    texto;

    estado.className =
    "estado estado-" +
    tipo;

}


/* ==========================================
   DINERO
========================================== */

function dinero(valor){

    return Number(
        valor || 0
    ).toLocaleString(
        "es-AR",
        {
            minimumFractionDigits:2,
            maximumFractionDigits:2
        }
    );

}


/* ==========================================
   TOTAL
========================================== */

function calcularTotal(){

    const m =
    Number(materiales.value) || 0;

    const mo =
    Number(manoObra.value) || 0;

    const v =
    Number(viaticos.value) || 0;

    const f =
    Number(flete.value) || 0;

    const resultado =
    m + mo + v + f;

    resumenMateriales.textContent =
    dinero(m);

    resumenManoObra.textContent =
    dinero(mo);

    resumenViaticos.textContent =
    dinero(v);

    resumenFlete.textContent =
    dinero(f);

    total.textContent =
    dinero(resultado);

    return resultado;

}


materiales.addEventListener(
    "input",
    calcularTotal
);

manoObra.addEventListener(
    "input",
    calcularTotal
);

viaticos.addEventListener(
    "input",
    calcularTotal
);

flete.addEventListener(
    "input",
    calcularTotal
);


/* ==========================================
   AGREGAR MATERIAL
========================================== */

function agregarMaterial(
    tipo = "",
    cantidad = ""
){

    const fila =
    document.createElement("div");

    fila.className =
    "material-item";


    const inputTipo =
    document.createElement("input");

    inputTipo.type =
    "text";

    inputTipo.className =
    "material-tipo";

    inputTipo.placeholder =
    "Tipo de material";

    inputTipo.value =
    tipo;


    const inputCantidad =
    document.createElement("input");

    inputCantidad.type =
    "number";

    inputCantidad.className =
    "material-cantidad";

    inputCantidad.placeholder =
    "Cantidad";

    inputCantidad.min =
    "0";

    inputCantidad.step =
    "1";

    inputCantidad.value =
    cantidad;


    const boton =
    document.createElement("button");

    boton.type =
    "button";

    boton.className =
    "btn-quitar";

    boton.textContent =
    "×";


    boton.addEventListener(
        "click",
        function(){

            fila.remove();

        }
    );


    fila.appendChild(
        inputTipo
    );

    fila.appendChild(
        inputCantidad
    );

    fila.appendChild(
        boton
    );


    listaMateriales.appendChild(
        fila
    );

}


btnAgregar.addEventListener(
    "click",
    function(){

        agregarMaterial();

    }
);


/* ==========================================
   OBTENER MATERIALES
========================================== */

function obtenerMateriales(){

    const filas =
    listaMateriales.querySelectorAll(
        ".material-item"
    );

    const lista = [];


    filas.forEach(
        function(fila){

            const tipo =
            fila.querySelector(
                ".material-tipo"
            ).value.trim();


            const cantidad =
            Number(
                fila.querySelector(
                    ".material-cantidad"
                ).value
            ) || 0;


            if(tipo){

                lista.push({

                    tipo: tipo,

                    cantidad: cantidad

                });

            }

        }
    );


    return lista;

}


/* ==========================================
   NOMBRE CLIENTE
========================================== */

function obtenerNombreCliente(
    datos
){

    return (
        datos.nombre ||
        datos.empresa ||
        datos.razonSocial ||
        datos.razon_social ||
        "Cliente sin nombre"
    );

}


/* ==========================================
   MOSTRAR CLIENTE
========================================== */

function mostrarCliente(
    datos
){

    clienteCuit.textContent =
    datos.cuit || "-";

    clienteTelefono.textContent =
    datos.telefono || "-";

    clienteEmail.textContent =
    datos.email || "-";

    clienteDireccion.textContent =
    datos.direccion || "-";


    const localidad =
    datos.localidad || "";

    const provincia =
    datos.provincia || "";


    clienteLocalidad.textContent =
    localidad +
    (
        localidad && provincia
        ? ", "
        : ""
    ) +
    provincia;


    clienteInfo.style.display =
    "block";

}


/* ==========================================
   CARGAR CLIENTES
========================================== */

async function cargarClientes(){

    clientes = [];


    const snapshot =
    await getDocs(
        collection(
            db,
            "clientes"
        )
    );


    snapshot.forEach(
        function(documento){

            const datos =
            documento.data();


            /*
             * Se aceptan las estructuras
             * utilizadas actualmente en GESBASE.
             */

            const pertenece =
            datos.uid === usuarioActual.uid
            ||
            datos.usuarioId === usuarioActual.uid
            ||
            datos.userId === usuarioActual.uid
            ||
            datos.empresaId === usuarioActual.uid;


            if(!pertenece){

                return;

            }


            clientes.push({

                id:
                documento.id,

                datos:
                datos

            });

        }
    );


    clientes.sort(
        function(a,b){

            return obtenerNombreCliente(
                a.datos
            ).localeCompare(
                obtenerNombreCliente(
                    b.datos
                ),
                "es"
            );

        }
    );


    clienteSeleccionado.innerHTML =
    "";


    const inicial =
    document.createElement(
        "option"
    );

    inicial.value =
    "";

    inicial.textContent =
    "Seleccionar cliente...";

    clienteSeleccionado.appendChild(
        inicial
    );


    clientes.forEach(
        function(item){

            const opcion =
            document.createElement(
                "option"
            );

            opcion.value =
            item.id;

            opcion.textContent =
            obtenerNombreCliente(
                item.datos
            );

            clienteSeleccionado.appendChild(
                opcion
            );

        }
    );


    const manual =
    document.createElement(
        "option"
    );

    manual.value =
    "__manual__";

    manual.textContent =
    "✏️ Ingresar cliente manualmente";

    clienteSeleccionado.appendChild(
        manual
    );

}


/* ==========================================
   CAMBIO CLIENTE
========================================== */

clienteSeleccionado.addEventListener(
    "change",
    function(){

        const id =
        clienteSeleccionado.value;


        clienteInfo.style.display =
        "none";

        clienteManual.style.display =
        "none";


        if(
            id === "__manual__"
        ){

            clienteManual.style.display =
            "block";

            clienteManualNombre.focus();

            return;

        }


        const encontrado =
        clientes.find(
            function(item){

                return item.id === id;

            }
        );


        if(!encontrado){

            return;

        }


        mostrarCliente(
            encontrado.datos
        );

    }
);


/* ==========================================
   PROPIETARIO
========================================== */

function perteneceAlUsuario(
    datos
){

    if(!usuarioActual){

        return false;

    }


    const uid =
    usuarioActual.uid;


    /*
     * UID directo
     */

    if(
        datos.uid &&
        datos.uid === uid
    ){

        return true;

    }


    /*
     * usuarioId
     */

    if(
        datos.usuarioId &&
        datos.usuarioId === uid
    ){

        return true;

    }


    /*
     * userId
     */

    if(
        datos.userId &&
        datos.userId === uid
    ){

        return true;

    }


    /*
     * empresaId.
     *
     * Se mantiene porque algunas
     * estructuras anteriores de GESBASE
     * guardan el UID de la empresa aquí.
     */

    if(
        datos.empresaId &&
        datos.empresaId === uid
    ){

        return true;

    }


    /*
     * Para el panel privado de Julián,
     * si el documento no tiene propietario
     * pero la cuenta autenticada es la cuenta
     * privada de administración, permitimos
     * la visualización.
     */

    if(
        usuarioActual.email &&
        usuarioActual.email.toLowerCase() ===
        EMAIL_JULIAN.toLowerCase()
    ){

        return true;

    }


    return false;

}


/* ==========================================
   CARGAR PRESUPUESTO
========================================== */

async function cargarPresupuesto(){

    if(!presupuestoId){

        mostrarEstado(
            "No se indicó el ID del presupuesto.",
            "error"
        );

        return false;

    }


    const referencia =
    doc(
        db,
        "presupuestos",
        presupuestoId
    );


    const documento =
    await getDoc(
        referencia
    );


    if(!documento.exists()){

        mostrarEstado(
            "El presupuesto no existe.",
            "error"
        );

        return false;

    }


    const datos =
    documento.data();


    if(
        !perteneceAlUsuario(datos)
    ){

        mostrarEstado(
            "No tenés permiso para editar este presupuesto.",
            "error"
        );

        return false;

    }


    presupuestoActual =
    datos;


    /*
     * PANEL PRIVADO
     */

    if(
        usuarioActual.email &&
        usuarioActual.email.toLowerCase() ===
        EMAIL_JULIAN.toLowerCase()
    ){

        panelPrivado.style.display =
        "block";

    }


    /*
     * EMPRESA
     */

    empresaNombre.textContent =
    datos.empresaNombre ||
    datos.empresa ||
    "Sin informar";


    empresaCuit.textContent =
    datos.empresaCuit ||
    datos.cuitEmpresa ||
    datos.cuit ||
    "-";


    empresaTelefono.textContent =
    datos.empresaTelefono ||
    datos.telefonoEmpresa ||
    datos.telefono ||
    "-";


    empresaEmail.textContent =
    datos.empresaEmail ||
    datos.emailEmpresa ||
    datos.email ||
    usuarioActual.email ||
    "-";


    /*
     * DATOS GENERALES
     */

    numeroAgenda.value =
    datos.numeroAgenda ||
    datos.agendaNumero ||
    datos.numero ||
    "";


    fecha.value =
    datos.fecha ||
    "";


    lugarTrabajo.value =
    datos.lugarTrabajo ||
    datos.lugar ||
    "";


    descripcion.value =
    datos.descripcion ||
    datos.tareas ||
    datos.concepto ||
    "";


    /*
     * IMPORTES
     */

    materiales.value =
    Number(
        datos.materiales ||
        datos.importeMaterial ||
        0
    );


    manoObra.value =
    Number(
        datos.manoObra ||
        datos.importeManoObra ||
        0
    );


    viaticos.value =
    Number(
        datos.viaticos ||
        datos.importeViaticos ||
        0
    );


    flete.value =
    Number(
        datos.flete ||
        datos.importeFlete ||
        0
    );


    /*
     * MATERIALES
     */

    listaMateriales.innerHTML =
    "";


    if(
        Array.isArray(
            datos.materialesLista
        )
    ){

        datos.materialesLista.forEach(
            function(material){

                agregarMaterial(

                    material?.tipo ||
                    material?.nombre ||
                    material?.descripcion ||
                    "",

                    material?.cantidad ??
                    ""

                );

            }
        );

    }


    /*
     * CLIENTE
     */

    const clienteId =
    datos.clienteId ||
    datos.idCliente ||
    datos.clienteID ||
    "";


    if(clienteId){

        const encontrado =
        clientes.find(
            function(item){

                return item.id ===
                clienteId;

            }
        );


        if(encontrado){

            clienteSeleccionado.value =
            clienteId;

            mostrarCliente(
                encontrado.datos
            );

        }
        else{

            clienteSeleccionado.value =
            "__manual__";

            clienteManual.style.display =
            "block";

            clienteManualNombre.value =
            datos.cliente ||
            datos.clienteNombre ||
            datos.nombreCliente ||
            "";

        }

    }
    else{

        clienteSeleccionado.value =
        "__manual__";

        clienteManual.style.display =
        "block";

        clienteManualNombre.value =
        datos.cliente ||
        datos.clienteNombre ||
        datos.nombreCliente ||
        "";

    }


    calcularTotal();


    mostrarEstado(
        "Presupuesto cargado correctamente.",
        "exito"
    );


    return true;

}


/* ==========================================
   GUARDAR
========================================== */

btnGuardar.addEventListener(
    "click",
    async function(){

        if(!usuarioActual){

            mostrarEstado(
                "No hay una sesión activa.",
                "error"
            );

            return;

        }


        if(!presupuestoActual){

            mostrarEstado(
                "Todavía no se cargó el presupuesto.",
                "error"
            );

            return;

        }


        let datosCliente = null;

        let clienteId = "";


        /*
         * CLIENTE REGISTRADO
         */

        if(
            clienteSeleccionado.value &&
            clienteSeleccionado.value !==
            "__manual__"
        ){

            const encontrado =
            clientes.find(
                function(item){

                    return item.id ===
                    clienteSeleccionado.value;

                }
            );


            if(!encontrado){

                mostrarEstado(
                    "No se encontró el cliente seleccionado.",
                    "error"
                );

                return;

            }


            datosCliente =
            encontrado.datos;

            clienteId =
            encontrado.id;

        }


        /*
         * CLIENTE MANUAL
         */

        else if(
            clienteSeleccionado.value ===
            "__manual__"
        ){

            const nombre =
            clienteManualNombre.value.trim();


            if(!nombre){

                mostrarEstado(
                    "Ingresá el nombre del cliente.",
                    "error"
                );

                clienteManualNombre.focus();

                return;

            }


            datosCliente = {

                nombre:
                nombre,

                cuit:
                "",

                telefono:
                "",

                email:
                "",

                direccion:
                "",

                localidad:
                "",

                provincia:
                ""

            };

        }


        else{

            mostrarEstado(
                "Seleccioná un cliente.",
                "error"
            );

            return;

        }


        /*
         * VALIDACIONES
         */

        if(!fecha.value){

            mostrarEstado(
                "Ingresá la fecha.",
                "error"
            );

            fecha.focus();

            return;

        }


        if(
            !lugarTrabajo.value.trim()
        ){

            mostrarEstado(
                "Ingresá el lugar de trabajo.",
                "error"
            );

            lugarTrabajo.focus();

            return;

        }


        if(
            !descripcion.value.trim()
        ){

            mostrarEstado(
                "Ingresá la descripción del trabajo.",
                "error"
            );

            descripcion.focus();

            return;

        }


        const valorMateriales =
        Number(
            materiales.value
        ) || 0;


        const valorManoObra =
        Number(
            manoObra.value
        ) || 0;


        const valorViaticos =
        Number(
            viaticos.value
        ) || 0;


        const valorFlete =
        Number(
            flete.value
        ) || 0;


        const materialesLista =
        obtenerMateriales();


        const totalGeneral =
        valorMateriales +
        valorManoObra +
        valorViaticos +
        valorFlete;


        /*
         * GUARDANDO
         */

        btnGuardar.disabled =
        true;

        btnGuardar.textContent =
        "⏳ Guardando cambios...";


        try{

            const referencia =
            doc(
                db,
                "presupuestos",
                presupuestoId
            );


            /*
             * COMPROBACIÓN FINAL
             */

            const comprobacion =
            await getDoc(
                referencia
            );


            if(!comprobacion.exists()){

                throw new Error(
                    "El presupuesto ya no existe."
                );

            }


            const datosActuales =
            comprobacion.data();


            if(
                !perteneceAlUsuario(
                    datosActuales
                )
            ){

                throw new Error(
                    "No tenés permiso para modificar este presupuesto."
                );

            }


            await updateDoc(
                referencia,
                {

                    clienteId:
                    clienteId,

                    cliente:
                    datosCliente.nombre ||
                    datosCliente.empresa ||
                    datosCliente.razonSocial ||
                    datosCliente.razon_social ||
                    "",

                    clienteCuit:
                    datosCliente.cuit ||
                    "",

                    clienteTelefono:
                    datosCliente.telefono ||
                    "",

                    clienteEmail:
                    datosCliente.email ||
                    "",

                    clienteDireccion:
                    datosCliente.direccion ||
                    "",

                    clienteLocalidad:
                    datosCliente.localidad ||
                    "",

                    clienteProvincia:
                    datosCliente.provincia ||
                    "",

                    numeroAgenda:
                    numeroAgenda.value.trim(),

                    fecha:
                    fecha.value,

                    lugarTrabajo:
                    lugarTrabajo.value.trim(),

                    descripcion:
                    descripcion.value.trim(),

                    materialesLista:
                    materialesLista,

                    materiales:
                    valorMateriales,

                    manoObra:
                    valorManoObra,

                    viaticos:
                    valorViaticos,

                    flete:
                    valorFlete,

                    total:
                    totalGeneral,

                    actualizado:
                    serverTimestamp()

                }
            );


            presupuestoActual = {

                ...datosActuales,

                clienteId:
                clienteId,

                cliente:
                datosCliente.nombre ||
                datosCliente.empresa ||
                datosCliente.razonSocial ||
                datosCliente.razon_social ||
                "",

                clienteCuit:
                datosCliente.cuit || "",

                clienteTelefono:
                datosCliente.telefono || "",

                clienteEmail:
                datosCliente.email || "",

                clienteDireccion:
                datosCliente.direccion || "",

                clienteLocalidad:
                datosCliente.localidad || "",

                clienteProvincia:
                datosCliente.provincia || "",

                numeroAgenda:
                numeroAgenda.value.trim(),

                fecha:
                fecha.value,

                lugarTrabajo:
                lugarTrabajo.value.trim(),

                descripcion:
                descripcion.value.trim(),

                materialesLista:
                materialesLista,

                materiales:
                valorMateriales,

                manoObra:
                valorManoObra,

                viaticos:
                valorViaticos,

                flete:
                valorFlete,

                total:
                totalGeneral

            };


            calcularTotal();


            mostrarEstado(
                "✅ Presupuesto actualizado correctamente.",
                "exito"
            );


            btnGuardar.textContent =
            "✅ Cambios guardados";


            setTimeout(
                function(){

                    window.location.href =
                    "presupuestos.html";

                },
                1000
            );

        }
        catch(error){

            console.error(
                "Error actualizando presupuesto:",
                error
            );


            mostrarEstado(
                "No se pudo actualizar el presupuesto: " +
                error.message,
                "error"
            );


            btnGuardar.disabled =
            false;

            btnGuardar.textContent =
            "💾 Guardar cambios";

        }

    }
);

========================================== */

let inicioCompletado =
false;


onAuthStateChanged(
    auth,
    async function(usuario){

        if(inicioCompletado){

            return;

        }


        if(!usuario){

            mostrarEstado(
                "No hay una sesión activa. Redirigiendo al inicio de sesión...",
                "error"
            );


            setTimeout(
                function(){

                    window.location.replace(
                        "login.html"
                    );

                },
                1200
            );


            return;

        }


        inicioCompletado =
        true;


        usuarioActual =
        usuario;


        console.log(
            "Usuario autenticado:",
            usuario.uid
        );

        console.log(
            "Correo:",
            usuario.email
        );


        try{

            /*
             * Cargamos clientes primero.
             */

            await cargarClientes();


            /*
             * Después cargamos el presupuesto.
             */

            await cargarPresupuesto();

        }
        catch(error){

            console.error(
                "Error inicializando editar presupuesto:",
                error
            );


            mostrarEstado(
                "Error cargando el módulo: " +
                error.message,
                "error"
            );

        }

    }
);
