<!DOCTYPE html>
<html lang="es">

<head>

<meta charset="UTF-8">

<meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
>

<meta
    name="theme-color"
    content="#111827"
>

<title>Ver presupuesto - GESBASE</title>


<style>

* {
    box-sizing: border-box;
    margin: 0;
    padding: 0;
}


body {
    font-family: Arial, sans-serif;
    background: #f3f4f6;
    color: #111827;
}


.contenedor {
    max-width: 700px;
    margin: auto;
    min-height: 100vh;
    background: white;
}


header {
    background: #111827;
    color: white;
    padding: 25px 20px;
}


header h1 {
    font-size: 25px;
}


header p {
    margin-top: 6px;
    color: #d1d5db;
    font-size: 14px;
}


main {
    padding: 20px;
}


.presupuesto {
    border: 1px solid #d1d5db;
    border-radius: 14px;
    padding: 22px;
    background: white;
}


.titulo {
    font-size: 22px;
    font-weight: bold;
    margin-bottom: 20px;
}


.numero {
    color: #6b7280;
    font-size: 14px;
    font-weight: bold;
    margin-bottom: 15px;
}


.fila {
    padding: 10px 0;
    border-bottom: 1px solid #e5e7eb;
}


.etiqueta {
    font-size: 13px;
    color: #6b7280;
    margin-bottom: 4px;
}


.valor {
    font-size: 16px;
    font-weight: bold;
}


.descripcion {
    line-height: 1.5;
    font-weight: normal;
}


.total {
    margin-top: 20px;
    padding: 18px;
    background: #f3f4f6;
    border-radius: 10px;
    font-size: 23px;
    font-weight: bold;
    text-align: right;
}


/* =====================================
   BOTONES
===================================== */

button,
.boton {
    display: block;
    width: 100%;
    padding: 15px;
    border: none;
    border-radius: 10px;
    font-size: 16px;
    font-weight: bold;
    text-align: center;
    text-decoration: none;
    cursor: pointer;
    margin-top: 12px;
}


.pdf {
    background: #dc2626;
    color: white;
}


.editar {
    background: #2563eb;
    color: white;
}


.volver {
    background: #e5e7eb;
    color: #111827;
}


.cargando {
    text-align: center;
    padding: 40px;
    color: #6b7280;
}


.error {
    background: #fee2e2;
    color: #991b1b;
    padding: 15px;
    border-radius: 10px;
}


/* =====================================
   PDF
===================================== */

.pdf-area {
    background: white;
}

</style>

</head>


<body>


<div class="contenedor">


<header>

<h1>
GESBASE
</h1>

<p>
Presupuesto
</p>

</header>


<main>


<div
    id="cargando"
    class="cargando"
>
Cargando presupuesto...
</div>


<div
    id="error"
    class="error"
    style="display:none;"
></div>


<div
    id="contenido"
    style="display:none;"
>


<div
    id="pdfArea"
    class="presupuesto pdf-area"
>


<div
    id="numero"
    class="numero"
>
PRESUPUESTO
</div>


<div class="titulo">
Presupuesto de trabajo
</div>


<div class="fila">

<div class="etiqueta">
Cliente
</div>

<div
    id="cliente"
    class="valor"
>
</div>

</div>


<div class="fila">

<div class="etiqueta">
Fecha
</div>

<div
    id="fecha"
    class="valor"
>
</div>

</div>


<div class="fila">

<div class="etiqueta">
Descripción
</div>

<div
    id="descripcion"
    class="valor descripcion"
>
</div>

</div>


<div class="fila">

<div class="etiqueta">
Materiales
</div>

<div
    id="materiales"
    class="valor"
>
</div>

</div>


<div class="fila">

<div class="etiqueta">
Mano de obra
</div>

<div
    id="manoObra"
    class="valor"
>
</div>

</div>


<div class="fila">

<div class="etiqueta">
Viáticos
</div>

<div
    id="viaticos"
    class="valor"
>
</div>

</div>


<div
    id="total"
    class="total"
>
TOTAL: $0,00
</div>


</div>


<button
    id="btnPDF"
    class="pdf"
>
📄 GENERAR PDF
</button>


<a
    id="btnEditar"
    class="boton editar"
    href="#"
>
✏️ EDITAR PRESUPUESTO
</a>


<a
    href="presupuestos.html"
    class="boton volver"
>
⬅️ VOLVER A PRESUPUESTOS
</a>


</div>


</main>

</div>


<!-- =====================================
     jsPDF
===================================== -->

<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js">
</script>


<script type="module">


// ==========================================
// FIREBASE
// ==========================================

import {
    auth,
    db
} from "./Js/firebase.js";


import {
    onAuthStateChanged
} from
"https://www.gstatic.com/firebasejs/12.1.0/firebase-auth.js";


import {
    doc,
    getDoc
} from
"https://www.gstatic.com/firebasejs/12.1.0/firebase-firestore.js";


// ==========================================
// ELEMENTOS
// ==========================================

const cargando =
document.getElementById(
    "cargando"
);

const errorElemento =
document.getElementById(
    "error"
);

const contenido =
document.getElementById(
    "contenido"
);

const numeroElemento =
document.getElementById(
    "numero"
);

const clienteElemento =
document.getElementById(
    "cliente"
);

const fechaElemento =
document.getElementById(
    "fecha"
);

const descripcionElemento =
document.getElementById(
    "descripcion"
);

const materialesElemento =
document.getElementById(
    "materiales"
);

const manoObraElemento =
document.getElementById(
    "manoObra"
);

const viaticosElemento =
document.getElementById(
    "viaticos"
);

const totalElemento =
document.getElementById(
    "total"
);

const btnEditar =
document.getElementById(
    "btnEditar"
);

const btnPDF =
document.getElementById(
    "btnPDF"
);


// ==========================================
// ID
// ==========================================

const parametros =
new URLSearchParams(
    window.location.search
);

const presupuestoId =
parametros.get("id");


// ==========================================
// DINERO
// ==========================================

function dinero(valor) {

    return Number(valor || 0)
        .toLocaleString(
            "es-AR",
            {
                minimumFractionDigits: 2,
                maximumFractionDigits: 2
            }
        );

}


// ==========================================
// NÚMERO
// ==========================================

function numeroPresupuesto(id) {

    let suma = 0;


    for (
        let i = 0;
        i < id.length;
        i++
    ) {

        suma +=
            id.charCodeAt(i);

    }


    return String(
        suma % 1000000
    ).padStart(
        6,
        "0"
    );

}


// ==========================================
// CARGAR
// ==========================================

async function cargarPresupuesto(
    usuario
) {

    if (!presupuestoId) {

        mostrarError(
            "No se recibió el ID del presupuesto."
        );

        return;

    }


    try {


        const referencia =
            doc(
                db,
                "presupuestos",
                presupuestoId
            );


        const resultado =
            await getDoc(
                referencia
            );


        if (
            !resultado.exists()
        ) {

            mostrarError(
                "El presupuesto no existe."
            );

            return;

        }


        const datos =
            resultado.data();


        // ==================================
        // SEGURIDAD
        // ==================================

        if (
            datos.uid !== usuario.uid
        ) {

            mostrarError(
                "No tenés permiso para ver este presupuesto."
            );

            return;

        }


        // ==================================
        // MOSTRAR
        // ==================================

        numeroElemento.textContent =
            "PRESUPUESTO #" +
            numeroPresupuesto(
                presupuestoId
            );


        clienteElemento.textContent =
            datos.cliente || "-";


        fechaElemento.textContent =
            datos.fecha || "-";


        descripcionElemento.textContent =
            datos.descripcion || "-";


        materialesElemento.textContent =
            "$" +
            dinero(
                datos.materiales
            );


        manoObraElemento.textContent =
            "$" +
            dinero(
                datos.manoObra
            );


        viaticosElemento.textContent =
            "$" +
            dinero(
                datos.viaticos
            );


        const total =
            Number(
                datos.materiales || 0
            ) +
            Number(
                datos.manoObra || 0
            ) +
            Number(
                datos.viaticos || 0
            );


        totalElemento.textContent =
            "TOTAL: $" +
            dinero(total);


        // ==================================
        // EDITAR
        // ==================================

        btnEditar.href =
            "editar-presupuesto.html?id=" +
            encodeURIComponent(
                presupuestoId
            );


        cargando.style.display =
            "none";


        contenido.style.display =
            "block";


    } catch (error) {


        console.error(
            error
        );


        mostrarError(
            "Error cargando el presupuesto: " +
            error.message
        );

    }

}


// ==========================================
// ERROR
// ==========================================

function mostrarError(
    mensaje
) {

    cargando.style.display =
        "none";

    errorElemento.textContent =
        mensaje;

    errorElemento.style.display =
        "block";

}


// ==========================================
// GENERAR PDF
// ==========================================

btnPDF.addEventListener(
    "click",
    function() {


        if (
            !presupuestoId
        ) {

            alert(
                "No se encontró el presupuesto."
            );

            return;

        }


        const {
            jsPDF
        } =
        window.jspdf;


        const pdf =
            new jsPDF();


        // ==================================
        // ENCABEZADO
        // ==================================

        pdf.setFontSize(
            22
        );

        pdf.setFont(
            "helvetica",
            "bold"
        );


        pdf.text(
            "GESBASE",
            20,
            25
        );


        pdf.setFontSize(
            11
        );

        pdf.setFont(
            "helvetica",
            "normal"
        );


        pdf.text(
            "PRESUPUESTO",
            20,
            33
        );


        // ==================================
        // LÍNEA
        // ==================================

        pdf.line(
            20,
            38,
            190,
            38
        );


        // ==================================
        // NÚMERO
        // ==================================

        pdf.setFontSize(
            13
        );

        pdf.setFont(
            "helvetica",
            "bold"
        );


        pdf.text(
            numeroElemento.textContent,
            20,
            50
        );


        // ==================================
        // DATOS
        // ==================================

        pdf.setFont(
            "helvetica",
            "normal"
        );

        pdf.setFontSize(
            11
        );


        let y = 65;


        pdf.text(
            "Cliente: " +
            clienteElemento.textContent,
            20,
            y
        );


        y += 9;


        pdf.text(
            "Fecha: " +
            fechaElemento.textContent,
            20,
            y
        );


        y += 15;


        pdf.setFont(
            "helvetica",
            "bold"
        );


        pdf.text(
            "Descripción:",
            20,
            y
        );


        y += 8;


        pdf.setFont(
            "helvetica",
            "normal"
        );


        const descripcion =
            pdf.splitTextToSize(
                descripcionElemento.textContent,
                165
            );


        pdf.text(
            descripcion,
            20,
            y
        );


        y +=
            descripcion.length * 6 +
            12;


        // ==================================
        // COSTOS
        // ==================================

        pdf.setFont(
            "helvetica",
            "bold"
        );


        pdf.text(
            "Detalle",
            20,
            y
        );


        pdf.text(
            "Importe",
            150,
            y
        );


        y += 9;


        pdf.setFont(
            "helvetica",
            "normal"
        );


        pdf.text(
            "Materiales",
            20,
            y
        );


        pdf.text(
            materialesElemento.textContent,
            150,
            y
        );


        y += 9;


        pdf.text(
            "Mano de obra",
            20,
            y
        );


        pdf.text(
            manoObraElemento.textContent,
            150,
            y
        );


        y += 9;


        pdf.text(
            "Viáticos",
            20,
            y
        );


        pdf.text(
            viaticosElemento.textContent,
            150,
            y
        );


        y += 15;


        pdf.line(
            20,
            y,
            190,
            y
        );


        y += 12;


        pdf.setFont(
            "helvetica",
            "bold"
        );


        pdf.setFontSize(
            16
        );


        pdf.text(
            totalElemento.textContent,
            110,
            y
        );


        // ==================================
        // PIE
        // ==================================

        pdf.setFontSize(
            9
        );

        pdf.setFont(
            "helvetica",
            "normal"
        );


        pdf.text(
            "GESBASE - Gestión de presupuestos",
            20,
            280
        );


        // ==================================
        // GUARDAR
        // ==================================

        pdf.save(
            "Presupuesto-" +
            numeroPresupuesto(
                presupuestoId
            ) +
            ".pdf"
        );

    }
);


// ==========================================
// AUTENTICACIÓN
// ==========================================

onAuthStateChanged(
    auth,
    function(usuario) {


        if (!usuario) {

            window.location.replace(
                "login.html"
            );

            return;

        }


        cargarPresupuesto(
            usuario
        );

    }
);


</script>


</body>

</html>
