// ==========================================

function fechaLocal(){

    const ahora = new Date();

    ahora.getFullYear();

    const mes =
    String(
        ahora.getMonth() + 1
    ).padStart(2,"0");

function colocarFechaActual(){

}


// ==========================================
// CALCULAR FECHA PREVISTA
// ==========================================

function calcularFechaPrevista(){

    if(!fecha.value){

        fechaPrevista.value = "";

        return;

    }

    const dias =
    Number(
        diasACobrar.value
    ) || 0;

    const partes =
    fecha.value.split("-");

    if(partes.length !== 3){

        fechaPrevista.value = "";

        return;

    }

    const fechaBase =
    new Date(
        Number(partes[0]),
        Number(partes[1]) - 1,
        Number(partes[2])
    );

    fechaBase.setDate(
        fechaBase.getDate() + dias
    );

    const año =
    fechaBase.getFullYear();

    const mes =
    String(
        fechaBase.getMonth() + 1
    ).padStart(2,"0");

    const dia =
    String(
        fechaBase.getDate()
    ).padStart(2,"0");

    fechaPrevista.value =
    `${año}-${mes}-${dia}`;

}


fecha.addEventListener(
    "change",
    calcularFechaPrevista
);

// ==========================================
// MONEDA
// ==========================================

function formatoMoneda(
    valor
){

    return Number(
        valor || 0
    ).toLocaleString(
        "es-AR",
        {
            style:"currency",
            currency:"ARS",
            minimumFractionDigits:2
        }
    );

}


// ==========================================
// FORMATO FECHA
// ==========================================

function formatoFecha(
    valor
){

    if(!valor){

        return "-";

    }

    const partes =
    String(valor).split("-");

    if(partes.length !== 3){

        return valor;

    }

    return (
        partes[2] +
        "/" +
        partes[1] +
        "/" +
        partes[0]
    );

}


// ==========================================
// ESCAPAR HTML
// ==========================================

function escapar(
    valor
){

    return String(
        valor ?? ""
    )
    .replaceAll("&","&amp;")
    .replaceAll("<","&lt;")
    .replaceAll(">","&gt;")
    .replaceAll('"',"&quot;")
    .replaceAll("'","&#039;");

}


// ==========================================
// OBTENER EMPRESA
// ==========================================

async function cargarEmpresa(){

    empresaActual = {};

    empresaIdActual = "";

    try{

        const referenciaUsuario =
        doc(
            db,
            "usuarios",
            usuarioActual.uid
        );

        const documentoUsuario =
        await getDoc(
            referenciaUsuario
        );

        let datosUsuario = {};

        if(
            documentoUsuario.exists()
        ){

            datosUsuario =
            documentoUsuario.data();

        }


        empresaIdActual =
        String(
            datosUsuario.empresaId ||
            datosUsuario.empresa ||
            ""
        ).trim();


        /*
         * Compatibilidad con usuarios
         * que todavía no tienen empresaId.
         */

        if(!empresaIdActual){

            empresaIdActual =
            usuarioActual.uid;

        }


        const referenciaEmpresa =
        doc(
            db,
            "empresas",
            empresaIdActual
        );

        const documentoEmpresa =
        await getDoc(
            referenciaEmpresa
        );


        if(
            documentoEmpresa.exists()
        ){

            empresaActual =
            documentoEmpresa.data();

        }

    }
    catch(error){

        console.error(
            "Error cargando empresa:",
            error
        );

        if(!empresaIdActual){

            empresaIdActual =
            usuarioActual.uid;

        }

    }

}


// ==========================================
// CARGAR CLIENTES
// ==========================================

async function cargarClientes(){

    cliente.innerHTML = `
        <option value="">
            Cargando clientes...
        </option>
    `;


    try{

        const snapshot =
        await getDocs(
            collection(
                db,
                "clientes"
            )
        );


        clientes = [];


        snapshot.forEach(
            function(documento){

                const datos =
                documento.data();


                const perteneceEmpresa =
                (
                    datos.empresaId ===
                    empresaIdActual
                )
                ||
                (
                    datos.usuarioId ===
                    usuarioActual.uid
                )
                ||
                (
                    datos.uid ===
                    usuarioActual.uid
                );


                if(!perteneceEmpresa){

                    return;

                }


                const nombre =
                [
                    datos.nombre,
                    datos.apellido
                ]
                .filter(Boolean)
                .join(" ");


                const nombreFinal =
                nombre ||
                datos.empresa ||
                datos.razonSocial ||
                datos.razon_social ||
                "Cliente";


                clientes.push({

                    id:
                    documento.id,

                    nombre:
                    nombreFinal,

                    datos:
                    datos

                });

            }
        );


        clientes.sort(
            function(a,b){

                return a.nombre.localeCompare(
                    b.nombre,
                    "es"
                );

            }
        );


        cliente.innerHTML = `
            <option value="">
                Seleccionar cliente
            </option>
        `;


        clientes.forEach(
            function(item){

                const opcion =
                document.createElement(
                    "option"
                );

                opcion.value =
                item.id;

                opcion.textContent =
                item.nombre;

                cliente.appendChild(
                    opcion
                );

            }
        );


        if(
            clientes.length === 0
        ){

            cliente.innerHTML = `
                <option value="">
                    No hay clientes disponibles
                </option>
            `;

        }

    }
    catch(error){

        console.error(
            "Error cargando clientes:",
            error
        );

        cliente.innerHTML = `
            <option value="">
                Error cargando clientes
            </option>
        `;

        mostrarEstado(
            "No se pudieron cargar los clientes. " +
            error.message,
            "error"
        );

    }

}

// ==========================================

function estaCobrado(

){

        cobro.estado || ""
    )
    .toLowerCase()
    .trim() === "cobrado";

}


// ==========================================
// CARGAR COBROS
// ==========================================

async function cargarCobros(){

    cargando.style.display =
    "block";

    listaCobros.style.display =
    "none";

    sinCobros.style.display =
    "none";


    try{

        const snapshot =
        await getDocs(
            collection(
                db,
                "cobros"
            )
        );


        cobrosActuales = [];


        snapshot.forEach(
            function(documento){

                const datos =
                documento.data();


                const perteneceEmpresa =
                (
                    datos.empresaId ===
                    empresaIdActual
                )
                ||
                (
                    datos.usuarioId ===
                    usuarioActual.uid
                )
                ||
                (
                    datos.uid ===
                    usuarioActual.uid
                );


                if(!perteneceEmpresa){

                    return;

                }


                cobrosActuales.push({

                    id:
                    documento.id,

                    ...datos

                });

            }
        );


        cobrosActuales.sort(
            function(a,b){

                return String(
                    b.fecha || ""
                ).localeCompare(
                    String(
                        a.fecha || ""
                    )
                );

            }
        );


        let total = 0;

        let pendiente = 0;

        let cobrado = 0;


        cobrosActuales.forEach(
            function(item){

                const importeItem =
                Number(
                    item.importe || 0
                );


                total +=
                importeItem;


                if(
                    estaCobrado(item)
                ){

                    cobrado +=
                    importeItem;

                }
                else{

                    pendiente +=
                    importeItem;

                }

            }
        );


        totalRegistrado.textContent =
        formatoMoneda(total);

        totalPendiente.textContent =
        formatoMoneda(pendiente);

        totalCobrado.textContent =
        formatoMoneda(cobrado);

        cantidadCobros.textContent =
        cobrosActuales.length;


        contador.textContent =
        cobrosActuales.length +
        (
            cobrosActuales.length === 1
            ? " cobro"
            : " cobros"
        );


        listaCobros.innerHTML =
        "";


        cargando.style.display =
        "none";


        if(
            cobrosActuales.length === 0
        ){

            sinCobros.style.display =
            "block";

            return;

        }


        listaCobros.style.display =
        "flex";


        cobrosActuales.forEach(
            function(cobro){

                crearCobro(
                    cobro
                );

            }
        );

    }
    catch(error){

        console.error(
            "Error cargando cobros:",
            error
        );


        cargando.style.display =
        "none";


        mostrarEstado(
            "No se pudieron cargar los cobros. " +
            error.message,
            "error"
        );

    }

}

        }">

            ${

                    ${escapar(
                        dias + " días"
                    )}
                </strong>

            </div>


            <div class="cobro-dato">

                Fecha prevista

                <strong>
                    ${escapar(
                        formatoFecha(
                            fechaPrev
                        )
                    )}
                </strong>

            </div>


            <div class="cobro-dato">

                Medio de pago

                <strong>
                    ${escapar(
                        cobro.medioPago ||

                    )}
                </strong>

            </div>


            <div class="cobro-dato">

                Trabajo

                <strong>
                    ${escapar(

                    )}
                </strong>

            </div>


            ${
                cobrado && cobro.fechaCobrado
                ? `
                    <div class="cobro-dato">

                        <strong>
                            ${escapar(

                            )}
                        </strong>

                `
                : ""
            }

        </div>


        ${

            : ""
        }


        <div class="botones-cobro">

                    >
                        💵 COBRADO
                    </button>
                `
                : `
                    <button
                        class="btn-cobrado"
                        type="button"

                    >
                        ✅ COBRADO
                    </button>
                `
            }


            <button
                class="btn-recibo"

                data-recibo="${cobro.id}"
            >

            <button

    botonEliminar.addEventListener(

// ==========================================
// MARCAR COBRADO
// ==========================================

async function marcarComoCobrado(
    id
){

    const cobro =
    cobrosActuales.find(
        function(item){

            return item.id === id;

        }
    );


    if(!cobro){

        return;

    }


    if(
        estaCobrado(cobro)
    ){

        return;

    }


    if(
        !confirm(
            "¿Confirmás que este importe ya fue cobrado?"
        )
    ){

        return;

    }


    try{

        mostrarEstado(
            "Marcando como cobrado...",
            "info"
        );


        await updateDoc(
            doc(
                db,
                "cobros",
                id
            ),
            {

                estado:
                "Cobrado",

                fechaCobrado:
                fechaLocal()

            }
        );


        mostrarEstado(
            "Cobro marcado correctamente como COBRADO.",
            "exito"
        );


        await cargarCobros();

    }
    catch(error){

        console.error(
            "Error marcando cobro:",
            error
        );


        mostrarEstado(
            "No se pudo marcar como cobrado. " +
            error.message,
            "error"
        );

    }

}


// ==========================================
// NÚMERO DE RECIBO
// ==========================================

function generarNumeroRecibo(){

    let mayor = 0;


    cobrosActuales.forEach(
        function(cobro){

            const numero =
            String(
                cobro.numeroRecibo || ""
            );


            const coincidencia =
            numero.match(
                /(\d+)$/
            );


            if(
                coincidencia
            ){

                const n =
                Number(
                    coincidencia[1]
                );


                if(n > mayor){

                    mayor =
                    n;

                }

            }

        }
    );


    return String(
        mayor + 1
    ).padStart(
        6,
        "0"
    );

}

// MOSTRAR RECIBO

){

    reciboActual =
    cobro;


    const trabajoDatos =
    trabajos.find(
        function(item){

            return item.id ===
            cobro.trabajoId;

        }
    ) || {};


    const empresaNombre =
    empresaActual.nombreEmpresa ||
    empresaActual.nombre ||
    empresaActual.razonSocial ||
    "GESBASE";


    const empresaDatos = [

        empresaActual.razonSocial,

        empresaActual.cuit
        ? "CUIT: " +
          empresaActual.cuit
        : "",

        empresaActual.telefono
        ? "Tel: " +
          empresaActual.telefono
        : "",

        empresaActual.email
        ? empresaActual.email
        : "",

        empresaActual.direccion
        ? empresaActual.direccion
        : ""

    ]
    .filter(Boolean)
    .join(" | ");


    document.getElementById(
        "reciboEmpresaNombre"
    ).textContent =
    empresaNombre;


    document.getElementById(
        "reciboEmpresaDatos"
    ).textContent =
    empresaDatos;


    const logo =
    document.getElementById(
        "reciboLogo"
    );


    const logoUrl =
    empresaActual.logoUrl ||
    empresaActual.logo ||
    empresaActual.logoURL ||
    "";


    if(logoUrl){

        logo.src =
        logoUrl;

        logo.style.display =
        "block";

    }
    else{

        logo.style.display =
        "none";

    }


    const numero =
    cobro.numeroRecibo ||
    "RC-" +
    generarNumeroRecibo();


    document.getElementById(
        "reciboNumero"
    ).textContent =
    "N.º " +
    numero;


    document.getElementById(
        "reciboCliente"
    ).textContent =
    nombreCliente(
        cobro.clienteId
    );


    document.getElementById(
        "reciboFecha"
    ).textContent =
    formatoFecha(
        cobro.fecha
    );


    document.getElementById(
        "reciboTrabajo"
    ).textContent =
    nombreTrabajo(
        cobro.trabajoId
    );


    document.getElementById(
        "reciboMedioPago"
    ).textContent =
    cobro.medioPago ||
    "No informado";


    document.getElementById(
        "reciboDias"
    ).textContent =
    (
        cobro.diasACobrar !== undefined
        ? cobro.diasACobrar + " días"
        : "-"
    );


    document.getElementById(
        "reciboFechaPrevista"
    ).textContent =
    formatoFecha(
        cobro.fechaPrevista
    );


    document.getElementById(
        "reciboDescripcion"
    ).textContent =
    trabajoDatos.descripcion ||
    trabajoDatos.nombre ||
    "Importe a cobrar";


    document.getElementById(
        "reciboTotal"
    ).textContent =
    formatoMoneda(
        cobro.importe
    );


    document.getElementById(
        "reciboEstado"
    ).textContent =
    estaCobrado(cobro)
    ? "Estado: COBRADO — " +
      formatoFecha(
          cobro.fechaCobrado
      )
    : "Estado: PENDIENTE";


    const observacion =
    document.getElementById(
        "reciboObservaciones"
    );


    if(cobro.observaciones){

        observacion.textContent =
        "Observaciones: " +
        cobro.observaciones;

        observacion.style.display =
        "block";

    }
    else{

        observacion.style.display =
        "none";

    }


    reciboOverlay.classList.add(
        "visible"
    );

}


// ==========================================
// GUARDAR COBRO
// ==========================================

btnGuardar.addEventListener(
    "click",
    async function(){

        if(!usuarioActual){

            mostrarEstado(
                "No hay una sesión activa.",
                "error"
            );

            return;

        }


        if(!empresaIdActual){

            mostrarEstado(
                "No se pudo identificar la empresa.",
                "error"
            );

            return;

        }


        if(!cliente.value){

            mostrarEstado(
                "Seleccioná un cliente.",
                "error"
            );

            return;

        }


        /*
         * VERIFICAR QUE EL CLIENTE
         * REALMENTE PERTENEZCA AL USUARIO.
         */

        const clienteSeleccionado =
        clientes.find(
            function(item){

                return item.id ===
                cliente.value;

            }
        );


        if(!clienteSeleccionado){

            mostrarEstado(
                "El cliente seleccionado no es válido.",
                "error"
            );

            return;

        }


        /*
         * VERIFICAR TRABAJO
         *
         * Si se seleccionó un trabajo,
         * debe pertenecer al cliente elegido.
         */

        if(trabajo.value){

            const trabajoSeleccionado =
            trabajos.find(
                function(item){

                    return item.id ===
                    trabajo.value;

                }
            );


            if(!trabajoSeleccionado){

                mostrarEstado(
                    "El trabajo seleccionado no es válido.",
                    "error"
                );

                return;

            }


            if(
                String(
                    trabajoSeleccionado.clienteId
                ) !==
                String(
                    cliente.value
                )
            ){

                mostrarEstado(
                    "El trabajo no pertenece al cliente seleccionado.",
                    "error"
                );

                return;

            }

        }


        const importeNumero =
        Number(
            importe.value
        );


        if(
            !importeNumero ||
            importeNumero <= 0
        ){

            mostrarEstado(
                "Ingresá un importe válido.",
                "error"
            );

            return;

        }


        if(!fecha.value){

            mostrarEstado(
                "Seleccioná la fecha.",
                "error"
            );

            return;

        }


        if(!diasACobrar.value){

            mostrarEstado(
                "Seleccioná los días a cobrar.",
                "error"
            );

            return;

        }


        calcularFechaPrevista();


        btnGuardar.disabled =
        true;

        btnGuardar.textContent =
        "Guardando...";


        try{

            const numero =
            generarNumeroRecibo();


            const numeroRecibo =
            "RC-" +
            numero;


            const datosCobro = {

                usuarioId:
                usuarioActual.uid,

                empresaId:
                empresaIdActual,

                clienteId:
                cliente.value,

                trabajoId:
                trabajo.value || "",

                importe:
                importeNumero,

                fecha:
                fecha.value,

                diasACobrar:
                Number(
                    diasACobrar.value
                ),

                fechaPrevista:
                fechaPrevista.value,

                estado:
                "Pendiente",

                fechaCobrado:
                "",

                medioPago:
                medioPago.value || "",

                observaciones:
                observaciones.value.trim(),

                numeroRecibo:
                numeroRecibo,

                creado:
                serverTimestamp()

            };


            const referencia =
            await addDoc(
                collection(
                    db,
                    "cobros"
                ),
                datosCobro
            );


            const cobroNuevo = {

                id:
                referencia.id,

                ...datosCobro

            };


            cobrosActuales.push(
                cobroNuevo
            );


            mostrarEstado(
                "Cobro registrado correctamente.",
                "exito"
            );


            importe.value =
            "";

            trabajo.value =
            "";

            medioPago.value =
            "";

            observaciones.value =
            "";

            diasACobrar.value =
            "1";


            colocarFechaActual();


            await cargarCobros();


            mostrarRecibo(
                cobroNuevo
            );

        }
        catch(error){

            console.error(
                "Error guardando cobro:",
                error
            );


            mostrarEstado(
                "No se pudo registrar el cobro. " +
                error.message,
                "error"
            );

        }
        finally{

            btnGuardar.disabled =
            false;

            btnGuardar.textContent =
            "💵 Registrar cobro";

        }

    }
);

// ==========================================

async function eliminarCobro(
    id
){

    const cobro =
    cobrosActuales.find(
        function(item){

            return item.id === id;

        }
    );


    if(!cobro){

        return;

    }


    const confirmado =
    confirm(
        "¿Querés eliminar este cobro?\n\n" +
        "Esta acción no se puede deshacer."
    );


    if(!confirmado){

        return;

    }


    try{

        mostrarEstado(
            "Eliminando cobro...",
            "info"
        );


        await deleteDoc(
            doc(
                db,
                "cobros",
                id
            )
        );


        mostrarEstado(
            "Cobro eliminado correctamente.",
            "exito"
        );


        await cargarCobros();

    }
    catch(error){

        console.error(
            "Error eliminando cobro:",
            error
        );


        mostrarEstado(
            "No se pudo eliminar el cobro. " +
            error.message,
            "error"
        );

    }

}
