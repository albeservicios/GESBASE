<!DOCTYPE html>
<html lang="es">

<head>

<meta charset="UTF-8">

<meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
>

<meta
    name="theme-color"
    content="#111827"
>

<meta
    name="description"
    content="GESBASE - Cobros"
>

<title>Cobros - GESBASE</title>

<style>

*{
    box-sizing:border-box;
    margin:0;
    padding:0;
}

body{

    font-family:
        Arial,
        Helvetica,
        sans-serif;

    background:#f3f4f6;

    color:#111827;

    min-height:100vh;
}

header{

    background:#111827;

    color:white;

    padding:20px;

    text-align:center;
}

header h1{

    font-size:25px;

    margin-bottom:5px;
}

header p{

    color:#d1d5db;

    font-size:14px;
}

.container{

    width:100%;

    max-width:1100px;

    margin:auto;

    padding:18px;
}

.card{

    background:white;

    border-radius:14px;

    padding:18px;

    margin-bottom:18px;

    box-shadow:
        0 2px 8px
        rgba(0,0,0,.08);
}

.titulo{

    font-size:19px;

    font-weight:bold;

    margin-bottom:15px;
}

.grid{

    display:grid;

    grid-template-columns:
        repeat(2,minmax(0,1fr));

    gap:14px;
}

.full{

    grid-column:
        1 / -1;
}

label{

    display:block;

    font-size:13px;

    font-weight:bold;

    color:#374151;

    margin-bottom:6px;
}

input,
select,
textarea{

    width:100%;

    border:1px solid #d1d5db;

    border-radius:10px;

    padding:12px;

    font-size:15px;

    background:white;

    color:#111827;
}

input:focus,
select:focus,
textarea:focus{

    outline:none;

    border-color:#2563eb;

    box-shadow:
        0 0 0 3px
        rgba(37,99,235,.12);
}

textarea{

    min-height:90px;

    resize:vertical;
}

.btn{

    border:0;

    border-radius:10px;

    padding:13px 16px;

    font-size:15px;

    font-weight:bold;

    cursor:pointer;
}

.btn-primary{

    background:#2563eb;

    color:white;

    width:100%;
}

.btn-primary:disabled{

    opacity:.6;

    cursor:not-allowed;
}

.btn-danger{

    background:#fee2e2;

    color:#991b1b;
}

.btn-secondary{

    background:#e5e7eb;

    color:#111827;
}

.resumen{

    display:grid;

    grid-template-columns:
        repeat(3,minmax(0,1fr));

    gap:12px;

    margin-bottom:18px;
}

.resumen-card{

    border-radius:13px;

    padding:18px;

    border:1px solid #e5e7eb;

    background:#f9fafb;
}

.resumen-card.cobrado{

    background:#ecfdf5;

    border-color:#a7f3d0;
}

.resumen-card.anulado{

    background:#fef2f2;

    border-color:#fecaca;
}

.resumen-label{

    font-size:13px;

    color:#6b7280;

    margin-bottom:7px;
}

.resumen-valor{

    font-size:22px;

    font-weight:bold;
}

.cobrado .resumen-valor{

    color:#047857;
}

.anulado .resumen-valor{

    color:#dc2626;
}

.busqueda{

    margin-bottom:14px;
}

.tabla{

    overflow-x:auto;
}

table{

    width:100%;

    border-collapse:collapse;

    min-width:850px;
}

th,
td{

    padding:11px;

    border-bottom:
        1px solid #e5e7eb;

    text-align:left;

    font-size:14px;

    vertical-align:middle;
}

th{

    background:#f9fafb;

    font-weight:bold;
}

.estado{

    display:inline-block;

    padding:5px 9px;

    border-radius:999px;

    font-size:12px;

    font-weight:bold;
}

.estado-cobrado{

    background:#dcfce7;

    color:#166534;
}

.estado-anulado{

    background:#fee2e2;

    color:#991b1b;
}

.importe{

    font-weight:bold;

    color:#047857;
}

.vacio{

    text-align:center;

    color:#6b7280;

    padding:25px;
}

.mensaje{

    display:none;

    padding:13px;

    border-radius:10px;

    margin-bottom:15px;

    font-size:14px;

    font-weight:bold;

    line-height:1.5;
}

.mensaje.exito{

    display:block;

    background:#dcfce7;

    color:#166534;

    border:1px solid #bbf7d0;
}

.mensaje.error{

    display:block;

    background:#fee2e2;

    color:#991b1b;

    border:1px solid #fecaca;
}

.mensaje.info{

    display:block;

    background:#dbeafe;

    color:#1e40af;

    border:1px solid #bfdbfe;
}

.acciones{

    display:flex;

    gap:7px;

    flex-wrap:wrap;
}

.navegacion{

    margin-bottom:15px;
}

.btn-volver{

    display:inline-block;

    text-decoration:none;

    background:#e5e7eb;

    color:#111827;

    padding:10px 14px;

    border-radius:10px;

    font-size:14px;

    font-weight:bold;
}

.cargando{

    text-align:center;

    padding:25px;

    color:#6b7280;
}

@media(max-width:768px){

    .grid{

        grid-template-columns:1fr;
    }

    .full{

        grid-column:auto;
    }

    .resumen{

        grid-template-columns:1fr;
    }

    .container{

        padding:12px;
    }

    .card{

        padding:15px;
    }

    header{

        padding:17px;
    }

    header h1{

        font-size:22px;
    }

}

</style>

</head>

<body>


<header>

    <h1>💵 Cobros</h1>

    <p>
        GESBASE · Gestión de cobranzas
    </p>

</header>


<div class="container">


    <div class="navegacion">

        <a
            href="index.html"
            class="btn-volver"
        >
            ← Volver al panel
        </a>

    </div>


    <!-- =====================================================
         MENSAJE
    ====================================================== -->

    <div
        id="mensaje"
        class="mensaje"
    ></div>


    <!-- =====================================================
         RESUMEN
    ====================================================== -->

    <div class="resumen">

        <div class="resumen-card cobrado">

            <div class="resumen-label">
                Total cobrado
            </div>

            <div
                class="resumen-valor"
                id="totalCobrado"
            >
                $ 0,00
            </div>

        </div>


        <div class="resumen-card">

            <div class="resumen-label">
                Cantidad de cobros
            </div>

            <div
                class="resumen-valor"
                id="cantidadCobros"
            >
                0
            </div>

        </div>


        <div class="resumen-card anulado">

            <div class="resumen-label">
                Total anulado
            </div>

            <div
                class="resumen-valor"
                id="totalAnulado"
            >
                $ 0,00
            </div>

        </div>

    </div>


    <!-- =====================================================
         NUEVO COBRO
    ====================================================== -->

    <div class="card">

        <div class="titulo">
            Registrar nuevo cobro

        <div class="grid">


            <!-- CLIENTE -->

            <div class="campo">

                <label for="cliente">

                <select

                    <option value="">

            <!-- FECHA -->

            <div class="campo">

            <!-- MEDIO DE PAGO -->

                        Efectivo

                        Mercado Pago

                    <option value="Tarjeta de débito">

                    </option>

                    <option value="Tarjeta de crédito">

                        Cheque

            <!-- REFERENCIA -->

            <div class="campo">

                <label for="referencia">

            <!-- OBSERVACIONES -->

                <label for="observaciones">

                    Observaciones

                <textarea

            </div>


            <!-- BOTÓN -->

            <div class="campo full">

                <button

        </div>

    </div>


    <!-- =====================================================
         HISTORIAL
    ====================================================== -->

    <div class="card">

        <div class="titulo">
            Historial de cobros
        </div>


        <input
            type="search"
            id="buscar"
            class="busqueda"
            placeholder="Buscar por cliente, referencia o medio de pago..."
        >


        <div class="tabla">

            <table>

                <thead>

                    <tr>

                        <th>
                            Fecha
                        </th>

                        <th>
                            Cliente
                        </th>

                        <th>
                            Trabajo
                        </th>

                        <th>
                            Importe
                        </th>

                        <th>
                            Medio
                        </th>

                        <th>
                            Estado
                        </th>

                        <th>
                            Acción
                        </th>

                    </tr>

                </thead>

                <tbody
                    id="listaCobros"
                >

                    <tr>

                        <td
                            colspan="7"
                            class="cargando"
                        >

                            Cargando cobros...

                        </td>

                </tbody>

        </div>

    </div>


</div>


<script type="module">


/* =========================================================
   FIREBASE
========================================================= */

import {

    auth,
    db

} from "./Js/firebase.js";


import {

    onAuthStateChanged

} from
"https://www.gstatic.com/firebasejs/12.18.0/firebase-auth.js";


import {

    collection,
    addDoc,
    getDocs,
    deleteDoc,
    doc,
    query,
    where,
    serverTimestamp

} from
"https://www.gstatic.com/firebasejs/12.18.0/firebase-firestore.js";


/* =========================================================
   ELEMENTOS
========================================================= */

const clienteSelect =
    document.getElementById("cliente");

const trabajoSelect =
    document.getElementById("trabajo");

const importeInput =
    document.getElementById("importe");

const fechaInput =
    document.getElementById("fecha");

const medioPagoSelect =
    document.getElementById("medioPago");

const referenciaInput =
    document.getElementById("referencia");

const observacionesInput =
    document.getElementById("observaciones");

const btnGuardar =
    document.getElementById("btnGuardar");

const buscarInput =
    document.getElementById("buscar");

const listaCobros =
    document.getElementById("listaCobros");

const totalCobrado =
    document.getElementById("totalCobrado");

const totalAnulado =
    document.getElementById("totalAnulado");

const cantidadCobros =
    document.getElementById("cantidadCobros");

const mensaje =
    document.getElementById("mensaje");


/* =========================================================
   VARIABLES
========================================================= */

let usuarioActual = null;

let empresaId = null;

let clientes = [];

let trabajos = [];

let cobros = [];


/* =========================================================
   FECHA ACTUAL
========================================================= */

function colocarFechaActual(){

    const hoy =
        new Date();

    const año =
        hoy.getFullYear();

    const mes =
        String(
            hoy.getMonth() + 1
        ).padStart(2,"0");

    const dia =
        String(
            hoy.getDate()
        ).padStart(2,"0");

    fechaInput.value =
        `${año}-${mes}-${dia}`;

}


/* =========================================================
   MENSAJE
========================================================= */

function mostrarMensaje(
    texto,
    tipo = "info"
){

    mensaje.textContent =
        texto;

    mensaje.className =
        "mensaje " + tipo;

}


function ocultarMensaje(){

    mensaje.textContent =
        "";

    mensaje.className =
        "mensaje";

}


/* =========================================================
   ESCAPAR HTML
========================================================= */

function escaparHTML(
    valor
){

    return String(
        valor ?? ""
    )
    .replace(
        /&/g,
        "&amp;"
    )
    .replace(
        /</g,
        "&lt;"
    )
    .replace(
        />/g,
        "&gt;"
    )
    .replace(
        /"/g,
        "&quot;"
    )
    .replace(
        /'/g,
        "&#039;"
    );

}


/* =========================================================
   DINERO
========================================================= */

function formatearPesos(
    valor
){

    return Number(
        valor || 0
    ).toLocaleString(
        "es-AR",
        {
            style:"currency",
            currency:"ARS",
            minimumFractionDigits:2
        }
    );

}


/* =========================================================
   FECHA
========================================================= */

function formatearFecha(
    fecha
){

    if(!fecha){

        return "-";

    }

    const partes =
        String(
            fecha
        ).split("-");

    if(
        partes.length === 3
    ){

        return (
            partes[2] +
            "/" +
            partes[1] +
            "/" +
            partes[0]
        );

    }

    return fecha;

}


/* =========================================================
   CARGAR CLIENTES
========================================================= */

async function cargarClientes(){

    clienteSelect.innerHTML = `
        <option value="">
            Seleccioná un cliente
        </option>
    `;

    try{

        const consulta =
            query(
                collection(
                    db,
                    "clientes"
                ),
                where(
                    "empresaId",
                    "==",
                    empresaId
                )
            );

        const snapshot =
            await getDocs(
                consulta
            );

        clientes = [];

        snapshot.forEach(
            documento => {

                const datos =
                    documento.data();

                clientes.push({

                    id:
                        documento.id,

                    ...datos

                });

            }
        );


        clientes.sort(
            (a,b) => {

                const nombreA =
                    String(
                        a.nombreCompleto ||
                        a.nombre ||
                        a.razonSocial ||
                        ""
                    );

                const nombreB =
                    String(
                        b.nombreCompleto ||
                        b.nombre ||
                        b.razonSocial ||
                        ""
                    );

                return nombreA.localeCompare(
                    nombreB,
                    "es"
                );

            }
        );


        clientes.forEach(
            cliente => {

                const opcion =
                    document.createElement(
                        "option"
                    );

                opcion.value =
                    cliente.id;

                opcion.textContent =
                    cliente.nombreCompleto ||
                    cliente.nombre ||
                    cliente.razonSocial ||
                    "Cliente";

                clienteSelect.appendChild(
                    opcion
                );

            }
        );

    }
    catch(error){

        console.error(
            "ERROR CLIENTES:",
            error
        );

        mostrarMensaje(
            "No se pudieron cargar los clientes.",
            "error"
        );

    }

}


/* =========================================================
   CARGAR TRABAJOS
========================================================= */

async function cargarTrabajos(){

    trabajoSelect.innerHTML = `
        <option value="">
            Seleccioná un trabajo
        </option>
    `;

    try{

        const consulta =
            query(
                collection(
                    db,
                    "trabajos"
                ),
                where(
                    "empresaId",
                    "==",
                    empresaId
                )
            );

        const snapshot =
            await getDocs(
                consulta
            );

        trabajos = [];

        snapshot.forEach(
            documento => {

                trabajos.push({

                    id:
                        documento.id,

                    ...documento.data()

                });

            }
        );


        trabajos.sort(
            (a,b) => {

                const aTexto =
                    String(
                        a.nombre ||
                        a.titulo ||
                        a.descripcion ||
                        ""
                    );

                const bTexto =
                    String(
                        b.nombre ||
                        b.titulo ||
                        b.descripcion ||
                        ""
                    );

                return aTexto.localeCompare(
                    bTexto,
                    "es"
                );

            }
        );


        trabajos.forEach(
            trabajo => {

                const opcion =
                    document.createElement(
                        "option"
                    );

                opcion.value =
                    trabajo.id;

                const nombre =
                    trabajo.nombre ||
                    trabajo.titulo ||
                    trabajo.descripcion ||
                    "Trabajo";

                opcion.textContent =
                    nombre;

                trabajoSelect.appendChild(
                    opcion
                );

            }
        );

    }
    catch(error){

        console.warn(
            "No se pudieron cargar trabajos:",
            error
        );

    }

}


/* =========================================================
   GUARDAR COBRO
========================================================= */

async function guardarCobro(){

    ocultarMensaje();


    if(!usuarioActual){

        mostrarMensaje(
            "No hay una sesión iniciada.",
            "error"
        );

        return;

    }


    if(!empresaId){

        mostrarMensaje(
            "No se pudo identificar la empresa.",
            "error"
        );

        return;

    }


    const clienteId =
        clienteSelect.value;


    const trabajoId =
        trabajoSelect.value;


    const importe =
        Number(
            importeInput.value || 0
        );


    const fecha =
        fechaInput.value;


    const medioPago =
        medioPagoSelect.value;


    const referencia =
        referenciaInput.value.trim();


    const observaciones =
        observacionesInput.value.trim();


    if(!clienteId){

        mostrarMensaje(
            "Seleccioná un cliente.",
            "error"
        );

        clienteSelect.focus();

        return;

    }


    if(
        !importe ||
        importe <= 0
    ){

        mostrarMensaje(
            "Ingresá un importe válido.",
            "error"
        );

        importeInput.focus();

        return;

    }


    if(!fecha){

        mostrarMensaje(
            "Seleccioná la fecha del cobro.",
            "error"
        );

        return;

    }


    btnGuardar.disabled =
        true;

    btnGuardar.textContent =
        "Guardando cobro...";


    try{

        const cliente =
            clientes.find(
                item =>
                    item.id === clienteId
            );


        const trabajo =
            trabajos.find(
                item =>
                    item.id === trabajoId
            );


        const nombreCliente =
            cliente
            ?
            (
                cliente.nombreCompleto ||
                cliente.nombre ||
                cliente.razonSocial ||
                ""
            )
            :
            "";


        const nombreTrabajo =
            trabajo
            ?
            (
                trabajo.nombre ||
                trabajo.titulo ||
                trabajo.descripcion ||
                ""
            )
            :
            "";


        await addDoc(
            collection(
                db,
                "cobros"
            ),
            {

                empresaId:
                    empresaId,

                usuarioId:
                    usuarioActual.uid,

                propietarioId:
                    usuarioActual.uid,

                clienteId:
                    clienteId,

                clienteNombre:
                    nombreCliente,

                trabajoId:
                    trabajoId || "",

                trabajoNombre:
                    nombreTrabajo,

                importe:
                    importe,

                fecha:
                    fecha,

                medioPago:
                    medioPago,

                referencia:
                    referencia,

                observaciones:
                    observaciones,

                estado:
                    "cobrado",

                fechaCreacion:
                    serverTimestamp(),

                fechaActualizacion:
                    serverTimestamp()

            }
        );


        mostrarMensaje(
            "✅ Cobro registrado correctamente.",
            "exito"
        );


        limpiarFormulario();

        await cargarCobros();


    }
    catch(error){

        console.error(
            "ERROR GUARDANDO COBRO:",
            error
        );


        mostrarMensaje(
            "No se pudo registrar el cobro.\n\n" +
            (
                error.message ||
                "Error desconocido."
            ),
            "error"
        );

    }
    finally{

        btnGuardar.disabled =
            false;

        btnGuardar.textContent =
            "💾 Registrar cobro";

    }

}


/* =========================================================
   LIMPIAR
========================================================= */

function limpiarFormulario(){

    clienteSelect.value =
        "";

    trabajoSelect.value =
        "";

    importeInput.value =
        "";

    medioPagoSelect.value =
        "Efectivo";

    referenciaInput.value =
        "";

    observacionesInput.value =
        "";

    colocarFechaActual();

}


/* =========================================================
   CARGAR COBROS
========================================================= */

async function cargarCobros(){

    listaCobros.innerHTML = `
        <tr>
            <td colspan="7" class="cargando">
                Cargando cobros...
            </td>
        </tr>
    `;


    try{

        const consulta =
            query(
                collection(
                    db,
                    "cobros"
                ),
                where(
                    "empresaId",
                    "==",
                    empresaId
                )
            );


        const snapshot =
            await getDocs(
                consulta
            );


        cobros = [];


        snapshot.forEach(
            documento => {

                cobros.push({

                    id:
                        documento.id,

                    ...documento.data()

                });

            }
        );


        cobros.sort(
            (a,b) => {

                return String(
                    b.fecha || ""
                ).localeCompare(
                    String(
                        a.fecha || ""
                    )
                );

            }
        );


        actualizarResumen();

        mostrarCobros();

    }
    catch(error){

        console.error(
            "ERROR CARGANDO COBROS:",
            error
        );


        listaCobros.innerHTML = `
            <tr>
                <td colspan="7" class="vacio">
                    No se pudieron cargar los cobros.
                </td>
            </tr>
        `;

        mostrarMensaje(
            "No se pudieron cargar los cobros.\n\n" +
            (
                error.message ||
                "Error desconocido."
            ),
            "error"
        );

    }

}


/* =========================================================
   RESUMEN
========================================================= */

function actualizarResumen(){

    let cobrados =
        0;

    let anulados =
        0;

    let cantidad =
        0;


    cobros.forEach(
        cobro => {

            const importe =
                Number(
                    cobro.importe || 0
                );


            const estado =
                String(
                    cobro.estado || "cobrado"
                )
                .trim()
                .toLowerCase();


            if(
                estado === "anulado"
            ){

                anulados +=
                    importe;

            }
            else{

                cobrados +=
                    importe;

                cantidad++;

            }

        }
    );


    totalCobrado.textContent =
        formatearPesos(
            cobrados
        );


    totalAnulado.textContent =
        formatearPesos(
            anulados
        );


    cantidadCobros.textContent =
        String(
            cantidad
        );

}


/* =========================================================
   MOSTRAR COBROS
========================================================= */

function mostrarCobros(){

    const texto =
        buscarInput.value
            .trim()
            .toLowerCase();


    const filtrados =
        cobros.filter(
            cobro => {

                const contenido = (

                    String(
                        cobro.clienteNombre || ""
                    ) +

                    " " +

                    String(
                        cobro.trabajoNombre || ""
                    ) +

                    " " +

                    String(
                        cobro.medioPago || ""
                    ) +

                    " " +

                    String(
                        cobro.referencia || ""
                    )

                ).toLowerCase();


                return contenido.includes(
                    texto
                );

            }
        );


    if(
        filtrados.length === 0
    ){

        listaCobros.innerHTML = `
            <tr>
                <td colspan="7" class="vacio">
                    No hay cobros para mostrar.
                </td>
            </tr>
        `;

        return;

    }


    listaCobros.innerHTML =
        filtrados
            .map(
                cobro => {

                    const estado =
                        String(
                            cobro.estado ||
                            "cobrado"
                        )
                        .trim()
                        .toLowerCase();


                    const claseEstado =
                        estado === "anulado"
                        ?
                        "estado-anulado"
                        :
                        "estado-cobrado";


                    const textoEstado =
                        estado === "anulado"
                        ?
                        "Anulado"
                        :
                        "Cobrado";


                    return `

                        <tr>

                            <td>
                                ${
                                    escaparHTML(
                                        formatearFecha(
                                            cobro.fecha
                                        )
                                    )
                                }
                            </td>


                            <td>

                                <strong>
                                    ${
                                        escaparHTML(
                                            cobro.clienteNombre ||
                                            "Cliente"
                                        )
                                    }
                                </strong>

                            </td>


                            <td>

                                ${
                                    escaparHTML(
                                        cobro.trabajoNombre ||
                                        "-"
                                    )
                                }

                            </td>


                            <td>

                                <span class="importe">

                                    ${
                                        formatearPesos(
                                            cobro.importe
                                        )
                                    }

                                </span>

                            </td>


                            <td>

                                ${
                                    escaparHTML(
                                        cobro.medioPago ||
                                        "-"
                                    )
                                }

                                ${
                                    cobro.referencia
                                    ?
                                    `
                                    <br>
                                    <small>
                                        Ref:
                                        ${
                                            escaparHTML(
                                                cobro.referencia
                                            )
                                        }
                                    </small>
                                    `
                                    :
                                    ""
                                }

                            </td>


                            <td>

                                <span
                                    class="estado ${claseEstado}"
                                >
                                    ${textoEstado}
                                </span>

                            </td>


                            <td>

                                <div class="acciones">

                                    ${
                                        estado !== "anulado"
                                        ?
                                        `
                                        <button
                                            type="button"
                                            class="btn btn-secondary"
                                            data-anular="${cobro.id}"
                                        >
                                            Anular
                                        </button>
                                        `
                                        :
                                        ""
                                    }


                                    <button
                                        type="button"
                                        class="btn btn-danger"
                                        data-eliminar="${cobro.id}"
                                    >
                                        🗑️
                                    </button>

                                </div>

                            </td>

                        </tr>

                    `;

                }
            )
            .join("");


    document
        .querySelectorAll(
            "[data-anular]"
        )
        .forEach(
            boton => {

                boton.addEventListener(
                    "click",
                    () => {

                        anularCobro(
                            boton.dataset.anular
                        );

                    }
                );

            }
        );


    document
        .querySelectorAll(
            "[data-eliminar]"
        )
        .forEach(
            boton => {

                boton.addEventListener(
                    "click",
                    () => {

                        eliminarCobro(
                            boton.dataset.eliminar
                        );

                    }
                );

            }
        );

}


/* =========================================================
   ANULAR COBRO
========================================================= */

async function anularCobro(
    cobroId
){

    const cobro =
        cobros.find(
            item =>
                item.id === cobroId
        );


    if(!cobro){

        return;

    }


    const confirmar =
        confirm(
            "¿Querés anular este cobro?\n\n" +
            (
                cobro.clienteNombre ||
                "Cliente"
            ) +
            "\n" +
            formatearPesos(
                cobro.importe
            )
        );


    if(!confirmar){

        return;

    }


    try{

        const { updateDoc } =
            await import(
                "https://www.gstatic.com/firebasejs/12.18.0/firebase-firestore.js"
            );


        await updateDoc(
            doc(
                db,
                "cobros",
                cobroId
            ),
            {

                estado:
                    "anulado",

                fechaActualizacion:
                    serverTimestamp()

            }
        );


        mostrarMensaje(
            "✅ Cobro anulado.",
            "exito"
        );


        await cargarCobros();

    }
    catch(error){

        console.error(
            "ERROR ANULANDO COBRO:",
            error
        );


        mostrarMensaje(
            "No se pudo anular el cobro.\n\n" +
            (
                error.message ||
                "Error desconocido."
            ),
            "error"
        );

    }

}


/* =========================================================
   ELIMINAR COBRO
========================================================= */

async function eliminarCobro(
    cobroId
){

    const cobro =
        cobros.find(
            item =>
                item.id === cobroId
        );


    if(!cobro){

        return;

    }


    const confirmar =
        confirm(
            "¿Querés eliminar definitivamente este cobro?\n\n" +
            (
                cobro.clienteNombre ||
                "Cliente"
            ) +
            "\n" +
            formatearPesos(
                cobro.importe
            )
        );


    if(!confirmar){

        return;

    }


    try{

        await deleteDoc(
            doc(
                db,
                "cobros",
                cobroId
            )
        );


        mostrarMensaje(
            "✅ Cobro eliminado.",
            "exito"
        );


        await cargarCobros();

    }
    catch(error){

        console.error(
            "ERROR ELIMINANDO COBRO:",
            error
        );


        mostrarMensaje(
            "No se pudo eliminar el cobro.\n\n" +
            (
                error.message ||
                "Error desconocido."
            ),
            "error"
        );

    }

}

onAuthStateChanged(
    auth,
    async usuario => {

        if(!usuario){

            window.location.replace(
                "login.html"
            );

            return;

        }


        usuarioActual =
            usuario;


        try{

            /* =================================================
               BUSCAR USUARIO
            ================================================== */

            let empresaEncontrada =
                "";


            const referenciaUsuario =
                doc(
                    db,
                    "usuarios",
                    usuario.uid
                );


            const {
                getDoc
            } =
                await import(
                    "https://www.gstatic.com/firebasejs/12.18.0/firebase-firestore.js"
                );


            const documentoUsuario =
                await getDoc(
                    referenciaUsuario
                );


            if(
                documentoUsuario.exists()
            ){

                const datos =
                    documentoUsuario.data();


                empresaEncontrada =
                    String(
                        datos.empresaId ||
                        datos.idEmpresa ||
                        datos.empresa ||
                        ""
                    ).trim();

            }


            /* =================================================
               BUSCAR EMPRESA POR PROPIETARIO
            ================================================== */

            if(!empresaEncontrada){

                const consultaEmpresa =
                    query(
                        collection(
                            db,
                            "empresas"
                        ),
                        where(
                            "propietarioId",
                            "==",
                            usuario.uid
                        )
                    );


                const empresasSnapshot =
                    await getDocs(
                        consultaEmpresa
                    );


                if(
                    !empresasSnapshot.empty
                ){

                    empresaEncontrada =
                        empresasSnapshot
                            .docs[0]
                            .id;

                }

            }


            /* =================================================
               COMPATIBILIDAD EMP-UID
            ================================================== */

            if(!empresaEncontrada){

                const posibleEmpresa =
                    "EMP-" +
                    usuario.uid;


                const referenciaEmpresa =
                    doc(
                        db,
                        "empresas",
                        posibleEmpresa
                    );


                const documentoEmpresa =
                    await getDoc(
                        referenciaEmpresa
                    );


                if(
                    documentoEmpresa.exists()
                ){

                    empresaEncontrada =
                        posibleEmpresa;

                }

            }


            if(!empresaEncontrada){

                mostrarMensaje(
                    "No se pudo identificar la empresa de esta cuenta.",
                    "error"
                );

                return;

            }


            empresaId =
                empresaEncontrada;


            console.log(
                "GESBASE COBROS UID:",
                usuario.uid
            );


            console.log(
                "GESBASE COBROS empresaId:",
                empresaId
            );


            /* =================================================
               CARGAR DATOS
            ================================================== */

            await cargarClientes();

            await cargarTrabajos();

            await cargarCobros();


        }
        catch(error){

            console.error(
                "ERROR INICIALIZANDO COBROS:",
                error
            );


            mostrarMensaje(
                "No se pudo cargar el módulo de cobros.\n\n" +
                (
                    error.message ||
                    "Error desconocido."
                ),
                "error"
            );

        }

    }
);
