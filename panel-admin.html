<!DOCTYPE html>
<html lang="es">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#111827">

<title>Panel de Administrador - GESBASE</title>

<style>

*{
    box-sizing:border-box;
    margin:0;
    padding:0;
}

body{
    font-family:Arial,sans-serif;
    background:#f3f4f6;
    color:#111827;
    min-height:100vh;
}

.app{
    width:100%;
    max-width:900px;
    margin:auto;
    min-height:100vh;
    background:#fff;
}

header{
    background:#111827;
    color:#fff;
    padding:25px 20px;
}

header h1{
    font-size:27px;
}

header p{
    margin-top:6px;
    color:#d1d5db;
    font-size:14px;
}

main{
    padding:20px;
}

.titulo{
    font-size:23px;
    font-weight:bold;
    margin-bottom:7px;
}

.descripcion{
    color:#6b7280;
    font-size:14px;
    margin-bottom:20px;
    line-height:1.5;
}

.tarjeta{
    background:#fff;
    border:1px solid #d1d5db;
    border-radius:14px;
    padding:18px;
    margin-bottom:18px;
}

.filtros{
    display:grid;
    grid-template-columns:1fr 1fr;
    gap:12px;
}

.campo label{
    display:block;
    font-size:13px;
    font-weight:bold;
    margin-bottom:6px;
}

.campo input,
.campo select{
    width:100%;
    padding:12px;
    border:1px solid #d1d5db;
    border-radius:9px;
    font-size:15px;
}

.boton{
    width:100%;
    border:none;
    border-radius:10px;
    padding:14px;
    margin-top:12px;
    font-size:15px;
    font-weight:bold;
    cursor:pointer;
}

.boton-actualizar{
    background:#111827;
    color:#fff;
}

.resumen{
    display:grid;
    grid-template-columns:repeat(3,1fr);
    gap:12px;
    margin-bottom:18px;
}

.resumen-item{
    background:#f3f4f6;
    border-radius:12px;
    padding:15px;
    text-align:center;
}

.resumen-numero{
    font-size:25px;
    font-weight:bold;
}

.resumen-texto{
    color:#6b7280;
    font-size:12px;
    margin-top:5px;
}

.fichajes{
    display:flex;
    flex-direction:column;
    gap:14px;
}

.fichaje{
    border:1px solid #e5e7eb;
    border-radius:13px;
    padding:16px;
    background:#fafafa;
}

.fichaje-cabecera{
    display:flex;
    justify-content:space-between;
    align-items:flex-start;
    gap:10px;
    margin-bottom:14px;
}

.empleado{
    font-size:18px;
    font-weight:bold;
}

.puesto{
    color:#6b7280;
    font-size:13px;
    margin-top:4px;
}

.estado{
    padding:6px 9px;
    border-radius:20px;
    font-size:11px;
    font-weight:bold;
    white-space:nowrap;
}

.estado-abierto{
    background:#dcfce7;
    color:#166534;
}

.estado-cerrado{
    background:#fee2e2;
    color:#991b1b;
}

.datos{
    display:grid;
    grid-template-columns:1fr 1fr;
    gap:10px;
}

.dato{
    background:#fff;
    border:1px solid #e5e7eb;
    border-radius:9px;
    padding:10px;
}

.etiqueta{
    display:block;
    color:#6b7280;
    font-size:11px;
    margin-bottom:4px;
}

.valor{
    font-size:14px;
    font-weight:bold;
}

.ubicacion{
    margin-top:12px;
    padding:12px;
    border-radius:10px;
    background:#eff6ff;
    border:1px solid #bfdbfe;
}

.ubicacion-titulo{
    font-weight:bold;
    color:#1e40af;
    font-size:14px;
    margin-bottom:6px;
}

.coordenadas{
    font-size:12px;
    color:#374151;
    line-height:1.6;
    word-break:break-word;
}

.boton-mapa{
    display:inline-block;
    margin-top:8px;
    padding:9px 12px;
    border-radius:8px;
    background:#2563eb;
    color:#fff;
    text-decoration:none;
    font-size:12px;
    font-weight:bold;
}

.sin-ubicacion{
    color:#6b7280;
    font-size:13px;
}

.cargando,
.sin-registros{
    text-align:center;
    padding:30px;
    color:#6b7280;
}

.error{
    background:#fee2e2;
    color:#991b1b;
    padding:14px;
    border-radius:10px;
    margin-bottom:15px;
    display:none;
}

.exito{
    background:#dcfce7;
    color:#166534;
    padding:14px;
    border-radius:10px;
    margin-bottom:15px;
    display:none;
}

.boton-volver{
    background:#e5e7eb;
    color:#111827;
    margin-top:20px;
}

@media(max-width:600px){

    main{
        padding:15px;
    }

    .filtros{
        grid-template-columns:1fr;
    }

    .resumen{
        grid-template-columns:1fr 1fr;
    }

    .datos{
        grid-template-columns:1fr;
    }

    .fichaje-cabecera{
        flex-direction:column;
    }

}

</style>

</head>

<body>

<div class="app">

<header>

<h1>GESBASE</h1>

<p>
Panel de Administrador
</p>

</header>

<main>

<div id="mensajeError" class="error"></div>

<div id="mensajeExito" class="exito"></div>


<div class="tarjeta">

<div class="titulo">
Control de fichajes
</div>

<div class="descripcion">
Consultá los horarios y ubicaciones GPS de los empleados.
</div>


<div class="filtros">

<div class="campo">

<label for="filtroFecha">
Fecha
</label>

<input
type="date"
id="filtroFecha"
>

</div>


<div class="campo">

<label for="filtroEstado">
Estado
</label>

<select id="filtroEstado">

<option value="">
Todos
</option>

<option value="abierto">
En curso
</option>

<option value="cerrado">
Finalizados
</option>

</select>

</div>

</div>


<button
id="btnActualizar"
class="boton boton-actualizar"
>
🔄 ACTUALIZAR FICHAJES
</button>

</div>


<div class="resumen">

<div class="resumen-item">

<div
id="totalFichajes"
class="resumen-numero"
>
0
</div>

<div class="resumen-texto">
Fichajes
</div>

</div>


<div class="resumen-item">

<div
id="fichajesActivos"
class="resumen-numero"
>
0
</div>

<div class="resumen-texto">
En curso
</div>

</div>


<div class="resumen-item">

<div
id="fichajesGPS"
class="resumen-numero"
>
0
</div>

<div class="resumen-texto">
Con GPS
</div>

</div>

</div>


<div class="tarjeta">

<div class="titulo">
Fichajes de empleados
</div>

<div
id="listaFichajes"
class="fichajes"
>

<div class="cargando">
Cargando fichajes...
</div>

</div>

</div>


<button
id="btnVolver"
class="boton boton-volver"
>
⬅️ Volver a GESBASE
</button>

</main>

</div>


<script type="module">


// ==========================================
// FIREBASE
// ==========================================

import {
    auth,
    db
} from "./Js/firebase.js";


import {
    onAuthStateChanged
} from
"https://www.gstatic.com/firebasejs/12.1.0/firebase-auth.js";


import {
    collection,
    getDocs,
    query,
    where
} from
"https://www.gstatic.com/firebasejs/12.1.0/firebase-firestore.js";


// ==========================================
// ELEMENTOS
// ==========================================

const listaFichajes =
document.getElementById("listaFichajes");

const filtroFecha =
document.getElementById("filtroFecha");

const filtroEstado =
document.getElementById("filtroEstado");

const btnActualizar =
document.getElementById("btnActualizar");

const btnVolver =
document.getElementById("btnVolver");

const totalFichajes =
document.getElementById("totalFichajes");

const fichajesActivos =
document.getElementById("fichajesActivos");

const fichajesGPS =
document.getElementById("fichajesGPS");

const mensajeError =
document.getElementById("mensajeError");

const mensajeExito =
document.getElementById("mensajeExito");


// ==========================================
// VARIABLES
// ==========================================

let usuarioActual = null;

let empresaId = "";

let todosLosFichajes = [];


// ==========================================
// UTILIDADES
// ==========================================

function texto(valor){

    if(
        valor === undefined ||
        valor === null
    ){

        return "";

    }

    return String(valor);

}


function numero(valor){

    const n =
    Number(valor);

    return Number.isFinite(n)
        ? n
        : 0;

}


function moneda(valor){

    return new Intl.NumberFormat(
        "es-AR",
        {
            style:"currency",
            currency:"ARS",
            maximumFractionDigits:0
        }
    ).format(
        numero(valor)
    );

}


function mostrarError(mensaje){

    mensajeError.textContent =
    mensaje;

    mensajeError.style.display =
    "block";

    mensajeExito.style.display =
    "none";

}


function mostrarExito(mensaje){

    mensajeExito.textContent =
    mensaje;

    mensajeExito.style.display =
    "block";

    mensajeError.style.display =
    "none";

}


function limpiarMensajes(){

    mensajeError.style.display =
    "none";

    mensajeExito.style.display =
    "none";

}


// ==========================================
// OBTENER UBICACIÓN
// ==========================================

function obtenerUbicacion(
    fichaje,
    tipo
){

    const ubicacionDirecta =
    tipo === "entrada"
        ? fichaje.entradaUbicacion
        : fichaje.salidaUbicacion;


    if(
        ubicacionDirecta &&
        typeof ubicacionDirecta === "object"
    ){

        return ubicacionDirecta;

    }


    /*
     * Compatibilidad con posibles nombres
     * alternativos guardados anteriormente.
     */

    if(tipo === "entrada"){

        if(
            fichaje.ubicacionEntrada &&
            typeof fichaje.ubicacionEntrada === "object"
        ){

            return fichaje.ubicacionEntrada;

        }

    }


    if(tipo === "salida"){

        if(
            fichaje.ubicacionSalida &&
            typeof fichaje.ubicacionSalida === "object"
        ){

            return fichaje.ubicacionSalida;

        }

    }


    return null;

}


// ==========================================
// MOSTRAR UBICACIÓN
// ==========================================

function crearUbicacion(
    ubicacion,
    titulo
){

    const contenedor =
    document.createElement("div");

    contenedor.className =
    "ubicacion";


    const tituloElemento =
    document.createElement("div");

    tituloElemento.className =
    "ubicacion-titulo";

    tituloElemento.textContent =
    "📍 " + titulo;


    contenedor.appendChild(
        tituloElemento
    );


    if(!ubicacion){

        const sin =
        document.createElement("div");

        sin.className =
        "sin-ubicacion";

        sin.textContent =
        "No se registró ubicación GPS.";

        contenedor.appendChild(
            sin
        );

        return contenedor;

    }


    const lat =
    numero(
        ubicacion.lat ??
        ubicacion.latitude
    );


    const lng =
    numero(
        ubicacion.lng ??
        ubicacion.longitude
    );


    const precision =
    numero(
        ubicacion.precision ??
        ubicacion.accuracy
    );


    if(
        lat === 0 &&
        lng === 0
    ){

        const sin =
        document.createElement("div");

        sin.className =
        "sin-ubicacion";

        sin.textContent =
        "No hay coordenadas GPS válidas.";

        contenedor.appendChild(
            sin
        );

        return contenedor;

    }


    const coordenadas =
    document.createElement("div");

    coordenadas.className =
    "coordenadas";


    let contenido =
    "Latitud: " +
    lat +
    "<br>" +
    "Longitud: " +
    lng;


    if(precision > 0){

        contenido +=
        "<br>Precisión: aproximadamente " +
        Math.round(precision) +
        " m";

    }


    coordenadas.innerHTML =
    contenido;


    contenedor.appendChild(
        coordenadas
    );


    const mapa =
    document.createElement("a");

    mapa.className =
    "boton-mapa";

    mapa.target =
    "_blank";

    mapa.rel =
    "noopener noreferrer";


    mapa.href =
    "https://www.google.com/maps?q=" +
    encodeURIComponent(
        lat + "," + lng
    );


    mapa.textContent =
    "🗺️ Ver en mapa";


    contenedor.appendChild(
        mapa
    );


    return contenedor;

}


// ==========================================
// CARGAR EMPRESA
// ==========================================

async function cargarEmpresa(){

    if(!usuarioActual){

        throw new Error(
            "No hay una sesión activa."
        );

    }


    /*
     * La empresa se obtiene primero desde
     * usuarios/{uid}, buscando empresaId.
     */

    const consultaUsuario =
    await getDocs(
        query(
            collection(
                db,
                "usuarios"
            ),
            where(
                "__name__",
                "==",
                usuarioActual.uid
            )
        )
    );


    if(
        !consultaUsuario.empty
    ){

        const datos =
        consultaUsuario.docs[0].data();


        empresaId =
        texto(
            datos.empresaId
        ).trim();


        /*
         * Compatibilidad con cuentas donde
         * la empresa está guardada con otro campo.
         */

        if(!empresaId){

            empresaId =
            texto(
                datos.empresa
            ).trim();

        }

    }


    /*
     * Si no existe empresaId en usuarios,
     * usamos el UID como identificador de
     * empresa, que es el esquema utilizado
     * por el panel principal.
     */

    if(!empresaId){

        empresaId =
        usuarioActual.uid;

    }


    console.log(
        "Empresa utilizada para fichajes:",
        empresaId
    );

}


// ==========================================
// CARGAR FICHAJES
// ==========================================

async function cargarFichajes(){

    limpiarMensajes();


    listaFichajes.innerHTML =
    `
    <div class="cargando">
        Cargando fichajes...
    </div>
    `;


    try{

        let consulta;


        /*
         * Buscamos por empresaId.
         */

        consulta =
        query(
            collection(
                db,
                "fichajes"
            ),
            where(
                "empresaId",
                "==",
                empresaId
            )
        );


        const resultados =
        await getDocs(
            consulta
        );


        todosLosFichajes = [];


        resultados.forEach(
            documento => {

                todosLosFichajes.push({

                    id:
                    documento.id,

                    ...documento.data()

                });

            }
        );


        /*
         * Ordenar:
         * más recientes primero.
         */

        todosLosFichajes.sort(
            (a,b) => {

                const fechaA =
                texto(a.fecha) +
                " " +
                texto(a.horaEntrada);


                const fechaB =
                texto(b.fecha) +
                " " +
                texto(b.horaEntrada);


                return fechaB.localeCompare(
                    fechaA
                );

            }
        );


        mostrarFichajes();


        mostrarExito(
            "Fichajes actualizados correctamente."
        );

    }
    catch(error){

        console.error(
            "Error cargando fichajes:",
            error
        );


        mostrarError(
            "No se pudieron cargar los fichajes: " +
            error.message
        );


        listaFichajes.innerHTML =
        `
        <div class="sin-registros">
            No se pudieron cargar los fichajes.
        </div>
        `;

    }

}


// ==========================================
// MOSTRAR FICHAJES
// ==========================================

function mostrarFichajes(){

    const fechaFiltro =
    filtroFecha.value;

    const estadoFiltro =
    filtroEstado.value;


    const filtrados =
    todosLosFichajes.filter(
        fichaje => {

            if(
                fechaFiltro &&
                texto(
                    fichaje.fecha
                ) !== fechaFiltro
            ){

                return false;

            }


            if(
                estadoFiltro &&
                texto(
                    fichaje.estado
                ) !== estadoFiltro
            ){

                return false;

            }


            return true;

        }
    );


    totalFichajes.textContent =
    filtrados.length;


    fichajesActivos.textContent =
    filtrados.filter(
        fichaje =>
        texto(
            fichaje.estado
        ) === "abierto"
    ).length;


    fichajesGPS.textContent =
    filtrados.filter(
        fichaje => {

            return !!(
                obtenerUbicacion(
                    fichaje,
                    "entrada"
                ) ||
                obtenerUbicacion(
                    fichaje,
                    "salida"
                )
            );

        }
    ).length;


    if(
        filtrados.length === 0
    ){

        listaFichajes.innerHTML =
        `
        <div class="sin-registros">
            No hay fichajes para mostrar.
        </div>
        `;

        return;

    }


    listaFichajes.innerHTML =
    "";


    filtrados.forEach(
        fichaje => {

            const tarjeta =
            document.createElement("div");

            tarjeta.className =
            "fichaje";


            // =============================
            // CABECERA
            // =============================

            const cabecera =
            document.createElement("div");

            cabecera.className =
            "fichaje-cabecera";


            const empleadoContenedor =
            document.createElement("div");


            const empleado =
            document.createElement("div");

            empleado.className =
            "empleado";


            empleado.textContent =
            texto(
                fichaje.empleadoNombre
            ) ||
            "Empleado";


            empleadoContenedor.appendChild(
                empleado
            );


            if(
                fichaje.puesto
            ){

                const puesto =
                document.createElement("div");

                puesto.className =
                "puesto";

                puesto.textContent =
                fichaje.puesto;

                empleadoContenedor.appendChild(
                    puesto
                );

            }


            const estado =
            document.createElement("div");

            estado.className =
            "estado " +
            (
                fichaje.estado === "abierto"
                    ? "estado-abierto"
                    : "estado-cerrado"
            );


            estado.textContent =
            fichaje.estado === "abierto"
                ? "EN CURSO"
                : "FINALIZADO";


            cabecera.appendChild(
                empleadoContenedor
            );


            cabecera.appendChild(
                estado
            );


            tarjeta.appendChild(
                cabecera
            );


            // =============================
            // DATOS
            // =============================

            const datos =
            document.createElement("div");

            datos.className =
            "datos";


            function crearDato(
                etiqueta,
                valor
            ){

                const elemento =
                document.createElement("div");

                elemento.className =
                "dato";


                const titulo =
                document.createElement("span");

                titulo.className =
                "etiqueta";

                titulo.textContent =
                etiqueta;


                const contenido =
                document.createElement("span");

                contenido.className =
                "valor";

                contenido.textContent =
                valor;


                elemento.appendChild(
                    titulo
                );

                elemento.appendChild(
                    contenido
                );


                return elemento;

            }


            datos.appendChild(
                crearDato(
                    "📅 Fecha",
                    texto(
                        fichaje.fecha
                    ) || "-"
                )
            );


            datos.appendChild(
                crearDato(
                    "🟢 Entrada",
                    texto(
                        fichaje.horaEntrada
                    ) || "-"
                )
            );


            datos.appendChild(
                crearDato(
                    "🔴 Salida",
                    texto(
                        fichaje.horaSalida
                    ) || "En curso"
                )
            );


            datos.appendChild(
                crearDato(
                    "⏱️ Tiempo trabajado",
                    formatearDuracion(
                        numero(
                            fichaje.duracionSegundos
                        ) * 1000
                    )
                )
            );


            datos.appendChild(
                crearDato(
                    "💰 Importe",
                    moneda(
                        fichaje.importe
                    )
                )
            );


            tarjeta.appendChild(
                datos
            );


            // =============================
            // GPS ENTRADA
            // =============================

            tarjeta.appendChild(
                crearUbicacion(
                    obtenerUbicacion(
                        fichaje,
                        "entrada"
                    ),
                    "Ubicación de entrada"
                )
            );


            // =============================
            // GPS SALIDA
            // =============================

            tarjeta.appendChild(
                crearUbicacion(
                    obtenerUbicacion(
                        fichaje,
                        "salida"
                    ),
                    "Ubicación de salida"
                )
            );


            listaFichajes.appendChild(
                tarjeta
            );

        }
    );

}


// ==========================================
// DURACIÓN
// ==========================================

function formatearDuracion(ms){

    if(
        !Number.isFinite(ms) ||
        ms < 0
    ){

        ms = 0;

    }


    const segundos =
    Math.floor(
        ms / 1000
    );


    const horas =
    Math.floor(
        segundos / 3600
    );


    const minutos =
    Math.floor(
        (segundos % 3600) / 60
    );


    const segundosFinal =
    segundos % 60;


    return (
        String(horas).padStart(2,"0") +
        ":" +
        String(minutos).padStart(2,"0") +
        ":" +
        String(segundosFinal).padStart(2,"0")
    );

}


// ==========================================
// FILTROS
// ==========================================

filtroFecha.addEventListener(
    "change",
    mostrarFichajes
);


filtroEstado.addEventListener(
    "change",
    mostrarFichajes
);


// ==========================================
// ACTUALIZAR
// ==========================================

btnActualizar.addEventListener(
    "click",
    async function(){

        await cargarFichajes();

    }
);


// ==========================================
// VOLVER
// ==========================================

btnVolver.addEventListener(
    "click",
    function(){

        window.location.href =
        "index.html";

    }
);


// ==========================================
// AUTENTICACIÓN
// ==========================================

onAuthStateChanged(
    auth,
    async function(usuario){

        if(!usuario){

            window.location.replace(
                "login.html"
            );

            return;

        }


        usuarioActual =
        usuario;


        try{

            await cargarEmpresa();

            await cargarFichajes();

        }
        catch(error){

            console.error(
                "Error inicial:",
                error
            );


            mostrarError(
                error.message
            );

        }

    }
);

</script>

</body>

</html>
