<!DOCTYPE html>
<html lang="es">

<head>

<meta charset="UTF-8">

<meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
>

<meta
    name="theme-color"
    content="#111827"
>

<title>Viajes - GESBASE</title>

<style>

*{
    box-sizing:border-box;
}

body{
    margin:0;
    font-family:
        -apple-system,
        BlinkMacSystemFont,
        "Segoe UI",
        Roboto,
        Arial,
        sans-serif;
    background:#f3f4f6;
    color:#111827;
}

header{
    background:#111827;
    color:white;
    padding:15px 20px;
    display:flex;
    align-items:center;
    justify-content:space-between;
    gap:15px;
    position:sticky;
    top:0;
    z-index:100;
}

.logo{
    font-size:21px;
    font-weight:800;
}

.subtitulo{
    font-size:12px;
    opacity:.7;
}

.btn-volver{
    border:none;
    background:#374151;
    color:white;
    padding:9px 14px;
    border-radius:9px;
    cursor:pointer;
}

main{
    max-width:1150px;
    margin:auto;
    padding:20px;
}

.titulo{
    margin-bottom:20px;
}

.titulo h1{
    margin:0;
    font-size:27px;
}

.titulo p{
    color:#6b7280;
    margin-top:5px;
}

.card{
    background:white;
    border-radius:16px;
    padding:20px;
    margin-bottom:20px;
    box-shadow:0 4px 15px rgba(0,0,0,.06);
}

.card h2{
    margin-top:0;
    font-size:19px;
}

.grid{
    display:grid;
    grid-template-columns:repeat(2,1fr);
    gap:15px;
}

.campo{
    display:flex;
    flex-direction:column;
    gap:6px;
}

.campo.full{
    grid-column:1/-1;
}

label{
    font-size:13px;
    font-weight:700;
}

input,
select,
textarea{
    width:100%;
    padding:11px;
    border:1px solid #d1d5db;
    border-radius:9px;
    font-size:14px;
    background:white;
}

textarea{
    min-height:80px;
    resize:vertical;
}

.btn{
    border:none;
    padding:11px 16px;
    border-radius:9px;
    cursor:pointer;
    font-weight:700;
}

.btn-primary{
    background:#111827;
    color:white;
}

.btn-green{
    background:#16a34a;
    color:white;
}

.btn-blue{
    background:#2563eb;
    color:white;
}

.btn-orange{
    background:#ea580c;
    color:white;
}

.btn-red{
    background:#dc2626;
    color:white;
}

.btn-gray{
    background:#6b7280;
    color:white;
}

.acciones{
    display:flex;
    gap:8px;
    flex-wrap:wrap;
    margin-top:18px;
}

.resumen{
    display:grid;
    grid-template-columns:repeat(5,1fr);
    gap:12px;
}

.resumen-box{
    background:#f9fafb;
    border-radius:12px;
    padding:15px;
    text-align:center;
}

.resumen-box strong{
    display:block;
    font-size:25px;
}

.resumen-box span{
    color:#6b7280;
    font-size:12px;
}

.lista{
    display:grid;
    gap:14px;
}

.viaje{
    border:1px solid #e5e7eb;
    border-radius:14px;
    padding:17px;
}

.viaje-cabecera{
    display:flex;
    justify-content:space-between;
    align-items:center;
    gap:10px;
    flex-wrap:wrap;
}

.numero{
    font-weight:800;
    font-size:17px;
}

.estado{
    padding:5px 10px;
    border-radius:20px;
    font-size:12px;
    font-weight:800;
}

.estado-planificado{
    background:#dbeafe;
    color:#1d4ed8;
}

.estado-curso{
    background:#dcfce7;
    color:#15803d;
}

.estado-finalizado{
    background:#e5e7eb;
    color:#374151;
}

.estado-cancelado{
    background:#fee2e2;
    color:#b91c1c;
}

.info{
    display:grid;
    grid-template-columns:repeat(3,1fr);
    gap:10px;
    margin-top:14px;
}

.info-item{
    background:#f9fafb;
    padding:10px;
    border-radius:9px;
}

.info-item small{
    display:block;
    color:#6b7280;
    font-size:11px;
}

.info-item strong{
    font-size:14px;
}

.mensaje{
    padding:12px;
    border-radius:10px;
    margin-bottom:15px;
    display:none;
}

.exito{
    background:#dcfce7;
    color:#166534;
}

.error{
    background:#fee2e2;
    color:#991b1b;
}

.vacio{
    text-align:center;
    padding:30px;
    color:#6b7280;
}

@media(max-width:800px){

    .grid{
        grid-template-columns:1fr;
    }

    .resumen{
        grid-template-columns:repeat(2,1fr);
    }

    .info{
        grid-template-columns:1fr;
    }

}

</style>

</head>

<body>

<header>

    <div>
        <div class="logo">GESBASE</div>
        <div class="subtitulo">Gestión de viajes</div>
    </div>

    <button
        class="btn-volver"
        onclick="volver()"
    >
        ← Volver
    </button>

</header>


<main>

    <div class="titulo">
        <h1>🚛 Viajes</h1>
        <p>Planificá y controlá los viajes de tu empresa.</p>
    </div>


    <div
        id="mensaje"
        class="mensaje"
    ></div>


    <!-- RESUMEN -->

    <div class="card">

        <div class="resumen">

            <div class="resumen-box">
                <strong id="totalViajes">0</strong>
                <span>Total</span>
            </div>

            <div class="resumen-box">
                <strong id="totalPlanificados">0</strong>
                <span>Planificados</span>
            </div>

            <div class="resumen-box">
                <strong id="totalCurso">0</strong>
                <span>En curso</span>
            </div>

            <div class="resumen-box">
                <strong id="totalFinalizados">0</strong>
                <span>Finalizados</span>
            </div>

            <div class="resumen-box">
                <strong id="totalKm">0</strong>
                <span>Km recorridos</span>
            </div>

        </div>

    </div>


    <!-- NUEVO VIAJE -->

    <div class="card">

        <h2>➕ Nuevo viaje</h2>

        <div class="grid">

            <div class="campo">

                <label for="fecha">
                    Fecha
                </label>

                <input
                    type="date"
                    id="fecha"
                >

            </div>


            <div class="campo">

                <label for="hojaRuta">
                    Hoja de ruta
                </label>

                <select id="hojaRuta">

                    <option value="">
                        Sin hoja de ruta
                    </option>

                </select>

            </div>


            <div class="campo">

                <label for="unidad">
                    Unidad
                </label>

                <select id="unidad">

                    <option value="">
                        Seleccionar unidad
                    </option>

                </select>

            </div>


            <div class="campo">

                <label for="chofer">
                    Chofer
                </label>

                <select id="chofer">

                    <option value="">
                        Seleccionar chofer
                    </option>

                </select>

            </div>


            <div class="campo">

                <label for="origen">
                    Origen
                </label>

                <input
                    type="text"
                    id="origen"
                    placeholder="Ej: Catriel"
                >

            </div>


            <div class="campo">

                <label for="destino">
                    Destino
                </label>

                <input
                    type="text"
                    id="destino"
                    placeholder="Ej: Neuquén"
                >

            </div>


            <div class="campo">

                <label for="horaSalida">
                    Hora de salida
                </label>

                <input
                    type="time"
                    id="horaSalida"
                >

            </div>


            <div class="campo">

                <label for="kmInicial">
                    Kilometraje inicial
                </label>

                <input
                    type="number"
                    id="kmInicial"
                    min="0"
                    step="1"
                    placeholder="Km"
                >

            </div>


            <div class="campo full">

                <label for="observaciones">
                    Observaciones
                </label>

                <textarea
                    id="observaciones"
                    placeholder="Carga, pasajeros, indicaciones, etc."
                ></textarea>

            </div>

        </div>


        <div class="acciones">

            <button
                class="btn btn-primary"
                onclick="crearViaje()"
            >
                🚛 Crear viaje
            </button>

        </div>

    </div>


    <!-- HISTORIAL -->

    <div class="card">

        <h2>📋 Historial de viajes</h2>

        <div
            id="listaViajes"
            class="lista"
        >

            <div class="vacio">
                Cargando viajes...
            </div>

        </div>

    </div>

</main>


<script type="module">

import {
    auth,
    db
} from "./Js/firebase.js";

import {
    onAuthStateChanged
} from "https://www.gstatic.com/firebasejs/12.18.0/firebase-auth.js";

import {
    collection,
    query,
    where,
    getDocs,
    getDoc,
    doc,
    addDoc,
    updateDoc,
    serverTimestamp
} from "https://www.gstatic.com/firebasejs/12.18.0/firebase-firestore.js";


let usuarioActual = null;
let empresaActualId = null;

let unidades = [];
let choferes = [];
let hojasRuta = [];
let viajes = [];


/* =========================================================
   MENSAJES
========================================================= */

function mostrarMensaje(texto, tipo="exito"){

    const elemento =
        document.getElementById("mensaje");

    elemento.textContent = texto;

    elemento.className =
        "mensaje " + tipo;

    elemento.style.display = "block";

    setTimeout(() => {

        elemento.style.display = "none";

    }, 4000);

}


/* =========================================================
   FECHA
========================================================= */

document.getElementById("fecha").value =
    new Date().toISOString().split("T")[0];


/* =========================================================
   AUTENTICACIÓN
========================================================= */

onAuthStateChanged(auth, async usuario => {

    if(!usuario){

        window.location.href =
            "acceso-empleado.html";

        return;
    }

    usuarioActual = usuario;

    try{

        const usuarioSnap =
            await getDoc(
                doc(db, "usuarios", usuario.uid)
            );

        if(!usuarioSnap.exists()){

            mostrarMensaje(
                "No se encontró el usuario.",
                "error"
            );

            return;
        }

        const datosUsuario =
            usuarioSnap.data();

        empresaActualId =
            datosUsuario.empresaId ||
            datosUsuario.idEmpresa ||
            datosUsuario.empresa ||
            usuario.uid;


        const empresaSnap =
            await getDoc(
                doc(
                    db,
                    "empresas",
                    empresaActualId
                )
            );

        if(!empresaSnap.exists()){

            mostrarMensaje(
                "No se encontró la empresa.",
                "error"
            );

            return;
        }


        const empresa =
            empresaSnap.data();


        if(
            empresa.modulos &&
            empresa.modulos.viajes === false
        ){

            mostrarMensaje(
                "El módulo de viajes no está habilitado.",
                "error"
            );

            return;
        }


        await cargarDatos();

    }catch(error){

        console.error(error);

        mostrarMensaje(
            "Error al cargar los datos.",
            "error"
        );

    }

});


/* =========================================================
   CARGAR DATOS
========================================================= */

async function cargarDatos(){

    await Promise.all([

        cargarUnidades(),

        cargarChoferes(),

        cargarHojasRuta(),

        cargarViajes()

    ]);

}


/* =========================================================
   UNIDADES
========================================================= */

async function cargarUnidades(){

    const q =
        query(
            collection(db, "unidades"),
            where(
                "empresaId",
                "==",
                empresaActualId
            )
        );

    const snap =
        await getDocs(q);

    unidades = [];

    const select =
        document.getElementById("unidad");

    select.innerHTML =
        `<option value="">
            Seleccionar unidad
        </option>`;


    snap.forEach(item => {

        const data =
            item.data();

        unidades.push({

            id:item.id,

            ...data

        });


        const option =
            document.createElement("option");

        option.value =
            item.id;

        option.textContent =
            `${data.patente || "Sin patente"} - ${data.tipo || "Unidad"}`;

        select.appendChild(option);

    });

}


/* =========================================================
   CHOFERES
========================================================= */

async function cargarChoferes(){

    const q =
        query(
            collection(db, "choferes"),
            where(
                "empresaId",
                "==",
                empresaActualId
            )
        );

    const snap =
        await getDocs(q);

    choferes = [];

    const select =
        document.getElementById("chofer");

    select.innerHTML =
        `<option value="">
            Seleccionar chofer
        </option>`;


    snap.forEach(item => {

        const data =
            item.data();

        choferes.push({

            id:item.id,

            ...data

        });


        const option =
            document.createElement("option");

        option.value =
            item.id;

        option.textContent =
            data.nombre ||
            data.choferNombre ||
            "Chofer";

        select.appendChild(option);

    });

}


/* =========================================================
   HOJAS DE RUTA
========================================================= */

async function cargarHojasRuta(){

    const q =
        query(
            collection(db, "hojasRuta"),
            where(
                "empresaId",
                "==",
                empresaActualId
            )
        );

    const snap =
        await getDocs(q);

    hojasRuta = [];

    const select =
        document.getElementById("hojaRuta");

    select.innerHTML =
        `<option value="">
            Sin hoja de ruta
        </option>`;


    snap.forEach(item => {

        const data =
            item.data();

        hojasRuta.push({

            id:item.id,

            ...data

        });


        const option =
            document.createElement("option");

        option.value =
            item.id;

        option.textContent =
            `${data.numeroRuta || "Ruta"} - ${data.origen || ""} → ${data.destino || ""}`;

        select.appendChild(option);

    });

}


/* =========================================================
   AUTOCOMPLETAR SEGÚN UNIDAD
========================================================= */

document
    .getElementById("unidad")
    .addEventListener(
        "change",
        () => {

            const unidadId =
                document.getElementById("unidad").value;

            const unidad =
                unidades.find(
                    u => u.id === unidadId
                );

            if(!unidad){

                return;
            }


            if(
                unidad.kilometraje !== undefined &&
                unidad.kilometraje !== null
            ){

                document.getElementById(
                    "kmInicial"
                ).value =
                    unidad.kilometraje;

            }


            if(unidad.choferId){

                document.getElementById(
                    "chofer"
                ).value =
                    unidad.choferId;

            }

        }
    );


/* =========================================================
   AUTOCOMPLETAR DESDE HOJA DE RUTA
========================================================= */

document
    .getElementById("hojaRuta")
    .addEventListener(
        "change",
        () => {

            const id =
                document.getElementById("hojaRuta").value;

            if(!id){

                return;
            }


            const ruta =
                hojasRuta.find(
                    h => h.id === id
                );

            if(!ruta){

                return;
            }


            document.getElementById(
                "origen"
            ).value =
                ruta.origen || "";


            document.getElementById(
                "destino"
            ).value =
                ruta.destino || "";


            document.getElementById(
                "horaSalida"
            ).value =
                ruta.horaSalida || "";


            document.getElementById(
                "kmInicial"
            ).value =
                ruta.kmInicial || "";


            if(ruta.unidadId){

                document.getElementById(
                    "unidad"
                ).value =
                    ruta.unidadId;

            }


            if(ruta.choferId){

                document.getElementById(
                    "chofer"
                ).value =
                    ruta.choferId;

            }

        }
    );


/* =========================================================
   CREAR VIAJE
========================================================= */

window.crearViaje =
    async function(){

        try{

            const fecha =
                document.getElementById(
                    "fecha"
                ).value;

            const unidadId =
                document.getElementById(
                    "unidad"
                ).value;

            const choferId =
                document.getElementById(
                    "chofer"
                ).value;

            const hojaRutaId =
                document.getElementById(
                    "hojaRuta"
                ).value;

            const origen =
                document.getElementById(
                    "origen"
                ).value.trim();

            const destino =
                document.getElementById(
                    "destino"
                ).value.trim();

            const horaSalida =
                document.getElementById(
                    "horaSalida"
                ).value;

            const kmInicial =
                Number(
                    document.getElementById(
                        "kmInicial"
                    ).value
                ) || 0;

            const observaciones =
                document.getElementById(
                    "observaciones"
                ).value.trim();


            if(!fecha){

                mostrarMensaje(
                    "Seleccioná una fecha.",
                    "error"
                );

                return;
            }


            if(!unidadId){

                mostrarMensaje(
                    "Seleccioná una unidad.",
                    "error"
                );

                return;
            }


            if(!choferId){

                mostrarMensaje(
                    "Seleccioná un chofer.",
                    "error"
                );

                return;
            }


            if(!origen || !destino){

                mostrarMensaje(
                    "Ingresá origen y destino.",
                    "error"
                );

                return;
            }


            const unidad =
                unidades.find(
                    u => u.id === unidadId
                );

            const chofer =
                choferes.find(
                    c => c.id === choferId
                );

            const ruta =
                hojasRuta.find(
                    h => h.id === hojaRutaId
                );


            const numeroViaje =
                "V-" +
                Date.now()
                    .toString()
                    .slice(-8);


            const viaje = {

                empresaId:
                    empresaActualId,

                numeroViaje,

                fecha,

                hojaRutaId:
                    hojaRutaId || null,

                numeroRuta:
                    ruta?.numeroRuta || "",

                unidadId,

                patente:
                    unidad?.patente || "",

                unidadTipo:
                    unidad?.tipo || "",

                choferId,

                choferNombre:
                    chofer?.nombre ||
                    chofer?.choferNombre ||
                    "",

                origen,

                destino,

                horaSalida,

                horaLlegada:"",

                kmInicial,

                kmFinal:null,

                kilometrosRecorridos:null,

                estado:"Planificado",

                observaciones,

                creadoPor:
                    usuarioActual.uid,

                creadoEn:
                    serverTimestamp(),

                actualizadoEn:
                    serverTimestamp()

            };


            await addDoc(
                collection(db, "viajes"),
                viaje
            );


            mostrarMensaje(
                "Viaje creado correctamente."
            );


            document.getElementById(
                "origen"
            ).value = "";

            document.getElementById(
                "destino"
            ).value = "";

            document.getElementById(
                "horaSalida"
            ).value = "";

            document.getElementById(
                "kmInicial"
            ).value = "";

            document.getElementById(
                "observaciones"
            ).value = "";


            await cargarDatos();


        }catch(error){

            console.error(error);

            mostrarMensaje(
                "No se pudo crear el viaje.",
                "error"
            );

        }

    };


/* =========================================================
   CARGAR VIAJES
========================================================= */

async function cargarViajes(){

    const q =
        query(
            collection(db, "viajes"),
            where(
                "empresaId",
                "==",
                empresaActualId
            )
        );

    const snap =
        await getDocs(q);

    viajes = [];

    snap.forEach(item => {

        viajes.push({

            id:item.id,

            ...item.data()

        });

    });


    viajes.sort(
        (a,b) => {

            const fechaA =
                `${a.fecha || ""} ${a.horaSalida || ""}`;

            const fechaB =
                `${b.fecha || ""} ${b.horaSalida || ""}`;

            return fechaB.localeCompare(fechaA);

        }
    );


    mostrarViajes();

    actualizarResumen();

}


/* =========================================================
   MOSTRAR VIAJES
========================================================= */

function mostrarViajes(){

    const contenedor =
        document.getElementById(
            "listaViajes"
        );


    if(viajes.length === 0){

        contenedor.innerHTML =
            `<div class="vacio">
                No hay viajes registrados.
            </div>`;

        return;
    }


    contenedor.innerHTML = "";


    viajes.forEach(viaje => {

        const div =
            document.createElement("div");

        div.className = "viaje";


        let claseEstado =
            "estado-planificado";

        if(viaje.estado === "En curso"){

            claseEstado =
                "estado-curso";

        }else if(
            viaje.estado === "Finalizado"
        ){

            claseEstado =
                "estado-finalizado";

        }else if(
            viaje.estado === "Cancelado"
        ){

            claseEstado =
                "estado-cancelado";

        }


        let acciones = "";


        if(viaje.estado === "Planificado"){

            acciones += `
                <button
                    class="btn btn-green"
                    onclick="iniciarViaje('${viaje.id}')"
                >
                    ▶ Iniciar
                </button>

                <button
                    class="btn btn-red"
                    onclick="cancelarViaje('${viaje.id}')"
                >
                    ✕ Cancelar
                </button>
            `;

        }


        if(viaje.estado === "En curso"){

            acciones += `
                <button
                    class="btn btn-blue"
                    onclick="finalizarViaje('${viaje.id}')"
                >
                    ✓ Finalizar
                </button>
            `;

        }


        div.innerHTML = `

            <div class="viaje-cabecera">

                <div class="numero">
                    🚛 ${viaje.numeroViaje || "Viaje"}
                </div>

                <span
                    class="estado ${claseEstado}"
                >
                    ${viaje.estado || "Planificado"}
                </span>

            </div>


            <div class="info">

                <div class="info-item">

                    <small>Fecha</small>

                    <strong>
                        ${viaje.fecha || "-"}
                    </strong>

                </div>


                <div class="info-item">

                    <small>Unidad</small>

                    <strong>
                        ${viaje.patente || "-"}
                    </strong>

                </div>


                <div class="info-item">

                    <small>Chofer</small>

                    <strong>
                        ${viaje.choferNombre || "-"}
                    </strong>

                </div>


                <div class="info-item">

                    <small>Origen</small>

                    <strong>
                        ${viaje.origen || "-"}
                    </strong>

                </div>


                <div class="info-item">

                    <small>Destino</small>

                    <strong>
                        ${viaje.destino || "-"}
                    </strong>

                </div>


                <div class="info-item">

                    <small>Hoja de ruta</small>

                    <strong>
                        ${viaje.numeroRuta || "Sin asignar"}
                    </strong>

                </div>


                <div class="info-item">

                    <small>Km inicial</small>

                    <strong>
                        ${viaje.kmInicial || 0} km
                    </strong>

                </div>


                <div class="info-item">

                    <small>Km final</small>

                    <strong>
                        ${
                            viaje.kmFinal !== null &&
                            viaje.kmFinal !== undefined
                            ? viaje.kmFinal + " km"
                            : "-"
                        }
                    </strong>

                </div>


                <div class="info-item">

                    <small>Km recorridos</small>

                    <strong>
                        ${
                            viaje.kilometrosRecorridos !== null &&
                            viaje.kilometrosRecorridos !== undefined
                            ? viaje.kilometrosRecorridos + " km"
                            : "-"
                        }
                    </strong>

                </div>

            </div>


            ${
                viaje.horaSalida
                ?
                `<p>
                    🕐 Salida:
                    <strong>${viaje.horaSalida}</strong>
                </p>`
                :
                ""
            }


            ${
                viaje.horaLlegada
                ?
                `<p>
                    🏁 Llegada:
                    <strong>${viaje.horaLlegada}</strong>
                </p>`
                :
                ""
            }


            ${
                viaje.observaciones
                ?
                `<p>
                    📝 ${viaje.observaciones}
                </p>`
                :
                ""
            }


            <div class="acciones">

                ${acciones}

            </div>

        `;


        contenedor.appendChild(div);

    });

}


/* =========================================================
   INICIAR VIAJE
========================================================= */

window.iniciarViaje =
    async function(id){

        try{

            const viaje =
                viajes.find(
                    v => v.id === id
                );

            if(!viaje){

                return;
            }


            await updateDoc(

                doc(
                    db,
                    "viajes",
                    id
                ),

                {

                    estado:"En curso",

                    horaSalida:
                        viaje.horaSalida ||
                        new Date().toTimeString()
                            .slice(0,5),

                    actualizadoEn:
                        serverTimestamp()

                }

            );


            await updateDoc(

                doc(
                    db,
                    "unidades",
                    viaje.unidadId
                ),

                {

                    estado:"En viaje",

                    actualizadoEn:
                        serverTimestamp()

                }

            );


            mostrarMensaje(
                "Viaje iniciado."
            );


            await cargarViajes();

        }catch(error){

            console.error(error);

            mostrarMensaje(
                "No se pudo iniciar el viaje.",
                "error"
            );

        }

    };


/* =========================================================
   FINALIZAR VIAJE
========================================================= */

window.finalizarViaje =
    async function(id){

        const viaje =
            viajes.find(
                v => v.id === id
            );

        if(!viaje){

            return;
        }


        const valor =
            prompt(
                "Ingresá el kilometraje final:"
            );


        if(valor === null){

            return;
        }


        const kmFinal =
            Number(valor);


        if(
            !Number.isFinite(kmFinal) ||
            kmFinal < Number(viaje.kmInicial || 0)
        ){

            mostrarMensaje(
                "El kilometraje final no puede ser menor al inicial.",
                "error"
            );

            return;
        }


        const kilometros =
            kmFinal -
            Number(viaje.kmInicial || 0);


        try{

            await updateDoc(

                doc(
                    db,
                    "viajes",
                    id
                ),

                {

                    estado:"Finalizado",

                    kmFinal,

                    kilometrosRecorridos:
                        kilometros,

                    horaLlegada:
                        new Date()
                            .toTimeString()
                            .slice(0,5),

                    actualizadoEn:
                        serverTimestamp()

                }

            );


            if(viaje.unidadId){

                await updateDoc(

                    doc(
                        db,
                        "unidades",
                        viaje.unidadId
                    ),

                    {

                        estado:"Disponible",

                        kilometraje:
                            kmFinal,

                        actualizadoEn:
                            serverTimestamp()

                    }

                );

            }


            mostrarMensaje(
                `Viaje finalizado. ${kilometros} km recorridos.`
            );


            await cargarViajes();


        }catch(error){

            console.error(error);

            mostrarMensaje(
                "No se pudo finalizar el viaje.",
                "error"
            );

        }

    };


/* =========================================================
   CANCELAR VIAJE
========================================================= */

window.cancelarViaje =
    async function(id){

        if(
            !confirm(
                "¿Querés cancelar este viaje?"
            )
        ){

            return;
        }


        try{

            const viaje =
                viajes.find(
                    v => v.id === id
                );


            await updateDoc(

                doc(
                    db,
                    "viajes",
                    id
                ),

                {

                    estado:"Cancelado",

                    actualizadoEn:
                        serverTimestamp()

                }

            );


            if(
                viaje &&
                viaje.unidadId
            ){

                await updateDoc(

                    doc(
                        db,
                        "unidades",
                        viaje.unidadId
                    ),

                    {

                        estado:"Disponible",

                        actualizadoEn:
                            serverTimestamp()

                    }

                );

            }


            mostrarMensaje(
                "Viaje cancelado."
            );


            await cargarViajes();


        }catch(error){

            console.error(error);

            mostrarMensaje(
                "No se pudo cancelar el viaje.",
                "error"
            );

        }

    };


/* =========================================================
   RESUMEN
========================================================= */

function actualizarResumen(){

    document.getElementById(
        "totalViajes"
    ).textContent =
        viajes.length;


    document.getElementById(
        "totalPlanificados"
    ).textContent =
        viajes.filter(
            v => v.estado === "Planificado"
        ).length;


    document.getElementById(
        "totalCurso"
    ).textContent =
        viajes.filter(
            v => v.estado === "En curso"
        ).length;


    document.getElementById(
        "totalFinalizados"
    ).textContent =
        viajes.filter(
            v => v.estado === "Finalizado"
        ).length;


    const km =
        viajes.reduce(
            (total,v) =>
                total +
                Number(
                    v.kilometrosRecorridos || 0
                ),
            0
        );


    document.getElementById(
        "totalKm"
    ).textContent =
        km;
}


/* =========================================================
   VOLVER
========================================================= */

window.volver =
    function(){

        window.location.href =
            "index.html";

    };
