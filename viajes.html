<!DOCTYPE html>
<html lang="es">

<head>

<meta charset="UTF-8">

<meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
>

<meta
    name="theme-color"
    content="#111827"
>

<title>GESBASE - Viajes</title>

<style>

* {
    box-sizing: border-box;
}

body {
    margin: 0;
    font-family:
        -apple-system,
        BlinkMacSystemFont,
        "Segoe UI",
        Roboto,
        Arial,
        sans-serif;

    background: #f3f4f6;
    color: #111827;
}

header {
    background: #111827;
    color: white;
    padding: 18px 20px;
}

.header-contenido {
    max-width: 1150px;
    margin: auto;

    display: flex;
    justify-content: space-between;
    align-items: center;

    gap: 15px;
}

.logo {
    font-size: 22px;
    font-weight: 800;
}

.subtitulo {
    font-size: 13px;
    opacity: .75;
    margin-top: 3px;
}

.contenedor {
    max-width: 1150px;
    margin: auto;
    padding: 20px;
}

.barra-superior {
    display: flex;
    justify-content: space-between;
    align-items: center;
    flex-wrap: wrap;

    gap: 15px;
    margin-bottom: 20px;
}

h1 {
    margin: 0;
    font-size: 26px;
}

.descripcion {
    color: #6b7280;
    margin-top: 5px;
}

.boton {
    border: 0;
    border-radius: 10px;
    padding: 12px 17px;

    cursor: pointer;

    font-size: 14px;
    font-weight: 700;
}

.boton-principal {
    background: #111827;
    color: white;
}

.boton-secundario {
    background: #e5e7eb;
    color: #111827;
}

.boton-verde {
    background: #16a34a;
    color: white;
}

.boton-rojo {
    background: #dc2626;
    color: white;
}

.boton-azul {
    background: #2563eb;
    color: white;
}

.boton:hover {
    opacity: .9;
}

.resumen {
    display: grid;
    grid-template-columns: repeat(4, 1fr);
    gap: 15px;

    margin-bottom: 20px;
}

.tarjeta-resumen {
    background: white;
    border-radius: 15px;

    padding: 18px;

    box-shadow:
        0 3px 12px rgba(0,0,0,.06);
}

.numero {
    font-size: 28px;
    font-weight: 800;
}

.texto {
    color: #6b7280;
    font-size: 14px;
    margin-top: 4px;
}

.panel {
    background: white;
    border-radius: 16px;

    padding: 20px;
    margin-bottom: 20px;

    box-shadow:
        0 3px 12px rgba(0,0,0,.06);
}

.panel h2 {
    margin-top: 0;
    font-size: 20px;
}

.formulario {
    display: grid;
    grid-template-columns: repeat(2, 1fr);
    gap: 15px;
}

.campo {
    display: flex;
    flex-direction: column;
    gap: 6px;
}

.campo-completo {
    grid-column: 1 / -1;
}

label {
    font-size: 13px;
    font-weight: 700;
    color: #374151;
}

input,
select,
textarea {
    width: 100%;

    padding: 12px;

    border:
        1px solid #d1d5db;

    border-radius: 9px;

    font-size: 15px;

    background: white;
}

textarea {
    min-height: 90px;
    resize: vertical;
}

input:focus,
select:focus,
textarea:focus {
    outline: none;
    border-color: #111827;
}

.botones-formulario {
    grid-column: 1 / -1;

    display: flex;
    gap: 10px;

    margin-top: 5px;
}

.lista {
    display: grid;
    grid-template-columns: repeat(2, 1fr);
    gap: 15px;
}

.viaje {
    border: 1px solid #e5e7eb;
    border-radius: 14px;

    padding: 17px;

    background: white;
}

.viaje-cabecera {
    display: flex;

    justify-content: space-between;
    align-items: flex-start;

    gap: 10px;
}

.numero-viaje {
    font-size: 12px;
    color: #6b7280;
}

.ruta {
    font-size: 19px;
    font-weight: 800;

    margin-top: 5px;
}

.estado {
    padding: 6px 10px;

    border-radius: 20px;

    font-size: 12px;
    font-weight: 800;

    white-space: nowrap;
}

.estado-programado {
    background: #dbeafe;
    color: #1d4ed8;
}

.estado-viaje {
    background: #dcfce7;
    color: #166534;
}

.estado-finalizado {
    background: #e5e7eb;
    color: #374151;
}

.estado-cancelado {
    background: #fee2e2;
    color: #991b1b;
}

.datos {
    margin-top: 15px;

    display: grid;
    gap: 8px;
}

.dato {
    font-size: 14px;
    color: #374151;
}

.dato strong {
    color: #111827;
}

.distancia {
    margin-top: 14px;

    padding: 12px;

    border-radius: 10px;

    background: #f3f4f6;
}

.acciones {
    display: flex;

    flex-wrap: wrap;
    gap: 8px;

    margin-top: 15px;
}

.mensaje {
    padding: 14px;

    border-radius: 10px;

    margin-bottom: 15px;

    display: none;
}

.mensaje-error {
    background: #fee2e2;
    color: #991b1b;
}

.mensaje-ok {
    background: #dcfce7;
    color: #166534;
}

.cargando,
.vacio {
    text-align: center;

    padding: 35px 15px;

    color: #6b7280;
}

.bloqueado {
    text-align: center;

    padding: 60px 20px;
}

.bloqueado h2 {
    margin-bottom: 10px;
}

.bloqueado p {
    color: #6b7280;
}

@media (max-width: 800px) {

    .resumen {
        grid-template-columns: repeat(2, 1fr);
    }

    .lista {
        grid-template-columns: 1fr;
    }

}

@media (max-width: 600px) {

    .contenedor {
        padding: 15px;
    }

    .formulario {
        grid-template-columns: 1fr;
    }

    .campo-completo,
    .botones-formulario {
        grid-column: auto;
    }

}

</style>

</head>


<body>


<header>

    <div class="header-contenido">

        <div>

            <div class="logo">
                GESBASE
            </div>

            <div class="subtitulo">
                Gestión de viajes
            </div>

        </div>


        <button
            class="boton boton-secundario"
            onclick="volver()"
        >
            ← Volver
        </button>

    </div>

</header>


<div class="contenedor">

    <div
        id="mensaje"
        class="mensaje"
    ></div>


    <div
        id="contenidoBloqueado"
        class="panel bloqueado"
        style="display:none;"
    >

        <h2>
            🚫 Módulo no habilitado
        </h2>

        <p>
            El módulo de Viajes no está habilitado
            para esta empresa.
        </p>

    </div>


    <div
        id="contenidoPrincipal"
        style="display:none;"
    >


        <!-- CABECERA -->

        <div class="barra-superior">

            <div>

                <h1>
                    🛣️ Viajes
                </h1>

                <div class="descripcion">
                    Organizá y controlá los viajes de tu empresa.
                </div>

            </div>


            <button
                id="botonNuevo"
                class="boton boton-principal"
                onclick="mostrarFormulario()"
            >
                + Nuevo viaje
            </button>

        </div>


        <!-- RESUMEN -->

        <div class="resumen">

            <div class="tarjeta-resumen">

                <div
                    id="totalViajes"
                    class="numero"
                >
                    0
                </div>

                <div class="texto">
                    Total viajes
                </div>

            </div>


            <div class="tarjeta-resumen">

                <div
                    id="programados"
                    class="numero"
                >
                    0
                </div>

                <div class="texto">
                    Programados
                </div>

            </div>


            <div class="tarjeta-resumen">

                <div
                    id="enViaje"
                    class="numero"
                >
                    0
                </div>

                <div class="texto">
                    En viaje
                </div>

            </div>


            <div class="tarjeta-resumen">

                <div
                    id="finalizados"
                    class="numero"
                >
                    0
                </div>

                <div class="texto">
                    Finalizados
                </div>

            </div>

        </div>


        <!-- FORMULARIO -->

        <div
            id="panelFormulario"
            class="panel"
            style="display:none;"
        >

            <h2>
                Nuevo viaje
            </h2>


            <div class="formulario">


                <div class="campo">

                    <label>
                        Chofer
                    </label>

                    <select id="chofer">

                        <option value="">
                            Seleccionar chofer
                        </option>

                    </select>

                </div>


                <div class="campo">

                    <label>
                        Unidad
                    </label>

                    <select id="unidad">

                        <option value="">
                            Seleccionar unidad
                        </option>

                    </select>

                </div>


                <div class="campo">

                    <label>
                        Origen
                    </label>

                    <input
                        id="origen"
                        type="text"
                        placeholder="Ej: Catriel"
                    >

                </div>


                <div class="campo">

                    <label>
                        Destino
                    </label>

                    <input
                        id="destino"
                        type="text"
                        placeholder="Ej: Neuquén"
                    >

                </div>


                <div class="campo">

                    <label>
                        Fecha
                    </label>

                    <input
                        id="fecha"
                        type="date"
                    >

                </div>


                <div class="campo">

                    <label>
                        Hora programada
                    </label>

                    <input
                        id="hora"
                        type="time"
                    >

                </div>


                <div class="campo">

                    <label>
                        Kilometraje inicial
                    </label>

                    <input
                        id="kmInicial"
                        type="number"
                        min="0"
                        step="0.1"
                        placeholder="Ej: 125430"
                    >

                </div>


                <div class="campo">

                    <label>
                        Tipo de viaje
                    </label>

                    <select id="tipoViaje">

                        <option value="Transporte">
                            Transporte
                        </option>

                        <option value="Paquetería">
                            Paquetería
                        </option>

                        <option value="Viaje particular">
                            Viaje particular
                        </option>

                        <option value="Otro">
                            Otro
                        </option>

                    </select>

                </div>


                <div class="campo campo-completo">

                    <label>
                        Observaciones
                    </label>

                    <textarea
                        id="observaciones"
                        placeholder="Información adicional del viaje..."
                    ></textarea>

                </div>


                <div class="botones-formulario">

                    <button
                        class="boton boton-principal"
                        onclick="guardarViaje()"
                    >
                        Guardar viaje
                    </button>


                    <button
                        class="boton boton-secundario"
                        onclick="cerrarFormulario()"
                    >
                        Cancelar
                    </button>

                </div>

            </div>

        </div>


        <!-- LISTADO -->

        <div class="panel">

            <h2>
                📋 Viajes registrados
            </h2>


            <div
                id="listaViajes"
                class="lista"
            >

                <div class="cargando">
                    Cargando viajes...
                </div>

            </div>

        </div>


    </div>

</div>


<script type="module">


import {
    auth,
    db
} from "./Js/firebase.js";


import {
    onAuthStateChanged
} from "https://www.gstatic.com/firebasejs/12.18.0/firebase-auth.js";


import {
    doc,
    getDoc,
    collection,
    query,
    where,
    onSnapshot,
    addDoc,
    updateDoc,
    serverTimestamp
} from "https://www.gstatic.com/firebasejs/12.18.0/firebase-firestore.js";


const ADMIN_EMAIL =
    "julianbattauz006@gmail.com";


let usuarioActual = null;

let datosUsuario = null;

let empresaActualId = null;

let viajes = [];

let choferes = [];

let unidades = [];


/* =========================================================
   MENSAJES
========================================================= */

function mostrarMensaje(
    texto,
    tipo = "ok"
) {

    const mensaje =
        document.getElementById("mensaje");


    mensaje.textContent =
        texto;


    mensaje.className =
        "mensaje " +
        (
            tipo === "error"
                ? "mensaje-error"
                : "mensaje-ok"
        );


    mensaje.style.display =
        "block";


    setTimeout(() => {

        mensaje.style.display =
            "none";

    }, 4000);

}


/* =========================================================
   AUTENTICACIÓN
========================================================= */

onAuthStateChanged(
    auth,
    async usuario => {

        if (!usuario) {

            window.location.href =
                "index.html";

            return;

        }


        usuarioActual =
            usuario;


        try {

            const usuarioRef =
                doc(
                    db,
                    "usuarios",
                    usuario.uid
                );


            const usuarioSnap =
                await getDoc(
                    usuarioRef
                );


            if (!usuarioSnap.exists()) {

                mostrarMensaje(
                    "No se encontró la información del usuario.",
                    "error"
                );

                return;

            }


            datosUsuario =
                usuarioSnap.data();


            empresaActualId =
                datosUsuario.empresaId ||
                datosUsuario.idEmpresa ||
                datosUsuario.empresa ||
                usuario.uid;


            const empresaRef =
                doc(
                    db,
                    "empresas",
                    empresaActualId
                );


            const empresaSnap =
                await getDoc(
                    empresaRef
                );


            if (!empresaSnap.exists()) {

                mostrarMensaje(
                    "No se encontró la empresa.",
                    "error"
                );

                return;

            }


            const empresa =
                empresaSnap.data();


            const esAdmin =
                usuario.email === ADMIN_EMAIL ||
                datosUsuario.rol === "admin" ||
                datosUsuario.rol === "administrador";


            const moduloHabilitado =
                empresa.modulos &&
                empresa.modulos.viajes === true;


            if (
                !moduloHabilitado &&
                !esAdmin
            ) {

                document
                    .getElementById(
                        "contenidoBloqueado"
                    )
                    .style.display =
                    "block";

                return;

            }


            document
                .getElementById(
                    "contenidoPrincipal"
                )
                .style.display =
                "block";


            if (!esAdmin) {

                document
                    .getElementById(
                        "botonNuevo"
                    )
                    .style.display =
                    "none";

            }


            cargarViajes();

            cargarChoferes();

            cargarUnidades();


        } catch (error) {

            console.error(error);


            mostrarMensaje(
                "Ocurrió un error al cargar el módulo.",
                "error"
            );

        }

    }
);


/* =========================================================
   CARGAR VIAJES
========================================================= */

function cargarViajes() {

    const referencia =
        collection(
            db,
            "viajes"
        );


    const consulta =
        query(
            referencia,
            where(
                "empresaId",
                "==",
                empresaActualId
            )
        );


    onSnapshot(
        consulta,
        snapshot => {

            viajes = [];


            snapshot.forEach(
                docSnap => {

                    viajes.push({

                        id:
                            docSnap.id,

                        ...docSnap.data()

                    });

                }
            );


            renderizarViajes();

            actualizarResumen();

        },
        error => {

            console.error(error);


            mostrarMensaje(
                "No se pudieron cargar los viajes.",
                "error"
            );

        }
    );

}


/* =========================================================
   CARGAR CHOFERES
========================================================= */

function cargarChoferes() {

    const consulta =
        query(
            collection(
                db,
                "choferes"
            ),
            where(
                "empresaId",
                "==",
                empresaActualId
            )
        );


    onSnapshot(
        consulta,
        snapshot => {

            choferes = [];


            snapshot.forEach(
                docSnap => {

                    choferes.push({

                        id:
                            docSnap.id,

                        ...docSnap.data()

                    });

                }
            );


            actualizarSelectorChoferes();

        },
        error => {

            console.error(error);

        }
    );

}


/* =========================================================
   CARGAR UNIDADES
========================================================= */

function cargarUnidades() {

    const consulta =
        query(
            collection(
                db,
                "unidades"
            ),
            where(
                "empresaId",
                "==",
                empresaActualId
            )
        );


    onSnapshot(
        consulta,
        snapshot => {

            unidades = [];


            snapshot.forEach(
                docSnap => {

                    unidades.push({

                        id:
                            docSnap.id,

                        ...docSnap.data()

                    });

                }
            );


            actualizarSelectorUnidades();

        },
        error => {

            console.error(error);

        }
    );

}


/* =========================================================
   SELECTOR CHOFERES
========================================================= */

function actualizarSelectorChoferes() {

    const select =
        document.getElementById(
            "chofer"
        );


    if (!select) return;


    select.innerHTML = `
        <option value="">
            Seleccionar chofer
        </option>
    `;


    choferes
        .filter(
            c =>
                c.estado !== "Inactivo"
        )
        .forEach(
            chofer => {

                const option =
                    document.createElement(
                        "option"
                    );


                option.value =
                    chofer.id;


                option.textContent =
                    `${chofer.nombre || ""} ${chofer.apellido || ""}`
                        .trim();


                select.appendChild(
                    option
                );

            }
        );

}


/* =========================================================
   SELECTOR UNIDADES
========================================================= */

function actualizarSelectorUnidades() {

    const select =
        document.getElementById(
            "unidad"
        );


    if (!select) return;


    select.innerHTML = `
        <option value="">
            Seleccionar unidad
        </option>
    `;


    unidades
        .filter(
            unidad =>
                unidad.estado !== "Mantenimiento"
        )
        .forEach(
            unidad => {

                const option =
                    document.createElement(
                        "option"
                    );


                option.value =
                    unidad.id;


                option.textContent =
                    `${unidad.patente || "Sin patente"} - ${unidad.tipo || "Unidad"}`;


                select.appendChild(
                    option
                );

            }
        );

}


/* =========================================================
   MOSTRAR FORMULARIO
========================================================= */

window.mostrarFormulario =
function mostrarFormulario() {

    limpiarFormulario();


    const ahora =
        new Date();


    const fecha =
        ahora
            .toISOString()
            .split("T")[0];


    document
        .getElementById(
            "fecha"
        )
        .value =
        fecha;


    document
        .getElementById(
            "panelFormulario"
        )
        .style.display =
        "block";


    window.scrollTo({
        top: 0,
        behavior: "smooth"
    });

};


/* =========================================================
   GUARDAR VIAJE
========================================================= */

window.guardarViaje =
async function guardarViaje() {

    const choferId =
        document
            .getElementById(
                "chofer"
            )
            .value;


    const unidadId =
        document
            .getElementById(
                "unidad"
            )
            .value;


    const origen =
        document
            .getElementById(
                "origen"
            )
            .value
            .trim();


    const destino =
        document
            .getElementById(
                "destino"
            )
            .value
            .trim();


    const fecha =
        document
            .getElementById(
                "fecha"
            )
            .value;


    const hora =
        document
            .getElementById(
                "hora"
            )
            .value;


    const kmInicial =
        document
            .getElementById(
                "kmInicial"
            )
            .value;


    const tipoViaje =
        document
            .getElementById(
                "tipoViaje"
            )
            .value;


    const observaciones =
        document
            .getElementById(
                "observaciones"
            )
            .value
            .trim();


    if (
        !choferId ||
        !unidadId ||
        !origen ||
        !destino ||
        !fecha
    ) {

        mostrarMensaje(
            "Completá chofer, unidad, origen, destino y fecha.",
            "error"
        );

        return;

    }


    const chofer =
        choferes.find(
            c =>
                c.id === choferId
        );


    const unidad =
        unidades.find(
            u =>
                u.id === unidadId
        );


    if (!chofer) {

        mostrarMensaje(
            "No se encontró el chofer seleccionado.",
            "error"
        );

        return;

    }


    if (!unidad) {

        mostrarMensaje(
            "No se encontró la unidad seleccionada.",
            "error"
        );

        return;

    }


    if (
        unidad.estado ===
        "Mantenimiento"
    ) {

        mostrarMensaje(
            "La unidad está en mantenimiento.",
            "error"
        );

        return;

    }


    /*
     * Si la unidad ya está en otro viaje
     */

    if (
        unidad.estado === "En viaje"
    ) {

        mostrarMensaje(
            "Esta unidad ya figura como En viaje.",
            "error"
        );

        return;

    }


    try {

        const viajeRef =
            await addDoc(
                collection(
                    db,
                    "viajes"
                ),
                {

                    empresaId:
                        empresaActualId,

                    choferId,

                    choferNombre:
                        `${chofer.nombre || ""} ${chofer.apellido || ""}`
                            .trim(),

                    unidadId,

                    unidadPatente:
                        unidad.patente || "",

                    unidadTipo:
                        unidad.tipo || "",

                    origen,

                    destino,

                    fecha,

                    hora,

                    tipoViaje,

                    kmInicial:
                        kmInicial
                            ? Number(kmInicial)
                            : null,

                    kmFinal:
                        null,

                    kmRecorridos:
                        null,

                    estado:
                        "Programado",

                    observaciones,

                    creadoPor:
                        usuarioActual.uid,

                    creadoEn:
                        serverTimestamp(),

                    actualizadoEn:
                        serverTimestamp()

                }
            );


        /*
         * Actualizar unidad
         */

        await updateDoc(
            doc(
                db,
                "unidades",
                unidadId
            ),
            {

                viajeActualId:
                    viajeRef.id,

                estadoViaje:
                    "Programado",

                actualizadoEn:
                    serverTimestamp()

            }
        );


        mostrarMensaje(
            "Viaje creado correctamente."
        );


        cerrarFormulario();


    } catch (error) {

        console.error(error);


        mostrarMensaje(
            "No se pudo crear el viaje.",
            "error"
        );

    }

};


/* =========================================================
   INICIAR VIAJE
========================================================= */

async function iniciarViaje(id) {

    const viaje =
        viajes.find(
            v =>
                v.id === id
        );


    if (!viaje) return;


    try {

        await updateDoc(
            doc(
                db,
                "viajes",
                id
            ),
            {

                estado:
                    "En viaje",

                fechaInicio:
                    serverTimestamp(),

                actualizadoEn:
                    serverTimestamp()

            }
        );


        await updateDoc(
            doc(
                db,
                "unidades",
                viaje.unidadId
            ),
            {

                estado:
                    "En viaje",

                estadoViaje:
                    "En viaje",

                viajeActualId:
                    id,

                actualizadoEn:
                    serverTimestamp()

            }
        );


        mostrarMensaje(
            "Viaje iniciado."
        );


    } catch (error) {

        console.error(error);


        mostrarMensaje(
            "No se pudo iniciar el viaje.",
            "error"
        );

    }

}


/* =========================================================
   FINALIZAR VIAJE
========================================================= */

async function finalizarViaje(id) {

    const viaje =
        viajes.find(
            v =>
                v.id === id
        );


    if (!viaje) return;


    const kmFinalTexto =
        prompt(
            "Ingresá el kilometraje final de la unidad:"
        );


    if (
        kmFinalTexto === null
    ) {

        return;

    }


    const kmFinal =
        Number(
            kmFinalTexto
        );


    if (
        !Number.isFinite(kmFinal)
    ) {

        mostrarMensaje(
            "Ingresá un kilometraje válido.",
            "error"
        );

        return;

    }


    if (
        viaje.kmInicial !== null &&
        viaje.kmInicial !== undefined &&
        kmFinal < Number(viaje.kmInicial)
    ) {

        mostrarMensaje(
            "El kilometraje final no puede ser menor al inicial.",
            "error"
        );

        return;

    }


    const kmRecorridos =
        viaje.kmInicial !== null &&
        viaje.kmInicial !== undefined
            ? kmFinal -
              Number(viaje.kmInicial)
            : null;


    try {

        await updateDoc(
            doc(
                db,
                "viajes",
                id
            ),
            {

                estado:
                    "Finalizado",

                kmFinal,

                kmRecorridos,

                fechaFin:
                    serverTimestamp(),

                actualizadoEn:
                    serverTimestamp()

            }
        );


        await updateDoc(
            doc(
                db,
                "unidades",
                viaje.unidadId
            ),
            {

                estado:
                    "Disponible",

                estadoViaje:
                    "Finalizado",

                viajeActualId:
                    null,

                kilometraje:
                    kmFinal,

                actualizadoEn:
                    serverTimestamp()

            }
        );


        mostrarMensaje(
            "Viaje finalizado correctamente."
        );


    } catch (error) {

        console.error(error);


        mostrarMensaje(
            "No se pudo finalizar el viaje.",
            "error"
        );

    }

}


/* =========================================================
   CANCELAR VIAJE
========================================================= */

async function cancelarViaje(id) {

    const viaje =
        viajes.find(
            v =>
                v.id === id
        );


    if (!viaje) return;


    const confirmar =
        confirm(
            "¿Querés cancelar este viaje?"
        );


    if (!confirmar) return;


    try {

        await updateDoc(
            doc(
                db,
                "viajes",
                id
            ),
            {

                estado:
                    "Cancelado",

                actualizadoEn:
                    serverTimestamp()

            }
        );


        await updateDoc(
            doc(
                db,
                "unidades",
                viaje.unidadId
            ),
            {

                estado:
                    "Disponible",

                estadoViaje:
                    "Cancelado",

                viajeActualId:
                    null,

                actualizadoEn:
                    serverTimestamp()

            }
        );


        mostrarMensaje(
            "Viaje cancelado."
        );


    } catch (error) {

        console.error(error);


        mostrarMensaje(
            "No se pudo cancelar el viaje.",
            "error"
        );

    }

}


/* =========================================================
   RENDERIZAR VIAJES
========================================================= */

function renderizarViajes() {

    const contenedor =
        document.getElementById(
            "listaViajes"
        );


    if (
        viajes.length === 0
    ) {

        contenedor.innerHTML = `
            <div class="vacio">
                Todavía no hay viajes registrados.
            </div>
        `;

        return;

    }


    /*
     * Ordenar por fecha
     */

    const ordenados =
        [...viajes].sort(
            (a, b) => {

                const fechaA =
                    `${a.fecha || ""} ${a.hora || ""}`;

                const fechaB =
                    `${b.fecha || ""} ${b.hora || ""}`;

                return fechaB.localeCompare(
                    fechaA
                );

            }
        );


    contenedor.innerHTML =
        "";


    ordenados.forEach(
        viaje => {

            const tarjeta =
                document.createElement(
                    "div"
                );


            tarjeta.className =
                "viaje";


            const estado =
                viaje.estado ||
                "Programado";


            let claseEstado =
                "estado-programado";


            if (
                estado === "En viaje"
            ) {

                claseEstado =
                    "estado-viaje";

            }


            if (
                estado === "Finalizado"
            ) {

                claseEstado =
                    "estado-finalizado";

            }


            if (
                estado === "Cancelado"
            ) {

                claseEstado =
                    "estado-cancelado";

            }


            let distanciaHTML =
                "";


            if (
                viaje.kmRecorridos !== null &&
                viaje.kmRecorridos !== undefined
            ) {

                distanciaHTML = `
                    <div class="distancia">
                        🛣️
                        <strong>
                            ${Number(viaje.kmRecorridos).toFixed(1)} km
                        </strong>
                        recorridos
                    </div>
                `;

            }


            tarjeta.innerHTML = `

                <div class="viaje-cabecera">

                    <div>

                        <div class="numero-viaje">
                            VIAJE ${viaje.id}
                        </div>

                        <div class="ruta">
                            📍 ${escapeHtml(viaje.origen || "")}
                            →
                            ${escapeHtml(viaje.destino || "")}
                        </div>

                    </div>

                    <span
                        class="estado ${claseEstado}"
                    >
                        ${escapeHtml(estado)}
                    </span>

                </div>


                <div class="datos">

                    <div class="dato">
                        👨‍✈️
                        <strong>Chofer:</strong>
                        ${escapeHtml(viaje.choferNombre || "Sin asignar")}
                    </div>


                    <div class="dato">
                        🚛
                        <strong>Unidad:</strong>
                        ${escapeHtml(viaje.unidadPatente || "Sin unidad")}
                    </div>


                    <div class="dato">
                        📅
                        <strong>Fecha:</strong>
                        ${escapeHtml(viaje.fecha || "-")}
                    </div>


                    <div class="dato">
                        🕐
                        <strong>Hora:</strong>
                        ${escapeHtml(viaje.hora || "-")}
                    </div>


                    <div class="dato">
                        📦
                        <strong>Tipo:</strong>
                        ${escapeHtml(viaje.tipoViaje || "-")}
                    </div>


                    <div class="dato">
                        📏
                        <strong>KM inicial:</strong>
                        ${viaje.kmInicial ?? "-"}
                    </div>


                    ${
                        viaje.kmFinal !== null &&
                        viaje.kmFinal !== undefined
                        ? `
                            <div class="dato">
                                📏
                                <strong>KM final:</strong>
                                ${viaje.kmFinal}
                            </div>
                        `
                        : ""
                    }

                </div>


                ${distanciaHTML}


                ${
                    viaje.observaciones
                    ? `
                        <div class="unidad-asignada">
                            📝
                            ${escapeHtml(viaje.observaciones)}
                        </div>
                    `
                    : ""
                }


                <div class="acciones">

                    ${
                        estado === "Programado"
                        ? `
                            <button
                                class="boton boton-verde boton-pequeno"
                                data-iniciar="${viaje.id}"
                            >
                                ▶️ Iniciar viaje
                            </button>

                            <button
                                class="boton boton-rojo boton-pequeno"
                                data-cancelar="${viaje.id}"
                            >
                                ✕ Cancelar
                            </button>
                        `
                        : ""
                    }


                    ${
                        estado === "En viaje"
                        ? `
                            <button
                                class="boton boton-azul boton-pequeno"
                                data-finalizar="${viaje.id}"
                            >
                                ✓ Finalizar viaje
                            </button>
                        `
                        : ""
                    }

                </div>

            `;


            const iniciar =
                tarjeta.querySelector(
                    "[data-iniciar]"
                );


            if (iniciar) {

                iniciar.addEventListener(
                    "click",
                    () =>
                        iniciarViaje(
                            viaje.id
                        )
                );

            }


            const finalizar =
                tarjeta.querySelector(
                    "[data-finalizar]"
                );


            if (finalizar) {

                finalizar.addEventListener(
                    "click",
                    () =>
                        finalizarViaje(
                            viaje.id
                        )
                );

            }


            const cancelar =
                tarjeta.querySelector(
                    "[data-cancelar]"
                );


            if (cancelar) {

                cancelar.addEventListener(
                    "click",
                    () =>
                        cancelarViaje(
                            viaje.id
                        )
                );

            }


            contenedor.appendChild(
                tarjeta
            );

        }
    );

}

/* =========================================================
   ESCAPAR HTML
========================================================= */

function escapeHtml(valor) {

    return String(valor)
        .replace(
            /&/g,
            "&amp;"
        )
        .replace(
            /</g,
            "&lt;"
        )
        .replace(
            />/g,
            "&gt;"
        )
        .replace(
            /"/g,
            "&quot;"
        )
        .replace(
            /'/g,
            "&#039;"
        );

}
