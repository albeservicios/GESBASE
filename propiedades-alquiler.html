<!DOCTYPE html>
<html lang="es-AR">

<head>

<meta charset="UTF-8">

<meta

>

<meta
    name="theme-color"

>

<title>Propiedades - Alquileres temporarios | GESBASE</title>

<style>

*{
    box-sizing:border-box;
}

body{
    margin:0;
    font-family:Arial,Helvetica,sans-serif;
    background:#f3f4f6;

}

.oculto{
    display:none !important;
}


/* =====================================================
   HEADER
===================================================== */

.topbar{
    background:#111827;
    color:white;
    padding:14px 20px;

    display:flex;
    align-items:center;
    justify-content:space-between;

    gap:15px;

    position:sticky;
    top:0;
    z-index:1000;

    box-shadow:
        0 3px 12px rgba(0,0,0,.18);
}

.marca{
    display:flex;
    align-items:center;
    gap:12px;
}

.logo{
    width:44px;
    height:44px;
    border-radius:12px;

    background:#16a34a;

    display:flex;
    align-items:center;
    justify-content:center;

    font-size:21px;
    font-weight:bold;
}

.marca-texto h1{
    margin:0;
    font-size:19px;
}

.marca-texto p{
    margin:3px 0 0;
    color:#cbd5e1;
    font-size:12px;
}

.btn{
    border:0;
    border-radius:9px;
    padding:10px 14px;
    cursor:pointer;
    font-weight:bold;
}

.btn-secondary{
    background:#374151;
    color:white;
}

.btn-primary{
    background:#16a34a;
    color:white;
}

.btn-danger{
    background:#dc2626;
    color:white;
}

.btn-light{
    background:#f3f4f6;
    color:#111827;
}


/* =====================================================
   CONTENEDOR
===================================================== */

.contenedor{
    width:calc(100% - 30px);
    max-width:1150px;
    margin:25px auto 50px;
}


/* =====================================================
   CABECERA
===================================================== */

.cabecera{
    background:white;
    border-radius:18px;
    padding:22px;
    margin-bottom:20px;

    box-shadow:
        0 3px 14px rgba(0,0,0,.07);

    border-left:5px solid #16a34a;
}

.cabecera h2{
    margin:0 0 7px;
    font-size:24px;
}

.cabecera p{
    margin:0;
    color:#6b7280;
}

.empresa{
    display:inline-block;
    margin-top:14px;

    background:#f0fdf4;
    color:#166534;

    padding:7px 12px;
    border-radius:20px;

    font-size:12px;
    font-weight:bold;
}


/* =====================================================
   BOTÓN NUEVA
===================================================== */

.barra-acciones{
    display:flex;
    justify-content:space-between;
    align-items:center;

    gap:12px;

}

.barra-acciones h3{
    margin:0;
}


/* =====================================================
   FORMULARIO
===================================================== */

.formulario{

    border-radius:18px;

    padding:22px;

    margin-bottom:20px;

    box-shadow:
        0 3px 14px rgba(0,0,0,.06);
}

.formulario h3{
    margin:0 0 18px;
}

.form-grid{
    display:grid;
    grid-template-columns:
        repeat(2,1fr);

    gap:15px;
}

.campo{
    display:flex;
    flex-direction:column;
    gap:6px;
}

.campo-completo{
    grid-column:

}

.campo label{
    font-size:13px;
    font-weight:bold;

}

.campo input,
.campo select,

    padding:11px 12px;

}

.campo textarea{

}

.campo input:focus,
.campo select:focus,

}

.ayuda{

    font-size:11px;
}

.form-acciones{
    display:flex;
    justify-content:flex-end;
    gap:10px;

}


/* =====================================================
   LISTADO
===================================================== */

.listado{
    display:grid;

    grid-template-columns:
        repeat(3,1fr);

    gap:16px;
}

.propiedad{
    background:white;

    border-radius:16px;

    overflow:hidden;

        0 3px 14px rgba(0,0,0,.07);
}

.propiedad-cabecera{
    padding:16px;

}

.propiedad-cabecera h3{

    font-size:18px;
}

.tipo{
    display:inline-block;

    padding:5px 9px;

    border-radius:20px;

    background:white;

    color:#166534;

    font-size:11px;
    font-weight:bold;
}

.propiedad-cuerpo{
    padding:16px;
}

.dato{
    display:flex;
    justify-content:space-between;

    gap:10px;

    padding:7px 0;

    border-bottom:
        1px solid #f3f4f6;

    font-size:13px;
}

.dato:last-child{
    border-bottom:0;
}

.dato span:first-child{

}

.dato strong{

}

.estado{
    display:inline-block;

    border-radius:20px;

}

.estado-activa{
    background:#dcfce7;

}

.estado-inactiva{
    background:#fee2e2;
    color:#991b1b;
}

.propiedad-acciones{
    display:grid;

    grid-template-columns:
        1fr 1fr;

    gap:8px;

    padding:0 16px 16px;
}

.propiedad-acciones button{
    padding:9px;

    border:0;

    border-radius:8px;

    cursor:pointer;

    font-weight:bold;
}

.btn-editar{
    background:#f3f4f6;
}

.btn-eliminar{
    background:#fee2e2;
    color:#991b1b;
}


/* =====================================================
   SIN DATOS
===================================================== */

.sin-datos{
    background:white;

    border-radius:16px;

    text-align:center;

    color:#6b7280;

    box-shadow:
        0 3px 14px rgba(0,0,0,.05);
}

.sin-datos .icono{

    margin-bottom:10px;
}


/* =====================================================
   CARGANDO
===================================================== */

.cargando{
    text-align:center;
    padding:60px 20px;
    color:#6b7280;
}


/* =====================================================
   NOTIFICACIÓN
===================================================== */

.notificacion{
    position:fixed;

    right:20px;
    bottom:20px;

    background:#111827;
    color:white;

    padding:14px 18px;

    border-radius:12px;

    box-shadow:
        0 5px 25px rgba(0,0,0,.2);

    z-index:5000;

    max-width:350px;
}


/* =====================================================
   RESPONSIVE
===================================================== */

@media(max-width:900px){

    .listado{
        grid-template-columns:
            repeat(2,1fr);
    }

}

@media(max-width:650px){

    .contenedor{
        width:calc(100% - 20px);
        margin-top:15px;
    }

    .form-grid{
        grid-template-columns:1fr;
    }

    .campo-completo{
        grid-column:auto;
    }

    .listado{
        grid-template-columns:1fr;
    }

    .barra-acciones{
        align-items:stretch;
        flex-direction:column;
    }

    .barra-acciones .btn{
        width:100%;
    }

}

</style>

<script type="module">

import {
    auth,
    db
} from "./Js/firebase.js";


import {
    onAuthStateChanged
} from
"https://www.gstatic.com/firebasejs/12.18.0/firebase-auth.js";


import {
    collection,
    addDoc,
    getDocs,
    getDoc,
    doc,
    updateDoc,
    deleteDoc,
    query,
    where,
    serverTimestamp
} from
"https://www.gstatic.com/firebasejs/12.18.0/firebase-firestore.js";


/* =====================================================
   ELEMENTOS
===================================================== */

const cargando =
    document.getElementById(
        "cargando"
    );

const contenido =
    document.getElementById(
        "contenido"
    );

const formulario =
    document.getElementById(
        "formulario"
    );

const formPropiedad =
    document.getElementById(
        "formPropiedad"
    );

const listado =
    document.getElementById(
        "listado"
    );

const empresaActual =
    document.getElementById(
        "empresaActual"
    );

const tituloFormulario =
    document.getElementById(
        "tituloFormulario"
    );

const notificacion =
    document.getElementById(
        "notificacion"
    );


/* =====================================================
   VARIABLES
===================================================== */

let usuarioActual = null;

let empresaIdActual = null;

let propiedadEditando = null;


/* =====================================================
   NOTIFICACIÓN
===================================================== */

function notificar(
    mensaje
){

    notificacion.textContent =
        mensaje;

    notificacion.classList.remove(
        "oculto"
    );

    setTimeout(
        () => {

            notificacion.classList.add(
                "oculto"
            );

        },
        3000
    );

}


/* =====================================================
   OBTENER EMPRESA
===================================================== */

async function obtenerEmpresa(
    usuario
){

    const usuarioRef =
        doc(
            db,
            "usuarios",
            usuario.uid
        );


    const usuarioSnap =
        await getDoc(
            usuarioRef
        );


    let datosUsuario = {};


    if(
        usuarioSnap.exists()
    ){

        datosUsuario =
            usuarioSnap.data() || {};

    }


    let empresaId =
        datosUsuario.empresaId ||
        datosUsuario.idEmpresa ||
        datosUsuario.empresa ||
        null;


    if(!empresaId){

        const q =
            query(
                collection(
                    db,
                    "empresas"
                ),
                where(
                    "propietarioUid",
                    "==",
                    usuario.uid
                )
            );


        const resultado =
            await getDocs(q);


        if(
            !resultado.empty
        ){

            empresaId =
                resultado.docs[0].id;

        }

    }


    if(!empresaId){

        return null;

    }


    const empresaRef =
        doc(
            db,
            "empresas",
            empresaId
        );


    const empresaSnap =
        await getDoc(
            empresaRef
        );


    if(
        !empresaSnap.exists()
    ){

        return null;

    }


    return {

        id:
            empresaSnap.id,

        ...empresaSnap.data()

    };

}


/* =====================================================
   RUBRO
===================================================== */

function esAlquileres(
    rubro
){

    const valor =
        String(
            rubro || ""
        )
        .trim()
        .toLowerCase()
        .normalize("NFD")
        .replace(
            /[\u0300-\u036f]/g,
            ""
        );


    return [

        "alquileres",
        "alquiler",
        "alquiler temporario",
        "alquileres temporarios"

    ].includes(
        valor
    );

}


/* =====================================================
   MOSTRAR FORMULARIO
===================================================== */

function abrirFormulario(
    propiedad = null
){

    propiedadEditando =
        propiedad;

    formulario.classList.remove(
        "oculto"
    );


    if(propiedad){

        tituloFormulario.textContent =
            "Editar propiedad";


        document.getElementById("nombre").value =
            propiedad.nombre || "";

        document.getElementById("tipo").value =
            propiedad.tipo || "";

        document.getElementById("direccion").value =
            propiedad.direccion || "";

        document.getElementById("localidad").value =
            propiedad.localidad || "";

        document.getElementById("capacidad").value =
            propiedad.capacidad || "";

        document.getElementById("habitaciones").value =
            propiedad.habitaciones || "";

        document.getElementById("banos").value =
            propiedad.banos || "";

        document.getElementById("precio").value =
            propiedad.precioNoche || "";

        document.getElementById("estado").value =
            propiedad.estado || "activa";

        document.getElementById("checkin").value =
            propiedad.horarioCheckin || "";

        document.getElementById("checkout").value =
            propiedad.horarioCheckout || "";

        document.getElementById("servicios").value =
            propiedad.servicios || "";

        document.getElementById("descripcion").value =
            propiedad.descripcion || "";

        document.getElementById("observaciones").value =
            propiedad.observacionesInternas || "";

    }
    else{

        tituloFormulario.textContent =
            "Nueva propiedad";

        formPropiedad.reset();

        document.getElementById("estado").value =
            "activa";

    }


    formulario.scrollIntoView({
        behavior:"smooth",
        block:"start"
    });

}


/* =====================================================
   CERRAR FORMULARIO
===================================================== */

function cerrarFormulario(){

    propiedadEditando =
        null;

    formPropiedad.reset();

    formulario.classList.add(
        "oculto"
    );

}


/* =====================================================
   CARGAR PROPIEDADES
===================================================== */

async function cargarPropiedades(){

    listado.innerHTML = `
        <div class="cargando">
            Cargando propiedades...
        </div>
    `;


    try{

        const q =
            query(
                collection(
                    db,
                    "propiedadesAlquiler"
                ),
                where(
                    "empresaId",
                    "==",
                    empresaIdActual
                )
            );


        const resultado =
            await getDocs(q);


        if(
            resultado.empty
        ){

            listado.innerHTML = `
                <div class="sin-datos">

                    <div class="icono">
                        🏡
                    </div>

                    <strong>
                        Todavía no tenés propiedades registradas.
                    </strong>

                    <p>
                        Comenzá agregando tu primera propiedad
                        para alquiler temporario.
                    </p>

                    <button
                        class="btn btn-primary"
                        id="btnPrimerPropiedad"
                    >
                        + Registrar propiedad
                    </button>

                </div>
            `;


            document
                .getElementById(
                    "btnPrimerPropiedad"
                )
                .addEventListener(
                    "click",
                    () => abrirFormulario()
                );


            return;

        }


        listado.innerHTML = "";


        resultado.forEach(
            documento => {

                const propiedad =
                    {
                        id:
                            documento.id,

                        ...documento.data()

                    };


                listado.appendChild(
                    crearTarjeta(
                        propiedad
                    )
                );

            }
        );

    }
    catch(error){

        console.error(
            error
        );


        listado.innerHTML = `
            <div class="sin-datos">

                No se pudieron cargar las propiedades.

                <br><br>

                ${error.message || ""}

            </div>
        `;

    }

}


/* =====================================================
   CREAR TARJETA
===================================================== */

function crearTarjeta(
    propiedad
){

    const tarjeta =
        document.createElement(
            "article"
        );


    tarjeta.className =
        "propiedad";


    const estado =
        propiedad.estado ===
        "inactiva"
            ? "inactiva"
            : "activa";


    const precio =
        Number(
            propiedad.precioNoche
        ) || 0;


    tarjeta.innerHTML = `

        <div class="propiedad-cabecera">

            <h3>
                ${escapeHTML(
                    propiedad.nombre ||
                    "Sin nombre"
                )}
            </h3>

            <span class="tipo">
                ${escapeHTML(
                    propiedad.tipo ||
                    "Propiedad"
                )}
            </span>

        </div>


        <div class="propiedad-cuerpo">

            <div class="dato">

                <span>
                    📍 Ubicación
                </span>

                <strong>
                    ${escapeHTML(
                        propiedad.localidad ||
                        propiedad.direccion ||
                        "-"
                    )}
                </strong>

            </div>


            <div class="dato">

                <span>
                    👥 Capacidad
                </span>

                <strong>
                    ${propiedad.capacidad || "-"}
                </strong>

            </div>


            <div class="dato">

                <span>
                    🛏 Habitaciones
                </span>

                <strong>
                    ${propiedad.habitaciones ?? "-"}
                </strong>

            </div>


            <div class="dato">

                <span>
                    🚿 Baños
                </span>

                <strong>
                    ${propiedad.banos ?? "-"}
                </strong>

            </div>


            <div class="dato">

                <span>
                    💰 Noche
                </span>

                <strong>
                    ${formatearDinero(precio)}
                </strong>

            </div>


            <div class="dato">

                <span>
                    Estado
                </span>

                <strong>

                    <span
                        class="estado estado-${estado}"
                    >
                        ${estado === "activa"
                            ? "Activa"
                            : "Inactiva"}
                    </span>

                </strong>

            </div>

        </div>


        <div class="propiedad-acciones">

            <button
                class="btn-editar"
                data-editar="${propiedad.id}"
            >
                ✏️ Editar
            </button>

            <button
                class="btn-eliminar"
                data-eliminar="${propiedad.id}"
            >
                🗑️ Eliminar
            </button>

        </div>

    `;


    tarjeta
        .querySelector(
            "[data-editar]"
        )
        .addEventListener(
            "click",
            () => {

                abrirFormulario(
                    propiedad
                );

            }
        );


    tarjeta
        .querySelector(
            "[data-eliminar]"
        )
        .addEventListener(
            "click",
            () => {

                eliminarPropiedad(
                    propiedad
                );

            }
        );


    return tarjeta;

}


/* =====================================================
   ESCAPE HTML
===================================================== */

function escapeHTML(
    valor
){

    return String(
        valor ?? ""
    )
    .replace(
        /&/g,
        "&amp;"
    )
    .replace(
        /</g,
        "&lt;"
    )
    .replace(
        />/g,
        "&gt;"
    )
    .replace(
        /"/g,
        "&quot;"
    )
    .replace(
        /'/g,
        "&#039;"
    );

}


/* =====================================================
   DINERO
===================================================== */

function formatearDinero(
    valor
){

    return Number(
        valor || 0
    ).toLocaleString(
        "es-AR",
        {
            style:"currency",
            currency:"ARS"
        }
    );

}


/* =====================================================
   GUARDAR
===================================================== */

formPropiedad.addEventListener(
    "submit",
    async event => {

        event.preventDefault();


        if(!empresaIdActual){

            notificar(
                "No se encontró la empresa."
            );

            return;

        }


        const datos = {

            empresaId:
                empresaIdActual,

            propietarioUid:
                usuarioActual.uid,

            nombre:
                document.getElementById(
                    "nombre"
                ).value.trim(),

            tipo:
                document.getElementById(
                    "tipo"
                ).value,

            direccion:
                document.getElementById(
                    "direccion"
                ).value.trim(),

            localidad:
                document.getElementById(
                    "localidad"
                ).value.trim(),

            capacidad:
                Number(
                    document.getElementById(
                        "capacidad"
                    ).value
                ) || 0,

            habitaciones:
                Number(
                    document.getElementById(
                        "habitaciones"
                    ).value
                ) || 0,

            banos:
                Number(
                    document.getElementById(
                        "banos"
                    ).value
                ) || 0,

            precioNoche:
                Number(
                    document.getElementById(
                        "precio"
                    ).value
                ) || 0,

            estado:
                document.getElementById(
                    "estado"
                ).value,

            horarioCheckin:
                document.getElementById(
                    "checkin"
                ).value,

            horarioCheckout:
                document.getElementById(
                    "checkout"
                ).value,

            servicios:
                document.getElementById(
                    "servicios"
                ).value.trim(),

            descripcion:
                document.getElementById(
                    "descripcion"
                ).value.trim(),

            /*
             * IMPORTANTE:
             * campo privado.
             * Nunca debe enviarse al formulario público.
             */

            observacionesInternas:
                document.getElementById(
                    "observaciones"
                ).value.trim(),

            actualizadoEn:
                serverTimestamp()

        };


        try{

            if(
                propiedadEditando
            ){

                await updateDoc(
                    doc(
                        db,
                        "propiedadesAlquiler",
                        propiedadEditando.id
                    ),
                    datos
                );


                notificar(
                    "Propiedad actualizada correctamente."
                );

            }
            else{

                datos.creadoEn =
                    serverTimestamp();


                await addDoc(
                    collection(
                        db,
                        "propiedadesAlquiler"
                    ),
                    datos
                );


                notificar(
                    "Propiedad registrada correctamente."
                );

            }


            cerrarFormulario();

            await cargarPropiedades();

        }
        catch(error){

            console.error(
                error
            );

            notificar(
                "No se pudo guardar la propiedad."
            );

        }

    }
);


/* =====================================================
   ELIMINAR
===================================================== */

async function eliminarPropiedad(
    propiedad
){

    const confirmar =
        confirm(
            `¿Querés eliminar "${propiedad.nombre}"?\n\nEsta acción no debería realizarse si la propiedad ya tiene reservas o movimientos asociados.`
        );


    if(!confirmar){

        return;

    }


    try{

        await deleteDoc(
            doc(
                db,
                "propiedadesAlquiler",
                propiedad.id
            )
        );


        notificar(
            "Propiedad eliminada."
        );


        await cargarPropiedades();

    }
    catch(error){

        console.error(
            error
        );

        notificar(
            "No se pudo eliminar la propiedad."
        );

    }

}

/* =====================================================
   SESIÓN
===================================================== */

onAuthStateChanged(
    auth,
    async usuario => {

        try{

            if(!usuario){

                window.location.replace(
                    "login.html"
                );

                return;

            }


            usuarioActual =
                usuario;


            const empresa =
                await obtenerEmpresa(
                    usuario
                );


            if(!empresa){

                cargando.textContent =
                    "No se encontró una empresa asociada a esta cuenta.";

                return;

            }


            const rubro =
                empresa.rubro ||
                empresa.tipoNegocio ||
                empresa.tipoEmpresa ||
                "";


            if(
                !esAlquileres(rubro)
            ){

                cargando.innerHTML = `
                    <strong>
                        Este módulo pertenece al rubro
                        Alquileres temporarios.
                    </strong>

                    <br><br>

                    <button
                        class="btn btn-secondary"
                        onclick="location.href='index.html'"
                    >
                        Volver a GESBASE
                    </button>
                `;

                return;

            }


            if(
                empresa.accesoHabilitado === false
            ){

                cargando.innerHTML = `
                    <strong>
                        El acceso de esta empresa está bloqueado.
                    </strong>

                    <br><br>

                    <button
                        class="btn btn-secondary"
                        onclick="location.href='index.html'"
                    >
                        Volver a GESBASE
                    </button>
                `;

                return;

            }


            empresaIdActual =
                empresa.id;


            empresaActual.textContent =
                "🏢 " +
                (
                    empresa.nombreEmpresa ||
                    empresa.nombre ||
                    "Mi empresa"
                );


            await cargarPropiedades();


            cargando.classList.add(
                "oculto"
            );

            contenido.classList.remove(
                "oculto"
            );

        }
        catch(error){

            console.error(
                error
            );


            cargando.innerHTML = `
                <strong>
                    Ocurrió un error al cargar el módulo.
                </strong>

                <p>
                    ${error.message || ""}
                </p>
            `;

        }

    }
);

</script>
