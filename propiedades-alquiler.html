<!DOCTYPE html>
<html lang="es-AR">

<head>

<meta charset="UTF-8">

<meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
>

<meta
    name="theme-color"
    content="#111827"
>

<title>GESBASE - Propiedades</title>

<style>

*{
    box-sizing:border-box;
}

body{
    margin:0;

    font-family:
        Inter,
        system-ui,
        -apple-system,
        BlinkMacSystemFont,
        "Segoe UI",
        sans-serif;

    background:#f3f4f6;
    color:#111827;
}

header{
    background:#111827;
    color:white;

    padding:15px 20px;

    display:flex;
    align-items:center;
    justify-content:space-between;

}

.header-left{
    display:flex;
    align-items:center;
    gap:12px;
}

.logo{
    width:42px;
    height:42px;

    border-radius:12px;

    background:#16a34a;

    display:flex;
    align-items:center;
    justify-content:center;

    font-size:22px;
}

header h1{
    margin:0;
    font-size:18px;
}

header p{
    margin:3px 0 0;

    color:#d1d5db;

    font-size:12px;
}

main{
    max-width:1200px;
    margin:0 auto;

    padding:20px;
}

.top{
    display:flex;

    justify-content:space-between;
    align-items:center;

    gap:15px;

    margin-bottom:18px;
}

.top h2{
    margin:0;

    font-size:22px;
}

.top p{
    margin:4px 0 0;

    color:#6b7280;

    font-size:13px;
}

.btn{
    border:0;

    border-radius:10px;

    padding:10px 14px;

    cursor:pointer;

    font-size:13px;

    font-weight:700;
}

.btn-primary{
    background:#16a34a;
    color:white;
}

.btn-primary:hover{
    background:#15803d;
}

.btn-secondary{
    background:#374151;
    color:white;
}

.btn-light{
    background:white;
    color:#111827;

    border:1px solid #d1d5db;
}

.btn-danger{
    background:#dc2626;
    color:white;
}

.btn-warning{

    color:white;
}

.alert{
    display:none;

    padding:12px 14px;

    border-radius:10px;

    margin-bottom:15px;

    font-size:13px;
}

.alert.success{
    display:block;

    background:#dcfce7;
    color:#166534;
}

.alert.error{

.propiedades{

    border:1px solid #e5e7eb;

}

    height:100%;

}

.card-body{

.card-location{

.card-description{

}

.tags{

}

.tag{

}

.status-row{

}

.status{

}

.status-activa{

}

.status-inactiva{

}

.publicada{

}

.no-publicada{

}

}

.actions{

.empty{
    grid-column:1/-1;

    border:1px dashed #d1d5db;

    border-radius:14px;

    padding:45px 20px;

    text-align:center;

}

.modal{
    position:fixed;

    inset:0;

    background:rgba(0,0,0,.58);

    display:none;

    align-items:center;
    justify-content:center;

    padding:15px;

}

.modal.active{

}

.modal-content{

    max-width:760px;

    background:white;

}

.modal-header{

    margin-bottom:18px;
}

.modal-header h3{
    margin:0;

}

.close{

    height:34px;

    border-radius:50%;

    background:#f3f4f6;

}

.form-grid{

}

.form-group{

.form-group.full{

}

label{

}

input,
select,

}

select:focus,

}

textarea{

}

.checkbox{

.checkbox input{

}

.servicios{

.servicio{

}

.servicio input{

.preview{

    border-radius:12px;

    overflow:hidden;

}

.preview img{

    max-height:230px;

}

.form-actions{
    display:flex;

    justify-content:flex-end;

    gap:8px;

    margin-top:18px;

    padding-top:15px;

    border-top:1px solid #e5e7eb;
}

.preview-modal{
    width:100%;
    max-width:500px;

    background:white;

    border-radius:16px;

    overflow:hidden;
}

.preview-image{
    height:230px;

    background:#dcfce7;

    display:flex;

    align-items:center;
    justify-content:center;

    font-size:60px;

    overflow:hidden;
}

.preview-image img{
    width:100%;
    height:100%;

}

.preview-body{

.preview-body h2{

    }

    }

    .servicios{

            repeat(2,1fr);
    }

}

</style>

<script type="module">

import {
    auth,
    db
} from "./Js/firebase.js";

import {
    onAuthStateChanged
} from "https://www.gstatic.com/firebasejs/12.18.0/firebase-auth.js";

import {
    collection,
    query,
    where,
    getDocs,
    getDoc,
    doc,
    addDoc,
    updateDoc,
    deleteDoc,
    serverTimestamp,
    limit
} from "https://www.gstatic.com/firebasejs/12.18.0/firebase-firestore.js";


let usuarioActual = null;

let empresaActual = null;

let empresaIdActual = null;

let propiedades = [];

let propiedadEditando = null;


/* =====================================================
   UTILIDADES
===================================================== */

function normalizarRubro(valor){

    return String(valor || "")
        .trim()
        .toLowerCase()
        .normalize("NFD")
        .replace(
            /[\u0300-\u036f]/g,
            ""
        );

}


function esRubroAlquileres(rubro){

    return [

        "alquileres",
        "alquiler",
        "alquiler temporario",
        "alquileres temporarios"

    ].includes(
        normalizarRubro(rubro)
    );

}


function escapar(valor){

    return String(valor ?? "")
        .replace(
            /&/g,
            "&amp;"
        )
        .replace(
            /</g,
            "&lt;"
        )
        .replace(
            />/g,
            "&gt;"
        )
        .replace(
            /"/g,
            "&quot;"
        )
        .replace(
            /'/g,
            "&#039;"
        );

}


function mostrarAlerta(
    mensaje,
    tipo="success"
){

    const alerta =
        document.getElementById(
            "alerta"
        );

    alerta.textContent =
        mensaje;

    alerta.className =
        "alert " + tipo;

    setTimeout(
        ()=>{
            alerta.className =
                "alert";
        },
        4000
    );

}


/* =====================================================
   EMPRESA
===================================================== */

async function obtenerEmpresa(){

    const uid =
        usuarioActual.uid;


    const usuarioSnap =
        await getDoc(
            doc(
                db,
                "usuarios",
                uid
            )
        );


    if(
        usuarioSnap.exists()
    ){

        const datos =
            usuarioSnap.data();


        const id =
            datos.empresaId ||
            datos.idEmpresa ||
            datos.empresa;


        if(id){

            const empresaSnap =
                await getDoc(
                    doc(
                        db,
                        "empresas",
                        id
                    )
                );


            if(
                empresaSnap.exists()
            ){

                return {
                    id:id,
                    ...empresaSnap.data()
                };

            }

        }

    }


    const q =
        query(

            collection(
                db,
                "empresas"
            ),

            where(
                "propietarioUid",
                "==",
                uid
            ),

            limit(1)

        );


    const snap =
        await getDocs(q);


    if(
        snap.empty
    ){

        return null;

    }


    const d =
        snap.docs[0];


    return {
        id:d.id,
        ...d.data()
    };

}


/* =====================================================
   CARGAR PROPIEDADES
===================================================== */

async function cargarPropiedades(){

    const q =
        query(

            collection(
                db,
                "propiedadesAlquiler"
            ),

            where(
                "empresaId",
                "==",
                empresaIdActual
            )

        );


    const snap =
        await getDocs(q);


    propiedades =
        snap.docs.map(
            d => ({
                id:d.id,
                ...d.data()
            })
        );


    propiedades.sort(
        (a,b)=>
            String(
                a.nombre || ""
            ).localeCompare(
                String(
                    b.nombre || ""
                )
            )
    );


    renderizarPropiedades();

}


/* =====================================================
   RENDER
===================================================== */

function renderizarPropiedades(){

    const contenedor =
        document.getElementById(
            "contenedorPropiedades"
        );


    if(
        !propiedades.length
    ){

        contenedor.innerHTML =
            `

            <div class="empty">

                <div
                    style="
                        font-size:45px;
                        margin-bottom:8px;
                    "
                >
                    🏡
                </div>

                <strong>
                    Todavía no tenés propiedades
                </strong>

                <div
                    style="
                        margin-top:6px;
                    "
                >
                    Creá la primera ficha de alojamiento.
                </div>

            </div>

            `;

        return;

    }


    contenedor.innerHTML =
        propiedades
        .map(crearTarjeta)
        .join("");

}


/* =====================================================
   TARJETA
===================================================== */

function crearTarjeta(p){

    const servicios =
        Array.isArray(
            p.servicios
        )
        ?
        p.servicios
        :
        [];


    const imagen =
        p.fotoUrl ||
        "";


    const ubicacion =
        [
            p.localidad,
            p.direccion
        ]
        .filter(Boolean)
        .join(" · ");


    const precio =
        Number(
            p.precioNoche || 0
        );


    const moneda =
        p.moneda ||
        "ARS";


    return `

        <div class="card">


            <div class="card-image">

                ${
                    imagen
                    ?
                    `<img
                        src="${escapar(imagen)}"
                        alt="${escapar(
                            p.nombre
                        )}"
                        onerror="
                            this.style.display='none';
                            this.parentElement.innerHTML='🏡';
                        "
                    >`
                    :
                    "🏡"
                }

            </div>


            <div class="card-body">


                <div class="status-row">

                    <span
                        class="
                            status
                            ${
                                p.estado === "inactiva"
                                ?
                                "status-inactiva"
                                :
                                "status-activa"
                            }
                        "
                    >
                        ${
                            p.estado === "inactiva"
                            ?
                            "Inactiva"
                            :
                            "Activa"
                        }
                    </span>


                    <span
                        class="
                            status
                            ${
                                p.publicado === false
                                ?
                                "no-publicada"
                                :
                                "publicada"
                            }
                        "
                    >
                        ${
                            p.publicado === false
                            ?
                            "No publicada"
                            :
                            "Pública"
                        }
                    </span>

                </div>


                <div class="card-title">

                    ${escapar(
                        p.nombre ||
                        "Sin nombre"
                    )}

                </div>


                <div class="card-location">

                    ${
                        ubicacion
                        ?
                        "📍 " +
                        escapar(ubicacion)
                        :
                        "📍 Ubicación no especificada"
                    }

                </div>


                ${
                    p.descripcion
                    ?
                    `<div class="card-description">
                        ${escapar(
                            p.descripcion
                        )}
                    </div>`
                    :
                    ""
                }


                <div class="tags">

                    ${
                        p.capacidad
                        ?
                        `<span class="tag">
                            👥 ${escapar(
                                p.capacidad
                            )} huéspedes
                        </span>`
                        :
                        ""
                    }


                    ${
                        p.dormitorios != null
                        ?
                        `<span class="tag">
                            🛏️ ${escapar(
                                p.dormitorios
                            )} dormitorios
                        </span>`
                        :
                        ""
                    }


                    ${
                        p.camas != null
                        ?
                        `<span class="tag">
                            🛌 ${escapar(
                                p.camas
                            )} camas
                        </span>`
                        :
                        ""
                    }


                    ${
                        p.banos != null
                        ?
                        `<span class="tag">
                            🚿 ${escapar(
                                p.banos
                            )} baños
                        </span>`
                        :
                        ""
                    }

                </div>


                ${
                    servicios.length
                    ?
                    `<div class="tags">

                        ${servicios
                            .slice(0,5)
                            .map(
                                servicio =>
                                `<span class="tag">
                                    ${textoServicio(
                                        servicio
                                    )}
                                </span>`
                            )
                            .join("")
                        }

                        ${
                            servicios.length > 5
                            ?
                            `<span class="tag">
                                +${servicios.length-5}
                            </span>`
                            :
                            ""
                        }

                    </div>`
                    :
                    ""
                }


                ${
                    precio > 0
                    ?
                    `<div
                        class="price"
                        style="margin-bottom:12px;"
                    >
                        ${moneda === "USD"
                            ? "USD"
                            : "$"
                        }

                        ${precio.toLocaleString(
                            "es-AR",
                            {
                                minimumFractionDigits:2
                            }
                        )}

                        <span
                            style="
                                font-size:11px;
                                font-weight:400;
                                color:#6b7280;
                            "
                        >
                            / noche
                        </span>

                    </div>`
                    :
                    ""
                }


                <div class="actions">

                    <button
                        class="btn btn-light"
                        onclick="
                            editarPropiedad(
                                '${p.id}'
                            )
                        "
                    >
                        ✏️ Editar
                    </button>


                    <button
                        class="btn btn-light"
                        onclick="
                            vistaPrevia(
                                '${p.id}'
                            )
                        "
                    >
                        👁️ Vista
                    </button>


                    <button
                        class="btn btn-warning"
                        onclick="
                            cambiarPublicacion(
                                '${p.id}'
                            )
                        "
                    >
                        ${
                            p.publicado === false
                            ?
                            "🌐 Publicar"
                            :
                            "🚫 Ocultar"
                        }
                    </button>


                    <button
                        class="btn btn-danger"
                        onclick="
                            eliminarPropiedad(
                                '${p.id}'
                            )
                        "
                    >
                        🗑️
                    </button>

                </div>


            </div>

        </div>

    `;

}

/* =====================================================
   GUARDAR
===================================================== */

window.guardarPropiedad =
async function(){

    const nombre =
        document.getElementById(
            "nombre"
        ).value.trim();


    const capacidad =
        Number(
            document.getElementById(
                "capacidad"
            ).value
        );


    if(
        !nombre ||
        !capacidad ||
        capacidad < 1
    ){

        mostrarAlerta(
            "Ingresá el nombre y la capacidad de huéspedes.",
            "error"
        );

        return;

    }


    const servicios =
        Array.from(
            document.querySelectorAll(
                ".servicio-check:checked"
            )
        )
        .map(
            checkbox =>
                checkbox.value
        );


    const datos = {

        empresaId:
            empresaIdActual,

        nombre:
            nombre,

        tipo:
            document.getElementById(
                "tipo"
            ).value,

        direccion:
            document.getElementById(
                "direccion"
            ).value.trim(),

        localidad:
            document.getElementById(
                "localidad"
            ).value.trim(),

        capacidad:
            capacidad,

        dormitorios:
            Number(
                document.getElementById(
                    "dormitorios"
                ).value || 0
            ),

        camas:
            Number(
                document.getElementById(
                    "camas"
                ).value || 0
            ),

        banos:
            Number(
                document.getElementById(
                    "banos"
                ).value || 0
            ),

        precioNoche:
            Number(
                document.getElementById(
                    "precioNoche"
                ).value || 0
            ),

        moneda:
            document.getElementById(
                "moneda"
            ).value,

        descripcion:
            document.getElementById(
                "descripcion"
            ).value.trim(),

        fotoUrl:
            document.getElementById(
                "fotoUrl"
            ).value.trim(),

        servicios:
            servicios,

        publicado:
            document.getElementById(
                "publicado"
            ).checked,

        estado:
            document.getElementById(
                "estado"
            ).checked
            ?
            "activa"
            :
            "inactiva",

        actualizadoEn:
            serverTimestamp()

    };


    const btn =
        document.getElementById(
            "btnGuardar"
        );


    btn.disabled =
        true;

    btn.textContent =
        "Guardando...";


    try{

        if(
            propiedadEditando
        ){

            await updateDoc(

                doc(
                    db,
                    "propiedadesAlquiler",
                    propiedadEditando.id
                ),

                datos

            );

            mostrarAlerta(
                "Propiedad actualizada correctamente."
            );

        }else{

            datos.fechaCreacion =
                serverTimestamp();


            datos.createdAt =
                serverTimestamp();


            await addDoc(

                collection(
                    db,
                    "propiedadesAlquiler"
                ),

                datos

            );


            mostrarAlerta(
                "Propiedad creada correctamente."
            );

        }


        cerrarModal();


        await cargarPropiedades();


    }catch(error){

        console.error(error);

        mostrarAlerta(
            "No se pudo guardar la propiedad.",
            "error"
        );

    }finally{

        btn.disabled =
            false;

        btn.textContent =
            "Guardar propiedad";

    }

};


/* =====================================================
   PUBLICAR / OCULTAR
===================================================== */

window.cambiarPublicacion =
async function(id){

    const propiedad =
        propiedades.find(
            p =>
                p.id === id
        );


    if(!propiedad){
        return;
    }


    const nuevoEstado =
        propiedad.publicado === false;


    try{

        await updateDoc(

            doc(
                db,
                "propiedadesAlquiler",
                id
            ),

            {

                publicado:
                    nuevoEstado,

                actualizadoEn:
                    serverTimestamp()

            }

        );


        propiedad.publicado =
            nuevoEstado;


        renderizarPropiedades();


        mostrarAlerta(

            nuevoEstado
            ?
            "Propiedad publicada."
            :
            "Propiedad ocultada."

        );


    }catch(error){

        console.error(error);

        mostrarAlerta(
            "No se pudo cambiar el estado de publicación.",
            "error"
        );

    }

};


/* =====================================================
   ELIMINAR
===================================================== */

window.eliminarPropiedad =
async function(id){

    const propiedad =
        propiedades.find(
            p =>
                p.id === id
        );


    if(!propiedad){
        return;
    }


    const confirmar =
        confirm(

            "¿Eliminar la propiedad \"" +
            (propiedad.nombre || "") +
            "\"?\n\n" +

            "Esta acción no debería realizarse " +
            "si la propiedad ya tiene reservas."

        );


    if(!confirmar){
        return;
    }


    try{

        /*
         * Comprobamos si existen reservas
         * vinculadas antes de eliminar.
         */

        const q =
            query(

                collection(
                    db,
                    "reservasAlquiler"
                ),

                where(
                    "empresaId",
                    "==",
                    empresaIdActual
                ),

                where(
                    "propiedadId",
                    "==",
                    id
                ),

                limit(1)

            );


        const reservasSnap =
            await getDocs(q);


        if(
            !reservasSnap.empty
        ){

            mostrarAlerta(

                "No se puede eliminar porque la propiedad tiene reservas. Podés ocultarla o marcarla como inactiva.",

                "error"

            );

            return;

        }


        await deleteDoc(

            doc(
                db,
                "propiedadesAlquiler",
                id
            )

        );


        await cargarPropiedades();


        mostrarAlerta(
            "Propiedad eliminada."
        );


    }catch(error){

        console.error(error);

        mostrarAlerta(
            "No se pudo eliminar la propiedad.",
            "error"
        );

    }

};


/* =====================================================
   VISTA PREVIA
===================================================== */

window.vistaPrevia =
function(id){

    const p =
        propiedades.find(
            x =>
                x.id === id
        );


    if(!p){
        return;
    }


    const foto =
        document.getElementById(
            "vistaFoto"
        );


    const icono =
        document.getElementById(
            "vistaIcono"
        );


    if(p.fotoUrl){

        foto.src =
            p.fotoUrl;

        foto.style.display =
            "block";

        icono.style.display =
            "none";

    }else{

        foto.style.display =
            "none";

        icono.style.display =
            "block";

    }


    document.getElementById(
        "vistaNombre"
    ).textContent =
        p.nombre ||
        "Propiedad";


    document.getElementById(
        "vistaUbicacion"
    ).textContent =
        [
            p.localidad,
            p.direccion
        ]
        .filter(Boolean)
        .join(" · ");


    document.getElementById(
        "vistaDescripcion"
    ).textContent =
        p.descripcion ||
        "Sin descripción";


    const datos = [];


    if(p.capacidad){

        datos.push(
            `👥 ${p.capacidad} huéspedes`
        );

    }


    if(
        p.dormitorios != null
    ){

        datos.push(
            `🛏️ ${p.dormitorios} dormitorios`
        );

    }


    if(
        p.camas != null
    ){

        datos.push(
            `🛌 ${p.camas} camas`
        );

    }


    if(
        p.banos != null
    ){

        datos.push(
            `🚿 ${p.banos} baños`
        );

    }


    document.getElementById(
        "vistaDatos"
    ).innerHTML =
        datos
        .map(
            x =>
                `<span class="tag">
                    ${escapar(x)}
                </span>`
        )
        .join("");


    const servicios =
        Array.isArray(
            p.servicios
        )
        ?
        p.servicios
        :
        [];


    document.getElementById(
        "vistaServicios"
    ).innerHTML =
        servicios
        .map(
            x =>
                `<span class="tag">
                    ${escapar(
                        textoServicio(x)
                    )}
                </span>`
        )
        .join("");


    const precio =
        Number(
            p.precioNoche || 0
        );


    document.getElementById(
        "vistaPrecio"
    ).textContent =
        precio > 0
        ?
        (
            p.moneda === "USD"
            ?
            "USD "
            :
            "$ "
        ) +
        precio.toLocaleString(
            "es-AR",
            {
                minimumFractionDigits:2
            }
        ) +
        " / noche"
        :
        "";


    document
        .getElementById(
            "modalVista"
        )
        .classList.add(
            "active"
        );

};


/* =====================================================
   PREVISUALIZACIÓN DE IMAGEN
===================================================== */

function actualizarPreviewImagen(){

    const url =
        document.getElementById(
            "fotoUrl"
        ).value.trim();


    const contenedor =
        document.getElementById(
            "previewImagen"
        );


    const img =
        document.getElementById(
            "imagenPreview"
        );


    if(!url){

        contenedor.style.display =
            "none";

        img.src =
            "";

        return;

    }


    img.src =
        url;


    contenedor.style.display =
        "block";

}


document
    .getElementById(
        "fotoUrl"
    )
    .addEventListener(
