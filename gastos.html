<style>

*{

body{

input,
select,
textarea{
    width:100%;
    padding:13px;
    border:1px solid #d1d5db;

    color:#111827;

.foto-ayuda{

.boton-foto{

}


.boton-principal:hover{

}


.boton-principal:disabled{

    cursor:not-allowed;
}


.mensaje{

    padding:13px;
    border-radius:10px;
    margin-bottom:16px;
    font-size:14px;
    line-height:1.4;
}


.mensaje.error{

    background:#fee2e2;
    color:#991b1b;
}


.mensaje.exito{

}


.mensaje.info{

.nota{

<script type="module">


// ==========================================
// FIREBASE
// ==========================================

import {
    auth,
    db,
    almacenamiento
} from "./Js/firebase.js";


import {
    onAuthStateChanged
} from
"https://www.gstatic.com/firebasejs/12.1.0/firebase-auth.js";


import {
    collection,
    addDoc,
    getDocs,
    query,
    where,
    serverTimestamp
} from
"https://www.gstatic.com/firebasejs/12.1.0/firebase-firestore.js";


import {
    ref,
    uploadBytes,
    getDownloadURL
} from
"https://www.gstatic.com/firebasejs/12.1.0/firebase-storage.js";



// ==========================================
// ELEMENTOS
// ==========================================

const trabajo =
document.getElementById("trabajo");


const fecha =
document.getElementById("fecha");


const categoria =
document.getElementById("categoria");


const descripcion =
document.getElementById("descripcion");


const importe =
document.getElementById("importe");


const proveedor =
document.getElementById("proveedor");


const mensaje =
document.getElementById("mensaje");


const btnGuardar =
document.getElementById("btnGuardar");


const cargandoTrabajos =
document.getElementById("cargandoTrabajos");


const fotoCamara =
document.getElementById("fotoCamara");


const fotoGaleria =
document.getElementById("fotoGaleria");


const vistaPrevia =
document.getElementById("vistaPrevia");


const imagenPrevia =
document.getElementById("imagenPrevia");


const nombreArchivo =
document.getElementById("nombreArchivo");


const progreso =
document.getElementById("progreso");



let usuarioActual = null;

let datosUsuarioActual = {};

let empresaIdActual = "";

let archivoComprobante = null;



// ==========================================
// FECHA ACTUAL
// ==========================================

function establecerFechaActual(){

    const ahora =
    new Date();


    const anio =
    ahora.getFullYear();


    const mes =
    String(
        ahora.getMonth() + 1
    ).padStart(
        2,
        "0"
    );


    const dia =
    String(
        ahora.getDate()
    ).padStart(
        2,
        "0"
    );


    fecha.value =
    `${anio}-${mes}-${dia}`;

}


establecerFechaActual();



// ==========================================
// MENSAJE
// ==========================================

function mostrarMensaje(
    texto,
    tipo = "info"
){

    mensaje.textContent =
    texto;


    mensaje.className =
    "mensaje " + tipo;

}


function ocultarMensaje(){

    mensaje.textContent =
    "";


    mensaje.className =
    "mensaje";

}



// ==========================================
// CARGAR TRABAJOS
// ==========================================

async function cargarTrabajos(){

    trabajo.innerHTML =
    `
    <option value="">
        Cargando trabajos...
    </option>
    `;


    cargandoTrabajos.textContent =
    "Cargando trabajos de tu empresa...";


    try{

        if(!empresaIdActual){

            throw new Error(
                "No se encontró el ID de la empresa."
            );

        }


        const referencia =
        collection(
            db,
            "trabajos"
        );


        /*
         * IMPORTANTE:
         *
         * Se utiliza solamente
         * where("empresaId")
         *
         * No usamos orderBy().
         *
         * De esta forma evitamos
         * necesitar un índice compuesto.
         */

        const consulta =
        query(
            referencia,
            where(
                "empresaId",
                "==",
                empresaIdActual
            )
        );


        const snapshot =
        await getDocs(
            consulta
        );


        trabajo.innerHTML =
        `
        <option value="">
            Seleccionar trabajo
        </option>
        `;


        if(snapshot.empty){

            cargandoTrabajos.textContent =
            "No hay trabajos registrados para esta empresa.";

            return;

        }


        let cantidad = 0;


        snapshot.forEach(
            function(documento){

                const datos =
                documento.data();


                const descripcionTrabajo =
                datos.descripcion ||
                datos.titulo ||
                datos.nombre ||
                "Trabajo sin descripción";


                const clienteNombre =
                datos.clienteNombre ||
                datos.nombreCliente ||
                "";


                const lugar =
                datos.lugar ||
                datos.direccion ||
                "";


                let texto =
                descripcionTrabajo;


                if(clienteNombre){

                    texto +=
                    " — " +
                    clienteNombre;

                }


                if(lugar){

                    texto +=
                    " — " +
                    lugar;

                }


                const opcion =
                document.createElement(
                    "option"
                );


                opcion.value =
                documento.id;


                opcion.textContent =
                texto;


                opcion.dataset.descripcion =
                descripcionTrabajo;


                opcion.dataset.clienteId =
                datos.clienteId || "";


                opcion.dataset.clienteNombre =
                clienteNombre;


                opcion.dataset.lugar =
                lugar;


                trabajo.appendChild(
                    opcion
                );


                cantidad++;

            }
        );


        cargandoTrabajos.textContent =
        cantidad +
        (
            cantidad === 1
            ? " trabajo disponible."
            : " trabajos disponibles."
        );


    }
    catch(error){

        console.error(
            "Error cargando trabajos:",
            error
        );


        trabajo.innerHTML =
        `
        <option value="">
            No se pudieron cargar los trabajos
        </option>
        `;


        cargandoTrabajos.textContent =
        "Error al cargar los trabajos.";


        mostrarMensaje(
            "No se pudieron cargar los trabajos. " +
            obtenerMensajeError(error),
            "error"
        );

    }

}



// ==========================================
// OBTENER MENSAJE DE ERROR
// ==========================================

function obtenerMensajeError(
    error
){

    if(!error){

        return "Error desconocido.";

    }


    if(
        error.code ===
        "permission-denied"
    ){

        return "Firebase rechazó el acceso. Revisá las reglas de Firestore.";

    }


    if(
        error.code ===
        "storage/unauthorized"
    ){

        return "Firebase Storage rechazó el acceso. Revisá las reglas de Storage.";

    }


    if(error.message){

        return error.message;

    }


    return "Error desconocido.";

}



// ==========================================
// AUTENTICACIÓN
// ==========================================

onAuthStateChanged(
    auth,
    async function(usuario){

        if(!usuario){

            usuarioActual =
            null;


            btnGuardar.disabled =
            true;


            mostrarMensaje(
                "Tu sesión no está iniciada. Volvé a iniciar sesión.",
                "error"
            );


            return;

        }


        usuarioActual =
        usuario;


        btnGuardar.disabled =
        false;


        /*
         * Buscar los datos del usuario
         * mediante su UID.
         */

        try{

            const consultaUsuario =
            query(
                collection(
                    db,
                    "usuarios"
                ),
                where(
                    "uid",
                    "==",
                    usuario.uid
                )
            );


            const usuariosSnapshot =
            await getDocs(
                consultaUsuario
            );


            if(
                !usuariosSnapshot.empty
            ){

                const documento =
                usuariosSnapshot.docs[0];


                datosUsuarioActual =
                documento.data();

            }

        }
        catch(error){

            console.warn(
                "No se pudo consultar usuarios:",
                error
            );

        }



        /*
         * Determinar empresa.
         *
         * Prioridad:
         *
         * 1. empresaId
         * 2. empresa
         * 3. UID
         */

        empresaIdActual =
        String(
            datosUsuarioActual.empresaId ||
            datosUsuarioActual.empresa ||
            usuario.uid
        ).trim();


        console.log(
            "GESBASE UID:",
            usuario.uid
        );


        console.log(
            "GESBASE empresaId:",
            empresaIdActual
        );


        await cargarTrabajos();

    }
);



// ==========================================
// CÁMARA
// ==========================================

document
.getElementById("btnCamara")
.addEventListener(
    "click",
    function(){

        fotoCamara.click();

    }
);



// ==========================================
// GALERÍA
// ==========================================

document
.getElementById("btnGaleria")
.addEventListener(
    "click",
    function(){

        fotoGaleria.click();

    }
);



// ==========================================
// PROCESAR FOTO
// ==========================================

function procesarFoto(
    archivo
){

    if(!archivo){

        return;

    }


    if(
        !archivo.type ||
        !archivo.type.startsWith("image/")
    ){

        mostrarMensaje(
            "El archivo seleccionado no es una imagen.",
            "error"
        );

        return;

    }


    /*
     * Máximo 10 MB.
     */

    const maximo =
    10 * 1024 * 1024;


    if(
        archivo.size > maximo
    ){

        mostrarMensaje(
            "La foto no puede superar los 10 MB.",
            "error"
        );

        return;

    }


    archivoComprobante =
    archivo;


    const lector =
    new FileReader();


    lector.onload =
    function(evento){

        imagenPrevia.src =
        evento.target.result;


        nombreArchivo.textContent =
        archivo.name;


        vistaPrevia.style.display =
        "block";


        ocultarMensaje();

    };


    lector.onerror =
    function(){

        mostrarMensaje(
            "No se pudo mostrar la vista previa.",
            "error"
        );

    };


    lector.readAsDataURL(
        archivo
    );

}



// ==========================================
// CAMBIO CÁMARA
// ==========================================

fotoCamara.addEventListener(
    "change",
    function(){

        if(this.files){

            procesarFoto(
                this.files[0]
            );

        }

    }
);



// ==========================================
// CAMBIO GALERÍA
// ==========================================

fotoGaleria.addEventListener(
    "change",
    function(){

        if(this.files){

            procesarFoto(
                this.files[0]
            );

        }

    }
);



// ==========================================
// QUITAR FOTO
// ==========================================

document
.getElementById("btnQuitarFoto")
.addEventListener(
    "click",
    function(){

        archivoComprobante =
        null;


        fotoCamara.value =
        "";


        fotoGaleria.value =
        "";


        imagenPrevia.src =
        "";


        nombreArchivo.textContent =
        "";


        vistaPrevia.style.display =
        "none";


        progreso.style.display =
        "none";

    }
);



// ==========================================
// SUBIR COMPROBANTE
// ==========================================

async function subirComprobante(
    gastoId
){

    if(!archivoComprobante){

        return null;

    }


    if(!usuarioActual){

        throw new Error(
            "No hay usuario autenticado."
        );

    }


    /*
     * Nombre seguro.
     */

    const nombreSeguro =
    archivoComprobante.name.replace(
        /[^a-zA-Z0-9._-]/g,
        "_"
    );


    const nombreArchivo =
    Date.now() +
    "_" +
    Math.random()
    .toString(36)
    .substring(2,10) +
    "_" +
    nombreSeguro;


    /*
     * Ruta:
     *
     * gastos/
     * UID/
     * ID_DEL_GASTO/
     * ARCHIVO
     */

    const ruta =
    "gastos/" +
    usuarioActual.uid +
    "/" +
    gastoId +
    "/" +
    nombreArchivo;


    const referenciaStorage =
    ref(
        almacenamiento,
        ruta
    );


    progreso.textContent =
    "Subiendo comprobante...";


    progreso.style.display =
    "block";


    await uploadBytes(
        referenciaStorage,
        archivoComprobante,
        {
            contentType:
            archivoComprobante.type
        }
    );


    const url =
    await getDownloadURL(
        referenciaStorage
    );


    progreso.textContent =
    "Comprobante cargado correctamente.";


    return {
        url:url,
        storagePath:ruta,
        nombre:archivoComprobante.name,
        tipo:archivoComprobante.type,
        tamaño:archivoComprobante.size
    };

}



// ==========================================
// GUARDAR GASTO
// ==========================================

btnGuardar.addEventListener(
    "click",
    async function(){

        if(!usuarioActual){

            mostrarMensaje(
                "La sesión no está disponible.",
                "error"
            );

            return;

        }


        const trabajoId =
        trabajo.value;


        const opcionTrabajo =
        trabajo.options[
            trabajo.selectedIndex
        ];


        const trabajoDescripcion =
        opcionTrabajo?.dataset?.descripcion ||
        "";


        const clienteId =
        opcionTrabajo?.dataset?.clienteId ||
        "";


        const clienteNombre =
        opcionTrabajo?.dataset?.clienteNombre ||
        "";


        const lugarTrabajo =
        opcionTrabajo?.dataset?.lugar ||
        "";


        const fechaValor =
        fecha.value;


        const categoriaValor =
        categoria.value;


        const descripcionValor =
        descripcion.value.trim();


        const importeValor =
        Number(
            importe.value
        );


        const proveedorValor =
        proveedor.value.trim();



        // ======================================
        // VALIDACIONES
        // ======================================

        if(!trabajoId){

            mostrarMensaje(
                "Seleccioná el trabajo asociado al gasto.",
                "error"
            );

            trabajo.focus();

            return;

        }


        if(!fechaValor){

            mostrarMensaje(
                "Seleccioná la fecha del gasto.",
                "error"
            );

            fecha.focus();

            return;

        }


        if(!categoriaValor){

            mostrarMensaje(
                "Seleccioná una categoría.",
                "error"
            );

            categoria.focus();

            return;

        }


        if(!descripcionValor){

            mostrarMensaje(
                "Ingresá una descripción.",
                "error"
            );

            descripcion.focus();

            return;

        }


        if(
            !Number.isFinite(
                importeValor
            ) ||
            importeValor <= 0
        ){

            mostrarMensaje(
                "Ingresá un importe válido mayor a $0.",
                "error"
            );

            importe.focus();

            return;

        }


        if(!empresaIdActual){

            mostrarMensaje(
                "No se pudo identificar la empresa.",
                "error"
            );

            return;

        }



        // ======================================
        // BLOQUEAR BOTÓN
        // ======================================

        btnGuardar.disabled =
        true;


        btnGuardar.textContent =
        "💾 Guardando gasto...";


        ocultarMensaje();



        try{

            // ==================================
            // CREAR GASTO
            // ==================================

            const datosGasto = {

                empresaId:
                empresaIdActual,


                usuarioId:
                usuarioActual.uid,


                trabajoId:
                trabajoId,


                trabajoDescripcion:
                trabajoDescripcion,


                clienteId:
                clienteId,


                clienteNombre:
                clienteNombre,


                lugarTrabajo:
                lugarTrabajo,


                fecha:
                fechaValor,


                categoria:
                categoriaValor,


                descripcion:
                descripcionValor,


                importe:
                importeValor,


                proveedor:
                proveedorValor,


                comprobanteNombre:
                "",


                comprobanteUrl:
                "",


                comprobanteStoragePath:
                "",


                comprobantePendiente:
                false,


                creadoEn:
                serverTimestamp()

            };


            const referenciaGasto =
            await addDoc(
                collection(
                    db,
                    "gastos"
                ),
                datosGasto
            );


            const gastoId =
            referenciaGasto.id;


            console.log(
                "Gasto creado:",
                gastoId
            );



            // ==================================
            // SUBIR COMPROBANTE
            // ==================================

            if(archivoComprobante){

                try{

                    const comprobante =
                    await subirComprobante(
                        gastoId
                    );


                    if(comprobante){

                        /*
                         * Actualizamos el documento
                         * sin importar updateDoc
                         * para mantener las importaciones
                         * simples.
                         *
                         * Se realiza mediante
                         * una segunda escritura
                         * utilizando setDoc.
                         */

                        const {
                            doc,
                            updateDoc
                        } =
                        await import(
                            "https://www.gstatic.com/firebasejs/12.1.0/firebase-firestore.js"
                        );


                        await updateDoc(
                            doc(
                                db,
                                "gastos",
                                gastoId
                            ),
                            {

                                comprobanteNombre:
                                comprobante.nombre,


                                comprobanteUrl:
                                comprobante.url,


                                comprobanteStoragePath:
                                comprobante.storagePath,


                                comprobanteTipo:
                                comprobante.tipo,


                                comprobanteTamaño:
                                comprobante.tamaño,


                                comprobantePendiente:
                                false,


                                comprobanteSubidoEn:
                                serverTimestamp()

                            }
                        );

                    }

                }
                catch(errorFoto){

                    console.error(
                        "Error subiendo comprobante:",
                        errorFoto
                    );


                    /*
                     * El gasto ya está guardado.
                     *
                     * No borramos el gasto.
                     *
                     * Avisamos que el comprobante
                     * no pudo subirse.
                     */

                    mostrarMensaje(
                        "⚠️ El gasto se guardó, pero el comprobante no pudo subirse. " +
                        obtenerMensajeError(errorFoto),
                        "error"
                    );

                    limpiarFormulario();


                    return;

                }

            }



            // ==================================
            // ÉXITO
            // ==================================

            mostrarMensaje(
                archivoComprobante
                ? "✅ Gasto y comprobante guardados correctamente."
                : "✅ Gasto guardado correctamente.",
                "exito"
            );


            limpiarFormulario();


        }
        catch(error){

            console.error(
                "Error guardando gasto:",
                error
            );


            mostrarMensaje(
                "No se pudo guardar el gasto. " +
                obtenerMensajeError(error),
                "error"
            );

        }
        finally{

            btnGuardar.disabled =
            false;


            btnGuardar.textContent =
            "💾 Guardar gasto";

        }

    }
);



// ==========================================
// LIMPIAR FORMULARIO
// ==========================================

function limpiarFormulario(){

    trabajo.value =
    "";


    categoria.value =
    "";


    descripcion.value =
    "";


    importe.value =
    "";


    proveedor.value =
    "";


    archivoComprobante =
    null;


    fotoCamara.value =
    "";


    fotoGaleria.value =
    "";


    imagenPrevia.src =
    "";


    nombreArchivo.textContent =
    "";


    vistaPrevia.style.display =
    "none";


    progreso.style.display =
    "none";


    establecerFechaActual();

}

// VOLVER
// ==========================================

document
.getElementById("btnVolver")
.addEventListener(
    "click",
    function(){

        if(
            window.history.length > 1
        ){

            window.history.back();

        }
        else{

            window.location.href =
            "index.html";

        }

    }
);



// ==========================================
// FIN GESBASE
// ==========================================

</script>
