<head>

<body>

<div class="contenedor">

<header>
  <div class="header-superior">
    <button id="btnVolver" class="btn-volver">←</button>
    <div class="titulo-header">Gastos</div>
  </div>
  <div class="subtitulo-header">Registrar gasto del trabajo</div>
</header>

<main>

<div id="mensaje" class="mensaje"></div>

<section class="tarjeta">

<div class="titulo-seccion">Nuevo gasto</div>

<div class="campo">
<label>Trabajo *</label>

<select id="trabajo" required>
<option value="">Cargando trabajos...</option>

</div>

<div class="fila">

<div class="campo">

</div>

<div class="campo">
<label>Categoría *</label>
<select id="categoria">

<option value="materiales">Materiales</option>
<option value="viaticos">Viáticos</option>
<option value="herramientas">Herramientas</option>
<option value="hospedaje">Hospedaje</option>

</select>
</div>

</div>

<div class="campo">

<textarea id="descripcion"></textarea>
</div>

<div class="campo">
<label>Importe *</label>
<div class="importe-contenedor">
<span class="simbolo-peso">$</span>

<!-- Conservá tu bloque de COMPROBANTE exactamente igual -->

💾 Guardar gasto
</button>

</main>
</div>
    <!-- ==========================================
     COMPROBANTE FOTOGRÁFICO
========================================== -->

<section class="tarjeta">

    <div class="titulo-seccion">
        Comprobante
    </div>

    <div class="foto-area">

        <div class="foto-icono">
            📷
        </div>

        <div class="foto-titulo">
            Cargar comprobante
        </div>

        <div class="foto-ayuda">
            Podés sacar una foto del comprobante
            o seleccionar una imagen de la galería.
        </div>

        <div class="botones-foto">

            <button
                type="button"
                class="boton-foto boton-camara"
                id="btnCamara"
            >
                📷 Tomar foto
            </button>

            <button
                type="button"
                class="boton-foto boton-galeria"
                id="btnGaleria"
            >
                🖼️ Galería
            </button>

        </div>

        <input
            type="file"
            id="fotoCamara"
            class="input-archivo"
            accept="image/*"
            capture="environment"
        >

        <input
            type="file"
            id="fotoGaleria"
            class="input-archivo"
            accept="image/*"
        >

        <div
            id="vistaPrevia"
            class="vista-previa"
        >

            <img
                id="imagenPrevia"
                alt="Vista previa del comprobante"
            >

            <div
                id="nombreArchivo"
                class="nombre-archivo"
            ></div>

            <button
                type="button"
                id="btnQuitarFoto"
                class="quitar-foto"
            >
                🗑️ Quitar foto
            </button>

        </div>

    </div>

    <div class="nota">
        El comprobante queda asociado al gasto.
        La subida a Firebase Storage se podrá conectar
        posteriormente.
    </div>

</section>


<!-- ==========================================
     GUARDAR
========================================== -->

<section class="tarjeta">

    <button
        type="button"
        id="btnGuardar"
        class="boton-principal"
    >
        💾 Guardar gasto
    </button>

</section>


</main>

</div>


<!-- ==========================================
     JAVASCRIPT
     PARTE 3
========================================== -->

<script type="module">

// ==========================================
// FIREBASE
// ==========================================

import {
    auth,
    db
} from "./Js/firebase.js";

import {
    onAuthStateChanged
} from "https://www.gstatic.com/firebasejs/12.1.0/firebase-auth.js";

import {
    collection,
    getDocs,
    query,
    where,
    addDoc,
    serverTimestamp
} from "https://www.gstatic.com/firebasejs/12.1.0/firebase-firestore.js";


// ==========================================
// ELEMENTOS
// ==========================================

const trabajo =
document.getElementById("trabajo");

const fecha =
document.getElementById("fecha");

const categoria =
document.getElementById("categoria");

const descripcion =
document.getElementById("descripcion");

const importe =
document.getElementById("importe");

const proveedor =
document.getElementById("proveedor");

const mensaje =
document.getElementById("mensaje");


// ==========================================
// FOTO
// ==========================================

const fotoCamara =
document.getElementById("fotoCamara");

const fotoGaleria =
document.getElementById("fotoGaleria");

const vistaPrevia =
document.getElementById("vistaPrevia");

const imagenPrevia =
document.getElementById("imagenPrevia");

const nombreArchivo =
document.getElementById("nombreArchivo");

let archivoComprobante = null;


// ==========================================
// USUARIO
// ==========================================

let usuarioActual = null;

let empresaIdActual = null;


// ==========================================
// FECHA ACTUAL
// ==========================================

const
            // ==========================================
        // PROCESAR FOTO
        // ==========================================

        function procesarFoto(archivo) {

            if (!archivo) {
                return;
            }

            if (!archivo.type.startsWith("image/")) {

                mostrarMensaje(
                    "El archivo seleccionado no es una imagen.",
                    "error"
                );

                return;
            }

            archivoComprobante = archivo;

            const lector = new FileReader();

            lector.onload = function(evento) {

                imagenPrevia.src =
                    evento.target.result;

                nombreArchivo.textContent =
                    archivo.name;

                vistaPrevia.style.display =
                    "block";

            };

            lector.readAsDataURL(archivo);
        }


        // ==========================================
        // EVENTO CÁMARA
        // ==========================================

        fotoCamara.addEventListener(
            "change",
            function() {

                const archivo =
                    this.files &&
                    this.files[0];

                procesarFoto(archivo);

            }
        );


        // ==========================================
        // EVENTO GALERÍA
        // ==========================================

        fotoGaleria.addEventListener(
            "change",
            function() {

                const archivo =
                    this.files &&
                    this.files[0];

                procesarFoto(archivo);

            }
        );


        // ==========================================
        // QUITAR FOTO
        // ==========================================

        document
            .getElementById("btnQuitarFoto")
            .addEventListener(
                "click",
                function() {

                    archivoComprobante = null;

                    fotoCamara.value = "";
                    fotoGaleria.value = "";

                    imagenPrevia.src = "";
                    nombreArchivo.textContent = "";

                    vistaPrevia.style.display = "none";

                }
            );


        // ==========================================
        // GUARDAR GASTO
        // ==========================================

        document
            .getElementById("btnGuardar")
            .addEventListener(
                "click",
                async function() {

                    const boton =
                        document.getElementById(
                            "btnGuardar"
                        );

                    const trabajoSelect =
                        document.getElementById(
                            "trabajo"
                        );

                    const categoria =
                        document.getElementById(
                            "categoria"
                        ).value;

                    const descripcion =
                        document.getElementById(
                            "descripcion"
                        ).value.trim();

                    const importe =
                        document.getElementById(
                            "importe"
                        ).value;

                    const proveedor =
                        document.getElementById(
                            "proveedor"
                        ).value.trim();


                    // ==================================
                    // VALIDACIONES
                    // ==================================

                    if (!trabajoSelect.value) {

                        mostrarMensaje(
                            "Seleccioná el trabajo asociado.",
                            "error"
                        );

                        return;
                    }


                    if (!categoria) {

                        mostrarMensaje(
                            "Seleccioná una categoría.",
                            "error"
                        );

                        return;
                    }


                    if (!descripcion) {

                        mostrarMensaje(
                            "Ingresá una descripción.",
                            "error"
                        );

                        return;
                    }


                    if (
                        !importe ||
                        Number(importe) <= 0
                    ) {

                        mostrarMensaje(
                            "Ingresá un importe válido.",
                            "error"
                        );

                        return;
                    }


                    // ==================================
                    // USUARIO
                    // ==================================

                    const usuario =
                        auth.currentUser;


                    if (!usuario) {

                        mostrarMensaje(
                            "Tu sesión expiró. Volvé a iniciar sesión.",
                            "error"
                        );

                        return;
                    }


                    // ==================================
                    // DATOS DEL TRABAJO
                    // ==================================

                    const opcionTrabajo =
                        trabajoSelect.options[
                            trabajoSelect.selectedIndex
                        ];


                    const trabajoId =
                        trabajoSelect.value;


                    const trabajoNombre =
                        opcionTrabajo.dataset.nombre ||
                        opcionTrabajo.textContent ||
                        "Trabajo";


                    const clienteId =
                        opcionTrabajo.dataset.clienteId ||
                        "";


                    // ==================================
                    // DATOS DEL USUARIO
                    // ==================================

                    let empresaId =
                        usuario.uid;


                    try {

                        const usuarioRef =
                            doc(
                                db,
                                "usuarios",
                                usuario.uid
                            );


                        const usuarioSnap =
                            await getDoc(
                                usuarioRef
                            );


                        if (
                            usuarioSnap.exists()
                        ) {

                            const datosUsuario =
                                usuarioSnap.data();


                            empresaId =
                                String(
                                    datosUsuario.empresaId ||
                                    datosUsuario.empresa ||
                                    usuario.uid
                                ).trim();

                        }

                    }
                    catch(error) {

                        console.warn(
                            "No se pudo obtener empresaId. Se utilizará el UID.",
                            error
                        );

                    }


                    // ==================================
                    // DESHABILITAR BOTÓN
                    // ==================================

                    boton.disabled = true;

                    boton.textContent =
                        "Guardando gasto...";


                    try {

                        // ==================================
                        // CREAR GASTO
                        // ==================================

                        const gasto = {

                            empresaId:
                                empresaId,

                            usuarioId:
                                usuario.uid,

                            trabajoId:
                                trabajoId,

                            trabajoNombre:
                                trabajoNombre,

                            clienteId:
                                clienteId,

                            fecha:
                                fecha.value,

                            categoria:
                                categoria,

                            descripcion:
                                descripcion,

                            importe:
                                Number(importe),

                            proveedor:
                                proveedor,

                            comprobanteNombre:
                                archivoComprobante
                                    ? archivoComprobante.name
                                    : "",

                            comprobantePendiente:
                                archivoComprobante
                                    ? true
                                    : false,

                            estado:
                                "registrado",

                            creadoEn:
                                serverTimestamp(),

                            actualizadoEn:
                                serverTimestamp()

                        };


                        // ==================================
                        // GUARDAR FIRESTORE
                        // ==================================

                        await addDoc(
                            collection(
                                db,
                                "gastos"
                            ),
                            gasto
                        );


                        // ==================================
                        // ÉXITO
                        // ==================================

                        mostrarMensaje(
                            "✅ Gasto guardado correctamente y asociado al trabajo.",
                            "exito"
                        );


                        // ==================================
                        // LIMPIAR FORMULARIO
                        // ==================================

                        document
                            .getElementById(
                                "descripcion"
                            )
                            .value = "";


                        document
                            .getElementById(
                                "importe"
                            )
                            .value = "";


                        document
                            .getElementById(
                                "proveedor"
                            )
                            .value = "";


                        document
                            .getElementById(
                                "categoria"
                            )
                            .value = "";


                        trabajoSelect.value = "";


                        archivoComprobante = null;


                        fotoCamara.value = "";
                        fotoGaleria.value = "";

                        imagenPrevia.src = "";
                        nombreArchivo.textContent = "";

                        vistaPrevia.style.display =
                            "none";


                        establecerFechaActual();


                    }
                    catch(error) {

                        console.error(
                            "Error guardando gasto:",
                            error
                        );


                        mostrarMensaje(
                            "No se pudo guardar el gasto: " +
                            error.message,
                            "error"
                        );

                    }
                    finally {

                        boton.disabled = false;

                        boton.textContent =
                            "💾 Guardar gasto";

                    }

                }
            );


        // ==========================================
        // VOLVER
        // ==========================================

        document
            .getElementById("btnVolver")
            .addEventListener(
                "click",
                function() {

                    if (
                        history.length > 1
                    ) {

                        history.back();

                    }
                    else {

                        window.location.href =
                            "index.html";

                    }

                }
            );


    </script>


</body>

</html>
