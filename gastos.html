<!DOCTYPE html>
<html lang="es">

<head>

<meta charset="UTF-8">

<meta name="viewport" content="width=device-width, initial-scale=1.0">

<meta name="theme-color" content="#111827">

<meta
    name="description"
    content="GESBASE - Gastos"
>

<title>GESBASE - Gastos</title>

<style>

*{
    box-sizing:border-box;
    margin:0;
    padding:0;
}

body{
    font-family:Arial,sans-serif;
    background:#f3f4f6;
    color:#111827;
    min-height:100vh;
}

.contenedor{
    width:100%;
    max-width:700px;
    margin:auto;
    min-height:100vh;
    background:#fff;
}

header{
    background:#111827;
    color:white;
    padding:20px;
}

.header-superior{
    display:flex;
    align-items:center;
    gap:12px;
}

.btn-volver{
    border:none;
    background:rgba(255,255,255,.12);
    color:white;
    width:42px;
    height:42px;
    border-radius:10px;
    font-size:22px;
    cursor:pointer;
}

.titulo-header{
    font-size:24px;
    font-weight:bold;
}

.subtitulo-header{
    margin-top:5px;
    margin-left:54px;
    color:#d1d5db;
    font-size:13px;
}

main{
    padding:20px;
}

.tarjeta{
    background:white;
    border:1px solid #e5e7eb;
    border-radius:14px;
    padding:18px;
    margin-bottom:18px;
    box-shadow:0 2px 8px rgba(0,0,0,.04);
}

.titulo-seccion{
    font-size:18px;
    font-weight:bold;
    margin-bottom:17px;
}

.campo{
    margin-bottom:16px;
}

label{
    display:block;
    font-size:14px;
    font-weight:bold;
    margin-bottom:7px;
}

.obligatorio{
    color:#dc2626;
}

input,
select,
textarea{
    width:100%;
    padding:13px;
    border:1px solid #d1d5db;
    border-radius:10px;
    font-size:16px;
    background:white;
    color:#111827;
    outline:none;
}

input:focus,
select:focus,
textarea:focus{
    border-color:#111827;
}

textarea{
    min-height:90px;
    resize:vertical;
}

.fila{
    display:grid;
    grid-template-columns:1fr 1fr;
    gap:12px;
}

.importe-contenedor{
    position:relative;
}

.simbolo-peso{
    position:absolute;
    left:13px;
    top:50%;
    transform:translateY(-50%);
    font-weight:bold;
    color:#374151;
    pointer-events:none;
}

#importe{
    padding-left:30px;
}

.foto-area{
    border:2px dashed #d1d5db;
    border-radius:13px;
    padding:18px;
    text-align:center;
    background:#f9fafb;
}

.foto-icono{
    font-size:42px;
    margin-bottom:8px;
}

.foto-titulo{
    font-size:16px;
    font-weight:bold;
    margin-bottom:5px;
}

.foto-ayuda{
    color:#6b7280;
    font-size:13px;
    margin-bottom:15px;
    line-height:1.4;
}

.botones-foto{
    display:grid;
    grid-template-columns:1fr 1fr;
    gap:10px;
}

.boton-foto{
    border:none;
    border-radius:10px;
    padding:13px 10px;
    font-size:14px;
    font-weight:bold;
    cursor:pointer;
}

.boton-camara{
    background:#111827;
    color:white;
}

.boton-galeria{
    background:#e5e7eb;
    color:#111827;
}

.input-archivo{
    display:none;
}

.vista-previa{
    display:none;
    margin-top:15px;
}

.vista-previa img{
    display:block;
    width:100%;
    max-height:350px;
    object-fit:contain;
    border-radius:10px;
    border:1px solid #d1d5db;
    background:#f3f4f6;
}

.nombre-archivo{
    margin-top:8px;
    color:#4b5563;
    font-size:13px;
    word-break:break-word;
}

.quitar-foto{
    margin-top:10px;
    border:none;
    background:#fee2e2;
    color:#991b1b;
    padding:9px 12px;
    border-radius:8px;
    font-size:13px;
    font-weight:bold;
    cursor:pointer;
}

.boton-principal{
    width:100%;
    border:none;
    border-radius:11px;
    padding:15px;
    background:#111827;
    color:white;
    font-size:16px;
    font-weight:bold;
    cursor:pointer;
}

.boton-principal:disabled{
    opacity:.6;
    cursor:not-allowed;
}

.mensaje{
    display:none;
    padding:13px;
    border-radius:10px;
    margin-bottom:16px;
    font-size:14px;
    line-height:1.4;
}

.mensaje.error{
    display:block;
    background:#fee2e2;
    color:#991b1b;
}

.mensaje.exito{
    display:block;
    background:#dcfce7;
    color:#166534;
}

.nota{
    color:#6b7280;
    font-size:12px;
    line-height:1.5;
    margin-top:10px;
}

.cargando-trabajos{
    color:#6b7280;
    font-size:13px;
    margin-top:6px;
}

@media(max-width:500px){

    .fila{
        grid-template-columns:1fr;
        gap:0;
    }

    main{
        padding:15px;
    }

    .tarjeta{
        padding:15px;
    }

}

</style>

</head>

<body>

<div class="contenedor">

<header>

<div class="header-superior">

<button
    type="button"
    class="btn-volver"
    id="btnVolver"
>
←
</button>

<div class="titulo-header">
Gastos
</div>

</div>

<div class="subtitulo-header">
Registrar gasto del trabajo
</div>

</header>

<main>

<div
    id="mensaje"
    class="mensaje"
></div>

<section class="tarjeta">

<div class="titulo-seccion">
Nuevo gasto
</div>

<div class="campo">

<label for="trabajo">
Trabajo
<span class="obligatorio">*</span>
</label>

<select id="trabajo" required>

<option value="">
Cargando trabajos...
</option>

</select>

<div
    id="cargandoTrabajos"
    class="cargando-trabajos"
>
Cargando trabajos de tu empresa...
</div>

</div>

<div class="fila">

<div class="campo">

<label for="fecha">
Fecha
<span class="obligatorio">*</span>
</label>

<input
    type="date"
    id="fecha"
    required
>

</div>

<div class="campo">

<label for="categoria">
Categoría
<span class="obligatorio">*</span>
</label>

<select
    id="categoria"
    required
>

<option value="">
Seleccionar
</option>

<option value="empleados">
Empleados
</option>

<option value="materiales">
Materiales
</option>

<option value="viaticos">
Viáticos
</option>

<option value="herramientas">
Herramientas
</option>

<option value="hospedaje">
Hospedaje
</option>

<option value="fletes">
Fletes
</option>

<option value="servicios_externos">
Servicios externos
</option>

<option value="otros">
Otros
</option>

</select>

</div>

</div>

<div class="campo">

<label for="descripcion">
Descripción
<span class="obligatorio">*</span>
</label>

<textarea
    id="descripcion"
    placeholder="Ej.: Compra de materiales para el trabajo..."
    required
></textarea>

</div>

<div class="campo">

<label for="importe">
Importe
<span class="obligatorio">*</span>
</label>

<div class="importe-contenedor">

<span class="simbolo-peso">
$
</span>

<input
    type="number"
    id="importe"
    min="0"
    step="0.01"
    placeholder="0,00"
    inputmode="decimal"
    required
>

</div>

</div>

<div class="campo">

<label for="proveedor">
Proveedor / Persona
</label>

<input
    type="text"
    id="proveedor"
    placeholder="Nombre del proveedor o persona"
    autocomplete="off"
>

</div>

</section>

<section class="tarjeta">

<div class="titulo-seccion">
Comprobante
</div>

<div class="foto-area">

<div class="foto-icono">
📷
</div>

<div class="foto-titulo">
Cargar comprobante
</div>

<div class="foto-ayuda">
Podés sacar una foto del comprobante
o seleccionar una imagen de la galería.
</div>

<div class="botones-foto">

<button
    type="button"
    class="boton-foto boton-camara"
    id="btnCamara"
>
📷 Tomar foto
</button>

<button
    type="button"
    class="boton-foto boton-galeria"
    id="btnGaleria"
>
🖼️ Galería
</button>

</div>

<input
    type="file"
    id="fotoCamara"
    class="input-archivo"
    accept="image/*"
    capture="environment"
>

<input
    type="file"
    id="fotoGaleria"
    class="input-archivo"
    accept="image/*"
>

<div
    id="vistaPrevia"
    class="vista-previa"
>

<img
    id="imagenPrevia"
    alt="Vista previa del comprobante"
>

<div
    id="nombreArchivo"
    class="nombre-archivo"
></div>

<button
    type="button"
    id="btnQuitarFoto"
    class="quitar-foto"
>
🗑️ Quitar foto
</button>

</div>

</div>

<div class="nota">

El comprobante se guardará en Firebase Storage
y quedará asociado automáticamente al gasto.

</div>

</section>

<section class="tarjeta">

<button
    type="button"
    id="btnGuardar"
    class="boton-principal"
>
💾 Guardar gasto
</button>

</section>

</main>

</div>

<script type="module">

import {
    auth,
    db,
    almacenamiento
} from "./Js/firebase.js";

import {
    onAuthStateChanged
} from "https://www.gstatic.com/firebasejs/12.18.0/firebase-auth.js";

import {
    collection,
    addDoc,
    getDocs,
    query,
    where,
    serverTimestamp
} from "https://www.gstatic.com/firebasejs/12.18.0/firebase-firestore.js";

import {
    ref,
    uploadBytes,
    getDownloadURL
} from "https://www.gstatic.com/firebasejs/12.18.0/firebase-storage.js";


const trabajo =
document.getElementById("trabajo");

const fecha =
document.getElementById("fecha");

const categoria =
document.getElementById("categoria");

const descripcion =
document.getElementById("descripcion");

const importe =
document.getElementById("importe");

const proveedor =
document.getElementById("proveedor");

const mensaje =
document.getElementById("mensaje");

const btnGuardar =
document.getElementById("btnGuardar");

const cargandoTrabajos =
document.getElementById("cargandoTrabajos");

const fotoCamara =
document.getElementById("fotoCamara");

const fotoGaleria =
document.getElementById("fotoGaleria");

const vistaPrevia =
document.getElementById("vistaPrevia");

const imagenPrevia =
document.getElementById("imagenPrevia");

const nombreArchivo =
document.getElementById("nombreArchivo");

const btnCamara =
document.getElementById("btnCamara");

const btnGaleria =
document.getElementById("btnGaleria");

const btnQuitarFoto =
document.getElementById("btnQuitarFoto");

const btnVolver =
document.getElementById("btnVolver");


let usuarioActual = null;

let datosUsuarioActual = {};

let empresaIdActual = "";

let archivoComprobante = null;


function establecerFechaActual(){

    const ahora =
    new Date();

    const anio =
    ahora.getFullYear();

    const mes =
    String(
        ahora.getMonth()+1
    ).padStart(2,"0");

    const dia =
    String(
        ahora.getDate()
    ).padStart(2,"0");

    fecha.value =
    `${anio}-${mes}-${dia}`;

}


establecerFechaActual();


function mostrarMensaje(
    texto,
    tipo
){

    mensaje.textContent =
    texto;

    mensaje.className =
    "mensaje " + tipo;

}


function limpiarMensaje(){

    mensaje.textContent =
    "";

    mensaje.className =
    "mensaje";

}


async function cargarTrabajos(){

    trabajo.innerHTML =
    `
        <option value="">
            Cargando trabajos...
        </option>
    `;

    cargandoTrabajos.textContent =
    "Cargando trabajos de tu empresa...";

    try{

        if(!empresaIdActual){

            throw new Error(
                "No se encontró el ID de la empresa."
            );

        }

        const consulta =
        query(
            collection(
                db,
                "trabajos"
            ),
            where(
                "empresaId",
                "==",
                empresaIdActual
            )
        );

        const snapshot =
        await getDocs(
            consulta
        );

        trabajo.innerHTML =
        `
            <option value="">
                Seleccionar trabajo
            </option>
        `;

        if(snapshot.empty){

            cargandoTrabajos.textContent =
            "No hay trabajos registrados para esta empresa.";

            return;

        }

        let cantidad = 0;

        snapshot.forEach(
            documento => {

                const datos =
                documento.data();

                const descripcionTrabajo =
                datos.descripcion ||
                datos.titulo ||
                datos.nombre ||
                "Trabajo sin descripción";

                const lugar =
                datos.lugar ||
                datos.direccion ||
                "";

                const clienteNombre =
                datos.clienteNombre ||
                datos.nombreCliente ||
                "";

                let texto =
                descripcionTrabajo;

                if(clienteNombre){

                    texto +=
                    " — " +
                    clienteNombre;

                }

                if(lugar){

                    texto +=
                    " — " +
                    lugar;

                }

                const opcion =
                document.createElement(
                    "option"
                );

                opcion.value =
                documento.id;

                opcion.textContent =
                texto;

                opcion.dataset.descripcion =
                descripcionTrabajo;

                opcion.dataset.clienteId =
                datos.clienteId || "";

                trabajo.appendChild(
                    opcion
                );

                cantidad++;

            }
        );

        cargandoTrabajos.textContent =
        cantidad +
        (
            cantidad === 1
            ? " trabajo disponible."
            : " trabajos disponibles."
        );

    }
    catch(error){

        console.error(
            "Error cargando trabajos:",
            error
        );

        trabajo.innerHTML =
        `
            <option value="">
                No se pudieron cargar
            </option>
        `;

        cargandoTrabajos.textContent =
        "Error al cargar los trabajos.";

        mostrarMensaje(
            "No se pudieron cargar los trabajos. " +
            error.message,
            "error"
        );

    }

}


onAuthStateChanged(
    auth,
    async usuario => {

        if(!usuario){

            window.location.replace(
                "login.html"
            );

            return;

        }

        usuarioActual =
        usuario;

        try{

            const referenciaUsuario =
            await getDocs(
                query(
                    collection(
                        db,
                        "usuarios"
                    ),
                    where(
                        "uid",
                        "==",
                        usuario.uid
                    )
                )
            );

            if(
                !referenciaUsuario.empty
            ){

                datosUsuarioActual =
                referenciaUsuario.docs[0].data();

            }
            else{

                const documento =
                await getDocs(
                    query(
                        collection(
                            db,
                            "usuarios"
                        ),
                        where(
                            "email",
                            "==",
                            usuario.email
                        )
                    )
                );

                if(
                    !documento.empty
                ){

                    datosUsuarioActual =
                    documento.docs[0].data();

                }

            }

        }
        catch(error){

            console.warn(
                "No se pudo consultar usuario:",
                error
            );

        }

        empresaIdActual =
        String(
            datosUsuarioActual.empresaId ||
            datosUsuarioActual.empresa ||
            usuario.uid
        ).trim();

        console.log(
            "GESBASE usuario:",
            usuario.uid
        );

        console.log(
            "GESBASE empresa:",
            empresaIdActual
        );

        await cargarTrabajos();

    }
);


btnCamara.addEventListener(
    "click",
    () => {
        fotoCamara.click();
    }
);


btnGaleria.addEventListener(
    "click",
    () => {
        fotoGaleria.click();
    }
);


function procesarFoto(
    archivo
){

    if(!archivo){
        return;
    }

    if(
        !archivo.type.startsWith(
            "image/"
        )
    ){

        mostrarMensaje(
            "El archivo seleccionado no es una imagen.",
            "error"
        );

        return;

    }

    const maximo =
    10 * 1024 * 1024;

    if(
        archivo.size > maximo
    ){

        mostrarMensaje(
            "El comprobante no puede superar los 10 MB.",
            "error"
        );

        return;

    }

    archivoComprobante =
    archivo;

    const lector =
    new FileReader();

    lector.onload =
    evento => {

        imagenPrevia.src =
        evento.target.result;

        nombreArchivo.textContent =
        archivo.name;

        vistaPrevia.style.display =
        "block";

    };

    lector.readAsDataURL(
        archivo
    );

}


fotoCamara.addEventListener(
    "change",
    function(){

        procesarFoto(
            this.files?.[0]
        );

    }
);


fotoGaleria.addEventListener(
    "change",
    function(){

        procesarFoto(
            this.files?.[0]
        );

    }
);


btnQuitarFoto.addEventListener(
    "click",
    function(){

        archivoComprobante =
        null;

        fotoCamara.value =
        "";

        fotoGaleria.value =
        "";

        imagenPrevia.src =
        "";

        nombreArchivo.textContent =
        "";

        vistaPrevia.style.display =
        "none";

    }
);


btnGuardar.addEventListener(
    "click",
    async function(){

        limpiarMensaje();

        if(!usuarioActual){

            mostrarMensaje(
                "La sesión no está disponible. Volvé a iniciar sesión.",
                "error"
            );

            return;

        }

        const trabajoId =
        trabajo.value;

        const opcionTrabajo =
        trabajo.options[
            trabajo.selectedIndex
        ];

        const trabajoDescripcion =
        opcionTrabajo?.dataset?.descripcion ||
        opcionTrabajo?.textContent ||
        "";

        const clienteId =
        opcionTrabajo?.dataset?.clienteId ||
        "";

        const categoriaValor =
        categoria.value;

        const descripcionValor =
        descripcion.value.trim();

        const importeValor =
        Number(
            importe.value
        );

        const proveedorValor =
        proveedor.value.trim();

        const fechaValor =
        fecha.value;

        if(!trabajoId){

            mostrarMensaje(
                "Seleccioná el trabajo asociado.",
                "error"
            );

            trabajo.focus();
            return;

        }

        if(!fechaValor){

            mostrarMensaje(
                "Seleccioná la fecha del gasto.",
                "error"
            );

            fecha.focus();
            return;

        }

        if(!categoriaValor){

            mostrarMensaje(
                "Seleccioná una categoría.",
                "error"
            );

            categoria.focus();
            return;

        }

        if(!descripcionValor){

            mostrarMensaje(
                "Ingresá una descripción.",
                "error"
            );

            descripcion.focus();
            return;

        }

        if(
            !importeValor ||
            importeValor <= 0
        ){

            mostrarMensaje(
                "Ingresá un importe válido.",
                "error"
            );

            importe.focus();
            return;

        }

        if(!empresaIdActual){

            mostrarMensaje(
                "No se pudo identificar la empresa.",
                "error"
            );

            return;

        }

        btnGuardar.disabled =
        true;

        btnGuardar.textContent =
        "💾 Guardando gasto...";

        try{

            let comprobanteUrl = "";
            let comprobanteStoragePath = "";

            if(archivoComprobante){

                mostrarMensaje(
                    "📤 Subiendo comprobante...",
                    ""
                );

                const nombreSeguro =
                archivoComprobante.name
                .replace(
                    /[^a-zA-Z0-9._-]/g,
                    "_"
                );

                const nombreArchivo =
                Date.now() +
                "_" +
                Math.random()
                .toString(36)
                .substring(2,10) +
                "_" +
                nombreSeguro;

                comprobanteStoragePath =
                "gastos/" +
                empresaIdActual +
                "/" +
                usuarioActual.uid +
                "/" +
                nombreArchivo;

                const referenciaStorage =
                ref(
                    almacenamiento,
                    comprobanteStoragePath
                );

                await uploadBytes(
                    referenciaStorage,
                    archivoComprobante
                );

                comprobanteUrl =
                await getDownloadURL(
                    referenciaStorage
                );

            }

            mostrarMensaje(
                "💾 Guardando gasto...",
                ""
            );

            const datosGasto = {

                empresaId:
                empresaIdActual,

                usuarioId:
                usuarioActual.uid,

                trabajoId:
                trabajoId,

                trabajoDescripcion:
                trabajoDescripcion,

                clienteId:
                clienteId,

                fecha:
                fechaValor,

                categoria:
                categoriaValor,

                descripcion:
                descripcionValor,

                importe:
                importeValor,

                proveedor:
                proveedorValor,

                comprobanteNombre:
                archivoComprobante
                ? archivoComprobante.name
                : "",

                comprobanteUrl:
                comprobanteUrl,

                comprobanteStoragePath:
                comprobanteStoragePath,

                creadoEn:
                serverTimestamp()

            };

            const referenciaGasto =
            await addDoc(
                collection(
                    db,
                    "gastos"
                ),
                datosGasto
            );

            console.log(
                "Gasto guardado:",
                referenciaGasto.id
            );

            mostrarMensaje(
                "✅ Gasto guardado correctamente.",
                "exito"
            );

            descripcion.value =
            "";

            importe.value =
            "";

            proveedor.value =
            "";

            categoria.value =
            "";

            trabajo.value =
            "";

            archivoComprobante =
            null;

            fotoCamara.value =
            "";

            fotoGaleria.value =
            "";

            imagenPrevia.src =
            "";

            nombreArchivo.textContent =
            "";

            vistaPrevia.style.display =
            "none";

            establecerFechaActual();

        }
        catch(error){

            console.error(
                "Error guardando gasto:",
                error
            );

            let texto =
            "No se pudo guardar el gasto.";

            if(
                error.code ===
                "storage/unauthorized"
            ){

                texto =
                "Firebase Storage rechazó el comprobante. Revisá las reglas de Storage.";

            }
            else if(
                error.code ===
                "permission-denied"
            ){

                texto =
                "Firestore rechazó el gasto. Revisá las reglas de Firestore.";

            }
            else if(error.message){

                texto +=
                " " +
                error.message;

            }

            mostrarMensaje(
                texto,
                "error"
            );

        }
        finally{

            btnGuardar.disabled =
            false;

            btnGuardar.textContent =
            "💾 Guardar gasto";

        }

    }
);


btnVolver.addEventListener(
    "click",
    function(){

        window.location.href =
        "index.html";

    }
);

</script>

</body>
</html>
