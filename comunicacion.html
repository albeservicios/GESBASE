<!DOCTYPE html>
<html lang="es">

<head>

<meta charset="UTF-8">

<meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
>

<meta
    name="theme-color"
    content="#111827"
>

<title>Comunicación - GESBASE</title>

<style>

*{
    box-sizing:border-box;
}

body{
    margin:0;
    font-family:
        -apple-system,
        BlinkMacSystemFont,
        "Segoe UI",
        Roboto,
        Arial,
        sans-serif;

    background:#f3f4f6;
    color:#111827;
}

/* =========================
   HEADER
========================= */

header{
    background:#111827;
    color:white;
    padding:14px;
    position:sticky;
    top:0;
    z-index:10;
}

.header{
    max-width:1150px;
    margin:auto;

    display:flex;
    align-items:center;
    gap:12px;
}

.btn-volver{
    border:0;
    background:#374151;
    color:white;

    border-radius:10px;

    padding:10px 13px;

    font-size:18px;

    cursor:pointer;
}

header h1{
    margin:0;
    font-size:19px;
}

header p{
    margin:3px 0 0;

    color:#d1d5db;

    font-size:12px;
}

/* =========================
   CONTENEDOR
========================= */

main{
    max-width:1150px;

    margin:auto;

    padding:14px;
}

/* =========================
   AVISOS
========================= */

.notice{
    display:none;

    padding:11px 13px;

    border-radius:11px;

    margin-bottom:12px;

    font-size:13px;
}

.notice.show{
    display:block;
}

.notice.ok{
    background:#dcfce7;
    color:#166534;
}

.notice.error{
    background:#fee2e2;
    color:#991b1b;
}

.notice.info{
    background:#dbeafe;
    color:#1e40af;
}

/* =========================
   BOTONES SUPERIORES
========================= */

.top-actions{
    display:grid;

    grid-template-columns:
        1fr
        1fr;

    gap:8px;

    margin-bottom:12px;
}

.top-actions button{
    border:0;

    border-radius:11px;

    padding:12px;

    font-weight:750;

    cursor:pointer;
}

.btn-notificaciones{
    background:#111827;
    color:white;
}

.btn-reunion{
    background:#ede9fe;
    color:#5b21b6;
}

/* =========================
   LAYOUT
========================= */

.layout{
    display:grid;

    grid-template-columns:
        320px
        1fr;

    gap:14px;
}

.card{
    background:white;

    border-radius:16px;

    box-shadow:
        0 3px 15px rgba(0,0,0,.06);

    overflow:hidden;
}

/* =========================
   CONTACTOS
========================= */

.sidebar{
    padding:13px;
}

.search{
    width:100%;

    padding:12px;

    border:
        1px solid
        #d1d5db;

    border-radius:11px;

    margin-bottom:10px;

    font-size:14px;

    outline:none;
}

.search:focus{
    border-color:#6b7280;
}

.contact{
    width:100%;

    display:flex;

    gap:10px;

    align-items:center;

    border:0;

    background:white;

    text-align:left;

    padding:11px;

    border-radius:11px;

    cursor:pointer;

    margin-bottom:3px;
}

.contact:hover{
    background:#f3f4f6;
}

.contact.selected{
    background:#e5e7eb;
}

.avatar{
    width:42px;
    height:42px;

    border-radius:50%;

    background:#e5e7eb;

    display:flex;

    align-items:center;
    justify-content:center;

    font-weight:800;

    flex:none;
}

.contact-info{
    min-width:0;

    flex:1;
}

.contact-name{
    font-weight:750;

    font-size:14px;
}

.contact-role{
    font-size:11px;

    color:#6b7280;

    margin-top:2px;

    white-space:nowrap;

    overflow:hidden;

    text-overflow:ellipsis;
}

.empty-list{
    text-align:center;

    color:#6b7280;

    font-size:13px;

    padding:22px 10px;
}

/* =========================
   CHAT
========================= */

.chat{
    min-height:650px;

    display:flex;

    flex-direction:column;
}

/* CABECERA CHAT */

.chat-header{
    display:flex;

    align-items:center;

    gap:10px;

    padding:13px 15px;

    border-bottom:
        1px solid
        #e5e7eb;
}

.chat-info{
    flex:1;
}

.chat-name{
    font-weight:800;
}

.chat-status{
    font-size:12px;

    color:#6b7280;

    margin-top:2px;
}

.call-actions{
    display:flex;

    gap:7px;
}

.call-button{
    width:42px;
    height:42px;

    border:0;

    border-radius:50%;

    background:#f3f4f6;

    font-size:18px;

    cursor:pointer;
}

.call-button:hover{
    background:#e5e7eb;
}

.call-button:disabled{
    opacity:.4;

    cursor:not-allowed;
}

/* MENSAGENS */

.messages{
    flex:1;

    min-height:470px;

    overflow-y:auto;

    padding:15px;

    background:#f9fafb;
}

.chat-start{
    height:100%;

    min-height:440px;

    display:flex;

    align-items:center;

    justify-content:center;

    text-align:center;

    color:#6b7280;

    padding:25px;
}

.message{
    display:flex;

    margin-bottom:8px;
}

.message.me{
    justify-content:flex-end;
}

.bubble{
    max-width:78%;

    background:white;

    border-radius:14px;

    padding:9px 11px;

    box-shadow:
        0 1px 4px rgba(0,0,0,.05);

    font-size:14px;
}

.message.me .bubble{
    background:#111827;

    color:white;
}

.message-time{
    font-size:10px;

    opacity:.65;

    text-align:right;

    margin-top:4px;
}

/* COMPOSITOR */

.composer{
    display:flex;

    gap:8px;

    padding:10px;

    border-top:
        1px solid
        #e5e7eb;
}

.composer input{
    flex:1;

    min-width:0;

    padding:12px;

    border:
        1px solid
        #d1d5db;

    border-radius:12px;

    outline:none;

    font-size:14px;
}

.send-button{
    width:48px;

    border:0;

    border-radius:12px;

    background:#111827;

    color:white;

    font-size:18px;

    cursor:pointer;
}

.send-button:disabled{
    opacity:.4;

    cursor:not-allowed;
}

/* =========================
   RESPONSIVE
========================= */

@media(max-width:760px){

    .layout{
        grid-template-columns:1fr;
    }

    .sidebar{
        max-height:290px;

        overflow-y:auto;
    }

    .chat{
        min-height:600px;
    }

    .messages{
        min-height:420px;
    }

}

</style>

</head>


<body>


<header>

<div class="header">

<button
    class="btn-volver"
    onclick="location.href='index.html'"
>
    ←
</button>

<div>

<h1>
💬 Comunicación
</h1>

<p>
Comunicación interna de tu empresa
</p>

</div>

</div>

</header>


<main>


<div
    id="notice"
    class="notice"
></div>


<!-- =========================
     ACCIONES
========================= -->

<div class="top-actions">

<button
    id="btnNotificaciones"
    class="btn-notificaciones"
>
    🔔 Activar notificaciones
</button>


<button
    id="btnReunion"
    class="btn-reunion"
>
    📹 Nueva reunión
</button>

</div>


<!-- =========================
     SISTEMA
========================= -->

<div class="layout">


<!-- CONTACTOS -->

<section class="card sidebar">

<input
    id="buscar"
    class="search"
    type="search"
    placeholder="🔍 Buscar empleado..."
>


<div id="contactos">

<div class="empty-list">
Cargando empleados...
</div>

</div>

</section>


<!-- CHAT -->

<section class="card chat">


<div class="chat-header">


<div
    id="chatAvatar"
    class="avatar"
>
💬

<div class="chat-info">

<div
    id="chatName"

>
Seleccioná un empleado
</div>


<div
    id="chatStatus"
    class="chat-status"
>
Solo personas de tu empresa
</div>

</div>


<div class="call-actions">


<button
    id="btnAudio"
    class="call-button"
    title="Llamada de audio"
    disabled
>
📞
</button>

>
📹

>

</section>

</div>

</main>



<script type="module">


/* =========================================================
   FIREBASE
========================================================= */

import {
    auth,
    db
}
from "./Js/firebase.js";


import {
    onAuthStateChanged
}
from
"https://www.gstatic.com/firebasejs/12.18.0/firebase-auth.js";


import {
    collection,
    doc,
    getDoc,
    getDocs,
    query,
    where,
    orderBy,
    onSnapshot,
    addDoc,
    setDoc,
    serverTimestamp
}
from
"https://www.gstatic.com/firebasejs/12.18.0/firebase-firestore.js";


/* =========================================================
   FIREBASE MESSAGING
========================================================= */

import {
    getMessaging,
    getToken,
    onMessage
}
from
"https://www.gstatic.com/firebasejs/12.18.0/firebase-messaging.js";


/* =========================================================
   VARIABLES
========================================================= */

let usuarioActual = null;

let empresaId = null;

let empleados = [];

let empleadoSeleccionado = null;

let cancelarMensajes = null;


/* =========================================================
   ELEMENTOS
========================================================= */

const notice =
    document.getElementById("notice");

const contactos =
    document.getElementById("contactos");

const buscar =
    document.getElementById("buscar");

const messages =
    document.getElementById("messages");

const mensajeInput =
    document.getElementById("mensajeInput");

const sendButton =
    document.getElementById("sendButton");

const chatName =
    document.getElementById("chatName");

const chatAvatar =
    document.getElementById("chatAvatar");

const chatStatus =
    document.getElementById("chatStatus");

const btnAudio =
    document.getElementById("btnAudio");

const btnVideo =
    document.getElementById("btnVideo");

const btnNotificaciones =
    document.getElementById("btnNotificaciones");

const btnReunion =
    document.getElementById("btnReunion");


/* =========================================================
   AVISOS
========================================================= */

function mostrarAviso(
    texto,
    tipo="info"
){

    notice.textContent =
        texto;

    notice.className =
        "notice show " + tipo;

    clearTimeout(
        window.gesbaseAviso
    );

    window.gesbaseAviso =
        setTimeout(
            ()=>{
                notice.className =
                    "notice";
            },
            5000
        );

}


/* =========================================================
   ESCAPAR HTML
========================================================= */

function escapar(texto){

    return String(texto)
        .replace(
            /[&<>"']/g,
            caracter => ({
                "&":"&amp;",
                "<":"&lt;",
                ">":"&gt;",
                '"':"&quot;",
                "'":"&#039;"
            }[caracter])
        );

}


/* =========================================================
   NOMBRE
========================================================= */

function nombreEmpleado(
    empleado
){

    const nombre =
        (
            (empleado.nombre || "") +
            " " +
            (empleado.apellido || "")
        ).trim();

    return (
        nombre ||
        empleado.email ||
        "Empleado"
    );

}


/* =========================================================
   INICIALES
========================================================= */

function iniciales(
    empleado
){

    const nombre =
        nombreEmpleado(
            empleado
        );

    if(
        !nombre ||
        nombre === "Empleado"
    ){

        return "👤";

    }

    return nombre
        .split(/\s+/)
        .slice(0,2)
        .map(
            palabra =>
                palabra[0]
                    ?.toUpperCase() || ""
        )
        .join("");

}


/* =========================================================
   OBTENER EMPRESA
========================================================= */

function obtenerEmpresa(
    datos
){

    return (
        datos?.empresaId ||
        datos?.idEmpresa ||
        datos?.empresa ||
        ""
    );

}


/* =========================================================
   CONVERSACIÓN
========================================================= */

function obtenerIdConversacion(
    uid1,
    uid2
){

    return [
        uid1,
        uid2
    ]
    .sort()
    .join("_");

}


/* =========================================================
   CARGAR EMPRESA
========================================================= */

async function cargarEmpresa(
    uid
){

    const referencia =
        doc(
            db,
            "usuarios",
            uid
        );

    const snapshot =
        await getDoc(
            referencia
        );


    if(
        !snapshot.exists()
    ){

        throw new Error(
            "No se encontró tu usuario en GESBASE."
        );

    }


    const datos =
        snapshot.data();


    empresaId =
        obtenerEmpresa(
            datos
        );


    /*
       Si el usuario no tiene empresaId,
       buscamos la empresa cuyo propietario
       sea el usuario.
    */

    if(!empresaId){

        const consulta =
            query(
                collection(
                    db,
                    "empresas"
                ),
                where(
                    "propietarioUid",
                    "==",
                    uid
                )
            );


        const resultado =
            await getDocs(
                consulta
            );


        if(
            !resultado.empty
        ){

            empresaId =
                resultado.docs[0].id;

        }

    }


    if(!empresaId){

        throw new Error(
            "No se pudo determinar la empresa."
        );

    }


    usuarioActual = {

        uid,

        ...datos

    };

}


/* =========================================================
   CARGAR EMPLEADOS
========================================================= */

async function cargarEmpleados(){

    const consulta =
        query(
            collection(
                db,
                "empleados"
            ),
            where(
                "empresaId",
                "==",
                empresaId
            )
        );


    const resultado =
        await getDocs(
            consulta
        );


    empleados =
        resultado.docs
        .map(
            documento => ({
                id:
                    documento.id,

                ...documento.data()
            })
        )
        .filter(
            empleado => {

                /*
                   Solo empleados de la empresa
                   que ya tienen acceso a GESBASE.
                */

                if(
                    !empleado.authUid
                ){

                    return false;

                }


                /*
                   No mostramos al propio usuario.
                */

                if(
                    empleado.authUid ===
                    usuarioActual.uid
                ){

                    return false;

                }


                /*
                   No mostramos empleados dados de baja.
                */

                const estado =
                    String(
                        empleado.estado ||
                        "activo"
                    ).toLowerCase();


                if(
                    estado ===
                    "inactivo"
                ){

                    return false;

                }


                return true;

            }
        );


    mostrarEmpleados();

}


/* =========================================================
   MOSTRAR EMPLEADOS
========================================================= */

function mostrarEmpleados(){

    const termino =
        buscar.value
            .toLowerCase()
            .trim();


    const lista =
        empleados.filter(
            empleado => {

                const nombre =
                    nombreEmpleado(
                        empleado
                    )
                    .toLowerCase();


                const email =
                    String(
                        empleado.email || ""
                    )
                    .toLowerCase();


                return (
                    nombre.includes(
                        termino
                    ) ||
                    email.includes(
                        termino
                    )
                );

            }
        );


    if(!lista.length){

        contactos.innerHTML = `

            <div class="empty-list">

                No hay empleados
                disponibles.

            </div>

        `;

        return;

    }


    contactos.innerHTML =
        lista
        .map(
            empleado => `

                <button
                    class="contact ${
                        empleadoSeleccionado?.id ===
                        empleado.id
                            ? "selected"
                            : ""
                    }"
                    data-id="${empleado.id}"
                >

                    <div class="avatar">

                        ${iniciales(
                            empleado
                        )}

                    </div>


                    <div class="contact-info">

                        <div
                            class="contact-name"
                        >

                            ${escapar(
                                nombreEmpleado(
                                    empleado
                                )
                            )}

                        </div>


                        <div
                            class="contact-role"
                        >

                            ${escapar(
                                empleado.puesto ||
                                empleado.cargo ||
                                "Empleado"
                            )}

                        </div>

                    </div>

                </button>

            `
        )
        .join("");


    document
        .querySelectorAll(".contact")
        .forEach(
            boton => {

                boton.onclick =
                    () => {

                        seleccionarEmpleado(
                            boton.dataset.id
                        );

                    };

            }
        );

}


/* =========================================================
   SELECCIONAR EMPLEADO
========================================================= */

async function seleccionarEmpleado(
    id
){

    empleadoSeleccionado =
        empleados.find(
            empleado =>
                empleado.id === id
        );


    if(
        !empleadoSeleccionado
    ){

        return;

    }


    chatAvatar.textContent =
        iniciales(
            empleadoSeleccionado
        );


    chatName.textContent =
        nombreEmpleado(
            empleadoSeleccionado
        );


    chatStatus.textContent =
        "Comunicación privada · misma empresa";


    mensajeInput.disabled =
        false;

    sendButton.disabled =
        false;

    btnAudio.disabled =
        false;

    btnVideo.disabled =
        false;


    mostrarEmpleados();


    cargarMensajes();

}


/* =========================================================
   CARGAR MENSAJES
========================================================= */

function cargarMensajes(){

    if(
        cancelarMensajes
    ){

        cancelarMensajes();

    }


    messages.innerHTML = `

        <div class="chat-start">

            Cargando mensajes...

        </div>

    `;


    const conversacionId =
        obtenerIdConversacion(
            usuarioActual.uid,
            empleadoSeleccionado.authUid
        );


    const consulta =
        query(
            collection(
                db,
                "conversaciones",
                conversacionId,
                "mensajes"
            ),
            orderBy(
                "createdAt",
                "asc"
            )
        );


    cancelarMensajes =
        onSnapshot(
            consulta,
            snapshot => {

                messages.innerHTML = "";


                if(
                    snapshot.empty
                ){

                    messages.innerHTML = `

                        <div
                            class="chat-start"
                        >

                            Todavía no hay
                            mensajes.

                        </div>

                    `;

                    return;

                }


                snapshot.forEach(
                    documento => {

                        const mensaje =
                            documento.data();


                        const soyYo =
                            mensaje.senderUid ===
                            usuarioActual.uid;


                        const contenedor =
                            document.createElement(
                                "div"
                            );


                        contenedor.className =
                            "message " +
                            (
                                soyYo
                                    ? "me"
                                    : ""
                            );


                        const burbuja =
                            document.createElement(
                                "div"
                            );


                        burbuja.className =
                            "bubble";


                        const fecha =
                            mensaje.createdAt?.toDate
                                ? mensaje.createdAt.toDate()
                                : new Date();


                        burbuja.innerHTML = `

                            ${escapar(
                                mensaje.text || ""
                            )}

                            <div
                                class="message-time"
                            >

                                ${fecha.toLocaleTimeString(
                                    [],
                                    {
                                        hour:
                                            "2-digit",
                                        minute:
                                            "2-digit"
                                    }
                                )}

                            </div>

                        `;


                        contenedor.appendChild(
                            burbuja
                        );


                        messages.appendChild(
                            contenedor
                        );

                    }
                );


                messages.scrollTop =
                    messages.scrollHeight;

            },

            error => {

                console.error(
                    error
                );

                mostrarAviso(
                    "No se pudieron cargar los mensajes.",
                    "error"
                );

            }

        );

}


/* =========================================================
   ENVIAR MENSAJE
========================================================= */

document
    .getElementById("composer")
    .addEventListener(
        "submit",
        async evento => {

            evento.preventDefault();


            const texto =
                mensajeInput.value.trim();


            if(
                !texto ||
                !empleadoSeleccionado
            ){

                return;

            }


            mensajeInput.value =
                "";


            const conversacionId =
                obtenerIdConversacion(
                    usuarioActual.uid,
                    empleadoSeleccionado.authUid
                );


            try{

                /*
                   Creamos/actualizamos
                   la conversación.
                */

                await setDoc(
                    doc(
                        db,
                        "conversaciones",
                        conversacionId
                    ),
                    {

                        empresaId,

                        participants: [
                            usuarioActual.uid,
                            empleadoSeleccionado.authUid
                        ],

                        lastMessage:
                            texto,

                        lastSenderUid:
                            usuarioActual.uid,

                        updatedAt:
                            serverTimestamp()

                    },
                    {
                        merge:true
                    }
                );


                /*
                   Guardamos el mensaje.
                */

                await addDoc(
                    collection(
                        db,
                        "conversaciones",
                        conversacionId,
                        "mensajes"
                    ),
                    {

                        empresaId,

                        text:
                            texto,

                        senderUid:
                            usuarioActual.uid,

                        senderName:
                            usuarioActual.nombre ||
                            usuarioActual.email ||
                            "Empleado",

                        receiverUid:
                            empleadoSeleccionado.authUid,

                        type:
                            "text",

                        createdAt:
                            serverTimestamp()

                    }
                );


            }
            catch(error){

                console.error(
                    error
                );

                mostrarAviso(
                    "No se pudo enviar el mensaje: " +
                    error.message,
                    "error"
                );

            }

        }
    );


/* =========================================================
   NOTIFICACIONES
========================================================= */

async function activarNotificaciones(){

    try{

        if(
            !("Notification" in window)
        ){

            mostrarAviso(
                "Este navegador no admite notificaciones web.",
                "error"
            );

            return;

        }


        const permiso =
            await Notification.requestPermission();


        if(
            permiso !== "granted"
        ){

            mostrarAviso(
                "Tenés que permitir las notificaciones.",
                "error"
            );

            return;

        }


        if(
            !("serviceWorker" in navigator)
        ){

            mostrarAviso(
                "Este navegador no admite Service Worker.",
                "error"
            );

            return;

        }


        /*
           Registramos el Service Worker.
        */

        const registro =
            await navigator.serviceWorker.register(
                "./firebase-messaging-sw.js"
            );


        const messaging =
            getMessaging();


        /*
           IMPORTANTE:
           Acá tenés que pegar la clave
           VAPID de Firebase.
        */

        const vapidKey =
            "PEGAR_AQUI_LA_CLAVE_VAPID_DE_FIREBASE";


        if(
            vapidKey.startsWith(
                "PEGAR_"
            )
        ){

            mostrarAviso(
                "Falta colocar la clave VAPID de Firebase.",
                "error"
            );

            return;

        }


        const token =
            await getToken(
                messaging,
                {

                    vapidKey,

                    serviceWorkerRegistration:
                        registro

                }
            );


        if(!token){

            mostrarAviso(
                "No se pudo obtener el token del dispositivo.",
                "error"
            );

            return;

        }


        /*
           Guardamos el token asociado
           al usuario y a la empresa.
        */

        await setDoc(
            doc(
                db,
                "tokensNotificaciones",
                usuarioActual.uid
            ),
            {

                uid:
                    usuarioActual.uid,

                empresaId,

                token,

                platform:
                    "web",

                updatedAt:
                    serverTimestamp()

            },
            {
                merge:true
            }
        );


        /*
           Mensaje recibido con GESBASE
           abierto/en primer plano.
        */

        onMessage(
            messaging,
            payload => {

                const titulo =
                    payload.notification?.title ||
                    "GESBASE";


                const cuerpo =
                    payload.notification?.body ||
                    "Tenés una nueva notificación";


                /*
                   Sonido en primer plano.
                */

                try{

                    const sonido =
                        new Audio(
                            "./sonidos/mensaje.mp3"
                        );

                    sonido.play()
                        .catch(
                            () => {}
                        );

                }
                catch(error){

                    console.log(
                        error
                    );

                }


                /*
                   Si la página no está visible,
                   mostramos notificación.
                */

                if(
                    document.visibilityState !==
                    "visible"
                ){

                    new Notification(
                        titulo,
                        {
                            body:cuerpo
                        }
                    );

                }

            }
        );


        btnNotificaciones.textContent =
            "🔔 Notificaciones activadas";


        mostrarAviso(
            "Las notificaciones quedaron activadas en este dispositivo.",
            "ok"
        );

    }
    catch(error){

        console.error(
            error
        );

        mostrarAviso(
            "Error al activar notificaciones: " +
            error.message,
            "error"
        );

    }

}

/* =========================================================
   CREAR SALA DE LLAMADA
========================================================= */

async function iniciarLlamada(
    tipo
){

    if(
        !empleadoSeleccionado
    ){

        return;

    }


    try{

        const salaId =
            crypto.randomUUID();


        /*
           La sala pertenece a la empresa.
        */

        await setDoc(
            doc(
                db,
                "salas",
                salaId
            ),
            {

                empresaId,

                type:
                    tipo,

                createdBy:
                    usuarioActual.uid,

                createdByName:
                    usuarioActual.nombre ||
                    usuarioActual.email ||
                    "Empleado",

                participants: [

                    usuarioActual.uid,

                    empleadoSeleccionado.authUid

                ],

                status:
                    "ringing",

                createdAt:
                    serverTimestamp()

            }
        );


        /*
           Abrimos la pantalla de llamada.
        */

        if(
            tipo === "video"
        ){

            location.href =
                "videollamada.html?sala=" +
                encodeURIComponent(
                    salaId
                );

        }
        else{

            location.href =
                "llamada.html?sala=" +
                encodeURIComponent(
                    salaId
                );

        }

    }
    catch(error){

        console.error(
            error
        );

        mostrarAviso(
            "No se pudo iniciar la llamada: " +
            error.message,
            "error"
        );

    }

}

    async usuario => {

        if(!usuario){

            location.href =
                "login.html";

            return;

        }


        try{

            await cargarEmpresa(
                usuario.uid
            );


            await cargarEmpleados();

        }
        catch(error){

            console.error(
                error
            );

            mostrarAviso(
                error.message,
                "error"
            );

        }

    }
);
