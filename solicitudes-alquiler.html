<body>


<header>

<p>

</option>

<!-- ===================================================== -->
<!-- FIREBASE -->
<!-- ===================================================== -->

<script type="module">

import {
    auth,
    db
} from "./Js/firebase.js";

import {
    onAuthStateChanged
} from
"https://www.gstatic.com/firebasejs/12.18.0/firebase-auth.js";

import {
    collection,
    query,
    where,
    getDocs,
    getDoc,
    doc,
    addDoc,
    updateDoc,
    serverTimestamp,
    orderBy
} from
"https://www.gstatic.com/firebasejs/12.18.0/firebase-firestore.js";


let usuarioActual =
    null;

let empresaActual =
    null;

let solicitudes =
    [];

let notificaciones =
    [];


// ========================================================
// AUTENTICACIÓN
// ========================================================

onAuthStateChanged(
    auth,
    async usuario => {

        if (!usuario) {

            window.location.href =
                "index.html";

            return;

        }

        usuarioActual =
            usuario;

        await cargarEmpresa();

        if (!empresaActual) {

            mostrarError(
                "No se pudo determinar la empresa."
            );

            return;

        }

        await cargarSolicitudes();

    }
);


// ========================================================
// EMPRESA
// ========================================================

async function cargarEmpresa() {

    try {

        const usuarioRef =
            doc(
                db,
                "usuarios",
                usuarioActual.uid
            );

        const usuarioSnap =
            await getDoc(
                usuarioRef
            );

        if (
            !usuarioSnap.exists()
        ) {

            return;

        }

        const datos =
            usuarioSnap.data() || {};


        let empresaId =
            datos.empresaId ||
            datos.idEmpresa ||
            datos.empresa ||
            "";


        if (!empresaId) {

            const q =
                query(
                    collection(
                        db,
                        "empresas"
                    ),
                    where(
                        "propietarioUid",
                        "==",
                        usuarioActual.uid
                    )
                );

            const snap =
                await getDocs(q);

            if (
                !snap.empty
            ) {

                empresaId =
                    snap.docs[0].id;

            }

        }


        if (!empresaId) {

            return;

        }


        const empresaRef =
            doc(
                db,
                "empresas",
                empresaId
            );

        const empresaSnap =
            await getDoc(
                empresaRef
            );

        if (
            empresaSnap.exists()
        ) {

            empresaActual = {

                id:
                    empresaId,

                ...empresaSnap.data()

            };

        }

    } catch (error) {

        console.error(
            "Error cargando empresa:",
            error
        );

    }

}


// ========================================================
// CARGAR SOLICITUDES
// ========================================================

window.cargarSolicitudes =
async function cargarSolicitudes() {

    const contenedor =
        document.getElementById(
            "listaSolicitudes"
        );

    contenedor.innerHTML =
        `
        <div class="loading">
            Cargando solicitudes...
        </div>
        `;


    try {

        const filtro =
            document.getElementById(
                "filtroEstado"
            ).value;


        let q;


        if (
            filtro === "todas"
        ) {

            q =
                query(
                    collection(
                        db,
                        "solicitudesAlquiler"
                    ),
                    where(
                        "empresaId",
                        "==",
                        empresaActual.id
                    )
                );

        } else {

            q =
                query(
                    collection(
                        db,
                        "solicitudesAlquiler"
                    ),
                    where(
                        "empresaId",
                        "==",
                        empresaActual.id
                    ),
                    where(
                        "estado",
                        "==",
                        filtro
                    )
                );

        }


        const snap =
            await getDocs(q);


        solicitudes =
            snap.docs.map(
                d => ({

                    id:
                        d.id,

                    ...d.data()

                })
            );


        solicitudes.sort(
            (a,b) => {

                const fechaA =
                    obtenerFecha(
                        a.creadoEn
                    );

                const fechaB =
                    obtenerFecha(
                        b.creadoEn
                    );

                return (
                    fechaB -
                    fechaA
                );

            }
        );


        await cargarNotificaciones();


        renderSolicitudes();


    } catch (error) {

        console.error(
            error
        );

        contenedor.innerHTML =
            `
            <div class="card">
                ❌ Error cargando solicitudes.
                <br><br>
                ${escapar(
                    error.message
                )}
            </div>
            `;

    }

};


// ========================================================
// CARGAR NOTIFICACIONES
// ========================================================

async function cargarNotificaciones() {

    try {

        const q =
            query(
                collection(
                    db,
                    "notificacionesAlquiler"
                ),
                where(
                    "empresaId",
                    "==",
                    empresaActual.id
                )
            );


        const snap =
            await getDocs(q);


        notificaciones =
            snap.docs.map(
                d => ({

                    id:
                        d.id,

                    ...d.data()

                })
            );


    } catch (error) {

        console.warn(
            "No se pudieron cargar notificaciones:",
            error
        );

        notificaciones =
            [];

    }

}


// ========================================================
// RENDER
// ========================================================

function renderSolicitudes() {

    const contenedor =
        document.getElementById(
            "listaSolicitudes"
        );


    document.getElementById(
        "contador"
    ).textContent =
        `${solicitudes.length} solicitud(es)`;


    if (
        !solicitudes.length
    ) {

        contenedor.innerHTML =
            `
            <div class="card empty">
                No hay solicitudes para mostrar.
            </div>
            `;

        return;

    }


    contenedor.innerHTML =
        solicitudes
            .map(
                solicitud =>
                    renderSolicitud(
                        solicitud
                    )
            )
            .join("");

}


// ========================================================
// RENDER SOLICITUD
// ========================================================

function renderSolicitud(
    solicitud
) {

    const nombre =
        `${solicitud.nombre || ""} ${solicitud.apellido || ""}`
            .trim() ||
        "Cliente sin nombre";


    const estado =
        solicitud.estado ||
        "pendiente";


    const fecha =
        formatearFecha(
            solicitud.creadoEn
        );


    const notificacion =
        obtenerNotificacion(
            solicitud.id
        );


    let whatsappButton =
        "";


    if (
        estado === "aprobada"
    ) {

        const telefono =
            solicitud.telefono ||
            "";


        if (telefono) {

            whatsappButton =
                `
                <button
                    class="btn btn-whatsapp"
                    onclick="prepararWhatsApp('${solicitud.id}')"
                >
                    💬 WhatsApp
                </button>
                `;

        }

    }


    return `

    <div class="card">

        <div class="card-header">

            <div>

                <h2>
                    ${escapar(nombre)}
                </h2>

                <p>
                    Solicitud:
                    <strong>
                        ${escapar(solicitud.id)}
                    </strong>
                </p>

                <p>
                    ${escapar(fecha)}
                </p>

            </div>

            <span
                class="status status-${escapar(estado)}"
            >
                ${escapar(
                    textoEstado(
                        estado
                    )
                )}
            </span>

        </div>


        <div class="info-grid">

            <div class="info">

                <strong>
                    Teléfono
                </strong>

                ${escapar(
                    solicitud.telefono ||
                    "No informado"
                )}

            </div>


            <div class="info">

                <strong>
                    Email
                </strong>

                ${escapar(
                    solicitud.email ||
                    "No informado"
                )}

            </div>


            <div class="info">

                <strong>
                    Propiedad
                </strong>

                ${escapar(
                    solicitud.propiedadNombre ||
                    solicitud.propiedadId ||
                    "No especificada"
                )}

            </div>


            <div class="info">

                <strong>
                    Huéspedes
                </strong>

                ${escapar(
                    solicitud.huespedes ||
                    "No informado"
                )}

            </div>


            <div class="info">

                <strong>
                    Entrada
                </strong>

                ${escapar(
                    solicitud.fechaEntrada ||
                    "-"
                )}

            </div>


            <div class="info">

                <strong>
                    Salida
                </strong>

                ${escapar(
                    solicitud.fechaSalida ||
                    "-"
                )}

            </div>

        </div>


        ${
            solicitud.mensaje
                ?
                `
                <div class="info" style="margin-top:12px;">

                    <strong>
                        Mensaje del cliente
                    </strong>

                    ${escapar(
                        solicitud.mensaje
                    )}

                </div>
                `
                :
                ""
        }


        ${
            notificacion
                ?
                renderEstadoNotificacion(
                    notificacion
                )
                :
                ""
        }


        <div class="actions">

            <button
                class="btn btn-primary"
                onclick="verSolicitud('${solicitud.id}')"
            >
                👁 Ver
            </button>


            ${
                estado === "pendiente"
                    ?
                    `
                    <button
                        class="btn btn-success"
                        onclick="aprobarSolicitud('${solicitud.id}')"
                    >
                        ✅ Aprobar
                    </button>

                    <button
                        class="btn btn-danger"
                        onclick="rechazarSolicitud('${solicitud.id}')"
                    >
                        ❌ Rechazar
                    </button>
                    `
                    :
                    ""
            }


            ${
                whatsappButton
            }

        </div>

    </div>

    `;

}


// ========================================================
// ESTADO NOTIFICACIÓN
// ========================================================

function renderEstadoNotificacion(
    notificacion
) {

    const whatsapp =
        notificacion.whatsapp ||
        {};


    const estado =
        whatsapp.estado ||
        "pendiente";


    return `

    <div class="notification-box">

        <div class="notification-title">
            📲 Notificación al cliente
        </div>

        <div class="notification-row">

            <span>
                WhatsApp
            </span>

            <strong>
                ${escapar(
                    textoEstadoNotificacion(
                        estado
                    )
                )}
            </strong>

        </div>


        ${
            whatsapp.enviadoEn
                ?
                `
                <div class="notification-row">

                    <span>
                        Fecha de envío
                    </span>

                    <span>
                        ${escapar(
                            formatearFecha(
                                whatsapp.enviadoEn
                            )
                        )}
                    </span>

                </div>
                `
                :
                ""
        }


        ${
            whatsapp.enviadoPor
                ?
                `
                <div class="notification-row">

                    <span>
                        Enviado por
                    </span>

                    <span>
                        ${escapar(
                            whatsapp.enviadoPor
                        )}
                    </span>

                </div>
                `
                :
                ""
        }


        ${
            whatsapp.error
                ?
                `
                <div class="warning">

                    ⚠️
                    ${escapar(
                        whatsapp.error
                    )}

                </div>
                `
                :
                ""
        }

    </div>

    `;

}


// ========================================================
// APROBAR
// ========================================================

window.aprobarSolicitud =
async function aprobarSolicitud(
    id
) {

    const solicitud =
        solicitudes.find(
            item =>
                item.id === id
        );


    if (!solicitud) {
        return;
    }


    const confirmar =
        confirm(
            `¿Aprobar la solicitud de ${solicitud.nombre || ""} ${solicitud.apellido || ""}?`
        );


    if (!confirmar) {
        return;
    }


    try {

        const solicitudRef =
            doc(
                db,
                "solicitudesAlquiler",
                id
            );


        await updateDoc(
            solicitudRef,
            {

                estado:
                    "aprobada",

                fechaAprobacion:
                    serverTimestamp(),

                actualizadoEn:
                    serverTimestamp()

            }
        );


        // ====================================================
        // CREAR REGISTRO DE NOTIFICACIÓN
        // ====================================================

        const existente =
            obtenerNotificacion(
                id
            );


        if (!existente) {

            await addDoc(
                collection(
                    db,
                    "notificacionesAlquiler"
                ),
                {

                    empresaId:
                        empresaActual.id,

                    solicitudId:
                        id,

                    tipo:
                        "solicitud_aprobada",

                    destinatario: {

                        nombre:
                            `${solicitud.nombre || ""} ${solicitud.apellido || ""}`
                                .trim(),

                        telefono:
                            solicitud.telefono ||
                            "",

                        email:
                            solicitud.email ||
                            ""

                    },

                    whatsapp: {

                        estado:
                            "pendiente",

                        intentos:
                            0

                    },

                    creadoEn:
                        serverTimestamp(),

                    creadoPor:
                        usuarioActual.uid

                }
            );

        }


        alert(
            "✅ Solicitud aprobada correctamente."
        );


        await cargarSolicitudes();


        // Abrir directamente el modal de WhatsApp
        prepararWhatsApp(
            id
        );


    } catch (error) {

        console.error(
            error
        );

        alert(
            "❌ No se pudo aprobar la solicitud:\n" +
            error.message
        );

    }

};


// ========================================================
// RECHAZAR
// ========================================================

window.rechazarSolicitud =
async function rechazarSolicitud(
    id
) {

    const solicitud =
        solicitudes.find(
            item =>
                item.id === id
        );


    if (!solicitud) {
        return;
    }


    const motivo =
        prompt(
            "Motivo del rechazo:"
        );


    if (
        motivo === null
    ) {

        return;

    }


    try {

        await updateDoc(

            doc(
                db,
                "solicitudesAlquiler",
                id
            ),

            {

                estado:
                    "rechazada",

                motivoRechazo:
                    motivo,

                fechaRechazo:
                    serverTimestamp(),

                actualizadoEn:
                    serverTimestamp()

            }

        );


        alert(
            "Solicitud rechazada."
        );


        await cargarSolicitudes();


    } catch (error) {

        console.error(
            error
        );

        alert(
            "❌ No se pudo rechazar:\n" +
            error.message
        );

    }

};


// ========================================================
// PREPARAR WHATSAPP
// ========================================================

window.prepararWhatsApp =
function prepararWhatsApp(
    id
) {

    const solicitud =
        solicitudes.find(
            item =>
                item.id === id
        );


    if (!solicitud) {

        alert(
            "Solicitud no encontrada."
        );

        return;

    }


    if (
        solicitud.estado !==
        "aprobada"
    ) {

        alert(
            "La solicitud debe estar aprobada."

        return;

    }


    const telefono =
        normalizarTelefonoWhatsApp(

        alert(
            "Esta solicitud no tiene un número de teléfono válido."
        );

        return;

    }


    const nombre =
        `${solicitud.nombre || ""} ${solicitud.apellido || ""}`

    const empresaNombre =
        empresaActual.nombre ||
        empresaActual.razonSocial ||
        empresaActual.razon_social ||
        "la empresa";


    const mensaje =
        `Hola ${nombre}, te contactamos desde ${empresaNombre}. 😊

Tu solicitud de alquiler fue aprobada.

🏠 Propiedad: ${solicitud.propiedadNombre || solicitud.propiedadId || "A confirmar"}

📅 Entrada: ${solicitud.fechaEntrada || "A confirmar"}

📅 Salida: ${solicitud.fechaSalida || "A confirmar"}

👥 Huéspedes: ${solicitud.huespedes || "A confirmar"}

Tu solicitud quedó aprobada y podemos continuar con los detalles de la reserva.

Saludos.`;


    const modal =
        document.getElementById(
            "modalSolicitud"
        );


    const detalle =
        document.getElementById(
            "detalleSolicitud"
        );


    detalle.innerHTML = `

            <br>

            ${escapar(mensaje)}
        </div>


        <div class="warning">

            ⚠️ Al tocar
            <strong>
                Abrir WhatsApp
            </strong>,
            GESBASE registrará el intento

            <br><br>

            Tendrás que tocar
            <strong>
                Enviar
            </strong>
            dentro de WhatsApp.

        </div>

};

// ========================================================

window.enviarWhatsApp =
async function enviarWhatsApp(
    id
) {

    const solicitud =
        solicitudes.find(
            item =>
                item.id === id
        );


    if (!solicitud) {
        return;
    }


    const telefono =
        normalizarTelefonoWhatsApp(
            solicitud.telefono
        );


    if (!telefono) {

        alert(
            "Número de teléfono inválido."
        );

        return;

    }


    const nombre =
        `${solicitud.nombre || ""} ${solicitud.apellido || ""}`
            .trim() ||
        "cliente";


    const empresaNombre =
        empresaActual.nombre ||
        empresaActual.razonSocial ||
        empresaActual.razon_social ||
        "la empresa";


    const mensaje =
        `Hola ${nombre}, te contactamos desde ${empresaNombre}. 😊

Tu solicitud de alquiler fue aprobada.

🏠 Propiedad: ${solicitud.propiedadNombre || solicitud.propiedadId || "A confirmar"}

📅 Entrada: ${solicitud.fechaEntrada || "A confirmar"}

📅 Salida: ${solicitud.fechaSalida || "A confirmar"}

👥 Huéspedes: ${solicitud.huespedes || "A confirmar"}

Tu solicitud quedó aprobada y podemos continuar con los detalles de la reserva.

Saludos.`;


    try {

        // =================================================
        // BUSCAR NOTIFICACIÓN EXISTENTE
        // =================================================

        let notificacion =
            obtenerNotificacion(
                id
            );


        let notificacionId;


        // =================================================
        // CREAR SI NO EXISTE
        // =================================================

        if (!notificacion) {

            const nueva =
                await addDoc(
                    collection(
                        db,
                        "notificacionesAlquiler"
                    ),
                    {

                        empresaId:
                            empresaActual.id,

                        solicitudId:
                            id,

                        tipo:
                            "solicitud_aprobada",

                        destinatario: {

                            nombre:
                                nombre,

                            telefono:
                                solicitud.telefono ||
                                "",

                            email:
                                solicitud.email ||
                                ""

                        },

                        whatsapp: {

                            estado:
                                "pendiente",

                            intentos:
                                0

                        },

                        creadoEn:
                            serverTimestamp(),

                        creadoPor:
                            usuarioActual.uid

                    }
                );


            notificacionId =
                nueva.id;

        } else {

            notificacionId =
                notificacion.id;

        }


        // =================================================
        // REGISTRAR INTENTO
        // =================================================

        await updateDoc(

            doc(
                db,
                "notificacionesAlquiler",
                notificacionId
            ),

            {

                "whatsapp.estado":
                    "enviando",

                "whatsapp.intentos":
                    Number(
                        notificacion?.whatsapp?.intentos ||
                        0
                    ) + 1,

                "whatsapp.ultimoIntentoEn":
                    serverTimestamp(),

                "whatsapp.enviadoPor":
                    usuarioActual.email ||
                    usuarioActual.uid,

                "whatsapp.telefono":
                    telefono,

                "whatsapp.mensaje":
                    mensaje,

                actualizadoEn:
                    serverTimestamp()

            }

        );


        // =================================================
        // ABRIR WHATSAPP
        // =================================================

        const url =
            `https://wa.me/${telefono}?text=${encodeURIComponent(mensaje)}`;


        window.open(
            url,
            "_blank"
        );


        // =================================================
        // REGISTRAR COMO ABIERTO
        // =================================================
        //
        // Esto significa que GESBASE abrió WhatsApp.
        // No significa que WhatsApp confirmó el envío.
        //
        // =================================================

        await updateDoc(

            doc(
                db,
                "notificacionesAlquiler",
                notificacionId
            ),

            {

                "whatsapp.estado":
                    "abierto",

                "whatsapp.abiertoEn":
                    serverTimestamp(),

                actualizadoEn:
                    serverTimestamp()

            }

        );


        cerrarModal();


        alert(
            "💬 WhatsApp fue abierto con el mensaje preparado."
        );


        await cargarSolicitudes();


    } catch (error) {

        console.error(
            "Error WhatsApp:",
            error
        );


        alert(
            "❌ No se pudo registrar el envío:\n" +
            error.message
        );

    }

};

// ========================================================
// OBTENER NOTIFICACIÓN
// ========================================================

function obtenerNotificacion(
    solicitudId
) {

    return (
        notificaciones.find(
            item =>
                item.solicitudId ===
                solicitudId
        ) ||
        null
    );

}


// ========================================================
// NORMALIZAR WHATSAPP
// ========================================================

function normalizarTelefonoWhatsApp(
    telefono
) {

    if (!telefono) {
        return "";
    }


    let numero =
        String(
            telefono
        )
            .trim()
            .replace(
                /[\s().-]/g,
                ""
            );


    if (!numero) {
        return "";
    }


    if (
        numero.startsWith("+")
    ) {

        numero =
            numero.substring(1);

    }


    // Argentina
    if (
        numero.startsWith("0")
    ) {

        numero =
            numero.substring(1);

    }


    if (
        !numero.startsWith("54")
    ) {

        numero =
            "54" +
            numero;

    }


    return numero;

}


// ========================================================
// FECHAS
// ========================================================

function obtenerFecha(
    timestamp
) {

    if (
        !timestamp
    ) {

        return 0;

    }


    if (
        typeof timestamp.toDate ===
        "function"
    ) {

        return timestamp
            .toDate()
            .getTime();

    }


    return 0;

}


function formatearFecha(
    timestamp
) {

    if (
        !timestamp
    ) {

        return "-";

    }


    try {

        const fecha =
            typeof timestamp.toDate ===
            "function"

                ? timestamp.toDate()

                : new Date(timestamp);


        if (
            Number.isNaN(
                fecha.getTime()
            )
        ) {

            return "-";

        }


        return fecha.toLocaleString(
            "es-AR"
        );

    } catch {

        return "-";

    }

}

function textoEstadoNotificacion(

    );

}


// ========================================================
// ESCAPAR HTML
// ========================================================

function escapar(
    valor
) {

    return String(
        valor ?? ""
    )
        .replace(
            /&/g,
            "&amp;"
        )
        .replace(
            /</g,
            "&lt;"
        )
        .replace(
            />/g,
            "&gt;"
        )
        .replace(
            /"/g,
            "&quot;"
        )
        .replace(
            /'/g,
            "&#039;"
        );

}
