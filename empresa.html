<!DOCTYPE html>
<html lang="es">

<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#111827">

<title>Mi empresa - GESBASE</title>

<style>

*{
    box-sizing:border-box;
    margin:0;
    padding:0;
}

body{
    font-family:Arial,sans-serif;
    background:#f3f4f6;
    color:#111827;
    min-height:100vh;
}

.contenedor{
    width:100%;
    max-width:600px;
    min-height:100vh;
    margin:auto;
    background:white;
}

header{
    background:#111827;
    color:white;
    padding:25px 20px;
}

header h1{
    font-size:25px;
}

header p{
    margin-top:6px;
    font-size:14px;
    color:#d1d5db;
}

main{
    padding:20px;
}

.tarjeta{
    background:white;
    border:1px solid #e5e7eb;
    border-radius:14px;
    padding:20px;
    margin-bottom:18px;
}

.titulo{
    font-size:18px;
    font-weight:bold;
    margin-bottom:18px;
}

.campo{
    margin-bottom:17px;
}

label{
    display:block;
    font-size:14px;
    font-weight:bold;
    margin-bottom:7px;
}

input{
    width:100%;
    padding:13px;
    border:1px solid #d1d5db;
    border-radius:9px;
    font-size:16px;
    outline:none;
}

input:focus{
    border-color:#111827;
}

.logo-contenedor{
    text-align:center;
    margin-bottom:20px;
}

.logo-preview{
    width:120px;
    height:120px;
    border:2px dashed #d1d5db;
    border-radius:15px;
    margin:0 auto 12px;
    display:flex;
    align-items:center;
    justify-content:center;
    overflow:hidden;
    background:#f9fafb;
    color:#6b7280;
    font-size:14px;
}

.logo-preview img{
    width:100%;
    height:100%;
    object-fit:contain;
}

input[type="file"]{
    border:none;
    padding:5px 0;
    font-size:14px;
}

.mensaje{
    display:none;
    padding:14px;
    border-radius:10px;
    margin-bottom:18px;
    font-size:14px;
    line-height:1.4;
}

.exito{
    display:block;
    background:#dcfce7;
    color:#166534;
}

.error{
    display:block;
    background:#fee2e2;
    color:#991b1b;
}

.cargando{
    display:block;
    background:#f3f4f6;
    color:#374151;
}

button{
    width:100%;
    padding:15px;
    border:none;
    border-radius:10px;
    font-size:16px;
    font-weight:bold;
    cursor:pointer;
    margin-top:10px;
}

.guardar{
    background:#111827;
    color:white;
}

.guardar:disabled{
    opacity:.6;
    cursor:not-allowed;
}

.volver{
    background:#e5e7eb;
    color:#111827;
}

.nota{
    font-size:12px;
    color:#6b7280;
    margin-top:6px;
    line-height:1.4;
}

</style>

</head>

<body>

<div class="contenedor">

<header>

<h1>⚙️ Mi empresa</h1>

<p>
Configuración de GESBASE
</p>

</header>

<main>

<div
id="mensaje"
class="mensaje cargando"
>
Cargando información de la empresa...
</div>


<div
id="contenido"
style="display:none;"
>


<!-- LOGO -->

<div class="tarjeta">

<div class="titulo">
Logo de la empresa
</div>

<div class="logo-contenedor">

<div
id="logoPreview"
class="logo-preview"
>
Sin logo
</div>

<input
type="file"
id="logo"
accept="image/png,image/jpeg,image/webp"
>

<div class="nota">
Formatos permitidos: JPG, PNG o WEBP.
</div>

</div>

</div>


<!-- DATOS DE EMPRESA -->

<div class="tarjeta">

<div class="titulo">
Datos de la empresa
</div>


<div class="campo">

<label for="nombreEmpresa">
Nombre de empresa
</label>

<input
type="text"
id="nombreEmpresa"
placeholder="Ejemplo: GESBASE Servicios"
>

</div>


<div class="campo">

<label for="razonSocial">
Razón social
</label>

<input
type="text"
id="razonSocial"
placeholder="Ejemplo: Battauz Julián Ezequiel"
>

</div>


<div class="campo">

<label for="cuit">
CUIT
</label>

<input
type="text"
id="cuit"
placeholder="Ejemplo: 20-37470547-5"
>

</div>


<div class="campo">

<label for="telefono">
Teléfono
</label>

<input
type="tel"
id="telefono"
placeholder="Teléfono de la empresa"
>

</div>


<div class="campo">

<label for="email">
Email
</label>

<input
type="email"
id="email"
placeholder="email@empresa.com"
>

</div>


<div class="campo">

<label for="direccion">
Dirección
</label>

<input
type="text"
id="direccion"
placeholder="Dirección de la empresa"
>

</div>


<button
type="button"
class="guardar"
id="btnGuardar"
>
Guardar cambios
</button>

</div>


<button
type="button"
class="volver"
id="btnVolver"
>
Volver al panel
</button>


</div>

</main>

</div>


<script type="module">

// ==========================================
// FIREBASE
// ==========================================

import {
    auth,
    db
} from "./Js/firebase.js";

import {
    onAuthStateChanged
} from "https://www.gstatic.com/firebasejs/12.1.0/firebase-auth.js";

import {
    doc,
    getDoc,
    setDoc
} from "https://www.gstatic.com/firebasejs/12.1.0/firebase-firestore.js";


// ==========================================
// STORAGE
// ==========================================

import {
    getStorage,
    ref,
    uploadBytes,
    getDownloadURL
} from "https://www.gstatic.com/firebasejs/12.1.0/firebase-storage.js";

const storage = getStorage();


// ==========================================
// ELEMENTOS
// ==========================================

const mensaje =
document.getElementById("mensaje");

const contenido =
document.getElementById("contenido");

const nombreEmpresa =
document.getElementById("nombreEmpresa");

const razonSocial =
document.getElementById("razonSocial");

const cuit =
document.getElementById("cuit");

const telefono =
document.getElementById("telefono");

const email =
document.getElementById("email");

const direccion =
document.getElementById("direccion");

const logo =
document.getElementById("logo");

const logoPreview =
document.getElementById("logoPreview");

const btnGuardar =
document.getElementById("btnGuardar");

const btnVolver =
document.getElementById("btnVolver");


let usuarioActual = null;

let empresaRef = null;

let logoActual = "";


// ==========================================
// MENSAJES
// ==========================================

function mostrarMensaje(texto,tipo){

    mensaje.textContent = texto;

    mensaje.className =
        "mensaje " + tipo;

}


// ==========================================
// VISTA PREVIA LOGO
// ==========================================

logo.addEventListener(
"change",
function(){

    const archivo =
        logo.files[0];

    if(!archivo){
        return;
    }

    const lector =
        new FileReader();

    lector.onload =
    function(evento){

        logoPreview.innerHTML = "";

        const imagen =
            document.createElement("img");

        imagen.src =
            evento.target.result;

        logoPreview.appendChild(imagen);

    };

    lector.readAsDataURL(archivo);

});


// ==========================================
// AUTENTICACIÓN
// ==========================================

onAuthStateChanged(
auth,
async function(usuario){

    if(!usuario){

        window.location.replace(
            "login.html"
        );

        return;
    }

    usuarioActual = usuario;


    try{

        empresaRef =
            doc(
                db,
                "empresas",
                usuario.uid
            );


        const documento =
            await getDoc(empresaRef);


        if(documento.exists()){

            const datos =
                documento.data();


            nombreEmpresa.value =
                datos.nombreEmpresa || "";


            razonSocial.value =
                datos.razonSocial || "";


            cuit.value =
                datos.cuit || "";


            telefono.value =
                datos.telefono || "";


            email.value =
                datos.email ||
                usuario.email ||
                "";


            direccion.value =
                datos.direccion || "";


            logoActual =
                datos.logoUrl || "";


            if(logoActual){

                logoPreview.innerHTML = "";

                const imagen =
                    document.createElement("img");

                imagen.src =
                    logoActual;

                imagen.alt =
                    "Logo de la empresa";

                logoPreview.appendChild(imagen);

            }

        }


        mensaje.style.display =
            "none";

        contenido.style.display =
            "block";


    }catch(error){

        console.error(error);

        mostrarMensaje(
            "Error cargando la empresa: " +
            error.message,
            "error"
        );

    }

});


// ==========================================
// GUARDAR
// ==========================================

btnGuardar.addEventListener(
"click",
async function(){

    if(!usuarioActual){
        return;
    }


    const nombre =
        nombreEmpresa.value.trim();

    const razon =
        razonSocial.value.trim();


    if(!nombre){

        mostrarMensaje(
            "Ingresá el nombre de la empresa.",
            "error"
        );

        nombreEmpresa.focus();

        return;
    }


    if(!razon){

        mostrarMensaje(
            "Ingresá la razón social.",
            "error"
        );

        razonSocial.focus();

        return;
    }


    btnGuardar.disabled = true;

    btnGuardar.textContent =
        "Guardando...";


    try{

        let logoUrl = logoActual;


        // ==================================
        // SUBIR LOGO
        // ==================================

        const archivo =
            logo.files[0];


        if(archivo){

            const extension =
                archivo.name
                .split(".")
                .pop()
                .toLowerCase();


            const ruta =
                "empresas/" +
                usuarioActual.uid +
                "/logo." +
                extension;


            const referenciaLogo =
                ref(
                    storage,
                    ruta
                );


            await uploadBytes(
                referenciaLogo,
                archivo
            );


            logoUrl =
                await getDownloadURL(
                    referenciaLogo
                );

        }


        // ==================================
        // GUARDAR EMPRESA
        // ==================================

        await setDoc(
            empresaRef,
            {

                nombreEmpresa:
                    nombre,

                razonSocial:
                    razon,

                cuit:
                    cuit.value.trim(),

                telefono:
                    telefono.value.trim(),

                email:
                    email.value.trim(),

                direccion:
                    direccion.value.trim(),

                logoUrl:
                    logoUrl,

                uid:
                    usuarioActual.uid

            },
            {
                merge:true
            }
        );


        logoActual =
            logoUrl;


        mostrarMensaje(
            "✅ Datos guardados correctamente.",
            "exito"
        );


        btnGuardar.disabled =
            false;

        btnGuardar.textContent =
            "Guardar cambios";


    }catch(error){

        console.error(
            "Error guardando:",
            error
        );


        mostrarMensaje(
            "❌ No se pudo guardar: " +
            error.message,
            "error"
        );


        btnGuardar.disabled =
            false;

        btnGuardar.textContent =
            "Guardar cambios";

    }

});


// ==========================================
// VOLVER
// ==========================================

btnVolver.addEventListener(
"click",
function(){

    window.location.href =
        "index.html";

});

</script>

</body>

</html>
