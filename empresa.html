<!DOCTYPE html>
<html lang="es">

<head>

<meta charset="UTF-8">

<meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
>

<meta
    name="theme-color"
    content="#111827"
>

<title>Mi empresa - GESBASE</title>

<style>

*{
    box-sizing:border-box;
    margin:0;
    padding:0;
}

body{
    font-family:Arial,sans-serif;
    background:#f3f4f6;
    color:#111827;
    min-height:100vh;
}

.contenedor{
    width:100%;
    max-width:600px;
    min-height:100vh;
    margin:auto;
    background:white;
}

header{
    background:#111827;
    color:white;
    padding:25px 20px;
}

header h1{
    font-size:25px;
}

header p{
    margin-top:6px;
    font-size:14px;
    color:#d1d5db;
}

main{
    padding:20px;
}

.tarjeta{
    background:white;
    border:1px solid #e5e7eb;
    border-radius:14px;
    padding:20px;
    margin-bottom:18px;
}

.titulo{
    font-size:18px;
    font-weight:bold;
    margin-bottom:18px;
}

.campo{
    margin-bottom:17px;
}

label{
    display:block;
    font-size:14px;
    font-weight:bold;
    margin-bottom:7px;
}

input{
    width:100%;
    padding:13px;
    border:1px solid #d1d5db;
    border-radius:9px;
    font-size:16px;
    outline:none;
    background:#fff;
}

input:focus{
    border-color:#2563eb;
}

input[type="file"]{
    border:none;
    padding:5px 0;
    font-size:14px;
}

.logo-contenedor{
    text-align:center;
    margin-bottom:10px;
}

.logo-preview{
    width:140px;
    height:140px;
    border:2px dashed #d1d5db;
    border-radius:15px;
    margin:0 auto 14px;
    display:flex;
    align-items:center;
    justify-content:center;
    overflow:hidden;
    background:#f9fafb;
    color:#6b7280;
    font-size:14px;
}

.logo-preview img{
    width:100%;
    height:100%;
    object-fit:contain;
}

.nota{
    font-size:12px;
    color:#6b7280;
    margin-top:6px;
    line-height:1.4;
}

.mensaje{
    display:none;
    padding:14px;
    border-radius:10px;
    margin-bottom:18px;
    font-size:14px;
    line-height:1.5;
}

.mensaje.exito{
    display:block;
    background:#dcfce7;
    color:#166534;
}

.mensaje.error{
    display:block;
    background:#fee2e2;
    color:#991b1b;
}

.mensaje.cargando{
    display:block;
    background:#f3f4f6;
    color:#374151;
}

.info-empresa{
    background:#f9fafb;
    border:1px solid #e5e7eb;
    border-radius:10px;
    padding:12px;
    margin-bottom:18px;
    font-size:13px;
    line-height:1.6;
}

.info-empresa strong{
    color:#111827;
}

button{
    width:100%;
    padding:15px;
    border:none;
    border-radius:10px;
    font-size:16px;
    font-weight:bold;
    cursor:pointer;
    margin-top:10px;
}

button:disabled{
    opacity:.6;
    cursor:not-allowed;
}

.guardar{
    background:#111827;
    color:white;
}

.volver{
    background:#e5e7eb;
    color:#111827;
}

@media(max-width:480px){

    main{
        padding:15px;
    }

    .tarjeta{
        padding:17px;
    }

}

</style>

</head>

<body>


<div class="contenedor">


<header>

<h1>
⚙️ Mi empresa
</h1>

<p>
Configuración de GESBASE
</p>

</header>


<main>


<div
id="mensaje"
class="mensaje cargando"
>
Verificando sesión...
</div>


<div
id="contenido"
style="display:none;"
>


<!-- =====================================
     IDENTIFICACIÓN EMPRESA
===================================== -->

<div class="info-empresa">

<div>
<strong>ID de empresa:</strong>
<span id="empresaIdMostrar">-</span>
</div>

<div>
<strong>Usuario:</strong>
<span id="usuarioMostrar">-</span>
</div>

</div>


<!-- =====================================
     LOGO
===================================== -->

<div class="tarjeta">

<div class="titulo">
Logo de la empresa
</div>


<div class="logo-contenedor">

<div
id="logoPreview"
class="logo-preview"
>
Sin logo
</div>


<input
type="file"
id="logo"
accept="image/png,image/jpeg,image/webp"
>


<div class="nota">

Formatos permitidos:
JPG, PNG o WEBP.

<br>

Tamaño máximo recomendado:
2 MB.

</div>

</div>

</div>


<!-- =====================================
     DATOS EMPRESA
===================================== -->

<div class="tarjeta">

<div class="titulo">
Datos de la empresa
</div>


<div class="campo">

<label for="nombreEmpresa">
Nombre de empresa
</label>

<input
type="text"
id="nombreEmpresa"
placeholder="Ej.: GESBASE Servicios"
autocomplete="organization"
>

</div>


<div class="campo">

<label for="razonSocial">
Razón social
</label>

<input
type="text"
id="razonSocial"
placeholder="Ej.: Battauz Julián Ezequiel"
autocomplete="organization"
>

</div>


<div class="campo">

<label for="cuit">
CUIT
</label>

<input
type="text"
id="cuit"
placeholder="Ej.: 20-00000000-0"
inputmode="numeric"
>

</div>


<div class="campo">

<label for="telefono">
Teléfono
</label>

<input
type="tel"
id="telefono"
placeholder="Teléfono de la empresa"
autocomplete="tel"
>

</div>


<div class="campo">

<label for="email">
Email
</label>

<input
type="email"
id="email"
placeholder="email@empresa.com"
autocomplete="email"
>

</div>


<div class="campo">

<label for="direccion">
Dirección
</label>

<input
type="text"
id="direccion"
placeholder="Dirección de la empresa"
autocomplete="street-address"
>

</div>


<button
type="button"
class="guardar"
id="btnGuardar"
>
💾 Guardar cambios
</button>

</div>


<button
type="button"
class="volver"
id="btnVolver"
>
⬅️ Volver al panel
</button>


</div>

</main>

</div>


<script type="module">


// =====================================================
// FIREBASE
// =====================================================

import {
    auth,
    db
} from "./Js/firebase.js";


import {
    onAuthStateChanged
} from
"https://www.gstatic.com/firebasejs/12.1.0/firebase-auth.js";


import {
    doc,
    getDoc,
    setDoc,
    serverTimestamp
} from
"https://www.gstatic.com/firebasejs/12.1.0/firebase-firestore.js";


import {
    getStorage,
    ref,
    uploadBytes,
    getDownloadURL
} from
"https://www.gstatic.com/firebasejs/12.1.0/firebase-storage.js";


// =====================================================
// STORAGE
// =====================================================

const storage =
getStorage();


// =====================================================
// ELEMENTOS
// =====================================================

const mensaje =
document.getElementById(
    "mensaje"
);

const contenido =
document.getElementById(
    "contenido"
);

const empresaIdMostrar =
document.getElementById(
    "empresaIdMostrar"
);

const usuarioMostrar =
document.getElementById(
    "usuarioMostrar"
);

const nombreEmpresa =
document.getElementById(
    "nombreEmpresa"
);

const razonSocial =
document.getElementById(
    "razonSocial"
);

const cuit =
document.getElementById(
    "cuit"
);

const telefono =
document.getElementById(
    "telefono"
);

const email =
document.getElementById(
    "email"
);

const direccion =
document.getElementById(
    "direccion"
);

const logo =
document.getElementById(
    "logo"
);

const logoPreview =
document.getElementById(
    "logoPreview"
);

const btnGuardar =
document.getElementById(
    "btnGuardar"
);

const btnVolver =
document.getElementById(
    "btnVolver"
);


// =====================================================
// VARIABLES
// =====================================================

let usuarioActual =
null;

let empresaId =
"";

let empresaRef =
null;

let logoActual =
"";


// =====================================================
// UTILIDADES
// =====================================================

function texto(valor){

    if(
        valor === undefined ||
        valor === null
    ){

        return "";

    }

    return String(valor).trim();

}


// =====================================================
// MENSAJES
// =====================================================

function mostrarMensaje(
    textoMensaje,
    tipo
){

    mensaje.textContent =
    textoMensaje;

    mensaje.className =
    "mensaje " +
    tipo;

}


// =====================================================
// MOSTRAR LOGO
// =====================================================

function mostrarLogo(
    url
){

    logoPreview.innerHTML =
    "";

    if(!url){

        logoPreview.textContent =
        "Sin logo";

        return;

    }


    const imagen =
    document.createElement(
        "img"
    );


    imagen.src =
    url;

    imagen.alt =
    "Logo de la empresa";


    imagen.onerror =
    function(){

        logoPreview.innerHTML =
        "";

        logoPreview.textContent =
        "No se pudo cargar el logo.";

    };


    logoPreview.appendChild(
        imagen
    );

}


// =====================================================
// VISTA PREVIA LOGO
// =====================================================

logo.addEventListener(
    "change",
    function(){

        const archivo =
        logo.files &&
        logo.files[0];


        if(!archivo){

            return;

        }


        const tiposPermitidos = [
            "image/jpeg",
            "image/png",
            "image/webp"
        ];


        if(
            !tiposPermitidos.includes(
                archivo.type
            )
        ){

            mostrarMensaje(
                "El logo debe ser JPG, PNG o WEBP.",
                "error"
            );

            logo.value =
            "";

            return;

        }


        if(
            archivo.size >
            2 * 1024 * 1024
        ){

            mostrarMensaje(
                "El logo no puede superar los 2 MB.",
                "error"
            );

            logo.value =
            "";

            return;

        }


        const lector =
        new FileReader();


        lector.onload =
        function(evento){

            logoPreview.innerHTML =
            "";

            const imagen =
            document.createElement(
                "img"
            );


            imagen.src =
            evento.target.result;

            imagen.alt =
            "Vista previa del logo";


            logoPreview.appendChild(
                imagen
            );

        };


        lector.onerror =
        function(){

            mostrarMensaje(
                "No se pudo leer la imagen.",
                "error"
            );

        };


        lector.readAsDataURL(
            archivo
        );

    }
);


// =====================================================
// OBTENER EMPRESA ID
// =====================================================

async function obtenerEmpresaId(){

    /*
     * Primero buscamos:
     *
     * usuarios/{uid}
     *
     * y obtenemos:
     *
     * empresaId
     *
     * Esto permite que empleados,
     * presupuestos y demás módulos
     * trabajen con la misma empresa.
     */


    const usuarioRef =
    doc(
        db,
        "usuarios",
        usuarioActual.uid
    );


    const usuarioDoc =
    await getDoc(
        usuarioRef
    );


    if(
        usuarioDoc.exists()
    ){

        const datos =
        usuarioDoc.data();


        empresaId =
        texto(
            datos.empresaId
        );


        /*
         * Compatibilidad con versiones
         * anteriores de GESBASE.
         */

        if(!empresaId){

            empresaId =
            texto(
                datos.empresa
            );

        }

    }


    /*
     * Si todavía no existe empresaId,
     * usamos el UID del propietario.
     *
     * Esto evita romper cuentas antiguas.
     */

    if(!empresaId){

        empresaId =
        usuarioActual.uid;

    }


    if(!empresaId){

        throw new Error(
            "No se pudo determinar la empresa del usuario."
        );

    }


    empresaRef =
    doc(
        db,
        "empresas",
        empresaId
    );


    empresaIdMostrar.textContent =
    empresaId;

}


// =====================================================
// CARGAR EMPRESA
// =====================================================

async function cargarEmpresa(){

    await obtenerEmpresaId();


    usuarioMostrar.textContent =
    usuarioActual.email ||
    usuarioActual.uid;


    const documento =
    await getDoc(
        empresaRef
    );


    if(
        documento.exists()
    ){

        const datos =
        documento.data();


        nombreEmpresa.value =
        texto(
            datos.nombreEmpresa
        );


        razonSocial.value =
        texto(
            datos.razonSocial
        );


        cuit.value =
        texto(
            datos.cuit
        );


        telefono.value =
        texto(
            datos.telefono
        );


        email.value =
        texto(
            datos.email
        ) ||
        texto(
            usuarioActual.email
        );


        direccion.value =
        texto(
            datos.direccion
        );


        logoActual =
        texto(
            datos.logoUrl
        );


        mostrarLogo(
            logoActual
        );

    }
    else{

        /*
         * Empresa nueva.
         */

        email.value =
        usuarioActual.email ||
        "";

        logoActual =
        "";

        mostrarLogo(
            ""
        );

    }


    contenido.style.display =
    "block";


    mostrarMensaje(
        documento.exists()
            ? "Información de empresa cargada."
            : "Podés completar los datos de tu empresa.",
        documento.exists()
            ? "exito"
            : "cargando"
    );


    setTimeout(
        function(){

            mensaje.style.display =
            "none";

        },
        1800
    );

}


// =====================================================
// VALIDAR EMAIL
// =====================================================

function emailValido(
    valor
){

    if(!valor){

        return true;

    }


    return /^[^\s@]+@[^\s@]+\.[^\s@]+$/
        .test(
            valor
        );

}


// =====================================================
// GUARDAR EMPRESA
// =====================================================

async function guardarEmpresa(){

    if(!usuarioActual){

        mostrarMensaje(
            "La sesión no está disponible.",
            "error"
        );

        return;

    }


    if(!empresaId){

        mostrarMensaje(
            "No se pudo determinar la empresa.",
            "error"
        );

        return;

    }


    const nombre =
    texto(
        nombreEmpresa.value
    );


    const razon =
    texto(
        razonSocial.value
    );


    const cuitValor =
    texto(
        cuit.value
    );


    const telefonoValor =
    texto(
        telefono.value
    );


    const emailValor =
    texto(
        email.value
    ).toLowerCase();


    const direccionValor =
    texto(
        direccion.value
    );


    // =================================================
    // VALIDACIONES
    // =================================================

    if(!nombre){

        mostrarMensaje(
            "Ingresá el nombre de la empresa.",
            "error"
        );

        nombreEmpresa.focus();

        return;

    }


    if(!razon){

        mostrarMensaje(
            "Ingresá la razón social.",
            "error"
        );

        razonSocial.focus();

        return;

    }


    if(
        emailValor &&
        !emailValido(
            emailValor
        )
    ){

        mostrarMensaje(
            "Ingresá un email válido.",
            "error"
        );

        email.focus();

        return;

    }


    btnGuardar.disabled =
    true;

    btnGuardar.textContent =
    "Guardando...";


    try{

        let logoUrl =
        logoActual;


        // =================================================
        // SUBIR LOGO
        // =================================================

        const archivo =
        logo.files &&
        logo.files[0];


        if(archivo){

            const tiposPermitidos = [
                "image/jpeg",
                "image/png",
                "image/webp"
            ];


            if(
                !tiposPermitidos.includes(
                    archivo.type
                )
            ){

                throw new Error(
                    "El logo debe estar en formato JPG, PNG o WEBP."
                );

            }


            if(
                archivo.size >
                2 * 1024 * 1024
            ){

                throw new Error(
                    "El logo no puede superar los 2 MB."
                );

            }


            /*
             * Usamos un nombre único.
             *
             * Evitamos problemas de caché
             * cuando el usuario cambia el logo.
             */

            const extension =
            archivo.type ===
            "image/png"
                ? "png"
                : archivo.type ===
                  "image/webp"
                    ? "webp"
                    : "jpg";


            const nombreArchivo =
            "logo-" +
            Date.now() +
            "." +
            extension;


            const ruta =
            "empresas/" +
            empresaId +
            "/" +
            nombreArchivo;


            const referenciaLogo =
            ref(
                storage,
                ruta
            );


            await uploadBytes(
                referenciaLogo,
                archivo,
                {
                    contentType:
                    archivo.type
                }
            );


            logoUrl =
            await getDownloadURL(
                referenciaLogo
            );

        }


        // =================================================
        // DATOS EMPRESA
        // =================================================

        const datosEmpresa = {

            empresaId:
            empresaId,

            uid:
            usuarioActual.uid,

            nombreEmpresa:
            nombre,

            razonSocial:
            razon,

            cuit:
            cuitValor,

            telefono:
            telefonoValor,

            email:
            emailValor,

            direccion:
            direccionValor,

            logoUrl:
            logoUrl,

            actualizado:
            serverTimestamp()

        };


        // =================================================
        // CREAR / ACTUALIZAR
        // =================================================

        await setDoc(
            empresaRef,
            datosEmpresa,
            {
                merge:true
            }
        );


        logoActual =
        logoUrl;


        mostrarLogo(
            logoActual
        );


        /*
         * Limpiamos el selector
         * de archivo para que no vuelva
         * a subir accidentalmente la misma imagen.
         */

        logo.value =
        "";


        mostrarMensaje(
            "✅ Datos de la empresa guardados correctamente.",
            "exito"
        );

    }
    catch(error){

        console.error(
            "ERROR GUARDANDO EMPRESA:",
            error
        );


        let mensajeError =
        "No se pudo guardar la empresa.";


        if(
            error.code ===
            "permission-denied"
        ){

            mensajeError =
            "Firebase rechazó la operación. Revisá las reglas de Firestore.";

        }
        else if(
            error.code ===
            "storage/unauthorized"
        ){

            mensajeError =
            "Firebase Storage rechazó la subida del logo. Revisá las reglas de Storage.";

        }
        else if(
            error.code ===
            "storage/canceled"
        ){

            mensajeError =
            "La subida del logo fue cancelada.";

        }
        else if(
            error.message
        ){

            mensajeError =
            error.message;

        }


        mostrarMensaje(
            "❌ " +
            mensajeError,
            "error"
        );

    }
    finally{

        btnGuardar.disabled =
        false;

        btnGuardar.textContent =
        "💾 Guardar cambios";

    }

}


// =====================================================
// BOTÓN GUARDAR
// =====================================================

btnGuardar.addEventListener(
    "click",
    guardarEmpresa
);


// =====================================================
// VOLVER
// =====================================================

btnVolver.addEventListener(
    "click",
    function(){

        window.location.href =
        "index.html";

    }
);


// =====================================================
// AUTENTICACIÓN
// =====================================================

onAuthStateChanged(
    auth,
    async function(usuario){

        if(!usuario){

            window.location.replace(
                "login.html"
            );

            return;

        }


        usuarioActual =
        usuario;


        try{

            mostrarMensaje(
                "Cargando información de la empresa...",
                "cargando"
            );


            await cargarEmpresa();

        }
        catch(error){

            console.error(
                "ERROR CARGANDO EMPRESA:",
                error
            );


            mostrarMensaje(
                "❌ No se pudo cargar la empresa: " +
                (
                    error.message ||
                    error.code ||
                    "error desconocido"
                ),
                "error"
            );

        }

    }
);

</script>

</body>

</html>
