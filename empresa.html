<!DOCTYPE html>
<html lang="es">

<head>

<meta charset="UTF-8">

<meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
>

<meta
    name="theme-color"
    content="#111827"
>

<title>Mi empresa - GESBASE</title>

<style>

*{
    box-sizing:border-box;
    margin:0;
    padding:0;
}

body{
    font-family:Arial,sans-serif;
    background:#f3f4f6;
    color:#111827;
    min-height:100vh;
}

.contenedor{
    width:100%;
    max-width:600px;
    min-height:100vh;
    margin:auto;
    background:white;
}

header{
    background:#111827;
    color:white;
    padding:25px 20px;
}

header h1{
    font-size:25px;
}

header p{
    margin-top:6px;
    font-size:14px;
    color:#d1d5db;
}

main{
    padding:20px;
}

.tarjeta{
    background:white;
    border:1px solid #e5e7eb;
    border-radius:14px;
    padding:20px;
    margin-bottom:18px;
}

.titulo{
    font-size:18px;
    font-weight:bold;
    margin-bottom:18px;
}

.campo{
    margin-bottom:17px;
}

label{
    display:block;
    font-size:14px;
    font-weight:bold;
    margin-bottom:7px;
}

input{
    width:100%;
    padding:13px;
    border:1px solid #d1d5db;
    border-radius:9px;
    font-size:16px;
    outline:none;
    background:#fff;
}

input:focus{
    border-color:#2563eb;
}

input[type="file"]{
    border:none;
    padding:5px 0;
    font-size:14px;
}

.logo-contenedor{
    text-align:center;
    margin-bottom:10px;
}

.logo-preview{
    width:140px;
    height:140px;
    border:2px dashed #d1d5db;
    border-radius:15px;
    margin:0 auto 14px;
    display:flex;
    align-items:center;
    justify-content:center;
    overflow:hidden;
    background:#f9fafb;
    color:#6b7280;
    font-size:14px;
}

.logo-preview img{
    width:100%;
    height:100%;
    object-fit:contain;
}

.nota{
    font-size:12px;
    color:#6b7280;
    margin-top:6px;
    line-height:1.4;
}

.mensaje{
    display:none;
    padding:14px;
    border-radius:10px;
    margin-bottom:18px;
    font-size:14px;
    line-height:1.5;
}

.mensaje.exito{
    display:block;
    background:#dcfce7;
    color:#166534;
}

.mensaje.error{
    display:block;
    background:#fee2e2;
    color:#991b1b;
}

.mensaje.cargando{
    display:block;
    background:#f3f4f6;
    color:#374151;
}

.info-empresa{
    background:#f9fafb;
    border:1px solid #e5e7eb;
    border-radius:10px;
    padding:12px;
    margin-bottom:18px;
    font-size:13px;
    line-height:1.6;
    word-break:break-word;
}

.info-empresa strong{
    color:#111827;
}

button{
    width:100%;
    padding:15px;
    border:none;
    border-radius:10px;
    font-size:16px;
    font-weight:bold;
    cursor:pointer;
    margin-top:10px;
}

button:disabled{
    opacity:.6;
    cursor:not-allowed;
}

.guardar{
    background:#111827;
    color:white;
}

.volver{
    background:#e5e7eb;
    color:#111827;
}

@media(max-width:480px){

    main{
        padding:15px;
    }

    .tarjeta{
        padding:17px;
    }

}

</style>

</head>

<body>

<div class="contenedor">

<header>

<h1>
⚙️ Mi empresa
</h1>

<p>
Configuración de GESBASE
</p>

</header>

<main>

<div
id="mensaje"
class="mensaje cargando"
>
Verificando sesión...
</div>


<div
id="contenido"
style="display:none;"
>

<!-- IDENTIFICACIÓN -->

<div class="info-empresa">

<div>
<strong>ID de empresa:</strong>
<span id="empresaIdMostrar">-</span>
</div>

<div>
<strong>Usuario:</strong>
<span id="usuarioMostrar">-</span>
</div>

</div>


<!-- LOGO -->

<div class="tarjeta">

<div class="titulo">
Logo de la empresa
</div>

<div class="logo-contenedor">

<div
id="logoPreview"
class="logo-preview"
>
Sin logo
</div>

<input
type="file"
id="logo"
accept="image/png,image/jpeg,image/webp"
>

<div class="nota">

Formatos permitidos:
JPG, PNG o WEBP.

<br>

Tamaño máximo:
2 MB.

</div>

</div>

</div>


<!-- DATOS EMPRESA -->

<div class="tarjeta">

<div class="titulo">
Datos de la empresa
</div>


<div class="campo">

<label for="nombreEmpresa">
Nombre de empresa
</label>

<input
type="text"
id="nombreEmpresa"
placeholder="Ej.: GESBASE Servicios"
autocomplete="organization"
>

</div>


<div class="campo">

<label for="razonSocial">
Razón social
</label>

<input
type="text"
id="razonSocial"
placeholder="Ej.: Battauz Julián Ezequiel"
autocomplete="organization"
>

</div>


<div class="campo">

<label for="cuit">
CUIT
</label>

<input
type="text"
id="cuit"
placeholder="Ej.: 20-00000000-0"
inputmode="numeric"
>

</div>


<div class="campo">

<label for="telefono">
Teléfono
</label>

<input
type="tel"
id="telefono"
placeholder="Teléfono de la empresa"
autocomplete="tel"
>

</div>


<div class="campo">

<label for="email">
Email
</label>

<input
type="email"
id="email"
placeholder="email@empresa.com"
autocomplete="email"
>

</div>


<div class="campo">

<label for="direccion">
Dirección
</label>

<input
type="text"
id="direccion"
placeholder="Dirección de la empresa"
autocomplete="street-address"
>

</div>


<button
type="button"
class="guardar"
id="btnGuardar"
>
💾 Guardar cambios
</button>

</div>


<button
type="button"
class="volver"
id="btnVolver"
>
⬅️ Volver al panel
</button>

</div>

</main>

</div>


<script type="module">

// =====================================================
// FIREBASE
// =====================================================

import {
    auth,
    db
} from "./Js/firebase.js";


import {
    onAuthStateChanged
} from
"https://www.gstatic.com/firebasejs/12.1.0/firebase-auth.js";


import {
    collection,
    doc,
    getDoc,
    getDocs,
    query,
    where,
    limit,
    setDoc,
    serverTimestamp
} from
"https://www.gstatic.com/firebasejs/12.1.0/firebase-firestore.js";


import {
    getStorage,
    ref,
    uploadBytes,
    getDownloadURL
} from
"https://www.gstatic.com/firebasejs/12.1.0/firebase-storage.js";


// =====================================================
// STORAGE
// =====================================================

const storage = getStorage();


// =====================================================
// ELEMENTOS
// =====================================================

const mensaje =
document.getElementById("mensaje");

const contenido =
document.getElementById("contenido");

const empresaIdMostrar =
document.getElementById("empresaIdMostrar");

const usuarioMostrar =
document.getElementById("usuarioMostrar");

const nombreEmpresa =
document.getElementById("nombreEmpresa");

const razonSocial =
document.getElementById("razonSocial");

const cuit =
document.getElementById("cuit");

const telefono =
document.getElementById("telefono");

const email =
document.getElementById("email");

const direccion =
document.getElementById("direccion");

const logo =
document.getElementById("logo");

const logoPreview =
document.getElementById("logoPreview");

const btnGuardar =
document.getElementById("btnGuardar");

const btnVolver =
document.getElementById("btnVolver");


// =====================================================
// VARIABLES
// =====================================================

let usuarioActual = null;

let empresaId = "";

let empresaRef = null;

let logoActual = "";


// =====================================================
// UTILIDAD
// =====================================================

function texto(valor){

    if(
        valor === undefined ||
        valor === null
    ){

        return "";

    }

    return String(valor).trim();

}


// =====================================================
// MENSAJES
// =====================================================

function mostrarMensaje(
    textoMensaje,
    tipo
){

    mensaje.textContent =
    textoMensaje;

    mensaje.className =
    "mensaje " + tipo;

    mensaje.style.display =
    "block";

}


function ocultarMensaje(){

    mensaje.style.display =
    "none";

}


// =====================================================
// MOSTRAR LOGO
// =====================================================

function mostrarLogo(url){

    logoPreview.innerHTML = "";

    if(!url){

        logoPreview.textContent =
        "Sin logo";

        return;

    }


    const imagen =
    document.createElement("img");

    imagen.src = url;

    imagen.alt =
    "Logo de la empresa";


    imagen.onerror =
    function(){

        logoPreview.innerHTML = "";

        logoPreview.textContent =
        "No se pudo cargar el logo.";

    };


    logoPreview.appendChild(
        imagen
    );

}


// =====================================================
// VISTA PREVIA
// =====================================================

logo.addEventListener(
    "change",
    function(){

        const archivo =
        logo.files &&
        logo.files[0];


        if(!archivo){

            return;

        }


        const tiposPermitidos = [

            "image/jpeg",
            "image/png",
            "image/webp"

        ];


        if(
            !tiposPermitidos.includes(
                archivo.type
            )
        ){

            mostrarMensaje(
                "El logo debe ser JPG, PNG o WEBP.",
                "error"
            );

            logo.value = "";

            return;

        }


        if(
            archivo.size >
            2 * 1024 * 1024
        ){

            mostrarMensaje(
                "El logo no puede superar los 2 MB.",
                "error"
            );

            logo.value = "";

            return;

        }


        const lector =
        new FileReader();


        lector.onload =
        function(evento){

            logoPreview.innerHTML = "";

            const imagen =
            document.createElement("img");

            imagen.src =
            evento.target.result;

            imagen.alt =
            "Vista previa del logo";

            logoPreview.appendChild(
                imagen
            );

        };


        lector.onerror =
        function(){

            mostrarMensaje(
                "No se pudo leer la imagen.",
                "error"
            );

        };


        lector.readAsDataURL(
            archivo
        );

    }
);


// =====================================================
// BUSCAR EMPRESA POR CAMPO
// =====================================================

async function buscarEmpresaPorCampo(
    campo,
    valor
){

    if(!valor){

        return null;

    }


    try{

        const consulta =
        query(
            collection(
                db,
                "empresas"
            ),
            where(
                campo,
                "==",
                valor
            ),
            limit(1)
        );


        const resultado =
        await getDocs(
            consulta
        );


        if(
            resultado.empty
        ){

            return null;

        }


        const documento =
        resultado.docs[0];


        return {

            id:
            documento.id,

            datos:
            documento.data()

        };

    }
    catch(error){

        console.warn(
            "No se pudo buscar empresa por " +
            campo,
            error
        );

        return null;

    }

}


// =====================================================
// OBTENER ID DE EMPRESA
// =====================================================

async function obtenerEmpresaId(){

    if(!usuarioActual){

        throw new Error(
            "No hay una sesión de usuario activa."
        );

    }


    const uid =
    usuarioActual.uid;


    /*
     * 1. BUSCAR USUARIO
     */

    const usuarioRef =
    doc(
        db,
        "usuarios",
        uid
    );


    let usuarioDoc = null;


    try{

        usuarioDoc =
        await getDoc(
            usuarioRef
        );

    }
    catch(error){

        console.warn(
            "No se pudo leer usuarios/" +
            uid,
            error
        );

    }


    if(
        usuarioDoc &&
        usuarioDoc.exists()
    ){

        const datosUsuario =
        usuarioDoc.data();


        empresaId =
        texto(
            datosUsuario.empresaId
        );


        if(!empresaId){

            empresaId =
            texto(
                datosUsuario.empresa
            );

        }

    }


    /*
     * 2. BUSCAR EMPRESA POR UID
     */

    if(!empresaId){

        const encontrada =
        await buscarEmpresaPorCampo(
            "uid",
            uid
        );


        if(encontrada){

            empresaId =
            encontrada.id;

        }

    }


    /*
     * 3. BUSCAR POR ownerUid
     */

    if(!empresaId){

        const encontrada =
        await buscarEmpresaPorCampo(
            "ownerUid",
            uid
        );


        if(encontrada){

            empresaId =
            encontrada.id;

        }

    }


    /*
     * 4. BUSCAR POR propietarioUid
     */

    if(!empresaId){

        const encontrada =
        await buscarEmpresaPorCampo(
            "propietarioUid",
            uid
        );


        if(encontrada){

            empresaId =
            encontrada.id;

        }

    }


    /*
     * 5. BUSCAR POR creadoPor
     */

    if(!empresaId){

        const encontrada =
        await buscarEmpresaPorCampo(
            "creadoPor",
            uid
        );


        if(encontrada){

            empresaId =
            encontrada.id;

        }

    }


    /*
     * 6. SI NO EXISTE, USAR UID COMO ID
     *
     * Esto permite crear la empresa
     * para cuentas nuevas.
     */

    if(!empresaId){

        empresaId =
        uid;

    }


    /*
     * REFERENCIA FINAL
     */

    empresaRef =
    doc(
        db,
        "empresas",
        empresaId
    );


    empresaIdMostrar.textContent =
    empresaId;

}


// =====================================================
// CARGAR EMPRESA
// =====================================================

async function cargarEmpresa(){

    mostrarMensaje(
        "Buscando información de la empresa...",
        "cargando"
    );


    await obtenerEmpresaId();


    usuarioMostrar.textContent =
    usuarioActual.email ||
    usuarioActual.uid;


    /*
     * Leer documento de empresa
     */

    const documento =
    await getDoc(
        empresaRef
    );


    if(
        documento.exists()
    ){

        const datos =
        documento.data();


        nombreEmpresa.value =
        texto(
            datos.nombreEmpresa ||
            datos.nombre ||
            datos.nombreEmpresaComercial
        );


        razonSocial.value =
        texto(
            datos.razonSocial ||
            datos.razon_social
        );


        cuit.value =
        texto(
            datos.cuit
        );


        telefono.value =
        texto(
            datos.telefono ||
            datos.telefonoEmpresa
        );


        email.value =
        texto(
            datos.email
        ) ||
        texto(
            usuarioActual.email
        );


        direccion.value =
        texto(
            datos.direccion ||
            datos.domicilio
        );


        logoActual =
        texto(
            datos.logoUrl ||
            datos.logo
        );


        mostrarLogo(
            logoActual
        );


        mostrarMensaje(
            "✅ Empresa encontrada correctamente.",
            "exito"
        );

    }
    else{

        /*
         * Documento todavía no existe.
         */

        email.value =
        usuarioActual.email ||
        "";


        logoActual = "";

        mostrarLogo("");


        mostrarMensaje(
            "No había datos guardados. Podés completar la información de tu empresa.",
            "cargando"
        );

    }


    contenido.style.display =
    "block";


    setTimeout(
        function(){

            ocultarMensaje();

        },
        2000
    );

}


// =====================================================
// VALIDAR EMAIL
// =====================================================

function emailValido(valor){

    if(!valor){

        return true;

    }


    return /^[^\s@]+@[^\s@]+\.[^\s@]+$/
        .test(valor);

}


// =====================================================
// GUARDAR EMPRESA
// =====================================================

async function guardarEmpresa(){

    if(!usuarioActual){

        mostrarMensaje(
            "La sesión no está disponible.",
            "error"
        );

        return;

    }


    if(!empresaId){

        mostrarMensaje(
            "No se pudo determinar el ID de la empresa.",
            "error"
        );

        return;

    }


    const nombre =
    texto(
        nombreEmpresa.value
    );


    const razon =
    texto(
        razonSocial.value
    );


    const cuitValor =
    texto(
        cuit.value
    );


    const telefonoValor =
    texto(
        telefono.value
    );


    const emailValor =
    texto(
        email.value
    ).toLowerCase();


    const direccionValor =
    texto(
        direccion.value
    );


    /*
     * VALIDACIONES
     */

    if(!nombre){

        mostrarMensaje(
            "Ingresá el nombre de la empresa.",
            "error"
        );

        nombreEmpresa.focus();

        return;

    }


    if(!razon){

        mostrarMensaje(
            "Ingresá la razón social.",
            "error"
        );

        razonSocial.focus();

        return;

    }


    if(
        emailValor &&
        !emailValido(
            emailValor
        )
    ){

        mostrarMensaje(
            "Ingresá un email válido.",
            "error"
        );

        email.focus();

        return;

    }


    btnGuardar.disabled =
    true;

    btnGuardar.textContent =
    "Guardando...";


    try{

        let logoUrl =
        logoActual;


        /*
         * SUBIR LOGO
         */

        const archivo =
        logo.files &&
        logo.files[0];


        if(archivo){

            const tiposPermitidos = [

                "image/jpeg",
                "image/png",
                "image/webp"

            ];


            if(
                !tiposPermitidos.includes(
                    archivo.type
                )
            ){

                throw new Error(
                    "El logo debe ser JPG, PNG o WEBP."
                );

            }


            if(
                archivo.size >
                2 * 1024 * 1024
            ){

                throw new Error(
                    "El logo no puede superar los 2 MB."
                );

            }


            let extension =
            "jpg";


            if(
                archivo.type ===
                "image/png"
            ){

                extension =
                "png";

            }
            else if(
                archivo.type ===
                "image/webp"
            ){

                extension =
                "webp";

            }


            const nombreArchivo =
            "logo-" +
            Date.now() +
            "." +
            extension;


            const ruta =
            "empresas/" +
            empresaId +
            "/" +
            nombreArchivo;


            const referenciaLogo =
            ref(
                storage,
                ruta
            );


            await uploadBytes(
                referenciaLogo,
                archivo,
                {
                    contentType:
                    archivo.type
                }
            );


            logoUrl =
            await getDownloadURL(
                referenciaLogo
            );

        }


        /*
         * DATOS DE EMPRESA
         */

        const datosEmpresa = {

            empresaId:
            empresaId,

            uid:
            usuarioActual.uid,

            ownerUid:
            usuarioActual.uid,

            nombreEmpresa:
            nombre,

            razonSocial:
            razon,

            cuit:
            cuitValor,

            telefono:
            telefonoValor,

            email:
            emailValor,

            direccion:
            direccionValor,

            logoUrl:
            logoUrl,

            actualizado:
            serverTimestamp()

        };


        /*
         * GUARDAR EMPRESA
         */

        await setDoc(
            empresaRef,
            datosEmpresa,
            {
                merge:true
            }
        );


        /*
         * ACTUALIZAR TAMBIÉN
         * EL DOCUMENTO DEL USUARIO
         *
         * Esto es importante para que
         * los demás módulos de GESBASE
         * encuentren la misma empresa.
         */

        try{

            await setDoc(
                usuarioRefSeguro(),
                {
                    empresaId:
                    empresaId
                },
                {
                    merge:true
                }
            );

        }
        catch(errorUsuario){

            console.warn(
                "No se pudo actualizar usuarios:",
                errorUsuario
            );

        }


        logoActual =
        logoUrl;


        mostrarLogo(
            logoActual
        );


        logo.value =
        "";


        mostrarMensaje(
            "✅ Datos de la empresa guardados correctamente.",
            "exito"
        );

    }
    catch(error){

        console.error(
            "ERROR GUARDANDO EMPRESA:",
            error
        );


        let mensajeError =
        "No se pudo guardar la empresa.";


        if(
            error.code ===
            "permission-denied" ||
            error.code ===
            "firestore/permission-denied"
        ){

            mensajeError =
            "Firebase rechazó la operación. Hay que revisar las reglas de Firestore.";

        }
        else if(
            error.code ===
            "storage/unauthorized"
        ){

            mensajeError =
            "Firebase Storage rechazó el logo. Hay que revisar las reglas de Storage.";

        }
        else if(
            error.message
        ){

            mensajeError =
            error.message;

        }


        mostrarMensaje(
            "❌ " +
            mensajeError,
            "error"
        );

    }
    finally{

        btnGuardar.disabled =
        false;

        btnGuardar.textContent =
        "💾 Guardar cambios";

    }

}


// =====================================================
// REFERENCIA USUARIO
// =====================================================

function usuarioRefSeguro(){

    return doc(
        db,
        "usuarios",
        usuarioActual.uid
    );

}


// =====================================================
// BOTÓN GUARDAR
// =====================================================

btnGuardar.addEventListener(
    "click",
    guardarEmpresa
);


// =====================================================
// BOTÓN VOLVER
// =====================================================

btnVolver.addEventListener(
    "click",
    function(){

        window.location.href =
        "index.html";

    }
);


// =====================================================
// AUTENTICACIÓN
// =====================================================

onAuthStateChanged(
    auth,
    async function(usuario){

        /*
         * NO HAY SESIÓN
         */

        if(!usuario){

            mostrarMensaje(
                "No hay una sesión iniciada. Redirigiendo al login...",
                "error"
            );


            setTimeout(
                function(){

                    window.location.replace(
                        "login.html"
                    );

                },
                800
            );


            return;

        }


        /*
         * SESIÓN CONFIRMADA
         */

        usuarioActual =
        usuario;


        usuarioMostrar.textContent =
        usuario.email ||
        usuario.uid;


        try{

            mostrarMensaje(
                "Sesión verificada. Buscando empresa...",
                "cargando"
            );


            await cargarEmpresa();

        }
        catch(error){

            console.error(
                "ERROR CARGANDO EMPRESA:",
                error
            );


            contenido.style.display =
            "none";


            mostrarMensaje(
                "❌ No se pudo cargar la empresa: " +
                (
                    error.message ||
                    error.code ||
                    "error desconocido"
                ),
                "error"
            );

        }

    }
);

</script>

</body>

</html>
