<!DOCTYPE html>
<html lang="es">

<head>

<meta charset="UTF-8">

<meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
>

<meta
    name="theme-color"
    content="#111827"
>

<meta
    name="description"
    content="Mi empresa - GESBASE"
>

<title>Mi empresa - GESBASE</title>

<style>

*{
    box-sizing:border-box;
    margin:0;
    padding:0;
}

body{
    font-family:Arial,sans-serif;
    background:#f3f4f6;
    color:#111827;
    min-height:100vh;
}

.contenedor{
    width:100%;
    max-width:600px;
    min-height:100vh;
    margin:auto;
    background:white;
}

header{
    background:#111827;
    color:white;
    padding:25px 20px;
}

header h1{
    font-size:25px;
}

header p{
    margin-top:6px;
    font-size:14px;
    color:#d1d5db;
}

main{
    padding:20px;
}

.tarjeta{
    background:white;
    border:1px solid #e5e7eb;
    border-radius:14px;
    padding:20px;
    margin-bottom:18px;
}

.titulo{
    font-size:18px;
    font-weight:bold;
    margin-bottom:18px;
}

.campo{
    margin-bottom:17px;
}

label{
    display:block;
    font-size:14px;
    font-weight:bold;
    margin-bottom:7px;
}

input{
    width:100%;
    padding:13px;
    border:1px solid #d1d5db;
    border-radius:9px;
    font-size:16px;
    outline:none;
    background:#fff;
}

input:focus{
    border-color:#2563eb;
}

input[type="file"]{
    border:none;
    padding:5px 0;
    font-size:14px;
}

.logo-contenedor{
    text-align:center;
    margin-bottom:10px;
}

.logo-preview{
    width:140px;
    height:140px;
    border:2px dashed #d1d5db;
    border-radius:15px;
    margin:0 auto 14px;
    display:flex;
    align-items:center;
    justify-content:center;
    overflow:hidden;
    background:#f9fafb;
    color:#6b7280;
    font-size:14px;
}

.logo-preview img{
    width:100%;
    height:100%;
    object-fit:contain;
}

.nota{
    font-size:12px;
    color:#6b7280;
    margin-top:6px;
    line-height:1.4;
}

.mensaje{
    display:none;
    padding:14px;
    border-radius:10px;
    margin-bottom:18px;
    font-size:14px;
    line-height:1.5;
}

.mensaje.exito{
    display:block;
    background:#dcfce7;
    color:#166534;
}

.mensaje.error{
    display:block;
    background:#fee2e2;
    color:#991b1b;
}

.mensaje.cargando{
    display:block;
    background:#f3f4f6;
    color:#374151;
}

.info-empresa{
    background:#f9fafb;
    border:1px solid #e5e7eb;
    border-radius:10px;
    padding:12px;
    margin-bottom:18px;
    font-size:13px;
    line-height:1.6;
    word-break:break-word;
}

.info-empresa strong{
    color:#111827;
}

button{
    width:100%;
    padding:15px;
    border:none;
    border-radius:10px;
    font-size:16px;
    font-weight:bold;
    cursor:pointer;
    margin-top:10px;
}

button:disabled{
    opacity:.6;
    cursor:not-allowed;
}

.guardar{
    background:#111827;
    color:white;
}

.volver{
    background:#e5e7eb;
    color:#111827;
}

@media(max-width:480px){

    main{
        padding:15px;
    }

    .tarjeta{
        padding:17px;
    }

}

</style>

</head>

<body>

<div class="contenedor">

<header>

<h1>
⚙️ Mi empresa
</h1>

<p>
Configuración de GESBASE
</p>

</header>

<main>

<div
id="mensaje"
class="mensaje cargando"
>
Verificando sesión...
</div>


<div
id="contenido"
style="display:none;"
>

<div class="info-empresa">

<div>
<strong>ID de empresa:</strong>
<span id="empresaIdMostrar">-</span>
</div>

<div>
<strong>Usuario:</strong>
<span id="usuarioMostrar">-</span>
</div>

</div>


<!-- =================================================
     LOGO
================================================= -->

<div class="tarjeta">

<div class="titulo">
Logo de la empresa
</div>

<div class="logo-contenedor">

<div
id="logoPreview"
class="logo-preview"
>
Sin logo
</div>

<input
type="file"
id="logo"
accept="image/png,image/jpeg,image/webp"
>

<div class="nota">

Formatos permitidos:
JPG, PNG o WEBP.

<br>

Tamaño máximo:
2 MB.

</div>

</div>

</div>


<!-- =================================================
     DATOS EMPRESA
================================================= -->

<div class="tarjeta">

<div class="titulo">
Datos de la empresa
</div>


<div class="campo">

<label for="nombreEmpresa">
Nombre de empresa
</label>

<input
type="text"
id="nombreEmpresa"
placeholder="Ej.: GESBASE Servicios"
autocomplete="organization"
>

</div>


<div class="campo">

<label for="razonSocial">
Razón social
</label>

<input
type="text"
id="razonSocial"
placeholder="Ej.: Battauz Julián Ezequiel"
autocomplete="organization"
>

</div>


<div class="campo">

<label for="cuit">
CUIT
</label>

<input
type="text"
id="cuit"
placeholder="Ej.: 20-00000000-0"
inputmode="numeric"
>

</div>


<div class="campo">

<label for="telefono">
Teléfono
</label>

<input
type="tel"
id="telefono"
placeholder="Teléfono de la empresa"
autocomplete="tel"
>

</div>


<div class="campo">

<label for="email">
Email
</label>

<input
type="email"
id="email"
placeholder="email@empresa.com"
autocomplete="email"
>

</div>


<div class="campo">

<label for="direccion">
Dirección
</label>

<input
type="text"
id="direccion"
placeholder="Dirección de la empresa"
autocomplete="street-address"
>

</div>


<button
type="button"
class="guardar"
id="btnGuardar"
>
💾 Guardar cambios
</button>

</div>


<button
type="button"
class="volver"
id="btnVolver"
>
⬅️ Volver al panel
</button>

</div>

</main>

</div>


<script type="module">

// =====================================================
// FIREBASE
// =====================================================

import {
    auth,
    db
} from "./Js/firebase.js";

import {
    onAuthStateChanged
} from "https://www.gstatic.com/firebasejs/12.18.0/firebase-auth.js";

import {
    doc,
    getDoc,
    setDoc,
    serverTimestamp
} from "https://www.gstatic.com/firebasejs/12.18.0/firebase-firestore.js";

import {
    getStorage,
    ref,
    uploadBytes,
    getDownloadURL
} from "https://www.gstatic.com/firebasejs/12.18.0/firebase-storage.js";


// =====================================================
// STORAGE
// =====================================================

const storage =
getStorage();


// =====================================================
// ELEMENTOS
// =====================================================

const mensaje =
document.getElementById("mensaje");

const contenido =
document.getElementById("contenido");

const empresaIdMostrar =
document.getElementById("empresaIdMostrar");

const usuarioMostrar =
document.getElementById("usuarioMostrar");

const nombreEmpresa =
document.getElementById("nombreEmpresa");

const razonSocial =
document.getElementById("razonSocial");

const cuit =
document.getElementById("cuit");

const telefono =
document.getElementById("telefono");

const email =
document.getElementById("email");

const direccion =
document.getElementById("direccion");

const logo =
document.getElementById("logo");

const logoPreview =
document.getElementById("logoPreview");

const btnGuardar =
document.getElementById("btnGuardar");

const btnVolver =
document.getElementById("btnVolver");


// =====================================================
// VARIABLES
// =====================================================

let usuarioActual =
null;

let empresaId =
"";

let empresaRef =
null;

let logoActual =
"";

let procesoTerminado =
false;


// =====================================================
// TEXTO
// =====================================================

function texto(valor){

    if(
        valor === null ||
        valor === undefined
    ){

        return "";

    }

    return String(valor).trim();

}


// =====================================================
// MENSAJE
// =====================================================

function mostrarMensaje(
    textoMensaje,
    tipo
){

    mensaje.textContent =
    textoMensaje;

    mensaje.className =
    "mensaje " + tipo;

    mensaje.style.display =
    "block";

}


// =====================================================
// MOSTRAR LOGO
// =====================================================

function mostrarLogo(url){

    logoPreview.innerHTML =
    "";

    if(!url){

        logoPreview.textContent =
        "Sin logo";

        return;

    }

    const imagen =
    document.createElement("img");

    imagen.src =
    url;

    imagen.alt =
    "Logo de la empresa";

    imagen.onerror =
    function(){

        logoPreview.innerHTML =
        "";

        logoPreview.textContent =
        "No se pudo cargar el logo.";

    };

    logoPreview.appendChild(
        imagen
    );

}


// =====================================================
// VISTA PREVIA LOGO
// =====================================================

logo.addEventListener(
    "change",
    function(){

        const archivo =
        logo.files &&
        logo.files[0];

        if(!archivo){

            return;

        }

        const tiposPermitidos = [
            "image/jpeg",
            "image/png",
            "image/webp"
        ];

        if(
            !tiposPermitidos.includes(
                archivo.type
            )
        ){

            mostrarMensaje(
                "El logo debe ser JPG, PNG o WEBP.",
                "error"
            );

            logo.value =
            "";

            return;

        }

        if(
            archivo.size >
            2 * 1024 * 1024
        ){

            mostrarMensaje(
                "El logo no puede superar los 2 MB.",
                "error"
            );

            logo.value =
            "";

            return;

        }

        const lector =
        new FileReader();

        lector.onload =
        function(evento){

            logoPreview.innerHTML =
            "";

            const imagen =
            document.createElement("img");

            imagen.src =
            evento.target.result;

            imagen.alt =
            "Vista previa del logo";

            logoPreview.appendChild(
                imagen
            );

        };

        lector.readAsDataURL(
            archivo
        );

    }
);


// =====================================================
// CARGAR EMPRESA
// =====================================================

async function cargarEmpresa(){

    if(!usuarioActual){

        throw new Error(
            "No hay una sesión autenticada."
        );

    }


    const uid =
    usuarioActual.uid;


    mostrarMensaje(
        "Sesión verificada. Cargando empresa...",
        "cargando"
    );


    // =================================================
    // 1. LEER USUARIO
    // =================================================

    const usuarioRef =
    doc(
        db,
        "usuarios",
        uid
    );

    const usuarioSnap =
    await getDoc(
        usuarioRef
    );


    let datosUsuario = {};


    if(
        usuarioSnap.exists()
    ){

        datosUsuario =
        usuarioSnap.data();

    }


    // =================================================
    // 2. OBTENER EMPRESA
    // =================================================

    empresaId =
    texto(
        datosUsuario.empresaId
    );


    /*
     * Si el usuario fue creado con el nuevo
     * registro.html, empresaId = uid.
     *
     * Para cuentas antiguas también usamos
     * el UID como respaldo.
     */

    if(!empresaId){

        empresaId =
        uid;

    }


    empresaRef =
    doc(
        db,
        "empresas",
        empresaId
    );


    empresaIdMostrar.textContent =
    empresaId;

    usuarioMostrar.textContent =
    usuarioActual.email ||
    uid;


    // =================================================
    // 3. LEER EMPRESA
    // =================================================

    const empresaSnap =
    await getDoc(
        empresaRef
    );


    if(
        empresaSnap.exists()
    ){

        const datos =
        empresaSnap.data();


        nombreEmpresa.value =
        texto(
            datos.nombreEmpresa ||
            datos.nombre ||
            datos.nombreEmpresaComercial
        );


        razonSocial.value =
        texto(
            datos.razonSocial ||
            datos.razon_social
        );


        cuit.value =
        texto(
            datos.cuit
        );


        telefono.value =
        texto(
            datos.telefono ||
            datos.telefonoEmpresa
        );


        email.value =
        texto(
            datos.email
        ) ||
        texto(
            usuarioActual.email
        );


        direccion.value =
        texto(
            datos.direccion ||
            datos.domicilio
        );


        logoActual =
        texto(
            datos.logoUrl ||
            datos.logo
        );


        mostrarLogo(
            logoActual
        );


        mostrarMensaje(
            "✅ Empresa cargada correctamente.",
            "exito"
        );

    }
    else{

        /*
         * Si todavía no existe, la creamos.
         */

        const datosNuevaEmpresa = {

            empresaId:
            empresaId,

            uid:
            uid,

            ownerUid:
            uid,

            nombreEmpresa:
            texto(
                datosUsuario.nombreEmpresa
            ),

            razonSocial:
            texto(
                datosUsuario.razonSocial
            ),

            cuit:
            texto(
                datosUsuario.cuit
            ),

            telefono:
            texto(
                datosUsuario.telefono
            ),

            email:
            texto(
                datosUsuario.email
            ) ||
            texto(
                usuarioActual.email
            ),

            direccion:
            "",

            logoUrl:
            "",

            creado:
            serverTimestamp(),

            actualizado:
            serverTimestamp()

        };


        await setDoc(
            empresaRef,
            datosNuevaEmpresa,
            {
                merge:true
            }
        );


        nombreEmpresa.value =
        texto(
            datosNuevaEmpresa.nombreEmpresa
        );


        razonSocial.value =
        texto(
            datosNuevaEmpresa.razonSocial
        );


        cuit.value =
        texto(
            datosNuevaEmpresa.cuit
        );


        telefono.value =
        texto(
            datosNuevaEmpresa.telefono
        );


        email.value =
        texto(
            datosNuevaEmpresa.email
        );


        direccion.value =
        "";


        logoActual =
        "";


        mostrarLogo("");


        mostrarMensaje(
            "✅ Se creó el registro de tu empresa. Completá los datos y guardá.",
            "exito"
        );

    }


    // =================================================
    // MOSTRAR CONTENIDO
    // =================================================

    contenido.style.display =
    "block";


    procesoTerminado =
    true;

}


// =====================================================
// GUARDAR EMPRESA
// =====================================================

async function guardarEmpresa(){

    if(!usuarioActual){

        mostrarMensaje(
            "No hay una sesión activa.",
            "error"
        );

        return;

    }


    if(!empresaId){

        mostrarMensaje(
            "No se pudo determinar la empresa.",
            "error"
        );

        return;

    }


    const nombre =
    texto(
        nombreEmpresa.value
    );

    const razon =
    texto(
        razonSocial.value
    );

    const cuitValor =
    texto(
        cuit.value
    );

    const telefonoValor =
    texto(
        telefono.value
    );

    const emailValor =
    texto(
        email.value
    ).toLowerCase();

    const direccionValor =
    texto(
        direccion.value
    );


    if(!nombre){

        mostrarMensaje(
            "Ingresá el nombre de la empresa.",
            "error"
        );

        nombreEmpresa.focus();

        return;

    }


    if(!razon){

        mostrarMensaje(
            "Ingresá la razón social.",
            "error"
        );

        razonSocial.focus();

        return;

    }


    if(
        emailValor &&
        !/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(
            emailValor
        )
    ){

        mostrarMensaje(
            "Ingresá un email válido.",
            "error"
        );

        email.focus();

        return;

    }


    btnGuardar.disabled =
    true;

    btnGuardar.textContent =
    "Guardando...";


    try{

        let logoUrl =
        logoActual;


        // =================================================
        // SUBIR LOGO
        // =================================================

        const archivo =
        logo.files &&
        logo.files[0];


        if(archivo){

            if(
                archivo.size >
                2 * 1024 * 1024
            ){

                throw new Error(
                    "El logo no puede superar los 2 MB."
                );

            }


            const extension =
            archivo.type ===
            "image/png"
                ? "png"
                : archivo.type ===
                  "image/webp"
                    ? "webp"
                    : "jpg";


            const ruta =
            "empresas/" +
            empresaId +
            "/logo-" +
            Date.now() +
            "." +
            extension;


            const referenciaLogo =
            ref(
                storage,
                ruta
            );


            await uploadBytes(
                referenciaLogo,
                archivo,
                {
                    contentType:
                    archivo.type
                }
            );


            logoUrl =
            await getDownloadURL(
                referenciaLogo
            );

        }


        // =================================================
        // GUARDAR EMPRESA
        // =================================================

        await setDoc(
            empresaRef,
            {

                empresaId:
                empresaId,

                uid:
                usuarioActual.uid,

                ownerUid:
                usuarioActual.uid,

                nombreEmpresa:
                nombre,

                razonSocial:
                razon,

                cuit:
                cuitValor,

                telefono:
                telefonoValor,

                email:
                emailValor,

                direccion:
                direccionValor,

                logoUrl:
                logoUrl,

                actualizado:
                serverTimestamp()

            },
            {
                merge:true
            }
        );


        // =================================================
        // ACTUALIZAR USUARIO
        // =================================================

        await setDoc(
            doc(
                db,
                "usuarios",
                usuarioActual.uid
            ),
            {

                empresaId:
                empresaId,

                nombreEmpresa:
                nombre,

                razonSocial:
                razon,

                cuit:
                cuitValor,

                telefono:
                telefonoValor,

                email:
                emailValor,

                actualizado:
                serverTimestamp()

            },
            {
                merge:true
            }
        );


        logoActual =
        logoUrl;

        mostrarLogo(
            logoActual
        );

        logo.value =
        "";


        mostrarMensaje(
            "✅ Datos de la empresa guardados correctamente.",
            "exito"
        );

    }
    catch(error){

        console.error(
            "ERROR GUARDANDO EMPRESA:",
            error
        );


        let mensajeError =
        "No se pudo guardar la empresa.";


        if(
            error.code ===
            "permission-denied" ||
            error.code ===
            "firestore/permission-denied"
        ){

            mensajeError =
            "Firebase rechazó la operación. Revisá las reglas de Firestore.";

        }
        else if(
            error.code ===
            "storage/unauthorized"
        ){

            mensajeError =
            "Firebase rechazó el logo. Revisá las reglas de Storage.";

        }
        else if(
            error.message
        ){

            mensajeError =
            error.message;

        }


        mostrarMensaje(
            "❌ " +
            mensajeError,
            "error"
        );

    }
    finally{

        btnGuardar.disabled =
        false;

        btnGuardar.textContent =
        "💾 Guardar cambios";

    }

}


// =====================================================
// BOTÓN GUARDAR
// =====================================================

btnGuardar.addEventListener(
    "click",
    guardarEmpresa
);


// =====================================================
// BOTÓN VOLVER
// =====================================================

btnVolver.addEventListener(
    "click",
    function(){

        window.location.href =
        "index.html";

    }
);


// =====================================================
// AUTENTICACIÓN
// =====================================================

mostrarMensaje(
    "Verificando sesión...",
    "cargando"
);


let temporizador = setTimeout(
    function(){

        if(
            !procesoTerminado
        ){

            mostrarMensaje(
                "⚠️ Firebase no respondió a tiempo. Actualizá la página e intentá nuevamente.",
                "error"
            );

        }

    },
    10000
);


onAuthStateChanged(
    auth,
    async function(usuario){

        clearTimeout(
            temporizador
        );


        if(!usuario){

            mostrarMensaje(
                "No hay una sesión iniciada. Redirigiendo al login...",
                "error"
            );


            setTimeout(
                function(){

                    window.location.replace(
                        "login.html"
                    );

                },
                1200
            );


            return;

        }


        usuarioActual =
        usuario;


        usuarioMostrar.textContent =
        usuario.email ||
        usuario.uid;


        try{

            await cargarEmpresa();

        }
        catch(error){

            console.error(
                "ERROR CARGANDO EMPRESA:",
                error
            );


            contenido.style.display =
            "none";


            let mensajeError =
            error.message ||
            error.code ||
            "Error desconocido.";


            if(
                error.code ===
                "permission-denied"
            ){

                mensajeError =
                "Firebase rechazó el acceso a los datos.";

            }


            mostrarMensaje(
                "❌ No se pudo cargar la empresa: " +
                mensajeError,
                "error"
            );

        }

    }
);

</script>

</body>

</html>
