</main></div><script type="module">


// =====================================================
// GESBASE - VER CLIENTE
// =====================================================
// IMPORTANTE:
// NO SE MODIFICA Js/firebase.js
//
// Este archivo utiliza:
//
// auth
// db
// almacenamiento
//
// exactamente como están exportados actualmente.
// =====================================================


import {
    auth,
    db
} from "./Js/firebase.js";


import {
    onAuthStateChanged
} from "https://www.gstatic.com/firebasejs/12.18.0/firebase-auth.js";


import {
    doc,
    getDoc
} from "https://www.gstatic.com/firebasejs/12.18.0/firebase-firestore.js";


// =====================================================
// ELEMENTOS
// =====================================================

const usuarioElemento =
    document.getElementById("usuario");

const errorElemento =
    document.getElementById("error");

const estadoElemento =
    document.getElementById("estado");

const tarjetaElemento =
    document.getElementById("tarjeta");

const nombreElemento =
    document.getElementById("nombre");

const cuitElemento =
    document.getElementById("cuit");

const telefonoElemento =
    document.getElementById("telefono");

const emailElemento =
    document.getElementById("email");

const direccionElemento =
    document.getElementById("direccion");

const localidadElemento =
    document.getElementById("localidad");

const provinciaElemento =
    document.getElementById("provincia");

const observacionesElemento =
    document.getElementById("observaciones");

const contenedorObservaciones =
    document.getElementById(
        "contenedorObservaciones"
    );

const botonEditar =
    document.getElementById("botonEditar");


// =====================================================
// OBTENER ID DEL CLIENTE
// =====================================================

const parametros =
    new URLSearchParams(
        window.location.search
    );

const clienteId =
    parametros.get("id");


// =====================================================
// MOSTRAR ERROR
// =====================================================

function mostrarError(mensaje){

    errorElemento.textContent =
        mensaje;

    errorElemento.style.display =
        "block";

    estadoElemento.style.display =
        "none";
}


// =====================================================
// OCULTAR ERROR
// =====================================================

function ocultarError(){

    errorElemento.textContent =
        "";

    errorElemento.style.display =
        "none";
}


// =====================================================
// MOSTRAR VALOR
// =====================================================

function mostrarValor(valor){

    if(
        valor === undefined ||
        valor === null ||
        String(valor).trim() === ""
    ){

        return "-";
    }

    return String(valor);
}


// =====================================================
// CARGAR CLIENTE
// =====================================================

async function cargarCliente(usuario){

    ocultarError();


    if(!clienteId){

        mostrarError(
            "No se recibió el ID del cliente."
        );

        return;
    }


    try{

        estadoElemento.style.display =
            "block";

        estadoElemento.textContent =
            "Cargando cliente...";


        tarjetaElemento.classList.add(
            "oculto"
        );


        /*
        =================================================
        IMPORTANTE

        Se accede directamente a:

        clientes / ID_DEL_CLIENTE

        NO se utiliza collection()
        sobre un DocumentReference.

        Esto evita el error:

        Expected first argument to collection()
        to be a CollectionReference,
        a DocumentReference or FirebaseFirestore
        =================================================
        */


        const referencia =
            doc(
                db,
                "clientes",
                clienteId
            );


        const resultado =
            await getDoc(
                referencia
            );


        if(!resultado.exists()){

            mostrarError(
                "El cliente no existe o fue eliminado."
            );

            return;
        }


        const datos =
            resultado.data();


        // =================================================
        // VERIFICAR PROPIETARIO
        // =================================================

        if(
            datos.uid &&
            datos.uid !== usuario.uid
        ){

            mostrarError(
                "No tenés permiso para ver este cliente."
            );

            return;
        }


        // =================================================
        // DATOS
        // =================================================

        const nombre =
            datos.nombre ||
            datos.empresa ||
            "Cliente sin nombre";


        nombreElemento.textContent =
            mostrarValor(nombre);


        cuitElemento.textContent =
            mostrarValor(
                datos.cuit
            );


        telefonoElemento.textContent =
            mostrarValor(
                datos.telefono
            );


        emailElemento.textContent =
            mostrarValor(
                datos.email
            );


        direccionElemento.textContent =
            mostrarValor(
                datos.direccion
            );


        localidadElemento.textContent =
            mostrarValor(
                datos.localidad
            );


        provinciaElemento.textContent =
            mostrarValor(
                datos.provincia
            );


        const observaciones =
            mostrarValor(
                datos.observaciones
            );


        if(
            observaciones !== "-"
        ){

            observacionesElemento.textContent =
                observaciones;

            contenedorObservaciones.classList.remove(
                "oculto"
            );

        }
        else{

            contenedorObservaciones.classList.add(
                "oculto"
            );

        }


        // =================================================
        // BOTÓN EDITAR
        // =================================================

        botonEditar.href =
            "editar-cliente.html?id=" +
            encodeURIComponent(
                clienteId
            );


        estadoElemento.style.display =
            "none";


        tarjetaElemento.classList.remove(
            "oculto"
        );

    }
    catch(error){

        console.error(
            "Error cargando cliente:",
            error
        );


        mostrarError(
            "No se pudo cargar el cliente: " +
            error.message
        );
    }
}


// =====================================================
// AUTENTICACIÓN
// =====================================================

onAuthStateChanged(
    auth,
    function(usuario){

        if(!usuario){

            window.location.replace(
                "login.html"
            );

            return;
        }


        usuarioElemento.textContent =
            "Usuario: " +
            (
                usuario.email ||
                "Usuario autenticado"
            );


        cargarCliente(
            usuario
        );

    }
);

</script></body></html>
