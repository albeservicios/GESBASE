<script type="module">


// ==========================================
// FIREBASE
// ==========================================

import {
    auth,
    db
} from "./Js/firebase.js";

import {
    onAuthStateChanged
} from "https://www.gstatic.com/firebasejs/12.1.0/firebase-auth.js";

import {
    doc,
    getDoc,
    collection,
    query,
    where,
    getDocs
} from "https://www.gstatic.com/firebasejs/12.1.0/firebase-firestore.js";


// ==========================================
// ELEMENTOS
// ==========================================

const cargando =
document.getElementById("cargando");

const errorElemento =
document.getElementById("error");

const contenido =
document.getElementById("contenido");

const clienteNombre =
document.getElementById("clienteNombre");

const datosCliente =
document.getElementById("datosCliente");

const observaciones =
document.getElementById("observaciones");

const acciones =
document.getElementById("acciones");


// ==========================================
// ID DEL CLIENTE
// ==========================================

const parametros =
new URLSearchParams(
    window.location.search
);

const clienteId =
parametros.get("id");


// ==========================================
// VARIABLES
// ==========================================

let usuarioActual = null;

let clienteActual = null;


// ==========================================
// ESCAPAR HTML
// ==========================================

function escaparHTML(valor){

    const div =
    document.createElement("div");

    div.textContent =
    valor ?? "";

    return div.innerHTML;

}


// ==========================================
// ERROR
// ==========================================

function mostrarError(mensaje){

    cargando.style.display =
    "none";

    contenido.style.display =
    "none";

    errorElemento.textContent =
    mensaje;

    errorElemento.style.display =
    "block";

}


// ==========================================
// VERIFICAR PROPIEDAD
// ==========================================

function perteneceAlUsuario(datos){

    if(!usuarioActual){
        return false;
    }

    const uid =
    usuarioActual.uid;

    return (
        datos.uid === uid ||
        datos.usuarioId === uid ||
        datos.empresaId === uid
    );

}


// ==========================================
// CARGAR CLIENTE
// ==========================================

async function cargarCliente(){

    if(!clienteId){

        mostrarError(
            "No se recibió el ID del cliente."
        );

        return;

    }


    try{

        const referencia =
        doc(
            db,
            "clientes",
            clienteId
        );


        const resultado =
        await getDoc(
            referencia
        );


        if(!resultado.exists()){

            mostrarError(
                "El cliente no existe."
            );

            return;

        }


        const datos =
        resultado.data();


        // ==================================
        // SEGURIDAD
        // ==================================

        if(!perteneceAlUsuario(datos)){

            mostrarError(
                "No tenés permiso para consultar este cliente."
            );

            return;

        }


        clienteActual = {

            id:
            resultado.id,

            ...datos

        };


        mostrarDatos();


        await cargarRelacionados();


        cargando.style.display =
        "none";

        contenido.style.display =
        "block";

    }
    catch(error){

        console.error(
            "Error cargando cliente:",
            error
        );

        mostrarError(
            "No se pudo cargar el cliente: " +
            error.message
        );

    }

}


// ==========================================
// MOSTRAR DATOS
// ==========================================

function mostrarDatos(){

    const datos =
    clienteActual;


    clienteNombre.textContent =
    datos.nombre ||
    datos.empresa ||
    datos.razonSocial ||
    "Cliente sin nombre";


    let html = "";


    html += `

        <div class="dato">
            🧾 <strong>CUIT:</strong>
            ${escaparHTML(
                datos.cuit || "-"
            )}
        </div>

    `;


    html += `

        <div class="dato">
            📞 <strong>Teléfono:</strong>
            ${escaparHTML(
                datos.telefono || "-"
            )}
        </div>

    `;


    html += `

        <div class="dato">
            📧 <strong>Email:</strong>
            ${escaparHTML(
                datos.email || "-"
            )}
        </div>

    `;


    html += `

        <div class="dato">
            📍 <strong>Dirección:</strong>
            ${escaparHTML(
                datos.direccion || "-"
            )}
        </div>

    `;


    let ubicacion = "-";


    if(
        datos.localidad ||
        datos.provincia
    ){

        ubicacion =
        (
            datos.localidad || ""
        ) +
        (
            datos.localidad &&
            datos.provincia
            ? ", "
            : ""
        ) +
        (
            datos.provincia || ""
        );

    }


    html += `

        <div class="dato">
            🗺️ <strong>Localidad:</strong>
            ${escaparHTML(
                ubicacion
            )}
        </div>

    `;


    datosCliente.innerHTML =
    html;


    if(
        datos.observaciones ||
        datos.notas
    ){

        observaciones.textContent =
        "📝 " +
        (
            datos.observaciones ||
            datos.notas
        );

        observaciones.style.display =
        "block";

    }


    // ======================================
    // ACCIONES
    // ======================================

    let botones = "";


    botones += `

        <a
            href="editar-cliente.html?id=${encodeURIComponent(clienteId)}"
            class="boton boton-editar"
        >
            ✏️ EDITAR CLIENTE
        </a>

    `;


    if(datos.telefono){

        const telefono =
        String(
            datos.telefono
        ).replace(
            /\D/g,
            ""
        );


        let telefonoWhatsApp =
        telefono;


        if(
            telefonoWhatsApp.startsWith("0")
        ){

            telefonoWhatsApp =
            telefonoWhatsApp.substring(1);

        }


        if(
            !telefonoWhatsApp.startsWith("54")
        ){

            telefonoWhatsApp =
            "54" +
            telefonoWhatsApp;

        }


        botones += `

            <a
                href="https://wa.me/${telefonoWhatsApp}"
                target="_blank"
                rel="noopener noreferrer"
                class="boton boton-whatsapp"
            >
                💬 WHATSAPP
            </a>

        `;


        botones += `

            <a
                href="tel:${telefono}"
                class="boton boton-telefono"
            >
                📞 LLAMAR
            </a>

        `;

    }


    acciones.innerHTML =
    botones;

}


// ==========================================
// CARGAR INFORMACIÓN RELACIONADA
// ==========================================

async function cargarRelacionados(){

    await Promise.all([

        cargarColeccion(
            "presupuestos",
            "presupuestos",
            "cantidadPresupuestos"
        ),

        cargarColeccion(
            "trabajos",
            "trabajos",
            "cantidadTrabajos"
        ),

        cargarColeccion(
            "citas",
            "citas",
            "cantidadCitas"
        ),

        cargarColeccion(
            "cobros",
            "cobros",
            "cantidadCobros"
        ),

        cargarColeccion(
            "documentos",
            "documentos",
            null
        )

    ]);

}


// ==========================================
// OBTENER REGISTROS DE UNA COLECCIÓN
// ==========================================

async function obtenerRegistros(
    nombreColeccion
){

    const referencia =
    collection(
        db,
        nombreColeccion
    );


    const resultados = new Map();


    // ======================================
    // BUSCAR POR UID
    // ======================================

    try{

        const q =
        query(
            referencia,
            where(
                "uid",
                "==",
                usuarioActual.uid
            ),
            where(
                "clienteId",
                "==",
                clienteId
            )
        );


        const snapshot =
        await getDocs(q);


        snapshot.forEach(
            documento => {

                resultados.set(
                    documento.id,
                    documento
                );

            }
        );

    }
    catch(error){

        console.warn(
            "Consulta uid no disponible en " +
            nombreColeccion,
            error
        );

    }


    // ======================================
    // BUSCAR POR usuarioId
    // ======================================

    try{

        const q =
        query(
            referencia,
            where(
                "usuarioId",
                "==",
                usuarioActual.uid
            ),
            where(
                "clienteId",
                "==",
                clienteId
            )
        );


        const snapshot =
        await getDocs(q);


        snapshot.forEach(
            documento => {

                resultados.set(
                    documento.id,
                    documento
                );

            }
        );

    }
    catch(error){

        console.warn(
            "Consulta usuarioId no disponible en " +
            nombreColeccion,
            error
        );

    }


    // ======================================
    // BUSCAR POR empresaId
    // ======================================

    try{

        const q =
        query(
            referencia,
            where(
                "empresaId",
                "==",
                usuarioActual.uid
            ),
            where(
                "clienteId",
                "==",
                clienteId
            )
        );


        const snapshot =
        await getDocs(q);


        snapshot.forEach(
            documento => {

                resultados.set(
                    documento.id,
                    documento
                );

            }
        );

    }
    catch(error){

        console.warn(
            "Consulta empresaId no disponible en " +
            nombreColeccion,
            error
        );

    }


    return Array.from(
        resultados.values()
    );

}


// ==========================================
// CARGAR COLECCIÓN
// ==========================================

async function cargarColeccion(
    nombreColeccion,
    elemento,
    contadorId
){

    const contenedor =
    document.getElementById(
        elemento
    );


    try{

        const registros =
        await obtenerRegistros(
            nombreColeccion
        );


        if(contadorId){

            document.getElementById(
                contadorId
            ).textContent =
            registros.length;

        }


        if(!registros.length){

            contenedor.innerHTML = `

                <div class="vacio">

                    No hay registros relacionados.

                </div>

            `;

            return;

        }


        contenedor.innerHTML =
        "";


        registros.forEach(
            function(documento){

                const datos =
                documento.data();


                const item =
                crearItem(
                    datos,
                    documento.id,
                    nombreColeccion
                );


                contenedor.appendChild(
                    item
                );

            }
        );


    }
    catch(error){

        console.error(
            "No se pudo cargar " +
            nombreColeccion,
            error
        );


        contenedor.innerHTML = `

            <div class="vacio">

                No hay información disponible.

            </div>

        `;

    }

}


// ==========================================
// CREAR ITEM
// ==========================================

function crearItem(
    datos,
    id,
    coleccion
){

    const item =
    document.createElement(
        "div"
    );


    item.className =
    "item";


    let titulo =
    datos.titulo ||
    datos.nombre ||
    datos.descripcion ||
    datos.concepto ||
    datos.numero ||
    "Registro";


    // ======================================
    // TÍTULO ESPECIAL PARA TRABAJOS
    // ======================================

    if(
        coleccion === "trabajos"
    ){

        titulo =
        datos.descripcion ||
        "Trabajo sin descripción";

    }


    const estado =
    datos.estado ||
    "";


    const importe =
    datos.total ??
    datos.importe ??
    datos.monto ??
    datos.precio ??
    null;


    let importeHTML =
    "";


    if(
        importe !== null &&
        importe !== ""
    ){

        const numero =
        Number(importe);


        if(
            !Number.isNaN(numero)
        ){

            importeHTML = `

                <div class="item-importe">

                    ${numero.toLocaleString(
                        "es-AR",
                        {
                            style:"currency",
                            currency:"ARS"
                        }
                    )}

                </div>

            `;

        }

    }


    let datosHTML = "";


    // ======================================
    // FECHA
    // ======================================

    if(datos.fecha){

        datosHTML += `

            <div class="item-dato">

                📅
                ${escaparHTML(
                    datos.fecha
                )}

            </div>

        `;

    }


    // ======================================
    // FECHA INICIO TRABAJO
    // ======================================

    if(
        coleccion === "trabajos" &&
        datos.fechaInicio
    ){

        datosHTML += `

            <div class="item-dato">

                📅 Inicio:
                ${escaparHTML(
                    datos.fechaInicio
                )}

            </div>

        `;

    }


    // ======================================
    // FECHA FIN TRABAJO
    // ======================================

    if(
        coleccion === "trabajos" &&
        datos.fechaFin
    ){

        datosHTML += `

            <div class="item-dato">

                🏁 Finalización:
                ${escaparHTML(
                    datos.fechaFin
                )}

            </div>

        `;

    }


    // ======================================
    // LUGAR TRABAJO
    // ======================================

    if(
        coleccion === "trabajos" &&
        datos.lugar
    ){

        datosHTML += `

            <div class="item-dato">

                📍 Lugar:
                ${escaparHTML(
                    datos.lugar
                )}

            </div>

        `;

    }


    // ======================================
    // ESTADO
    // ======================================

    if(estado){

        datosHTML += `

            <div class="item-dato">

                Estado:
                ${escaparHTML(
                    estado
                )}

            </div>

        `;

    }


    // ======================================
    // PRESUPUESTO ASOCIADO AL TRABAJO
    // ======================================

    if(
        coleccion === "trabajos" &&
        datos.presupuestoId
    ){

        datosHTML += `

            <div class="item-dato">

                💰 Presupuesto asociado:
                ${escaparHTML(
                    datos.presupuestoId
                )}

            </div>

        `;

    }


    // ======================================
    // OBSERVACIONES
    // ======================================

    if(
        datos.observaciones
    ){

        datosHTML += `

            <div class="item-dato">

                📝
                ${escaparHTML(
                    datos.observaciones
                )}

            </div>

        `;

    }


    item.innerHTML = `

        <div class="item-titulo">

            ${escaparHTML(
                titulo
            )}

        </div>

        ${datosHTML}

        ${importeHTML}

    `;


    return item;

}


// ==========================================
// AUTENTICACIÓN
// ==========================================

onAuthStateChanged(
    auth,
    async function(usuario){

        if(!usuario){

            window.location.replace(
                "login.html"
            );

            return;

        }


        usuarioActual =
        usuario;


        await cargarCliente();

    }
);
