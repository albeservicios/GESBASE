<!DOCTYPE html>
<html lang="es">

<head>

<meta charset="UTF-8">

<meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
>

<meta
    name="theme-color"
    content="#111827"
>

<title>Editar presupuesto - GESBASE</title>


<style>

*{
    box-sizing:border-box;
    margin:0;
    padding:0;
}

body{
    font-family:Arial,sans-serif;
    background:#f3f4f6;
    color:#111827;
}

.contenedor{
    max-width:650px;
    margin:auto;
    min-height:100vh;
    background:white;
}

header{
    background:#111827;
    color:white;
    padding:25px 20px;
}

header h1{
    font-size:25px;
}

header p{
    margin-top:6px;
    color:#d1d5db;
    font-size:14px;
}

main{
    padding:20px;
}

.estado{
    display:none;
    padding:14px;
    border-radius:10px;
    margin-bottom:18px;
    font-size:14px;
}

.estado-cargando{
    display:block;
    background:#f3f4f6;
    color:#4b5563;
}

.estado-error{
    display:block;
    background:#fee2e2;
    color:#991b1b;
}

.estado-exito{
    display:block;
    background:#dcfce7;
    color:#166534;
}

.campo{
    margin-bottom:18px;
}

label{
    display:block;
    font-size:14px;
    font-weight:bold;
    margin-bottom:7px;
}

input,
textarea,
select{
    width:100%;
    padding:13px;
    border:1px solid #d1d5db;
    border-radius:9px;
    font-size:16px;
    background:white;
}

textarea{
    min-height:110px;
    resize:vertical;
}

select{
    cursor:pointer;
}


/* =====================================
   INFORMACIÓN
===================================== */

.info{
    padding:16px;
    background:#f9fafb;
    border:1px solid #e5e7eb;
    border-radius:12px;
    margin-bottom:20px;
}

.info-titulo{
    font-weight:bold;
    margin-bottom:10px;
}

.info-dato{
    margin-top:5px;
    font-size:13px;
    color:#4b5563;
}


/* =====================================
   CLIENTE
===================================== */

.cliente-info{
    display:none;
    margin-top:10px;
    padding:14px;
    background:#f9fafb;
    border:1px solid #e5e7eb;
    border-radius:10px;
}

.cliente-dato{
    font-size:13px;
    color:#4b5563;
    margin-top:5px;
}


/* =====================================
   MATERIALES
===================================== */

.material-item{
    display:flex;
    gap:8px;
    align-items:center;
    margin-bottom:10px;
}

.material-tipo{
    flex:1;
}

.material-cantidad{
    width:110px;
}

.btn-quitar{
    width:45px;
    padding:13px 5px;
    margin:0;
    background:#dc2626;
    color:white;
    border:none;
    border-radius:9px;
    font-size:18px;
}

.btn-agregar{
    background:#2563eb;
    color:white;
}


/* =====================================
   RESUMEN
===================================== */

.resumen{
    margin-top:20px;
    padding:18px;
    background:#f3f4f6;
    border-radius:12px;
}

.resumen-linea{
    display:flex;
    justify-content:space-between;
    gap:10px;
    padding:8px 0;
    font-size:16px;
}

.resumen-total{
    border-top:2px solid #111827;
    margin-top:10px;
    padding-top:14px;
    font-size:21px;
    font-weight:bold;
}


/* =====================================
   BOTONES
===================================== */

button{
    width:100%;
    padding:15px;
    border:none;
    border-radius:10px;
    font-size:16px;
    font-weight:bold;
    cursor:pointer;
    margin-top:10px;
}

.guardar{
    background:#111827;
    color:white;
}

.volver{
    background:#e5e7eb;
    color:#111827;
}

button:disabled{
    opacity:.6;
}


/* =====================================
   MÓVIL
===================================== */

@media(max-width:480px){

    main{
        padding:15px;
    }

    .material-item{
        flex-wrap:wrap;
    }

    .material-tipo{
        width:100%;
        flex:none;
    }

    .material-cantidad{
        flex:1;
    }

}

</style>

</head>


<body>

<main>


<div

<!-- =====================================

<div class="info">

Empresa

<div class="info-dato">

</div>

<div class="info-dato">

Descripción del trabajo

Materiales

Viáticos

<!-- =====================================
     RESUMEN

<div class="resumen">

Materiales

<span>
Viáticos

TOTAL GENERAL

Volver a presupuestos

<script type="module">


// ==========================================
// FIREBASE
// ==========================================

import {
    auth,
    db
} from "./Js/firebase.js";


import {
    onAuthStateChanged
} from
"https://www.gstatic.com/firebasejs/12.1.0/firebase-auth.js";


import {
    collection,
    query,
    where,
    getDocs,
    doc,
    getDoc,
    updateDoc
} from
"https://www.gstatic.com/firebasejs/12.1.0/firebase-firestore.js";


// ==========================================
// ELEMENTOS
// ==========================================

const estado =
document.getElementById(
    "estado"
);

const empresaNombre =
document.getElementById(
    "empresaNombre"
);

const empresaCuit =
document.getElementById(
    "empresaCuit"
);

const empresaTelefono =
document.getElementById(
    "empresaTelefono"
);

const clienteSeleccionado =
document.getElementById(
    "clienteSeleccionado"
);

const clienteInfo =
document.getElementById(
    "clienteInfo"
);

const clienteManual =
document.getElementById(
    "clienteManual"
);

const clienteManualNombre =
document.getElementById(
    "clienteManualNombre"
);

const clienteCuit =
document.getElementById(
    "clienteCuit"
);

const clienteTelefono =
document.getElementById(
    "clienteTelefono"
);

const clienteEmail =
document.getElementById(
    "clienteEmail"
);

const clienteDireccion =
document.getElementById(
    "clienteDireccion"
);

const clienteLocalidad =
document.getElementById(
    "clienteLocalidad"
);

const numeroAgenda =
document.getElementById(
    "numeroAgenda"
);

const fecha =
document.getElementById(
    "fecha"
);

const lugarTrabajo =
document.getElementById(
    "lugarTrabajo"
);

const descripcion =
document.getElementById(
    "descripcion"
);

const listaMateriales =
document.getElementById(
    "listaMateriales"
);

const btnAgregar =
document.getElementById(
    "btnAgregar"
);

const materiales =
document.getElementById(
    "materiales"
);

const manoObra =
document.getElementById(
    "manoObra"
);

const viaticos =
document.getElementById(
    "viaticos"
);

const resumenMateriales =
document.getElementById(
    "resumenMateriales"
);

const resumenManoObra =
document.getElementById(
    "resumenManoObra"
);

const resumenViaticos =
document.getElementById(
    "resumenViaticos"
);

const total =
document.getElementById(
    "total"
);

const btnGuardar =
document.getElementById(
    "btnGuardar"
);

const btnVolver =
document.getElementById(
    "btnVolver"
);


// ==========================================
// VARIABLES
// ==========================================

let usuarioActual = null;

let presupuestoActual = null;

let clientes = [];

let clienteActual = null;


// ==========================================
// ID DEL PRESUPUESTO
// ==========================================

const parametros =
new URLSearchParams(
    window.location.search
);

const presupuestoId =
parametros.get("id");


// ==========================================
// ESTADO
// ==========================================

function mostrarEstado(
    texto,
    tipo
){

    estado.textContent =
    texto;

    estado.className =
    "estado estado-" +
    tipo;

}


// ==========================================
// DINERO
// ==========================================

function dinero(valor){

    return Number(
        valor || 0
    ).toLocaleString(
        "es-AR",
        {
            minimumFractionDigits:2,
            maximumFractionDigits:2
        }
    );

}


// ==========================================
// TOTAL
// ==========================================

function calcularTotal(){

    const m =
    Number(
        materiales.value
    ) || 0;


    const mo =
    Number(
        manoObra.value
    ) || 0;


    const v =
    Number(
        viaticos.value
    ) || 0;


    const resultado =
    m + mo + v;


    resumenMateriales.textContent =
    dinero(m);


    resumenManoObra.textContent =
    dinero(mo);


    resumenViaticos.textContent =
    dinero(v);


    total.textContent =
    dinero(resultado);


    return resultado;

}


materiales.addEventListener(
    "input",
    calcularTotal
);

manoObra.addEventListener(
    "input",
    calcularTotal
);

viaticos.addEventListener(
    "input",
    calcularTotal
);


// ==========================================
// AGREGAR MATERIAL
// ==========================================

function agregarMaterial(
    tipo = "",
    cantidad = 0
){

    const fila =
    document.createElement(
        "div"
    );


    fila.className =
    "material-item";


    fila.innerHTML = `

        <input
            type="text"
            class="material-tipo"
            placeholder="Tipo de material"
            value=""
        >

        <input
            type="number"
            class="material-cantidad"
            placeholder="Cantidad"
            min="0"
            step="1"
            value=""
        >

        <button
            type="button"
            class="btn-quitar"
        >
            ×
        </button>

    `;


    fila.querySelector(
        ".material-tipo"
    ).value =
    tipo;


    fila.querySelector(
        ".material-cantidad"
    ).value =
    cantidad;


    fila.querySelector(
        ".btn-quitar"
    ).addEventListener(
        "click",
        function(){

            fila.remove();

        }
    );


    listaMateriales.appendChild(
        fila
    );

}


btnAgregar.addEventListener(
    "click",
    function(){

        agregarMaterial();

    }
);


// ==========================================
// OBTENER MATERIALES
// ==========================================

function obtenerMateriales(){

    const filas =
    listaMateriales.querySelectorAll(
        ".material-item"
    );


    const lista = [];


    filas.forEach(
        function(fila){

            const tipo =
            fila.querySelector(
                ".material-tipo"
            ).value.trim();


            const cantidad =
            Number(
                fila.querySelector(
                    ".material-cantidad"
                ).value
            ) || 0;


            if(tipo){

                lista.push({

                    tipo:
                    tipo,

                    cantidad:
                    cantidad

                });

            }

        }
    );


    return lista;

}


// ==========================================
// MOSTRAR CLIENTE
// ==========================================

function mostrarCliente(
    datos
){

    clienteCuit.textContent =
    datos.cuit || "-";


    clienteTelefono.textContent =
    datos.telefono || "-";


    clienteEmail.textContent =
    datos.email || "-";


    clienteDireccion.textContent =
    datos.direccion || "-";


    const localidad =
    datos.localidad || "";


    const provincia =
    datos.provincia || "";


    clienteLocalidad.textContent =
    localidad +
    (
        localidad &&
        provincia
        ? ", "
        : ""
    ) +
    provincia;


    clienteInfo.style.display =
    "block";

}


// ==========================================
// CARGAR CLIENTES
// ==========================================

async function cargarClientes(){

    const referencia =
    collection(
        db,
        "clientes"
    );


    const consulta =
    query(
        referencia,
        where(
            "uid",
            "==",
            usuarioActual.uid
        )
    );


    const resultado =
    await getDocs(
        consulta
    );


    clientes = [];


    resultado.forEach(
        function(documento){

            clientes.push({

                id:
                documento.id,

                datos:
                documento.data()

            });

        }
    );


    clientes.sort(
        function(a,b){

            const aNombre =
            String(
                a.datos.nombre ||
                a.datos.empresa ||
                ""
            ).toLowerCase();


            const bNombre =
            String(
                b.datos.nombre ||
                b.datos.empresa ||
                ""
            ).toLowerCase();


            return aNombre.localeCompare(
                bNombre,
                "es"
            );

        }
    );


    clienteSeleccionado.innerHTML =
    "";


    const inicial =
    document.createElement(
        "option"
    );

    inicial.value =
    "";

    inicial.textContent =
    "Seleccionar cliente...";

    clienteSeleccionado.appendChild(
        inicial
    );


    clientes.forEach(
        function(item){

            const opcion =
            document.createElement(
                "option"
            );


            opcion.value =
            item.id;


            opcion.textContent =
            item.datos.nombre ||
            item.datos.empresa ||
            "Cliente sin nombre";


            clienteSeleccionado.appendChild(
                opcion
            );

        }
    );


    const manual =
    document.createElement(
        "option"
    );

    manual.value =
    "__manual__";

    manual.textContent =
    "✏️ Ingresar cliente manualmente";

    clienteSeleccionado.appendChild(
        manual
    );

}


// ==========================================
// CAMBIO DE CLIENTE
// ==========================================

clienteSeleccionado.addEventListener(
    "change",
    function(){

        const id =
        clienteSeleccionado.value;


        clienteActual =
        null;


        clienteInfo.style.display =
        "none";


        clienteManual.style.display =
        "none";


        if(
            id === "__manual__"
        ){

            clienteManual.style.display =
            "block";

            clienteManualNombre.focus();

            return;

        }


        const encontrado =
        clientes.find(
            function(item){

                return item.id === id;

            }
        );


        if(!encontrado){

            return;

        }


        clienteActual =
        encontrado;


        mostrarCliente(
            encontrado.datos
        );

    }
);


// ==========================================
// CARGAR PRESUPUESTO
// ==========================================

async function cargarPresupuesto(){

    if(!presupuestoId){

        mostrarEstado(
            "No se indicó el ID del presupuesto.",
            "error"
        );

        return false;

    }


    const referencia =
    doc(
        db,
        "presupuestos",
        presupuestoId
    );


    const documento =
    await getDoc(
        referencia
    );


    if(
        !documento.exists()
    ){

        mostrarEstado(
            "El presupuesto no existe.",
            "error"
        );

        return false;

    }


    const datos =
    documento.data();


    if(
        datos.uid !==
        usuarioActual.uid
    ){

        mostrarEstado(
            "No tenés permiso para editar este presupuesto.",
            "error"
        );

        return false;

    }


    presupuestoActual =
    datos;


    /*
     * Empresa
     */

    empresaNombre.textContent =
    datos.empresaNombre ||
    "Sin informar";


    empresaCuit.textContent =
    datos.empresaCuit ||
    "-";


    empresaTelefono.textContent =
    datos.empresaTelefono ||
    "-";


    /*
     * Datos generales
     */

    numeroAgenda.value =
    datos.numeroAgenda ||
    "";


    fecha.value =
    datos.fecha ||
    "";


    lugarTrabajo.value =
    datos.lugarTrabajo ||
    "";


    descripcion.value =
    datos.descripcion ||
    "";


    materiales.value =
    datos.materiales ||
    0;


    manoObra.value =
    datos.manoObra ||
    0;


    viaticos.value =
    datos.viaticos ||
    0;


    /*
     * Materiales
     */

    listaMateriales.innerHTML =
    "";


    if(
        Array.isArray(
            datos.materialesLista
        )
    ){

        datos.materialesLista.forEach(
            function(material){

                agregarMaterial(

                    material.tipo ||
                    "",

                    material.cantidad ||
                    0

                );

            }
        );

    }


    /*
     * Cliente guardado
     */

    if(
        datos.clienteId
    ){

        const encontrado =
        clientes.find(
            function(item){

                return item.id ===
                datos.clienteId;

            }
        );


        if(encontrado){

            clienteActual =
            encontrado;


            clienteSeleccionado.value =
            datos.clienteId;


            mostrarCliente(
                encontrado.datos
            );

        }else{

            /*
             * El cliente pudo haber sido
             * eliminado después de crear
             * el presupuesto.
             */

            clienteSeleccionado.value =
            "__manual__";


            clienteManual.style.display =
            "block";


            clienteManualNombre.value =
            datos.cliente ||
            "";

        }

    }else{

        clienteSeleccionado.value =
        "__manual__";


        clienteManual.style.display =
        "block";


        clienteManualNombre.value =
        datos.cliente ||
        "";

    }


    calcularTotal();


    mostrarEstado(
        "Presupuesto cargado correctamente.",
        "exito"
    );


    return true;

}


// ==========================================
// GUARDAR CAMBIOS
// ==========================================

btnGuardar.addEventListener(
    "click",
    async function(){

        if(
            !presupuestoActual
        ){

            mostrarEstado(
                "Todavía no se cargó el presupuesto.",
                "error"
            );

            return;

        }


        let datosCliente = null;

        let clienteId = "";


        /*
         * Cliente registrado
         */

        if(
            clienteSeleccionado.value &&
            clienteSeleccionado.value !==
            "__manual__"
        ){

            const encontrado =
            clientes.find(
                function(item){

                    return item.id ===
                    clienteSeleccionado.value;

                }
            );


            if(!encontrado){

                mostrarEstado(
                    "No se encontró el cliente seleccionado.",
                    "error"
                );

                return;

            }


            datosCliente =
            encontrado.datos;


            clienteId =
            encontrado.id;

        }


        /*
         * Cliente manual
         */

        else if(
            clienteSeleccionado.value ===
            "__manual__"
        ){

            const nombre =
            clienteManualNombre.value.trim();


            if(!nombre){

                mostrarEstado(
                    "Ingresá el nombre del cliente.",
                    "error"
                );

                clienteManualNombre.focus();

                return;

            }


            datosCliente = {

                nombre:
                nombre,

                cuit:"",
                telefono:"",
                email:"",
                direccion:"",
                localidad:"",
                provincia:""

            };

        }


        else{

            mostrarEstado(
                "Seleccioná un cliente.",
                "error"
            );

            return;

        }


        if(
            !fecha.value
        ){

            mostrarEstado(
                "Ingresá la fecha.",
                "error"
            );

            fecha.focus();

            return;

        }


        if(
            !lugarTrabajo.value.trim()
        ){

            mostrarEstado(
                "Ingresá el lugar de trabajo.",
                "error"
            );

            lugarTrabajo.focus();

            return;

        }


        if(
            !descripcion.value.trim()
        ){

            mostrarEstado(
                "Ingresá la descripción del trabajo.",
                "error"
            );

            descripcion.focus();

            return;

        }


        const materialesLista =
        obtenerMateriales();


        const valorMateriales =
        Number(
            materiales.value
        ) || 0;


        const valorManoObra =
        Number(
            manoObra.value
        ) || 0;


        const valorViaticos =
        Number(
            viaticos.value
        ) || 0;


        const totalGeneral =
        valorMateriales +
        valorManoObra +
        valorViaticos;


        btnGuardar.disabled =
        true;


        btnGuardar.textContent =
        "Guardando cambios...";


        try{

            const referencia =
            doc(
                db,
                "presupuestos",
                presupuestoId
            );


            await updateDoc(
                referencia,
                {

                    /*
                     * CLIENTE
                     */

                    clienteId:
                    clienteId,

                    cliente:
                    datosCliente.nombre ||
                    datosCliente.empresa ||
                    "",

                    clienteCuit:
                    datosCliente.cuit ||
                    "",

                    clienteTelefono:
                    datosCliente.telefono ||
                    "",

                    clienteEmail:
                    datosCliente.email ||
                    "",

                    clienteDireccion:
                    datosCliente.direccion ||
                    "",

                    clienteLocalidad:
                    datosCliente.localidad ||
                    "",

                    clienteProvincia:
                    datosCliente.provincia ||
                    "",


                    /*
                     * PRESUPUESTO
                     */

                    numeroAgenda:
                    numeroAgenda.value.trim(),

                    fecha:
                    fecha.value,

                    lugarTrabajo:
                    lugarTrabajo.value.trim(),

                    descripcion:
                    descripcion.value.trim(),

                    materialesLista:
                    materialesLista,

                    materiales:
                    valorMateriales,

                    manoObra:
                    valorManoObra,

                    viaticos:
                    valorViaticos,

                    total:
                    totalGeneral

                }
            );


            mostrarEstado(
                "Presupuesto actualizado correctamente.",
                "exito"
            );


            btnGuardar.disabled =
            false;


            btnGuardar.textContent =
            "Guardar cambios";


            setTimeout(
                function(){

                    window.location.href =
                    "presupuestos.html";

                },
                900
            );

        }
        catch(error){

            console.error(
                "Error actualizando:",
                error
            );


            mostrarEstado(
                "No se pudo actualizar: " +
                error.message,
                "error"
            );


            btnGuardar.disabled =
            false;


            btnGuardar.textContent =
            "Guardar cambios";

        }

    }
);


// ==========================================
// VOLVER
// ==========================================

btnVolver.addEventListener(
    "click",
    function(){

        window.location.href =
        "presupuestos.html";

    }
);


// ==========================================
// AUTENTICACIÓN
// ==========================================

onAuthStateChanged(
    auth,
    async function(usuario){

        if(!usuario){

            window.location.replace(
                "login.html"
            );

            return;

        }


        usuarioActual =
        usuario;


        try{

            await cargarClientes();

            await cargarPresupuesto();

        }
        catch(error){

            console.error(
                error
            );

            mostrarEstado(
                "Error cargando el módulo: " +
                error.message,
                "error"
            );

        }

    }
);

</script>
