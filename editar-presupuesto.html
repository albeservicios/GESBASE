<!DOCTYPE html>
<html lang="es">

<head>

<meta charset="UTF-8">

<meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
>

<meta
    name="theme-color"
    content="#111827"
>

<title>Editar presupuesto - GESBASE</title>

<style>

*{
    box-sizing:border-box;
    margin:0;
    padding:0;
}

body{
    font-family:Arial,sans-serif;
    background:#f3f4f6;
    color:#111827;
}

.contenedor{
    max-width:650px;
    margin:auto;
    min-height:100vh;
    background:white;
}

header{
    background:#111827;
    color:white;
    padding:25px 20px;
}

header h1{
    font-size:25px;
}

header p{
    margin-top:6px;
    color:#d1d5db;
    font-size:14px;
}

main{
    padding:20px;
}

.estado{
    display:none;
    padding:14px;
    border-radius:10px;
    margin-bottom:18px;
    font-size:14px;
    line-height:1.4;
}

.estado-cargando{
    display:block;
    background:#f3f4f6;
    color:#4b5563;
}

.estado-error{
    display:block;
    background:#fee2e2;
    color:#991b1b;
}

.estado-exito{
    display:block;
    background:#dcfce7;
    color:#166534;
}

.campo{
    margin-bottom:18px;
}

label{
    display:block;
    font-size:14px;
    font-weight:bold;
    margin-bottom:7px;
}

input,
textarea,
select{
    width:100%;
    padding:13px;
    border:1px solid #d1d5db;
    border-radius:9px;
    font-size:16px;
    background:white;
    color:#111827;
    outline:none;
}

input:focus,
textarea:focus,
select:focus{
    border-color:#2563eb;
}

textarea{
    min-height:110px;
    resize:vertical;
}

select{
    cursor:pointer;
}


/* =====================================
   INFORMACIÓN EMPRESA
===================================== */

.info{
    padding:16px;
    background:#f9fafb;
    border:1px solid #e5e7eb;
    border-radius:12px;
    margin-bottom:20px;
}

.info-titulo{
    font-weight:bold;
    margin-bottom:10px;
}

.info-dato{
    margin-top:5px;
    font-size:13px;
    color:#4b5563;
}


/* =====================================
   CLIENTE
===================================== */

.cliente-info{
    display:none;
    margin-top:10px;
    padding:14px;
    background:#f9fafb;
    border:1px solid #e5e7eb;
    border-radius:10px;
}

.cliente-dato{
    font-size:13px;
    color:#4b5563;
    margin-top:5px;
}


/* =====================================
   CLIENTE MANUAL
===================================== */

.cliente-manual{
    margin-top:10px;
    padding:14px;
    background:#eff6ff;
    border:1px solid #bfdbfe;
    border-radius:10px;
}


/* =====================================
   MATERIALES
===================================== */

.material-item{
    display:flex;
    gap:8px;
    align-items:center;
    margin-bottom:10px;
}

.material-tipo{
    flex:1;
}

.material-cantidad{
    width:110px;
}

.btn-quitar{
    width:45px;
    padding:13px 5px;
    margin:0;
    background:#dc2626;
    color:white;
    border:none;
    border-radius:9px;
    font-size:18px;
    cursor:pointer;
}

.btn-agregar{
    background:#2563eb;
    color:white;
}


/* =====================================
   RESUMEN
===================================== */

.resumen{
    margin-top:20px;
    padding:18px;
    background:#f3f4f6;
    border-radius:12px;
}

.resumen-linea{
    display:flex;
    justify-content:space-between;
    gap:10px;
    padding:8px 0;
    font-size:16px;
}

.resumen-total{
    border-top:2px solid #111827;
    margin-top:10px;
    padding-top:14px;
    font-size:21px;
    font-weight:bold;
}


/* =====================================
   BOTONES
===================================== */

button{
    width:100%;
    padding:15px;
    border:none;
    border-radius:10px;
    font-size:16px;
    font-weight:bold;
    cursor:pointer;
    margin-top:10px;
}

.guardar{
    background:#111827;
    color:white;
}

.volver{
    background:#e5e7eb;
    color:#111827;
}

button:disabled{
    opacity:.6;
    cursor:not-allowed;
}


/* =====================================
   MÓVIL
===================================== */

@media(max-width:480px){

    main{
        padding:15px;
    }

    .material-item{
        flex-wrap:wrap;
    }

    .material-tipo{
        width:100%;
        flex:none;
    }

    .material-cantidad{
        flex:1;
    }

}

</style>

</head>


<body>


<div class="contenedor">


<header>

<h1>
Editar presupuesto
</h1>

<p>
GESBASE
</p>

</header>


<main>


<div
    id="estado"
    class="estado estado-cargando"
>
Cargando presupuesto...
</div>


<!-- =====================================
     EMPRESA
===================================== -->

<div class="info">

<div class="info-titulo">
Empresa
</div>

<div class="info-dato">
<strong>Empresa:</strong>
<span id="empresaNombre">-</span>
</div>

<div class="info-dato">
<strong>CUIT:</strong>
<span id="empresaCuit">-</span>
</div>

<div class="info-dato">
<strong>Teléfono:</strong>
<span id="empresaTelefono">-</span>
</div>

</div>


<!-- =====================================
     CLIENTE
===================================== -->

<div class="campo">

<label for="clienteSeleccionado">
Cliente
</label>

<select id="clienteSeleccionado">

<option value="">
Cargando clientes...
</option>

</select>


<div
    id="clienteInfo"

>

<div class="cliente-dato">
<strong>CUIT:</strong>
<span id="clienteCuit">-</span>
</div>

<div class="cliente-dato">
<strong>Teléfono:</strong>
<span id="clienteTelefono">-</span>
</div>

<div class="cliente-dato">
<strong>Email:</strong>
<span id="clienteEmail">-</span>
</div>

<div class="cliente-dato">
<strong>Dirección:</strong>
<span id="clienteDireccion">-</span>
</div>

<div class="cliente-dato">
<strong>Localidad:</strong>
<span id="clienteLocalidad">-</span>

</div>


<div
    id="clienteManual"
    class="cliente-manual"

>

<label for="clienteManualNombre">
Nombre del cliente
</label>

<input
    type="text"
    id="clienteManualNombre"
    placeholder="Nombre del cliente"
>

</div>

</div>


<!-- =====================================
     AGENDA
===================================== -->

<div class="campo">

<label for="numeroAgenda">
N.º de agenda
</label>

<input
    type="text"
    id="numeroAgenda"
>

</div>


<!-- =====================================
     FECHA
===================================== -->

<div class="campo">

<label for="fecha">
Fecha
</label>

<input
    type="date"
    id="fecha"
>

</div>


<!-- =====================================
     LUGAR
===================================== -->

<div class="campo">

<label for="lugarTrabajo">
Lugar de trabajo
</label>

<input
    type="text"
    id="lugarTrabajo"
>

</div>


<!-- =====================================
     DESCRIPCIÓN
===================================== -->

<div class="campo">

<label for="descripcion">
Descripción del trabajo
</label>

<textarea
    id="descripcion"
></textarea>

</div>


<!-- =====================================
     MATERIALES
===================================== -->

<div class="campo">

<label>
Materiales
</label>

<div id="listaMateriales"></div>

<button
    type="button"
    class="btn-agregar"
    id="btnAgregar"
>
+ Agregar material
</button>

</div>


<!-- =====================================
     VALORES
===================================== -->

<div class="campo">

<label for="materiales">
Valor total de materiales
</label>

<input
    type="number"
    id="materiales"
    min="0"
    step="0.01"
>

</div>


<div class="campo">

<label for="manoObra">
Mano de obra
</label>

<input
    type="number"
    id="manoObra"
    min="0"
    step="0.01"
>

</div>


<div class="campo">

<label for="viaticos">
Viáticos
</label>

<input
    type="number"
    id="viaticos"
    min="0"
    step="0.01"
>

</div>


<!-- =====================================
     RESUMEN
===================================== -->

<div class="resumen">

<div class="resumen-linea">

<span>
Materiales
</span>

<strong>
$ <span id="resumenMateriales">0,00</span>
</strong>

</div>


<div class="resumen-linea">

<span>
Mano de obra
</span>

<strong>
$ <span id="resumenManoObra">0,00</span>
</strong>

</div>


<div class="resumen-linea">

<span>
Viáticos
</span>

<strong>
$ <span id="resumenViaticos">0,00</span>
</strong>

</div>


<div class="resumen-linea resumen-total">

<span>
TOTAL GENERAL
</span>

<strong>
$ <span id="total">0,00</span>
</strong>

</div>

</div>


<!-- =====================================
     BOTONES
===================================== -->

<button
    type="button"
    id="btnGuardar"
    class="guardar"
>
💾 Guardar cambios
</button>


<button
    type="button"
    id="btnVolver"
    class="volver"
>
⬅️ Volver a presupuestos
</button>


</main>

</div>


<script type="module">


// ==========================================
// FIREBASE
// ==========================================

import {
    auth,
    db
} from "./Js/firebase.js";


import {
    onAuthStateChanged
} from
"https://www.gstatic.com/firebasejs/12.1.0/firebase-auth.js";


import {
    collection,
    getDocs,
    doc,
    getDoc,
    updateDoc,
    serverTimestamp
} from
"https://www.gstatic.com/firebasejs/12.1.0/firebase-firestore.js";


// ==========================================
// ELEMENTOS
// ==========================================

const estado =
document.getElementById("estado");

const empresaNombre =
document.getElementById("empresaNombre");

const empresaCuit =
document.getElementById("empresaCuit");

const empresaTelefono =
document.getElementById("empresaTelefono");

const clienteSeleccionado =
document.getElementById("clienteSeleccionado");

const clienteInfo =
document.getElementById("clienteInfo");

const clienteManual =
document.getElementById("clienteManual");

const clienteManualNombre =
document.getElementById("clienteManualNombre");

const clienteCuit =
document.getElementById("clienteCuit");

const clienteTelefono =
document.getElementById("clienteTelefono");

const clienteEmail =
document.getElementById("clienteEmail");

const clienteDireccion =
document.getElementById("clienteDireccion");

const clienteLocalidad =
document.getElementById("clienteLocalidad");

const numeroAgenda =
document.getElementById("numeroAgenda");

const fecha =
document.getElementById("fecha");

const lugarTrabajo =
document.getElementById("lugarTrabajo");

const descripcion =
document.getElementById("descripcion");

const listaMateriales =
document.getElementById("listaMateriales");

const btnAgregar =
document.getElementById("btnAgregar");

const materiales =
document.getElementById("materiales");

const manoObra =
document.getElementById("manoObra");

const viaticos =
document.getElementById("viaticos");

const resumenMateriales =
document.getElementById("resumenMateriales");

const resumenManoObra =
document.getElementById("resumenManoObra");

const resumenViaticos =
document.getElementById("resumenViaticos");

const total =
document.getElementById("total");

const btnGuardar =
document.getElementById("btnGuardar");

const btnVolver =
document.getElementById("btnVolver");


// ==========================================
// VARIABLES
// ==========================================

let usuarioActual = null;

let presupuestoActual = null;

let clientes = [];


// ==========================================
// ID PRESUPUESTO
// ==========================================

const parametros =
new URLSearchParams(
    window.location.search
);

const presupuestoId =
parametros.get("id");


// ==========================================
// ESTADO
// ==========================================

function mostrarEstado(
    texto,
    tipo
){

    estado.textContent =
    texto;

    estado.className =
    "estado estado-" +
    tipo;

}


// ==========================================
// DINERO
// ==========================================

function dinero(valor){

    return Number(
        valor || 0
    ).toLocaleString(
        "es-AR",
        {
            minimumFractionDigits:2,
            maximumFractionDigits:2
        }
    );

}


// ==========================================
// ESCAPAR TEXTO
// ==========================================

function escapar(valor){

    return String(
        valor ?? ""
    );

}


// ==========================================
// TOTAL
// ==========================================

function calcularTotal(){

    const m =
    Number(materiales.value) || 0;

    const mo =
    Number(manoObra.value) || 0;

    const v =
    Number(viaticos.value) || 0;

    const resultado =
    m + mo + v;

    resumenMateriales.textContent =
    dinero(m);

    resumenManoObra.textContent =
    dinero(mo);

    resumenViaticos.textContent =
    dinero(v);

    total.textContent =
    dinero(resultado);

    return resultado;

}


materiales.addEventListener(
    "input",
    calcularTotal
);

manoObra.addEventListener(
    "input",
    calcularTotal
);

viaticos.addEventListener(
    "input",
    calcularTotal
);


// ==========================================
// AGREGAR MATERIAL
// ==========================================

function agregarMaterial(
    tipo = "",
    cantidad = ""
){

    const fila =
    document.createElement("div");

    fila.className =
    "material-item";


    const inputTipo =
    document.createElement("input");

    inputTipo.type =
    "text";

    inputTipo.className =
    "material-tipo";

    inputTipo.placeholder =
    "Tipo de material";

    inputTipo.value =
    tipo;


    const inputCantidad =
    document.createElement("input");

    inputCantidad.type =
    "number";

    inputCantidad.className =
    "material-cantidad";

    inputCantidad.placeholder =
    "Cantidad";

    inputCantidad.min =
    "0";

    inputCantidad.step =
    "1";

    inputCantidad.value =
    cantidad;


    const boton =
    document.createElement("button");

    boton.type =
    "button";

    boton.className =
    "btn-quitar";

    boton.textContent =
    "×";


    boton.addEventListener(
        "click",
        function(){

            fila.remove();

        }
    );


    fila.appendChild(
        inputTipo
    );

    fila.appendChild(
        inputCantidad
    );

    fila.appendChild(
        boton
    );


    listaMateriales.appendChild(
        fila
    );

}


btnAgregar.addEventListener(
    "click",
    function(){

        agregarMaterial();

    }
);


// ==========================================
// OBTENER MATERIALES
// ==========================================

function obtenerMateriales(){

    const filas =
    listaMateriales.querySelectorAll(
        ".material-item"
    );

    const lista = [];


    filas.forEach(
        function(fila){

            const tipo =
            fila.querySelector(
                ".material-tipo"
            ).value.trim();


            const cantidad =
            Number(
                fila.querySelector(
                    ".material-cantidad"
                ).value
            ) || 0;


            if(tipo){

                lista.push({

                    tipo:
                    tipo,

                    cantidad:
                    cantidad

                });

            }

        }
    );


    return lista;

}


// ==========================================
// MOSTRAR CLIENTE
// ==========================================

function mostrarCliente(
    datos
){

    clienteCuit.textContent =
    datos.cuit ||
    "-";


    clienteTelefono.textContent =
    datos.telefono ||
    "-";


    clienteEmail.textContent =
    datos.email ||
    "-";


    clienteDireccion.textContent =
    datos.direccion ||
    "-";


    const localidad =
    datos.localidad ||
    "";


    const provincia =
    datos.provincia ||
    "";


    clienteLocalidad.textContent =
    localidad +
    (
        localidad &&
        provincia
        ? ", "
        : ""
    ) +
    provincia;


    clienteInfo.style.display =
    "block";

}


// ==========================================
// NOMBRE CLIENTE
// ==========================================

function obtenerNombreCliente(
    datos
){

    return (
        datos.nombre ||
        datos.empresa ||
        datos.razonSocial ||
        datos.razon_social ||
        "Cliente sin nombre"
    );

}


// ==========================================
// CARGAR CLIENTES
// ==========================================

async function cargarClientes(){

    const snapshot =
    await getDocs(
        collection(
            db,
            "clientes"
        )
    );


    clientes = [];


    snapshot.forEach(
        function(documento){

            const datos =
            documento.data();


            /*
             * Aceptamos clientes vinculados
             * mediante uid o empresaId.
             */

            const pertenece =
            datos.uid ===
            usuarioActual.uid
            ||
            datos.empresaId ===
            usuarioActual.uid;


            if(!pertenece){

                return;

            }


            clientes.push({

                id:
                documento.id,

                datos:
                datos

            });

        }
    );


    clientes.sort(
        function(a,b){

            return obtenerNombreCliente(
                a.datos
            ).localeCompare(
                obtenerNombreCliente(
                    b.datos
                ),
                "es"
            );

        }
    );


    clienteSeleccionado.innerHTML =
    "";


    const inicial =
    document.createElement(
        "option"
    );

    inicial.value =
    "";

    inicial.textContent =
    "Seleccionar cliente...";

    clienteSeleccionado.appendChild(
        inicial
    );


    clientes.forEach(
        function(item){

            const opcion =
            document.createElement(
                "option"
            );

            opcion.value =
            item.id;

            opcion.textContent =
            obtenerNombreCliente(
                item.datos
            );

            clienteSeleccionado.appendChild(
                opcion
            );

        }
    );


    const manual =
    document.createElement(
        "option"
    );

    manual.value =
    "__manual__";

    manual.textContent =
    "✏️ Ingresar cliente manualmente";

    clienteSeleccionado.appendChild(
        manual
    );

}


// ==========================================
// CAMBIO CLIENTE
// ==========================================

clienteSeleccionado.addEventListener(
    "change",
    function(){

        const id =
        clienteSeleccionado.value;


        clienteInfo.style.display =
        "none";

        clienteManual.style.display =
        "none";


        if(
            id === "__manual__"
        ){

            clienteManual.style.display =
            "block";

            clienteManualNombre.focus();

            return;

        }


        const encontrado =
        clientes.find(
            function(item){

                return item.id === id;

            }
        );


        if(!encontrado){

            return;

        }


        mostrarCliente(
            encontrado.datos
        );

    }
);


// ==========================================
// CARGAR PRESUPUESTO
// ==========================================

async function cargarPresupuesto(){

    if(!presupuestoId){

        mostrarEstado(
            "No se indicó el ID del presupuesto.",
            "error"
        );

        return false;

    }


    const referencia =
    doc(
        db,
        "presupuestos",
        presupuestoId
    );


    const documento =
    await getDoc(
        referencia
    );


    if(!documento.exists()){

        mostrarEstado(
            "El presupuesto no existe.",
            "error"
        );

        return false;

    }


    const datos =
    documento.data();


    /*
     * ======================================
     * SEGURIDAD
     * ======================================
     *
     * El presupuesto puede estar vinculado
     * mediante uid, empresaId o usuarioId.
     */

    const pertenece =
    datos.uid ===
    usuarioActual.uid
    ||
    datos.usuarioId ===
    usuarioActual.uid
    ||
    datos.empresaId ===
    usuarioActual.uid;


    if(!pertenece){

        mostrarEstado(
            "No tenés permiso para editar este presupuesto.",
            "error"
        );

        return false;

    }


    presupuestoActual =
    datos;


    // ======================================
    // EMPRESA
    // ======================================

    empresaNombre.textContent =
    datos.empresaNombre ||
    datos.empresa ||
    "Sin informar";


    empresaCuit.textContent =
    datos.empresaCuit ||
    datos.cuitEmpresa ||
    "-";


    empresaTelefono.textContent =
    datos.empresaTelefono ||
    datos.telefonoEmpresa ||
    "-";


    // ======================================
    // DATOS GENERALES
    // ======================================

    numeroAgenda.value =
    datos.numeroAgenda ||
    datos.numero ||
    "";


    fecha.value =
    datos.fecha ||
    "";


    lugarTrabajo.value =
    datos.lugarTrabajo ||
    datos.lugar ||
    "";


    descripcion.value =
    datos.descripcion ||
    "";


    materiales.value =
    Number(
        datos.materiales || 0
    );


    manoObra.value =
    Number(
        datos.manoObra || 0
    );


    viaticos.value =
    Number(
        datos.viaticos || 0
    );


    // ======================================
    // MATERIALES
    // ======================================

    listaMateriales.innerHTML =
    "";


    if(
        Array.isArray(
            datos.materialesLista
        )
    ){

        datos.materialesLista.forEach(
            function(material){

                agregarMaterial(

                    material.tipo ||
                    "",

                    material.cantidad ??
                    ""

                );

            }
        );

    }


    // ======================================
    // CLIENTE
    // ======================================

    if(
        datos.clienteId
    ){

        const encontrado =
        clientes.find(
            function(item){

                return item.id ===
                datos.clienteId;

            }
        );


        if(encontrado){

            clienteSeleccionado.value =
            datos.clienteId;


            mostrarCliente(
                encontrado.datos
            );

        }
        else{

            clienteSeleccionado.value =
            "__manual__";

            clienteManual.style.display =
            "block";

            clienteManualNombre.value =
            datos.cliente ||
            datos.clienteNombre ||
            "";

        }

    }
    else{

        clienteSeleccionado.value =
        "__manual__";

        clienteManual.style.display =
        "block";

        clienteManualNombre.value =
        datos.cliente ||
        datos.clienteNombre ||
        "";

    }


    calcularTotal();


    mostrarEstado(
        "Presupuesto cargado correctamente.",
        "exito"
    );


    return true;

}


// ==========================================
// GUARDAR CAMBIOS
// ==========================================

btnGuardar.addEventListener(
    "click",
    async function(){

        if(!usuarioActual){

            mostrarEstado(
                "No hay una sesión activa.",
                "error"
            );

            return;

        }


        if(!presupuestoActual){

            mostrarEstado(
                "Todavía no se cargó el presupuesto.",
                "error"
            );

            return;

        }


        let datosCliente = null;

        let clienteId = "";


        // ==================================
        // CLIENTE REGISTRADO
        // ==================================

        if(
            clienteSeleccionado.value &&
            clienteSeleccionado.value !==
            "__manual__"
        ){

            const encontrado =
            clientes.find(
                function(item){

                    return item.id ===
                    clienteSeleccionado.value;

                }
            );


            if(!encontrado){

                mostrarEstado(
                    "No se encontró el cliente seleccionado.",
                    "error"
                );

                return;

            }


            datosCliente =
            encontrado.datos;

            clienteId =
            encontrado.id;

        }


        // ==================================
        // CLIENTE MANUAL
        // ==================================

        else if(
            clienteSeleccionado.value ===
            "__manual__"
        ){

            const nombre =
            clienteManualNombre.value.trim();


            if(!nombre){

                mostrarEstado(
                    "Ingresá el nombre del cliente.",
                    "error"
                );

                clienteManualNombre.focus();

                return;

            }


            datosCliente = {

                nombre:
                nombre,

                cuit:
                "",

                telefono:
                "",

                email:
                "",

                direccion:
                "",

                localidad:
                "",

                provincia:
                ""

            };

        }


        else{

            mostrarEstado(
                "Seleccioná un cliente.",
                "error"
            );

            return;

        }


        // ==================================
        // VALIDACIONES
        // ==================================

        if(!fecha.value){

            mostrarEstado(
                "Ingresá la fecha.",
                "error"
            );

            fecha.focus();

            return;

        }


        if(
            !lugarTrabajo.value.trim()
        ){

            mostrarEstado(
                "Ingresá el lugar de trabajo.",
                "error"
            );

            lugarTrabajo.focus();

            return;

        }


        if(
            !descripcion.value.trim()
        ){

            mostrarEstado(
                "Ingresá la descripción del trabajo.",
                "error"
            );

            descripcion.focus();

            return;

        }


        const valorMateriales =
        Number(
            materiales.value
        ) || 0;


        const valorManoObra =
        Number(
            manoObra.value
        ) || 0;


        const valorViaticos =
        Number(
            viaticos.value
        ) || 0;


        const materialesLista =
        obtenerMateriales();


        const totalGeneral =
        valorMateriales +
        valorManoObra +
        valorViaticos;


        // ==================================
        // GUARDANDO
        // ==================================

        btnGuardar.disabled =
        true;

        btnGuardar.textContent =
        "⏳ Guardando cambios...";


        try{

            const referencia =
            doc(
                db,
                "presupuestos",
                presupuestoId
            );


            /*
             * Volvemos a comprobar el propietario
             * antes de actualizar.
             */

            const comprobacion =
            await getDoc(
                referencia
            );


            if(!comprobacion.exists()){

                throw new Error(
                    "El presupuesto ya no existe."
                );

            }


            const datosActuales =
            comprobacion.data();


            const pertenece =
            datosActuales.uid ===
            usuarioActual.uid
            ||
            datosActuales.usuarioId ===
            usuarioActual.uid
            ||
            datosActuales.empresaId ===
            usuarioActual.uid;


            if(!pertenece){

                throw new Error(
                    "No tenés permiso para modificar este presupuesto."
                );

            }


            await updateDoc(
                referencia,
                {

                    // ======================
                    // CLIENTE
                    // ======================

                    clienteId:
                    clienteId,

                    cliente:
                    datosCliente.nombre ||
                    datosCliente.empresa ||
                    datosCliente.razonSocial ||
                    datosCliente.razon_social ||
                    "",

                    clienteCuit:
                    datosCliente.cuit ||
                    "",

                    clienteTelefono:
                    datosCliente.telefono ||
                    "",

                    clienteEmail:
                    datosCliente.email ||
                    "",

                    clienteDireccion:
                    datosCliente.direccion ||
                    "",

                    clienteLocalidad:
                    datosCliente.localidad ||
                    "",

                    clienteProvincia:
                    datosCliente.provincia ||
                    "",


                    // ======================
                    // PRESUPUESTO
                    // ======================

                    numeroAgenda:
                    numeroAgenda.value.trim(),

                    fecha:
                    fecha.value,

                    lugarTrabajo:
                    lugarTrabajo.value.trim(),

                    descripcion:
                    descripcion.value.trim(),

                    materialesLista:
                    materialesLista,

                    materiales:
                    valorMateriales,

                    manoObra:
                    valorManoObra,

                    viaticos:
                    valorViaticos,

                    total:
                    totalGeneral,

                    actualizado:
                    serverTimestamp()

                }
            );


            presupuestoActual = {

                ...datosActuales,

                clienteId:
                clienteId,

                cliente:
                datosCliente.nombre ||
                datosCliente.empresa ||
                datosCliente.razonSocial ||
                datosCliente.razon_social ||
                "",

                clienteCuit:
                datosCliente.cuit || "",

                clienteTelefono:
                datosCliente.telefono || "",

                clienteEmail:
                datosCliente.email || "",

                clienteDireccion:
                datosCliente.direccion || "",

                clienteLocalidad:
                datosCliente.localidad || "",

                clienteProvincia:
                datosCliente.provincia || "",

                numeroAgenda:
                numeroAgenda.value.trim(),

                fecha:
                fecha.value,

                lugarTrabajo:
                lugarTrabajo.value.trim(),

                descripcion:
                descripcion.value.trim(),

                materialesLista:
                materialesLista,

                materiales:
                valorMateriales,

                manoObra:
                valorManoObra,

                viaticos:
                valorViaticos,

                total:
                totalGeneral

            };


            mostrarEstado(
                "✅ Presupuesto actualizado correctamente.",
                "exito"
            );


            btnGuardar.textContent =
            "✅ Cambios guardados";


            setTimeout(
                function(){

                    window.location.href =
                    "presupuestos.html";

                },
                1000
            );

        }
        catch(error){

            console.error(
                "Error actualizando presupuesto:",
                error
            );


            mostrarEstado(
                "No se pudo actualizar el presupuesto: " +
                error.message,
                "error"
            );


            btnGuardar.disabled =
            false;

            btnGuardar.textContent =
            "💾 Guardar cambios";

        }

    }
);


// ==========================================
// VOLVER
// ==========================================

btnVolver.addEventListener(
    "click",
    function(){

        window.location.href =
        "presupuestos.html";

    }
);


// ==========================================
// AUTENTICACIÓN
// ==========================================

onAuthStateChanged(
    auth,
    async function(usuario){

        if(!usuario){

            window.location.replace(
                "login.html"
            );

            return;

        }


        usuarioActual =
        usuario;


        try{

            await cargarClientes();

            await cargarPresupuesto();

        }
        catch(error){

            console.error(
                "Error inicializando:",
                error
            );


            mostrarEstado(
                "Error cargando el módulo: " +
                error.message,
                "error"
            );

        }

    }
);

</script>

</body>

</html>
