<!DOCTYPE html>
<html lang="es-AR">

<head>

<meta charset="UTF-8">

<meta name="viewport" content="width=device-width, initial-scale=1.0">

<meta name="theme-color" content="#111827">

<title>Asistencia - GESBASE</title>

<style>

*{
    box-sizing:border-box;
    margin:0;
    padding:0;
}

body{
    font-family:Arial,Helvetica,sans-serif;
    background:#f3f4f6;
    color:#111827;
}

header{
    background:#111827;
    color:#fff;
    padding:18px;
}

.header{
    max-width:900px;
    margin:auto;
}

.logo{
    font-size:24px;
    font-weight:bold;
}

.subtitulo{
    color:#d1d5db;
    font-size:13px;
    margin-top:4px;
}

main{
    max-width:900px;
    margin:auto;
    padding:20px 15px 40px;
}

.volver{
    display:inline-block;
    text-decoration:none;
    color:#111827;
    background:#fff;
    border:1px solid #d1d5db;
    border-radius:10px;
    padding:10px 14px;
    margin-bottom:18px;
    font-weight:bold;
}

h1{
    font-size:25px;
    margin-bottom:7px;
}

.descripcion{
    color:#6b7280;
    margin-bottom:20px;
    line-height:1.5;
}

.card{
    background:#fff;
    border-radius:16px;
    padding:20px;
    margin-bottom:20px;
    box-shadow:0 2px 10px rgba(0,0,0,.06);
}

.card h2{
    font-size:19px;
    margin-bottom:16px;
}

.usuario{
    background:#f9fafb;
    border:1px solid #e5e7eb;
    border-radius:12px;
    padding:14px;
}

.dato{
    margin-bottom:10px;
}

.dato:last-child{
    margin-bottom:0;
}

.etiqueta{
    color:#6b7280;
    font-size:12px;
    margin-bottom:3px;
}

.valor{
    font-weight:bold;
    word-break:break-word;
}

.campo{
    margin-bottom:16px;
}

label{
    display:block;
    font-weight:bold;
    font-size:14px;
    margin-bottom:7px;
}

input,
select,
textarea{
    width:100%;
    padding:12px;
    border:1px solid #d1d5db;
    border-radius:10px;
    font-size:15px;
    font-family:Arial,Helvetica,sans-serif;
}

textarea{
    min-height:140px;
    resize:vertical;
}

input:focus,
select:focus,
textarea:focus{
    outline:none;
    border-color:#111827;
}

button{
    width:100%;
    border:0;
    border-radius:10px;
    padding:14px;
    background:#111827;
    color:#fff;
    font-size:16px;
    font-weight:bold;
    cursor:pointer;
}

button:disabled{
    opacity:.6;
    cursor:not-allowed;
}

.alerta{
    display:none;
    padding:13px;
    border-radius:10px;
    margin-top:15px;
    line-height:1.4;
}

.exito{
    display:block;
    background:#dcfce7;
    color:#166534;
}

.error{
    display:block;
    background:#fee2e2;
    color:#991b1b;
}

.cargando{
    text-align:center;
    padding:20px;
    color:#6b7280;
}

.consulta{
    border:1px solid #e5e7eb;
    border-radius:12px;
    padding:15px;
    margin-bottom:12px;
}

.consulta:last-child{
    margin-bottom:0;
}

.consulta-top{
    display:flex;
    justify-content:space-between;
    align-items:flex-start;
    gap:10px;
    margin-bottom:10px;
}

.asunto{
    font-weight:bold;
    font-size:16px;
}

.estado{
    padding:5px 9px;
    border-radius:20px;
    font-size:12px;
    font-weight:bold;
    white-space:nowrap;
}

.pendiente{
    background:#fef3c7;
    color:#92400e;
}

.en_revision{
    background:#dbeafe;
    color:#1e40af;
}

.respondida{
    background:#dcfce7;
    color:#166534;
}

.cerrada{
    background:#e5e7eb;
    color:#374151;
}

.info{
    color:#6b7280;
    font-size:13px;
    margin-bottom:8px;
}

.mensaje-consulta{
    white-space:pre-wrap;
    line-height:1.5;
}

.sin-consultas{
    text-align:center;
    color:#6b7280;
    padding:20px;
}

@media(max-width:600px){

    main{
        padding:15px 12px 35px;
    }

    .card{
        padding:16px;
    }

    .consulta-top{
        flex-direction:column;
    }

}

</style>

</head>

<body>

<header>

    <div class="header">

        <div class="logo">
            GESBASE
        </div>

        <div class="subtitulo">
            Asistencia al cliente
        </div>

    </div>

</header>


<main>

<a
    href="index.html"
    class="volver"
>
    ← Volver
</a>


<h1>
    🆘 Asistencia al cliente
</h1>

<p class="descripcion">
    Enviá tu consulta y nuestro equipo de asistencia te ayudará.
</p>


<!-- USUARIO -->

<div class="card">

    <h2>
        👤 Mi cuenta
    </h2>

    <div class="usuario">

        <div class="dato">

            <div class="etiqueta">
                Usuario
            </div>

            <div
                class="valor"
                id="usuarioEmail"
            >
                Cargando...
            </div>

        </div>


        <div class="dato">

            <div class="etiqueta">
                ID de usuario
            </div>

            <div
                class="valor"
                id="usuarioId"
            >
                Cargando...
            </div>

        </div>


        <div class="dato">

            <div class="etiqueta">
                Empresa
            </div>

            <div
                class="valor"
                id="empresaId"
            >
                No especificada
            </div>

        </div>

    </div>

</div>


<!-- NUEVA CONSULTA -->

<div class="card">

    <h2>
        📝 Nueva consulta
    </h2>

    <form id="formConsulta">


        <div class="campo">

            <label for="categoria">
                Categoría
            </label>

            <select
                id="categoria"
                required
            >

                <option value="">
                    Seleccioná una categoría
                </option>

                <option value="Problema técnico">
                    Problema técnico
                </option>

                <option value="Problema con mi cuenta">
                    Problema con mi cuenta
                </option>

                <option value="Presupuestos">
                    Presupuestos
                </option>

                <option value="Clientes">
                    Clientes
                </option>

                <option value="Trabajos">
                    Trabajos
                </option>

                <option value="Empleados">
                    Empleados
                </option>

                <option value="Fichajes">
                    Fichajes
                </option>

                <option value="Gastos">
                    Gastos
                </option>

                <option value="Facturación">
                    Facturación
                </option>

                <option value="Cobros">
                    Cobros
                </option>

                <option value="Suscripción">
                    Suscripción
                </option>

                <option value="Otro">
                    Otro
                </option>

            </select>

        </div>


        <div class="campo">

            <label for="asunto">
                Asunto
            </label>

            <input
                type="text"
                id="asunto"
                maxlength="150"
                placeholder="Ej.: No puedo guardar un presupuesto"
                required
            >

        </div>


        <div class="campo">

            <label for="mensaje">
                Descripción
            </label>

            <textarea
                id="mensaje"
                maxlength="3000"
                placeholder="Explicá qué problema estás teniendo..."
                required
            ></textarea>

        </div>


        <button
            type="submit"
            id="btnEnviar"
        >
            📩 Enviar consulta
        </button>


        <div
            id="resultado"
            class="alerta"
        ></div>

    </form>

</div>


<!-- HISTORIAL -->

<div class="card">

    <h2>
        📋 Mis consultas
    </h2>

    <div
        id="listaConsultas"
        class="cargando"
    >
        Cargando consultas...
    </div>

</div>


</main>


<script type="module">

import {
    auth,
    db
} from "./firebase.js";

import {
    onAuthStateChanged
} from "https://www.gstatic.com/firebasejs/12.18.0/firebase-auth.js";

import {
    collection,
    addDoc,
    getDocs,
    query,
    where,
    serverTimestamp
} from "https://www.gstatic.com/firebasejs/12.18.0/firebase-firestore.js";


let usuarioActual = null;


/* ==========================================
   ELEMENTOS
========================================== */

const usuarioEmail =
    document.getElementById("usuarioEmail");

const usuarioId =
    document.getElementById("usuarioId");

const empresaId =
    document.getElementById("empresaId");

const formConsulta =
    document.getElementById("formConsulta");

const btnEnviar =
    document.getElementById("btnEnviar");

const resultado =
    document.getElementById("resultado");

const listaConsultas =
    document.getElementById("listaConsultas");


/* ==========================================
   MENSAJE
========================================== */

function mostrarResultado(texto,tipo){

    resultado.textContent = texto;

    resultado.className =
        "alerta " + tipo;

}


/* ==========================================
   ESCAPAR HTML
========================================== */

function escapar(texto){

    if(texto === null ||
       texto === undefined){

        return "";

    }

    return String(texto)
        .replace(/&/g,"&amp;")
        .replace(/</g,"&lt;")
        .replace(/>/g,"&gt;")
        .replace(/"/g,"&quot;")
        .replace(/'/g,"&#039;");

}


/* ==========================================
   ESTADO
========================================== */

function nombreEstado(estado){

    if(estado === "pendiente")
        return "Pendiente";

    if(estado === "en_revision")
        return "En revisión";

    if(estado === "respondida")
        return "Respondida";

    if(estado === "cerrada")
        return "Cerrada";

    return estado || "Pendiente";

}


/* ==========================================
   FECHA
========================================== */

function fechaTexto(timestamp){

    if(!timestamp){
        return "Fecha pendiente";
    }

    try{

        return timestamp
            .toDate()
            .toLocaleString(
                "es-AR",
                {
                    day:"2-digit",
                    month:"2-digit",
                    year:"numeric",
                    hour:"2-digit",
                    minute:"2-digit"
                }
            );

    }catch(error){

        return "Fecha pendiente";

    }

}


/* ==========================================
   CARGAR DATOS DEL USUARIO
========================================== */

async function cargarUsuario(user){

    usuarioActual = user;


    usuarioEmail.textContent =
        user.email || "Sin email";


    usuarioId.textContent =
        user.uid;


    /*
     * IMPORTANTE:
     * Por ahora NO buscamos usuarios mediante
     * una consulta Firestore.
     *
     * Esto evita que la pantalla quede
     * bloqueada por permisos o índices.
     */


    empresaId.textContent =
        "Se asignará al vincular la cuenta";


    await cargarConsultas();

}


/* ==========================================
   CARGAR CONSULTAS
========================================== */

async function cargarConsultas(){

    if(!usuarioActual){

        listaConsultas.innerHTML =
            '<div class="sin-consultas">Usuario no identificado.</div>';

        return;

    }


    try{

        /*
         * Solamente buscamos por usuarioId.
         * No usamos orderBy para evitar necesitar
         * un índice compuesto.
         */

        const q =
            query(
                collection(db,"consultas"),
                where(
                    "usuarioId",
                    "==",
                    usuarioActual.uid
                )
            );


        const snapshot =
            await getDocs(q);


        if(snapshot.empty){

            listaConsultas.innerHTML =
                '<div class="sin-consultas">Todavía no tenés consultas.</div>';

            return;

        }


        const consultas = [];


        snapshot.forEach(doc => {

            consultas.push({

                id:doc.id,

                ...doc.data()

            });

        });


        /*
         * Ordenamos localmente.
         */

        consultas.sort(
            (a,b) => {

                const fechaA =
                    a.fechaCreacion?.toMillis?.() || 0;

                const fechaB =
                    b.fechaCreacion?.toMillis?.() || 0;

                return fechaB - fechaA;

            }
        );


        let html = "";


        consultas.forEach(consulta => {

            const estado =
                consulta.estado ||
                "pendiente";


            html += `

                <div class="consulta">

                    <div class="consulta-top">

                        <div class="asunto">

                            ${escapar(
                                consulta.asunto ||
                                "Sin asunto"
                            )}

                        </div>

                        <div
                            class="estado ${escapar(
                                estado
                            )}"
                        >

                            ${escapar(
                                nombreEstado(estado)
                            )}

                        </div>

                    </div>


                    <div class="info">

                        ${escapar(
                            consulta.categoria ||
                            "Sin categoría"
                        )}

                        ·

                        ${escapar(
                            fechaTexto(
                                consulta.fechaCreacion
                            )
                        )}

                    </div>


                    <div class="mensaje-consulta">

                        ${escapar(
                            consulta.mensaje ||
                            ""
                        )}

                    </div>

                </div>

            `;

        });


        listaConsultas.innerHTML =
            html;


    }catch(error){

        console.error(
            "ERROR FIRESTORE:",
            error
        );


        listaConsultas.innerHTML = `

            <div class="alerta error"
                 style="display:block">

                No se pudieron cargar las consultas.

                <br><br>

                <small>
                    ${escapar(error.message)}
                </small>

            </div>

        `;

    }

}


/* ==========================================
   ENVIAR CONSULTA
========================================== */

formConsulta.addEventListener(
    "submit",
    async function(event){

        event.preventDefault();


        if(!usuarioActual){

            mostrarResultado(
                "No hay un usuario autenticado.",
                "error"
            );

            return;

        }


        const categoria =
            document
                .getElementById("categoria")
                .value
                .trim();


        const asunto =
            document
                .getElementById("asunto")
                .value
                .trim();


        const mensaje =
            document
                .getElementById("mensaje")
                .value
                .trim();


        if(!categoria ||
           !asunto ||
           !mensaje){

            mostrarResultado(
                "Completá todos los campos.",
                "error"
            );

            return;

        }


        btnEnviar.disabled = true;

        btnEnviar.textContent =
            "Enviando...";


        try{

            const user =
                auth.currentUser;


            if(!user){

                throw new Error(
                    "La sesión de Firebase no está activa."
                );

            }


            /*
             * Creamos la consulta.
             */

            const referencia =
                await addDoc(
                    collection(
                        db,
                        "consultas"
                    ),
                    {

                        usuarioId:
                            user.uid,

                        empresaId:
                            "",

                        nombre:
                            user.displayName ||
                            "",

                        email:
                            user.email ||
                            "",

                        categoria:
                            categoria,

                        asunto:
                            asunto,

                        mensaje:
                            mensaje,

                        estado:
                            "pendiente",

                        prioridad:
                            "normal",

                        fechaCreacion:
                            serverTimestamp(),

                        fechaActualizacion:
                            serverTimestamp(),

                        ultimaRespuesta:
                            ""

                    }
                );


            console.log(
                "Consulta creada:",
                referencia.id
            );


            formConsulta.reset();


            mostrarResultado(
                "✅ Consulta enviada correctamente.",
                "exito"
            );


            await cargarConsultas();


        }catch(error){

            console.error(
                "ERROR AL ENVIAR:",
                error
            );


            mostrarResultado(
                "No se pudo enviar la consulta: " +
                error.message,
                "error"
            );

        }finally{

            btnEnviar.disabled = false;

            btnEnviar.textContent =
                "📩 Enviar consulta";

        }

    }
);


/* ==========================================
   AUTENTICACIÓN
========================================== */

onAuthStateChanged(
    auth,
    async function(user){

        console.log(
            "Estado de autenticación:",
            user
        );


        if(!user){

            window.location.href =
                "login.html";

            return;

        }


        try{

            await cargarUsuario(user);

        }catch(error){

            console.error(
                "ERROR INICIAL:",
                error
            );


            listaConsultas.innerHTML = `

                <div class="alerta error"
                     style="display:block">

                    Error al iniciar asistencia.

                    <br><br>

                    ${escapar(error.message)}

                </div>

            `;

        }

    }
);

</script>

</body>

</html>
