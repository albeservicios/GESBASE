<script type="module">

import {
    auth,
    db
} from "./firebase.js";

import {
    onAuthStateChanged
} from "https://www.gstatic.com/firebasejs/12.18.0/firebase-auth.js";

import {
    collection,
    addDoc,
    getDocs,
    query,
    where,
    serverTimestamp
} from "https://www.gstatic.com/firebasejs/12.18.0/firebase-firestore.js";


const usuarioEmail =
    document.getElementById("usuarioEmail");

const usuarioId =
    document.getElementById("usuarioId");

const empresaId =
    document.getElementById("empresaId");

const formConsulta =
    document.getElementById("formConsulta");

const btnEnviar =
    document.getElementById("btnEnviar");

const resultado =
    document.getElementById("resultado");

const listaConsultas =
    document.getElementById("listaConsultas");


/* ==========================================
   MOSTRAR DATOS
========================================== */

function mostrarUsuario(user){

    if(!user){

        usuarioEmail.textContent =
            "NO AUTENTICADO";

        usuarioId.textContent =
            "NO DISPONIBLE";

        empresaId.textContent =
            "NO DISPONIBLE";

        return;

    }


    usuarioEmail.textContent =
        user.email || "Sin email";

    usuarioId.textContent =
        user.uid || "Sin UID";


    console.log(
        "USUARIO FIREBASE:",
        user
    );

    console.log(
        "UID:",
        user.uid
    );

    console.log(
        "EMAIL:",
        user.email
    );


    empresaId.textContent =
        "Buscando empresa...";

}


/* ==========================================
   MENSAJES
========================================== */

function mensaje(texto,tipo){

    resultado.textContent =
        texto;

    resultado.className =
        "alerta " + tipo;

}


/* ==========================================
   ESCAPAR HTML
========================================== */

function escapar(texto){

    if(
        texto === null ||
        texto === undefined
    ){

        return "";

    }

    return String(texto)
        .replace(/&/g,"&amp;")
        .replace(/</g,"&lt;")
        .replace(/>/g,"&gt;")
        .replace(/"/g,"&quot;")
        .replace(/'/g,"&#039;");

}


/* ==========================================
   FECHA
========================================== */

function fechaTexto(timestamp){

    if(!timestamp){

        return "Fecha pendiente";

    }


    try{

        return timestamp
            .toDate()
            .toLocaleString(
                "es-AR",
                {
                    day:"2-digit",
                    month:"2-digit",
                    year:"numeric",
                    hour:"2-digit",
                    minute:"2-digit"
                }
            );

    }catch(error){

        return "Fecha pendiente";

    }

}


/* ==========================================
   ESTADO
========================================== */

function estadoTexto(estado){

    if(estado === "pendiente")
        return "Pendiente";

    if(estado === "en_revision")
        return "En revisión";

    if(estado === "respondida")
        return "Respondida";

    if(estado === "cerrada")
        return "Cerrada";

    return estado || "Pendiente";

}


/* ==========================================
   CARGAR EMPRESA
========================================== */

async function buscarEmpresa(user){

    empresaId.textContent =
        "Buscando empresa...";


    try{

        /*
         * Primero intentamos buscar el documento
         * de usuario usando el UID como ID.
         */

        const usuarioRef =
            collection(
                db,
                "usuarios"
            );


        const usuarioQuery =
            query(
                usuarioRef,
                where(
                    "uid",
                    "==",
                    user.uid
                )
            );


        const usuarioSnapshot =
            await getDocs(
                usuarioQuery
            );


        if(!usuarioSnapshot.empty){

            const datos =
                usuarioSnapshot.docs[0].data();


            console.log(
                "PERFIL EN USUARIOS:",
                datos
            );


            const empresa =
                datos.empresaId ||
                datos.idEmpresa ||
                datos.empresa ||
                "";


            if(empresa){

                empresaId.textContent =
                    empresa;

                return empresa;

            }

        }


        /*
         * Si no encontramos empresa,
         * mostramos que el usuario está autenticado.
         */

        empresaId.textContent =
            "Sin empresa asociada";


        return "";


    }catch(error){

        console.error(
            "ERROR BUSCANDO EMPRESA:",
            error
        );


        empresaId.textContent =
            "No se pudo consultar";


        return "";

    }

}


/* ==========================================
   CARGAR CONSULTAS
========================================== */

async function cargarConsultas(user){

    listaConsultas.innerHTML =
        '<div class="cargando">Cargando consultas...</div>';


    try{

        const q =
            query(
                collection(
                    db,
                    "consultas"
                ),
                where(
                    "usuarioId",
                    "==",
                    user.uid
                )
            );


        const snapshot =
            await getDocs(q);


        if(snapshot.empty){

            listaConsultas.innerHTML =
                '<div class="sin-consultas">Todavía no tenés consultas.</div>';

            return;

        }


        const consultas = [];


        snapshot.forEach(doc => {

            consultas.push({

                id:doc.id,

                ...doc.data()

            });

        });


        consultas.sort(
            (a,b) => {

                const fechaA =
                    a.fechaCreacion?.toMillis?.() || 0;

                const fechaB =
                    b.fechaCreacion?.toMillis?.() || 0;

                return fechaB - fechaA;

            }
        );


        let html = "";


        consultas.forEach(consulta => {

            const estado =
                consulta.estado ||
                "pendiente";


            html += `

                <div class="consulta">

                    <div class="consulta-top">

                        <div class="asunto">

                            ${escapar(
                                consulta.asunto ||
                                "Sin asunto"
                            )}

                        </div>

                        <div
                            class="estado ${escapar(
                                estado
                            )}"
                        >

                            ${escapar(
                                estadoTexto(
                                    estado
                                )
                            )}

                        </div>

                    </div>


                    <div class="info">

                        ${escapar(
                            consulta.categoria ||
                            "Sin categoría"
                        )}

                        ·

                        ${escapar(
                            fechaTexto(
                                consulta.fechaCreacion
                            )
                        )}

                    </div>


                    <div class="mensaje-consulta">

                        ${escapar(
                            consulta.mensaje ||
                            ""
                        )}

                    </div>

                </div>

            `;

        });


        listaConsultas.innerHTML =
            html;


    }catch(error){

        console.error(
            "ERROR CONSULTANDO FIRESTORE:",
            error
        );


        listaConsultas.innerHTML = `

            <div class="alerta error"
                 style="display:block">

                Error al cargar las consultas.

                <br><br>

                <small>
                    ${escapar(
                        error.message
                    )}
                </small>

            </div>

        `;

    }

}


/* ==========================================
   ENVIAR CONSULTA
========================================== */

formConsulta.addEventListener(
    "submit",
    async function(event){

        event.preventDefault();


        const user =
            auth.currentUser;


        if(!user){

            mensaje(
                "No hay un usuario autenticado.",
                "error"
            );

            return;

        }


        const categoria =
            document
                .getElementById("categoria")
                .value
                .trim();


        const asunto =
            document
                .getElementById("asunto")
                .value
                .trim();


        const texto =
            document
                .getElementById("mensaje")
                .value
                .trim();


        if(
            !categoria ||
            !asunto ||
            !texto
        ){

            mensaje(
                "Completá todos los campos.",
                "error"
            );

            return;

        }


        btnEnviar.disabled =
            true;

        btnEnviar.textContent =
            "Enviando...";


        try{

            await addDoc(
                collection(
                    db,
                    "consultas"
                ),
                {

                    usuarioId:
                        user.uid,

                    empresaId:
                        "",

                    nombre:
                        user.displayName ||
                        "",

                    email:
                        user.email ||
                        "",

                    categoria:
                        categoria,

                    asunto:
                        asunto,

                    mensaje:
                        texto,

                    estado:
                        "pendiente",

                    prioridad:
                        "normal",

                    fechaCreacion:
                        serverTimestamp(),

                    fechaActualizacion:
                        serverTimestamp(),

                    ultimaRespuesta:
                        ""

                }
            );


            formConsulta.reset();


            mensaje(
                "✅ Consulta enviada correctamente.",
                "exito"
            );


            await cargarConsultas(user);


        }catch(error){

            console.error(
                "ERROR CREANDO CONSULTA:",
                error
            );


            mensaje(
                "No se pudo enviar: " +
                error.message,
                "error"
            );

        }finally{

            btnEnviar.disabled =
                false;

            btnEnviar.textContent =
                "📩 Enviar consulta";

        }

    }
);


/* ==========================================
   FIREBASE AUTH
========================================== */

console.log(
    "ASISTENCIA: esperando autenticación..."
);


onAuthStateChanged(
    auth,
    async function(user){

        console.log(
            "ASISTENCIA - AUTH:",
            user
        );


        if(!user){

            usuarioEmail.textContent =
                "No autenticado";

            usuarioId.textContent =
                "No disponible";

            empresaId.textContent =
                "No disponible";


            listaConsultas.innerHTML =
                '<div class="alerta error" style="display:block">No hay una sesión activa de GESBASE.</div>';


            return;

        }


        /*
         * AQUÍ SABEMOS QUE FIREBASE AUTH
         * ENCONTRÓ AL USUARIO.
         */

        mostrarUsuario(user);


        await buscarEmpresa(user);


        await cargarConsultas(user);

    }
);

</script>
