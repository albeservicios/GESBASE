<!DOCTYPE html>
<html lang="es-AR">

<head>

<meta charset="UTF-8">

<meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
>

<meta
    name="theme-color"
    content="#111827"
>

<meta
    name="description"
    content="GESBASE - Asistencia y consultas"
>

<title>Asistencia - GESBASE</title>


<style>

*{
    box-sizing:border-box;
    margin:0;
    padding:0;
}

body{
    font-family:
        Arial,
        Helvetica,
        sans-serif;

    background:#f3f4f6;
    color:#111827;
    min-height:100vh;
}

header{
    background:#111827;
    color:white;
    padding:18px 16px;
}

.header-inner{
    max-width:900px;
    margin:auto;
}

.logo{
    font-size:25px;
    font-weight:800;
}

.subtitulo{
    margin-top:5px;
    color:#d1d5db;
    font-size:14px;
}

main{
    width:100%;
    max-width:900px;
    margin:0 auto;
    padding:18px 14px 40px;
}

.volver{
    display:inline-block;
    margin-bottom:15px;
    text-decoration:none;
    color:#2563eb;
    font-weight:bold;
}

.card{
    background:white;
    border-radius:16px;
    padding:18px;
    margin-bottom:16px;
    box-shadow:
        0 4px 15px rgba(0,0,0,.07);
}

.card h2{
    font-size:19px;
    margin-bottom:15px;
}

.datos-grid{
    display:grid;
    grid-template-columns:repeat(2,1fr);
    gap:12px;
}

.dato{
    background:#f9fafb;
    border:1px solid #e5e7eb;
    border-radius:12px;
    padding:12px;
}

.dato-label{
    font-size:12px;
    color:#6b7280;
    margin-bottom:5px;
}

.dato-valor{
    font-size:14px;
    font-weight:bold;
    word-break:break-word;
}

label{
    display:block;
    font-size:14px;
    font-weight:bold;
    margin-bottom:7px;
}

input,
select,
textarea{
    width:100%;
    border:1px solid #d1d5db;
    border-radius:10px;
    padding:12px;
    font-size:15px;
    background:white;
    color:#111827;
    outline:none;
}

input:focus,
select:focus,
textarea:focus{
    border-color:#2563eb;
    box-shadow:
        0 0 0 3px rgba(37,99,235,.12);
}

.campo{
    margin-bottom:15px;
}

textarea{
    min-height:130px;
    resize:vertical;
}

button{
    width:100%;
    border:none;
    border-radius:11px;
    padding:13px;
    font-size:15px;
    font-weight:bold;
    cursor:pointer;
}

.btn-enviar{
    background:#2563eb;
    color:white;
}

.btn-enviar:hover{
    background:#1d4ed8;
}

button:disabled{
    opacity:.65;
    cursor:not-allowed;
}

.alerta{
    display:none;
    padding:12px;
    border-radius:10px;
    margin-bottom:15px;
    font-size:14px;
}

.alerta.exito{
    display:block;
    background:#dcfce7;
    color:#166534;
    border:1px solid #86efac;
}

.alerta.error{
    display:block;
    background:#fee2e2;
    color:#991b1b;
    border:1px solid #fca5a5;
}

.alerta.info{
    display:block;
    background:#dbeafe;
    color:#1e40af;
    border:1px solid #93c5fd;
}

.consulta{
    border:1px solid #e5e7eb;
    border-radius:13px;
    padding:15px;
    margin-bottom:12px;
    background:#fff;
}

.consulta-top{
    display:flex;
    align-items:flex-start;
    justify-content:space-between;
    gap:10px;
}

.asunto{
    font-weight:bold;
    font-size:16px;
    flex:1;
}

.estado{
    font-size:12px;
    font-weight:bold;
    padding:6px 9px;
    border-radius:20px;
    white-space:nowrap;
}

.estado.pendiente{
    background:#fef3c7;
    color:#92400e;
}

.estado.en_revision{
    background:#dbeafe;
    color:#1e40af;
}

.estado.respondida{
    background:#dcfce7;
    color:#166534;
}

.estado.cerrada{
    background:#e5e7eb;
    color:#374151;
}

.info{
    margin-top:8px;
    color:#6b7280;
    font-size:12px;
}

.mensaje-consulta{
    margin-top:12px;
    background:#f9fafb;
    border-radius:10px;
    padding:12px;
    font-size:14px;
    line-height:1.5;
    white-space:pre-wrap;
    word-break:break-word;
}

.respuesta{
    margin-top:12px;
    border-left:4px solid #2563eb;
    background:#eff6ff;
    padding:12px;
    border-radius:8px;
}

.respuesta-titulo{
    font-weight:bold;
    font-size:13px;
    color:#1d4ed8;
    margin-bottom:6px;
}

.respuesta-texto{
    font-size:14px;
    line-height:1.5;
    white-space:pre-wrap;
}

.cargando,
.sin-consultas{
    text-align:center;
    padding:25px;
    color:#6b7280;
}

.estado-sistema{
    font-size:13px;
    color:#6b7280;
    margin-top:8px;
}

@media(max-width:650px){

    .datos-grid{
        grid-template-columns:1fr;
    }

    .consulta-top{
        flex-direction:column;
    }

    .estado{
        align-self:flex-start;
    }

}

</style>

</head>

<script type="module">


/* ==========================================
   FIREBASE
========================================== */

import {
    auth,
    db
} from "./firebase.js";


import {
    onAuthStateChanged
} from "https://www.gstatic.com/firebasejs/12.18.0/firebase-auth.js";


import {
    collection,
    addDoc,
    getDocs,
    query,
    where,
    serverTimestamp
} from "https://www.gstatic.com/firebasejs/12.18.0/firebase-firestore.js";



/* ==========================================
   ELEMENTOS
========================================== */

const usuarioNombre =
    document.getElementById(
        "usuarioNombre"
    );

const usuarioEmail =
    document.getElementById(
        "usuarioEmail"
    );

const usuarioId =
    document.getElementById(
        "usuarioId"
    );

const nombreEmpresa =
    document.getElementById(
        "nombreEmpresa"
    );

const empresaId =
    document.getElementById(
        "empresaId"
    );

const estadoUsuario =
    document.getElementById(
        "estadoUsuario"
    );

const estadoSistema =
    document.getElementById(
        "estadoSistema"
    );

const formConsulta =
    document.getElementById(
        "formConsulta"
    );

const btnEnviar =
    document.getElementById(
        "btnEnviar"
    );

const resultado =
    document.getElementById(
        "resultado"
    );

const listaConsultas =
    document.getElementById(
        "listaConsultas"
    );



/* ==========================================
   DATOS ACTUALES
========================================== */

let perfilActual = {

    usuarioId:"",
    empresaId:"",
    nombre:"",
    apellido:"",
    email:"",
    nombreEmpresa:"",
    estado:""

};



/* ==========================================
   ESCAPAR HTML
========================================== */

function escapar(texto){

    if(
        texto === null ||
        texto === undefined
    ){

        return "";

    }

    return String(texto)

        .replace(
            /&/g,
            "&amp;"
        )

        .replace(
            /</g,
            "&lt;"
        )

        .replace(
            />/g,
            "&gt;"
        )

        .replace(
            /"/g,
            "&quot;"
        )

        .replace(
            /'/g,
            "&#039;"
        );

}



/* ==========================================
   FECHA
========================================== */

function fechaTexto(fecha){

    if(!fecha){

        return "Fecha pendiente";

    }


    try{

        if(
            typeof fecha.toDate ===
            "function"
        ){

            return fecha
                .toDate()
                .toLocaleString(
                    "es-AR",
                    {
                        day:"2-digit",
                        month:"2-digit",
                        year:"numeric",
                        hour:"2-digit",
                        minute:"2-digit"
                    }
                );

        }


        if(
            fecha instanceof Date
        ){

            return fecha
                .toLocaleString(
                    "es-AR"
                );

        }


        return String(fecha);


    }catch(error){

        return "Fecha pendiente";

    }

}



/* ==========================================
   ESTADO
========================================== */

function estadoTexto(estado){

    switch(estado){

        case "pendiente":
            return "Pendiente";

        case "en_revision":
            return "En revisión";

        case "respondida":
            return "Respondida";

        case "cerrada":
            return "Cerrada";

        default:
            return estado ||
                "Pendiente";

    }

}



/* ==========================================
   MOSTRAR MENSAJE
========================================== */

function mensaje(
    texto,
    tipo
){

    resultado.textContent =
        texto;

    resultado.className =
        "alerta " + tipo;

}



/* ==========================================
   BUSCAR PERFIL
========================================== */

async function buscarPerfil(user){

    perfilActual = {

        usuarioId:user.uid,

        empresaId:"",

        nombre:
            user.displayName || "",

        apellido:"",

        email:
            user.email || "",

        nombreEmpresa:"",

        estado:""

    };


    usuarioNombre.textContent =
        user.displayName ||
        "Usuario GESBASE";


    usuarioEmail.textContent =
        user.email ||
        "Sin email";


    usuarioId.textContent =
        user.uid ||
        "Sin UID";


    nombreEmpresa.textContent =
        "Buscando...";


    empresaId.textContent =
        "Buscando...";


    estadoUsuario.textContent =
        "Autenticado";


    estadoSistema.textContent =
        "Sesión de GESBASE activa.";



    /* ======================================
       1. BUSCAR EN USUARIOS
    ====================================== */

    try{

        const qUsuarios =
            query(
                collection(
                    db,
                    "usuarios"
                ),
                where(
                    "uid",
                    "==",
                    user.uid
                )
            );


        const snapUsuarios =
            await getDocs(
                qUsuarios
            );


        if(
            !snapUsuarios.empty
        ){

            const datos =
                snapUsuarios
                    .docs[0]
                    .data();


            console.log(
                "PERFIL USUARIOS:",
                datos
            );


            perfilActual.nombre =
                datos.nombre ||
                perfilActual.nombre ||
                "";


            perfilActual.apellido =
                datos.apellido ||
                "";


            perfilActual.email =
                datos.email ||
                perfilActual.email ||
                "";


            perfilActual.empresaId =
                datos.empresaId ||
                datos.idEmpresa ||
                datos.empresa ||
                "";


            perfilActual.estado =
                datos.estado ||
                "";


            if(
                perfilActual.nombre ||
                perfilActual.apellido
            ){

                usuarioNombre.textContent =
                    (
                        perfilActual.nombre +
                        " " +
                        perfilActual.apellido
                    ).trim();

            }


            if(
                perfilActual.email
            ){

                usuarioEmail.textContent =
                    perfilActual.email;

            }


            if(
                perfilActual.estado
            ){

                estadoUsuario.textContent =
                    perfilActual.estado;

            }

        }

    }catch(error){

        console.warn(
            "No se pudo consultar usuarios:",
            error
        );

    }



    /* ======================================
       2. SI NO HAY EMPRESA,
          BUSCAR EN EMPLEADOS
    ====================================== */

    if(
        !perfilActual.empresaId
    ){

        try{

            const qEmpleado =
                query(
                    collection(
                        db,
                        "empleados"
                    ),
                    where(
                        "authUid",
                        "==",
                        user.uid
                    )
                );


            const snapEmpleado =
                await getDocs(
                    qEmpleado
                );


            if(
                !snapEmpleado.empty
            ){

                const datos =
                    snapEmpleado
                        .docs[0]
                        .data();


                console.log(
                    "PERFIL EMPLEADO:",
                    datos
                );


                perfilActual.empresaId =
                    datos.empresaId ||
                    "";


                perfilActual.nombre =
                    datos.nombre ||
                    perfilActual.nombre ||
                    "";


                perfilActual.apellido =
                    datos.apellido ||
                    "";


                perfilActual.email =
                    datos.email ||
                    perfilActual.email ||
                    "";


                perfilActual.estado =
                    datos.estado ||
                    perfilActual.estado ||
                    "";


                usuarioNombre.textContent =
                    (
                        perfilActual.nombre +
                        " " +
                        perfilActual.apellido
                    ).trim();


                usuarioEmail.textContent =
                    perfilActual.email;


                estadoUsuario.textContent =
                    perfilActual.estado ||
                    "Activo";

            }

        }catch(error){

            console.warn(
                "No se pudo consultar empleados:",
                error
            );

        }

    }



    /* ======================================
       3. BUSCAR EMPRESA
    ====================================== */

    if(
        perfilActual.empresaId
    ){

        nombreEmpresa.textContent =
            "Cargando empresa...";


        try{

            const qEmpresa =
                query(
                    collection(
                        db,
                        "empresas"
                    ),
                    where(
                        "__name__",
                        "==",
                        perfilActual.empresaId
                    )
                );


            const snapEmpresa =
                await getDocs(
                    qEmpresa
                );


            if(
                !snapEmpresa.empty
            ){

                const empresa =
                    snapEmpresa
                        .docs[0]
                        .data();


                console.log(
                    "EMPRESA:",
                    empresa
                );


                perfilActual.nombreEmpresa =
                    empresa.nombreEmpresa ||
                    empresa.nombre ||
                    empresa.razonSocial ||
                    "";


            }

        }catch(error){

            console.warn(
                "Error buscando empresa por ID:",
                error
            );

        }

    }



    /* ======================================
       4. SI TODAVÍA NO HAY EMPRESA,
          BUSCAR EMPRESA POR PROPIETARIO
    ====================================== */

    if(
        !perfilActual.empresaId
    ){

        try{

            const qEmpresaProp =
                query(
                    collection(
                        db,
                        "empresas"
                    ),
                    where(
                        "propietarioUid",
                        "==",
                        user.uid
                    )
                );


            const snapEmpresaProp =
                await getDocs(
                    qEmpresaProp
                );


            if(
                !snapEmpresaProp.empty
            ){

                const docEmpresa =
                    snapEmpresaProp
                        .docs[0];


                const datosEmpresa =
                    docEmpresa.data();


                perfilActual.empresaId =
                    datosEmpresa.empresaId ||
                    docEmpresa.id;


                perfilActual.nombreEmpresa =
                    datosEmpresa.nombreEmpresa ||
                    datosEmpresa.nombre ||
                    datosEmpresa.razonSocial ||
                    "";


                console.log(
                    "EMPRESA POR PROPIETARIO:",
                    datosEmpresa
                );

            }

        }catch(error){

            console.warn(
                "No se pudo buscar empresa por propietario:",
                error
            );

        }

    }



    /* ======================================
       5. MOSTRAR EMPRESA
    ====================================== */

    empresaId.textContent =
        perfilActual.empresaId ||
        "Sin empresa asociada";


    nombreEmpresa.textContent =
        perfilActual.nombreEmpresa ||
        "Sin empresa asociada";


    if(
        perfilActual.empresaId
    ){

        estadoSistema.textContent =
            "Usuario y empresa identificados correctamente.";

    }else{

        estadoSistema.textContent =
            "Usuario autenticado. No se encontró una empresa asociada.";

    }


    console.log(
        "PERFIL FINAL:",
        perfilActual
    );



    return perfilActual;

}



/* ==========================================
   CARGAR CONSULTAS
========================================== */

async function cargarConsultas(user){

    listaConsultas.innerHTML =
        '<div class="cargando">Cargando consultas...</div>';


    try{

        const q =
            query(
                collection(
                    db,
                    "consultas"
                ),
                where(
                    "usuarioId",
                    "==",
                    user.uid
                )
            );


        const snapshot =
            await getDocs(q);


        if(
            snapshot.empty
        ){

            listaConsultas.innerHTML =
                '<div class="sin-consultas">Todavía no tenés consultas.</div>';

            return;

        }


        const consultas = [];


        snapshot.forEach(
            doc => {

                consultas.push({

                    id:doc.id,

                    ...doc.data()

                });

            }
        );


        consultas.sort(
            (a,b) => {

                const fechaA =
                    a.fechaCreacion?.toMillis?.() ||
                    a.fecha?.toMillis?.() ||
                    0;


                const fechaB =
                    b.fechaCreacion?.toMillis?.() ||
                    b.fecha?.toMillis?.() ||
                    0;


                return fechaB - fechaA;

            }
        );


        let html = "";


        consultas.forEach(
            consulta => {


                const estado =
                    consulta.estado ||
                    "pendiente";


                const respuesta =
                    consulta.ultimaRespuesta ||
                    consulta.respuesta ||
                    "";


                const fecha =
                    consulta.fechaCreacion ||
                    consulta.fecha ||
                    consulta.creado ||
                    null;


                html += `

                    <div class="consulta">


                        <div class="consulta-top">

                            <div class="asunto">

                                ${escapar(
                                    consulta.asunto ||
                                    "Sin asunto"
                                )}

                            </div>


                            <div
                                class="estado ${escapar(
                                    estado
                                )}"
                            >

                                ${escapar(
                                    estadoTexto(
                                        estado
                                    )
                                )}

                            </div>

                        </div>



                        <div class="info">

                            ${escapar(
                                consulta.categoria ||
                                consulta.tipo ||
                                "Consulta"
                            )}

                            ·

                            ${escapar(
                                fechaTexto(fecha)
                            )}

                        </div>



                        <div class="mensaje-consulta">

                            ${escapar(
                                consulta.mensaje ||
                                ""
                            )}

                        </div>



                        ${
                            respuesta
                            ?
                            `

                            <div class="respuesta">

                                <div class="respuesta-titulo">

                                    👨‍💼 Respuesta de asistencia

                                </div>


                                <div class="respuesta-texto">

                                    ${escapar(
                                        respuesta
                                    )}

                                </div>

                            </div>

                            `
                            :
                            ""
                        }


                    </div>

                `;

            }
        );


        listaConsultas.innerHTML =
            html;


    }catch(error){

        console.error(
            "ERROR CARGANDO CONSULTAS:",
            error
        );


        listaConsultas.innerHTML = `

            <div
                class="alerta error"
                style="display:block"
            >

                ❌ No se pudieron cargar tus consultas.

                <br><br>

                <small>

                    ${escapar(
                        error.message
                    )}

                </small>

            </div>

        `;

    }

}



/* ==========================================
   ENVIAR CONSULTA
========================================== */

formConsulta.addEventListener(
    "submit",
    async function(event){

        event.preventDefault();


        const user =
            auth.currentUser;


        if(!user){

            mensaje(
                "❌ No hay una sesión activa.",
                "error"
            );

            return;

        }


        const categoria =
            document
                .getElementById(
                    "categoria"
                )
                .value
                .trim();


        const asunto =
            document
                .getElementById(
                    "asunto"
                )
                .value
                .trim();


        const texto =
            document
                .getElementById(
                    "mensaje"
                )
                .value
                .trim();


        if(
            !categoria ||
            !asunto ||
            !texto
        ){

            mensaje(
                "⚠️ Completá todos los campos.",
                "error"
            );

            return;

        }


        btnEnviar.disabled =
            true;


        btnEnviar.textContent =
            "Enviando...";


        try{


            /*
             * Nos aseguramos de tener
             * el perfil actualizado.
             */

            if(
                !perfilActual.usuarioId
            ){

                await buscarPerfil(user);

            }



            /* ==================================
               CREAR CONSULTA
            ================================== */

            await addDoc(
                collection(
                    db,
                    "consultas"
                ),
                {

                    /* IDENTIFICACIÓN */

                    usuarioId:
                        user.uid,

                    uid:
                        user.uid,

                    empresaId:
                        perfilActual.empresaId ||
                        "",


                    /* USUARIO */

                    nombre:
                        perfilActual.nombre ||
                        user.displayName ||
                        "",

                    apellido:
                        perfilActual.apellido ||
                        "",

                    email:
                        perfilActual.email ||
                        user.email ||
                        "",


                    /* EMPRESA */

                    empresa:
                        perfilActual.nombreEmpresa ||
                        "",


                    /* CONSULTA */

                    categoria:
                        categoria,

                    tipo:
                        categoria,

                    asunto:
                        asunto,

                    mensaje:
                        texto,


                    /* ESTADO */

                    estado:
                        "pendiente",

                    prioridad:
                        "normal",


                    /* FECHAS */

                    fechaCreacion:
                        serverTimestamp(),

                    fechaActualizacion:
                        serverTimestamp(),

                    creado:
                        serverTimestamp(),

                    actualizado:
                        serverTimestamp(),

                    fecha:
                        serverTimestamp(),


                    /* RESPUESTA */

                    ultimaRespuesta:
                        "",

                    respondidaPor:
                        "",

                    respondidaPorEmail:
                        "",


                    /* ARCHIVO */

                    archivoURL:
                        "",

                    nombreArchivo:
                        ""

                }

            );


            /* ==================================
               LIMPIAR FORMULARIO
            ================================== */

            formConsulta.reset();


            mensaje(
                "✅ Consulta enviada correctamente. El equipo de asistencia la revisará.",
                "exito"
            );


            /* ==================================
               RECARGAR LISTA
            ================================== */

            await cargarConsultas(
                user
            );


        }catch(error){

            console.error(
                "ERROR CREANDO CONSULTA:",
                error
            );


            mensaje(
                "❌ No se pudo enviar la consulta: " +
                error.message,
                "error"
            );

        }finally{

            btnEnviar.disabled =
                false;


            btnEnviar.textContent =
                "📩 Enviar consulta";

        }

    }
);



/* ==========================================
   AUTENTICACIÓN
========================================== */

console.log(
    "GESBASE ASISTENCIA: esperando autenticación..."
);


onAuthStateChanged(
    auth,
    async function(user){

        console.log(
            "GESBASE ASISTENCIA AUTH:",
            user
        );


        if(!user){

            usuarioNombre.textContent =
                "No autenticado";

            usuarioEmail.textContent =
                "No disponible";

            usuarioId.textContent =
                "No disponible";

            nombreEmpresa.textContent =
                "No disponible";

            empresaId.textContent =
                "No disponible";

            estadoUsuario.textContent =
                "Sesión cerrada";


            estadoSistema.textContent =
                "No hay una sesión activa de GESBASE.";


            listaConsultas.innerHTML = `

                <div
                    class="alerta error"
                    style="display:block"
                >

                    ❌ No hay una sesión activa de GESBASE.

                    <br><br>

                    Iniciá sesión para utilizar asistencia.

                </div>

            `;


            return;

        }



        try{


            /* ================================
               CARGAR PERFIL
            ================================= */

            await buscarPerfil(
                user
            );


            /* ================================
               CARGAR CONSULTAS
            ================================= */

            await cargarConsultas(
                user
            );


        }catch(error){

            console.error(
                "ERROR GENERAL ASISTENCIA:",
                error
            );


            estadoSistema.textContent =
                "Error cargando los datos.";


            listaConsultas.innerHTML = `

                <div
                    class="alerta error"
                    style="display:block"
                >

                    ❌ Ocurrió un error al cargar asistencia.

                    <br><br>

                    <small>

                        ${escapar(
                            error.message
                        )}

                    </small>

                </div>

            `;

        }

    }
);

</script>
