<script type="module">


/* ==========================================
   FIREBASE
========================================== */

import {
    auth,
    db
} from "./firebase.js";


import {
    onAuthStateChanged
} from "https://www.gstatic.com/firebasejs/12.18.0/firebase-auth.js";


import {
    collection,
    getDocs,
    query,
    where
} from "https://www.gstatic.com/firebasejs/12.18.0/firebase-firestore.js";



/* ==========================================
   ELEMENTOS
========================================== */

const usuarioEmail =
    document.getElementById("usuarioEmail");


const usuarioId =
    document.getElementById("usuarioId");


const empresaIdElemento =
    document.getElementById("empresaId");


const estadoCarga =
    document.getElementById("estadoCarga");


const formConsulta =
    document.getElementById("formConsulta");


const pregunta =
    document.getElementById("pregunta");


const btnConsultar =
    document.getElementById("btnConsultar");


const respuesta =
    document.getElementById("respuesta");


const resultado =
    document.getElementById("resultado");



/* ==========================================
   BASE DE DATOS LOCAL
========================================== */

const datos = {

    usuarios: [],
    empresas: [],
    clientes: [],
    presupuestos: [],
    trabajos: [],
    empleados: [],
    fichajes: [],
    gastos: [],
    facturas: [],
    cobros: [],
    fotos: [],
    conformidades: [],
    consultas: [],
    consultas_atencion: [],
    atenciones: [],
    correos: [],
    productos: [],
    suscripciones: [],
    ventas: []

};



/* ==========================================
   VARIABLES
========================================== */

let usuarioActual = null;

let empresaActual = "";

let datosCargados = false;



/* ==========================================
   ESCAPAR HTML
========================================== */

function escapar(texto){

    if(
        texto === null ||
        texto === undefined
    ){

        return "";

    }

    return String(texto)

        .replace(/&/g,"&amp;")

        .replace(/</g,"&lt;")

        .replace(/>/g,"&gt;")

        .replace(/"/g,"&quot;")

        .replace(/'/g,"&#039;");

}



/* ==========================================
   FORMATO DINERO
========================================== */

function dinero(valor){

    const numero =
        Number(valor) || 0;

    return numero.toLocaleString(
        "es-AR",
        {
            style:"currency",
            currency:"ARS",
            minimumFractionDigits:0
        }
    );

}



/* ==========================================
   FECHA
========================================== */

function fecha(valor){

    if(!valor){

        return "Sin fecha";

    }


    try{

        if(
            typeof valor.toDate ===
            "function"
        ){

            return valor
                .toDate()
                .toLocaleDateString(
                    "es-AR"
                );

        }


        if(
            typeof valor === "string"
        ){

            return new Date(valor)
                .toLocaleDateString(
                    "es-AR"
                );

        }


        return "Sin fecha";


    }catch(error){

        return "Sin fecha";

    }

}



/* ==========================================
   MENSAJE
========================================== */

function mostrarMensaje(
    texto,
    tipo
){

    resultado.textContent =
        texto;

    resultado.className =
        "alerta " + tipo;

}



/* ==========================================
   OBTENER DATOS DE COLECCIÓN
========================================== */

async function cargarColeccion(
    nombre,
    user,
    empresa
){

    try{

        const referencia =
            collection(
                db,
                nombre
            );


        /*
         * Primero intentamos por empresaId.
         */

        if(empresa){

            try{

                const qEmpresa =
                    query(
                        referencia,
                        where(
                            "empresaId",
                            "==",
                            empresa
                        )
                    );


                const snapshotEmpresa =
                    await getDocs(
                        qEmpresa
                    );


                if(
                    !snapshotEmpresa.empty
                ){

                    return snapshotEmpresa.docs.map(
                        doc => ({
                            id:doc.id,
                            ...doc.data()
                        })
                    );

                }

            }catch(error){

                console.log(
                    "No se pudo consultar por empresaId:",
                    nombre,
                    error.message
                );

            }

        }


        /*
         * Después intentamos por usuarioId.
         */

        if(user){

            try{

                const qUsuario =
                    query(
                        referencia,
                        where(
                            "usuarioId",
                            "==",
                            user.uid
                        )
                    );


                const snapshotUsuario =
                    await getDocs(
                        qUsuario
                    );


                if(
                    !snapshotUsuario.empty
                ){

                    return snapshotUsuario.docs.map(
                        doc => ({
                            id:doc.id,
                            ...doc.data()
                        })
                    );

                }

            }catch(error){

                console.log(
                    "No se pudo consultar por usuarioId:",
                    nombre,
                    error.message
                );

            }

        }


        /*
         * Para usuarios y empresas
         * buscamos todos los documentos.
         */

        if(
            nombre === "usuarios" ||
            nombre === "empresas"
        ){

            try{

                const snapshot =
                    await getDocs(
                        referencia
                    );


                return snapshot.docs.map(
                    doc => ({
                        id:doc.id,
                        ...doc.data()
                    })
                );

            }catch(error){

                console.log(
                    "Error leyendo:",
                    nombre,
                    error.message
                );

            }

        }


        return [];


    }catch(error){

        console.error(
            "Error colección:",
            nombre,
            error
        );

        return [];

    }

}



/* ==========================================
   BUSCAR EMPRESA DEL USUARIO
========================================== */

async function buscarEmpresa(
    user
){

    try{

        /*
         * 1. Buscar en usuarios.
         */

        const usuariosRef =
            collection(
                db,
                "usuarios"
            );


        let snapshot;


        try{

            snapshot =
                await getDocs(
                    query(
                        usuariosRef,
                        where(
                            "uid",
                            "==",
                            user.uid
                        )
                    )
                );

        }catch(error){

            snapshot = {
                empty:true
            };

        }


        if(
            snapshot &&
            !snapshot.empty
        ){

            const datosUsuario =
                snapshot.docs[0].data();


            const empresa =
                datosUsuario.empresaId ||
                datosUsuario.idEmpresa ||
                "";


            if(empresa){

                return empresa;

            }

        }


        /*
         * 2. Buscar en empleados.
         */

        try{

            const empleadosRef =
                collection(
                    db,
                    "empleados"
                );


            const empleadosSnapshot =
                await getDocs(
                    query(
                        empleadosRef,
                        where(
                            "authUid",
                            "==",
                            user.uid
                        )
                    )
                );


            if(
                !empleadosSnapshot.empty
            ){

                const empleado =
                    empleadosSnapshot
                        .docs[0]
                        .data();


                if(
                    empleado.empresaId
                ){

                    return empleado.empresaId;

                }

            }

        }catch(error){

            console.log(
                "No se pudo buscar empresa en empleados."
            );

        }


        /*
         * 3. Buscar directamente por
         * propietarioUid en empresas.
         */

        try{

            const empresasRef =
                collection(
                    db,
                    "empresas"
                );


            const empresasSnapshot =
                await getDocs(
                    query(
                        empresasRef,
                        where(
                            "propietarioUid",
                            "==",
                            user.uid
                        )
                    )
                );


            if(
                !empresasSnapshot.empty
            ){

                return empresasSnapshot
                    .docs[0]
                    .id;

            }

        }catch(error){

            console.log(
                "No se pudo buscar empresa por propietarioUid."
            );

        }


        return "";


    }catch(error){

        console.error(
            "ERROR EMPRESA:",
            error
        );

        return "";

    }

}



/* ==========================================
   CARGAR TODA LA INFORMACIÓN
========================================== */

async function cargarTodosLosDatos(
    user
){

    estadoCarga.textContent =
        "Cargando información de GESBASE...";


    empresaActual =
        await buscarEmpresa(
            user
        );


    empresaIdElemento.textContent =
        empresaActual ||
        "Sin empresa asociada";


    const colecciones = [

        "usuarios",
        "empresas",
        "clientes",
        "presupuestos",
        "trabajos",
        "empleados",
        "fichajes",
        "gastos",
        "facturas",
        "cobros",
        "fotos",
        "conformidades",
        "consultas",
        "consultas_atencion",
        "atenciones",
        "correos",
        "productos",
        "suscripciones",
        "ventas"

    ];


    let cantidad =
        0;


    for(
        const nombre of colecciones
    ){

        try{

            datos[nombre] =
                await cargarColeccion(
                    nombre,
                    user,
                    empresaActual
                );


            cantidad +=
                datos[nombre].length;


            estadoCarga.textContent =
                "Cargando " +
                nombre +
                "...";


        }catch(error){

            console.error(
                "Error:",
                nombre,
                error
            );

            datos[nombre] = [];

        }

    }


    /*
     * Filtrado de seguridad adicional.
     */

    Object.keys(datos).forEach(
        nombre => {

            if(
                !Array.isArray(
                    datos[nombre]
                )
            ){

                datos[nombre] = [];

            }

        }
    );


    datosCargados =
        true;


    estadoCarga.textContent =
        "✅ Información cargada: " +
        cantidad +
        " registros.";


    console.log(
        "DATOS GESBASE:",
        datos
    );

}



/* ==========================================
   LISTAR CLIENTES
========================================== */

function responderClientes(){

    const lista =
        datos.clientes;


    if(!lista.length){

        return `
            <div class="respuesta-item">
                No hay clientes registrados.
            </div>
        `;

    }


    let html = `

        <div class="respuesta-item">

            <strong>
                👥 Tenés ${lista.length}
                cliente${lista.length === 1 ? "" : "s"} registrado${lista.length === 1 ? "" : "s"}:
            </strong>

        </div>

    `;


    lista.forEach(
        cliente => {

            html += `

                <div class="respuesta-item">

                    <strong>
                        ${escapar(
                            cliente.nombre ||
                            "Sin nombre"
                        )}
                    </strong>

                    ${
                        cliente.cuit
                        ?
                        `<br>CUIT: ${escapar(cliente.cuit)}`
                        :
                        ""
                    }

                    ${
                        cliente.telefono
                        ?
                        `<br>Teléfono: ${escapar(cliente.telefono)}`
                        :
                        ""
                    }

                    ${
                        cliente.email
                        ?
                        `<br>Email: ${escapar(cliente.email)}`
                        :
                        ""
                    }

                </div>

            `;

        }
    );


    return html;

}



/* ==========================================
   FACTURAS
========================================== */

function responderFacturas(){

    const lista =
        datos.facturas;


    if(!lista.length){

        return `
            <div class="respuesta-item">
                No encontré facturas registradas.
            </div>
        `;

    }


    const total =
        lista.reduce(
            (suma,f) =>
                suma +
                Number(f.importe || f.total || 0),
            0
        );


    let html = `

        <div class="total">

            <div>
                Facturas encontradas
            </div>

            <div class="total-numero">
                ${lista.length}
            </div>

            <div>
                Importe total:
                <strong>${dinero(total)}</strong>
            </div>

        </div>

    `;


    lista.forEach(
        factura => {

            html += `

                <div class="respuesta-item">

                    <strong>
                        Factura ${escapar(
                            factura.numero ||
                            "Sin número"
                        )}
                    </strong>

                    <br>

                    Cliente:
                    ${escapar(
                        factura.cliente ||
                        "Sin cliente"
                    )}

                    <br>

                    Importe:
                    <strong>
                        ${dinero(
                            factura.importe ||
                            0
                        )}
                    </strong>

                    <br>

                    Estado:
                    <span class="estado">
                        ${escapar(
                            factura.estado ||
                            "Sin estado"
                        )}
                    </span>

                </div>

            `;

        }
    );


    return html;

}



/* ==========================================
   COBROS
========================================== */

function responderCobros(){

    const lista =
        datos.cobros;


    if(!lista.length){

        return `
            <div class="respuesta-item">
                No encontré cobros registrados.
            </div>
        `;

    }


    const pendientes =
        lista.filter(
            c =>
                String(
                    c.estado || ""
                ).toLowerCase()
                !== "cobrado" &&
                String(
                    c.estado || ""
                ).toLowerCase()
                !== "pagado"
        );


    const totalPendiente =
        pendientes.reduce(
            (suma,c) =>
                suma +
                Number(
                    c.importe || 0
                ),
            0
        );


    const totalGeneral =
        lista.reduce(
            (suma,c) =>
                suma +
                Number(
                    c.importe || 0
                ),
            0
        );


    return `

        <div class="total">

            <div>
                Total registrado en cobros
            </div>

            <div class="total-numero">
                ${dinero(totalGeneral)}
            </div>

            <br>

            <div>
                Pendiente:
                <strong>
                    ${dinero(totalPendiente)}
                </strong>
            </div>

        </div>


        <div class="respuesta-item">

            Hay
            <strong>
                ${pendientes.length}
            </strong>
            cobro${pendientes.length === 1 ? "" : "s"}
            pendiente${pendientes.length === 1 ? "" : "s"}.

        </div>

    `;

}



/* ==========================================
   GASTOS
========================================== */

function responderGastos(){

    const lista =
        datos.gastos;


    if(!lista.length){

        return `
            <div class="respuesta-item">
                No hay gastos registrados.
            </div>
        `;

    }


    const total =

========================================== */

function interpretarPregunta(
    texto
){

    const t =
        texto
            .toLowerCase()
            .normalize("NFD")
            .replace(
                /[\u0300-\u036f]/g,
                ""
            );


    /*
     * CLIENTES
     */

    if(
        t.includes("cliente") ||
        t.includes("clientes")
    ){

        return {

            titulo:
                "👥 Clientes",

            html:
                responderClientes()

        };

    }


    /*
     * COBROS
     */

    if(
        t.includes("cobro") ||
        t.includes("cobros") ||
        t.includes("deben") ||
        t.includes("deuda") ||
        t.includes("pendiente de pago") ||
        t.includes("pendiente de cobro")
    ){

        return {

            titulo:
                "💰 Cobros",

            html:
                responderCobros()

    }


    /*

        t.includes("facturado") ||

/* ==========================================
   CONSULTAR
========================================== */

async function consultar(){

    const texto =
        pregunta.value.trim();


    if(!texto){

        mostrarMensaje(
            "Escribí una pregunta.",
            "error"
        );

        return;

    }


    if(!usuarioActual){

        mostrarMensaje(
            "No hay un usuario autenticado.",
            "error"
        );

        return;

    }


    if(!datosCargados){

        mostrarMensaje(
            "La información todavía se está cargando.",
            "error"
        );

        return;

    }


    btnConsultar.disabled =
        true;

    btnConsultar.textContent =
        "🤖 Consultando...";


    respuesta.innerHTML =
        '<div class="cargando">Analizando la información de GESBASE...</div>';


    resultado.style.display =
        "none";


    try{

        /*
         * Pequeña pausa para que visualmente
         * se vea el proceso de consulta.
         */

        await new Promise(
            resolve =>
                setTimeout(
                    resolve,
                    150
                )
        );


        const resultadoConsulta =
            interpretarPregunta(
                texto
            );


        respuesta.innerHTML = `

            <div class="respuesta-item">

                <strong>
                    ${escapar(
                        resultadoConsulta.titulo
                    )}
                </strong>

            </div>

            ${resultadoConsulta.html}

        `;


    }catch(error){

        console.error(
            "ERROR ASISTENCIA:",
            error
        );


        respuesta.innerHTML = `

            <div class="alerta error"
                 style="display:block">

                No pude procesar la consulta.

                <br><br>

                ${escapar(
                    error.message
                )}

            </div>

        `;

    }finally{

        btnConsultar.disabled =
            false;

        btnConsultar.textContent =
            "🤖 Consultar";

    }

}

console.log(
    "GESBASE ASISTENCIA: esperando autenticación..."
);


onAuthStateChanged(
    auth,
    async function(user){

        console.log(
            "GESBASE ASISTENCIA AUTH:",
            user
        );


        if(!user){

            usuarioActual =
                null;


            usuarioEmail.textContent =
                "No autenticado";


            usuarioId.textContent =
                "No disponible";


            empresaIdElemento.textContent =
                "No disponible";


            estadoCarga.textContent =
                "No hay una sesión activa.";


            respuesta.innerHTML = `

                <div class="alerta error"
                     style="display:block">

                    🔒 No hay una sesión activa
                    de GESBASE.

                </div>

            `;

            return;

        }


        usuarioActual =
            user;


        usuarioEmail.textContent =
            user.email ||
            "Sin email";


        usuarioId.textContent =
            user.uid ||
            "Sin UID";


        try{

            await cargarTodosLosDatos(
                user
            );


            respuesta.innerHTML = `

                <div class="respuesta-item">

                    👋 <strong>Asistencia lista.</strong>

                </div>


                <div class="respuesta-item">

                    Ya puedo consultar los datos
                    disponibles de GESBASE.

                    <br><br>

                    Por ejemplo:

                    <br>

                    <strong>
                        ¿Qué clientes tengo?
                    </strong>

                </div>

            `;


        }catch(error){

            console.error(
                "ERROR CARGANDO ASISTENCIA:",
                error
            );


            estadoCarga.textContent =
                "Error al cargar información.";


            respuesta.innerHTML = `

                <div class="alerta error"
                     style="display:block">

                    ❌ No se pudo cargar
                    completamente la información.

                    <br><br>

                    ${escapar(
                        error.message
                    )}

                </div>

            `;

        }

    }
);


</script>


</body>

</html>
