<!DOCTYPE html>
<html lang="es-AR">

<head>
<meta charset="UTF-8">

<meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
>

<meta
    name="theme-color"
    content="#111827"
>

<meta
    name="description"
    content="GESBASE - Asistencia al cliente"
>

<title>Asistencia - GESBASE</title>

<style>

*{
    box-sizing:border-box;
    margin:0;
    padding:0;
}

body{
    font-family:Arial,Helvetica,sans-serif;
    background:#f3f4f6;
    color:#111827;
    min-height:100vh;
}

header{
    background:#111827;
    color:white;
    padding:18px 16px;
    position:sticky;
    top:0;
    z-index:10;
}

.header-contenido{
    max-width:900px;
    margin:auto;
    display:flex;
    align-items:center;
    gap:12px;
}

.logo{
    font-size:24px;
    font-weight:bold;
}

.subtitulo{
    font-size:13px;
    color:#d1d5db;
    margin-top:3px;
}

main{
    max-width:900px;
    margin:0 auto;
    padding:20px 15px 40px;
}

.boton-volver{
    display:inline-block;
    text-decoration:none;
    background:white;
    color:#111827;
    border:1px solid #d1d5db;
    padding:10px 15px;
    border-radius:10px;
    margin-bottom:18px;
    font-weight:bold;
}

.titulo{
    margin-bottom:18px;
}

.titulo h1{
    font-size:25px;
    margin-bottom:6px;
}

.titulo p{
    color:#6b7280;
    line-height:1.5;
}

.card{
    background:white;
    border-radius:16px;
    padding:20px;
    margin-bottom:20px;
    box-shadow:0 2px 10px rgba(0,0,0,.06);
}

.card h2{
    font-size:19px;
    margin-bottom:18px;
}

.usuario-box{
    background:#f9fafb;
    border:1px solid #e5e7eb;
    border-radius:12px;
    padding:14px;
    margin-bottom:18px;
}

.usuario-linea{
    margin-bottom:6px;
}

.usuario-linea:last-child{
    margin-bottom:0;
}

.usuario-label{
    font-size:12px;
    color:#6b7280;
}

.usuario-valor{
    font-weight:bold;
    margin-top:2px;
    word-break:break-word;
}

label{
    display:block;
    font-weight:bold;
    margin-bottom:7px;
    font-size:14px;
}

input,
select,
textarea{
    width:100%;
    border:1px solid #d1d5db;
    border-radius:10px;
    padding:12px;
    font-size:15px;
    font-family:inherit;
    background:white;
}

input:focus,
select:focus,
textarea:focus{
    outline:none;
    border-color:#111827;
}

.campo{
    margin-bottom:16px;
}

textarea{
    min-height:130px;
    resize:vertical;
}

.boton{
    width:100%;
    border:none;
    border-radius:10px;
    padding:14px;
    font-size:16px;
    font-weight:bold;
    cursor:pointer;
}

.boton-principal{
    background:#111827;
    color:white;
}

.boton-principal:disabled{
    opacity:.6;
    cursor:not-allowed;
}

.mensaje{
    display:none;
    border-radius:10px;
    padding:12px;
    margin-top:15px;
    line-height:1.4;
}

.mensaje.exito{
    display:block;
    background:#dcfce7;
    color:#166534;
    border:1px solid #86efac;
}

.mensaje.error{
    display:block;
    background:#fee2e2;
    color:#991b1b;
    border:1px solid #fca5a5;
}

.consulta{
    border:1px solid #e5e7eb;
    border-radius:12px;
    padding:15px;
    margin-bottom:12px;
}

.consulta:last-child{
    margin-bottom:0;
}

.consulta-cabecera{
    display:flex;
    justify-content:space-between;
    align-items:flex-start;
    gap:10px;
    margin-bottom:10px;
}

.consulta-asunto{
    font-weight:bold;
    font-size:16px;
}

.estado{
    display:inline-block;
    padding:5px 9px;
    border-radius:20px;
    font-size:12px;
    font-weight:bold;
    white-space:nowrap;
}

.estado-pendiente{
    background:#fef3c7;
    color:#92400e;
}

.estado-en_revision{
    background:#dbeafe;
    color:#1e40af;
}

.estado-respondida{
    background:#dcfce7;
    color:#166534;
}

.estado-cerrada{
    background:#e5e7eb;
    color:#374151;
}

.consulta-info{
    font-size:13px;
    color:#6b7280;
    margin-bottom:8px;
}

.consulta-mensaje{
    line-height:1.5;
    white-space:pre-wrap;
}

.sin-consultas{
    text-align:center;
    color:#6b7280;
    padding:25px 10px;
}

.cargando{
    text-align:center;
    color:#6b7280;
    padding:20px;
}

@media(max-width:600px){

    main{
        padding:15px 12px 35px;
    }

    .card{
        padding:16px;
    }

    .consulta-cabecera{
        flex-direction:column;
    }

    .estado{
        align-self:flex-start;
    }

}

</style>

</head>

<body>

<header>

    <div class="header-contenido">

        <div>
            <div class="logo">GESBASE</div>

            <div class="subtitulo">
                Asistencia al cliente
            </div>
        </div>

    </div>

</header>


<main>

    <a
        href="index.html"
        class="boton-volver"
    >
        ← Volver
    </a>


    <div class="titulo">

        <h1>🆘 Asistencia al cliente</h1>

        <p>
            Enviá tu consulta y nuestro equipo podrá ayudarte.
        </p>

    </div>


    <!-- DATOS DEL USUARIO -->

    <section class="card">

        <h2>👤 Mi cuenta</h2>

        <div class="usuario-box">

            <div class="usuario-linea">

                <div class="usuario-label">
                    Nombre
                </div>

                <div
                    class="usuario-valor"
                    id="nombreUsuario"
                >
                    Cargando...
                </div>

            </div>


            <div class="usuario-linea">

                <div class="usuario-label">
                    Email
                </div>

                <div
                    class="usuario-valor"
                    id="emailUsuario"
                >
                    Cargando...
                </div>

            </div>


            <div class="usuario-linea">

                <div class="usuario-label">
                    Empresa
                </div>

                <div
                    class="usuario-valor"
                    id="empresaUsuario"
                >
                    Cargando...
                </div>

            </div>

        </div>

    </section>


    <!-- NUEVA CONSULTA -->

    <section class="card">

        <h2>📝 Nueva consulta</h2>


        <form id="formConsulta">


            <div class="campo">

                <label for="categoria">
                    Categoría
                </label>

                <select
                    id="categoria"
                    required
                >

                    <option value="">
                        Seleccioná una categoría
                    </option>

                    <option value="Problema técnico">
                        Problema técnico
                    </option>

                    <option value="Problema con mi cuenta">
                        Problema con mi cuenta
                    </option>

                    <option value="Presupuestos">
                        Presupuestos
                    </option>

                    <option value="Clientes">
                        Clientes
                    </option>

                    <option value="Trabajos">
                        Trabajos
                    </option>

                    <option value="Empleados">
                        Empleados
                    </option>

                    <option value="Fichajes">
                        Fichajes
                    </option>

                    <option value="Gastos">
                        Gastos
                    </option>

                    <option value="Facturación">
                        Facturación
                    </option>

                    <option value="Cobros">
                        Cobros
                    </option>

                    <option value="Suscripción">
                        Suscripción
                    </option>

                    <option value="Otro">
                        Otro
                    </option>

                </select>

            </div>


            <div class="campo">

                <label for="asunto">
                    Asunto
                </label>

                <input
                    type="text"
                    id="asunto"
                    maxlength="150"
                    placeholder="Ej.: No puedo guardar un presupuesto"
                    required
                >

            </div>


            <div class="campo">

                <label for="mensaje">
                    ¿Qué problema tenés?
                </label>

                <textarea
                    id="mensaje"
                    maxlength="3000"
                    placeholder="Explicá detalladamente qué está sucediendo..."
                    required
                ></textarea>

            </div>


            <button
                type="submit"
                class="boton boton-principal"
                id="btnEnviar"
            >
                📩 Enviar consulta
            </button>


            <div
                id="mensajeResultado"
                class="mensaje"
            ></div>


        </form>

    </section>


    <!-- HISTORIAL -->

    <section class="card">

        <h2>📋 Mis consultas</h2>

        <div
            id="listaConsultas"
            class="cargando"
        >
            Cargando consultas...
        </div>

    </section>


</main>


<script type="module">

import {
    auth,
    db
} from "./firebase.js";

import {
    onAuthStateChanged
} from "https://www.gstatic.com/firebasejs/12.18.0/firebase-auth.js";

import {
    collection,
    addDoc,
    getDocs,
    query,
    where,
    orderBy,
    serverTimestamp
} from "https://www.gstatic.com/firebasejs/12.18.0/firebase-firestore.js";


const nombreUsuario =
    document.getElementById("nombreUsuario");

const emailUsuario =
    document.getElementById("emailUsuario");

const empresaUsuario =
    document.getElementById("empresaUsuario");

const formConsulta =
    document.getElementById("formConsulta");

const btnEnviar =
    document.getElementById("btnEnviar");

const mensajeResultado =
    document.getElementById("mensajeResultado");

const listaConsultas =
    document.getElementById("listaConsultas");


let usuarioActual = null;
let empresaActual = null;


/* ==========================================
   MOSTRAR MENSAJE
========================================== */

function mostrarMensaje(texto, tipo){

    mensajeResultado.textContent = texto;

    mensajeResultado.className =
        "mensaje " + tipo;

}


/* ==========================================
   ESCAPAR HTML
========================================== */

function escaparHTML(texto){

    if(texto === null || texto === undefined){
        return "";
    }

    return String(texto)
        .replace(/&/g,"&amp;")
        .replace(/</g,"&lt;")
        .replace(/>/g,"&gt;")
        .replace(/"/g,"&quot;")
        .replace(/'/g,"&#039;");

}


/* ==========================================
   FORMATEAR FECHA
========================================== */

function formatearFecha(timestamp){

    if(!timestamp){
        return "Fecha no disponible";
    }

    try{

        const fecha =
            timestamp.toDate();

        return fecha.toLocaleString(
            "es-AR",
            {
                day:"2-digit",
                month:"2-digit",
                year:"numeric",
                hour:"2-digit",
                minute:"2-digit"
            }
        );

    }catch(error){

        return "Fecha no disponible";

    }

}


/* ==========================================
   TEXTO DEL ESTADO
========================================== */

function textoEstado(estado){

    switch(estado){

        case "pendiente":
            return "Pendiente";

        case "en_revision":
            return "En revisión";

        case "respondida":
            return "Respondida";

        case "cerrada":
            return "Cerrada";

        default:
            return estado || "Pendiente";

    }

}


/* ==========================================
   CARGAR PERFIL
========================================== */

async function cargarPerfil(user){

    try{

        const q =
            query(
                collection(db,"usuarios"),
                where("uid","==",user.uid)
            );

        const snapshot =
            await getDocs(q);


        if(!snapshot.empty){

            const datos =
                snapshot.docs[0].data();

            usuarioActual = {
                id:snapshot.docs[0].id,
                ...datos
            };

        }else{

            usuarioActual = {
                id:user.uid,
                uid:user.uid,
                email:user.email || ""
            };

        }


        const nombre =
            usuarioActual.nombre ||
            (
                (usuarioActual.nombre || "") +
                " " +
                (usuarioActual.apellido || "")
            ).trim() ||
            user.displayName ||
            "Usuario";


        nombreUsuario.textContent =
            nombre;

        emailUsuario.textContent =
            usuarioActual.email ||
            user.email ||
            "Sin email";


        const empresaId =
            usuarioActual.empresaId ||
            usuarioActual.idEmpresa ||
            "";


        if(empresaId){

            empresaActual = {
                id:empresaId
            };

            try{

                const empresaRef =
                    collection(db,"empresas");

                const empresaQuery =
                    query(
                        empresaRef,
                        where("__name__","==",empresaId)
                    );

                const empresaSnapshot =
                    await getDocs(empresaQuery);


                if(!empresaSnapshot.empty){

                    const datosEmpresa =
                        empresaSnapshot.docs[0].data();

                    empresaActual = {
                        id:empresaId,
                        ...datosEmpresa
                    };

                    empresaUsuario.textContent =
                        datosEmpresa.nombre ||
                        datosEmpresa.nombreEmpresa ||
                        "Empresa";

                }else{

                    empresaUsuario.textContent =
                        empresaId;

                }

            }catch(error){

                console.error(
                    "Error cargando empresa:",
                    error
                );

                empresaUsuario.textContent =
                    empresaId;

            }

        }else{

            empresaUsuario.textContent =
                "No asociada";

        }


    }catch(error){

        console.error(
            "Error cargando perfil:",
            error
        );


        nombreUsuario.textContent =
            user.displayName ||
            "Usuario";


        emailUsuario.textContent =
            user.email ||
            "Sin email";


        empresaUsuario.textContent =
            "No disponible";

    }

}


/* ==========================================
   ENVIAR CONSULTA
========================================== */

formConsulta.addEventListener(
    "submit",
    async function(event){

        event.preventDefault();


        if(!usuarioActual){

            mostrarMensaje(
                "No se pudo identificar al usuario.",
                "error"
            );

            return;

        }


        const categoria =
            document.getElementById("categoria")
                .value
                .trim();

        const asunto =
            document.getElementById("asunto")
                .value
                .trim();

        const mensaje =
            document.getElementById("mensaje")
                .value
                .trim();


        if(!categoria ||
           !asunto ||
           !mensaje){

            mostrarMensaje(
                "Completá todos los campos.",
                "error"
            );

            return;

        }


        btnEnviar.disabled = true;

        btnEnviar.textContent =
            "Enviando...";


        try{

            const user =
                auth.currentUser;


            if(!user){

                throw new Error(
                    "La sesión expiró. Volvé a iniciar sesión."
                );

            }


            const nombre =
                usuarioActual.nombre ||
                (
                    (usuarioActual.nombre || "") +
                    " " +
                    (usuarioActual.apellido || "")
                ).trim() ||
                user.displayName ||
                "Usuario";


            const email =
                usuarioActual.email ||
                user.email ||
                "";


            const empresaId =
                usuarioActual.empresaId ||
                usuarioActual.idEmpresa ||
                "";


            await addDoc(
                collection(db,"consultas"),
                {

                    usuarioId:user.uid,

                    empresaId:empresaId,

                    nombre:nombre,

                    email:email,

                    categoria:categoria,

                    asunto:asunto,

                    mensaje:mensaje,

                    estado:"pendiente",

                    prioridad:"normal",

                    fechaCreacion:
                        serverTimestamp(),

                    fechaActualizacion:
                        serverTimestamp(),

                    ultimaRespuesta:""

                }
            );


            formConsulta.reset();


            mostrarMensaje(
                "✅ Consulta enviada correctamente. Nuestro equipo la revisará.",
                "exito"
            );


            await cargarConsultas();


        }catch(error){

            console.error(
                "Error enviando consulta:",
                error
            );


            mostrarMensaje(
                "No se pudo enviar la consulta: " +
                error.message,
                "error"
            );

        }finally{

            btnEnviar.disabled = false;

            btnEnviar.textContent =
                "📩 Enviar consulta";

        }

    }
);


/* ==========================================
   CARGAR CONSULTAS
========================================== */

async function cargarConsultas(){

    if(!usuarioActual){

        listaConsultas.innerHTML =
            '<div class="sin-consultas">No se pudo identificar el usuario.</div>';

        return;

    }


    try{

        const q =
            query(
                collection(db,"consultas"),
                where(
                    "usuarioId",
                    "==",
                    auth.currentUser.uid
                ),
                orderBy(
                    "fechaCreacion",
                    "desc"
                )
            );


        const snapshot =
            await getDocs(q);


        if(snapshot.empty){

            listaConsultas.innerHTML =
                '<div class="sin-consultas">Todavía no tenés consultas de asistencia.</div>';

            return;

        }


        let html = "";


        snapshot.forEach(doc => {

            const datos =
                doc.data();

            const estado =
                datos.estado ||
                "pendiente";


            html += `

                <div class="consulta">

                    <div class="consulta-cabecera">

                        <div class="consulta-asunto">
                            ${escaparHTML(
                                datos.asunto ||
                                "Sin asunto"
                            )}
                        </div>

                        <span
                            class="estado estado-${escaparHTML(
                                estado
                            )}"
                        >
                            ${escaparHTML(
                                textoEstado(estado)
                            )}
                        </span>

                    </div>


                    <div class="consulta-info">

                        ${escaparHTML(
                            datos.categoria ||
                            "Sin categoría"
                        )}

                        ·

                        ${formatearFecha(
                            datos.fechaCreacion
                        )}

                    </div>


                    <div class="consulta-mensaje">

                        ${escaparHTML(
                            datos.mensaje ||
                            ""
                        )}

                    </div>

                </div>

            `;

        });


        listaConsultas.innerHTML =
            html;


    }catch(error){

        console.error(
            "Error cargando consultas:",
            error
        );


        /*
         * Si Firebase solicita un índice,
         * mostrará el error en consola.
         */

        listaConsultas.innerHTML = `

            <div class="mensaje error"
                 style="display:block">

                No se pudieron cargar las consultas.

            </div>

        `;

    }

}


/* ==========================================
   AUTENTICACIÓN
========================================== */

onAuthStateChanged(
    auth,
    async function(user){

        if(!user){

            window.location.href =
                "login.html";

            return;

        }


        try{

            await cargarPerfil(user);

            await cargarConsultas();

        }catch(error){

            console.error(
                "Error inicializando asistencia:",
                error
            );

        }

    }
);

</script>

</body>

</html>
