<!DOCTYPE html>
<html lang="es">

<head>

<meta charset="UTF-8">

<meta name="viewport" content="width=device-width, initial-scale=1.0">

<meta name="theme-color" content="#111827">

<meta name="description" content="GESBASE - Certificaciones">

<title>Certificaciones - GESBASE</title>

<style>

*{
    box-sizing:border-box;
    margin:0;
    padding:0;
}

body{
    font-family:Arial,Helvetica,sans-serif;
    background:#f3f4f6;
    color:#111827;
}

.contenedor{
    width:100%;
    max-width:750px;
    min-height:100vh;
    margin:auto;
    background:#fff;
}

header{
    background:#111827;
    color:white;
    padding:24px 20px;
}

header h1{
    font-size:25px;
}

header p{
    margin-top:6px;
    color:#d1d5db;
    font-size:14px;
}

main{
    padding:20px;
}

.usuario{
    background:#f3f4f6;
    padding:14px;
    border-radius:10px;
    margin-bottom:15px;
    font-size:14px;
}

.acciones{
    display:flex;
    gap:10px;
    margin-bottom:18px;
}

.boton{
    display:block;
    width:100%;
    padding:14px;
    border:0;
    border-radius:10px;
    font-size:15px;
    font-weight:bold;
    text-align:center;
    text-decoration:none;
    cursor:pointer;
}

.boton-nuevo{
    flex:1;
    background:#111827;
    color:white;
}

.boton-actualizar{
    flex:1;
    background:#374151;
    color:white;
}

.boton:disabled{
    opacity:.6;
    cursor:not-allowed;
}

.buscador{
    width:100%;
    padding:14px;
    border:1px solid #d1d5db;
    border-radius:10px;
    font-size:15px;
    margin-bottom:18px;
    outline:none;
}

.buscador:focus{
    border-color:#2563eb;
}

.cargando{
    text-align:center;
    padding:30px;
    color:#6b7280;
}

.lista{
    display:flex;
    flex-direction:column;
    gap:15px;
}

.certificacion{
    border:1px solid #d1d5db;
    border-radius:14px;
    padding:18px;
    background:white;
    box-shadow:0 3px 10px rgba(0,0,0,.08);
}

.titulo{
    font-size:20px;
    font-weight:bold;
    margin-bottom:12px;
}

.dato{
    margin-top:8px;
    font-size:14px;
    color:#4b5563;
    line-height:1.4;
}

.estado{
    display:inline-block;
    margin-top:12px;
    padding:7px 10px;
    border-radius:8px;
    background:#e5e7eb;
    font-size:13px;
    font-weight:bold;
}

.boton-ver{
    margin-top:15px;
    background:#111827;
    color:white;
}

.boton-eliminar{
    margin-top:10px;
    background:#fee2e2;
    color:#991b1b;
    border:1px solid #fecaca;
}

.sin-datos{
    text-align:center;
    padding:35px 20px;
    color:#6b7280;
}

.error{
    display:none;
    background:#fee2e2;
    color:#991b1b;
    padding:14px;
    border-radius:10px;
    margin-bottom:15px;
    line-height:1.5;
    word-break:break-word;
}

.volver{
    margin-top:20px;
    background:#e5e7eb;
    color:#111827;
}

@media(max-width:480px){

    main{
        padding:15px;
    }

    .acciones{
        flex-direction:column;
    }

}

</style>

</head>

<body>

<div class="contenedor">

<header>

<h1>Certificaciones</h1>

<p>GESBASE</p>

</header>

<main>

<div
    id="usuario"
    class="usuario"
>
Verificando usuario...
</div>

<div
    id="error"
    class="error"
></div>

<div class="acciones">

<a
    href="certificacion.html"
    class="boton boton-nuevo"
>
+ NUEVA CERTIFICACIÓN
</a>

<button
    type="button"
    id="btnActualizar"
    class="boton boton-actualizar"
>
🔄 ACTUALIZAR
</button>

</div>

<input
    type="search"
    id="buscador"
    class="buscador"
    placeholder="🔎 Buscar certificación..."
    autocomplete="off"
>

<div
    id="cargando"
    class="cargando"
>
Cargando certificaciones...
</div>

<div
    id="lista"
    class="lista"
></div>

<div
    id="sinDatos"
    class="sin-datos"
    style="display:none;"
>
Todavía no tenés certificaciones registradas.
</div>

<a
    href="index.html"
    class="boton volver"
>
⬅️ VOLVER A GESBASE
</a>

</main>

</div>


<script type="module">

import {
    auth,
    db
} from "./Js/firebase.js";

import {
    onAuthStateChanged
} from "https://www.gstatic.com/firebasejs/12.18.0/firebase-auth.js";

import {
    collection,
    query,
    where,
    getDocs,
    doc,
    getDoc,
    deleteDoc
} from "https://www.gstatic.com/firebasejs/12.18.0/firebase-firestore.js";


const usuarioElemento =
    document.getElementById("usuario");

const errorElemento =
    document.getElementById("error");

const cargando =
    document.getElementById("cargando");

const lista =
    document.getElementById("lista");

const sinDatos =
    document.getElementById("sinDatos");

const buscador =
    document.getElementById("buscador");

const btnActualizar =
    document.getElementById("btnActualizar");


let usuarioActual = null;

let certificaciones = [];


function escaparHTML(valor){

    const div =
        document.createElement("div");

    div.textContent =
        valor ?? "";

    return div.innerHTML;
}


function mostrarError(mensaje){

    errorElemento.textContent =
        mensaje;

    errorElemento.style.display =
        "block";
}


function ocultarError(){

    errorElemento.textContent =
        "";

    errorElemento.style.display =
        "none";
}


function obtenerTexto(datos, campos){

    for(const campo of campos){

        if(
            datos[campo] !== undefined &&
            datos[campo] !== null &&
            String(datos[campo]).trim() !== ""
        ){

            return String(datos[campo]);
        }
    }

    return "-";
}


function crearTarjeta(item){

    const datos =
        item.datos;

    const tarjeta =
        document.createElement("div");

    tarjeta.className =
        "certificacion";


    const cliente =
        escaparHTML(
            obtenerTexto(
                datos,
                [
                    "clienteNombre",
                    "cliente",
                    "nombreCliente"
                ]
            )
        );


    const presupuesto =
        escaparHTML(
            obtenerTexto(
                datos,
                [
                    "presupuestoNombre",
                    "presupuesto",
                    "numeroPresupuesto"
                ]
            )
        );


    const trabajo =
        escaparHTML(
            obtenerTexto(
                datos,
                [
                    "trabajoNombre",
                    "trabajo",
                    "nombreTrabajo"
                ]
            )
        );


    const fecha =
        escaparHTML(
            obtenerTexto(
                datos,
                [
                    "fecha",
                    "fechaCertificacion"
                ]
            )
        );


    const estado =
        escaparHTML(
            obtenerTexto(
                datos,
                [
                    "estado"
                ]
            )
        );


    tarjeta.innerHTML = `

        <div class="titulo">
            📋 Certificación
        </div>

        <div class="dato">
            👤 Cliente:
            ${cliente}
        </div>

        <div class="dato">
            💰 Presupuesto:
            ${presupuesto}
        </div>

        <div class="dato">
            🔧 Trabajo:
            ${trabajo}
        </div>

        <div class="dato">
            📅 Fecha:
            ${fecha}
        </div>

        <div class="estado">
            Estado: ${estado}
        </div>

        <a
            href="certificacion.html?id=${encodeURIComponent(item.id)}"
            class="boton boton-ver"
        >
            👁️ VER / EDITAR
        </a>

        <button
            type="button"
            class="boton boton-eliminar"
        >
            🗑️ ELIMINAR
        </button>

    `;


    const botonEliminar =
        tarjeta.querySelector(
            ".boton-eliminar"
        );


    botonEliminar.addEventListener(
        "click",
        function(){

            eliminarCertificacion(
                item.id
            );

        }
    );


    return tarjeta;
}


function mostrarCertificaciones(){

    lista.innerHTML = "";

    const termino =
        buscador.value
            .trim()
            .toLowerCase();


    let resultados =
        certificaciones;


    if(termino){

        resultados =
            certificaciones.filter(
                function(item){

                    const datos =
                        item.datos;


                    const texto =
                        [

                            datos.clienteNombre,

                            datos.cliente,

                            datos.nombreCliente,

                            datos.presupuestoNombre,

                            datos.presupuesto,

                            datos.numeroPresupuesto,

                            datos.trabajoNombre,

                            datos.trabajo,

                            datos.nombreTrabajo,

                            datos.fecha,

                            datos.estado

                        ]
                        .filter(Boolean)
                        .join(" ")
                        .toLowerCase();


                    return texto.includes(
                        termino
                    );

                }
            );

    }


    if(resultados.length === 0){

        sinDatos.style.display =
            "block";

        if(termino){

            sinDatos.textContent =
                "No se encontraron certificaciones.";
        }
        else{

            sinDatos.textContent =
                "Todavía no tenés certificaciones registradas.";
        }

        return;
    }


    sinDatos.style.display =
        "none";


    resultados.forEach(
        function(item){

            lista.appendChild(
                crearTarjeta(item)
            );

        }
    );

}


async function cargarCertificaciones(){

    if(!usuarioActual){

        return;
    }


    ocultarError();

    cargando.style.display =
        "block";

    lista.innerHTML =
        "";

    sinDatos.style.display =
        "none";


    try{

        /*
        =================================================
        COLECCIÓN PRINCIPAL

        IMPORTANTE:
        Se utiliza directamente db, que viene de:

        ./Js/firebase.js
        =================================================
        */

        const referencia =
            collection(
                db,
                "certificaciones"
            );


        const consulta =
            query(
                referencia,
                where(
                    "uid",
                    "==",
                    usuarioActual.uid
                )
            );


        const resultado =
            await getDocs(
                consulta
            );


        certificaciones =
            [];


        resultado.forEach(
            function(documento){

                certificaciones.push({

                    id:
                        documento.id,

                    datos:
                        documento.data()

                });

            }
        );


        certificaciones.sort(
            function(a,b){

                const fechaA =
                    String(
                        a.datos.fecha ||
                        ""
                    );

                const fechaB =
                    String(
                        b.datos.fecha ||
                        ""
                    );

                return fechaB.localeCompare(
                    fechaA
                );

            }
        );


        cargando.style.display =
            "none";


        mostrarCertificaciones();

    }
    catch(error){

        console.error(
            "Error cargando certificaciones:",
            error
        );


        cargando.style.display =
            "none";


        mostrarError(
            "No se pudieron cargar las certificaciones: " +
            error.message
        );

    }

}


async function eliminarCertificacion(id){

    if(!usuarioActual){

        mostrarError(
            "No hay una sesión activa."
        );

        return;
    }


    const confirmar =
        window.confirm(
            "¿Seguro que querés eliminar esta certificación?\n\nEsta acción no se puede deshacer."
        );


    if(!confirmar){

        return;
    }


    try{

        const referencia =
            doc(
                db,
                "certificaciones",
                id
            );


        const resultado =
            await getDoc(
                referencia
            );


        if(!resultado.exists()){

            alert(
                "La certificación ya no existe."
            );

            await cargarCertificaciones();

            return;
        }


        const datos =
            resultado.data();


        if(
            datos.uid !==
            usuarioActual.uid
        ){

            alert(
                "No tenés permiso para eliminar esta certificación."
            );

            return;
        }


        await deleteDoc(
            referencia
        );


        alert(
            "Certificación eliminada correctamente."
        );


        await cargarCertificaciones();

    }
    catch(error){

        console.error(
            "Error eliminando certificación:",
            error
        );


        mostrarError(
            "No se pudo eliminar la certificación: " +
            error.message
        );

    }

}


buscador.addEventListener(
    "input",
    function(){

        mostrarCertificaciones();

    }
);


btnActualizar.addEventListener(
    "click",
    async function(){

        if(!usuarioActual){

            mostrarError(
                "Esperá unos segundos mientras se verifica la sesión."
            );

            return;
        }


        btnActualizar.disabled =
            true;

        btnActualizar.textContent =
            "⏳ CARGANDO...";


        await cargarCertificaciones();


        btnActualizar.disabled =
            false;

        btnActualizar.textContent =
            "🔄 ACTUALIZAR";

    }
);


onAuthStateChanged(
    auth,
    function(usuario){

        if(!usuario){

            window.location.replace(
                "login.html"
            );

            return;
        }


        usuarioActual =
            usuario;


        usuarioElemento.textContent =
            "Usuario: " +
            (
                usuario.email ||
                "Usuario autenticado"
            );


        cargarCertificaciones();

    }
);

</script>

</body>

</html>
