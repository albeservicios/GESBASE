<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Certificación - GESBASE</title>
<style>
body{margin:0;font-family:Arial;background:#f3f4f6}
header{background:#111827;color:#fff;padding:18px;text-align:center}
main{max-width:700px;margin:auto;padding:16px}
.card{background:#fff;border-radius:12px;padding:16px;margin-bottom:16px}
label{font-weight:bold;display:block;margin:12px 0 6px}
select,input,textarea{width:100%;padding:12px;border:1px solid #d1d5db;border-radius:8px}
button{width:100%;padding:14px;border:0;border-radius:8px;background:#2563eb;color:#fff;font-weight:bold}
</style>
</head>
<body>

<header>
<h2>📋 Certificación</h2>
</header>

<main>

<div class="card">
<div id="usuario">Conectando...</div>

<label>Cliente</label>
<select id="cliente">
<option value="">Cargando...</option>
</select>

<label>Presupuesto</label>
<select id="presupuesto" disabled>
<option value="">Seleccioná un cliente</option>
</select>

<label>Trabajo</label>
<select id="trabajo" disabled>
<option value="">Seleccioná un presupuesto</option>
</select>

<label>Fecha</label>
<input type="date" id="fecha">

<label>Observaciones</label>
<textarea id="obs"></textarea>

<button id="guardar">GUARDAR CERTIFICACIÓN</button>
</div>

</main>

<script type="module">

import { auth, db } from "./Js/firebase.js";

import { onAuthStateChanged } from "https://www.gstatic.com/firebasejs/12.18.0/firebase-auth.js";

import {
collection,
query,
where,
getDocs,
addDoc,
serverTimestamp
} from "https://www.gstatic.com/firebasejs/12.18.0/firebase-firestore.js";

let uid="";
let clientes=[];
let presupuestos=[];
let trabajos=[];

const cliente=document.getElementById("cliente");
const presupuesto=document.getElementById("presupuesto");
const trabajo=document.getElementById("trabajo");
const fecha=document.getElementById("fecha");

fecha.value=new Date().toISOString().slice(0,10);
    onAuthStateChanged(auth, async (user) => {
  if (!user) {
    location.href = "login.html";
    return;
  }

  uid = user.uid;
  document.getElementById("usuario").textContent = user.email;

  // CLIENTES
  const cliSnap = await getDocs(
    query(collection(db, "clientes"), where("uid", "==", uid))
  );

  clientes = [];
  cliente.innerHTML = '<option value="">Seleccioná un cliente</option>';

  cliSnap.forEach(doc => {
    const d = doc.data();
    clientes.push({ id: doc.id, ...d });

    cliente.innerHTML += `
      <option value="${doc.id}">
        ${d.nombre || d.empresa || "Cliente"}
      </option>`;
  });

  // PRESUPUESTOS
  const preSnap = await getDocs(
    query(collection(db, "presupuestos"), where("uid", "==", uid))
  );

  presupuestos = [];
  preSnap.forEach(doc => {
    presupuestos.push({ id: doc.id, ...doc.data() });
  });
});

cliente.addEventListener("change", () => {

  presupuesto.disabled = false;
  presupuesto.innerHTML =
    '<option value="">Seleccioná un presupuesto</option>';

  trabajo.innerHTML =
    '<option value="">Seleccioná un presupuesto</option>';
  trabajo.disabled = true;

  const lista = presupuestos.filter(
    p => (p.clienteId || p.idCliente) === cliente.value
  );

  lista.forEach(p => {
    presupuesto.innerHTML += `
      <option value="${p.id}">
        ${p.numero || p.nombre || p.id}
      </option>`;
  });
});
    // ===== CARGAR TRABAJOS =====

const traSnap = await getDocs(
  query(collection(db, "trabajos"), where("uid", "==", uid))
);

trabajos = [];
traSnap.forEach(doc => {
  trabajos.push({ id: doc.id, ...doc.data() });
});

presupuesto.addEventListener("change", () => {

  trabajo.disabled = false;
  trabajo.innerHTML =
    '<option value="">Seleccioná un trabajo</option>';

  const lista = trabajos.filter(
    t => (t.presupuestoId || t.idPresupuesto) === presupuesto.value
  );

  lista.forEach(t => {
    trabajo.innerHTML += `
      <option value="${t.id}">
        ${t.nombre || t.descripcion || "Trabajo"}
      </option>`;
  });
});

// ===== GUARDAR CERTIFICACIÓN =====

document.getElementById("guardar").addEventListener("click", async () => {

  if (!cliente.value || !presupuesto.value || !trabajo.value) {
    alert("Seleccioná cliente, presupuesto y trabajo.");
    return;
  }

  await addDoc(collection(db, "certificaciones"), {
    uid,
    clienteId: cliente.value,
    presupuestoId: presupuesto.value,
    trabajoId: trabajo.value,
    fecha: fecha.value,
    observaciones: document.getElementById("obs").value,
    estado: "Pendiente",
    creado: serverTimestamp()
  });

  alert("Certificación guardada correctamente");
  location.href = "certificaciones.html";
});

</script>
</body>
</html>
