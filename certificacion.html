Seleccioná un trabajo para ver sus certificaciones.
</div></div></div></div><script type="module">

/* =====================================================
   FIREBASE
===================================================== */

import {
    auth,
    db
} from "./Js/firebase.js";


import {
    onAuthStateChanged
} from "https://www.gstatic.com/firebasejs/12.18.0/firebase-auth.js";


import {
    collection,
    query,
    where,
    getDocs,
    getDoc,
    doc,
    addDoc,
    serverTimestamp
} from "https://www.gstatic.com/firebasejs/12.18.0/firebase-firestore.js";


/* =====================================================
   VARIABLES
===================================================== */

let usuarioActual = null;

let empresaIdActual = "";

let clientes = [];

let presupuestos = [];

let trabajos = [];

let itemsTrabajo = [];

let certificaciones = [];

let trabajoActual = null;


/* =====================================================
   ELEMENTOS
===================================================== */

const clienteSelect =
    document.getElementById("cliente");

const presupuestoSelect =
    document.getElementById("presupuesto");

const trabajoSelect =
    document.getElementById("trabajo");

const cardCertificacion =
    document.getElementById("cardCertificacion");

const itemsCertificacion =
    document.getElementById("itemsCertificacion");

const listaCertificaciones =
    document.getElementById("listaCertificaciones");

const infoTrabajo =
    document.getElementById("infoTrabajo");

const mensaje =
    document.getElementById("mensaje");

const btnGuardar =
    document.getElementById("btnGuardar");

const btnLimpiar =
    document.getElementById("btnLimpiar");

const numeroCertificacion =
    document.getElementById("numeroCertificacion");

const fechaCertificacion =
    document.getElementById("fechaCertificacion");

const observaciones =
    document.getElementById("observaciones");


/* =====================================================
   MENSAJES
===================================================== */

function mostrarMensaje(
    texto,
    tipo
){

    mensaje.textContent =
        texto;

    mensaje.className =
        "mensaje " + tipo;

    window.scrollTo({
        top:0,
        behavior:"smooth"
    });

}


/* =====================================================
   ESCAPE HTML
===================================================== */

function escapeHTML(valor){

    return String(
        valor ?? ""
    )
    .replace(/&/g,"&amp;")
    .replace(/</g,"&lt;")
    .replace(/>/g,"&gt;")
    .replace(/"/g,"&quot;")
    .replace(/'/g,"&#039;");

}


/* =====================================================
   LIMPIAR ID
===================================================== */

function limpiarId(valor){

    if(
        valor === null ||
        valor === undefined
    ){

        return "";

    }

    return String(valor).trim();

}


/* =====================================================
   FECHA HOY
===================================================== */

function fechaHoy(){

    const fecha =
        new Date();

    return (
        fecha.getFullYear() +
        "-" +
        String(
            fecha.getMonth()+1
        ).padStart(2,"0") +
        "-" +
        String(
            fecha.getDate()
        ).padStart(2,"0")
    );

}


fechaCertificacion.value =
    fechaHoy();


/* =====================================================
   NOMBRE CLIENTE
===================================================== */

function obtenerNombreCliente(
    cliente
){

    return (
        cliente.nombreCompleto ||
        cliente.nombreCliente ||
        cliente.nombre ||
        cliente.razonSocial ||
        cliente.empresa ||
        (
            cliente.nombre &&
            cliente.apellido
            ?
            cliente.nombre +
            " " +
            cliente.apellido
            :
            ""
        ) ||
        "Cliente sin nombre"
    );

}


/* =====================================================
   NÚMERO PRESUPUESTO
===================================================== */

function obtenerNumeroPresupuesto(
    presupuesto
){

    return (
        presupuesto.numeroPresupuesto ||
        presupuesto.numero ||
        presupuesto.nro ||
        presupuesto.codigo ||
        presupuesto.nombre ||
        presupuesto.titulo ||
        presupuesto.id
    );

}


/* =====================================================
   NOMBRE TRABAJO
===================================================== */

function obtenerNombreTrabajo(
    trabajo
){

    return (
        trabajo.nombreTrabajo ||
        trabajo.nombre ||
        trabajo.titulo ||
        "Trabajo"
    );

}


/* =====================================================
   OBTENER CLIENTE DEL PRESUPUESTO
===================================================== */

function obtenerClienteIdPresupuesto(
    presupuesto
){

    const campos = [

        "clienteId",
        "idCliente",
        "clienteID",
        "cliente_id",
        "id_cliente"

    ];


    for(
        const campo of campos
    ){

        if(
            presupuesto[campo] !==
            undefined &&
            presupuesto[campo] !==
            null &&
            limpiarId(
                presupuesto[campo]
            ) !== ""
        ){

            return limpiarId(
                presupuesto[campo]
            );

        }

    }


    if(
        presupuesto.cliente &&
        typeof presupuesto.cliente ===
        "object"
    ){

        return limpiarId(
            presupuesto.cliente.id ||
            presupuesto.cliente.clienteId
        );

    }


    return limpiarId(
        presupuesto.cliente
    );

}


/* =====================================================
   OBTENER PRESUPUESTO DEL TRABAJO
===================================================== */

function obtenerPresupuestoIdTrabajo(
    trabajo
){

    return limpiarId(
        trabajo.presupuestoId ||
        trabajo.idPresupuesto ||
        trabajo.presupuestoID ||
        trabajo.presupuesto_id ||
        (
            trabajo.presupuesto &&
            typeof trabajo.presupuesto ===
            "object"
            ?
            trabajo.presupuesto.id
            :
            trabajo.presupuesto
        )
    );

}


/* =====================================================
   OBTENER CLIENTE DEL TRABAJO
===================================================== */

function obtenerClienteIdTrabajo(
    trabajo
){

    return limpiarId(
        trabajo.clienteId ||
        trabajo.idCliente ||
        trabajo.clienteID ||
        trabajo.cliente_id ||
        (
            trabajo.cliente &&
            typeof trabajo.cliente ===
            "object"
            ?
            trabajo.cliente.id
            :
            trabajo.cliente
        )
    );

}


/* =====================================================
   AUTENTICACIÓN
===================================================== */

onAuthStateChanged(
    auth,
    async usuario => {

        if(!usuario){

            window.location.replace(
                "login.html"
            );

            return;

        }


        usuarioActual =
            usuario;


        try{

            await obtenerEmpresa();

            await cargarClientes();

            await cargarPresupuestos();

            await cargarTrabajos();

            cargarSelectClientes();

        }
        catch(error){

            console.error(
                "ERROR INICIAL:",
                error
            );

            mostrarMensaje(
                "❌ No se pudo conectar con GESBASE: " +
                error.message,
                "error"
            );

        }

    }
);


/* =====================================================
   OBTENER EMPRESA
===================================================== */

async function obtenerEmpresa(){

    const usuarioRef =
        doc(
            db,
            "usuarios",
            usuarioActual.uid
        );


    const usuarioSnap =
        await getDoc(
            usuarioRef
        );


    if(!usuarioSnap.exists()){

        throw new Error(
            "No existe el usuario en Firestore."
        );

    }


    const datos =
        usuarioSnap.data();


    empresaIdActual =
        limpiarId(
            datos.empresaId ||
            datos.idEmpresa ||
            datos.companyId
        );


    if(!empresaIdActual){

        throw new Error(
            "El usuario no tiene empresaId."
        );

    }

}


/* =====================================================
   CARGAR CLIENTES
===================================================== */

async function cargarClientes(){

    clientes = [];


    const consulta =
        query(
            collection(
                db,
                "clientes"
            ),
            where(
                "empresaId",
                "==",
                empresaIdActual
            )
        );


    const snapshot =
        await getDocs(
            consulta
        );


    snapshot.forEach(
        documento => {

            clientes.push({

                id:
                    documento.id,

                ...documento.data()

            });

        }
    );


    console.log(
        "CLIENTES CARGADOS:",
        clientes.length
    );

}


/* =====================================================
   CARGAR PRESUPUESTOS
===================================================== */

async function cargarPresupuestos(){

    presupuestos = [];


    const consulta =
        query(
            collection(
                db,
                "presupuestos"
            ),
            where(
                "empresaId",
                "==",
                empresaIdActual
            )
        );


    const snapshot =
        await getDocs(
            consulta
        );


    snapshot.forEach(
        documento => {

            presupuestos.push({

                id:
                    documento.id,

                ...documento.data()

            });

        }
    );


    console.log(
        "PRESUPUESTOS CARGADOS:",
        presupuestos.length
    );

}


/* =====================================================
   CARGAR TRABAJOS
===================================================== */

async function cargarTrabajos(){

    trabajos = [];


    const consulta =
        query(
            collection(
                db,
                "trabajos"
            ),
            where(
                "empresaId",
                "==",
                empresaIdActual
            )
        );


    const snapshot =
        await getDocs(
            consulta
        );


    snapshot.forEach(
        documento => {

            trabajos.push({

                id:
                    documento.id,

                ...documento.data()

            });

        }
    );


    console.log(
        "TRABAJOS CARGADOS:",
        trabajos.length
    );

}


/* =====================================================
   SELECT CLIENTES
===================================================== */

function cargarSelectClientes(){

    clienteSelect.innerHTML = `

        <option value="">
            Seleccioná un cliente
        </option>

    `;


    clientes.forEach(
        cliente => {

            const option =
                document.createElement(
                    "option"
                );


            option.value =
                cliente.id;


            option.textContent =
                obtenerNombreCliente(
                    cliente
                );


            clienteSelect.appendChild(
                option
            );

        }
    );


    if(clientes.length === 0){

        clienteSelect.innerHTML = `

            <option value="">
                No hay clientes registrados
            </option>

        `;

    }

}


/* =====================================================
   CLIENTE CAMBIA
===================================================== */

clienteSelect.addEventListener(
    "change",
    () => {

        const clienteId =
            limpiarId(
                clienteSelect.value
            );


        presupuestoSelect.innerHTML = `

            <option value="">
                Seleccioná un presupuesto
            </option>

        `;


        trabajoSelect.innerHTML = `

            <option value="">
                Seleccioná primero un presupuesto
            </option>

        `;


        presupuestoSelect.disabled =
            true;

        trabajoSelect.disabled =
            true;


        cardCertificacion.style.display =
            "none";

        infoTrabajo.style.display =
            "none";


        listaCertificaciones.innerHTML = `

            <div class="sin-datos">
                Seleccioná un trabajo para ver sus certificaciones.
            </div>

        `;


        if(!clienteId){

            return;

        }


        const presupuestosCliente =
            presupuestos.filter(
                presupuesto => {

                    return (
                        obtenerClienteIdPresupuesto(
                            presupuesto
                        ) ===
                        clienteId
                    );

                }
            );


        presupuestosCliente.forEach(
            presupuesto => {

                const option =
                    document.createElement(
                        "option"
                    );


                option.value =
                    presupuesto.id;


                option.textContent =
                    obtenerNumeroPresupuesto(
                        presupuesto
                    );


                presupuestoSelect.appendChild(
                    option
                );

            }
        );


        if(
            presupuestosCliente.length
            >
            0
        ){

            presupuestoSelect.disabled =
                false;

        }
        else{

            presupuestoSelect.innerHTML = `

                <option value="">
                    No hay presupuestos para este cliente
                </option>

            `;

        }

    }
);


/* =====================================================
   PRESUPUESTO CAMBIA
===================================================== */

presupuestoSelect.addEventListener(
    "change",
    () => {

        const clienteId =
            limpiarId(
                clienteSelect.value
            );

        const presupuestoId =
            limpiarId(
                presupuestoSelect.value
            );


        trabajoSelect.innerHTML = `

            <option value="">
                Seleccioná un trabajo
            </option>

        `;


        trabajoSelect.disabled =
            true;


        cardCertificacion.style.display =
            "none";


        if(
            !clienteId ||
            !presupuestoId
        ){

            return;

        }


        const trabajosFiltrados =
            trabajos.filter(
                trabajo => {

                    const clienteTrabajo =
                        obtenerClienteIdTrabajo(
                            trabajo
                        );

                    const presupuestoTrabajo =
                        obtenerPresupuestoIdTrabajo(
                            trabajo
                        );


                    return (
                        clienteTrabajo ===
                        clienteId &&
                        presupuestoTrabajo ===
                        presupuestoId
                    );

                }
            );


        trabajosFiltrados.forEach(
            trabajo => {

                const option =
                    document.createElement(
                        "option"
                    );


                option.value =
                    trabajo.id;


                option.textContent =
                    obtenerNombreTrabajo(
                        trabajo
                    );


                trabajoSelect.appendChild(
                    option
                );

            }
        );


        if(
            trabajosFiltrados.length >
            0
        ){

            trabajoSelect.disabled =
                false;

        }
        else{

            trabajoSelect.innerHTML = `

                <option value="">
                    No hay trabajos para este presupuesto
                </option>

            `;

        }

    }
);


/* =====================================================
   TRABAJO CAMBIA
===================================================== */

trabajoSelect.addEventListener(
    "change",
    async () => {

        const trabajoId =
            limpiarId(
                trabajoSelect.value
            );


        cardCertificacion.style.display =
            "none";


        if(!trabajoId){

            return;

        }


        trabajoActual =
            trabajos.find(
                trabajo =>
                    limpiarId(
                        trabajo.id
                    ) ===
                    trabajoId
            );


        if(!trabajoActual){

            mostrarMensaje(
                "No se encontró el trabajo.",
                "error"
            );

            return;

        }


        mostrarInfoTrabajo();


        await cargarItemsTrabajo();


        await cargarCertificaciones();

    }
);


/* =====================================================
   MOSTRAR INFO TRABAJO
===================================================== */

function mostrarInfoTrabajo(){

    if(!trabajoActual){

        return;

    }


    const clienteId =
        obtenerClienteIdTrabajo(
            trabajoActual
        );


    const presupuestoId =
        obtenerPresupuestoIdTrabajo(
            trabajoActual
        );


    const cliente =
        clientes.find(
            item =>
                limpiarId(
                    item.id
                ) ===
                clienteId
        );


    const presupuesto =
        presupuestos.find(
            item =>
                limpiarId(
                    item.id
                ) ===
                presupuestoId
        );


    infoTrabajo.innerHTML = `

        <strong>Trabajo seleccionado</strong><br>

        Cliente:
        ${escapeHTML(
            cliente
            ?
            obtenerNombreCliente(cliente)
            :
            trabajoActual.clienteNombre ||
            "Cliente"
        )}

        <br>

        Presupuesto:
        ${escapeHTML(
            presupuesto
            ?
            obtenerNumeroPresupuesto(
                presupuesto
            )
            :
            trabajoActual.presupuestoNumero ||
            "Presupuesto"
        )}

        <br>

        Trabajo:
        ${escapeHTML(
            obtenerNombreTrabajo(
                trabajoActual
            )
        )}

    `;


    infoTrabajo.style.display =
        "block";

}


/* =====================================================
   CARGAR ÍTEMS DEL TRABAJO
===================================================== */

async function cargarItemsTrabajo(){

    itemsTrabajo = [];


    itemsCertificacion.innerHTML = `

        <div class="sin-datos">
            Buscando ítems del trabajo...
        </div>

    `;


    /*
       NUEVA ESTRUCTURA:

       colección:
       trabajoItems

       campos esperados:

       empresaId
       trabajoId
       descripcion
       tipoTrabajo
       unidad
       cantidad
       precioUnitario
    */


    try{

        const consulta =
            query(
                collection(
                    db,
                    "trabajoItems"
                ),
                where(
                    "empresaId",
                    "==",
                    empresaIdActual
                ),
                where(
                    "trabajoId",
                    "==",
                    trabajoActual.id
                )
            );


        const snapshot =
            await getDocs(
                consulta
            );


        snapshot.forEach(
            documento => {

                itemsTrabajo.push({

                    id:
                        documento.id,

                    ...documento.data()

                });

            }
        );

    }
    catch(error){

        console.error(
            "ERROR ÍTEMS:",
            error
        );


        /*
           COMPATIBILIDAD:

           Si los ítems están guardados
           directamente dentro del documento
           trabajo, también intentamos leerlos.
        */

        if(
            Array.isArray(
                trabajoActual.items
            )
        ){

            itemsTrabajo =
                trabajoActual.items.map(
                    (item,index) => ({

                        id:
                            item.id ||
                            String(index),

                        ...item

                    })
                );

        }

    }


    /*
       También soporta:
       itemsTrabajo
       detalles
       partidas
    */

    if(
        itemsTrabajo.length === 0
    ){

        const posibles =
            trabajoActual.items ||
            trabajoActual.itemsTrabajo ||
            trabajoActual.detalles ||
            trabajoActual.partidas;


        if(
            Array.isArray(posibles)
        ){

            itemsTrabajo =
                posibles.map(
                    (item,index) => ({

                        id:
                            item.id ||
                            String(index),

                        ...item

                    })
                );

        }

    }


    mostrarItems();

}


/* =====================================================
   CANTIDAD
===================================================== */

function obtenerCantidad(
    item
){

    const valor =
        item.cantidad ||
        item.cantidadTotal ||
        item.total ||
        0;


    const numero =
        Number(valor);


    return Number.isFinite(numero)
        ?
        numero
        :
        0;

}


/* =====================================================
   UNIDAD
===================================================== */

function obtenerUnidad(
    item
){

    return (
        item.unidad ||
        item.denominacion ||
        item.tipoUnidad ||
        "un"
    );

}


/* =====================================================
   DESCRIPCIÓN
===================================================== */

function obtenerDescripcionItem(
    item
){

    return (
        item.descripcion ||
        item.descripcionTrabajo ||
        item.tipoTrabajo ||
        item.nombre ||
        item.denominacion ||
        "Ítem"
    );

}


/* =====================================================
   MOSTRAR ÍTEMS
===================================================== */

function mostrarItems(){

    itemsCertificacion.innerHTML =
        "";


    if(
        itemsTrabajo.length ===
        0
    ){

        itemsCertificacion.innerHTML = `

            <div class="sin-datos">

                Este trabajo todavía no tiene
                ítems cargados.

                <br><br>

                Primero agregá los ítems al trabajo,
                indicando tipo de trabajo,
                unidad y cantidad total.

            </div>

        `;

        cardCertificacion.style.display =
            "block";

        actualizarResumen();

        return;

    }


    itemsTrabajo.forEach(
        (item,index) => {

            const cantidadTotal =
                obtenerCantidad(
                    item
                );


            const div =
                document.createElement(
                    "div"
                );


            div.className =
                "certificacion-item";


            div.dataset.index =
                index;


            div.innerHTML = `

                <h3>
                    ${escapeHTML(
                        obtenerDescripcionItem(
                            item
                        )
                    )}
                </h3>

                <div class="item-grid">

                    <div>

                        <label>
                            Unidad
                        </label>

                        <input
                            type="text"
                            value="${escapeHTML(
                                obtenerUnidad(item)
                            )}"
                            readonly
                            data-unidad
                        >

                    </div>


                    <div>

                        <label>
                            Cantidad total
                        </label>

                        <input
                            type="number"
                            value="${cantidadTotal}"
                            readonly
                            data-total
                        >

                    </div>


                    <div>

                        <label>
                            Cantidad ejecutada
                        </label>

                        <input
                            type="number"
                            min="0"
                            max="${cantidadTotal}"
                            step="0.01"
                            value="0"
                            data-ejecutado
                        >

                    </div>


                    <div>

                        <label>
                            % avance
                        </label>

                        <input
                            type="text"
                            value="0%"
                            readonly
                            data-porcentaje
                        >

                    </div>

                </div>


                <div class="avance">

                    <div
                        class="avance-barra"
                        data-barra
                    ></div>

                </div>


                <div
                    class="item-total"
                    data-pendiente
                >
                    Pendiente:
                    ${cantidadTotal}
                    ${escapeHTML(
                        obtenerUnidad(item)
                    )}
                </div>

            `;


            const ejecutado =
                div.querySelector(
                    "[data-ejecutado]"
                );


            ejecutado.addEventListener(
                "input",
                () => {

                    actualizarItem(
                        div,
                        cantidadTotal
                    );

                }
            );


            itemsCertificacion.appendChild(
                div
            );

        }
    );


    cardCertificacion.style.display =
        "block";


    actualizarResumen();

}


/* =====================================================
   ACTUALIZAR ÍTEM
===================================================== */

function actualizarItem(
    div,
    cantidadTotal
){

    let ejecutado =
        Number(
            div.querySelector(
                "[data-ejecutado]"
            ).value
        );


    if(
        !Number.isFinite(ejecutado) ||
        ejecutado < 0
    ){

        ejecutado = 0;

    }


    if(
        ejecutado >
        cantidadTotal
    ){

        ejecutado =
            cantidadTotal;

        div.querySelector(
            "[data-ejecutado]"
        ).value =
            cantidadTotal;

    }


    let porcentaje = 0;


    if(
        cantidadTotal >
        0
    ){

        porcentaje =
            (
                ejecutado /
                cantidadTotal
            ) *
            100;

    }


    div.querySelector(
        "[data-porcentaje]"
    ).value =
        porcentaje.toFixed(2) +
        "%";


    div.querySelector(
        "[data-barra]"
    ).style.width =
        Math.min(
            porcentaje,
            100
        ) +
        "%";


    const pendiente =
        Math.max(
            cantidadTotal -
            ejecutado,
            0
        );


    const unidad =
        div.querySelector(
            "[data-unidad]"
        ).value;


    div.querySelector(
        "[data-pendiente]"
    ).textContent =
        "Pendiente: " +
        pendiente.toFixed(2) +
        " " +
        unidad;


    actualizarResumen();

}


/* =====================================================
   ACTUALIZAR RESUMEN
===================================================== */

function actualizarResumen(){

    let total = 0;

    let ejecutado = 0;


    document
        .querySelectorAll(
            "#itemsCertificacion .certificacion-item"
        )
        .forEach(
            div => {

                const cantidadTotal =
                    Number(
                        div.querySelector(
                            "[data-total]"
                        )?.value ||
                        0
                    );


                const cantidadEjecutada =
                    Number(
                        div.querySelector(
                            "[data-ejecutado]"
                        )?.value ||
                        0
                    );


                total +=
                    cantidadTotal;


                ejecutado +=
                    cantidadEjecutada;

            }
        );


    const pendiente =
        Math.max(
            total -
            ejecutado,
            0
        );


    const porcentaje =
        total > 0
        ?
        (
            ejecutado /
            total
        ) * 100
        :
        0;


    document.getElementById(
        "resumenTotal"
    ).textContent =
        total.toFixed(2);


    document.getElementById(
        "resumenEjecutado"
    ).textContent =
        ejecutado.toFixed(2);


    document.getElementById(
        "resumenPendiente"
    ).textContent =
        pendiente.toFixed(2);


    document.getElementById(
        "resumenPorcentaje"
    ).textContent =
        porcentaje.toFixed(2) +
        "%";

}


/* =====================================================
   CARGAR CERTIFICACIONES
===================================================== */

async function cargarCertificaciones(){

    certificaciones = [];


    listaCertificaciones.innerHTML = `

        <div class="sin-datos">
            Cargando certificaciones...
        </div>

    `;


    try{

        const consulta =
            query(
                collection(
                    db,
                    "certificaciones"
                ),
                where(
                    "empresaId",
                    "==",
                    empresaIdActual
                ),
                where(
                    "trabajoId",
                    "==",
                    trabajoActual.id
                )
            );


        const snapshot =
            await getDocs(
                consulta
            );


        snapshot.forEach(
            documento => {

                certificaciones.push({

                    id:
                        documento.id,

                    ...documento.data()

                });

            }
        );


        certificaciones.sort(
            (a,b) =>
                Number(
                    a.numero ||
                    0
                )
                -
                Number(
                    b.numero ||
                    0
                )
        );


        mostrarCertificaciones();

    }
    catch(error){

        console.error(
            "ERROR CERTIFICACIONES:",
            error
        );


        listaCertificaciones.innerHTML = `

            <div class="sin-datos">
                No se pudieron cargar las certificaciones.
                <br><br>
                ${escapeHTML(
                    error.message
                )}
            </div>

        `;

    }

}


/* =====================================================
   MOSTRAR CERTIFICACIONES
===================================================== */

function mostrarCertificaciones(){

    listaCertificaciones.innerHTML =
        "";


    if(
        certificaciones.length ===
        0
    ){

        listaCertificaciones.innerHTML = `

            <div class="sin-datos">
                Todavía no hay certificaciones
                para este trabajo.
            </div>

        `;

        return;

    }


    certificaciones.forEach(
        certificacion => {

            const div =
                document.createElement(
                    "div"
                );


            div.className =
                "cert-card";


            div.innerHTML = `

                <strong>
                    Certificación Nº
                    ${escapeHTML(
                        certificacion.numero ||
                        "-"
                    )}
                </strong>

                <div class="cert-datos">

                    Fecha:
                    ${escapeHTML(
                        certificacion.fecha ||
                        "-"
                    )}

                    <br>

                    Avance certificado:
                    <strong>
                        ${Number(
                            certificacion.porcentajeTotal ||
                            0
                        ).toFixed(2)}%
                    </strong>

                    <br>

                    Cantidad certificada:
                    ${Number(
                        certificacion.cantidadEjecutada ||
                        0
                    ).toFixed(2)}

                    <br>

                    Observaciones:
                    ${escapeHTML(
                        certificacion.observaciones ||
                        "-"
                    )}

                </div>

            `;


            listaCertificaciones.appendChild(
                div
            );

        }
    );

}


/* =====================================================
   GUARDAR CERTIFICACIÓN
===================================================== */

btnGuardar.addEventListener(
    "click",
    async () => {

        if(!usuarioActual){

            mostrarMensaje(
                "No hay una sesión activa.",
                "error"
            );

            return;

        }


        if(!empresaIdActual){

            mostrarMensaje(
                "No se encontró la empresa.",
                "error"
            );

            return;

        }


        if(!trabajoActual){

            mostrarMensaje(
                "Seleccioná un trabajo.",
                "error"
            );

            return;

        }


        if(
            itemsTrabajo.length ===
            0
        ){

            mostrarMensaje(
                "El trabajo no tiene ítems para certificar.",
                "error"
            );

            return;

        }


        const numero =
            Number(
                numeroCertificacion.value
            );


        if(
            !numero ||
            numero < 1
        ){

            mostrarMensaje(
                "Ingresá un número de certificación válido.",
                "error"
            );

            return;

        }


        const itemsCertificados =
            [];


        let cantidadTotal =
            0;


        let cantidadEjecutada =
            0;


        let hayCantidad =
            false;


        const elementos =
            document.querySelectorAll(
                "#itemsCertificacion .certificacion-item"
            );


        elementos.forEach(
            (div,index) => {

                const item =
                    itemsTrabajo[index];


                const total =
                    Number(
                        div.querySelector(
                            "[data-total]"
                        ).value
                    );


                const ejecutado =
                    Number(
                        div.querySelector(
                            "[data-ejecutado]"
                        ).value
                    );


                const porcentaje =
                    total > 0
                    ?
                    (
                        ejecutado /
                        total
                    ) * 100
                    :
                    0;


                cantidadTotal +=
                    total;


                cantidadEjecutada +=
                    ejecutado;


                if(
                    ejecutado > 0
                ){

                    hayCantidad =
                        true;

                }


                itemsCertificados.push({

                    itemId:
                        item.id,

                    descripcion:
                        obtenerDescripcionItem(
                            item
                        ),

                    unidad:
                        obtenerUnidad(
                            item
                        ),

                    cantidadTotal:
                        total,

                    cantidadEjecutada:
                        ejecutado,

                    cantidadPendiente:
                        Math.max(
                            total -
                            ejecutado,
                            0
                        ),

                    porcentaje:
                        Number(
                            porcentaje.toFixed(4)
                        )

                });

            }
        );


        if(!hayCantidad){

            mostrarMensaje(
                "Ingresá al menos una cantidad ejecutada para certificar.",
                "error"
            );

            return;

        }


        const porcentajeTotal =
            cantidadTotal > 0
            ?
            (
                cantidadEjecutada /
                cantidadTotal
            ) * 100
            :
            0;


        const clienteId =
            obtenerClienteIdTrabajo(
                trabajoActual
            );


        const presupuestoId =
            obtenerPresupuestoIdTrabajo(
                trabajoActual
            );


        const cliente =
            clientes.find(
                item =>
                    limpiarId(
                        item.id
                    ) ===
                    clienteId
            );


        const presupuesto =
            presupuestos.find(
                item =>
                    limpiarId(
                        item.id
                    ) ===
                    presupuestoId
            );


        const datosCertificacion = {

            empresaId:
                empresaIdActual,

            usuarioId:
                usuarioActual.uid,

            trabajoId:
                trabajoActual.id,

            trabajoNombre:
                obtenerNombreTrabajo(
                    trabajoActual
                ),

            clienteId:
                clienteId,

            clienteNombre:
                cliente
                ?
                obtenerNombreCliente(
                    cliente
                )
                :
                trabajoActual.clienteNombre ||
                "",

            presupuestoId:
                presupuestoId,

            presupuestoNumero:
                presupuesto
                ?
                obtenerNumeroPresupuesto(
                    presupuesto
                )
                :
                trabajoActual.presupuestoNumero ||
                "",

            numero:
                numero,

            fecha:
                fechaCertificacion.value ||
                fechaHoy(),

            cantidadTotal:
                Number(
                    cantidadTotal.toFixed(4)
                ),

            cantidadEjecutada:
                Number(
                    cantidadEjecutada.toFixed(4)
                ),

            cantidadPendiente:
                Number(
                    Math.max(
                        cantidadTotal -
                        cantidadEjecutada,
                        0
                    ).toFixed(4)
                ),

            porcentajeTotal:
                Number(
                    porcentajeTotal.toFixed(4)
                ),

            items:
                itemsCertificados,

            observaciones:
                observaciones.value.trim(),

            creadoEn:
                serverTimestamp(),

            actualizadoEn:
                serverTimestamp()

        };


        btnGuardar.disabled =
            true;


        try{

            await addDoc(
                collection(
                    db,
                    "certificaciones"
                ),
                datosCertificacion
            );


            mostrarMensaje(
                "✅ Certificación guardada correctamente.",
                "exito"
            );


            await cargarCertificaciones();


            numeroCertificacion.value =
                String(
                    numero + 1
                );


            observaciones.value =
                "";


            elementos.forEach(
                div => {

                    div.querySelector(
                        "[data-ejecutado]"
                    ).value =
                        "0";


                    const total =
                        Number(
                            div.querySelector(
                                "[data-total]"
                            ).value
                        );


                    actualizarItem(
                        div,
                        total
                    );

                }
            );


            actualizarResumen();

        }
        catch(error){

            console.error(
                "ERROR GUARDANDO CERTIFICACIÓN:",
                error
            );


            mostrarMensaje(
                "❌ No se pudo guardar la certificación: " +
                error.message,
                "error"
            );

        }
        finally{

            btnGuardar.disabled =
                false;

        }

    }
);
