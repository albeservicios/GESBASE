// =====================================================
// FIREBASE
// =====================================================

import {

    auth,
    db

} from "./Js/firebase.js";


import {

    onAuthStateChanged

} from
"https://www.gstatic.com/firebasejs/12.18.0/firebase-auth.js";


import {

    collection,
    addDoc,
    getDocs,
    query,
    where,
    serverTimestamp

} from
"https://www.gstatic.com/firebasejs/12.18.0/firebase-firestore.js";


// =====================================================
// VARIABLES
// =====================================================

let usuarioActual = null;

let clientes = [];

let presupuestos = [];

let certificacionGuardada = false;

let idCertificacion = "";


// =====================================================
// ELEMENTOS
// =====================================================

const clienteSelect =
    document.getElementById("cliente");

const presupuestoSelect =
    document.getElementById("presupuesto");

const empresaInput =
    document.getElementById("empresa");

const fechaInput =
    document.getElementById("fecha");

const periodoSelect =
    document.getElementById("periodo");

const cantidadPresupuestadaInput =
    document.getElementById(
        "cantidadPresupuestada"
    );

const cantidadEjecutadaInput =
    document.getElementById(
        "cantidadEjecutada"
    );

const importePresupuestadoInput =
    document.getElementById(
        "importePresupuestado"
    );

const porcentajeInput =
    document.getElementById(
        "porcentaje"
    );

const cantidadRestante =
    document.getElementById(
        "cantidadRestante"
    );

const porcentajeResultado =
    document.getElementById(
        "porcentajeResultado"
    );

const importeCertificado =
    document.getElementById(
        "importeCertificado"
    );

const totalCertificado =
    document.getElementById(
        "totalCertificado"
    );

const descripcionInput =
    document.getElementById(
        "descripcion"
    );

const unidadInput =
    document.getElementById(
        "unidad"
    );

const observacionesInput =
    document.getElementById(
        "observaciones"
    );

const mensaje =
    document.getElementById(
        "mensaje"
    );

const estado =
    document.getElementById(
        "estado"
    );


// =====================================================
// FECHA
// =====================================================

function fechaHoy(){

    const fecha =
        new Date();

    const año =
        fecha.getFullYear();

    const mes =
        String(
            fecha.getMonth() + 1
        ).padStart(2,"0");

    const dia =
        String(
            fecha.getDate()
        ).padStart(2,"0");

    return `${año}-${mes}-${dia}`;

}


fechaInput.value =
    fechaHoy();


// =====================================================
// DINERO
// =====================================================

function dinero(valor){

    return new Intl.NumberFormat(
        "es-AR",
        {
            style:"currency",
            currency:"ARS",
            minimumFractionDigits:2,
            maximumFractionDigits:2
        }
    ).format(
        Number(valor) || 0
    );

}


// =====================================================
// MENSAJE
// =====================================================

function mostrarMensaje(
    texto,
    tipo
){

    mensaje.textContent =
        texto;

    mensaje.className =
        "mensaje " + tipo;

}


// =====================================================
// CÁLCULO
// =====================================================

function calcular(){

    const presupuestada =
        Number(
            cantidadPresupuestadaInput.value
        ) || 0;

    const ejecutada =
        Number(
            cantidadEjecutadaInput.value
        ) || 0;

    const importe =
        Number(
            importePresupuestadoInput.value
        ) || 0;


    if(
        presupuestada <= 0
    ){

        porcentajeInput.value =
            "0 %";

        cantidadRestante.textContent =
            "0";

        porcentajeResultado.textContent =
            "0 %";

        importeCertificado.textContent =
            dinero(0);

        totalCertificado.textContent =
            dinero(0);

        return;

    }


    /*
     * Nunca permitimos certificar
     * más cantidad que la presupuestada.
     */

    const ejecutadaValida =
        Math.min(
            Math.max(
                ejecutada,
                0
            ),
            presupuestada
        );


    const porcentaje =
        (
            ejecutadaValida /
            presupuestada
        ) * 100;


    const importeCalculado =
        (
            importe *
            porcentaje
        ) / 100;


    const restante =
        presupuestada -
        ejecutadaValida;


    porcentajeInput.value =
        porcentaje.toFixed(2) +
        " %";


    cantidadRestante.textContent =
        restante.toFixed(2);


    porcentajeResultado.textContent =
        porcentaje.toFixed(2) +
        " %";


    importeCertificado.textContent =
        dinero(
            importeCalculado
        );


    totalCertificado.textContent =
        dinero(
            importeCalculado
        );

}


// =====================================================
// EVENTOS DE CÁLCULO
// =====================================================

cantidadPresupuestadaInput.addEventListener(
    "input",
    calcular
);

cantidadEjecutadaInput.addEventListener(
    "input",
    calcular
);

importePresupuestadoInput.addEventListener(
    "input",
    calcular
);

document.getElementById(
    "btnCalcular"
).addEventListener(
    "click",
    calcular
);


// =====================================================
// CARGAR CLIENTES
// =====================================================

async function cargarClientes(){

    const referencia =
        collection(
            db,
            "clientes"
        );


    const consulta =
        query(
            referencia,

            where(
                "uid",
                "==",
                usuarioActual.uid
            )
        );


    const resultado =
        await getDocs(
            consulta
        );


    clientes =
        [];


    resultado.forEach(
        function(documento){

            clientes.push({

                id:
                    documento.id,

                ...documento.data()

            });

        }
    );


    clienteSelect.innerHTML = `

        <option value="">
            Seleccioná un cliente
        </option>

    `;


    clientes.forEach(
        function(cliente){

            const nombre =
                cliente.nombre ||
                cliente.razonSocial ||
                cliente.empresa ||
                "Cliente";


            const opcion =
                document.createElement(
                    "option"
                );

            opcion.value =
                cliente.id;

            opcion.textContent =
                nombre;

            clienteSelect.appendChild(
                opcion
            );

        }
    );

}


// =====================================================
// CLIENTE → PRESUPUESTOS
// =====================================================

clienteSelect.addEventListener(
    "change",
    async function(){

        const clienteId =
            clienteSelect.value;


        presupuestoSelect.innerHTML = `

            <option value="">
                Cargando presupuestos...
            </option>

        `;


        if(!clienteId){

            presupuestoSelect.innerHTML = `

                <option value="">
                    Primero seleccioná un cliente
                </option>

            `;

            return;

        }


        try{

            const referencia =
                collection(
                    db,
                    "presupuestos"
                );


            const consulta =
                query(
                    referencia,

                    where(
                        "uid",
                        "==",
                        usuarioActual.uid
                    )
                );


            const resultado =
                await getDocs(
                    consulta
                );


            presupuestos =
                [];


            resultado.forEach(
                function(documento){

                    const datos =
                        documento.data();


                    /*
                     * Intentamos relacionar el presupuesto
                     * con el cliente utilizando los campos
                     * habituales de GESBASE.
                     */

                    const clientePresupuesto =
                        String(
                            datos.clienteId ||
                            datos.idCliente ||
                            ""
                        );


                    const nombreCliente =
                        String(
                            datos.cliente ||
                            ""
                        ).trim()
                        .toLowerCase();


                    const clienteSeleccionado =
                        clientes.find(
                            function(c){

                                return c.id ===
                                    clienteId;

                            }
                        );


                    const nombreSeleccionado =
                        String(
                            clienteSeleccionado?.nombre ||
                            clienteSeleccionado?.razonSocial ||
                            clienteSeleccionado?.empresa ||
                            ""
                        ).trim()
                        .toLowerCase();


                    if(
                        clientePresupuesto ===
                        clienteId
                        ||
                        (
                            nombreSeleccionado &&
                            nombreCliente ===
                            nombreSeleccionado
                        )
                    ){

                        presupuestos.push({

                            id:
                                documento.id,

                            ...datos

                        });

                    }

                }
            );


            presupuestoSelect.innerHTML = `

                <option value="">
                    Seleccioná un presupuesto
                </option>

            `;


            presupuestos.forEach(
                function(presupuesto){

                    const opcion =
                        document.createElement(
                            "option"
                        );


                    opcion.value =
                        presupuesto.id;


                    const numero =
                        presupuesto.numeroPresupuesto ||
                        presupuesto.numero ||
                        presupuesto.id;


                    const descripcion =
                        presupuesto.descripcion ||
                        presupuesto.lugarTrabajo ||
                        "";


                    opcion.textContent =
                        "Presupuesto " +
                        numero +
                        (
                            descripcion
                                ? " — " + descripcion
                                : ""
                        );


                    presupuestoSelect.appendChild(
                        opcion
                    );

                }
            );


            if(
                presupuestos.length === 0
            ){

                presupuestoSelect.innerHTML = `

                    <option value="">
                        No hay presupuestos vinculados
                    </option>

                `;

            }

        }
        catch(error){

            console.error(
                error
            );


            presupuestoSelect.innerHTML = `

                <option value="">
                    Error al cargar presupuestos
                </option>

            `;

        }

    }
);


// =====================================================
// PRESUPUESTO SELECCIONADO
// =====================================================

presupuestoSelect.addEventListener(
    "change",
    function(){

        const id =
            presupuestoSelect.value;


        const presupuesto =
            presupuestos.find(
                function(item){

                    return item.id === id;

                }
            );


        if(!presupuesto){

            return;

        }


        /*
         * Si el presupuesto ya tiene una descripción,
         * la mostramos como referencia.
         */

        descripcionInput.value =
            presupuesto.descripcion ||
            presupuesto.lugarTrabajo ||
            "";


        /*
         * Intentamos aprovechar cantidades existentes
         * si el presupuesto las tiene.
         */

        const cantidad =
            presupuesto.cantidad ||
            presupuesto.metros ||
            presupuesto.metrosCuadrados ||
            presupuesto.m2 ||
            "";


        if(cantidad){

            cantidadPresupuestadaInput.value =
                cantidad;

        }


        const importe =
            presupuesto.total ||
            presupuesto.importe ||
            0;


        if(importe){

            importePresupuestadoInput.value =
                importe;

        }


        calcular();

    }
);


// =====================================================
// FIRMA
// =====================================================

const canvas =
    document.getElementById(
        "canvasFirma"
    );

const contexto =
    canvas.getContext("2d");

let dibujando =
    false;


function ajustarCanvas(){

    const rect =
        canvas.getBoundingClientRect();


    const ratio =
        window.devicePixelRatio ||
        1;


    canvas.width =
        rect.width *
        ratio;

    canvas.height =
        220 *
        ratio;


    contexto.scale(
        ratio,
        ratio
    );


    contexto.lineWidth =
        2;

    contexto.lineCap =
        "round";

    contexto.lineJoin =
        "round";

}


ajustarCanvas();


window.addEventListener(
    "resize",
    ajustarCanvas
);


function posicion(evento){

    const rect =
        canvas.getBoundingClientRect();


    return {

        x:
            evento.clientX -
            rect.left,

        y:
            evento.clientY -
            rect.top

    };

}


canvas.addEventListener(
    "pointerdown",
    function(evento){

        dibujando =
            true;

        canvas.setPointerCapture(
            evento.pointerId
        );


        const p =
            posicion(evento);


        contexto.beginPath();

        contexto.moveTo(
            p.x,
            p.y
        );

    }
);


canvas.addEventListener(
    "pointermove",
    function(evento){

        if(!dibujando){

            return;

        }


        const p =
            posicion(evento);


        contexto.lineTo(
            p.x,
            p.y
        );


        contexto.stroke();

    }
);


canvas.addEventListener(
    "pointerup",
    function(){

        dibujando =
            false;

    }
);


canvas.addEventListener(
    "pointercancel",
    function(){

        dibujando =
            false;

    }
);


document.getElementById(
    "btnLimpiarFirma"
).addEventListener(
    "click",
    function(){

        contexto.clearRect(
            0,
            0,
            canvas.width,
            canvas.height
        );

    }
);

// GUARDAR
// =====================================================

document.getElementById(
    "btnGuardar"
).addEventListener(
    "click",
    async function(){

        if(!usuarioActual){

            mostrarMensaje(
                "No hay una sesión activa.",
                "error"
            );

            return;

        }


        calcular();


        const clienteId =
            clienteSelect.value;


        const presupuestoId =
            presupuestoSelect.value;


        const presupuestada =
            Number(
                cantidadPresupuestadaInput.value
            ) || 0;


        const ejecutada =
            Number(
                cantidadEjecutadaInput.value
            ) || 0;


        const importe =
            Number(
                importePresupuestadoInput.value
            ) || 0;


        if(!clienteId){

            mostrarMensaje(
                "Seleccioná un cliente.",
                "error"
            );

            return;

        }


        if(!presupuestoId){

            mostrarMensaje(
                "Seleccioná un presupuesto.",
                "error"
            );

            return;

        }


        if(
            presupuestada <= 0
        ){

            mostrarMensaje(
                "Ingresá la cantidad presupuestada.",
                "error"
            );

            return;

        }


        if(
            ejecutada <= 0
        ){

            mostrarMensaje(
                "Ingresá la cantidad ejecutada.",
                "error"
            );

            return;

        }


        if(
            importe <= 0
        ){

            mostrarMensaje(
                "Ingresá el importe presupuestado.",
                "error"
            );

            return;

        }


        if(
            ejecutada >
            presupuestada
        ){

            mostrarMensaje(
                "La cantidad ejecutada no puede superar la cantidad presupuestada.",
                "error"
            );

            return;

        }


        const porcentaje =
            (
                ejecutada /
                presupuestada
            ) * 100;


        const importeCertificadoNumero =
            (
                importe *
                porcentaje
            ) / 100;


        const cliente =
            clientes.find(
                function(item){

                    return item.id ===
                        clienteId;

                }
            );


        const datosCertificacion = {

            uid:
                usuarioActual.uid,

            emailUsuario:
                usuarioActual.email ||
                "",

            clienteId:
                clienteId,

            cliente:
                cliente?.nombre ||
                cliente?.razonSocial ||
                cliente?.empresa ||
                "",

            presupuestoId:
                presupuestoId,

            periodo:
                periodoSelect.value,

            fecha:
                fechaInput.value,

            empresa:
                empresaInput.value.trim(),

            descripcion:
                descripcionInput.value.trim(),

            unidad:
                unidadInput.value.trim(),

            cantidadPresupuestada:
                presupuestada,

            cantidadEjecutada:
                ejecutada,

            cantidadRestante:
                presupuestada -
                ejecutada,

            porcentaje:
                porcentaje,

            importePresupuestado:
                importe,

            importeCertificado:
                importeCertificadoNumero,

            observaciones:
                observacionesInput.value.trim(),

            firma:
                canvas.toDataURL(
                    "image/png"
                ),

            creado:
                serverTimestamp()

        };


        const boton =
            document.getElementById(
                "btnGuardar"
            );


        boton.disabled =
            true;

        boton.textContent =
            "Guardando...";


        try{

            const resultado =
                await addDoc(
                    collection(
                        db,
                        "certificaciones"
                    ),
                    datosCertificacion
                );


            idCertificacion =
                resultado.id;


            certificacionGuardada =
                true;


            estado.textContent =
                "✅ Certificación guardada correctamente. ID: " +
                resultado.id;


            mostrarMensaje(
                "✅ Certificación guardada correctamente.",
                "exito"
            );

        }
        catch(error){

            console.error(
                "ERROR GUARDANDO CERTIFICACIÓN:",
                error
            );


            mostrarMensaje(
                "No se pudo guardar la certificación. " +
                (
                    error.message ||
                    error.code ||
                    ""
                ),
                "error"
            );

        }
        finally{

            boton.disabled =
                false;

            boton.textContent =
                "💾 Guardar certificación";

        }

    }
);

// =====================================================
// ESCAPE
// =====================================================

function escapeHTML(
    texto
){

    return String(
        texto ?? ""
    )
    .replace(
        /&/g,
        "&amp;"
    )
    .replace(
        /</g,
        "&lt;"
    )
    .replace(
        />/g,
        "&gt;"
    )
    .replace(
        /"/g,
        "&quot;"
    )
    .replace(
        /'/g,
        "&#039;"
    );

}
