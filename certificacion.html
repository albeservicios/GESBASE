/* =====================================================
   FIREBASE
===================================================== */

import { auth, db }
from "./Js/firebase.js";


import {
    onAuthStateChanged
}
from
"https://www.gstatic.com/firebasejs/12.18.0/firebase-auth.js";


import {
    collection,
    getDocs,
    getDoc,
    doc,
    addDoc,
    query,
    where,
    serverTimestamp
}
from
"https://www.gstatic.com/firebasejs/12.18.0/firebase-firestore.js";


import {
    jsPDF
}
from
"https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.es.min.js";


/* =====================================================
   VARIABLES
===================================================== */

let usuarioActual = null;

let empresaIdActual = "";

let nombreEmpresaActual = "";

let clientes = [];

let presupuestos = [];

let trabajos = [];

let certificaciones = [];

let itemsPresupuesto = [];

let firmaRealizada = false;


/* =====================================================
   ELEMENTOS
===================================================== */

const emailUsuario =
document.getElementById("emailUsuario");

const nombreEmpresa =
document.getElementById("nombreEmpresa");

const idEmpresa =
document.getElementById("idEmpresa");

const estadoConexion =
document.getElementById("estadoConexion");

const clienteSelect =
document.getElementById("cliente");

const presupuestoSelect =
document.getElementById("presupuesto");

const trabajoSelect =
document.getElementById("trabajo");

const cardItems =
document.getElementById("cardItems");

const listaItems =
document.getElementById("listaItems");

const totalCertificacion =
document.getElementById("totalCertificacion");

const mensaje =
document.getElementById("mensaje");

const canvas =
document.getElementById("firmaCanvas");

const ctx =
canvas.getContext("2d");


/* =====================================================
   MENSAJE
===================================================== */

function mostrarMensaje(texto,tipo){

    mensaje.textContent = texto;

    mensaje.className =
        "mensaje " + tipo;

    window.scrollTo({
        top:0,
        behavior:"smooth"
    });

}


/* =====================================================
   FECHA
===================================================== */

function fechaHoy(){

    const d = new Date();

    return (
        d.getFullYear() +
        "-" +
        String(d.getMonth()+1).padStart(2,"0") +
        "-" +
        String(d.getDate()).padStart(2,"0")
    );

}


/* =====================================================
   DINERO
===================================================== */

function dinero(valor){

    return Number(valor || 0).toLocaleString(
        "es-AR",
        {
            style:"currency",
            currency:"ARS",
            minimumFractionDigits:2
        }
    );

}


/* =====================================================
   ESCAPE
===================================================== */

function escapeHTML(texto){

    return String(texto ?? "")
        .replace(/&/g,"&amp;")
        .replace(/</g,"&lt;")
        .replace(/>/g,"&gt;")
        .replace(/"/g,"&quot;")
        .replace(/'/g,"&#039;");

}


/* =====================================================
   AUTENTICACIÓN
===================================================== */

onAuthStateChanged(
    auth,
    async usuario => {

        if(!usuario){

            emailUsuario.textContent =
                "Sin sesión";

            estadoConexion.textContent =
                "No hay una sesión iniciada.";

            mostrarMensaje(
                "La sesión no está iniciada. Volviendo al login...",
                "error"
            );

            setTimeout(
                () => {
                    window.location.href =
                        "login.html";
                },
                1500
            );

            return;

        }


        usuarioActual =
            usuario;


        /* EL CORREO VIENE DIRECTAMENTE DE FIREBASE AUTH */

        emailUsuario.textContent =
            usuario.email ||
            "Sin correo";


        estadoConexion.textContent =
            "Usuario autenticado. Cargando datos...";


        try{

            await obtenerEmpresa();

            await cargarClientes();

            await cargarPresupuestos();

            await cargarTrabajos();

            await cargarCertificaciones();


            estadoConexion.textContent =
                "✅ Conectado correctamente con GESBASE.";


        }
        catch(error){

            console.error(
                "ERROR GENERAL:",
                error
            );


            estadoConexion.textContent =
                "⚠️ Error al cargar algunos datos.";


            mostrarMensaje(
                "GESBASE inició sesión, pero hubo un problema al cargar los datos: " +
                (error.message || "Error desconocido"),
                "error"
            );

        }

    }
);


/* =====================================================
   OBTENER EMPRESA
===================================================== */

async function obtenerEmpresa(){

    if(!usuarioActual){

        throw new Error(
            "No existe usuario autenticado."
        );

    }


    /*
       Documento:
       usuarios/{uid}
    */

    const referencia =
        doc(
            db,
            "usuarios",
            usuarioActual.uid
        );


    const documento =
        await getDoc(
            referencia
        );


    if(!documento.exists()){

        /*
           Si todavía no existe el documento,
           usamos el UID como empresa provisional.
        */

        empresaIdActual =
            usuarioActual.uid;

        nombreEmpresaActual =
            "Mi empresa";


        nombreEmpresa.textContent =
            nombreEmpresaActual;

        idEmpresa.textContent =
            empresaIdActual;

        return;

    }


    const datos =
        documento.data();


    /*
       SOPORTA LAS DISTINTAS VERSIONES
       DE GESBASE.
    */

    empresaIdActual =
        String(
            datos.empresaId ||
            datos.idEmpresa ||
            datos.empresaID ||
            datos.empresa ||
            datos.companyId ||
            datos.companyID ||
            usuarioActual.uid
        ).trim();


    nombreEmpresaActual =
        String(
            datos.nombreEmpresa ||
            datos.empresaNombre ||
            datos.nombre_empresa ||
            datos.razonSocial ||
            datos.empresa ||
            "Mi empresa"
        ).trim();


    nombreEmpresa.textContent =
        nombreEmpresaActual;


    idEmpresa.textContent =
        empresaIdActual;


}


/* =====================================================
   CLIENTES
===================================================== */

async function cargarClientes(){

    clientes = [];


    clienteSelect.innerHTML =
        `<option value="">Cargando clientes...</option>`;


    let snapshot = null;


    try{

        snapshot =
            await getDocs(
                query(
                    collection(
                        db,
                        "clientes"
                    ),
                    where(
                        "empresaId",
                        "==",
                        empresaIdActual
                    )
                )
            );

    }
    catch(error){

        console.warn(
            "Consulta empresaId falló:",
            error
        );

    }


    if(snapshot){

        snapshot.forEach(
            documento => {

                clientes.push({

                    id:documento.id,

                    ...documento.data()

                });

            }
        );

    }


    /*
       Si no encontró clientes por empresaId,
       intenta por uid.
    */

    if(clientes.length === 0){

        try{

            const snapshotUID =
                await getDocs(
                    query(
                        collection(
                            db,
                            "clientes"
                        ),
                        where(
                            "uid",
                            "==",
                            usuarioActual.uid
                        )
                    )
                );


            snapshotUID.forEach(
                documento => {

                    clientes.push({

                        id:documento.id,

                        ...documento.data()

                    });

                }
            );

        }
        catch(error){

            console.warn(
                "Consulta clientes por uid falló:",
                error
            );

        }

    }


    clienteSelect.innerHTML =
        `<option value="">Seleccioná un cliente</option>`;


    if(clientes.length === 0){

        clienteSelect.innerHTML +=
            `
            <option value="">
                No hay clientes cargados
            </option>
            `;

        return;

    }


    clientes.forEach(
        cliente => {

            const nombre =
                cliente.nombre ||
                cliente.nombreCliente ||
                cliente.razonSocial ||
                cliente.empresa ||
                "Cliente";


            clienteSelect.innerHTML +=
                `
                <option value="${escapeHTML(cliente.id)}">
                    ${escapeHTML(nombre)}
                </option>
                `;

        }
    );

}


/* =====================================================
   PRESUPUESTOS
===================================================== */

async function cargarPresupuestos(){

    presupuestos = [];


    try{

        const snapshot =
            await getDocs(
                query(
                    collection(
                        db,
                        "presupuestos"
                    ),
                    where(
                        "empresaId",
                        "==",
                        empresaIdActual
                    )
                )
            );


        snapshot.forEach(
            documento => {

                presupuestos.push({

                    id:documento.id,

                    ...documento.data()

                });

            }
        );

    }
    catch(error){

        console.warn(
            "Presupuestos por empresaId falló:",
            error
        );

    }


    if(presupuestos.length === 0){

        try{

            const snapshot =
                await getDocs(
                    query(
                        collection(
                            db,
                            "presupuestos"
                        ),
                        where(
                            "uid",
                            "==",
                            usuarioActual.uid
                        )
                    )
                );


            snapshot.forEach(
                documento => {

                    presupuestos.push({

                        id:documento.id,

                        ...documento.data()

                    });

                }
            );

        }
        catch(error){

            console.warn(
                "Presupuestos por uid falló:",
                error
            );

        }

    }

}


/* =====================================================
   TRABAJOS
===================================================== */

async function cargarTrabajos(){

    trabajos = [];


    try{

        const snapshot =
            await getDocs(
                query(
                    collection(
                        db,
                        "trabajos"
                    ),
                    where(
                        "empresaId",
                        "==",
                        empresaIdActual

    }
    catch(error){

        console.warn(
            "No se pudieron cargar trabajos:",
            error
        );

    }

}


/* =====================================================
   CAMBIO CLIENTE
===================================================== */

clienteSelect.addEventListener(

    () => {

        const clienteId =

        presupuestoSelect.innerHTML =

        }

                    :

            presupuesto => {

                    presupuesto.numero ||
                    presupuesto.numeroPresupuesto ||

/* =====================================================
   CAMBIO PRESUPUESTO
===================================================== */

presupuestoSelect.addEventListener(
    "change",
    () => {

        const presupuestoId =
            presupuestoSelect.value;


        cardItems.style.display =
            "none";


        listaItems.innerHTML =
            "";


        trabajoSelect.innerHTML =
            `<option value="">Seleccioná trabajo</option>`;


        if(!presupuestoId){

            return;

        }


        const presupuesto =
            presupuestos.find(
                item =>
                    item.id === presupuestoId
            );


        if(presupuesto){

            const numero =
                presupuesto.numero ||
                presupuesto.numeroPresupuesto ||
                presupuesto.codigo ||
                presupuesto.id;


            const total =
                Number(
                    presupuesto.total ||
                    presupuesto.importeTotal ||
                    presupuesto.montoTotal ||
                    0
                );


            document.getElementById(
                "datosPresupuestoInfo"
            ).textContent =
                "N° " +
                numero +
                " | Total: " +
                dinero(total);


            document.getElementById(
                "datosPresupuesto"
            ).style.display =
                "block";


            cargarItemsPresupuesto(
                presupuesto
            );

        }


        const lista =
            trabajos.filter(
                trabajo =>
                    trabajo.presupuestoId === presupuestoId ||
                    trabajo.idPresupuesto === presupuestoId ||
                    trabajo.presupuesto === presupuestoId
            );


        lista.forEach(
            trabajo => {

                const option =
                    document.createElement("option");


                option.value =
                    trabajo.id;


                option.textContent =
                    trabajo.nombre ||
                    trabajo.descripcion ||
                    trabajo.titulo ||
                    "Trabajo";


                trabajoSelect.appendChild(
                    option
                );

            }
        );

    }
);


/* =====================================================
   ITEMS
===================================================== */

function cargarItemsPresupuesto(
    presupuesto
){

    itemsPresupuesto = [];


    let items =
        presupuesto.items ||
        presupuesto.detalles ||
        presupuesto.conceptos ||
        presupuesto.renglones ||
        [];


    if(!Array.isArray(items)){

        items = [];

    }


    items.forEach(
        (item,index) => {

            const cantidad =
                Number(
                    item.cantidad ||
                    item.cantidadPresupuestada ||

/* =====================================================
   CALCULAR
===================================================== */

function calcularCertificacion(){

    let total = 0;


    document
    .querySelectorAll(
        ".cantidad-ejecutada"
    )
    .forEach(
        input => {

            const index =
                Number(
                    input.dataset.index
                );


            const item =
                itemsPresupuesto[index];


            if(!item){

                return;

            }


            let ejecutada =
                Number(input.value) || 0;


            if(ejecutada < 0){

                ejecutada = 0;

            }


            if(
                item.cantidad > 0 &&
                ejecutada > item.cantidad
            ){

                ejecutada =
                    item.cantidad;

                input.value =
                    item.cantidad;

            }


            item.ejecutada =
                ejecutada;


            const porcentaje =
                item.cantidad > 0
                ?
                (ejecutada / item.cantidad) * 100
                :
                0;


            const importe =
                item.cantidad > 0
                ?
                item.importe *
                (ejecutada / item.cantidad)
                :
                0;


            item.porcentaje =
                porcentaje;


            item.importeCertificado =
                importe;


            const porcentajeElemento =
                document.querySelector(
                    `.porcentaje[data-index="${index}"]`
                );


            const importeElemento =
                document.querySelector(
                    `.importe-item[data-index="${index}"]`
                );


            if(porcentajeElemento){

                porcentajeElemento.textContent =
                    porcentaje.toFixed(2) +
                    "%";

            }


            if(importeElemento){

                importeElemento.textContent =
                    dinero(importe);

            }


            total += importe;

        }
    );


    totalCertificacion.textContent =
        dinero(total);

}


/* =====================================================
   FIRMA
===================================================== */

function prepararCanvas(){

    const rect =
        canvas.getBoundingClientRect();


    const ratio =
        window.devicePixelRatio || 1;


    canvas.width =
        rect.width * ratio;


    canvas.height =
        220 * ratio;


    ctx.setTransform(
        ratio,
        0,
        0,
        ratio,
        0,
        0
    );


    ctx.lineWidth = 2;

    ctx.lineCap = "round";

    ctx.lineJoin = "round";

    ctx.strokeStyle = "#111827";

}


setTimeout(
    prepararCanvas,
    300
);


let dibujando = false;


function posicionFirma(evento){

    const rect =
        canvas.getBoundingClientRect();


    return {

        x:
            evento.clientX -
            rect.left,

        y:
            evento.clientY -
            rect.top

    };

}


canvas.addEventListener(
    "pointerdown",
    evento => {

        evento.preventDefault();

        dibujando = true;

        firmaRealizada = true;

        canvas.setPointerCapture(
            evento.pointerId
        );


        const p =
            posicionFirma(evento);


        ctx.beginPath();

        ctx.moveTo(
            p.x,
            p.y
        );

    }
);


canvas.addEventListener(
    "pointermove",
    evento => {

        if(!dibujando){

            return;

        }


        evento.preventDefault();


        const p =
            posicionFirma(evento);


        ctx.lineTo(
            p.x,
            p.y
        );


        ctx.stroke();

    }
);


canvas.addEventListener(
    "pointerup",
    () => {

        dibujando = false;

        ctx.closePath();

    }
);


canvas.addEventListener(
    "pointercancel",
    () => {

        dibujando = false;

        ctx.closePath();

    }
);


document
.getElementById("btnLimpiarFirma")
.addEventListener(
    "click",
    () => {

        ctx.clearRect(
            0,
            0,
            canvas.width,
            canvas.height
        );

        firmaRealizada = false;

    }
);

function obtenerDatosPDF(){

    calcularCertificacion();


    const clienteId =
        clienteSelect.value;


    const presupuestoId =
        presupuestoSelect.value;


    const cliente =
        clientes.find(
            item =>
                item.id === clienteId
        );


    const presupuesto =
        presupuestos.find(
            item =>
                item.id === presupuestoId
        );


    const trabajo =
        trabajos.find(
            item =>
                item.id === trabajoSelect.value
        );


    const nombreCliente =
        cliente?.nombre ||
        cliente?.nombreCliente ||
        cliente?.razonSocial ||
        cliente?.empresa ||
        "Cliente";


    const numeroPresupuesto =
        presupuesto?.numero ||
        presupuesto?.numeroPresupuesto ||
        presupuesto?.codigo ||
        presupuestoId;


    const fechaDesde =
        document.getElementById(
            "fechaDesde"
        ).value;


    const fechaHasta =
        document.getElementById(
            "fechaHasta"
        ).value;


    const descripcion =
        document.getElementById(
            "descripcion"
        ).value.trim();


    const total =
        itemsPresupuesto.reduce(
            (suma,item) =>
                suma +
                Number(
                    item.importeCertificado || 0
                ),
            0
        );


    return {

        cliente,
        presupuesto,
        trabajo,
        nombreCliente,
        numeroPresupuesto,
        fechaDesde,
        fechaHasta,
        descripcion,
        total

    };

}

   CARGAR CERTIFICACIONES
===================================================== */

async function cargarCertificaciones(){

    const cargando =
        document.getElementById(
            "cargandoCertificaciones"
        );


    const tabla =
        document.getElementById(
            "tablaCertificaciones"
        );


    cargando.style.display =
        "block";


    tabla.innerHTML =
        "";


    certificaciones = [];


    try{

        const snapshot =
            await getDocs(
                query(
                    collection(
                        db,
                        "certificaciones"
                    ),
                    where(
                        "empresaId",
                        "==",
                        empresaIdActual
                    )
                )
            );


        snapshot.forEach(
            documento => {

                certificaciones.push({

                    id:
                        documento.id,

                    ...documento.data()

                });

            }
        );


    }
    catch(error){

        console.error(
            "ERROR CERTIFICACIONES:",
            error
        );


        tabla.innerHTML =
            `
            <tr>
                <td colspan="6">
                    No se pudieron cargar las certificaciones.
                </td>
            </tr>
            `;


        cargando.style.display =
            "none";


        return;

    }


    if(certificaciones.length === 0){

        tabla.innerHTML =
            `
            <tr>
                <td colspan="6">
                    No hay certificaciones realizadas.
                </td>
            </tr>
            `;


        cargando.style.display =
            "none";


        return;

    }


    certificaciones.sort(
        (a,b) =>
            String(
                b.fecha || ""
            ).localeCompare(
                String(
                    a.fecha || ""
                )
            )
    );


    certificaciones.forEach(
        certificacion => {

            const cliente =
                clientes.find(
                    item =>
                        item.id ===
                        certificacion.clienteId
                );


            const presupuesto =
                presupuestos.find(
                    item =>
                        item.id ===
                        certificacion.presupuestoId
                );


            const nombreCliente =
                cliente?.nombre ||
                cliente?.nombreCliente ||
                cliente?.razonSocial ||
                cliente?.empresa ||
                "Cliente";


            const numero =
                presupuesto?.numero ||
                presupuesto?.numeroPresupuesto ||
                presupuesto?.codigo ||
                certificacion.presupuestoId ||
                "Presupuesto";


            const tr =
                document.createElement("tr");


            tr.innerHTML =
                `
                <td>
                    ${escapeHTML(nombreCliente)}
                </td>

                <td>
                    ${escapeHTML(String(numero))}
                </td>

                <td>
                    ${escapeHTML(
                        certificacion.periodo || ""
                    )}
                </td>

                <td>
                    ${escapeHTML(
                        certificacion.fecha || ""
                    )}
                </td>

                <td>
                    ${dinero(
                        certificacion.importeTotal
                    )}
                </td>

                <td>

                    <button
                        type="button"
                        class="btn-success"
                        data-id="${escapeHTML(certificacion.id)}"
                    >
                        📄 PDF
                    </button>

                </td>
                `;


            tabla.appendChild(tr);

        }
    );


    cargando.style.display =
        "none";

}

    y += 10;


    pdf.setFont(
        "helvetica",
        "bold"
    );


    pdf.text(
        "TRABAJOS REALIZADOS",
        20,
        y
    );


    y += 7;


    pdf.setFont(
        "helvetica",
        "normal"
    );


    const descripcion =
        pdf.splitTextToSize(
            certificacion.descripcion || "",
            170
        );


    pdf.text(
        descripcion,
        20,
        y
    );


    y +=
        descripcion.length * 5 +
        10;


    pdf.setFont(
        "helvetica",
        "bold"
    );


    pdf.text(
        "DETALLE DE CERTIFICACIÓN",
        20,
        y
    );


    y += 8;


    pdf.setFontSize(9);


    pdf.text(
        "Ítem",
        20,
        y
    );


    pdf.text(
        "Presup.",
        90,
        y
    );


    pdf.text(
        "Ejecut.",
        115,
        y
    );


    pdf.text(
        "%",
        140,
        y
    );


    pdf.text(
        "Importe",
        160,
        y
    );


    y += 6;


    pdf.setFont(
        "helvetica",
        "normal"
    );


    (
        certificacion.items || []
    ).forEach(
        item => {

            if(y > 265){

                pdf.addPage();

                y = 20;

            }


            const nombre =
                pdf.splitTextToSize(
                    item.nombre || "Ítem",
                    65
                );


            pdf.text(
                nombre,
                20,
                y
            );


            pdf.text(
                String(
                    item.cantidadPresupuestada || 0
                ),
                90,
                y
            );


            pdf.text(
                String(
                    item.cantidadEjecutada || 0
                ),
                115,
                y
            );


            pdf.text(
                Number(
                    item.porcentaje || 0
                ).toFixed(2) +
                "%",
                137,
                y
            );


            pdf.text(
                dinero(
                    item.importeCertificado
                ),
                160,
                y
            );


            y +=
                Math.max(
                    6,
                    nombre.length * 5
                );

        }
    );


    y += 8;


    pdf.setFont(
        "helvetica",
        "bold"
    );


    pdf.setFontSize(11);


    pdf.text(
        "TOTAL CERTIFICADO:",
        105,
        y
    );


    pdf.text(
        dinero(
            certificacion.importeTotal
        ),
        160,
        y
    );


    y += 18;


    if(y > 220){

        pdf.addPage();

        y = 25;

    }


    pdf.text(
        "FIRMA",
        20,
        y
    );


    y += 8;


    if(certificacion.firma){

        pdf.addImage(
            certificacion.firma,
            "PNG",
            20,
            y,
            75,
            35
        );

        y += 42;

    }


    pdf.line(
        20,
        y,
        95,
        y
    );


    y += 6;


    pdf.setFont(
        "helvetica",
        "normal"
    );


    pdf.text(
        "Firma y certificación de trabajos",
        20,
        y
    );


    pdf.setFontSize(8);


    pdf.text(
        "Documento generado automáticamente por GESBASE.",
        20,
        285
    );


    pdf.save(
        "certificacion_" +
        String(numero).replace(
            /[^a-zA-Z0-9_-]/g,
            "_"
        ) +
        "_" +
        (
            certificacion.fecha ||
            fechaHoy()
        ) +
        ".pdf"
    );

}

    () => {

        window.location.href =
            "index.html";

    }
);

   FECHAS
===================================================== */

document.getElementById(
    "fechaDesde"
).value =
    fechaHoy();


document.getElementById(
    "fechaHasta"
).value =
    fechaHoy();
