<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>GESBASE | Certificación</title>
<link rel="stylesheet" href="style.css">

<style>
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:Arial;background:#f3f4f6;color:#111827}
header{background:#111827;color:#fff;padding:18px;text-align:center}
.container{max-width:900px;margin:auto;padding:15px}
.card{background:#fff;border-radius:14px;padding:18px;margin-bottom:15px}
h2{margin-bottom:15px}
label{font-weight:bold;font-size:14px;margin-bottom:5px;display:block}
select,input,textarea{
width:100%;padding:12px;border:1px solid #d1d5db;
border-radius:8px;margin-bottom:12px;font-size:15px}
button{
width:100%;padding:14px;border:0;border-radius:10px;
background:#2563eb;color:#fff;font-weight:bold}
.item{border:1px solid #e5e7eb;border-radius:10px;padding:12px;margin:10px 0}
.total{background:#ecfdf5;padding:15px;border-radius:10px;text-align:right}
</style>
</head>

<body>

<header>
<h1>📋 Certificación</h1>
<p>GESBASE</p>
</header>

<div class="container">

<div class="card">
<h2>1. Seleccionar trabajo</h2>

<label>Cliente</label>
<select id="cliente">
<option value="">Cargando...</option>
</select>

<label>Presupuesto</label>
<select id="presupuesto" disabled>
<option>Seleccioná un cliente</option>
</select>

<label>Trabajo</label>
<select id="trabajo" disabled>
<option>Seleccioná un presupuesto</option>
</select>
</div>

<div class="card" id="cardItems" style="display:none">
<h2>2. Certificar avance</h2>

<div id="listaItems"></div>

<div class="total">
<b>Total:</b>
<h2 id="total">$0</h2>
</div>

<button id="guardar">Guardar certificación</button>
</div>

<div class="card">
<h2>📄 Certificaciones registradas</h2>
<div id="listaCertificaciones">
Todavía no hay certificaciones.
</div>
</div>

</div>

<script type="module" src="./Js/certificacion.js"></script>

</body>
</html>
