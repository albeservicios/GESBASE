h2{

h3{

}

label{

}

input,

textarea{

    border-radius:10px;
    padding:12px;
    font-size:15px;
    background:white;
    outline:none;
}

input:focus,
select:focus,
textarea:focus{

}

textarea{
    min-height:90px;
    resize:vertical;
}

.grupo{
    margin-bottom:14px;
}

.grid{
    display:grid;
    grid-template-columns:1fr;
    gap:12px;
}

.barcode-box{
    border:1px solid #d1d5db;
    border-radius:12px;
    padding:12px;

.barcode-row{

}

.barcode-row input{

button{

.btn-secundario{

.btn-peligro{

.btn-editar{

.btn-escanear{

<header>
    <div class="header-contenido">
        <div class="logo">GESBASE</div>
        <div class="subtitulo">Gestión de productos e inventario</div>
    </div>
</header>

<main>

    <div id="mensaje" class="estado"></div>

    <div class="card">
        <div class="info-empresa">

    </div>

    <div class="card">

        <h2 id="tituloFormulario">Nuevo producto</h2>

        <div class="grid">

            <div class="grupo">
                <label for="nombre">Nombre del producto *</label>
                <input
                    type="text"
                    id="nombre"
                    placeholder="Ej: Remera básica"
                    autocomplete="off"
                >
            </div>

            <div class="grupo">
                <label for="precioCosto">Precio de costo *</label>
                <input
                    type="number"
                    id="precioCosto"
                    min="0"
                    step="0.01"
                    placeholder="0"
                >
            </div>

            <div class="grupo">
                <label for="precioVenta">Precio de venta *</label>
                <input
                    type="number"
                    id="precioVenta"
                    min="0"
                    step="0.01"
                    placeholder="0"
                >
            </div>

            <div class="grupo">
                <label for="stock">Stock actual</label>
                <input
                    type="number"
                    id="stock"
                    min="0"
                    step="0.01"
                    value="0"
                >
            </div>

            <div class="grupo">
                <label for="stockMinimo">Stock mínimo</label>
                <input
                    type="number"
                    id="stockMinimo"
                    min="0"
                    step="0.01"
                    value="0"
                >
            </div>

        </div>

        <!-- CÓDIGO DE BARRAS -->
        <div class="barcode-box" id="barcodeBox">

            <label for="codigoBarras">
                Código de barras
            </label>

            <div class="barcode-row">

                <input
                    type="text"
                    id="codigoBarras"
                    placeholder="Escaneá o ingresá el código"
                    maxlength="30"
                    autocomplete="off"
                >

                <button
                    type="button"
                    class="btn-escanear"
                    id="btnEscanear"
                >
                    📷
                </button>

            </div>

            <small style="display:block;margin-top:7px;color:#6b7280;">
                Podés ingresar el código manualmente o escanearlo con la cámara.
            </small>

        </div>

        <!-- CAMPOS DINÁMICOS SEGÚN RUBRO -->
        <div id="camposDinamicos"></div>

        <div class="grupo">
            <label for="descripcion">Descripción</label>

            <textarea
                id="descripcion"
                placeholder="Información adicional del producto..."
            ></textarea>
        </div>

        <div class="acciones">

            <button
                type="button"
                class="btn-principal"
                id="btnGuardar"
            >
                Guardar producto
            </button>

            <button
                type="button"
                class="btn-secundario"
                id="btnCancelar"
                style="display:none;"
            >
                Cancelar
            </button>

        </div>

    </div>

    <div class="card">

        <h2>Productos</h2>

        <div class="busqueda">

            <input
                type="text"
                id="buscarProducto"
                placeholder="🔎 Buscar producto..."

            >

</main>

/* =========================================================

function mostrarMensaje(texto, tipo = "info"){

    mensaje.textContent = texto;

    mensaje.className = "estado " + tipo;

    window.scrollTo({
        top:0,
        behavior:"smooth"
    });

    setTimeout(() => {

        mensaje.className = "estado";

    }, 5000);
}


/* =========================================================
   NORMALIZACIÓN
========================================================= */

function normalizarTexto(valor){

    return String(valor ?? "")
        .trim()
        .toLowerCase();

}


function normalizarCodigo(codigo){

    return String(codigo ?? "").trim();

}


/* =========================================================
   TIPO DE NEGOCIO
========================================================= */

function determinarTipoNegocio(rubro){

    const r = normalizarTexto(rubro);

    if(
        r.includes("construccion") ||
        r.includes("construcción") ||
        r.includes("obra") ||
        r.includes("durlock") ||
        r.includes("steel framing") ||
        r.includes("contratista")
    ){

        return "construccion";

    }

    if(
        r.includes("indumentaria") ||
        r.includes("ropa") ||
        r.includes("vestimenta") ||
        r.includes("textil") ||
        r.includes("calzado") ||
        r.includes("lenceria") ||
        r.includes("lencería")
    ){

        return "indumentaria";

    }

    if(
        r.includes("perfumeria") ||
        r.includes("perfumería") ||
        r.includes("cosmetica") ||
        r.includes("cosmética")
    ){

        return "perfumeria";

    }

    if(
        r.includes("golosina") ||
        r.includes("dulce") ||
        r.includes("confiteria") ||
        r.includes("confitería") ||
        r.includes("distribuidora")
    ){

        return "distribuidora";

    }

    if(
        r.includes("almacen") ||
        r.includes("almacén") ||
        r.includes("supermercado") ||
        r.includes("kiosco") ||
        r.includes("mercado")
    ){

        return "almacen";

    }

    if(
        r.includes("ferreteria") ||
        r.includes("ferretería") ||
        r.includes("corralon") ||
        r.includes("corralón")
    ){

        return "ferreteria";

    }

    if(
        r.includes("gastronomia") ||
        r.includes("gastronomía") ||
        r.includes("restaurante") ||
        r.includes("panaderia") ||
        r.includes("panadería") ||
        r.includes("comida")
    ){

        return "gastronomia";

    }

    return "general";

}

        `;

    }

    else{

        html = `

        <div class="grid">

            <div class="grupo">
                <label for="marca">Marca</label>
                <input
                    type="text"
                    id="marca"
                    placeholder="Marca"
                >
            </div>

            <div class="grupo">
                <label for="categoria">Categoría</label>
                <input
                    type="text"
                    id="categoria"
                    placeholder="Categoría"
                >
            </div>

            <div class="grupo">
                <label for="codigo">Código interno</label>
                <input
                    type="text"
                    id="codigo"
                    placeholder="Código interno"
                >
            </div>

            <div class="grupo">

                <input
                    type="text"
                    id="proveedor"

                >
            </div>

        </div>

        `;

    }

    camposDinamicos.innerHTML = html;

}


/* =========================================================
   CARGAR EMPRESA
========================================================= */

async function cargarEmpresa(){

    if(!usuarioActual){
        throw new Error("Usuario no autenticado.");
    }

    const usuarioRef =
        doc(db,"usuarios",usuarioActual.uid);

    const usuarioSnap =
        await getDoc(usuarioRef);

    if(!usuarioSnap.exists()){

        throw new Error(
            "No se encontró el perfil del usuario."
        );

    }

    usuarioDatos = usuarioSnap.data();

    empresaIdActual =
        usuarioDatos.empresaId ||
        usuarioDatos.idEmpresa ||
        usuarioDatos.empresaID ||
        usuarioActual.uid;

    const empresaRef =
        doc(db,"empresas",empresaIdActual);

    const empresaSnap =
        await getDoc(empresaRef);

    if(empresaSnap.exists()){

        empresaActual = empresaSnap.data();

    }else{

        empresaActual = {};

    }

    rubroActual =
        empresaActual.rubro ||
        empresaActual.tipoNegocio ||
        usuarioDatos.rubro ||
        usuarioDatos.tipoNegocio ||
        "";

    badgeEmpresa.textContent =
        "Empresa: " +
        (
            empresaActual.nombreEmpresa ||
            empresaActual.nombre ||
            usuarioDatos.nombreEmpresa ||
            "Sin especificar"
        );

    badgeRubro.textContent =
        "Rubro: " +
        (
            rubroActual ||
            "General"
        );

    configurarCodigoBarras();

    configurarCamposDinamicos();

}


/* =========================================================
   CARGAR PRODUCTOS
========================================================= */

async function cargarProductos(){

    if(!empresaIdActual){
        return;
    }

    try{

        const consulta = query(
            collection(db,"productos"),
            where("empresaId","==",empresaIdActual)
        );

        const snapshot =
            await getDocs(consulta);

        productos = [];

        snapshot.forEach(docSnap => {

            productos.push({

                id:docSnap.id,

                ...docSnap.data()

            });

        });

        productos.sort((a,b) => {

            const nombreA =
                normalizarTexto(a.nombre);

            const nombreB =
                normalizarTexto(b.nombre);

            return nombreA.localeCompare(nombreB);

        });

        renderizarProductos();

    }catch(error){

        console.error(error);

        mostrarMensaje(
            "No se pudieron cargar los productos.",
            "error"
        );

    }

}


/* =========================================================
   RENDERIZAR PRODUCTOS
========================================================= */

function renderizarProductos(){

    const texto =
        normalizarTexto(buscarProducto.value);

    const filtrados =
        productos.filter(producto => {

            if(!texto){
                return true;
            }

            const contenido = [

                producto.nombre,

                producto.codigoBarras,

                producto.codigo,

                producto.marca,

                producto.categoria,

                producto.proveedor,

                producto.talle,

                producto.color

            ].join(" ");

            return normalizarTexto(
                contenido
            ).includes(texto);

        });


    if(filtrados.length === 0){

        listaProductos.innerHTML = `

            <div class="vacio">
                No hay productos para mostrar.
            </div>

        `;

        return;

    }


    listaProductos.innerHTML =
        filtrados.map(producto => {

            const costo =
                Number(producto.precioCosto || 0);

            const venta =
                Number(producto.precioVenta || 0);

            const stockActual =
                Number(producto.stock || 0);

            const stockMinimo =
                Number(producto.stockMinimo || 0);

            let datosExtra = "";


            if(producto.marca){

                datosExtra +=
                    `<div class="producto-linea">
                        <strong>Marca:</strong>
                        ${escapeHtml(producto.marca)}
                    </div>`;

            }

            if(producto.categoria){

                datosExtra +=
                    `<div class="producto-linea">
                        <strong>Categoría:</strong>
                        ${escapeHtml(producto.categoria)}
                    </div>`;

            }

            if(producto.talle){

                datosExtra +=
                    `<div class="producto-linea">
                        <strong>Talle:</strong>
                        ${escapeHtml(producto.talle)}
                    </div>`;

            }

            if(producto.color){

                datosExtra +=
                    `<div class="producto-linea">
                        <strong>Color:</strong>
                        ${escapeHtml(producto.color)}
                    </div>`;

            }

            if(producto.presentacion){

                datosExtra +=
                    `<div class="producto-linea">
                        <strong>Presentación:</strong>
                        ${escapeHtml(producto.presentacion)}
                    </div>`;

            }

            if(producto.unidad){

                datosExtra +=
                    `<div class="producto-linea">
                        <strong>Unidad:</strong>
                        ${escapeHtml(producto.unidad)}
                    </div>`;

            }

            if(producto.proveedor){

                datosExtra +=
                    `<div class="producto-linea">
                        <strong>Proveedor:</strong>
                        ${escapeHtml(producto.proveedor)}
                    </div>`;

            }


            const codigoBarraHTML =
                producto.codigoBarras
                ?
                `<div class="producto-linea">
                    <strong>📦 Código de barras:</strong>
                    ${escapeHtml(producto.codigoBarras)}
                </div>`
                :
                "";


            const stockBajo =
                stockActual <= stockMinimo &&
                stockMinimo > 0;


            return `

                <div class="producto">

                    <div class="producto-titulo">
                        ${escapeHtml(
                            producto.nombre || "Sin nombre"
                        )}
                    </div>

                    ${codigoBarraHTML}

                    <div class="producto-linea">
                        <strong>Stock:</strong>
                        ${stockActual}
                        ${
                            stockBajo
                            ?
                            " ⚠️ Stock bajo"
                            :
                            ""
                        }
                    </div>

                    ${datosExtra}

                    <div class="producto-precios">

                        <div class="precio">

                            <small>
                                Precio de costo
                            </small>

                            <strong>
                                $${formatearNumero(costo)}
                            </strong>

                        </div>

                        <div class="precio">

                            <small>
                                Precio de venta
                            </small>

                            <strong>
                                $${formatearNumero(venta)}
                            </strong>

                        </div>

                    </div>

                    <div class="producto-acciones">

                        <button
                            type="button"
                            class="btn-editar"
                            onclick="window.editarProducto('${producto.id}')"
                        >
                            ✏️ Editar
                        </button>

                        <button
                            type="button"
                            class="btn-peligro"
                            onclick="window.eliminarProducto('${producto.id}')"
                        >
                            🗑️ Eliminar
                        </button>

                    </div>

                </div>

            `;

        }).join("");

}


/* =========================================================
   FORMATEAR NÚMEROS
========================================================= */

function formatearNumero(numero){

    return Number(numero || 0).toLocaleString(
        "es-AR",
        {
            minimumFractionDigits:2,
            maximumFractionDigits:2
        }
    );

}


/* =========================================================
   ESCAPE HTML
========================================================= */

function escapeHtml(valor){

    return String(valor ?? "")
        .replace(/&/g,"&amp;")
        .replace(/</g,"&lt;")
        .replace(/>/g,"&gt;")
        .replace(/"/g,"&quot;")
        .replace(/'/g,"&#039;");

}


/* =========================================================
   OBTENER CAMPOS DINÁMICOS
========================================================= */

function obtenerCamposDinamicos(){

    const campos = {};

    const ids = [

        "marca",
        "categoria",
        "talle",
        "color",
        "temporada",
        "presentacion",
        "genero",
        "unidad",
        "proveedor",
        "vencimiento",
        "codigo"

    ];


    ids.forEach(id => {

        const elemento =
            document.getElementById(id);

        if(elemento){

            campos[id] =
                elemento.value.trim();

        }

    });


    return campos;

}


/* =========================================================
   DUPLICADO CÓDIGO DE BARRAS
========================================================= */

async function verificarCodigoDuplicado(codigo){

    const codigoNormalizado =
        normalizarCodigo(codigo);

    if(!codigoNormalizado){
        return false;
    }

    const consulta = query(
        collection(db,"productos"),
        where(
            "empresaId",
            "==",
            empresaIdActual
        ),
        where(
            "codigoBarras",
            "==",
            codigoNormalizado
        )
    );

    const snapshot =
        await getDocs(consulta);

    for(const docSnap of snapshot.docs){

        if(docSnap.id !== productoEditandoId){

            return true;

        }

    }

    return false;

}


/* =========================================================
   GUARDAR PRODUCTO
========================================================= */

async function guardarProducto(){

    if(!usuarioActual){
        mostrarMensaje(
            "Usuario no autenticado.",
            "error"
        );
        return;
    }


    const nombreValor =
        nombre.value.trim();

    const costo =
        Number(precioCosto.value);

    const venta =
        Number(precioVenta.value);

    const stockActual =
        Number(stock.value || 0);

    const stockMinimoActual =
        Number(stockMinimo.value || 0);


    if(!nombreValor){

        mostrarMensaje(
            "Ingresá el nombre del producto.",
            "error"
        );

        nombre.focus();

        return;

    }


    if(
        !Number.isFinite(costo) ||
        costo < 0
    ){

        mostrarMensaje(
            "Ingresá un precio de costo válido.",
            "error"
        );

        precioCosto.focus();

        return;

    }


    if(
        !Number.isFinite(venta) ||
        venta < 0
    ){

        mostrarMensaje(
            "Ingresá un precio de venta válido.",
            "error"
        );

        precioVenta.focus();

        return;

    }


    if(
        !Number.isFinite(stockActual) ||
        stockActual < 0
    ){

        mostrarMensaje(
            "Ingresá un stock válido.",
            "error"
        );

        stock.focus();

        return;

    }


    if(
        !Number.isFinite(stockMinimoActual) ||
        stockMinimoActual < 0
    ){

        mostrarMensaje(
            "Ingresá un stock mínimo válido.",
            "error"
        );

        stockMinimo.focus();

        return;

    }


    let codigo =
        normalizarCodigo(codigoBarras.value);


    if(
        determinarTipoNegocio(rubroActual)
        ===
        "construccion"
    ){

        codigo = "";

    }


    if(codigo){

        const duplicado =
            await verificarCodigoDuplicado(codigo);

        if(duplicado){

            mostrarMensaje(
                "Ese código de barras ya está registrado para otro producto de tu empresa.",
                "error"
            );

            codigoBarras.focus();

            return;

        }

    }


    const campos =
        obtenerCamposDinamicos();


    const datosProducto = {

        empresaId:
            empresaIdActual,

        propietarioId:
            usuarioActual.uid,

        nombre:
            nombreValor,

        rubro:
            rubroActual,

        tipoNegocio:
            rubroActual,

        precioCosto:
            costo,

        precioVenta:
            venta,

        stock:
            stockActual,

        stockMinimo:
            stockMinimoActual,

        descripcion:
            descripcion.value.trim(),

        ...campos,

        codigoBarras:
            codigo,

        actualizadoEn:
            serverTimestamp()

    };


    try{

        btnGuardar.disabled = true;

        btnGuardar.textContent =
            productoEditandoId
            ?
            "Actualizando..."
            :
            "Guardando...";


        if(productoEditandoId){

            const productoRef =
                doc(
                    db,
                    "productos",
                    productoEditandoId
                );

            await updateDoc(
                productoRef,
                datosProducto
            );


            mostrarMensaje(
                "✅ Producto actualizado correctamente.",
                "exito"
            );

        }else{

            await addDoc(
                collection(db,"productos"),
                {

                    ...datosProducto,

                    fechaCreacion:
                        serverTimestamp()

                }
            );


            mostrarMensaje(
                "✅ Producto creado correctamente.",
                "exito"
            );

        }


        limpiarFormulario();

        await cargarProductos();


    }catch(error){

        console.error(error);

        mostrarMensaje(
            "No se pudo guardar el producto: " +
            (error.message || ""),
            "error"
        );

    }finally{

        btnGuardar.disabled = false;

        btnGuardar.textContent =
            "Guardar producto";

    }

}


/* =========================================================
   EDITAR PRODUCTO
========================================================= */

window.editarProducto = function(id){

    const producto =
        productos.find(
            item => item.id === id
        );

    if(!producto){

        mostrarMensaje(
            "No se encontró el producto.",
            "error"
        );

        return;

    }


    productoEditandoId = id;

    tituloFormulario.textContent =
        "Editar producto";

    btnGuardar.textContent =
        "Actualizar producto";

    btnCancelar.style.display =
        "block";


    nombre.value =
        producto.nombre || "";

    precioCosto.value =
        producto.precioCosto ?? 0;

    precioVenta.value =
        producto.precioVenta ?? 0;

    stock.value =
        producto.stock ?? 0;

    stockMinimo.value =
        producto.stockMinimo ?? 0;

    codigoBarras.value =
        producto.codigoBarras || "";

    descripcion.value =
        producto.descripcion || "";


    const campos = [

        "marca",
        "categoria",
        "talle",
        "color",
        "temporada",
        "presentacion",
        "genero",
        "unidad",
        "proveedor",
        "vencimiento",
        "codigo"

    ];


    campos.forEach(idCampo => {

        const elemento =
            document.getElementById(idCampo);

        if(elemento){

            elemento.value =
                producto[idCampo] || "";

        }

    });


    window.scrollTo({

        top:0,

        behavior:"smooth"

    });

};


/* =========================================================
   ELIMINAR PRODUCTO
========================================================= */

window.eliminarProducto = async function(id){

    const producto =
        productos.find(
            item => item.id === id
        );

    if(!producto){
        return;
    }


    const confirmar =
        confirm(
            `¿Querés eliminar el producto "${producto.nombre}"?`
        );


    if(!confirmar){
        return;
    }


    try{

        const productoRef =
            doc(
                db,
                "productos",
                id
            );

        await deleteDoc(productoRef);

        mostrarMensaje(
            "✅ Producto eliminado correctamente.",
            "exito"
        );

        await cargarProductos();

    }catch(error){

        console.error(error);

        mostrarMensaje(
            "No se pudo eliminar el producto.",
            "error"
        );

    }

};


/* =========================================================
   LIMPIAR FORMULARIO
========================================================= */

function limpiarFormulario(){

    productoEditandoId = null;

    tituloFormulario.textContent =
        "Nuevo producto";

    btnGuardar.textContent =
        "Guardar producto";

    btnCancelar.style.display =
        "none";


    nombre.value = "";

    precioCosto.value = "";

    precioVenta.value = "";

    stock.value = "0";

    stockMinimo.value = "0";

    codigoBarras.value = "";

    descripcion.value = "";


    const campos = [

        "marca",
        "categoria",
        "talle",
        "color",
        "temporada",
        "presentacion",
        "genero",
        "unidad",
        "proveedor",
        "vencimiento",
        "codigo"

    ];


    campos.forEach(idCampo => {

        const elemento =
            document.getElementById(idCampo);

        if(elemento){

            elemento.value = "";

        }

    });

}


/* =========================================================
   ESCÁNER
========================================================= */

async function iniciarScanner(){

    if(
        determinarTipoNegocio(rubroActual)
        ===
        "construccion"
    ){

        mostrarMensaje(
            "El escáner de código de barras no está disponible para construcción.",
            "info"
        );

        return;

    }


    if(
        !("BarcodeDetector" in window)
    ){

        mostrarMensaje(
            "Tu navegador no permite escaneo de códigos de barras directamente. Podés ingresar el código manualmente.",
            "error"
        );

        return;

    }


    try{

        streamScanner =
            await navigator.mediaDevices.getUserMedia({

                video:{
                    facingMode:{
                        ideal:"environment"
                    }
                },

                audio:false

            });


        videoScanner.srcObject =
            streamScanner;

        modalScanner.classList.add("activo");

        scannerActivo = true;

        estadoScanner.textContent =
            "Apuntá la cámara al código de barras.";

        estadoScanner.className =
            "estado info";

        const detector =
            new BarcodeDetector();


        detectarCodigo(detector);


    }catch(error){

        console.error(error);

        mostrarMensaje(
            "No se pudo acceder a la cámara. Verificá los permisos del navegador.",
            "error"
        );

        detenerScanner();

    }

}


async function detectarCodigo(detector){

    if(!scannerActivo){
        return;
    }


    try{

        if(
            videoScanner.readyState >= 2
        ){

            const codigos =
                await detector.detect(
                    videoScanner
                );


            if(
                codigos &&
                codigos.length > 0
            ){

                const codigoDetectado =
                    codigos[0].rawValue;


                if(codigoDetectado){

                    codigoBarras.value =
                        normalizarCodigo(
                            codigoDetectado
                        );


                    estadoScanner.textContent =
                        "✅ Código detectado: " +
                        codigoDetectado;

                    estadoScanner.className =
                        "estado exito";


                    setTimeout(() => {

                        detenerScanner();

                    },700);


                    return;

                }

            }

        }

    }catch(error){

        console.error(
            "Error detectando código:",
            error
        );

    }


    requestAnimationFrame(
        () => detectarCodigo(detector)
    );

}


function detenerScanner(){

    scannerActivo = false;


    if(streamScanner){

        streamScanner
            .getTracks()
            .forEach(track => {

                track.stop();

            });

        streamScanner = null;

    }


    videoScanner.srcObject = null;

    modalScanner.classList.remove(
        "activo"
    );

}


/* =========================================================
   EVENTOS
========================================================= */

btnGuardar.addEventListener(

    guardarProducto
);


btnCancelar.addEventListener(
    "click",
    limpiarFormulario
);


buscarProducto.addEventListener(

    renderizarProductos
);


btnEscanear.addEventListener(
    "click",
    iniciarScanner
);


cerrarScanner.addEventListener(
    "click",
    detenerScanner
);


btnCerrarScanner.addEventListener(
    "click",
    detenerScanner
);


codigoBarras.addEventListener(

                    /[^0-9A-Za-z_-]/g,
                    ""
                )
                .slice(0,30);

    }
);


/* =========================================================
   AUTENTICACIÓN
========================================================= */

onAuthStateChanged(
    auth,
    async usuario => {

        if(!usuario){

            window.location.href =
                "login.html";

            return;

        }


        usuarioActual = usuario;


        try{

            await cargarEmpresa();

            await cargarProductos();

        }catch(error){

            console.error(error);

            mostrarMensaje(
                error.message ||
                "No se pudo cargar la información.",
                "error"
            );

        }

    }
);
