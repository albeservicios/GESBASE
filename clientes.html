<!DOCTYPE html>
<html lang="es">

<head>

<meta charset="UTF-8">

<meta name="viewport" content="width=device-width, initial-scale=1.0">

<meta name="theme-color" content="#111827">

<meta name="description" content="GESBASE - Gestión de clientes">

<title>Clientes - GESBASE</title>

<style>

*{
    box-sizing:border-box;
    margin:0;
    padding:0;
}

body{
    font-family:Arial,Helvetica,sans-serif;
    background:#f3f4f6;
    color:#111827;
}

.contenedor{
    width:100%;
    max-width:700px;
    min-height:100vh;
    margin:auto;
    background:#ffffff;
}

header{
    background:#111827;
    color:#ffffff;
    padding:24px 20px;
}

header h1{
    font-size:25px;
}

header p{
    margin-top:6px;
    color:#d1d5db;
    font-size:14px;
}

main{
    padding:20px;
}

.usuario{
    background:#f3f4f6;
    border-radius:10px;
    padding:13px;
    margin-bottom:15px;
    font-size:14px;
    word-break:break-word;
}

.acciones{
    display:flex;
    gap:10px;
    margin-bottom:15px;
}

.boton{
    width:100%;
    border:none;
    border-radius:10px;
    padding:14px;
    font-size:15px;
    font-weight:bold;
    cursor:pointer;
    text-align:center;
    text-decoration:none;
}

.boton-nuevo{
    flex:1;
    background:#111827;
    color:#ffffff;
}

.boton-actualizar{
    flex:1;
    background:#374151;
    color:#ffffff;
}

.boton:disabled{
    opacity:.6;
    cursor:not-allowed;
}

.buscador{
    width:100%;
    padding:14px;
    border:1px solid #d1d5db;
    border-radius:10px;
    font-size:15px;
    outline:none;
    margin-bottom:18px;
}

.buscador:focus{
    border-color:#2563eb;
}

.cargando{
    text-align:center;
    padding:35px 15px;
    color:#6b7280;
}

.lista{
    display:flex;
    flex-direction:column;
    gap:15px;
}

.cliente{
    border:1px solid #d1d5db;
    border-radius:14px;
    padding:18px;
    background:#ffffff;
    box-shadow:0 3px 10px rgba(0,0,0,.08);
}

.cliente-nombre{
    font-size:20px;
    font-weight:bold;
    margin-bottom:12px;
    word-break:break-word;
}

.dato{
    margin-top:7px;
    color:#4b5563;
    font-size:14px;
    line-height:1.4;
    word-break:break-word;
}

.observaciones{
    margin-top:12px;
    padding-top:12px;
    border-top:1px solid #e5e7eb;
    color:#374151;
    font-size:14px;
    line-height:1.5;
    white-space:pre-wrap;
}

.boton-ver{
    display:block;
    margin-top:14px;
    background:#111827;
    color:#ffffff;
}

.boton-editar{
    display:block;
    margin-top:10px;
    background:#2563eb;
    color:#ffffff;
}

.boton-eliminar{
    margin-top:10px;
    background:#fee2e2;
    color:#991b1b;
    border:1px solid #fecaca;
}

.sin-clientes{
    display:none;
    text-align:center;
    padding:35px 20px;
    color:#6b7280;
}

.sin-busqueda{
    display:none;
    text-align:center;
    padding:25px;
    color:#6b7280;
}

.error{
    display:none;
    background:#fee2e2;
    color:#991b1b;
    padding:14px;
    border-radius:10px;
    margin-bottom:15px;
    line-height:1.5;
    word-break:break-word;
}

.exito{
    display:none;
    background:#dcfce7;
    color:#166534;
    padding:14px;
    border-radius:10px;
    margin-bottom:15px;
}

.boton-volver{
    display:block;
    margin-top:20px;
    background:#e5e7eb;
    color:#111827;
}

@media(max-width:480px){

    main{
        padding:15px;
    }

    .acciones{
        flex-direction:column;
    }

    .cliente{
        padding:16px;
    }

}

</style>

</head>


<body>

<div class="contenedor">

<header>

<h1>Clientes</h1>

<p>GESBASE - Gestión de clientes</p>

</header>


<main>


<div
    id="usuario"
    class="usuario"
>
Verificando sesión...
</div>


<div
    id="error"
    class="error"
></div>


<div
    id="exito"
    class="exito"
></div>


<div class="acciones">

<a
    href="nuevo-cliente.html"
    class="boton boton-nuevo"
>
+ NUEVO CLIENTE
</a>


<button
    type="button"
    id="btnActualizar"
    class="boton boton-actualizar"
>
🔄 ACTUALIZAR
</button>

</div>


<input
    id="buscador"
    class="buscador"
    type="search"
    placeholder="🔎 Buscar cliente..."
    autocomplete="off"
>


<div
    id="cargando"
    class="cargando"
>
Cargando clientes...
</div>


<div
    id="lista"
    class="lista"
></div>


<div
    id="sinClientes"
    class="sin-clientes"
>
Todavía no tenés clientes registrados.
</div>


<div
    id="sinBusqueda"
    class="sin-busqueda"
>
No se encontraron clientes.
</div>


<a
    href="index.html"
    class="boton boton-volver"
>
⬅️ VOLVER A GESBASE
</a>


</main>

</div>


<script type="module">

// ============================================================
// GESBASE - CLIENTES
// ============================================================
// IMPORTANTE:
//
// Usamos EXACTAMENTE el firebase.js existente:
//
// ./Js/firebase.js
//
// No inicializamos Firebase nuevamente aquí.
// ============================================================


import {
    auth,
    db
} from "./Js/firebase.js";


import {
    onAuthStateChanged
} from "https://www.gstatic.com/firebasejs/12.18.0/firebase-auth.js";


import {
    collection,
    query,
    where,
    getDocs,
    doc,
    getDoc,
    deleteDoc
} from "https://www.gstatic.com/firebasejs/12.18.0/firebase-firestore.js";


// ============================================================
// ELEMENTOS
// ============================================================

const usuarioElemento =
    document.getElementById("usuario");

const errorElemento =
    document.getElementById("error");

const exitoElemento =
    document.getElementById("exito");

const cargando =
    document.getElementById("cargando");

const lista =
    document.getElementById("lista");

const sinClientes =
    document.getElementById("sinClientes");

const sinBusqueda =
    document.getElementById("sinBusqueda");

const buscador =
    document.getElementById("buscador");

const btnActualizar =
    document.getElementById("btnActualizar");


// ============================================================
// VARIABLES
// ============================================================

let usuarioActual = null;

let clientes = [];


// ============================================================
// ESCAPAR HTML
// ============================================================

function escaparHTML(valor){

    const div =
        document.createElement("div");

    div.textContent =
        valor == null
        ? ""
        : String(valor);

    return div.innerHTML;
}


// ============================================================
// MOSTRAR ERROR
// ============================================================

function mostrarError(mensaje){

    errorElemento.textContent =
        mensaje;

    errorElemento.style.display =
        "block";

}


// ============================================================
// OCULTAR ERROR
// ============================================================

function ocultarError(){

    errorElemento.textContent =
        "";

    errorElemento.style.display =
        "none";

}


// ============================================================
// MOSTRAR ÉXITO
// ============================================================

function mostrarExito(mensaje){

    exitoElemento.textContent =
        mensaje;

    exitoElemento.style.display =
        "block";

    setTimeout(
        function(){

            exitoElemento.style.display =
                "none";

        },
        3000
    );

}


// ============================================================
// NORMALIZAR VALOR
// ============================================================

function valorTexto(valor){

    if(
        valor === null ||
        valor === undefined
    ){

        return "";

    }

    return String(valor);

}


// ============================================================
// CREAR TARJETA
// ============================================================

function crearTarjeta(datos,id){

    const tarjeta =
        document.createElement("div");

    tarjeta.className =
        "cliente";


    const nombre =
        escaparHTML(
            datos.nombre ||
            datos.empresa ||
            "Cliente sin nombre"
        );


    const empresa =
        escaparHTML(
            datos.empresa ||
            ""
        );


    const cuit =
        escaparHTML(
            datos.cuit ||
            "-"
        );


    const telefono =
        escaparHTML(
            datos.telefono ||
            "-"
        );


    const email =
        escaparHTML(
            datos.email ||
            "-"
        );


    const direccion =
        escaparHTML(
            datos.direccion ||
            "-"
        );


    const localidad =
        valorTexto(
            datos.localidad
        );


    const provincia =
        valorTexto(
            datos.provincia
        );


    const observaciones =
        escaparHTML(
            datos.observaciones ||
            ""
        );


    let ubicacion = "-";


    if(
        localidad ||
        provincia
    ){

        ubicacion =
            escaparHTML(
                localidad
            );


        if(
            localidad &&
            provincia
        ){

            ubicacion +=
                ", ";

        }


        ubicacion +=
            escaparHTML(
                provincia
            );

    }


    let html = "";


    html += `
        <div class="cliente-nombre">
            ${nombre}
        </div>
    `;


    if(
        empresa &&
        empresa !== nombre
    ){

        html += `
            <div class="dato">
                🏢 Empresa: ${empresa}
            </div>
        `;

    }


    html += `
        <div class="dato">
            🧾 CUIT: ${cuit}
        </div>

        <div class="dato">
            📞 Teléfono: ${telefono}
        </div>

        <div class="dato">
            📧 Email: ${email}
        </div>

        <div class="dato">
            📍 Dirección: ${direccion}
        </div>

        <div class="dato">
            🗺️ Localidad: ${ubicacion}
        </div>
    `;


    if(observaciones){

        html += `
            <div class="observaciones">
                📝 ${observaciones}
            </div>
        `;

    }


    html += `
        <a
            class="boton boton-ver"
            href="ver-cliente.html?id=${encodeURIComponent(id)}"
        >
            👤 VER CLIENTE
        </a>

        <a
            class="boton boton-editar"
            href="editar-cliente.html?id=${encodeURIComponent(id)}"
        >
            ✏️ EDITAR CLIENTE
        </a>

        <button
            type="button"
            class="boton boton-eliminar"
        >
            🗑️ ELIMINAR CLIENTE
        </button>
    `;


    tarjeta.innerHTML =
        html;


    const botonEliminar =
        tarjeta.querySelector(
            ".boton-eliminar"
        );


    botonEliminar.addEventListener(
        "click",
        function(){

            eliminarCliente(id);

        }
    );


    return tarjeta;

}


// ============================================================
// MOSTRAR CLIENTES
// ============================================================

function mostrarClientes(){

    lista.innerHTML =
        "";

    sinBusqueda.style.display =
        "none";


    const termino =
        buscador.value
            .trim()
            .toLowerCase();


    let filtrados =
        clientes;


    if(termino){

        filtrados =
            clientes.filter(
                function(item){

                    const datos =
                        item.datos;


                    const campos = [

                        datos.nombre,
                        datos.empresa,
                        datos.cuit,
                        datos.telefono,
                        datos.email,
                        datos.direccion,
                        datos.localidad,
                        datos.provincia

                    ];


                    return campos.some(
                        function(valor){

                            return String(
                                valor || ""
                            )
                            .toLowerCase()
                            .includes(
                                termino
                            );

                        }
                    );

                }
            );

    }


    if(
        filtrados.length === 0
    ){

        if(
            clientes.length > 0
        ){

            sinBusqueda.style.display =
                "block";

        }

        return;

    }


    filtrados.forEach(
        function(item){

            lista.appendChild(
                crearTarjeta(
                    item.datos,
                    item.id
                )
            );

        }
    );

}


// ============================================================
// CARGAR CLIENTES
// ============================================================

async function cargarClientes(){

    if(!usuarioActual){

        return;

    }


    try{

        ocultarError();


        cargando.style.display =
            "block";


        lista.innerHTML =
            "";


        sinClientes.style.display =
            "none";


        sinBusqueda.style.display =
            "none";


        usuarioElemento.textContent =
            "Usuario: " +
            (
                usuarioActual.email ||
                "Usuario autenticado"
            );


        // ====================================================
        // COLECCIÓN CLIENTES
        // ====================================================

        const referenciaClientes =
            collection(
                db,
                "clientes"
            );


        // ====================================================
        // SOLO CLIENTES DEL USUARIO ACTUAL
        // ====================================================

        const consulta =
            query(
                referenciaClientes,
                where(
                    "uid",
                    "==",
                    usuarioActual.uid
                )
            );


        const resultado =
            await getDocs(
                consulta
            );


        clientes =
            [];


        resultado.forEach(
            function(documento){

                clientes.push({

                    id:
                        documento.id,

                    datos:
                        documento.data()

                });

            }
        );


        // ====================================================
        // ORDENAR
        // ====================================================

        clientes.sort(
            function(a,b){

                const nombreA =
                    String(
                        a.datos.nombre ||
                        a.datos.empresa ||
                        ""
                    ).toLowerCase();


                const nombreB =
                    String(
                        b.datos.nombre ||
                        b.datos.empresa ||
                        ""
                    ).toLowerCase();


                return nombreA.localeCompare(
                    nombreB,
                    "es"
                );

            }
        );


        cargando.style.display =
            "none";


        if(
            clientes.length === 0
        ){

            sinClientes.style.display =
                "block";

            return;

        }


        mostrarClientes();

    }
    catch(error){

        console.error(
            "GESBASE - Error cargando clientes:",
            error
        );


        cargando.style.display =
            "none";


        mostrarError(
            "No se pudieron cargar los clientes: " +
            error.message
        );

    }

}


// ============================================================
// ELIMINAR CLIENTE
// ============================================================

async function eliminarCliente(id){

    if(!usuarioActual){

        mostrarError(
            "No hay una sesión activa."
        );

        return;

    }


    const confirmar =
        window.confirm(
            "¿Seguro que querés eliminar este cliente?\n\nEsta acción no se puede deshacer."
        );


    if(!confirmar){

        return;

    }


    try{

        ocultarError();


        const referencia =
            doc(
                db,
                "clientes",
                id
            );


        const documento =
            await getDoc(
                referencia
            );


        if(
            !documento.exists()
        ){

            mostrarError(
                "El cliente ya no existe."
            );

            await cargarClientes();

            return;

        }


        const datos =
            documento.data();


        if(
            datos.uid !==
            usuarioActual.uid
        ){

            mostrarError(
                "No tenés permiso para eliminar este cliente."
            );

            return;

        }


        await deleteDoc(
            referencia
        );


        mostrarExito(
            "Cliente eliminado correctamente."
        );


        await cargarClientes();

    }
    catch(error){

        console.error(
            "GESBASE - Error eliminando cliente:",
            error
        );


        mostrarError(
            "No se pudo eliminar el cliente: " +
            error.message
        );

    }

}


// ============================================================
// BUSCADOR
// ============================================================

buscador.addEventListener(
    "input",
    function(){

        mostrarClientes();

    }
);


// ============================================================
// ACTUALIZAR
// ============================================================

btnActualizar.addEventListener(
    "click",
    async function(){

        if(!usuarioActual){

            mostrarError(
                "Esperá mientras se verifica la sesión."
            );

            return;

        }


        btnActualizar.disabled =
            true;


        btnActualizar.textContent =
            "⏳ CARGANDO...";


        await cargarClientes();


        btnActualizar.disabled =
            false;


        btnActualizar.textContent =
            "🔄 ACTUALIZAR";

    }
);


// ============================================================
// AUTENTICACIÓN
// ============================================================

onAuthStateChanged(
    auth,
    function(usuario){

        if(!usuario){

            window.location.replace(
                "login.html"
            );

            return;

        }


        usuarioActual =
            usuario;


        usuarioElemento.textContent =
            "Usuario: " +
            (
                usuario.email ||
                "Usuario autenticado"
            );


        cargarClientes();

    }
);

</script>

</body>

</html>
