<!DOCTYPE html>
<html lang="es">

<head>

<meta charset="UTF-8">

<meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
>

<meta
    name="theme-color"
    content="#111827"
>

<meta
    name="description"
    content="GESBASE - Clientes"
>

<title>Clientes - GESBASE</title>

<style>

*{
    box-sizing:border-box;
    margin:0;
    padding:0;
}

body{
    font-family:Arial,Helvetica,sans-serif;
    background:#f3f4f6;
    color:#111827;
}

.contenedor{
    width:100%;
    max-width:700px;
    margin:auto;
    min-height:100vh;
    background:white;
}

header{
    background:#111827;
    color:white;
    padding:25px 20px;
}

header h1{
    font-size:25px;
}

header p{
    margin-top:6px;
    color:#d1d5db;
    font-size:14px;
}

main{
    padding:20px;
}


/* ==========================================
   USUARIO
========================================== */

.usuario{
    background:#f3f4f6;
    padding:13px;
    border-radius:10px;
    margin-bottom:15px;
    font-size:14px;
}


/* ==========================================
   ACCIONES
========================================== */

.acciones{
    display:flex;
    gap:10px;
    margin-bottom:15px;
}

.boton-nuevo,
.boton-actualizar{
    flex:1;
    padding:14px;
    border-radius:10px;
    font-size:15px;
    font-weight:bold;
    text-align:center;
    cursor:pointer;
}

.boton-nuevo{
    background:#111827;
    color:white;
    text-decoration:none;
}

.boton-actualizar{
    background:#374151;
    color:white;
    border:none;
}

.boton-nuevo:hover{
    background:#1f2937;
}

.boton-actualizar:hover{
    background:#1f2937;
}

.boton-actualizar:disabled{
    opacity:.6;
    cursor:not-allowed;
}


/* ==========================================
   BUSCADOR
========================================== */

.buscador{
    width:100%;
    padding:14px;
    border:1px solid #d1d5db;
    border-radius:10px;
    font-size:15px;
    margin-bottom:18px;
    outline:none;
    background:white;
}

.buscador:focus{
    border-color:#2563eb;
}


/* ==========================================
   CARGANDO
========================================== */

.cargando{
    text-align:center;
    padding:35px;
    color:#6b7280;
}


/* ==========================================
   LISTA
========================================== */

.lista{
    display:flex;
    flex-direction:column;
    gap:15px;
}


/* ==========================================
   CLIENTE
========================================== */

.cliente{
    border:1px solid #d1d5db;
    border-radius:14px;
    padding:18px;
    background:white;
    box-shadow:0 3px 10px rgba(0,0,0,.08);
}

.cliente-nombre{
    font-size:20px;
    font-weight:bold;
    margin-bottom:12px;
    word-break:break-word;
}

.dato{
    margin-top:7px;
    font-size:14px;
    color:#4b5563;
    line-height:1.4;
}

.observaciones{
    margin-top:10px;
    padding-top:10px;
    border-top:1px solid #e5e7eb;
    font-size:14px;
    line-height:1.5;
    color:#374151;
    white-space:pre-wrap;
}


/* ==========================================
   BOTONES CLIENTE
========================================== */

.boton{
    display:block;
    width:100%;
    margin-top:10px;
    padding:13px;
    border-radius:10px;
    text-align:center;
    text-decoration:none;
    font-size:15px;
    font-weight:bold;
    cursor:pointer;
}

.boton-ver{
    background:#111827;
    color:white;
}

.boton-ver:hover{
    background:#1f2937;
}

.boton-editar{
    background:#2563eb;
    color:white;
}

.boton-editar:hover{
    background:#1d4ed8;
}

.boton-eliminar{
    background:#fee2e2;
    color:#991b1b;
    border:1px solid #fecaca;
}

.boton-eliminar:hover{
    background:#fecaca;
}


/* ==========================================
   SIN CLIENTES
========================================== */

.sin-clientes{
    text-align:center;
    padding:35px 20px;
    color:#6b7280;
}

.sin-busqueda{
    display:none;
    text-align:center;
    padding:25px;
    color:#6b7280;
}


/* ==========================================
   ERROR
========================================== */

.error{
    display:none;
    background:#fee2e2;
    color:#991b1b;
    padding:14px;
    border-radius:10px;
    margin-bottom:15px;
    line-height:1.5;
}


/* ==========================================
   VOLVER
========================================== */

.boton-volver{
    display:block;
    width:100%;
    padding:15px;
    margin-top:20px;
    border-radius:10px;
    background:#e5e7eb;
    color:#111827;
    text-align:center;
    text-decoration:none;
    font-size:16px;
    font-weight:bold;
}

.boton-volver:hover{
    background:#d1d5db;
}


/* ==========================================
   MÓVIL
========================================== */

@media(max-width:480px){

    main{
        padding:15px;
    }

    .acciones{
        flex-direction:column;
    }

    .cliente{
        padding:16px;
    }

}

</style>

</head>


<body>


<div class="contenedor">


<header>

<h1>
Clientes
</h1>

<p>
GESBASE
</p>

</header>


<main>


<div
    id="usuario"
    class="usuario"
>
Verificando usuario...
</div>


<div
    id="error"
    class="error"
></div>


<div class="acciones">


<a
    href="nuevo-cliente.html"
    class="boton-nuevo"
>
+ NUEVO CLIENTE
</a>


<button
    type="button"
    id="btnActualizar"
    class="boton-actualizar"
>
🔄 ACTUALIZAR
</button>


</div>


<input
    type="search"
    id="buscador"
    class="buscador"
    placeholder="🔎 Buscar cliente..."
    autocomplete="off"
>


<div
    id="cargando"
    class="cargando"
>
Cargando clientes...
</div>


<div
    id="lista"
    class="lista"
></div>


<div
    id="sinClientes"
    class="sin-clientes"
    style="display:none;"
>
Todavía no tenés clientes registrados.
</div>


<div
    id="sinBusqueda"
    class="sin-busqueda"
>
No se encontraron clientes.
</div>


<a
    href="index.html"
    class="boton-volver"
>
⬅️ VOLVER A GESBASE
</a>


</main>

</div>


<script type="module">


// =====================================================
// FIREBASE
// MISMA VERSIÓN EN TODA LA APP: 12.18.0
// =====================================================

import {
    auth,
    db
} from "./Js/firebase.js";


import {
    onAuthStateChanged
} from "https://www.gstatic.com/firebasejs/12.18.0/firebase-auth.js";


import {
    collection,
    query,
    where,
    getDocs,
    doc,
    getDoc,
    deleteDoc
} from "https://www.gstatic.com/firebasejs/12.18.0/firebase-firestore.js";


// =====================================================
// ELEMENTOS
// =====================================================

const usuarioElemento =
document.getElementById("usuario");

const cargando =
document.getElementById("cargando");

const lista =
document.getElementById("lista");

const sinClientes =
document.getElementById("sinClientes");

const sinBusqueda =
document.getElementById("sinBusqueda");

const errorElemento =
document.getElementById("error");

const buscador =
document.getElementById("buscador");

const btnActualizar =
document.getElementById("btnActualizar");


// =====================================================
// VARIABLES
// =====================================================

let usuarioActual = null;

let clientes = [];


// =====================================================
// ESCAPAR HTML
// =====================================================

function escaparHTML(valor){

    const div =
    document.createElement("div");

    div.textContent =
    valor ?? "";

    return div.innerHTML;

}


// =====================================================
// MOSTRAR ERROR
// =====================================================

function mostrarError(mensaje){

    errorElemento.textContent =
    mensaje;

    errorElemento.style.display =
    "block";

}


// =====================================================
// OCULTAR ERROR
// =====================================================

function ocultarError(){

    errorElemento.textContent =
    "";

    errorElemento.style.display =
    "none";

}


// =====================================================
// ELIMINAR CLIENTE
// =====================================================

async function eliminarCliente(id){

    if(!usuarioActual){

        mostrarError(
            "No hay una sesión activa."
        );

        return;

    }


    const confirmar =
    window.confirm(
        "¿Seguro que querés eliminar este cliente?\n\nEsta acción no se puede deshacer."
    );


    if(!confirmar){

        return;

    }


    try{

        const referencia =
        doc(
            db,
            "clientes",
            id
        );


        const resultado =
        await getDoc(
            referencia
        );


        if(!resultado.exists()){

            alert(
                "El cliente ya no existe."
            );


            await cargarClientes();

            return;

        }


        const datos =
        resultado.data();


        /*
         * Seguridad adicional:
         * solamente se puede eliminar
         * un cliente perteneciente al
         * usuario actualmente autenticado.
         */

        if(
            datos.uid !==
            usuarioActual.uid
        ){

            alert(
                "No tenés permiso para eliminar este cliente."
            );

            return;

        }


        await deleteDoc(
            referencia
        );


        alert(
            "Cliente eliminado correctamente."
        );


        await cargarClientes();

    }
    catch(error){

        console.error(
            "Error eliminando cliente:",
            error
        );


        mostrarError(
            "No se pudo eliminar el cliente: " +
            error.message
        );

    }

}


// =====================================================
// CREAR TARJETA DE CLIENTE
// =====================================================

function crearTarjeta(
    datos,
    id
){

    const tarjeta =
    document.createElement("div");

    tarjeta.className =
    "cliente";


    const nombre =
    escaparHTML(
        datos.nombre ||
        datos.empresa ||
        "Cliente sin nombre"
    );


    const cuit =
    escaparHTML(
        datos.cuit ||
        "-"
    );


    const telefono =
    escaparHTML(
        datos.telefono ||
        "-"
    );


    const email =
    escaparHTML(
        datos.email ||
        "-"
    );


    const direccion =
    escaparHTML(
        datos.direccion ||
        "-"
    );


    const localidad =
    escaparHTML(
        datos.localidad ||
        ""
    );


    const provincia =
    escaparHTML(
        datos.provincia ||
        ""
    );


    const observaciones =
    escaparHTML(
        datos.observaciones ||
        ""
    );


    let ubicacion =
    "-";


    if(
        localidad ||
        provincia
    ){

        ubicacion =
        localidad +
        (
            localidad &&
            provincia
            ? ", "
            : ""
        ) +
        provincia;

    }


    tarjeta.innerHTML = `

        <div class="cliente-nombre">
            ${nombre}
        </div>


        <div class="dato">
            🧾 CUIT:
            ${cuit}
        </div>


        <div class="dato">
            📞 Teléfono:
            ${telefono}
        </div>


        <div class="dato">
            📧 Email:
            ${email}
        </div>


        <div class="dato">
            📍 Dirección:
            ${direccion}
        </div>


        <div class="dato">
            🗺️ Localidad:
            ${ubicacion}
        </div>


        ${
            observaciones
            ?
            `
            <div class="observaciones">
                📝 ${observaciones}
            </div>
            `
            :
            ""
        }


        <a
            href="ver-cliente.html?id=${encodeURIComponent(id)}"
            class="boton boton-ver"
        >
            👤 VER CLIENTE
        </a>


        <a
            href="editar-cliente.html?id=${encodeURIComponent(id)}"
            class="boton boton-editar"
        >
            ✏️ EDITAR CLIENTE
        </a>


        <button
            type="button"
            class="boton boton-eliminar"
        >
            🗑️ ELIMINAR CLIENTE
        </button>

    `;


    const botonEliminar =
    tarjeta.querySelector(
        ".boton-eliminar"
    );


    botonEliminar.addEventListener(
        "click",
        function(){

            eliminarCliente(id);

        }
    );


    return tarjeta;

}


// =====================================================
// MOSTRAR CLIENTES
// =====================================================

function mostrarClientes(){

    lista.innerHTML =
    "";

    sinBusqueda.style.display =
    "none";


    const termino =
    buscador.value
        .trim()
        .toLowerCase();


    let filtrados =
    clientes;


    if(termino){

        filtrados =
        clientes.filter(
            function(item){

                const datos =
                item.datos;


                const nombre =
                String(
                    datos.nombre ||
                    ""
                ).toLowerCase();


                const empresa =
                String(
                    datos.empresa ||
                    ""
                ).toLowerCase();


                const cuit =
                String(
                    datos.cuit ||
                    ""
                ).toLowerCase();


                const telefono =
                String(
                    datos.telefono ||
                    ""
                ).toLowerCase();


                const email =
                String(
                    datos.email ||
                    ""
                ).toLowerCase();


                const direccion =
                String(
                    datos.direccion ||
                    ""
                ).toLowerCase();


                const localidad =
                String(
                    datos.localidad ||
                    ""
                ).toLowerCase();


                return (
                    nombre.includes(termino) ||
                    empresa.includes(termino) ||
                    cuit.includes(termino) ||
                    telefono.includes(termino) ||
                    email.includes(termino) ||
                    direccion.includes(termino) ||
                    localidad.includes(termino)
                );

            }
        );

    }


    if(
        filtrados.length === 0
    ){

        if(
            clientes.length > 0
        ){

            sinBusqueda.style.display =
            "block";

        }

        return;

    }


    filtrados.forEach(
        function(item){

            lista.appendChild(
                crearTarjeta(
                    item.datos,
                    item.id
                )
            );

        }
    );

}


// =====================================================
// CARGAR CLIENTES
// =====================================================

async function cargarClientes(){

    if(!usuarioActual){

        return;

    }


    try{

        ocultarError();


        cargando.style.display =
        "block";


        lista.innerHTML =
        "";


        sinClientes.style.display =
        "none";


        sinBusqueda.style.display =
        "none";


        usuarioElemento.textContent =
        "Usuario: " +
        (
            usuarioActual.email ||
            "Usuario autenticado"
        );


        const referencia =
        collection(
            db,
            "clientes"
        );


        const consulta =
        query(
            referencia,
            where(
                "uid",
                "==",
                usuarioActual.uid
            )
        );


        const resultado =
        await getDocs(
            consulta
        );


        clientes =
        [];


        resultado.forEach(
            function(documento){

                clientes.push({

                    id:
                    documento.id,

                    datos:
                    documento.data()

                });

            }
        );


        // =================================================
        // ORDEN ALFABÉTICO
        // =================================================

        clientes.sort(
            function(a,b){

                const nombreA =
                String(
                    a.datos.nombre ||
                    a.datos.empresa ||
                    ""
                ).toLowerCase();


                const nombreB =
                String(
                    b.datos.nombre ||
                    b.datos.empresa ||
                    ""
                ).toLowerCase();


                return nombreA.localeCompare(
                    nombreB,
                    "es"
                );

            }
        );


        cargando.style.display =
        "none";


        if(
            clientes.length === 0
        ){

            sinClientes.style.display =
            "block";

            return;

        }


        mostrarClientes();

    }
    catch(error){

        console.error(
            "Error cargando clientes:",
            error
        );


        cargando.style.display =
        "none";


        mostrarError(
            "Error al cargar los clientes: " +
            error.message
        );

    }

}


// =====================================================
// BUSCADOR
// =====================================================

buscador.addEventListener(
    "input",
    function(){

        mostrarClientes();

    }
);


// =====================================================
// ACTUALIZAR
// =====================================================

btnActualizar.addEventListener(
    "click",
    async function(){

        if(!usuarioActual){

            mostrarError(
                "Esperá unos segundos mientras se verifica la sesión."
            );

            return;

        }


        btnActualizar.disabled =
        true;


        btnActualizar.textContent =
        "⏳ CARGANDO...";


        await cargarClientes();


        btnActualizar.disabled =
        false;


        btnActualizar.textContent =
        "🔄 ACTUALIZAR";

    }
);


// =====================================================
// AUTENTICACIÓN
// =====================================================

onAuthStateChanged(
    auth,
    function(usuario){

        if(!usuario){

            window.location.replace(
                "login.html"
            );

            return;

        }


        usuarioActual =
        usuario;


        usuarioElemento.textContent =
        "Usuario: " +
        (
            usuario.email ||
            "Usuario autenticado"
        );


        cargarClientes();

    }
);

</script>

</body>

</html>
