name: Compilar APK GESBASE

on:
  push:
    branches:
      - main
      - master

  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:

      # ============================================================
      # 1. DESCARGAR CÓDIGO
      # ============================================================
      - name: Descargar código
        uses: actions/checkout@v4


      # ============================================================
      # 2. CONFIGURAR NODE
      # ============================================================
      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20


      # ============================================================
      # 3. PREPARAR NODE Y CAPACITOR
      # ============================================================
      - name: Preparar proyecto Node
        run: |

          if [ ! -f package.json ]; then
            npm init -y
          fi

          npm install \
            @capacitor/core@8.5.2 \
            @capacitor/cli@8.5.2 \
            @capacitor/android@8.5.2 \
            @capacitor/app@8.5.2 \
            @capacitor/push-notifications@8.5.2

          echo "======================================"
          echo "CAPACITOR INSTALADO"
          echo "======================================"

          npm list @capacitor/core
          npm list @capacitor/android
          npm list @capacitor/app
          npm list @capacitor/push-notifications


      # ============================================================
      # 4. CREAR DIST
      # ============================================================
      - name: Preparar carpeta dist
        run: |

          rm -rf dist

          mkdir -p dist


      # ============================================================
      # 5. COPIAR ARCHIVOS WEB
      # ============================================================
      - name: Copiar archivos web a dist
        run: |

          echo "Copiando HTML..."

          find . \
            -maxdepth 1 \
            -type f \
            -name "*.html" \
            -exec cp {} dist/ \;


          echo "Copiando JavaScript..."

          find . \
            -maxdepth 1 \
            -type f \
            -name "*.js" \
            -exec cp {} dist/ \;


          echo "Copiando CSS..."

          find . \
            -maxdepth 1 \
            -type f \
            -name "*.css" \
            -exec cp {} dist/ \;


          echo "Copiando carpetas..."

          if [ -d "Js" ]; then
            cp -r Js dist/
          fi


          if [ -d "js" ]; then
            cp -r js dist/
          fi


          if [ -d "assets" ]; then
            cp -r assets dist/
          fi


          if [ -d "public" ]; then
            cp -r public dist/
          fi


          if [ -d "src" ]; then
            cp -r src dist/
          fi


          echo ""
          echo "Contenido de dist:"

          find dist \
            -maxdepth 2 \
            -type f \
            | sort


      # ============================================================
      # 6. CREAR CONTROLADOR GLOBAL DEL BOTÓN ATRÁS
      # ============================================================
      - name: Crear controlador de navegación Android
        run: |

          cat > dist/gesbase-back.js <<'EOF'

          (function () {

              "use strict";

              function iniciarBotonAtras() {

                  if (!window.Capacitor) {

                      console.log(
                          "GESBASE: Capacitor no disponible."
                      );

                      return;

                  }

                  const plugins =
                      window.Capacitor.Plugins || {};

                  const App = plugins.App;

                  if (!App) {

                      console.log(
                          "GESBASE: Plugin App no disponible."
                      );

                      return;

                  }

                  console.log(
                      "GESBASE: Control de botón atrás iniciado."
                  );


                  App.addListener(
                      "backButton",
                      function (event) {

                          console.log(
                              "GESBASE: Botón atrás presionado.",
                              event
                          );


                          /*
                           * Si Capacitor informa que existe
                           * historial, volvemos a la página
                           * anterior.
                           */

                          if (
                              event &&
                              event.canGoBack === true
                          ) {

                              window.history.back();

                              return;

                          }


                          /*
                           * Comprobación adicional del historial.
                           */

                          if (
                              window.history.length > 1
                          ) {

                              window.history.back();

                              return;

                          }


                          /*
                           * Si no hay historial, cerrar aplicación.
                           */

                          if (
                              typeof App.exitApp === "function"
                          ) {

                              App.exitApp();

                          }

                      }
                  );

              }


              if (
                  document.readyState === "loading"
              ) {

                  document.addEventListener(
                      "DOMContentLoaded",
                      iniciarBotonAtras
                  );

              } else {

                  iniciarBotonAtras();

              }

          })();

          EOF


          echo "Controlador creado."

          cat dist/gesbase-back.js


      # ============================================================
      # 7. ACTIVAR CONTROLADOR EN TODAS LAS PÁGINAS
      # ============================================================
      - name: Activar botón atrás en todas las páginas
        run: |

          echo "Insertando controlador de navegación..."

          for archivo in dist/*.html; do

            if grep -q "gesbase-back.js" "$archivo"; then

              echo "Ya instalado: $archivo"

              continue

            fi


            if grep -qi "</body>" "$archivo"; then

              sed -i \
                's#</body>#<script src="./gesbase-back.js"></script>\n</body>#I' \
                "$archivo"

              echo "Activado: $archivo"

            else

              echo '<script src="./gesbase-back.js"></script>' \
                >> "$archivo"

              echo "Activado al final: $archivo"

            fi

          done


          echo ""
          echo "Verificando instalación..."

          grep -Rl \
            "gesbase-back.js" \
            dist/*.html \
            | sort


      # ============================================================
      # 8. VERIFICAR ARCHIVOS PRINCIPALES
      # ============================================================
      - name: Verificar archivos principales
        run: |

          echo "Verificando GESBASE..."


          if [ ! -f dist/index.html ]; then
            echo "ERROR: No existe index.html"
            exit 1
          fi


          if [ ! -f dist/login.html ]; then
            echo "ERROR: No existe login.html"
            exit 1
          fi


          if [ ! -f dist/Js/firebase.js ]; then
            echo "ERROR: No existe Js/firebase.js"
            exit 1
          fi


          if [ ! -f dist/gesbase-back.js ]; then
            echo "ERROR: No existe gesbase-back.js"
            exit 1
          fi


          echo "--------------------------------"
          echo "index.html .......... OK"
          echo "login.html .......... OK"
          echo "Js/firebase.js ...... OK"
          echo "gesbase-back.js ..... OK"
          echo "--------------------------------"


      # ============================================================
      # 9. CONFIGURAR CAPACITOR
      # ============================================================
      - name: Configurar Capacitor
        run: |

          cat > capacitor.config.json <<'EOF'
          {
            "appId": "com.gesbase.app",
            "appName": "GESBASE",
            "webDir": "dist",
            "bundledWebRuntime": false,
            "server": {
              "androidScheme": "https"
            }
          }
          EOF


      # ============================================================
      # 10. CREAR PLATAFORMA ANDROID
      # ============================================================
      - name: Crear plataforma Android
        run: |

          rm -rf android

          npx cap add android

          npx cap copy android

          npx cap sync android


      # ============================================================
      # 11. CONFIGURAR MAIN ACTIVITY
      # ============================================================
      - name: Configurar MainActivity
        run: |

          MAIN_ACTIVITY="android/app/src/main/java/com/gesbase/app/MainActivity.java"

          mkdir -p "$(dirname "$MAIN_ACTIVITY")"

          cat > "$MAIN_ACTIVITY" <<'EOF'
          package com.gesbase.app;

          import com.getcapacitor.BridgeActivity;

          public class MainActivity extends BridgeActivity {
          }
          EOF


          echo "======================================"
          echo "MAIN ACTIVITY CONFIGURADA"
          echo "======================================"

          cat "$MAIN_ACTIVITY"


      # ============================================================
      # 12. FIREBASE
      # ============================================================
      - name: Copiar google-services.json
        run: |

          if [ ! -f google-services.json ]; then

            echo "ERROR: Falta google-services.json"

            exit 1

          fi


          cp google-services.json \
            android/app/google-services.json


          echo "google-services.json copiado correctamente."


      # ============================================================
      # 13. GOOGLE SERVICES
      # ============================================================
      - name: Configurar Google Services
        run: |

          sed -i '/dependencies {/a\
              classpath "com.google.gms:google-services:4.4.2"' \
              android/build.gradle


          echo "" >> android/app/build.gradle

          echo 'apply plugin: "com.google.gms.google-services"' \
            >> android/app/build.gradle


      # ============================================================
      # 14. PERMISOS ANDROID
      # ============================================================
      - name: Configurar permisos Android
        run: |

          MANIFEST="android/app/src/main/AndroidManifest.xml"


          if ! grep -q \
            "android.permission.INTERNET" \
            "$MANIFEST"; then

            sed -i '/<manifest/a\
              <uses-permission android:name="android.permission.INTERNET" />' \
              "$MANIFEST"

          fi


          if ! grep -q \
            "android.permission.POST_NOTIFICATIONS" \
            "$MANIFEST"; then

            sed -i '/<manifest/a\
              <uses-permission android:name="android.permission.POST_NOTIFICATIONS" />' \
              "$MANIFEST"

          fi


      # ============================================================
      # 15. JAVA 21
      # ============================================================
      - name: Configurar Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: gradle


      # ============================================================
      # 16. SINCRONIZAR CAPACITOR
      # ============================================================
      - name: Sincronizar Capacitor
        run: |

          npx cap sync android


      # ============================================================
      # 17. VERIFICAR SISTEMA DE NAVEGACIÓN
      # ============================================================
      - name: Verificar botón atrás
        run: |

          echo "======================================"
          echo "VERIFICACIÓN NAVEGACIÓN GESBASE"
          echo "======================================"

          echo ""
          echo "Capacitor Core:"
          npm list @capacitor/core

          echo ""
          echo "Capacitor Android:"
          npm list @capacitor/android

          echo ""
          echo "Capacitor App:"
          npm list @capacitor/app

          echo ""
          echo "Push Notifications:"
          npm list @capacitor/push-notifications

          echo ""
          echo "Controlador:"
          test -f dist/gesbase-back.js

          echo ""
          echo "MainActivity:"
          cat android/app/src/main/java/com/gesbase/app/MainActivity.java

          echo ""
          echo "======================================"
          echo "NAVEGACIÓN VERIFICADA"
          echo "======================================"


      # ============================================================
      # 18. COMPILAR APK
      # ============================================================
      - name: Compilar APK Debug
        run: |

          cd android

          chmod +x gradlew

          ./gradlew assembleDebug --no-daemon


      # ============================================================
      # 19. COMPROBAR APK
      # ============================================================
      - name: Verificar APK generado
        run: |

          APK="android/app/build/outputs/apk/debug/app-debug.apk"


          if [ ! -f "$APK" ]; then

            echo "ERROR: No se generó el APK."

            exit 1

          fi


          echo "======================================"
          echo "APK GESBASE GENERADO CORRECTAMENTE"
          echo "======================================"

          ls -lh "$APK"


      # ============================================================
      # 20. GUARDAR APK
      # ============================================================
      - name: Guardar APK
        uses: actions/upload-artifact@v4
        with:
          name: gesbase-app-debug
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
