name: Compilar APK GESBASE

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Descargar código
        uses: actions/checkout@v4

      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Preparar entorno Node y Capacitor
        run: |
          # 1. Crear package.json si no existe
          if [ ! -f package.json ]; then
            npm init -y
          fi

          # 2. Instalar Capacitor y el plugin de Android
          npm install @capacitor/core @capacitor/cli @capacitor/android

          # 3. Inicializar capacitor.config.json si no existe
          if [ ! -f capacitor.config.json ] && [ ! -f capacitor.config.ts ]; then
            npx cap init "GESBASE" "com.gesbase.app" --web-dir "www"
          fi

      - name: Reconstruir plataforma Android
        run: |
          mkdir -p www
          rm -rf android
          npx cap add android
          npx cap sync android

      - name: Configurar Java
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Compilar APK en Android
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Guardar APK
        uses: actions/upload-artifact@v4
        with:
          name: gesbase-app-debug
          path: android/app/build/outputs/apk/debug/app-debug.apk
