name: Compilar APK GESBASE

on:
  push:
    branches:
      - main
      - master

  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:

      # ============================================================
      # 1. DESCARGAR GESBASE
      # ============================================================
      - name: Descargar código
        uses: actions/checkout@v4


      # ============================================================
      # 2. CONFIGURAR NODE
      # ============================================================
      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20


      # ============================================================
      # 3. PREPARAR NODE Y CAPACITOR
      # ============================================================
      - name: Preparar proyecto Node
        run: |

          if [ ! -f package.json ]; then
            npm init -y
          fi

          npm install \
            @capacitor/core \
            @capacitor/cli \
            @capacitor/android \
            @capacitor/push-notifications

          echo "Node y Capacitor instalados correctamente."


      # ============================================================
      # 4. CREAR DIST
      # ============================================================
      - name: Preparar carpeta dist
        run: |

          rm -rf dist

          mkdir -p dist


      # ============================================================
      # 5. COPIAR ARCHIVOS WEB
      # ============================================================
      - name: Copiar archivos web a dist
        run: |

          echo "Copiando HTML..."

          find . \
            -maxdepth 1 \
            -type f \
            -name "*.html" \
            -exec cp {} dist/ \;


          echo "Copiando JavaScript..."

          find . \
            -maxdepth 1 \
            -type f \
            -name "*.js" \
            -exec cp {} dist/ \;


          echo "Copiando CSS..."

          find . \
            -maxdepth 1 \
            -type f \
            -name "*.css" \
            -exec cp {} dist/ \;


          echo "Copiando carpetas..."

          if [ -d "Js" ]; then
            cp -r Js dist/
          fi


          if [ -d "js" ]; then
            cp -r js dist/
          fi


          if [ -d "assets" ]; then
            cp -r assets dist/
          fi


          if [ -d "public" ]; then
            cp -r public dist/
          fi


          if [ -d "src" ]; then
            cp -r src dist/
          fi


          echo ""
          echo "Contenido de dist:"

          find dist \
            -maxdepth 2 \
            -type f \
            | sort


      # ============================================================
      # 6. VERIFICAR ARCHIVOS IMPORTANTES
      # ============================================================
      - name: Verificar archivos principales
        run: |

          echo "Verificando GESBASE..."


          if [ ! -f dist/index.html ]; then
            echo "ERROR: No existe index.html"
            exit 1
          fi


          if [ ! -f dist/login.html ]; then
            echo "ERROR: No existe login.html"
            exit 1
          fi


          if [ ! -f dist/Js/firebase.js ]; then
            echo "ERROR: No existe Js/firebase.js"
            exit 1
          fi


          echo "--------------------------------"
          echo "index.html ........ OK"
          echo "login.html ......... OK"
          echo "Js/firebase.js ..... OK"
          echo "--------------------------------"


      # ============================================================
      # 7. CONFIGURAR CAPACITOR
      # ============================================================
      - name: Configurar Capacitor
        run: |

          cat > capacitor.config.json <<'EOF'
          {
            "appId": "com.gesbase.app",
            "appName": "GESBASE",
            "webDir": "dist",
            "bundledWebRuntime": false,
            "server": {
              "androidScheme": "https"
            }
          }
          EOF


      # ============================================================
      # 8. CREAR ANDROID
      # ============================================================
      - name: Crear plataforma Android
        run: |

          rm -rf android

          npx cap add android

          npx cap copy android

          npx cap sync android


      # ============================================================
      # 9. CONFIGURAR BOTON ATRAS DE ANDROID
      #
      # Si WebView tiene historial:
      #     vuelve a la página anterior.
      #
      # Si no tiene historial:
      #     Android continúa con el comportamiento normal.
      # ============================================================
      - name: Configurar boton atras Android
        run: |

          MAIN_ACTIVITY="android/app/src/main/java/com/gesbase/app/MainActivity.java"

          mkdir -p "$(dirname "$MAIN_ACTIVITY")"

          cat > "$MAIN_ACTIVITY" <<'EOF'
          package com.gesbase.app;

          import android.os.Bundle;

          import com.getcapacitor.BridgeActivity;

          public class MainActivity extends BridgeActivity {

              @Override
              public void onBackPressed() {

                  if (getBridge() != null &&
                      getBridge().getWebView() != null &&
                      getBridge().getWebView().canGoBack()) {

                      getBridge().getWebView().goBack();

                  } else {

                      super.onBackPressed();

                  }
              }
          }
          EOF

          echo "======================================"
          echo "BOTON ATRAS ANDROID CONFIGURADO"
          echo "======================================"

          cat "$MAIN_ACTIVITY"


      # ============================================================
      # 10. FIREBASE
      # ============================================================
      - name: Copiar google-services.json
        run: |

          if [ ! -f google-services.json ]; then

            echo "ERROR: Falta google-services.json"

            exit 1

          fi


          cp google-services.json \
            android/app/google-services.json


          echo "google-services.json copiado correctamente."


      # ============================================================
      # 11. GOOGLE SERVICES
      # ============================================================
      - name: Configurar Google Services
        run: |

          sed -i '/dependencies {/a\
              classpath "com.google.gms:google-services:4.4.2"' \
              android/build.gradle


          echo "" >> android/app/build.gradle

          echo 'apply plugin: "com.google.gms.google-services"' \
            >> android/app/build.gradle


      # ============================================================
      # 12. PERMISOS ANDROID
      # ============================================================
      - name: Configurar permisos Android
        run: |

          MANIFEST="android/app/src/main/AndroidManifest.xml"


          if ! grep -q \
            "android.permission.INTERNET" \
            "$MANIFEST"; then

            sed -i '/<manifest/a\
              <uses-permission android:name="android.permission.INTERNET" />' \
              "$MANIFEST"

          fi


          if ! grep -q \
            "android.permission.POST_NOTIFICATIONS" \
            "$MANIFEST"; then

            sed -i '/<manifest/a\
              <uses-permission android:name="android.permission.POST_NOTIFICATIONS" />' \
              "$MANIFEST"

          fi


      # ============================================================
      # 13. JAVA 21
      # ============================================================
      - name: Configurar Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: gradle


      # ============================================================
      # 14. SINCRONIZAR CAPACITOR
      # ============================================================
      - name: Sincronizar Capacitor
        run: |

          npx cap sync android


      # ============================================================
      # 15. VERIFICAR MAINACTIVITY
      # ============================================================
      - name: Verificar boton atras
        run: |

          MAIN_ACTIVITY="android/app/src/main/java/com/gesbase/app/MainActivity.java"

          if [ ! -f "$MAIN_ACTIVITY" ]; then

            echo "ERROR: No existe MainActivity.java"

            exit 1

          fi


          echo "MainActivity encontrada:"
          echo ""

          cat "$MAIN_ACTIVITY"


      # ============================================================
      # 16. COMPILAR APK
      # ============================================================
      - name: Compilar APK Debug
        run: |

          cd android

          chmod +x gradlew

          ./gradlew assembleDebug --no-daemon


      # ============================================================
      # 17. COMPROBAR APK
      # ============================================================
      - name: Verificar APK generado
        run: |

          APK="android/app/build/outputs/apk/debug/app-debug.apk"


          if [ ! -f "$APK" ]; then

            echo "ERROR: No se generó el APK."

            exit 1

          fi


          echo "======================================"
          echo "APK GESBASE GENERADO CORRECTAMENTE"
          echo "======================================"


          ls -lh "$APK"


      # ============================================================
      # 18. GUARDAR APK
      # ============================================================
      - name: Guardar APK
        uses: actions/upload-artifact@v4
        with:
          name: gesbase-app-debug
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
