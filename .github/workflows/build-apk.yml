name: Compilar APK GESBASE

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Descargar código
        uses: actions/checkout@v4

      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Preparar entorno Node e instalar Capacitor y FCM
        run: |
          if [ ! -f package.json ]; then
            npm init -y
          fi
          npm install @capacitor/core @capacitor/cli @capacitor/android @capacitor/push-notifications

          cat << 'EOF' > capacitor.config.json
          {
            "appId": "com.gesbase.app",
            "appName": "GESBASE",
            "webDir": "dist",
            "bundledWebRuntime": false
          }
          EOF

      - name: Empaquetar proyecto web en dist/
        run: |
          mkdir -p dist

          # Copiar contenido web al directorio dist/
          cp -r *.html dist/ 2>/dev/null || true
          cp -r *.js dist/ 2>/dev/null || true
          cp -r *.css dist/ 2>/dev/null || true
          cp -r *.json dist/ 2>/dev/null || true
          cp -r assets dist/ 2>/dev/null || true
          cp -r public dist/ 2>/dev/null || true
          cp -r src dist/ 2>/dev/null || true
          cp -r Js dist/ 2>/dev/null || true
          cp -r js dist/ 2>/dev/null || true

      - name: Reconstruir plataforma Android
        run: |
          rm -rf android
          npx cap add android
          npx cap copy android
          npx cap sync android

      - name: Injectar google-services.json desde GitHub Secrets
        env:
          GOOGLE_SERVICES_JSON: ${{ secrets.GOOGLE_SERVICES_JSON }}
        run: |
          if [ -n "$GOOGLE_SERVICES_JSON" ]; then
            echo "$GOOGLE_SERVICES_JSON" > android/app/google-services.json
            echo "google-services.json creado exitosamente."
          else
            echo "WARNING: No se encontró el secret GOOGLE_SERVICES_JSON."
          fi

      - name: Configurar Gradle para Firebase Cloud Messaging (google-services)
        run: |
          # 1. Agregar la dependencia del plugin en android/build.gradle
          sed -i '/dependencies {/a \        classpath "com.google.gms:google-services:4.4.0"' android/build.gradle

          # 2. Aplicar el plugin al final de android/app/build.gradle
          echo "apply plugin: 'com.google.gms.google-services'" >> android/app/build.gradle

          # 3. Permisos de red e Internet en AndroidManifest.xml
          sed -i 's/android:supportsRtl="true"/android:supportsRtl="true" android:usesCleartextTraffic="true"/' android/app/src/main/AndroidManifest.xml

      - name: Configurar Java 21 (Temurin)
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'
          cache: 'gradle'

      - name: Compilar APK en Android
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon

      - name: Guardar APK
        uses: actions/upload-artifact@v4
        with:
          name: gesbase-app-debug
          path: android/app/build/outputs/apk/debug/app-debug.apk
