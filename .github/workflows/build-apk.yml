name: Compilar APK GESBASE

on:
  push:
    branches:
      - main
      - master

  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:

      # =========================================================
      # 1. DESCARGAR CÓDIGO
      # =========================================================

      - name: Descargar código
        uses: actions/checkout@v4


      # =========================================================
      # 2. NODE 22
      # =========================================================

      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22


      # =========================================================
      # 3. VERIFICAR NODE
      # =========================================================

      - name: Verificar Node.js
        run: |
          echo "======================================"
          echo "VERSIONES"
          echo "======================================"

          node --version
          npm --version

          echo "======================================"


      # =========================================================
      # 4. INSTALAR CAPACITOR
      # =========================================================

      - name: Preparar proyecto Node
        run: |
          if [ ! -f package.json ]; then
            npm init -y
          fi

          npm install \
            @capacitor/core@8.5.2 \
            @capacitor/cli@8.5.2 \
            @capacitor/android@8.5.2 \
            @capacitor/app@8.1.2 \
            @capacitor/push-notifications@8.1.3

          echo ""
          echo "======================================"
          echo "CAPACITOR INSTALADO"
          echo "======================================"

          npm list @capacitor/core
          npm list @capacitor/android
          npm list @capacitor/app
          npm list @capacitor/push-notifications


      # =========================================================
      # 5. CREAR DIST
      # =========================================================

      - name: Preparar carpeta dist
        run: |
          rm -rf dist
          mkdir -p dist


      # =========================================================
      # 6. COPIAR ARCHIVOS WEB
      # =========================================================

      - name: Copiar archivos web
        run: |

          echo "Copiando HTML..."

          find . \
            -maxdepth 1 \
            -type f \
            -name "*.html" \
            -exec cp {} dist/ \;


          echo "Copiando JavaScript..."

          find . \
            -maxdepth 1 \
            -type f \
            -name "*.js" \
            -exec cp {} dist/ \;


          echo "Copiando CSS..."

          find . \
            -maxdepth 1 \
            -type f \
            -name "*.css" \
            -exec cp {} dist/ \;


          echo "Copiando carpetas..."


          if [ -d "Js" ]; then
            cp -r Js dist/
          fi


          if [ -d "js" ]; then
            cp -r js dist/
          fi


          if [ -d "assets" ]; then
            cp -r assets dist/
          fi


          if [ -d "public" ]; then
            cp -r public dist/
          fi


          if [ -d "src" ]; then
            cp -r src dist/
          fi


          echo ""
          echo "======================================"
          echo "CONTENIDO DE DIST"
          echo "======================================"

          find dist \
            -maxdepth 2 \
            -type f \
            | sort


      # =========================================================
      # 7. CONTROLADOR WEB DE RESPALDO
      # =========================================================

      - name: Crear controlador web de navegación
        run: |

          cat > dist/gesbase-back.js <<'EOF'

          (function () {

              "use strict";

              console.log(
                  "GESBASE: sistema de navegación cargado."
              );


              window.addEventListener(
                  "popstate",
                  function () {

                      console.log(
                          "GESBASE: navegación hacia atrás."
                      );

                  }
              );


          })();

          EOF


          echo "Controlador web creado."


      # =========================================================
      # 8. INSERTAR CONTROLADOR
      # =========================================================

      - name: Activar controlador web
        run: |

          for archivo in dist/*.html; do

            if grep -q "gesbase-back.js" "$archivo"; then
              continue
            fi


            if grep -qi "</body>" "$archivo"; then

              sed -i \
                's#</body>#<script src="./gesbase-back.js"></script>\n</body>#I' \
                "$archivo"

            else

              echo '<script src="./gesbase-back.js"></script>' \
                >> "$archivo"

            fi

          done


          echo "Controlador agregado a las páginas."


      # =========================================================
      # 9. VERIFICAR ARCHIVOS
      # =========================================================

      - name: Verificar archivos principales
        run: |

          echo "======================================"
          echo "VERIFICANDO GESBASE"
          echo "======================================"


          if [ ! -f dist/index.html ]; then
            echo "ERROR: falta index.html"
            exit 1
          fi


          if [ ! -f dist/login.html ]; then
            echo "ERROR: falta login.html"
            exit 1
          fi


          if [ ! -f dist/Js/firebase.js ]; then
            echo "ERROR: falta Js/firebase.js"
            exit 1
          fi


          if [ ! -f dist/gesbase-back.js ]; then
            echo "ERROR: falta gesbase-back.js"
            exit 1
          fi


          echo "index.html ............. OK"
          echo "login.html ............. OK"
          echo "Js/firebase.js ......... OK"
          echo "gesbase-back.js ........ OK"


      # =========================================================
      # 10. CONFIGURAR CAPACITOR
      # =========================================================

      - name: Configurar Capacitor
        run: |

          cat > capacitor.config.json <<'EOF'
          {
            "appId": "com.gesbase.app",
            "appName": "GESBASE",
            "webDir": "dist",
            "bundledWebRuntime": false,
            "server": {
              "androidScheme": "https"
            }
          }
          EOF


          echo "capacitor.config.json creado."


      # =========================================================
      # 11. CREAR ANDROID
      # =========================================================

      - name: Crear plataforma Android
        run: |

          rm -rf android

          npx cap add android

          npx cap copy android

          npx cap sync android


      # =========================================================
      # 12. MAIN ACTIVITY
      #
      # AQUÍ ESTÁ EL CAMBIO IMPORTANTE
      # =========================================================

      - name: Configurar MainActivity
        run: |

          MAIN_ACTIVITY="android/app/src/main/java/com/gesbase/app/MainActivity.java"


          mkdir -p "$(dirname "$MAIN_ACTIVITY")"


          cat > "$MAIN_ACTIVITY" <<'EOF'
          package com.gesbase.app;

          import android.os.Bundle;
          import android.webkit.WebView;

          import com.getcapacitor.BridgeActivity;

          public class MainActivity extends BridgeActivity {

              @Override
              public void onCreate(Bundle savedInstanceState) {
                  super.onCreate(savedInstanceState);
              }

              @Override
              public void onBackPressed() {

                  WebView webView = null;

                  try {
                      webView = this.bridge.getWebView();
                  } catch (Exception e) {
                      // Continuar con el comportamiento normal
                  }

                  if (webView != null && webView.canGoBack()) {

                      webView.goBack();

                  } else {

                      super.onBackPressed();

                  }
              }
          }
          EOF


          echo ""
          echo "======================================"
          echo "MAIN ACTIVITY"
          echo "======================================"

          cat "$MAIN_ACTIVITY"


      # =========================================================
      # 13. FIREBASE
      # =========================================================

      - name: Copiar google-services.json
        run: |

          if [ ! -f google-services.json ]; then

            echo "ERROR: falta google-services.json"

            exit 1

          fi


          cp google-services.json \
            android/app/google-services.json


          echo "google-services.json copiado."


      # =========================================================
      # 14. GOOGLE SERVICES
      # =========================================================

      - name: Configurar Google Services
        run: |

          if ! grep -q \
            'com.google.gms:google-services' \
            android/build.gradle; then

            sed -i '/dependencies {/a\
                classpath "com.google.gms:google-services:4.4.2"' \
                android/build.gradle

          fi


          if ! grep -q \
            'com.google.gms.google-services' \
            android/app/build.gradle; then

            echo "" >> android/app/build.gradle

            echo 'apply plugin: "com.google.gms.google-services"' \
              >> android/app/build.gradle

          fi


      # =========================================================
      # 15. PERMISOS ANDROID
      # =========================================================

      - name: Configurar permisos Android
        run: |

          MANIFEST="android/app/src/main/AndroidManifest.xml"


          if ! grep -q \
            "android.permission.INTERNET" \
            "$MANIFEST"; then

            sed -i '/<manifest/a\
              <uses-permission android:name="android.permission.INTERNET" />' \
              "$MANIFEST"

          fi


          if ! grep -q \
            "android.permission.POST_NOTIFICATIONS" \
            "$MANIFEST"; then

            sed -i '/<manifest/a\
              <uses-permission android:name="android.permission.POST_NOTIFICATIONS" />' \
              "$MANIFEST"

          fi


      # =========================================================
      # 16. JAVA 21
      # =========================================================

      - name: Configurar Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: gradle


      # =========================================================
      # 17. SINCRONIZAR CAPACITOR
      # =========================================================

      - name: Sincronizar Capacitor
        run: |

          npx cap sync android


      # =========================================================
      # 18. VERIFICACIÓN FINAL
      # =========================================================

      - name: Verificar sistema
        run: |

          echo ""
          echo "======================================"
          echo "VERIFICACIÓN FINAL"
          echo "======================================"


          echo ""
          echo "NODE:"
          node --version


          echo ""
          echo "NPM:"
          npm --version


          echo ""
          echo "CAPACITOR:"
          npm list @capacitor/core
          npm list @capacitor/android
          npm list @capacitor/app


          echo ""
          echo "MAIN ACTIVITY:"
          cat android/app/src/main/java/com/gesbase/app/MainActivity.java


          echo ""
          echo "CONTROLADOR WEB:"
          test -f dist/gesbase-back.js


          echo ""
          echo "======================================"
          echo "SISTEMA LISTO"
          echo "======================================"


      # =========================================================
      # 19. COMPILAR APK
      # =========================================================

      - name: Compilar APK Debug
        run: |

          cd android

          chmod +x gradlew

          ./gradlew assembleDebug --no-daemon


      # =========================================================
      # 20. VERIFICAR APK
      # =========================================================

      - name: Verificar APK generado
        run: |

          APK="android/app/build/outputs/apk/debug/app-debug.apk"


          if [ ! -f "$APK" ]; then

            echo "ERROR: no se generó el APK."

            exit 1

          fi


          echo ""
          echo "======================================"
          echo "APK GESBASE GENERADO"
          echo "======================================"


          ls -lh "$APK"


      # =========================================================
      # 21. GUARDAR APK
      # =========================================================

      - name: Guardar APK
        uses: actions/upload-artifact@v4
        with:
          name: gesbase-app-debug
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
