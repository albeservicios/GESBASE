name: Compilar APK GESBASE

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Descargar código
        uses: actions/checkout@v4

      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Preparar entorno Node y Capacitor
        run: |
          if [ ! -f package.json ]; then
            npm init -y
          fi
          npm install @capacitor/core @capacitor/cli @capacitor/android

          if [ ! -f capacitor.config.json ] && [ ! -f capacitor.config.ts ]; then
            npx cap init "GESBASE" "com.gesbase.app" --web-dir "www"
          fi

      - name: Preparar carpeta web y assets
        run: |
          npm run build || true
          mkdir -p www

          if [ -f index.html ]; then
            cp -r index.html www/
            cp -r *.js www/ 2>/dev/null || true
            cp -r *.css www/ 2>/dev/null || true
            cp -r *.json www/ 2>/dev/null || true
            cp -r assets www/ 2>/dev/null || true
            cp -r src www/ 2>/dev/null || true
          fi

          if [ ! -f www/index.html ]; then
            echo '<!DOCTYPE html><html><head><title>GESBASE</title></head><body><h1>GESBASE App</h1></body></html>' > www/index.html
          fi

      - name: Reconstruir plataforma Android
        run: |
          rm -rf android
          npx cap add android
          npx cap copy android
          npx cap sync android

      - name: Configurar Java 21
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '21'

      - name: Compilar APK en Android
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Guardar APK
        uses: actions/upload-artifact@v4
        with:
          name: gesbase-app-debug
          path: android/app/build/outputs/apk/debug/app-debug.apk
