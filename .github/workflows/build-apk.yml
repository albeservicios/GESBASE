name: Compilar APK GESBASE

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Descargar código
        uses: actions/checkout@v4

      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Preparar entorno Node e instalar Capacitor
        run: |
          if [ ! -f package.json ]; then
            npm init -y
          fi
          npm install @capacitor/core @capacitor/cli @capacitor/android

          cat << 'EOF' > capacitor.config.json
          {
            "appId": "com.gesbase.app",
            "appName": "GESBASE",
            "webDir": "dist",
            "bundledWebRuntime": false
          }
          EOF

      - name: Empaquetar proyecto web en dist/
        run: |
          mkdir -p dist

          # Copiar todo el contenido web del repositorio a dist/
          cp -r *.html dist/ 2>/dev/null || true
          cp -r *.js dist/ 2>/dev/null || true
          cp -r *.css dist/ 2>/dev/null || true
          cp -r *.json dist/ 2>/dev/null || true
          cp -r assets dist/ 2>/dev/null || true
          cp -r public dist/ 2>/dev/null || true
          cp -r src dist/ 2>/dev/null || true
          cp -r Js dist/ 2>/dev/null || true
          cp -r js dist/ 2>/dev/null || true

          # Insertar manejador de errores de inicio en index.html
          if [ -f dist/index.html ]; then
            sed -i 's/<head>/<head><script>window.onerror=function(m,u,l){alert("Error JS: "+m+" en linea "+l);};setTimeout(function(){var c=document.getElementById("cargando");if(c\&!c.classList.contains("oculto")){c.innerHTML="<div style=\"padding:20px;text-align:center;\"><h3>No se pudo conectar con Firebase<\/h3><p>Verifica tu conexion a internet<\/p><button onclick=\"location.reload()\" style=\"padding:10px 15px;\">Reintentar<\/button><\/div>";}},5000);<\/script>/' dist/index.html
          fi

      - name: Reconstruir plataforma Android
        run: |
          rm -rf android
          npx cap add android
          npx cap copy android
          npx cap sync android

      - name: Configurar Permisos y Nombre en Android
        run: |
          sed -i 's/<string name="app_name">.*<\/string>/<string name="app_name">GESBASE<\/string>/' android/app/src/main/res/values/strings.xml
          sed -i 's/<string name="title_activity_main">.*<\/string>/<string name="title_activity_main">GESBASE<\/string>/' android/app/src/main/res/values/strings.xml

          # Permitir tráfico HTTP / Firebase
          sed -i 's/android:supportsRtl="true"/android:supportsRtl="true" android:usesCleartextTraffic="true"/' android/app/src/main/AndroidManifest.xml

          cat << 'EOF' >> android/build.gradle

          allprojects {
              configurations.all {
                  resolutionStrategy.eachDependency { DependencyResolveDetails details ->
                      def requested = details.requested
                      if (requested.group == 'org.jetbrains.kotlin') {
                          if (requested.name == 'kotlin-stdlib-jdk7' || requested.name == 'kotlin-stdlib-jdk8') {
                              details.useTarget "org.jetbrains.kotlin:kotlin-stdlib:${requested.version}"
                          }
                      }
                  }
              }
          }
          EOF

      - name: Configurar Java 21 (Temurin)
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'
          cache: 'gradle'

      - name: Compilar APK en Android
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon

      - name: Guardar APK
        uses: actions/upload-artifact@v4
        with:
          name: gesbase-app-debug
          path: android/app/build/outputs/apk/debug/app-debug.apk
