name: Compilar APK GESBASE

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Descargar código
        uses: actions/checkout@v4

      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Instalar dependencias e inicializar Capacitor
        run: |
          npm install
          npm install @capacitor/core @capacitor/cli @capacitor/android

          if [ ! -f capacitor.config.json ] && [ ! -f capacitor.config.ts ]; then
            npx cap init "GESBASE" "com.gesbase.app" --web-dir "dist"
          fi

      - name: Compilar proyecto Vite/React
        run: |
          npm run build || true

          # Si Vite compila en dist, asegurarnos de que existan los archivos web
          if [ ! -d "dist" ]; then
            mkdir -p dist
            cp -r *.html *.js *.css assets dist/ 2>/dev/null || true
          fi

      - name: Reconstruir plataforma Android
        run: |
          rm -rf android
          npx cap add android
          npx cap copy android
          npx cap sync android

      - name: Permitir tráfico de red y ajustar dependencias de Kotlin
        run: |
          # Permitir HTTP / APIs en la app nativa
          sed -i 's/android:supportsRtl="true"/android:supportsRtl="true" android:usesCleartextTraffic="true"/' android/app/src/main/AndroidManifest.xml

          cat << 'EOF' >> android/build.gradle

          allprojects {
              configurations.all {
                  resolutionStrategy.eachDependency { DependencyResolveDetails details ->
                      def requested = details.requested
                      if (requested.group == 'org.jetbrains.kotlin') {
                          if (requested.name == 'kotlin-stdlib-jdk7' || requested.name == 'kotlin-stdlib-jdk8') {
                              details.useTarget "org.jetbrains.kotlin:kotlin-stdlib:${requested.version}"
                          }
                      }
                  }
              }
          }
          EOF

      - name: Configurar Java 21
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '21'

      - name: Compilar APK en Android
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon

      - name: Guardar APK
        uses: actions/upload-artifact@v4
        with:
          name: gesbase-app-debug
          path: android/app/build/outputs/apk/debug/app-debug.apk
