
name: Compilar APK GESBASE - Gestión y Empleados

on:
  push:
    branches:
      - main
      - master
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: GESBASE ${{ matrix.nombre }}
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        include:
          - app: gestion
            nombre: Gestión
            appId: com.gesbase.gestion
            appName: GESBASE Gestión
            inicio: login.html
            artifact: gesbase-gestion-apk-debug
            gps: false

          - app: empleados
            nombre: Empleados
            appId: com.gesbase.app
            appName: GESBASE Empleados
            inicio: empleado-login.html
            artifact: gesbase-empleado-apk-debug
            gps: true

    steps:
      # 1. DESCARGAR REPOSITORIO
      - name: Descargar código
        uses: actions/checkout@v4

      # 2. NODE
      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      # 3. JAVA
      - name: Configurar Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      # 4. PREPARAR ARCHIVOS WEB
      - name: Preparar archivos web
        shell: bash
        run: |
          set -e

          APP_DIR="build-apks/${{ matrix.app }}"
          WEB_DIR="$APP_DIR/www"

          mkdir -p "$WEB_DIR"

          find . -maxdepth 1 -type f \
            \( -name "*.html" -o -name "*.js" -o -name "*.css" \) \
            -exec cp {} "$WEB_DIR/" \;

          for carpeta in Js js assets public src empleado empleados Empleado Empleados images img css; do
            if [ -d "$carpeta" ]; then
              cp -R "$carpeta" "$WEB_DIR/"
            fi
          done

          echo "Archivos preparados:"
          find "$WEB_DIR" -maxdepth 3 -type f | sort

      # 5. VERIFICAR PANTALLA INICIAL
      - name: Verificar pantalla inicial
        shell: bash
        run: |
          set -e

          WEB_DIR="build-apks/${{ matrix.app }}/www"
          TARGET="${{ matrix.inicio }}"

          if [ ! -f "$WEB_DIR/$TARGET" ]; then
            echo "ERROR: No se encontró $TARGET"
            exit 1
          fi

          echo "Pantalla inicial encontrada: $TARGET"

      # 6. CONFIGURAR CONEXIÓN API
      - name: Configurar conexión al servidor
        shell: bash
        run: |
          set -e

          WEB_DIR="build-apks/${{ matrix.app }}/www"

          python3 - "$WEB_DIR" <<'PY'
          import sys
          from pathlib import Path

          web = Path(sys.argv[1])

          posibles = [
              web / "Js/local/shared.js",
              web / "js/local/shared.js",
              web / "JS/local/shared.js"
          ]

          archivo = next((p for p in posibles if p.is_file()), None)

          if archivo:
              codigo = archivo.read_text(encoding="utf-8")

              codigo = codigo.replace(
                  'fetch(path, {',
                  'fetch(new URL(path, "https://gesbase.online").href, {'
              )

              codigo = codigo.replace(
                  'return `${proto}//${location.host}/ws${q}`;',
                  'return `wss://gesbase.online/ws${q}`;',
                  1
              )

              archivo.write_text(codigo, encoding="utf-8")
              print("Conexión API preparada.")
          else:
              print("AVISO: shared.js no encontrado.")
          PY

      # 7. CONFIGURAR INDEX
      - name: Configurar inicio de aplicación
        shell: bash
        run: |
          set -e

          WEB_DIR="build-apks/${{ matrix.app }}/www"
          TARGET="${{ matrix.inicio }}"

          cat > "$WEB_DIR/index.html" <<EOF
          <!DOCTYPE html>
          <html lang="es">
          <head>
            <meta charset="UTF-8">
            <meta name="viewport" content="width=device-width, initial-scale=1.0">
            <title>${{ matrix.appName }}</title>
            <script>
              window.location.replace("./$TARGET");
            </script>
          </head>
          <body>
            <p>Iniciando ${{ matrix.appName }}...</p>
          </body>
          </html>
          EOF

      # 8. INSTALAR CAPACITOR
      - name: Instalar Capacitor
        shell: bash
        run: |
          set -e

          APP_DIR="build-apks/${{ matrix.app }}"

          cd "$APP_DIR"

          npm init -y

          npm install \
            @capacitor/core@8.5.2 \
            @capacitor/cli@8.5.2 \
            @capacitor/android@8.5.2 \
            @capacitor/app@8.1.2

          if [ "${{ matrix.gps }}" = "true" ]; then
            npm install @capacitor/geolocation@^8.0.0
          fi

      # 9. CONFIGURAR CAPACITOR
      - name: Configurar aplicación Android
        shell: bash
        run: |
          set -e

          APP_DIR="build-apks/${{ matrix.app }}"

          cat > "$APP_DIR/capacitor.config.json" <<EOF
          {
            "appId": "${{ matrix.appId }}",
            "appName": "${{ matrix.appName }}",
            "webDir": "www",
            "server": {
              "androidScheme": "https"
            }
          }
          EOF

      # 10. CREAR ANDROID
      - name: Crear plataforma Android
        shell: bash
        run: |
          set -e

          APP_DIR="build-apks/${{ matrix.app }}"

          cd "$APP_DIR"

          npx cap add android
          npx cap sync android

      # 11. CONFIGURAR PERMISOS GENERALES
      - name: Configurar cámara y micrófono
        shell: bash
        run: |
          set -e

          MANIFEST="build-apks/${{ matrix.app }}/android/app/src/main/AndroidManifest.xml"

          python3 - "$MANIFEST" <<'PY'
          import sys
          import xml.etree.ElementTree as ET
          from pathlib import Path

          archivo = Path(sys.argv[1])

          ET.register_namespace(
              "android",
              "http://schemas.android.com/apk/res/android"
          )

          tree = ET.parse(archivo)
          root = tree.getroot()

          permisos = [
              "android.permission.INTERNET",
              "android.permission.CAMERA",
              "android.permission.RECORD_AUDIO"
          ]

          existentes = {
              elemento.get(
                  "{http://schemas.android.com/apk/res/android}name"
              )
              for elemento in root.findall("uses-permission")
          }

          for permiso in permisos:
              if permiso not in existentes:
                  ET.SubElement(
                      root,
                      "uses-permission",
                      {
                          "{http://schemas.android.com/apk/res/android}name": permiso
                      }
                  )

          tree.write(
              archivo,
              encoding="utf-8",
              xml_declaration=True
          )

          ET.parse(archivo)
          print("Manifest válido. Permisos generales configurados.")
          PY

      # 12. GPS SOLO EMPLEADOS
      - name: Configurar permisos GPS
        if: matrix.gps == true
        shell: bash
        run: |
          set -e

          MANIFEST="build-apks/${{ matrix.app }}/android/app/src/main/AndroidManifest.xml"

          python3 - "$MANIFEST" <<'PY'
          import sys
          import xml.etree.ElementTree as ET
          from pathlib import Path

          archivo = Path(sys.argv[1])

          ET.register_namespace(
              "android",
              "http://schemas.android.com/apk/res/android"
          )

          tree = ET.parse(archivo)
          root = tree.getroot()

          permisos = [
              "android.permission.ACCESS_COARSE_LOCATION",
              "android.permission.ACCESS_FINE_LOCATION"
          ]

          existentes = {
              elemento.get(
                  "{http://schemas.android.com/apk/res/android}name"
              )
              for elemento in root.findall("uses-permission")
          }

          for permiso in permisos:
              if permiso not in existentes:
                  ET.SubElement(
                      root,
                      "uses-permission",
                      {
                          "{http://schemas.android.com/apk/res/android}name": permiso
                      }
                  )

          tree.write(
              archivo,
              encoding="utf-8",
              xml_declaration=True
          )

          ET.parse(archivo)
          print("GPS configurado. Manifest XML válido.")
          PY

      # 13. VALIDAR MANIFEST
      - name: Validar AndroidManifest
        shell: bash
        run: |
          set -e

          MANIFEST="build-apks/${{ matrix.app }}/android/app/src/main/AndroidManifest.xml"

          python3 - "$MANIFEST" <<'PY'
          import sys
          import xml.etree.ElementTree as ET

          ET.parse(sys.argv[1])
          print("OK: AndroidManifest.xml es válido.")
          PY

      # 14. SINCRONIZAR CAPACITOR
      - name: Sincronizar Capacitor
        shell: bash
        run: |
          set -e

          APP_DIR="build-apks/${{ matrix.app }}"

          cd "$APP_DIR"

          npx cap sync android

      # 15. COMPILAR APK
      - name: Compilar APK Debug
        shell: bash
        run: |
          set -e

          APP_DIR="build-apks/${{ matrix.app }}"

          cd "$APP_DIR/android"

          chmod +x gradlew

          ./gradlew assembleDebug --no-daemon

      # 16. VERIFICAR APK
      - name: Verificar APK generado
        shell: bash
        run: |
          set -e

          APK="build-apks/${{ matrix.app }}/android/app/build/outputs/apk/debug/app-debug.apk"

          if [ ! -f "$APK" ]; then
            echo "ERROR: No se generó la APK."
            exit 1
          fi

          ls -lh "$APK"

      # 17. GUARDAR APK
      - name: Guardar APK
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: build-apks/${{ matrix.app }}/android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
