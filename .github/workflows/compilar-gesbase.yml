
name: Compilar APK GESBASE

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Descargar codigo
        uses: actions/checkout@v4

      - name: Configurar Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Configurar Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Preparar Android
        run: |
          mkdir -p android/app/src/main/java/com/gesbase/app
          mkdir -p android/app/src/main/assets

      - name: Generar proyecto Android
        run: |
          npm init -y
          npm install @capacitor/core@6 @capacitor/android@6
          npm install --save-dev @capacitor/cli@6
          npx cap init GESBASE com.gesbase.app --web-dir dist
          mkdir -p dist
          cat > dist/index.html <<'HTML'
          <!doctype html>
          <html lang="es">
          <head>
            <meta charset="utf-8">
            <meta name="viewport" content="width=device-width, initial-scale=1">
            <title>GESBASE</title>
          </head>
          <body>
            <p>Conectando con GESBASE...</p>
            <script>
              location.replace('https://gesbase.online/');
            </script>
          </body>
          </html>
          HTML
          npx cap add android
          npx cap sync android

      - name: Generar APK
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Publicar APK
        uses: actions/upload-artifact@v4
        with:
          name: GESBASE-APK
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
