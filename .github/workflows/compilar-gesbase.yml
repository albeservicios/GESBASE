
name: Compilar APK GESBASE

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Descargar codigo
        uses: actions/checkout@v4

      - name: Configurar Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Configurar Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Preparar proyecto independiente
        run: |
          mkdir -p android-wrapper
          cd android-wrapper
          npm init -y
          npm install @capacitor/core@6 @capacitor/android@6
          npm install --save-dev @capacitor/cli@6
          mkdir -p dist
          cat > dist/index.html <<'HTML'
          <!doctype html>
          <html lang="es">
          <head>
            <meta charset="utf-8">
            <meta name="viewport" content="width=device-width, initial-scale=1">
            <title>GESBASE</title>
          </head>
          <body>
            <p>Conectando con GESBASE...</p>
          </body>
          </html>
          HTML
          npx cap init GESBASE com.gesbase.app --web-dir dist
          node -e "const fs=require('fs'); const p='capacitor.config.json'; const c=JSON.parse(fs.readFileSync(p,'utf8')); c.server={url:'https://gesbase.online', cleartext:false}; fs.writeFileSync(p,JSON.stringify(c,null,2));"
          npx cap add android
          npx cap sync android

      - name: Compilar APK
        run: |
          cd android-wrapper/android
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Guardar APK
        uses: actions/upload-artifact@v4
        with:
          name: GESBASE-APK
          path: android-wrapper/android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
