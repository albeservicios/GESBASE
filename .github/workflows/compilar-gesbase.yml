name: Compilar APK GESBASE

on:
  push:
    branches:
      - main
      - master
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      # 1. DESCARGAR CÓDIGO
      - name: Descargar código
        uses: actions/checkout@v4

      # 2. CONFIGURAR NODE
      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Verificar Node.js
        run: |
          node --version
          npm --version

      # 3. INSTALAR CAPACITOR Y PLUGIN DE GEOLOCALIZACIÓN
      - name: Preparar proyecto Node
        run: |
          if [ ! -f package.json ]; then
            npm init -y
          fi

          npm install \
            @capacitor/core@8.5.2 \
            @capacitor/cli@8.5.2 \
            @capacitor/android@8.5.2 \
            @capacitor/app@8.1.2 \
            @capacitor/push-notifications@8.1.3 \
            @capacitor/geolocation@6.0.0

      # 4. CREAR DIST
      - name: Preparar carpeta dist
        run: |
          rm -rf dist
          mkdir -p dist

      # 5. COPIAR ARCHIVOS WEB
      - name: Copiar archivos web
        run: |
          find . -maxdepth 1 -type f -name "*.html" -exec cp {} dist/ \;
          find . -maxdepth 1 -type f -name "*.js" -exec cp {} dist/ \;
          find . -maxdepth 1 -type f -name "*.css" -exec cp {} dist/ \;

          for carpeta in Js js assets public src empleado empleados Empleado Empleados; do
            if [ -d "$carpeta" ]; then
              cp -r "$carpeta" dist/
            fi
          done

          echo "Archivos copiados:"
          find dist -maxdepth 3 -type f | sort

      # 6. CONFIGURAR API Y WEBSOCKET PARA LA APK
      - name: Configurar conexión API GESBASE
        run: |
          python3 - <<'PY'
          from pathlib import Path

          archivo = Path("dist/Js/local/shared.js")

          if not archivo.is_file():
              for alt in ["dist/js/local/shared.js", "dist/JS/local/shared.js"]:
                  if Path(alt).is_file():
                      archivo = Path(alt)
                      break

          if archivo.is_file():
              codigo = archivo.read_text(encoding="utf-8")
              anterior_post = 'fetch(path, {'
              nuevo_post = 'fetch(new URL(path, "https://gesbase.online").href, {'
              if anterior_post in codigo:
                  codigo = codigo.replace(anterior_post, nuevo_post)

              anterior_ws = 'return `${proto}//${location.host}/ws${q}`;'
              nuevo_ws = 'return `wss://gesbase.online/ws${q}`;'
              if anterior_ws in codigo:
                  codigo = codigo.replace(anterior_ws, nuevo_ws, 1)

              archivo.write_text(codigo, encoding="utf-8")
              print("OK: Configuración de API aplicada en shared.js")
          else:
              print("AVISO: No se encontró shared.js, continuando...")
          PY

      # 7. CONTROLADOR ATRÁS
      - name: Crear controlador web
        run: |
          cat > dist/gesbase-back.js <<'EOF'
          (function () {
            "use strict";
            console.log("GESBASE: navegación cargada.");
          })();
          EOF

      # 8. SISTEMA PUSH Y GEOLOCALIZACIÓN NATIVA
      - name: Crear sistema de notificaciones push y GPS
        run: |
          cat > dist/gesbase-push.js <<'EOF'
          (function () {
            "use strict";

            function iniciarSistemaNativo() {
              try {
                if (!window.Capacitor) return;
                const plugins = window.Capacitor.Plugins || {};

                // Geolocalización nativa disponible globalmente
                if (plugins.Geolocation) {
                  window.gesbaseGetPosition = async function() {
                    try {
                      const permissions = await plugins.Geolocation.checkPermissions();
                      if (permissions.location !== 'granted') {
                        await plugins.Geolocation.requestPermissions();
                      }
                      const coordinates = await plugins.Geolocation.getCurrentPosition({ enableHighAccuracy: true });
                      return {
                        lat: coordinates.coords.latitude,
                        lng: coordinates.coords.longitude
                      };
                    } catch (e) {
                      console.error("GESBASE GPS Error:", e);
                      return null;
                    }
                  };
                }

                // Push notifications
                const Push = plugins.PushNotifications;
                if (!Push) return;

                Push.addListener("registration", function (token) {
                  window.gesbaseFCMToken = token.value;
                  try {
                    localStorage.setItem("gesbase_fcm_token", token.value);
                  } catch (e) {}
                  window.dispatchEvent(new CustomEvent("gesbaseFCMToken", { detail: { token: token.value } }));
                });

                Push.addListener("registrationError", function (error) {
                  console.error("GESBASE PUSH ERROR:", error);
                });

                Push.addListener("pushNotificationReceived", function (notification) {
                  window.dispatchEvent(new CustomEvent("gesbasePushReceived", { detail: notification }));
                });

                Push.addListener("pushNotificationActionPerformed", function (action) {
                  const data = action.notification && action.notification.data ? action.notification.data : {};
                  window.dispatchEvent(new CustomEvent("gesbasePushAction", { detail: data }));
                  if ((data.tipo === "mensaje" || data.tipo === "llamada") && data.url) {
                    window.location.href = data.url;
                  }
                });

                Push.checkPermissions()
                  .then(function (permiso) {
                    if (permiso.receive === "granted") return Push.register();
                    return Push.requestPermissions();
                  })
                  .then(function (permiso) {
                    if (permiso && permiso.receive === "granted") return Push.register();
                  })
                  .catch(function (error) {
                    console.error("GESBASE error permisos push:", error);
                  });
              } catch (error) {
                console.error("GESBASE SISTEMA NATIVO:", error);
              }
            }

            if (document.readyState === "loading") {
              document.addEventListener("DOMContentLoaded", iniciarSistemaNativo);
            } else {
              iniciarSistemaNativo();
            }
          })();
          EOF

      # 9. INSERTAR SCRIPTS EN LOS HTML
      - name: Activar navegación y Push
        run: |
          for archivo in dist/*.html dist/**/*.html; do
            [ -f "$archivo" ] || continue

            if ! grep -q "gesbase-back.js" "$archivo"; then
              if grep -qi "</body>" "$archivo"; then
                sed -i 's#</body>#<script src="./gesbase-back.js"></script>\n</body>#I' "$archivo"
              else
                echo '<script src="./gesbase-back.js"></script>' >> "$archivo"
              fi
            fi

            if ! grep -q "gesbase-push.js" "$archivo"; then
              if grep -qi "</body>" "$archivo"; then
                sed -i 's#</body>#<script src="./gesbase-push.js"></script>\n</body>#I' "$archivo"
              else
                echo '<script src="./gesbase-push.js"></script>' >> "$archivo"
              fi
            fi
          done

          echo "Navegación y Push activados."

      # 9.5. FORZAR REDIRECCIÓN INICIAL A EMPLEADO-LOGIN
      - name: Redirigir index principal a empleado-login
        run: |
          TARGET="empleado-login.html"
          if [ -f "dist/empleado/empleado-login.html" ]; then
            TARGET="empleado/empleado-login.html"
          elif [ -f "dist/empleados/empleado-login.html" ]; then
            TARGET="empleados/empleado-login.html"
          fi

          cat > dist/index.html <<EOF
          <!DOCTYPE html>
          <html>
          <head>
            <meta charset="utf-8">
            <meta http-equiv="refresh" content="0; url=./$TARGET">
            <script>
              window.location.href = "./$TARGET";
            </script>
          </head>
          <body>
            <p>Redirigiendo a GESBASE Empleado...</p>
          </body>
          </html>
          EOF

      # 10. VERIFICAR ARCHIVOS
      - name: Verificar archivos principales
        run: |
          echo "Buscando archivos HTML disponibles:"
          find dist -name "*.html"
          echo "Verificación completada con éxito."

      # 11. CONFIGURAR CAPACITOR
      - name: Configurar Capacitor
        run: |
          cat > capacitor.config.json <<'EOF'
          {
            "appId": "com.gesbase.app",
            "appName": "GESBASE Empleado",
            "webDir": "dist",
            "bundledWebRuntime": false,
            "server": {
              "androidScheme": "https"
            }
          }
          EOF

      # 12. CREAR ANDROID
      - name: Crear plataforma Android
        run: |
          rm -rf android
          npx cap add android
          npx cap copy android
          npx cap sync android

      # 13. MAIN ACTIVITY CON SOPORTE DE UBICACIÓN Y NOTIFICACIONES
      - name: Configurar MainActivity
        run: |
          MAIN_ACTIVITY="android/app/src/main/java/com/gesbase/app/MainActivity.java"
          mkdir -p "$(dirname "$MAIN_ACTIVITY")"

          cat > "$MAIN_ACTIVITY" <<'EOF'
          package com.gesbase.app;

          import android.Manifest;
          import android.content.pm.PackageManager;
          import android.os.Build;
          import android.os.Bundle;
          import android.webkit.GeolocationPermissions;
          import android.webkit.WebChromeClient;
          import android.webkit.WebView;

          import androidx.activity.result.ActivityResultLauncher;
          import androidx.activity.result.contract.ActivityResultContracts;
          import androidx.core.content.ContextCompat;

          import com.getcapacitor.BridgeActivity;

          public class MainActivity extends BridgeActivity {

              private final ActivityResultLauncher<String[]> multiplePermissionsLauncher =
                      registerForActivityResult(
                          new ActivityResultContracts.RequestMultiplePermissions(),
                          result -> {
                              Boolean notifGranted = result.getOrDefault(Manifest.permission.POST_NOTIFICATIONS, false);
                              Boolean locGranted = result.getOrDefault(Manifest.permission.ACCESS_FINE_LOCATION, false);
                              if (notifGranted != null && notifGranted) {
                                  System.out.println("GESBASE: Permiso de notificaciones concedido.");
                              }
                              if (locGranted != null && locGranted) {
                                  System.out.println("GESBASE: Permiso de ubicación concedido.");
                              }
                          }
                      );

              @Override
              public void onCreate(Bundle savedInstanceState) {
                  super.onCreate(savedInstanceState);
                  solicitarPermisosSistema();
                  configurarGeolocalizacionWebView();
              }

              private void solicitarPermisosSistema() {
                  if (Build.VERSION.SDK_INT >= Build.VERSION_CODES.TIRAMISU) {
                      if (ContextCompat.checkSelfPermission(this, Manifest.permission.POST_NOTIFICATIONS) != PackageManager.PERMISSION_GRANTED ||
                          ContextCompat.checkSelfPermission(this, Manifest.permission.ACCESS_FINE_LOCATION) != PackageManager.PERMISSION_GRANTED) {
                          
                          multiplePermissionsLauncher.launch(new String[]{
                              Manifest.permission.POST_NOTIFICATIONS,
                              Manifest.permission.ACCESS_FINE_LOCATION,
                              Manifest.permission.ACCESS_COARSE_LOCATION
                          });
                      }
                  } else {
                      if (ContextCompat.checkSelfPermission(this, Manifest.permission.ACCESS_FINE_LOCATION) != PackageManager.PERMISSION_GRANTED) {
                          multiplePermissionsLauncher.launch(new String[]{
                              Manifest.permission.ACCESS_FINE_LOCATION,
                              Manifest.permission.ACCESS_COARSE_LOCATION
                          });
                      }
                  }
              }

              private void configurarGeolocalizacionWebView() {
                  try {
                      WebView webView = this.bridge.getWebView();
                      if (webView != null) {
                          webView.setWebChromeClient(new WebChromeClient() {
                              @Override
                              public void onGeolocationPermissionsShowPrompt(String origin, GeolocationPermissions.Callback callback) {
                                  callback.invoke(origin, true, false);
                              }
                          });
                      }
                  } catch (Exception e) {
                      System.err.println("GESBASE Error WebChromeClient: " + e.getMessage());
                  }
              }

              @Override
              public void onBackPressed() {
                  WebView webView = null;
                  try {
                      webView = this.bridge.getWebView();
                  } catch (Exception e) {}

                  if (webView != null && webView.canGoBack()) {
                      webView.goBack();
                  } else {
                      super.onBackPressed();
                  }
              }
          }
          EOF

      # 14. COPIAR GOOGLE SERVICES
      - name: Copiar google-services.json
        run: |
          if [ ! -f google-services.json ]; then
            echo "ERROR: falta google-services.json"
            exit 1
          fi
          cp google-services.json android/app/google-services.json

      # 15. GOOGLE SERVICES
      - name: Configurar Google Services
        run: |
          if ! grep -q 'com.google.gms:google-services' android/build.gradle; then
            sed -i '/dependencies {/a\
                classpath "com.google.gms:google-services:4.4.2"' \
                android/build.gradle
          fi

          if ! grep -q 'com.google.gms.google-services' android/app/build.gradle; then
            echo '' >> android/app/build.gradle
            echo 'apply plugin: "com.google.gms.google-services"' >> android/app/build.gradle
          fi

      # 16. PERMISOS ANDROID
      - name: Configurar permisos Android
        run: |
          MANIFEST="android/app/src/main/AndroidManifest.xml"
          
          if ! grep -q "android.permission.INTERNET" "$MANIFEST"; then
            sed -i '/<manifest/a\
              <uses-permission android:name="android.permission.INTERNET" />' \
              "$MANIFEST"
          fi
          
          if ! grep -q "android.permission.POST_NOTIFICATIONS" "$MANIFEST"; then
            sed -i '/<manifest/a\
              <uses-permission android:name="android.permission.POST_NOTIFICATIONS" />' \
              "$MANIFEST"
          fi

          if ! grep -q "android.permission.ACCESS_FINE_LOCATION" "$MANIFEST"; then
            sed -i '/<manifest/a\
              <uses-permission android:name="android.permission.ACCESS_FINE_LOCATION" />\
              <uses-permission android:name="android.permission.ACCESS_COARSE_LOCATION" />' \
              "$MANIFEST"
          fi

      # 17. JAVA 21
      - name: Configurar Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: gradle

      # 18. SINCRONIZAR CAPACITOR
      - name: Sincronizar Capacitor
        run: |
          npx cap sync android

      # 19. VERIFICACIÓN FINAL
      - name: Verificar sistema
        run: |
          test -f android/app/src/main/java/com/gesbase/app/MainActivity.java
          echo "Sistema verificado con éxito."

      # 20. COMPILAR APK
      - name: Compilar APK Debug
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon

      # 21. VERIFICAR APK
      - name: Verificar APK generado
        run: |
          APK="android/app/build/outputs/apk/debug/app-debug.apk"
          if [ ! -f "$APK" ]; then
            echo "ERROR: no se generó el APK."
            exit 1
          fi
          ls -lh "$APK"

      # 22. GUARDAR APK
      - name: Guardar APK
        uses: actions/upload-artifact@v4
        with:
          name: gesbase-empleado-apk-debug
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
