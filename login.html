/* =========================================================
   IDIOMA
========================================================= */

function obtenerIdiomaInicial(){

    const guardado =
        localStorage.getItem("gesbaseIdioma");


    if(
        guardado === "es" ||
        guardado === "en"
    ){

        return guardado;

    }


    const navegador =
        (
            navigator.language ||
            "es"
        ).toLowerCase();


    return navegador.startsWith("en")
        ? "en"
        : "es";

}

    obtenerIdiomaInicial();

function traducirPagina(){

    const textos =
        traducciones[idiomaActual];


    document.documentElement.lang =
        idiomaActual;


    document.title =
        idiomaActual === "en"
            ? "Sign in - GESBASE"
            : "Iniciar sesión - GESBASE";


    document
        .querySelectorAll("[data-i18n]")
        .forEach(elemento => {

            const clave =
                elemento.dataset.i18n;


            if(textos[clave]){

                elemento.textContent =
                    textos[clave];

            }

        });


    document
        .querySelectorAll(
            "[data-i18n-placeholder]"
        )
        .forEach(elemento => {

            const clave =
                elemento.dataset.i18nPlaceholder;


            if(textos[clave]){

                elemento.placeholder =
                    textos[clave];

            }

        });


    selectorIdioma.value =
        idiomaActual;

}

/* =========================================================
   ERRORES FIREBASE
========================================================= */

function obtenerMensajeError(
    error,
    tipo
){

    const t =
        traducciones[idiomaActual];


    if(tipo === "login"){

        switch(error.code){

            case "auth/invalid-credential":

                return idiomaActual === "en"
                    ? "Email or password is incorrect."
                    : "Email o contraseña incorrectos.";


            case "auth/invalid-email":

                return t.emailInvalido;


            case "auth/user-not-found":

                return t.usuarioNoEncontrado;


            case "auth/wrong-password":

                return t.contraseñaIncorrecta;


            case "auth/user-disabled":

                return t.cuentaDeshabilitada;


            case "auth/too-many-requests":

                return t.demasiadosIntentos;


            case "auth/network-request-failed":

                return t.errorRed;


            case "auth/api-key-not-valid":

                return t.apiInvalida;


            case "auth/operation-not-allowed":

                return t.accesoNoHabilitado;


            default:

                return error.message ||
                    t.errorLogin;

        }

    }


    switch(error.code){

        case "auth/invalid-email":

            return t.emailInvalido;


        case "auth/user-not-found":

            return t.usuarioNoEncontrado;


        case "auth/too-many-requests":

            return t.demasiadosIntentos;


        case "auth/network-request-failed":

            return t.errorRed;


        case "auth/api-key-not-valid":

            return t.apiInvalida;


        default:

            return t.errorRecuperacion;

    }

}


/* =========================================================
   BUSCAR EMPLEADO
========================================================= */

async function buscarEmpleado(usuario){

    console.log(
        "GESBASE: buscando empleado:",
        usuario.uid
    );


    /* ---------------------------------------------
       1. empleados/{uid}
    --------------------------------------------- */

    try{

        const referencia =
            doc(
                db,
                "empleados",
                usuario.uid
            );


        const documento =
            await getDoc(
                referencia
            );


        if(documento.exists()){

            return {

                id:
                    documento.id,

                datos:
                    documento.data()

            };

        }

    }
    catch(error){

        console.warn(
            "GESBASE: empleado por ID:",
            error
        );

    }


    /* ---------------------------------------------
       2. empleados.uid
    --------------------------------------------- */

    try{

        const consulta =
            query(
                collection(
                    db,
                    "empleados"
                ),
                where(
                    "uid",
                    "==",
                    usuario.uid
                )
            );


        const resultado =
            await getDocs(
                consulta
            );


        if(!resultado.empty){

            const documento =
                resultado.docs[0];


            return {

                id:
                    documento.id,

                datos:
                    documento.data()

            };

        }

    }
    catch(error){

        console.warn(
            "GESBASE: empleado por uid:",
            error
        );

    }


    /* ---------------------------------------------
       3. empleados.email
    --------------------------------------------- */

    if(usuario.email){

        try{

            const email =
                usuario.email
                    .trim()
                    .toLowerCase();


            const consulta =
                query(
                    collection(
                        db,
                        "empleados"
                    ),
                    where(
                        "email",
                        "==",
                        email
                    )
                );


            const resultado =
                await getDocs(
                    consulta
                );


            if(!resultado.empty){

                const documento =
                    resultado.docs[0];


                return {

                    id:
                        documento.id,

                    datos:
                        documento.data()

                };

            }

        }
        catch(error){

            console.warn(
                "GESBASE: empleado por email:",
                error
            );

        }

    }


    return null;

}


/* =========================================================
   VERIFICAR EMPLEADO HABILITADO
========================================================= */

function empleadoEstaHabilitado(datos){

    if(
        datos.accesoHabilitado === false
    ){

        return false;

    }


    const estado =
        String(
            datos.estado || ""
        )
        .toLowerCase()
        .trim();


    if(
        [
            "bloqueado",
            "inactivo",
            "deshabilitado",
            "inactive",
            "disabled"
        ].includes(estado)
    ){

        return false;

    }


    const tipoAcceso =
        String(
            datos.tipoAcceso || ""
        )
        .toLowerCase()
        .trim();


    if(
        tipoAcceso === "bloqueado"
    ){

        return false;

    }


    return true;

}


/* =========================================================
   TIPO DE EMPLEADO
========================================================= */

function obtenerTipoEmpleado(datos){

    const tipoEmpleado =
        String(
            datos.tipoEmpleado || ""
        )
        .toLowerCase()
        .trim();


    const tipoAcceso =
        String(
            datos.tipoAcceso || ""
        )
        .toLowerCase()
        .trim();


    const rol =
        String(
            datos.rol || ""
        )
        .toLowerCase()
        .trim();


    if(
        tipoEmpleado === "chofer" ||
        tipoAcceso === "chofer" ||
        rol === "chofer"
    ){

        return "chofer";

    }


    return "empleado";

}

/* =========================================================

async function detectarTipoUsuario(usuario){

    console.log(
        "======================================"
    );

    console.log(
        "GESBASE: DETECTANDO USUARIO"
    );

    console.log(
        "UID:",
        usuario.uid
    );

    console.log(
        "EMAIL:",
        usuario.email
    );

    console.log(
        "======================================"
    );


    /* =====================================================
       1. EMPLEADO
       PRIORIDAD ABSOLUTA
    ===================================================== */

    const empleado =
        await buscarEmpleado(
            usuario
        );


    if(empleado){

        const datos =
            empleado.datos;


        const tipo =
            obtenerTipoEmpleado(
                datos
            );


        console.log(
            "GESBASE: EMPLEADO DETECTADO:",
            tipo
        );


        return {

            tipo:
                tipo,

            empleadoId:
                empleado.id,

            datos:
                datos,

            esEmpleado:
                true

        };

    }


    /* =====================================================
       2. USUARIOS/{UID}
    ===================================================== */

    try{

        const referencia =
            doc(
                db,
                "usuarios",
                usuario.uid
            );


        const documento =
            await getDoc(
                referencia
            );


        if(documento.exists()){

            const datos =
                documento.data();


            console.log(
                "GESBASE: usuarios/{uid}:",
                datos
            );


            const tipo =
                String(
                    datos.tipoUsuario ||
                    datos.tipo ||
                    ""
                )
                .toLowerCase()
                .trim();


            const rol =
                String(
                    datos.rol ||
                    ""
                )
                .toLowerCase()
                .trim();


            /* EMPLEADO */

            if(
                tipo === "empleado" ||
                rol === "empleado"
            ){

                return {

                    tipo:
                        "empleado",

                    empleadoId:
                        datos.empleadoId || "",

                    datos:
                        datos,

                    esEmpleado:
                        true

                };

            }


            /* CHOFER */

            if(
                tipo === "chofer" ||
                rol === "chofer"
            ){

                return {

                    tipo:
                        "chofer",

                    empleadoId:
                        datos.empleadoId || "",

                    datos:
                        datos,

                    esEmpleado:
                        true

                };

            }


            /* EMPRESA */

            if(
                tipo === "empresa" ||
                tipo === "administrador" ||
                tipo === "admin" ||
                rol === "administrador" ||
                rol === "admin"
            ){

                return {

                    tipo:
                        "empresa",

                    datos:
                        datos,

                    esEmpleado:
                        false

                };

            }


            /* COMPATIBILIDAD */

            if(
                datos.empresaId ||
                datos.idEmpresa ||
                datos.empresa
            ){

                if(datos.empleadoId){

                    return {

                        tipo:
                            "empleado",

                        empleadoId:
                            datos.empleadoId,

                        datos:
                            datos,

                        esEmpleado:
                            true

                    };

                }


                return {

                    tipo:
                        "empresa",

                    datos:
                        datos,

                    esEmpleado:
                        false

                };

            }

        }

    }
    catch(error){

        console.warn(
            "GESBASE: error leyendo usuarios:",
            error
        );

    }


    /* =====================================================
       3. EMPRESA POR propietarioUid
       NUEVO FALLBACK
    ===================================================== */

    const empresaPropietario =
        await buscarEmpresaPorPropietario(
            usuario
        );


    if(empresaPropietario){

        return {

            tipo:
                "empresa",

            empresaId:
                empresaPropietario.id,

            datos:
                empresaPropietario.datos,

            esEmpleado:
                false

        };

    }


    /* =====================================================
       4. EMPRESA POR EMAIL
    ===================================================== */

    const empresaEmail =
        await buscarEmpresaPorEmail(
            usuario
        );


    if(empresaEmail){

        return {

            tipo:
                "empresa",

            empresaId:
                empresaEmail.id,

            datos:
                empresaEmail.datos,

            esEmpleado:
                false

        };

    }


    return null;

}


/* =========================================================
   REDIRECCIÓN
========================================================= */

async function redireccionarUsuario(usuario){

    const t =
        traducciones[idiomaActual];


    mostrarMensaje(
        t.verificandoTipo,
        "exito"
    );


    try{

        const resultado =
            await detectarTipoUsuario(
                usuario
            );


        /* =================================================
           NO IDENTIFICADO
        ================================================= */

        if(!resultado){

            await signOut(
                auth
            );


            mostrarMensaje(
                t.usuarioSinConfiguracion,
                "error"
            );


            botonLogin.disabled =
                false;


            botonLogin.textContent =
                t.iniciarSesion;


            return;

        }


        const datos =
            resultado.datos || {};


        /* =================================================
           EMPLEADO / CHOFER
        ================================================= */

        if(
            resultado.tipo === "empleado" ||
            resultado.tipo === "chofer"
        ){

            if(
                !empleadoEstaHabilitado(
                    datos
                )
            ){

                await signOut(
                    auth
                );


                mostrarMensaje(
                    t.empleadoInactivo,
                    "error"
                );


                botonLogin.disabled =
                    false;


                botonLogin.textContent =
                    t.iniciarSesion;


                return;

            }


            /* SESIÓN EMPLEADO */

            sessionStorage.setItem(
                "gesbaseTipoUsuario",
                resultado.tipo
            );


            const empresaId =
                datos.empresaId ||
                datos.idEmpresa ||
                datos.empresa ||
                "";


            if(empresaId){

                sessionStorage.setItem(
                    "gesbaseEmpresaId",
                    empresaId
                );

            }


            if(resultado.empleadoId){

                sessionStorage.setItem(
                    "gesbaseEmpleadoId",
                    resultado.empleadoId
                );

            }


            sessionStorage.setItem(
                "gesbaseEmpleado",
                JSON.stringify({

                    uid:
                        usuario.uid,

                    empleadoId:
                        resultado.empleadoId || "",

                    tipo:
                        resultado.tipo,

                    empresaId:
                        empresaId,

                    email:
                        usuario.email || "",

                    datos:
                        datos

                })
            );


            mostrarMensaje(
                resultado.tipo === "chofer"
                    ? t.accesoChofer
                    : t.accesoEmpleado,
                "exito"
            );


            setTimeout(
                () => {

                    window.location.replace(
                        "./panel-empleado.html"
                    );

                },
                300
            );


            return;

        }


        /* =================================================
           EMPRESA
        ================================================= */

        if(
            resultado.tipo === "empresa"
        ){

            sessionStorage.setItem(
                "gesbaseTipoUsuario",
                "empresa"
            );


            const empresaId =
                resultado.empresaId ||
                datos.empresaId ||
                datos.idEmpresa ||
                datos.empresa ||
                "";


            if(empresaId){

                sessionStorage.setItem(
                    "gesbaseEmpresaId",
                    empresaId
                );

            }


            mostrarMensaje(
                t.accesoEmpresa,
                "exito"
            );


            console.log(
                "GESBASE: acceso empresarial correcto."
            );

            console.log(
                "GESBASE: empresaId:",
                empresaId
            );


            setTimeout(
                () => {

                    window.location.replace(
                        "./index.html"
                    );

                },
                300
            );


            return;

        }

    }
    catch(error){

        console.error(
            "GESBASE: ERROR DETECTANDO USUARIO:",
            error
        );


        mostrarDiagnostico(
            error
        );


        mostrarMensaje(
            idiomaActual === "en"
                ? "Could not verify the user type."
                : "No se pudo verificar el tipo de usuario.",
            "error"
        );


        botonLogin.disabled =
            false;


        botonLogin.textContent =
            t.iniciarSesion;

    }

}

/* =========================================================

========================================================= */

botonRecuperar.addEventListener(
    "click",
    async () => {

        const email =
            emailInput.value
                .trim();


        const t =
            traducciones[idiomaActual];


        if(!email){

            mostrarMensaje(
                t.emailRecuperacion,
                "error"
            );


            emailInput.focus();

            return;

        }


        botonRecuperar.disabled =
            true;


        botonRecuperar.textContent =
            t.enviando;


        ocultarDiagnostico();


        try{

            await sendPasswordResetEmail(
                auth,
                email
            );


            mostrarMensaje(
                t.recuperarEnviado,
                "exito"
            );

        }
        catch(error){

            console.error(
                "GESBASE: ERROR RECUPERACIÓN:",
                error
            );


            mostrarDiagnostico(
                error
            );


            mostrarMensaje(
                obtenerMensajeError(
                    error,
                    "recuperacion"
                ),
                "error"
            );

        }


        botonRecuperar.disabled =
            false;


        botonRecuperar.textContent =
            t.olvidaste;

    }
);


/* =========================================================
   SESIÓN YA ABIERTA
========================================================= */

let comprobandoSesion = false;


onAuthStateChanged(
    auth,
    async usuario => {

        if(!usuario){

            return;

        }


        if(comprobandoSesion){

            return;

        }


        comprobandoSesion = true;


        console.log(
            "GESBASE: sesión Firebase detectada:",
            usuario.uid,
            usuario.email
        );


        /*
        No ejecutamos una segunda comprobación
        si estamos en medio de un login.
        */

        if(
            !botonLogin.disabled
        ){

            await redireccionarUsuario(
                usuario
            );

        }

    }
);


/* =========================================================
   LOGIN
========================================================= */

formulario.addEventListener(
    "submit",
    async evento => {

        evento.preventDefault();


        const email =
            emailInput.value
                .trim()
                .toLowerCase();


        const password =
            passwordInput.value;


        const t =
            traducciones[idiomaActual];


        if(
            !email ||
            !password
        ){

            mostrarMensaje(
                t.completar,
                "error"
            );

            return;

        }


        botonLogin.disabled =
            true;


        botonLogin.textContent =
            t.ingresando;


        ocultarDiagnostico();


        mostrarMensaje(
            t.verificando,
            "exito"
        );


        try{

            /*
            ================================================
            LOGIN REAL CON FIREBASE AUTH
            ================================================
            */

            const resultado =
                await signInWithEmailAndPassword(
                    auth,
                    email,
                    password
                );


            console.log(
                "GESBASE: AUTENTICACIÓN CORRECTA"
            );


            console.log(
                "UID:",
                resultado.user.uid
            );


            console.log(
                "EMAIL:",
                resultado.user.email
            );


            /*
            ================================================
            AHORA IDENTIFICAMOS EL TIPO DE USUARIO
            ================================================
            */

            await redireccionarUsuario(
                resultado.user
            );

        }
        catch(error){

            console.error(
                "================================"
            );


            console.error(
                "GESBASE: ERROR DE LOGIN"
            );


            console.error(
                "Código:",
                error?.code
            );


            console.error(
                "Mensaje:",
                error?.message
            );


            console.error(
                "================================"
            );


            mostrarDiagnostico(
                error
            );


            mostrarMensaje(
                obtenerMensajeError(
                    error,
                    "login"
                ),
                "error"
            );


            botonLogin.disabled =
                false;


            botonLogin.textContent =
                t.iniciarSesion;

        }

    }
);


/* =========================================================
   INICIALIZAR
========================================================= */

traducirPagina();


console.log(
    "GESBASE LOGIN: sistema iniciado correctamente."
);

console.log(
    "GESBASE LOGIN: Firebase Auth:",
    !!auth
);

console.log(
    "GESBASE LOGIN: Firestore:",
    !!db
);
