<!DOCTYPE html>
<html lang="es">

<head>

<meta charset="UTF-8">

<meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
>

<meta
    name="theme-color"
    content="#111827"
>

<meta
    name="description"
    content="GESBASE - Tu empresa. Todo organizado."
>

<title>Iniciar sesión - GESBASE</title>

<style>

*{
    box-sizing:border-box;
    margin:0;
    padding:0;
}

body{
    font-family:Arial,sans-serif;
    background:#f3f4f6;
    color:#111827;
    min-height:100vh;
}

.contenedor{
    width:100%;
    max-width:500px;
    min-height:100vh;
    margin:auto;
    background:#fff;
}

header{
    background:#111827;
    color:white;
    padding:25px 20px 30px;
    text-align:center;
    position:relative;
}

.logo{
    font-size:34px;
    font-weight:bold;
    letter-spacing:1px;
}

.subtitulo{
    margin-top:8px;
    font-size:14px;
    color:#d1d5db;
}

/* ==========================================
   SELECTOR DE IDIOMA
========================================== */

.selector-idioma{
    position:absolute;
    top:15px;
    right:15px;

    background:#1f2937;
    color:white;

    border:1px solid #374151;
    border-radius:9px;

    padding:7px 9px;

    font-size:13px;
    font-weight:bold;

    cursor:pointer;
    outline:none;
}

.selector-idioma:hover{
    background:#374151;
}

main{
    padding:25px 20px 35px;
}

h1{
    font-size:24px;
    margin-bottom:8px;
}

.descripcion{
    color:#6b7280;
    font-size:14px;
    line-height:1.5;
    margin-bottom:25px;
}

.campo{
    margin-bottom:18px;
}

label{
    display:block;
    font-size:14px;
    font-weight:bold;
    margin-bottom:7px;
}

input{
    width:100%;
    padding:14px;
    border:1px solid #d1d5db;
    border-radius:10px;
    font-size:16px;
    outline:none;
}

input:focus{
    border-color:#111827;
}

.boton{
    width:100%;
    border:none;
    border-radius:11px;
    padding:15px;
    font-size:16px;
    font-weight:bold;
    cursor:pointer;
    margin-top:8px;
}

.boton-principal{
    background:#111827;
    color:white;
}

.boton-principal:disabled{
    opacity:.6;
    cursor:not-allowed;
}

.boton-secundario{
    background:#e5e7eb;
    color:#111827;
}

.boton-recuperar{
    background:transparent;
    color:#2563eb;
    padding:10px;
    font-size:14px;
    margin-top:5px;
}

.boton-recuperar:hover{
    text-decoration:underline;
}

.mensaje{
    display:none;
    margin-top:18px;
    padding:13px;
    border-radius:10px;
    font-size:14px;
    line-height:1.5;
    word-break:break-word;
}

.mensaje.error{
    display:block;
    background:#fee2e2;
    color:#991b1b;
}

.mensaje.exito{
    display:block;
    background:#dcfce7;
    color:#166534;
}

.diagnostico{
    margin-top:10px;
    padding:10px;
    background:#f9fafb;
    border:1px solid #d1d5db;
    border-radius:8px;
    font-size:12px;
    color:#374151;
    word-break:break-word;
}

.registro{
    text-align:center;
    margin-top:25px;
    color:#6b7280;
    font-size:14px;
}

.registro a{
    color:#111827;
    font-weight:bold;
    text-decoration:none;
}

@media(max-width:600px){

    .selector-idioma{
        top:12px;
        right:12px;
    }

    header{
        padding-top:50px;
    }

}

</style>

</head>

<body>

<div class="contenedor">

<header>

<select
    id="selectorIdioma"
    class="selector-idioma"
    aria-label="Idioma"
>

    <option value="es">
        🇦🇷 ES
    </option>

    <option value="en">
        🇺🇸 EN
    </option>

</select>


<div class="logo">
    GESBASE
</div>

<div
    class="subtitulo"
    data-i18n="subtitulo"
>
    Gestión para empresas y profesionales
</div>

</header>


<main>

<h1 data-i18n="titulo">
    Iniciar sesión
</h1>

<p
    class="descripcion"
    data-i18n="descripcion"
>
    Ingresá a tu cuenta para continuar utilizando GESBASE.
</p>


<form id="formLogin">

<div class="campo">

<label
    for="email"
    data-i18n="email"
>
    Email
</label>

<input
    type="email"
    id="email"
    placeholder="ejemplo@email.com"
    data-i18n-placeholder="placeholderEmail"
    autocomplete="email"
    required
>

</div>


<div class="campo">

<label
    for="password"
    data-i18n="password"
>
    Contraseña
</label>

<input
    type="password"
    id="password"
    placeholder="Tu contraseña"
    data-i18n-placeholder="placeholderPassword"
    autocomplete="current-password"
    required
>

</div>


<div
    id="mensaje"
    class="mensaje"
></div>


<div
    id="diagnostico"
    class="diagnostico"
    style="display:none;"
></div>


<button
    type="submit"
    id="btnLogin"
    class="boton boton-principal"
    data-i18n="iniciarSesion"
>
    Iniciar sesión
</button>


<button
    type="button"
    id="btnRecuperar"
    class="boton boton-recuperar"
    data-i18n="olvidaste"
>
    ¿Olvidaste tu contraseña?
</button>


<button
    type="button"
    id="btnRegistro"
    class="boton boton-secundario"
    data-i18n="crearCuenta"
>
    Crear una cuenta
</button>

</form>


<div class="registro">

<span data-i18n="sinCuenta">
    ¿Todavía no tenés cuenta?
</span>

<a
    href="registro.html"
    data-i18n="registrate"
>
    Registrate
</a>

</div>

</main>

</div>


<script type="module">

/* ==========================================
   FIREBASE
========================================== */

import {
    auth
} from "./Js/firebase.js";

import {
    signInWithEmailAndPassword,
    sendPasswordResetEmail,
    onAuthStateChanged
} from
"https://www.gstatic.com/firebasejs/12.18.0/firebase-auth.js";


/* ==========================================
   IDIOMAS
========================================== */

const traducciones = {

    es: {

        subtitulo:
            "Gestión para empresas y profesionales",

        titulo:
            "Iniciar sesión",

        descripcion:
            "Ingresá a tu cuenta para continuar utilizando GESBASE.",

        email:
            "Email",

        password:
            "Contraseña",

        placeholderEmail:
            "ejemplo@email.com",

        placeholderPassword:
            "Tu contraseña",

        iniciarSesion:
            "Iniciar sesión",

        olvidaste:
            "¿Olvidaste tu contraseña?",

        crearCuenta:
            "Crear una cuenta",

        sinCuenta:
            "¿Todavía no tenés cuenta?",

        registrate:
            "Registrate",

        enviando:
            "Enviando...",

        ingresando:
            "Ingresando...",

        verificando:
            "Verificando acceso...",

        loginCorrecto:
            "Inicio de sesión correcto. Ingresando...",

        recuperarEnviado:
            "Te enviamos un correo para restablecer tu contraseña. Revisá también Spam.",

        emailRecuperacion:
            "Ingresá tu email para recibir el enlace de recuperación.",

        completar:
            "Completá el email y la contraseña.",

        errorLogin:
            "No se pudo iniciar sesión.",

        errorRecuperacion:
            "No se pudo enviar el correo de recuperación.",

        emailInvalido:
            "El email no es válido.",

        usuarioNoEncontrado:
            "No existe una cuenta con ese email.",

        contraseñaIncorrecta:
            "La contraseña es incorrecta.",

        cuentaDeshabilitada:
            "Esta cuenta fue deshabilitada.",

        demasiadosIntentos:
            "Demasiados intentos. Esperá unos minutos.",

        errorRed:
            "No se pudo conectar con Firebase.",

        apiInvalida:
            "La API Key de Firebase no es válida.",

        accesoNoHabilitado:
            "El acceso con email y contraseña no está habilitado en Firebase.",

        cerrarSesionError:
            "No se pudo completar la operación."

    },


    en: {

        subtitulo:
            "Management for businesses and professionals",

        titulo:
            "Sign in",

        descripcion:
            "Sign in to your account to continue using GESBASE.",

        email:
            "Email",

        password:
            "Password",

        placeholderEmail:
            "example@email.com",

        placeholderPassword:
            "Your password",

        iniciarSesion:
            "Sign in",

        olvidaste:
            "Forgot your password?",

        crearCuenta:
            "Create an account",

        sinCuenta:
            "Don't have an account yet?",

        registrate:
            "Sign up",

        enviando:
            "Sending...",

        ingresando:
            "Signing in...",

        verificando:
            "Verifying access...",

        loginCorrecto:
            "Sign in successful. Entering...",

        recuperarEnviado:
            "We sent you an email to reset your password. Please also check your Spam folder.",

        emailRecuperacion:
            "Enter your email to receive the recovery link.",

        completar:
            "Enter your email and password.",

        errorLogin:
            "Could not sign in.",

        errorRecuperacion:
            "Could not send the password recovery email.",

        emailInvalido:
            "The email address is not valid.",

        usuarioNoEncontrado:
            "There is no account with that email.",

        contraseñaIncorrecta:
            "The password is incorrect.",

        cuentaDeshabilitada:
            "This account has been disabled.",

        demasiadosIntentos:
            "Too many attempts. Please wait a few minutes.",

        errorRed:
            "Could not connect to Firebase.",

        apiInvalida:
            "The Firebase API Key is not valid.",

        accesoNoHabilitado:
            "Email and password sign-in is not enabled in Firebase.",

        cerrarSesionError:
            "The operation could not be completed."

    }

};


/* ==========================================
   DETECTAR IDIOMA
========================================== */

function obtenerIdiomaInicial(){

    const guardado =
        localStorage.getItem(
            "gesbaseIdioma"
        );


    if(
        guardado === "es" ||
        guardado === "en"
    ){

        return guardado;

    }


    const idiomaNavegador =
        (
            navigator.language ||
            "es"
        ).toLowerCase();


    if(
        idiomaNavegador.startsWith("en")
    ){

        return "en";

    }


    return "es";

}


let idiomaActual =
    obtenerIdiomaInicial();


/* ==========================================
   ELEMENTOS
========================================== */

const formulario =
document.getElementById("formLogin");

const emailInput =
document.getElementById("email");

const passwordInput =
document.getElementById("password");

const mensaje =
document.getElementById("mensaje");

const diagnostico =
document.getElementById("diagnostico");

const botonLogin =
document.getElementById("btnLogin");

const botonRegistro =
document.getElementById("btnRegistro");

const botonRecuperar =
document.getElementById("btnRecuperar");

const selectorIdioma =
document.getElementById("selectorIdioma");


/* ==========================================
   FUNCIÓN TRADUCIR
========================================== */

function traducirPagina(){

    const textos =
        traducciones[idiomaActual];


    document.documentElement.lang =
        idiomaActual;


    document.title =
        idiomaActual === "en"
            ? "Sign in - GESBASE"
            : "Iniciar sesión - GESBASE";


    document
        .querySelectorAll("[data-i18n]")
        .forEach(elemento => {

            const clave =
                elemento.dataset.i18n;


            if(
                textos[clave]
            ){

                elemento.textContent =
                    textos[clave];

            }

        });


    document
        .querySelectorAll(
            "[data-i18n-placeholder]"
        )
        .forEach(elemento => {

            const clave =
                elemento.dataset.i18nPlaceholder;


            if(
                textos[clave]
            ){

                elemento.placeholder =
                    textos[clave];

            }

        });


    selectorIdioma.value =
        idiomaActual;

}


/* ==========================================
   CAMBIAR IDIOMA
========================================== */

selectorIdioma.addEventListener(
    "change",
    function(){

        idiomaActual =
            selectorIdioma.value;


        localStorage.setItem(
            "gesbaseIdioma",
            idiomaActual
        );


        traducirPagina();

    }
);


/* ==========================================
   MENSAJES
========================================== */

function mostrarMensaje(
    texto,
    tipo
){

    mensaje.textContent =
        texto;

    mensaje.className =
        "mensaje " + tipo;

}


function mostrarDiagnostico(
    error
){

    diagnostico.style.display =
        "block";

    diagnostico.innerHTML =
        "<strong>Firebase diagnostic</strong><br><br>" +
        "Code: " +
        String(
            error.code ||
            "no code"
        ) +
        "<br><br>" +
        "Message: " +
        String(
            error.message ||
            "no message"
        );

}


function ocultarDiagnostico(){

    diagnostico.style.display =
        "none";

    diagnostico.innerHTML =
        "";

}


/* ==========================================
   OBTENER MENSAJE FIREBASE
========================================== */

function obtenerMensajeError(
    error,
    tipo
){

    const t =
        traducciones[
            idiomaActual
        ];


    if(
        tipo === "login"
    ){

        switch(error.code){

            case "auth/invalid-credential":
                return t.errorLogin ===
                    traducciones.en.errorLogin
                    ? "Email or password is incorrect."
                    : "Email o contraseña incorrectos.";

            case "auth/invalid-email":
                return t.emailInvalido;

            case "auth/user-not-found":
                return t.usuarioNoEncontrado;

            case "auth/wrong-password":
                return t.contraseñaIncorrecta;

            case "auth/user-disabled":
                return t.cuentaDeshabilitada;

            case "auth/too-many-requests":
                return t.demasiadosIntentos;

            case "auth/network-request-failed":
                return t.errorRed;

            case "auth/api-key-not-valid":
                return t.apiInvalida;

            case "auth/operation-not-allowed":
                return t.accesoNoHabilitado;

            default:
                return error.message ||
                    t.errorLogin;

        }

    }


    switch(error.code){

        case "auth/invalid-email":
            return t.emailInvalido;

        case "auth/user-not-found":
            return t.usuarioNoEncontrado;

        case "auth/too-many-requests":
            return t.demasiadosIntentos;

        case "auth/network-request-failed":
            return t.errorRed;

        case "auth/api-key-not-valid":
            return t.apiInvalida;

        default:
            return t.errorRecuperacion;

    }

}


/* ==========================================
   REGISTRO
========================================== */

botonRegistro.addEventListener(
    "click",
    function(){

        window.location.href =
            "registro.html";

    }
);


/* ==========================================
   RECUPERAR CONTRASEÑA
========================================== */

botonRecuperar.addEventListener(
    "click",
    async function(){

        const email =
            emailInput.value.trim();


        const t =
            traducciones[
                idiomaActual
            ];


        if(!email){

            mostrarMensaje(
                t.emailRecuperacion,
                "error"
            );

            emailInput.focus();

            return;

        }


        botonRecuperar.disabled =
            true;

        botonRecuperar.textContent =
            t.enviando;

        ocultarDiagnostico();


        try{

            await sendPasswordResetEmail(
                auth,
                email
            );


            mostrarMensaje(
                t.recuperarEnviado,
                "exito"
            );

        }
        catch(error){

            console.error(
                "ERROR RECUPERACIÓN:",
                error
            );


            mostrarDiagnostico(
                error
            );


            mostrarMensaje(
                obtenerMensajeError(
                    error,
                    "recuperacion"
                ),
                "error"
            );

        }


        botonRecuperar.disabled =
            false;

        botonRecuperar.textContent =
            t.olvidaste;

    }
);


/* ==========================================
   SESIÓN EXISTENTE
========================================== */

onAuthStateChanged(
    auth,
    function(usuario){

        if(!usuario){

            return;

        }


        console.log(
            "GESBASE - Usuario autenticado:",
            usuario.uid
        );


        window.location.replace(
            "index.html"
        );

    }
);


/* ==========================================
   LOGIN
========================================== */

formulario.addEventListener(
    "submit",
    async function(evento){

        evento.preventDefault();


        const email =
            emailInput.value.trim();


        const password =
            passwordInput.value;


        const t =
            traducciones[
                idiomaActual
            ];


        if(
            !email ||
            !password
        ){

            mostrarMensaje(
                t.completar,
                "error"
            );

            return;

        }


        botonLogin.disabled =
            true;

        botonLogin.textContent =
            t.ingresando;


        ocultarDiagnostico();


        mostrarMensaje(
            t.verificando,
            "exito"
        );


        try{

            const resultado =
                await signInWithEmailAndPassword(
                    auth,
                    email,
                    password
                );


            console.log(
                "GESBASE - Login correcto:",
                resultado.user.uid
            );


            mostrarMensaje(
                t.loginCorrecto,
                "exito"
            );


            window.location.replace(
                "index.html"
            );

        }
        catch(error){

            console.error(
                "ERROR LOGIN:",
                error
            );


            mostrarDiagnostico(
                error
            );


            mostrarMensaje(
                obtenerMensajeError(
                    error,
                    "login"
                ),
                "error"
            );


            botonLogin.disabled =
                false;

            botonLogin.textContent =
                t.iniciarSesion;

        }

    }
);


/* ==========================================
   INICIAR IDIOMA
========================================== */

traducirPagina();

</script>

</body>

</html>
