<!DOCTYPE html>
<html lang="es">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <meta
        name="theme-color"
        content="#111827"
    >

    <title>Iniciar sesión - GESBASE</title>

    <style>

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: Arial, sans-serif;
            background: #f3f4f6;
            color: #111827;
            min-height: 100vh;
        }

        .contenedor {
            width: 100%;
            max-width: 500px;
            margin: auto;
            min-height: 100vh;
            background: white;
        }

        header {
            background: #111827;
            color: white;
            padding: 30px 20px;
            text-align: center;
        }

        .logo {
            font-size: 34px;
            font-weight: bold;
            letter-spacing: 1px;
        }

        .subtitulo {
            margin-top: 8px;
            font-size: 14px;
            color: #d1d5db;
        }

        main {
            padding: 24px 20px 35px;
        }

        h1 {
            font-size: 24px;
            margin-bottom: 8px;
        }

        .descripcion {
            color: #6b7280;
            font-size: 14px;
            margin-bottom: 25px;
            line-height: 1.5;
        }

        .campo {
            margin-bottom: 17px;
        }

        label {
            display: block;
            font-size: 14px;
            font-weight: bold;
            margin-bottom: 7px;
        }

        input {
            width: 100%;
            padding: 14px;
            border: 1px solid #d1d5db;
            border-radius: 10px;
            font-size: 16px;
            outline: none;
            background: white;
        }

        input:focus {
            border-color: #111827;
        }

        .boton {
            width: 100%;
            border: none;
            border-radius: 11px;
            padding: 15px;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            margin-top: 8px;
        }

        .boton-principal {
            background: #111827;
            color: white;
        }

        .boton-principal:disabled {
            opacity: .6;
            cursor: not-allowed;
        }

        .boton-secundario {
            background: #e5e7eb;
            color: #111827;
        }

        .mensaje {
            display: none;
            margin-top: 18px;
            padding: 13px;
            border-radius: 10px;
            font-size: 14px;
            line-height: 1.4;
        }

        .mensaje.error {
            display: block;
            background: #fee2e2;
            color: #991b1b;
        }

        .mensaje.exito {
            display: block;
            background: #dcfce7;
            color: #166534;
        }

        .registro {
            text-align: center;
            margin-top: 25px;
            font-size: 14px;
            color: #6b7280;
        }

        .registro a {
            color: #111827;
            font-weight: bold;
            text-decoration: none;
        }

    </style>

</head>


<body>

<div class="contenedor">

    <header>

        <div class="logo">
            GESBASE
        </div>

        <div class="subtitulo">
            Gestión para empresas y profesionales
        </div>

    </header>


    <main>

        <h1>
            Iniciar sesión
        </h1>

        <p class="descripcion">
            Ingresá con tu correo electrónico y contraseña
            para acceder a GESBASE.
        </p>


        <form id="formLogin">


            <div class="campo">

                <label for="email">
                    Email
                </label>

                <input
                    type="email"
                    id="email"
                    placeholder="ejemplo@email.com"
                    autocomplete="email"
                    required
                >

            </div>


            <div class="campo">

                <label for="password">
                    Contraseña
                </label>

                <input
                    type="password"
                    id="password"
                    placeholder="Tu contraseña"
                    autocomplete="current-password"
                    required
                >

            </div>


            <div
                id="mensaje"
                class="mensaje"
            ></div>


            <button
                type="submit"
                id="btnLogin"
                class="boton boton-principal"
            >
                Iniciar sesión
            </button>


            <button
                type="button"
                id="btnVolver"
                class="boton boton-secundario"
            >
                Volver
            </button>


        </form>


        <div class="registro">

            ¿No tenés una cuenta?

            <a href="registro.html">
                Crear cuenta
            </a>

        </div>

    </main>

</div>


<!-- ==========================================
     FIREBASE
     ========================================== -->

<script type="module">

    import {
        initializeApp
    } from "https://www.gstatic.com/firebasejs/12.1.0/firebase-app.js";


    import {
        getAuth,
        signInWithEmailAndPassword
    } from "https://www.gstatic.com/firebasejs/12.1.0/firebase-auth.js";


    // ==========================================
    // CONFIGURACIÓN FIREBASE GESBASE
    // ==========================================

    const firebaseConfig = {

        apiKey:
            "AIzaSyDDCQ7WhS9Gy8DwQGZ01VaFTmSgV2rjs9o",

        authDomain:
            "gesbase-4bf94.firebaseapp.com",

        projectId:
            "gesbase-4bf94",

        storageBucket:
            "gesbase-4bf94.firebasestorage.app",

        messagingSenderId:
            "64959778874",

        appId:
            "1:64959778874:web:c3bc129c3cee8cb77d6503",

        measurementId:
            "G-CCKGSRVGEX"

    };


    // ==========================================
    // INICIALIZAR FIREBASE
    // ==========================================

    const app =
        initializeApp(firebaseConfig);


    const auth =
        getAuth(app);


    // ==========================================
    // ELEMENTOS
    // ==========================================

    const formulario =
        document.getElementById(
            "formLogin"
        );


    const mensaje =
        document.getElementById(
            "mensaje"
        );


    const boton =
        document.getElementById(
            "btnLogin"
        );


    // ==========================================
    // MENSAJE
    // ==========================================

    function mostrarMensaje(
        texto,
        tipo
    ) {

        mensaje.textContent =
            texto;

        mensaje.className =
            "mensaje " + tipo;

    }


    // ==========================================
    // INICIAR SESIÓN
    // ==========================================

    formulario.addEventListener(
        "submit",
        async function(evento) {

            evento.preventDefault();


            const email =
                document.getElementById(
                    "email"
                ).value.trim();


            const password =
                document.getElementById(
                    "password"
                ).value;


            boton.disabled = true;

            boton.textContent =
                "Ingresando...";


            try {

                await signInWithEmailAndPassword(
                    auth,
                    email,
                    password
                );


                mostrarMensaje(
                    "Inicio de sesión correcto.",
                    "exito"
                );


                boton.textContent =
                    "Ingresando...";


                // ==================================
                // POR AHORA
                // ==================================
                // Luego reemplazaremos esta dirección
                // por la pantalla principal protegida.

                setTimeout(
                    function() {

                        window.location.href =
                            "index.html";

                    },
                    1000
                );


            } catch (error) {

                console.error(
                    "Error de inicio de sesión:",
                    error
                );


                let textoError =
                    "No se pudo iniciar sesión.";


                if (
                    error.code ===
                    "auth/invalid-credential"
                ) {

                    textoError =
                        "El correo o la contraseña son incorrectos.";

                }


                else if (
                    error.code ===
                    "auth/user-not-found"
                ) {

                    textoError =
                        "No existe una cuenta con ese correo.";

                }


                else if (
                    error.code ===
                    "auth/wrong-password"
                ) {

                    textoError =
                        "La contraseña es incorrecta.";

                }


                else if (
                    error.code ===
                    "auth/invalid-email"
                ) {

                    textoError =
                        "El correo electrónico no es válido.";

                }


                else if (
                    error.code ===
                    "auth/network-request-failed"
                ) {

                    textoError =
                        "No hay conexión con Firebase.";

                }


                mostrarMensaje(
                    textoError,
                    "error"
                );


                boton.disabled = false;

                boton.textContent =
                    "Iniciar sesión";

            }

        }
    );


    // ==========================================
    // VOLVER
    // ==========================================

    document
        .getElementById(
            "btnVolver"
        )
        .addEventListener(
            "click",
            function() {

                window.location.href =
                    "index.html";

            }
        );

</script>


</body>

</html>
