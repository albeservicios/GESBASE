/* =========================================================
   IDIOMA
========================================================= */

function obtenerIdiomaInicial(){

    const guardado =
        localStorage.getItem(
            "gesbaseIdioma"
        );


    if(
        guardado === "es" ||
        guardado === "en"
    ){

        return guardado;

    }


    const idiomaNavegador =
        (
            navigator.language ||
            "es"
        ).toLowerCase();


    if(
        idiomaNavegador.startsWith("en")
    ){

        return "en";

    }


    return "es";

}

    obtenerIdiomaInicial();

    document.title =
        idiomaActual === "en"
            ? "Sign in - GESBASE"

    document
        .querySelectorAll("[data-i18n]")
        .forEach(elemento => {

            const clave =
                elemento.dataset.i18n;


            if(textos[clave]){

                elemento.textContent =

            }

        });


    document
        .querySelectorAll(
            "[data-i18n-placeholder]"
        )
        .forEach(elemento => {

            const clave =
                elemento.dataset.i18nPlaceholder;


            if(textos[clave]){

                elemento.placeholder =
                    textos[clave];

            }

        });


    selectorIdioma.value =
        idiomaActual;

}

/* =========================================================
   ERROR FIREBASE
========================================================= */

function obtenerMensajeError(
    error,
    tipo
){

    const t =
        traducciones[idiomaActual];


    if(tipo === "login"){

        switch(error.code){

            case "auth/invalid-credential":

                return idiomaActual === "en"
                    ? "Email or password is incorrect."
                    : "Email o contraseña incorrectos.";

            case "auth/invalid-email":

                return t.emailInvalido;

            case "auth/user-not-found":

                return t.usuarioNoEncontrado;

            case "auth/wrong-password":

                return t.contraseñaIncorrecta;

            case "auth/user-disabled":

                return t.cuentaDeshabilitada;

            case "auth/too-many-requests":

                return t.demasiadosIntentos;

            case "auth/network-request-failed":

                return t.errorRed;

            case "auth/api-key-not-valid":

                return t.apiInvalida;

            case "auth/operation-not-allowed":

                return t.accesoNoHabilitado;

            default:

                return error.message ||
                    t.errorLogin;

        }

    }


    switch(error.code){

        case "auth/invalid-email":

            return t.emailInvalido;

        case "auth/user-not-found":

            return t.usuarioNoEncontrado;

        case "auth/too-many-requests":

            return t.demasiadosIntentos;

        case "auth/network-request-failed":

            return t.errorRed;

        case "auth/api-key-not-valid":

            return t.apiInvalida;

        default:

            return t.errorRecuperacion;

    }

}


/* =========================================================
   DETECTAR TIPO DE USUARIO
========================================================= */

async function detectarTipoUsuario(
    usuario
){

    console.log(
        "GESBASE: detectando tipo de usuario:",
        usuario.uid
    );


    /*
    ========================================================
    1. BUSCAR USUARIOS/{UID}
    ========================================================
    */

    const usuarioRef =
        doc(
            db,
            "usuarios",
            usuario.uid
        );


    const usuarioSnap =
        await getDoc(
            usuarioRef
        );


    if(usuarioSnap.exists()){

        const datos =
            usuarioSnap.data();


        console.log(
            "GESBASE: documento usuarios encontrado:",
            datos
        );


        const tipo =
            String(
                datos.tipoUsuario ||
                datos.tipo ||
                ""
            ).toLowerCase();


        const rol =
            String(
                datos.rol ||
                ""
            ).toLowerCase();


        /*
        ====================================================
        EMPLEADO
        ====================================================
        */

        if(
            tipo === "empleado" ||
            rol === "empleado"
        ){

            return {
                tipo: "empleado",
                datos: datos
            };

        }


        /*
        ====================================================
        CHOFER
        ====================================================
        */

        if(
            tipo === "chofer" ||
            rol === "chofer"
        ){

            return {
                tipo: "chofer",
                datos: datos
            };

        }


        /*
        ====================================================
        ADMINISTRADOR / EMPRESA
        ====================================================
        */

        if(
            tipo === "empresa" ||
            tipo === "administrador" ||
            tipo === "admin" ||
            rol === "administrador" ||
            rol === "admin"
        ){

            return {
                tipo: "empresa",
                datos: datos
            };

        }


        /*
        ====================================================
        SI TIENE empresaId PERO NO TIENE TIPO
        ====================================================
        */

        if(
            datos.empresaId ||
            datos.idEmpresa
        ){

            /*
            Puede ser un usuario de empresa.
            Si también existe empleadoId,
            lo tratamos como empleado.
            */

            if(
                datos.empleadoId
            ){

                return {
                    tipo: "empleado",
                    datos: datos
                };

            }


            return {
                tipo: "empresa",
                datos: datos
            };

        }

    }


    /*
    ========================================================
    2. RESPALDO: BUSCAR EN empleados
    ========================================================
    */

    console.log(
        "GESBASE: buscando usuario en empleados..."
    );


    let empleadosSnap = null;


    /*
    Buscar por uid
    */

    try{

        const consultaUid =
            query(
                collection(
                    db,
                    "empleados"
                ),
                where(
                    "uid",
                    "==",
                    usuario.uid
                )
            );


        empleadosSnap =
            await getDocs(
                consultaUid
            );

    }
    catch(error){

        console.log(
            "GESBASE: búsqueda por uid no disponible:",
            error
        );

    }


    if(
        empleadosSnap &&
        !empleadosSnap.empty
    ){

        const empleado =
            empleadosSnap.docs[0].data();


        return {
            tipo:
                String(
                    empleado.tipoEmpleado ||
                    ""
                ).toLowerCase() === "chofer"
                    ? "chofer"
                    : "empleado",

            datos:
                empleado
        };

    }


    /*
    ========================================================
    Buscar por email
    ========================================================
    */

    try{

        const consultaEmail =
            query(
                collection(
                    db,
                    "empleados"
                ),
                where(
                    "email",
                    "==",
                    usuario.email
                )
            );


        empleadosSnap =
            await getDocs(
                consultaEmail
            );


        if(
            !empleadosSnap.empty
        ){

            const empleado =
                empleadosSnap.docs[0].data();


            return {
                tipo:
                    String(
                        empleado.tipoEmpleado ||
                        ""
                    ).toLowerCase() === "chofer"
                        ? "chofer"
                        : "empleado",

                datos:
                    empleado
            };

        }

    }
    catch(error){

        console.log(
            "GESBASE: búsqueda por email no disponible:",
            error
        );

    }


    /*
    ========================================================
    NO ENCONTRADO
    ========================================================
    */

    return null;

}


/* =========================================================
   VERIFICAR ESTADO DEL EMPLEADO
========================================================= */

function empleadoEstaActivo(
    datos
){

    /*
    Si no existe estado,
    no bloqueamos por este campo.
    Esto permite compatibilidad
    con empleados antiguos.
    */

    if(
        datos.estado === undefined ||
        datos.estado === null ||
        datos.estado === ""
    ){

        return true;

    }


    const estado =
        String(
            datos.estado
        ).toLowerCase().trim();


    return (
        estado === "activo" ||
        estado === "active"
    );

}


/* =========================================================
   REDIRECCIÓN INTELIGENTE
========================================================= */

async function redireccionarUsuario(
    usuario
){

    const t =
        traducciones[
            idiomaActual
        ];


    mostrarMensaje(
        t.verificandoTipo,
        "exito"
    );


    try{

        const resultado =
            await detectarTipoUsuario(
                usuario
            );


        /*
        ====================================================
        NO ENCONTRADO
        ====================================================
        */

        if(!resultado){

            console.warn(
                "GESBASE: usuario sin clasificación."
            );


            mostrarMensaje(
                t.usuarioSinConfiguracion,
                "error"
            );


            botonLogin.disabled =
                false;

            botonLogin.textContent =
                t.iniciarSesion;

            return;

        }


        const datos =
            resultado.datos;


        /*
        ====================================================
        EMPLEADO / CHOFER
        ====================================================
        */

        if(
            resultado.tipo === "empleado" ||
            resultado.tipo === "chofer"
        ){

            /*
            Verificar que siga activo.
            */

            if(
                !empleadoEstaActivo(
                    datos
                )
            ){

                await signOut(auth);


                mostrarMensaje(
                    t.empleadoInactivo,
                    "error"
                );


                botonLogin.disabled =
                    false;

                botonLogin.textContent =
                    t.iniciarSesion;

                return;

            }


            /*
            Guardamos información mínima
            para que panel-empleado.html
            pueda utilizarla.
            */

            try{

                sessionStorage.setItem(
                    "gesbaseTipoUsuario",
                    resultado.tipo
                );


                if(
                    datos.empresaId
                ){

                    sessionStorage.setItem(
                        "gesbaseEmpresaId",
                        datos.empresaId
                    );

                }


                if(
                    datos.empleadoId
                ){

                    sessionStorage.setItem(
                        "gesbaseEmpleadoId",
                        datos.empleadoId
                    );

                }

            }
            catch(error){

                console.log(
                    "GESBASE: no se pudo guardar sesión auxiliar.",
                    error
                );

            }


            mostrarMensaje(
                resultado.tipo === "chofer"
                    ? t.accesoChofer
                    : t.accesoEmpleado,
                "exito"
            );


            window.location.replace(
                "panel-empleado.html"
            );


            return;

        }


        /*
        ====================================================
        EMPRESA
        ====================================================
        */

        if(
            resultado.tipo === "empresa"
        ){

            try{

                sessionStorage.setItem(
                    "gesbaseTipoUsuario",
                    "empresa"
                );


                if(
                    datos.empresaId
                ){

                    sessionStorage.setItem(
                        "gesbaseEmpresaId",
                        datos.empresaId
                    );

                }

            }
            catch(error){

                console.log(
                    "GESBASE: no se pudo guardar sesión auxiliar.",
                    error
                );

            }


            mostrarMensaje(
                t.accesoEmpresa,
                "exito"
            );


            window.location.replace(
                "index.html"
            );


            return;

        }

    }
    catch(error){

        console.error(
            "GESBASE: error detectando usuario:",
            error
        );


        mostrarDiagnostico(
            error
        );


        mostrarMensaje(
            idiomaActual === "en"
                ? "Could not verify the user type."
                : "No se pudo verificar el tipo de usuario.",
            "error"
        );


        botonLogin.disabled =
            false;

        botonLogin.textContent =
            t.iniciarSesion;

    }

}


/* =========================================================
   REGISTRO
========================================================= */

botonRegistro.addEventListener(
    "click",
    function(){

        window.location.href =
            "registro.html";

    }
);


/* =========================================================
   RECUPERAR CONTRASEÑA
========================================================= */

botonRecuperar.addEventListener(
    "click",
    async function(){

        const email =
            emailInput.value.trim();


        const t =
            traducciones[
                idiomaActual
            ];


        if(!email){

            mostrarMensaje(
                t.emailRecuperacion,
                "error"
            );

            emailInput.focus();

            return;

        }


        botonRecuperar.disabled =
            true;

        botonRecuperar.textContent =
            t.enviando;

        ocultarDiagnostico();


        try{

            await sendPasswordResetEmail(
                auth,
                email
            );


            mostrarMensaje(
                t.recuperarEnviado,
                "exito"
            );

        }
        catch(error){

            console.error(
                "ERROR RECUPERACIÓN:",
                error
            );


            mostrarDiagnostico(
                error
            );


            mostrarMensaje(
                obtenerMensajeError(
                    error,
                    "recuperacion"
                ),
                "error"
            );

        }


        botonRecuperar.disabled =
            false;

        botonRecuperar.textContent =
            t.olvidaste;

    }
);


/* =========================================================
   SESIÓN EXISTENTE
========================================================= */

let comprobandoSesion = false;


onAuthStateChanged(
    auth,
    async function(usuario){

        if(!usuario){

            return;

        }


        if(comprobandoSesion){

            return;

        }


        comprobandoSesion = true;


        console.log(
            "GESBASE - Usuario autenticado:",
            usuario.uid
        );


        await redireccionarUsuario(
            usuario
        );

    }
);


/* =========================================================
   LOGIN
========================================================= */

formulario.addEventListener(
    "submit",
    async function(evento){

        evento.preventDefault();


        const email =
            emailInput.value.trim();


        const password =
            passwordInput.value;


        const t =
            traducciones[
                idiomaActual
            ];


        if(
            !email ||
            !password
        ){

            mostrarMensaje(
                t.completar,
                "error"
            );

            return;

        }


        botonLogin.disabled =
            true;

        botonLogin.textContent =
            t.ingresando;


        ocultarDiagnostico();


        mostrarMensaje(
            t.verificando,
            "exito"
        );


        try{

            const resultado =
                await signInWithEmailAndPassword(
                    auth,
                    email,
                    password
                );


            console.log(
                "GESBASE - Login correcto:",
                resultado.user.uid
            );


            await redireccionarUsuario(
                resultado.user
            );

        }
        catch(error){

            console.error(
                "ERROR LOGIN:",
                error
            );


            mostrarDiagnostico(
                error
            );


            mostrarMensaje(
                obtenerMensajeError(
                    error,
                    "login"
                ),
                "error"
            );


            botonLogin.disabled =
                false;

            botonLogin.textContent =
                t.iniciarSesion;

        }

    }
);


/* =========================================================
   INICIAR
========================================================= */

traducirPagina();

</script>
