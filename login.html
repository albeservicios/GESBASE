/* =========================================================
   IDIOMA
========================================================= */

function obtenerIdiomaInicial(){

    const guardado =
        localStorage.getItem(
            "gesbaseIdioma"
        );

    if(
        guardado === "es" ||
        guardado === "en"
    ){

        return guardado;

    }

    const idiomaNavegador =
        (
            navigator.language ||
            "es"
        ).toLowerCase();

    return idiomaNavegador.startsWith("en")
        ? "en"
        : "es";

}

    document.title =
        idiomaActual === "en"
            ? "Sign in - GESBASE"

    document

            if(textos[clave]){

            }

        });

    selectorIdioma.value =

}

/* =========================================================
   ERROR FIREBASE
========================================================= */

function obtenerMensajeError(
    error,
    tipo
){

    const t =
        traducciones[idiomaActual];

    if(tipo === "login"){

        switch(error.code){

            case "auth/invalid-credential":
                return idiomaActual === "en"
                    ? "Email or password is incorrect."
                    : "Email o contraseña incorrectos.";

            case "auth/invalid-email":
                return t.emailInvalido;

            case "auth/user-not-found":
                return t.usuarioNoEncontrado;

            case "auth/wrong-password":
                return t.contraseñaIncorrecta;

            case "auth/user-disabled":
                return t.cuentaDeshabilitada;

            case "auth/too-many-requests":
                return t.demasiadosIntentos;

            case "auth/network-request-failed":
                return t.errorRed;

            case "auth/api-key-not-valid":
                return t.apiInvalida;

            case "auth/operation-not-allowed":
                return t.accesoNoHabilitado;

            default:
                return error.message ||
                    t.errorLogin;

        }

    }

    switch(error.code){

        case "auth/invalid-email":
            return t.emailInvalido;

        case "auth/user-not-found":
            return t.usuarioNoEncontrado;

        case "auth/too-many-requests":
            return t.demasiadosIntentos;

        case "auth/network-request-failed":
            return t.errorRed;

        case "auth/api-key-not-valid":
            return t.apiInvalida;

        default:
            return t.errorRecuperacion;

    }

}


/* =========================================================
   BUSCAR EMPLEADO DIRECTAMENTE
========================================================= */

async function buscarEmpleado(
    usuario
){

    /*
    PRIMERO buscamos por UID.
    */

    try{

        const consultaUid =
            query(
                collection(
                    db,
                    "empleados"
                ),
                where(
                    "uid",
                    "==",
                    usuario.uid
                )
            );

        const resultadoUid =
            await getDocs(
                consultaUid
            );

        if(
            !resultadoUid.empty
        ){

            const documento =
                resultadoUid.docs[0];

            return {

                id:
                    documento.id,

                datos:
                    documento.data()

            };

        }

    }
    catch(error){

        console.warn(
            "GESBASE: no se pudo buscar empleado por UID:",
            error
        );

    }


    /*
    SI NO APARECE, BUSCAMOS POR EMAIL.
    */

    if(usuario.email){

        try{

            const consultaEmail =
                query(
                    collection(
                        db,
                        "empleados"
                    ),
                    where(
                        "email",
                        "==",
                        usuario.email.toLowerCase()
                    )
                );

            const resultadoEmail =
                await getDocs(
                    consultaEmail
                );

            if(
                !resultadoEmail.empty
            ){

                const documento =
                    resultadoEmail.docs[0];

                return {

                    id:
                        documento.id,

                    datos:
                        documento.data()

                };

            }

        }
        catch(error){

            console.warn(
                "GESBASE: no se pudo buscar empleado por email:",
                error
            );

        }

    }


    return null;

}


/* =========================================================
   ESTADO DEL EMPLEADO
========================================================= */

function empleadoEstaHabilitado(
    datos
){

    /*
    ========================================================
    CAMPO PRINCIPAL
    ========================================================
    */

    if(
        datos.accesoHabilitado === false
    ){

        return false;

    }


    /*
    ========================================================
    ESTADOS BLOQUEADOS
    ========================================================
    */

    const estado =
        String(
            datos.estado ||
            ""
        )
        .toLowerCase()
        .trim();


    if(
        estado === "bloqueado" ||
        estado === "inactivo" ||
        estado === "deshabilitado" ||
        estado === "inactive" ||
        estado === "disabled"
    ){

        return false;

    }


    /*
    ========================================================
    TIPO BLOQUEADO
    ========================================================
    */

    const tipoAcceso =
        String(
            datos.tipoAcceso ||
            ""
        )
        .toLowerCase()
        .trim();


    if(
        tipoAcceso === "bloqueado"
    ){

        return false;

    }


    /*
    ========================================================
    COMPATIBILIDAD
    ========================================================
    */

    return true;

}


/* =========================================================
   OBTENER TIPO DE EMPLEADO
========================================================= */

function obtenerTipoEmpleado(
    datos
){

    const tipoEmpleado =
        String(
            datos.tipoEmpleado ||
            ""
        )
        .toLowerCase()
        .trim();


    const tipoAcceso =
        String(
            datos.tipoAcceso ||
            ""
        )
        .toLowerCase()
        .trim();


    const rol =
        String(
            datos.rol ||
            ""
        )
        .toLowerCase()
        .trim();


    if(
        tipoEmpleado === "chofer" ||
        tipoAcceso === "chofer" ||
        rol === "chofer"
    ){

        return "chofer";

    }


    return "empleado";

}


/* =========================================================
   DETECTAR TIPO DE USUARIO
========================================================= */

async function detectarTipoUsuario(
    usuario
){

    console.log(
        "GESBASE: detectando usuario:",
        usuario.uid,
        usuario.email
    );


    /*
    ========================================================
    1. PRIORIDAD ABSOLUTA:
       COLECCIÓN empleados
    ========================================================
    */

    const empleado =
        await buscarEmpleado(
            usuario
        );


    if(empleado){

        const datos =
            empleado.datos;


        const tipo =
            obtenerTipoEmpleado(
                datos
            );


        console.log(
            "GESBASE: EMPLEADO ENCONTRADO:",
            empleado.id,
            datos
        );


        return {

            tipo:
                tipo,

            empleadoId:
                empleado.id,

            datos:
                datos

        };

    }


    /*
    ========================================================
    2. SI NO ES EMPLEADO:
       BUSCAR usuarios/{uid}
    ========================================================
    */

    try{

        const usuarioRef =
            doc(
                db,
                "usuarios",
                usuario.uid
            );

        const usuarioSnap =
            await getDoc(
                usuarioRef
            );


        if(
            usuarioSnap.exists()
        ){

            const datos =
                usuarioSnap.data();


            console.log(
                "GESBASE: documento usuarios encontrado:",
                datos
            );


            const tipo =
                String(
                    datos.tipoUsuario ||
                    datos.tipo ||
                    ""
                )
                .toLowerCase()
                .trim();


            const rol =
                String(
                    datos.rol ||
                    ""
                )
                .toLowerCase()
                .trim();


            /*
            EMPLEADO
            */

            if(
                tipo === "empleado" ||
                rol === "empleado"
            ){

                return {

                    tipo:
                        "empleado",

                    empleadoId:
                        datos.empleadoId ||
                        "",

                    datos:
                        datos

                };

            }


            /*
            CHOFER
            */

            if(
                tipo === "chofer" ||
                rol === "chofer"
            ){

                return {

                    tipo:
                        "chofer",

                    empleadoId:
                        datos.empleadoId ||
                        "",

                    datos:
                        datos

                };

            }


            /*
            EMPRESA / ADMIN
            */

            if(
                tipo === "empresa" ||
                tipo === "administrador" ||
                tipo === "admin" ||
                rol === "administrador" ||
                rol === "admin"
            ){

                return {

                    tipo:
                        "empresa",

                    datos:
                        datos

                };

            }


            /*
            SI TIENE empresaId PERO NO empleadoId,
            LO TRATAMOS COMO EMPRESA.
            */

            if(
                datos.empresaId ||
                datos.idEmpresa
            ){

                if(
                    datos.empleadoId
                ){

                    return {

                        tipo:
                            "empleado",

                        empleadoId:
                            datos.empleadoId,

                        datos:
                            datos

                    };

                }


                return {

                    tipo:
                        "empresa",

                    datos:
                        datos

                };

            }

        }

    }
    catch(error){

        console.warn(
            "GESBASE: error leyendo usuarios:",
            error
        );

    }


    return null;

}


/* =========================================================
   REDIRECCIÓN INTELIGENTE
========================================================= */

async function redireccionarUsuario(
    usuario
){

    const t =
        traducciones[
            idiomaActual
        ];


    mostrarMensaje(
        t.verificandoTipo,
        "exito"
    );


    try{

        const resultado =
            await detectarTipoUsuario(
                usuario
            );


        /*
        ====================================================
        NO ENCONTRADO
        ====================================================
        */

        if(!resultado){

            console.warn(
                "GESBASE: usuario sin clasificación."
            );


            mostrarMensaje(
                t.usuarioSinConfiguracion,
                "error"
            );


            botonLogin.disabled =
                false;

            botonLogin.textContent =
                t.iniciarSesion;

            return;

        }


        const datos =
            resultado.datos;


        /*
        ====================================================
        EMPLEADO / CHOFER
        ====================================================
        */

        if(
            resultado.tipo === "empleado" ||
            resultado.tipo === "chofer"
        ){

            /*
            VERIFICAR ACCESO REAL
            */

            if(
                !empleadoEstaHabilitado(
                    datos
                )
            ){

                await signOut(
                    auth
                );


                mostrarMensaje(
                    t.empleadoInactivo,
                    "error"
                );


                botonLogin.disabled =
                    false;

                botonLogin.textContent =
                    t.iniciarSesion;

                return;

            }


            /*
            GUARDAR SESIÓN
            */

            try{

                sessionStorage.setItem(
                    "gesbaseTipoUsuario",
                    resultado.tipo
                );


                if(
                    datos.empresaId
                ){

                    sessionStorage.setItem(
                        "gesbaseEmpresaId",
                        datos.empresaId
                    );

                }


                if(
                    resultado.empleadoId
                ){

                    sessionStorage.setItem(
                        "gesbaseEmpleadoId",
                        resultado.empleadoId
                    );

                }

            }
            catch(error){

                console.warn(
                    "GESBASE: error guardando sesión auxiliar:",
                    error
                );

            }


            /*
            MENSAJE
            */

            mostrarMensaje(
                resultado.tipo === "chofer"
                    ? t.accesoChofer
                    : t.accesoEmpleado,
                "exito"
            );


            /*
            DESTINO
            */

            setTimeout(
                () => {

                    window.location.replace(
                        "panel-empleado.html"
                    );

                },
                150
            );


            return;

        }


        /*
        ====================================================
        EMPRESA
        ====================================================
        */

        if(
            resultado.tipo === "empresa"
        ){

            try{

                sessionStorage.setItem(
                    "gesbaseTipoUsuario",
                    "empresa"
                );


                const empresaId =
                    datos.empresaId ||
                    datos.idEmpresa ||
                    datos.empresa ||
                    "";


                if(empresaId){

                    sessionStorage.setItem(
                        "gesbaseEmpresaId",
                        empresaId
                    );

                }

            }
            catch(error){

                console.warn(
                    "GESBASE: error guardando empresa:",
                    error
                );

            }


            mostrarMensaje(
                t.accesoEmpresa,
                "exito"
            );


            setTimeout(
                () => {

                    window.location.replace(
                        "index.html"
                    );

                },
                150
            );


            return;

        }

    }
    catch(error){

        console.error(
            "GESBASE: error detectando usuario:",
            error
        );


        mostrarDiagnostico(
            error
        );


        mostrarMensaje(
            idiomaActual === "en"
                ? "Could not verify the user type."
                : "No se pudo verificar el tipo de usuario.",
            "error"
        );


        botonLogin.disabled =
            false;

        botonLogin.textContent =
            t.iniciarSesion;

    }

}

/* =========================================================

========================================================= */

botonRecuperar.addEventListener(
    "click",
    async function(){

        const email =
            emailInput.value.trim();


        const t =
            traducciones[
                idiomaActual
            ];


        if(!email){

            mostrarMensaje(
                t.emailRecuperacion,
                "error"
            );

            emailInput.focus();

            return;

        }


        botonRecuperar.disabled =
            true;

        botonRecuperar.textContent =
            t.enviando;

        ocultarDiagnostico();


        try{

            await sendPasswordResetEmail(
                auth,
                email
            );


            mostrarMensaje(
                t.recuperarEnviado,
                "exito"
            );

        }
        catch(error){

            console.error(
                "ERROR RECUPERACIÓN:",
                error
            );


            mostrarDiagnostico(
                error
            );


            mostrarMensaje(
                obtenerMensajeError(
                    error,
                    "recuperacion"
                ),
                "error"
            );

        }


        botonRecuperar.disabled =
            false;

        botonRecuperar.textContent =
            t.olvidaste;

    }
);


/* =========================================================
   SESIÓN EXISTENTE
========================================================= */

let comprobandoSesion = false;

onAuthStateChanged(
    auth,
    async function(usuario){

        if(!usuario){

            return;

        }


        if(comprobandoSesion){

            return;

        }


        comprobandoSesion = true;


        console.log(
            "GESBASE - Usuario autenticado:",
            usuario.uid
        );


        await redireccionarUsuario(
            usuario
        );

    }
);


/* =========================================================
   LOGIN
========================================================= */

formulario.addEventListener(
    "submit",
    async function(evento){

        evento.preventDefault();


        const email =
            emailInput.value.trim();


        const password =
            passwordInput.value;


        const t =
            traducciones[
                idiomaActual
            ];


        if(
            !email ||
            !password
        ){

            mostrarMensaje(
                t.completar,
                "error"
            );

            return;

        }


        botonLogin.disabled =
            true;

        botonLogin.textContent =
            t.ingresando;


        ocultarDiagnostico();


        mostrarMensaje(
            t.verificando,
            "exito"
        );


        try{

            const resultado =
                await signInWithEmailAndPassword(
                    auth,
                    email,
                    password
                );


            console.log(
                "GESBASE - Login correcto:",
                resultado.user.uid
            );


            await redireccionarUsuario(
                resultado.user
            );

        }
        catch(error){

            console.error(
                "ERROR LOGIN:",
                error
            );


            mostrarDiagnostico(
                error
            );


            mostrarMensaje(
                obtenerMensajeError(
                    error,
                    "login"
                ),
                "error"
            );


            botonLogin.disabled =
                false;

            botonLogin.textContent =
                t.iniciarSesion;

        }

    }
);

   INICIAR
========================================================= */

traducirPagina();
