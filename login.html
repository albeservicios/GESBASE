<!DOCTYPE html>
<html lang="es">

<head>

<meta charset="UTF-8">

<meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
>

<meta
    name="theme-color"
    content="#111827"
>

<title>Iniciar sesión - GESBASE</title>

<style>

*{
    box-sizing:border-box;
    margin:0;
    padding:0;
}

body{
    font-family:Arial,sans-serif;
    background:#f3f4f6;
    color:#111827;
    min-height:100vh;
}

.contenedor{
    width:100%;
    max-width:500px;
    min-height:100vh;
    margin:auto;
    background:white;
}

header{
    background:#111827;
    color:white;
    padding:30px 20px;
    text-align:center;
}

.logo{
    font-size:34px;
    font-weight:bold;
    letter-spacing:1px;
}

.subtitulo{
    margin-top:8px;
    font-size:14px;
    color:#d1d5db;
}

main{
    padding:25px 20px 35px;
}

h1{
    font-size:24px;
    margin-bottom:8px;
}

.descripcion{
    color:#6b7280;
    font-size:14px;
    line-height:1.5;
    margin-bottom:25px;
}

.campo{
    margin-bottom:18px;
}

label{
    display:block;
    font-size:14px;
    font-weight:bold;
    margin-bottom:7px;
}

input{
    width:100%;
    padding:14px;
    border:1px solid #d1d5db;
    border-radius:10px;
    font-size:16px;
    outline:none;
}

input:focus{
    border-color:#111827;
}

.boton{
    width:100%;
    border:none;
    border-radius:11px;
    padding:15px;
    font-size:16px;
    font-weight:bold;
    cursor:pointer;
    margin-top:8px;
}

.boton-principal{
    background:#111827;
    color:white;
}

.boton-principal:disabled{
    opacity:.6;
    cursor:not-allowed;
}

.boton-secundario{
    background:#e5e7eb;
    color:#111827;
}

.boton-recuperar{
    background:transparent;
    color:#2563eb;
    padding:10px;
    font-size:14px;
    margin-top:5px;
}

.boton-recuperar:hover{
    text-decoration:underline;
}

.mensaje{
    display:none;
    margin-top:18px;
    padding:13px;
    border-radius:10px;
    font-size:14px;
    line-height:1.4;
}

.mensaje.error{
    display:block;
    background:#fee2e2;
    color:#991b1b;
}

.mensaje.exito{
    display:block;
    background:#dcfce7;
    color:#166534;
}

.registro{
    text-align:center;
    margin-top:25px;
    color:#6b7280;
    font-size:14px;
}

.registro a{
    color:#111827;
    font-weight:bold;
    text-decoration:none;
}

</style>

</head>


<body>

<div class="contenedor">

<header>

<div class="logo">
GESBASE
</div>

<div class="subtitulo">
Gestión para empresas y profesionales
</div>

</header>


<main>

<h1>
Iniciar sesión
</h1>

<p class="descripcion">
Ingresá a tu cuenta para continuar utilizando GESBASE.
</p>


<form id="formLogin">


<div class="campo">

<label for="email">
Email
</label>

<input
    type="email"
    id="email"
    placeholder="ejemplo@email.com"
    autocomplete="email"
    required
>

</div>


<div class="campo">

<label for="password">
Contraseña
</label>

<input
    type="password"
    id="password"
    placeholder="Tu contraseña"
    autocomplete="current-password"
    required
>

</div>


<div
    id="mensaje"
    class="mensaje"
></div>


<button
    type="submit"
    id="btnLogin"
    class="boton boton-principal"
>
Iniciar sesión
</button>


<button
    type="button"
    id="btnRecuperar"
    class="boton boton-recuperar"
>
¿Olvidaste tu contraseña?
</button>


<button
    type="button"
    class="boton boton-secundario"
    id="btnRegistro"
>
Crear una cuenta
</button>


</form>


<div class="registro">

¿Todavía no tenés cuenta?

<a href="registro.html">
Registrate
</a>

</div>


</main>

</div>


<script type="module">


/* ==========================================
   FIREBASE
========================================== */

import {
    auth,
    db
} from "./Js/firebase.js";


import {
    signInWithEmailAndPassword,
    sendPasswordResetEmail,
    onAuthStateChanged,
    signOut
} from
"https://www.gstatic.com/firebasejs/12.1.0/firebase-auth.js";


import {
    doc,
    getDoc
} from
"https://www.gstatic.com/firebasejs/12.1.0/firebase-firestore.js";


/* ==========================================
   ELEMENTOS
========================================== */

const formulario =
document.getElementById(
    "formLogin"
);


const emailInput =
document.getElementById(
    "email"
);


const passwordInput =
document.getElementById(
    "password"
);


const mensaje =
document.getElementById(
    "mensaje"
);


const botonLogin =
document.getElementById(
    "btnLogin"
);


const botonRegistro =
document.getElementById(
    "btnRegistro"
);


const botonRecuperar =
document.getElementById(
    "btnRecuperar"
);


/* ==========================================
   MENSAJES
========================================== */

function mostrarMensaje(
    texto,
    tipo
){

    mensaje.textContent =
    texto;

    mensaje.className =
    "mensaje " + tipo;

}


/* ==========================================
   REGISTRO
========================================== */

botonRegistro.addEventListener(
    "click",
    function(){

        window.location.href =
        "registro.html";

    }
);


/* ==========================================
   RECUPERAR CONTRASEÑA
========================================== */

botonRecuperar.addEventListener(
    "click",
    async function(){

        const email =
        emailInput.value.trim();


        if(!email){

            mostrarMensaje(
                "Ingresá tu email para recibir el enlace de recuperación.",
                "error"
            );

            emailInput.focus();

            return;

        }


        botonRecuperar.disabled =
        true;

        botonRecuperar.textContent =
        "Enviando...";


        try{

            await sendPasswordResetEmail(
                auth,
                email
            );


            mostrarMensaje(
                "Te enviamos un correo para restablecer tu contraseña. Revisá también la carpeta de spam.",
                "exito"
            );

        }
        catch(error){

            console.error(
                "Error recuperación:",
                error
            );


            let texto =
            "No se pudo enviar el correo de recuperación.";


            switch(error.code){

                case "auth/invalid-email":

                    texto =
                    "El email no es válido.";

                    break;


                case "auth/user-not-found":

                    texto =
                    "No existe una cuenta con ese email.";

                    break;


                case "auth/too-many-requests":

                    texto =
                    "Demasiados intentos. Esperá unos minutos e intentá nuevamente.";

                    break;


                default:

                    texto =
                    "Error al recuperar la contraseña.";

            }


            mostrarMensaje(
                texto,
                "error"
            );

        }


        botonRecuperar.disabled =
        false;

        botonRecuperar.textContent =
        "¿Olvidaste tu contraseña?";

    }
);


/* ==========================================
   VERIFICAR USUARIO DE EMPRESA
========================================== */

async function verificarUsuarioEmpresa(
    usuario
){

    if(!usuario){

        return false;

    }


    /*
     * IMPORTANTE:
     *
     * El perfil de empresa se busca en:
     *
     * usuarios/{UID}
     *
     * usando el mismo UID de Firebase Authentication.
     */

    const referencia =
    doc(
        db,
        "usuarios",
        usuario.uid
    );


    const resultado =
    await getDoc(
        referencia
    );


    if(
        !resultado.exists()
    ){

        return false;

    }


    const datos =
    resultado.data();


    /*
     * Un usuario de empresa debe tener
     * empresaId asociado.
     */

    const empresaId =
    datos.empresaId;


    if(
        !empresaId ||
        String(
            empresaId
        ).trim() === ""
    ){

        return false;

    }


    /*
     * Si existe un estado y está inactivo,
     * no permitimos el acceso.
     */

    if(
        datos.estado &&
        String(
            datos.estado
        ).toLowerCase() !==
        "activo"
    ){

        return false;

    }


    return true;

}


/* ==========================================
   COMPROBAR SESIÓN EXISTENTE
========================================== */

onAuthStateChanged(
    auth,
    async function(usuario){

        /*
         * Si NO hay usuario autenticado,
         * simplemente mostramos el login.
         */

        if(!usuario){

            return;

        }


        try{

            const autorizado =
            await verificarUsuarioEmpresa(
                usuario
            );


            if(autorizado){

                /*
                 * Usuario autenticado y autorizado.
                 */

                window.location.replace(
                    "index.html"
                );

                return;

            }


            /*
             * Está autenticado en Firebase,
             * pero no tiene perfil de empresa válido.
             */

            await signOut(
                auth
            );


            mostrarMensaje(
                "Esta cuenta no tiene un perfil de empresa autorizado para ingresar a GESBASE.",
                "error"
            );

        }
        catch(error){

            console.error(
                "Error verificando sesión:",
                error
            );


            await signOut(
                auth
            );


            mostrarMensaje(
                "No se pudo verificar el acceso de la cuenta.",
                "error"
            );

        }

    }
);


/* ==========================================
   INICIAR SESIÓN
========================================== */

formulario.addEventListener(
    "submit",
    async function(evento){

        evento.preventDefault();


        const email =
        emailInput.value.trim();


        const password =
        passwordInput.value;


        if(!email || !password){

            mostrarMensaje(
                "Completá el email y la contraseña.",
                "error"
            );

            return;

        }


        botonLogin.disabled =
        true;

        botonLogin.textContent =
        "Verificando acceso...";


        try{

            /*
             * PRIMERA CAPA:
             * Firebase Authentication
             */

            const resultado =
            await signInWithEmailAndPassword(
                auth,
                email,
                password
            );


            const usuario =
            resultado.user;


            /*
             * SEGUNDA CAPA:
             * verificar que exista el usuario
             * de empresa en Firestore.
             */

            botonLogin.textContent =
            "Verificando empresa...";


            const autorizado =
            await verificarUsuarioEmpresa(
                usuario
            );


            if(!autorizado){

                /*
                 * Si está autenticado pero no
                 * corresponde a un usuario de
                 * empresa autorizado, cerramos
                 * inmediatamente la sesión.
                 */

                await signOut(
                    auth
                );


                throw new Error(
                    "Esta cuenta no tiene un perfil de empresa autorizado."
                );

            }


            mostrarMensaje(
                "Inicio de sesión correcto. Ingresando...",
                "exito"
            );


            /*
             * SOLO ACÁ permitimos entrar.
             */

            window.location.replace(
                "index.html"
            );

        }
        catch(error){

            console.error(
                "Error Firebase:",
                error
            );


            let texto =
            "No se pudo iniciar sesión.";


            switch(error.code){

                case "auth/invalid-credential":

                    texto =
                    "Email o contraseña incorrectos.";

                    break;


                case "auth/user-not-found":

                    texto =
                    "No existe una cuenta con ese email.";

                    break;


                case "auth/wrong-password":

                    texto =
                    "La contraseña es incorrecta.";

                    break;


                case "auth/invalid-email":

                    texto =
                    "El email no es válido.";

                    break;


                case "auth/too-many-requests":

                    texto =
                    "Demasiados intentos. Esperá unos minutos e intentá nuevamente.";

                    break;


                default:

                    texto =
                    error.message ||
                    "No se pudo verificar el acceso.";

            }


            mostrarMensaje(
                texto,
                "error"
            );


            botonLogin.disabled =
            false;

            botonLogin.textContent =
            "Iniciar sesión";

        }

    }
);

</script>


</body>

</html>
