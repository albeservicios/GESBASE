<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0, viewport-fit=cover"
    >

    <meta
        name="theme-color"
        content="#111827"
    >

    <meta
        name="description"
        content="GESBASE - Tu empresa. Todo organizado."
    >

    <title>Iniciar sesión - GESBASE</title>

    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        html,
        body {
            width: 100%;
            min-height: 100%;
        }

        body {
            font-family:
                -apple-system,
                BlinkMacSystemFont,
                "Segoe UI",
                Roboto,
                Arial,
                sans-serif;

            background:
                radial-gradient(
                    circle at top,
                    #1f2937 0%,
                    #111827 45%,
                    #0b1120 100%
                );

            color: #f9fafb;
            min-height: 100vh;

            display: flex;
            align-items: center;
            justify-content: center;

            padding: 20px;
        }

        .contenedor {
            width: 100%;
            max-width: 430px;
        }

        .tarjeta {
            width: 100%;

            background: rgba(17, 24, 39, 0.96);

            border: 1px solid rgba(255, 255, 255, 0.08);

            border-radius: 22px;

            padding: 30px 25px;

            box-shadow:
                0 25px 60px rgba(0, 0, 0, 0.45);

            backdrop-filter: blur(10px);
        }

        .cabecera {
            text-align: center;
            margin-bottom: 28px;
        }

        .logo {
            width: 68px;
            height: 68px;

            margin: 0 auto 16px;

            display: flex;
            align-items: center;
            justify-content: center;

            border-radius: 18px;

            background: linear-gradient(
                135deg,
                #2563eb,
                #1d4ed8
            );

            color: white;

            font-size: 36px;
            font-weight: 800;

            box-shadow:
                0 10px 30px rgba(37, 99, 235, 0.30);
        }

        .marca {
            font-size: 30px;
            font-weight: 800;
            letter-spacing: -1px;
        }

        .subtitulo {
            margin-top: 7px;

            color: #9ca3af;

            font-size: 14px;
            line-height: 1.5;
        }

        .titulo {
            font-size: 22px;
            font-weight: 700;

            margin-bottom: 8px;
        }

        .descripcion {
            color: #9ca3af;

            font-size: 14px;
            line-height: 1.5;

            margin-bottom: 23px;
        }

        .campo {
            margin-bottom: 17px;
        }

        .campo label {
            display: block;

            margin-bottom: 7px;

            color: #e5e7eb;

            font-size: 14px;
            font-weight: 600;
        }

        .input {
            width: 100%;

            height: 50px;

            padding: 0 15px;

            border-radius: 11px;

            border: 1px solid #374151;

            outline: none;

            background: #1f2937;

            color: #f9fafb;

            font-size: 15px;

            transition:
                border-color 0.2s,
                box-shadow 0.2s,
                background 0.2s;
        }

        .input::placeholder {
            color: #6b7280;
        }

        .input:focus {
            border-color: #3b82f6;

            background: #182235;

            box-shadow:
                0 0 0 3px rgba(59, 130, 246, 0.14);
        }

        .password-contenedor {
            position: relative;
        }

        .password-contenedor .input {
            padding-right: 52px;
        }

        .btn-mostrar {
            position: absolute;

            right: 7px;
            top: 7px;

            width: 36px;
            height: 36px;

            border: 0;
            border-radius: 8px;

            background: transparent;

            color: #9ca3af;

            cursor: pointer;

            font-size: 17px;
        }

        .btn-mostrar:hover {
            background: #374151;
            color: white;
        }

        .acciones {
            display: flex;
            justify-content: flex-end;

            margin-top: -4px;
            margin-bottom: 20px;
        }

        .btn-link {
            border: 0;
            background: transparent;

            color: #60a5fa;

            font-size: 13px;
            font-weight: 600;

            cursor: pointer;
        }

        .btn-link:hover {
            color: #93c5fd;
            text-decoration: underline;
        }

        .btn-login {
            width: 100%;

            min-height: 50px;

            border: 0;
            border-radius: 11px;

            background: #2563eb;

            color: white;

            font-size: 15px;
            font-weight: 700;

            cursor: pointer;

            transition:
                background 0.2s,
                transform 0.1s,
                opacity 0.2s;
        }

        .btn-login:hover {
            background: #1d4ed8;
        }

        .btn-login:active {
            transform: scale(0.99);
        }

        .btn-login:disabled {
            opacity: 0.65;
            cursor: not-allowed;
        }

        .mensaje {
            display: none;

            margin-top: 16px;

            padding: 12px 13px;

            border-radius: 10px;

            font-size: 13px;

            line-height: 1.45;
        }

        .mensaje.error {
            display: block;

            background: rgba(127, 29, 29, 0.25);

            border: 1px solid rgba(248, 113, 113, 0.35);

            color: #fca5a5;
        }

        .mensaje.exito {
            display: block;

            background: rgba(20, 83, 45, 0.25);

            border: 1px solid rgba(74, 222, 128, 0.3);

            color: #86efac;
        }

        .mensaje.info {
            display: block;

            background: rgba(30, 64, 175, 0.20);

            border: 1px solid rgba(96, 165, 250, 0.3);

            color: #93c5fd;
        }

        .pie {
            margin-top: 25px;

            padding-top: 18px;

            border-top: 1px solid rgba(255, 255, 255, 0.07);

            text-align: center;

            color: #6b7280;

            font-size: 12px;

            line-height: 1.5;
        }

        .idiomas {
            display: flex;
            justify-content: center;
            align-items: center;

            gap: 8px;

            margin-top: 15px;
        }

        .idioma {
            border: 0;
            background: transparent;

            color: #6b7280;

            cursor: pointer;

            font-size: 12px;
        }

        .idioma.activo {
            color: #60a5fa;
            font-weight: 700;
        }

        .separador {
            color: #374151;
        }

        .cargando {
            display: inline-flex;
            align-items: center;
            justify-content: center;

            gap: 8px;
        }

        .spinner {
            width: 16px;
            height: 16px;

            border: 2px solid rgba(255,255,255,0.35);
            border-top-color: white;

            border-radius: 50%;

            animation: girar 0.8s linear infinite;
        }

        @keyframes girar {
            to {
                transform: rotate(360deg);
            }
        }

        @media (max-width: 480px) {
            body {
                padding: 14px;
            }

            .tarjeta {
                padding: 26px 20px;
                border-radius: 18px;
            }

            .logo {
                width: 62px;
                height: 62px;
                font-size: 32px;
            }

            .marca {
                font-size: 27px;
            }

            .titulo {
                font-size: 21px;
            }
        }
    </style>
</head>

<body>

    <main class="contenedor">

        <section class="tarjeta">

            <header class="cabecera">

                <div class="logo">G</div>

                <div class="marca">
                    GESBASE
                </div>

                <div class="subtitulo">
                    Gestión para empresas y profesionales
                </div>

            </header>

            <div>

                <h1 class="titulo" id="tituloLogin">
                    Iniciar sesión
                </h1>

                <p class="descripcion" id="descripcionLogin">
                    Accedé a tu cuenta para administrar tu empresa,
                    empleados, clientes y operaciones.
                </p>

                <form id="formLogin" novalidate>

                    <div class="campo">

                        <label for="email" id="labelEmail">
                            Email
                        </label>

                        <input
                            type="email"
                            id="email"
                            class="input"
                            autocomplete="username"
                            inputmode="email"
                            placeholder="tu@email.com"
                            required
                        >

                    </div>

                    <div class="campo">

                        <label for="password" id="labelPassword">
                            Contraseña
                        </label>

                        <div class="password-contenedor">

                            <input
                                type="password"
                                id="password"
                                class="input"
                                autocomplete="current-password"
                                placeholder="Ingresá tu contraseña"
                                required
                            >

                            <button
                                type="button"
                                class="btn-mostrar"
                                id="btnMostrar"
                                aria-label="Mostrar contraseña"
                            >
                                👁
                            </button>

                        </div>

                    </div>

                    <div class="acciones">

                        <button
                            type="button"
                            class="btn-link"
                            id="btnRecuperar"
                        >
                            ¿Olvidaste tu contraseña?
                        </button>

                    </div>

                    <button
                        type="submit"
                        class="btn-login"
                        id="btnLogin"
                    >
                        Iniciar sesión
                    </button>

                    <div
                        id="mensaje"
                        class="mensaje"
                        role="alert"
                        aria-live="polite"
                    ></div>

                </form>

            </div>

            <footer class="pie">

                <div>
                    GESBASE
                    <br>
                    Tu empresa. Todo organizado.
                </div>

                <div class="idiomas">

                    <button
                        type="button"
                        class="idioma activo"
                        id="btnES"
                    >
                        Español
                    </button>

                    <span class="separador">|</span>

                    <button
                        type="button"
                        class="idioma"
                        id="btnEN"
                    >
                        English
                    </button>

                </div>

            </footer>

        </section>

    </main>

    <script type="module">

        import { auth, db } from "./Js/firebase.js";

        import {
            signInWithEmailAndPassword,
            sendPasswordResetEmail,
            onAuthStateChanged
        } from "https://www.gstatic.com/firebasejs/12.18.0/firebase-auth.js";

        import {
            doc,
            getDoc,
            collection,
            query,
            where,
            getDocs
        } from "https://www.gstatic.com/firebasejs/12.18.0/firebase-firestore.js";


        const formLogin = document.getElementById("formLogin");
        const emailInput = document.getElementById("email");
        const passwordInput = document.getElementById("password");
        const btnLogin = document.getElementById("btnLogin");
        const btnMostrar = document.getElementById("btnMostrar");
        const btnRecuperar = document.getElementById("btnRecuperar");
        const mensaje = document.getElementById("mensaje");

        const btnES = document.getElementById("btnES");
        const btnEN = document.getElementById("btnEN");

        const tituloLogin = document.getElementById("tituloLogin");
        const descripcionLogin = document.getElementById("descripcionLogin");
        const labelEmail = document.getElementById("labelEmail");
        const labelPassword = document.getElementById("labelPassword");


        let idioma = "es";
        let procesando = false;


        function mostrarMensaje(texto, tipo = "error") {

            mensaje.className = "mensaje " + tipo;
            mensaje.textContent = texto;

        }


        function limpiarMensaje() {

            mensaje.className = "mensaje";
            mensaje.textContent = "";

        }


        function establecerCargando(cargando) {

            btnLogin.disabled = cargando;

            if (cargando) {

                btnLogin.innerHTML = `
                    <span class="cargando">
                        <span class="spinner"></span>
                        ${idioma === "es" ? "Ingresando..." : "Signing in..."}
                    </span>
                `;

            } else {

                btnLogin.textContent =
                    idioma === "es"
                        ? "Iniciar sesión"
                        : "Sign in";

            }

        }


        function traducir(es) {

            idioma = es ? "es" : "en";

            if (es) {

                document.documentElement.lang = "es";

                tituloLogin.textContent = "Iniciar sesión";

                descripcionLogin.textContent =
                    "Accedé a tu cuenta para administrar tu empresa, empleados, clientes y operaciones.";

                labelEmail.textContent = "Email";

                labelPassword.textContent = "Contraseña";

                emailInput.placeholder = "tu@email.com";

                passwordInput.placeholder =
                    "Ingresá tu contraseña";

                btnRecuperar.textContent =
                    "¿Olvidaste tu contraseña?";

                if (!procesando) {
                    btnLogin.textContent = "Iniciar sesión";
                }

                btnES.classList.add("activo");
                btnEN.classList.remove("activo");

            } else {

                document.documentElement.lang = "en";

                tituloLogin.textContent = "Sign in";

                descripcionLogin.textContent =
                    "Access your account to manage your company, employees, customers and operations.";

                labelEmail.textContent = "Email";

                labelPassword.textContent = "Password";

                emailInput.placeholder = "you@email.com";

                passwordInput.placeholder =
                    "Enter your password";

                btnRecuperar.textContent =
                    "Forgot your password?";

                if (!procesando) {
                    btnLogin.textContent = "Sign in";
                }

                btnEN.classList.add("activo");
                btnES.classList.remove("activo");

            }

        }


        btnES.addEventListener("click", () => {

            traducir(true);

        });


        btnEN.addEventListener("click", () => {

            traducir(false);

        });


        btnMostrar.addEventListener("click", () => {

            const mostrar =
                passwordInput.type === "password";

            passwordInput.type =
                mostrar ? "text" : "password";

            btnMostrar.textContent =
                mostrar ? "🙈" : "👁";

        });


        function obtenerMensajeError(error) {

            if (!error || !error.code) {

                return idioma === "es"
                    ? "No se pudo iniciar sesión."
                    : "Unable to sign in.";

            }

            switch (error.code) {

                case "auth/invalid-email":

                    return idioma === "es"
                        ? "El email ingresado no es válido."
                        : "The email address is invalid.";

                case "auth/user-not-found":

                    return idioma === "es"
                        ? "No existe una cuenta con ese email."
                        : "No account was found with that email.";

                case "auth/wrong-password":

                    return idioma === "es"
                        ? "La contraseña es incorrecta."
                        : "The password is incorrect.";

                case "auth/invalid-credential":

                    return idioma === "es"
                        ? "El email o la contraseña son incorrectos."
                        : "The email or password is incorrect.";

                case "auth/user-disabled":

                    return idioma === "es"
                        ? "Esta cuenta está deshabilitada."
                        : "This account has been disabled.";

                case "auth/too-many-requests":

                    return idioma === "es"
                        ? "Demasiados intentos. Esperá unos minutos y volvé a intentar."
                        : "Too many attempts. Please wait a few minutes and try again.";

                case "auth/network-request-failed":

                    return idioma === "es"
                        ? "No hay conexión con Firebase. Revisá tu conexión a Internet."
                        : "Could not connect to Firebase. Check your Internet connection.";

                case "auth/operation-not-allowed":

                    return idioma === "es"
                        ? "El acceso con email y contraseña no está habilitado en Firebase."
                        : "Email/password authentication is not enabled in Firebase.";

                case "auth/api-key-not-valid":

                    return idioma === "es"
                        ? "La configuración de Firebase tiene una API Key inválida."
                        : "The Firebase configuration contains an invalid API key.";

                default:

                    return idioma === "es"
                        ? "Error de acceso: " + error.code
                        : "Login error: " + error.code;

            }

        }


        async function buscarEmpleado(uid, email) {

            try {

                const ref = doc(db, "empleados", uid);

                const snap = await getDoc(ref);

                if (snap.exists()) {

                    return {
                        id: snap.id,
                        ...snap.data()
                    };

                }

            } catch (error) {

                console.warn(
                    "No se pudo consultar empleados/" + uid,
                    error
                );

            }


            try {

                const q = query(
                    collection(db, "empleados"),
                    where("uid", "==", uid)
                );

                const resultado = await getDocs(q);

                if (!resultado.empty) {

                    const encontrado = resultado.docs[0];

                    return {
                        id: encontrado.id,
                        ...encontrado.data()
                    };

                }

            } catch (error) {

                console.warn(
                    "No se pudo buscar empleado por uid.",
                    error
                );

            }


            try {

                const q = query(
                    collection(db, "empleados"),
                    where("email", "==", email)
                );

                const resultado = await getDocs(q);

                if (!resultado.empty) {

                    const encontrado = resultado.docs[0];

                    return {
                        id: encontrado.id,
                        ...encontrado.data()
                    };

                }

            } catch (error) {

                console.warn(
                    "No se pudo buscar empleado por email.",
                    error
                );

            }


            return null;

        }


        async function buscarUsuario(uid) {

            try {

                const ref = doc(db, "usuarios", uid);

                const snap = await getDoc(ref);

                if (snap.exists()) {

                    return {
                        id: snap.id,
                        ...snap.data()
                    };

                }

            } catch (error) {

                console.warn(
                    "No se pudo consultar usuarios/" + uid,
                    error
                );

            }

            return null;

        }


        async function buscarEmpresa(uid, email, usuario) {

            const empresaId =
                usuario?.empresaId ||
                usuario?.idEmpresa ||
                usuario?.empresa ||
                null;


            if (empresaId) {

                try {

                    const ref =
                        doc(db, "empresas", empresaId);

                    const snap = await getDoc(ref);

                    if (snap.exists()) {

                        return {
                            id: snap.id,
                            ...snap.data()
                        };

                    }

                } catch (error) {

                    console.warn(
                        "No se pudo consultar la empresa.",
                        error
                    );

                }

            }


            try {

                const q = query(
                    collection(db, "empresas"),
                    where("propietarioUid", "==", uid)
                );

                const resultado = await getDocs(q);

                if (!resultado.empty) {

                    const encontrado = resultado.docs[0];

                    return {
                        id: encontrado.id,
                        ...encontrado.data()
                    };

                }

            } catch (error) {

                console.warn(
                    "No se pudo buscar empresa por propietarioUid.",
                    error
                );

            }


            try {

                const q = query(
                    collection(db, "empresas"),
                    where("email", "==", email)
                );

                const resultado = await getDocs(q);

                if (!resultado.empty) {

                    const encontrado = resultado.docs[0];

                    return {
                        id: encontrado.id,
                        ...encontrado.data()
                    };

                }

            } catch (error) {

                console.warn(
                    "No se pudo buscar empresa por email.",
                    error
                );

            }


            return null;

        }


        async function redireccionarUsuario(user) {

            const uid = user.uid;
            const email = user.email || "";


            /*
             * 1. PRIMERO BUSCAMOS EMPLEADO
             */

            const empleado =
                await buscarEmpleado(uid, email);


            if (empleado) {

                sessionStorage.setItem(
                    "gesbaseTipoUsuario",
                    "empleado"
                );

                sessionStorage.setItem(
                    "gesbaseEmpleadoId",
                    empleado.id
                );

                sessionStorage.setItem(
                    "gesbaseEmpleado",
                    JSON.stringify(empleado)
                );


                if (empleado.empresaId) {

                    sessionStorage.setItem(
                        "gesbaseEmpresaId",
                        empleado.empresaId
                    );

                }


                window.location.href =
                    "./panel-empleado.html";

                return;

            }


            /*
             * 2. BUSCAMOS USUARIO
             */

            const usuario =
                await buscarUsuario(uid);


            /*
             * 3. BUSCAMOS EMPRESA
             */

            const empresa =
                await buscarEmpresa(
                    uid,
                    email,
                    usuario
                );


            if (empresa) {

                sessionStorage.setItem(
                    "gesbaseTipoUsuario",
                    "empresa"
                );

                sessionStorage.setItem(
                    "gesbaseEmpresaId",
                    empresa.id
                );


                if (usuario) {

                    sessionStorage.setItem(
                        "gesbaseUsuario",
                        JSON.stringify(usuario)
                    );

                }


                sessionStorage.setItem(
                    "gesbaseEmpresa",
                    JSON.stringify(empresa)
                );


                window.location.href =
                    "./index.html";

                return;

            }


            /*
             * SI NO ENCONTRAMOS PERFIL
             */

            mostrarMensaje(
                idioma === "es"
                    ? "El acceso fue correcto, pero no encontramos un perfil de empresa o empleado asociado a esta cuenta."
                    : "Login successful, but no company or employee profile was found for this account.",
                "info"
            );

        }


        formLogin.addEventListener("submit", async (event) => {

            event.preventDefault();


            if (procesando) {
                return;
            }


            limpiarMensaje();


            const email =
                emailInput.value.trim();

            const password =
                passwordInput.value;


            if (!email) {

                mostrarMensaje(
                    idioma === "es"
                        ? "Ingresá tu email."
                        : "Enter your email."
                );

                emailInput.focus();

                return;

            }


            if (!password) {

                mostrarMensaje(
                    idioma === "es"
                        ? "Ingresá tu contraseña."
                        : "Enter your password."
                );

                passwordInput.focus();

                return;

            }


            procesando = true;

            establecerCargando(true);


            try {

                const credencial =
                    await signInWithEmailAndPassword(
                        auth,
                        email,
                        password
                    );


                mostrarMensaje(
                    idioma === "es"
                        ? "Acceso correcto. Cargando..."
                        : "Login successful. Loading...",
                    "exito"
                );


                await redireccionarUsuario(
                    credencial.user
                );


            } catch (error) {

                console.error(
                    "Error al iniciar sesión:",
                    error
                );


                mostrarMensaje(
                    obtenerMensajeError(error),
                    "error"
                );


            } finally {

                procesando = false;

                establecerCargando(false);

            }

        });


        btnRecuperar.addEventListener(
            "click",
            async () => {

                limpiarMensaje();


                const email =
                    emailInput.value.trim();


                if (!email) {

                    mostrarMensaje(
                        idioma === "es"
                            ? "Ingresá tu email primero para poder recuperar la contraseña."
                            : "Enter your email first to reset your password."
                    );

                    emailInput.focus();

                    return;

                }


                try {

                    await sendPasswordResetEmail(
                        auth,
                        email
                    );


                    mostrarMensaje(
                        idioma === "es"
                            ? "Te enviamos un email para restablecer tu contraseña."
                            : "We sent you an email to reset your password.",
                        "exito"
                    );


                } catch (error) {

                    console.error(
                        "Error recuperando contraseña:",
                        error
                    );


                    mostrarMensaje(
                        obtenerMensajeError(error),
                        "error"
                    );

                }

            }
        );


        /*
         * Si ya existe una sesión iniciada,
         * intentamos llevar al usuario directamente
         * a su panel.
         */

        onAuthStateChanged(
            auth,
            async (user) => {

                if (!user) {
                    return;
                }


                /*
                 * No redireccionamos inmediatamente
                 * mientras el usuario está ingresando.
                 */

                if (
                    document.activeElement ===
                    emailInput ||
                    document.activeElement ===
                    passwordInput
                ) {
                    return;
                }

            }
        );


        /*
         * Estado inicial
         */

        traducir(true);

    </script>

</body>

</html>
