<!DOCTYPE html>
<html lang="es-AR">

<head>

<meta charset="UTF-8">

<meta
    name="viewport"
    content="width=device-width, initial-scale=1.0, viewport-fit=cover"
>

<meta
    name="theme-color"
    content="#111827"
>

<meta
    name="description"
    content="GESBASE - Administración de notificaciones"
>

<title>GESBASE - Mandar Notificaciones</title>

<style>

*{
    box-sizing:border-box;
}

html,
body{
    margin:0;
    padding:0;
    min-height:100%;
    font-family:Arial,Helvetica,sans-serif;
    background:#f3f4f6;
    color:#111827;
}

body{
    padding:20px;
}

.contenedor{
    width:100%;
    max-width:700px;
    margin:0 auto;
}

.cabecera{
    background:#111827;
    color:white;
    border-radius:18px;
    padding:22px;
    margin-bottom:18px;
    box-shadow:0 8px 25px rgba(0,0,0,.12);
}

.cabecera h1{
    margin:0 0 7px 0;
    font-size:24px;
}

.cabecera p{
    margin:0;
    color:#d1d5db;
    font-size:14px;
}

.tarjeta{
    background:white;
    border-radius:18px;
    padding:22px;
    margin-bottom:18px;
    box-shadow:0 5px 20px rgba(0,0,0,.08);
}

label{
    display:block;
    font-weight:700;
    margin-bottom:7px;
    font-size:14px;
}

.campo{
    width:100%;
    border:1px solid #d1d5db;
    border-radius:12px;
    padding:13px 14px;
    font-size:15px;
    outline:none;
    background:#fff;
    margin-bottom:17px;
}

.campo:focus{
    border-color:#2563eb;
    box-shadow:0 0 0 3px rgba(37,99,235,.10);
}

textarea.campo{
    min-height:150px;
    resize:vertical;
}

select.campo{
    cursor:pointer;
}

.info{
    background:#eff6ff;
    border:1px solid #bfdbfe;
    color:#1e3a8a;
    border-radius:12px;
    padding:12px 14px;
    margin-bottom:18px;
    font-size:14px;
}

.aviso{
    display:none;
    border-radius:12px;
    padding:13px 15px;
    margin-bottom:18px;
    font-weight:600;
    font-size:14px;
}

.aviso.exito{
    display:block;
    background:#ecfdf5;
    color:#065f46;
    border:1px solid #a7f3d0;
}

.aviso.error{
    display:block;
    background:#fef2f2;
    color:#991b1b;
    border:1px solid #fecaca;
}

.boton{
    width:100%;
    border:0;
    border-radius:12px;
    padding:14px 16px;
    font-size:16px;
    font-weight:700;
    cursor:pointer;
    transition:.2s;
}

.boton:hover{
    opacity:.92;
}

.boton:disabled{
    opacity:.55;
    cursor:not-allowed;
}

.boton-enviar{
    background:#2563eb;
    color:white;
}

.boton-volver{
    background:#e5e7eb;
    color:#111827;
    margin-top:10px;
}

.separador{
    height:1px;
    background:#e5e7eb;
    margin:20px 0;
}

.estado{
    font-size:13px;
    color:#6b7280;
    margin-top:8px;
}

.oculto{
    display:none !important;
}

.cargando{
    color:#6b7280;
    font-size:14px;
}

.contador{
    display:inline-block;
    background:#111827;
    color:white;
    border-radius:20px;
    padding:5px 10px;
    font-size:12px;
    font-weight:700;
    margin-top:5px;
}

@media(max-width:600px){

    body{
        padding:12px;
    }

    .cabecera{
        padding:18px;
        border-radius:15px;
    }

    .cabecera h1{
        font-size:21px;
    }

    .tarjeta{
        padding:18px;
        border-radius:15px;
    }

    .campo{
        font-size:16px;
    }

}

</style>

</head>

<body>

<div class="contenedor">

    <div class="cabecera">

        <h1>🔔 Mandar Notificaciones</h1>

        <p>
            Panel exclusivo de administración GESBASE
        </p>

    </div>


    <div
        id="mensajeAcceso"
        class="aviso"
    ></div>


    <div
        id="panel"
        class="oculto"
    >

        <div class="tarjeta">

            <div class="info">

                Seleccioná un mensaje registrado para cargar
                automáticamente el título y el contenido.
                Podés modificarlo antes de enviarlo.

            </div>


            <label for="plantilla">
                📝 Mensaje registrado
            </label>

            <select
                id="plantilla"
                class="campo"
            >

                <option value="">
                    Seleccionar mensaje...
                </option>

                <option value="cobro">
                    💰 Cobro registrado
                </option>

                <option value="presupuesto">
                    📋 Presupuesto aprobado
                </option>

                <option value="trabajo">
                    🛠️ Nuevo trabajo asignado
                </option>

                <option value="finalizado">
                    ✅ Trabajo finalizado
                </option>

                <option value="pendiente">
                    ⚠️ Pago pendiente
                </option>

                <option value="aviso">
                    📢 Aviso importante
                </option>

                <option value="recordatorio">
                    🔔 Recordatorio
                </option>

            </select>


            <label for="destino">
                👤 Destinatario
            </label>

            <select
                id="destino"
                class="campo"
            >

                <option value="TODOS">
                    👥 Todos los usuarios
                </option>

            </select>

            <div
                id="estadoUsuarios"
                class="estado"
            >
                <span class="cargando">
                    Cargando usuarios...
                </span>
            </div>


            <div class="separador"></div>


            <label for="titulo">
                Título
            </label>

            <input
                type="text"
                id="titulo"
                class="campo"
                placeholder="Título de la notificación"
                maxlength="150"
            >


            <label for="mensaje">
                Mensaje
            </label>

            <textarea
                id="mensaje"
                class="campo"
                placeholder="Escribí el mensaje..."
                maxlength="2000"
            ></textarea>


            <button
                id="btnEnviar"
                class="boton boton-enviar"
                type="button"
            >
                📤 Enviar notificación
            </button>

        </div>


        <div class="tarjeta">

            <button
                id="btnVolver"
                class="boton boton-volver"
                type="button"
            >
                ← Volver al panel
            </button>

        </div>

    </div>

</div>


<script type="module">

import { auth, db } from "./Js/firebase.js";

import {
    collection,
    getDocs,
    addDoc,
    serverTimestamp
} from "https://www.gstatic.com/firebasejs/12.18.0/firebase-firestore.js";


// =========================================================
// CONFIGURACIÓN
// =========================================================

const EMAIL_ADMIN = "julianbattauz006@gmail.com";


// =========================================================
// ELEMENTOS
// =========================================================

const panel = document.getElementById("panel");
const mensajeAcceso = document.getElementById("mensajeAcceso");

const plantilla = document.getElementById("plantilla");
const destino = document.getElementById("destino");

const titulo = document.getElementById("titulo");
const mensaje = document.getElementById("mensaje");

const btnEnviar = document.getElementById("btnEnviar");
const btnVolver = document.getElementById("btnVolver");

const estadoUsuarios = document.getElementById("estadoUsuarios");


// =========================================================
// MENSAJES PREDEFINIDOS
// =========================================================

const mensajesRegistrados = {

    cobro: {
        titulo: "💰 Nuevo cobro registrado",
        mensaje:
            "Se ha registrado un nuevo cobro en tu cuenta de GESBASE."
    },

    presupuesto: {
        titulo: "📋 Presupuesto aprobado",
        mensaje:
            "Se ha registrado la aprobación de un presupuesto en GESBASE."
    },

    trabajo: {
        titulo: "🛠️ Nuevo trabajo asignado",
        mensaje:
            "Tenés un nuevo trabajo asignado. Ingresá a GESBASE para consultar los detalles."
    },

    finalizado: {
        titulo: "✅ Trabajo finalizado",
        mensaje:
            "El trabajo fue marcado como finalizado en GESBASE."
    },

    pendiente: {
        titulo: "⚠️ Pago pendiente",
        mensaje:
            "Tenés un pago pendiente registrado en GESBASE. Ingresá para consultar los detalles."
    },

    aviso: {
        titulo: "📢 Aviso importante",
        mensaje:
            "Tenés un nuevo aviso importante de GESBASE. Ingresá para consultar la información."
    },

    recordatorio: {
        titulo: "🔔 Recordatorio",
        mensaje:
            "Tenés un nuevo recordatorio en GESBASE."
    }

};


// =========================================================
// FUNCIONES DE INTERFAZ
// =========================================================

function mostrarExito(texto){

    mensajeAcceso.className = "aviso exito";
    mensajeAcceso.textContent = texto;

}


function mostrarError(texto){

    mensajeAcceso.className = "aviso error";
    mensajeAcceso.textContent = texto;

}


function ocultarAviso(){

    mensajeAcceso.className = "aviso";
    mensajeAcceso.textContent = "";

}


// =========================================================
// CARGAR MENSAJE REGISTRADO
// =========================================================

plantilla.addEventListener("change", function(){

    const seleccion = plantilla.value;

    if(!seleccion){

        titulo.value = "";
        mensaje.value = "";

        return;
    }

    const datos = mensajesRegistrados[seleccion];

    if(!datos){
        return;
    }

    titulo.value = datos.titulo;
    mensaje.value = datos.mensaje;

});


// =========================================================
// CARGAR USUARIOS
// =========================================================

async function cargarUsuarios(){

    try{

        estadoUsuarios.innerHTML =
            "Cargando usuarios...";

        const referencia =
            collection(db, "usuarios");

        const snapshot =
            await getDocs(referencia);

        let cantidad = 0;

        snapshot.forEach((documento) => {

            const usuario = documento.data();

            const nombre =
                String(usuario.nombre || "").trim();

            const apellido =
                String(usuario.apellido || "").trim();

            const email =
                String(usuario.email || "").trim();

            const nombreEmpresa =
                String(
                    usuario.nombreEmpresa ||
                    usuario.empresa ||
                    ""
                ).trim();

            const textoNombre =
                `${nombre} ${apellido}`.trim();

            let textoMostrar = textoNombre;

            if(!textoMostrar){

                textoMostrar =
                    email ||
                    nombreEmpresa ||
                    documento.id;

            }

            if(email){

                textoMostrar +=
                    ` - ${email}`;

            }

            const opcion =
                document.createElement("option");

            opcion.value =
                documento.id;

            opcion.textContent =
                textoMostrar;

            destino.appendChild(opcion);

            cantidad++;

        });

        estadoUsuarios.innerHTML =
            `<span class="contador">${cantidad} usuarios cargados</span>`;

    }catch(error){

        console.error(
            "Error cargando usuarios:",
            error
        );

        estadoUsuarios.innerHTML =
            "⚠️ No se pudieron cargar los usuarios.";

        mostrarError(
            "No se pudieron cargar los usuarios. Revisá las reglas de Firestore."
        );

    }

}


// =========================================================
// VERIFICAR ADMINISTRADOR
// =========================================================

function esAdministrador(){

    const usuarioActual =
        auth.currentUser;

    if(!usuarioActual){
        return false;
    }

    const email =
        String(
            usuarioActual.email || ""
        )
        .trim()
        .toLowerCase();

    return email ===
        EMAIL_ADMIN.toLowerCase();

}


// =========================================================
// INICIALIZAR PANEL
// =========================================================

auth.onAuthStateChanged(async function(usuarioActual){

    ocultarAviso();

    if(!usuarioActual){

        panel.classList.add("oculto");

        mostrarError(
            "⛔ Debés iniciar sesión para acceder."
        );

        setTimeout(function(){

            window.location.href =
                "login.html";

        },1500);

        return;
    }


    const email =
        String(
            usuarioActual.email || ""
        )
        .trim()
        .toLowerCase();


    if(email !== EMAIL_ADMIN.toLowerCase()){

        panel.classList.add("oculto");

        mostrarError(
            "⛔ No tenés autorización para acceder a este panel."
        );

        setTimeout(function(){

            window.location.href =
                "index.html";

        },1800);

        return;
    }


    panel.classList.remove("oculto");

    await cargarUsuarios();

});


// =========================================================
// ENVIAR NOTIFICACIÓN
// =========================================================

btnEnviar.addEventListener(
    "click",
    async function(){

        ocultarAviso();


        // -------------------------------------------------
        // VERIFICAR ADMIN NUEVAMENTE
        // -------------------------------------------------

        const usuarioActual =
            auth.currentUser;


        if(!usuarioActual){

            mostrarError(
                "⛔ La sesión no está activa."
            );

            return;
        }


        const emailActual =
            String(
                usuarioActual.email || ""
            )
            .trim()
            .toLowerCase();


        if(
            emailActual !==
            EMAIL_ADMIN.toLowerCase()
        ){

            mostrarError(
                "⛔ No tenés autorización para enviar notificaciones."
            );

            return;
        }


        // -------------------------------------------------
        // OBTENER DATOS
        // -------------------------------------------------

        const tituloTexto =
            titulo.value.trim();

        const mensajeTexto =
            mensaje.value.trim();

        const destinatario =
            destino.value;


        if(!tituloTexto){

            mostrarError(
                "⚠️ Ingresá un título."
            );

            titulo.focus();

            return;
        }


        if(!mensajeTexto){

            mostrarError(
                "⚠️ Ingresá un mensaje."
            );

            mensaje.focus();

            return;
        }


        if(!destinatario){

            mostrarError(
                "⚠️ Seleccioná un destinatario."
            );

            return;
        }


        // -------------------------------------------------
        // CONFIRMACIÓN
        // -------------------------------------------------

        let confirmacion;

        if(destinatario === "TODOS"){

            confirmacion =
                confirm(
                    "¿Querés enviar esta notificación a TODOS los usuarios?"
                );

        }else{

            confirmacion =
                confirm(
                    "¿Querés enviar esta notificación al usuario seleccionado?"
                );

        }


        if(!confirmacion){
            return;
        }


        // -------------------------------------------------
        // DESACTIVAR BOTÓN
        // -------------------------------------------------

        btnEnviar.disabled = true;

        btnEnviar.textContent =
            "⏳ Enviando...";


        try{

            let cantidadEnviada = 0;


            // =================================================
            // ENVIAR A TODOS
            // =================================================

            if(destinatario === "TODOS"){

                const referenciaUsuarios =
                    collection(
                        db,
                        "usuarios"
                    );

                const usuariosSnapshot =
                    await getDocs(
                        referenciaUsuarios
                    );


                for(
                    const documento
                    of usuariosSnapshot.docs
                ){

                    await addDoc(
                        collection(
                            db,
                            "notificaciones"
                        ),
                        {

                            uid:
                                documento.id,

                            titulo:
                                tituloTexto,

                            mensaje:
                                mensajeTexto,

                            leida:
                                false,

                            activa:
                                true,

                            tipo:
                                "administrador",

                            creadoPor:
                                usuarioActual.uid,

                            fecha:
                                serverTimestamp()

                        }
                    );


                    cantidadEnviada++;

                }

            }


            // =================================================
            // ENVIAR A UN USUARIO
            // =================================================

            else{

                await addDoc(
                    collection(
                        db,
                        "notificaciones"
                    ),
                    {

                        uid:
                            destinatario,

                        titulo:
                            tituloTexto,

                        mensaje:
                            mensajeTexto,

                        leida:
                            false,

                        activa:
                            true,

                        tipo:
                            "administrador",

                        creadoPor:
                            usuarioActual.uid,

                        fecha:
                            serverTimestamp()

                    }
                );


                cantidadEnviada = 1;

            }


            // -------------------------------------------------
            // RESULTADO
            // -------------------------------------------------

            mostrarExito(
                `✅ Notificación enviada correctamente a ${cantidadEnviada} usuario(s).`
            );


            // Limpiar selección y campos

            plantilla.value = "";

            titulo.value = "";

            mensaje.value = "";


        }catch(error){

            console.error(
                "Error enviando notificación:",
                error
            );

            mostrarError(
                "❌ No se pudo enviar la notificación. Revisá las reglas de Firestore."
            );

        }finally{

            btnEnviar.disabled = false;

            btnEnviar.textContent =
                "📤 Enviar notificación";

        }

    }
);


// =========================================================
// VOLVER
// =========================================================

btnVolver.addEventListener(
    "click",
    function(){

        window.location.href =
            "index.html";

    }
);

</script>

</body>

</html>
