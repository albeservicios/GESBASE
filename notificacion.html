<!DOCTYPE html>
<html lang="es-AR">

<head>

<meta charset="UTF-8">

<meta
    name="viewport"
    content="width=device-width, initial-scale=1.0, viewport-fit=cover"
>

<meta name="theme-color" content="#111827">

<title>GESBASE - Administrar Notificaciones</title>

<style>

*{
    box-sizing:border-box;
}

body{
    margin:0;
    font-family:Arial,Helvetica,sans-serif;
    background:#f3f4f6;
    color:#111827;
}

header{
    background:#111827;
    color:white;
    padding:18px;
}

.header-contenido{
    max-width:700px;
    margin:auto;
    display:flex;
    align-items:center;
    gap:12px;
}

.btn-volver{
    width:42px;
    height:42px;
    border:1px solid #374151;
    border-radius:10px;
    background:#1f2937;
    color:white;
    font-size:20px;
    cursor:pointer;
    flex-shrink:0;
}

.titulo{
    font-size:21px;
    font-weight:800;
}

.subtitulo{
    margin-top:4px;
    font-size:13px;
    color:#d1d5db;
}

.container{
    max-width:700px;
    margin:25px auto;
    padding:0 16px 40px;
}

.card{
    background:white;
    border-radius:16px;
    padding:22px;
    box-shadow:0 4px 15px rgba(0,0,0,.08);
}

h2{
    margin-top:0;
    font-size:20px;
}

label{
    display:block;
    margin-top:18px;
    margin-bottom:7px;
    font-weight:bold;
}

select,
input,
textarea{
    width:100%;
    padding:13px;
    border:1px solid #d1d5db;
    border-radius:10px;
    font-size:16px;
    background:white;
    color:#111827;
}

textarea{
    min-height:130px;
    resize:vertical;
}

button{
    width:100%;
    margin-top:22px;
    padding:14px;
    border:none;
    border-radius:10px;
    background:#111827;
    color:white;
    font-size:16px;
    font-weight:bold;
    cursor:pointer;
}

button:disabled{
    opacity:.6;
    cursor:not-allowed;
}

#estado{
    margin-top:15px;
    padding:12px;
    border-radius:10px;
    display:none;
    text-align:center;
    line-height:1.4;
}

.exito{
    background:#dcfce7;
    color:#166534;
}

.error{
    background:#fee2e2;
    color:#991b1b;
}

.info{
    background:#dbeafe;
    color:#1e40af;
}

.usuario-info{
    margin-top:12px;
    padding:10px;
    background:#f3f4f6;
    border-radius:8px;
    font-size:14px;
    display:none;
}

.volver{
    display:block;
    text-align:center;
    margin-top:18px;
    color:#111827;
    text-decoration:none;
    font-weight:bold;
}

.acceso-denegado{
    background:white;
    border-radius:16px;
    padding:30px 20px;
    text-align:center;
    box-shadow:0 4px 15px rgba(0,0,0,.08);
}

.acceso-denegado-icono{
    font-size:50px;
    margin-bottom:15px;
}

.acceso-denegado h2{
    color:#991b1b;
}

</style>

</head>

<body>


<header>

    <div class="header-contenido">

        <button
            class="btn-volver"
            id="btnVolver"
            type="button"
            aria-label="Volver"
        >
            ←
        </button>

        <div>

            <div class="titulo">
                🔔 Administrar Notificaciones
            </div>

            <div class="subtitulo">
                Panel exclusivo de administración GESBASE
            </div>

        </div>

    </div>

</header>


<div class="container">


    <!-- =====================================================
         ACCESO DENEGADO
    ====================================================== -->

    <div
        id="accesoDenegado"
        class="acceso-denegado"
        style="display:none;"
    >

        <div class="acceso-denegado-icono">
            🔒
        </div>

        <h2>
            Acceso no autorizado
        </h2>

        <p>
            No tenés permisos para acceder
            al administrador de notificaciones.
        </p>

        <button
            id="btnVolverDenegado"
            type="button"
        >
            ← Volver a GESBASE
        </button>

    </div>


    <!-- =====================================================
         PANEL
    ====================================================== -->

    <div
        id="panelNotificaciones"
        class="card"
        style="display:none;"
    >

        <h2>
            📤 Mandar notificación
        </h2>


        <label for="destinatario">
            Destinatario
        </label>


        <select id="destinatario">

            <option value="">
                Cargando usuarios...
            </option>

        </select>


        <div
            id="usuarioInfo"
            class="usuario-info"
        ></div>


        <label for="titulo">
            Título
        </label>


        <input
            type="text"
            id="titulo"
            placeholder="Ej: Nueva función disponible"
            maxlength="100"
        >


        <label for="mensaje">
            Mensaje
        </label>


        <textarea
            id="mensaje"
            placeholder="Escribí el mensaje..."
            maxlength="1000"
        ></textarea>


        <button
            id="btnMandar"
            type="button"
            disabled
        >
            📤 Mandar Notificación
        </button>


        <div id="estado"></div>

    </div>


    <a
        href="index.html"
        class="volver"
    >
        ← Volver a GESBASE
    </a>

</div>


<script type="module">


/* =========================================================
   FIREBASE
========================================================= */

import { auth, db } from "./Js/firebase.js";


import {
    collection,
    getDocs,
    addDoc,
    serverTimestamp
} from
"https://www.gstatic.com/firebasejs/12.18.0/firebase-firestore.js";


import {
    onAuthStateChanged
} from
"https://www.gstatic.com/firebasejs/12.18.0/firebase-auth.js";


/* =========================================================
   ADMINISTRADOR
========================================================= */

const EMAIL_ADMIN =
    "julianbattauz006@gmail.com";


/* =========================================================
   ELEMENTOS
========================================================= */

const destinatario =
    document.getElementById("destinatario");

const titulo =
    document.getElementById("titulo");

const mensaje =
    document.getElementById("mensaje");

const btnMandar =
    document.getElementById("btnMandar");

const estado =
    document.getElementById("estado");

const usuarioInfo =
    document.getElementById("usuarioInfo");

const panelNotificaciones =
    document.getElementById("panelNotificaciones");

const accesoDenegado =
    document.getElementById("accesoDenegado");

const btnVolver =
    document.getElementById("btnVolver");

const btnVolverDenegado =
    document.getElementById("btnVolverDenegado");


/* =========================================================
   VARIABLES
========================================================= */

let usuarios = [];

let usuarioAdministrador = null;


/* =========================================================
   VOLVER
========================================================= */

function volver(){

    window.location.href =
        "index.html";

}


btnVolver.addEventListener(
    "click",
    volver
);


btnVolverDenegado.addEventListener(
    "click",
    volver
);


/* =========================================================
   ESTADO
========================================================= */

function mostrarEstado(
    texto,
    tipo
){

    estado.textContent =
        texto;

    estado.className =
        tipo;

    estado.style.display =
        "block";

}


function ocultarEstado(){

    estado.style.display =
        "none";

}


/* =========================================================
   LIMPIAR TEXTO
========================================================= */

function limpiarTexto(valor){

    return String(
        valor || ""
    ).trim();

}


/* =========================================================
   VERIFICAR ADMIN
========================================================= */

onAuthStateChanged(
    auth,
    async (usuario) => {

        if(!usuario){

            window.location.href =
                "login.html";

            return;

        }


        const email =
            String(
                usuario.email || ""
            )
            .trim()
            .toLowerCase();


        if(
            email !==
            EMAIL_ADMIN.toLowerCase()
        ){

            panelNotificaciones.style.display =
                "none";

            accesoDenegado.style.display =
                "block";

            return;

        }


        /*
         * Usuario autorizado
         */

        usuarioAdministrador =
            usuario;


        accesoDenegado.style.display =
            "none";

        panelNotificaciones.style.display =
            "block";


        /*
         * Ahora cargamos los usuarios.
         */

        await cargarUsuarios();

    }
);


/* =========================================================
   CARGAR USUARIOS
========================================================= */

async function cargarUsuarios(){

    try{

        mostrarEstado(
            "Cargando usuarios...",
            "info"
        );


        const referencia =
            collection(
                db,
                "usuarios"
            );


        const snapshot =
            await getDocs(
                referencia
            );


        usuarios = [];


        destinatario.innerHTML =
            "";


        /*
         * OPCIÓN TODOS
         */

        const opcionTodos =
            document.createElement(
                "option"
            );


        opcionTodos.value =
            "TODOS";


        opcionTodos.textContent =
            "📢 Todos los usuarios";


        destinatario.appendChild(
            opcionTodos
        );


        /*
         * USUARIOS
         */

        snapshot.forEach(
            (documento) => {

                const datos =
                    documento.data();


                usuarios.push({

                    id:
                        documento.id,

                    ...datos

                });


                const opcion =
                    document.createElement(
                        "option"
                    );


                opcion.value =
                    documento.id;


                const nombre =
                    datos.nombre ||
                    datos.nombreCompleto ||
                    "Usuario";


                const apellido =
                    datos.apellido ||
                    "";


                const email =
                    datos.email ||
                    "";


                const textoNombre =
                    `${nombre} ${apellido}`
                    .trim();


                opcion.textContent =
                    textoNombre +
                    (
                        email
                        ? ` - ${email}`
                        : ""
                    );


                destinatario.appendChild(
                    opcion
                );

            }
        );


        /*
         * RESULTADO
         */

        if(
            usuarios.length === 0
        ){

            destinatario.innerHTML = `

                <option value="">
                    No hay usuarios registrados
                </option>

            `;


            btnMandar.disabled =
                true;


            mostrarEstado(
                "No se encontraron usuarios en la colección usuarios.",
                "error"
            );


            return;

        }


        /*
         * TODO CORRECTO
         */

        destinatario.value =
            "TODOS";


        btnMandar.disabled =
            false;


        mostrarEstado(
            `✅ ${usuarios.length} usuario${
                usuarios.length === 1
                ? ""
                : "s"
            } cargado${
                usuarios.length === 1
                ? ""
                : "s"
            }.`,
            "exito"
        );


        /*
         * Ocultar mensaje después de unos segundos
         */

        setTimeout(
            () => {

                ocultarEstado();

            },
            3000
        );


    }catch(error){

        console.error(
            "ERROR CARGANDO USUARIOS:",
            error
        );


        destinatario.innerHTML = `

            <option value="">
                Error al cargar usuarios
            </option>

        `;


        btnMandar.disabled =
            true;


        mostrarEstado(
            "❌ No se pudieron cargar los usuarios. " +
            "Revisá las reglas de Firestore.",
            "error"
        );

    }

}


/* =========================================================
   CAMBIO DE DESTINATARIO
========================================================= */

destinatario.addEventListener(
    "change",
    () => {

        const id =
            destinatario.value;


        if(
            !id ||
            id === "TODOS"
        ){

            usuarioInfo.style.display =
                "none";

            return;

        }


        const usuario =
            usuarios.find(
                u =>
                    u.id === id
            );


        if(!usuario){

            usuarioInfo.style.display =
                "none";

            return;

        }


        const nombre =
            `${usuario.nombre || ""} ${
                usuario.apellido || ""
            }`
            .trim();


        usuarioInfo.innerHTML = `

            <strong>
                Usuario seleccionado:
            </strong>

            <br>

            ${escaparHTML(
                nombre ||
                "Sin nombre"
            )}

            <br>

            ${escaparHTML(
                usuario.email ||
                "Sin email"
            )}

        `;


        usuarioInfo.style.display =
            "block";

    }
);


/* =========================================================
   MANDAR NOTIFICACIÓN
========================================================= */

btnMandar.addEventListener(
    "click",
    async () => {

        ocultarEstado();


        /*
         * VERIFICAR ADMIN NUEVAMENTE
         */

        const usuarioActual =
            auth.currentUser;


        if(!usuarioActual){

            mostrarEstado(
                "❌ La sesión expiró. Iniciá sesión nuevamente.",
                "error"
            );

            return;

        }


        const emailActual =
            String(
                usuarioActual.email || ""
            )
            .trim()
            .toLowerCase();


        if(
            emailActual !==
            EMAIL_ADMIN.toLowerCase()
        ){

            mostrarEstado(
                "⛔ No tenés autorización para enviar notificaciones.",
                "error"
            );

            return;

        }


        const destino =
            destinatario.value;


        const tituloTexto =
            limpiarTexto(
                titulo.value
            );


        const mensajeTexto =
            limpiarTexto(
                mensaje.value
            );


        /*
         * VALIDACIONES
         */

        if(!destino){

            mostrarEstado(
                "Seleccioná un destinatario.",
                "error"
            );

            return;

        }


        if(!tituloTexto){

            mostrarEstado(
                "Escribí un título.",
                "error"
            );

            titulo.focus();

            return;

        }


        if(!mensajeTexto){

            mostrarEstado(
                "Escribí el mensaje.",
                "error"
            );

            mensaje.focus();

            return;

        }


        btnMandar.disabled =
            true;


        mostrarEstado(
            "Enviando notificación...",
            "info"
        );


        try{


            /* =================================================
               TODOS
            ================================================= */

            if(
                destino ===
                "TODOS"
            ){

                let enviados =
                    0;


                for(
                    const usuario
                    of usuarios
                ){

                    await addDoc(
                        collection(
                            db,
                            "notificaciones"
                        ),
                        {

                            uid:
                                usuario.id,

                            titulo:
                                tituloTexto,

                            mensaje:
                                mensajeTexto,

                            leida:
                                false,

                            activa:
                                true,

                            tipo:
                                "administrador",

                            creadoPor:
                                usuarioActual.uid,

                            fecha:
                                serverTimestamp()

                        }
                    );


                    enviados++;

                }


                mostrarEstado(
                    `✅ Notificación enviada a ${enviados} usuarios.`,
                    "exito"
                );

            }


            /* =================================================
               UN SOLO USUARIO
            ================================================= */

            else{

                await addDoc(
                    collection(
                        db,
                        "notificaciones"
                    ),
                    {

                        uid:
                            destino,

                        titulo:
                            tituloTexto,

                        mensaje:
                            mensajeTexto,

                        leida:
                            false,

                        activa:
                            true,

                        tipo:
                            "administrador",

                        creadoPor:
                            usuarioActual.uid,

                        fecha:
                            serverTimestamp()

                    }
                );


                const usuario =
                    usuarios.find(
                        u =>
                            u.id ===
                            destino
                    );


                const nombre =
                    usuario?.nombre ||
                    "usuario";


                mostrarEstado(
                    `✅ Notificación enviada a ${nombre}.`,
                    "exito"
                );

            }


            /*
             * LIMPIAR
             */

            titulo.value =
                "";

            mensaje.value =
                "";

            destinatario.value =
                "TODOS";

            usuarioInfo.style.display =
                "none";


        }catch(error){

            console.error(
                "ERROR ENVIANDO NOTIFICACIÓN:",
                error
            );


            mostrarEstado(
                "❌ No se pudo enviar la notificación. " +
                "Revisá las reglas de Firestore.",
                "error"
            );

        }finally{

            btnMandar.disabled =
                false;

        }

    }
);


/* =========================================================
   SEGURIDAD HTML
========================================================= */

function escaparHTML(texto){

    return String(
        texto || ""
    )
    .replace(
        /&/g,
        "&amp;"
    )
    .replace(
        /</g,
        "&lt;"
    )
    .replace(
        />/g,
        "&gt;"
    )
    .replace(
        /"/g,
        "&quot;"
    )
    .replace(
        /'/g,
        "&#039;"
    );

}

</script>

</body>

</html>
