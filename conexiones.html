<!DOCTYPE html>
<html lang="es-AR">
<head>
    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0, viewport-fit=cover"
    >

    <meta name="theme-color" content="#12343B">

    <meta
        name="description"
        content="Conexiones - Red GESBASE"
    >

    <title>Conexiones - Red GESBASE</title>

    <style>

        *{
            box-sizing:border-box;
            margin:0;
            padding:0;
        }

        body{
            font-family:Arial,Helvetica,sans-serif;
            background:#f3f6f7;
            color:#12343B;
        }

        header{
            background:#12343B;
            color:white;
            padding:16px;
            position:sticky;
            top:0;
            z-index:100;
            box-shadow:0 2px 8px rgba(0,0,0,.15);
        }

        .header-inner{
            max-width:1100px;
            margin:auto;
            display:flex;
            align-items:center;
            justify-content:space-between;
            gap:15px;
        }

        .logo{
            font-size:22px;
            font-weight:bold;
        }

        .volver{
            border:0;
            background:white;
            color:#12343B;
            padding:9px 14px;
            border-radius:8px;
            cursor:pointer;
            font-weight:bold;
        }

        main{
            max-width:1100px;
            margin:0 auto;
            padding:20px 15px 50px;
        }

        h1{
            font-size:28px;
            margin-bottom:6px;
        }

        .subtitulo{
            color:#60757a;
            margin-bottom:20px;
        }

        .buscador{
            background:white;
            padding:16px;
            border-radius:14px;
            box-shadow:0 2px 8px rgba(0,0,0,.08);
            margin-bottom:20px;
        }

        .buscador-row{
            display:flex;
            gap:10px;
        }

        input,
        select{
            width:100%;
            padding:13px;
            border:1px solid #ccd7da;
            border-radius:9px;
            font-size:15px;
            outline:none;
        }

        input:focus,
        select:focus{
            border-color:#12343B;
        }

        .btn{
            border:0;
            border-radius:9px;
            padding:12px 16px;
            cursor:pointer;
            font-weight:bold;
            font-size:14px;
        }

        .btn-principal{
            background:#12343B;
            color:white;
        }

        .btn-secundario{
            background:#e7eef0;
            color:#12343B;
        }

        .btn-aceptar{
            background:#198754;
            color:white;
        }

        .btn-rechazar{
            background:#dc3545;
            color:white;
        }

        .btn:disabled{
            opacity:.55;
            cursor:not-allowed;
        }

        .tabs{
            display:flex;
            gap:8px;
            margin-bottom:18px;
            flex-wrap:wrap;
        }

        .tab{
            border:0;
            background:white;
            color:#12343B;
            padding:11px 16px;
            border-radius:9px;
            cursor:pointer;
            font-weight:bold;
            box-shadow:0 1px 5px rgba(0,0,0,.06);
        }

        .tab.activo{
            background:#12343B;
            color:white;
        }

        .seccion{
            display:none;
        }

        .seccion.activa{
            display:block;
        }

        .grid{
            display:grid;
            grid-template-columns:repeat(2,minmax(0,1fr));
            gap:15px;
        }

        .card{
            background:white;
            border-radius:14px;
            padding:17px;
            box-shadow:0 2px 8px rgba(0,0,0,.08);
        }

        .perfil{
            display:flex;
            align-items:center;
            gap:14px;
            margin-bottom:14px;
        }

        .foto{
            width:58px;
            height:58px;
            border-radius:50%;
            background:#dce7e9;
            display:flex;
            align-items:center;
            justify-content:center;
            overflow:hidden;
            flex-shrink:0;
            font-size:25px;
        }

        .foto img{
            width:100%;
            height:100%;
            object-fit:cover;
        }

        .nombre{
            font-size:18px;
            font-weight:bold;
            margin-bottom:4px;
        }

        .detalle{
            color:#687b80;
            font-size:14px;
            line-height:1.5;
        }

        .acciones{
            display:flex;
            gap:8px;
            flex-wrap:wrap;
        }

        .mensaje{
            background:white;
            border-radius:12px;
            padding:20px;
            text-align:center;
            color:#687b80;
            box-shadow:0 2px 8px rgba(0,0,0,.06);
        }

        .cargando{
            text-align:center;
            padding:25px;
            color:#687b80;
        }

        .estado{
            display:inline-block;
            margin-top:6px;
            padding:5px 9px;
            border-radius:20px;
            font-size:12px;
            font-weight:bold;
            background:#fff3cd;
            color:#856404;
        }

        .estado.aceptada{
            background:#d1e7dd;
            color:#0f5132;
        }

        .estado.rechazada{
            background:#f8d7da;
            color:#842029;
        }

        .error{
            background:#f8d7da;
            color:#842029;
            padding:12px;
            border-radius:9px;
            margin-bottom:15px;
            display:none;
        }

        @media(max-width:700px){

            main{
                padding:15px 10px 40px;
            }

            h1{
                font-size:24px;
            }

            .buscador-row{
                flex-direction:column;
            }

            .grid{
                grid-template-columns:1fr;
            }

            .header-inner{
                align-items:flex-start;
            }

            .logo{
                font-size:19px;
            }

        }

    </style>
</head>

<body>

<header>

    <div class="header-inner">

        <div class="logo">
            🤝 Red GESBASE
        </div>

        <button class="volver" id="btnVolver">
            ← Volver
        </button>

    </div>

</header>


<main>

    <h1>Conexiones</h1>

    <p class="subtitulo">
        Encontrá personas, profesionales, trabajadores, empresas y comercios.
    </p>


    <div class="error" id="mensajeError"></div>


    <!-- BUSCADOR -->

    <div class="buscador">

        <div class="buscador-row">

            <input
                type="search"
                id="busqueda"
                placeholder="Buscar por nombre, rubro o localidad..."
                autocomplete="off"
            >

            <select id="tipoFiltro">

                <option value="">Todos</option>
                <option value="persona">Personas</option>
                <option value="profesional">Profesionales</option>
                <option value="trabajador">Trabajadores</option>
                <option value="empresa">Empresas</option>
                <option value="comercio">Comercios</option>

            </select>

            <button
                class="btn btn-principal"
                id="btnBuscar"
            >
                Buscar
            </button>

        </div>

    </div>


    <!-- TABS -->

    <div class="tabs">

        <button
            class="tab activo"
            data-tab="buscar"
        >
            🔎 Buscar
        </button>

        <button
            class="tab"
            data-tab="solicitudes"
        >
            📩 Solicitudes
        </button>

        <button
            class="tab"
            data-tab="conectados"
        >
            👥 Mis conexiones
        </button>

    </div>


    <!-- BUSCAR -->

    <section
        id="seccionBuscar"
        class="seccion activa"
    >

        <div
            id="resultados"
            class="grid"
        >

            <div class="mensaje">
                Escribí algo para buscar personas o empresas.
            </div>

        </div>

    </section>


    <!-- SOLICITUDES -->

    <section
        id="seccionSolicitudes"
        class="seccion"
    >

        <div
            id="solicitudes"
            class="grid"
        >

            <div class="cargando">
                Cargando solicitudes...
            </div>

        </div>

    </section>


    <!-- CONECTADOS -->

    <section
        id="seccionConectados"
        class="seccion"
    >

        <div
            id="conectados"
            class="grid"
        >

            <div class="cargando">
                Cargando conexiones...
            </div>

        </div>

    </section>

</main>


<script type="module">

import { auth, db } from "./firebase.js";

import {
    collection,
    getDocs,
    addDoc,
    query,
    where,
    serverTimestamp,
    updateDoc,
    doc
} from "https://www.gstatic.com/firebasejs/12.18.0/firebase-firestore.js";


/* ==========================================
   ELEMENTOS
========================================== */

const busqueda = document.getElementById("busqueda");
const tipoFiltro = document.getElementById("tipoFiltro");
const btnBuscar = document.getElementById("btnBuscar");

const resultados = document.getElementById("resultados");
const solicitudes = document.getElementById("solicitudes");
const conectados = document.getElementById("conectados");

const mensajeError = document.getElementById("mensajeError");

const seccionBuscar = document.getElementById("seccionBuscar");
const seccionSolicitudes = document.getElementById("seccionSolicitudes");
const seccionConectados = document.getElementById("seccionConectados");


let usuarioActual = null;
let directorio = [];
let conexiones = [];


/* ==========================================
   UTILIDADES
========================================== */

function mostrarError(mensaje){

    mensajeError.textContent = mensaje;
    mensajeError.style.display = "block";

}

function ocultarError(){

    mensajeError.textContent = "";
    mensajeError.style.display = "none";

}


function normalizar(texto){

    return String(texto || "")
        .toLowerCase()
        .normalize("NFD")
        .replace(/[\u0300-\u036f]/g,"");

}


function escaparHTML(texto){

    return String(texto || "")
        .replace(/&/g,"&amp;")
        .replace(/</g,"&lt;")
        .replace(/>/g,"&gt;")
        .replace(/"/g,"&quot;")
        .replace(/'/g,"&#039;");

}


/* ==========================================
   AUTENTICACIÓN
========================================== */

auth.onAuthStateChanged(async (user) => {

    if(!user){

        window.location.href = "red-login.html";
        return;

    }

    usuarioActual = user;

    await cargarDirectorio();
    await cargarConexiones();

});


/* ==========================================
   CARGAR DIRECTORIO
========================================== */

async function cargarDirectorio(){

    resultados.innerHTML = `
        <div class="cargando">
            Cargando personas y empresas...
        </div>
    `;

    try{

        const snapshot = await getDocs(
            collection(db,"directorio_red")
        );

        directorio = [];

        snapshot.forEach((docSnap) => {

            const datos = docSnap.data();

            if(
                datos.uid &&
                datos.uid !== usuarioActual.uid &&
                datos.activo !== false
            ){

                directorio.push({
                    id: docSnap.id,
                    ...datos
                });

            }

        });

        mostrarResultados();

    }catch(error){

        console.error(error);

        mostrarError(
            "No se pudo cargar el directorio de Red GESBASE."
        );

        resultados.innerHTML = `
            <div class="mensaje">
                No se pudieron cargar los usuarios.
            </div>
        `;

    }

}


/* ==========================================
   MOSTRAR RESULTADOS
========================================== */

function mostrarResultados(){

    ocultarError();

    const texto = normalizar(busqueda.value);
    const tipo = normalizar(tipoFiltro.value);

    let lista = directorio.filter((persona) => {

        const contenido = normalizar(
            `${persona.nombreCompleto || ""} ${persona.rubro || ""} ${persona.localidad || ""} ${persona.provincia || ""}`
        );

        const coincideTexto =
            !texto || contenido.includes(texto);

        const coincideTipo =
            !tipo || normalizar(persona.tipo) === tipo;

        return coincideTexto && coincideTipo;

    });


    if(lista.length === 0){

        resultados.innerHTML = `
            <div class="mensaje">
                No encontramos resultados.
            </div>
        `;

        return;

    }


    resultados.innerHTML = lista.map((persona) => {

        const estado = obtenerEstadoConexion(persona.uid);

        let boton = "";

        if(estado === "aceptada"){

            boton = `
                <button
                    class="btn btn-secundario"
                    disabled
                >
                    ✓ Ya están conectados
                </button>
            `;

        }else if(estado === "pendiente_enviada"){

            boton = `
                <button
                    class="btn btn-secundario"
                    disabled
                >
                    Solicitud enviada
                </button>
            `;

        }else if(estado === "pendiente_recibida"){

            boton = `
                <button
                    class="btn btn-aceptar"
                    data-aceptar-desde-busqueda="${persona.uid}"
                >
                    Aceptar solicitud
                </button>
            `;

        }else{

            boton = `
                <button
                    class="btn btn-principal"
                    data-conectar="${persona.uid}"
                >
                    🤝 Conectar
                </button>
            `;

        }


        return `

            <article class="card">

                <div class="perfil">

                    <div class="foto">

                        ${
                            persona.fotoURL
                            ?
                            `<img src="${escaparHTML(persona.fotoURL)}" alt="">`
                            :
                            `👤`
                        }

                    </div>

                    <div>

                        <div class="nombre">
                            ${escaparHTML(persona.nombreCompleto || "Usuario")}
                        </div>

                        <div class="detalle">

                            ${escaparHTML(persona.tipo || "")}

                            ${
                                persona.rubro
                                ?
                                ` · ${escaparHTML(persona.rubro)}`
                                :
                                ""
                            }

                            ${
                                persona.localidad
                                ?
                                `<br>📍 ${escaparHTML(persona.localidad)}${persona.provincia ? `, ${escaparHTML(persona.provincia)}` : ""}`
                                :
                                ""
                            }

                        </div>

                    </div>

                </div>


                ${
                    persona.descripcion
                    ?
                    `
                    <div class="detalle" style="margin-bottom:14px;">
                        ${escaparHTML(persona.descripcion)}
                    </div>
                    `
                    :
                    ""
                }


                <div class="acciones">

                    ${boton}

                </div>

            </article>

        `;

    }).join("");


    agregarEventosResultados();

}


/* ==========================================
   EVENTOS RESULTADOS
========================================== */

function agregarEventosResultados(){

    document.querySelectorAll("[data-conectar]").forEach((boton) => {

        boton.addEventListener("click", async () => {

            const receptorUid = boton.dataset.conectar;

            await enviarSolicitud(receptorUid, boton);

        });

    });


    document.querySelectorAll("[data-aceptar-desde-busqueda]").forEach((boton) => {

        boton.addEventListener("click", async () => {

            const emisorUid =
                boton.dataset.aceptarDesdeBusqueda;

            await aceptarSolicitudPorUid(
                emisorUid,
                boton
            );

        });

    });

}


/* ==========================================
   ESTADO DE CONEXIÓN
========================================== */

function obtenerEstadoConexion(uid){

    const conexion = conexiones.find((item) => {

        return (
            (item.emisor === usuarioActual.uid && item.receptor === uid) ||
            (item.receptor === usuarioActual.uid && item.emisor === uid)
        );

    });


    if(!conexion){
        return "ninguna";
    }


    if(conexion.estado === "aceptada"){
        return "aceptada";
    }


    if(
        conexion.estado === "pendiente" &&
        conexion.emisor === usuarioActual.uid
    ){

        return "pendiente_enviada";

    }


    if(
        conexion.estado === "pendiente" &&
        conexion.receptor === usuarioActual.uid
    ){

        return "pendiente_recibida";

    }


    return conexion.estado || "ninguna";

}


/* ==========================================
   CARGAR CONEXIONES
========================================== */

async function cargarConexiones(){

    try{

        conexiones = [];

        const enviadosQuery = query(
            collection(db,"conexiones"),
            where("emisor","==",usuarioActual.uid)
        );

        const recibidosQuery = query(
            collection(db,"conexiones"),
            where("receptor","==",usuarioActual.uid)
        );


        const [enviados, recibidos] = await Promise.all([
            getDocs(enviadosQuery),
            getDocs(recibidosQuery)
        ]);


        enviados.forEach((docSnap) => {

            conexiones.push({
                id:docSnap.id,
                ...docSnap.data()
            });

        });


        recibidos.forEach((docSnap) => {

            conexiones.push({
                id:docSnap.id,
                ...docSnap.data()
            });

        });


        mostrarSolicitudes();
        mostrarConectados();
        mostrarResultados();

    }catch(error){

        console.error(error);

        mostrarError(
            "No se pudieron cargar tus conexiones."
        );

    }

}


/* ==========================================
   ENVIAR SOLICITUD
========================================== */

async function enviarSolicitud(receptorUid, boton){

    if(!usuarioActual){
        return;
    }


    if(receptorUid === usuarioActual.uid){

        return;

    }


    const estado = obtenerEstadoConexion(receptorUid);

    if(
        estado === "aceptada" ||
        estado === "pendiente_enviada"
    ){

        return;

    }


    boton.disabled = true;
    boton.textContent = "Enviando...";


    try{

        const existente = conexiones.find((item) => {

            return (
                item.emisor === usuarioActual.uid &&
                item.receptor === receptorUid
            );

        });


        if(existente){

            boton.textContent = "Solicitud enviada";
            return;

        }


        const conexionRef = await addDoc(
            collection(db,"conexiones"),
            {
                emisor: usuarioActual.uid,
                receptor: receptorUid,
                estado: "pendiente",
                fecha: serverTimestamp()
            }
        );


        await addDoc(
            collection(db,"notificaciones"),
            {
                uid: receptorUid,
                tipo: "solicitud_conexion",
                emisorUid: usuarioActual.uid,
                conexionId: conexionRef.id,
                estado: "no_leida",
                fecha: serverTimestamp()
            }
        );


        await cargarConexiones();


    }catch(error){

        console.error(error);

        boton.disabled = false;
        boton.textContent = "🤝 Conectar";

        mostrarError(
            "No se pudo enviar la solicitud."
        );

    }

}


/* ==========================================
   SOLICITUDES RECIBIDAS
========================================== */

function mostrarSolicitudes(){

    const pendientes = conexiones.filter((item) => {

        return (
            item.receptor === usuarioActual.uid &&
            item.estado === "pendiente"
        );

    });


    if(pendientes.length === 0){

        solicitudes.innerHTML = `
            <div class="mensaje">
                No tenés solicitudes pendientes.
            </div>
        `;

        return;

    }


    solicitudes.innerHTML = pendientes.map((conexion) => {

        const persona = directorio.find(
            (item) => item.uid === conexion.emisor
        );


        return `

            <article class="card">

                <div class="perfil">

                    <div class="foto">

                        ${
                            persona && persona.fotoURL
                            ?
                            `<img src="${escaparHTML(persona.fotoURL)}" alt="">`
                            :
                            `👤`
                        }

                    </div>

                    <div>

                        <div class="nombre">

                            ${
                                persona
                                ?
                                escaparHTML(persona.nombreCompleto || "Usuario")
                                :
                                "Usuario"
                            }

                        </div>

                        <div class="detalle">

                            ${
                                persona
                                ?
                                `${escaparHTML(persona.tipo || "")}${persona.rubro ? ` · ${escaparHTML(persona.rubro)}` : ""}`
                                :
                                "Solicitud de conexión"
                            }

                        </div>

                    </div>

                </div>


                <div class="acciones">

                    <button
                        class="btn btn-aceptar"
                        data-aceptar="${conexion.id}"
                    >
                        ✓ Aceptar
                    </button>

                    <button
                        class="btn btn-rechazar"
                        data-rechazar="${conexion.id}"
                    >
                        ✕ Rechazar
                    </button>

                </div>

            </article>

        `;

    }).join("");


    document.querySelectorAll("[data-aceptar]").forEach((boton) => {

        boton.addEventListener("click", async () => {

            await aceptarSolicitud(
                boton.dataset.aceptar,
                boton
            );

        });

    });


    document.querySelectorAll("[data-rechazar]").forEach((boton) => {

        boton.addEventListener("click", async () => {

            await rechazarSolicitud(
                boton.dataset.rechazar,
                boton
            );

        });

    });

}


/* ==========================================
   ACEPTAR SOLICITUD
========================================== */

async function aceptarSolicitud(conexionId, boton){

    boton.disabled = true;
    boton.textContent = "Aceptando...";


    try{

        const conexion = conexiones.find(
            (item) => item.id === conexionId
        );


        if(!conexion){
            return;
        }


        await updateDoc(
            doc(db,"conexiones",conexionId),
            {
                estado:"aceptada"
            }
        );


        await addDoc(
            collection(db,"notificaciones"),
            {
                uid: conexion.emisor,
                tipo:"conexion_aceptada",
                emisorUid:usuarioActual.uid,
                conexionId:conexionId,
                estado:"no_leida",
                fecha:serverTimestamp()
            }
        );


        await cargarConexiones();


    }catch(error){

        console.error(error);

        boton.disabled = false;
        boton.textContent = "✓ Aceptar";

        mostrarError(
            "No se pudo aceptar la solicitud."
        );

    }

}


/* ==========================================
   ACEPTAR DESDE BÚSQUEDA
========================================== */

async function aceptarSolicitudPorUid(
    emisorUid,
    boton
){

    const conexion = conexiones.find((item) => {

        return (
            item.emisor === emisorUid &&
            item.receptor === usuarioActual.uid &&
            item.estado === "pendiente"
        );

    });


    if(!conexion){
        return;
    }


    await aceptarSolicitud(
        conexion.id,
        boton
    );

}


/* ==========================================
   RECHAZAR
========================================== */

async function rechazarSolicitud(
    conexionId,
    boton
){

    boton.disabled = true;
    boton.textContent = "Rechazando...";


    try{

        await updateDoc(
            doc(db,"conexiones",conexionId),
            {
                estado:"rechazada"
            }
        );


        await cargarConexiones();


    }catch(error){

        console.error(error);

        boton.disabled = false;
        boton.textContent = "✕ Rechazar";

        mostrarError(
            "No se pudo rechazar la solicitud."
        );

    }

}


/* ==========================================
   CONEXIONES ACEPTADAS
========================================== */

function mostrarConectados(){

    const aceptadas = conexiones.filter((item) => {

        return item.estado === "aceptada";

    });


    if(aceptadas.length === 0){

        conectados.innerHTML = `
            <div class="mensaje">
                Todavía no tenés conexiones.
            </div>
        `;

        return;

    }


    conectados.innerHTML = aceptadas.map((conexion) => {

        const otroUid =
            conexion.emisor === usuarioActual.uid
            ? conexion.receptor
            : conexion.emisor;


        const persona = directorio.find(
            (item) => item.uid === otroUid
        );


        return `

            <article class="card">

                <div class="perfil">

                    <div class="foto">

                        ${
                            persona && persona.fotoURL
                            ?
                            `<img src="${escaparHTML(persona.fotoURL)}" alt="">`
                            :
                            `👤`
                        }

                    </div>

                    <div>

                        <div class="nombre">

                            ${
                                persona
                                ?
                                escaparHTML(persona.nombreCompleto || "Usuario")
                                :
                                "Usuario conectado"
                            }

                        </div>

                        <div class="detalle">

                            ${
                                persona
                                ?
                                `${escaparHTML(persona.tipo || "")}${persona.rubro ? ` · ${escaparHTML(persona.rubro)}` : ""}`
                                :
                                ""
                            }

                            ${
                                persona && persona.localidad
                                ?
                                `<br>📍 ${escaparHTML(persona.localidad)}${persona.provincia ? `, ${escaparHTML(persona.provincia)}` : ""}`
                                :
                                ""
                            }

                        </div>

                    </div>

                </div>


                <span class="estado aceptada">
                    ✓ Conectado
                </span>

            </article>

        `;

    }).join("");

}


/* ==========================================
   TABS
========================================== */

document.querySelectorAll(".tab").forEach((tab) => {

    tab.addEventListener("click", () => {

        document.querySelectorAll(".tab").forEach((item) => {
            item.classList.remove("activo");
        });

        tab.classList.add("activo");


        document.querySelectorAll(".seccion").forEach((seccion) => {
            seccion.classList.remove("activa");
        });


        const destino = tab.dataset.tab;


        if(destino === "buscar"){

            seccionBuscar.classList.add("activa");

        }

        if(destino === "solicitudes"){

            seccionSolicitudes.classList.add("activa");
            cargarConexiones();

        }

        if(destino === "conectados"){

            seccionConectados.classList.add("activa");
            cargarConexiones();

        }

    });

});
