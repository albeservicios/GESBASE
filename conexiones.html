<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Conexiones | Red GESBASE</title>

<style>
*{margin:0;padding:0;box-sizing:border-box;font-family:Arial,sans-serif;}
body{background:#F3F5F4;color:#12343B;}
header{background:#12343B;color:#fff;padding:16px;font-size:22px;font-weight:bold;}
.contenedor{max-width:800px;margin:auto;padding:16px;}
.tabs{display:flex;gap:10px;margin-bottom:20px;}
.tab{flex:1;background:#fff;border:none;padding:12px;border-radius:10px;font-weight:bold;color:#12343B;}
.tab.activa{background:#E97824;color:#fff;}
.card{background:#fff;border-radius:14px;padding:15px;margin-bottom:12px;display:flex;align-items:center;justify-content:space-between;box-shadow:0 2px 8px rgba(0,0,0,.08);}
.info{display:flex;align-items:center;gap:12px;}
.avatar{width:52px;height:52px;border-radius:50%;background:#12343B;color:#fff;display:flex;align-items:center;justify-content:center;font-size:20px;font-weight:bold;}
.nombre{font-weight:bold;}
.rubro{font-size:13px;color:#666;}
.btn{border:none;border-radius:8px;padding:10px 14px;font-weight:bold;cursor:pointer;}
.aceptar{background:#12343B;color:#fff;}
.rechazar{background:#ddd;color:#333;}
.conectar{background:#E97824;color:#fff;}
</style>
</head>
<body>

<header>🤝 Conexiones</header>

<div class="contenedor">

<div class="tabs">
<button class="tab activa">Solicitudes</button>
<button class="tab">Conectados</button>
</div>

<div class="card">
<div class="info">
<div class="avatar">JP</div>
<div>
<div class="nombre">Juan Pérez</div>
<div class="rubro">Electricista · Neuquén</div>
</div>
</div>
<div>
<button class="btn aceptar">Aceptar</button>
<button class="btn rechazar">✕</button>
</div>
</div>

<div class="card">
<div class="info">
<div class="avatar">ML</div>
<div>
<div class="nombre">María López</div>
<div class="rubro">Comercio · Catriel</div>
</div>
</div>
<button class="btn conectar">Conectar</button>
</div>

</div>

</body>
</html>
