<!DOCTYPE html>
<html lang="es-AR">
<head>
    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0, viewport-fit=cover"
    >

    <meta name="theme-color" content="#12343B">

    <meta
        name="description"
        content="Conexiones - Red GESBASE"
    >

    <title>Conexiones - Red GESBASE</title>

    <style>

        *{
            box-sizing:border-box;
            margin:0;
            padding:0;
        }

        body{
            font-family:Arial,Helvetica,sans-serif;
            background:#f3f6f7;
            color:#12343B;
        }

        header{
            background:#12343B;
            color:white;
            padding:16px;
            position:sticky;
            top:0;
            z-index:100;
            box-shadow:0 2px 8px rgba(0,0,0,.15);
        }

        .header-inner{
            max-width:1100px;
            margin:auto;
            display:flex;
            align-items:center;
            justify-content:space-between;
            gap:15px;
        }

        .logo{
            font-size:22px;
            font-weight:bold;
        }

        .volver{
            border:0;
            background:white;
            color:#12343B;
            padding:9px 14px;
            border-radius:8px;
            cursor:pointer;
            font-weight:bold;
        }

        main{
            max-width:1100px;
            margin:0 auto;
            padding:20px 15px 50px;
        }

        h1{
            font-size:28px;
            margin-bottom:6px;
        }

        .subtitulo{
            color:#60757a;
            margin-bottom:20px;
        }

        /* =====================================
           DIAGNÓSTICO
        ===================================== */

        .diagnostico{
            background:#111827;
            color:#f9fafb;
            border-radius:14px;
            padding:15px;
            margin-bottom:20px;
            box-shadow:0 2px 8px rgba(0,0,0,.15);
        }

        .diagnostico-titulo{
            font-size:16px;
            font-weight:bold;
            margin-bottom:10px;
        }

        .diagnostico-linea{
            font-family:monospace;
            font-size:12px;
            line-height:1.6;
            padding:3px 0;
            word-break:break-word;
        }

        .ok{
            color:#86efac;
        }

        .error-d{
            color:#fca5a5;
        }

        .aviso{
            color:#fde68a;
        }

        .info{
            color:#93c5fd;
        }

        .limpiar{
            margin-top:10px;
            border:0;
            border-radius:7px;
            padding:8px 11px;
            cursor:pointer;
            font-weight:bold;
        }

        /* =====================================
           BUSCADOR
        ===================================== */

        .buscador{
            background:white;
            padding:16px;
            border-radius:14px;
            box-shadow:0 2px 8px rgba(0,0,0,.08);
            margin-bottom:20px;
        }

        .buscador-row{
            display:flex;
            gap:10px;
        }

        input,
        select{
            width:100%;
            padding:13px;
            border:1px solid #ccd7da;
            border-radius:9px;
            font-size:15px;
            outline:none;
        }

        input:focus,
        select:focus{
            border-color:#12343B;
        }

        .btn{
            border:0;
            border-radius:9px;
            padding:12px 16px;
            cursor:pointer;
            font-weight:bold;
            font-size:14px;
        }

        .btn-principal{
            background:#12343B;
            color:white;
        }

        .btn-secundario{
            background:#e7eef0;
            color:#12343B;
        }

        .btn-aceptar{
            background:#198754;
            color:white;
        }

        .btn-rechazar{
            background:#dc3545;
            color:white;
        }

        .btn:disabled{
            opacity:.55;
            cursor:not-allowed;
        }

        /* =====================================
           TABS
        ===================================== */

        .tabs{
            display:flex;
            gap:8px;
            margin-bottom:18px;
            flex-wrap:wrap;
        }

        .tab{
            border:0;
            background:white;
            color:#12343B;
            padding:11px 16px;
            border-radius:9px;
            cursor:pointer;
            font-weight:bold;
            box-shadow:0 1px 5px rgba(0,0,0,.06);
        }

        .tab.activo{
            background:#12343B;
            color:white;
        }

        .seccion{
            display:none;
        }

        .seccion.activa{
            display:block;
        }

        /* =====================================
           TARJETAS
        ===================================== */

        .grid{
            display:grid;
            grid-template-columns:repeat(2,minmax(0,1fr));
            gap:15px;
        }

        .card{
            background:white;
            border-radius:14px;
            padding:17px;
            box-shadow:0 2px 8px rgba(0,0,0,.08);
        }

        .perfil{
            display:flex;
            align-items:center;
            gap:14px;
            margin-bottom:14px;
        }

        .foto{
            width:58px;
            height:58px;
            border-radius:50%;
            background:#dce7e9;
            display:flex;
            align-items:center;
            justify-content:center;
            overflow:hidden;
            flex-shrink:0;
            font-size:25px;
        }

        .foto img{
            width:100%;
            height:100%;
            object-fit:cover;
        }

        .nombre{
            font-size:18px;
            font-weight:bold;
            margin-bottom:4px;
        }

        .detalle{
            color:#687b80;
            font-size:14px;
            line-height:1.5;
        }

        .acciones{
            display:flex;
            gap:8px;
            flex-wrap:wrap;
        }

        .mensaje{
            background:white;
            border-radius:12px;
            padding:20px;
            text-align:center;
            color:#687b80;
            box-shadow:0 2px 8px rgba(0,0,0,.06);
        }

        .cargando{
            text-align:center;
            padding:25px;
            color:#687b80;
        }

        .estado{
            display:inline-block;
            margin-top:6px;
            padding:5px 9px;
            border-radius:20px;
            font-size:12px;
            font-weight:bold;
            background:#fff3cd;
            color:#856404;
        }

        .estado.aceptada{
            background:#d1e7dd;
            color:#0f5132;
        }

        .estado.rechazada{
            background:#f8d7da;
            color:#842029;
        }

        .error{
            background:#f8d7da;
            color:#842029;
            padding:12px;
            border-radius:9px;
            margin-bottom:15px;
            display:none;
        }

        @media(max-width:700px){

            main{
                padding:15px 10px 40px;
            }

            h1{
                font-size:24px;
            }

            .buscador-row{
                flex-direction:column;
            }

            .grid{
                grid-template-columns:1fr;
            }

            .header-inner{
                align-items:flex-start;
            }

            .logo{
                font-size:19px;
            }

        }

    </style>
</head>

<body>

<header>

    <div class="header-inner">

        <div class="logo">
            🤝 Red GESBASE
        </div>

        <button class="volver" id="btnVolver">
            ← Volver
        </button>

    </div>

</header>


<main>

    <h1>Conexiones</h1>

    <p class="subtitulo">
        Encontrá personas, profesionales, trabajadores, empresas y comercios.
    </p>


    <!-- =====================================
         PANEL DE DIAGNÓSTICO
    ====================================== -->

    <div class="diagnostico">

        <div class="diagnostico-titulo">
            🛠 Diagnóstico de Red GESBASE
        </div>

        <div id="diagnosticoContenido">

            <div class="diagnostico-linea info">
                Iniciando diagnóstico...
            </div>

        </div>

        <button
            class="limpiar"
            id="btnLimpiarDiagnostico"
        >
            Limpiar diagnóstico
        </button>

    </div>


    <div class="error" id="mensajeError"></div>


    <!-- =====================================
         BUSCADOR
    ====================================== -->

    <div class="buscador">

        <div class="buscador-row">

            <input
                type="search"
                id="busqueda"
                placeholder="Buscar por nombre, rubro o localidad..."
                autocomplete="off"
            >

            <select id="tipoFiltro">

                <option value="">Todos</option>

                <option value="persona">
                    Personas
                </option>

                <option value="profesional">
                    Profesionales
                </option>

                <option value="trabajador">
                    Trabajadores
                </option>

                <option value="empresa">
                    Empresas
                </option>

                <option value="comercio">
                    Comercios
                </option>

            </select>

            <button
                class="btn btn-principal"
                id="btnBuscar"
            >
                Buscar
            </button>

        </div>

    </div>


    <!-- =====================================
         TABS
    ====================================== -->

    <div class="tabs">

        <button
            class="tab activo"
            data-tab="buscar"
        >
            🔎 Buscar
        </button>

        <button
            class="tab"
            data-tab="solicitudes"
        >
            📩 Solicitudes
        </button>

        <button
            class="tab"
            data-tab="conectados"
        >
            👥 Mis conexiones
        </button>

    </div>


    <!-- =====================================
         BUSCAR
    ====================================== -->

    <section
        id="seccionBuscar"
        class="seccion activa"
    >

        <div
            id="resultados"
            class="grid"
        >

            <div class="mensaje">
                Escribí algo para buscar personas o empresas.
            </div>

        </div>

    </section>


    <!-- =====================================
         SOLICITUDES
    ====================================== -->

    <section
        id="seccionSolicitudes"
        class="seccion"
    >

        <div
            id="solicitudes"
            class="grid"
        >

            <div class="cargando">
                Cargando solicitudes...
            </div>

        </div>

    </section>


    <!-- =====================================
         CONECTADOS
    ====================================== -->

    <section
        id="seccionConectados"
        class="seccion"
    >

        <div
            id="conectados"
            class="grid"
        >

            <div class="cargando">
                Cargando conexiones...
            </div>

        </div>

    </section>

</main>


<script type="module">

/* ==========================================
   FIREBASE
========================================== */

import { auth, db } from "./firebase.js";

import {
    collection,
    getDocs,
    addDoc,
    query,
    where,
    serverTimestamp,
    updateDoc,
    doc
} from "https://www.gstatic.com/firebasejs/12.18.0/firebase-firestore.js";


/* ==========================================
   ELEMENTOS
========================================== */

const busqueda =
    document.getElementById("busqueda");

const tipoFiltro =
    document.getElementById("tipoFiltro");

const btnBuscar =
    document.getElementById("btnBuscar");

const resultados =
    document.getElementById("resultados");

const solicitudes =
    document.getElementById("solicitudes");

const conectados =
    document.getElementById("conectados");

const mensajeError =
    document.getElementById("mensajeError");

const seccionBuscar =
    document.getElementById("seccionBuscar");

const seccionSolicitudes =
    document.getElementById("seccionSolicitudes");

const seccionConectados =
    document.getElementById("seccionConectados");

const diagnosticoContenido =
    document.getElementById("diagnosticoContenido");

const btnLimpiarDiagnostico =
    document.getElementById("btnLimpiarDiagnostico");


let usuarioActual = null;
let directorio = [];
let conexiones = [];


/* ==========================================
   DIAGNÓSTICO
========================================== */

function diagnostico(mensaje, tipo = "info"){

    const linea =
        document.createElement("div");

    linea.className =
        "diagnostico-linea " + tipo;

    const hora =
        new Date().toLocaleTimeString();

    linea.textContent =
        `[${hora}] ${mensaje}`;

    diagnosticoContenido.appendChild(linea);

    console.log(
        "[GESBASE]",
        mensaje
    );

}


function diagnosticoError(error){

    console.error(
        "[GESBASE ERROR]",
        error
    );

    let texto =
        "Error desconocido";

    if(error){

        texto =
            error.code
            ? `${error.code} — ${error.message || ""}`
            : (error.message || String(error));

    }

    diagnostico(
        texto,
        "error-d"
    );

}


btnLimpiarDiagnostico.addEventListener(
    "click",
    () => {

        diagnosticoContenido.innerHTML = "";

        diagnostico(
            "Diagnóstico limpiado.",
            "info"
        );

    }
);


/* ==========================================
   UTILIDADES
========================================== */

function mostrarError(mensaje){

    mensajeError.textContent =
        mensaje;

    mensajeError.style.display =
        "block";

}


function ocultarError(){

    mensajeError.textContent =
        "";

    mensajeError.style.display =
        "none";

}


function normalizar(texto){

    return String(texto || "")
        .toLowerCase()
        .normalize("NFD")
        .replace(/[\u0300-\u036f]/g,"");

}


function escaparHTML(texto){

    return String(texto || "")
        .replace(/&/g,"&amp;")
        .replace(/</g,"&lt;")
        .replace(/>/g,"&gt;")
        .replace(/"/g,"&quot;")
        .replace(/'/g,"&#039;");

}


/* ==========================================
   AUTENTICACIÓN
========================================== */

diagnostico(
    "Cargando Firebase...",
    "info"
);


auth.onAuthStateChanged(
    async (user) => {

        if(!user){

            diagnostico(
                "NO hay usuario autenticado.",
                "error-d"
            );

            window.location.href =
                "red-login.html";

            return;

        }


        usuarioActual = user;


        diagnostico(
            `Usuario autenticado correctamente. UID: ${user.uid}`,
            "ok"
        );

        diagnostico(
            `Email autenticado: ${user.email || "sin email"}`,
            "ok"
        );


        await cargarDirectorio();

        await cargarConexiones();

    }
);


/* ==========================================
   CARGAR DIRECTORIO
========================================== */

async function cargarDirectorio(){

    diagnostico(
        "Consultando colección: directorio_red",
        "info"
    );


    resultados.innerHTML = `
        <div class="cargando">
            Consultando Red GESBASE...
        </div>
    `;


    try{

        const referencia =
            collection(
                db,
                "directorio_red"
            );


        const snapshot =
            await getDocs(referencia);


        diagnostico(
            `Firebase respondió correctamente. Documentos encontrados: ${snapshot.size}`,
            "ok"
        );


        directorio = [];


        snapshot.forEach(
            (docSnap) => {

                const datos =
                    docSnap.data();


                diagnostico(
                    `Documento ${docSnap.id}: uid=${datos.uid || "(sin uid)"}, nombre=${datos.nombreCompleto || "(sin nombre)"}`,
                    "info"
                );


                if(
                    datos.uid &&
                    datos.uid !== usuarioActual.uid &&
                    datos.activo !== false
                ){

                    directorio.push({

                        id:docSnap.id,

                        ...datos

                    });

                }

            }
        );


        diagnostico(
            `Usuarios disponibles para búsqueda: ${directorio.length}`,
            directorio.length > 0
                ? "ok"
                : "aviso"
        );


        mostrarResultados();


    }catch(error){

        diagnostico(
            "FALLÓ la consulta a directorio_red.",
            "error-d"
        );

        diagnosticoError(error);


        resultados.innerHTML = `
            <div class="mensaje">
                No se pudo cargar el directorio.
            </div>
        `;


        mostrarError(
            "Firebase no pudo leer directorio_red. Mirá el diagnóstico."
        );

    }

}


/* ==========================================
   MOSTRAR RESULTADOS
========================================== */

function mostrarResultados(){

    const texto =
        normalizar(
            busqueda.value
        );

    const tipo =
        normalizar(
            tipoFiltro.value
        );


    let lista =
        directorio.filter(
            (persona) => {

                const contenido =
                    normalizar(
                        `${persona.nombreCompleto || ""}
                         ${persona.rubro || ""}
                         ${persona.localidad || ""}
                         ${persona.provincia || ""}`
                    );


                const coincideTexto =
                    !texto ||
                    contenido.includes(texto);


                const coincideTipo =
                    !tipo ||
                    normalizar(persona.tipo) === tipo;


                return (
                    coincideTexto &&
                    coincideTipo
                );

            }
        );


    diagnostico(
        `Filtro aplicado: "${busqueda.value || "(vacío)"}" — resultados: ${lista.length}`,
        "info"
    );


    if(lista.length === 0){

        resultados.innerHTML = `
            <div class="mensaje">
                No encontramos resultados.
            </div>
        `;

        return;

    }


    resultados.innerHTML =
        lista.map(
            (persona) => {

                const estado =
                    obtenerEstadoConexion(
                        persona.uid
                    );


                let boton = "";


                if(
                    estado === "aceptada"
                ){

                    boton = `
                        <button
                            class="btn btn-secundario"
                            disabled
                        >
                            ✓ Ya están conectados
                        </button>
                    `;

                }

                else if(
                    estado === "pendiente_enviada"
                ){

                    boton = `
                        <button
                            class="btn btn-secundario"
                            disabled
                        >
                            Solicitud enviada
                        </button>
                    `;

                }

                else if(
                    estado === "pendiente_recibida"
                ){

                    boton = `
                        <button
                            class="btn btn-aceptar"
                            data-aceptar-desde-busqueda="${escaparHTML(persona.uid)}"
                        >
                            Aceptar solicitud
                        </button>
                    `;

                }

                else{

                    boton = `
                        <button
                            class="btn btn-principal"
                            data-conectar="${escaparHTML(persona.uid)}"
                        >
                            🤝 Conectar
                        </button>
                    `;

                }


                return `

                    <article class="card">

                        <div class="perfil">

                            <div class="foto">

                                ${
                                    persona.fotoURL
                                    ?
                                    `<img
                                        src="${escaparHTML(persona.fotoURL)}"
                                        alt=""
                                    >`
                                    :
                                    `👤`
                                }

                            </div>


                            <div>

                                <div class="nombre">
                                    ${escaparHTML(
                                        persona.nombreCompleto ||
                                        "Usuario"
                                    )}
                                </div>


                                <div class="detalle">

                                    ${escaparHTML(
                                        persona.tipo || ""
                                    )}

                                    ${
                                        persona.rubro
                                        ?
                                        ` · ${escaparHTML(
                                            persona.rubro
                                        )}`
                                        :
                                        ""
                                    }


                                    ${
                                        persona.localidad
                                        ?
                                        `<br>📍 ${escaparHTML(
                                            persona.localidad
                                        )}${
                                            persona.provincia
                                            ?
                                            `, ${escaparHTML(
                                                persona.provincia
                                            )}`
                                            :
                                            ""
                                        }`
                                        :
                                        ""
                                    }

                                </div>

                            </div>

                        </div>


                        ${
                            persona.descripcion
                            ?
                            `
                            <div
                                class="detalle"
                                style="margin-bottom:14px;"
                            >
                                ${escaparHTML(
                                    persona.descripcion
                                )}
                            </div>
                            `
                            :
                            ""
                        }


                        <div class="acciones">

                            ${boton}

                        </div>

                    </article>

                `;

            }
        ).join("");


    agregarEventosResultados();

}


/* ==========================================
   EVENTOS RESULTADOS
========================================== */

function agregarEventosResultados(){

    document
        .querySelectorAll(
            "[data-conectar]"
        )
        .forEach(
            (boton) => {

                boton.addEventListener(
                    "click",
                    async () => {

                        const receptorUid =
                            boton.dataset.conectar;

                        await enviarSolicitud(
                            receptorUid,
                            boton
                        );

                    }
                );

            }
        );


    document
        .querySelectorAll(
            "[data-aceptar-desde-busqueda]"
        )
        .forEach(
            (boton) => {

                boton.addEventListener(
                    "click",
                    async () => {

                        const emisorUid =
                            boton.dataset
                                .aceptarDesdeBusqueda;


                        await aceptarSolicitudPorUid(
                            emisorUid,
                            boton
                        );

                    }
                );

            }
        );

}


/* ==========================================
   ESTADO DE CONEXIÓN
========================================== */

function obtenerEstadoConexion(uid){

    const conexion =
        conexiones.find(
            (item) => {

                return (

                    (
                        item.emisor ===
                        usuarioActual.uid &&

                        item.receptor === uid
                    )

                    ||

                    (
                        item.receptor ===
                        usuarioActual.uid &&

                        item.emisor === uid
                    )

                );

            }
        );


    if(!conexion){

        return "ninguna";

    }


    if(
        conexion.estado ===
        "aceptada"
    ){

        return "aceptada";

    }


    if(
        conexion.estado === "pendiente" &&

        conexion.emisor ===
        usuarioActual.uid
    ){

        return "pendiente_enviada";

    }


    if(
        conexion.estado === "pendiente" &&

        conexion.receptor ===
        usuarioActual.uid
    ){

        return "pendiente_recibida";

    }


    return conexion.estado ||
        "ninguna";

}


/* ==========================================
   CARGAR CONEXIONES
========================================== */

async function cargarConexiones(){

    diagnostico(
        "Consultando conexiones del usuario...",
        "info"
    );


    try{

        conexiones = [];


        const enviadosQuery =
            query(
                collection(
                    db,
                    "conexiones"
                ),

                where(
                    "emisor",
                    "==",
                    usuarioActual.uid
                )
            );


        const recibidosQuery =
            query(
                collection(
                    db,
                    "conexiones"
                ),

                where(
                    "receptor",
                    "==",
                    usuarioActual.uid
                )
            );


        const resultado =
            await Promise.all([

                getDocs(
                    enviadosQuery
                ),

                getDocs(
                    recibidosQuery
                )

            ]);


        const enviados =
            resultado[0];

        const recibidos =
            resultado[1];


        enviados.forEach(
            (docSnap) => {

                conexiones.push({

                    id:docSnap.id,

                    ...docSnap.data()

                });

            }
        );


        recibidos.forEach(
            (docSnap) => {

                conexiones.push({

                    id:docSnap.id,

                    ...docSnap.data()

                });

            }
        );


        diagnostico(
            `Conexiones cargadas: ${conexiones.length}`,
            "ok"
        );


        mostrarSolicitudes();

        mostrarConectados();

        mostrarResultados();


    }catch(error){

        diagnostico(
            "FALLÓ la consulta de conexiones.",
            "error-d"
        );

        diagnosticoError(error);

        mostrarError(
            "No se pudieron cargar las conexiones. Mirá el diagnóstico."
        );

    }

}


/* ==========================================
   ENVIAR SOLICITUD
========================================== */

async function enviarSolicitud(
    receptorUid,
    boton
){

    if(!usuarioActual){

        return;

    }


    if(
        receptorUid ===
        usuarioActual.uid
    ){

        return;

    }


    const estado =
        obtenerEstadoConexion(
            receptorUid
        );


    if(
        estado === "aceptada" ||
        estado === "pendiente_enviada"
    ){

        return;

    }


    boton.disabled = true;

    boton.textContent =
        "Enviando...";


    diagnostico(
        `Enviando solicitud a UID: ${receptorUid}`,
        "info"
    );


    try{

        const existente =
            conexiones.find(
                (item) => {

                    return (

                        item.emisor ===
                        usuarioActual.uid &&

                        item.receptor ===
                        receptorUid

                    );

                }
            );


        if(existente){

            boton.textContent =
                "Solicitud enviada";

            return;

        }


        const conexionRef =
            await addDoc(
                collection(
                    db,
                    "conexiones"
                ),
                {

                    emisor:
                        usuarioActual.uid,

                    receptor:
                        receptorUid,

                    estado:
                        "pendiente",

                    fecha:
                        serverTimestamp()

                }
            );


        diagnostico(
            `Solicitud creada correctamente. ID: ${conexionRef.id}`,
            "ok"
        );


        try{

            await addDoc(
                collection(
                    db,
                    "notificaciones"
                ),
                {

                    uid:
                        receptorUid,

                    tipo:
                        "solicitud_conexion",

                    emisorUid:
                        usuarioActual.uid,

                    conexionId:
                        conexionRef.id,

                    estado:
                        "no_leida",

                    fecha:
                        serverTimestamp()

                }
            );


            diagnostico(
                "Notificación de solicitud creada correctamente.",
                "ok"
            );


        }catch(errorNotificacion){

            diagnostico(
                "La conexión se creó, pero la notificación falló.",
                "aviso"
            );

            diagnosticoError(
                errorNotificacion
            );

        }


        await cargarConexiones();


    }catch(error){

        diagnostico(
            "FALLÓ el envío de la solicitud.",
            "error-d"
        );

        diagnosticoError(error);


        boton.disabled =
            false;

        boton.textContent =
            "🤝 Conectar";


        mostrarError(
            "No se pudo enviar la solicitud. Mirá el diagnóstico."
        );

    }

}


/* ==========================================

function mostrarSolicitudes(){

            </div>

    }


    solicitudes.innerHTML =

                    directorio.find(
                        (item) =>

                            conexion.emisor
                    );


                return `

                    <article class="card">

                        <div class="perfil">

                            <div class="foto">

                                ${
                                    persona &&
                                    persona.fotoURL
                                    ?
                                    `<img
                                        src="${escaparHTML(
                                            persona.fotoURL
                                        )}"
                                        alt=""
                                    >`
                                    :
                                    `👤`
                                }

                            </div>


                            <div>

                                <div class="nombre">

                                    ${
                                        persona
                                        ?
                                        escaparHTML(
                                            persona.nombreCompleto ||
                                            "Usuario"
                                        )
                                        :
                                        "Usuario"
                                    }

                                </div>


                                <div class="detalle">

                                    ${
                                        persona
                                        ?
                                        `${escaparHTML(
                                            persona.tipo || ""
                                        )}${
                                            persona.rubro
                                            ?
                                            ` · ${escaparHTML(
                                                persona.rubro
                                            )}`
                                            :
                                            ""
                                        }`
                                        :
                                        "Solicitud de conexión"
                                    }

                                </div>

                            </div>

                        </div>


                        <div class="acciones">

                            <button
                                class="btn btn-aceptar"
                                data-aceptar="${conexion.id}"
                            >
                                ✓ Aceptar
                            </button>


                            <button
                                class="btn btn-rechazar"
                                data-rechazar="${conexion.id}"
                            >
                                ✕ Rechazar
                            </button>

                        </div>

                    </article>

                `;

            }
        ).join("");


    document
        .querySelectorAll(
            "[data-aceptar]"
        )
        .forEach(
            (boton) => {

                boton.addEventListener(
                    "click",

                        await aceptarSolicitud(

                            boton
                        );

                    }
                );

            }
        );


    document
        .querySelectorAll(
            "[data-rechazar]"
        )
        .forEach(
            (boton) => {

                boton.addEventListener(
                    "click",
                    async () => {

                        await rechazarSolicitud(
                            boton.dataset.rechazar,
                            boton
                        );

                    }
                );

            }
        );

}


/* ==========================================
   ACEPTAR SOLICITUD
========================================== */

async function aceptarSolicitud(
    conexionId,
    boton
){

    boton.disabled =
        true;

    boton.textContent =
        "Aceptando...";


    diagnostico(
        `Aceptando conexión: ${conexionId}`,
        "info"
    );


    try{

        const conexion =
            conexiones.find(
                (item) =>
                    item.id ===
                    conexionId
            );


        if(!conexion){

            diagnostico(
                "No se encontró la conexión.",
                "error-d"
            );

            return;

        }


        await updateDoc(
            doc(
                db,
                "conexiones",
                conexionId
            ),
            {
                estado:
                    "aceptada"
            }
        );


        diagnostico(
            "Solicitud aceptada correctamente.",
            "ok"
        );


        try{

            await addDoc(
                collection(
                    db,
                    "notificaciones"
                ),
                {

                    uid:
                        conexion.emisor,

                    tipo:
                        "conexion_aceptada",

                    emisorUid:
                        usuarioActual.uid,

                    conexionId:
                        conexionId,

                    estado:
                        "no_leida",

                    fecha:
                        serverTimestamp()

                }
            );


            diagnostico(
                "Notificación de aceptación creada.",
                "ok"
            );

        }catch(errorNotificacion){

            diagnostico(
                "La conexión fue aceptada, pero la notificación falló.",
                "aviso"
            );

            diagnosticoError(
                errorNotificacion
            );

        }


        await cargarConexiones();


    }catch(error){

        diagnostico(
            "FALLÓ al aceptar la solicitud.",
            "error-d"
        );

        diagnosticoError(error);


        boton.disabled =
            false;

        boton.textContent =
            "✓ Aceptar";

    }

}


/* ==========================================
   ACEPTAR DESDE BÚSQUEDA
========================================== */

async function aceptarSolicitudPorUid(
    emisorUid,
    boton
){

    const conexion =
        conexiones.find(
            (item) => {

                return (

                    item.emisor ===
                    emisorUid &&

                    item.receptor ===
                    usuarioActual.uid &&

                    item.estado ===
                    "pendiente"

                );

            }
        );


    if(!conexion){

        diagnostico(
            "No se encontró la solicitud pendiente.",
            "error-d"
        );

        return;

    }


    await aceptarSolicitud(
        conexion.id,
        boton
    );

}

/* ==========================================
   CONEXIONES ACEPTADAS
========================================== */

function mostrarConectados(){

    const aceptadas =
        conexiones.filter(
            (item) =>
                item.estado ===
                "aceptada"
        );


    if(
        aceptadas.length === 0
    ){

        conectados.innerHTML = `
            <div class="mensaje">
                Todavía no tenés conexiones.
            </div>
        `;

        return;

    }


    conectados.innerHTML =
        aceptadas.map(
            (conexion) => {

                const otroUid =
                    conexion.emisor ===
                    usuarioActual.uid

                    ?

                    conexion.receptor

                    :

                    conexion.emisor;


                const persona =
                    directorio.find(
                        (item) =>
                            item.uid ===
                            otroUid
                    );


                return `

                    <article class="card">

                        <div class="perfil">

                            <div class="foto">

                                ${
                                    persona &&
                                    persona.fotoURL
                                    ?
                                    `<img
                                        src="${escaparHTML(
                                            persona.fotoURL
                                        )}"
                                        alt=""
                                    >`
                                    :
                                    `👤`
                                }

                            </div>


                            <div>

                                <div class="nombre">

                                    ${
                                        persona
                                        ?
                                        escaparHTML(
                                            persona.nombreCompleto ||
                                            "Usuario"
                                        )
                                        :
                                        "Usuario conectado"
                                    }

                                </div>


                                <div class="detalle">

                                    ${
                                        persona
                                        ?
                                        `${escaparHTML(
                                            persona.tipo || ""
                                        )}${
                                            persona.rubro
                                            ?
                                            ` · ${escaparHTML(
                                                persona.rubro
                                            )}`
                                            :
                                            ""
                                        }`
                                        :
                                        ""
                                    }


                                    ${
                                        persona &&
                                        persona.localidad
                                        ?
                                        `<br>📍 ${escaparHTML(
                                            persona.localidad
                                        )}${
                                            persona.provincia
                                            ?
                                            `, ${escaparHTML(
                                                persona.provincia
                                            )}`
                                            :
                                            ""
                                        }`
                                        :
                                        ""
                                    }

                                </div>

                            </div>

                        </div>


                        <span class="estado aceptada">
                            ✓ Conectado
                        </span>

                    </article>

                `;

            }
        ).join("");

}

                    document
                        .querySelectorAll(".tab")
                        .forEach(
                            (item) => {

                                item.classList.remove(
                                    "activo"
                                );

                            }
                        );

                        "activo"
                    );


                    document
                        .querySelectorAll(

                        )
                        .forEach(
                            (seccion) => {

                                );

                        );

                        tab.dataset.tab;


                    if(
                        destino ===
                        "buscar"

                        seccionBuscar.classList.add(

                        );

                        destino ===
