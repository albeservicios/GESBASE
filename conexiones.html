<title>Conexiones - Red GESBASE</title>


<style>

*{
    box-sizing:border-box;
    margin:0;
    padding:0;
}

body{
    font-family:Arial,Helvetica,sans-serif;
    background:#f3f4f6;
    color:#111827;
    padding-bottom:85px;
}


/* HEADER */

header{
    position:sticky;
    top:0;
    z-index:100;
    background:#111827;
    color:white;
    padding:16px;
    box-shadow:0 2px 8px rgba(0,0,0,.18);
}

.header-inner{

    align-items:center;

}

.logo{

}

.logout{

/* TITULO */

.title-box{

    border-radius:16px;

    margin-bottom:15px;

}

.title-box h1{

}

.title-box p{

/* SECCIONES */

.section{
    margin-bottom:22px;
}

.section-title{
    display:flex;
    align-items:center;
    justify-content:space-between;
    font-size:18px;
    font-weight:700;
    margin:0 2px 10px;
}

.counter{
    background:#111827;
    color:white;
    min-width:25px;
    height:25px;
    border-radius:20px;
    display:flex;
    align-items:center;
    justify-content:center;
    font-size:12px;
    padding:0 7px;
}


/* LISTA */

.list{
    display:flex;
    flex-direction:column;
    gap:10px;
}


/* TARJETA */

.connection-card{
    background:white;
    border-radius:16px;
    padding:15px;
    box-shadow:0 2px 8px rgba(0,0,0,.06);
    display:flex;
    align-items:center;
    gap:13px;
}


.avatar{
    width:55px;
    height:55px;
    border-radius:50%;

    display:flex;
    align-items:center;
    justify-content:center;
    font-size:22px;
    font-weight:bold;
    overflow:hidden;
    flex-shrink:0;
}

.avatar img{
    width:100%;
    height:100%;

}


.info{
    flex:1;
    min-width:0;
}

.name{
    font-size:16px;

    margin-bottom:4px;

}

.type{
    color:#374151;
    font-size:13px;
    margin-bottom:3px;
}

.location{
    color:#6b7280;
    font-size:12px;
}


/* BOTONES */

.actions{
    display:flex;
    flex-direction:column;
    gap:7px;
    flex-shrink:0;
}

.btn{
    border:0;
    border-radius:9px;
    padding:9px 11px;
    cursor:pointer;
    font-size:12px;
    font-weight:600;
    white-space:nowrap;
}

.btn:disabled{
    opacity:.6;
    cursor:not-allowed;
}

.btn-accept{
    background:#111827;
    color:white;
}

.btn-reject{
    background:#e5e7eb;
    color:#111827;
}

.btn-cancel{
    background:#e5e7eb;
    color:#374151;
}

.btn-remove{
    background:#fee2e2;
    color:#991b1b;
}


/* ESTADOS */

.empty{
    background:white;
    border-radius:16px;
    padding:25px 20px;
    text-align:center;
    color:#6b7280;
    font-size:14px;
}

.loading{
    background:white;
    border-radius:16px;
    padding:30px 20px;
    text-align:center;
    color:#6b7280;
}


/* NAVEGACION */

.bottom-nav{
    position:fixed;
    bottom:0;
    left:0;
    right:0;
    z-index:200;
    background:white;
    border-top:1px solid #e5e7eb;
    box-shadow:0 -2px 10px rgba(0,0,0,.08);
}

.bottom-nav-inner{
    max-width:900px;
    margin:auto;
    display:flex;
    justify-content:space-around;
}

.nav-button{
    flex:1;
    border:0;
    background:white;
    padding:10px 3px 9px;
    cursor:pointer;
    color:#6b7280;
    font-size:11px;
}

.nav-button span{
    display:block;
    font-size:21px;
    margin-bottom:3px;
}

.nav-button.active{
    color:#111827;
    font-weight:700;
}


/* TOAST */

.toast{
    position:fixed;
    left:50%;
    bottom:100px;
    transform:translateX(-50%);
    background:#111827;
    color:white;
    padding:12px 17px;
    border-radius:10px;
    font-size:13px;
    display:none;
    z-index:800;
    max-width:90%;
    text-align:center;
}

.toast.show{
    display:block;
}


/* CELULAR */

@media(max-width:600px){

    .container{
        padding:12px;
    }

    .title-box h1{
        font-size:21px;
    }

    .connection-card{
        align-items:flex-start;
        padding:13px;
    }

    .avatar{
        width:48px;
        height:48px;
        font-size:20px;
    }

    .name{
        font-size:15px;
    }

    .actions{
        min-width:88px;
    }

    .btn{
        width:100%;
        padding:8px 7px;
        font-size:11px;
    }

}

</style>

<main class="container">

    <!-- SOLICITUDES RECIBIDAS -->

<nav class="bottom-nav">

    <div class="bottom-nav-inner">


        <button

        </button>

</nav>



<div
    id="toast"
    class="toast"
></div>



<script type="module">


import {
    auth,
    db
} from "./Js/firebase.js";


import {
    onAuthStateChanged,
    signOut
} from "https://www.gstatic.com/firebasejs/12.18.0/firebase-auth.js";


import {
    collection,
    getDocs,
    query,
    where,
    doc,
    getDoc,
    updateDoc,
    deleteDoc
} from "https://www.gstatic.com/firebasejs/12.18.0/firebase-firestore.js";



const solicitudesRecibidas =
    document.getElementById(
        "solicitudesRecibidas"
    );


const misConexiones =
    document.getElementById(
        "misConexiones"
    );


const solicitudesEnviadas =
    document.getElementById(
        "solicitudesEnviadas"
    );


const contadorRecibidas =
    document.getElementById(
        "contadorRecibidas"
    );


const contadorConexiones =
    document.getElementById(
        "contadorConexiones"
    );


const contadorEnviadas =
    document.getElementById(
        "contadorEnviadas"
    );


const btnSalir =
    document.getElementById(
        "btnSalir"
    );


const toast =
    document.getElementById(
        "toast"
    );



let usuarioActual = null;



/* =========================
   TOAST
========================= */

function mostrarToast(
    mensaje
){

    toast.textContent =
        mensaje;

    toast.classList.add(
        "show"
    );


    setTimeout(
        () => {

            toast.classList.remove(
                "show"
            );

        },
        2500
    );

}



/* =========================
   AUTENTICACION
========================= */

onAuthStateChanged(
    auth,
    async (user) => {

        if(!user){

            window.location.href =
                "red-login.html";

            return;

        }


        usuarioActual =
            user;


        await cargarConexiones();

    }
);



/* =========================
   CARGAR TODO
========================= */

async function cargarConexiones(){

    solicitudesRecibidas.innerHTML =
        `<div class="loading">
            Cargando solicitudes...
        </div>`;


    misConexiones.innerHTML =
        `<div class="loading">
            Cargando conexiones...
        </div>`;


    solicitudesEnviadas.innerHTML =
        `<div class="loading">
            Cargando solicitudes...
        </div>`;


    try{

        /*
         * Obtenemos todas las conexiones
         * del usuario como emisor.
         */

        const qEnviadas =
            query(
                collection(
                    db,
                    "conexiones"
                ),
                where(
                    "emisor",
                    "==",
                    usuarioActual.uid
                )
            );


        /*
         * Obtenemos todas las conexiones
         * del usuario como receptor.
         */

        const qRecibidas =
            query(
                collection(
                    db,
                    "conexiones"
                ),
                where(
                    "receptor",
                    "==",
                    usuarioActual.uid
                )
            );


        const [
            snapshotEnviadas,
            snapshotRecibidas
        ] =
            await Promise.all([
                getDocs(qEnviadas),
                getDocs(qRecibidas)
            ]);


        const recibidas = [];
        const enviadas = [];
        const conexiones = [];


        snapshotRecibidas.forEach(
            documento => {

                const data =
                    documento.data();


                recibidas.push({

                    id:
                        documento.id,

                    ...data

                });


            }
        );


        snapshotEnviadas.forEach(
            documento => {

                const data =
                    documento.data();


                enviadas.push({

                    id:
                        documento.id,

                    ...data

                });

            }
        );


        /*
         * Las aceptadas pueden estar
         * tanto en enviadas como recibidas.
         */

        recibidas.forEach(
            conexion => {

                if(
                    conexion.estado ===
                    "aceptada"
                ){

                    conexiones.push({

                        ...conexion,

                        otroUsuario:
                            conexion.emisor

                    });

                }

            }
        );


        enviadas.forEach(
            conexion => {

                if(
                    conexion.estado ===
                    "aceptada"
                ){

                    conexiones.push({

                        ...conexion,

                        otroUsuario:
                            conexion.receptor

                    });

                }

            }
        );


        const pendientesRecibidas =
            recibidas.filter(
                conexion =>
                    conexion.estado ===
                    "pendiente"
            );


        const pendientesEnviadas =
            enviadas.filter(
                conexion =>
                    conexion.estado ===
                    "pendiente"
            );


        contadorRecibidas.textContent =
            pendientesRecibidas.length;


        contadorEnviadas.textContent =
            pendientesEnviadas.length;


        contadorConexiones.textContent =
            conexiones.length;


        await renderSolicitudesRecibidas(
            pendientesRecibidas
        );


        await renderSolicitudesEnviadas(
            pendientesEnviadas
        );


        await renderMisConexiones(
            conexiones
        );


    }catch(error){

        console.error(
            "Error cargando conexiones:",
            error
        );


        const mensaje =
            `<div class="empty">
                No se pudieron cargar las conexiones.
                <br><br>
                Revisá tu conexión e intentá nuevamente.
            </div>`;


        solicitudesRecibidas.innerHTML =
            mensaje;


        misConexiones.innerHTML =
            mensaje;


        solicitudesEnviadas.innerHTML =
            mensaje;

    }

}



/* =========================
   DATOS DEL PERFIL
========================= */

async function obtenerPerfil(
    uid
){

    try{

        /*
         * Primero buscamos en
         * directorio_red.
         */

        const referencia =
            doc(
                db,
                "directorio_red",
                uid
            );


        const snapshot =
            await getDoc(
                referencia
            );


        if(
            snapshot.exists()
        ){

            return {

                uid:
                    uid,

                ...snapshot.data()

            };

        }


        /*
         * Si no existe,
         * usamos un perfil básico.
         */

        return {

            uid:
                uid,

            nombreCompleto:
                "Usuario GESBASE",

            tipo:
                "persona",

            fotoURL:
                "",

            localidad:
                "",

            provincia:
                ""

        };


    }catch(error){

        console.error(
            "Error obteniendo perfil:",
            error
        );


        return {

            uid:
                uid,

            nombreCompleto:
                "Usuario GESBASE",

            tipo:
                "persona"

        };

    }

}



/* =========================
   SOLICITUDES RECIBIDAS
========================= */

async function renderSolicitudesRecibidas(
    lista
){

    solicitudesRecibidas.innerHTML =
        "";


    if(
        lista.length === 0
    ){

        solicitudesRecibidas.innerHTML =
            `<div class="empty">
                No tenés solicitudes pendientes.
            </div>`;

        return;

    }


    for(
        const conexion of lista
    ){

        const perfil =
            await obtenerPerfil(
                conexion.emisor
            );


        const tarjeta =
            crearTarjetaPerfil(
                perfil
            );


        const acciones =
            document.createElement(
                "div"
            );


        acciones.className =
            "actions";


        const aceptar =
            document.createElement(
                "button"
            );


        aceptar.className =
            "btn btn-accept";


        aceptar.textContent =
            "Aceptar";


        aceptar.addEventListener(
            "click",
            () => {

                aceptarSolicitud(
                    conexion.id,
                    aceptar,
                    rechazar
                );

            }
        );


        const rechazar =
            document.createElement(
                "button"
            );


        rechazar.className =
            "btn btn-reject";


        rechazar.textContent =
            "Rechazar";


        rechazar.addEventListener(
            "click",
            () => {

                rechazarSolicitud(
                    conexion.id,
                    rechazar,
                    aceptar
                );

            }
        );


        acciones.appendChild(
            aceptar
        );


        acciones.appendChild(
            rechazar
        );


        tarjeta.appendChild(
            acciones
        );


        solicitudesRecibidas.appendChild(
            tarjeta
        );

    }

}



/* =========================
   MIS CONEXIONES
========================= */

async function renderMisConexiones(
    lista
){

    misConexiones.innerHTML =
        "";


    if(
        lista.length === 0
    ){

        misConexiones.innerHTML =
            `<div class="empty">
                Todavía no tenés conexiones.
                <br><br>
                Buscá personas y profesionales para comenzar.
            </div>`;

        return;

    }


    const procesadas =
        new Set();


    for(
        const conexion of lista
    ){

        if(
            procesadas.has(
                conexion.id
            )
        ){

            continue;

        }


        procesadas.add(
            conexion.id
        );


        const perfil =
            await obtenerPerfil(
                conexion.otroUsuario
            );


        const tarjeta =
            crearTarjetaPerfil(
                perfil
            );


        const acciones =
            document.createElement(
                "div"
            );


        acciones.className =
            "actions";


        const eliminar =
            document.createElement(
                "button"
            );


        eliminar.className =
            "btn btn-remove";


        eliminar.textContent =
            "Eliminar";


        eliminar.addEventListener(
            "click",
            () => {

                eliminarConexion(
                    conexion.id,
                    eliminar
                );

            }
        );


        acciones.appendChild(
            eliminar
        );


        tarjeta.appendChild(
            acciones
        );


        misConexiones.appendChild(
            tarjeta
        );

    }

}



/* =========================
   SOLICITUDES ENVIADAS
========================= */

async function renderSolicitudesEnviadas(
    lista
){

    solicitudesEnviadas.innerHTML =
        "";


    if(
        lista.length === 0
    ){

        solicitudesEnviadas.innerHTML =
            `<div class="empty">
                No tenés solicitudes enviadas pendientes.
            </div>`;

        return;

    }


    for(
        const conexion of lista
    ){

        const perfil =
            await obtenerPerfil(
                conexion.receptor
            );


        const tarjeta =
            crearTarjetaPerfil(
                perfil
            );


        const acciones =
            document.createElement(
                "div"
            );


        acciones.className =
            "actions";


        const cancelar =
            document.createElement(
                "button"
            );


        cancelar.className =
            "btn btn-cancel";


        cancelar.textContent =
            "Cancelar";


        cancelar.addEventListener(
            "click",
            () => {

                cancelarSolicitud(
                    conexion.id,
                    cancelar
                );

            }
        );


        acciones.appendChild(
            cancelar
        );


        tarjeta.appendChild(
            acciones
        );


        solicitudesEnviadas.appendChild(
            tarjeta
        );

    }

}



/* =========================
   CREAR TARJETA
========================= */

function crearTarjetaPerfil(
    perfil
){

    const tarjeta =
        document.createElement(
            "article"
        );


    tarjeta.className =
        "connection-card";


    const nombre =
        perfil.nombreCompleto ||
        "Usuario GESBASE";


    const avatar =
        document.createElement(
            "div"
        );


    avatar.className =
        "avatar";


    const foto =
        perfil.fotoURL ||
        perfil.fotoPerfil ||
        "";


    if(foto){

        const img =
            document.createElement(
                "img"
            );


        img.src =
            foto;


        img.alt =
            "";


        img.onerror =
            () => {

                img.remove();

                avatar.textContent =
                    nombre
                        .charAt(0)
                        .toUpperCase();

            };


        avatar.appendChild(
            img
        );

    }else{

        avatar.textContent =
            nombre
                .charAt(0)
                .toUpperCase();

    }


    const info =
        document.createElement(
            "div"
        );


    info.className =
        "info";


    const nombreElement =
        document.createElement(
            "div"
        );


    nombreElement.className =
        "name";


    nombreElement.textContent =
        nombre;


    const tipoElement =
        document.createElement(
            "div"
        );


    tipoElement.className =
        "type";


    tipoElement.textContent =
        convertirTipo(
            perfil.tipo
        );


    info.appendChild(
        nombreElement
    );


    info.appendChild(
        tipoElement
    );


    const localidad =
        perfil.localidad ||
        "";


    const provincia =
        perfil.provincia ||
        "";


    if(
        localidad ||
        provincia
    ){

        const location =
            document.createElement(
                "div"
            );


        location.className =
            "location";


        location.textContent =
            `📍 ${
                localidad
            }${
                localidad && provincia
                    ? ", "
                    : ""
            }${
                provincia
            }`;


        info.appendChild(
            location
        );

    }


    tarjeta.appendChild(
        avatar
    );


    tarjeta.appendChild(
        info
    );


    return tarjeta;

}



/* =========================
   TIPO
========================= */

function convertirTipo(
    tipo
){

    const valor =
        String(
            tipo || ""
        ).toLowerCase();


    const tipos = {

        persona:
            "Persona",

        profesional:
            "Profesional",

        trabajador:
            "Trabajador",

        empresa:
            "Empresa",

        comercio:
            "Comercio"

    };


    return tipos[valor] ||
        tipo ||
        "Usuario GESBASE";

}



/* =========================
   ACEPTAR
========================= */

async function aceptarSolicitud(
    id,
    boton,
    botonRechazar
){

    boton.disabled =
        true;

    botonRechazar.disabled =
        true;


    boton.textContent =
        "Aceptando...";


    try{

        const referencia =
            doc(
                db,
                "conexiones",
                id
            );


        await updateDoc(
            referencia,
            {
                estado:
                    "aceptada"
            }
        );


        mostrarToast(
            "Conexión aceptada."
        );


        await cargarConexiones();


    }catch(error){

        console.error(

        );

        botonRechazar.disabled =
