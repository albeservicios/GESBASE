<!DOCTYPE html>
<html lang="es">

<head>

<meta charset="UTF-8">

<meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
>

<meta
    name="theme-color"
    content="#111827"
>

<meta
    name="description"
    content="GESBASE - Ventas"
>

<title>Ventas - GESBASE</title>

<style>

*{
    box-sizing:border-box;
    margin:0;
    padding:0;
}

body{
    font-family:Arial,Helvetica,sans-serif;
    background:#f3f4f6;
    color:#111827;
    min-height:100vh;
}

header{
    background:#111827;
    color:white;
    padding:20px;
    text-align:center;
}

header h1{
    font-size:25px;
}

header p{
    margin-top:5px;
    color:#d1d5db;
    font-size:14px;
}

.container{
    width:100%;
    max-width:1100px;
    margin:auto;
    padding:18px;
}

.card{
    background:white;
    border-radius:14px;
    padding:18px;
    margin-bottom:18px;
    box-shadow:0 2px 8px rgba(0,0,0,.08);
}

h2{
    font-size:19px;
    margin-bottom:15px;
}

.grid{
    display:grid;
    grid-template-columns:1fr 1fr;
    gap:14px;
}

.full{
    grid-column:1 / -1;
}

label{
    display:block;
    font-size:13px;
    font-weight:bold;
    margin-bottom:6px;
}

input,
select{
    width:100%;
    padding:12px;
    border:1px solid #d1d5db;
    border-radius:10px;
    font-size:15px;
    background:white;
}

input:focus,
select:focus{
    outline:none;
    border-color:#2563eb;
    box-shadow:0 0 0 3px rgba(37,99,235,.12);
}

button{
    border:0;
    border-radius:10px;
    padding:12px 15px;
    font-size:15px;
    font-weight:bold;
    cursor:pointer;
}

button:disabled{
    opacity:.6;
    cursor:not-allowed;
}

.btn-primary{
    background:#2563eb;
    color:white;
}

.btn-success{
    background:#059669;
    color:white;
}

.btn-danger{
    background:#dc2626;
    color:white;
}

.btn-secondary{
    background:#e5e7eb;
    color:#111827;
}

.total-box{
    background:#ecfdf5;
    border:1px solid #a7f3d0;
    border-radius:12px;
    padding:18px;
    margin-top:16px;
    text-align:right;
}

.total-label{
    font-size:13px;
    color:#047857;
}

.total{
    font-size:28px;
    font-weight:bold;
    color:#047857;
    margin-top:4px;
}

.linea{
    display:grid;
    grid-template-columns:2fr 1fr 1fr auto;
    gap:10px;
    align-items:end;
    padding:14px 0;
    border-bottom:1px solid #e5e7eb;
}

.linea:last-child{
    border-bottom:0;
}

.producto-info{
    font-size:14px;
}

.producto-info strong{
    display:block;
}

.precio-info{
    font-size:13px;
    color:#6b7280;
    margin-top:4px;
}

.cantidad{
    text-align:center;
}

.resumen{
    margin-top:15px;
}

.resumen-row{
    display:flex;
    justify-content:space-between;
    padding:6px 0;
    font-size:14px;
}

.resumen-row.total-final{
    border-top:1px solid #e5e7eb;
    margin-top:8px;
    padding-top:12px;
    font-size:20px;
    font-weight:bold;
}

.tabla{
    overflow:auto;
}

table{
    width:100%;
    border-collapse:collapse;
    min-width:700px;
}

th,
td{
    padding:11px;
    border-bottom:1px solid #e5e7eb;
    text-align:left;
    font-size:14px;
}

th{
    background:#f9fafb;
}

.estado{
    font-weight:bold;
}

.estado.pagada{
    color:#047857;
}

.estado.pendiente{
    color:#d97706;
}

.estado.anulada{
    color:#dc2626;
}

.vacio{
    text-align:center;
    color:#6b7280;
    padding:25px;
}

.mensaje{
    display:none;
    padding:13px;
    border-radius:10px;
    margin-bottom:15px;
    font-size:14px;
    line-height:1.5;
}

.mensaje.error{
    display:block;
    background:#fee2e2;
    color:#991b1b;
    border:1px solid #fecaca;
}

.mensaje.exito{
    display:block;
    background:#dcfce7;
    color:#166534;
    border:1px solid #bbf7d0;
}

.mensaje.info{
    display:block;
    background:#dbeafe;
    color:#1e40af;
    border:1px solid #bfdbfe;
}

.botones{
    display:flex;
    gap:10px;
    flex-wrap:wrap;
    margin-top:16px;
}

.btn-volver{
    display:inline-block;
    margin-bottom:15px;
    color:#2563eb;
    text-decoration:none;
    font-weight:bold;
    font-size:14px;
}

.badge{
    display:inline-block;
    padding:5px 8px;
    border-radius:8px;
    font-size:12px;
    font-weight:bold;
    background:#eff6ff;
    color:#1d4ed8;
}

.sin-productos{
    padding:15px;
    background:#fff7ed;
    border:1px solid #fed7aa;
    border-radius:10px;
    color:#9a3412;
    line-height:1.5;
}

@media(max-width:768px){

    .container{
        padding:12px;
    }

    .grid{
        grid-template-columns:1fr;
    }

    .full{
        grid-column:auto;
    }

    .linea{
        grid-template-columns:1fr 1fr;
    }

    .linea .producto-info{
        grid-column:1 / -1;
    }

    .linea button{
        width:100%;
    }

}

@media(max-width:480px){

    header{
        padding:17px;
    }

    header h1{
        font-size:22px;
    }

    .card{
        padding:14px;
    }

    .total{
        font-size:24px;
    }

    .botones button{
        width:100%;
    }

}

</style>

</head>

<body>

<!-- =====================================================

🛒 Nueva venta

<div class="grid">


<div>

<div>

<option value="efectivo">

<div class="card">

>


<div class="tabla">

</tr>

    colspan="6"

>
Cargando ventas...
</td>

</div>

</div>


</div>


<script type="module">


/* =========================================================
   FIREBASE
========================================================= */

import {
    auth,
    db
} from "./Js/firebase.js";


import {
    onAuthStateChanged
} from "https://www.gstatic.com/firebasejs/12.18.0/firebase-auth.js";


import {
    collection,
    addDoc,
    getDocs,
    query,
    where,
    serverTimestamp
} from "https://www.gstatic.com/firebasejs/12.18.0/firebase-firestore.js";


/* =========================================================
   ELEMENTOS
========================================================= */

const mensaje =
    document.getElementById("mensaje");

const clienteInput =
    document.getElementById("cliente");

const medioPagoInput =
    document.getElementById("medioPago");

const estadoVentaInput =
    document.getElementById("estadoVenta");

const descuentoInput =
    document.getElementById("descuento");

const listaVenta =
    document.getElementById("listaVenta");

const totalVenta =
    document.getElementById("totalVenta");

const btnConfirmarVenta =
    document.getElementById("btnConfirmarVenta");

const btnLimpiar =
    document.getElementById("btnLimpiar");

const listaVentas =
    document.getElementById("listaVentas");

const buscarVenta =
    document.getElementById("buscarVenta");

const sinProductos =
    document.getElementById("sinProductos");


/* =========================================================
   VARIABLES
========================================================= */

let usuarioActual = null;

let empresaId = null;

let productos = [];

let carrito = [];

let ventas = [];


/* =========================================================
   MENSAJES
========================================================= */

function mostrarMensaje(
    texto,
    tipo
){

    mensaje.textContent =
        texto;

    mensaje.className =
        "mensaje " + tipo;

}


function ocultarMensaje(){

    mensaje.textContent =
        "";

    mensaje.className =
        "mensaje";

}


/* =========================================================
   ESCAPAR HTML
========================================================= */

function escaparHTML(valor){

    return String(valor ?? "")
        .replace(/&/g,"&amp;")
        .replace(/</g,"&lt;")
        .replace(/>/g,"&gt;")
        .replace(/"/g,"&quot;")
        .replace(/'/g,"&#039;");

}


/* =========================================================
   DINERO
========================================================= */

function formatearPesos(valor){

    return Number(valor || 0).toLocaleString(
        "es-AR",
        {
            style:"currency",
            currency:"ARS",
            minimumFractionDigits:2
        }
    );

}


/* =========================================================
   FECHA
========================================================= */

function formatearFecha(fecha){

    if(!fecha){

        return "-";

    }


    try{

        if(
            typeof fecha.toDate ===
            "function"
        ){

            fecha =
                fecha.toDate();

        }


        if(
            fecha instanceof Date
        ){

            return fecha.toLocaleDateString(
                "es-AR"
            );

        }


        return "-";

    }
    catch(error){

        return "-";

    }

}


/* =========================================================
   CARGAR PRODUCTOS
========================================================= */

async function cargarProductos(){

    if(!empresaId){

        return;

    }


    try{

        const consulta =
            query(
                collection(
                    db,
                    "productos"
                ),
                where(
                    "empresaId",
                    "==",
                    empresaId
                )
            );


        const snapshot =
            await getDocs(
                consulta
            );


        productos = [];


        snapshot.forEach(
            documento => {

                const datos =
                    documento.data();


                if(
                    datos.estado ===
                    "inactivo"
                ){

                    return;

                }


                productos.push({

                    id:
                        documento.id,

                    ...datos

                });

            }
        );


        productos.sort(
            (a,b) =>
                String(
                    a.nombre || ""
                ).localeCompare(
                    String(
                        b.nombre || ""
                    ),
                    "es"
                )
        );


        mostrarSelectorProductos();

    }
    catch(error){

        console.error(
            "ERROR CARGANDO PRODUCTOS:",
            error
        );


        mostrarMensaje(
            "No se pudieron cargar los productos: " +
            error.message,
            "error"
        );

    }

}


/* =========================================================
   MOSTRAR PRODUCTOS
========================================================= */

function mostrarSelectorProductos(){

    if(productos.length === 0){

        sinProductos.style.display =
            "block";

        listaVenta.innerHTML =
            "";

        return;

    }


    sinProductos.style.display =
        "none";


    listaVenta.innerHTML = `

        <div class="grid">

            <div class="full">

                <label>
                    Agregar producto
                </label>

                <select id="selectorProducto">

                    <option value="">
                        Seleccioná un producto...
                    </option>

                    ${
                        productos.map(
                            producto => `

                                <option
                                    value="${producto.id}"
                                >

                                    ${escaparHTML(
                                        producto.nombre
                                    )}

                                    -
                                    ${formatearPesos(
                                        producto.precioVenta
                                    )}

                                    ${
                                        producto.stock !== undefined
                                        ?
                                        " | Stock: " +
                                        Number(
                                            producto.stock || 0
                                        )
                                        :
                                        ""
                                    }

                                </option>

                            `
                        ).join("")
                    }

                </select>

            </div>

        </div>


        <div id="carritoVenta"></div>

    `;


    document
        .getElementById(
            "selectorProducto"
        )
        .addEventListener(
            "change",
            evento => {

                const id =
                    evento.target.value;


                if(!id){

                    return;

                }


                agregarAlCarrito(
                    id
                );


                evento.target.value =
                    "";

            }
        );


    renderCarrito();

}


/* =========================================================
   AGREGAR AL CARRITO
========================================================= */

function agregarAlCarrito(
    productoId
){

    const producto =
        productos.find(
            item =>
                item.id === productoId
        );


    if(!producto){

        return;

    }


    const existente =
        carrito.find(
            item =>
                item.productoId ===
                productoId
        );


    if(existente){

        existente.cantidad += 1;

    }
    else{

        carrito.push({

            productoId:
                producto.id,

            nombre:
                producto.nombre || "",

            precio:
                Number(
                    producto.precioVenta || 0
                ),

            stock:
                Number(
                    producto.stock || 0
                ),

            unidad:
                producto.unidad || "Unidad",

            cantidad:
                1

        });

    }


    renderCarrito();

}


/* =========================================================
   RENDER CARRITO
========================================================= */

function renderCarrito(){

    const contenedor =
        document.getElementById(
            "carritoVenta"
        );


    if(!contenedor){

        return;

    }


    if(carrito.length === 0){

        contenedor.innerHTML = `

            <div class="vacio">
                No hay productos agregados.
            </div>

        `;

        calcularTotal();

        return;

    }


    contenedor.innerHTML =
        carrito.map(
            (item,index) => `

                <div class="linea">

                    <div class="producto-info">

                        <strong>
                            ${escaparHTML(
                                item.nombre
                            )}
                        </strong>

                        <div class="precio-info">

                            ${
                                formatearPesos(
                                    item.precio
                                )
                            }

                            por
                            ${escaparHTML(
                                item.unidad
                            )}

                        </div>

                    </div>


                    <div>

                        <label>
                            Cantidad
                        </label>

                        <input
                            type="number"
                            min="1"
                            value="${item.cantidad}"
                            data-cantidad="${index}"
                            class="cantidad"
                        >

                    </div>


                    <div>

                        <label>
                            Subtotal
                        </label>

                        <input
                            type="text"
                            value="${formatearPesos(
                                item.precio *
                                item.cantidad
                            )}"
                            readonly
                        >

                    </div>


                    <div>

                        <button
                            type="button"
                            class="btn-danger"
                            data-quitar="${index}"
                        >
                            🗑️
                        </button>

                    </div>

                </div>

            `
        )
        .join("");


    document
        .querySelectorAll(
            "[data-cantidad]"
        )
        .forEach(
            input => {

                input.addEventListener(
                    "change",
                    () => {

                        const index =
                            Number(
                                input.dataset.cantidad
                            );


                        let cantidad =
                            Number(
                                input.value || 1
                            );


                        if(
                            !Number.isFinite(
                                cantidad
                            ) ||
                            cantidad < 1
                        ){

                            cantidad = 1;

                        }


                        const item =
                            carrito[index];


                        if(
                            item.stock > 0 &&
                            cantidad > item.stock
                        ){

                            cantidad =
                                item.stock;

                            mostrarMensaje(
                                "La cantidad no puede superar el stock disponible.",
                                "error"
                            );

                        }


                        item.cantidad =
                            cantidad;


                        renderCarrito();

                    }
                );

            }
        );


    document
        .querySelectorAll(
            "[data-quitar]"
        )
        .forEach(
            boton => {

                boton.addEventListener(
                    "click",
                    () => {

                        const index =
                            Number(
                                boton.dataset.quitar
                            );


                        carrito.splice(
                            index,
                            1
                        );


                        renderCarrito();

                    }
                );

            }
        );


    calcularTotal();

}


/* =========================================================
   CALCULAR TOTAL
========================================================= */

function calcularTotal(){

    let subtotal = 0;


    carrito.forEach(
        item => {

            subtotal +=
                Number(
                    item.precio || 0
                ) *
                Number(
                    item.cantidad || 0
                );

        }
    );


    let descuento =
        Number(
            descuentoInput.value || 0
        );


    if(
        !Number.isFinite(
            descuento
        ) ||
        descuento < 0
    ){

        descuento = 0;

    }


    if(
        descuento > subtotal
    ){

        descuento =
            subtotal;

    }


    const total =
        subtotal -
        descuento;


    totalVenta.textContent =
        formatearPesos(
            total
        );


    return {

        subtotal,
        descuento,
        total

    };

}


/* =========================================================
   DESCUENTO
========================================================= */

descuentoInput.addEventListener(
    "input",
    calcularTotal
);


/* =========================================================
   LIMPIAR
========================================================= */

function limpiarVenta(){

    clienteInput.value =
        "";

    medioPagoInput.value =
        "efectivo";

    estadoVentaInput.value =
        "pagada";

    descuentoInput.value =
        "0";

    carrito = [];

    renderCarrito();

    ocultarMensaje();

}


/* =========================================================
   CONFIRMAR VENTA
========================================================= */

async function confirmarVenta(){

    ocultarMensaje();


    if(!usuarioActual){

        mostrarMensaje(
            "No hay una sesión iniciada.",
            "error"
        );

        return;

    }


    if(!empresaId){

        mostrarMensaje(
            "No se pudo identificar la empresa.",
            "error"
        );

        return;

    }


    if(carrito.length === 0){

        mostrarMensaje(
            "Agregá al menos un producto a la venta.",
            "error"
        );

        return;

    }


    for(
        const item of carrito
    ){

        if(
            item.stock > 0 &&
            item.cantidad > item.stock
        ){

            mostrarMensaje(
                "El producto " +
                item.nombre +
                " no tiene stock suficiente.",
                "error"
            );

            return;

        }

    }


    const calculo =
        calcularTotal();


    if(
        calculo.total <= 0
    ){

        mostrarMensaje(
            "El total de la venta debe ser mayor a $ 0.",
            "error"
        );

        return;

    }


    const confirmar =
        confirm(
            "¿Confirmar venta por " +
            formatearPesos(
                calculo.total
            ) +
            "?"
        );


    if(!confirmar){

        return;

    }


    btnConfirmarVenta.disabled =
        true;

    btnConfirmarVenta.textContent =
        "Registrando...";


    try{

        const numeroVenta =
            "V-" +
            Date.now();


        await addDoc(
            collection(
                db,
                "ventas"
            ),
            {

                empresaId:
                    empresaId,

                propietarioId:
                    usuarioActual.uid,

                numeroVenta:
                    numeroVenta,

                cliente:
                    clienteInput.value.trim() ||
                    "Consumidor final",

                medioPago:
                    medioPagoInput.value,

                estado:
                    estadoVentaInput.value,

                productos:
                    carrito.map(
                        item => ({

                            productoId:
                                item.productoId,

                            nombre:
                                item.nombre,

                            cantidad:
                                item.cantidad,

                            unidad:
                                item.unidad,

                            precioUnitario:
                                item.precio,

                            subtotal:
                                item.precio *
                                item.cantidad

                        })
                    ),

                subtotal:
                    calculo.subtotal,

                descuento:
                    calculo.descuento,

                total:
                    calculo.total,

                fecha:
                    serverTimestamp(),

                fechaCreacion:
                    serverTimestamp()

            }
        );


        mostrarMensaje(
            "✅ Venta registrada correctamente. N° " +
            numeroVenta,
            "exito"
        );


        limpiarVenta();


        await cargarVentas();


    }
    catch(error){

        console.error(
            "ERROR REGISTRANDO VENTA:",
            error
        );


        mostrarMensaje(
            "No se pudo registrar la venta.\n\n" +
            error.message,
            "error"
        );

    }
    finally{

        btnConfirmarVenta.disabled =
            false;

        btnConfirmarVenta.textContent =
            "✅ Confirmar venta";

    }

}


/* =========================================================
   CARGAR HISTORIAL
========================================================= */

async function cargarVentas(){

    if(!empresaId){

        return;

    }


    listaVentas.innerHTML = `

        <tr>

            <td
                colspan="6"
                class="vacio"
            >
                Cargando ventas...
            </td>

        </tr>

    `;


    try{

        const consulta =
            query(
                collection(
                    db,
                    "ventas"
                ),
                where(
                    "empresaId",
                    "==",
                    empresaId
                )
            );


        const snapshot =
            await getDocs(
                consulta
            );


        ventas = [];


        snapshot.forEach(
            documento => {

                ventas.push({

                    id:
                        documento.id,

                    ...documento.data()

                });

            }
        );


        ventas.sort(
            (a,b) => {

                const ta =
                    a.fecha?.seconds ||
                    a.fechaCreacion?.seconds ||
                    0;

                const tb =
                    b.fecha?.seconds ||
                    b.fechaCreacion?.seconds ||
                    0;

                return tb - ta;

            }
        );


        mostrarVentas();

    }
    catch(error){

        console.error(
            "ERROR CARGANDO VENTAS:",
            error
        );


        listaVentas.innerHTML = `

            <tr>

                <td
                    colspan="6"
                    class="vacio"
                >
                    No se pudieron cargar las ventas.
                </td>

            </tr>

        `;

    }

}


/* =========================================================
   MOSTRAR VENTAS
========================================================= */

function mostrarVentas(){

    const texto =
        buscarVenta.value
            .trim()
            .toLowerCase();


    const filtradas =
        ventas.filter(
            venta => {

                const contenido = (

                    String(
                        venta.numeroVenta ||
                        ""
                    ) +

                    " " +

                    String(
                        venta.cliente ||
                        ""
                    ) +

                    " " +

                    String(
                        venta.medioPago ||
                        ""
                    )

                ).toLowerCase();


                return contenido.includes(
                    texto
                );

            }
        );


    if(
        filtradas.length === 0
    ){

        listaVentas.innerHTML = `

            <tr>

                <td
                    colspan="6"
                    class="vacio"
                >
                    No hay ventas para mostrar.
                </td>

            </tr>

        `;

        return;

    }


    listaVentas.innerHTML =
        filtradas.map(
            venta => {

                const estado =
                    String(
                        venta.estado ||
                        "pagada"
                    )
                    .toLowerCase();


                return `

                    <tr>

                        <td>

                            <span class="badge">

                                ${
                                    escaparHTML(
                                        venta.numeroVenta ||
                                        "-"
                                    )
                                }

                            </span>

                        </td>


                        <td>

                            ${
                                formatearFecha(
                                    venta.fecha ||
                                    venta.fechaCreacion
                                )
                            }

                        </td>


                        <td>

                            ${
                                escaparHTML(
                                    venta.cliente ||
                                    "Consumidor final"
                                )
                            }

                        </td>


                        <td>

                            ${
                                escaparHTML(
                                    venta.medioPago ||
                                    "-"
                                )
                            }

                        </td>


                        <td>

                            <strong>

                                ${
                                    formatearPesos(
                                        venta.total
                                    )
                                }

                            </strong>

                        </td>


                        <td>

                            <span
                                class="estado ${estado}"
                            >

                                ${
                                    escaparHTML(
                                        venta.estado ||
                                        "-"
                                    )
                                }

                            </span>

                        </td>

                    </tr>

                `;

            }
        )
        .join("");

}


/* =========================================================
   BUSCAR
========================================================= */

buscarVenta.addEventListener(
    "input",
    mostrarVentas
);


/* =========================================================
   BOTONES
========================================================= */

btnConfirmarVenta.addEventListener(
    "click",
    confirmarVenta
);


btnLimpiar.addEventListener(
    "click",

);

onAuthStateChanged(

    async usuario => {

        if(!usuario){

            window.location.replace(
                "login.html"
            );

            return;

        }


        usuarioActual =
            usuario;


        try{

            /*
             * Primero buscamos el documento
             * del usuario por UID.
             */

            const usuarioQuery =
                query(
                    collection(
                        db,
                        "usuarios"
                    ),
                    where(
                        "uid",
                        "==",
                        usuario.uid
                    )
                );


            const usuarioSnapshot =
                await getDocs(
                    usuarioQuery
                );


            if(
                !usuarioSnapshot.empty
            ){

                const datos =
                    usuarioSnapshot
                        .docs[0]
                        .data();


                empresaId =
                    String(
                        datos.empresaId ||
                        datos.idEmpresa ||
                        ""
                    ).trim();

            }


            /*
             * Compatibilidad con cuentas
             * anteriores.
             */

            if(!empresaId){

                const empresaQuery =
                    query(
                        collection(
                            db,
                            "empresas"
                        ),
                        where(
                            "propietarioId",
                            "==",
                            usuario.uid
                        )
                    );


                const empresaSnapshot =
                    await getDocs(
                        empresaQuery
                    );


                if(
                    !empresaSnapshot.empty
                ){

                    empresaId =
                        empresaSnapshot
                            .docs[0]
                            .id;

                }

            }


            /*
             * Último respaldo.
             */

            if(!empresaId){

                empresaId =
                    "EMP-" +
                    usuario.uid;

            }


            console.log(
                "GESBASE Ventas UID:",
                usuario.uid
            );


            console.log(
                "GESBASE Ventas empresaId:",
                empresaId
            );


            await cargarProductos();

            await cargarVentas();


        }
        catch(error){

            console.error(
                "ERROR INICIALIZANDO VENTAS:",
                error
            );


            mostrarMensaje(
                "No se pudo iniciar el módulo de ventas.\n\n" +
                error.message,
                "error"
            );

        }

    }
);
