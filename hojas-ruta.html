<!DOCTYPE html>
<html lang="es">

<head>

<meta charset="UTF-8">

<meta name="viewport" content="width=device-width, initial-scale=1.0">

<meta name="theme-color" content="#111827">

<title>Hojas de Ruta - GESBASE</title>

<style>

*{
    box-sizing:border-box;
}

body{
    margin:0;
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Arial,sans-serif;
    background:#f3f4f6;
    color:#111827;
}

header{
    background:#111827;
    color:white;
    padding:16px 20px;
    display:flex;
    align-items:center;
    justify-content:space-between;
    gap:15px;
    flex-wrap:wrap;
}

.logo{
    font-size:22px;
    font-weight:800;
}

.subtitulo{
    font-size:13px;
    opacity:.75;
    margin-top:3px;
}

.btn-volver{
    background:#374151;
    color:white;
    border:0;
    border-radius:9px;
    padding:10px 15px;
    cursor:pointer;
    font-weight:600;
}

main{
    max-width:1150px;
    margin:auto;
    padding:20px;
}

.card{
    background:white;
    border-radius:15px;
    padding:20px;
    margin-bottom:20px;
    box-shadow:0 3px 15px rgba(0,0,0,.07);
}

h1{
    margin:0 0 5px;
    font-size:25px;
}

h2{
    margin-top:0;
    font-size:20px;
}

.descripcion{
    color:#6b7280;
    margin-top:0;
}

.grid{
    display:grid;
    grid-template-columns:repeat(2,1fr);
    gap:15px;
}

.campo{
    display:flex;
    flex-direction:column;
    gap:6px;
}

.campo-completo{
    grid-column:1/-1;
}

label{
    font-weight:700;
    font-size:14px;
}

input,
select,
textarea{
    width:100%;
    padding:11px 12px;
    border:1px solid #d1d5db;
    border-radius:9px;
    font-size:15px;
    background:white;
}

textarea{
    min-height:90px;
    resize:vertical;
}

.btn-principal{
    margin-top:18px;
    width:100%;
    padding:13px;
    border:0;
    border-radius:10px;
    background:#111827;
    color:white;
    font-size:16px;
    font-weight:800;
    cursor:pointer;
}

.btn-principal:hover{
    background:#1f2937;
}

.mensaje{
    margin-top:12px;
    padding:12px;
    border-radius:9px;
    display:none;
    font-size:14px;
}

.exito{
    background:#dcfce7;
    color:#166534;
}

.error{
    background:#fee2e2;
    color:#991b1b;
}

.resumen{
    display:grid;
    grid-template-columns:repeat(4,1fr);
    gap:12px;
    margin-bottom:20px;
}

.resumen-item{
    background:#f9fafb;
    border:1px solid #e5e7eb;
    border-radius:12px;
    padding:15px;
}

.resumen-numero{
    font-size:25px;
    font-weight:800;
}

.resumen-texto{
    font-size:13px;
    color:#6b7280;
}

.lista{
    display:flex;
    flex-direction:column;
    gap:14px;
}

.ruta{
    border:1px solid #e5e7eb;
    border-radius:13px;
    padding:17px;
    background:#fff;
}

.ruta-cabecera{
    display:flex;
    justify-content:space-between;
    align-items:flex-start;
    gap:10px;
    flex-wrap:wrap;
}

.ruta-titulo{
    font-size:18px;
    font-weight:800;
}

.badge{
    display:inline-block;
    padding:6px 10px;
    border-radius:20px;
    font-size:12px;
    font-weight:800;
}

.planificada{
    background:#dbeafe;
    color:#1d4ed8;
}

.en-curso{
    background:#fef3c7;
    color:#92400e;
}

.finalizada{
    background:#dcfce7;
    color:#166534;
}

.cancelada{
    background:#fee2e2;
    color:#991b1b;
}

.datos-ruta{
    display:grid;
    grid-template-columns:repeat(3,1fr);
    gap:10px;
    margin-top:15px;
}

.dato{
    background:#f9fafb;
    padding:10px;
    border-radius:9px;
}

.dato small{
    display:block;
    color:#6b7280;
    font-size:11px;
    margin-bottom:3px;
}

.dato strong{
    font-size:14px;
}

.paradas{
    margin-top:15px;
    padding-top:15px;
    border-top:1px solid #e5e7eb;
}

.parada{
    display:inline-block;
    background:#eef2ff;
    color:#3730a3;
    padding:6px 10px;
    border-radius:15px;
    margin:3px;
    font-size:12px;
    font-weight:600;
}

.acciones{
    display:flex;
    gap:8px;
    flex-wrap:wrap;
    margin-top:15px;
}

.btn{
    border:0;
    border-radius:8px;
    padding:9px 12px;
    cursor:pointer;
    font-weight:700;
    font-size:13px;
}

.btn-curso{
    background:#fef3c7;
    color:#92400e;
}

.btn-finalizar{
    background:#dcfce7;
    color:#166534;
}

.btn-cancelar{
    background:#fee2e2;
    color:#991b1b;
}

.btn-imprimir{
    background:#e5e7eb;
    color:#111827;
}

.vacio{
    text-align:center;
    color:#6b7280;
    padding:30px 10px;
}

.cargando{
    text-align:center;
    padding:20px;
    color:#6b7280;
}

@media(max-width:700px){

    .grid{
        grid-template-columns:1fr;
    }

    .campo-completo{
        grid-column:auto;
    }

    .resumen{
        grid-template-columns:repeat(2,1fr);
    }

    .datos-ruta{
        grid-template-columns:1fr 1fr;
    }

}

@media(max-width:450px){

    main{
        padding:12px;
    }

    .resumen{
        grid-template-columns:1fr 1fr;
    }

    .datos-ruta{
        grid-template-columns:1fr;
    }

}

@media print{

    header,
    #formularioRuta,
    .acciones,
    .resumen{
        display:none !important;
    }

    body{
        background:white;
    }

    main{
        max-width:none;
    }

    .card{
        box-shadow:none;
    }

}

</style>

</head>

<body>

<header>

    <div>
        <div class="logo">GESBASE</div>
        <div class="subtitulo">Hojas de Ruta</div>
    </div>

    <button class="btn-volver" onclick="volver()">
        ← Volver
    </button>

</header>


<main>

    <div class="card">

        <h1>🛣️ Hojas de Ruta</h1>

        <p class="descripcion">
            Planificá y controlá los recorridos de tus unidades.
        </p>

    </div>


    <!-- RESUMEN -->

    <div class="resumen">

        <div class="resumen-item">
            <div class="resumen-numero" id="totalRutas">0</div>
            <div class="resumen-texto">Total</div>
        </div>

        <div class="resumen-item">
            <div class="resumen-numero" id="rutasPlanificadas">0</div>
            <div class="resumen-texto">Planificadas</div>
        </div>

        <div class="resumen-item">
            <div class="resumen-numero" id="rutasCurso">0</div>
            <div class="resumen-texto">En curso</div>
        </div>

        <div class="resumen-item">
            <div class="resumen-numero" id="rutasFinalizadas">0</div>
            <div class="resumen-texto">Finalizadas</div>
        </div>

    </div>


    <!-- FORMULARIO -->

    <div class="card" id="formularioRuta">

        <h2>➕ Nueva hoja de ruta</h2>

        <div class="grid">

            <div class="campo">
                <label>Fecha</label>
                <input type="date" id="fecha">
            </div>

            <div class="campo">
                <label>Unidad</label>
                <select id="unidad">
                    <option value="">Seleccionar unidad...</option>
                </select>
            </div>

            <div class="campo">
                <label>Chofer</label>
                <select id="chofer">
                    <option value="">Seleccionar chofer...</option>
                </select>
            </div>

            <div class="campo">
                <label>Hora de salida</label>
                <input type="time" id="horaSalida">
            </div>

            <div class="campo">
                <label>Origen</label>
                <input
                    type="text"
                    id="origen"
                    placeholder="Ej.: Catriel"
                >
            </div>

            <div class="campo">
                <label>Destino</label>
                <input
                    type="text"
                    id="destino"
                    placeholder="Ej.: Neuquén"
                >
            </div>

            <div class="campo">
                <label>Kilometraje inicial</label>
                <input
                    type="number"
                    id="kmInicial"
                    min="0"
                    placeholder="Ej.: 125430"
                >
            </div>

            <div class="campo">
                <label>Kilometraje final</label>
                <input
                    type="number"
                    id="kmFinal"
                    min="0"
                    placeholder="Se completa al finalizar"
                >
            </div>

            <div class="campo campo-completo">
                <label>Paradas / localidades</label>

                <input
                    type="text"
                    id="paradas"
                    placeholder="Ej.: 25 de Mayo, Colonia Catriel, Añelo"
                >

            </div>

            <div class="campo campo-completo">

                <label>Observaciones</label>

                <textarea
                    id="observaciones"
                    placeholder="Detalles del viaje, carga, documentación, etc."
                ></textarea>

            </div>

        </div>

        <button class="btn-principal" onclick="crearHojaRuta()">
            Crear hoja de ruta
        </button>

        <div id="mensaje" class="mensaje"></div>

    </div>


    <!-- LISTADO -->

    <div class="card">

        <h2>📋 Hojas de ruta registradas</h2>

        <div id="listaRutas" class="lista">

            <div class="cargando">
                Cargando hojas de ruta...
            </div>

        </div>

    </div>

</main>


<script type="module">

import {
    auth,
    db
} from "./Js/firebase.js";

import {
    onAuthStateChanged
} from "https://www.gstatic.com/firebasejs/12.18.0/firebase-auth.js";

import {
    collection,
    addDoc,
    getDocs,
    query,
    where,
    orderBy,
    serverTimestamp,
    updateDoc,
    doc
} from "https://www.gstatic.com/firebasejs/12.18.0/firebase-firestore.js";


let usuarioActual = null;
let empresaActualId = null;

let unidades = [];
let choferes = [];
let hojasRuta = [];


// =========================================================
// FECHA ACTUAL
// =========================================================

document.getElementById("fecha").value =
    new Date().toISOString().split("T")[0];


// =========================================================
// AUTH
// =========================================================

onAuthStateChanged(auth, async (usuario) => {

    if (!usuario) {

        window.location.href = "login.html";

        return;
    }

    usuarioActual = usuario;

    await cargarEmpresa();

});


// =========================================================
// CARGAR EMPRESA
// =========================================================

async function cargarEmpresa(){

    try{

        const q = query(
            collection(db, "usuarios"),
            where("__name__", "==", usuarioActual.uid)
        );

        const snap = await getDocs(q);

        if(snap.empty){

            mostrarError("No se encontró el usuario.");

            return;
        }

        const datos = snap.docs[0].data();

        empresaActualId =
            datos.empresaId ||
            datos.idEmpresa ||
            datos.empresa;

        if(!empresaActualId){

            mostrarError("No se encontró la empresa asociada.");

            return;
        }

        await verificarModulo();

    }catch(error){

        console.error(error);

        mostrarError("No se pudo cargar la empresa.");

    }

}


// =========================================================
// VERIFICAR MÓDULO
// =========================================================

async function verificarModulo(){

    try{

        const empresaRef = doc(
            db,
            "empresas",
            empresaActualId
        );

        const empresaSnap =
            await getDocs(
                query(
                    collection(db, "empresas"),
                    where("__name__", "==", empresaActualId)
                )
            );

        if(!empresaSnap.empty){

            const empresa = empresaSnap.docs[0].data();

            const modulos = empresa.modulos || {};

            if(
                empresa.rubro === "transporte" &&
                modulos.hojasRuta === false
            ){

                mostrarError(
                    "El módulo Hojas de Ruta no está habilitado para esta empresa."
                );

                return;
            }

        }

        await cargarDatos();

    }catch(error){

        console.error(error);

        await cargarDatos();

    }

}


// =========================================================
// CARGAR UNIDADES Y CHOFERES
// =========================================================

async function cargarDatos(){

    try{

        const unidadesSnap = await getDocs(
            query(
                collection(db, "unidades"),
                where("empresaId", "==", empresaActualId)
            )
        );

        unidades = unidadesSnap.docs.map(d => ({
            id:d.id,
            ...d.data()
        }));


        const choferesSnap = await getDocs(
            query(
                collection(db, "choferes"),
                where("empresaId", "==", empresaActualId)
            )
        );

        choferes = choferesSnap.docs.map(d => ({
            id:d.id,
            ...d.data()
        }));


        llenarUnidades();
        llenarChoferes();

        await cargarHojasRuta();

    }catch(error){

        console.error(error);

        mostrarError(
            "No se pudieron cargar las unidades y choferes."
        );

    }

}


// =========================================================
// LLENAR UNIDADES
// =========================================================

function llenarUnidades(){

    const select =
        document.getElementById("unidad");

    select.innerHTML =
        `<option value="">Seleccionar unidad...</option>`;

    unidades.forEach(unidad => {

        const option =
            document.createElement("option");

        option.value = unidad.id;

        option.textContent =
            `${unidad.patente || "Sin patente"} - ${unidad.tipo || "Unidad"}`;

        select.appendChild(option);

    });

}


// =========================================================
// LLENAR CHOFERES
// =========================================================

function llenarChoferes(){

    const select =
        document.getElementById("chofer");

    select.innerHTML =
        `<option value="">Seleccionar chofer...</option>`;

    choferes.forEach(chofer => {

        const nombre =
            chofer.nombreCompleto ||
            `${chofer.nombre || ""} ${chofer.apellido || ""}`.trim() ||
            chofer.nombre ||
            "Chofer";

        const option =
            document.createElement("option");

        option.value = chofer.id;

        option.textContent = nombre;

        select.appendChild(option);

    });

}


// =========================================================
// CAMBIO DE UNIDAD
// =========================================================

document.getElementById("unidad")
.addEventListener("change", function(){

    const unidadId = this.value;

    if(!unidadId) return;

    const unidad =
        unidades.find(u => u.id === unidadId);

    if(!unidad) return;


    // Completar chofer asociado

    if(unidad.choferId){

        document.getElementById("chofer").value =
            unidad.choferId;

    }


    // Completar kilometraje

    if(
        unidad.kilometraje !== undefined &&
        unidad.kilometraje !== null
    ){

        document.getElementById("kmInicial").value =
            unidad.kilometraje;

    }

});


// =========================================================
// CREAR HOJA DE RUTA
// =========================================================

window.crearHojaRuta = async function(){

    const fecha =
        document.getElementById("fecha").value;

    const unidadId =
        document.getElementById("unidad").value;

    const choferId =
        document.getElementById("chofer").value;

    const horaSalida =
        document.getElementById("horaSalida").value;

    const origen =
        document.getElementById("origen").value.trim();

    const destino =
        document.getElementById("destino").value.trim();

    const kmInicial =
        Number(document.getElementById("kmInicial").value || 0);

    const paradasTexto =
        document.getElementById("paradas").value.trim();

    const observaciones =
        document.getElementById("observaciones").value.trim();


    if(!fecha){

        mostrarError("Seleccioná una fecha.");

        return;
    }

    if(!unidadId){

        mostrarError("Seleccioná una unidad.");

        return;
    }

    if(!choferId){

        mostrarError("Seleccioná un chofer.");

        return;
    }

    if(!origen){

        mostrarError("Ingresá el origen.");

        return;
    }

    if(!destino){

        mostrarError("Ingresá el destino.");

        return;
    }


    const unidad =
        unidades.find(u => u.id === unidadId);

    const chofer =
        choferes.find(c => c.id === choferId);


    const nombreChofer =
        chofer?.nombreCompleto ||
        `${chofer?.nombre || ""} ${chofer?.apellido || ""}`.trim() ||
        chofer?.nombre ||
        "";


    const numeroRuta =
        "R-" +
        Date.now().toString().slice(-8);


    const paradas =
        paradasTexto
        ? paradasTexto
            .split(",")
            .map(p => p.trim())
            .filter(Boolean)
        : [];


    try{

        await addDoc(
            collection(db, "hojasRuta"),
            {

                empresaId:
                    empresaActualId,

                numeroRuta,

                fecha,

                unidadId,

                patente:
                    unidad?.patente || "",

                unidadTipo:
                    unidad?.tipo || "",

                choferId,

                choferNombre:
                    nombreChofer,

                origen,

                destino,

                paradas,

                horaSalida,

                horaLlegada:"",

                kmInicial,

                kmFinal:null,

                kilometrosRecorridos:null,

                estado:"Planificada",

                observaciones,

                creadoPor:
                    usuarioActual.uid,

                creadoEn:
                    serverTimestamp(),

                actualizadoEn:
                    serverTimestamp()

            }
        );


        mostrarExito(
            `Hoja de ruta ${numeroRuta} creada correctamente.`
        );


        limpiarFormulario();

        await cargarHojasRuta();

    }catch(error){

        console.error(error);

        mostrarError(
            "No se pudo crear la hoja de ruta."
        );

    }

};


// =========================================================
// CARGAR HOJAS DE RUTA
// =========================================================

async function cargarHojasRuta(){

    try{

        const q = query(
            collection(db, "hojasRuta"),
            where("empresaId", "==", empresaActualId)
        );

        const snap =
            await getDocs(q);

        hojasRuta =
            snap.docs.map(d => ({
                id:d.id,
                ...d.data()
            }));


        hojasRuta.sort((a,b) => {

            const fechaA =
                a.fecha || "";

            const fechaB =
                b.fecha || "";

            return fechaB.localeCompare(fechaA);

        });


        mostrarResumen();

        mostrarHojasRuta();

    }catch(error){

        console.error(error);

        document.getElementById("listaRutas").innerHTML =
            `<div class="vacio">
                No se pudieron cargar las hojas de ruta.
            </div>`;

    }

}


// =========================================================
// RESUMEN
// =========================================================

function mostrarResumen(){

    const total =
        hojasRuta.length;

    const planificadas =
        hojasRuta.filter(
            r => r.estado === "Planificada"
        ).length;

    const curso =
        hojasRuta.filter(
            r => r.estado === "En curso"
        ).length;

    const finalizadas =
        hojasRuta.filter(
            r => r.estado === "Finalizada"
        ).length;


    document.getElementById("totalRutas")
        .textContent = total;

    document.getElementById("rutasPlanificadas")
        .textContent = planificadas;

    document.getElementById("rutasCurso")
        .textContent = curso;

    document.getElementById("rutasFinalizadas")
        .textContent = finalizadas;

}


// =========================================================
// MOSTRAR LISTADO
// =========================================================

function mostrarHojasRuta(){

    const contenedor =
        document.getElementById("listaRutas");


    if(!hojasRuta.length){

        contenedor.innerHTML =
            `<div class="vacio">
                Todavía no hay hojas de ruta registradas.
            </div>`;

        return;
    }


    contenedor.innerHTML = "";


    hojasRuta.forEach(ruta => {

        const div =
            document.createElement("div");

        div.className = "ruta";


        const estadoClase =
            ruta.estado
            ?.toLowerCase()
            .replace(" ","-") || "planificada";


        const paradasHTML =
            (ruta.paradas || [])
            .map(p =>
                `<span class="parada">${escapeHTML(p)}</span>`
            )
            .join("");


        let acciones = "";


        if(ruta.estado === "Planificada"){

            acciones += `
                <button
                    class="btn btn-curso"
                    onclick="cambiarEstado('${ruta.id}','En curso')"
                >
                    ▶ Iniciar viaje
                </button>
            `;

        }


        if(ruta.estado === "En curso"){

            acciones += `
                <button
                    class="btn btn-finalizar"
                    onclick="finalizarRuta('${ruta.id}')"
                >
                    ✓ Finalizar viaje
                </button>
            `;

        }


        if(
            ruta.estado !== "Finalizada" &&
            ruta.estado !== "Cancelada"
        ){

            acciones += `
                <button
                    class="btn btn-cancelar"
                    onclick="cambiarEstado('${ruta.id}','Cancelada')"
                >
                    Cancelar
                </button>
            `;

        }


        acciones += `
            <button
                class="btn btn-imprimir"
                onclick="imprimirRuta('${ruta.id}')"
            >
                🖨️ Imprimir
            </button>
        `;


        div.innerHTML = `

            <div class="ruta-cabecera">

                <div>

                    <div class="ruta-titulo">
                        ${escapeHTML(ruta.numeroRuta || "Hoja de ruta")}
                    </div>

                    <div style="color:#6b7280;font-size:13px;margin-top:4px;">
                        ${escapeHTML(ruta.fecha || "")}
                    </div>

                </div>

                <span class="badge ${estadoClase}">
                    ${escapeHTML(ruta.estado || "Planificada")}
                </span>

            </div>


            <div class="datos-ruta">

                <div class="dato">
                    <small>🚛 Unidad</small>
                    <strong>
                        ${escapeHTML(ruta.patente || "-")}
                    </strong>
                </div>

                <div class="dato">
                    <small>👨‍✈️ Chofer</small>
                    <strong>
                        ${escapeHTML(ruta.choferNombre || "-")}
                    </strong>
                </div>

                <div class="dato">
                    <small>🕐 Salida</small>
                    <strong>
                        ${escapeHTML(ruta.horaSalida || "-")}
                    </strong>
                </div>

                <div class="dato">
                    <small>📍 Origen</small>
                    <strong>
                        ${escapeHTML(ruta.origen || "-")}
                    </strong>
                </div>

                <div class="dato">
                    <small>🏁 Destino</small>
                    <strong>
                        ${escapeHTML(ruta.destino || "-")}
                    </strong>
                </div>

                <div class="dato">
                    <small>🛣️ Kilómetros</small>
                    <strong>
                        ${mostrarKilometros(ruta)}
                    </strong>
                </div>

            </div>


            ${
                paradasHTML
                ? `
                    <div class="paradas">

                        <strong style="font-size:13px;">
                            📌 Paradas
                        </strong>

                        <div>
                            ${paradasHTML}
                        </div>

                    </div>
                `
                : ""
            }


            ${
                ruta.observaciones
                ? `
                    <div style="
                        margin-top:12px;
                        color:#4b5563;
                        font-size:13px;
                    ">
                        📝 ${escapeHTML(ruta.observaciones)}
                    </div>
                `
                : ""
            }


            <div class="acciones">
                ${acciones}
            </div>

        `;


        contenedor.appendChild(div);

    });

}


// =========================================================
// MOSTRAR KM
// =========================================================

function mostrarKilometros(ruta){

    if(
        ruta.kmInicial !== null &&
        ruta.kmInicial !== undefined &&
        ruta.kmFinal !== null &&
        ruta.kmFinal !== undefined
    ){

        const recorrido =
            ruta.kilometrosRecorridos ??
            (Number(ruta.kmFinal) - Number(ruta.kmInicial));

        return `${recorrido} km`;

    }


    if(
        ruta.kmInicial !== null &&
        ruta.kmInicial !== undefined
    ){

        return `${ruta.kmInicial} km inicial`;

    }


    return "-";

}


// =========================================================
// CAMBIAR ESTADO
// =========================================================

window.cambiarEstado = async function(
    id,
    nuevoEstado
){

    try{

        const ref =
            doc(db,"hojasRuta",id);

        const cambios = {

            estado:nuevoEstado,

            actualizadoEn:
                serverTimestamp()

        };


        if(nuevoEstado === "En curso"){

            cambios.horaInicio =
                new Date().toLocaleTimeString(
                    "es-AR",
                    {
                        hour:"2-digit",
                        minute:"2-digit"
                    }
                );

        }


        await updateDoc(
            ref,
            cambios
        );


        await cargarHojasRuta();

    }catch(error){

        console.error(error);

        mostrarError(
            "No se pudo actualizar el estado."
        );

    }

};


// =========================================================
// FINALIZAR RUTA
// =========================================================

window.finalizarRuta = async function(id){

    const ruta =
        hojasRuta.find(r => r.id === id);

    if(!ruta) return;


    const kmFinalTexto =
        prompt(
            "Ingresá el kilometraje final de la unidad:",
            ruta.kmFinal || ""
        );


    if(kmFinalTexto === null) return;


    const kmFinal =
        Number(kmFinalTexto);


    if(
        isNaN(kmFinal) ||
        kmFinal < Number(ruta.kmInicial || 0)
    ){

        alert(
            "El kilometraje final no puede ser menor al inicial."
        );

        return;
    }


    const kilometrosRecorridos =
        kmFinal - Number(ruta.kmInicial || 0);


    const horaLlegada =
        new Date().toLocaleTimeString(
            "es-AR",
            {
                hour:"2-digit",
                minute:"2-digit"
            }
        );


    try{

        await updateDoc(
            doc(db,"hojasRuta",id),
            {

                estado:"Finalizada",

                kmFinal,

                kilometrosRecorridos,

                horaLlegada,

                actualizadoEn:
                    serverTimestamp()

            }
        );


        // Actualizar kilometraje de la unidad

        if(ruta.unidadId){

            try{

                await updateDoc(
                    doc(
                        db,
                        "unidades",
                        ruta.unidadId
                    ),
                    {

                        kilometraje:kmFinal,

                        actualizadoEn:
                            serverTimestamp()

                    }
                );

            }catch(error){

                console.warn(
                    "No se pudo actualizar el kilometraje de la unidad.",
                    error
                );

            }

        }


        await cargarHojasRuta();

    }catch(error){

        console.error(error);

        mostrarError(
            "No se pudo finalizar la hoja de ruta."
        );

    }

};

function mostrarExito(texto){

    const mensaje =
        document.getElementById("mensaje");

    mensaje.className =
        "mensaje exito";

    mensaje.textContent =
        texto;

    mensaje.style.display =
        "block";

}


function mostrarError(texto){

    const mensaje =
        document.getElementById("mensaje");

    mensaje.className =
        "mensaje error";

    mensaje.textContent =
        texto;

    mensaje.style.display =
        "block";

}


// =========================================================
// ESCAPE HTML
// =========================================================

function escapeHTML(valor){

    return String(valor ?? "")
        .replace(/&/g,"&amp;")
        .replace(/</g,"&lt;")
        .replace(/>/g,"&gt;")
        .replace(/"/g,"&quot;")
        .replace(/'/g,"&#039;");

}
