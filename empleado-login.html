<!DOCTYPE html>
<html lang="es">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#111827">

<title>GESBASE - Acceso empleado</title>

<style>

*{
    box-sizing:border-box;
    margin:0;
    padding:0;
}

body{
    font-family:Arial,sans-serif;
    background:#f3f4f6;
    color:#111827;
    min-height:100vh;
}

.contenedor{
    width:100%;
    max-width:500px;
    min-height:100vh;
    margin:auto;
    display:flex;
    align-items:center;
    justify-content:center;
    padding:20px;
}

.tarjeta{
    width:100%;
    background:white;
    border:1px solid #e5e7eb;
    border-radius:18px;
    padding:28px;
    box-shadow:0 8px 30px rgba(0,0,0,.08);
}

.logo{
    text-align:center;
    margin-bottom:25px;
}

.logo h1{
    font-size:30px;
}

.logo p{
    margin-top:7px;
    color:#6b7280;
    font-size:15px;
}

.titulo{
    font-size:21px;
    font-weight:bold;
    margin-bottom:18px;
    text-align:center;
}

.campo{
    margin-bottom:16px;
}

.campo label{
    display:block;
    font-size:14px;
    font-weight:bold;
    margin-bottom:7px;
}

.campo input{
    width:100%;
    padding:15px;
    border:1px solid #d1d5db;
    border-radius:10px;
    font-size:16px;
    outline:none;
}

.campo input:focus{
    border-color:#2563eb;
}

.boton{
    width:100%;
    border:none;
    border-radius:11px;
    padding:16px;
    font-size:16px;
    font-weight:bold;
    cursor:pointer;
    margin-top:8px;
}

.boton-principal{
    background:#111827;
    color:white;
}

.boton-principal:disabled{
    opacity:.6;
    cursor:not-allowed;
}

.boton-volver{
    background:#e5e7eb;
    color:#111827;
}

.mensaje{
    padding:13px;
    border-radius:10px;
    margin-bottom:16px;
    font-size:14px;
    line-height:1.5;
    display:none;
}

.error{
    background:#fee2e2;
    color:#991b1b;
}

.exito{
    background:#dcfce7;
    color:#166534;
}

.info{
    margin-top:20px;
    padding:12px;
    background:#eff6ff;
    color:#1e40af;
    border-radius:10px;
    font-size:13px;
    line-height:1.5;
    text-align:center;
}

.cargando{
    text-align:center;
    color:#6b7280;
    padding:10px;
    display:none;
}

.pie{
    text-align:center;
    margin-top:20px;
    color:#9ca3af;
    font-size:12px;
}

</style>

</head>

<body>

<div class="contenedor">

<div class="tarjeta">

<div class="logo">

<h1>GESBASE</h1>

<p>Acceso exclusivo para empleados</p>

</div>


<div
id="mensajeError"
class="mensaje error"
></div>


<div
id="mensajeExito"
class="mensaje exito"
></div>


<div
id="cargando"
class="cargando"
>
Verificando acceso...
</div>


<div id="formularioLogin">

<div class="titulo">
Iniciar sesión
</div>


<div class="campo">

<label for="email">
Email
</label>

<input
type="email"
id="email"
placeholder="Ingresá tu email"
autocomplete="username"
>

</div>


<div class="campo">

<label for="password">
Contraseña
</label>

<input
type="password"
id="password"
placeholder="Ingresá tu contraseña"
autocomplete="current-password"
>

</div>


<button
id="btnIngresar"
class="boton boton-principal"
>
INGRESAR
</button>


<button
id="btnVolver"
class="boton boton-volver"
>
⬅️ VOLVER
</button>

</div>


<div class="info">

🔐 Utilizá el email y contraseña
que te proporcionó el administrador.

</div>


<div class="pie">

GESBASE · Acceso empleado

</div>

</div>

</div>


<script type="module">

import {
    auth,
    db
} from "./Js/firebase.js";


import {
    signInWithEmailAndPassword,
    onAuthStateChanged
} from
"https://www.gstatic.com/firebasejs/12.1.0/firebase-auth.js";


import {
    doc,
    getDoc
} from
"https://www.gstatic.com/firebasejs/12.1.0/firebase-firestore.js";


// ==========================================
// ELEMENTOS
// ==========================================

const email =
document.getElementById("email");

const password =
document.getElementById("password");

const btnIngresar =
document.getElementById("btnIngresar");

const btnVolver =
document.getElementById("btnVolver");

const mensajeError =
document.getElementById("mensajeError");

const mensajeExito =
document.getElementById("mensajeExito");

const cargando =
document.getElementById("cargando");


// ==========================================
// MENSAJES
// ==========================================

function mostrarError(mensaje){

    mensajeError.textContent =
    mensaje;

    mensajeError.style.display =
    "block";

    mensajeExito.style.display =
    "none";

}


function mostrarExito(mensaje){

    mensajeExito.textContent =
    mensaje;

    mensajeExito.style.display =
    "block";

    mensajeError.style.display =
    "none";

}


function limpiarMensajes(){

    mensajeError.style.display =
    "none";

    mensajeExito.style.display =
    "none";

}


// ==========================================
// CARGANDO
// ==========================================

function iniciarCarga(){

    cargando.style.display =
    "block";

    btnIngresar.disabled =
    true;

    btnIngresar.textContent =
    "INGRESANDO...";

}


function terminarCarga(){

    cargando.style.display =
    "none";

    btnIngresar.disabled =
    false;

    btnIngresar.textContent =
    "INGRESAR";

}


// ==========================================
// TEXTO
// ==========================================

function texto(valor){

    if(
        valor === undefined ||
        valor === null
    ){

        return "";

    }

    return String(valor);

}


// ==========================================
// OBTENER PERFIL DEL USUARIO
// ==========================================

async function obtenerPerfilEmpleado(usuario){

    /*
     * IMPORTANTE:
     *
     * Solo leemos:
     *
     * usuarios/{uid}
     *
     * No hacemos ninguna consulta
     * sobre toda la colección empleados.
     */

    const referencia =
    doc(
        db,
        "usuarios",
        usuario.uid
    );


    const resultado =
    await getDoc(
        referencia
    );


    if(
        !resultado.exists()
    ){

        throw new Error(
            "No encontramos el perfil del usuario."
        );

    }


    const datos =
    resultado.data();


    // ======================================
    // VERIFICAR PERFIL
    // ======================================

    if(
        datos.perfil !==
        "empleado"
    ){

        throw new Error(
            "Esta cuenta no está configurada como empleado."
        );

    }


    // ======================================
    // EMPLEADO ID
    // ======================================

    const empleadoId =
    texto(
        datos.empleadoId
    ).trim();


    if(!empleadoId){

        throw new Error(
            "El usuario no tiene asignado un empleado."
        );

    }


    // ======================================
    // EMPRESA
    // ======================================

    const empresaId =
    texto(
        datos.empresaId
    ).trim();


    if(!empresaId){

        throw new Error(
            "El usuario no tiene empresa asignada."
        );

    }


    // ======================================
    // ESTADO
    // ======================================

    if(
        datos.estado &&
        datos.estado !==
        "Activo"
    ){

        throw new Error(
            "El acceso de este empleado está inactivo."
        );

    }


    // ======================================
    // GUARDAR SESIÓN
    // ======================================

    const sesion = {

        uid:
        usuario.uid,

        empleadoId:
        empleadoId,

        empresaId:
        empresaId,

        perfil:
        "empleado",

        nombre:
        texto(
            datos.nombre
        ),

        apellido:
        texto(
            datos.apellido
        ),

        email:
        texto(
            datos.email ||
            usuario.email
        )

    };


    sessionStorage.setItem(
        "gesbaseEmpleado",
        JSON.stringify(
            sesion
        )
    );


    return sesion;

}


// ==========================================
// LOGIN
// ==========================================

btnIngresar.addEventListener(
    "click",
    async function(){

        limpiarMensajes();


        const emailValor =
        email.value
        .trim()
        .toLowerCase();


        const passwordValor =
        password.value;


        if(!emailValor){

            mostrarError(
                "Ingresá el email."
            );

            return;

        }


        if(!passwordValor){

            mostrarError(
                "Ingresá la contraseña."
            );

            return;

        }


        iniciarCarga();


        try{

            // ==================================
            // 1. AUTENTICAR
            // ==================================

            const resultado =
            await signInWithEmailAndPassword(
                auth,
                emailValor,
                passwordValor
            );


            const usuario =
            resultado.user;


            // ==================================
            // 2. OBTENER PERFIL
            // ==================================

            const empleado =
            await obtenerPerfilEmpleado(
                usuario
            );


            // ==================================
            // 3. MOSTRAR ÉXITO
            // ==================================

            mostrarExito(
                "Bienvenido " +
                (
                    empleado.nombre ||
                    "empleado"
                ) +
                ". Ingresando..."
            );


            // ==================================
            // 4. IR AL FICHAJE
            // ==================================

            setTimeout(
                function(){

                    window.location.href =
                    "fichaje.html";

                },
                500
            );

        }
        catch(error){

            console.error(
                "Error login empleado:",
                error
            );


            let mensaje =
            "No se pudo iniciar sesión.";


            switch(
                error.code
            ){

                case "auth/invalid-credential":

                    mensaje =
                    "Email o contraseña incorrectos.";

                    break;


                case "auth/user-not-found":

                    mensaje =
                    "No existe un usuario con ese email.";

                    break;


                case "auth/wrong-password":

                    mensaje =
                    "La contraseña es incorrecta.";

                    break;


                case "auth/invalid-email":

                    mensaje =
                    "El email no es válido.";

                    break;


                case "auth/user-disabled":

                    mensaje =
                    "Este usuario está deshabilitado.";

                    break;


                case "auth/too-many-requests":

                    mensaje =
                    "Demasiados intentos. Esperá unos minutos e intentá nuevamente.";

                    break;


                case "permission-denied":

                    mensaje =
                    "GESBASE no tiene permiso para verificar el perfil del empleado.";

                    break;


                default:

                    if(
                        error.message
                    ){

                        mensaje =
                        error.message;

                    }

                    break;

            }


            mostrarError(
                mensaje
            );

        }
        finally{

            terminarCarga();

        }

    }
);


// ==========================================
// ENTER
// ==========================================

password.addEventListener(
    "keydown",
    function(event){

        if(
            event.key ===
            "Enter"
        ){

            btnIngresar.click();

        }

    }
);


// ==========================================
// VOLVER
// ==========================================

btnVolver.addEventListener(
    "click",
    function(){

        window.history.back();

    }
);


// ==========================================
// SI YA ESTÁ LOGUEADO
// ==========================================

onAuthStateChanged(
    auth,
    async function(usuario){

        if(!usuario){

            return;

        }

        /*
         * No redirigimos automáticamente.
         * El usuario entra mediante el botón
         * INGRESAR.
         */

    }
);

</script>

</body>

</html>
