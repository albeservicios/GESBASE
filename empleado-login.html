<!DOCTYPE html>
<html lang="es">

<head>

<meta charset="UTF-8">

<meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
>

<meta
    name="theme-color"
    content="#111827"
>

<meta
    name="description"
    content="GESBASE - Acceso exclusivo para empleados"
>

<title>GESBASE - Acceso empleado</title>

<style>

*{
    box-sizing:border-box;
    margin:0;
    padding:0;
}

body{
    font-family:Arial,sans-serif;
    background:#f3f4f6;
    color:#111827;
    min-height:100vh;
}

.contenedor{
    width:100%;
    max-width:500px;
    min-height:100vh;
    margin:auto;
    display:flex;
    align-items:center;
    justify-content:center;
    padding:20px;
}

.tarjeta{
    width:100%;
    background:white;
    border:1px solid #e5e7eb;
    border-radius:18px;
    padding:28px;
    box-shadow:0 8px 30px rgba(0,0,0,.08);
}

.logo{
    text-align:center;
    margin-bottom:25px;
}

.logo h1{
    font-size:30px;
    letter-spacing:.5px;
}

.logo p{
    margin-top:7px;
    color:#6b7280;
    font-size:15px;
}

.titulo{
    font-size:21px;
    font-weight:bold;
    margin-bottom:18px;
    text-align:center;
}

.campo{
    margin-bottom:16px;
}

.campo label{
    display:block;
    font-size:14px;
    font-weight:bold;
    margin-bottom:7px;
}

.campo input{
    width:100%;
    padding:15px;
    border:1px solid #d1d5db;
    border-radius:10px;
    font-size:16px;
    outline:none;
    background:#fff;
}

.campo input:focus{
    border-color:#2563eb;
    box-shadow:0 0 0 3px rgba(37,99,235,.10);
}

.boton{
    width:100%;
    border:none;
    border-radius:11px;
    padding:16px;
    font-size:16px;
    font-weight:bold;
    cursor:pointer;
    margin-top:8px;
}

.boton-principal{
    background:#111827;
    color:white;
}

.boton-principal:hover{
    background:#1f2937;
}

.boton-principal:disabled{
    opacity:.6;
    cursor:not-allowed;
}

.boton-volver{
    background:#e5e7eb;
    color:#111827;
}

.boton-volver:hover{
    background:#d1d5db;
}

.mensaje{
    padding:13px;
    border-radius:10px;
    margin-bottom:16px;
    font-size:14px;
    line-height:1.5;
    display:none;
}

.error{
    background:#fee2e2;
    color:#991b1b;
}

.exito{
    background:#dcfce7;
    color:#166534;
}

.info{
    margin-top:20px;
    padding:12px;
    background:#eff6ff;
    color:#1e40af;
    border-radius:10px;
    font-size:13px;
    line-height:1.5;
    text-align:center;
}

.cargando{
    text-align:center;
    color:#6b7280;
    padding:10px;
    display:none;
}

.pie{
    text-align:center;
    margin-top:20px;
    color:#9ca3af;
    font-size:12px;
}

</style>

</head>


<body>


<div class="contenedor">

    <div class="tarjeta">

        <div class="logo">

            <h1>GESBASE</h1>

            <p>
                Acceso exclusivo para empleados
            </p>

        </div>


        <div
            id="mensajeError"
            class="mensaje error"
        ></div>


        <div
            id="mensajeExito"
            class="mensaje exito"
        ></div>


        <div
            id="cargando"
            class="cargando"
        >
            Verificando acceso...
        </div>


        <div id="formularioLogin">

            <div class="titulo">
                Iniciar sesión
            </div>


            <div class="campo">

                <label for="email">
                    Email
                </label>

                <input
                    type="email"
                    id="email"
                    placeholder="Ingresá tu email"
                    autocomplete="username"
                >

            </div>


            <div class="campo">

                <label for="password">
                    Contraseña
                </label>

                <input
                    type="password"
                    id="password"
                    placeholder="Ingresá tu contraseña"
                    autocomplete="current-password"
                >

            </div>


            <button
                type="button"
                id="btnIngresar"
                class="boton boton-principal"
            >
                INGRESAR
            </button>


            <button
                type="button"
                id="btnVolver"
                class="boton boton-volver"
            >
                ⬅️ VOLVER
            </button>

        </div>


        <div class="info">

            🔐 Utilizá el email y contraseña
            que te proporcionó el administrador.

        </div>


        <div class="pie">

            GESBASE · Acceso empleado

        </div>

    </div>

</div>


<script type="module">


/*
=========================================================
 GESBASE - ACCESO DE EMPLEADOS
=========================================================

 FLUJO:

 Empleado
     ↓
 acceso-empleado.html
     ↓
 Firebase Authentication
     ↓
 empleados/{empleadoId}
     ↓
 tipoEmpleado
     ↓
 ┌─────────────────────────┐
 │                         │
Empleado                 Chofer
 │                         │
 ↓                         ↓
fichaje.html        modo-chofer.html

=========================================================
*/


/*
=========================================================
 FIREBASE
=========================================================
*/

import {
    auth,
    db
} from "./Js/firebase.js";


import {
    signInWithEmailAndPassword
} from "https://www.gstatic.com/firebasejs/12.18.0/firebase-auth.js";


import {
    collection,
    query,
    where,
    getDocs,
    limit
} from "https://www.gstatic.com/firebasejs/12.18.0/firebase-firestore.js";


/*
=========================================================
 ELEMENTOS
=========================================================
*/

const email =
    document.getElementById(
        "email"
    );


const password =
    document.getElementById(
        "password"
    );


const btnIngresar =
    document.getElementById(
        "btnIngresar"
    );


const btnVolver =
    document.getElementById(
        "btnVolver"
    );


const mensajeError =
    document.getElementById(
        "mensajeError"
    );


const mensajeExito =
    document.getElementById(
        "mensajeExito"
    );


const cargando =
    document.getElementById(
        "cargando"
    );


/*
=========================================================
 MENSAJES
=========================================================
*/

function mostrarError(
    mensaje
){

    mensajeError.textContent =
        mensaje;

    mensajeError.style.display =
        "block";

    mensajeExito.style.display =
        "none";

}


function mostrarExito(
    mensaje
){

    mensajeExito.textContent =
        mensaje;

    mensajeExito.style.display =
        "block";

    mensajeError.style.display =
        "none";

}


function limpiarMensajes(){

    mensajeError.style.display =
        "none";

    mensajeExito.style.display =
        "none";

}


/*
=========================================================
 CARGANDO
=========================================================
*/

function iniciarCarga(){

    cargando.style.display =
        "block";

    btnIngresar.disabled =
        true;

    btnIngresar.textContent =
        "INGRESANDO...";

}


function terminarCarga(){

    cargando.style.display =
        "none";

    btnIngresar.disabled =
        false;

    btnIngresar.textContent =
        "INGRESAR";

}


/*
=========================================================
 TEXTO SEGURO
=========================================================
*/

function texto(
    valor
){

    if(
        valor === undefined ||
        valor === null
    ){

        return "";

    }

    return String(
        valor
    );

}


/*
=========================================================
 NORMALIZAR TIPO DE EMPLEADO
=========================================================
*/

function obtenerTipoEmpleado(
    empleado
){

    const tipo1 =
        texto(
            empleado.tipoEmpleado
        )
        .trim()
        .toLowerCase();


    const tipo2 =
        texto(
            empleado.tipo
        )
        .trim()
        .toLowerCase();


    /*
     * PRIORIDAD:
     * tipoEmpleado
     */

    if(tipo1){

        return tipo1;

    }


    if(tipo2){

        return tipo2;

    }


    return "empleado";

}


/*
=========================================================
 BUSCAR EMPLEADO
=========================================================
*/

async function buscarEmpleado(
    usuario
){

    const referencia =
        collection(
            db,
            "empleados"
        );


    /*
     * BUSCAR CUENTA VINCULADA
     */

    const consulta =
        query(

            referencia,

            where(
                "authUid",
                "==",
                usuario.uid
            ),

            limit(1)

        );


    const resultados =
        await getDocs(
            consulta
        );


    /*
     * NO EXISTE
     */

    if(
        resultados.empty
    ){

        throw new Error(
            "No encontramos el perfil del empleado. El administrador debe vincular esta cuenta desde GESBASE."
        );

    }


    /*
     * DOCUMENTO
     */

    const documento =
        resultados.docs[0];


    const empleado = {

        id:
            documento.id,

        ...documento.data()

    };


    /*
     =====================================================
     ESTADO
     =====================================================
    */

    const estadoEmpleado =
        texto(
            empleado.estado
        )
        .trim()
        .toLowerCase();


    if(
        estadoEmpleado &&
        estadoEmpleado !== "activo"
    ){

        throw new Error(
            "El empleado está inactivo. Contactá al administrador."
        );

    }


    /*
     =====================================================
     EMPRESA
     =====================================================
    */

    const empresaId =
        texto(
            empleado.empresaId
        )
        .trim();


    if(
        !empresaId
    ){

        throw new Error(
            "El empleado no tiene una empresa asignada."
        );

    }


    /*
     =====================================================
     AUTH UID
     =====================================================
    */

    if(
        texto(
            empleado.authUid
        )
        .trim() !==
        usuario.uid
    ){

        throw new Error(
            "La cuenta no está vinculada correctamente con el empleado."
        );

    }


    /*
     =====================================================
     TIPO DE EMPLEADO
     =====================================================
    */

    const tipoEmpleado =
        obtenerTipoEmpleado(
            empleado
        );


    /*
     =====================================================
     ES CHOFER
     =====================================================
    */

    const esChofer =
        tipoEmpleado === "chofer" ||
        tipoEmpleado === "conductor";


    /*
     =====================================================
     PERFIL DE SESIÓN
     =====================================================
    */

    const sesion = {

        uid:
            usuario.uid,

        empleadoId:
            empleado.id,

        empresaId:
            empresaId,

        perfil:
            "empleado",

        tipoEmpleado:
            esChofer
            ? "chofer"
            : "empleado",

        esChofer:
            esChofer,

        nombre:
            texto(
                empleado.nombre
            ),

        apellido:
            texto(
                empleado.apellido
            ),

        email:
            texto(
                empleado.email ||
                usuario.email
            ),

        puesto:
            texto(
                empleado.puesto
            ),

        pagoDiario:
            Number(
                empleado.pagoDiario || 0
            ),

        unidadId:
            texto(
                empleado.unidadId
            ),

        licencia:
            texto(
                empleado.licencia
            ),

        categoriaLicencia:
            texto(
                empleado.categoriaLicencia
            )

    };


    /*
     =====================================================
     GUARDAR SESIÓN
     =====================================================
    */

    sessionStorage.setItem(

        "gesbaseEmpleado",

        JSON.stringify(
            sesion
        )

    );


    return sesion;

}


/*
=========================================================
 BUSCAR CHOFER
=========================================================

 Si el empleado es chofer también intentamos encontrar
 su registro correspondiente en la colección choferes.

 Esto permite que modo-chofer.html tenga disponible
 el choferId y unidadId.

=========================================================
*/

async function buscarDatosChofer(
    sesion
){

    if(
        !sesion.esChofer
    ){

        return null;

    }


    try{

        const consulta =
            query(

                collection(
                    db,
                    "choferes"
                ),

                where(
                    "empresaId",
                    "==",
                    sesion.empresaId
                ),

                where(
                    "empleadoId",
                    "==",
                    sesion.empleadoId
                ),

                limit(1)

            );


        const resultados =
            await getDocs(
                consulta
            );


        if(
            resultados.empty
        ){

            return null;

        }


        const documento =
            resultados.docs[0];


        const chofer = {

            id:
                documento.id,

            ...documento.data()

        };


        /*
         * ACTUALIZAR SESIÓN
         */

        sesion.choferId =
            chofer.id;


        sesion.unidadId =
            texto(
                chofer.unidadId ||
                sesion.unidadId
            );


        sesion.licencia =
            texto(
                chofer.licencia ||
                sesion.licencia
            );


        sesion.categoriaLicencia =
            texto(
                chofer.categoriaLicencia ||
                sesion.categoriaLicencia
            );


        sessionStorage.setItem(

            "gesbaseEmpleado",

            JSON.stringify(
                sesion
            )

        );


        return chofer;


    }catch(error){

        console.warn(
            "No se pudo cargar el perfil de chofer:",
            error
        );

        return null;

    }

}


/*
=========================================================
 INICIAR SESIÓN
=========================================================
*/

async function iniciarSesion(){

    limpiarMensajes();


    const emailValor =
        email.value
        .trim()
        .toLowerCase();


    const passwordValor =
        password.value;


    /*
     * VALIDAR EMAIL
     */

    if(
        !emailValor
    ){

        mostrarError(
            "Ingresá el email."
        );

        email.focus();

        return;

    }


    /*
     * VALIDAR CONTRASEÑA
     */

    if(
        !passwordValor
    ){

        mostrarError(
            "Ingresá la contraseña."
        );

        password.focus();

        return;

    }


    iniciarCarga();


    try{

        /*
         =================================================
         AUTENTICACIÓN
         =================================================
        */

        const resultado =
            await signInWithEmailAndPassword(

                auth,

                emailValor,

                passwordValor

            );


        const usuario =
            resultado.user;


        /*
         =================================================
         BUSCAR EMPLEADO
         =================================================
        */

        const empleado =
            await buscarEmpleado(
                usuario
            );


        /*
         =================================================
         SI ES CHOFER
         =================================================
        */

        if(
            empleado.esChofer
        ){

            await buscarDatosChofer(
                empleado
            );


            mostrarExito(
                "Bienvenido " +
                (
                    empleado.nombre ||
                    "chofer"
                ) +
                ". Abriendo modo chofer..."
            );


            setTimeout(
                function(){

                    window.location.replace(
                        "modo-chofer.html"
                    );

                },
                700
            );


            return;

        }


        /*
         =================================================
         SI ES EMPLEADO NORMAL
         =================================================
        */

        mostrarExito(
            "Bienvenido " +
            (
                empleado.nombre ||
                "empleado"
            ) +
            ". Abriendo fichaje..."
        );


        setTimeout(
            function(){

                window.location.replace(
                    "fichaje.html"
                );

            },
            700
        );


    }
    catch(error){

        console.error(
            "ERROR LOGIN EMPLEADO:",
            error
        );


        let mensaje =
            "No se pudo iniciar sesión.";


        /*
         =================================================
         AUTH
         =================================================
        */

        if(
            error.code ===
            "auth/invalid-credential"
        ){

            mensaje =
                "Email o contraseña incorrectos.";

        }

        else if(
            error.code ===
            "auth/user-not-found"
        ){

            mensaje =
                "No existe un usuario con ese email.";

        }

        else if(
            error.code ===
            "auth/wrong-password"
        ){

            mensaje =
                "La contraseña es incorrecta.";

        }

        else if(
            error.code ===
            "auth/invalid-email"
        ){

            mensaje =
                "El email no es válido.";

        }

        else if(
            error.code ===
            "auth/user-disabled"
        ){

            mensaje =
                "Este usuario está deshabilitado.";

        }

        else if(
            error.code ===
            "auth/too-many-requests"
        ){

            mensaje =
                "Demasiados intentos. Esperá unos minutos e intentá nuevamente.";

        }


        /*
         =================================================
         FIRESTORE
         =================================================
        */

        else if(
            error.code ===
            "permission-denied"
        ){

            mensaje =
                "Firebase rechazó el acceso a los empleados. Hay que revisar las reglas de Firestore.";

        }


        /*
         =================================================
         OTROS ERRORES
         =================================================
        */

        else if(
            error.message
        ){

            mensaje =
                error.message;

        }


        /*
         =================================================
         LIMPIAR SESIÓN
         =================================================
        */

        sessionStorage.removeItem(
            "gesbaseEmpleado"
        );


        mostrarError(
            mensaje
        );

    }
    finally{

        terminarCarga();

    }

}


/*
=========================================================
 BOTÓN INGRESAR
=========================================================
*/

btnIngresar.addEventListener(

    "click",

    iniciarSesion

);


/*
=========================================================
 ENTER EN CONTRASEÑA
=========================================================
*/

password.addEventListener(

    "keydown",

    function(event){

        if(
            event.key ===
            "Enter"
        ){

            iniciarSesion();

        }

    }

);


/*
=========================================================
 ENTER EN EMAIL
=========================================================
*/

email.addEventListener(

    "keydown",

    function(event){

        if(
            event.key ===
            "Enter"
        ){

            password.focus();

        }

    }

);


/*
=========================================================
 VOLVER
=========================================================
*/

btnVolver.addEventListener(

    "click",

    function(){

        window.history.back();

    }

);

</script>

</body>

</html>
