<!DOCTYPE html>
<html lang="es-AR">

<head>

<meta charset="UTF-8">

<meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
>

<meta
    name="theme-color"
    content="#111827"
>

<meta
    name="description"
    content="GESBASE - Acceso exclusivo para empleados"
>

<title>GESBASE - Acceso empleado</title>

<style>

*{
    box-sizing:border-box;
    margin:0;
    padding:0;
}

body{
    font-family:Arial,sans-serif;
    background:#111827;
    color:#111827;
    min-height:100vh;
}

.contenedor{
    width:100%;
    max-width:520px;
    min-height:100vh;
    margin:auto;
    display:flex;
    align-items:center;
    justify-content:center;
    padding:20px;
}

.tarjeta{
    width:100%;
    background:#fff;
    border-radius:20px;
    padding:30px;
    box-shadow:0 15px 45px rgba(0,0,0,.25);
}

.logo{
    text-align:center;
    margin-bottom:28px;
}

.logoMarca{
    width:64px;
    height:64px;
    margin:0 auto 14px;
    border-radius:16px;
    background:#111827;
    color:#fff;
    display:flex;
    align-items:center;
    justify-content:center;
    font-size:30px;
    font-weight:900;
}

.logo h1{
    font-size:30px;
    letter-spacing:.5px;
}

.logo p{
    margin-top:7px;
    color:#6b7280;
    font-size:14px;
}

.titulo{
    text-align:center;
    font-size:21px;
    font-weight:800;
    margin-bottom:20px;
}

.campo{
    margin-bottom:16px;
}

.campo label{
    display:block;
    font-size:14px;
    font-weight:700;
    margin-bottom:7px;
}

.campo input{
    width:100%;
    padding:15px;
    border:1px solid #d1d5db;
    border-radius:11px;
    font-size:16px;
    outline:none;
    background:#fff;
}

.campo input:focus{
    border-color:#2563eb;
    box-shadow:0 0 0 3px rgba(37,99,235,.12);
}

.boton{
    width:100%;
    border:none;
    border-radius:11px;
    padding:16px;
    font-size:16px;
    font-weight:800;
    cursor:pointer;
    margin-top:8px;
}

.boton-principal{
    background:#111827;
    color:#fff;
}

.boton-principal:hover{
    background:#1f2937;
}

.boton-principal:disabled{
    opacity:.55;
    cursor:not-allowed;
}

.boton-volver{
    background:#e5e7eb;
    color:#111827;
}

.boton-volver:hover{
    background:#d1d5db;
}

.mensaje{
    padding:13px;
    border-radius:11px;
    margin-bottom:16px;
    font-size:14px;
    line-height:1.5;
    display:none;
}

.error{
    background:#fee2e2;
    color:#991b1b;
}

.exito{
    background:#dcfce7;
    color:#166534;
}

.info{
    margin-top:20px;
    padding:13px;
    background:#eff6ff;
    color:#1e40af;
    border-radius:11px;
    font-size:13px;
    line-height:1.5;
    text-align:center;
}

.cargando{
    display:none;
    text-align:center;
    color:#6b7280;
    margin-bottom:15px;
    font-size:14px;
}

.pie{
    text-align:center;
    margin-top:22px;
    color:#9ca3af;
    font-size:12px;
}

</style>

</head>

<body>

<div class="contenedor">

    <div class="tarjeta">

        <div class="logo">

            <div class="logoMarca">
                G
            </div>

            <h1>GESBASE</h1>

            <p>
                Acceso exclusivo para empleados
            </p>

        </div>

        <div
            id="mensajeError"
            class="mensaje error"
        ></div>

        <div
            id="mensajeExito"
            class="mensaje exito"
        ></div>

        <div
            id="cargando"
            class="cargando"
        >
            Verificando acceso...
        </div>

        <div id="formularioLogin">

            <div class="titulo">
                Iniciar sesión
            </div>

            <div class="campo">

                <label for="email">
                    Email
                </label>

                <input
                    type="email"
                    id="email"
                    placeholder="Ingresá tu email"
                    autocomplete="username"
                >

            </div>

            <div class="campo">

                <label for="password">
                    Contraseña
                </label>

                <input
                    type="password"
                    id="password"
                    placeholder="Ingresá tu contraseña"
                    autocomplete="current-password"
                >

            </div>

            <button
                type="button"
                id="btnIngresar"
                class="boton boton-principal"
            >
                INGRESAR
            </button>

            <button
                type="button"
                id="btnVolver"
                class="boton boton-volver"
            >
                ⬅️ VOLVER
            </button>

        </div>

        <div class="info">

            🔐 Utilizá el email y contraseña
            proporcionados por el administrador de tu empresa.

        </div>

        <div class="pie">

            GESBASE · Tu empresa. Todo organizado.

        </div>

    </div>

</div>


<script type="module">

import {
    auth,
    db
} from "./Js/firebase.js";

import {
    signInWithEmailAndPassword,
    signOut
} from "https://www.gstatic.com/firebasejs/12.18.0/firebase-auth.js";

import {
    collection,
    query,
    where,
    getDocs,
    doc,
    getDoc,
    limit
} from "https://www.gstatic.com/firebasejs/12.18.0/firebase-firestore.js";


const emailInput =
    document.getElementById("email");

const passwordInput =
    document.getElementById("password");

const btnIngresar =
    document.getElementById("btnIngresar");

const btnVolver =
    document.getElementById("btnVolver");

const mensajeError =
    document.getElementById("mensajeError");

const mensajeExito =
    document.getElementById("mensajeExito");

const cargando =
    document.getElementById("cargando");


function texto(valor){

    if(
        valor === undefined ||
        valor === null
    ){
        return "";
    }

    return String(valor);

}


function mostrarError(mensaje){

    mensajeError.textContent = mensaje;
    mensajeError.style.display = "block";

    mensajeExito.style.display = "none";

}


function mostrarExito(mensaje){

    mensajeExito.textContent = mensaje;
    mensajeExito.style.display = "block";

    mensajeError.style.display = "none";

}


function limpiarMensajes(){

    mensajeError.style.display = "none";
    mensajeExito.style.display = "none";

}


function iniciarCarga(){

    cargando.style.display = "block";

    btnIngresar.disabled = true;

    btnIngresar.textContent =
        "INGRESANDO...";

}


function terminarCarga(){

    cargando.style.display = "none";

    btnIngresar.disabled = false;

    btnIngresar.textContent =
        "INGRESAR";

}


/*
=========================================================
 NORMALIZAR RUBRO
=========================================================
*/

function normalizarRubro(valor){

    const r =
        texto(valor)
        .trim()
        .toLowerCase()
        .normalize("NFD")
        .replace(/[\u0300-\u036f]/g,"");

    if(!r){
        return "";
    }

    if(
        r.includes("constru")
    ){
        return "construccion";
    }

    if(
        r.includes("comerc")
    ){
        return "comercio";
    }

    if(
        r.includes("transport")
    ){
        return "transporte";
    }

    if(
        r.includes("manten")
    ){
        return "mantenimiento";
    }

    if(
        r.includes("alquiler")
    ){
        return "alquileres";
    }

    if(
        r.includes("concesion")
    ){
        return "concesionaria";
    }

    if(
        r.includes("servicio")
    ){
        return "servicios";
    }

    return r;

}


/*
=========================================================
 BUSCAR EMPLEADO
=========================================================
*/

async function buscarEmpleado(usuario){

    const consulta =
        query(

            collection(
                db,
                "empleados"
            ),

            where(
                "authUid",
                "==",
                usuario.uid
            ),

            limit(1)

        );


    const resultados =
        await getDocs(
            consulta
        );


    if(resultados.empty){

        throw new Error(
            "No encontramos tu perfil de empleado. El administrador debe vincular esta cuenta desde GESBASE."
        );

    }


    const documento =
        resultados.docs[0];


    const empleado = {

        id:
            documento.id,

        ...documento.data()

    };


    const estado =
        texto(
            empleado.estado
        )
        .trim()
        .toLowerCase();


    if(
        estado &&
        estado !== "activo"
    ){

        throw new Error(
            "Tu acceso está inactivo. Comunicate con el administrador de la empresa."
        );

    }


    const empresaId =
        texto(
            empleado.empresaId
        )
        .trim();


    if(!empresaId){

        throw new Error(
            "Tu perfil no tiene una empresa asignada."
        );

    }


    if(
        texto(
            empleado.authUid
        ).trim() !== usuario.uid
    ){

        throw new Error(
            "La cuenta no está vinculada correctamente con tu perfil de empleado."
        );

    }


    /*
    =====================================================
     EMPRESA
    =====================================================
    */

    let empresa = {};

    try{

        const empresaSnap =
            await getDoc(
                doc(
                    db,
                    "empresas",
                    empresaId
                )
            );


        if(empresaSnap.exists()){

            empresa =
                empresaSnap.data() || {};

        }

    }
    catch(error){

        console.warn(
            "No se pudo cargar la empresa:",
            error
        );

    }


    /*
    =====================================================
     RUBRO
    =====================================================
    */

    const rubro =
        normalizarRubro(

            empleado.rubro ||
            empleado.tipoRubro ||
            empresa.rubro ||
            empresa.tipoRubro ||
            empresa.tipoNegocio ||
            empresa.actividad

        );


    /*
    =====================================================
     PERMISOS
    =====================================================
    */

    const permisos =
        empleado.permisos &&
        typeof empleado.permisos === "object"
        ? empleado.permisos
        : {};


    /*
    =====================================================
     SESIÓN
    =====================================================
    */

    const sesion = {

        uid:
            usuario.uid,

        empleadoId:
            empleado.id,

        empresaId:
            empresaId,

        perfil:
            "empleado",

        nombre:
            texto(
                empleado.nombre
            ),

        apellido:
            texto(
                empleado.apellido
            ),

        email:
            texto(
                empleado.email ||
                usuario.email
            ),

        puesto:
            texto(
                empleado.puesto
            ),

        rol:
            texto(
                empleado.rol
            ),

        rubro:
            rubro,

        tipoEmpleado:
            texto(
                empleado.tipoEmpleado ||
                empleado.tipo
            ) || "empleado",

        permisos:
            permisos,

        permisosConfigurados:
            empleado.permisosConfigurados === true,

        pagoDiario:
            Number(
                empleado.pagoDiario || 0
            ),

        unidadId:
            texto(
                empleado.unidadId
            ),

        licencia:
            texto(
                empleado.licencia
            ),

        categoriaLicencia:
            texto(
                empleado.categoriaLicencia
            ),

        passwordTemporal:
            empleado.passwordTemporal === true

    };


    sesion.esChofer =
        sesion.tipoEmpleado
        .toLowerCase()
        .includes("chofer") ||
        sesion.tipoEmpleado
        .toLowerCase()
        .includes("conductor");


    sessionStorage.setItem(
        "gesbaseEmpleado",
        JSON.stringify(sesion)
    );


    return sesion;

}


/*
=========================================================
 DATOS DEL CHOFER
=========================================================
*/

async function cargarDatosChofer(sesion){

    if(!sesion.esChofer){

        return;

    }


    try{

        const consulta =
            query(

                collection(
                    db,
                    "choferes"
                ),

                where(
                    "empresaId",
                    "==",
                    sesion.empresaId
                ),

                where(
                    "empleadoId",
                    "==",
                    sesion.empleadoId
                ),

                limit(1)

            );


        const resultados =
            await getDocs(
                consulta
            );


        if(resultados.empty){

            return;

        }


        const documento =
            resultados.docs[0];


        const chofer =
            documento.data() || {};


        sesion.choferId =
            documento.id;


        sesion.unidadId =
            texto(
                chofer.unidadId ||
                sesion.unidadId
            );


        sesion.licencia =
            texto(
                chofer.licencia ||
                sesion.licencia
            );


        sesion.categoriaLicencia =
            texto(
                chofer.categoriaLicencia ||
                sesion.categoriaLicencia
            );


        sessionStorage.setItem(
            "gesbaseEmpleado",
            JSON.stringify(sesion)
        );

    }
    catch(error){

        console.warn(
            "Datos de chofer no disponibles:",
            error
        );

    }

}


/*
=========================================================
 LOGIN
=========================================================
*/

async function iniciarSesion(){

    limpiarMensajes();


    const email =
        emailInput.value
        .trim()
        .toLowerCase();


    const password =
        passwordInput.value;


    if(!email){

        mostrarError(
            "Ingresá tu email."
        );

        emailInput.focus();

        return;

    }


    if(!password){

        mostrarError(
            "Ingresá tu contraseña."
        );

        passwordInput.focus();

        return;

    }


    iniciarCarga();


    try{

        /*
        =================================================
         LIMPIAR SESIÓN ANTERIOR
        =================================================
        */

        sessionStorage.removeItem(
            "gesbaseEmpleado"
        );


        /*
        =================================================
         FIREBASE AUTH
        =================================================
        */

        const resultado =
            await signInWithEmailAndPassword(
                auth,
                email,
                password
            );


        const usuario =
            resultado.user;


        /*
        =================================================
         BUSCAR PERFIL
        =================================================
        */

        const empleado =
            await buscarEmpleado(
                usuario
            );


        /*
        =================================================
         CONTRASEÑA TEMPORAL
        =================================================
        */

        if(
            empleado.passwordTemporal
        ){

            mostrarExito(
                "Primer acceso detectado. Debés cambiar tu contraseña."
            );


            setTimeout(
                () => {

                    window.location.replace(
                        "./cambiar-password.html"
                    );

                },
                700
            );


            return;

        }


        /*
        =================================================
         CHOFER
        =================================================
        */

        await cargarDatosChofer(
            empleado
        );


        /*
        =================================================
         ACCESO CORRECTO
        =================================================
        */

        mostrarExito(
            "Bienvenido " +
            (
                empleado.nombre ||
                "empleado"
            ) +
            ". Preparando tu panel..."
        );


        setTimeout(
            () => {

                window.location.replace(
                    "./index-empleado.html"
                );

            },
            500
        );

    }
    catch(error){

        console.error(
            "ERROR LOGIN EMPLEADO:",
            error
        );


        sessionStorage.removeItem(
            "gesbaseEmpleado"
        );


        let mensaje =
            "No se pudo iniciar sesión.";


        switch(error.code){

            case "auth/invalid-credential":

                mensaje =
                    "Email o contraseña incorrectos.";

                break;


            case "auth/user-not-found":

                mensaje =
                    "No existe un usuario con ese email.";

                break;


            case "auth/wrong-password":

                mensaje =
                    "La contraseña es incorrecta.";

                break;


            case "auth/invalid-email":

                mensaje =
                    "El email no es válido.";

                break;


            case "auth/user-disabled":

                mensaje =
                    "Este usuario está deshabilitado.";

                break;


            case "auth/too-many-requests":

                mensaje =
                    "Demasiados intentos. Esperá unos minutos e intentá nuevamente.";

                break;


            case "permission-denied":

                mensaje =
                    "Firebase rechazó la consulta de empleados. Revisá las reglas de Firestore.";

                break;


            default:

                if(error.message){

                    mensaje =
                        error.message;

                }

        }


        mostrarError(
            mensaje
        );

    }
    finally{

        terminarCarga();

    }

}


/*
=========================================================
 BOTONES
=========================================================
*/

btnIngresar.addEventListener(
    "click",
    iniciarSesion
);


passwordInput.addEventListener(
    "keydown",
    event => {

        if(event.key === "Enter"){

            iniciarSesion();

        }

    }
);


emailInput.addEventListener(
    "keydown",
    event => {

        if(event.key === "Enter"){

            passwordInput.focus();

        }

    }
);


btnVolver.addEventListener(
    "click",
    () => {

        window.history.back();

    }
);

</script>

</body>

</html>
