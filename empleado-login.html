<!DOCTYPE html>
<html lang="es">

<head>

<meta charset="UTF-8">

<meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
>

<meta
    name="theme-color"
    content="#111827"
>

<title>GESBASE - Acceso empleado</title>


<style>

*{
    box-sizing:border-box;
    margin:0;
    padding:0;
}

body{
    font-family:Arial,sans-serif;
    background:#f3f4f6;
    color:#111827;
    min-height:100vh;
}

.contenedor{
    width:100%;
    max-width:500px;
    min-height:100vh;
    margin:auto;
    display:flex;
    align-items:center;
    justify-content:center;
    padding:20px;
}

.tarjeta{
    width:100%;
    background:white;
    border:1px solid #e5e7eb;
    border-radius:18px;
    padding:28px;
    box-shadow:0 8px 30px rgba(0,0,0,.08);
}

.logo{
    text-align:center;
    margin-bottom:25px;
}

.logo h1{
    font-size:30px;
    color:#111827;
}

.logo p{
    margin-top:7px;
    color:#6b7280;
    font-size:15px;
}

.titulo{
    font-size:21px;
    font-weight:bold;
    margin-bottom:18px;
    text-align:center;
}

.campo{
    margin-bottom:16px;
}

.campo label{
    display:block;
    font-size:14px;
    font-weight:bold;
    margin-bottom:7px;
}

.campo input{
    width:100%;
    padding:15px;
    border:1px solid #d1d5db;
    border-radius:10px;
    font-size:16px;
    outline:none;
    background:white;
}

.campo input:focus{
    border-color:#2563eb;
}

.boton{
    width:100%;
    border:none;
    border-radius:11px;
    padding:16px;
    font-size:16px;
    font-weight:bold;
    cursor:pointer;
    margin-top:8px;
}

.boton-principal{
    background:#111827;
    color:white;
}

.boton-principal:disabled{
    opacity:.6;
    cursor:not-allowed;
}

.boton-volver{
    background:#e5e7eb;
    color:#111827;
    margin-top:10px;
}

.mensaje{
    padding:13px;
    border-radius:10px;
    margin-bottom:16px;
    font-size:14px;
    line-height:1.4;
    display:none;
}

.error{
    background:#fee2e2;
    color:#991b1b;
}

.exito{
    background:#dcfce7;
    color:#166534;
}

.cargando{
    text-align:center;
    color:#6b7280;
    font-size:14px;
    margin-top:15px;
    display:none;
}

.info{
    margin-top:20px;
    padding:12px;
    background:#eff6ff;
    color:#1e40af;
    border-radius:10px;
    font-size:13px;
    line-height:1.5;
    text-align:center;
}

.pie{
    text-align:center;
    margin-top:20px;
    color:#9ca3af;
    font-size:12px;
}

.oculto{
    display:none !important;
}

</style>

</head>


<body>


<div class="contenedor">

<div class="tarjeta">


<div class="logo">

<h1>GESBASE</h1>

<p>Acceso exclusivo para empleados</p>

</div>


<div
    id="mensajeError"
    class="mensaje error"
></div>


<div
    id="mensajeExito"
    class="mensaje exito"
></div>


<div
    id="cargando"
    class="cargando"
>
Verificando acceso...
</div>


<div id="formularioLogin">


<div class="titulo">
Iniciar sesión
</div>


<div class="campo">

<label for="email">
Email
</label>

<input
    type="email"
    id="email"
    placeholder="Ingresá tu email"
    autocomplete="username"
>


</div>


<div class="campo">

<label for="password">
Contraseña
</label>

<input
    type="password"
    id="password"
    placeholder="Ingresá tu contraseña"
    autocomplete="current-password"
>


</div>


<button
    id="btnIngresar"
    class="boton boton-principal"
>
INGRESAR
</button>


<button
    id="btnVolver"
    class="boton boton-volver"
>
⬅️ VOLVER
</button>


</div>


<div class="info">

🔐 Ingresá con el email y contraseña
que te proporcionó el administrador.

</div>


<div class="pie">

GESBASE · Acceso empleado

</div>


</div>

</div>


<script type="module">


// ==========================================
// FIREBASE
// ==========================================

import {
    auth,
    db
} from "./Js/firebase.js";


import {
    signInWithEmailAndPassword,
    onAuthStateChanged,
    signOut
} from
"https://www.gstatic.com/firebasejs/12.1.0/firebase-auth.js";


import {
    doc,
    getDoc
} from
"https://www.gstatic.com/firebasejs/12.1.0/firebase-firestore.js";


// ==========================================
// ELEMENTOS
// ==========================================

const email =
document.getElementById(
    "email"
);

const password =
document.getElementById(
    "password"
);

const btnIngresar =
document.getElementById(
    "btnIngresar"
);

const btnVolver =
document.getElementById(
    "btnVolver"
);

const formularioLogin =
document.getElementById(
    "formularioLogin"
);

const mensajeError =
document.getElementById(
    "mensajeError"
);

const mensajeExito =
document.getElementById(
    "mensajeExito"
);

const cargando =
document.getElementById(
    "cargando"
);


// ==========================================
// MENSAJES
// ==========================================

function mostrarError(mensaje){

    mensajeError.textContent =
    mensaje;

    mensajeError.style.display =
    "block";

    mensajeExito.style.display =
    "none";

}


function mostrarExito(mensaje){

    mensajeExito.textContent =
    mensaje;

    mensajeExito.style.display =
    "block";

    mensajeError.style.display =
    "none";

}


function limpiarMensajes(){

    mensajeError.style.display =
    "none";

    mensajeExito.style.display =
    "none";

}


// ==========================================
// CARGANDO
// ==========================================

function mostrarCargando(){

    cargando.style.display =
    "block";

    btnIngresar.disabled =
    true;

}


function ocultarCargando(){

    cargando.style.display =
    "none";

    btnIngresar.disabled =
    false;

}


// ==========================================
// TEXTO
// ==========================================

function texto(valor){

    if(
        valor === undefined ||
        valor === null
    ){

        return "";

    }

    return String(valor);

}


// ==========================================
// GUARDAR SESIÓN EMPLEADO
// ==========================================

function guardarSesionEmpleado(
    datos
){

    try{

        sessionStorage.setItem(
            "gesbaseEmpleado",
            JSON.stringify(
                datos
            )
        );

    }
    catch(error){

        console.warn(
            "No se pudo guardar la sesión:",
            error
        );

    }

}


// ==========================================
// OBTENER PERFIL
// ==========================================

async function obtenerPerfilEmpleado(
    usuario
){

    /*
     * El documento debe estar en:
     *
     * usuarios/{UID}
     *
     * donde UID es el UID de Firebase
     * Authentication.
     */

    const referenciaUsuario =
    doc(
        db,
        "usuarios",
        usuario.uid
    );


    const resultadoUsuario =
    await getDoc(
        referenciaUsuario
    );


    if(
        !resultadoUsuario.exists()
    ){

        throw new Error(
            "No encontramos el perfil del usuario."
        );

    }


    const datosUsuario =
    resultadoUsuario.data();


    /*
     * El usuario debe ser empleado.
     */

    if(
        datosUsuario.perfil !==
        "empleado"
    ){

        throw new Error(
            "Este acceso no corresponde a un empleado."
        );

    }


    /*
     * El empleado debe tener su ficha
     * vinculada.
     */

    const empleadoId =
    texto(
        datosUsuario.empleadoId
    ).trim();


    if(!empleadoId){

        throw new Error(
            "El usuario empleado no tiene una ficha vinculada."
        );

    }


    const empresaId =
    texto(
        datosUsuario.empresaId
    ).trim();


    if(!empresaId){

        throw new Error(
            "El usuario empleado no tiene una empresa vinculada."
        );

    }


    /*
     * Buscar la ficha del empleado.
     */

    const referenciaEmpleado =
    doc(
        db,
        "empleados",
        empleadoId
    );


    const resultadoEmpleado =
    await getDoc(
        referenciaEmpleado
    );


    if(
        !resultadoEmpleado.exists()
    ){

        throw new Error(
            "No encontramos la ficha del empleado."
        );

    }


    const datosEmpleado =
    resultadoEmpleado.data();


    /*
     * Seguridad:
     * la ficha debe pertenecer a la misma empresa.
     */

    if(
        texto(
            datosEmpleado.empresaId
        ) !== empresaId
    ){

        throw new Error(
            "La ficha del empleado no pertenece a esta empresa."
        );

    }


    /*
     * Seguridad:
     * la ficha debe estar vinculada
     * al usuario autenticado.
     */

    if(
        datosEmpleado.authUid &&
        datosEmpleado.authUid !==
        usuario.uid
    ){

        throw new Error(
            "Esta ficha pertenece a otro usuario."
        );

    }


    /*
     * Comprobar estado.
     */

    if(
        datosEmpleado.estado &&
        datosEmpleado.estado !==
        "Activo"
    ){

        throw new Error(
            "El acceso de este empleado está inactivo."
        );

    }


    return {

        uid:
        usuario.uid,

        empresaId:
        empresaId,

        empleadoId:
        empleadoId,

        perfil:
        "empleado",

        nombre:
        texto(
            datosEmpleado.nombre
        ),

        apellido:
        texto(
            datosEmpleado.apellido
        ),

        email:
        texto(
            datosEmpleado.email ||
            usuario.email
        ),

        puesto:
        texto(
            datosEmpleado.puesto
        )

    };

}


// ==========================================
// PROCESAR USUARIO AUTENTICADO
// ==========================================

async function procesarUsuario(
    usuario
){

    if(!usuario){

        return;

    }


    mostrarCargando();

    limpiarMensajes();


    try{

        const datos =
        await obtenerPerfilEmpleado(
            usuario
        );


        guardarSesionEmpleado(
            datos
        );


        mostrarExito(
            "Acceso correcto. Ingresando..."
        );


        /*
         * Pequeña pausa para mostrar
         * el mensaje de acceso correcto.
         */

        setTimeout(
            function(){

                window.location.href =
                "fichaje.html";

            },
            500
        );

    }
    catch(error){

        console.error(
            "Error perfil empleado:",
            error
        );


        await signOut(
            auth
        );


        ocultarCargando();


        mostrarError(
            error.message
        );

    }

}


// ==========================================
// LOGIN
// ==========================================

btnIngresar.addEventListener(
    "click",
    async function(){

        limpiarMensajes();


        const emailValor =
        email.value
        .trim()
        .toLowerCase();


        const passwordValor =
        password.value;


        if(!emailValor){

            mostrarError(
                "Ingresá el email."
            );

            return;

        }


        if(!passwordValor){

            mostrarError(
                "Ingresá la contraseña."
            );

            return;

        }


        btnIngresar.disabled =
        true;


        btnIngresar.textContent =
        "INGRESANDO...";


        try{

            const resultado =
            await signInWithEmailAndPassword(
                auth,
                emailValor,
                passwordValor
            );


            await procesarUsuario(
                resultado.user
            );

        }
        catch(error){

            console.error(
                "Error de login:",
                error
            );


            let mensaje =
            "No se pudo iniciar sesión.";


            switch(
                error.code
            ){

                case "auth/invalid-credential":

                    mensaje =
                    "Email o contraseña incorrectos.";

                    break;


                case "auth/user-not-found":

                    mensaje =
                    "No existe un usuario con ese email.";

                    break;


                case "auth/wrong-password":

                    mensaje =
                    "La contraseña es incorrecta.";

                    break;


                case "auth/invalid-email":

                    mensaje =
                    "El email no es válido.";

                    break;


                case "auth/user-disabled":

                    mensaje =
                    "Este usuario está deshabilitado.";

                    break;


                case "auth/too-many-requests":

                    mensaje =
                    "Demasiados intentos. Esperá unos minutos e intentá nuevamente.";

                    break;


                default:

                    mensaje =
                    error.message ||
                    mensaje;

            }


            mostrarError(
                mensaje
            );

        }
        finally{

            btnIngresar.disabled =
            false;

            btnIngresar.textContent =
            "INGRESAR";

        }

    }
);


// ==========================================
// ENTER
// ==========================================

password.addEventListener(
    "keydown",
    function(event){

        if(
            event.key ===
            "Enter"
        ){

            btnIngresar.click();

        }

    }
);


// ==========================================
// VOLVER
// ==========================================

btnVolver.addEventListener(
    "click",
    async function(){

        try{

            await signOut(
                auth
            );

        }
        catch(error){

            console.warn(error);

        }


        window.history.back();

    }
);


// ==========================================
// COMPROBAR SESIÓN EXISTENTE
// ==========================================

onAuthStateChanged(
    auth,
    async function(usuario){

        if(!usuario){

            return;

        }


        /*
         * Si ya hay una sesión abierta,
         * comprobamos si corresponde
         * a un empleado.
         */

        try{

            await procesarUsuario(
                usuario
            );

        }
        catch(error){

            console.error(error);

        }

    }
);


</script>

</body>

</html>
