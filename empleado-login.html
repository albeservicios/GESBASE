<!DOCTYPE html>
<html lang="es">

<head>

<meta charset="UTF-8">

<meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
>

<meta
    name="theme-color"
    content="#111827"
>

<title>Acceso empleado - GESBASE</title>

<style>

*{
    box-sizing:border-box;
    margin:0;
    padding:0;
}

body{
    font-family:Arial,sans-serif;
    background:#f3f4f6;
    color:#111827;
    min-height:100vh;
    display:flex;
    align-items:center;
    justify-content:center;
    padding:20px;
}

.contenedor{
    width:100%;
    max-width:420px;
}

.logo{
    text-align:center;
    margin-bottom:20px;
}

.logo h1{
    font-size:32px;
    color:#111827;
}

.logo p{
    margin-top:6px;
    color:#6b7280;
    font-size:14px;
}

.tarjeta{
    background:white;
    border-radius:16px;
    padding:25px;
    box-shadow:0 4px 20px rgba(0,0,0,.08);
    border:1px solid #e5e7eb;
}

.tarjeta h2{
    text-align:center;
    font-size:21px;
    margin-bottom:8px;
}

.subtitulo{
    text-align:center;
    color:#6b7280;
    font-size:14px;
    margin-bottom:25px;
}

.campo{
    margin-bottom:16px;
}

.campo label{
    display:block;
    font-size:14px;
    font-weight:bold;
    margin-bottom:7px;
}

.campo input{
    width:100%;
    padding:14px;
    border:1px solid #d1d5db;
    border-radius:10px;
    font-size:16px;
    background:white;
}

.campo input:focus{
    outline:none;
    border-color:#2563eb;
    box-shadow:0 0 0 3px rgba(37,99,235,.12);
}

.boton{
    width:100%;
    border:none;
    border-radius:10px;
    padding:15px;
    font-size:16px;
    font-weight:bold;
    cursor:pointer;
    margin-top:8px;
}

.boton-entrar{
    background:#2563eb;
    color:white;
}

.boton-entrar:disabled{
    opacity:.6;
    cursor:not-allowed;
}

.boton-admin{
    background:#e5e7eb;
    color:#111827;
}

.mensaje{
    padding:13px;
    border-radius:10px;
    font-size:14px;
    margin-bottom:15px;
    display:none;
    line-height:1.4;
}

.error{
    background:#fee2e2;
    color:#991b1b;
}

.exito{
    background:#dcfce7;
    color:#166534;
}

.cargando{
    text-align:center;
    color:#6b7280;
    font-size:14px;
    margin-top:15px;
    display:none;
}

.privacidad{
    text-align:center;
    color:#9ca3af;
    font-size:12px;
    margin-top:20px;
    line-height:1.5;
}

</style>

</head>


<body>


<div class="contenedor">


<div class="logo">

<h1>GESBASE</h1>

<p>Gestión empresarial</p>

</div>


<div class="tarjeta">


<h2>Acceso empleado</h2>

<div class="subtitulo">
Ingresá para registrar tu jornada laboral
</div>


<div
    id="mensajeError"
    class="mensaje error"
></div>


<div
    id="mensajeExito"
    class="mensaje exito"
></div>


<form id="formLogin">


<div class="campo">

<label for="email">
Email
</label>

<input
    type="email"
    id="email"
    placeholder="empleado@email.com"
    autocomplete="username"
    required
>

</div>


<div class="campo">

<label for="password">
Contraseña
</label>

<input
    type="password"
    id="password"
    placeholder="Contraseña"
    autocomplete="current-password"
    required
>

</div>


<button
    type="submit"
    id="btnEntrar"
    class="boton boton-entrar"
>
INGRESAR
</button>


</form>


<div
    id="cargando"
    class="cargando"
>
Verificando acceso...
</div>


<button
    type="button"
    id="btnAdministrador"
    class="boton boton-admin"
>
ACCESO ADMINISTRADOR
</button>


</div>


<div class="privacidad">

El empleado solamente puede acceder
a su propia información y fichajes.

</div>


</div>


<script type="module">


// ==================================================
// FIREBASE
// ==================================================

import {
    auth,
    db
} from "./Js/firebase.js";


import {
    signInWithEmailAndPassword,
    onAuthStateChanged,
    signOut
} from
"https://www.gstatic.com/firebasejs/12.1.0/firebase-auth.js";


import {
    collection,
    query,
    where,
    getDocs
} from
"https://www.gstatic.com/firebasejs/12.1.0/firebase-firestore.js";


// ==================================================
// ELEMENTOS
// ==================================================

const formLogin =
document.getElementById("formLogin");

const email =
document.getElementById("email");

const password =
document.getElementById("password");

const btnEntrar =
document.getElementById("btnEntrar");

const btnAdministrador =
document.getElementById("btnAdministrador");

const mensajeError =
document.getElementById("mensajeError");

const mensajeExito =
document.getElementById("mensajeExito");

const cargando =
document.getElementById("cargando");


// ==================================================
// MENSAJES
// ==================================================

function mostrarError(mensaje){

    mensajeError.textContent =
    mensaje;

    mensajeError.style.display =
    "block";

    mensajeExito.style.display =
    "none";

}


function mostrarExito(mensaje){

    mensajeExito.textContent =
    mensaje;

    mensajeExito.style.display =
    "block";

    mensajeError.style.display =
    "none";

}


function limpiarMensajes(){

    mensajeError.style.display =
    "none";

    mensajeExito.style.display =
    "none";

}


// ==================================================
// NORMALIZAR EMAIL
// ==================================================

function normalizarEmail(valor){

    return String(
        valor || ""
    )
    .trim()
    .toLowerCase();

}


// ==================================================
// BUSCAR EMPLEADO
// ==================================================

async function buscarEmpleadoPorEmail(
    emailEmpleado
){

    const emailNormalizado =
    normalizarEmail(
        emailEmpleado
    );


    if(!emailNormalizado){

        return null;

    }


    const referencia =
    collection(
        db,
        "empleados"
    );


    const consulta =
    query(
        referencia,
        where(
            "email",
            "==",
            emailNormalizado
        )
    );


    const resultados =
    await getDocs(
        consulta
    );


    if(
        resultados.empty
    ){

        return null;

    }


    let empleadoEncontrado =
    null;


    resultados.forEach(
        function(documento){

            if(
                empleadoEncontrado
            ){

                return;

            }


            empleadoEncontrado = {

                id:
                documento.id,

                ...documento.data()

            };

        }
    );


    return empleadoEncontrado;

}


// ==================================================
// VERIFICAR EMPLEADO
// ==================================================

async function verificarEmpleado(
    usuario
){

    if(!usuario){

        throw new Error(
            "No hay una sesión activa."
        );

    }


    if(!usuario.email){

        throw new Error(
            "La cuenta no tiene un email asociado."
        );

    }


    const empleado =
    await buscarEmpleadoPorEmail(
        usuario.email
    );


    if(!empleado){

        throw new Error(
            "No existe un empleado registrado con este email."
        );

    }


    // ==================================================
    // ESTADO
    // ==================================================

    if(
        String(
            empleado.estado || ""
        ).toLowerCase()
        !==
        "activo"
    ){

        throw new Error(
            "Este empleado se encuentra inactivo. Comunicate con el administrador."
        );

    }


    // ==================================================
    // EMPRESA
    // ==================================================

    if(
        !empleado.empresaId
    ){

        throw new Error(
            "El empleado no tiene una empresa asociada."
        );

    }


    // ==================================================
    // COMPROBAR AUTH UID
    // ==================================================

    /*
     * El administrador crea el acceso y guarda
     * authUid dentro del empleado.
     *
     * El empleado solamente puede ingresar si
     * ese authUid coincide con su cuenta.
     */

    if(
        !empleado.authUid
    ){

        throw new Error(
            "Este empleado todavía no tiene un acceso creado. Comunicate con el administrador."
        );

    }


    if(
        empleado.authUid !==
        usuario.uid
    ){

        throw new Error(
            "Esta cuenta no está vinculada al empleado registrado."
        );

    }


    // ==================================================
    // GUARDAR SESIÓN
    // ==================================================

    sessionStorage.setItem(
        "gesbase_tipo_acceso",
        "empleado"
    );


    sessionStorage.setItem(
        "gesbase_empleado_id",
        empleado.id
    );


    sessionStorage.setItem(
        "gesbase_empresa_id",
        empleado.empresaId
    );


    sessionStorage.setItem(
        "gesbase_auth_uid",
        usuario.uid
    );


    return empleado;

}


// ==================================================
// LOGIN
// ==================================================

formLogin.addEventListener(
    "submit",
    async function(event){

        event.preventDefault();


        limpiarMensajes();


        const emailValor =
        normalizarEmail(
            email.value
        );


        const passwordValor =
        password.value;


        if(!emailValor){

            mostrarError(
                "Ingresá el email del empleado."
            );

            email.focus();

            return;

        }


        if(!passwordValor){

            mostrarError(
                "Ingresá la contraseña."
            );

            password.focus();

            return;

        }


        btnEntrar.disabled =
        true;

        btnEntrar.textContent =
        "INGRESANDO...";

        cargando.style.display =
        "block";


        try{

            // ==================================================
            // AUTENTICAR
            // ==================================================

            const resultado =
            await signInWithEmailAndPassword(
                auth,
                emailValor,
                passwordValor
            );


            const usuario =
            resultado.user;


            // ==================================================
            // VERIFICAR EMPLEADO
            // ==================================================

            const empleado =
            await verificarEmpleado(
                usuario
            );


            mostrarExito(
                "Bienvenido/a " +
                (
                    empleado.nombre ||
                    "empleado"
                ) +
                ". Ingresando al fichaje..."
            );


            // ==================================================
            // IR A FICHAJE
            // ==================================================

            setTimeout(
                function(){

                    window.location.href =
                    "fichaje.html";

                },
                600
            );

        }
        catch(error){

            console.error(
                "Error de acceso empleado:",
                error
            );


            // ==================================================
            // CERRAR SESIÓN SI FALLA LA VERIFICACIÓN
            // ==================================================

            try{

                await signOut(
                    auth
                );

            }
            catch(errorCerrar){

                console.warn(
                    "No se pudo cerrar sesión:",
                    errorCerrar
                );

            }


            let mensaje =
            "No se pudo iniciar sesión.";


            // ==================================================
            // FIREBASE AUTH
            // ==================================================

            if(
                error.code ===
                "auth/invalid-credential"
            ){

                mensaje =
                "Email o contraseña incorrectos.";

            }
            else if(
                error.code ===
                "auth/user-not-found"
            ){

                mensaje =
                "No existe una cuenta con ese email.";

            }
            else if(
                error.code ===
                "auth/wrong-password"
            ){

                mensaje =
                "La contraseña es incorrecta.";

            }
            else if(
                error.code ===
                "auth/invalid-email"
            ){

                mensaje =
                "El email ingresado no es válido.";

            }
            else if(
                error.code ===
                "auth/too-many-requests"
            ){

                mensaje =
                "Demasiados intentos. Esperá unos minutos e intentá nuevamente.";

            }
            else if(
                error.code ===
                "auth/network-request-failed"
            ){

                mensaje =
                "No hay conexión con Firebase. Revisá tu conexión a Internet.";

            }


            // ==================================================
            // FIRESTORE
            // ==================================================

            else if(
                error.code ===
                "permission-denied"
            ){

                mensaje =
                "Firebase no permite consultar los empleados con las reglas actuales.";

            }


            // ==================================================
            // ERROR PERSONALIZADO
            // ==================================================

            else if(
                error.message
            ){

                mensaje =
                error.message;

            }


            mostrarError(
                mensaje
            );

        }
        finally{

            btnEntrar.disabled =
            false;

            btnEntrar.textContent =
            "INGRESAR";

            cargando.style.display =
            "none";

        }

    }
);


// ==================================================
// ACCESO ADMINISTRADOR
// ==================================================

btnAdministrador.addEventListener(
    "click",
    async function(){

        try{

            await signOut(
                auth
            );

        }
        catch(error){

            console.warn(
                "No se pudo cerrar sesión:",
                error
            );

        }


        sessionStorage.removeItem(
            "gesbase_tipo_acceso"
        );

        sessionStorage.removeItem(
            "gesbase_empleado_id"
        );

        sessionStorage.removeItem(
            "gesbase_empresa_id"
        );

        sessionStorage.removeItem(
            "gesbase_auth_uid"
        );


        window.location.href =
        "login.html";

    }
);


// ==================================================
// SESIÓN EXISTENTE
// ==================================================

onAuthStateChanged(
    auth,
    async function(usuario){

        if(!usuario){

            return;

        }


        const tipoAcceso =
        sessionStorage.getItem(
            "gesbase_tipo_acceso"
        );


        /*
         * Si no es una sesión de empleado,
         * no hacemos nada.
         *
         * Esto evita que el administrador
         * quede atrapado en esta pantalla.
         */

        if(
            tipoAcceso !==
            "empleado"
        ){

            return;

        }


        try{

            const empleado =
            await verificarEmpleado(
                usuario
            );


            if(empleado){

                window.location.href =
                "fichaje.html";

            }

        }
        catch(error){

            console.warn(
                "Sesión de empleado no válida:",
                error
            );


            try{

                await signOut(
                    auth
                );

            }
            catch(errorCerrar){

                console.warn(
                    errorCerrar
                );

            }


            sessionStorage.removeItem(
                "gesbase_tipo_acceso"
            );

            sessionStorage.removeItem(
                "gesbase_empleado_id"
            );

            sessionStorage.removeItem(
                "gesbase_empresa_id"
            );

            sessionStorage.removeItem(
                "gesbase_auth_uid"
            );

        }

    }
);


</script>

</body>

</html>
