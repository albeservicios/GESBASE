<!DOCTYPE html>
<html lang="es-AR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Reportes y Seguridad | GESBASE</title>
<meta name="theme-color" content="#12343B">

<style>
body{
margin:0;
font-family:Arial;
background:#f3f4f6;
display:none;
}
header{
background:#12343B;
color:#fff;
padding:16px;
font-size:22px;
font-weight:bold;
}
main{padding:15px;}
.card{
background:#fff;
border-radius:14px;
padding:16px;
margin-bottom:12px;
box-shadow:0 2px 8px rgba(0,0,0,.08);
}
.card h3{margin:0 0 6px;}
.grid{
display:grid;
grid-template-columns:1fr 1fr;
gap:10px;
}
.btn{
display:block;
background:#12343B;
color:#fff;
text-align:center;
padding:12px;
border-radius:10px;
text-decoration:none;
font-weight:bold;
}
</style>
</head>

<body>

<header>🛡️ GESBASE · Seguridad</header>

<main>

<div class="card">
<h3>Panel privado</h3>
<p id="adminNombre">Verificando acceso...</p>
</div>

<div class="grid">

<div class="card">
<h3>🚨 Reportes</h3>
<p>Administrar reportes</p>
<a class="btn" href="reportes.html">Ingresar</a>
</div>

<div class="card">
<h3>⚖️ Mediación</h3>
<p>Casos entre usuarios</p>
<a class="btn" href="panel-mediacion.html">Abrir</a>
</div>

<div class="card">
<h3>✅ Verificaciones</h3>
<p>Empresas y personas</p>
<a class="btn" href="verificaciones.html">Revisar</a>
</div>

<div class="card">
<h3>👥 Usuarios</h3>
<p>Usuarios registrados</p>
<a class="btn" href="usuarios-red.html">Ver</a>
</div>

</div>

</main>

<script type="module">
import { auth, db } from "./Js/firebase.js";
import { onAuthStateChanged } from "https://www.gstatic.com/firebasejs/12.18.0/firebase-auth.js";
import { doc, getDoc } from "https://www.gstatic.com/firebasejs/12.18.0/firebase-firestore.js";

const nombre=document.getElementById("adminNombre");

onAuthStateChanged(auth, async(user)=>{

if(!user){
location.href="red-login.html";
return;
}

const snap=await getDoc(doc(db,"usuariosRed",user.uid));

if(!snap.exists()){
location.href="red.html";
return;
}

const datos=snap.data();

const admin=
datos.rol==="administrador" ||
user.email==="julianbattauz006@gmail.com";

if(!admin){
alert("Acceso privado GESBASE");
location.href="red.html";
return;
}

document.body.style.display="block";
nombre.textContent="Administrador: "+(datos.nombreCompleto||user.email);

});
</script>

</body>
</html>
