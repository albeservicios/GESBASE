<!DOCTYPE html>
<html lang="es-AR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#12343B">
<title>Seguridad | GESBASE</title>

<style>
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:Arial;background:#f3f4f6;display:none}
header{background:#12343B;color:#fff;padding:16px;font-size:22px;font-weight:bold}
main{padding:15px;max-width:900px;margin:auto}
.card{background:#fff;border-radius:14px;padding:16px;margin-bottom:14px;box-shadow:0 2px 8px rgba(0,0,0,.08)}
.card h3{margin-bottom:6px;color:#12343B}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:12px}
.btn{display:block;text-align:center;text-decoration:none;background:#12343B;color:#fff;padding:12px;border-radius:10px;font-weight:bold}
.btn:hover{background:#0f2b31}
</style>
</head>
<body>

<header>🛡️ Seguridad GESBASE</header>

<main>

<div class="card">
<h3>Panel privado</h3>
<p id="adminNombre">Verificando acceso...</p>
</div>

<div class="grid">

<div class="card">
<h3>🚨 Reportes</h3>
<p>Revisar publicaciones denunciadas.</p>
<a class="btn" href="reportes.html">Ingresar</a>
</div>

<div class="card">
<h3>⚖️ Mediación</h3>
<p>Resolver conflictos entre usuarios.</p>
<a class="btn" href="panel-mediacion.html">Abrir</a>
</div>

<div class="card">
<h3>✅ Verificaciones</h3>
<p>Validar personas y empresas.</p>
<a class="btn" href="verificaciones.html">Revisar</a>
</div>

<div class="card">
<h3>👥 Usuarios</h3>
<p>Administrar usuarios registrados.</p>
<a class="btn" href="usuarios-red.html">Ver usuarios</a>
</div>

</div>

</main>

<script type="module">
import {auth,db} from "./Js/firebase.js";
import {onAuthStateChanged} from "https://www.gstatic.com/firebasejs/12.18.0/firebase-auth.js";
import {doc,getDoc} from "https://www.gstatic.com/firebasejs/12.18.0/firebase-firestore.js";

const adminNombre=document.getElementById("adminNombre");

onAuthStateChanged(auth,async(user)=>{

if(!user){
location.href="red-login.html";
return;
}

const snap=await getDoc(doc(db,"usuarios",user.uid));

if(!snap.exists()){
location.href="red.html";
return;
}

const datos=snap.data();

const esAdmin=
datos.rol==="administrador" ||
datos.rol==="admin" ||
user.email==="julianbattauz006@gmail.com";

if(!esAdmin){
alert("Acceso privado GESBASE");
location.href="red.html";
return;
}

document.body.style.display="block";
adminNombre.textContent="Administrador: "+(datos.nombreCompleto||user.email);

});
</script>

</body>
</html>
