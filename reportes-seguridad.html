<!DOCTYPE html>
<html lang="es-AR">

<head>

<meta charset="UTF-8">

<meta
    name="viewport"
    content="width=device-width,initial-scale=1"
>

<meta
    name="theme-color"
    content="#12343B"
>

<title>Seguridad | GESBASE</title>


<style>

*{
    box-sizing:border-box;
    margin:0;
    padding:0;
}

body{
    font-family:Arial,Helvetica,sans-serif;
    background:#f3f4f6;
    color:#1f2937;
    display:none;
}

header{
    background:#12343B;
    color:#fff;
    padding:16px;
    font-size:22px;
    font-weight:bold;
}

main{
    padding:15px;
    max-width:1000px;
    margin:auto;
}

.card{
    background:#fff;
    border-radius:14px;
    padding:16px;
    margin-bottom:14px;
    box-shadow:0 2px 8px rgba(0,0,0,.08);
}

.card h3{
    margin-bottom:6px;
    color:#12343B;
}

.card p{
    line-height:1.5;
}

.grid{
    display:grid;
    grid-template-columns:
        repeat(
            auto-fit,
            minmax(220px,1fr)
        );
    gap:12px;
}

.btn{
    display:block;
    text-align:center;
    text-decoration:none;
    background:#12343B;
    color:#fff;
    padding:12px;
    border-radius:10px;
    font-weight:bold;
    margin-top:12px;
}

.btn:hover{
    opacity:.9;
}


/* =====================================================
   CABECERA REPORTES
===================================================== */

.reportes-header{
    display:flex;
    align-items:center;
    justify-content:space-between;
    gap:10px;
    margin-bottom:14px;
}

.reportes-header h2{
    color:#12343B;
    font-size:20px;
}

.contador{
    background:#991b1b;
    color:#fff;
    min-width:32px;
    height:32px;
    border-radius:50%;
    display:flex;
    align-items:center;
    justify-content:center;
    font-weight:bold;
    font-size:14px;
}


/* =====================================================
   REPORTE
===================================================== */

.reporte{
    background:#fff;
    border-radius:14px;
    padding:16px;
    margin-bottom:14px;
    box-shadow:0 2px 8px rgba(0,0,0,.08);
    border-left:5px solid #991b1b;
}

.reporte.revisado{
    border-left-color:#166534;
}

.reporte-titulo{
    font-size:17px;
    font-weight:bold;
    color:#12343B;
    margin-bottom:10px;
}

.reporte-linea{
    margin-bottom:8px;
    font-size:14px;
    line-height:1.5;
}

.reporte-label{
    font-weight:bold;
    color:#374151;
}

.estado{
    display:inline-block;
    padding:5px 10px;
    border-radius:20px;
    font-size:12px;
    font-weight:bold;
    margin-bottom:12px;
}

.estado-pendiente{
    background:#fef3c7;
    color:#92400e;
}

.estado-revisado{
    background:#dcfce7;
    color:#166534;
}

.descripcion{
    background:#f8fafc;
    border-radius:10px;
    padding:12px;
    margin-top:8px;
    white-space:pre-wrap;
    word-break:break-word;
}

.reporte-acciones{
    display:flex;
    gap:10px;
    flex-wrap:wrap;
    margin-top:14px;
}

.btn-revisado{
    border:none;
    background:#166534;
    color:#fff;
    padding:10px 14px;
    border-radius:9px;
    font-weight:bold;
    cursor:pointer;
}

.btn-revisado:disabled{
    opacity:.6;
}

.btn-ver-usuario{
    border:none;
    background:#eef2f7;
    color:#12343B;
    padding:10px 14px;
    border-radius:9px;
    font-weight:bold;
    cursor:pointer;
}

.sin-reportes{
    background:#fff;
    border-radius:14px;
    padding:25px;
    text-align:center;
    color:#6b7280;
    box-shadow:0 2px 8px rgba(0,0,0,.08);
}

.cargando-reportes{
    text-align:center;
    padding:25px;
    color:#6b7280;
}

.error-reportes{
    background:#fee2e2;
    color:#991b1b;
    padding:14px;
    border-radius:10px;
    margin-bottom:14px;
}


/* =====================================================
   SEPARADOR
===================================================== */

.separador{
    height:1px;
    background:#e5e7eb;
    margin:22px 0;
}

</style>

</head>


<body>


<header>
    🛡️ GESBASE · Seguridad
</header>



<main>


<!-- =====================================================
     PANEL ADMINISTRADOR
===================================================== -->

<div class="card">

    <h3>
        Panel privado
    </h3>

    <p id="adminNombre">
        Verificando acceso...
    </p>

</div>



<!-- =====================================================
     REPORTES
===================================================== -->

<div class="reportes-header">

    <h2>
        🚨 Reportes de usuarios
    </h2>

    <div
        id="contadorReportes"
        class="contador"
    >
        0
    </div>

</div>


<div
    id="errorReportes"
    class="error-reportes"
    style="display:none"
></div>


<div
    id="cargandoReportes"
    class="cargando-reportes"
>
    Cargando reportes...
</div>


<div
    id="listaReportes"
></div>



<div class="separador"></div>



<!-- =====================================================
     OTRAS ÁREAS DE SEGURIDAD
===================================================== -->

<div class="grid">


    <div class="card">

        <h3>
            ⚖️ Mediación
        </h3>

        <p>
            Casos entre usuarios.
        </p>

        <a
            class="btn"
            href="panel-mediacion.html"
        >
            Abrir
        </a>

    </div>



    <div class="card">

        <h3>
            ✅ Verificaciones
        </h3>

        <p>
            Validar empresas y personas.
        </p>

        <a
            class="btn"
            href="verificaciones.html"
        >
            Revisar
        </a>

    </div>



    <div class="card">

        <h3>
            👥 Usuarios
        </h3>

        <p>
            Usuarios registrados en la Red.
        </p>

        <a
            class="btn"
            href="usuarios-red.html"
        >
            Ver usuarios
        </a>

    </div>


</div>


</main>



<script type="module">


/* =====================================================
   FIREBASE AUTH
===================================================== */

import {
    onAuthStateChanged
} from "https://www.gstatic.com/firebasejs/12.18.0/firebase-auth.js";


/* =====================================================
   FIRESTORE
===================================================== */

import {
    collection,
    query,
    orderBy,
    onSnapshot,
    doc,
    updateDoc,
    getDoc,
    addDoc,
    serverTimestamp
} from "https://www.gstatic.com/firebasejs/12.18.0/firebase-firestore.js";


/* =====================================================
   FIREBASE DEL PROYECTO
===================================================== */

import {
    auth,
    db
} from "./Js/firebase.js";



/* =====================================================
   ELEMENTOS
===================================================== */

const adminNombre =
    document.getElementById(
        "adminNombre"
    );

const listaReportes =
    document.getElementById(
        "listaReportes"
    );

const contadorReportes =
    document.getElementById(
        "contadorReportes"
    );

const cargandoReportes =
    document.getElementById(
        "cargandoReportes"
    );

const errorReportes =
    document.getElementById(
        "errorReportes"
    );



/* =====================================================
   VARIABLE ADMIN
===================================================== */

let usuarioAdministrador = null;



/* =====================================================
   ESCAPAR HTML
   Evita insertar contenido del usuario
   directamente como HTML.
===================================================== */

function escaparHTML(valor){

    return String(
        valor ?? ""
    )
    .replaceAll("&","&amp;")
    .replaceAll("<","&lt;")
    .replaceAll(">","&gt;")
    .replaceAll('"',"&quot;")
    .replaceAll("'","&#039;");

}



/* =====================================================
   FECHA
===================================================== */

function mostrarFecha(reporte){

    if(
        reporte.fecha &&
        typeof reporte.fecha.toDate ===
        "function"
    ){

        return reporte.fecha
            .toDate()
            .toLocaleString(
                "es-AR"
            );

    }


    if(reporte.fechaCliente){

        return new Date(
            reporte.fechaCliente
        ).toLocaleString(
            "es-AR"
        );

    }


    return "Sin fecha";

}



/* =====================================================
   ABRIR PERFIL
===================================================== */

function abrirPerfil(uid){

    if(!uid){
        return;
    }

    window.open(
        "red-perfil.html?uid=" +
        encodeURIComponent(uid),
        "_blank"
    );

}



/* =====================================================
   MARCAR COMO REVISADO
===================================================== */

async function marcarRevisado(
    reporteId,
    boton
){

    if(
        !reporteId ||
        !boton
    ){

        return;

    }


    const confirmar =
        confirm(
            "¿Marcar este reporte como revisado?"
        );


    if(!confirmar){
        return;
    }


    boton.disabled =
        true;

    boton.textContent =
        "Guardando...";


    try{

        await updateDoc(
            doc(
                db,
                "reportes",
                reporteId
            ),
            {

                estado:
                    "revisado",

                revisadoPor:
                    usuarioAdministrador.uid,

                revisadoPorEmail:
                    usuarioAdministrador.email ||
                    "",

                fechaRevision:
                    serverTimestamp(),

                fechaRevisionCliente:
                    Date.now()

            }
        );


        /*
         * La notificación al reportante se
         * intenta crear después de actualizar
         * el reporte.
         */

        try{

            const reporteSnap =
                await getDoc(
                    doc(
                        db,
                        "reportes",
                        reporteId
                    )
                );


            if(
                reporteSnap.exists()
            ){

                const reporte =
                    reporteSnap.data();


                if(
                    reporte.reportanteUid
                ){

                    await addDoc(
                        collection(
                            db,
                            "notificaciones"
                        ),
                        {

                            receptorUid:
                                reporte.reportanteUid,

                            emisorUid:
                                usuarioAdministrador.uid,

                            tipo:
                                "reporte_revisado",

                            titulo:
                                "Reporte revisado",

                            mensaje:
                                "Tu reporte fue revisado por el equipo de seguridad de GESBASE.",

                            leida:
                                false,

                            referenciaId:
                                reporteId,

                            url:
                                "red-notificaciones.html",

                            fecha:
                                serverTimestamp(),

                            fechaCliente:
                                Date.now()

                        }
                    );

                }

            }

        }catch(error){

            console.warn(
                "No se pudo enviar la notificación:",
                error
            );

        }


    }catch(error){

        console.error(
            "Error marcando reporte:",
            error
        );


        alert(
            "No se pudo actualizar el reporte."
        );


        boton.disabled =
            false;

        boton.textContent =
            "✅ Marcar como revisado";

    }

}



/* =====================================================
   MOSTRAR REPORTES
===================================================== */

function mostrarReportes(
    snapshot
){

    listaReportes.innerHTML =
        "";

    cargandoReportes.style.display =
        "none";


    let pendientes = 0;


    if(snapshot.empty){

        contadorReportes.textContent =
            "0";

        listaReportes.innerHTML = `
            <div class="sin-reportes">
                <div style="font-size:35px;margin-bottom:8px">
                    ✅
                </div>
                <strong>
                    No hay reportes
                </strong>
                <p style="margin-top:6px">
                    No se encontraron reportes registrados.
                </p>
            </div>
        `;

        return;

    }


    snapshot.forEach(
        reporteDoc => {

            const reporte =
                reporteDoc.data();

            const id =
                reporteDoc.id;


            const estado =
                reporte.estado ||
                "pendiente";


            if(
                estado !==
                "revisado"
            ){

                pendientes++;

            }


            const claseEstado =
                estado === "revisado"
                    ? "estado estado-revisado"
                    : "estado estado-pendiente";


            const textoEstado =
                estado === "revisado"
                    ? "✅ Revisado"
                    : "⏳ Pendiente";


            const nombreReportado =
                reporte.reportadoNombre ||
                "Usuario GESBASE";


            const nombreReportante =
                reporte.reportanteNombre ||
                "Usuario GESBASE";


            const motivo =
                reporte.motivo ||
                "Sin motivo";


            const descripcion =
                reporte.descripcion ||
                "Sin descripción";


            const fecha =
                mostrarFecha(
                    reporte
                );


            const tipo =
                reporte.tipo ||
                "usuario";


            const elemento =
                document.createElement(
                    "div"
                );


            elemento.className =
                "reporte" +
                (
                    estado === "revisado"
                        ? " revisado"
                        : ""
                );


            elemento.innerHTML = `

                <div class="${claseEstado}">
                    ${escaparHTML(textoEstado)}
                </div>

                <div class="reporte-titulo">
                    ⚠️ Reporte de ${escaparHTML(tipo)}
                </div>

                <div class="reporte-linea">
                    <span class="reporte-label">
                        Usuario reportado:
                    </span>
                    ${escaparHTML(nombreReportado)}
                </div>

                <div class="reporte-linea">
                    <span class="reporte-label">
                        Usuario que reportó:
                    </span>
                    ${escaparHTML(nombreReportante)}
                </div>

                <div class="reporte-linea">
                    <span class="reporte-label">
                        Motivo:
                    </span>
                    ${escaparHTML(motivo)}
                </div>

                <div class="reporte-linea">
                    <span class="reporte-label">
                        Fecha:
                    </span>
                    ${escaparHTML(fecha)}
                </div>

                <div class="descripcion">
                    ${escaparHTML(descripcion)}
                </div>

                <div class="reporte-acciones">

                    ${
                        reporte.reportadoUid
                        ?
                        `
                        <button
                            class="btn-ver-usuario"
                            data-uid-reportado="${escaparHTML(reporte.reportadoUid)}"
                        >
                            👤 Ver usuario reportado
                        </button>
                        `
                        :
                        ""
                    }

                    ${
                        estado !== "revisado"
                        ?
                        `
                        <button
                            class="btn-revisado"
                            data-reporte-id="${escaparHTML(id)}"
                        >
                            ✅ Marcar como revisado
                        </button>
                        `
                        :
                        ""
                    }

                </div>

            `;


            /*
             * BOTÓN VER USUARIO
             */

            const botonUsuario =
                elemento.querySelector(
                    "[data-uid-reportado]"
                );


            if(botonUsuario){

                botonUsuario.addEventListener(
                    "click",
                    () => {

                        abrirPerfil(
                            botonUsuario.dataset.uidReportado
                        );

                    }
                );

            }


            /*
             * BOTÓN REVISADO
             */

            const botonRevisado =
                elemento.querySelector(
                    "[data-reporte-id]"
                );


            if(botonRevisado){

                botonRevisado.addEventListener(
                    "click",
                    () => {

                        marcarRevisado(
                            botonRevisado.dataset.reporteId,
                            botonRevisado
                        );

                    }
                );

            }


            listaReportes.appendChild(
                elemento
            );

        }
    );


    contadorReportes.textContent =
        String(
            pendientes
        );

}



/* =====================================================
   CARGAR REPORTES EN TIEMPO REAL
===================================================== */

function escucharReportes(){

    cargandoReportes.style.display =
        "block";


    errorReportes.style.display =
        "none";


    try{

        const reportesQuery =
            query(
                collection(
                    db,
                    "reportes"
                ),
                orderBy(
                    "fecha",
                    "desc"
                )
            );


        onSnapshot(
            reportesQuery,
            snapshot => {

                mostrarReportes(
                    snapshot
                );

            },
            error => {

                console.error(
                    "Error leyendo reportes:",
                    error
                );


                cargandoReportes.style.display =
                    "none";

                errorReportes.textContent =
                    "No se pudieron cargar los reportes. Revisá las reglas de Firestore o el índice de la colección reportes.";

                errorReportes.style.display =
                    "block";

            }
        );

    }catch(error){

        console.error(
            error
        );

        cargandoReportes.style.display =
            "none";

        errorReportes.textContent =
            "No se pudieron cargar los reportes.";

        errorReportes.style.display =
            "block";

    }

}



/* =====================================================
   AUTENTICACIÓN Y SEGURIDAD
===================================================== */

onAuthStateChanged(
    auth,
    async user => {

        if(!user){

            location.href =
                "red-login.html";

            return;

        }


        usuarioAdministrador =
            user;


        try{

            /*
             * PERFIL PRINCIPAL
             */

            const usuarioSnap =
                await getDoc(
                    doc(
                        db,
                        "usuarios",
                        user.uid
                    )
                );


            if(!usuarioSnap.exists()){

                alert(
                    "No se encontró el usuario de GESBASE."
                );

                location.href =
                    "red.html";

                return;

            }


            const datos =
                usuarioSnap.data();


            /*
             * ADMINISTRADOR
             */

            const esAdmin =
                datos.rol ===
                    "administrador" ||

                datos.rol ===
                    "admin" ||

                user.email ===
                    "julianbattauz006@gmail.com";


            if(!esAdmin){

                alert(
                    "Acceso privado GESBASE"
                );

                location.href =
                    "red.html";

                return;

            }


            /*
             * MOSTRAR PANEL
             */

            document.body.style.display =
                "block";


            adminNombre.textContent =
                "Administrador: " +
                (
                    datos.nombreCompleto ||
                    user.displayName ||
                    user.email
                );


            /*
             * ESCUCHAR REPORTES
             */

            escucharReportes();


        }catch(error){

            console.error(
                "Error verificando administrador:",
                error
            );


            alert(
                "No se pudo verificar el acceso."
            );


            location.href =
                "red.html";

        }

    }
);

</script>


</body>
</html>
