<script type="module">


import {
    auth,
    db
} from "./Js/firebase.js";


import {
    onAuthStateChanged
} from "https://www.gstatic.com/firebasejs/12.18.0/firebase-auth.js";


import {
    collection,
    onSnapshot,
    addDoc,
    getDoc,
    doc,
    query,
    where,
    serverTimestamp
} from "https://www.gstatic.com/firebasejs/12.18.0/firebase-firestore.js";


/* =========================================================
   VARIABLES
========================================================= */

let usuarioActual = null;

let todosLosEmpleos = [];

let empleoSeleccionado = null;

let unsubscribeEmpleos = null;


/* =========================================================
   ELEMENTOS
========================================================= */

const listaEmpleos =
    document.getElementById(
        "listaEmpleos"
    );

const estado =
    document.getElementById(
        "estado"
    );

const contador =
    document.getElementById(
        "contador"
    );

const buscar =
    document.getElementById(
        "buscar"
    );

const filtroCiudad =
    document.getElementById(
        "filtroCiudad"
    );

const filtroModalidad =
    document.getElementById(
        "filtroModalidad"
    );

const modalPostular =
    document.getElementById(
        "modalPostular"
    );

const modalEmpleo =
    document.getElementById(
        "modalEmpleo"
    );

const telefonoPostulante =
    document.getElementById(
        "telefonoPostulante"
    );

const mensajePostulante =
    document.getElementById(
        "mensajePostulante"
    );

const enviarPostulacion =
    document.getElementById(
        "enviarPostulacion"
    );


/* =========================================================
   AUTENTICACIÓN
========================================================= */

onAuthStateChanged(
    auth,
    usuario => {

        if(!usuario){

            location.href =
                "red-login.html";

            return;

        }


        usuarioActual =
            usuario;


        escucharEmpleos();

    }
);


/* =========================================================
   ESCUCHAR EMPLEOS
========================================================= */

function escucharEmpleos(){

    if(unsubscribeEmpleos){

        unsubscribeEmpleos();

        unsubscribeEmpleos =
            null;

    }


    /*
     * No usamos orderBy.
     * Así evitamos depender de índices.
     */

    const referencia =
        collection(
            db,
            "empleos"
        );


    unsubscribeEmpleos =
        onSnapshot(
            referencia,
            snapshot => {

                todosLosEmpleos =
                    [];


                snapshot.forEach(
                    documento => {

                        todosLosEmpleos.push({

                            id:
                                documento.id,

                            ...documento.data()

                        });

                    }
                );


                /*
                 * Orden local:
                 * destacados primero,
                 * después fecha.
                 */

                todosLosEmpleos.sort(
                    (a,b) => {

                        const destacadoA =
                            String(
                                a.tipo || ""
                            ).toLowerCase() ===
                            "destacado"
                                ? 1
                                : 0;


                        const destacadoB =
                            String(
                                b.tipo || ""
                            ).toLowerCase() ===
                            "destacado"
                                ? 1
                                : 0;


                        if(
                            destacadoA !==
                            destacadoB
                        ){

                            return destacadoB -
                                   destacadoA;

                        }


                        return obtenerTiempo(
                            b
                        ) -
                        obtenerTiempo(
                            a
                        );

                    }
                );


                aplicarFiltros();

            },

            error => {

                console.error(
                    "Error cargando empleos:",
                    error
                );


                listaEmpleos.innerHTML =
                    "";


                estado.style.display =
                    "block";


                estado.innerHTML = `

                    <div class="estado-icono">
                        ⚠️
                    </div>

                    <div class="estado-titulo">
                        No se pudieron cargar los empleos
                    </div>

                    <div class="estado-texto">
                        Revisá tu conexión e intentá nuevamente.
                    </div>

                `;

            }
        );

}


/* =========================================================
   OBTENER TIEMPO
========================================================= */

function obtenerTiempo(
    empleo
){

    if(
        empleo.fechaCliente
    ){

        return Number(
            empleo.fechaCliente
        );

    }


    if(
        empleo.fecha &&
        typeof empleo.fecha.toMillis ===
        "function"
    ){

        return empleo.fecha.toMillis();

    }


    if(
        empleo.fecha &&
        empleo.fecha.seconds
    ){

        return empleo.fecha.seconds * 1000;

    }


    return 0;

}


/* =========================================================
   FILTROS
========================================================= */

function aplicarFiltros(){

    const texto =
        buscar.value
            .trim()
            .toLowerCase();


    const ciudad =
        filtroCiudad.value
            .trim()
            .toLowerCase();


    const modalidad =
        filtroModalidad.value
            .trim()
            .toLowerCase();


    const filtrados =
        todosLosEmpleos.filter(
            empleo => {

                const estadoEmpleo =
                    String(
                        empleo.estado ||
                        "activo"
                    ).toLowerCase();


                if(
                    estadoEmpleo !==
                    "activo"
                ){

                    return false;

                }


                const contenido = (

                    String(
                        empleo.puesto || ""
                    ) +

                    " " +

                    String(
                        empleo.empresa || ""
                    ) +

                    " " +

                    String(
                        empleo.descripcion || ""
                    ) +

                    " " +

                    String(
                        empleo.ciudad || ""
                    ) +

                    " " +

                    String(
                        empleo.provincia || ""
                    )

                ).toLowerCase();


                if(
                    texto &&
                    !contenido.includes(
                        texto
                    )
                ){

                    return false;

                }


                const ubicacion = (

                    String(
                        empleo.ciudad || ""
                    ) +

                    " " +

                    String(
                        empleo.provincia || ""
                    )

                ).toLowerCase();


                if(
                    ciudad &&
                    !ubicacion.includes(
                        ciudad
                    )
                ){

                    return false;

                }


                if(
                    modalidad &&
                    String(
                        empleo.modalidad || ""
                    ).toLowerCase() !==
                    modalidad
                ){

                    return false;

                }


                return true;

            }
        );


    renderizarEmpleos(
        filtrados
    );

}


/* =========================================================
   RENDER
========================================================= */

function renderizarEmpleos(
    empleos
){

    listaEmpleos.innerHTML =
        "";


    contador.textContent =
        empleos.length +
        (
            empleos.length === 1
                ? " empleo"
                : " empleos"
        );


    if(!empleos.length){

        estado.style.display =
            "block";

        return;

    }


    estado.style.display =
        "none";


    empleos.forEach(
        empleo => {

            listaEmpleos.appendChild(
                crearTarjetaEmpleo(
                    empleo
                )
            );

        }
    );

}


/* =========================================================
   CREAR TARJETA
========================================================= */

function crearTarjetaEmpleo(
    empleo
){

    const tarjeta =
        document.createElement(
            "article"
        );


    const esDestacado =
        String(
            empleo.tipo || ""
        ).toLowerCase() ===
        "destacado";


    tarjeta.className =
        "empleo" +
        (
            esDestacado
                ? " destacado"
                : ""
        );


    if(esDestacado){

        const etiqueta =
            document.createElement(
                "div"
            );


        etiqueta.className =
            "etiqueta";


        etiqueta.textContent =
            "⭐ DESTACADO";


        tarjeta.appendChild(
            etiqueta
        );

    }


    const top =
        document.createElement(
            "div"
        );


    top.className =
        "empleo-top";


    const avatar =
        document.createElement(
            "div"
        );


    avatar.className =
        "empresa-avatar";


    const inicial =
        obtenerInicial(
            empleo.empresa ||
            "E"
        );


    avatar.textContent =
        inicial;


    top.appendChild(
        avatar
    );


    const cabecera =
        document.createElement(
            "div"
        );


    cabecera.className =
        "empleo-cabecera";


    const puesto =
        document.createElement(
            "div"
        );


    puesto.className =
        "puesto";


    puesto.textContent =
        empleo.puesto ||
        "Puesto disponible";


    const empresa =
        document.createElement(
            "div"
        );


    empresa.className =
        "empresa";


    empresa.textContent =
        empleo.empresa ||
        "Empresa GESBASE";


    const ubicacion =
        document.createElement(
            "div"
        );


    ubicacion.className =
        "ubicacion";


    let textoUbicacion =
        "📍 ";


    if(empleo.ciudad){

        textoUbicacion +=
            empleo.ciudad;

    }


    if(
        empleo.ciudad &&
        empleo.provincia
    ){

        textoUbicacion +=
            " · ";

    }


    if(empleo.provincia){

        textoUbicacion +=
            empleo.provincia;

    }


    if(
        !empleo.ciudad &&
        !empleo.provincia
    ){

        textoUbicacion +=
            "Ubicación no especificada";

    }


    ubicacion.textContent =
        textoUbicacion;


    cabecera.appendChild(
        puesto
    );

    cabecera.appendChild(
        empresa
    );

    cabecera.appendChild(
        ubicacion
    );


    top.appendChild(
        cabecera
    );


    tarjeta.appendChild(
        top
    );


    /* DESCRIPCIÓN */

    if(
        empleo.descripcion
    ){

        const descripcion =
            document.createElement(
                "div"
            );


        descripcion.className =
            "empleo-descripcion";


        descripcion.textContent =
            empleo.descripcion;


        tarjeta.appendChild(
            descripcion
        );

    }


    /* DATOS */

    const datos =
        document.createElement(
            "div"
        );


    datos.className =
        "datos";


    if(
        empleo.modalidad
    ){

        datos.appendChild(
            crearDato(
                "🕐 " +
                empleo.modalidad
            )
        );

    }


    if(
        empleo.sueldo
    ){

        datos.appendChild(
            crearDato(
                "💰 " +
                empleo.sueldo,
                "sueldo"
            )
        );

    }


    if(
        datos.children.length
    ){

        tarjeta.appendChild(
            datos
        );

    }


    /* FOOTER */

    const footer =
        document.createElement(
            "div"
        );


    footer.className =
        "empleo-footer";


    const fecha =
        document.createElement(
            "span"
        );


    fecha.className =
        "fecha-empleo";


    fecha.textContent =
        fechaTexto(
            empleo.fecha
        );


    const boton =
        document.createElement(
            "button"
        );


    boton.className =
        "btn-postular";

    boton.type =
        "button";

    boton.textContent =
        "Postularme";


    boton.addEventListener(
        "click",
        () => {

            abrirModalPostulacion(
                empleo
            );

        }
    );


    footer.appendChild(
        fecha
    );

    footer.appendChild(
        boton
    );


    tarjeta.appendChild(
        footer
    );


    return tarjeta;

}


/* =========================================================
   DATO
========================================================= */

function crearDato(
    texto,
    clase=""
){

    const elemento =
        document.createElement(
            "span"
        );


    elemento.className =
        "dato " +
        clase;


    elemento.textContent =
        texto;


    return elemento;

}


/* =========================================================
   INICIAL
========================================================= */

function obtenerInicial(
    texto
){

    const limpio =
        String(
            texto || "E"
        ).trim();


    if(!limpio){

        return "E";

    }


    return limpio
        .substring(0,1)
        .toUpperCase();

}


/* =========================================================
   FECHA
========================================================= */

function fechaTexto(
    timestamp
){

    if(!timestamp){

        return "Publicado recientemente";

    }


    try{

        const fecha =
            timestamp.toDate
                ? timestamp.toDate()
                : new Date(timestamp);


        if(
            Number.isNaN(
                fecha.getTime()
            )
        ){

            return "Publicado recientemente";

        }


        return fecha.toLocaleDateString(
            "es-AR",
            {
                day:"2-digit",
                month:"2-digit",
                year:"numeric"
            }
        );

    }catch(error){

        return "Publicado recientemente";

    }

}


/* =========================================================
   MODAL POSTULACIÓN
========================================================= */

function abrirModalPostulacion(
    empleo
){

    empleoSeleccionado =
        empleo;


    modalEmpleo.innerHTML =
        "";


    const puesto =
        document.createElement(
            "div"
        );


    puesto.className =
        "modal-puesto";


    puesto.textContent =
        empleo.puesto ||
        "Puesto disponible";


    const empresa =
        document.createElement(
            "div"
        );


    empresa.className =
        "modal-empresa";


    empresa.textContent =
        empleo.empresa ||
        "Empresa GESBASE";


    modalEmpleo.appendChild(
        puesto
    );


    modalEmpleo.appendChild(
        empresa
    );


    telefonoPostulante.value =
        "";


    mensajePostulante.value =
        "";


    modalPostular.classList.add(
        "visible"
    );

}


function cerrarModalPostulacion(){

    modalPostular.classList.remove(
        "visible"
    );


    empleoSeleccionado =
        null;

}


document.getElementById(
    "cerrarPostular"
).addEventListener(
    "click",
    cerrarModalPostulacion
);


document.getElementById(
    "cancelarPostular"
).addEventListener(
    "click",
    cerrarModalPostulacion
);


modalPostular.addEventListener(
    "click",
    event => {

        if(
            event.target ===
            modalPostular
        ){

            cerrarModalPostulacion();

        }

    }
);


/* =========================================================
   ENVIAR POSTULACIÓN
========================================================= */

enviarPostulacion.addEventListener(
    "click",
    async () => {

        if(
            !usuarioActual ||
            !empleoSeleccionado
        ){

            mostrarToast(
                "No se pudo identificar el empleo."
            );

            return;

        }


        const telefono =
            telefonoPostulante.value
                .trim();


        const mensaje =
            mensajePostulante.value
                .trim();


        if(!telefono){

            mostrarToast(
                "Ingresá tu teléfono."
            );

            telefonoPostulante.focus();

            return;

        }


        enviarPostulacion.disabled =
            true;


        try{

            /*
             * Evitamos postular dos veces
             * al mismo empleo.
             */

            const consulta =
                query(
                    collection(
                        db,
                        "postulaciones"
                    ),
                    where(
                        "empleoId",
                        "==",
                        empleoSeleccionado.id
                    ),
                    where(
                        "postulanteUid",
                        "==",
                        usuarioActual.uid
                    )
                );


            /*
             * La consulta anterior puede requerir
             * índice compuesto en Firestore.
             *
             * Para mantener este archivo simple,
             * si el índice no existe igualmente
             * intentaremos guardar.
             */

            let yaPostulado = false;


            try{

                const resultado =
                    await getDocsCompat(
                        consulta
                    );


                yaPostulado =
                    !resultado.empty;

            }catch(error){

                console.warn(
                    "No se pudo comprobar duplicado:",
                    error
                );

            }


            if(yaPostulado){

                mostrarToast(
                    "Ya te postulaste a este empleo."
                );

                return;

            }


            await addDoc(
                collection(
                    db,
                    "postulaciones"
                ),
                {

                    empleoId:
                        empleoSeleccionado.id,

                    empleoPuesto:
                        empleoSeleccionado.puesto ||
                        "",

                    empresa:
                        empleoSeleccionado.empresa ||
                        "",

                    postulanteUid:
                        usuarioActual.uid,

                    postulanteEmail:
                        usuarioActual.email ||
                        "",

                    telefono:
                        telefono,

                    mensaje:
                        mensaje,

                    estado:
                        "pendiente",

                    fecha:
                        serverTimestamp(),

                    fechaCliente:
                        Date.now()

                }
            );


            /*
             * Creamos una notificación para
             * el dueño del aviso cuando sea
             * diferente al postulante.
             */

            if(
                empleoSeleccionado.uid &&
                empleoSeleccionado.uid !==
                usuarioActual.uid
            ){

                try{

                    await addDoc(
                        collection(
                            db,
                            "notificaciones"
                        ),
                        {

                            receptorUid:
                                empleoSeleccionado.uid,

                            emisorUid:
                                usuarioActual.uid,

                            tipo:
                                "postulacion_empleo",

                            titulo:
                                "Nueva postulación",

                            mensaje:
                                "Recibiste una nueva postulación para " +
                                (
                                    empleoSeleccionado.puesto ||
                                    "tu aviso laboral"
                                ) +
                                ".",

                            leida:
                                false,

                            referenciaId:
                                empleoSeleccionado.id,

                            url:
                                "mis-empleos.html",

                            fecha:
                                serverTimestamp()

                        }
                    );

                }catch(error){

                    console.warn(
                        "No se pudo crear notificación:",
                        error
                    );

                }

            }


            mostrarToast(
                "¡Postulación enviada correctamente!"
            );


            cerrarModalPostulacion();


        }catch(error){

            console.error(
                "Error postulación:",
                error
            );


            mostrarToast(
                "No se pudo enviar la postulación."
            );

        }finally{

            enviarPostulacion.disabled =
                false;

        }

    }
);


/* =========================================================
   GET DOCS COMPATIBLE
========================================================= */

async function getDocsCompat(
    consulta
){

    const modulo =
        await import(
            "https://www.gstatic.com/firebasejs/12.18.0/firebase-firestore.js"
        );


    return modulo.getDocs(
        consulta
    );

}
