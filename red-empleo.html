<!DOCTYPE html>
<html lang="es-AR">
<head>
    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0, viewport-fit=cover"
    >

    <meta name="theme-color" content="#12343B">

    <meta
        name="description"
        content="Red Empleo GESBASE - Encontrá oportunidades laborales y publicá empleos."
    >

    <title>Empleo - Red GESBASE</title>

    <style>

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        html,
        body {
            width: 100%;
            min-height: 100%;
        }

        body {
            font-family: Arial, Helvetica, sans-serif;
            background: #f3f5f7;
            color: #1f2937;
            padding-bottom: 85px;
        }

        button,
        input,
        select,
        textarea {
            font: inherit;
        }

        button {
            cursor: pointer;
        }

        /* =====================================================
           TOPBAR
        ===================================================== */

        .topbar {
            position: sticky;
            top: 0;
            z-index: 100;
            background: #12343B;
            color: white;

            padding:
                calc(11px + env(safe-area-inset-top))
                14px
                11px;

            box-shadow:
                0 2px 10px rgba(0,0,0,.16);
        }

        .topbar-inner {
            width: 100%;
            max-width: 1100px;
            margin: auto;

            display: flex;
            align-items: center;
            justify-content: space-between;

            gap: 12px;
        }

        .brand {
            font-size: 20px;
            font-weight: 800;
        }

        .brand span {
            display: block;
            margin-top: 2px;

            font-size: 12px;
            font-weight: 500;

            opacity: .82;
        }

        .top-actions {
            display: flex;
            gap: 7px;
        }

        .top-btn {
            border: 0;
            border-radius: 10px;

            padding: 9px 11px;

            background: rgba(255,255,255,.12);
            color: white;

            font-size: 13px;
            font-weight: 700;
        }

        /* =====================================================
           CONTENEDOR
        ===================================================== */

        .container {
            width: 100%;
            max-width: 1100px;

            margin: auto;

            padding:
                16px
                14px
                30px;
        }

        /* =====================================================
           HERO
        ===================================================== */

        .hero {
            background: white;
            border-radius: 19px;

            padding: 20px;

            margin-bottom: 15px;

            box-shadow:
                0 2px 10px rgba(0,0,0,.07);
        }

        .hero h1 {
            font-size: 27px;
            color: #111827;

            margin-bottom: 7px;
        }

        .hero p {
            color: #64748b;
            line-height: 1.5;
        }

        .hero-actions {
            display: flex;
            flex-wrap: wrap;
            gap: 9px;

            margin-top: 16px;
        }

        .btn {
            border: 0;
            border-radius: 11px;

            padding: 11px 15px;

            font-weight: 800;

            transition: transform .15s ease;
        }

        .btn:active {
            transform: scale(.98);
        }

        .btn-primary {
            background: #12343B;
            color: white;
        }

        .btn-secondary {
            background: #e8eef0;
            color: #12343B;
        }

        /* =====================================================
           BUSCADOR
        ===================================================== */

        .search-card {
            background: white;
            border-radius: 18px;

            padding: 16px;

            margin-bottom: 15px;

            box-shadow:
                0 2px 9px rgba(0,0,0,.06);
        }

        .search-main {
            position: relative;
        }

        .search-main input {
            width: 100%;

            border: 1px solid #d5dce1;
            border-radius: 12px;

            padding:
                13px
                42px
                13px
                14px;

            outline: none;
            background: white;
        }

        .search-main input:focus {
            border-color: #12343B;

            box-shadow:
                0 0 0 3px rgba(18,52,59,.10);
        }

        .search-icon {
            position: absolute;

            right: 13px;
            top: 50%;

            transform: translateY(-50%);

            font-size: 19px;
            pointer-events: none;
        }

        .filters {
            display: grid;

            grid-template-columns:
                repeat(2, minmax(0,1fr));

            gap: 9px;

            margin-top: 10px;
        }

        .filters select {
            width: 100%;

            border: 1px solid #d5dce1;
            border-radius: 11px;

            background: white;

            padding: 11px;

            color: #334155;
            outline: none;
        }

        /* =====================================================
           RESULTADOS
        ===================================================== */

        .results-header {
            display: flex;

            align-items: center;
            justify-content: space-between;

            gap: 10px;

            margin-bottom: 11px;
        }

        .results-title {
            font-size: 18px;
            font-weight: 800;
            color: #111827;
        }

        .results-count {
            font-size: 13px;
            color: #64748b;
        }

        .jobs {
            display: grid;
            gap: 14px;
        }

        /* =====================================================
           JOB CARD
        ===================================================== */

        .job-card {
            position: relative;

            background: white;

            border-radius: 18px;

            padding: 18px;

            border: 1px solid #e4e8eb;

            box-shadow:
                0 2px 10px rgba(0,0,0,.06);
        }

        .job-card.featured {
            border-color: #e5c45d;

            box-shadow:
                0 3px 14px rgba(180,130,20,.12);
        }

        .featured-bar {
            position: absolute;

            top: 0;
            left: 0;
            right: 0;

            height: 4px;

            background: #d4a72c;

            border-radius:
                18px
                18px
                0
                0;
        }

        .job-top {
            display: flex;

            align-items: flex-start;
            justify-content: space-between;

            gap: 12px;
        }

        .company-wrap {
            display: flex;
            align-items: center;

            gap: 11px;
        }

        .company-avatar {
            width: 46px;
            height: 46px;

            flex: 0 0 46px;

            display: flex;
            align-items: center;
            justify-content: center;

            border-radius: 13px;

            background: #e8eef0;
            color: #12343B;

            font-size: 19px;
            font-weight: 900;
        }

        .job-title {
            font-size: 19px;

            font-weight: 800;

            line-height: 1.25;

            color: #111827;
        }

        .company-name {
            margin-top: 4px;

            color: #475569;

            font-size: 14px;
            font-weight: 600;
        }

        .badges {
            display: flex;
            flex-wrap: wrap;
            justify-content: flex-end;

            gap: 5px;
        }

        .badge {
            display: inline-flex;

            border-radius: 999px;

            padding: 6px 9px;

            font-size: 10px;
            font-weight: 800;

            white-space: nowrap;
        }

        .badge-featured {
            background: #fef3c7;
            color: #92400e;
        }

        .badge-active {
            background: #dcfce7;
            color: #166534;
        }

        .job-info {
            display: flex;
            flex-wrap: wrap;

            gap: 7px;

            margin:
                15px
                0
                12px;
        }

        .info {
            background: #f1f5f9;

            border-radius: 9px;

            padding: 7px 9px;

            color: #475569;

            font-size: 12px;
        }

        .job-description {
            color: #475569;

            line-height: 1.5;

            font-size: 14px;

            display: -webkit-box;
            -webkit-line-clamp: 4;
            -webkit-box-orient: vertical;

            overflow: hidden;

            margin-bottom: 12px;
        }

        .job-footer {
            display: flex;

            align-items: center;
            justify-content: space-between;

            gap: 10px;

            padding-top: 13px;

            border-top:
                1px solid #e8edf0;
        }

        .job-date {
            color: #94a3b8;

            font-size: 11px;
        }

        .job-buttons {
            display: flex;
            gap: 7px;
        }

        .job-buttons .btn {
            padding:
                9px
                11px;

            font-size: 12px;
        }

        /* =====================================================
           VACÍO / CARGANDO
        ===================================================== */

        .state {
            background: white;

            border-radius: 17px;

            padding: 30px 20px;

            text-align: center;

            color: #64748b;

            box-shadow:
                0 2px 9px rgba(0,0,0,.06);
        }

        .state-icon {
            font-size: 38px;
            margin-bottom: 10px;
        }

        .state-title {
            color: #334155;

            font-size: 17px;
            font-weight: 800;

            margin-bottom: 5px;
        }

        .state-text {
            line-height: 1.5;
            font-size: 14px;
        }

        .error-state {
            background: #fff1f2;
            color: #b91c1c;
        }

        /* =====================================================
           BOTTOM NAV
        ===================================================== */

        .bottom-nav {
            position: fixed;

            bottom: 0;
            left: 0;
            right: 0;

            z-index: 200;

            background: white;

            border-top:
                1px solid #e5e7eb;

            box-shadow:
                0 -3px 12px rgba(0,0,0,.08);

            padding:
                7px
                6px
                calc(7px + env(safe-area-inset-bottom));
        }

        .bottom-nav-inner {
            width: 100%;
            max-width: 700px;

            margin: auto;

            display: grid;

            grid-template-columns:
                repeat(5,1fr);
        }

        .nav-item {
            text-decoration: none;

            color: #64748b;

            text-align: center;

            font-size: 11px;
            font-weight: 700;

            padding: 6px 2px;

            border-radius: 10px;
        }

        .nav-item .icon {
            display: block;

            font-size: 21px;

            margin-bottom: 2px;
        }

        .nav-item.active {
            color: #12343B;

            background: #eef3f4;
        }

        /* =====================================================
           RESPONSIVE
        ===================================================== */

        @media (min-width: 700px) {

            .container {
                padding:
                    22px
                    20px
                    35px;
            }

            .jobs {
                grid-template-columns:
                    repeat(2,minmax(0,1fr));
            }

            .hero h1 {
                font-size: 30px;
            }
        }

        @media (max-width: 560px) {

            .top-actions .top-btn {
                padding:
                    8px 9px;

                font-size: 11px;
            }

            .filters {
                grid-template-columns: 1fr;
            }

            .job-top {
                flex-direction: column;
            }

            .badges {
                justify-content: flex-start;
            }

            .job-footer {
                align-items: flex-start;
                flex-direction: column;
            }

            .job-buttons {
                width: 100%;
            }

            .job-buttons .btn {
                flex: 1;
            }
        }

    </style>
</head>

<body>

<header class="topbar">

    <div class="topbar-inner">

        <div class="brand">
            GESBASE
            <span>Red Empleo</span>
        </div>

        <div class="top-actions">

            <button
                type="button"
                class="top-btn"
                id="btnMisEmpleos"
            >
                📋 Mis empleos
            </button>

        </div>

    </div>

</header>


<main class="container">

    <section class="hero">

        <h1>
            💼 Encontrá oportunidades
        </h1>

        <p>
            Buscá empleos, conectate con empresas y encontrá nuevas oportunidades laborales.
        </p>

        <div class="hero-actions">

            <button
                type="button"
                class="btn btn-primary"
                id="btnPublicar"
            >
                ➕ Publicar empleo
            </button>

        </div>

    </section>


    <section class="search-card">

        <div class="search-main">

            <input
                type="search"
                id="busqueda"
                placeholder="Buscar puesto, empresa o palabra clave..."
                autocomplete="off"
            >

            <span class="search-icon">
                🔎
            </span>

        </div>


        <div class="filters">

            <select id="filtroProvincia">

                <option value="">
                    Todas las provincias
                </option>

            </select>


            <select id="filtroModalidad">

                <option value="">
                    Todas las modalidades
                </option>

                <option value="Presencial">
                    Presencial
                </option>

                <option value="Remoto">
                    Remoto
                </option>

                <option value="Híbrido">
                    Híbrido
                </option>

            </select>

        </div>

    </section>


    <div class="results-header">

        <div class="results-title">
            Empleos disponibles
        </div>

        <div
            id="cantidadResultados"
            class="results-count"
        >
            0 resultados
        </div>

    </div>


    <div
        id="estado"
        class="state"
    >

        <div class="state-icon">
            ⏳
        </div>

        <div class="state-title">
            Cargando empleos
        </div>

        <div class="state-text">
            Estamos buscando oportunidades para vos.
        </div>

    </div>


    <section
        id="listaEmpleos"
        class="jobs"
    ></section>

</main>


<nav class="bottom-nav">

    <div class="bottom-nav-inner">

        <a
            class="nav-item"
            href="red.html"
        >
            <span class="icon">🏠</span>
            Inicio
        </a>


        <a
            class="nav-item active"
            href="red-empleo.html"
        >
            <span class="icon">💼</span>
            Empleo
        </a>


        <a
            class="nav-item"
            href="red-buscar.html"
        >
            <span class="icon">🔎</span>
            Buscar
        </a>


        <a
            class="nav-item"
            href="conexiones.html"
        >
            <span class="icon">👥</span>
            Conexiones
        </a>


        <a
            class="nav-item"
            href="red-perfil.html"
        >
            <span class="icon">👤</span>
            Perfil
        </a>

    </div>

</nav>


<script type="module">

    import {
        auth,
        db
    } from "./Js/firebase.js";


    import {
        onAuthStateChanged
    } from "https://www.gstatic.com/firebasejs/12.18.0/firebase-auth.js";


    import {
        collection,
        onSnapshot
    } from "https://www.gstatic.com/firebasejs/12.18.0/firebase-firestore.js";


    /*
     * =========================================================
     * ELEMENTOS
     * =========================================================
     */

    const busqueda =
        document.getElementById("busqueda");

    const filtroProvincia =
        document.getElementById("filtroProvincia");

    const filtroModalidad =
        document.getElementById("filtroModalidad");

    const listaEmpleos =
        document.getElementById("listaEmpleos");

    const estado =
        document.getElementById("estado");

    const cantidadResultados =
        document.getElementById("cantidadResultados");

    const btnPublicar =
        document.getElementById("btnPublicar");

    const btnMisEmpleos =
        document.getElementById("btnMisEmpleos");


    /*
     * =========================================================
     * VARIABLES
     * =========================================================
     */

    let usuarioActual = null;

    let todosLosEmpleos = [];

    let unsubscribe = null;


    /*
     * =========================================================
     * AUTENTICACIÓN
     * =========================================================
     */

    onAuthStateChanged(
        auth,
        usuario => {

            if (!usuario) {

                window.location.href =
                    "red-login.html";

                return;
            }

            usuarioActual =
                usuario;

            cargarEmpleos();
        }
    );


    /*
     * =========================================================
     * CARGAR EMPLEOS
     * =========================================================
     */

    function cargarEmpleos() {

        if (!usuarioActual) {
            return;
        }


        if (unsubscribe) {
            unsubscribe();
        }


        unsubscribe =
            onSnapshot(

                collection(
                    db,
                    "empleos"
                ),

                snapshot => {

                    todosLosEmpleos =
                        snapshot.docs
                            .map(documento => {

                                return {
                                    id:
                                        documento.id,

                                    ...documento.data()
                                };

                            })
                            .filter(
                                empleo =>
                                    empleo.estado !==
                                    "eliminado"
                            );


                    ordenarEmpleos();

                    cargarProvincias();

                    aplicarFiltros();

                },

                error => {

                    console.error(
                        "Error cargando empleos:",
                        error
                    );


                    estado.className =
                        "state error-state";


                    estado.innerHTML = "";


                    const icono =
                        document.createElement("div");

                    icono.className =
                        "state-icon";

                    icono.textContent =
                        "⚠️";


                    const titulo =
                        document.createElement("div");

                    titulo.className =
                        "state-title";

                    titulo.textContent =
                        "No se pudieron cargar los empleos";


                    const texto =
                        document.createElement("div");

                    texto.className =
                        "state-text";

                    texto.textContent =
                        "Revisá tu conexión e intentá nuevamente.";


                    estado.appendChild(
                        icono
                    );

                    estado.appendChild(
                        titulo
                    );

                    estado.appendChild(
                        texto
                    );

                }
            );
    }


    /*
     * =========================================================
     * ORDENAR
     * =========================================================
     */

    function ordenarEmpleos() {

        todosLosEmpleos.sort(
            (a,b) => {

                /*
                 * Primero destacados.
                 */

                if (
                    a.tipo === "destacado" &&
                    b.tipo !== "destacado"
                ) {
                    return -1;
                }


                if (
                    a.tipo !== "destacado" &&
                    b.tipo === "destacado"
                ) {
                    return 1;
                }


                /*
                 * Después por fecha.
                 */

                return
                    obtenerTimestamp(b)
                    -
                    obtenerTimestamp(a);
            }
        );
    }


    /*
     * =========================================================
     * TIMESTAMP
     * =========================================================
     */

    function obtenerTimestamp(
        empleo
    ) {

        if (
            typeof empleo.fechaCliente ===
            "number"
        ) {

            return empleo.fechaCliente;
        }


        if (
            empleo.fecha &&
            typeof empleo.fecha.toMillis ===
            "function"
        ) {

            return empleo.fecha.toMillis();
        }


        if (
            empleo.fecha &&
            typeof empleo.fecha.seconds ===
            "number"
        ) {

            return empleo.fecha.seconds * 1000;
        }


        return 0;
    }


    /*
     * =========================================================
     * PROVINCIAS
     * =========================================================
     */

    function cargarProvincias() {

        const provincias =
            [
                ...new Set(
                    todosLosEmpleos
                        .map(
                            empleo =>
                                String(
                                    empleo.provincia ||
                                    ""
                                ).trim()
                        )
                        .filter(Boolean)
                )
            ]
            .sort(
                (a,b) =>
                    a.localeCompare(
                        b,
                        "es"
                    )
            );


        const valorActual =
            filtroProvincia.value;


        filtroProvincia.innerHTML =
            "";


        const todas =
            document.createElement("option");

        todas.value =
            "";

        todas.textContent =
            "Todas las provincias";

        filtroProvincia.appendChild(
            todas
        );


        provincias.forEach(
            provincia => {

                const option =
                    document.createElement("option");

                option.value =
                    provincia;

                option.textContent =
                    provincia;

                filtroProvincia.appendChild(
                    option
                );
            }
        );


        if (
            provincias.includes(
                valorActual
            )
        ) {

            filtroProvincia.value =
                valorActual;
        }
    }


    /*
     * =========================================================
     * FILTROS
     * =========================================================
     */

    function aplicarFiltros() {

        const texto =
            busqueda.value
                .trim()
                .toLowerCase();


        const provincia =
            filtroProvincia.value
                .trim()
                .toLowerCase();


        const modalidad =
            filtroModalidad.value
                .trim()
                .toLowerCase();


        const filtrados =
            todosLosEmpleos.filter(
                empleo => {

                    /*
                     * Solamente mostramos activos
                     * en el buscador público.
                     */

                    if (
                        empleo.estado !==
                        "activo"
                    ) {

                        return false;
                    }


                    const textoCompleto =
                        [
                            empleo.puesto,
                            empleo.empresa,
                            empleo.descripcion,
                            empleo.ciudad,
                            empleo.provincia,
                            empleo.modalidad
                        ]
                        .filter(Boolean)
                        .join(" ")
                        .toLowerCase();


                    if (
                        texto &&
                        !textoCompleto.includes(
                            texto
                        )
                    ) {

                        return false;
                    }


                    if (
                        provincia &&
                        String(
                            empleo.provincia ||
                            ""
                        )
                        .toLowerCase() !==
                        provincia
                    ) {

                        return false;
                    }


                    if (
                        modalidad &&
                        String(
                            empleo.modalidad ||
                            ""
                        )
                        .toLowerCase() !==
                        modalidad
                    ) {

                        return false;
                    }


                    return true;
                }
            );


        cantidadResultados.textContent =
            filtrados.length === 1
                ? "1 resultado"
                : filtrados.length +
                  " resultados";


        renderizarEmpleos(
            filtrados
        );
    }


    /*
     * =========================================================
     * RENDERIZAR EMPLEOS
     * =========================================================
     */

    function renderizarEmpleos(
        empleos
    ) {

        listaEmpleos.innerHTML =
            "";


        if (
            empleos.length === 0
        ) {

            estado.style.display =
                "block";

            estado.className =
                "state";

            estado.innerHTML =
                "";


            const icono =
                document.createElement("div");

            icono.className =
                "state-icon";

            icono.textContent =
                "🔎";


            const titulo =
                document.createElement("div");

            titulo.className =
                "state-title";

            titulo.textContent =
                "No encontramos empleos";


            const texto =
                document.createElement("div");

            texto.className =
                "state-text";

            texto.textContent =
                "Probá con otra búsqueda o cambiá los filtros.";


            estado.appendChild(
                icono
            );

            estado.appendChild(
                titulo
            );

            estado.appendChild(
                texto
            );

            return;
        }


        estado.style.display =
            "none";


        empleos.forEach(
            empleo => {

                const card =
                    document.createElement("article");

                card.className =
                    "job-card";


                const destacado =
                    empleo.tipo ===
                    "destacado";


                if (destacado) {

                    card.classList.add(
                        "featured"
                    );


                    const bar =
                        document.createElement("div");

                    bar.className =
                        "featured-bar";

                    card.appendChild(
                        bar
                    );
                }


                /*
                 * TOP
                 */

                const top =
                    document.createElement("div");

                top.className =
                    "job-top";


                const companyWrap =
                    document.createElement("div");

                companyWrap.className =
                    "company-wrap";


                const avatar =
                    document.createElement("div");

                avatar.className =
                    "company-avatar";


                const nombreEmpresa =
                    String(
                        empleo.empresa ||
                        "Empresa"
                    ).trim();


                avatar.textContent =
                    obtenerInicial(
                        nombreEmpresa
                    );


                const textos =
                    document.createElement("div");


                const titulo =
                    document.createElement("div");

                titulo.className =
                    "job-title";

                titulo.textContent =
                    empleo.puesto ||
                    "Puesto disponible";


                const empresa =
                    document.createElement("div");

                empresa.className =
                    "company-name";

                empresa.textContent =
                    nombreEmpresa;


                textos.appendChild(
                    titulo
                );

                textos.appendChild(
                    empresa
                );


                companyWrap.appendChild(
                    avatar
                );

                companyWrap.appendChild(
                    textos
                );


                const badges =
                    document.createElement("div");

                badges.className =
                    "badges";


                if (destacado) {

                    const badge =
                        document.createElement("span");

                    badge.className =
                        "badge badge-featured";

                    badge.textContent =
                        "⭐ Destacado";

                    badges.appendChild(
                        badge
                    );
                }


                const badgeActivo =
                    document.createElement("span");

                badgeActivo.className =
                    "badge badge-active";

                badgeActivo.textContent =
                    "● Activo";

                badges.appendChild(
                    badgeActivo
                );


                top.appendChild(
                    companyWrap
                );

                top.appendChild(
                    badges
                );


                card.appendChild(
                    top
                );


                /*
                 * INFO
                 */

                const info =
                    document.createElement("div");

                info.className =
                    "job-info";


                agregarInfo(
                    info,
                    "📍",
                    [
                        empleo.ciudad,
                        empleo.provincia
                    ]
                    .filter(Boolean)
                    .join(", ")
                );


                agregarInfo(
                    info,
                    "💼",
                    empleo.modalidad
                );


                if (
                    empleo.sueldo
                ) {

                    agregarInfo(
                        info,
                        "💰",
                        empleo.sueldo
                    );
                }


                card.appendChild(
                    info
                );


                /*
                 * DESCRIPCIÓN
                 */

                if (
                    empleo.descripcion
                ) {

                    const descripcion =
                        document.createElement("div");

                    descripcion.className =
                        "job-description";

                    descripcion.textContent =
                        empleo.descripcion;

                    card.appendChild(
                        descripcion
                    );
                }


                /*
                 * FOOTER
                 */

                const footer =
                    document.createElement("div");

                footer.className =
                    "job-footer";


                const fecha =
                    document.createElement("div");

                fecha.className =
                    "job-date";

                fecha.textContent =
                    "Publicado " +
                    formatearFecha(
                        empleo
                    );


                const botones =
                    document.createElement("div");

                botones.className =
                    "job-buttons";


                const btnVer =
                    document.createElement("button");

                btnVer.type =
                    "button";

                btnVer.className =
                    "btn btn-secondary";

                btnVer.textContent =
                    "Ver empleo";


                btnVer.addEventListener(
                    "click",
                    () => {

                        window.location.href =
                            "ver-empleo.html?id=" +
                            encodeURIComponent(
                                empleo.id
                            );
                    }
                );


                const btnPostular =
                    document.createElement("button");

                btnPostular.type =
                    "button";

                btnPostular.className =
                    "btn btn-primary";

                btnPostular.textContent =
                    "📝 Postularme";


                btnPostular.addEventListener(
                    "click",
                    () => {

                        window.location.href =
                            "ver-empleo.html?id=" +
                            encodeURIComponent(
                                empleo.id
                            );
                    }
                );


                botones.appendChild(
                    btnVer
                );

                botones.appendChild(
                    btnPostular
                );


                footer.appendChild(
                    fecha
                );

                footer.appendChild(
                    botones
                );


                card.appendChild(
                    footer
                );


                listaEmpleos.appendChild(
                    card
                );
            }
        );
    }


    /*
     * =========================================================
     * AGREGAR INFORMACIÓN
     * =========================================================
     */

    function agregarInfo(
        contenedor,
        icono,
        texto
    ) {

        if (!texto) {
            return;
        }


        const elemento =
            document.createElement("span");

        elemento.className =
            "info";

        elemento.textContent =
            icono +
            " " +
            String(texto);


        contenedor.appendChild(
            elemento
        );
    }


    /*
     * =========================================================
     * INICIAL
     * =========================================================
     */

    function obtenerInicial(
        texto
    ) {

        const limpio =
            String(
                texto ||
                "E"
            ).trim();


        if (!limpio) {
            return "E";
        }


        return limpio
            .charAt(0)
            .toUpperCase();
    }


    /*
     * =========================================================
     * FECHA
     * =========================================================
     */

    function formatearFecha(
        empleo
    ) {

        let fechaReal = null;


        if (
            typeof empleo.fechaCliente ===
            "number"
        ) {

            fechaReal =
                new Date(
                    empleo.fechaCliente
                );
        }


        if (
            !fechaReal &&
            empleo.fecha
        ) {

            if (
                typeof empleo.fecha.toDate ===
                "function"
            ) {

                fechaReal =
                    empleo.fecha.toDate();

            } else if (
                typeof empleo.fecha.seconds ===
                "number"
            ) {

                fechaReal =
                    new Date(
                        empleo.fecha.seconds * 1000
                    );
            }
        }


        if (
            !fechaReal ||
            isNaN(
                fechaReal.getTime()
            )
        ) {

            return "recientemente";
        }


        return fechaReal.toLocaleDateString(
            "es-AR",
            {
                day: "2-digit",
                month: "2-digit",
                year: "numeric"
            }
        );
    }


    /*
     * =========================================================
     * EVENTOS
     * =========================================================
     */

    busqueda.addEventListener(
        "input",
        aplicarFiltros
    );


    filtroProvincia.addEventListener(
        "change",
        aplicarFiltros
    );


    filtroModalidad.addEventListener(
        "change",
        aplicarFiltros
    );


    btnPublicar.addEventListener(
        "click",
        () => {

            window.location.href =
                "publicar-empleo.html";
        }
    );


    btnMisEmpleos.addEventListener(
        "click",
        () => {

            window.location.href =
                "mis-empleos.html";
        }
    );

</script>
