<!DOCTYPE html>
<html lang="es-AR">

<head>

<meta charset="UTF-8">

<meta
    name="viewport"
    content="width=device-width, initial-scale=1.0, viewport-fit=cover"
>

<meta
    name="theme-color"
    content="#111827"
>

<meta
    name="description"
    content="Iniciar sesión en Red GESBASE"
>

<title>Iniciar sesión - Red GESBASE</title>

<style>

*{
    box-sizing:border-box;
    margin:0;
    padding:0;
}

html,
body{
    width:100%;
    min-height:100%;
}

body{
    min-height:100vh;
    min-height:100dvh;
    font-family:Arial,Helvetica,sans-serif;
    background:
        radial-gradient(
            circle at top right,
            rgba(37,99,235,.18),
            transparent 35%
        ),
        linear-gradient(
            135deg,
            #0f172a,
            #111827 55%,
            #1e3a8a
        );
    display:flex;
    align-items:center;
    justify-content:center;
    padding:20px;
    color:#111827;
    overflow-x:hidden;
}

.login-container{
    width:100%;
    max-width:440px;
}

/* =========================================
   LOGO
========================================= */

.logo-area{
    text-align:center;
    color:#fff;
    margin-bottom:22px;
}

.logo{
    display:inline-flex;
    align-items:center;
    gap:10px;
}

.logo-icon{
    width:48px;
    height:48px;
    border-radius:13px;
    background:#2563eb;
    display:flex;
    align-items:center;
    justify-content:center;
    font-size:20px;
    font-weight:800;
    box-shadow:0 10px 30px rgba(37,99,235,.35);
}

.logo-text{
    font-size:23px;
    font-weight:800;
}

.logo-text span{
    color:#60a5fa;
}

/* =========================================
   CARD
========================================= */

.login-card{
    width:100%;
    background:#fff;
    border-radius:20px;
    padding:30px;
    box-shadow:
        0 25px 70px rgba(0,0,0,.30);
}

.login-header{
    text-align:center;
    margin-bottom:24px;
}

.login-header h1{
    font-size:25px;
    margin-bottom:8px;
}

.login-header p{
    color:#6b7280;
    font-size:14px;
    line-height:1.5;
}

/* =========================================
   FORM
========================================= */

.form-group{
    margin-bottom:16px;
}

label{
    display:block;
    margin-bottom:7px;
    font-size:13px;
    font-weight:700;
    color:#374151;
}

.input-wrap{
    position:relative;
}

.input-icon{
    position:absolute;
    left:13px;
    top:50%;
    transform:translateY(-50%);
    color:#6b7280;
    pointer-events:none;
}

input{
    width:100%;
    height:48px;
    border:1px solid #d1d5db;
    border-radius:10px;
    outline:none;
    padding:0 13px 0 40px;
    font-size:14px;
    color:#111827;
    background:#fff;
}

input:focus{
    border-color:#2563eb;
    box-shadow:
        0 0 0 3px rgba(37,99,235,.10);
}

input.error{
    border-color:#dc2626;
}

.password-toggle{
    position:absolute;
    right:7px;
    top:50%;
    transform:translateY(-50%);
    width:38px;
    height:38px;
    border:0;
    background:transparent;
    color:#6b7280;
    border-radius:8px;
}

.password-toggle:hover{
    background:#f3f4f6;
}

/* =========================================
   BUTTON
========================================= */

.login-button{
    width:100%;
    min-height:50px;
    border:0;
    border-radius:10px;
    background:#2563eb;
    color:#fff;
    font-size:15px;
    font-weight:700;
    cursor:pointer;
    transition:.2s;
    margin-top:4px;
}

.login-button:hover{
    background:#1d4ed8;
}

.login-button:disabled{
    opacity:.65;
    cursor:not-allowed;
}

/* =========================================
   LINKS
========================================= */

.forgot{
    text-align:right;
    margin-top:-7px;
    margin-bottom:18px;
}

.forgot button{
    border:0;
    background:transparent;
    color:#2563eb;
    font-size:12px;
    cursor:pointer;
}

.forgot button:hover{
    text-decoration:underline;
}

.divider{
    display:flex;
    align-items:center;
    gap:10px;
    margin:22px 0;
    color:#9ca3af;
    font-size:12px;
}

.divider::before,
.divider::after{
    content:"";
    flex:1;
    height:1px;
    background:#e5e7eb;
}

.register-link{
    text-align:center;
    font-size:13px;
    color:#6b7280;
}

.register-link a{
    color:#2563eb;
    font-weight:700;
    text-decoration:none;
}

.register-link a:hover{
    text-decoration:underline;
}

.back-link{
    display:block;
    text-align:center;
    margin-top:17px;
    color:#6b7280;
    text-decoration:none;
    font-size:12px;
}

.back-link:hover{
    color:#2563eb;
}

/* =========================================
   MESSAGE
========================================= */

.message{
    display:none;
    padding:12px 13px;
    border-radius:9px;
    margin-bottom:15px;
    font-size:13px;
    line-height:1.45;
}

.message.show{
    display:block;
}

.message.error{
    background:#fef2f2;
    border:1px solid #fecaca;
    color:#991b1b;
}

.message.success{
    background:#f0fdf4;
    border:1px solid #bbf7d0;
    color:#166534;
}

.message.info{
    background:#eff6ff;
    border:1px solid #bfdbfe;
    color:#1e40af;
}

/* =========================================
   FOOTER
========================================= */

.footer{
    text-align:center;
    color:#9ca3af;
    font-size:10px;
    margin-top:18px;
}

/* =========================================
   MOBILE
========================================= */

@media(max-width:480px){

    body{
        padding:14px;
    }

    .login-card{
        padding:23px 18px;
        border-radius:16px;
    }

    .logo-text{
        font-size:21px;
    }

    .logo-icon{
        width:43px;
        height:43px;
    }

    .login-header h1{
        font-size:22px;
    }

}

</style>

</head>

<body>

<div class="login-container">


    <!-- LOGO -->

    <div class="logo-area">

        <div class="logo">

            <div class="logo-icon">
                RG
            </div>

            <div class="logo-text">
                Red <span>GESBASE</span>
            </div>

        </div>

    </div>


    <!-- CARD -->

    <main class="login-card">

        <div class="login-header">

            <h1>
                Iniciar sesión
            </h1>

            <p>
                Entrá a tu cuenta de Red GESBASE
                para continuar.
            </p>

        </div>


        <!-- MENSAJE -->

        <div
            id="message"
            class="message"
        ></div>


        <!-- FORMULARIO -->

        <form id="loginForm">


            <!-- EMAIL -->

            <div class="form-group">

                <label for="email">
                    Email
                </label>

                <div class="input-wrap">

                    <span class="input-icon">
                        ✉️
                    </span>

                    <input
                        id="email"
                        type="email"
                        placeholder="tu@email.com"
                        autocomplete="email"
                        required
                    >

                </div>

            </div>


            <!-- CONTRASEÑA -->

            <div class="form-group">

                <label for="password">
                    Contraseña
                </label>

                <div class="input-wrap">

                    <span class="input-icon">
                        🔒
                    </span>

                    <input
                        id="password"
                        type="password"
                        placeholder="Tu contraseña"
                        autocomplete="current-password"
                        required
                    >

                    <button
                        type="button"
                        class="password-toggle"
                        id="togglePassword"
                        aria-label="Mostrar contraseña"
                    >
                        👁️
                    </button>

                </div>

            </div>


            <!-- RECUPERAR -->

            <div class="forgot">

                <button
                    type="button"
                    id="forgotPassword"
                >
                    ¿Olvidaste tu contraseña?
                </button>

            </div>


            <!-- ENTRAR -->

            <button
                type="submit"
                class="login-button"
                id="loginButton"
            >
                Iniciar sesión
            </button>

        </form>


        <!-- DIVISOR -->

        <div class="divider">
            RED GESBASE
        </div>


        <!-- REGISTRO -->

        <div class="register-link">

            ¿Todavía no tenés una cuenta?

            <a href="red-registro.html">
                Crear cuenta
            </a>

        </div>


        <!-- VOLVER -->

        <a
            href="red.html"
            class="back-link"
        >
            ← Volver a Red GESBASE
        </a>

    </main>


    <div class="footer">

        Red GESBASE · Comunidad profesional y empresarial

    </div>

</div>


<script type="module">

/* =========================================
   FIREBASE
========================================= */

import {
    auth
} from "./Js/firebase.js";

import {
    signInWithEmailAndPassword,
    onAuthStateChanged,
    sendPasswordResetEmail
} from "https://www.gstatic.com/firebasejs/12.18.0/firebase-auth.js";


/* =========================================
   ELEMENTOS
========================================= */

const form =
    document.getElementById("loginForm");

const emailInput =
    document.getElementById("email");

const passwordInput =
    document.getElementById("password");

const loginButton =
    document.getElementById("loginButton");

const message =
    document.getElementById("message");

const togglePassword =
    document.getElementById("togglePassword");

const forgotPassword =
    document.getElementById("forgotPassword");


/* =========================================
   MENSAJES
========================================= */

function mostrarMensaje(
    texto,
    tipo = "error"
){

    message.textContent = texto;

    message.className =
        `message show ${tipo}`;

}


function ocultarMensaje(){

    message.textContent = "";

    message.className =
        "message";

}


/* =========================================
   ERRORES FIREBASE
========================================= */

function mensajeError(error){

    switch(error.code){

        case "auth/invalid-email":

            return "El email no tiene un formato válido.";

        case "auth/user-not-found":

            return "No encontramos una cuenta con ese email.";

        case "auth/wrong-password":

            return "La contraseña es incorrecta.";

        case "auth/invalid-credential":

            return "El email o la contraseña son incorrectos.";

        case "auth/too-many-requests":

            return "Demasiados intentos. Esperá unos minutos y probá nuevamente.";

        case "auth/user-disabled":

            return "Esta cuenta se encuentra deshabilitada.";

        case "auth/network-request-failed":

            return "No se pudo conectar con el servidor. Revisá tu conexión.";

        default:

            console.error(
                "Error Firebase:",
                error
            );

            return "No se pudo iniciar sesión. Intentá nuevamente.";

    }

}


/* =========================================
   MOSTRAR / OCULTAR CONTRASEÑA
========================================= */

togglePassword.addEventListener(
    "click",
    () => {

        const visible =
            passwordInput.type === "text";

        passwordInput.type =
            visible ? "password" : "text";

        togglePassword.textContent =
            visible ? "👁️" : "🙈";

    }
);


/* =========================================
   LOGIN
========================================= */

form.addEventListener(
    "submit",
    async event => {

        event.preventDefault();

        ocultarMensaje();

        const email =
            emailInput.value.trim();

        const password =
            passwordInput.value;

        if(!email){

            mostrarMensaje(
                "Ingresá tu email."
            );

            emailInput.focus();

            return;

        }

        if(!password){

            mostrarMensaje(
                "Ingresá tu contraseña."
            );

            passwordInput.focus();

            return;

        }


        loginButton.disabled = true;

        loginButton.textContent =
            "Ingresando...";


        try{

            await signInWithEmailAndPassword(
                auth,
                email,
                password
            );


            mostrarMensaje(
                "Inicio de sesión correcto. Entrando...",
                "success"
            );


            /*
             * onAuthStateChanged se encargará
             * de redirigir a red.html.
             */

        }catch(error){

            mostrarMensaje(
                mensajeError(error),
                "error"
            );

            loginButton.disabled = false;

            loginButton.textContent =
                "Iniciar sesión";

        }

    }
);


/* =========================================
   RECUPERAR CONTRASEÑA
========================================= */

forgotPassword.addEventListener(
    "click",
    async () => {

        ocultarMensaje();

        const email =
            emailInput.value.trim();

        if(!email){

            mostrarMensaje(
                "Primero ingresá tu email para poder enviarte el enlace de recuperación.",
                "info"
            );

            emailInput.focus();

            return;

        }


        try{

            await sendPasswordResetEmail(
                auth,
                email
            );

            mostrarMensaje(
                "Si existe una cuenta con ese email, recibirás un enlace para restablecer la contraseña.",
                "success"
            );

        }catch(error){

            console.error(
                "Error recuperación:",
                error
            );

            if(
                error.code ===
                "auth/invalid-email"
            ){

                mostrarMensaje(
                    "El email no tiene un formato válido."
                );

            }else{

                mostrarMensaje(
                    "No se pudo procesar la recuperación. Intentá nuevamente."
                );

            }

        }

    }
);


/* =========================================
   SI YA ESTÁ LOGUEADO
========================================= */

onAuthStateChanged(
    auth,
    user => {

        if(user){

            /*
             * Si ya tiene sesión iniciada,
             * no necesita volver a ingresar.
             */

            window.location.replace(
                "red.html"
            );

        }

    }
);

</script>

</body>

</html>
