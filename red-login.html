<!DOCTYPE html>
<html lang="es-AR">

<head>

<meta charset="UTF-8">

<meta
    name="viewport"
    content="width=device-width, initial-scale=1.0, viewport-fit=cover"
>

<meta
    name="theme-color"
    content="#111827"
>

<meta
    name="description"
    content="Iniciar sesión en Red GESBASE"
>

<title>Iniciar sesión - Red GESBASE</title>

<style>

*{
    box-sizing:border-box;
    margin:0;
    padding:0;
}

html,
body{
    width:100%;
    min-height:100%;
    overflow-x:hidden;
}

body{
    font-family:
        Inter,
        system-ui,
        -apple-system,
        BlinkMacSystemFont,
        "Segoe UI",
        sans-serif;

    background:
        linear-gradient(
            135deg,
            #111827 0%,
            #172033 50%,
            #0f172a 100%
        );

    color:#111827;

    min-height:100vh;
    min-height:100dvh;

    display:flex;
    align-items:center;
    justify-content:center;

    padding:20px;
}

.container{
    width:100%;
    max-width:430px;
}

.logo{
    text-align:center;
    color:white;
    margin-bottom:22px;
}

.logo-icon{
    width:58px;
    height:58px;

    margin:0 auto 12px;

    border-radius:18px;

    display:flex;
    align-items:center;
    justify-content:center;

    background:#ffffff;

    color:#111827;

    font-size:21px;
    font-weight:900;

    box-shadow:
        0 12px 35px rgba(0,0,0,.25);
}

.logo-title{
    font-size:25px;
    font-weight:800;
    letter-spacing:-.5px;
}

.logo-subtitle{
    margin-top:4px;
    font-size:13px;
    opacity:.75;
}

.card{
    width:100%;

    background:#ffffff;

    border-radius:24px;

    padding:28px;

    box-shadow:
        0 25px 60px rgba(0,0,0,.30);
}

h1{
    font-size:25px;
    line-height:1.2;

    margin-bottom:8px;

    color:#111827;
}

.description{
    color:#6b7280;
    font-size:14px;
    line-height:1.5;

    margin-bottom:25px;
}

.field{
    margin-bottom:17px;
}

label{
    display:block;

    font-size:13px;
    font-weight:700;

    color:#374151;

    margin-bottom:7px;
}

.input-wrap{
    position:relative;
}

input{
    width:100%;
    height:50px;

    border:1px solid #d1d5db;

    border-radius:13px;

    padding:0 15px;

    font-size:15px;

    color:#111827;

    outline:none;

    background:#fff;

    transition:
        border-color .2s,
        box-shadow .2s;
}

input:focus{
    border-color:#111827;

    box-shadow:
        0 0 0 3px rgba(17,24,39,.10);
}

.password-input{
    padding-right:50px;
}

.toggle-password{
    position:absolute;

    right:7px;
    top:50%;

    transform:translateY(-50%);

    width:38px;
    height:38px;

    border:0;

    background:transparent;

    border-radius:10px;

    cursor:pointer;

    font-size:18px;
}

.toggle-password:hover{
    background:#f3f4f6;
}

.forgot{
    display:flex;
    justify-content:flex-end;

    margin-top:-5px;
    margin-bottom:20px;
}

.forgot button{
    border:0;
    background:none;

    color:#374151;

    font-size:13px;
    font-weight:600;

    cursor:pointer;
}

.forgot button:hover{
    text-decoration:underline;
}

.login-button{
    width:100%;
    height:52px;

    border:0;
    border-radius:14px;

    background:#111827;
    color:white;

    font-size:15px;
    font-weight:800;

    cursor:pointer;

    transition:
        transform .15s,
        opacity .15s;
}

.login-button:hover{
    transform:translateY(-1px);
}

.login-button:disabled{
    opacity:.65;
    cursor:not-allowed;
    transform:none;
}

.message{
    display:none;

    margin-bottom:18px;

    padding:12px 14px;

    border-radius:12px;

    font-size:13px;
    line-height:1.45;

    font-weight:600;
}

.message.error{
    display:block;

    background:#fef2f2;
    color:#991b1b;

    border:1px solid #fecaca;
}

.message.success{
    display:block;

    background:#f0fdf4;
    color:#166534;

    border:1px solid #bbf7d0;
}

.divider{
    display:flex;
    align-items:center;
    gap:12px;

    margin:25px 0 20px;

    color:#9ca3af;

    font-size:12px;
}

.divider::before,
.divider::after{
    content:"";

    flex:1;

    height:1px;

    background:#e5e7eb;
}

.register{
    text-align:center;

    font-size:14px;

    color:#6b7280;
}

.register a{
    color:#111827;

    font-weight:800;

    text-decoration:none;
}

.register a:hover{
    text-decoration:underline;
}

.back{
    display:block;

    text-align:center;

    margin-top:20px;

    color:rgba(255,255,255,.82);

    font-size:13px;

    text-decoration:none;
}

.back:hover{
    color:white;
    text-decoration:underline;
}

.footer{
    text-align:center;

    margin-top:22px;

    color:rgba(255,255,255,.55);

    font-size:11px;
}

.loading{
    position:fixed;

    inset:0;

    background:rgba(15,23,42,.72);

    backdrop-filter:blur(5px);

    display:none;

    align-items:center;
    justify-content:center;

    z-index:9999;
}

.loading.show{
    display:flex;
}

.loading-box{
    background:white;

    border-radius:18px;

    padding:24px 28px;

    text-align:center;

    box-shadow:0 20px 50px rgba(0,0,0,.3);
}

.spinner{
    width:35px;
    height:35px;

    border:4px solid #e5e7eb;
    border-top-color:#111827;

    border-radius:50%;

    animation:spin .8s linear infinite;

    margin:0 auto 13px;
}

.loading-text{
    font-size:14px;
    font-weight:700;
    color:#111827;
}

@keyframes spin{
    to{
        transform:rotate(360deg);
    }
}

@media(max-width:480px){

    body{
        padding:15px;
    }

    .card{
        padding:23px 19px;
        border-radius:20px;
    }

    .logo{
        margin-bottom:18px;
    }

    .logo-icon{
        width:52px;
        height:52px;
        border-radius:16px;
    }

    .logo-title{
        font-size:23px;
    }

    h1{
        font-size:23px;
    }

}

@media(max-width:360px){

    body{
        padding:10px;
    }

    .card{
        padding:20px 16px;
    }

    .logo-title{
        font-size:21px;
    }

}

</style>

</head>


<body>

<div class="container">

    <div class="logo">

        <div class="logo-icon">
            RG
        </div>

        <div class="logo-title">
            Red GESBASE
        </div>

        <div class="logo-subtitle">
            Comunidad profesional y empresarial
        </div>

    </div>


    <main class="card">

        <h1>
            Iniciar sesión
        </h1>

        <p class="description">
            Entrá a tu cuenta de Red GESBASE para continuar.
        </p>


        <div
            id="message"
            class="message"
        ></div>


        <form id="loginForm">

            <div class="field">

                <label for="email">
                    Email
                </label>

                <input
                    id="email"
                    type="email"
                    autocomplete="email"
                    placeholder="tu@email.com"
                    required
                >

            </div>


            <div class="field">

                <label for="password">
                    Contraseña
                </label>

                <div class="input-wrap">

                    <input
                        id="password"
                        class="password-input"
                        type="password"
                        autocomplete="current-password"
                        placeholder="Tu contraseña"
                        required
                    >

                    <button
                        type="button"
                        id="togglePassword"
                        class="toggle-password"
                        aria-label="Mostrar contraseña"
                    >
                        👁️
                    </button>

                </div>

            </div>


            <div class="forgot">

                <button
                    type="button"
                    id="forgotPassword"
                >
                    ¿Olvidaste tu contraseña?
                </button>

            </div>


            <button
                type="submit"
                id="loginButton"
                class="login-button"
            >
                Iniciar sesión
            </button>

        </form>


        <div class="divider">
            <span>o</span>
        </div>


        <div class="register">

            ¿Todavía no tenés una cuenta?

            <a href="red-registro.html">
                Crear cuenta
            </a>

        </div>

    </main>


    <a
        class="back"
        href="red.html"
    >
        ← Volver a Red GESBASE
    </a>


    <div class="footer">
        Red GESBASE · Comunidad profesional y empresarial
    </div>

</div>


<div
    id="loading"
    class="loading"
>

    <div class="loading-box">

        <div class="spinner"></div>

        <div class="loading-text">
            Iniciando sesión...
        </div>

    </div>

</div>


<script>

const form = document.getElementById("loginForm");
const emailInput = document.getElementById("email");
const passwordInput = document.getElementById("password");
const loginButton = document.getElementById("loginButton");
const message = document.getElementById("message");
const loading = document.getElementById("loading");
const togglePassword = document.getElementById("togglePassword");
const forgotPassword = document.getElementById("forgotPassword");


function mostrarMensaje(texto, tipo = "error"){

    message.textContent = texto;

    message.className = "message " + tipo;

}


function limpiarMensaje(){

    message.textContent = "";

    message.className = "message";

}


function mostrarCarga(mostrar){

    if(mostrar){

        loading.classList.add("show");

    }else{

        loading.classList.remove("show");

    }

}


togglePassword.addEventListener("click", () => {

    const visible = passwordInput.type === "text";

    passwordInput.type = visible
        ? "password"
        : "text";

    togglePassword.textContent = visible
        ? "👁️"
        : "🙈";

    togglePassword.setAttribute(
        "aria-label",
        visible
            ? "Mostrar contraseña"
            : "Ocultar contraseña"
    );

});


</script>


<script type="module">

import {
    auth
} from "./Js/firebase.js";

import {
    signInWithEmailAndPassword,
    sendPasswordResetEmail,
    onAuthStateChanged
} from "https://www.gstatic.com/firebasejs/12.18.0/firebase-auth.js";


const form = document.getElementById("loginForm");
const emailInput = document.getElementById("email");
const passwordInput = document.getElementById("password");
const loginButton = document.getElementById("loginButton");
const forgotPassword = document.getElementById("forgotPassword");


let usuarioYaRedirigido = false;


/*
   Si ya hay una sesión iniciada,
   entrar directamente a Red GESBASE.
*/

onAuthStateChanged(auth, (user) => {

    if(user && !usuarioYaRedirigido){

        usuarioYaRedirigido = true;

        window.location.replace("red.html");

    }

});


/*
   INICIAR SESIÓN
*/

form.addEventListener("submit", async (event) => {

    event.preventDefault();

    limpiarMensaje();

    const email = emailInput.value.trim();
    const password = passwordInput.value;

    if(!email){

        mostrarMensaje(
            "Ingresá tu email."
        );

        emailInput.focus();

        return;

    }

    if(!password){

        mostrarMensaje(
            "Ingresá tu contraseña."
        );

        passwordInput.focus();

        return;

    }


    loginButton.disabled = true;

    loginButton.textContent = "Ingresando...";

    mostrarCarga(true);


    try{

        await signInWithEmailAndPassword(
            auth,
            email,
            password
        );


        mostrarMensaje(
            "Inicio de sesión correcto. Entrando...",
            "success"
        );


        setTimeout(() => {

            window.location.replace("red.html");

        }, 300);


    }catch(error){

        console.error(
            "Error de inicio de sesión:",
            error
        );


        let texto =
            "No se pudo iniciar sesión.";


        switch(error.code){

            case "auth/invalid-credential":
            case "auth/wrong-password":
            case "auth/user-not-found":

                texto =
                    "Email o contraseña incorrectos.";

                break;


            case "auth/invalid-email":

                texto =
                    "El email ingresado no es válido.";

                break;


            case "auth/user-disabled":

                texto =
                    "Esta cuenta fue deshabilitada.";

                break;


            case "auth/too-many-requests":

                texto =
                    "Demasiados intentos. Esperá unos minutos y volvé a intentar.";

                break;


            case "auth/network-request-failed":

                texto =
                    "No hay conexión con Firebase. Revisá tu conexión a Internet.";

                break;


            case "auth/operation-not-allowed":

                texto =
                    "El inicio de sesión por email no está habilitado en Firebase.";

                break;


            default:

                texto =
                    "No se pudo iniciar sesión. Código: " +
                    (error.code || "desconocido");

        }


        mostrarMensaje(texto);

        mostrarCarga(false);

        loginButton.disabled = false;

        loginButton.textContent = "Iniciar sesión";

    }

});


/*
   RECUPERAR CONTRASEÑA
*/

forgotPassword.addEventListener("click", async () => {

    limpiarMensaje();

    const email = emailInput.value.trim();


    if(!email){

        mostrarMensaje(
            "Primero ingresá tu email para recuperar la contraseña."
        );

        emailInput.focus();

        return;

    }


    forgotPassword.disabled = true;

    forgotPassword.textContent = "Enviando...";


    try{

        await sendPasswordResetEmail(
            auth,
            email
        );


        mostrarMensaje(
            "Si el email está registrado, recibirás las instrucciones para recuperar tu contraseña.",
            "success"
        );


    }catch(error){

        console.error(
            "Error al recuperar contraseña:",
            error
        );


        let texto =
            "No se pudo enviar el correo de recuperación.";


        if(error.code === "auth/invalid-email"){

            texto =
                "El email ingresado no es válido.";

        }


        mostrarMensaje(texto);

    }


    forgotPassword.disabled = false;

    forgotPassword.textContent =
        "¿Olvidaste tu contraseña?";

});


</script>

</body>

</html>
