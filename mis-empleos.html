<script type="module">

import {
    auth,
    db
} from "./Js/firebase.js";


import {
    onAuthStateChanged
} from "https://www.gstatic.com/firebasejs/12.18.0/firebase-auth.js";


import {
    collection,
    query,
    where,
    onSnapshot,
    getDocs,
    doc,
    getDoc,
    updateDoc,
    deleteDoc,
    addDoc,
    serverTimestamp
} from "https://www.gstatic.com/firebasejs/12.18.0/firebase-firestore.js";


/* =========================================================
   ELEMENTOS
========================================================= */

const listaEmpleos =
    document.getElementById("listaEmpleos");

const estado =
    document.getElementById("estado");

const totalEmpleos =
    document.getElementById("totalEmpleos");

const empleosActivos =
    document.getElementById("empleosActivos");

const totalPostulaciones =
    document.getElementById("totalPostulaciones");

const postulacionesPendientes =
    document.getElementById("postulacionesPendientes");

const buscar =
    document.getElementById("buscar");

const filtroEstado =
    document.getElementById("filtroEstado");

const btnPublicar =
    document.getElementById("btnPublicar");

const btnActualizar =
    document.getElementById("btnActualizar");

const btnVolver =
    document.getElementById("btnVolver");

const modal =
    document.getElementById("modalPostulaciones");

const modalTitulo =
    document.getElementById("modalTitulo");

const modalContenido =
    document.getElementById("modalContenido");

const btnCerrarModal =
    document.getElementById("btnCerrarModal");

const toast =
    document.getElementById("toast");


/* =========================================================
   VARIABLES
========================================================= */

let usuarioActual = null;
let empleosActuales = [];
let unsubscribeEmpleos = null;


/* =========================================================
   TOAST
========================================================= */

function mostrarToast(texto){

    toast.textContent =
        texto;

    toast.classList.add("show");

    clearTimeout(
        mostrarToast.timer
    );

    mostrarToast.timer =
        setTimeout(
            () => {
                toast.classList.remove("show");
            },
            2800
        );
}


/* =========================================================
   FECHAS
========================================================= */

function obtenerFecha(valor){

    if(!valor){
        return null;
    }

    try{

        if(
            typeof valor.toDate ===
            "function"
        ){
            return valor.toDate();
        }

        if(
            typeof valor === "object" &&
            typeof valor.seconds === "number"
        ){
            return new Date(
                valor.seconds * 1000
            );
        }

        if(
            valor instanceof Date
        ){
            return valor;
        }

        if(
            typeof valor === "number"
        ){
            return new Date(valor);
        }

        const fecha =
            new Date(valor);

        if(
            !isNaN(
                fecha.getTime()
            )
        ){
            return fecha;
        }

    }catch(error){

        console.warn(
            "Error convirtiendo fecha:",
            error
        );
    }

    return null;
}


function obtenerFechaEmpleo(empleo){

    if(
        empleo.fechaCliente
    ){
        return Number(
            empleo.fechaCliente
        ) || 0;
    }

    const fecha =
        obtenerFecha(
            empleo.fecha
        );

    if(fecha){
        return fecha.getTime();
    }

    return 0;
}


function formatearFecha(empleo){

    const timestamp =
        obtenerFechaEmpleo(
            empleo
        );

    if(!timestamp){
        return "Fecha no disponible";
    }

    const fecha =
        new Date(timestamp);

    if(
        isNaN(
            fecha.getTime()
        )
    ){
        return "Fecha no disponible";
    }

    return fecha.toLocaleDateString(
        "es-AR",
        {
            day:"2-digit",
            month:"2-digit",
            year:"numeric"
        }
    );
}


/* =========================================================
   AUTENTICACIÓN
========================================================= */

onAuthStateChanged(
    auth,
    usuario => {

        if(!usuario){

            window.location.href =
                "red-login.html";

            return;
        }

        usuarioActual =
            usuario;

        cargarEmpleos();

    }
);


/* =========================================================
   CARGAR EMPLEOS
========================================================= */

function cargarEmpleos(){

    if(
        !usuarioActual
    ){
        return;
    }

    if(
        unsubscribeEmpleos
    ){
        unsubscribeEmpleos();
    }

    estado.style.display =
        "block";

    estado.className =
        "message";

    estado.textContent =
        "Cargando tus empleos...";

    /*
     * Compatibilidad con tu estructura actual:
     *
     * La publicación original usa:
     * uid
     *
     * Por eso mantenemos esta consulta.
     */

    const consulta =
        query(
            collection(
                db,
                "empleos"
            ),
            where(
                "uid",
                "==",
                usuarioActual.uid
            )
        );


    unsubscribeEmpleos =
        onSnapshot(
            consulta,

            snapshot => {

                empleosActuales =
                    snapshot.docs.map(
                        documento => ({
                            id:documento.id,
                            ...documento.data()
                        })
                    );


                empleosActuales.sort(
                    (a,b) =>
                        obtenerFechaEmpleo(b)
                        -
                        obtenerFechaEmpleo(a)
                );


                actualizarEstadisticas();

                renderizarEmpleos();

                cargarEstadisticasPostulaciones();

            },

            error => {

                console.error(
                    "Error cargando empleos:",
                    error
                );

                estado.style.display =
                    "block";

                estado.className =
                    "message error";

                estado.textContent =
                    "No se pudieron cargar tus empleos.";

            }
        );
}


/* =========================================================
   ESTADÍSTICAS
========================================================= */

function actualizarEstadisticas(){

    totalEmpleos.textContent =
        empleosActuales.length;

    empleosActivos.textContent =
        empleosActuales.filter(
            empleo =>
                empleo.estado ===
                "activo"
        ).length;
}


/* =========================================================
   FILTROS
========================================================= */

function obtenerEmpleosFiltrados(){

    const texto =
        buscar.value
            .trim()
            .toLowerCase();

    const filtro =
        filtroEstado.value;


    return empleosActuales.filter(
        empleo => {

            const contenido = [

                empleo.puesto,

                empleo.empresa,

                empleo.ciudad,

                empleo.provincia,

                empleo.modalidad,

                empleo.descripcion

            ]
            .filter(Boolean)
            .join(" ")
            .toLowerCase();


            const coincideTexto =
                !texto ||
                contenido.includes(
                    texto
                );


            const coincideEstado =
                filtro === "todos" ||
                empleo.estado === filtro;


            return (
                coincideTexto &&
                coincideEstado
            );
        }
    );
}


buscar.addEventListener(
    "input",
    renderizarEmpleos
);


filtroEstado.addEventListener(
    "change",
    renderizarEmpleos
);


/* =========================================================
   RENDERIZAR EMPLEOS
========================================================= */

function renderizarEmpleos(){

    listaEmpleos.innerHTML = "";

    const empleos =
        obtenerEmpleosFiltrados();


    if(
        empleosActuales.length === 0
    ){

        estado.style.display =
            "block";

        estado.className =
            "message";

        estado.textContent =
            "Todavía no publicaste ningún empleo.";

        return;
    }


    if(
        empleos.length === 0
    ){

        estado.style.display =
            "block";

        estado.className =
            "message";

        estado.textContent =
            "No encontramos empleos con ese filtro.";

        return;
    }


    estado.style.display =
        "none";

/* =========================================================
   AGREGAR INFO
========================================================= */

function agregarInfo(
    contenedor,
    icono,
    texto
){

    if(!texto){
        return;
    }

    const elemento =
        document.createElement(
            "span"
        );

    elemento.className =
        "info-item";

    elemento.textContent =
        icono +
        " " +
        String(texto);

    contenedor.appendChild(
        elemento
    );
}


/* =========================================================
   VERIFICAR PROPIETARIO
========================================================= */

function esPropietario(
    empleo
){

    if(
        !usuarioActual ||
        !empleo
    ){
        return false;
    }

    return (
        empleo.uid ===
        usuarioActual.uid
    );
}


/* =========================================================
   CAMBIAR ESTADO
========================================================= */

async function cambiarEstado(
    empleo
){

    if(
        !esPropietario(
            empleo
        )
    ){

        alert(
            "No tenés permiso para modificar este empleo."
        );

        return;
    }


    const nuevoEstado =
        empleo.estado ===
        "activo"
            ? "inactivo"
            : "activo";


    try{

        await updateDoc(
            doc(
                db,
                "empleos",
                empleo.id
            ),
            {
                estado:
                    nuevoEstado,

                fechaActualizacion:
                    serverTimestamp()
            }
        );


        mostrarToast(
            nuevoEstado ===
            "activo"
                ? "Empleo activado."
                : "Empleo pausado."
        );


    }catch(error){

        console.error(
            "Error cambiando estado:",
            error
        );

        alert(
            "No se pudo cambiar el estado del empleo."
        );
    }
}


/* =========================================================
   BAJA LÓGICA
========================================================= */

async function eliminarEmpleo(
    empleo
){

    if(
        !esPropietario(
            empleo
        )
    ){

        alert(
            "No tenés permiso para eliminar este empleo."
        );

        return;
    }


    const confirmado =
        confirm(
            "¿Querés dar de baja esta publicación?\n\n" +
            "La oferta dejará de mostrarse entre los empleos activos."
        );


    if(!confirmado){
        return;
    }


    try{

        await updateDoc(
            doc(
                db,
                "empleos",
                empleo.id
            ),
            {
                estado:
                    "inactivo",

                baja:
                    true,

                fechaBaja:
                    serverTimestamp(),

                fechaActualizacion:
                    serverTimestamp()
            }
        );


        mostrarToast(
            "La publicación fue dada de baja."
        );


    }catch(error){

        console.error(
            "Error dando de baja:",
            error
        );

        alert(
            "No se pudo dar de baja la publicación."
        );
    }
}


/* =========================================================
   POSTULACIONES
========================================================= */

async function obtenerPostulaciones(
    empleoId
){

    const consulta =
        query(
            collection(
                db,
                "postulaciones"
            ),
            where(
                "empleoId",
                "==",
                empleoId
            )
        );


    const snapshot =
        await getDocs(
            consulta
        );


    return snapshot.docs.map(
        documento => ({
            id:
                documento.id,

            ...documento.data()
        })
    );
}


/* =========================================================
   ESTADÍSTICAS POSTULACIONES
========================================================= */

async function cargarEstadisticasPostulaciones(){

    if(
        empleosActuales.length ===
        0
    ){

        totalPostulaciones.textContent =
            "0";

        postulacionesPendientes.textContent =
            "0";

        return;
    }


    try{

        let total = 0;
        let pendientes = 0;


        for(
            const empleo
            of empleosActuales
        ){

            const postulaciones =
                await obtenerPostulaciones(
                    empleo.id
                );


            total +=
                postulaciones.length;


            pendientes +=
                postulaciones.filter(
                    postulacion =>
                        (
                            postulacion.estado ||
                            "pendiente"
                        ) ===
                        "pendiente"
                ).length;


            const contador =
                document.getElementById(
                    "postulaciones-" +
                    empleo.id
                );


            if(contador){

                contador.textContent =
                    "👥 Postulaciones: " +
                    postulaciones.length;
            }
        }


        totalPostulaciones.textContent =
            total;

        postulacionesPendientes.textContent =
            pendientes;


    }catch(error){

        console.error(
            "Error cargando estadísticas:",
            error
        );

        totalPostulaciones.textContent =
            "—";

        postulacionesPendientes.textContent =
            "—";
    }
}


/* =========================================================
   ABRIR POSTULACIONES
========================================================= */

async function abrirPostulaciones(
    empleo
){

    if(
        !esPropietario(
            empleo
        )
    ){

        alert(
            "No tenés permiso para ver estas postulaciones."
        );

        return;
    }


    modalTitulo.textContent =
        "Postulaciones: " +
        (
            empleo.puesto ||
            "Empleo"
        );


    modalContenido.textContent =
        "Cargando postulaciones...";


    modal.classList.add(
        "show"
    );


    try{

        const postulaciones =
            await obtenerPostulaciones(
                empleo.id
            );


        postulaciones.sort(
            (a,b) =>
                obtenerFechaPostulacion(b)
                -
                obtenerFechaPostulacion(a)
        );


        renderizarPostulaciones(
            postulaciones
        );


    }catch(error){

        console.error(
            "Error cargando postulaciones:",
            error
        );

        modalContenido.innerHTML =
            '<div class="empty">No se pudieron cargar las postulaciones.</div>';
    }
}


/* =========================================================
   FECHA POSTULACIÓN
========================================================= */

function obtenerFechaPostulacion(
    postulacion
){

    if(
        postulacion.fechaCliente
    ){

        return Number(
            postulacion.fechaCliente
        ) || 0;
    }


    const fecha =
        obtenerFecha(
            postulacion.fecha
        );


    return fecha
        ? fecha.getTime()
        : 0;
}


/* =========================================================
   RENDERIZAR POSTULACIONES
========================================================= */

function renderizarPostulaciones(
    postulaciones
){

    modalContenido.innerHTML =
        "";


    if(
        postulaciones.length ===
        0
    ){

        const vacio =
            document.createElement(
                "div"
            );

        vacio.className =
            "empty";

        vacio.textContent =
            "Todavía no recibiste postulaciones para este empleo.";

            vacio
        );

        return;
    }


    const lista =
        document.createElement(
            "div"
        );

    lista.className =
        "applicant-list";


    postulaciones.forEach(
        postulacion => {

            const item =
                document.createElement(
                    "article"
                );

            item.className =
                "applicant";


            const header =
                document.createElement(
                    "div"
                );

            header.className =
                "applicant-header";


            const izquierda =
                document.createElement(
                    "div"
                );


            const nombre =
                document.createElement(
                    "div"
                );

            nombre.className =
                "applicant-name";

            nombre.textContent =
                obtenerNombrePostulante(
                    postulacion
                );


            izquierda.appendChild(
                nombre
            );


            const datos =
                document.createElement(
                    "div"
                );

            datos.className =
                "applicant-data";


            datos.textContent =
                "📧 " +
                (
                    postulacion.postulanteEmail ||
                    "Email no disponible"
                );


            if(
                postulacion.telefono
            ){

                datos.textContent +=
                    "\n📱 " +
                    postulacion.telefono;
            }


            const fecha =
                obtenerFecha(
                    postulacion.fecha
                );


            if(fecha){

                datos.textContent +=
                    "\n📅 " +
                    fecha.toLocaleDateString(
                        "es-AR"
                    );
            }


            izquierda.appendChild(
                datos
            );


            const estadoActual =
                postulacion.estado ||
                "pendiente";


            const badge =
                document.createElement(
                    "span"
                );

            badge.className =
                "badge " +
                obtenerClaseEstadoPostulacion(
                    estadoActual
                );

            badge.textContent =
                obtenerTextoEstadoPostulacion(
                    estadoActual
                );


            header.appendChild(
                izquierda
            );

            header.appendChild(
                badge
            );


            item.appendChild(
                header
            );


            if(
                postulacion.mensaje
            ){

                const mensaje =
                    document.createElement(
                        "div"
                    );

                mensaje.className =
                    "applicant-message";

                mensaje.textContent =
                    postulacion.mensaje;

                item.appendChild(
                    mensaje
                );
            }


            /* ACCIONES */

            const acciones =
                document.createElement(
                    "div"
                );

            acciones.className =
                "applicant-actions";


            if(
                postulacion.telefono
            ){

                const btnWhatsapp =
                    document.createElement(
                        "button"
                    );

                btnWhatsapp.type =
                    "button";

                btnWhatsapp.className =
                    "btn btn-success";

                btnWhatsapp.textContent =
                    "📱 WhatsApp";

                btnWhatsapp.addEventListener(
                    "click",
                    () => {

                        const numero =
                            String(
                                postulacion.telefono
                            )
                            .replace(
                                /[^0-9]/g,
                                ""
                            );


                        if(!numero){
                            return;
                        }


                        window.open(
                            "https://wa.me/" +
                            numero,
                            "_blank"
                        );
                    }
                );


                acciones.appendChild(
                    btnWhatsapp
                );
            }


            if(
                postulacion.telefono
            ){

                const btnLlamar =
                    document.createElement(
                        "button"
                    );

                btnLlamar.type =
                    "button";

                btnLlamar.className =
                    "btn btn-secondary";

                btnLlamar.textContent =
                    "📞 Llamar";

                btnLlamar.addEventListener(
                    "click",
                    () => {

                        window.location.href =
                            "tel:" +
                            postulacion.telefono;
                    }
                );


                acciones.appendChild(
                    btnLlamar
                );
            }


            if(
                postulacion.postulanteEmail
            ){

                const btnEmail =
                    document.createElement(
                        "button"
                    );

                btnEmail.type =
                    "button";

                btnEmail.className =
                    "btn btn-secondary";

                btnEmail.textContent =
                    "📧 Email";

                btnEmail.addEventListener(
                    "click",
                    () => {

                        window.location.href =
                            "mailto:" +
                            postulacion.postulanteEmail;
                    }
                );


                acciones.appendChild(
                    btnEmail
                );
            }


            /* PERFIL */

            if(
                postulacion.postulanteUid
            ){

                const btnPerfil =
                    document.createElement(
                        "button"
                    );

                btnPerfil.type =
                    "button";

                btnPerfil.className =
                    "btn btn-dark";

                btnPerfil.textContent =
                    "👤 Perfil";

                btnPerfil.addEventListener(
                    "click",
                    () => {

                        window.location.href =
                            "red-perfil.html?uid=" +
                            encodeURIComponent(

                            );
                    }

                acciones.appendChild(

            }


            item.appendChild(
                acciones
            );


            /* ESTADO */

            const selector =
                document.createElement(
                    "select"
                );

            selector.className =
                "status-select";


            const opciones = [
                ["pendiente","⏳ Pendiente"],
                ["en_revision","👀 En revisión"],
                ["aceptado","✅ Aceptado"],
                ["rechazado","❌ Rechazado"]
            ];


            opciones.forEach(
                opcion => {

                    const option =
                        document.createElement(
                            "option"
                        );

                    option.value =
                        opcion[0];

                    option.textContent =
                        opcion[1];

                    if(
                        estadoActual ===
                        opcion[0]
                    ){

                        option.selected =
                            true;
                    }

                    selector.appendChild(
                        option
                    );
                }
            );


            selector.addEventListener(
                "change",
                () =>
                    cambiarEstadoPostulacion(
                        postulacion,
                        selector.value
                    )
            );


            item.appendChild(
                selector
            );


            lista.appendChild(
                item
            );

        }
    );


    modalContenido.appendChild(
        lista
    );
}


/* =========================================================
   NOMBRE POSTULANTE
========================================================= */

function obtenerNombrePostulante(
    postulacion
){

    return (
        postulacion.postulanteNombre ||
        postulacion.nombreCompleto ||
        postulacion.nombre ||
        "Postulante"
    );
}


/* =========================================================
   ESTADO POSTULACIÓN
========================================================= */

function obtenerTextoEstadoPostulacion(
    estado
){

    const estados = {

        pendiente:
            "⏳ Pendiente",

        en_revision:
            "👀 En revisión",

        aceptado:
            "✅ Aceptado",

        rechazado:
            "❌ Rechazado"

    };

    return (
        estados[estado] ||
        "⏳ Pendiente"
    );
}


function obtenerClaseEstadoPostulacion(
    estado
){

    if(
        estado ===
        "aceptado"
    ){

        return "badge-active";
    }


    if(
        estado ===
        "rechazado"
    ){

        return "badge-inactive";
    }


    return "badge-pending";
}


/* =========================================================
   CAMBIAR ESTADO POSTULACIÓN
========================================================= */

async function cambiarEstadoPostulacion(
    postulacion,
    nuevoEstado
){

    if(
        !usuarioActual
    ){
        return;
    }


    try{

        /*
         * Primero comprobamos que el empleo
         * realmente pertenece al usuario.
         */

        const empleoRef =
            doc(
                db,
                "empleos",
                postulacion.empleoId
            );


        const empleoSnapshot =
            await getDoc(
                empleoRef
            );


        if(
            !empleoSnapshot.exists()
        ){

            alert(
                "El empleo ya no existe."
            );

            return;
        }


        const empleo =
            empleoSnapshot.data();


        if(
            empleo.uid !==
            usuarioActual.uid
        ){

            alert(
                "No tenés permiso para modificar esta postulación."
            );

            return;
        }


        await updateDoc(
            doc(
                db,
                "postulaciones",
                postulacion.id
            ),
            {
                estado:
                    nuevoEstado,

                fechaActualizacion:
                    serverTimestamp()
            }
        );


        /*
         * Avisamos al postulante.
         */

        if(
            postulacion.postulanteUid &&
            postulacion.postulanteUid !==
            usuarioActual.uid
        ){

            await addDoc(
                collection(
                    db,
                    "notificaciones"
                ),
                {

                    receptorUid:
                        postulacion.postulanteUid,

                    emisorUid:
                        usuarioActual.uid,

                    tipo:
                        "estado_postulacion",

                    titulo:
                        "Actualización de postulación",

                    mensaje:
                        "La empresa actualizó el estado de tu postulación.",

                    leida:
                        false,

                    referenciaId:
                        postulacion.empleoId,

                    url:
                        "ver-empleo.html?id=" +
                        encodeURIComponent(
                            postulacion.empleoId
                        ),

                    fecha:
                        serverTimestamp(),

                    fechaCliente:
                        Date.now()

                }
            );
        }


        mostrarToast(
            "Estado de la postulación actualizado."
        );


        /*
         * Recargamos el modal para reflejar
         * inmediatamente el nuevo estado.
         */

        const empleoActual =
            empleosActuales.find(
                empleo =>
                    empleo.id ===
                    postulacion.empleoId
            );


        if(
            empleoActual
        ){

            await abrirPostulaciones(
                empleoActual
            );
        }


        cargarEstadisticasPostulaciones();


    }catch(error){

        console.error(
            "Error actualizando postulación:",
            error
        );

        alert(
            "No se pudo actualizar el estado."
        );
    }
}
