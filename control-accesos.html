<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#111827">
<title>Control de Accesos - GESBASE</title>

<style>
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:Arial,sans-serif;background:#f3f4f6;color:#111827}
.app{max-width:1100px;margin:auto;background:#fff;min-height:100vh}
header{background:#111827;color:#fff;padding:24px}
header h1{font-size:28px}
header p{color:#d1d5db;margin-top:6px}
main{padding:20px}
.tarjeta{background:#fff;border:1px solid #e5e7eb;border-radius:14px;padding:18px;margin-bottom:18px}
.titulo{font-size:22px;font-weight:bold;margin-bottom:8px}
.descripcion{color:#6b7280;font-size:14px;line-height:1.5;margin-bottom:15px}
.botones{display:flex;gap:10px;flex-wrap:wrap}
button{border:none;border-radius:10px;padding:12px 16px;font-weight:bold;cursor:pointer}
.btn{background:#111827;color:#fff}
.btn-verde{background:#16a34a;color:#fff}
.btn-rojo{background:#dc2626;color:#fff}
.btn-gris{background:#e5e7eb}
.resumen{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;margin-bottom:18px}
.item{background:#f3f4f6;border-radius:10px;padding:15px;text-align:center}
.item h2{font-size:24px}
.item span{font-size:12px;color:#6b7280}
table{width:100%;border-collapse:collapse;min-width:800px}
th{background:#111827;color:#fff;padding:12px;font-size:12px;text-align:left}
td{padding:12px;border-bottom:1px solid #e5e7eb}
.estado{padding:6px 10px;border-radius:20px;font-size:12px;font-weight:bold}
.on{background:#dcfce7;color:#166534}
.off{background:#fee2e2;color:#991b1b}
.selector-plan{
 width:100%;
 padding:8px;
 border:1px solid #d1d5db;
 border-radius:8px;
 font-weight:bold;
}
.mensaje{display:none;padding:12px;border-radius:8px;margin-bottom:15px}
.ok{display:block;background:#dcfce7;color:#166534}
.error{display:block;background:#fee2e2;color:#991b1b}
.scroll{overflow:auto}
@media(max-width:700px){
.resumen{grid-template-columns:1fr}
}
</style>
</head>

<body>

<div class="app">

<header>
<h1>🔐 Control de accesos</h1>
<p>Panel exclusivo del administrador GESBASE</p>
</header>

<main>

<div id="mensaje" class="mensaje"></div>

<div class="tarjeta">
<div class="titulo">Empresas</div>
<div class="descripcion">
Habilitá o bloqueá el acceso y seleccioná el plan de cada empresa.
</div>

<div class="botones">
<button class="btn" id="btnActualizar">Actualizar</button>
<button class="btn-gris" onclick="location.href='index.html'">Volver</button>
</div>
</div>

<div class="resumen">
<div class="item">
<h2 id="cantEmpresas">0</h2>
<span>Empresas</span>
</div>

<div class="item">
<h2 id="cantActivas">0</h2>
<span>Habilitadas</span>
</div>

<div class="item">
<h2 id="cantBloqueadas">0</h2>
<span>Bloqueadas</span>
</div>
</div>

<div class="tarjeta">
<div class="titulo">Listado</div>

<div class="scroll">
<table>
<thead>
<tr>
<th>Empresa</th>
<th>Razón Social</th>
<th>Plan</th>
<th>Estado</th>
<th>Acción</th>
</tr>
</thead>

<tbody id="tablaEmpresas">
<tr>
<td colspan="5" style="text-align:center;padding:30px">
Cargando empresas...
</td>
</tr>
</tbody>

</table>
</div>
</div>

</main>
</div>

   <script type="module">
import { auth, db } from "./Js/firebase.js";
import { onAuthStateChanged } from "https://www.gstatic.com/firebasejs/12.1.0/firebase-auth.js";
import {
  collection,
  getDocs,
  doc,
  updateDoc
} from "https://www.gstatic.com/firebasejs/12.1.0/firebase-firestore.js";

const EMAIL_ADMIN = "julianbattauz006@gmail.com";

const tabla = document.getElementById("tablaEmpresas");
const mensaje = document.getElementById("mensaje");

const cantEmpresas = document.getElementById("cantEmpresas");
const cantActivas = document.getElementById("cantActivas");
const cantBloqueadas = document.getElementById("cantBloqueadas");

document.getElementById("btnActualizar").onclick = cargarEmpresas;

function avisar(texto, tipo="ok"){
  mensaje.className = "mensaje " + tipo;
  mensaje.textContent = texto;
}

async function cargarEmpresas(){

  const snap = await getDocs(collection(db,"empresas"));

  let html="";
  let total=0, activas=0, bloqueadas=0;

  snap.forEach(docu=>{

    const e = docu.data();
    total++;

    const activo = e.accesoHabilitado === true;

    if(activo) activas++;
    else bloqueadas++;

    html += `
    <tr>
      <td><strong>${e.nombreEmpresa || "Empresa"}</strong></td>
      <td>${e.razonSocial || "-"}</td>

      <td>
        <select class="selector-plan" data-id="${docu.id}">
          <option value="Inicial" ${e.plan==="Inicial"?"selected":""}>🟢 Inicial</option>
          <option value="Profesional" ${e.plan==="Profesional"?"selected":""}>🔵 Profesional</option>
          <option value="Empresa" ${e.plan==="Empresa"?"selected":""}>🟣 Empresa</option>
        </select>
      </td>

      <td>
        <span class="estado ${activo?"on":"off"}">
          ${activo?"HABILITADO":"BLOQUEADO"}
        </span>
      </td>

      <td>
        <button
          class="${activo?"btn-rojo":"btn-verde"}"
          onclick="window.cambiarEstado('${docu.id}',${!activo})">
          ${activo?"Bloquear":"Habilitar"}
        </button>
      </td>
    </tr>`;
  });

  tabla.innerHTML = html || `
  <tr><td colspan="5">No hay empresas.</td></tr>`;

  cantEmpresas.textContent = total;
  cantActivas.textContent = activas;
  cantBloqueadas.textContent = bloqueadas;

  document.querySelectorAll(".selector-plan").forEach(sel=>{
    sel.addEventListener("change", async ()=>{
      await updateDoc(doc(db,"empresas",sel.dataset.id),{
        plan: sel.value
      });
      avisar("Plan actualizado correctamente");
    });
  });
}

window.cambiarEstado = async(id,estado)=>{
  await updateDoc(doc(db,"empresas",id),{
    accesoHabilitado: estado
  });

  avisar(
    estado
    ? "Empresa habilitada correctamente"
    : "Empresa bloqueada correctamente"
  );

  cargarEmpresas();
};

onAuthStateChanged(auth, async(user)=>{

  if(!user){
    location.href="login.html";
    return;
  }

  if(user.email !== EMAIL_ADMIN){
    document.body.innerHTML = `
      <div style="padding:40px;text-align:center;font-family:Arial">
        <h2>Acceso denegado</h2>
        <p>Solo el administrador puede ingresar.</p>
      </div>`;
    return;
  }

  cargarEmpresas();
});
</script>

</body>
</html>
