<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#111827">
<title>Control de Accesos - GESBASE</title>
<!-- Conservá exactamente el mismo <style> que ya tenés -->
</head>
<body>
<div class="app">
<!-- Conservá todo el HTML visual igual -->

<script type="module">

// FIREBASE
import { initializeApp } from "https://www.gstatic.com/firebasejs/12.18.0/firebase-app.js";
import { getAuth, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/12.18.0/firebase-auth.js";
import { getFirestore, collection, getDocs, doc, updateDoc } from "https://www.gstatic.com/firebasejs/12.18.0/firebase-firestore.js";
import { firebaseConfig } from "./Js/firebase-config.js";

const app = initializeApp(firebaseConfig);
const auth = getAuth(app);
const db = getFirestore(app);

const EMAIL_ADMIN = "julianbattauz006@gmail.com";

const tabla = document.getElementById("tablaEmpresas");
const mensaje = document.getElementById("mensaje");
const cantEmpresas = document.getElementById("cantEmpresas");
const cantActivas = document.getElementById("cantActivas");
const cantBloqueadas = document.getElementById("cantBloqueadas");

let cargandoEmpresas = false;
let temporizadorMensaje = null;
    // =====================================================
// UTILIDADES
// =====================================================

function texto(valor) {
    if (valor === undefined || valor === null) {
        return "";
    }

    return String(valor);
}

function escapar(valor) {
    return texto(valor)
        .replaceAll("&", "&amp;")
        .replaceAll("<", "&lt;")
        .replaceAll(">", "&gt;")
        .replaceAll('"', "&quot;")
        .replaceAll("'", "&#039;");
}

function obtenerCampo(empresa, campos) {
    for (const campo of campos) {
        const valor = empresa[campo];

        if (
            valor !== undefined &&
            valor !== null &&
            texto(valor).trim() !== ""
        ) {
            return texto(valor);
        }
    }

    return "-";
}


// =====================================================
// MENSAJES
// =====================================================

function avisar(textoMensaje, tipo = "ok") {

    clearTimeout(temporizadorMensaje);

    mensaje.textContent = textoMensaje;
    mensaje.className = "mensaje " + tipo;
    mensaje.style.display = "block";

    temporizadorMensaje = setTimeout(() => {
        mensaje.style.display = "none";
    }, 4000);
}


// =====================================================
// RESUMEN
// =====================================================

function actualizarResumen(total, activas, bloqueadas) {

    cantEmpresas.textContent = total;
    cantActivas.textContent = activas;
    cantBloqueadas.textContent = bloqueadas;
}


// =====================================================
// CAMBIAR PLAN
// =====================================================

async function cambiarPlan(idEmpresa, nuevoPlan, selector) {

    selector.disabled = true;

    try {

        await updateDoc(
            doc(db, "empresas", idEmpresa),
            {
                plan: nuevoPlan
            }
        );

        avisar("Plan actualizado correctamente.");

    } catch (error) {

        console.error("Error actualizando plan:", error);

        avisar(
            "No se pudo actualizar el plan: " + error.message,
            "error"
        );

        await cargarEmpresas();

    } finally {

        selector.disabled = false;

    }
}


// =====================================================
// CAMBIAR TIPO DE ACCESO
// =====================================================

async function cambiarAcceso(idEmpresa, nuevoTipo, selector) {

    selector.disabled = true;

    try {

        const accesoHabilitado =
            nuevoTipo !== "bloqueado";

        await updateDoc(
            doc(db, "empresas", idEmpresa),
            {
                tipoAcceso: nuevoTipo,
                accesoHabilitado: accesoHabilitado
            }
        );

        avisar(
            accesoHabilitado
                ? "Acceso actualizado y habilitado."
                : "Acceso bloqueado correctamente."
        );

        await cargarEmpresas();

    } catch (error) {

        console.error(
            "Error actualizando acceso:",
            error
        );

        avisar(
            "No se pudo actualizar el acceso: " +
            error.message,
            "error"
        );

    } finally {

        selector.disabled = false;

    }
}


// =====================================================
// HABILITAR / BLOQUEAR
// =====================================================

async function cambiarEstado(
    idEmpresa,
    nuevoEstado,
    boton
) {

    boton.disabled = true;

    try {

        await updateDoc(
            doc(db, "empresas", idEmpresa),
            {
                accesoHabilitado: nuevoEstado,

                tipoAcceso:
                    nuevoEstado
                        ? "completo"
                        : "bloqueado"
            }
        );

        avisar(
            nuevoEstado
                ? "Empresa habilitada correctamente."
                : "Empresa bloqueada correctamente."
        );

        await cargarEmpresas();

    } catch (error) {

        console.error(
            "Error modificando estado:",
            error
        );

        avisar(
            "No se pudo modificar el acceso: " +
            error.message,
            "error"
        );

    } finally {

        boton.disabled = false;

    }
}


// =====================================================
// CARGAR EMPRESAS
// =====================================================

async function cargarEmpresas() {

    if (cargandoEmpresas) {
        return;
    }

    cargandoEmpresas = true;

    tabla.innerHTML = `
        <tr>
            <td colspan="9" class="cargando">
                Cargando empresas...
            </td>
        </tr>
    `;

    try {

        const resultado = await getDocs(
            collection(db, "empresas")
        );

        let html = "";

        let total = 0;
        let activas = 0;
        let bloqueadas = 0;

        resultado.forEach((documento) => {

            const empresa = documento.data();
            const idEmpresa = documento.id;

            total++;

            const accesoHabilitado =
                empresa.accesoHabilitado === true;

            if (accesoHabilitado) {
                activas++;
            } else {
                bloqueadas++;
            }


            // DATOS EMPRESA

            const nombreEmpresa = obtenerCampo(
                empresa,
                [
                    "nombreEmpresa",
                    "nombre",
                    "empresa"
                ]
            );

            const razonSocial = obtenerCampo(
                empresa,
                [
                    "razonSocial",
                    "razon_social"
                ]
            );

            const cuit = obtenerCampo(
                empresa,
                [
                    "cuit",
                    "CUIT",
                    "cuitEmpresa"
                ]
            );

            const telefono = obtenerCampo(
                empresa,
                [
                    "telefono",
                    "tel",
                    "celular",
                    "telefonoEmpresa"
                ]
            );

            const email = obtenerCampo(
                empresa,
                [
                    "email",
                    "correo",
                    "correoElectronico",
                    "emailEmpresa"
                ]
            );


            // PLAN

            let plan =
                texto(empresa.plan).trim();

            if (
                ![
                    "Inicial",
                    "Profesional",
                    "Empresa"
                ].includes(plan)
            ) {
                plan = "Inicial";
            }


            // TIPO DE ACCESO

            let tipoAcceso =
                texto(empresa.tipoAcceso)
                    .trim()
                    .toLowerCase();

            if (
                ![
                    "inicial",
                    "completo",
                    "bloqueado"
                ].includes(tipoAcceso)
            ) {

                tipoAcceso =
                    accesoHabilitado
                        ? "completo"
                        : "bloqueado";
            }


            // FILA

            html += `
                <tr>

                    <td>

                        <div class="empresa">
                            ${escapar(nombreEmpresa)}
                        </div>

                        <div class="id-empresa">
                            ID: ${escapar(idEmpresa)}
                        </div>

                    </td>

                    <td>
                        ${escapar(razonSocial)}
                    </td>

                    <td>
                        ${escapar(cuit)}
                    </td>

                    <td>
                        ${escapar(telefono)}
                    </td>

                    <td>
                        ${escapar(email)}
                    </td>

                    <td>

                        <select
                            class="selector selector-plan"
                            data-id="${escapar(idEmpresa)}"
                        >

                            <option
                                value="Inicial"
                                ${plan === "Inicial"
                                    ? "selected"
                                    : ""}
                            >
                                🟢 Inicial
                            </option>

                            <option
                                value="Profesional"
                                ${plan === "Profesional"
                                    ? "selected"
                                    : ""}
                            >
                                🔵 Profesional
                            </option>

                            <option
                                value="Empresa"
                                ${plan === "Empresa"
                                    ? "selected"
                                    : ""}
                            >
                                🟣 Empresa
                            </option>

                        </select>

                    </td>

                    <td>

                        <select
                            class="selector selector-acceso"
                            data-id="${escapar(idEmpresa)}"
                        >

                            <option
                                value="inicial"
                                ${tipoAcceso === "inicial"
                                    ? "selected"
                                    : ""}
                            >
                                🟢 Inicial
                            </option>

                            <option
                                value="completo"
                                ${tipoAcceso === "completo"
                                    ? "selected"
                                    : ""}
                            >
                                🔵 Completo
                            </option>

                            <option
                                value="bloqueado"
                                ${tipoAcceso === "bloqueado"
                                    ? "selected"
                                    : ""}
                            >
                                🔴 Bloqueado
                            </option>

                        </select>

                    </td>

                    <td>

                        <span
                            class="estado ${
                                accesoHabilitado
                                    ? "on"
                                    : "off"
                            }"
                        >
                            ${
                                accesoHabilitado
                                    ? "HABILITADO"
                                    : "BLOQUEADO"
                            }
                        </span>

                    </td>

                    <td>

                        <button
                            type="button"
                            class="${
                                accesoHabilitado
                                    ? "btn-rojo"
                                    : "btn-verde"
                            }"
                            data-accion-estado="1"
                            data-id="${escapar(idEmpresa)}"
                            data-nuevo-estado="${
                                accesoHabilitado
                                    ? "false"
                                    : "true"
                            }"
                        >

                            ${
                                accesoHabilitado
                                    ? "🔒 Bloquear"
                                    : "🔓 Habilitar"
                            }

                        </button>

                    </td>

                </tr>
            `;

        });


        // MOSTRAR RESULTADO

        if (total === 0) {

            tabla.innerHTML = `
                <tr>
                    <td
                        colspan="9"
                        class="vacio"
                    >
                        No hay empresas registradas.
                    </td>
                </tr>
            `;

        } else {

            tabla.innerHTML = html;

        }


        actualizarResumen(
            total,
            activas,
            bloqueadas
        );


        // EVENTO PLAN

        document
            .querySelectorAll(".selector-plan")
            .forEach((selector) => {

                selector.addEventListener(
                    "change",
                    () => {

                        cambiarPlan(
                            selector.dataset.id,
                            selector.value,
                            selector
                        );

                    }
                );

            });


        // EVENTO ACCESO

        document
            .querySelectorAll(".selector-acceso")
            .forEach((selector) => {

                selector.addEventListener(
                    "change",
                    () => {

                        cambiarAcceso(
                            selector.dataset.id,
                            selector.value,
                            selector
                        );

                    }
                );

            });


        // EVENTO HABILITAR / BLOQUEAR

        document
            .querySelectorAll(
                "[data-accion-estado]"
            )
            .forEach((boton) => {

                boton.addEventListener(
                    "click",
                    () => {

                        const nuevoEstado =
                            boton.dataset.nuevoEstado === "true";

                        cambiarEstado(
                            boton.dataset.id,
                            nuevoEstado,
                            boton
                        );

                    }
                );

            });

    } catch (error) {

        console.error(
            "ERROR CARGANDO EMPRESAS:",
            error
        );

        tabla.innerHTML = `
            <tr>
                <td
                    colspan="9"
                    style="
                        text-align:center;
                        padding:30px;
                        color:#991b1b;
                    "
                >

                    ❌ Error al cargar empresas.

                    <br><br>

                    ${escapar(error.message)}

                </td>
            </tr>
        `;

        avisar(
            "No se pudieron cargar las empresas: " +
            error.message,
            "error"
        );

    } finally {

        cargandoEmpresas = false;

    }
}


// =====================================================
// BOTÓN ACTUALIZAR
// =====================================================

document
    .getElementById("btnActualizar")
    .addEventListener(
        "click",
        cargarEmpresas
    );


// =====================================================
// VOLVER
// =====================================================

function volver() {

    window.location.href = "index.html";

}

document
    .getElementById("btnVolver")
    .addEventListener(
        "click",
        volver
    );

document
    .getElementById("btnVolver2")
    .addEventListener(
        "click",
        volver
    );


// =====================================================
// AUTENTICACIÓN Y ADMINISTRADOR
// =====================================================

onAuthStateChanged(
    auth,
    async (usuario) => {

        if (!usuario) {

            window.location.replace(
                "login.html"
            );

            return;

        }


        const email =
            texto(usuario.email)
                .trim()
                .toLowerCase();


        if (
            email !==
            EMAIL_ADMIN.toLowerCase()
        ) {

            document.body.innerHTML = `
                <div
                    style="
                        min-height:100vh;
                        display:flex;
                        align-items:center;
                        justify-content:center;
                        padding:25px;
                        background:#f3f4f6;
                        font-family:Arial,sans-serif;
                    "
                >

                    <div
                        style="
                            background:#fff;
                            padding:35px;
                            border-radius:16px;
                            max-width:420px;
                            width:100%;
                            text-align:center;
                            box-shadow:0 4px 20px rgba(0,0,0,.08);
                        "
                    >

                        <div
                            style="
                                font-size:55px;
                                margin-bottom:15px;
                            "
                        >
                            🚫
                        </div>

                        <h2>
                            Acceso denegado
                        </h2>

                        <p
                            style="
                                margin-top:10px;
                                color:#6b7280;
                                line-height:1.5;
                            "
                        >
                            Solo el administrador GESBASE
                            puede ingresar a este panel.
                        </p>

                        <button
                            type="button"
                            onclick="location.href='index.html'"
                            style="
                                margin-top:20px;
                                background:#111827;
                                color:#fff;
                            "
                        >
                            ← Volver
                        </button>

                    </div>

                </div>
            `;

            return;
        }


        await cargarEmpresas();

    }
);

</script>
</body>
</html>
