<!DOCTYPE html>
<html lang="es">

<head>

<meta charset="UTF-8">

<meta name="viewport" content="width=device-width, initial-scale=1.0">

<meta name="theme-color" content="#111827">

<title>Empleados - GESBASE</title>

<style>

*{
    box-sizing:border-box;
    margin:0;
    padding:0;
}

body{
    font-family:Arial,sans-serif;
    background:#f3f4f6;
    color:#111827;
}

.contenedor{
    width:100%;
    max-width:900px;
    margin:auto;
    min-height:100vh;
    background:#fff;
}

header{
    background:#111827;
    color:white;
    padding:22px 20px;
}

header h1{
    font-size:25px;
}

header p{
    margin-top:6px;
    color:#d1d5db;
    font-size:14px;
}

main{
    padding:20px;
}

h2{
    font-size:21px;
    margin-bottom:15px;
}

.boton{
    width:100%;
    border:none;
    border-radius:10px;
    padding:14px;
    font-size:15px;
    font-weight:bold;
    cursor:pointer;
    margin-top:10px;
}

.boton-principal{
    background:#2563eb;
    color:white;
}

.boton-secundario{
    background:#e5e7eb;
    color:#111827;
}

.boton-acceso{
    background:#16a34a;
    color:white;
}

.boton-bloquear{
    background:#f59e0b;
    color:white;
}

.boton-baja{
    background:#dc2626;
    color:white;
}

.boton-reactivar{
    background:#2563eb;
    color:white;
}

.formulario{
    background:#f9fafb;
    border:1px solid #d1d5db;
    border-radius:12px;
    padding:18px;
    margin-bottom:25px;
}

.campo{
    margin-bottom:14px;
}

.campo label{
    display:block;
    font-size:14px;
    font-weight:bold;
    margin-bottom:6px;
}

.campo input,
.campo select{
    width:100%;
    padding:13px;
    border:1px solid #d1d5db;
    border-radius:9px;
    background:white;
    font-size:15px;
}

.preview-foto{
    width:90px;
    height:90px;
    border-radius:50%;
    object-fit:cover;
    border:2px solid #d1d5db;
    display:none;
    margin-top:10px;
}

.lista{
    display:flex;
    flex-direction:column;
    gap:14px;
}

.empleado{
    border:1px solid #d1d5db;
    border-radius:12px;
    padding:16px;
    background:white;
}

.empleado-baja{
    opacity:.65;
    background:#f9fafb;
}

.empleado-cabecera{
    display:flex;
    align-items:center;
    gap:14px;
}

.foto-empleado{
    width:65px;
    height:65px;
    border-radius:50%;
    object-fit:cover;
    background:#e5e7eb;
    flex-shrink:0;
}

.foto-placeholder{
    display:flex;
    align-items:center;
    justify-content:center;
    font-size:28px;
}

.empleado-nombre{
    font-size:17px;
    font-weight:bold;
}

.empleado-puesto{
    margin-top:4px;
    font-size:13px;
    color:#6b7280;
}

.datos-empleado{
    margin-top:14px;
    border-top:1px solid #e5e7eb;
    padding-top:12px;
}

.dato{
    font-size:14px;
    padding:4px 0;
}

.etiqueta{
    font-weight:bold;
}

.estado{
    display:inline-block;
    padding:5px 9px;
    border-radius:20px;
    font-size:12px;
    font-weight:bold;
    margin-top:8px;
}

.estado-activo{
    background:#dcfce7;
    color:#166534;
}

.estado-inactivo{
    background:#fee2e2;
    color:#991b1b;
}

.estado-baja{
    background:#e5e7eb;
    color:#374151;
}

.estado-acceso{
    background:#dcfce7;
    color:#166534;
}

.estado-sin-acceso{
    background:#fef3c7;
    color:#92400e;
}

.acciones{
    margin-top:12px;
    display:grid;
    grid-template-columns:1fr 1fr;
    gap:8px;
}

.acciones button{
    margin-top:0;
}

.cargando{
    text-align:center;
    padding:30px;
    color:#6b7280;
}

.vacio{
    text-align:center;
    padding:30px 15px;
    color:#6b7280;
    border:1px dashed #d1d5db;
    border-radius:12px;
}

.error{
    background:#fee2e2;
    color:#991b1b;
    padding:14px;
