<!DOCTYPE html>
<html lang="es">

<head>

<meta charset="UTF-8">

<meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
>

<meta
    name="theme-color"
    content="#111827"
>

<title>Mis presupuestos - GESBASE</title>


<style>

*{
    box-sizing:border-box;
    margin:0;
    padding:0;
}

body{
    font-family:Arial,sans-serif;
    background:#f3f4f6;
    color:#111827;
}

.contenedor{
    max-width:700px;
    margin:auto;
    min-height:100vh;
    background:white;
}

header{
    background:#111827;
    color:white;
    padding:25px 20px;
}

header h1{
    font-size:25px;
}

header p{
    margin-top:6px;
    color:#d1d5db;
    font-size:14px;
}

main{
    padding:20px;
}


/* ===============================
   USUARIO
================================ */

.usuario{
    background:#f3f4f6;
    padding:13px;
    border-radius:10px;
    margin-bottom:12px;
    font-size:14px;
}


/* ===============================
   BARRA DE ACCIONES
================================ */

.acciones{
    display:flex;
    gap:10px;
    margin-bottom:15px;
}

.boton-actualizar{
    flex:1;
    padding:13px;
    border:none;
    border-radius:10px;
    background:#374151;
    color:white;
    font-size:15px;
    font-weight:bold;
    cursor:pointer;
}

.boton-nuevo{
    flex:1;
    padding:13px;
    border-radius:10px;
    text-align:center;
    text-decoration:none;
    background:#111827;
    color:white;
    font-size:15px;
    font-weight:bold;
}


/* ===============================
   BUSCADOR
================================ */

.buscador{
    width:100%;
    padding:14px;
    border:1px solid #d1d5db;
    border-radius:10px;
    font-size:15px;
    margin-bottom:15px;
    outline:none;
}

.buscador:focus{
    border-color:#2563eb;
}


/* ===============================
   CARGANDO
================================ */

.cargando{
    text-align:center;
    padding:35px 10px;
    color:#6b7280;
}


/* ===============================
   LISTA
================================ */

.lista{
    display:flex;
    flex-direction:column;
    gap:15px;
}


/* ===============================
   TARJETA
================================ */

.presupuesto{
    padding:18px;
    border:1px solid #d1d5db;
    border-radius:14px;
    background:white;
    box-shadow:0 3px 10px rgba(0,0,0,.08);
}

.numero{
    font-size:13px;
    font-weight:bold;
    color:#6b7280;
    margin-bottom:7px;
}

.cliente{
    font-size:20px;
    font-weight:bold;
    margin-bottom:10px;
}

.dato{
    margin-top:7px;
    font-size:14px;
    color:#4b5563;
}

.descripcion{
    margin-top:10px;
    line-height:1.45;
    color:#374151;
}

.total{
    margin-top:14px;
    padding-top:12px;
    border-top:1px solid #e5e7eb;
    font-size:20px;
    font-weight:bold;
}


/* ===============================
   BOTONES
================================ */

.boton{
    display:block;
    width:100%;
    margin-top:10px;
    padding:13px;
    border-radius:10px;
    text-align:center;
    text-decoration:none;
    font-size:15px;
    font-weight:bold;
    cursor:pointer;
}

.boton-ver{
    background:#111827;
    color:white;
}

.boton-editar{
    background:#2563eb;
    color:white;
}

.boton-pdf{
    background:#dc2626;
    color:white;
}

.boton-eliminar{
    background:#fee2e2;
    color:#991b1b;
    border:1px solid #fecaca;
}


/* ===============================
   SIN RESULTADOS
================================ */

.sin-presupuestos{
    text-align:center;
    padding:30px;
    color:#6b7280;
}

.sin-busqueda{
    display:none;
    text-align:center;
    padding:25px;
    color:#6b7280;
}


/* ===============================
   ERROR
================================ */

.error{
    display:none;
    background:#fee2e2;
    color:#991b1b;
    padding:14px;
    border-radius:10px;
    margin-bottom:15px;
}


/* ===============================
   VOLVER
================================ */

.boton-volver{
    display:block;
    width:100%;
    padding:15px;
    border-radius:10px;
    text-align:center;
    text-decoration:none;
    font-size:16px;
    font-weight:bold;
    margin-top:18px;
    background:#e5e7eb;
    color:#111827;
}


/* ===============================
   RESPONSIVE
================================ */

@media(max-width:480px){

    main{
        padding:15px;
    }

    .acciones{
        flex-direction:column;
    }

    .boton-nuevo,
    .boton-actualizar{
        width:100%;
    }

}

</style>

</head>


<body>


<div class="contenedor">


<header>

<h1>
Mis presupuestos
</h1>

<p>
GESBASE
</p>

</header>


<main>


<div
    id="usuario"
    class="usuario"
>
Verificando usuario...
</div>


<div
    id="error"
    class="error"
></div>


<div class="acciones">

<button
    id="btnActualizar"
    class="boton-actualizar"
>
🔄 ACTUALIZAR
</button>


<a
    href="presupuesto.html"
    class="boton-nuevo"
>
+ NUEVO PRESUPUESTO
</a>

</div>


<input
    type="search"
    id="buscador"
    class="buscador"
    placeholder="🔎 Buscar por cliente o descripción..."
>


<div
    id="cargando"
    class="cargando"
>
Cargando presupuestos...
</div>


<div
    id="lista"
    class="lista"
></div>


<div
    id="sinPresupuestos"
    class="sin-presupuestos"
    style="display:none;"
>
Todavía no tenés presupuestos.
</div>


<div
    id="sinBusqueda"
    class="sin-busqueda"
>
No se encontraron presupuestos.
</div>


<a
    href="index.html"
    class="boton-volver"
>
⬅️ VOLVER A GESBASE
</a>


</main>

</div>


<script type="module">


// ==========================================
// FIREBASE
// ==========================================

import {
    auth,
    db
} from "./Js/firebase.js";


import {
    onAuthStateChanged
} from
"https://www.gstatic.com/firebasejs/12.1.0/firebase-auth.js";


import {
    collection,
    query,
    where,
    getDocs,
    doc,
    getDoc,
    deleteDoc
} from
"https://www.gstatic.com/firebasejs/12.1.0/firebase-firestore.js";


// ==========================================
// ELEMENTOS
// ==========================================

const usuarioElemento =
document.getElementById("usuario");

const cargando =
document.getElementById("cargando");

const lista =
document.getElementById("lista");

const sinPresupuestos =
document.getElementById("sinPresupuestos");

const sinBusqueda =
document.getElementById("sinBusqueda");

const errorElemento =
document.getElementById("error");

const buscador =
document.getElementById("buscador");

const btnActualizar =
document.getElementById("btnActualizar");


// ==========================================
// VARIABLES
// ==========================================

let usuarioActual = null;

let presupuestos = [];


// ==========================================
// DINERO
// ==========================================

function dinero(valor){

    return Number(valor || 0)
        .toLocaleString(
            "es-AR",
            {
                minimumFractionDigits:2,
                maximumFractionDigits:2
            }
        );

}


// ==========================================
// NÚMERO DE PRESUPUESTO
// ==========================================

function numeroPresupuesto(id){

    let suma = 0;

    for(
        let i = 0;
        i < id.length;
        i++
    ){

        suma +=
        id.charCodeAt(i);

    }

    return String(
        suma % 1000000
    ).padStart(
        6,
        "0"
    );

}


// ==========================================
// ESCAPAR HTML
// ==========================================

function escaparHTML(valor){

    const div =
    document.createElement("div");

    div.textContent =
    valor ?? "";

    return div.innerHTML;

}


// ==========================================
// FECHA PARA ORDENAR
// ==========================================

function fechaOrden(fecha){

    if(!fecha){
        return 0;
    }

    const partes =
    String(fecha).split("-");

    if(partes.length === 3){

        return new Date(
            Number(partes[0]),
            Number(partes[1]) - 1,
            Number(partes[2])
        ).getTime();

    }

    return 0;

}


// ==========================================
// MOSTRAR ERROR
// ==========================================

function mostrarError(mensaje){

    errorElemento.textContent =
    mensaje;

    errorElemento.style.display =
    "block";

}


// ==========================================
// OCULTAR ERROR
// ==========================================

function ocultarError(){

    errorElemento.textContent =
    "";

    errorElemento.style.display =
    "none";

}


// ==========================================
// ELIMINAR PRESUPUESTO
// ==========================================

async function eliminarPresupuesto(id){

    if(!usuarioActual){
        return;
    }


    const confirmar =
    confirm(
        "¿Seguro que querés eliminar este presupuesto?\n\nEsta acción no se puede deshacer."
    );


    if(!confirmar){
        return;
    }


    try{

        const referencia =
        doc(
            db,
            "presupuestos",
            id
        );


        const resultado =
        await getDoc(
            referencia
        );


        if(!resultado.exists()){

            alert(
                "El presupuesto ya no existe."
            );

            await cargarPresupuestos();

            return;

        }


        const datos =
        resultado.data();


        if(
            datos.uid !==
            usuarioActual.uid
        ){

            alert(
                "No tenés permiso para eliminar este presupuesto."
            );

            return;

        }


        await deleteDoc(
            referencia
        );


        alert(
            "Presupuesto eliminado correctamente."
        );


        await cargarPresupuestos();

    }
    catch(error){

        console.error(
            "Error eliminando:",
            error
        );


        alert(
            "No se pudo eliminar el presupuesto:\n" +
            error.message
        );

    }

}


// ==========================================
// CREAR TARJETA
// ==========================================

function crearTarjeta(
    datos,
    id
){

    const tarjeta =
    document.createElement("div");

    tarjeta.className =
    "presupuesto";


    const numero =
    numeroPresupuesto(id);


    const cliente =
    escaparHTML(
        datos.cliente ||
        "Sin cliente"
    );


    const fecha =
    escaparHTML(
        datos.fecha ||
        "-"
    );


    const descripcion =
    escaparHTML(
        datos.descripcion ||
        "Sin descripción"
    );


    const materiales =
    Number(
        datos.materiales
    ) || 0;


    const manoObra =
    Number(
        datos.manoObra
    ) || 0;


    const viaticos =
    Number(
        datos.viaticos
    ) || 0;


    const flete =
    Number(
        datos.flete
    ) || 0;


    /*
     * Usamos el total guardado si existe.
     * Si no existe, lo calculamos.
     */

    let total =
    Number(
        datos.total
    );


    if(
        !Number.isFinite(total) ||
        total === 0
    ){

        total =
        materiales +
        manoObra +
        viaticos +
        flete;

    }


    tarjeta.innerHTML = `

        <div class="numero">
            PRESUPUESTO #${numero}
        </div>


        <div class="cliente">
            ${cliente}
        </div>


        <div class="dato">
            📅 Fecha: ${fecha}
        </div>


        <div class="descripcion">
            ${descripcion}
        </div>


        <div class="dato">
            Materiales:
            $${dinero(materiales)}
        </div>


        <div class="dato">
            Mano de obra:
            $${dinero(manoObra)}
        </div>


        <div class="dato">
            Viáticos:
            $${dinero(viaticos)}
        </div>


        ${
            flete > 0
            ?
            `
            <div class="dato">
                Flete:
                $${dinero(flete)}
            </div>
            `
            :
            ""
        }


        <div class="total">
            TOTAL:
            $${dinero(total)}
        </div>


        <a
            href="ver-presupuesto.html?id=${encodeURIComponent(id)}"
            class="boton boton-ver"
        >
            👁️ VER PRESUPUESTO
        </a>


        <a
            href="editar-presupuesto.html?id=${encodeURIComponent(id)}"
            class="boton boton-editar"
        >
            ✏️ EDITAR PRESUPUESTO
        </a>


        <a
            href="ver-presupuesto.html?id=${encodeURIComponent(id)}"
            class="boton boton-pdf"
        >
            📄 VER / GENERAR PDF
        </a>


        <button
            class="boton boton-eliminar"
        >
            🗑️ ELIMINAR PRESUPUESTO
        </button>

    `;


    const botonEliminar =
    tarjeta.querySelector(
        ".boton-eliminar"
    );


    botonEliminar.addEventListener(
        "click",
        function(){

            eliminarPresupuesto(id);

        }
    );


    return tarjeta;

}


// ==========================================
// MOSTRAR LISTA
// ==========================================

function mostrarLista(){

    lista.innerHTML =
    "";

    sinBusqueda.style.display =
    "none";


    const termino =
    buscador.value
        .trim()
        .toLowerCase();


    let filtrados =
    presupuestos;


    if(termino){

        filtrados =
        presupuestos.filter(
            function(item){

                const datos =
                item.datos;


                const cliente =
                String(
                    datos.cliente || ""
                ).toLowerCase();


                const descripcion =
                String(
                    datos.descripcion || ""
                ).toLowerCase();


                const fecha =
                String(
                    datos.fecha || ""
                ).toLowerCase();


                return (
                    cliente.includes(termino) ||
                    descripcion.includes(termino) ||
                    fecha.includes(termino)
                );

            }
        );

    }


    if(
        filtrados.length === 0
    ){

        if(
            presupuestos.length > 0
        ){

            sinBusqueda.style.display =
            "block";

        }

        return;

    }


    filtrados.forEach(
        function(item){

            lista.appendChild(
                crearTarjeta(
                    item.datos,
                    item.id
                )
            );

        }
    );

}


// ==========================================
// CARGAR PRESUPUESTOS
// ==========================================

async function cargarPresupuestos(){

    if(!usuarioActual){
        return;
    }


    try{

        ocultarError();


        cargando.style.display =
        "block";


        lista.innerHTML =
        "";


        sinPresupuestos.style.display =
        "none";


        sinBusqueda.style.display =
        "none";


        usuarioElemento.textContent =
        "Usuario: " +
        (
            usuarioActual.email ||
            "Usuario autenticado"
        );


        const referencia =
        collection(
            db,
            "presupuestos"
        );


        const consulta =
        query(
            referencia,
            where(
                "uid",
                "==",
                usuarioActual.uid
            )
        );


        const resultado =
        await getDocs(
            consulta
        );


        presupuestos =
        [];


        resultado.forEach(
            function(documento){

                presupuestos.push({

                    id:
                    documento.id,

                    datos:
                    documento.data()

                });

            }
        );


        /*
         * MÁS NUEVOS PRIMERO
         */

        presupuestos.sort(
            function(a,b){

                return (
                    fechaOrden(
                        b.datos.fecha
                    )
                    -
                    fechaOrden(
                        a.datos.fecha
                    )
                );

            }
        );


        cargando.style.display =
        "none";


        if(
            presupuestos.length === 0
        ){

            sinPresupuestos.style.display =
            "block";

            return;

        }


        mostrarLista();

    }
    catch(error){

        console.error(
            "Error cargando presupuestos:",
            error
        );


        cargando.style.display =
        "none";


        mostrarError(
            "Error al cargar los presupuestos: " +
            error.message
        );

    }

}


// ==========================================
// BUSCADOR
// ==========================================

buscador.addEventListener(
    "input",
    function(){

        mostrarLista();

    }
);


// ==========================================
// ACTUALIZAR
// ==========================================

btnActualizar.addEventListener(
    "click",
    async function(){

        btnActualizar.disabled =
        true;


        btnActualizar.textContent =
        "⏳ CARGANDO...";


        await cargarPresupuestos();


        btnActualizar.disabled =
        false;


        btnActualizar.textContent =
        "🔄 ACTUALIZAR";

    }
);


// ==========================================
// AUTENTICACIÓN
// ==========================================

onAuthStateChanged(
    auth,
    function(usuario){

        if(!usuario){

            window.location.replace(
                "login.html"
            );

            return;

        }


        usuarioActual =
        usuario;


        cargarPresupuestos();

    }
);

</script>


</body>

</html>
