<!DOCTYPE html>
<html lang="es">

<head>

<meta charset="UTF-8">

<meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
>

<meta
    name="theme-color"
    content="#111827"
>

<meta
    name="description"
    content="GESBASE - Mis presupuestos"
>

<title>Presupuestos - GESBASE</title>

<style>

*{
    box-sizing:border-box;
    margin:0;
    padding:0;
}

body{
    font-family:Arial,sans-serif;
    background:#f3f4f6;
    color:#111827;
}

.contenedor{
    max-width:900px;
    margin:auto;
    min-height:100vh;
    background:#fff;
}

header{
    background:#111827;
    color:#fff;
    padding:22px 18px;
}

header h1{
    font-size:25px;
}

header p{
    margin-top:5px;
    color:#d1d5db;
}

main{
    padding:18px;
}

.barra{
    display:flex;
    gap:10px;
    margin-bottom:15px;
}

.boton{
    flex:1;
    padding:13px;
    border-radius:10px;
    text-align:center;
    text-decoration:none;
    font-weight:bold;
}

.nuevo{
    background:#16a34a;
    color:#fff;
}

.volver{
    background:#e5e7eb;
    color:#111827;
}

.buscar{
    width:100%;
    padding:14px;
    border:1px solid #d1d5db;
    border-radius:10px;
    margin-bottom:15px;
    font-size:15px;
}

.estado{
    padding:20px;
    text-align:center;
    border-radius:12px;
    background:#f9fafb;
    color:#6b7280;
}

.error{
    background:#fee2e2;
    color:#991b1b;
    border:1px solid #fecaca;
    padding:15px;
    border-radius:10px;
    white-space:pre-wrap;
    line-height:1.5;
    display:none;
}

.lista{
    display:flex;
    flex-direction:column;
    gap:14px;
}

.card{
    border:1px solid #d1d5db;
    border-radius:14px;
    padding:16px;
    background:#fff;
    box-shadow:0 2px 6px rgba(0,0,0,.05);
}

.card h2{
    font-size:18px;
    margin-bottom:8px;
}

.dato{
    margin-top:6px;
    font-size:14px;
}

.total{
    margin-top:12px;
    padding-top:12px;
    border-top:1px solid #e5e7eb;
    font-size:18px;
    font-weight:bold;
}

.acciones{
    display:grid;
    grid-template-columns:1fr 1fr;
    gap:8px;
    margin-top:14px;
}

.accion{
    padding:11px 8px;
    border-radius:9px;
    text-decoration:none;
    text-align:center;
    font-size:13px;
    font-weight:bold;
}

.ver{
    background:#111827;
    color:#fff;
}

.editar{
    background:#2563eb;
    color:#fff;
}

.trabajo{
    grid-column:1 / -1;
    background:#16a34a;
    color:#fff;
}

.materiales{
    background:#ea580c;
    color:#fff;
    border:0;
    cursor:pointer;
}

@media(max-width:600px){

    .barra{
        flex-direction:column;
    }

    .acciones{
        grid-template-columns:1fr;
    }

    .trabajo{
        grid-column:auto;
    }

}

</style>

</head>

<body>

<div class="contenedor">

<header>

<h1>GESBASE</h1>

<p>Mis presupuestos</p>

</header>

<main>

<div class="barra">

<a
    href="presupuesto.html"
    class="boton nuevo"
>
    ➕ NUEVO PRESUPUESTO
</a>

<a
    href="index.html"
    class="boton volver"
>
    ⬅️ VOLVER
</a>

</div>

<input
    id="buscar"
    class="buscar"
    type="search"
    placeholder="🔎 Buscar presupuesto o cliente..."
>

<div
    id="cargando"
    class="estado"
>
    ⏳ Cargando presupuestos...
</div>

<div
    id="error"
    class="error"
></div>

<div
    id="lista"
    class="lista"
></div>

</main>

</div>

<script type="module">

/* =====================================================
   FIREBASE
===================================================== */

import {
    auth,
    db
} from "./Js/firebase.js";

import {
    onAuthStateChanged
} from "https://www.gstatic.com/firebasejs/12.18.0/firebase-auth.js";

import {
    collection,
    getDocs,
    query,
    where
} from "https://www.gstatic.com/firebasejs/12.18.0/firebase-firestore.js";


/* =====================================================
   ELEMENTOS
===================================================== */

const cargando =
document.getElementById("cargando");

const errorBox =
document.getElementById("error");

const lista =
document.getElementById("lista");

const buscar =
document.getElementById("buscar");


let todos = [];

let usuarioActual = null;


/* =====================================================
   FUNCIONES
===================================================== */

function texto(valor){

    if(
        valor === null ||
        valor === undefined
    ){

        return "";

    }

    return String(valor);

}


function escapar(valor){

    return texto(valor)
        .replace(/&/g,"&amp;")
        .replace(/</g,"&lt;")
        .replace(/>/g,"&gt;")
        .replace(/"/g,"&quot;")
        .replace(/'/g,"&#039;");

}


function numero(valor){

    const n =
    Number(valor);

    return Number.isFinite(n)
        ? n
        : 0;

}


function dinero(valor){

    return numero(valor)
        .toLocaleString(
            "es-AR",
            {
                minimumFractionDigits:2,
                maximumFractionDigits:2
            }
        );

}


function cliente(datos){

    return (
        datos.cliente ||
        datos.nombreCliente ||
        datos.clienteNombre ||
        datos.nombreEmpresaCliente ||
        datos.empresaCliente ||
        "Sin cliente"
    );

}


function numeroPresupuesto(datos,id){

    return (
        datos.numeroAgenda ||
        datos.numero ||
        datos.numeroPresupuesto ||
        datos.codigo ||
        datos.nro ||
        id.substring(0,8)
    );

}


function descripcion(datos){

    return (
        datos.descripcion ||
        datos.tareas ||
        datos.titulo ||
        datos.concepto ||
        datos.detalle ||
        "Sin descripción"
    );

}


function total(datos){

    if(
        datos.total !== undefined
    ){

        return numero(
            datos.total
        );

    }

    if(
        datos.totalFinal !== undefined
    ){

        return numero(
            datos.totalFinal
        );

    }

    if(
        datos.importe !== undefined
    ){

        return numero(
            datos.importe
        );

    }

    return (
        numero(datos.materiales) +
        numero(datos.manoObra) +
        numero(datos.viaticos)
    );

}


/* =====================================================
   MOSTRAR ERROR
===================================================== */

function mostrarError(error){

    console.error(
        "GESBASE FIREBASE ERROR:",
        error
    );

    cargando.style.display =
    "none";

    errorBox.style.display =
    "block";

    let mensaje =
    error?.message ||
    String(error);

    errorBox.textContent =
        "❌ No se pudieron cargar los presupuestos.\n\n" +

        "Código: " +
        (
            error?.code ||
            "sin código"
        ) +

        "\n\n" +

        mensaje +

        "\n\n" +

        "Usuario: " +
        (
            usuarioActual?.email ||
            "sin usuario"
        );

}


/* =====================================================
   CARGAR PRESUPUESTOS
===================================================== */

async function cargarPresupuestos(){

    console.log(
        "GESBASE: iniciando carga de presupuestos..."
    );

    try{

        if(
            !usuarioActual
        ){

            throw new Error(
                "No existe usuario autenticado."
            );

        }


        console.log(
            "GESBASE UID:",
            usuarioActual.uid
        );


        const referencia =
        collection(
            db,
            "presupuestos"
        );


        console.log(
            "GESBASE: consultando colección presupuestos..."
        );


        const consulta =
        query(
            referencia,
            where(
                "uid",
                "==",
                usuarioActual.uid
            )
        );


        const resultado =
        await getDocs(
            consulta
        );


        console.log(
            "GESBASE: presupuestos encontrados:",
            resultado.size
        );


        todos = [];


        resultado.forEach(
            documento => {

                todos.push({

                    id:
                    documento.id,

                    datos:
                    documento.data()

                });

            }
        );


        todos.sort(
            (a,b) => {

                const fechaA =
                a.datos.creado?.seconds ||
                0;

                const fechaB =
                b.datos.creado?.seconds ||
                0;

                return fechaB - fechaA;

            }
        );


        cargando.style.display =
        "none";


        mostrarLista(
            todos
        );

    }
    catch(error){

        mostrarError(
            error
        );

    }

}


/* =====================================================
   MOSTRAR LISTA
===================================================== */

function mostrarLista(items){

    lista.innerHTML =
    "";


    if(
        items.length === 0
    ){

        lista.innerHTML = `

            <div class="estado">

                📋 No tenés presupuestos registrados.

                <br><br>

                <a
                    href="presupuesto.html"
                    class="boton nuevo"
                    style="display:inline-block;"
                >
                    ➕ CREAR PRESUPUESTO
                </a>

            </div>

        `;

        return;

    }


    items.forEach(
        item => {

            const datos =
            item.datos;


            const numero =
            numeroPresupuesto(
                datos,
                item.id
            );


            const nombreCliente =
            cliente(
                datos
            );


            const desc =
            descripcion(
                datos
            );


            const importe =
            total(
                datos
            );


            const estado =
            datos.estado ||
            "Pendiente";


            const lugar =
            datos.lugarTrabajo ||
            datos.lugar ||
            "Sin informar";


            const card =
            document.createElement(
                "div"
            );


            card.className =
            "card";


            card.innerHTML = `

                <h2>
                    Presupuesto N.º
                    ${escapar(numero)}
                </h2>

                <div class="dato">

                    <strong>
                        Cliente:
                    </strong>

                    ${escapar(nombreCliente)}

                </div>

                <div class="dato">

                    <strong>
                        Estado:
                    </strong>

                    ${escapar(estado)}

                </div>

                <div class="dato">

                    <strong>
                        Lugar:
                    </strong>

                    ${escapar(lugar)}

                </div>

                <div class="dato">

                    <strong>
                        Descripción:
                    </strong>

                    ${escapar(desc)}

                </div>

                <div class="total">

                    Total:
                    $ ${dinero(importe)}

                </div>

                <div class="acciones">

                    <a
                        class="accion ver"
                        href="ver-presupuesto.html?id=${encodeURIComponent(item.id)}"
                    >
                        👁️ VER
                    </a>

                    <a
                        class="accion editar"
                        href="editar-presupuesto.html?id=${encodeURIComponent(item.id)}"
                    >
                        ✏️ EDITAR
                    </a>

                    <!--
                        ESTA ES LA CORRECCIÓN DEL 404
                    -->

                    <a
                        class="accion trabajo"
                        href="trabajos.html?presupuestoId=${encodeURIComponent(item.id)}"
                    >
                        🔧 CREAR TRABAJO
                    </a>

                </div>

            `;


            lista.appendChild(
                card
            );

        }
    );

}


/* =====================================================
   BUSCADOR
===================================================== */

buscar.addEventListener(
    "input",
    function(){

        const busqueda =
        buscar.value
            .toLowerCase()
            .trim();


        if(
            !busqueda
        ){

            mostrarLista(
                todos
            );

            return;

        }


        const filtrados =
        todos.filter(
            item => {

                const datos =
                item.datos;


                const contenido = [

                    numeroPresupuesto(
                        datos,
                        item.id
                    ),

                    cliente(
                        datos
                    ),

                    descripcion(
                        datos
                    ),

                    datos.lugarTrabajo,

                    datos.estado

                ]
                .filter(Boolean)
                .join(" ")
                .toLowerCase();


                return contenido.includes(
                    busqueda
                );

            }
        );


        mostrarLista(
            filtrados
        );

    }
);


/* =====================================================
   AUTENTICACIÓN
===================================================== */

console.log(
    "GESBASE: esperando autenticación..."
);


onAuthStateChanged(
    auth,
    async usuario => {

        console.log(
            "GESBASE AUTH:",
            usuario
                ? usuario.email
                : "SIN SESIÓN"
        );


        if(
            !usuario
        ){

            cargando.textContent =
            "⚠️ No hay una sesión iniciada.";

            setTimeout(
                () => {

                    window.location.href =
                    "login.html";

                },
                1000
            );

            return;

        }


        usuarioActual =
        usuario;


        await cargarPresupuestos();

    }
);


/* =====================================================
   CONTROL DE ESPERA
===================================================== */

setTimeout(
    function(){

        if(
            cargando.style.display !==
            "none"
        ){

            mostrarError(
                new Error(
                    "Firebase no respondió dentro del tiempo esperado. " +
                    "Revisá Js/firebase.js y la conexión con Firebase."
                )
            );

        }

    },
    12000
);

</script>

</body>

</html>
