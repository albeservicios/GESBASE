/* =====================================================
   FIREBASE
   IMPORTANTE:
   ESTA ES LA MISMA RUTA QUE USA presupuesto.html
===================================================== */

import {
    auth,
    db
} from "./Js/firebase.js";


import {
    onAuthStateChanged
} from "https://www.gstatic.com/firebasejs/12.18.0/firebase-auth.js";


import {
    collection,
    getDocs,
    query,
    where
} from "https://www.gstatic.com/firebasejs/12.18.0/firebase-firestore.js";


/* =====================================================
   ELEMENTOS
===================================================== */

const cargando =
document.getElementById("cargando");

const errorElemento =
document.getElementById("error");

const listaElemento =
document.getElementById("lista");

const buscar =
document.getElementById("buscar");

const estadoConexion =
document.getElementById("estadoConexion");


/* =====================================================
   VARIABLES
===================================================== */

let presupuestos = [];

let usuarioActual = null;


/* =====================================================
   ESCAPAR HTML
===================================================== */

function escapar(valor){

    return String(valor ?? "")
        .replaceAll("&","&amp;")
        .replaceAll("<","&lt;")
        .replaceAll(">","&gt;")
        .replaceAll('"',"&quot;")
        .replaceAll("'","&#039;");

}


/* =====================================================
   CONVERTIR A NÚMERO
===================================================== */

function numero(valor){

    if(
        valor === null ||
        valor === undefined ||
        valor === ""
    ){

        return 0;

    }


    if(typeof valor === "number"){

        return Number.isFinite(valor)
            ? valor
            : 0;

    }


    let texto =
    String(valor)
        .trim()
        .replace(/\$/g,"")
        .replace(/\s/g,"");


    if(texto.includes(",")){

        texto =
        texto
            .replace(/\./g,"")
            .replace(",",".");
    }


    const resultado =
    Number(texto);


    return Number.isFinite(resultado)
        ? resultado
        : 0;

}


/* =====================================================
   DINERO
===================================================== */

function dinero(valor){

    return numero(valor)
        .toLocaleString(
            "es-AR",
            {
                minimumFractionDigits:2,
                maximumFractionDigits:2
            }
        );

}


/* =====================================================
   CLIENTE
===================================================== */

function obtenerCliente(datos){

    return (

        datos.cliente ||

        datos.nombreCliente ||

        datos.clienteNombre ||

        datos.nombreEmpresaCliente ||

        datos.empresaCliente ||

        "Sin cliente"

    );

}


/* =====================================================
   NÚMERO
===================================================== */

function obtenerNumero(datos,id){

    return (

        datos.numeroAgenda ||

        datos.numero ||

        datos.numeroPresupuesto ||

        datos.codigo ||

        datos.nro ||

        id.substring(0,8)

    );

}


/* =====================================================
   FECHA
===================================================== */

function obtenerFecha(datos){

    if(datos.fecha){

        return String(datos.fecha);

    }


    if(
        datos.creado &&
        typeof datos.creado.toDate === "function"
    ){

        return datos.creado
            .toDate()
            .toLocaleDateString("es-AR");

    }


    if(
        datos.fechaCreacion &&
        typeof datos.fechaCreacion.toDate === "function"
    ){

        return datos.fechaCreacion
            .toDate()
            .toLocaleDateString("es-AR");

    }


    return "Sin fecha";

}


/* =====================================================
   DESCRIPCIÓN
===================================================== */

function obtenerDescripcion(datos){

    return (

        datos.descripcion ||

        datos.tareas ||

        datos.titulo ||

        datos.concepto ||

        datos.detalle ||

        "Presupuesto sin descripción"

    );

}


/* =====================================================
   TOTAL
===================================================== */

function obtenerTotal(datos){

    const totalGuardado =
    numero(
        datos.total ??
        datos.totalFinal ??
        datos.importe ??
        datos.monto
    );


    if(totalGuardado !== 0){

        return totalGuardado;

    }


    return (

        numero(
            datos.materiales ??
            datos.importeMaterial
        )

        +

        numero(
            datos.manoObra ??
            datos.importeManoObra
        )

        +

        numero(
            datos.viaticos ??
            datos.importeViaticos
        )

        +

        numero(
            datos.flete ??
            datos.importeFlete
        )

    );

}


/* =====================================================
   MOSTRAR ERROR
===================================================== */

function mostrarError(error){

    console.error(
        "GESBASE - ERROR:",
        error
    );


    cargando.style.display =
    "none";


    listaElemento.style.display =
    "none";


    let detalle =
    "Error desconocido.";


    if(error){

        if(error.code){

            detalle +=
            "\nCódigo: " +
            error.code;

        }


        if(error.message){

            detalle +=
            "\nDetalle: " +
            error.message;

        }

    }


    errorElemento.textContent =
    "No se pudieron cargar los presupuestos.\n\n" +
    detalle;


    errorElemento.style.display =
    "block";

}


/* =====================================================
   CARGAR TODOS LOS PRESUPUESTOS
===================================================== */

async function cargarPresupuestos(){

    if(!usuarioActual){

        return;

    }


    cargando.style.display =
    "block";

    errorElemento.style.display =
    "none";

    listaElemento.style.display =
    "none";


    estadoConexion.style.display =
    "block";

    estadoConexion.textContent =
    "Usuario conectado. Consultando presupuestos...";


    try{

        /*
         * IMPORTANTE:
         *
         * Primero hacemos una lectura GENERAL
         * de la colección.
         *
         * Las reglas actuales permiten leerla
         * a cualquier usuario autenticado.
         *
         * Esto evita que el listado quede vacío
         * por diferencias entre uid / usuarioId /
         * empresaId.
         */

        const referencia =
        collection(
            db,
            "presupuestos"
        );


        const resultado =
        await getDocs(
            referencia
        );


        presupuestos = [];


        resultado.forEach(
            function(documento){

                const datos =
                documento.data();


                /*
                 * Aceptamos presupuestos vinculados
                 * por cualquiera de estos campos.
                 */

                const perteneceUsuario =

                    datos.uid ===
                    usuarioActual.uid

                    ||

                    datos.usuarioId ===
                    usuarioActual.uid

                    ||

                    datos.userId ===
                    usuarioActual.uid

                    ||

                    datos.creadoPor ===
                    usuarioActual.uid;


                /*
                 * Si tiene empresaId también
                 * intentamos verificarlo más adelante.
                 *
                 * Por ahora, si pertenece al usuario,
                 * lo mostramos.
                 */

                if(perteneceUsuario){

                    presupuestos.push({

                        id:
                        documento.id,

                        datos:
                        datos

                    });

                }

            }
        );


        /*
         * =================================================
         * SEGUNDO MÉTODO:
         * Algunos presupuestos pueden estar guardados
         * solamente con empresaId.
         * =================================================
         */

        let empresaIdUsuario = "";


        try{

            const referenciaUsuarios =
            collection(
                db,
                "usuarios"
            );


            /*
             * No consultamos usuarios completos.
             * Buscamos específicamente el documento
             * del UID actual.
             *
             * Como las reglas permiten al usuario
             * leer su propio documento, esto funciona.
             */

            const consultaUsuario =
            query(
                referenciaUsuarios,
                where(
                    "__name__",
                    "==",
                    usuarioActual.uid
                )
            );


            const resultadoUsuario =
            await getDocs(
                consultaUsuario
            );


            if(!resultadoUsuario.empty){

                const datosUsuario =
                resultadoUsuario.docs[0].data();


                empresaIdUsuario =
                String(
                    datosUsuario.empresaId ||
                    datosUsuario.empresa ||
                    ""
                ).trim();

            }

        }
        catch(errorUsuario){

            console.warn(
                "No se pudo obtener empresaId:",
                errorUsuario
            );

        }


        /*
         * Si tenemos empresaId buscamos
         * presupuestos de esa empresa.
         */

        if(empresaIdUsuario){

            try{

                const consultaEmpresa =
                query(
                    referencia,
                    where(
                        "empresaId",
                        "==",
                        empresaIdUsuario
                    )
                );


                const resultadoEmpresa =
                await getDocs(
                    consultaEmpresa
                );


                resultadoEmpresa.forEach(
                    function(documento){

                        const existe =
                        presupuestos.some(
                            function(item){

                                return (
                                    item.id ===
                                    documento.id
                                );

                            }
                        );


                        if(!existe){

                            presupuestos.push({

                                id:
                                documento.id,

                                datos:
                                documento.data()

                            });

                        }

                    }
                );

            }
            catch(errorEmpresa){

                console.warn(
                    "No se pudo consultar empresaId:",
                    errorEmpresa
                );

            }

        }


        /*
         * =================================================
         * ORDENAR
         * =================================================
         */

        presupuestos.sort(
            function(a,b){

                const fechaA =
                    a.datos.creado?.seconds ||

                    a.datos.fechaCreacion?.seconds ||

                    0;


                const fechaB =
                    b.datos.creado?.seconds ||

                    b.datos.fechaCreacion?.seconds ||

                    0;


                return fechaB - fechaA;

            }
        );


        estadoConexion.textContent =
        "Presupuestos encontrados: " +
        presupuestos.length;


        mostrarPresupuestos(
            presupuestos
        );

    }
    catch(error){

        mostrarError(
            error
        );

    }

}


/* =====================================================
   MOSTRAR PRESUPUESTOS
===================================================== */

function mostrarPresupuestos(lista){

    cargando.style.display =
    "none";


    errorElemento.style.display =
    "none";


    listaElemento.style.display =
    "flex";


    if(!lista.length){

        listaElemento.innerHTML = `

            <div class="mensaje">

                Todavía no tenés presupuestos registrados.

                <br><br>

                <a
                    href="presupuesto.html"
                    class="boton nuevo"
                >
                    ➕ CREAR PRESUPUESTO
                </a>

            </div>

        `;

        return;

    }


    listaElemento.innerHTML = "";


    lista.forEach(
        function(item){

            const datos =
            item.datos;


            const numeroPresupuesto =
            obtenerNumero(
                datos,
                item.id
            );


            const cliente =
            obtenerCliente(
                datos
            );


            const descripcion =
            obtenerDescripcion(
                datos
            );


            const fecha =
            obtenerFecha(
                datos
            );


            const total =
            obtenerTotal(
                datos
            );


            const estado =
            datos.estado ||

            datos.estadoPresupuesto ||

            "Pendiente";


            const elemento =
            document.createElement(
                "article"
            );


            elemento.className =
            "presupuesto";


            elemento.innerHTML = `

                <div class="presupuesto-cabecera">

                    <div class="presupuesto-numero">

                        Presupuesto N.º
                        ${escapar(
                            numeroPresupuesto
                        )}

                    </div>

                    <span class="estado">

                        ${escapar(
                            estado
                        )}

                    </span>

                </div>


                <div class="dato">

                    <strong>Cliente:</strong>

                    ${escapar(
                        cliente
                    )}

                </div>


                <div class="dato">

                    <strong>Fecha:</strong>

                    ${escapar(
                        fecha
                    )}

                </div>


                <div class="dato">

                    <strong>Descripción:</strong>

                    ${escapar(
                        descripcion
                    )}

                </div>


                <div class="total">

                    Total:
                    $ ${dinero(total)}

                </div>


                <div class="acciones">

                    <a
                        class="accion ver"
                        href="ver-presupuesto.html?id=${encodeURIComponent(item.id)}"
                    >
                        👁️ VER
                    </a>


                    <a
                        class="accion editar"
                        href="editar-presupuesto.html?id=${encodeURIComponent(item.id)}"
                    >
                        ✏️ EDITAR
                    </a>


                    <a
                        class="accion trabajo"
                        href="trabajo.html?presupuestoId=${encodeURIComponent(item.id)}"
                    >
                        🔧 CREAR TRABAJO
                    </a>

                </div>

            `;


            listaElemento.appendChild(
                elemento
            );

        }
    );

}


/* =====================================================
   BUSCADOR
===================================================== */

buscar.addEventListener(
    "input",
    function(){

        const textoBusqueda =
        buscar.value
            .toLowerCase()
            .trim();


        if(!textoBusqueda){

            mostrarPresupuestos(
                presupuestos
            );

            return;

        }


        const filtrados =
        presupuestos.filter(
            function(item){

                const datos =
                item.datos;


                const contenido = (

                    obtenerNumero(
                        datos,
                        item.id
                    )

                    + " " +

                    obtenerCliente(
                        datos
                    )

                    + " " +

                    obtenerDescripcion(
                        datos
                    )

                    + " " +

                    obtenerFecha(
                        datos
                    )

                ).toLowerCase();


                return contenido.includes(
                    textoBusqueda
                );

            }
        );


        mostrarPresupuestos(
            filtrados
        );

    }
);


/* =====================================================
   AUTENTICACIÓN
===================================================== */

onAuthStateChanged(
    auth,
    async function(usuario){

        console.log(
            "GESBASE - Auth:",
            usuario
                ? usuario.uid
                : "SIN SESIÓN"
        );


        if(!usuario){

            estadoConexion.style.display =
            "block";

            estadoConexion.textContent =
            "No hay una sesión iniciada. Redirigiendo al login...";


            setTimeout(
                function(){

                    window.location.replace(
                        "./login.html"
                    );

                },
                500
            );


            return;

        }


        usuarioActual =
        usuario;


        await cargarPresupuestos();

    }
);


/* =====================================================
   CONTROL DE TIEMPO
===================================================== */

setTimeout(
    function(){

        if(
            cargando.style.display !==
            "none"
        ){

            mostrarError({

                code:
                "timeout",

                message:
                "Firebase no respondió dentro del tiempo esperado."

            });

        }

    },
    15000
);

</script>
