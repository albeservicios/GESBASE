<!DOCTYPE html>
<html lang="es">

<head>

<meta charset="UTF-8">

<meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
>

<meta
    name="theme-color"
    content="#111827"
>

<title>Mis presupuestos - GESBASE</title>

<style>

* {
    box-sizing: border-box;
    margin: 0;
    padding: 0;
}

body {
    font-family: Arial, sans-serif;
    background: #f3f4f6;
    color: #111827;
}

.contenedor {
    max-width: 600px;
    margin: auto;
    min-height: 100vh;
    background: white;
}

header {
    background: #111827;
    color: white;
    padding: 25px 20px;
}

header h1 {
    font-size: 25px;
}

header p {
    margin-top: 6px;
    font-size: 14px;
    color: #d1d5db;
}

main {
    padding: 20px;
}

.usuario {
    background: #f3f4f6;
    padding: 13px;
    border-radius: 10px;
    margin-bottom: 18px;
    font-size: 14px;
}

.cargando {
    text-align: center;
    padding: 35px 10px;
    color: #6b7280;
}

.lista {
    display: flex;
    flex-direction: column;
    gap: 14px;
}

.presupuesto {
    padding: 17px;
    border: 1px solid #e5e7eb;
    border-radius: 12px;
    background: white;
    box-shadow: 0 2px 7px rgba(0,0,0,.06);
}

.presupuesto h2 {
    font-size: 18px;
    margin-bottom: 8px;
}

.dato {
    margin-top: 7px;
    font-size: 14px;
    color: #4b5563;
}

.descripcion {
    margin-top: 10px;
    line-height: 1.45;
    color: #374151;
}

.total {
    margin-top: 13px;
    font-size: 20px;
    font-weight: bold;
}

.sin-presupuestos {
    text-align: center;
    padding: 30px 15px;
    color: #6b7280;
}

.error {
    background: #fee2e2;
    color: #991b1b;
    padding: 14px;
    border-radius: 10px;
    margin-bottom: 15px;
    display: none;
}

.botones {
    margin-top: 20px;
}

button {
    width: 100%;
    padding: 15px;
    border: none;
    border-radius: 10px;
    font-size: 16px;
    font-weight: bold;
    cursor: pointer;
    margin-bottom: 10px;
}

.nuevo {
    background: #111827;
    color: white;
}

.volver {
    background: #e5e7eb;
    color: #111827;
}

</style>

</head>

<body>

<div class="contenedor">

<header>

<h1>
Mis presupuestos
</h1>

<p>
GESBASE
</p>

</header>


<main>

<div
    id="usuario"
    class="usuario"
>
Verificando usuario...
</div>


<div
    id="error"
    class="error"
></div>


<div
    id="cargando"
    class="cargando"
>
Cargando presupuestos...
</div>


<div
    id="lista"
    class="lista"
></div>


<div
    id="sinPresupuestos"
    class="sin-presupuestos"
    style="display:none;"
>

Todavía no tenés presupuestos.

</div>


<div class="botones">

<button
    class="nuevo"
    id="btnNuevo"
>
+ Nuevo presupuesto
</button>


<button
    class="volver"
    id="btnVolver"
>
Volver a GESBASE
</button>

</div>

</main>

</div>


<script type="module">

// ==========================================
// FIREBASE
// ==========================================

import {
    auth,
    db
} from "./Js/firebase.js";


import {
    onAuthStateChanged
} from
"https://www.gstatic.com/firebasejs/12.1.0/firebase-auth.js";


import {
    collection,
    query,
    where,
    getDocs
} from
"https://www.gstatic.com/firebasejs/12.1.0/firebase-firestore.js";


// ==========================================
// ELEMENTOS
// ==========================================

const usuarioElemento =
document.getElementById(
    "usuario"
);

const cargando =
document.getElementById(
    "cargando"
);

const lista =
document.getElementById(
    "lista"
);

const sinPresupuestos =
document.getElementById(
    "sinPresupuestos"
);

const errorElemento =
document.getElementById(
    "error"
);


// ==========================================
// MOSTRAR ERROR
// ==========================================

function mostrarError(texto) {

    errorElemento.textContent =
        texto;

    errorElemento.style.display =
        "block";

}


// ==========================================
// FORMATEAR DINERO
// ==========================================

function dinero(valor) {

    return Number(valor || 0)
        .toLocaleString(
            "es-AR",
            {
                minimumFractionDigits: 2,
                maximumFractionDigits: 2
            }
        );

}


// ==========================================
// CARGAR PRESUPUESTOS
// ==========================================

async function cargarPresupuestos(
    usuario
) {

    try {

        usuarioElemento.textContent =
            "Usuario: " + usuario.email;


        const referencia =
            collection(
                db,
                "presupuestos"
            );


        const consulta =
            query(
                referencia,
                where(
                    "uid",
                    "==",
                    usuario.uid
                )
            );


        const resultado =
            await getDocs(
                consulta
            );


        cargando.style.display =
            "none";


        if (
            resultado.empty
        ) {

            sinPresupuestos.style.display =
                "block";

            return;

        }


        lista.innerHTML = "";


        resultado.forEach(
            function(documento) {

                const datos =
                    documento.data();


                const tarjeta =
                    document.createElement(
                        "div"
                    );

                tarjeta.className =
                    "presupuesto";


                tarjeta.innerHTML = `

                    <h2>
                        ${datos.cliente || "Sin cliente"}
                    </h2>

                    <div class="dato">
                        📅 Fecha:
                        ${datos.fecha || "-"}
                    </div>

                    <div class="descripcion">
                        ${datos.descripcion || "Sin descripción"}
                    </div>

                    <div class="dato">
                        Materiales:
                        $${dinero(datos.materiales)}
                    </div>

                    <div class="dato">
                        Mano de obra:
                        $${dinero(datos.manoObra)}
                    </div>

                    <div class="dato">
                        Viáticos:
                        $${dinero(datos.viaticos)}
                    </div>

                    <div class="total">
                        Total:
                        $${dinero(datos.total)}
                    </div>

                `;


                lista.appendChild(
                    tarjeta
                );

            }
        );


    } catch (error) {

        console.error(
            "Error cargando presupuestos:",
            error
        );


        cargando.style.display =
            "none";


        mostrarError(
            "No se pudieron cargar los presupuestos: " +
            error.message
        );

    }

}


// ==========================================
// CONTROL DE SESIÓN
// ==========================================

onAuthStateChanged(
    auth,
    async function(usuario) {

        if (!usuario) {

            window.location.replace(
                "login.html"
            );

            return;

        }


        await cargarPresupuestos(
            usuario
        );

    }
);


// ==========================================
// NUEVO PRESUPUESTO
// ==========================================

document
.getElementById("btnNuevo")
.addEventListener(
    "click",
    function() {

        window.location.href =
            "presupuesto.html";

    }
);


// ==========================================
// VOLVER
// ==========================================

document
.getElementById("btnVolver")
.addEventListener(
    "click",
    function() {

        window.location.href =
            "index.html";

    }
);

</script>

</body>

</html>
