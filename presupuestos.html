/* ==========================================
   FIREBASE
========================================== */

import {
    auth,
    db
} from "./firebase.js";


import {
    onAuthStateChanged
} from "https://www.gstatic.com/firebasejs/12.18.0/firebase-auth.js";


import {
    collection,
    query,
    where,
    getDocs
} from "https://www.gstatic.com/firebasejs/12.18.0/firebase-firestore.js";


/* ==========================================
   ELEMENTOS
========================================== */

const cargando =
    document.getElementById("cargando");

const errorElemento =
    document.getElementById("error");

const listaElemento =
    document.getElementById("lista");

const buscar =
    document.getElementById("buscar");

const infoUsuario =
    document.getElementById("infoUsuario");


/* ==========================================
   VARIABLES
========================================== */

let presupuestos = [];

let usuarioActual = null;


/* ==========================================
   ESCAPAR HTML
========================================== */

function escapar(valor){

    return String(valor ?? "")
        .replaceAll("&","&amp;")
        .replaceAll("<","&lt;")
        .replaceAll(">","&gt;")
        .replaceAll('"',"&quot;")
        .replaceAll("'","&#039;");

}


/* ==========================================
   CONVERTIR NUMERO
========================================== */

function numero(valor){

    if(
        valor === undefined ||
        valor === null ||
        valor === ""
    ){

        return 0;

    }


    if(
        typeof valor === "number"
    ){

        return Number.isFinite(valor)
            ? valor
            : 0;

    }


    let texto =
        String(valor)
        .trim()
        .replace(/\s/g,"")
        .replace(/\$/g,"");


    /*
     * Formato argentino:
     *
     * 1.250.500,50
     */

    if(texto.includes(",")){

        texto =
            texto
            .replace(/\./g,"")
            .replace(",",".");
    }


    const resultado =
        Number(texto);


    return Number.isFinite(resultado)
        ? resultado
        : 0;

}


/* ==========================================
   DINERO
========================================== */

function dinero(valor){

    return numero(valor).toLocaleString(
        "es-AR",
        {
            minimumFractionDigits:2,
            maximumFractionDigits:2
        }
    );

}


/* ==========================================
   OBTENER CLIENTE
========================================== */

function obtenerCliente(datos){

    return (

        datos.cliente ||

        datos.nombreCliente ||

        datos.clienteNombre ||

        datos.nombreEmpresaCliente ||

        datos.empresaCliente ||

        datos.clienteNombreCompleto ||

        "Sin cliente"

    );

}


/* ==========================================
   OBTENER NUMERO
========================================== */

function obtenerNumero(
    datos,
    id
){

    return (

        datos.numero ||

        datos.numeroPresupuesto ||

        datos.codigo ||

        datos.nro ||

        datos.numeroAgenda ||

        id.substring(0,8)

    );

}


/* ==========================================
   OBTENER FECHA
========================================== */

function obtenerFecha(datos){

    if(datos.fecha){

        return String(
            datos.fecha
        );

    }


    if(
        datos.creado &&
        typeof datos.creado.toDate === "function"
    ){

        try{

            return datos.creado
                .toDate()
                .toLocaleDateString("es-AR");

        }
        catch(error){

            console.warn(
                "No se pudo convertir fecha:",
                error
            );

        }

    }


    if(
        datos.fechaCreacion &&
        typeof datos.fechaCreacion.toDate === "function"
    ){

        try{

            return datos.fechaCreacion
                .toDate()
                .toLocaleDateString("es-AR");

        }
        catch(error){

            console.warn(
                "No se pudo convertir fechaCreacion:",
                error
            );

        }

    }


    return "Sin fecha";

}


/* ==========================================
   DESCRIPCIÓN
========================================== */

function obtenerDescripcion(datos){

    return (

        datos.descripcion ||

        datos.tareas ||

        datos.titulo ||

        datos.concepto ||

        datos.detalle ||

        "Presupuesto sin descripción"

    );

}


/* ==========================================
   TOTAL
========================================== */

function obtenerTotal(datos){

    /*
     * Primero intentamos usar el total
     * guardado.
     */

    const guardado =
        numero(
            datos.total ??
            datos.totalFinal ??
            datos.importe ??
            datos.monto
        );


    if(guardado > 0){

        return guardado;

    }


    /*
     * Si no existe total guardado,
     * lo calculamos.
     */

    const materiales =
        numero(
            datos.materiales ??
            datos.importeMaterial ??
            datos.valorMateriales
        );


    const manoObra =
        numero(
            datos.manoObra ??
            datos.importeManoObra ??
            datos.valorManoObra
        );


    const viaticos =
        numero(
            datos.viaticos ??
            datos.importeViaticos ??
            datos.valorViaticos
        );


    const flete =
        numero(
            datos.flete ??
            datos.importeFlete ??
            datos.valorFlete
        );


    return (
        materiales +
        manoObra +
        viaticos +
        flete
    );

}


/* ==========================================
   PERTENECE AL USUARIO
========================================== */

function perteneceAlUsuario(datos){

    if(!usuarioActual){

        return false;

    }


    const uid =
        usuarioActual.uid;


    /*
     * Estructura principal.
     */

    if(
        datos.uid &&
        datos.uid === uid
    ){

        return true;

    }


    /*
     * Estructura anterior.
     */

    if(
        datos.usuarioId &&
        datos.usuarioId === uid
    ){

        return true;

    }


    /*
     * Otra estructura posible.
     */

    if(
        datos.userId &&
        datos.userId === uid
    ){

        return true;

    }


    /*
     * Compatibilidad con empresaId.
     */

    if(
        datos.empresaId &&
        datos.empresaId === uid
    ){

        return true;

    }


    return false;

}


/* ==========================================
   AGREGAR SIN DUPLICADOS
========================================== */

function agregarResultados(
    resultado
){

    resultado.forEach(
        function(documento){

            const existe =
                presupuestos.some(
                    function(item){

                        return (
                            item.id ===
                            documento.id
                        );

                    }
                );


            if(existe){

                return;

            }


            const datos =
                documento.data();


            /*
             * Seguridad adicional:
             * aunque la consulta sea por un campo,
             * comprobamos pertenencia.
             */

            if(
                perteneceAlUsuario(datos)
            ){

                presupuestos.push({

                    id:
                        documento.id,

                    datos:
                        datos

                });

            }

        }
    );

}


/* ==========================================
   CONSULTAR CAMPO
========================================== */

async function consultarCampo(
    referencia,
    campo
){

    try{

        const consulta =
            query(
                referencia,
                where(
                    campo,
                    "==",
                    usuarioActual.uid
                )
            );


        const resultado =
            await getDocs(
                consulta
            );


        console.log(
            "GESBASE - Campo",
            campo,
            "documentos:",
            resultado.size
        );


        agregarResultados(
            resultado
        );

    }
    catch(error){

        console.warn(
            "GESBASE - No se pudo consultar",
            campo,
            error.message
        );

    }

}


/* ==========================================
   CARGAR PRESUPUESTOS
========================================== */

async function cargarPresupuestos(){

    cargando.style.display =
        "block";

    listaElemento.style.display =
        "none";

    errorElemento.style.display =
        "none";


    presupuestos = [];


    try{

        if(!usuarioActual){

            throw new Error(
                "No hay un usuario autenticado."
            );

        }


        console.log(
            "================================="
        );

        console.log(
            "GESBASE - CARGANDO PRESUPUESTOS"
        );

        console.log(
            "UID:",
            usuarioActual.uid
        );

        console.log(
            "EMAIL:",
            usuarioActual.email
        );

        console.log(
            "================================="
        );


        infoUsuario.innerHTML =
            "Usuario: <strong>" +
            escapar(
                usuarioActual.email ||
                usuarioActual.uid
            ) +
            "</strong>";

        infoUsuario.style.display =
            "block";


        const referencia =
            collection(
                db,
                "presupuestos"
            );


        /*
         * BUSCAMOS TODAS LAS ESTRUCTURAS
         * QUE YA UTILIZA GESBASE.
         *
         * Esto evita que los presupuestos
         * antiguos desaparezcan.
         */

        await consultarCampo(
            referencia,
            "uid"
        );


        await consultarCampo(
            referencia,
            "usuarioId"
        );


        await consultarCampo(
            referencia,
            "userId"
        );


        await consultarCampo(
            referencia,
            "empresaId"
        );


        /*
         * Ordenar por fecha.
         */

        presupuestos.sort(
            function(a,b){

                const fechaA =
                    a.datos.creado?.seconds ||
                    a.datos.fechaCreacion?.seconds ||
                    0;


                const fechaB =
                    b.datos.creado?.seconds ||
                    b.datos.fechaCreacion?.seconds ||
                    0;


                return fechaB - fechaA;

            }
        );


        console.log(
            "GESBASE - PRESUPUESTOS ENCONTRADOS:",
            presupuestos.length
        );


        mostrarPresupuestos(
            presupuestos
        );

    }
    catch(error){

        console.error(
            "ERROR PRESUPUESTOS:",
            error
        );


        cargando.style.display =
            "none";


        listaElemento.style.display =
            "none";


        errorElemento.textContent =
            "No se pudieron cargar los presupuestos.\n\n" +
            "Detalle: " +
            error.message;


        errorElemento.style.display =
            "block";

    }

}


/* ==========================================
   MOSTRAR PRESUPUESTOS
========================================== */

function mostrarPresupuestos(lista){

    cargando.style.display =
        "none";


    errorElemento.style.display =
        "none";


    listaElemento.style.display =
        "flex";


    if(!lista.length){

        listaElemento.innerHTML = `

            <div class="vacio">

                <strong>
                    Todavía no tenés presupuestos registrados.
                </strong>

                <br><br>

                Si ya creaste un presupuesto,
                verificá que haya quedado guardado
                en Firebase.

                <br><br>

                <a
                    href="presupuesto.html"
                    class="boton nuevo"
                >
                    ➕ CREAR PRESUPUESTO
                </a>

            </div>

        `;

        return;

    }


    listaElemento.innerHTML =
        "";


    lista.forEach(
        function(item){

            const datos =
                item.datos;


            const numeroPresupuesto =
                obtenerNumero(
                    datos,
                    item.id
                );


            const cliente =
                obtenerCliente(
                    datos
                );


            const descripcion =
                obtenerDescripcion(
                    datos
                );


            const fecha =
                obtenerFecha(
                    datos
                );


            const total =
                obtenerTotal(
                    datos
                );


            const estado =
                datos.estado ||

                datos.estadoPresupuesto ||

                "Pendiente";


            const elemento =
                document.createElement(
                    "article"
                );


            elemento.className =
                "presupuesto";


            elemento.innerHTML = `

                <div class="presupuesto-cabecera">

                    <div class="presupuesto-numero">

                        Presupuesto N.º
                        ${escapar(
                            numeroPresupuesto
                        )}

                    </div>


                    <span class="estado">

                        ${escapar(
                            estado
                        )}

                    </span>

                </div>


                <div class="dato">

                    <strong>
                        Cliente:
                    </strong>

                    ${escapar(
                        cliente
                    )}

                </div>


                <div class="dato">

                    <strong>
                        Fecha:
                    </strong>

                    ${escapar(
                        fecha
                    )}

                </div>


                <div class="dato">

                    <strong>
                        Descripción:
                    </strong>

                    ${escapar(
                        descripcion
                    )}

                </div>


                <div class="total">

                    Total:
                    $ ${dinero(total)}

                </div>


                <div class="acciones">

                    <a
                        class="accion ver"
                        href="ver-presupuesto.html?id=${encodeURIComponent(item.id)}"
                    >
                        👁️ VER
                    </a>


                    <a
                        class="accion editar"
                        href="editar-presupuesto.html?id=${encodeURIComponent(item.id)}"
                    >
                        ✏️ EDITAR
                    </a>


                    <a
                        class="accion trabajo"
                        href="trabajo.html?presupuestoId=${encodeURIComponent(item.id)}"
                    >
                        🔧 CREAR TRABAJO
                    </a>

                </div>

            `;


            listaElemento.appendChild(
                elemento
            );

        }
    );

}


/* ==========================================
   BUSCADOR
========================================== */

buscar.addEventListener(
    "input",
    function(){

        const texto =
            buscar.value
                .toLowerCase()
                .trim();


        if(!texto){

            mostrarPresupuestos(
                presupuestos
            );

            return;

        }


        const filtrados =
            presupuestos.filter(
                function(item){

                    const datos =
                        item.datos;


                    const contenido = (

                        obtenerNumero(
                            datos,
                            item.id
                        )

                        + " "

                        + obtenerCliente(
                            datos
                        )

                        + " "

                        + obtenerDescripcion(
                            datos
                        )

                        + " "

                        + obtenerFecha(
                            datos
                        )

                        + " "

                        + (
                            datos.lugarTrabajo ||
                            datos.lugar ||
                            ""
                        )

                    )
                    .toLowerCase();


                    return contenido.includes(
                        texto
                    );

                }
            );


        mostrarPresupuestos(
            filtrados
        );

    }
);


/* ==========================================
   AUTENTICACIÓN
========================================== */

let inicioCompletado =
    false;


onAuthStateChanged(
    auth,
    async function(usuario){

        console.log(
            "GESBASE - Estado usuario:",
            usuario
                ? usuario.uid
                : "SIN SESIÓN"
        );


        if(!usuario){

            cargando.textContent =
                "No hay una sesión activa. Redirigiendo...";


            setTimeout(
                function(){

                    window.location.replace(
                        "login.html"
                    );

                },
                800
            );


            return;

        }


        if(inicioCompletado){

            return;

        }


        inicioCompletado =
            true;


        usuarioActual =
            usuario;


        try{

            await cargarPresupuestos();

        }
        catch(error){

            console.error(
                "ERROR INICIAL:",
                error
            );


            cargando.style.display =
                "none";


            errorElemento.textContent =
                "Error inicializando presupuestos.\n\n" +
                error.message;


            errorElemento.style.display =
                "block";

        }

    }
);


/* ==========================================
   CONTROL DE TIEMPO
========================================== */

setTimeout(
    function(){

        if(
            cargando.style.display !==
            "none"
        ){

            cargando.style.display =
                "none";


            errorElemento.textContent =
                "GESBASE tardó demasiado en cargar los presupuestos.\n\n" +
                "Verificá Firebase, la sesión y las reglas de Firestore.";


            errorElemento.style.display =
                "block";

        }

    },
    15000
);

</script><
