/* ==========================================
   FIREBASE
========================================== */

import {
    auth,
    db
} from "./firebase.js";


import {
    onAuthStateChanged
} from "https://www.gstatic.com/firebasejs/12.18.0/firebase-auth.js";


import {
    collection,
    query,
    where,
    getDocs
} from "https://www.gstatic.com/firebasejs/12.18.0/firebase-firestore.js";


/* ==========================================
   ELEMENTOS
========================================== */

const cargando =
    document.getElementById("cargando");

const errorElemento =
    document.getElementById("error");

const listaElemento =
    document.getElementById("lista");

const buscar =
    document.getElementById("buscar");


/* ==========================================
   VARIABLES
========================================== */

let presupuestos = [];

let usuarioActual = null;


/* ==========================================
   ESCAPAR HTML
========================================== */

function escapar(valor){

    return String(valor ?? "")
        .replaceAll("&","&amp;")
        .replaceAll("<","&lt;")
        .replaceAll(">","&gt;")
        .replaceAll('"',"&quot;")
        .replaceAll("'","&#039;");

}


/* ==========================================
   NUMERO
========================================== */

function numero(valor){

    if(
        valor === undefined ||
        valor === null ||
        valor === ""
    ){

        return 0;

    }


    if(
        typeof valor === "number"
    ){

        return valor;

    }


    let texto =
        String(valor)
        .replace(/\s/g,"")
        .replace(/\$/g,"");


    if(texto.includes(",")){

        texto =
            texto
            .replace(/\./g,"")
            .replace(",",".");
    }


    const resultado =
        Number(texto);


    return Number.isFinite(resultado)
        ? resultado
        : 0;

}


/* ==========================================
   DINERO
========================================== */

function dinero(valor){

    return numero(valor).toLocaleString(
        "es-AR",
        {
            minimumFractionDigits:2,
            maximumFractionDigits:2
        }
    );

}


/* ==========================================
   NOMBRE CLIENTE
========================================== */

function obtenerCliente(datos){

    return (
        datos.cliente ||
        datos.nombreCliente ||
        datos.clienteNombre ||
        datos.nombreEmpresaCliente ||
        datos.empresaCliente ||
        "Sin cliente"
    );

}


/* ==========================================
   NUMERO PRESUPUESTO
========================================== */

function obtenerNumero(datos,id){

    return (
        datos.numero ||
        datos.numeroPresupuesto ||
        datos.codigo ||
        datos.nro ||
        id.substring(0,8)
    );

}


/* ==========================================
   FECHA
========================================== */

function obtenerFecha(datos){

    if(datos.fecha){

        return String(datos.fecha);

    }


    if(
        datos.creado &&
        typeof datos.creado.toDate === "function"
    ){

        return datos.creado
            .toDate()
            .toLocaleDateString("es-AR");

    }


    return "Sin fecha";

}


/* ==========================================
   DESCRIPCIÓN
========================================== */

function obtenerDescripcion(datos){

    return (
        datos.descripcion ||
        datos.tareas ||
        datos.titulo ||
        datos.concepto ||
        datos.detalle ||
        "Presupuesto sin descripción"
    );

}


/* ==========================================
   TOTAL
========================================== */

function obtenerTotal(datos){

    const guardado =
        numero(
            datos.total ??
            datos.totalFinal ??
            datos.importe ??
            datos.monto
        );


    if(guardado > 0){

        return guardado;

    }


    const materiales =
        numero(
            datos.materiales ??
            datos.importeMaterial
        );


    const manoObra =
        numero(
            datos.manoObra ??
            datos.importeManoObra
        );


    const viaticos =
        numero(
            datos.viaticos ??
            datos.importeViaticos
        );


    const flete =
        numero(
            datos.flete ??
            datos.importeFlete
        );


    return (
        materiales +
        manoObra +
        viaticos +
        flete
    );

}


/* ==========================================
   CARGAR PRESUPUESTOS
========================================== */

async function cargarPresupuestos(){

    cargando.style.display =
        "block";

    listaElemento.style.display =
        "none";

    errorElemento.style.display =
        "none";


    try{

        const referencia =
            collection(
                db,
                "presupuestos"
            );


        /*
         * Los presupuestos pertenecen
         * al usuario autenticado.
         */

        const consulta =
            query(
                referencia,
                where(
                    "uid",
                    "==",
                    usuarioActual.uid
                )
            );


        const resultado =
            await getDocs(
                consulta
            );


        presupuestos = [];


        resultado.forEach(
            function(documento){

                presupuestos.push({

                    id:
                        documento.id,

                    datos:
                        documento.data()

                });

            }
        );


        /*
         * También aceptamos documentos
         * antiguos que utilicen usuarioId.
         *
         * Si la búsqueda principal encuentra
         * resultados, no hacemos otra consulta.
         */


        if(!presupuestos.length){

            try{

                const consultaUsuario =
                    query(
                        referencia,
                        where(
                            "usuarioId",
                            "==",
                            usuarioActual.uid
                        )
                    );


                const resultadoUsuario =
                    await getDocs(
                        consultaUsuario
                    );


                resultadoUsuario.forEach(
                    function(documento){

                        /*
                         * Evitar duplicados
                         */

                        const existe =
                            presupuestos.some(
                                function(item){

                                    return (
                                        item.id ===
                                        documento.id
                                    );

                                }
                            );


                        if(!existe){

                            presupuestos.push({

                                id:
                                    documento.id,

                                datos:
                                    documento.data()

                            });

                        }

                    }
                );

            }
            catch(error){

                console.warn(
                    "No se pudo consultar usuarioId:",
                    error
                );

            }

        }


        /*
         * Ordenar por fecha
         */

        presupuestos.sort(
            function(a,b){

                const fechaA =
                    a.datos.creado?.seconds ||
                    a.datos.fechaCreacion?.seconds ||
                    0;


                const fechaB =
                    b.datos.creado?.seconds ||
                    b.datos.fechaCreacion?.seconds ||
                    0;


                return fechaB - fechaA;

            }
        );


        mostrarPresupuestos(
            presupuestos
        );

    }
    catch(error){

        console.error(
            "ERROR PRESUPUESTOS:",
            error
        );


        cargando.style.display =
            "none";


        listaElemento.style.display =
            "none";


        errorElemento.textContent =
            "No se pudieron cargar los presupuestos.\n\n" +
            "Detalle: " +
            error.message;


        errorElemento.style.display =
            "block";

    }

}


/* ==========================================
   MOSTRAR PRESUPUESTOS
========================================== */

function mostrarPresupuestos(lista){

    cargando.style.display =
        "none";


    errorElemento.style.display =
        "none";


    listaElemento.style.display =
        "flex";


    if(!lista.length){

        listaElemento.innerHTML = `

            <div class="mensaje">

                Todavía no tenés presupuestos registrados.

                <br><br>

                Podés crear uno desde el botón:

                <br><br>

                <a
                    href="presupuesto.html"
                    class="boton nuevo"
                >
                    ➕ CREAR PRESUPUESTO
                </a>

            </div>

        `;

        return;

    }


    listaElemento.innerHTML = "";


    lista.forEach(
        function(item){

            const datos =
                item.datos;


            const numeroPresupuesto =
                obtenerNumero(
                    datos,
                    item.id
                );


            const cliente =
                obtenerCliente(
                    datos
                );


            const descripcion =
                obtenerDescripcion(
                    datos
                );


            const fecha =
                obtenerFecha(
                    datos
                );


            const total =
                obtenerTotal(
                    datos
                );


            const estado =
                datos.estado ||
                datos.estadoPresupuesto ||
                "Pendiente";


            const elemento =
                document.createElement(
                    "article"
                );


            elemento.className =
                "presupuesto";


            elemento.innerHTML = `

                <div class="presupuesto-cabecera">

                    <div class="presupuesto-numero">

                        Presupuesto
                        N.º
                        ${escapar(
                            numeroPresupuesto
                        )}

                    </div>


                    <span class="estado">

                        ${escapar(
                            estado
                        )}

                    </span>

                </div>


                <div class="dato">

                    <strong>
                        Cliente:
                    </strong>

                    ${escapar(
                        cliente
                    )}

                </div>


                <div class="dato">

                    <strong>
                        Fecha:
                    </strong>

                    ${escapar(
                        fecha
                    )}

                </div>


                <div class="dato">

                    <strong>
                        Descripción:
                    </strong>

                    ${escapar(
                        descripcion
                    )}

                </div>


                <div class="total">

                    Total:
                    $ ${dinero(total)}

                </div>


                <div class="acciones">

                    <a
                        class="accion ver"
                        href="ver-presupuesto.html?id=${encodeURIComponent(item.id)}"
                    >
                        👁️ VER
                    </a>


                    <a
                        class="accion editar"
                        href="editar-presupuesto.html?id=${encodeURIComponent(item.id)}"
                    >
                        ✏️ EDITAR
                    </a>


                    <a
                        class="accion trabajo"
                        href="trabajo.html?presupuestoId=${encodeURIComponent(item.id)}"
                    >
                        🔧 CREAR TRABAJO
                    </a>

                </div>

            `;


            listaElemento.appendChild(
                elemento
            );

        }
    );

}


/* ==========================================
   BUSCAR
========================================== */

buscar.addEventListener(
    "input",
    function(){

        const texto =
            buscar.value
                .toLowerCase()
                .trim();


        if(!texto){

            mostrarPresupuestos(
                presupuestos
            );

            return;

        }


        const filtrados =
            presupuestos.filter(
                function(item){

                    const datos =
                        item.datos;


                    const contenido = (

                        obtenerNumero(
                            datos,
                            item.id
                        )

                        + " "

                        + obtenerCliente(
                            datos
                        )

                        + " "

                        + obtenerDescripcion(
                            datos
                        )

                        + " "

                        + obtenerFecha(
                            datos
                        )

                    )
                    .toLowerCase();


                    return contenido.includes(
                        texto
                    );

                }
            );


        mostrarPresupuestos(
            filtrados
        );

    }
);


/* ==========================================
   AUTENTICACIÓN
========================================== */

onAuthStateChanged(
    auth,
    async function(usuario){

        console.log(
            "GESBASE - Estado usuario:",
            usuario
                ? usuario.uid
                : "SIN SESIÓN"
        );


        if(!usuario){

            window.location.replace(
                "login.html"
            );

            return;

        }


        usuarioActual =
            usuario;


        await cargarPresupuestos();

    }
);


/* ==========================================
   CONTROL DE TIEMPO
========================================== */

setTimeout(
    function(){

        if(
            cargando.style.display !==
            "none"
        ){

            cargando.style.display =
                "none";


            errorElemento.textContent =
                "GESBASE tardó demasiado en cargar los presupuestos.\n\n" +
                "Verificá que firebase.js esté funcionando y que tengas una sesión iniciada.";


            errorElemento.style.display =
                "block";

        }

    },
    12000
);

</script></body></html>
