<!DOCTYPE html>
<html lang="es">

<head>

<meta charset="UTF-8">

<meta name="viewport" content="width=device-width, initial-scale=1.0">

<meta name="theme-color" content="#111827">

<meta name="description" content="GESBASE - Mis presupuestos">

<title>Presupuestos - GESBASE</title>

<style>

*{
    box-sizing:border-box;
    margin:0;
    padding:0;
}

body{
    font-family:Arial,sans-serif;
    background:#f3f4f6;
    color:#111827;
}

.contenedor{
    width:100%;
    max-width:900px;
    margin:auto;
    min-height:100vh;
    background:white;
}

header{
    background:#111827;
    color:white;
    padding:22px 18px;
}

header h1{
    font-size:25px;
}

header p{
    margin-top:5px;
    color:#d1d5db;
    font-size:14px;
}

main{
    padding:18px;
}

.barra{
    display:flex;
    gap:10px;
    flex-wrap:wrap;
    margin-bottom:18px;
}

.boton{
    display:block;
    padding:13px 16px;
    border-radius:10px;
    text-decoration:none;
    font-weight:bold;
    text-align:center;
    border:none;
    cursor:pointer;
    font-size:14px;
}

.nuevo{
    background:#16a34a;
    color:white;
    flex:1;
}

.volver{
    background:#e5e7eb;
    color:#111827;
    flex:1;
}

.buscar{
    width:100%;
    padding:14px;
    border:1px solid #d1d5db;
    border-radius:10px;
    font-size:15px;
    margin-bottom:15px;
}

.cargando,
.mensaje{
    padding:30px 15px;
    text-align:center;
    color:#6b7280;
}

.error{
    background:#fee2e2;
    color:#991b1b;
    padding:15px;
    border-radius:10px;
    line-height:1.5;
    white-space:pre-wrap;
}

.info{
    background:#dbeafe;
    color:#1e40af;
    padding:15px;
    border-radius:10px;
    margin-bottom:15px;
    line-height:1.5;
    display:none;
}

.lista{
    display:flex;
    flex-direction:column;
    gap:14px;
}

.presupuesto{
    border:1px solid #d1d5db;
    border-radius:12px;
    padding:17px;
    background:white;
    box-shadow:0 2px 6px rgba(0,0,0,.05);
}

.presupuesto-cabecera{
    display:flex;
    justify-content:space-between;
    gap:10px;
    align-items:flex-start;
    margin-bottom:12px;
}

.presupuesto-numero{
    font-size:17px;
    font-weight:bold;
}

.estado{
    padding:5px 9px;
    border-radius:20px;
    background:#dbeafe;
    color:#1d4ed8;
    font-size:12px;
    font-weight:bold;
}

.dato{
    margin-top:7px;
    font-size:14px;
    line-height:1.4;
}

.total{
    margin-top:12px;
    padding-top:12px;
    border-top:1px solid #e5e7eb;
    font-size:18px;
    font-weight:bold;
}

.acciones{
    display:grid;
    grid-template-columns:1fr 1fr;
    gap:8px;
    margin-top:14px;
}

.accion{
    padding:11px 8px;
    border-radius:9px;
    text-decoration:none;
    text-align:center;
    font-size:13px;
    font-weight:bold;
}

.ver{
    background:#111827;
    color:white;
}

.editar{
    background:#2563eb;
    color:white;
}

.trabajo{
    grid-column:1 / -1;
    background:#16a34a;
    color:white;
}

@media(max-width:500px){

    .presupuesto-cabecera{
        flex-direction:column;
    }

    .acciones{
        grid-template-columns:1fr;
    }

    .trabajo{
        grid-column:auto;
    }

}

</style>

</head>

<body>

<div class="contenedor">

<header>

<h1>GESBASE</h1>

<p>Mis presupuestos</p>

</header>

<main>

<div class="barra">

<a
href="presupuesto.html"
class="boton nuevo"
>
➕ NUEVO PRESUPUESTO
</a>

<a
href="index.html"
class="boton volver"
>
⬅️ VOLVER AL PANEL
</a>

</div>

<input
id="buscar"
class="buscar"
type="search"
placeholder="🔎 Buscar presupuesto, cliente o descripción..."
>

<div
id="info"
class="info"
></div>

<div
id="cargando"
class="cargando"
>
Cargando presupuestos...
</div>

<div
id="error"
class="error"
style="display:none;"
></div>

<div
id="lista"
class="lista"
style="display:none;"
></div>

</main>

</div>


<script type="module">

/* =====================================================
   FIREBASE
===================================================== */

import {
    auth,
    db
} from "./Js/firebase.js";

import {
    onAuthStateChanged
} from "https://www.gstatic.com/firebasejs/12.18.0/firebase-auth.js";

import {
    collection,
    getDocs
} from "https://www.gstatic.com/firebasejs/12.18.0/firebase-firestore.js";


/* =====================================================
   ELEMENTOS
===================================================== */

const cargando =
document.getElementById("cargando");

const errorElemento =
document.getElementById("error");

const listaElemento =
document.getElementById("lista");

const buscar =
document.getElementById("buscar");

const info =
document.getElementById("info");


/* =====================================================
   VARIABLES
===================================================== */

let usuarioActual = null;

let todosLosPresupuestos = [];

let empresaIdActual = "";


/* =====================================================
   TEXTO
===================================================== */

function texto(valor){

    if(
        valor === undefined ||
        valor === null
    ){
        return "";
    }

    return String(valor).trim();

}


/* =====================================================
   ESCAPAR HTML
===================================================== */

function escapar(valor){

    return texto(valor)
        .replaceAll("&","&amp;")
        .replaceAll("<","&lt;")
        .replaceAll(">","&gt;")
        .replaceAll('"',"&quot;")
        .replaceAll("'","&#039;");

}


/* =====================================================
   NUMERO
===================================================== */

function numero(valor){

    if(
        valor === undefined ||
        valor === null ||
        valor === ""
    ){
        return 0;
    }

    if(typeof valor === "number"){

        return Number.isFinite(valor)
            ? valor
            : 0;

    }

    let valorTexto =
    String(valor)
        .replace(/\$/g,"")
        .replace(/\s/g,"");

    if(valorTexto.includes(",")){

        valorTexto =
        valorTexto
        .replace(/\./g,"")
        .replace(",",".");
    }

    const resultado =
    Number(valorTexto);

    return Number.isFinite(resultado)
        ? resultado
        : 0;

}


/* =====================================================
   DINERO
===================================================== */

function dinero(valor){

    return numero(valor)
        .toLocaleString(
            "es-AR",
            {
                minimumFractionDigits:2,
                maximumFractionDigits:2
            }
        );

}


/* =====================================================
   CLIENTE
===================================================== */

function obtenerCliente(datos){

    return (
        datos.cliente ||
        datos.nombreCliente ||
        datos.clienteNombre ||
        datos.nombreEmpresaCliente ||
        datos.empresaCliente ||
        "Sin cliente"
    );

}


/* =====================================================
   NUMERO PRESUPUESTO
===================================================== */

function obtenerNumero(datos,id){

    return (
        datos.numeroAgenda ||
        datos.numero ||
        datos.numeroPresupuesto ||
        datos.codigo ||
        datos.nro ||
        id.substring(0,8)
    );

}


/* =====================================================
   FECHA
===================================================== */

function obtenerFecha(datos){

    if(datos.fecha){

        return texto(datos.fecha);

    }

    if(
        datos.creado &&
        typeof datos.creado.toDate === "function"
    ){

        return datos.creado
            .toDate()
            .toLocaleDateString("es-AR");

    }

    if(
        datos.fechaCreacion &&
        typeof datos.fechaCreacion.toDate === "function"
    ){

        return datos.fechaCreacion
            .toDate()
            .toLocaleDateString("es-AR");

    }

    return "Sin fecha";

}


/* =====================================================
   DESCRIPCION
===================================================== */

function obtenerDescripcion(datos){

    return (
        datos.descripcion ||
        datos.tareas ||
        datos.titulo ||
        datos.concepto ||
        datos.detalle ||
        "Presupuesto sin descripción"
    );

}


/* =====================================================
   TOTAL
===================================================== */

function obtenerTotal(datos){

    const totalGuardado =
    numero(
        datos.total ??
        datos.totalFinal ??
        datos.importe ??
        datos.monto
    );

    if(totalGuardado > 0){

        return totalGuardado;

    }

    return (
        numero(
            datos.materiales ??
            datos.importeMaterial
        )
        +
        numero(
            datos.manoObra ??
            datos.importeManoObra
        )
        +
        numero(
            datos.viaticos ??
            datos.importeViaticos
        )
        +
        numero(
            datos.flete ??
            datos.importeFlete
        )
    );

}


/* =====================================================
   OBTENER EMPRESA
===================================================== */

async function obtenerEmpresa(){

    if(!usuarioActual){

        return "";

    }

    try{

        /*
         * IMPORTANTE:
         * collection() recibe directamente db.
         */

        const referencia =
        collection(
            db,
            "usuarios"
        );

        const resultado =
        await getDocs(
            referencia
        );

        const documento =
        resultado.docs.find(
            doc =>
            doc.id === usuarioActual.uid
        );

        if(!documento){

            return "";

        }

        const datos =
        documento.data();

        return (
            texto(datos.empresaId) ||
            texto(datos.empresa) ||
            ""
        );

    }
    catch(error){

        console.warn(
            "No se pudo obtener empresa:",
            error
        );

        return "";

    }

}


/* =====================================================
   CARGAR PRESUPUESTOS
===================================================== */

async function cargarPresupuestos(){

    cargando.style.display =
    "block";

    listaElemento.style.display =
    "none";

    errorElemento.style.display =
    "none";

    info.style.display =
    "none";


    try{

        if(!usuarioActual){

            throw new Error(
                "No hay usuario autenticado."
            );

        }


        console.log(
            "GESBASE: cargando presupuestos"
        );

        console.log(
            "UID:",
            usuarioActual.uid
        );


        empresaIdActual =
        await obtenerEmpresa();


        console.log(
            "Empresa:",
            empresaIdActual
        );


        /*
         * CARGAMOS LA COLECCION
         */

        const referencia =
        collection(
            db,
            "presupuestos"
        );


        const resultado =
        await getDocs(
            referencia
        );


        console.log(
            "Total documentos:",
            resultado.size
        );


        todosLosPresupuestos = [];


        resultado.forEach(
            function(documento){

                const datos =
                documento.data();


                const uidDocumento =
                texto(
                    datos.uid ||
                    datos.userId ||
                    datos.usuarioId ||
                    datos.usuarioUid
                );


                const empresaDocumento =
                texto(
                    datos.empresaId ||
                    datos.idEmpresa ||
                    datos.empresaID
                );


                const perteneceUsuario =
                uidDocumento ===
                usuarioActual.uid;


                const perteneceEmpresa =
                empresaIdActual &&
                empresaDocumento ===
                empresaIdActual;


                /*
                 * También aceptamos presupuestos
                 * antiguos que tengan usuarioId.
                 */

                if(
                    perteneceUsuario ||
                    perteneceEmpresa
                ){

                    todosLosPresupuestos.push({

                        id:
                        documento.id,

                        datos:
                        datos

                    });

                }

            }
        );


        /*
         * ORDEN
         */

        todosLosPresupuestos.sort(
            function(a,b){

                const fechaA =
                a.datos.creado?.seconds ||
                a.datos.fechaCreacion?.seconds ||
                0;

                const fechaB =
                b.datos.creado?.seconds ||
                b.datos.fechaCreacion?.seconds ||
                0;

                return fechaB - fechaA;

            }
        );


        cargando.style.display =
        "none";


        if(
            resultado.size > 0 &&
            todosLosPresupuestos.length === 0
        ){

            info.textContent =
            "Firebase encontró " +
            resultado.size +
            " presupuesto(s), pero ninguno está asociado al usuario actual. Revisaremos el UID y empresaId con el que fueron guardados.";

            info.style.display =
            "block";

        }


        mostrarPresupuestos(
            todosLosPresupuestos
        );


    }
    catch(error){

        console.error(
            "ERROR CARGANDO PRESUPUESTOS:",
            error
        );


        cargando.style.display =
        "none";

        listaElemento.style.display =
        "none";


        errorElemento.textContent =
        "No se pudieron cargar los presupuestos.\n\n" +
        "Código: " +
        (
            error?.code ||
            "sin código"
        ) +
        "\n\n" +
        "Detalle: " +
        (
            error?.message ||
            String(error)
        );


        errorElemento.style.display =
        "block";

    }

}


/* =====================================================
   MOSTRAR PRESUPUESTOS
===================================================== */

function mostrarPresupuestos(lista){

    cargando.style.display =
    "none";

    listaElemento.style.display =
    "flex";


    if(!lista.length){

        listaElemento.innerHTML = `

            <div class="mensaje">

                Todavía no tenés presupuestos registrados.

                <br><br>

                <a
                    href="presupuesto.html"
                    class="boton nuevo"
                >
                    ➕ CREAR PRESUPUESTO
                </a>

            </div>

        `;

        return;

    }


    listaElemento.innerHTML =
    "";


    lista.forEach(
        function(item){

            const datos =
            item.datos;


            const numeroPresupuesto =
            obtenerNumero(
                datos,
                item.id
            );


            const cliente =
            obtenerCliente(
                datos
            );


            const descripcion =
            obtenerDescripcion(
                datos
            );


            const fecha =
            obtenerFecha(
                datos
            );


            const total =
            obtenerTotal(
                datos
            );


            const estado =
            datos.estado ||
            datos.estadoPresupuesto ||
            "Pendiente";


            const elemento =
            document.createElement(
                "article"
            );


            elemento.className =
            "presupuesto";


            elemento.innerHTML = `

                <div class="presupuesto-cabecera">

                    <div class="presupuesto-numero">

                        Presupuesto N.º
                        ${escapar(
                            numeroPresupuesto
                        )}

                    </div>

                    <span class="estado">

                        ${escapar(
                            estado
                        )}

                    </span>

                </div>


                <div class="dato">

                    <strong>Cliente:</strong>

                    ${escapar(
                        cliente
                    )}

                </div>


                <div class="dato">

                    <strong>Fecha:</strong>

                    ${escapar(
                        fecha
                    )}

                </div>


                <div class="dato">

                    <strong>Lugar:</strong>

                    ${escapar(
                        datos.lugarTrabajo ||
                        datos.lugar ||
                        "Sin informar"
                    )}

                </div>


                <div class="dato">

                    <strong>Descripción:</strong>

                    ${escapar(
                        descripcion
                    )}

                </div>


                <div class="total">

                    Total:
                    $ ${dinero(total)}

                </div>


                <div class="acciones">

                    <a
                        class="accion ver"
                        href="ver-presupuesto.html?id=${encodeURIComponent(item.id)}"
                    >
                        👁️ VER
                    </a>


                    <a
                        class="accion editar"
                        href="editar-presupuesto.html?id=${encodeURIComponent(item.id)}"
                    >
                        ✏️ EDITAR
                    </a>


                    <a
                        class="accion trabajo"
                        href="trabajo.html?presupuestoId=${encodeURIComponent(item.id)}"
                    >
                        🔧 CREAR TRABAJO
                    </a>

                </div>

            `;


            listaElemento.appendChild(
                elemento
            );

        }
    );

}


/* =====================================================
   BUSCADOR
===================================================== */

buscar.addEventListener(
    "input",
    function(){

        const textoBusqueda =
        buscar.value
            .toLowerCase()
            .trim();


        if(!textoBusqueda){

            mostrarPresupuestos(
                todosLosPresupuestos
            );

            return;

        }


        const filtrados =
        todosLosPresupuestos.filter(
            function(item){

                const datos =
                item.datos;


                const contenido = (

                    obtenerNumero(
                        datos,
                        item.id
                    )

                    + " " +

                    obtenerCliente(
                        datos
                    )

                    + " " +

                    obtenerDescripcion(
                        datos
                    )

                    + " " +

                    obtenerFecha(
                        datos
                    )

                    + " " +

                    texto(
                        datos.lugarTrabajo
                    )

                ).toLowerCase();


                return contenido.includes(
                    textoBusqueda
                );

            }
        );


        mostrarPresupuestos(
            filtrados
        );

    }
);


/* =====================================================
   AUTENTICACION
===================================================== */

onAuthStateChanged(
    auth,
    async function(usuario){

        console.log(
            "GESBASE AUTH:",
            usuario
                ? usuario.uid
                : "SIN SESION"
        );


        if(!usuario){

            estadoNoSesion();

            return;

        }


        usuarioActual =
        usuario;


        await cargarPresupuestos();

    }
);


/* =====================================================
   SIN SESION
===================================================== */

function estadoNoSesion(){

    cargando.style.display =
    "none";

    listaElemento.style.display =
    "none";


    errorElemento.textContent =
    "No hay una sesión iniciada.\n\nRedirigiendo al inicio de sesión...";


    errorElemento.style.display =
    "block";


    setTimeout(
        function(){

            window.location.replace(
                "login.html"
            );

        },
        800
    );

}


/* =====================================================
   CONTROL
===================================================== */

setTimeout(
    function(){

        if(
            cargando.style.display !==
            "none"
        ){

            cargando.style.display =
            "none";


            errorElemento.textContent =
            "GESBASE quedó esperando la respuesta de Firebase.\n\n" +
            "Verificá Js/firebase.js, Firebase Authentication y Firestore.";

            errorElemento.style.display =
            "block";

        }

    },
    15000
);

</script>

</body>

</html>
