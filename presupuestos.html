<style>

*{
    box-sizing:border-box;
    margin:0;
    padding:0;
}

body{
    font-family:Arial,sans-serif;
    background:#f3f4f6;

}

.contenedor{
    width:100%;
    max-width:900px;
    margin:auto;
    min-height:100vh;
    background:white;
}

header{
    background:#111827;
    color:white;

}

header h1{
    font-size:25px;
}

header p{

    color:#d1d5db;
    font-size:14px;
}

main{
    padding:18px;
}

.barra{
    display:flex;
    gap:10px;
    flex-wrap:wrap;
    margin-bottom:18px;
}

.boton{
    display:block;
    padding:13px 16px;
    border-radius:10px;
    text-decoration:none;
    font-weight:bold;
    text-align:center;
    border:none;
    cursor:pointer;
    font-size:14px;
}

.nuevo{
    background:#16a34a;
    color:white;
    flex:1;
}

.volver{
    background:#e5e7eb;
    color:#111827;
    flex:1;
}

.buscar{
    width:100%;
    padding:14px;
    border:1px solid #d1d5db;

    margin-bottom:15px;
}

.cargando,
.mensaje{
    padding:30px 15px;
    text-align:center;
    color:#6b7280;
}

.error{
    background:#fee2e2;
    color:#991b1b;
    padding:15px;
    border-radius:10px;
    line-height:1.5;
    white-space:pre-wrap;
}

.info{
    background:#dbeafe;
    color:#1e40af;
    padding:15px;
    border-radius:10px;
    margin-bottom:15px;

    display:none;
}

.lista{
    display:flex;
    flex-direction:column;
    gap:14px;
}

.presupuesto{
    border:1px solid #d1d5db;
    border-radius:14px;
    padding:17px;
    background:white;
    box-shadow:0 2px 6px rgba(0,0,0,.05);
}

.presupuesto-construccion{
    border-color:#f97316;
    box-shadow:
        0 2px 8px rgba(249,115,22,.12);
}

.presupuesto-cabecera{
    display:flex;
    justify-content:space-between;
    gap:10px;
    align-items:flex-start;
    margin-bottom:12px;
}

.presupuesto-numero{
    font-size:17px;
    font-weight:bold;
}

.estado{
    padding:5px 9px;
    border-radius:20px;
    background:#dbeafe;
    color:#1d4ed8;
    font-size:12px;
    font-weight:bold;
}

.etiqueta-construccion{
    display:inline-flex;
    align-items:center;
    gap:6px;
    background:#fff7ed;
    color:#c2410c;
    border:1px solid #fdba74;
    padding:7px 10px;
    border-radius:8px;
    font-size:12px;
    font-weight:bold;
    margin-bottom:10px;
}

.dato{
    margin-top:7px;
    font-size:14px;
    line-height:1.4;
}

.dato strong{
    color:#374151;
}

.datos-construccion{
    display:grid;
    grid-template-columns:1fr 1fr;
    gap:8px;
    margin-top:12px;
    padding:11px;
    background:#fff7ed;
    border-radius:10px;
    border:1px solid #fed7aa;
}

.dato-construccion{
    font-size:13px;
    line-height:1.4;
}

.dato-construccion strong{
    display:block;
    color:#9a3412;
    margin-bottom:2px;
}

.materiales-resumen{
    grid-column:1 / -1;
    padding-top:8px;
    margin-top:2px;
    border-top:1px solid #fed7aa;
    color:#7c2d12;
    font-weight:bold;
}

.total{
    margin-top:12px;
    padding-top:12px;
    border-top:1px solid #e5e7eb;
    font-size:18px;
    font-weight:bold;
}

.acciones{
    display:grid;
    grid-template-columns:1fr 1fr;
    gap:8px;
    margin-top:14px;
}

.accion{
    padding:11px 8px;
    border-radius:9px;
    text-decoration:none;
    text-align:center;
    font-size:13px;
    font-weight:bold;
    border:none;
    cursor:pointer;
    font-family:Arial,sans-serif;
}

.ver{
    background:#111827;
    color:white;
}

.editar{
    background:#2563eb;
    color:white;
}

.materiales{
    background:#ea580c;
    color:white;
}

.pdf-materiales{
    background:#7c3aed;
    color:white;
}

.trabajo{
    grid-column:1 / -1;
    background:#16a34a;
    color:white;
}

.modal{
    position:fixed;
    inset:0;
    background:rgba(17,24,39,.72);
    display:none;
    align-items:center;
    justify-content:center;
    padding:15px;
    z-index:1000;
}

.modal.activo{
    display:flex;
}

.modal-contenido{
    width:100%;
    max-width:700px;
    max-height:90vh;
    overflow:auto;
    background:white;
    border-radius:16px;
    padding:20px;
    box-shadow:0 15px 50px rgba(0,0,0,.25);
}

.modal-cabecera{
    display:flex;
    justify-content:space-between;
    align-items:flex-start;
    gap:12px;
    margin-bottom:16px;
}

.modal-cabecera h2{
    font-size:20px;
}

.modal-subtitulo{
    color:#6b7280;
    font-size:13px;
    margin-top:4px;
}

.cerrar-modal{
    width:36px;
    height:36px;
    border:none;
    border-radius:50%;
    background:#e5e7eb;
    color:#111827;
    font-size:20px;
    cursor:pointer;
    flex-shrink:0;
}

.materiales-info{
    background:#fff7ed;
    border:1px solid #fed7aa;
    color:#9a3412;
    padding:12px;
    border-radius:10px;
    font-size:13px;
    line-height:1.5;
    margin-bottom:14px;
}

.materiales-tabla{
    width:100%;
    border-collapse:collapse;
    font-size:13px;
}

.materiales-tabla th{
    background:#111827;
    color:white;
    padding:10px 8px;
    text-align:left;
}

.materiales-tabla td{
    border-bottom:1px solid #e5e7eb;
    padding:9px 8px;
    vertical-align:top;
}

.materiales-tabla tr:last-child td{
    border-bottom:none;
}

.cantidad-material{
    font-weight:bold;
    white-space:nowrap;
}

.modal-acciones{
    display:flex;
    gap:8px;
    margin-top:16px;
    flex-wrap:wrap;
}

.modal-acciones button{
    flex:1;
    min-width:150px;
}

.sin-materiales{
    padding:20px;
    background:#f9fafb;
    border:1px dashed #d1d5db;
    border-radius:10px;
    color:#6b7280;
    text-align:center;
    line-height:1.5;
}

@media(max-width:600px){

    .datos-construccion{
        grid-template-columns:1fr;
    }

    .materiales-resumen{
        grid-column:auto;
    }

}

@media(max-width:500px){

    .presupuesto-cabecera{
        flex-direction:column;
    }

    .acciones{
        grid-template-columns:1fr;
    }

    .trabajo{
        grid-column:auto;
    }

    .modal-contenido{
        padding:15px;
    }

    .materiales-tabla{
        font-size:12px;
    }

}

</style>

<script

></script>

<script type="module">

import {
    auth,
    db
} from "./Js/firebase.js";

import {
    onAuthStateChanged
} from "https://www.gstatic.com/firebasejs/12.18.0/firebase-auth.js";

import {
    collection,
    getDocs,
    query,
    where
} from "https://www.gstatic.com/firebasejs/12.18.0/firebasejs/12.18.0/firebase-firestore.js";

const cargando =
document.getElementById("cargando");

const errorElemento =
document.getElementById("error");

const listaElemento =
document.getElementById("lista");

const buscar =
document.getElementById("buscar");

const info =
document.getElementById("info");

const modalMateriales =
document.getElementById("modalMateriales");

const cerrarModal =
document.getElementById("cerrarModal");

const btnCerrarModal =
document.getElementById("btnCerrarModal");

const btnPdfModal =
document.getElementById("btnPdfModal");

const materialesContenido =
document.getElementById("materialesContenido");

const materialesInfo =
document.getElementById("materialesInfo");

const modalSubtitulo =
document.getElementById("modalSubtitulo");

let usuarioActual = null;

let todosLosPresupuestos = [];

let presupuestoMaterialesActual = null;

function texto(valor){

    if(
        valor === undefined ||
        valor === null
    ){

        return "";

    }

    return String(valor).trim();

}

function escapar(valor){

    return texto(valor)
        .replaceAll("&","&amp;")
        .replaceAll("<","&lt;")
        .replaceAll(">","&gt;")
        .replaceAll('"',"&quot;")
        .replaceAll("'","&#039;");

}

function numero(valor){

    if(
        valor === undefined ||
        valor === null ||
        valor === ""
    ){

        return 0;

    }

    if(
        typeof valor === "number"
    ){

        return Number.isFinite(valor)
            ? valor
            : 0;

    }

    let valorTexto =
    String(valor)
        .replace(/\$/g,"")
        .replace(/\s/g,"");

    if(
        valorTexto.includes(",")
    ){

        valorTexto =
        valorTexto
        .replace(/\./g,"")
        .replace(",",".");
    }

    const resultado =
    Number(valorTexto);

    return Number.isFinite(resultado)
        ? resultado
        : 0;

}

function dinero(valor){

    return numero(valor)
        .toLocaleString(
            "es-AR",
            {
                minimumFractionDigits:2,
                maximumFractionDigits:2
            }
        );

}

function cantidad(valor){

    const n =
    numero(valor);

    if(
        Number.isInteger(n)
    ){

        return n.toLocaleString(
            "es-AR"
        );

    }

    return n.toLocaleString(
        "es-AR",
        {
            minimumFractionDigits:0,
            maximumFractionDigits:2
        }
    );

}

function obtenerCliente(datos){

    return (
        datos.cliente ||
        datos.nombreCliente ||
        datos.clienteNombre ||
        datos.nombreEmpresaCliente ||
        datos.empresaCliente ||
        "Sin cliente"
    );

}

function obtenerNumero(datos,id){

    return (
        datos.numeroAgenda ||
        datos.numero ||
        datos.numeroPresupuesto ||
        datos.codigo ||
        datos.nro ||
        id.substring(0,8)
    );

}

function obtenerFecha(datos){

    if(
        datos.fecha
    ){

        return texto(
            datos.fecha
        );

    }

    if(
        datos.creado &&
        typeof datos.creado.toDate === "function"
    ){

        return datos.creado
            .toDate()
            .toLocaleDateString(
                "es-AR"
            );

    }

    if(
        datos.fechaCreacion &&
        typeof datos.fechaCreacion.toDate === "function"
    ){

        return datos.fechaCreacion
            .toDate()
            .toLocaleDateString(
                "es-AR"
            );

    }

    return "Sin fecha";

}

function obtenerDescripcion(datos){

    return (
        datos.descripcion ||
        datos.tareas ||
        datos.titulo ||
        datos.concepto ||
        datos.detalle ||
        "Presupuesto sin descripción"
    );

}

function obtenerTotal(datos){

    const totalGuardado =
    numero(
        datos.total ??
        datos.totalFinal ??
        datos.importe ??
        datos.monto
    );

    if(
        totalGuardado > 0
    ){

        return totalGuardado;

    }

    return (
        numero(
            datos.materiales ??
            datos.importeMaterial
        )
        +
        numero(
            datos.manoObra ??
            datos.importeManoObra
        )
        +
        numero(
            datos.viaticos ??
            datos.importeViaticos
        )
        +
        numero(
            datos.flete ??
            datos.importeFlete
        )
    );

}

function tieneCalculoMateriales(datos){

    return (
        datos.calculoMaterialesActivo === true
        ||
        (
            Array.isArray(
                datos.materialesCalculados
            )
            &&
            datos.materialesCalculados.length > 0
        )
    );

}

function obtenerSuperficie(datos){

    return numero(
        datos.superficieTotal ??
        datos.superficie ??
        datos.metrosCuadrados
    );

}

function obtenerTipoConstruccion(datos){

    return (
        datos.tipoConstruccion ||
        datos.tipoObra ||
        datos.construccionTipo ||
        "Casa"
    );

}

function obtenerMateriales(datos){

    if(
        Array.isArray(
            datos.materialesCalculados
        )
    ){

        return datos.materialesCalculados;

    }

    if(
        Array.isArray(
            datos.calculoMateriales?.materiales
        )
    ){

        return datos.calculoMateriales.materiales;

    }

    return [];

}

function obtenerNombreMaterial(material){

    return (
        material.material ||
        material.nombre ||
        material.descripcion ||
        material.item ||
        "Material"
    );

}

function obtenerUnidadMaterial(material){

    return (
        material.unidad ||
        material.unidadMedida ||
        "un."
    );

}

function obtenerCantidadMaterial(material){

    return numero(
        material.cantidad ??
        material.qty ??
        material.valor
    );

}

function obtenerCategoriaMaterial(material){

    return (
        material.categoria ||
        material.seccion ||
        material.grupo ||
        "Materiales"
    );

}

async function cargarPresupuestos(){

    cargando.style.display =
    "block";

    listaElemento.style.display =
    "none";

    errorElemento.style.display =
    "none";

    info.style.display =
    "none";

    try{

        if(
            !usuarioActual
        ){

            throw new Error(
                "No hay usuario autenticado."
            );

        }

        const referencia =
        collection(
            db,
            "presupuestos"
        );

        const consulta =
        query(
            referencia,
            where(
                "uid",
                "==",
                usuarioActual.uid
            )
        );

        const resultado =
        await getDocs(
            consulta
        );

        todosLosPresupuestos = [];

        resultado.forEach(
            function(documento){

                todosLosPresupuestos.push({

                    id:
                    documento.id,

                    datos:
                    documento.data()

                });

            }
        );

        todosLosPresupuestos.sort(
            function(a,b){

                const fechaA =
                a.datos.creado?.seconds ||
                a.datos.fechaCreacion?.seconds ||
                0;

                const fechaB =
                b.datos.creado?.seconds ||
                b.datos.fechaCreacion?.seconds ||
                0;

                return fechaB - fechaA;

            }
        );

        cargando.style.display =
        "none";

        if(
            resultado.size === 0
        ){

            info.textContent =
            "No hay presupuestos registrados para este usuario.";

            info.style.display =
            "block";

        }

        mostrarPresupuestos(
            todosLosPresupuestos
        );

    }
    catch(error){

        console.error(
            "ERROR CARGANDO PRESUPUESTOS:",
            error
        );

        cargando.style.display =
        "none";

        listaElemento.style.display =
        "none";

        let detalle =
        error?.message ||
        String(error);

        if(
            error?.code ===
            "permission-denied"
        ){

            detalle =
            "Firebase rechazó la lectura de la colección 'presupuestos'.\n\n" +
            "UID actual:\n" +
            usuarioActual?.uid;

        }

        errorElemento.textContent =
        "No se pudieron cargar los presupuestos.\n\n" +
        "Código: " +
        (
            error?.code ||
            "sin código"
        ) +
        "\n\n" +
        "Detalle: " +
        detalle;

        errorElemento.style.display =
        "block";

    }

}

function mostrarPresupuestos(lista){

    cargando.style.display =
    "none";

    listaElemento.style.display =
    "flex";

    if(
        !lista.length
    ){

        listaElemento.innerHTML = `

            <div class="mensaje">

                Todavía no tenés presupuestos registrados.

                <br><br>

                <a
                    href="presupuesto.html"
                    class="boton nuevo"
                >
                    ➕ CREAR PRESUPUESTO
                </a>

            </div>

        `;

        return;

    }

    listaElemento.innerHTML =
    "";

    lista.forEach(
        function(item){

            const datos =
            item.datos;

            const numeroPresupuesto =
            obtenerNumero(
                datos,
                item.id
            );

            const cliente =
            obtenerCliente(
                datos
            );

            const descripcion =
            obtenerDescripcion(
                datos
            );

            const fecha =
            obtenerFecha(
                datos
            );

            const total =
            obtenerTotal(
                datos
            );

            const estado =
            datos.estado ||
            datos.estadoPresupuesto ||
            "Pendiente";

            const esConstruccion =
            tieneCalculoMateriales(
                datos
            );

            const superficie =
            obtenerSuperficie(
                datos
            );

            const tipoConstruccion =
            obtenerTipoConstruccion(
                datos
            );

            const materiales =
            obtenerMateriales(
                datos
            );

            const cantidadMateriales =
            materiales.length;

            const elemento =
            document.createElement(
                "article"
            );

            elemento.className =
            "presupuesto" +
            (
                esConstruccion
                    ? " presupuesto-construccion"
                    : ""
            );

            let bloqueConstruccion =
            "";

            if(
                esConstruccion
            ){

                bloqueConstruccion = `

                    <div class="etiqueta-construccion">

                        🧱
                        CÁLCULO DE MATERIALES
                        ${escapar(
                            tipoConstruccion
                        )}

                    </div>

                    <div class="datos-construccion">

                        <div class="dato-construccion">

                            <strong>
                                Superficie
                            </strong>

                            ${
                                superficie > 0
                                    ? cantidad(superficie) + " m²"
                                    : "No informada"
                            }

                        </div>

                        <div class="dato-construccion">

                            <strong>
                                Materiales
                            </strong>

                            ${
                                cantidadMateriales
                            }
                            ítems calculados

                        </div>

                        <div class="materiales-resumen">

                            📋 Listado preparado para compra de materiales

                        </div>

                    </div>

                `;

            }

            elemento.innerHTML = `

                <div class="presupuesto-cabecera">

                    <div class="presupuesto-numero">

                        Presupuesto N.º
                        ${escapar(
                            numeroPresupuesto
                        )}

                    </div>

                    <span class="estado">

                        ${escapar(
                            estado
                        )}

                    </span>

                </div>

                ${bloqueConstruccion}

                <div class="dato">

                    <strong>Cliente:</strong>

                    ${escapar(
                        cliente
                    )}

                </div>

                <div class="dato">

                    <strong>Fecha:</strong>

                    ${escapar(
                        fecha
                    )}

                </div>

                <div class="dato">

                    <strong>Lugar:</strong>

                    ${escapar(
                        datos.lugarTrabajo ||
                        datos.lugar ||
                        "Sin informar"
                    )}

                </div>

                <div class="dato">

                    <strong>Descripción:</strong>

                    ${escapar(
                        descripcion
                    )}

                </div>

                <div class="total">

                    Total:
                    $ ${dinero(total)}

                </div>

                <div class="acciones">

                    <a
                        class="accion ver"
                        href="ver-presupuesto.html?id=${encodeURIComponent(item.id)}"
                    >
                        👁️ VER
                    </a>

                    <a
                        class="accion editar"
                        href="editar-presupuesto.html?id=${encodeURIComponent(item.id)}"
                    >
                        ✏️ EDITAR
                    </a>

                    ${
                        esConstruccion
                        ?
                        `
                        <button
                            type="button"
                            class="accion materiales"
                            data-materiales-id="${escapar(item.id)}"
                        >
                            🧱 MATERIALES
                        </button>

                        <button
                            type="button"
                            class="accion pdf-materiales"
                            data-pdf-id="${escapar(item.id)}"
                        >
                            📄 PDF MATERIALES
                        </button>
                        `
                        :
                        ""
                    }

                    <!--
                        CORRECCIÓN DEL 404:
                        El archivo existente se llama trabajos.html,
                        no trabajo.html.
                    -->

                    <a
                        class="accion trabajo"
                        href="trabajos.html?presupuestoId=${encodeURIComponent(item.id)}"
                    >
                        🔧 CREAR TRABAJO
                    </a>

                </div>

            `;

            listaElemento.appendChild(
                elemento
            );

        }
    );

    conectarBotonesMateriales();

}

function conectarBotonesMateriales(){

    const botones =
    document.querySelectorAll(
        "[data-materiales-id]"
    );

    botones.forEach(
        function(boton){

            boton.addEventListener(
                "click",
                function(){

                    abrirMateriales(
                        boton.dataset.materialesId
                    );

                }
            );

        }
    );

    const botonesPdf =
    document.querySelectorAll(
        "[data-pdf-id]"
    );

    botonesPdf.forEach(
        function(boton){

            boton.addEventListener(
                "click",
                function(){

                    const item =
                    todosLosPresupuestos.find(
                        function(elemento){

                            return elemento.id ===
                            boton.dataset.pdfId;

                        }
                    );

                    if(
                        item
                    ){

                        generarPdfMateriales(
                            item
                        );

                    }

                }
            );

        }
    );

}

function abrirMateriales(id){

    const item =
    todosLosPresupuestos.find(
        function(elemento){

            return elemento.id === id;

        }
    );

    if(
        !item
    ){

        return;

    }

    presupuestoMaterialesActual =
    item;

    const datos =
    item.datos;

    const materiales =
    obtenerMateriales(
        datos
    );

    const numeroPresupuesto =
    obtenerNumero(
        datos,
        item.id
    );

    const cliente =
    obtenerCliente(
        datos
    );

    const superficie =
    obtenerSuperficie(
        datos
    );

    const tipo =
    obtenerTipoConstruccion(
        datos
    );

    modalSubtitulo.textContent =
    "Presupuesto N.º " +
    numeroPresupuesto +
    " · " +
    cliente;

    materialesInfo.innerHTML = `

        <strong>
            🧱 ${escapar(tipo)}
        </strong>

        <br>

        Superficie:
        <strong>
            ${
                superficie > 0
                    ? cantidad(superficie) + " m²"
                    : "No informada"
            }
        </strong>

        <br>

        Este listado contiene cantidades estimadas para la compra de materiales.
        No incluye precios, mano de obra ni ganancias.

    `;

    if(
        !materiales.length
    ){

        materialesContenido.innerHTML = `

            <div class="sin-materiales">

                Este presupuesto no tiene materiales calculados.

                <br><br>

                Podés editar el presupuesto y ejecutar nuevamente
                el cálculo automático.

            </div>

        `;

    }
    else{

        const materialesOrdenados =
        [...materiales].sort(
            function(a,b){

                return obtenerCategoriaMaterial(a)
                    .localeCompare(
                        obtenerCategoriaMaterial(b),
                        "es"
                    );

            }
        );

        let categoriaActual =
        "";

        let filas =
        "";

        materialesOrdenados.forEach(
            function(material){

                const categoria =
                obtenerCategoriaMaterial(
                    material
                );

                if(
                    categoria !== categoriaActual
                ){

                    categoriaActual =
                    categoria;

                    filas += `

                        <tr>

                            <td
                                colspan="3"
                                style="
                                    background:#f3f4f6;
                                    font-weight:bold;
                                    color:#374151;
                                "
                            >

                                ${escapar(
                                    categoria
                                )}

                            </td>

                        </tr>

                    `;

                }

                filas += `

                    <tr>

                        <td>

                            ${escapar(
                                obtenerNombreMaterial(
                                    material
                                )
                            )}

                        </td>

                        <td class="cantidad-material">

                            ${cantidad(
                                obtenerCantidadMaterial(
                                    material
                                )
                            )}

                        </td>

                        <td>

                            ${escapar(
                                obtenerUnidadMaterial(
                                    material
                                )
                            )}

                        </td>

                    </tr>

                `;

            }
        );

        materialesContenido.innerHTML = `

            <table class="materiales-tabla">

                <thead>

                    <tr>

                        <th>
                            Material
                        </th>

                        <th>
                            Cantidad
                        </th>

                        <th>
                            Unidad
                        </th>

                    </tr>

                </thead>

                <tbody>

                    ${filas}

                </tbody>

            </table>

        `;

    }

    modalMateriales.classList.add(
        "activo"
    );

    document.body.style.overflow =
    "hidden";

}

function cerrarVentanaMateriales(){

    modalMateriales.classList.remove(
        "activo"
    );

    document.body.style.overflow =
    "";

}

cerrarModal.addEventListener(
    "click",
    cerrarVentanaMateriales
);

btnCerrarModal.addEventListener(

    cerrarVentanaMateriales
);

modalMateriales.addEventListener(
    "click",

        if(
            event.target ===

document.addEventListener(

btnPdfModal.addEventListener(
    "click",
    function(){

        if(
            presupuestoMaterialesActual
        ){

            generarPdfMateriales(
                presupuestoMaterialesActual
            );

        }

    }
);

function generarPdfMateriales(item){

    if(
        !window.jspdf ||
        !window.jspdf.jsPDF
    ){

        alert(
            "No se pudo cargar el generador PDF.\n\n" +
            "Verificá tu conexión a Internet e intentá nuevamente."
        );

        return;

    }

    const datos =
    item.datos;

    const materiales =
    obtenerMateriales(
        datos
    );

    if(
        !materiales.length
    ){

        alert(
            "Este presupuesto no tiene materiales calculados."
        );

        return;

    }

    const {
        jsPDF
    } =
    window.jspdf;

    const pdf =
    new jsPDF({
        orientation:"portrait",
        unit:"mm",
        format:"a4"
    });

    const margen =
    15;

    const ancho =
    210;

    const anchoContenido =
    ancho -
    margen * 2;

    let y =
    18;

    const numeroPresupuesto =
    obtenerNumero(
        datos,
        item.id
    );

    const cliente =
    obtenerCliente(
        datos
    );

    const fecha =
    obtenerFecha(
        datos
    );

    const superficie =
    obtenerSuperficie(
        datos
    );

    const tipo =
    obtenerTipoConstruccion(
        datos
    );

    function nuevaPaginaSiHaceFalta(
        altura = 8
    ){

        if(
            y + altura >
            280
        ){

            pdf.addPage();

            y = 18;

        }

    }

    function textoPDF(
        texto,
        x,
        yTexto,
        opciones = {}
    ){

        pdf.setFont(
            "helvetica",
            opciones.bold
                ? "bold"
                : "normal"
        );

        pdf.setFontSize(
            opciones.size ||
            10
        );

        pdf.text(
            String(texto),
            x,
            yTexto,
            {
                maxWidth:
                opciones.maxWidth ||
                undefined
            }
        );

    }

    pdf.setFont(
        "helvetica",
        "bold"
    );

    pdf.setFontSize(
        20
    );

    pdf.text(
        "GESBASE",
        margen,
        y
    );

    y += 8;

    pdf.setFontSize(
        15
    );

    pdf.text(
        "LISTADO DE MATERIALES",
        margen,
        y
    );

    y += 9;

    pdf.setDrawColor(
        220,
        220,
        220
    );

    pdf.line(
        margen,
        y,
        margen + anchoContenido,
        y
    );

    y += 8;

    textoPDF(
        "Presupuesto N.º " +
        numeroPresupuesto,
        margen,
        y,
        {
            bold:true,
            size:11
        }
    );

    y += 6;

    textoPDF(
        "Cliente: " +
        cliente,
        margen,
        y
    );

    y += 6;

    textoPDF(
        "Fecha: " +
        fecha,
        margen,
        y
    );

    y += 6;

    textoPDF(
        "Tipo de construcción: " +
        tipo,
        margen,
        y
    );

    y += 6;

    textoPDF(
        "Superficie: " +
        (
            superficie > 0
                ? cantidad(superficie) + " m²"
                : "No informada"
        ),
        margen,
        y
    );

    y += 10;

    pdf.setFontSize(
        9
    );

    pdf.setFont(
        "helvetica",
        "normal"
    );

    const aviso =
    "Cómputo estimativo para compra de materiales. " +
    "Verificar medidas, cantidades y sistema constructivo " +
    "antes de realizar la compra.";

    const avisoLineas =
    pdf.splitTextToSize(
        aviso,
        anchoContenido - 8
    );

    pdf.setFillColor(
        255,
        247,
        237
    );

    pdf.setDrawColor(
        253,
        186,
        116
    );

    const altoAviso =
    avisoLineas.length * 4.5 + 8;

    pdf.roundedRect(
        margen,
        y - 4,
        anchoContenido,
        altoAviso,
        2,
        2,
        "FD"
    );

    pdf.setTextColor(
        124,
        45,
        18
    );

    pdf.text(
        avisoLineas,
        margen + 4,
        y + 2
    );

    pdf.setTextColor(
        0,
        0,
        0
    );

    y +=
    altoAviso +
    7;

    const columnas = {

        material:
        margen,

        cantidad:
        margen + 125,

        unidad:
        margen + 155

    };

    function encabezadoTabla(){

        nuevaPaginaSiHaceFalta(
            12
        );

        pdf.setFillColor(
            17,
            24,
            39
        );

        pdf.rect(
            margen,
            y - 5,
            anchoContenido,
            8,
            "F"
        );

        pdf.setTextColor(
            255,
            255,
            255
        );

        pdf.setFont(
            "helvetica",
            "bold"
        );

        pdf.setFontSize(
            9
        );

        pdf.text(
            "MATERIAL",
            columnas.material + 3,
            y
        );

        pdf.text(
            "CANTIDAD",
            columnas.cantidad,
            y
        );

        pdf.text(
            "UNIDAD",
            columnas.unidad,
            y
        );

        pdf.setTextColor(
            0,
            0,
            0
        );

        y += 8;

    }

    encabezadoTabla();

    const materialesOrdenados =
    [...materiales].sort(
        function(a,b){

            const catA =
            obtenerCategoriaMaterial(a);

            const catB =
            obtenerCategoriaMaterial(b);

            if(
                catA === catB
            ){

                return obtenerNombreMaterial(a)
                    .localeCompare(
                        obtenerNombreMaterial(b),
                        "es"
                    );

            }

            return catA.localeCompare(
                catB,
                "es"
            );

        }
    );

    let categoriaActual =
    "";

    materialesOrdenados.forEach(
        function(material){

            const categoria =
            obtenerCategoriaMaterial(
                material
            );

            if(
                categoria !== categoriaActual
            ){

                categoriaActual =
                categoria;

                nuevaPaginaSiHaceFalta(
                    12
                );

                pdf.setFont(
                    "helvetica",
                    "bold"
                );

                pdf.setFontSize(
                    9
                );

                pdf.setTextColor(
                    55,
                    65,
                    81
                );

                pdf.text(
                    categoria,
                    margen + 2,
                    y
                );

                pdf.setTextColor(
                    0,
                    0,
                    0
                );

                y += 6;

            }

            const nombre =
            obtenerNombreMaterial(
                material
            );

            const cant =
            cantidad(
                obtenerCantidadMaterial(
                    material
                )
            );

            const unidad =
            obtenerUnidadMaterial(
                material
            );

            const lineasNombre =
            pdf.splitTextToSize(
                nombre,
                115
            );

            const alto =
            Math.max(
                7,
                lineasNombre.length * 4.5
            );

            nuevaPaginaSiHaceFalta(
                alto + 3
            );

            pdf.setFont(
                "helvetica",
                "normal"
            );

            pdf.setFontSize(
                9
            );

            pdf.text(
                lineasNombre,
                columnas.material + 3,
                y
            );

            pdf.setFont(
                "helvetica",
                "bold"
            );

            pdf.text(
                cant,
                columnas.cantidad,
                y
            );

            pdf.setFont(
                "helvetica",
                "normal"
            );

            pdf.text(
                unidad,
                columnas.unidad,
                y
            );

            pdf.setDrawColor(
                230,
                230,
                230
            );

            pdf.line(
                margen,
                y + alto - 2,
                margen + anchoContenido,
                y + alto - 2
            );

            y +=
            alto + 3;

        }
    );

    nuevaPaginaSiHaceFalta(
        20
    );

    y += 7;

    pdf.setFont(
        "helvetica",
        "italic"
    );

    pdf.setFontSize(
        8
    );

    pdf.setTextColor(
        100,
        100,
        100
    );

    pdf.text(
        "Listado generado por GESBASE.",
        margen,
        y
    );

    pdf.text(
        "No incluye precios, mano de obra ni ganancias.",
        margen,
        y + 5
    );

    const paginas =
    pdf.internal.getNumberOfPages();

    for(
        let pagina = 1;
        pagina <= paginas;
        pagina++
    ){

        pdf.setPage(
            pagina
        );

        pdf.setFont(
            "helvetica",
            "normal"
        );

        pdf.setFontSize(
            8
        );

        pdf.setTextColor(
            120,
            120,
            120
        );

        pdf.text(
            "GESBASE · Página " +
            pagina +
            " de " +
            paginas,
            margen,
            290
        );

    }

    const nombreArchivo =
    "GESBASE-Materiales-" +
    String(
        numeroPresupuesto
    )
    .replace(
        /[^a-zA-Z0-9_-]/g,
        "-"
    ) +
    ".pdf";

    pdf.save(
        nombreArchivo
    );

}

buscar.addEventListener(
    "input",
    function(){

        const textoBusqueda =
        buscar.value
            .toLowerCase()
            .trim();

        if(
            !textoBusqueda
        ){

            mostrarPresupuestos(
                todosLosPresupuestos
            );

            return;

        }

        const filtrados =
        todosLosPresupuestos.filter(
            function(item){

                const datos =
                item.datos;

                const materiales =
                obtenerMateriales(
                    datos
                );

                const textoMateriales =
                materiales
                    .map(
                        function(material){

                            return (
                                obtenerNombreMaterial(
                                    material
                                )
                                +
                                " "
                                +
                                obtenerCategoriaMaterial(
                                    material
                                )
                            );

                        }
                    )
                    .join(" ");

                const contenido = (

                    obtenerNumero(
                        datos,
                        item.id
                    )

                    + " " +

                    obtenerCliente(
                        datos
                    )

                    + " " +

                    obtenerDescripcion(
                        datos
                    )

                    + " " +

                    obtenerFecha(
                        datos
                    )

                    + " " +

                    texto(
                        datos.lugarTrabajo
                    )

                    + " " +

                    texto(
                        datos.tipoConstruccion
                    )

                    + " " +

                    obtenerSuperficie(
                        datos
                    )

                    + " " +

                    textoMateriales

                ).toLowerCase();

                return contenido.includes(
                    textoBusqueda
                );

            }
        );

        mostrarPresupuestos(
            filtrados
        );

    }
);

);

            );

        },
        800
    );

}
