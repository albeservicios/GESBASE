<!DOCTYPE html>
<html lang="es">

<head>

<meta charset="UTF-8">

<meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
>

<meta
    name="theme-color"
    content="#111827"
>

<meta
    name="description"
    content="GESBASE - Mis presupuestos"
>

<title>Mis presupuestos - GESBASE</title>

<style>

*{
    box-sizing:border-box;
    margin:0;
    padding:0;
}

body{
    font-family:Arial,sans-serif;
    background:#f3f4f6;
    color:#111827;
}

.contenedor{
    width:100%;
    max-width:700px;
    margin:auto;
    min-height:100vh;
    background:#fff;
}

header{
    background:#111827;
    color:#fff;
    padding:25px 20px;
}

header h1{
    font-size:25px;
}

header p{
    margin-top:6px;
    color:#d1d5db;
    font-size:14px;
}

main{
    padding:20px;
}

.usuario{
    background:#f3f4f6;
    padding:13px;
    border-radius:10px;
    margin-bottom:15px;
    font-size:14px;
}

.acciones{
    display:flex;
    gap:10px;
    margin-bottom:15px;
}

.boton-nuevo,
.boton-actualizar{
    flex:1;
    padding:14px;
    border-radius:10px;
    font-size:15px;
    font-weight:bold;
    text-align:center;
    cursor:pointer;
}

.boton-nuevo{
    background:#111827;
    color:#fff;
    text-decoration:none;
}

.boton-actualizar{
    background:#374151;
    color:#fff;
    border:none;
}

.buscador{
    width:100%;
    padding:14px;
    border:1px solid #d1d5db;
    border-radius:10px;
    font-size:15px;
    margin-bottom:18px;
    outline:none;
}

.buscador:focus{
    border-color:#2563eb;
}

.cargando{
    text-align:center;
    padding:35px;
    color:#6b7280;
}

.lista{
    display:flex;
    flex-direction:column;
    gap:15px;
}

.presupuesto{
    border:1px solid #d1d5db;
    border-radius:14px;
    padding:18px;
    background:#fff;
    box-shadow:0 3px 10px rgba(0,0,0,.08);
}

.numero{
    font-size:14px;
    font-weight:bold;
    color:#6b7280;
    margin-bottom:8px;
}

.cliente{
    font-size:21px;
    font-weight:bold;
    margin-bottom:12px;
}

.dato{
    margin-top:7px;
    font-size:14px;
    color:#4b5563;
}

.descripcion{
    margin-top:12px;
    padding-top:12px;
    border-top:1px solid #e5e7eb;
    line-height:1.5;
    color:#374151;
}

.total{
    margin-top:15px;
    padding-top:13px;
    border-top:2px solid #111827;
    font-size:21px;
    font-weight:bold;
}

.boton{
    display:block;
    width:100%;
    margin-top:10px;
    padding:14px;
    border-radius:10px;
    text-align:center;
    text-decoration:none;
    font-size:15px;
    font-weight:bold;
    cursor:pointer;
}

.boton-ver{
    background:#111827;
    color:#fff;
}

.boton-editar{
    background:#2563eb;
    color:#fff;
}

.boton-eliminar{
    background:#fee2e2;
    color:#991b1b;
    border:1px solid #fecaca;
}

.sin-presupuestos,
.sin-busqueda{
    text-align:center;
    padding:35px 20px;
    color:#6b7280;
}

.sin-busqueda{
    display:none;
}

.error{
    display:none;
    background:#fee2e2;
    color:#991b1b;
    padding:14px;
    border-radius:10px;
    margin-bottom:15px;
    line-height:1.5;
    font-size:14px;
}

.exito{
    background:#dcfce7;
    color:#166534;
}

.estado-ok{
    background:#dcfce7;
    color:#166534;
}

.boton-volver{
    display:block;
    width:100%;
    padding:15px;
    margin-top:20px;
    border-radius:10px;
    background:#e5e7eb;
    color:#111827;
    text-align:center;
    text-decoration:none;
    font-size:16px;
    font-weight:bold;
}

@media(max-width:480px){

    main{
        padding:15px;
    }

    .acciones{
        flex-direction:column;
    }

}

</style>

</head>


<body>

<div class="contenedor">

<header>

<h1>Mis presupuestos</h1>

<p>GESBASE</p>

</header>


<main>


<div
    id="usuario"
    class="usuario"
>
Verificando usuario...
</div>


<div
    id="error"
    class="error"
></div>


<div class="acciones">

<a
    href="presupuesto.html"
    class="boton-nuevo"
>
+ NUEVO PRESUPUESTO
</a>


<button
    type="button"
    id="btnActualizar"
    class="boton-actualizar"
>
🔄 ACTUALIZAR
</button>

</div>


<input
    type="search"
    id="buscador"
    class="buscador"
    placeholder="🔎 Buscar por cliente, agenda o lugar..."
>


<div
    id="cargando"
    class="cargando"
>
Cargando presupuestos...
</div>


<div
    id="lista"
    class="lista"
></div>


<div
    id="sinPresupuestos"
    class="sin-presupuestos"
    style="display:none;"
>
Todavía no tenés presupuestos.
</div>


<div
    id="sinBusqueda"
    class="sin-busqueda"
>
No se encontraron presupuestos.
</div>


<a
    href="index.html"
    class="boton-volver"
>
⬅️ VOLVER A GESBASE
</a>


</main>

</div>


<script type="module">

// =====================================================
// FIREBASE
// IMPORTANTE:
// MISMA VERSIÓN QUE presupuesto.html
// =====================================================

import {
    auth,
    db
} from "./Js/firebase.js";


import {
    onAuthStateChanged
} from "https://www.gstatic.com/firebasejs/12.18.0/firebase-auth.js";


import {
    collection,
    query,
    where,
    getDocs,
    doc,
    getDoc,
    deleteDoc
} from "https://www.gstatic.com/firebasejs/12.18.0/firebase-firestore.js";


// =====================================================
// ELEMENTOS
// =====================================================

const usuarioElemento =
document.getElementById("usuario");

const cargando =
document.getElementById("cargando");

const lista =
document.getElementById("lista");

const sinPresupuestos =
document.getElementById("sinPresupuestos");

const sinBusqueda =
document.getElementById("sinBusqueda");

const errorElemento =
document.getElementById("error");

const buscador =
document.getElementById("buscador");

const btnActualizar =
document.getElementById("btnActualizar");


// =====================================================
// VARIABLES
// =====================================================

let usuarioActual = null;

let presupuestos = [];


// =====================================================
// ESCAPAR HTML
// =====================================================

function escaparHTML(valor){

    const div =
    document.createElement("div");

    div.textContent =
    valor === undefined ||
    valor === null
        ? ""
        : String(valor);

    return div.innerHTML;

}


// =====================================================
// DINERO
// =====================================================

function dinero(valor){

    const numero =
    Number(valor);

    if(
        !Number.isFinite(numero)
    ){

        return "0,00";

    }

    return numero.toLocaleString(
        "es-AR",
        {
            minimumFractionDigits:2,
            maximumFractionDigits:2
        }
    );

}


// =====================================================
// NÚMERO DE PRESUPUESTO
// =====================================================

function numeroPresupuesto(
    id,
    datos
){

    /*
     * Si en el futuro guardamos un número
     * de presupuesto real, lo utilizamos.
     */

    if(
        datos &&
        datos.numeroPresupuesto
    ){

        return String(
            datos.numeroPresupuesto
        );

    }


    /*
     * Por ahora utilizamos el mismo
     * sistema que tenía GESBASE.
     */

    let suma = 0;


    for(
        let i = 0;
        i < id.length;
        i++
    ){

        suma +=
        id.charCodeAt(i);

    }


    return String(
        suma % 1000000
    ).padStart(
        6,
        "0"
    );

}


// =====================================================
// MOSTRAR ERROR
// =====================================================

function mostrarError(
    mensaje
){

    errorElemento.textContent =
    mensaje;

    errorElemento.style.display =
    "block";

}


// =====================================================
// OCULTAR ERROR
// =====================================================

function ocultarError(){

    errorElemento.style.display =
    "none";

    errorElemento.textContent =
    "";

}


// =====================================================
// ELIMINAR PRESUPUESTO
// =====================================================

async function eliminarPresupuesto(
    id
){

    if(!usuarioActual){

        return;

    }


    const confirmar =
    confirm(
        "¿Seguro que querés eliminar este presupuesto?\n\nEsta acción no se puede deshacer."
    );


    if(!confirmar){

        return;

    }


    try{

        const referencia =
        doc(
            db,
            "presupuestos",
            id
        );


        const resultado =
        await getDoc(
            referencia
        );


        if(
            !resultado.exists()
        ){

            alert(
                "El presupuesto ya no existe."
            );

            await cargarPresupuestos();

            return;

        }


        const datos =
        resultado.data();


        /*
         * Seguridad:
         * solamente puede eliminar el usuario
         * propietario del presupuesto.
         */

        if(
            datos.uid !==
            usuarioActual.uid
        ){

            alert(
                "No tenés permiso para eliminar este presupuesto."
            );

            return;

        }


        await deleteDoc(
            referencia
        );


        alert(
            "Presupuesto eliminado correctamente."
        );


        await cargarPresupuestos();

    }
    catch(error){

        console.error(
            "ERROR ELIMINANDO PRESUPUESTO:",
            error
        );


        mostrarError(
            "No se pudo eliminar el presupuesto.\n\n" +
            "Código: " +
            (error.code || "desconocido") +
            "\n\n" +
            "Detalle: " +
            (error.message || "Error desconocido")
        );

    }

}


// =====================================================
// CREAR TARJETA
// =====================================================

function crearTarjeta(
    datos,
    id
){

    const tarjeta =
    document.createElement("div");

    tarjeta.className =
    "presupuesto";


    const numero =
    numeroPresupuesto(
        id,
        datos
    );


    const cliente =
    escaparHTML(
        datos.cliente ||
        "Cliente sin nombre"
    );


    const fecha =
    escaparHTML(
        datos.fecha ||
        "-"
    );


    const agenda =
    escaparHTML(
        datos.numeroAgenda ||
        "-"
    );


    const lugar =
    escaparHTML(
        datos.lugarTrabajo ||
        "-"
    );


    const descripcion =
    escaparHTML(
        datos.descripcion ||
        "Sin descripción"
    );


    tarjeta.innerHTML = `

        <div class="numero">
            PRESUPUESTO #${numero}
        </div>

        <div class="cliente">
            👤 ${cliente}
        </div>

        <div class="dato">
            📋 N.º de agenda:
            ${agenda}
        </div>

        <div class="dato">
            📅 Fecha:
            ${fecha}
        </div>

        <div class="dato">
            📍 Lugar:
            ${lugar}
        </div>

        <div class="descripcion">
            📝 ${descripcion}
        </div>

        <div class="dato">
            🧱 Materiales:
            $${dinero(datos.materiales)}
        </div>

        <div class="dato">
            🔨 Mano de obra:
            $${dinero(datos.manoObra)}
        </div>

        <div class="dato">
            🚗 Viáticos:
            $${dinero(datos.viaticos)}
        </div>

        <div class="total">
            TOTAL:
            $${dinero(datos.total)}
        </div>

        <a
            href="ver-presupuesto.html?id=${encodeURIComponent(id)}"
            class="boton boton-ver"
        >
            👁️ VER PRESUPUESTO
        </a>

        <a
            href="editar-presupuesto.html?id=${encodeURIComponent(id)}"
            class="boton boton-editar"
        >
            ✏️ EDITAR PRESUPUESTO
        </a>

        <button
            type="button"
            class="boton boton-eliminar"
        >
            🗑️ ELIMINAR PRESUPUESTO
        </button>

    `;


    const botonEliminar =
    tarjeta.querySelector(
        ".boton-eliminar"
    );


    botonEliminar.addEventListener(
        "click",
        function(){

            eliminarPresupuesto(
                id
            );

        }
    );


    return tarjeta;

}


// =====================================================
// MOSTRAR PRESUPUESTOS
// =====================================================

function mostrarPresupuestos(){

    lista.innerHTML =
    "";

    sinBusqueda.style.display =
    "none";


    const termino =
    buscador.value
        .trim()
        .toLowerCase();


    let filtrados =
    presupuestos;


    if(termino){

        filtrados =
        presupuestos.filter(
            function(item){

                const datos =
                item.datos;


                const cliente =
                String(
                    datos.cliente ||
                    ""
                ).toLowerCase();


                const agenda =
                String(
                    datos.numeroAgenda ||
                    ""
                ).toLowerCase();


                const lugar =
                String(
                    datos.lugarTrabajo ||
                    ""
                ).toLowerCase();


                const descripcion =
                String(
                    datos.descripcion ||
                    ""
                ).toLowerCase();


                const fecha =
                String(
                    datos.fecha ||
                    ""
                ).toLowerCase();


                return (
                    cliente.includes(termino) ||
                    agenda.includes(termino) ||
                    lugar.includes(termino) ||
                    descripcion.includes(termino) ||
                    fecha.includes(termino)
                );

            }
        );

    }


    if(
        filtrados.length === 0
    ){

        if(
            presupuestos.length > 0
        ){

            sinBusqueda.style.display =
            "block";

        }

        return;

    }


    filtrados.forEach(
        function(item){

            lista.appendChild(
                crearTarjeta(
                    item.datos,
                    item.id
                )
            );

        }
    );

}


// =====================================================
// CARGAR PRESUPUESTOS
// =====================================================

async function cargarPresupuestos(){

    if(!usuarioActual){

        return;

    }


    try{

        ocultarError();


        cargando.style.display =
        "block";


        lista.innerHTML =
        "";


        sinPresupuestos.style.display =
        "none";


        sinBusqueda.style.display =
        "none";


        usuarioElemento.textContent =
        "Usuario: " +
        (
            usuarioActual.email ||
            "Usuario autenticado"
        );


        /*
         * Buscamos solamente los presupuestos
         * creados por el usuario actualmente
         * autenticado.
         */

        const referencia =
        collection(
            db,
            "presupuestos"
        );


        const consulta =
        query(
            referencia,
            where(
                "uid",
                "==",
                usuarioActual.uid
            )
        );


        const resultado =
        await getDocs(
            consulta
        );


        presupuestos =
        [];


        resultado.forEach(
            function(documento){

                presupuestos.push({

                    id:
                    documento.id,

                    datos:
                    documento.data()

                });

            }
        );


        /*
         * Ordenar por fecha más reciente.
         */

        presupuestos.sort(
            function(a,b){

                const fechaA =
                String(
                    a.datos.fecha ||
                    ""
                );


                const fechaB =
                String(
                    b.datos.fecha ||
                    ""
                );


                if(
                    fechaA === fechaB
                ){

                    return 0;

                }


                return fechaA >
                    fechaB
                    ? -1
                    : 1;

            }
        );


        cargando.style.display =
        "none";


        if(
            presupuestos.length === 0
        ){

            sinPresupuestos.style.display =
            "block";

            usuarioElemento.className =
            "usuario estado-ok";

            usuarioElemento.textContent =
            "Sesión activa: " +
            (
                usuarioActual.email ||
                "Usuario autenticado"
            ) +
            " — No hay presupuestos cargados.";

            return;

        }


        usuarioElemento.className =
        "usuario estado-ok";

        usuarioElemento.textContent =
        "Sesión activa: " +
        (
            usuarioActual.email ||
            "Usuario autenticado"
        ) +
        " — " +
        presupuestos.length +
        (
            presupuestos.length === 1
                ? " presupuesto"
                : " presupuestos"
        );


        mostrarPresupuestos();

    }
    catch(error){

        console.error(
            "ERROR CARGANDO PRESUPUESTOS:",
            error
        );


        cargando.style.display =
        "none";


        lista.innerHTML =
        "";


        if(
            error.code ===
            "permission-denied"
        ){

            mostrarError(
                "Firebase rechazó el acceso a los presupuestos.\n\n" +
                "Revisá las reglas de Firestore para la colección 'presupuestos'."
            );

        }
        else if(
            error.code ===
            "failed-precondition"
        ){

            mostrarError(
                "Firebase necesita un índice para esta consulta.\n\n" +
                "Abrí el enlace que aparece en la consola de Firebase y creá el índice indicado."
            );

        }
        else if(
            error.code ===
            "unavailable"
        ){

            mostrarError(
                "Firebase no está disponible en este momento. Revisá tu conexión a Internet e intentá nuevamente."
            );

        }
        else{

            mostrarError(
                "No se pudieron cargar los presupuestos.\n\n" +
                "Código: " +
                (error.code || "desconocido") +
                "\n\n" +
                "Detalle: " +
                (error.message || "Error desconocido")
            );

        }

    }

}


// =====================================================
// BUSCADOR
// =====================================================

buscador.addEventListener(
    "input",
    function(){

        mostrarPresupuestos();

    }
);


// =====================================================
// ACTUALIZAR
// =====================================================

btnActualizar.addEventListener(
    "click",
    async function(){

        btnActualizar.disabled =
        true;


        btnActualizar.textContent =
        "⏳ CARGANDO...";


        try{

            await cargarPresupuestos();

        }
        finally{

            btnActualizar.disabled =
            false;


            btnActualizar.textContent =
            "🔄 ACTUALIZAR";

        }

    }
);


// =====================================================
// AUTENTICACIÓN
// =====================================================

onAuthStateChanged(
    auth,
    async function(usuario){

        console.log(
            "Estado de autenticación:",
            usuario
        );


        if(!usuario){

            usuarioElemento.textContent =
            "Sesión no iniciada. Redirigiendo...";


            window.location.replace(
                "./login.html"
            );


            return;

        }


        usuarioActual =
        usuario;


        usuarioElemento.textContent =
        "Sesión activa: " +
        (
            usuario.email ||
            "Usuario autenticado"
        );


        await cargarPresupuestos();

    }
);

</script>

</body>

</html>
