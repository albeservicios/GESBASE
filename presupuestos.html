></div></main></div><script type="module">

/* =====================================================
   FIREBASE
   IMPORTANTE:
   ESTA ES LA MISMA RUTA QUE USA presupuesto.html
===================================================== */

import {
    auth,
    db
} from "./Js/firebase.js";


import {
    onAuthStateChanged
} from "https://www.gstatic.com/firebasejs/12.18.0/firebase-auth.js";


import {
    collection,
    query,
    where,
    getDocs
} from "https://www.gstatic.com/firebasejs/12.18.0/firebase-firestore.js";


/* =====================================================
   ELEMENTOS
===================================================== */

const cargando =
document.getElementById("cargando");

const errorElemento =
document.getElementById("error");

const listaElemento =
document.getElementById("lista");

const buscar =
document.getElementById("buscar");


/* =====================================================
   VARIABLES
===================================================== */

let presupuestos = [];

let usuarioActual = null;


/* =====================================================
   ESCAPAR HTML
===================================================== */

function escapar(valor){

    return String(valor ?? "")
        .replaceAll("&","&amp;")
        .replaceAll("<","&lt;")
        .replaceAll(">","&gt;")
        .replaceAll('"',"&quot;")
        .replaceAll("'","&#039;");

}


/* =====================================================
   CONVERTIR NÚMERO
===================================================== */

function numero(valor){

    if(
        valor === undefined ||
        valor === null ||
        valor === ""
    ){

        return 0;

    }


    if(
        typeof valor === "number"
    ){

        return Number.isFinite(valor)
            ? valor
            : 0;

    }


    let texto =
    String(valor)
        .trim()
        .replace(/\$/g,"")
        .replace(/\s/g,"");


    /*
     * Formato argentino:
     * 1.250.500,50
     */

    if(texto.includes(",")){

        texto =
        texto
            .replace(/\./g,"")
            .replace(",",".");
    }


    const resultado =
    Number(texto);


    return Number.isFinite(resultado)
        ? resultado
        : 0;

}


/* =====================================================
   DINERO
===================================================== */

function dinero(valor){

    return numero(valor).toLocaleString(
        "es-AR",
        {
            minimumFractionDigits:2,
            maximumFractionDigits:2
        }
    );

}


/* =====================================================
   CLIENTE
===================================================== */

function obtenerCliente(datos){

    return (

        datos.cliente ||

        datos.nombreCliente ||

        datos.clienteNombre ||

        datos.nombreEmpresaCliente ||

        datos.empresaCliente ||

        "Sin cliente"

    );

}


/* =====================================================
   NÚMERO
===================================================== */

function obtenerNumero(datos,id){

    return (

        datos.numeroAgenda ||

        datos.numero ||

        datos.numeroPresupuesto ||

        datos.codigo ||

        datos.nro ||

        id.substring(0,8)

    );

}


/* =====================================================
   FECHA
===================================================== */

function obtenerFecha(datos){

    if(datos.fecha){

        return String(datos.fecha);

    }


    if(
        datos.creado &&
        typeof datos.creado.toDate === "function"
    ){

        try{

            return datos.creado
                .toDate()
                .toLocaleDateString("es-AR");

        }
        catch(error){

            console.warn(
                "Error convirtiendo fecha:",
                error
            );

        }

    }


    if(
        datos.fechaCreacion &&
        typeof datos.fechaCreacion.toDate === "function"
    ){

        try{

            return datos.fechaCreacion
                .toDate()
                .toLocaleDateString("es-AR");

        }
        catch(error){

            console.warn(
                "Error convirtiendo fechaCreacion:",
                error
            );

        }

    }


    return "Sin fecha";

}


/* =====================================================
   DESCRIPCIÓN
===================================================== */

function obtenerDescripcion(datos){

    return (

        datos.descripcion ||

        datos.tareas ||

        datos.titulo ||

        datos.concepto ||

        datos.detalle ||

        "Presupuesto sin descripción"

    );

}


/* =====================================================
   TOTAL
===================================================== */

function obtenerTotal(datos){

    /*
     * Primero usamos el total guardado.
     */

    if(
        datos.total !== undefined &&
        datos.total !== null
    ){

        return numero(
            datos.total
        );

    }


    if(
        datos.totalFinal !== undefined &&
        datos.totalFinal !== null
    ){

        return numero(
            datos.totalFinal
        );

    }


    if(
        datos.importe !== undefined &&
        datos.importe !== null
    ){

        return numero(
            datos.importe
        );

    }


    if(
        datos.monto !== undefined &&
        datos.monto !== null
    ){

        return numero(
            datos.monto
        );

    }


    /*
     * Si no hay total, lo calculamos.
     */

    const materiales =
    numero(
        datos.materiales ??
        datos.importeMaterial
    );


    const manoObra =
    numero(
        datos.manoObra ??
        datos.importeManoObra
    );


    const viaticos =
    numero(
        datos.viaticos ??
        datos.importeViaticos
    );


    const flete =
    numero(
        datos.flete ??
        datos.importeFlete
    );


    return (
        materiales +
        manoObra +
        viaticos +
        flete
    );

}


/* =====================================================
   MOSTRAR ERROR
===================================================== */

function mostrarError(mensaje){

    cargando.style.display =
    "none";

    listaElemento.style.display =
    "none";

    errorElemento.textContent =
    mensaje;

    errorElemento.style.display =
    "block";

}


/* =====================================================
   CARGAR PRESUPUESTOS
===================================================== */

async function cargarPresupuestos(){

    console.log(
        "GESBASE: iniciando carga de presupuestos"
    );


    if(!usuarioActual){

        mostrarError(
            "No hay un usuario autenticado."
        );

        return;

    }


    cargando.style.display =
    "block";

    errorElemento.style.display =
    "none";

    listaElemento.style.display =
    "none";


    try{

        console.log(
            "GESBASE UID:",
            usuarioActual.uid
        );


        const referencia =
        collection(
            db,
            "presupuestos"
        );


        /*
         * LOS PRESUPUESTOS DE presupuesto.html
         * SE GUARDAN CON:
         *
         * uid: usuarioActual.uid
         *
         * Por eso buscamos exactamente por uid.
         */

        const consulta =
        query(
            referencia,
            where(
                "uid",
                "==",
                usuarioActual.uid
            )
        );


        console.log(
            "GESBASE: consultando Firestore..."
        );


        const resultado =
        await getDocs(
            consulta
        );


        console.log(
            "GESBASE: documentos encontrados:",
            resultado.size
        );


        presupuestos = [];


        resultado.forEach(
            function(documento){

                const datos =
                documento.data();


                console.log(
                    "Presupuesto:",
                    documento.id,
                    datos
                );


                presupuestos.push({

                    id:
                    documento.id,

                    datos:
                    datos

                });

            }
        );


        /*
         * Ordenar por fecha.
         */

        presupuestos.sort(
            function(a,b){

                const fechaA =
                a.datos.creado?.seconds ||
                a.datos.fechaCreacion?.seconds ||
                0;


                const fechaB =
                b.datos.creado?.seconds ||
                b.datos.fechaCreacion?.seconds ||
                0;


                return fechaB - fechaA;

            }
        );


        mostrarPresupuestos(
            presupuestos
        );

    }
    catch(error){

        console.error(
            "GESBASE ERROR CARGANDO PRESUPUESTOS:",
            error
        );


        let detalle =
        error?.message ||
        "Error desconocido.";


        if(
            error?.code ===
            "permission-denied"
        ){

            detalle =
            "Firebase rechazó el acceso a la colección 'presupuestos'. Revisá las reglas de Firestore.";

        }


        if(
            error?.code ===
            "failed-precondition"
        ){

            detalle =
            "Firestore requiere una configuración adicional o un índice.";

        }


        if(
            error?.code ===
            "unauthenticated"
        ){

            detalle =
            "La sesión de Firebase no está autenticada.";

        }


        mostrarError(
            "No se pudieron cargar los presupuestos.\n\n" +
            "Código: " +
            (error?.code || "sin código") +
            "\n\n" +
            "Detalle: " +
            detalle
        );

    }

}


/* =====================================================
   MOSTRAR PRESUPUESTOS
===================================================== */

function mostrarPresupuestos(lista){

    cargando.style.display =
    "none";

    errorElemento.style.display =
    "none";

    listaElemento.style.display =
    "flex";


    /*
     * NO HAY PRESUPUESTOS
     */

    if(!lista.length){

        listaElemento.innerHTML = `

            <div class="mensaje">

                <strong>
                    Todavía no tenés presupuestos registrados.
                </strong>

                <br><br>

                Si acabás de crear uno,
                verificá que se haya guardado correctamente.

                <br><br>

                <a
                    href="./presupuesto.html"
                    class="boton nuevo"
                >
                    ➕ CREAR PRESUPUESTO
                </a>

            </div>

        `;

        return;

    }


    listaElemento.innerHTML =
    "";


    /*
     * CREAR TARJETAS
     */

    lista.forEach(
        function(item){

            const datos =
            item.datos;


            const numeroPresupuesto =
            obtenerNumero(
                datos,
                item.id
            );


            const cliente =
            obtenerCliente(
                datos
            );


            const descripcion =
            obtenerDescripcion(
                datos
            );


            const fecha =
            obtenerFecha(
                datos
            );


            const total =
            obtenerTotal(
                datos
            );


            const estado =
            datos.estado ||

            datos.estadoPresupuesto ||

            "Pendiente";


            const elemento =
            document.createElement(
                "article"
            );


            elemento.className =
            "presupuesto";


            elemento.innerHTML = `

                <div class="presupuesto-cabecera">

                    <div class="presupuesto-numero">

                        Presupuesto N.º
                        ${escapar(
                            numeroPresupuesto
                        )}

                    </div>

                    <span class="estado">

                        ${escapar(
                            estado
                        )}

                    </span>

                </div>


                <div class="dato">

                    <strong>
                        Cliente:
                    </strong>

                    ${escapar(
                        cliente
                    )}

                </div>


                <div class="dato">

                    <strong>
                        Fecha:
                    </strong>

                    ${escapar(
                        fecha
                    )}

                </div>


                <div class="dato">

                    <strong>
                        Lugar:
                    </strong>

                    ${escapar(
                        datos.lugarTrabajo ||
                        "Sin informar"
                    )}

                </div>


                <div class="dato">

                    <strong>
                        Descripción:
                    </strong>

                    ${escapar(
                        descripcion
                    )}

                </div>


                <div class="total">

                    Total:
                    $ ${dinero(total)}

                </div>


                <div class="acciones">

                    <a
                        class="accion ver"
                        href="./ver-presupuesto.html?id=${encodeURIComponent(item.id)}"
                    >
                        👁️ VER
                    </a>


                    <a
                        class="accion editar"
                        href="./editar-presupuesto.html?id=${encodeURIComponent(item.id)}"
                    >
                        ✏️ EDITAR
                    </a>


                    <a
                        class="accion trabajo"
                        href="./trabajo.html?presupuestoId=${encodeURIComponent(item.id)}"
                    >
                        🔧 CREAR TRABAJO
                    </a>

                </div>

            `;


            listaElemento.appendChild(
                elemento
            );

        }
    );

}


/* =====================================================
   BUSCADOR
===================================================== */

buscar.addEventListener(
    "input",
    function(){

        const textoBusqueda =
        buscar.value
            .toLowerCase()
            .trim();


        if(!textoBusqueda){

            mostrarPresupuestos(
                presupuestos
            );

            return;

        }


        const filtrados =
        presupuestos.filter(
            function(item){

                const datos =
                item.datos;


                const contenido = (

                    obtenerNumero(
                        datos,
                        item.id
                    )

                    + " "

                    +

                    obtenerCliente(
                        datos
                    )

                    + " "

                    +

                    obtenerDescripcion(
                        datos
                    )

                    + " "

                    +

                    obtenerFecha(
                        datos
                    )

                    + " "

                    +

                    (
                        datos.lugarTrabajo ||
                        ""
                    )

                ).toLowerCase();


                return contenido.includes(
                    textoBusqueda
                );

            }
        );


        mostrarPresupuestos(
            filtrados
        );

    }
);


/* =====================================================
   AUTENTICACIÓN
===================================================== */

console.log(
    "GESBASE: esperando autenticación..."
);


onAuthStateChanged(
    auth,
    async function(usuario){

        console.log(
            "GESBASE AUTH:",
            usuario
                ? usuario.uid
                : "SIN SESIÓN"
        );


        if(!usuario){

            cargando.textContent =
            "No hay una sesión iniciada. Redirigiendo...";


            setTimeout(
                function(){

                    window.location.replace(
                        "./login.html"
                    );

                },
                800
            );


            return;

        }


        usuarioActual =
        usuario;


        await cargarPresupuestos();

    }
);


/* =====================================================
   CONTROL DE TIEMPO
===================================================== */

setTimeout(
    function(){

        if(
            cargando.style.display !==
            "none"
        ){

            console.error(
                "GESBASE: tiempo de espera agotado."
            );


            mostrarError(

                "GESBASE tardó demasiado en cargar los presupuestos.\n\n" +

                "Usuario: " +

                (
                    usuarioActual
                        ? usuarioActual.uid
                        : "NO DETECTADO"
                ) +

                "\n\n" +

                "Si aparece este mensaje, abrí la consola del navegador para ver el error de Firebase."

            );

        }

    },
    15000
);

</script>
