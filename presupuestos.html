<!DOCTYPE html>
<html lang="es">

<head>

<meta charset="UTF-8">

<meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
>

<meta
    name="theme-color"
    content="#111827"
>

<title>Mis presupuestos - GESBASE</title>

<style>

* {
    box-sizing: border-box;
    margin: 0;
    padding: 0;
}

body {
    font-family: Arial, sans-serif;
    background: #f3f4f6;
    color: #111827;
}

.contenedor {
    max-width: 600px;
    margin: auto;
    min-height: 100vh;
    background: white;
}

header {
    background: #111827;
    color: white;
    padding: 25px 20px;
}

header h1 {
    font-size: 25px;
}

header p {
    margin-top: 6px;
    color: #d1d5db;
}

main {
    padding: 20px;
}

.usuario {
    background: #f3f4f6;
    padding: 13px;
    border-radius: 10px;
    margin-bottom: 18px;
    font-size: 14px;
}

.cargando {
    text-align: center;
    padding: 35px 10px;
    color: #6b7280;
}

.lista {
    display: flex;
    flex-direction: column;
    gap: 15px;
}

.presupuesto {
    padding: 18px;
    border: 1px solid #d1d5db;
    border-radius: 14px;
    background: white;
    box-shadow: 0 3px 10px rgba(0,0,0,.08);
}

.numero {
    font-size: 14px;
    font-weight: bold;
    color: #6b7280;
    margin-bottom: 8px;
}

.cliente {
    font-size: 20px;
    font-weight: bold;
    margin-bottom: 10px;
}

.dato {
    margin-top: 7px;
    font-size: 14px;
    color: #4b5563;
}

.descripcion {
    margin-top: 10px;
    line-height: 1.45;
}

.total {
    margin-top: 14px;
    font-size: 20px;
    font-weight: bold;
}

/* =====================================
   BOTÓN VER
===================================== */

.boton-ver {
    display: block;
    width: 100%;
    margin-top: 18px;
    padding: 15px;
    border-radius: 10px;
    background: #111827;
    color: white;
    text-align: center;
    text-decoration: none;
    font-size: 16px;
    font-weight: bold;
}

.boton-ver:active {
    transform: scale(.98);
}

/* =====================================
   BOTONES INFERIORES
===================================== */

.boton-nuevo,
.boton-volver {
    display: block;
    width: 100%;
    padding: 15px;
    border-radius: 10px;
    text-align: center;
    text-decoration: none;
    font-size: 16px;
    font-weight: bold;
    margin-top: 10px;
}

.boton-nuevo {
    background: #111827;
    color: white;
}

.boton-volver {
    background: #e5e7eb;
    color: #111827;
}

.sin-presupuestos {
    text-align: center;
    padding: 30px;
    color: #6b7280;
}

.error {
    display: none;
    background: #fee2e2;
    color: #991b1b;
    padding: 14px;
    border-radius: 10px;
    margin-bottom: 15px;
}

</style>

</head>

<body>

<div class="contenedor">

<header>

<h1>
Mis presupuestos
</h1>

<p>
GESBASE
</p>

</header>


<main>

<div
    id="usuario"
    class="usuario"
>
Verificando usuario...
</div>


<div
    id="error"
    class="error"
></div>


<div
    id="cargando"
    class="cargando"
>
Cargando presupuestos...
</div>


<div
    id="lista"
    class="lista"
></div>


<div
    id="sinPresupuestos"
    class="sin-presupuestos"
    style="display:none;"
>
Todavía no tenés presupuestos.
</div>


<a
    href="presupuesto.html"
    class="boton-nuevo"
>
+ NUEVO PRESUPUESTO
</a>


<a
    href="index.html"
    class="boton-volver"
>
VOLVER A GESBASE
</a>

</main>

</div>


<script type="module">

// ==========================================
// FIREBASE
// ==========================================

import {
    auth,
    db
} from "./Js/firebase.js";


import {
    onAuthStateChanged
} from
"https://www.gstatic.com/firebasejs/12.1.0/firebase-auth.js";


import {
    collection,
    query,
    where,
    getDocs
} from
"https://www.gstatic.com/firebasejs/12.1.0/firebase-firestore.js";


// ==========================================
// ELEMENTOS
// ==========================================

const usuarioElemento =
document.getElementById("usuario");

const cargando =
document.getElementById("cargando");

const lista =
document.getElementById("lista");

const sinPresupuestos =
document.getElementById("sinPresupuestos");

const errorElemento =
document.getElementById("error");


// ==========================================
// DINERO
// ==========================================

function dinero(valor) {

    return Number(valor || 0)
        .toLocaleString(
            "es-AR",
            {
                minimumFractionDigits: 2,
                maximumFractionDigits: 2
            }
        );

}


// ==========================================
// NÚMERO
// ==========================================

function numeroPresupuesto(id) {

    let suma = 0;

    for (
        let i = 0;
        i < id.length;
        i++
    ) {

        suma +=
            id.charCodeAt(i);

    }

    return String(
        suma % 1000000
    ).padStart(
        6,
        "0"
    );

}


// ==========================================
// CARGAR
// ==========================================

async function cargarPresupuestos(usuario) {

    try {

        usuarioElemento.textContent =
            "Usuario: " +
            usuario.email;


        const referencia =
            collection(
                db,
                "presupuestos"
            );


        const consulta =
            query(
                referencia,
                where(
                    "uid",
                    "==",
                    usuario.uid
                )
            );


        const resultado =
            await getDocs(
                consulta
            );


        cargando.style.display =
            "none";


        if (
            resultado.empty
        ) {

            sinPresupuestos.style.display =
                "block";

            return;

        }


        lista.innerHTML = "";


        resultado.forEach(
            function(documento) {

                const datos =
                    documento.data();


                const numero =
                    numeroPresupuesto(
                        documento.id
                    );


                const tarjeta =
                    document.createElement(
                        "div"
                    );


                tarjeta.className =
                    "presupuesto";


                tarjeta.innerHTML = `

                    <div class="numero">
                        PRESUPUESTO #${numero}
                    </div>

                    <div class="cliente">
                        ${datos.cliente || "Sin cliente"}
                    </div>

                    <div class="dato">
                        📅 Fecha:
                        ${datos.fecha || "-"}
                    </div>

                    <div class="descripcion">
                        ${datos.descripcion || "Sin descripción"}
                    </div>

                    <div class="dato">
                        Materiales:
                        $${dinero(datos.materiales)}
                    </div>

                    <div class="dato">
                        Mano de obra:
                        $${dinero(datos.manoObra)}
                    </div>

                    <div class="dato">
                        Viáticos:
                        $${dinero(datos.viaticos)}
                    </div>

                    <div class="total">
                        TOTAL:
                        $${dinero(datos.total)}
                    </div>

                    <a
                        href="ver-presupuesto.html?id=${documento.id}"
                        class="boton-ver"
                    >
                        👁️ VER PRESUPUESTO
                    </a>

                `;


                lista.appendChild(
                    tarjeta
                );

            }
        );


    } catch (error) {

        console.error(
            "Error:",
            error
        );


        cargando.style.display =
            "none";


        errorElemento.textContent =
            "Error al cargar: " +
            error.message;


        errorElemento.style.display =
            "block";

    }

}


// ==========================================
// SESIÓN
// ==========================================

onAuthStateChanged(
    auth,
    function(usuario) {

        if (!usuario) {

            window.location.replace(
                "login.html"
            );

            return;

        }


        cargarPresupuestos(
            usuario
        );

    }
);

</script>

</body>

</html>
