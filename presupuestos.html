<!DOCTYPE html>
<html lang="es">

<head>

<meta charset="UTF-8">

<meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
>

<meta
    name="theme-color"
    content="#111827"
>

<title>Mis presupuestos - GESBASE</title>

<style>

* {
    box-sizing: border-box;
    margin: 0;
    padding: 0;
}

body {
    font-family: Arial, sans-serif;
    background: #f3f4f6;
    color: #111827;
}

.contenedor {
    max-width: 600px;
    margin: auto;
    min-height: 100vh;
    background: white;
}

header {
    background: #111827;
    color: white;
    padding: 25px 20px;
}

header h1 {
    font-size: 25px;
}

header p {
    margin-top: 6px;
    font-size: 14px;
    color: #d1d5db;
}

main {
    padding: 20px;
}

.cargando {
    text-align: center;
    padding: 35px 10px;
    color: #6b7280;
}

.lista {
    display: flex;
    flex-direction: column;
    gap: 14px;
}

.presupuesto {
    padding: 17px;
    border: 1px solid #e5e7eb;
    border-radius: 12px;
    background: white;
    box-shadow: 0 2px 7px rgba(0,0,0,.06);
}

.presupuesto h2 {
    font-size: 18px;
    margin-bottom: 8px;
}

.dato {
    margin-top: 6px;
    font-size: 14px;
    color: #4b5563;
}

.total {
    margin-top: 12px;
    font-size: 19px;
    font-weight: bold;
}

.sin-presupuestos {
    text-align: center;
    padding: 30px 15px;
    color: #6b7280;
}

.botones {
    margin-top: 20px;
}

button {
    width: 100%;
    padding: 15px;
    border: none;
    border-radius: 10px;
    font-size: 16px;
    font-weight: bold;
    cursor: pointer;
    margin-bottom: 10px;
}

.nuevo {
    background: #111827;
    color: white;
}

.volver {
    background: #e5e7eb;
    color: #111827;
}

.error {
    background: #fee2e2;
    color: #991b1b;
    padding: 14px;
    border-radius: 10px;
    margin-bottom: 15px;
    display: none;
}

</style>

</head>

<body>

<div class="contenedor">

<header>

<h1>
Mis presupuestos
</h1>

<p>
GESBASE
</p>

</header>


<main>

<div
    id="error"
    class="error"
></div>


<div
    id="cargando"
    class="cargando"
>
Cargando presupuestos...
</div>


<div
    id="lista"
    class="lista"
></div>


<div
    id="sinPresupuestos"
    class="sin-presupuestos"
    style="display:none;"
>

Todavía no tenés presupuestos.

</div>


<div class="botones">

<button
    class="nuevo"
    id="btnNuevo"
>
+ Nuevo presupuesto
</button>


<button
    class="volver"
    id="btnVolver"
>
Volver a GESBASE
</button>

</div>

</main>

</div>


<script type="module">

// ==========================================
// FIREBASE
// ==========================================

import {
    auth
} from "./Js/firebase.js";


// ==========================================
// ELEMENTOS
// ==========================================

const cargando =
document.getElementById(
    "cargando"
);

const lista =
document.getElementById(
    "lista"
);

const sinPresupuestos =
document.getElementById(
    "sinPresupuestos"
);

const error =
document.getElementById(
    "error"
);


// ==========================================
// COMPROBAR SESIÓN
// ==========================================

import {
    onAuthStateChanged
} from
"https://www.gstatic.com/firebasejs/12.1.0/firebase-auth.js";


onAuthStateChanged(
    auth,
    function(usuario) {

        if (!usuario) {

            window.location.replace(
                "login.html"
            );

            return;

        }


        // Por ahora solo comprobamos
        // que la pantalla reconoce
        // al usuario conectado.

        cargando.style.display =
            "none";


        sinPresupuestos.style.display =
            "block";

    }
);


// ==========================================
// NUEVO PRESUPUESTO
// ==========================================

document
.getElementById("btnNuevo")
.addEventListener(
    "click",
    function() {

        window.location.href =
            "presupuesto.html";

    }
);


// ==========================================
// VOLVER
// ==========================================

document
.getElementById("btnVolver")
.addEventListener(
    "click",
    function() {

        window.location.href =
            "index.html";

    }
);

</script>

</body>

</html>
