<div
    id="estado"
    class="estado cargando"
>
    Cargando presupuestos...
</div><div

    class="lista"
    style="display:none;"
></div></main></div><script type="module">

/* ==========================================
   FIREBASE
========================================== */

import {
    auth,
    db
} from "./firebase.js";


import {
    onAuthStateChanged
} from "https://www.gstatic.com/firebasejs/12.18.0/firebase-auth.js";


import {
    collection,
    getDocs
} from "https://www.gstatic.com/firebasejs/12.18.0/firebase-firestore.js";


/* ==========================================
   ELEMENTOS
========================================== */

const estado =
document.getElementById("estado");

const lista =
document.getElementById("lista");

const buscar =
document.getElementById("buscar");


/* ==========================================
   VARIABLES
========================================== */

let usuarioActual = null;

let presupuestos = [];


/* ==========================================
   ESCAPAR HTML
========================================== */

function escapar(valor){

    return String(valor ?? "")
        .replaceAll("&","&amp;")
        .replaceAll("<","&lt;")
        .replaceAll(">","&gt;")
        .replaceAll('"',"&quot;")
        .replaceAll("'","&#039;");

}


/* ==========================================
   NUMERO
========================================== */

function numero(valor){

    if(
        valor === undefined ||
        valor === null ||
        valor === ""
    ){

        return 0;

    }


    if(
        typeof valor === "number"
    ){

        return Number.isFinite(valor)
            ? valor
            : 0;

    }


    let texto =
    String(valor)
        .trim()
        .replace(/\$/g,"")
        .replace(/\s/g,"");


    if(
        texto.includes(",")
    ){

        texto =
        texto
            .replace(/\./g,"")
            .replace(",", ".");

    }


    const resultado =
    Number(texto);


    return Number.isFinite(resultado)
        ? resultado
        : 0;

}


/* ==========================================
   DINERO
========================================== */

function dinero(valor){

    return numero(valor).toLocaleString(
        "es-AR",
        {
            minimumFractionDigits:2,
            maximumFractionDigits:2
        }
    );

}


/* ==========================================
   PERTENECE AL USUARIO
========================================== */

function perteneceAlUsuario(datos){

    if(!usuarioActual){

        return false;

    }


    const uid =
    usuarioActual.uid;


    /*
     * Estructura actual
     */

    if(
        datos.uid &&
        datos.uid === uid
    ){

        return true;

    }


    /*
     * Estructuras anteriores
     */

    if(
        datos.usuarioId &&
        datos.usuarioId === uid
    ){

        return true;

    }


    if(
        datos.userId &&
        datos.userId === uid
    ){

        return true;

    }


    if(
        datos.empresaId &&
        datos.empresaId === uid
    ){

        return true;

    }


    return false;

}


/* ==========================================
   OBTENER CLIENTE
========================================== */

function obtenerCliente(datos){

    return (

        datos.cliente ||

        datos.nombreCliente ||

        datos.clienteNombre ||

        datos.nombreEmpresaCliente ||

        datos.empresaCliente ||

        "Sin cliente"

    );

}


/* ==========================================
   OBTENER NUMERO
========================================== */

function obtenerNumero(datos,id){

    return (

        datos.numero ||

        datos.numeroPresupuesto ||

        datos.codigo ||

        datos.nro ||

        id.substring(0,8)

    );

}


/* ==========================================
   OBTENER FECHA
========================================== */

function obtenerFecha(datos){

    if(datos.fecha){

        return String(
            datos.fecha
        );

    }


    if(
        datos.creado &&
        typeof datos.creado.toDate ===
        "function"
    ){

        try{

            return datos.creado
                .toDate()
                .toLocaleDateString("es-AR");

        }
        catch(error){

            console.warn(
                "Error convirtiendo fecha:",
                error
            );

        }

    }


    if(
        datos.fechaCreacion &&
        typeof datos.fechaCreacion.toDate ===
        "function"
    ){

        try{

            return datos.fechaCreacion
                .toDate()
                .toLocaleDateString("es-AR");

        }
        catch(error){

            console.warn(
                "Error convirtiendo fechaCreacion:",
                error
            );

        }

    }


    return "Sin fecha";

}


/* ==========================================
   DESCRIPCION
========================================== */

function obtenerDescripcion(datos){

    return (

        datos.descripcion ||

        datos.tareas ||

        datos.titulo ||

        datos.concepto ||

        datos.detalle ||

        "Presupuesto sin descripción"

    );

}


/* ==========================================
   TOTAL
========================================== */

function obtenerTotal(datos){

    /*
     * Primero buscamos total guardado.
     */

    const totalGuardado =
    numero(
        datos.total ??
        datos.totalFinal ??
        datos.importe ??
        datos.monto
    );


    if(totalGuardado > 0){

        return totalGuardado;

    }


    /*
     * Si no existe,
     * calculamos nuevamente.
     */

    const materiales =
    numero(
        datos.materiales ??
        datos.importeMaterial
    );


    const manoObra =
    numero(
        datos.manoObra ??
        datos.importeManoObra
    );


    const viaticos =
    numero(
        datos.viaticos ??
        datos.importeViaticos
    );


    const flete =
    numero(
        datos.flete ??
        datos.importeFlete
    );


    return (
        materiales +
        manoObra +
        viaticos +
        flete
    );

}


/* ==========================================
   CARGAR PRESUPUESTOS
========================================== */

async function cargarPresupuestos(){

    estado.className =
    "estado cargando";

    estado.textContent =
    "Cargando presupuestos...";

    estado.style.display =
    "block";

    lista.style.display =
    "none";


    try{

        console.log(
            "GESBASE: cargando presupuestos..."
        );

        console.log(
            "UID:",
            usuarioActual.uid
        );


        /*
         * IMPORTANTE:
         *
         * No usamos query + where.
         *
         * Leemos la colección y filtramos
         * en JavaScript.
         *
         * Esto permite trabajar con documentos
         * que fueron guardados con:
         *
         * uid
         * usuarioId
         * userId
         * empresaId
         *
         */

        const referencia =
        collection(
            db,
            "presupuestos"
        );


        const resultado =
        await getDocs(
            referencia
        );


        console.log(
            "Documentos encontrados:",
            resultado.size
        );


        presupuestos = [];


        resultado.forEach(
            function(documento){

                const datos =
                documento.data();


                console.log(
                    "Presupuesto:",
                    documento.id,
                    datos
                );


                if(
                    perteneceAlUsuario(
                        datos
                    )
                ){

                    presupuestos.push({

                        id:
                        documento.id,

                        datos:
                        datos

                    });

                }

            }
        );


        console.log(
            "Presupuestos del usuario:",
            presupuestos.length
        );


        /*
         * ORDENAR
         */

        presupuestos.sort(
            function(a,b){

                const fechaA =
                a.datos.creado?.seconds ||
                a.datos.fechaCreacion?.seconds ||
                0;


                const fechaB =
                b.datos.creado?.seconds ||
                b.datos.fechaCreacion?.seconds ||
                0;


                return fechaB - fechaA;

            }
        );


        mostrarPresupuestos(
            presupuestos
        );

    }
    catch(error){

        console.error(
            "ERROR CARGANDO PRESUPUESTOS:",
            error
        );


        estado.className =
        "estado error";


        estado.textContent =
        "No se pudieron cargar los presupuestos.\n\n" +
        "Error: " +
        error.message;


        lista.style.display =
        "none";

    }

}


/* ==========================================
   MOSTRAR
========================================== */

function mostrarPresupuestos(listaPresupuestos){

    lista.innerHTML = "";


    if(!listaPresupuestos.length){

        estado.className =
        "estado exito";


        estado.textContent =
        "No se encontraron presupuestos asociados a esta cuenta.";


        lista.innerHTML = `

            <div class="vacio">

                Todavía no tenés presupuestos registrados.

                <br><br>

                Si ya creaste uno, verificaremos
                la estructura de propietario
                en el siguiente paso.

                <br><br>

                <a
                    href="presupuesto.html"
                    class="boton nuevo"
                >
                    ➕ CREAR PRESUPUESTO
                </a>

            </div>

        `;


        lista.style.display =
        "flex";


        return;

    }


    estado.className =
    "estado exito";


    estado.textContent =
    "Presupuestos cargados: " +
    listaPresupuestos.length;


    lista.style.display =
    "flex";


    listaPresupuestos.forEach(
        function(item){

            const datos =
            item.datos;


            const numeroPresupuesto =
            obtenerNumero(
                datos,
                item.id
            );


            const cliente =
            obtenerCliente(
                datos
            );


            const fecha =
            obtenerFecha(
                datos
            );


            const descripcion =
            obtenerDescripcion(
                datos
            );


            const total =
            obtenerTotal(
                datos
            );


            const estadoPresupuesto =
            datos.estado ||
            datos.estadoPresupuesto ||
            "Pendiente";


            const elemento =
            document.createElement(
                "article"
            );


            elemento.className =
            "presupuesto";


            elemento.innerHTML = `

                <div class="presupuesto-cabecera">

                    <div class="presupuesto-numero">

                        Presupuesto N.º
                        ${escapar(
                            numeroPresupuesto
                        )}

                    </div>

                    <span class="estado-presupuesto">

                        ${escapar(
                            estadoPresupuesto
                        )}

                    </span>

                </div>


                <div class="dato">

                    <strong>
                        Cliente:
                    </strong>

                    ${escapar(
                        cliente
                    )}

                </div>


                <div class="dato">

                    <strong>
                        Fecha:
                    </strong>

                    ${escapar(
                        fecha
                    )}

                </div>


                <div class="dato">

                    <strong>
                        Descripción:
                    </strong>

                    ${escapar(
                        descripcion
                    )}

                </div>


                <div class="total">

                    Total:
                    $ ${dinero(total)}

                </div>


                <div class="acciones">

                    <a
                        class="accion ver"
                        href="ver-presupuesto.html?id=${encodeURIComponent(item.id)}"
                    >
                        👁️ VER
                    </a>


                    <a
                        class="accion editar"
                        href="editar-presupuesto.html?id=${encodeURIComponent(item.id)}"
                    >
                        ✏️ EDITAR
                    </a>


                    <a
                        class="accion trabajo"
                        href="trabajo.html?presupuestoId=${encodeURIComponent(item.id)}"
                    >
                        🔧 CREAR TRABAJO
                    </a>

                </div>

            `;


            lista.appendChild(
                elemento
            );

        }
    );

}


/* ==========================================
   BUSCAR
========================================== */

buscar.addEventListener(
    "input",
    function(){

        const texto =
        buscar.value
            .toLowerCase()
            .trim();


        if(!texto){

            mostrarPresupuestos(
                presupuestos
            );

            return;

        }


        const filtrados =
        presupuestos.filter(
            function(item){

                const datos =
                item.datos;


                const contenido = (

                    obtenerNumero(
                        datos,
                        item.id
                    )

                    + " "

                    + obtenerCliente(
                        datos
                    )

                    + " "

                    + obtenerDescripcion(
                        datos
                    )

                    + " "

                    + obtenerFecha(
                        datos
                    )

                ).toLowerCase();


                return contenido.includes(
                    texto
                );

            }
        );


        mostrarPresupuestos(
            filtrados
        );

    }
);


/* ==========================================
   AUTENTICACION
========================================== */

onAuthStateChanged(
    auth,
    async function(usuario){

        console.log(
            "GESBASE - Auth:",
            usuario
                ? usuario.uid
                : "SIN SESIÓN"
        );


        if(!usuario){

            estado.className =
            "estado error";

            estado.textContent =
            "No hay una sesión iniciada. Redirigiendo...";


            setTimeout(
                function(){

                    window.location.replace(
                        "login.html"
                    );

                },
                1000
            );


            return;

        }


        usuarioActual =
        usuario;


        await cargarPresupuestos();

    }
);


/* ==========================================
   CONTROL DE TIEMPO
========================================== */

setTimeout(
    function(){

        if(
            estado.style.display !== "none" &&
            estado.classList.contains(
                "cargando"
            )
        ){

            estado.className =
            "estado error";


            estado.textContent =
            "GESBASE tardó demasiado en cargar.\n\n" +
            "Esto normalmente indica un problema con Firebase, " +
            "las reglas de Firestore o la sesión.";

        }

    },
    15000
);

</script></body>
