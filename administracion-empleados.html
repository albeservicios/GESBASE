<!DOCTYPE html>
<html lang="es">

<head>

<meta charset="UTF-8">

<meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
>

<meta
    name="theme-color"
    content="#111827"
>

<title>Administración de empleados - GESBASE</title>

<style>

* {
    box-sizing: border-box;
}

body {
    margin: 0;
    font-family:
        -apple-system,
        BlinkMacSystemFont,
        "Segoe UI",
        Roboto,
        Arial,
        sans-serif;
    background: #f3f4f6;
    color: #111827;
}

header {
    background: #111827;
    color: white;
    padding: 16px;
}

.header {
    max-width: 1100px;
    margin: auto;
    display: flex;
    align-items: center;
    gap: 12px;
}

header h1 {
    margin: 0;
    font-size: 19px;
}

header p {
    margin: 4px 0 0;
    color: #d1d5db;
    font-size: 13px;
}

main {
    max-width: 1100px;
    margin: auto;
    padding: 18px 12px 50px;
}

button {
    border: 0;
    cursor: pointer;
}

.volver {
    background: #374151;
    color: white;
    padding: 10px 13px;
    border-radius: 10px;
}

.tarjeta {
    background: white;
    border-radius: 16px;
    padding: 18px;
    margin-bottom: 16px;
    box-shadow: 0 3px 15px rgba(0,0,0,.06);
}

h2 {
    margin-top: 0;
    font-size: 18px;
}

label {
    display: block;
    font-size: 13px;
    font-weight: 700;
    margin-bottom: 7px;
}

input,
select {
    width: 100%;
    padding: 12px;
    border: 1px solid #d1d5db;
    border-radius: 10px;
    background: white;
    font-size: 15px;
}

.grupo {
    margin-bottom: 14px;
}

.grid {
    display: grid;
    grid-template-columns:
        repeat(auto-fit, minmax(210px, 1fr));
    gap: 12px;
}

.info {
    background: #f9fafb;
    border: 1px solid #e5e7eb;
    border-radius: 12px;
    padding: 13px;
}

.info small {
    display: block;
    color: #6b7280;
    margin-bottom: 5px;
}

.info strong {
    font-size: 14px;
}

.panel {
    display: none;
}

.panel.visible {
    display: block;
}

.mensaje {
    display: none;
    padding: 13px;
    border-radius: 12px;
    margin-bottom: 16px;
    font-size: 14px;
    word-break: break-word;
}

.mensaje.ok {
    display: block;
    background: #dcfce7;
    color: #166534;
}

.mensaje.error {
    display: block;
    background: #fee2e2;
    color: #991b1b;
}

.oculto {
    display: none !important;
}

.acceso {
    margin-top: 16px;
    background: #f9fafb;
    border: 1px solid #e5e7eb;
    border-radius: 12px;
    padding: 15px;
}

.credenciales {
    margin-top: 12px;
    background: #111827;
    color: white;
    border-radius: 12px;
    padding: 15px;
    font-family: monospace;
    word-break: break-word;
}

.credenciales div {
    margin: 6px 0;
}

.botones {
    display: grid;
    grid-template-columns:
        repeat(auto-fit, minmax(180px, 1fr));
    gap: 10px;
    margin-top: 18px;
}

.btn {
    padding: 13px;
    border-radius: 11px;
    font-size: 14px;
    font-weight: 700;
}

.btn-editar {
    background: #e0e7ff;
    color: #3730a3;
}

.btn-acceso {
    background: #dcfce7;
    color: #166534;
}

.btn-bloquear {
    background: #fef3c7;
    color: #92400e;
}

.btn-baja {
    background: #fee2e2;
    color: #991b1b;
}

.btn-activar {
    background: #dbeafe;
    color: #1e40af;
}

.btn-liquidacion {
    background: #ede9fe;
    color: #5b21b6;
}

.btn-gastos {
    background: #ffedd5;
    color: #9a3412;
}

.btn-historial {
    background: #e5e7eb;
    color: #374151;
}

.btn-guardar {
    background: #111827;
    color: white;
}

.btn-cancelar {
    background: #e5e7eb;
    color: #374151;
}

.btn:disabled {
    opacity: .5;
    cursor: not-allowed;
}

.estado {
    display: inline-block;
    padding: 5px 9px;
    border-radius: 999px;
    font-size: 11px;
    font-weight: 800;
}

.activo {
    background: #dcfce7;
    color: #166534;
}

.inactivo {
    background: #fee2e2;
    color: #991b1b;
}

.edicion {
    border-top: 1px solid #e5e7eb;
    margin-top: 20px;
    padding-top: 20px;
}

.tabla {
    overflow-x: auto;
}

table {
    width: 100%;
    min-width: 600px;
    border-collapse: collapse;
}

th,
td {
    padding: 10px;
    border-bottom: 1px solid #e5e7eb;
    text-align: left;
    font-size: 13px;
}

th {
    background: #f9fafb;
}

.vacio {
    text-align: center;
    color: #6b7280;
    padding: 20px;
}

</style>

</head>


<body>


<header>

    <div class="header">

        <button
            class="volver"
            onclick="volver()"
        >
            ← Volver
        </button>

        <div>

            <h1>
                📋 Administración de empleados
            </h1>

            <p>
                Gestión de empleados de tu empresa
            </p>

        </div>

    </div>

</header>


<main>


<div
    id="mensaje"
    class="mensaje"
></div>


<!-- =====================================================
     SELECCIONAR EMPLEADO
===================================================== -->

<section class="tarjeta">

    <h2>
        👤 Seleccionar empleado
    </h2>

    <div class="grupo">

        <label>
            Empleado
        </label>

        <select
            id="empleadoSelect"
        >

            <option value="">
                Cargando empleados...
            </option>

        </select>

    </div>

</section>


<!-- =====================================================
     PANEL DEL EMPLEADO
===================================================== -->

<section
    id="panelEmpleado"
    class="tarjeta panel"
>

    <h2>
        Información del empleado
    </h2>


    <div
        id="datosEmpleado"
        class="grid"
    ></div>


    <!-- ACCESO -->

    <div
        id="estadoAcceso"
        class="acceso"
    ></div>


    <!-- =================================================
         EDICIÓN
    ================================================== -->

    <div
        id="edicion"
        class="edicion oculto"
    >

        <h2>
            ✏️ Editar información
        </h2>


        <div class="grid">


            <div class="grupo">

                <label>
                    Nombre
                </label>

                <input
                    id="nombre"
                    type="text"
                >

            </div>


            <div class="grupo">

                <label>
                    Apellido
                </label>

                <input
                    id="apellido"
                    type="text"
                >

            </div>


            <div class="grupo">

                <label>
                    DNI
                </label>

                <input
                    id="dni"
                    type="text"
                >

            </div>


            <div class="grupo">

                <label>
                    Teléfono
                </label>

                <input
                    id="telefono"
                    type="text"
                >

            </div>


            <div class="grupo">

                <label>
                    Email
                </label>

                <input
                    id="email"
                    type="email"
                >

            </div>


            <div class="grupo">

                <label>
                    Puesto
                </label>

                <input
                    id="puesto"
                    type="text"
                >

            </div>


            <div class="grupo">

                <label>
                    Tipo de empleado
                </label>

                <input
                    id="tipoEmpleado"
                    type="text"
                >

            </div>


            <div class="grupo">

                <label>
                    Pago diario
                </label>

                <input
                    id="pagoDiario"
                    type="number"
                    min="0"
                    step="0.01"
                >

            </div>


            <div class="grupo">

                <label>
                    Adicionales
                </label>

                <input
                    id="adicionales"
                    type="number"
                    min="0"
                    step="0.01"
                >

            </div>


            <div class="grupo">

                <label>
                    Descuentos
                </label>

                <input
                    id="descuentos"
                    type="number"
                    min="0"
                    step="0.01"
                >

            </div>


            <div class="grupo">

                <label>
                    Fecha de ingreso
                </label>

                <input
                    id="fechaIngreso"
                    type="date"
                >

            </div>


        </div>


        <div class="botones">

            <button
                class="btn btn-guardar"
                onclick="guardarCambios()"
            >
                💾 Guardar cambios
            </button>


            <button
                class="btn btn-cancelar"
                onclick="cancelarEdicion()"
            >
                Cancelar
            </button>

        </div>

    </div>


    <!-- =================================================
         ACCIONES
    ================================================== -->

    <div class="botones">


        <button
            class="btn btn-editar"
            onclick="editarEmpleado()"
        >
            ✏️ Editar información
        </button>


        <button
            id="btnAcceso"
            class="btn btn-acceso"
            onclick="darAcceso()"
        >
            🔐 Dar acceso a GESBASE
        </button>


        <button
            id="btnBloquear"
            class="btn btn-bloquear"
            onclick="bloquearAcceso()"
        >
            🚫 Bloquear acceso
        </button>


        <button
            id="btnActivar"
            class="btn btn-activar oculto"
            onclick="activarEmpleado()"
        >
            ✅ Activar empleado
        </button>


        <button
            id="btnBaja"
            class="btn btn-baja"
            onclick="darDeBaja()"
        >
            📋 Dar de baja
        </button>


        <button
            class="btn btn-liquidacion"
            onclick="irLiquidacion()"
        >
            💰 Liquidación mensual
        </button>


        <button
            class="btn btn-gastos"
            onclick="mostrarGastos()"
        >
            💸 Gastos
        </button>


        <button
            class="btn btn-historial"
            onclick="mostrarHistorial()"
        >
            📜 Historial
        </button>


    </div>


</section>


<!-- =====================================================
     GASTOS
===================================================== -->

<section
    id="seccionGastos"
    class="tarjeta oculto"
>

    <h2>
        💸 Gastos del empleado
    </h2>

    <div id="listaGastos">
    </div>

</section>


<!-- =====================================================
     HISTORIAL
===================================================== -->

<section
    id="seccionHistorial"
    class="tarjeta oculto"
>

    <h2>
        📜 Historial del empleado
    </h2>

    <div id="listaHistorial">
    </div>

</section>


</main>


<script type="module">


/* =========================================================
   FIREBASE
========================================================= */

import {
    auth,
    db
} from "./Js/firebase.js";


import {
    onAuthStateChanged
} from "https://www.gstatic.com/firebasejs/12.18.0/firebase-auth.js";


import {
    collection,
    doc,
    getDoc,
    getDocs,
    query,
    where,
    updateDoc,
    serverTimestamp
} from "https://www.gstatic.com/firebasejs/12.18.0/firebase-firestore.js";


/* =========================================================
   VARIABLES
========================================================= */

let usuarioActual = null;

let empresaActualId = null;

let empleados = [];

let empleadoSeleccionado = null;


/* =========================================================
   ELEMENTOS
========================================================= */

const selectEmpleado =
    document.getElementById(
        "empleadoSelect"
    );

const panelEmpleado =
    document.getElementById(
        "panelEmpleado"
    );

const datosEmpleado =
    document.getElementById(
        "datosEmpleado"
    );

const estadoAcceso =
    document.getElementById(
        "estadoAcceso"
    );

const mensaje =
    document.getElementById(
        "mensaje"
    );


/* =========================================================
   INICIO
========================================================= */

onAuthStateChanged(
    auth,
    async (user) => {

        if (!user) {

            location.href =
                "login.html";

            return;

        }


        usuarioActual =
            user;


        try {

            await obtenerEmpresa();

            await cargarEmpleados();


        } catch (error) {

            console.error(
                "ERROR:",
                error
            );


            mostrarError(
                error
            );

        }

    }
);


/* =========================================================
   EMPRESA
========================================================= */

async function obtenerEmpresa() {

    const usuarioRef =
        doc(
            db,
            "usuarios",
            usuarioActual.uid
        );


    const usuarioSnap =
        await getDoc(
            usuarioRef
        );


    if (
        usuarioSnap.exists()
    ) {

        const datos =
            usuarioSnap.data();


        console.log(
            "USUARIO:",
            datos
        );


        if (
            datos.empresaId
        ) {

            empresaActualId =
                datos.empresaId;

        }


        else if (
            datos.idEmpresa
        ) {

            empresaActualId =
                datos.idEmpresa;

        }


        else if (
            typeof datos.empresa ===
            "string"
        ) {

            empresaActualId =
                datos.empresa;

        }


        else if (
            datos.empresa &&
            typeof datos.empresa ===
            "object"
        ) {

            empresaActualId =
                datos.empresa.id ||
                datos.empresa.empresaId ||
                null;

        }

    }


    /*
     * Si no tiene empresaId,
     * buscamos la empresa del propietario.
     */

    if (!empresaActualId) {

        const q =
            query(
                collection(
                    db,
                    "empresas"
                ),
                where(
                    "propietarioUid",
                    "==",
                    usuarioActual.uid
                )
            );


        const empresas =
            await getDocs(q);


        if (
            !empresas.empty
        ) {

            empresaActualId =
                empresas.docs[0].id;

        }

    }


    if (!empresaActualId) {

        throw new Error(
            "No se encontró la empresa asociada al administrador."
        );

    }


    console.log(
        "EMPRESA:",
        empresaActualId
    );

}


/* =========================================================
   CARGAR EMPLEADOS
========================================================= */

async function cargarEmpleados() {

    selectEmpleado.innerHTML = `
        <option value="">
            Cargando empleados...
        </option>
    `;


    /*
     * ESTA ES LA CONSULTA PRINCIPAL.
     *
     * Usa:
     * db = getFirestore(app)
     *
     * collection(db, "empleados")
     */

    const referenciaEmpleados =
        collection(
            db,
            "empleados"
        );


    const consulta =
        query(
            referenciaEmpleados,
            where(
                "empresaId",
                "==",
                empresaActualId
            )
        );


    const resultado =
        await getDocs(
            consulta
        );


    empleados = [];


    resultado.forEach(
        documento => {

            empleados.push({

                id:
                    documento.id,

                ...documento.data()

            });

        }
    );


    console.log(
        "EMPLEADOS:",
        empleados
    );


    selectEmpleado.innerHTML = `
        <option value="">
            Seleccioná un empleado
        </option>
    `;


    empleados.sort(
        (a, b) =>
            nombreEmpleado(a)
                .localeCompare(
                    nombreEmpleado(b),
                    "es"
                )
    );


    empleados.forEach(
        empleado => {

            const opcion =
                document.createElement(
                    "option"
                );


            opcion.value =
                empleado.id;


            opcion.textContent =
                nombreEmpleado(
                    empleado
                );


            if (
                empleado.dni
            ) {

                opcion.textContent +=
                    " - DNI " +
                    empleado.dni;

            }


            selectEmpleado.appendChild(
                opcion
            );

        }
    );


    if (
        empleados.length === 0
    ) {

        selectEmpleado.innerHTML = `
            <option value="">
                No hay empleados registrados
            </option>
        `;

    }

}


/* =========================================================
   SELECCIONAR
========================================================= */

selectEmpleado.addEventListener(
    "change",
    () => {

        const id =
            selectEmpleado.value;


        if (!id) {

            panelEmpleado.classList.remove(
                "visible"
            );

            empleadoSeleccionado =
                null;

            return;

        }


        empleadoSeleccionado =
            empleados.find(
                e =>
                    e.id === id
            );


        if (
            empleadoSeleccionado
        ) {

            mostrarEmpleado();

        }

    }
);


/* =========================================================
   MOSTRAR EMPLEADO
========================================================= */

function mostrarEmpleado() {

    const e =
        empleadoSeleccionado;


    panelEmpleado.classList.add(
        "visible"
    );


    const estado =
        obtenerEstado(e);


    datosEmpleado.innerHTML = `

        <div class="info">

            <small>
                Nombre completo
            </small>

            <strong>
                ${escapar(
                    nombreEmpleado(e)
                )}
            </strong>

        </div>


        <div class="info">

            <small>
                DNI
            </small>

            <strong>
                ${escapar(
                    e.dni || "-"
                )}
            </strong>

        </div>


        <div class="info">

            <small>
                Teléfono
            </small>

            <strong>
                ${escapar(
                    e.telefono ||
                    e.phone ||
                    "-"
                )}
            </strong>

        </div>


        <div class="info">

            <small>
                Email
            </small>

            <strong>
                ${escapar(
                    e.email ||
                    "-"
                )}
            </strong>

        </div>


        <div class="info">

            <small>
                Puesto
            </small>

            <strong>
                ${escapar(
                    e.puesto ||
                    e.cargo ||
                    "-"
                )}
            </strong>

        </div>


        <div class="info">

            <small>
                Tipo
            </small>

            <strong>
                ${escapar(
                    e.tipoEmpleado ||
                    e.tipo ||
                    "-"
                )}
            </strong>

        </div>


        <div class="info">

            <small>
                Pago diario
            </small>

            <strong>
                $${numero(
                    e.pagoDiario
                )}
            </strong>

        </div>


        <div class="info">

            <small>
                Fecha de ingreso
            </small>

            <strong>
                ${escapar(
                    e.fechaIngreso ||
                    "-"
                )}
            </strong>

        </div>


        <div class="info">

            <small>
                Estado
            </small>

            <strong>

                <span class="estado ${
                    estado === "activo"
                        ? "activo"
                        : "inactivo"
                }">

                    ${estado.toUpperCase()}

                </span>

            </strong>

        </div>

    `;


    mostrarEstadoAcceso();

    actualizarBotones();

}


/* =========================================================
   ESTADO ACCESO
========================================================= */

function mostrarEstadoAcceso() {

    const e =
        empleadoSeleccionado;


    if (
        e.authUid ||
        e.usuarioId
    ) {

        estadoAcceso.innerHTML = `

            <strong>
                🔐 Acceso a GESBASE: CREADO
            </strong>

            <div style="margin-top:7px;">
                Este empleado ya tiene una cuenta
                de acceso.
            </div>

        `;

    } else {

        estadoAcceso.innerHTML = `

            <strong>
                🔒 Acceso a GESBASE: NO CREADO
            </strong>

            <div style="margin-top:7px;">
                Todavía no tiene una cuenta
                de acceso.
            </div>

        `;

    }


    if (
        e.accesoBloqueado === true
    ) {

        estadoAcceso.innerHTML += `

            <div style="
                margin-top:10px;
                color:#92400e;
                font-weight:700;
            ">
                🚫 Acceso bloqueado
            </div>

        `;

    }


    if (
        e.passwordTemporal === true
    ) {

        estadoAcceso.innerHTML += `

            <div style="
                margin-top:10px;
                color:#92400e;
            ">
                ⚠️ Contraseña temporal pendiente
                de cambio.
            </div>

        `;

    }

}


/* =========================================================
   BOTONES
========================================================= */

function actualizarBotones() {

    const e =
        empleadoSeleccionado;


    const tieneCuenta =
        Boolean(
            e.authUid ||
            e.usuarioId
        );


    const btnAcceso =
        document.getElementById(
            "btnAcceso"
        );


    const btnBloquear =
        document.getElementById(
            "btnBloquear"
        );


    const btnActivar =
        document.getElementById(
            "btnActivar"
        );


    const btnBaja =
        document.getElementById(
            "btnBaja"
        );


    if (
        tieneCuenta
    ) {

        btnAcceso.disabled =
            true;

        btnAcceso.textContent =
            "🔐 Acceso creado";

    } else {

        btnAcceso.disabled =
            false;

        btnAcceso.textContent =
            "🔐 Dar acceso a GESBASE";

    }


    if (
        e.accesoBloqueado === true
    ) {

        btnBloquear.textContent =
            "🔓 Desbloquear acceso";

        btnBloquear.disabled =
            false;

    } else {

        btnBloquear.textContent =
            "🚫 Bloquear acceso";

        btnBloquear.disabled =
            !tieneCuenta;

    }


    if (
        obtenerEstado(e) ===
        "inactivo"
    ) {

        btnActivar.classList.remove(
            "oculto"
        );

        btnBaja.classList.add(
            "oculto"
        );

    } else {

        btnActivar.classList.add(
            "oculto"
        );

        btnBaja.classList.remove(
            "oculto"
        );

    }

}


/* =========================================================
   EDITAR
========================================================= */

function editarEmpleado() {

    const e =
        empleadoSeleccionado;


    if (!e) {

        return;

    }


    document.getElementById(
        "nombre"
    ).value =
        e.nombre || "";


    document.getElementById(
        "apellido"
    ).value =
        e.apellido ||
        e.apellidos ||
        "";


    document.getElementById(
        "dni"
    ).value =
        e.dni || "";


    document.getElementById(
        "telefono"
    ).value =
        e.telefono ||
        e.phone ||
        "";


    document.getElementById(
        "email"
    ).value =

/* =========================================================
   DAR ACCESO
========================================================= */

async function darAcceso() {

    const e =
        empleadoSeleccionado;


    if (!e) {

        return;

    }


    if (
        e.authUid ||
        e.usuarioId
    ) {

        mostrarMensaje(
            "Este empleado ya tiene acceso a GESBASE.",
            "error"
        );

        return;

    }


    if (!e.email) {

        mostrarMensaje(
            "El empleado necesita tener un email para crearle el acceso.",
            "error"
        );

        editarEmpleado();

        return;

    }


    const confirmar =
        confirm(
            "¿Crear acceso a GESBASE para " +
            nombreEmpleado(e) +
            "?"
        );


    if (!confirmar) {

        return;

    }


    try {

        mostrarMensaje(
            "Creando acceso...",
            "ok"
        );


        const token =
            await usuarioActual.getIdToken(
                true
            );


        const respuesta =
            await fetch(
                "https://us-central1-gesbase-web.cloudfunctions.net/crearAccesoEmpleado",
                {

                    method: "POST",

                    headers: {

                        "Content-Type":
                            "application/json",

                        "Authorization":
                            "Bearer " +
                            token

                    },

                    body: JSON.stringify({

                        empleadoId:
                            e.id

                    })

                }
            );


        const resultado =
            await respuesta.json();


        if (
            !respuesta.ok
        ) {

            throw new Error(
                resultado.error ||
                resultado.message ||
                "No se pudo crear el acceso."
            );

        }


        e.authUid =
            resultado.authUid ||
            "";


        e.usuarioId =
            resultado.authUid ||
            "";


        e.passwordTemporal =
            true;


        mostrarEmpleado();


        estadoAcceso.innerHTML += `

            <div class="credenciales">

                <div>
                    📧 Email:
                    <strong>
                        ${escapar(
                            resultado.email ||
                            e.email
                        )}
                    </strong>
                </div>

                <div>
                    🔑 Contraseña temporal:
                    <strong>
                        ${escapar(
                            resultado.password ||
                            "No informada"
                        )}
                    </strong>
                </div>

                <div style="
                    margin-top:12px;
                    color:#d1d5db;
                ">
                    Guardá esta contraseña.
                    El empleado deberá cambiarla
                    al ingresar.
                </div>

            </div>

        `;


        mostrarMensaje(
            "Acceso creado correctamente.",
            "ok"
        );


    } catch (error) {

        console.error(
            "ERROR ACCESO:",
            error
        );

        mostrarError(error);

    }

}


window.darAcceso =
    darAcceso;


/* =========================================================
   BLOQUEAR / DESBLOQUEAR
========================================================= */

async function bloquearAcceso() {

    const e =
        empleadoSeleccionado;


    if (!e) {

        return;

    }


    const bloqueado =
        e.accesoBloqueado === true;


    try {

        if (bloqueado) {

            await updateDoc(
                doc(
                    db,
                    "empleados",
                    e.id
                ),
                {

                    accesoBloqueado:
                        false,

                    accesoBloqueadoPor:
                        null,

                    accesoBloqueadoEn:
                        null

                }
            );


            e.accesoBloqueado =
                false;


            mostrarEmpleado();


            mostrarMensaje(
                "Acceso desbloqueado.",
                "ok"
            );


            return;

        }


        const confirmar =
            confirm(
                "¿Bloquear el acceso de " +
                nombreEmpleado(e) +
                "?"
            );


        if (!confirmar) {

            return;

        }


        await updateDoc(
            doc(
                db,
                "empleados",
                e.id
            ),
            {

                accesoBloqueado:
                    true,

                accesoBloqueadoPor:
                    usuarioActual.uid,

                accesoBloqueadoEn:
                    serverTimestamp()

            }
        );


        e.accesoBloqueado =
            true;


        mostrarEmpleado();


        mostrarMensaje(
            "Acceso bloqueado.",
            "ok"
        );


    } catch (error) {

        console.error(error);

        mostrarError(error);

    }

}


window.bloquearAcceso =
    bloquearAcceso;

async function darDeBaja() {

            nombreEmpleado(e) +

            "El empleado quedará inactivo, " +
            "pero se conservará su historial."

    if (!confirmar) {

            new Date()

                .split("T")[0];

            doc(
                db,
                "empleados",
                e.id
            ),
            {

                estado:
                    "inactivo",

                accesoBloqueado:
                    true,

                fechaBaja:
                    fecha,

                dadoDeBajaPor:
                    usuarioActual.uid,

                dadoDeBajaEn:
                    serverTimestamp()

            }
        );


        e.estado =
            "inactivo";


        e.accesoBloqueado =
            true;

/* =========================================================
   GASTOS
========================================================= */

async function mostrarGastos() {

    if (
        !empleadoSeleccionado
    ) {

        return;

    }


    const seccion =
        document.getElementById(
            "seccionGastos"
        );


    const lista =
        document.getElementById(
            "listaGastos"
        );


    seccion.classList.remove(
        "oculto"
    );


    lista.innerHTML =
        "Cargando gastos...";


    try {

        const referencia =
            collection(
                db,
                "gastos"
            );


        const consulta =
            query(
                referencia,
                where(
                    "empresaId",
                    "==",
                    empresaActualId
                )
            );


        const resultado =
            await getDocs(
                consulta
            );


        const gastos = [];


        resultado.forEach(
            documento => {

                const gasto =
                    documento.data();


                const idEmpleado =
                    gasto.empleadoId ||
                    gasto.idEmpleado ||
                    "";


                if (
                    idEmpleado ===
                    empleadoSeleccionado.id
                ) {

                    gastos.push({

                        id:
                            documento.id,

                        ...gasto

                    });

                }

            }
        );


        if (
            gastos.length === 0
        ) {

            lista.innerHTML = `
                <div class="vacio">
                    No hay gastos registrados
                    para este empleado.
                </div>
            `;

            return;

        }


        let total = 0;


        let html = `

            <div class="tabla">

                <table>

                    <thead>

                        <tr>

                            <th>
                                Fecha
                            </th>

                            <th>
                                Concepto
                            </th>

                            <th>
                                Importe
                            </th>

                        </tr>

                    </thead>

                    <tbody>

        `;


        gastos.forEach(
            gasto => {

                const importe =
                    Number(
                        gasto.importe ||
                        gasto.monto ||
                        gasto.total ||
                        0
                    );


                total +=
                    importe;


                html += `

                    <tr>

                        <td>
                            ${escapar(
                                gasto.fecha ||
                                gasto.fechaGasto ||
                                "-"
                            )}
                        </td>

                        <td>
                            ${escapar(
                                gasto.concepto ||
                                gasto.descripcion ||
                                "Gasto"
                            )}
                        </td>

                        <td>
                            $${numero(
                                importe
                            )}
                        </td>

                    </tr>

                `;

            }
        );


        html += `

                    </tbody>

                </table>

            </div>


            <div style="
                margin-top:15px;
                font-weight:800;
            ">
                Total de gastos:
                $${numero(total)}
            </div>

        `;


        lista.innerHTML =
            html;


    } catch (error) {

        console.error(error);

        lista.innerHTML = `

            <div class="vacio">

                No se pudieron cargar los gastos.

                <br><br>

                ${escapar(
                    error.message ||
                    "Error desconocido"
                )}

            </div>

        `;

    }

}


window.mostrarGastos =
    mostrarGastos;

/* =========================================================
   FUNCIONES
========================================================= */

function nombreEmpleado(
    e
) {

    if (
        e.nombreCompleto
    ) {

        return e.nombreCompleto;

    }


    return (
        (
            e.nombre ||
            ""
        ) +
        " " +
        (
            e.apellido ||
            e.apellidos ||
            ""
        )
    ).trim()
    ||
    "Empleado sin nombre";

}


function obtenerEstado(
    e
) {

    const estado =
        String(
            e.estado ||
            ""
        ).toLowerCase();


    if (
        estado === "inactivo" ||
        estado === "baja"
    ) {

        return "inactivo";

    }


    return "activo";

}


function numero(
    valor
) {

    return Number(
        valor || 0
    ).toLocaleString(
        "es-AR",
        {
            minimumFractionDigits: 0,
            maximumFractionDigits: 2
        }
    );

}


function escapar(
    texto
) {

    return String(
        texto ?? ""
    )
    .replace(
        /&/g,
        "&amp;"
    )
    .replace(
        /</g,
        "&lt;"
    )
    .replace(
        />/g,
        "&gt;"
    )
    .replace(
        /"/g,
        "&quot;"
    )
    .replace(
        /'/g,
        "&#039;"
    );

}


/* =========================================================
   ERROR
========================================================= */

function mostrarError(
    error
) {

    console.error(
        error
    );


    let texto =
        error?.message ||
        error?.code ||
        "Error desconocido.";


    if (
        error?.code ===
        "permission-denied"
    ) {

        texto =
            "Firebase rechazó la consulta. Revisá las reglas de Firestore para empleados.";

    }


    mostrarMensaje(
        texto,
        "error"
    );

}


/* =========================================================
   MENSAJE
========================================================= */

function mostrarMensaje(
    texto,
    tipo
) {

    mensaje.textContent =
        texto;

    mensaje.className =
        "mensaje " +
        tipo;

}


function volver() {

    location.href =
        "index.html";

}


window.volver =
    volver;
