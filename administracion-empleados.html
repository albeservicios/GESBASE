<!DOCTYPE html>
<html lang="es">

<head>

<meta charset="UTF-8">

<meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
>

<meta
    name="theme-color"
    content="#111827"
>

<title>Administración de empleados - GESBASE</title>

<style>

* {
    box-sizing: border-box;
}

body {
    margin: 0;
    font-family:
        -apple-system,
        BlinkMacSystemFont,
        "Segoe UI",
        Roboto,
        Arial,
        sans-serif;
    background: #f3f4f6;
    color: #111827;
}

header {
    background: #111827;
    color: white;
    padding: 16px;
    position: sticky;
    top: 0;
    z-index: 20;
}

.header-contenido {
    max-width: 1100px;
    margin: auto;
    display: flex;
    align-items: center;
    gap: 12px;
}

header h1 {
    margin: 0;
    font-size: 19px;
}

header p {
    margin: 3px 0 0;
    color: #d1d5db;
    font-size: 13px;
}

.btn-volver {
    border: 0;
    background: #374151;
    color: white;
    border-radius: 10px;
    padding: 10px 13px;
    font-size: 14px;
}

main {
    max-width: 1100px;
    margin: auto;
    padding: 18px 12px 50px;
}

.tarjeta {
    background: white;
    border-radius: 16px;
    padding: 18px;
    margin-bottom: 16px;
    box-shadow: 0 3px 15px rgba(0,0,0,.06);
}

.tarjeta h2 {
    margin-top: 0;
    font-size: 18px;
}

label {
    display: block;
    font-size: 13px;
    font-weight: 700;
    margin-bottom: 7px;
}

input,
select,
textarea {
    width: 100%;
    padding: 12px;
    border: 1px solid #d1d5db;
    border-radius: 10px;
    font-size: 15px;
    background: white;
}

textarea {
    min-height: 90px;
    resize: vertical;
}

.grupo {
    margin-bottom: 14px;
}

.grid {
    display: grid;
    grid-template-columns:
        repeat(auto-fit, minmax(210px, 1fr));
    gap: 12px;
}

.info {
    background: #f9fafb;
    border: 1px solid #e5e7eb;
    border-radius: 12px;
    padding: 13px;
}

.info small {
    display: block;
    color: #6b7280;
    margin-bottom: 5px;
}

.info strong {
    font-size: 14px;
}

#panelEmpleado {
    display: none;
}

#panelEmpleado.visible {
    display: block;
}

.oculto {
    display: none !important;
}

.mensaje {
    display: none;
    border-radius: 12px;
    padding: 13px;
    margin-bottom: 16px;
    font-size: 14px;
}

.mensaje.ok {
    display: block;
    background: #dcfce7;
    color: #166534;
}

.mensaje.error {
    display: block;
    background: #fee2e2;
    color: #991b1b;
    word-break: break-word;
}

.estado {
    display: inline-block;
    padding: 5px 9px;
    border-radius: 999px;
    font-size: 11px;
    font-weight: 800;
}

.estado-activo {
    background: #dcfce7;
    color: #166534;
}

.estado-inactivo {
    background: #fee2e2;
    color: #991b1b;
}

.estado-bloqueado {
    background: #fef3c7;
    color: #92400e;
}

.botones {
    display: grid;
    grid-template-columns:
        repeat(auto-fit, minmax(180px, 1fr));
    gap: 10px;
    margin-top: 18px;
}

.btn {
    border: 0;
    border-radius: 11px;
    padding: 13px;
    font-size: 14px;
    font-weight: 700;
    cursor: pointer;
}

.btn-editar {
    background: #e0e7ff;
    color: #3730a3;
}

.btn-acceso {
    background: #dcfce7;
    color: #166534;
}

.btn-bloquear {
    background: #fef3c7;
    color: #92400e;
}

.btn-baja {
    background: #fee2e2;
    color: #991b1b;
}

.btn-activar {
    background: #dbeafe;
    color: #1e40af;
}

.btn-liquidacion {
    background: #ede9fe;
    color: #5b21b6;
}

.btn-gastos {
    background: #ffedd5;
    color: #9a3412;
}

.btn-historial {
    background: #e5e7eb;
    color: #374151;
}

.btn-guardar {
    background: #111827;
    color: white;
}

.btn-cancelar {
    background: #e5e7eb;
    color: #374151;
}

.btn:disabled {
    opacity: .5;
}

.acceso {
    margin-top: 16px;
    padding: 15px;
    background: #f9fafb;
    border: 1px solid #e5e7eb;
    border-radius: 12px;
}

.credenciales {
    margin-top: 12px;
    padding: 14px;
    border-radius: 12px;
    background: #111827;
    color: white;
    word-break: break-word;
    font-family: monospace;
}

.credenciales div {
    margin: 6px 0;
}

.form-edicion {
    margin-top: 20px;
    padding-top: 20px;
    border-top: 1px solid #e5e7eb;
}

.tabla {
    overflow-x: auto;
}

table {
    width: 100%;
    min-width: 600px;
    border-collapse: collapse;
}

th,
td {
    text-align: left;
    padding: 10px;
    border-bottom: 1px solid #e5e7eb;
    font-size: 13px;
}

th {
    background: #f9fafb;
}

.vacio {
    text-align: center;
    padding: 20px;
    color: #6b7280;
}

.resumen {
    display: grid;
    grid-template-columns:
        repeat(auto-fit, minmax(140px, 1fr));
    gap: 10px;
    margin-top: 15px;
}

.resumen-box {
    background: #f9fafb;
    border: 1px solid #e5e7eb;
    border-radius: 12px;
    padding: 13px;
}

.resumen-numero {
    font-size: 20px;
    font-weight: 800;
}

.resumen-texto {
    font-size: 12px;
    color: #6b7280;
}

</style>

</head>


<body>


<header>

    <div class="header-contenido">

        <button
            class="btn-volver"
            onclick="volver()"
        >
            ← Volver
        </button>

        <div>

            <h1>
                📋 Administración de empleados
            </h1>

            <p>
                Gestioná la información de cada empleado
            </p>

        </div>

    </div>

</header>


<main>


<div
    id="mensaje"
    class="mensaje"
></div>


<!-- =====================================================
     SELECCIÓN
===================================================== -->

<section class="tarjeta">

    <h2>
        👤 Seleccionar empleado
    </h2>

    <div class="grupo">

        <label for="empleadoSelect">
            Empleado
        </label>

        <select id="empleadoSelect">

            <option value="">
                Cargando empleados...
            </option>

        </select>

    </div>

</section>


<!-- =====================================================
     EMPLEADO
===================================================== -->

<section
    id="panelEmpleado"
    class="tarjeta"
>

    <h2>
        Información del empleado
    </h2>


    <div
        id="datosEmpleado"
        class="grid"
    ></div>


    <div
        id="estadoAcceso"
        class="acceso"
    ></div>


    <!-- =================================================
         EDICIÓN
    ================================================== -->

    <div
        id="formEdicion"
        class="form-edicion oculto"
    >

        <h2>
            ✏️ Editar información
        </h2>


        <div class="grid">

            <div class="grupo">

                <label>
                    Nombre
                </label>

                <input
                    id="editNombre"
                    type="text"
                >

            </div>


            <div class="grupo">

                <label>
                    Apellido
                </label>

                <input
                    id="editApellido"
                    type="text"
                >

            </div>


            <div class="grupo">

                <label>
                    DNI
                </label>

                <input
                    id="editDni"
                    type="text"
                >

            </div>


            <div class="grupo">

                <label>
                    Teléfono
                </label>

                <input
                    id="editTelefono"
                    type="text"
                >

            </div>


            <div class="grupo">

                <label>
                    Email
                </label>

                <input
                    id="editEmail"
                    type="email"
                >

            </div>


            <div class="grupo">

                <label>
                    Puesto
                </label>

                <input
                    id="editPuesto"
                    type="text"
                >

            </div>


            <div class="grupo">

                <label>
                    Tipo de empleado
                </label>

                <input
                    id="editTipo"
                    type="text"
                >

            </div>


            <div class="grupo">

                <label>
                    Pago diario
                </label>

                <input
                    id="editPago"
                    type="number"
                    min="0"
                    step="0.01"
                >

            </div>


            <div class="grupo">

                <label>
                    Adicionales
                </label>

                <input
                    id="editAdicionales"
                    type="number"
                    min="0"
                    step="0.01"
                >

            </div>


            <div class="grupo">

                <label>
                    Descuentos
                </label>

                <input
                    id="editDescuentos"
                    type="number"
                    min="0"
                    step="0.01"
                >

            </div>


            <div class="grupo">

                <label>
                    Fecha de ingreso
                </label>

                <input
                    id="editFechaIngreso"
                    type="date"
                >

            </div>

        </div>


        <div class="botones">

            <button
                class="btn btn-guardar"
                onclick="guardarEdicion()"
            >
                💾 Guardar cambios
            </button>

            <button
                class="btn btn-cancelar"
                onclick="cancelarEdicion()"
            >
                Cancelar
            </button>

        </div>

    </div>


    <!-- =================================================
         ACCIONES
    ================================================== -->

    <div class="botones">


        <button
            class="btn btn-editar"
            onclick="editarEmpleado()"
        >
            ✏️ Editar información
        </button>


        <button
            id="btnAcceso"
            class="btn btn-acceso"
            onclick="darAcceso()"
        >
            🔐 Dar acceso a GESBASE
        </button>


        <button
            id="btnBloquear"
            class="btn btn-bloquear"
            onclick="bloquearAcceso()"
        >
            🚫 Bloquear acceso
        </button>


        <button
            id="btnActivar"
            class="btn btn-activar oculto"
            onclick="activarEmpleado()"
        >
            ✅ Activar empleado
        </button>


        <button
            id="btnBaja"
            class="btn btn-baja"
            onclick="darDeBaja()"
        >
            📋 Dar de baja
        </button>


        <button
            class="btn btn-liquidacion"
            onclick="irLiquidacion()"
        >
            💰 Liquidación mensual
        </button>


        <button
            class="btn btn-gastos"
            onclick="mostrarGastos()"
        >
            💸 Gastos
        </button>


        <button
            class="btn btn-historial"
            onclick="mostrarHistorial()"
        >
            📜 Historial
        </button>

    </div>

</section>


<!-- =====================================================
     GASTOS
===================================================== -->

<section
    id="seccionGastos"
    class="tarjeta oculto"
>

    <h2>
        💸 Gastos del empleado
    </h2>

    <div id="listaGastos">
        Cargando...
    </div>

</section>


<!-- =====================================================
     HISTORIAL
===================================================== -->

<section
    id="seccionHistorial"
    class="tarjeta oculto"
>

    <h2>
        📜 Historial del empleado
    </h2>

    <div id="listaHistorial">
        Cargando...
    </div>

</section>


</main>


<script type="module">


/* =========================================================
   FIREBASE
========================================================= */

import {
    auth,
    db
} from "./Js/firebase.js";


import {
    onAuthStateChanged
} from "https://www.gstatic.com/firebasejs/12.1.0/firebase-auth.js";


import {
    collection,
    doc,
    getDoc,
    getDocs,
    query,
    where,
    updateDoc,
    serverTimestamp
} from "https://www.gstatic.com/firebasejs/12.1.0/firebase-firestore.js";


/* =========================================================
   VARIABLES
========================================================= */

let usuarioActual = null;

let empresaActualId = null;

let empleadoSeleccionado = null;

let empleados = [];


/* =========================================================
   ELEMENTOS
========================================================= */

const selectEmpleado =
    document.getElementById(
        "empleadoSelect"
    );

const panelEmpleado =
    document.getElementById(
        "panelEmpleado"
    );

const datosEmpleado =
    document.getElementById(
        "datosEmpleado"
    );

const estadoAcceso =
    document.getElementById(
        "estadoAcceso"
    );

const mensaje =
    document.getElementById(
        "mensaje"
    );


/* =========================================================
   MENSAJE
========================================================= */

function mostrarMensaje(
    texto,
    tipo = "ok"
) {

    mensaje.textContent =
        texto;

    mensaje.className =
        "mensaje " + tipo;

}


function limpiarMensaje() {

    mensaje.textContent = "";

    mensaje.className =
        "mensaje";

}


/* =========================================================
   AUTENTICACIÓN
========================================================= */

onAuthStateChanged(
    auth,
    async (user) => {

        if (!user) {

            location.href =
                "login.html";

            return;

        }


        usuarioActual =
            user;


        try {

            await obtenerEmpresa();

            await cargarEmpleados();


        } catch (error) {

            console.error(
                "ERROR ADMINISTRACION:",
                error
            );


            mostrarMensaje(
                obtenerErrorFirebase(error),
                "error"
            );


            selectEmpleado.innerHTML = `
                <option value="">
                    No se pudieron cargar los empleados
                </option>
            `;

        }

    }
);


/* =========================================================
   OBTENER EMPRESA
========================================================= */

async function obtenerEmpresa() {

    console.log(
        "UID administrador:",
        usuarioActual.uid
    );


    /*
     * 1. Buscamos el documento del usuario.
     */

    const usuarioRef =
        doc(
            db,
            "usuarios",
            usuarioActual.uid
        );


    const usuarioSnap =
        await getDoc(
            usuarioRef
        );


    if (usuarioSnap.exists()) {

        const datos =
            usuarioSnap.data();


        console.log(
            "Documento usuarios:",
            datos
        );


        /*
         * Campo principal.
         */

        if (
            datos.empresaId
        ) {

            empresaActualId =
                datos.empresaId;

        }


        /*
         * Compatibilidad.
         */

        if (
            !empresaActualId &&
            datos.idEmpresa
        ) {

            empresaActualId =
                datos.idEmpresa;

        }


        /*
         * Algunas versiones pueden tener
         * empresa como texto.
         */

        if (
            !empresaActualId &&
            typeof datos.empresa === "string"
        ) {

            empresaActualId =
                datos.empresa;

        }


        /*
         * Algunas versiones pueden tener
         * empresa como objeto.
         */

        if (
            !empresaActualId &&
            datos.empresa &&
            typeof datos.empresa === "object"
        ) {

            empresaActualId =
                datos.empresa.id ||
                datos.empresa.empresaId ||
                null;

        }

    }


    /*
     * 2. Si todavía no encontramos la empresa,
     * buscamos por propietarioUid.
     */

    if (!empresaActualId) {

        console.log(
            "Buscando empresa por propietarioUid..."
        );


        const q =
            query(
                collection(
                    db,
                    "empresas"
                ),
                where(
                    "propietarioUid",
                    "==",
                    usuarioActual.uid
                )
            );


        const empresasSnap =
            await getDocs(q);


        console.log(
            "Empresas encontradas:",
            empresasSnap.size
        );


        if (
            !empresasSnap.empty
        ) {

            empresaActualId =
                empresasSnap.docs[0].id;

        }

    }


    /*
     * 3. Si no hay empresa, no seguimos.
     */

    if (!empresaActualId) {

        throw new Error(
            "No encontramos la empresa asociada a tu usuario. Revisá el campo empresaId del documento usuarios."
        );

    }


    console.log(
        "EMPRESA UTILIZADA:",
        empresaActualId
    );

}


/* =========================================================
   CARGAR EMPLEADOS
========================================================= */

async function cargarEmpleados() {

    selectEmpleado.innerHTML = `
        <option value="">
            Cargando empleados...
        </option>
    `;


    console.log(
        "Buscando empleados con empresaId:",
        empresaActualId
    );


    /*
     * IMPORTANTE:
     * registro-empleado.html guarda empresaId,
     * por eso usamos exactamente ese campo.
     */

    const q =
        query(
            collection(
                db,
                "empleados"
            ),
            where(
                "empresaId",
                "==",
                empresaActualId
            )
        );


    const snap =
        await getDocs(q);


    console.log(
        "Empleados encontrados:",
        snap.size
    );


    empleados = [];


    snap.forEach(
        documento => {

            empleados.push({

                id:
                    documento.id,

                ...documento.data()

            });

        }
    );


    empleados.sort(
        (a, b) =>
            obtenerNombre(a)
                .localeCompare(
                    obtenerNombre(b),
                    "es"
                )
    );


    selectEmpleado.innerHTML = `
        <option value="">
            Seleccioná un empleado
        </option>
    `;


    empleados.forEach(
        empleado => {

            const option =
                document.createElement(
                    "option"
                );


            option.value =
                empleado.id;


            option.textContent =
                obtenerNombre(
                    empleado
                );


            if (
                empleado.dni
            ) {

                option.textContent +=
                    " - DNI " +
                    empleado.dni;

            }


            selectEmpleado.appendChild(
                option
            );

        }
    );


    if (
        empleados.length === 0
    ) {

        selectEmpleado.innerHTML = `
            <option value="">
                No hay empleados registrados
            </option>
        `;

    }

}


/* =========================================================
   SELECCIÓN
========================================================= */

selectEmpleado.addEventListener(
    "change",
    () => {

        const id =
            selectEmpleado.value;


        if (!id) {

            empleadoSeleccionado =
                null;

            panelEmpleado.classList.remove(
                "visible"
            );

            return;

        }


        empleadoSeleccionado =
            empleados.find(
                empleado =>
                    empleado.id === id
            );


        if (
            empleadoSeleccionado
        ) {

            mostrarEmpleado();

        }

    }
);


/* =========================================================
   NOMBRE
========================================================= */

function obtenerNombre(
    empleado
) {

    if (
        empleado.nombreCompleto
    ) {

        return empleado.nombreCompleto;

    }


    const nombre =
        empleado.nombre ||
        "";


    const apellido =
        empleado.apellido ||
        empleado.apellidos ||
        "";


    const resultado =
        `${nombre} ${apellido}`.trim();


    return resultado ||
        "Empleado sin nombre";

}


/* =========================================================
   MOSTRAR EMPLEADO
========================================================= */

function mostrarEmpleado() {

    limpiarMensaje();


    panelEmpleado.classList.add(
        "visible"
    );


    const e =
        empleadoSeleccionado;


    const estado =
        obtenerEstado(e);


    const acceso =
        tieneAcceso(e);


    datosEmpleado.innerHTML = `

        <div class="info">
            <small>Nombre completo</small>
            <strong>
                ${escapar(
                    obtenerNombre(e)
                )}
            </strong>
        </div>


        <div class="info">
            <small>DNI</small>
            <strong>
                ${escapar(
                    e.dni || "-"
                )}
            </strong>
        </div>


        <div class="info">
            <small>Teléfono</small>
            <strong>
                ${escapar(
                    e.telefono ||
                    e.phone ||
                    "-"
                )}
            </strong>
        </div>


        <div class="info">
            <small>Email</small>
            <strong>
                ${escapar(
                    e.email ||
                    "-"
                )}
            </strong>
        </div>


        <div class="info">
            <small>Puesto</small>
            <strong>
                ${escapar(
                    e.puesto ||
                    e.cargo ||
                    "-"
                )}
            </strong>
        </div>


        <div class="info">
            <small>Tipo de empleado</small>
            <strong>
                ${escapar(
                    e.tipoEmpleado ||
                    e.tipo ||
                    "-"
                )}
            </strong>
        </div>


        <div class="info">
            <small>Pago diario</small>
            <strong>
                $${formatear(
                    e.pagoDiario
                )}
            </strong>
        </div>


        <div class="info">
            <small>Fecha de ingreso</small>
            <strong>
                ${escapar(
                    e.fechaIngreso ||
                    "-"
                )}
            </strong>
        </div>


        <div class="info">
            <small>Estado</small>
            <strong>

                <span class="estado ${
                    estado === "activo"
                        ? "estado-activo"
                        : "estado-inactivo"
                }">

                    ${estado.toUpperCase()}

                </span>

            </strong>
        </div>

    `;


    let html = "";


    if (acceso) {

        html += `
            <strong>
                🔐 Acceso a GESBASE: HABILITADO
            </strong>

            <div>
                El empleado tiene una cuenta
                de acceso.
            </div>
        `;

    } else {

        html += `
            <strong>
                🔒 Acceso a GESBASE: NO CREADO
            </strong>

            <div>
                Todavía no se creó una cuenta
                para este empleado.
            </div>
        `;

    }


    if (
        e.accesoBloqueado === true
    ) {

        html += `
            <div style="
                margin-top:10px;
                color:#92400e;
                font-weight:700;
            ">
                🚫 El acceso está bloqueado.
            </div>
        `;

    }


    if (
        e.passwordTemporal === true
    ) {

        html += `
            <div style="
                margin-top:10px;
                color:#92400e;
            ">
                ⚠️ Tiene una contraseña temporal
                pendiente de cambio.
            </div>
        `;

    }


    estadoAcceso.innerHTML =
        html;


    actualizarBotones();

}


/* =========================================================
   ESTADO
========================================================= */

function obtenerEstado(
    empleado
) {

    const estado =
        String(
            empleado.estado ||
            ""
        ).toLowerCase();


    if (
        estado === "inactivo" ||
        estado === "baja" ||
        estado === "bloqueado"
    ) {

        return "inactivo";

    }


    return "activo";

}


/* =========================================================
   ACCESO
========================================================= */

function tieneAcceso(
    empleado
) {

    return Boolean(
        empleado.authUid ||
        empleado.usuarioId
    );

}

   BOTONES
========================================================= */

function actualizarBotones() {

    if (
        !empleadoSeleccionado
    ) {

        return;

    }


    const e =
        empleadoSeleccionado;


    const acceso =
        tieneAcceso(e);


    const btnAcceso =
        document.getElementById(
            "btnAcceso"
        );


    const btnBloquear =
        document.getElementById(
            "btnBloquear"
        );


    const btnActivar =
        document.getElementById(
            "btnActivar"
        );


    const btnBaja =
        document.getElementById(
            "btnBaja"
        );


    if (acceso) {

        btnAcceso.disabled =
            true;

        btnAcceso.textContent =
            "🔐 Acceso creado";

    } else {

        btnAcceso.disabled =
            false;

        btnAcceso.textContent =
            "🔐 Dar acceso a GESBASE";

    }


    if (
        e.accesoBloqueado === true
    ) {

        btnBloquear.textContent =
            "🔓 Desbloquear acceso";

        btnBloquear.disabled =
            false;

    } else {

        btnBloquear.textContent =
            "🚫 Bloquear acceso";

        btnBloquear.disabled =
            !acceso;

    }


    if (
        obtenerEstado(e) ===
        "inactivo"
    ) {

        btnActivar.classList.remove(
            "oculto"
        );

        btnBaja.classList.add(
            "oculto"
        );

    } else {

        btnActivar.classList.add(
            "oculto"
        );

        btnBaja.classList.remove(
            "oculto"
        );

    }

}

/* =========================================================
   DAR ACCESO
========================================================= */

async function darAcceso() {

    if (
        !empleadoSeleccionado
    ) {

        return;

    }


    const e =
        empleadoSeleccionado;


    if (
        tieneAcceso(e)
    ) {

        mostrarMensaje(
            "Este empleado ya tiene acceso a GESBASE.",
            "error"
        );

        return;

    }


    if (
        !e.email
    ) {

        mostrarMensaje(
            "Este empleado no tiene email. Primero agregá su email.",
            "error"
        );

        editarEmpleado();

        return;

    }


    const confirmar =
        confirm(
            "¿Crear acceso a GESBASE para " +
            obtenerNombre(e) +
            "?"
        );


    if (!confirmar) {

        return;

    }


    try {

        mostrarMensaje(
            "Creando acceso..."
        );


        /*
         * Obtenemos el token del administrador.
         */

        const token =
            await usuarioActual.getIdToken(
                true
            );


        /*
         * Llamamos a la función que ya
         * desplegamos.
         */

        const respuesta =
            await fetch(
                "https://us-central1-gesbase-web.cloudfunctions.net/crearAccesoEmpleado",
                {

                    method: "POST",

                    headers: {

                        "Content-Type":
                            "application/json",

                        "Authorization":
                            "Bearer " +
                            token

                    },

                    body: JSON.stringify({

                        empleadoId:
                            e.id

                    })

                }
            );


        const resultado =
            await respuesta.json();


        if (
            !respuesta.ok
        ) {

            throw new Error(
                resultado.error ||
                resultado.message ||
                "No se pudo crear el acceso."
            );

        }


        /*
         * Actualizamos pantalla.
         */

        e.authUid =
            resultado.authUid ||
            "";

        e.usuarioId =
            resultado.authUid ||
            "";

        e.passwordTemporal =
            true;


        mostrarEmpleado();


        /*
         * Mostramos credenciales.
         */

        estadoAcceso.innerHTML += `

            <div class="credenciales">

                <div>
                    📧 Email:
                    <strong>
                        ${escapar(
                            resultado.email ||
                            e.email
                        )}
                    </strong>
                </div>


                <div>
                    🔑 Contraseña temporal:
                    <strong>
                        ${escapar(
                            resultado.password ||
                            "No informada"
                        )}
                    </strong>
                </div>


                <div style="
                    margin-top:12px;
                    color:#d1d5db;
                ">
                    ⚠️ Guardá esta contraseña.
                    El empleado deberá cambiarla
                    al ingresar.
                </div>

            </div>

        `;


        mostrarMensaje(
            "Acceso creado correctamente."
        );


    } catch (error) {

        console.error(
            "ERROR CREANDO ACCESO:",
            error
        );


        mostrarMensaje(
            "No se pudo crear el acceso: " +
            (error.message || error),
            "error"
        );

    }

}


window.darAcceso =
    darAcceso;

async function bloquearAcceso() {

    if (
        !empleadoSeleccionado
    ) {

        return;

    }


    const e =
        empleadoSeleccionado;


    /*
     * DESBLOQUEAR

        e.accesoBloqueado === true
    ) {

        try {

            await updateDoc(
                doc(
                    db,
                    "empleados",
                    e.id
                ),
                {

                    accesoBloqueado:
                        false,

                    accesoBloqueadoPor:
                        null,

                    accesoBloqueadoEn:
                        null

                }
            );


            e.accesoBloqueado =
                false;


            mostrarEmpleado();


            mostrarMensaje(
                "Acceso desbloqueado."
            );


        } catch (error) {

            console.error(error);

            mostrarMensaje(
                obtenerErrorFirebase(error),
                "error"
            );

        }

        return;

    }


    /*
     * BLOQUEAR
     */

    const confirmar =
        confirm(
            "¿Bloquear el acceso a GESBASE de " +
            obtenerNombre(e) +
            "?"
        );


    if (!confirmar) {

        return;

    }


    try {

        await updateDoc(
            doc(
                db,
                "empleados",
                e.id
            ),
            {

                accesoBloqueado:
                    true,

                accesoBloqueadoPor:
                    usuarioActual.uid,

                accesoBloqueadoEn:
                    serverTimestamp()

            }
        );


        e.accesoBloqueado =
            true;


        mostrarEmpleado();


        mostrarMensaje(

        );


    } catch (error) {

        console.error(error);

        mostrarMensaje(
            obtenerErrorFirebase(error),
            "error"
        );

    }

}

async function mostrarGastos() {

    if (
        !empleadoSeleccionado
    ) {

        return;

    }


    const seccion =
        document.getElementById(
            "seccionGastos"
        );


    const lista =
        document.getElementById(
            "listaGastos"
        );


    seccion.classList.remove(
        "oculto"
    );


    lista.innerHTML =
        "Cargando gastos...";


    try {

        const q =
            query(
                collection(
                    db,
                    "gastos"
                ),
                where(
                    "empresaId",
                    "==",
                    empresaActualId
                )
            );


        const snap =
            await getDocs(q);


        const gastos = [];


        snap.forEach(
            documento => {

                const gasto =
                    documento.data();


                const empleadoId =
                    gasto.empleadoId ||
                    gasto.idEmpleado ||
                    gasto.usuarioEmpleadoId ||
                    "";


                if (
                    empleadoId ===
                    empleadoSeleccionado.id
                ) {

                    gastos.push({

                        id:
                            documento.id,

                        ...gasto

                    });

                }

            }
        );


        if (
            gastos.length === 0
        ) {

            lista.innerHTML = `
                <div class="vacio">
                    No hay gastos registrados
                    para este empleado.
                </div>
            `;

            seccion.scrollIntoView({
                behavior: "smooth"
            });

            return;

        }


        let total = 0;


        let html = `

            <div class="tabla">

                <table>

                    <thead>

                        <tr>

                            <th>
                                Fecha
                            </th>

                            <th>
                                Concepto
                            </th>

                            <th>
                                Importe
                            </th>

                            <th>
                                Estado
                            </th>

                        </tr>

                    </thead>

                    <tbody>

        `;


        gastos.forEach(
            gasto => {

                const importe =
                    Number(
                        gasto.importe ||
                        gasto.monto ||
                        gasto.total ||
                        0
                    );


                total +=
                    importe;


                html += `

                    <tr>

                        <td>
                            ${escapar(
                                gasto.fecha ||
                                gasto.fechaGasto ||
                                "-"
                            )}
                        </td>

                        <td>
                            ${escapar(
                                gasto.concepto ||
                                gasto.descripcion ||
                                gasto.detalle ||
                                "Gasto"
                            )}
                        </td>

                        <td>
                            $${formatear(
                                importe
                            )}
                        </td>

                        <td>
                            ${escapar(
                                gasto.estado ||
                                "Registrado"
                            )}
                        </td>

                    </tr>

        html += `

                                    ) +
                                    "/" +
                                    String(

                                    )
                                )}

                                    )}

                            </td>

                            <td>
                                ${escapar(
                                    l.estado ||
                                    "Pendiente"
                                )}
                            </td>

                        </tr>

                    `;

                }
            );


            html += `

                        </tbody>

                    </table>

                </div>

            `;

        } else {

            html += `

                <div class="vacio">
                    No hay liquidaciones registradas.
                </div>

            `;

        }


        lista.innerHTML =
            html;


        seccion.scrollIntoView({

        });

        lista.innerHTML = `

                <br><br>

                ${escapar(

            </div>

        `;

    }

}


window.mostrarHistorial =
    mostrarHistorial;


/* =========================================================
   UTILIDADES
========================================================= */

function formatear(
    numero
) {

    return Number(
        numero || 0
    ).toLocaleString(
        "es-AR",
        {
            minimumFractionDigits: 0,
            maximumFractionDigits: 2
        }
    );

}


function escapar(
    texto
) {

    return String(
        texto ?? ""
    )
    .replace(
        /&/g,
        "&amp;"
    )
    .replace(
        /</g,
        "&lt;"
    )
    .replace(
        />/g,
        "&gt;"
    )
    .replace(
        /"/g,
        "&quot;"
    )
    .replace(
        /'/g,
        "&#039;"
    );

}


/* =========================================================
   ERRORES FIREBASE
========================================================= */

function obtenerErrorFirebase(
    error
) {

    if (!error) {

        return "Error desconocido.";

    }


    const codigo =
        error.code ||
        "";


    const mensajeError =
        error.message ||
        "";


    if (
        codigo ===
        "permission-denied"
    ) {

        return (
            "Firebase rechazó el acceso a empleados. " +
            "Revisá las reglas de Firestore para la colección empleados."
        );

    }


    if (
        codigo ===
        "failed-precondition"
    ) {

        return (
            "Firebase necesita una configuración o índice para esta consulta."
        );

    }


    if (
        codigo ===
        "unavailable"
    ) {

        return (
            "Firebase no está disponible en este momento. "
            +
            "Comprobá tu conexión."
        );

    }


    return (
        mensajeError ||
        codigo ||
        "Error desconocido."
    );

}


/* =========================================================
   VOLVER
========================================================= */

function volver() {

    location.href =
        "index.html";

}


window.volver =
    volver;


</script>
