<html lang="es">

<head>

<meta

    content="width=device-width, initial-scale=1.0"
>

    content="#111827"

<title>GESBASE - Fotos</title>

<style>

/* ==========================================
   RESET
========================================== */

*{
    box-sizing:border-box;
    margin:0;
    padding:0;
}


/* ==========================================
   BODY
========================================== */

body{
    font-family:Arial,sans-serif;
    background:#f3f4f6;
    color:#111827;
    min-height:100vh;
}


/* ==========================================
   APP
========================================== */

.app{
    width:100%;
    max-width:700px;
    min-height:100vh;
    margin:auto;
    background:#fff;
}


/* ==========================================
   HEADER
========================================== */

header{
    background:#111827;
    color:#fff;
    padding:20px;
    display:flex;
    align-items:center;
    gap:12px;
}

.btn-volver{
    width:42px;
    height:42px;
    border:none;
    border-radius:10px;
    background:#374151;
    color:#fff;
    font-size:22px;
    cursor:pointer;
}

.btn-volver:active{
    transform:scale(.96);
}

.header-text{
    flex:1;
}

.logo{
    font-size:25px;
    font-weight:bold;
    letter-spacing:1px;
}

.subtitulo{
    margin-top:4px;
    font-size:13px;
    color:#d1d5db;
}


/* ==========================================
   MAIN
========================================== */

main{
    padding:20px;
}


/* ==========================================
   TITULO
========================================== */

.titulo{
    font-size:25px;
    margin-bottom:6px;
}

.descripcion{
    color:#6b7280;
    font-size:14px;
    line-height:1.5;
    margin-bottom:20px;
}


/* ==========================================
   BOTON SUBIR
========================================== */

.btn-subir{
    width:100%;
    border:none;
    border-radius:12px;
    background:#111827;
    color:#fff;
    padding:17px;
    font-size:16px;
    font-weight:bold;
    cursor:pointer;
    margin-bottom:10px;
}

.btn-subir:active{
    transform:scale(.99);
}

.btn-subir:disabled{
    opacity:.5;
    cursor:not-allowed;
}


/* ==========================================
   INPUT
========================================== */

#inputFotos{
    display:none;
}


/* ==========================================
   ESTADO
========================================== */

.estado{
    display:none;
    padding:14px;
    border-radius:10px;
    margin-bottom:20px;
    font-size:14px;
    line-height:1.4;
}

.estado.visible{
    display:block;
}

.estado.exito{
    background:#dcfce7;
    color:#166534;
}

.estado.error{
    background:#fee2e2;
    color:#991b1b;
}

.estado.info{
    background:#eff6ff;
    color:#1e40af;
}


/* ==========================================
   GALERIA
========================================== */

.cabecera-galeria{
    display:flex;
    align-items:center;
    justify-content:space-between;
    margin-bottom:14px;
}

.cabecera-galeria h2{
    font-size:18px;
}

.contador{
    color:#6b7280;
    font-size:13px;
}

.galeria{
    display:grid;
    grid-template-columns:repeat(2,1fr);
    gap:12px;
}


/* ==========================================
   TARJETA
========================================== */

.tarjeta-foto{
    background:#f9fafb;
    border-radius:14px;
    overflow:hidden;
    border:1px solid #e5e7eb;
}

.contenedor-imagen{
    width:100%;
    aspect-ratio:1 / 1;
    background:#e5e7eb;
    overflow:hidden;
}

.contenedor-imagen img{
    width:100%;
    height:100%;
    display:block;
    object-fit:cover;
    cursor:pointer;
}

.info-foto{
    padding:11px;
}

.nombre-foto{
    font-size:14px;
    font-weight:bold;
    word-break:break-word;
    margin-bottom:5px;
}

.fecha-foto{
    color:#6b7280;
    font-size:12px;
    margin-bottom:10px;
}

.btn-eliminar{
    width:100%;
    border:none;
    border-radius:8px;
    padding:10px;
    background:#fee2e2;
    color:#991b1b;
    font-weight:bold;
    cursor:pointer;
}

.btn-eliminar:disabled{
    opacity:.5;
    cursor:not-allowed;
}


/* ==========================================
   SIN FOTOS
========================================== */

.sin-fotos{
    display:none;
    text-align:center;
    padding:40px 20px;
    background:#f9fafb;
    border-radius:14px;
    color:#6b7280;
}

.sin-fotos-icono{
    font-size:45px;
    margin-bottom:10px;
}

.sin-fotos strong{
    display:block;
    color:#111827;
    margin-bottom:6px;
}


/* ==========================================
   CARGANDO
========================================== */

.cargando{
    text-align:center;
    padding:30px;
    color:#6b7280;
}


/* ==========================================
   MODAL
========================================== */

.modal{
    position:fixed;
    inset:0;
    display:none;
    align-items:center;
    justify-content:center;
    padding:20px;
    background:rgba(0,0,0,.88);
    z-index:9999;
}

.modal.activo{
    display:flex;
}

.modal-contenido{
    position:relative;
    max-width:95vw;
    max-height:90vh;
}

.modal-contenido img{
    max-width:100%;
    max-height:85vh;
    display:block;
    border-radius:10px;
}

.btn-cerrar-modal{
    position:absolute;
    top:-45px;
    right:0;
    width:38px;
    height:38px;
    border:none;
    border-radius:50%;
    background:#fff;
    color:#111827;
    font-size:20px;
    cursor:pointer;
}


/* ==========================================
   RESPONSIVE
========================================== */

@media(max-width:500px){

    main{
        padding:16px;
    }

    .galeria{
        grid-template-columns:repeat(2,1fr);
        gap:10px;
    }

    .titulo{
        font-size:23px;
    }

}

</style>

</head>


<body>


<div class="app">


<header>

<button
    id="btnVolver"
    class="btn-volver"

>
←
</button>


<div class="header-text">

<div class="logo">
GESBASE
</div>

<div class="subtitulo">
Tu empresa. Todo organizado.
</div>

</div>

</header>


<main>


<h1 class="titulo">
📸 Fotos
</h1>


<p class="descripcion">
Guardá y organizá las fotos relacionadas con tus trabajos y tu empresa.

<input

<div class="cabecera-galeria">

<h2>
Mis fotos
</h2>

<span
    id="contador"
    class="contador"
>
0 fotos
</span>

</div>


<div
    id="cargandoFotos"
    class="cargando"
>
Cargando fotos...

<div
    id="galeria"

>
</div>

>

<div class="sin-fotos-icono">
📸
</div>

Todavía no tenés fotos
</strong>

</span>

</main>

</div>


<!-- ==========================================
     MODAL
========================================== -->

<div
    id="modal"
    class="modal"
>

<div class="modal-contenido">

<button
    id="btnCerrarModal"
    class="btn-cerrar-modal"
    type="button"
>
✕
</button>

<img
    id="imagenModal"
    src=""
    alt="Foto GESBASE"
>

</div>

</div>


<script type="module">


/* ==========================================
   FIREBASE
========================================== */

import {
    auth,
    db,
    almacenamiento
} from "./Js/firebase.js";


import {
    onAuthStateChanged
} from
"https://www.gstatic.com/firebasejs/12.1.0/firebase-auth.js";


import {
    collection,
    query,
    where,
    getDocs,
    addDoc,
    deleteDoc,
    doc,
    serverTimestamp
} from
"https://www.gstatic.com/firebasejs/12.1.0/firebase-firestore.js";


import {
    ref,
    uploadBytes,
    getDownloadURL,
    deleteObject
} from
"https://www.gstatic.com/firebasejs/12.1.0/firebase-storage.js";


/* ==========================================
   ELEMENTOS
========================================== */

const btnVolver =
document.getElementById("btnVolver");

const btnSubir =
document.getElementById("btnSubir");

const inputFotos =
document.getElementById("inputFotos");

const estado =
document.getElementById("estado");

const galeria =
document.getElementById("galeria");

const cargandoFotos =
document.getElementById("cargandoFotos");

const sinFotos =
document.getElementById("sinFotos");

const contador =
document.getElementById("contador");

const modal =
document.getElementById("modal");

const imagenModal =
document.getElementById("imagenModal");

const btnCerrarModal =
document.getElementById("btnCerrarModal");


/* ==========================================
   VARIABLES
========================================== */

let usuarioActual = null;

let procesando = false;


/* ==========================================
   VOLVER
========================================== */

btnVolver.addEventListener(
    "click",
    function(){

        window.location.href =
        "index.html";

    }
);


/* ==========================================
   ESTADO
========================================== */

function mostrarEstado(
    mensaje,
    tipo = "info"
){

    estado.textContent =
    mensaje;

    estado.className =
    "estado visible";

    if(tipo){

        estado.classList.add(
            tipo
        );

    }

}


function ocultarEstado(){

    estado.textContent =
    "";

    estado.className =
    "estado";

}


/* ==========================================
   FECHA
========================================== */

function obtenerFecha(
    fecha
){

    if(!fecha){

        return 0;

    }

    try{

        if(
            typeof fecha.toMillis ===
            "function"
        ){

            return fecha.toMillis();

        }


        if(
            typeof fecha.toDate ===
            "function"
        ){

            return fecha.toDate()
                .getTime();

        }


        if(
            fecha instanceof Date
        ){

            return fecha.getTime();

        }


        if(
            typeof fecha === "number"
        ){

            return fecha;

        }


        const resultado =
        new Date(fecha).getTime();


        return Number.isNaN(resultado)
            ? 0
            : resultado;

    }
    catch(error){

        return 0;

    }

}


/* ==========================================
   FORMATEAR FECHA
========================================== */

function formatearFecha(
    fecha
){

    const tiempo =
    obtenerFecha(fecha);


    if(!tiempo){

        return "Sin fecha";

    }


    return new Date(
        tiempo
    ).toLocaleDateString(
        "es-AR",
        {
            day:"2-digit",
            month:"2-digit",
            year:"numeric"
        }
    );

}


/* ==========================================
   NOMBRE SEGURO
========================================== */

function generarNombreSeguro(
    nombre
){

    const nombreLimpio =
    nombre
    .replace(
        /[^a-zA-Z0-9._-]/g,
        "_"
    );


    return (
        Date.now() +
        "_" +
        Math.random()
            .toString(36)
            .substring(2,10) +
        "_" +
        nombreLimpio
    );

}


/* ==========================================
   CARGAR FOTOS
========================================== */

async function cargarFotos(){

    if(!usuarioActual){

        return;

    }


    cargandoFotos.style.display =
    "block";

    galeria.style.display =
    "none";

    sinFotos.style.display =
    "none";


    try{

        const referencia =
        collection(
            db,
            "fotos"
        );


        /*
         * No usamos orderBy().
         * De esta manera no necesitamos
         * un índice compuesto.
         */

        const consulta =
        query(
            referencia,

            where(
                "usuarioId",
                "==",
                usuarioActual.uid
            )
        );


        const resultado =
        await getDocs(
            consulta
        );


        const documentos =
        resultado.docs.sort(
            function(a,b){

                const fechaA =
                obtenerFecha(
                    a.data().fecha
                );

                const fechaB =
                obtenerFecha(
                    b.data().fecha
                );

                return fechaB - fechaA;

            }
        );


        galeria.innerHTML =
        "";


        contador.textContent =
        documentos.length +
        (
            documentos.length === 1
            ? " foto"
            : " fotos"
        );


        cargandoFotos.style.display =
        "none";


        if(
            documentos.length === 0
        ){

            sinFotos.style.display =
            "block";

            return;

        }


        galeria.style.display =
        "grid";


        documentos.forEach(
            function(documento){

                crearTarjetaFoto(
                    documento.id,
                    documento.data()
                );

            }
        );

    }
    catch(error){

        console.error(
            "Error cargando fotos:",
            error
        );


        cargandoFotos.style.display =
        "none";


        galeria.style.display =
        "none";


        sinFotos.style.display =
        "none";


        mostrarEstado(
            "No se pudieron cargar las fotos. " +
            obtenerMensajeError(error),
            "error"
        );

    }

}


/* ==========================================
   MENSAJE ERROR
========================================== */

function obtenerMensajeError(
    error
){

    if(!error){

        return "Error desconocido.";

    }


    if(error.code === "permission-denied"){

        return "Firebase no permite acceder a las fotos. Revisá las reglas de Firestore.";

    }


    if(
        error.code ===
        "storage/unauthorized"
    ){

        return "Firebase Storage no permite acceder a este archivo.";

    }


    if(error.message){

        return error.message;

    }


    return "Ocurrió un error inesperado.";

}


/* ==========================================
   CREAR TARJETA
========================================== */

function crearTarjetaFoto(
    id,
    datos
){

    const tarjeta =
    document.createElement("div");

    tarjeta.className =
    "tarjeta-foto";


    const contenedor =
    document.createElement("div");

    contenedor.className =
    "contenedor-imagen";


    const imagen =
    document.createElement("img");


    imagen.src =
    datos.url || "";


    imagen.alt =
    datos.nombre ||
    "Foto GESBASE";


    imagen.loading =
    "lazy";


    imagen.addEventListener(
        "click",
        function(){

            if(datos.url){

                abrirModal(
                    datos.url
                );

            }

        }
    );


    imagen.addEventListener(
        "error",
        function(){

            imagen.alt =
            "No se pudo cargar la imagen";

        }
    );


    contenedor.appendChild(
        imagen
    );


    const info =
    document.createElement("div");

    info.className =
    "info-foto";


    const nombre =
    document.createElement("div");

    nombre.className =
    "nombre-foto";

    nombre.textContent =
    datos.nombre ||
    "Foto";


    const fecha =
    document.createElement("div");

    fecha.className =
    "fecha-foto";

    fecha.textContent =
    formatearFecha(
        datos.fecha
    );


    const botonEliminar =
    document.createElement("button");

    botonEliminar.type =
    "button";

    botonEliminar.className =
    "btn-eliminar";

    botonEliminar.textContent =
    "Eliminar";


    botonEliminar.addEventListener(
        "click",
        function(){

            eliminarFoto(
                id,
                datos.storagePath,
                botonEliminar
            );

        }
    );


    info.appendChild(
        nombre
    );

    info.appendChild(
        fecha
    );

    info.appendChild(
        botonEliminar
    );


    tarjeta.appendChild(
        contenedor
    );

    tarjeta.appendChild(
        info
    );


    galeria.appendChild(
        tarjeta
    );

}


/* ==========================================
   SELECCIONAR FOTOS
========================================== */

btnSubir.addEventListener(
    "click",
    function(){

        if(!usuarioActual){

            mostrarEstado(
                "La sesión todavía no está disponible.",
                "error"
            );

            return;

        }


        if(procesando){

            return;

        }


        inputFotos.click();

    }
);


/* ==========================================
   SUBIR FOTOS
========================================== */

inputFotos.addEventListener(
    "change",
    async function(){

        const archivos =
        Array.from(
            inputFotos.files || []
        );


        if(
            archivos.length === 0
        ){

            return;

        }


        if(!usuarioActual){

            mostrarEstado(
                "Tu sesión expiró. Volvé a iniciar sesión.",
                "error"
            );

            inputFotos.value =
            "";

            return;

        }


        if(procesando){

            return;

        }


        procesando =
        true;


        btnSubir.disabled =
        true;


        let fotosSubidas = 0;

        let fotosOmitidas = 0;


        try{

            for(
                let i = 0;
                i < archivos.length;
                i++
            ){

                const archivo =
                archivos[i];


                /* ==============================
                   VALIDAR TIPO
                ============================== */

                if(
                    !archivo.type ||
                    !archivo.type.startsWith(
                        "image/"
                    )
                ){

                    fotosOmitidas++;

                    continue;

                }


                /* ==============================
                   LIMITE 10 MB
                ============================== */

                const maximo =
                10 * 1024 * 1024;


                if(
                    archivo.size >
                    maximo
                ){

                    fotosOmitidas++;

                    mostrarEstado(
                        "La imagen " +
                        archivo.name +
                        " supera los 10 MB.",
                        "error"
                    );

                    continue;

                }


                mostrarEstado(
                    "Subiendo foto " +
                    (i + 1) +
                    " de " +
                    archivos.length +
                    "...",
                    "info"
                );


                /* ==============================
                   NOMBRE
                ============================== */

                const nombreArchivo =
                generarNombreSeguro(
                    archivo.name
                );


                /* ==============================
                   RUTA
                ============================== */

                const ruta =
                    "fotos/" +
                    usuarioActual.uid +
                    "/" +
                    nombreArchivo;


                const referenciaStorage =
                ref(
                    almacenamiento,
                    ruta
                );


                /* ==============================
                   STORAGE
                ============================== */

                await uploadBytes(
                    referenciaStorage,
                    archivo,
                    {
                        contentType:
                        archivo.type
                    }
                );


                /* ==============================
                   URL
                ============================== */

                const url =
                await getDownloadURL(
                    referenciaStorage
                );


                /* ==============================
                   FIRESTORE
                ============================== */

                try{

                    await addDoc(
                        collection(
                            db,
                            "fotos"
                        ),
                        {

                            usuarioId:
                            usuarioActual.uid,

                            nombre:
                            archivo.name,

                            url:
                            url,

                            storagePath:
                            ruta,

                            tipo:
                            archivo.type,

                            tamaño:
                            archivo.size,

                            fecha:
                            serverTimestamp()

                        }
                    );

                }
                catch(errorFirestore){

                    /*
                     * Si Storage subió el archivo pero
                     * Firestore falla, intentamos borrar
                     * el archivo para evitar archivos
                     * huérfanos.
                     */

                    try{

                        await deleteObject(
                            referenciaStorage
                        );

                    }
                    catch(errorEliminar){

                        console.warn(
                            "No se pudo limpiar Storage:",
                            errorEliminar
                        );

                    }

                    throw errorFirestore;

                }


                fotosSubidas++;

            }


            inputFotos.value =
            "";


            if(
                fotosSubidas > 0
            ){

                let mensaje =
                fotosSubidas === 1
                ? "Foto cargada correctamente."
                : fotosSubidas +
                  " fotos cargadas correctamente.";


                if(fotosOmitidas > 0){

                    mensaje +=
                    " " +
                    fotosOmitidas +
                    " archivo(s) fueron omitidos.";

                }


                mostrarEstado(
                    mensaje,
                    "exito"
                );

            }
            else if(
                fotosOmitidas > 0
            ){

                mostrarEstado(
                    "No se pudo cargar ninguna foto.",
                    "error"
                );

            }


            await cargarFotos();

        }
        catch(error){

            console.error(
                "Error subiendo fotos:",
                error
            );


            mostrarEstado(
                "No se pudieron subir las fotos. " +
                obtenerMensajeError(error),
                "error"
            );

        }
        finally{

            procesando =
            false;

            btnSubir.disabled =
            false;

        }

    }
);


/* ==========================================
   ELIMINAR FOTO
========================================== */

async function eliminarFoto(
    id,
    storagePath,
    boton
){

    if(
        !usuarioActual
    ){

        mostrarEstado(
            "La sesión no está disponible.",
            "error"
        );

        return;

    }


    const confirmar =
    confirm(
        "¿Querés eliminar esta foto?\n\nEsta acción no se puede deshacer."
    );


    if(!confirmar){

        return;

    }


    if(boton){

        boton.disabled =
        true;

        boton.textContent =
        "Eliminando...";

    }


    try{

        mostrarEstado(
            "Eliminando foto...",
            "info"
        );


        /* ==============================
           STORAGE
        ============================== */

        if(storagePath){

            try{

                const referenciaStorage =
                ref(
                    almacenamiento,
                    storagePath
                );


                await deleteObject(
                    referenciaStorage
                );

            }
            catch(errorStorage){

                /*
                 * Si el archivo ya no existe,
                 * continuamos eliminando Firestore.
                 */

                if(
                    errorStorage.code !==
                    "storage/object-not-found"
                ){

                    console.warn(
                        "Error eliminando Storage:",
                        errorStorage
                    );

                }

            }

        }


        /* ==============================
           FIRESTORE
        ============================== */

        await deleteDoc(
            doc(
                db,
                "fotos",
                id
            )
        );


        mostrarEstado(
            "Foto eliminada correctamente.",
            "exito"
        );


        await cargarFotos();

    }
    catch(error){

        console.error(
            "Error eliminando foto:",
            error
        );


        if(boton){

            boton.disabled =
            false;

            boton.textContent =
            "Eliminar";

        }


        mostrarEstado(
            "No se pudo eliminar la foto. " +
            obtenerMensajeError(error),
            "error"
        );

    }

}


/* ==========================================
   MODAL
========================================== */

function abrirModal(
    url
){

    imagenModal.src =
    url;

    modal.classList.add(
        "activo"
    );

}


function cerrarModal(){

    modal.classList.remove(
        "activo"
    );

    imagenModal.src =
    "";

}


btnCerrarModal.addEventListener(
    "click",
    cerrarModal
);


modal.addEventListener(
    "click",
    function(event){

        if(
            event.target === modal
        ){

            cerrarModal();

        }

    }
);


/* ==========================================
   ESCAPE
========================================== */

document.addEventListener(
    "keydown",
    function(event){

        if(
            event.key === "Escape"
        ){

            cerrarModal();

        }

    }
);


/* ==========================================
   AUTENTICACIÓN
========================================== */

onAuthStateChanged(
    auth,
    async function(usuario){

        if(!usuario){

            usuarioActual =
            null;

            btnSubir.disabled =
            true;

            window.location.replace(
                "login.html"
            );

            return;

        }


        usuarioActual =
        usuario;


        btnSubir.disabled =
        false;


        await cargarFotos();

    }
);


/* ==========================================
   LIMPIEZA
========================================== */

window.addEventListener(
    "beforeunload",
    function(){

        cerrarModal();

    }
);

</script>
