/* =====================================================

import {

    ref,

    getDownloadURL,
    deleteObject

/* =====================================================

===================================================== */

let usuarioActual = null;

let empresaIdActual = "";

let empresaNombreActual = "";

let empresaDatos = {};

let clientes = [];

let trabajos = [];

let trabajoSeleccionado = null;

let archivoFoto = null;

let fotosTrabajo = [];


/* =====================================================

===================================================== */

const previewImagen =

const mensaje =

const progreso =

const barraInterna =

const progresoTexto =
    document.getElementById("progresoTexto");


/* =====================================================
   UTILIDADES
===================================================== */

function limpiarId(valor){

    if(
        valor === undefined ||
        valor === null
    ){

        return "";

    }

    return String(valor).trim();

}


function escapeHTML(valor){

    return String(valor ?? "")
        .replace(/&/g,"&amp;")
        .replace(/</g,"&lt;")
        .replace(/>/g,"&gt;")
        .replace(/"/g,"&quot;")
        .replace(/'/g,"&#039;");

}


function nombreCliente(cliente){

    if(!cliente){

        return "Cliente";

    }


    if(cliente.nombreCompleto){

        return String(
            cliente.nombreCompleto
        );

    }


    if(
        cliente.nombre ||
        cliente.apellido
    ){

        return (
            String(
                cliente.nombre || ""
            ) +
            " " +
            String(
                cliente.apellido || ""
            )
        ).trim();

    }


    return String(
        cliente.razonSocial ||
        cliente.razon_social ||
        cliente.empresa ||
        cliente.nombreCliente ||
        "Cliente"
    );

}


function nombreTrabajo(trabajo){

    if(!trabajo){

        return "Trabajo";

    }


    return String(
        trabajo.nombreTrabajo ||
        trabajo.nombre ||
        trabajo.titulo ||
        trabajo.descripcion ||
        "Trabajo"
    );

}


function mostrarMensaje(texto,tipo){

    mensaje.textContent =
        texto;

    mensaje.className =
        "mensaje " + tipo;

    window.scrollTo({
        top:0,
        behavior:"smooth"
    });

}


function ocultarMensaje(){

    mensaje.textContent =
        "";

    mensaje.className =
        "mensaje";

}


/* =====================================================
   OBTENER EMPRESA
===================================================== */

async function obtenerEmpresa(){

    const usuarioRef =
        doc(
            db,
            "usuarios",
            usuarioActual.uid
        );


    const usuarioSnap =
        await getDoc(
            usuarioRef
        );


    if(!usuarioSnap.exists()){

        throw new Error(
            "No existe el usuario en Firestore."
        );

    }


    const datosUsuario =
        usuarioSnap.data();


    const empresaId =
        datosUsuario.empresaId ||
        datosUsuario.idEmpresa ||
        datosUsuario.companyId;


    if(!empresaId){

        throw new Error(
            "El usuario no tiene empresaId asociado."
        );

    }


    empresaIdActual =
        limpiarId(
            empresaId
        );


    empresaDatos =
        {
            ...datosUsuario
        };


    const empresaRef =
        doc(
            db,
            "empresas",
            empresaIdActual
        );


    const empresaSnap =
        await getDoc(
            empresaRef
        );


    if(empresaSnap.exists()){

        empresaDatos =
            {
                ...empresaDatos,
                ...empresaSnap.data()
            };

    }


    empresaNombreActual =
        empresaDatos.nombreEmpresa ||
        empresaDatos.nombre ||
        empresaDatos.razonSocial ||
        datosUsuario.nombreEmpresa ||
        "GESBASE";


    document.getElementById(
        "empresaUsuario"
    ).textContent =
        empresaNombreActual;


    document.getElementById(
        "idEmpresaUsuario"
    ).textContent =
        empresaIdActual;

}


/* =====================================================
   CARGAR CLIENTES
===================================================== */

async function cargarClientes(){

    const mapa =
        new Map();


    /*
       Primero buscamos por empresaId.
    */

    try{

        const q =
            query(
                collection(
                    db,
                    "clientes"
                ),
                where(
                    "empresaId",
                    "==",
                    empresaIdActual
                )
            );


        const snap =
            await getDocs(q);


        snap.forEach(
            documento => {

                mapa.set(
                    documento.id,
                    {
                        id:documento.id,
                        ...documento.data()
                    }
                );

            }
        );

    }
    catch(error){

        console.warn(
            "Clientes empresaId:",
            error
        );

    }


    /*
       También buscamos por uid.
       Esto permite trabajar con registros
       antiguos de GESBASE.
    */

    try{

        const q =
            query(
                collection(
                    db,
                    "clientes"
                ),
                where(
                    "uid",
                    "==",
                    usuarioActual.uid
                )
            );


        const snap =
            await getDocs(q);


        snap.forEach(
            documento => {

                if(
                    !mapa.has(
                        documento.id
                    )
                ){

                    mapa.set(
                        documento.id,
                        {
                            id:documento.id,
                            ...documento.data()
                        }
                    );

                }

            }
        );

    }
    catch(error){

        console.warn(
            "Clientes uid:",
            error
        );

    }


    clientes =
        Array.from(
            mapa.values()
        );


    clientes.sort(
        (a,b) =>
            nombreCliente(a)
                .localeCompare(
                    nombreCliente(b),
                    "es"
                )
    );


    clienteSelect.innerHTML = "";


    const inicial =
        document.createElement(
            "option"
        );


    inicial.value = "";


    inicial.textContent =
        clientes.length
        ?
        "Seleccioná un cliente"
        :
        "No hay clientes registrados";


    clienteSelect.appendChild(
        inicial
    );


    clientes.forEach(
        cliente => {

            const option =
                document.createElement(
                    "option"
                );


            option.value =
                cliente.id;


            option.textContent =
                nombreCliente(
                    cliente
                );


            clienteSelect.appendChild(
                option
            );

        }
    );

}


/* =====================================================

===================================================== */

                        }

                }

            }

    }
    catch(error){

        console.warn(
            "Trabajos usuarioId:",
            error
        );

    }


    /*
       Por uid.
    */

    try{

        const q =
            query(
                collection(
                    db,
                    "trabajos"
                ),
                where(
                    "uid",
                    "==",
                    usuarioActual.uid
                )
            );


        const snap =
            await getDocs(q);


        snap.forEach(
            documento => {

                if(

                    )
                ){

                    mapa.set(
                        documento.id,
                        {
                            id:documento.id,
                            ...documento.data()
                        }
                    );

                }

            }
        );

    }
    catch(error){

        console.warn(
            "Trabajos uid:",

        );

    }


    trabajos =
        Array.from(
            mapa.values()
        );


    trabajos.sort(

            nombreTrabajo(a)

}


/* =====================================================
   CARGAR TRABAJOS DEL CLIENTE
===================================================== */

function cargarTrabajosCliente(clienteId){

    trabajoSelect.innerHTML =
        "";


    trabajoSelect.disabled =
        true;


    const inicial =
        document.createElement(
            "option"
        );


    inicial.value =
        "";


    if(!clienteId){

        inicial.textContent =
            "Seleccioná primero un cliente";


        trabajoSelect.appendChild(
            inicial
        );


        return;

    }


    const lista =
        trabajos.filter(
            trabajo => {

                const trabajoClienteId =
                    limpiarId(
                        trabajo.clienteId
                    );


                const trabajoCliente =
                    limpiarId(
                        trabajo.idCliente
                    );


                const cliente =
                    limpiarId(
                        clienteId
                    );


                return (
                    trabajoClienteId === cliente ||
                    trabajoCliente === cliente
                );

            }
        );


    inicial.textContent =
        lista.length
        ?
        "Seleccioná un trabajo"
        :
        "No hay trabajos para este cliente";


    trabajoSelect.appendChild(
        inicial
    );


    lista.forEach(
        trabajo => {

            const option =
                document.createElement(
                    "option"
                );


            option.value =
                trabajo.id;


            option.textContent =
                nombreTrabajo(
                    trabajo
                );


            trabajoSelect.appendChild(
                option
            );

        }
    );


    trabajoSelect.disabled =
        lista.length === 0;

}


/* =====================================================
   CLIENTE CAMBIA
===================================================== */

clienteSelect.addEventListener(
    "change",
    async () => {

        trabajoSeleccionado =

        cargarTrabajosCliente(

);

trabajoSelect.addEventListener(

        trabajoSeleccionado =
            trabajos.find(
                trabajo =>
                    limpiarId(
                        trabajo.id
                    ) === trabajoId
            ) || null;


        if(!trabajoSeleccionado){

            document.getElementById(
                "infoTrabajo"
            ).classList.add(
                "oculto"
            );

            return;

        }


        const cliente =
            clientes.find(
                c =>
                    limpiarId(c.id) ===
                    limpiarId(
                        trabajoSeleccionado.clienteId ||
                        trabajoSeleccionado.idCliente
                    )
            );


        const info =
            document.getElementById(
                "infoTrabajo"
            );


        info.innerHTML = `

            <strong>Trabajo seleccionado</strong><br>

            ${escapeHTML(
                nombreTrabajo(
                    trabajoSeleccionado
                )
            )}

            <br>

            Cliente:
            ${escapeHTML(
                cliente
                ?
                nombreCliente(cliente)
                :
                "Cliente"
            )}

            <br>

            ID del trabajo:
            ${escapeHTML(
                trabajoSeleccionado.id
            )}

        `;


        info.classList.remove(
            "oculto"
        );


        await cargarFotosTrabajo();

    }
);


/* =====================================================
   ARCHIVO
===================================================== */

function procesarArchivo(archivo){

    if(!archivo){

        return;

    }


    if(
        !archivo.type.startsWith(
            "image/"
        )
    ){

        mostrarMensaje(
            "El archivo seleccionado no es una imagen.",
            "error"
        );

        return;

    }


    archivoFoto =
        archivo;


    archivoSeleccionado.textContent =
        "📎 " +
        archivo.name +
        " · " +
        Math.round(
            archivo.size / 1024
        ) +
        " KB";


    const reader =
        new FileReader();


    reader.onload =
        evento => {

            previewImagen.src =
                evento.target.result;

            preview.style.display =
                "block";

        };


    reader.readAsDataURL(
        archivo
    );

}


fotoCamara.addEventListener(
    "change",
    evento => {

        procesarArchivo(
            evento.target.files[0]
        );

    }
);


fotoGaleria.addEventListener(
    "change",
    evento => {

        procesarArchivo(
            evento.target.files[0]
        );

    }
);


/* =====================================================
   VALIDAR
===================================================== */

function validar(){

    if(!usuarioActual){

        return {
            ok:false,
            mensaje:
                "No hay una sesión iniciada."
        };

    }


    if(!empresaIdActual){

        return {
            ok:false,
            mensaje:
                "No se pudo identificar la empresa."
        };

    }


    if(!clienteSelect.value){

        return {
            ok:false,
            mensaje:
                "Seleccioná un cliente."
        };

    }


    if(!trabajoSelect.value){

        return {
            ok:false,
            mensaje:
                "Seleccioná un trabajo."
        };

    }


    if(!archivoFoto){

        return {
            ok:false,
            mensaje:
                "Tomá una foto o seleccioná una imagen de la galería."
        };

    }


    return {
        ok:true
    };

}


/* =====================================================
   GUARDAR FOTO
===================================================== */

btnGuardar.addEventListener(
    "click",
    async () => {

        ocultarMensaje();


        const validacion =
            validar();


        if(!validacion.ok){

            mostrarMensaje(
                validacion.mensaje,
                "error"
            );

            return;

        }


        btnGuardar.disabled =
            true;


        progreso.style.display =
            "block";


        barraInterna.style.width =
            "0%";


        progresoTexto.textContent =
            "Subiendo foto...";


        try{

            const cliente =
                clientes.find(
                    c =>
                        limpiarId(c.id) ===
                        limpiarId(
                            clienteSelect.value
                        )
                );


            const trabajo =
                trabajoSeleccionado;


            const nombreArchivo =
                Date.now() +
                "_" +
                Math.random()
                    .toString(36)
                    .substring(2,10) +
                "_" +
                archivoFoto.name
                    .replace(
                        /[^a-zA-Z0-9._-]/g,
                        "_"
                    );


            /*
               Ruta organizada en Storage:
               
               fotos/
               empresa/
               cliente/
               trabajo/
               usuario/
               archivo
            */

            const rutaStorage =
                "fotos/" +
                empresaIdActual +
                "/" +
                limpiarId(
                    clienteSelect.value
                ) +
                "/" +
                limpiarId(
                    trabajo.id
                ) +
                "/" +
                usuarioActual.uid +
                "/" +
                nombreArchivo;


            const referencia =
                ref(
                    almacenamiento,
                    rutaStorage
                );


            const uploadTask =
                uploadBytesResumable(
                    referencia,
                    archivoFoto,
                    {
                        contentType:
                            archivoFoto.type
                    }
                );


            const url =
                await new Promise(
                    (
                        resolve,
                        reject
                    ) => {

                        uploadTask.on(
                            "state_changed",

                            snapshot => {

                                const porcentaje =
                                    (
                                        snapshot.bytesTransferred /
                                        snapshot.totalBytes
                                    ) *
                                    100;


                                barraInterna.style.width =
                                    porcentaje +
                                    "%";


                                progresoTexto.textContent =
                                    "Subiendo foto... " +
                                    Math.round(
                                        porcentaje
                                    ) +
                                    "%";

                            },

                            error => {

                                reject(error);

                            },

                            async () => {

                                try{

                                    const descarga =
                                        await getDownloadURL(
                                            uploadTask.snapshot.ref
                                        );


                                    resolve(
                                        descarga
                                    );

                                }
                                catch(error){

                                    reject(
                                        error
                                    );

                                }

                            }
                        );

                    }
                );


            progresoTexto.textContent =
                "Guardando información...";


            /*
               Guardamos los datos en Firestore.
            */

            const datosFoto = {

                empresaId:
                    empresaIdActual,

                empresaNombre:
                    empresaNombreActual,

                clienteId:
                    clienteSelect.value,

                clienteNombre:
                    cliente
                    ?
                    nombreCliente(cliente)
                    :
                    "Cliente",

                trabajoId:
                    trabajo.id,

                trabajoNombre:
                    nombreTrabajo(trabajo),

                usuarioId:
                    usuarioActual.uid,

                uid:
                    usuarioActual.uid,

                usuarioEmail:
                    usuarioActual.email ||
                    "",

                nombreArchivo:
                    archivoFoto.name,

                nombreStorage:
                    rutaStorage,

                storagePath:
                    rutaStorage,

                url:
                    url,

                downloadURL:
                    url,

                descripcion:
                    descripcion.value.trim(),

                observacion:
                    descripcion.value.trim(),

                tipo:
                    archivoFoto.type,

                tamaño:
                    archivoFoto.size,

                creadoEn:
                    serverTimestamp()

            };


            await addDoc(
                collection(
                    db,
                    "fotos"
                ),
                datosFoto
            );


            mostrarMensaje(
                "✅ Foto guardada correctamente en Firebase.",
                "exito"
            );


            limpiarFoto();


            await cargarFotosTrabajo();

        }
        catch(error){

            console.error(
                "ERROR GUARDANDO FOTO:",
                error
            );


            let texto =
                error.message ||
                "Error desconocido";


            if(
                error.code ===
                "storage/unauthorized"
            ){

                texto =
                    "Firebase Storage rechazó la subida. Revisá las reglas de Storage.";

            }


            if(
                error.code ===
                "permission-denied"
            ){

                texto =
                    "Firestore rechazó el guardado. Revisá las reglas de Firestore.";

            }


            mostrarMensaje(
                "❌ No se pudo guardar la foto: " +
                texto,
                "error"
            );

        }
        finally{

            btnGuardar.disabled =
                false;


            setTimeout(
                () => {

                    progreso.style.display =
                        "none";

                },
                1000
            );

        }

    }
);


/* =====================================================
   CARGAR FOTOS DEL TRABAJO
===================================================== */

async function cargarFotosTrabajo(){

    if(
        !empresaIdActual ||
        !clienteSelect.value ||
        !trabajoSelect.value
    ){

        return;

    }


    fotosContainer.innerHTML = `

        <div class="cargando">
            🔄 Cargando fotos...
        </div>

    `;


    try{

        const q =
            query(
                collection(
                    db,
                    "fotos"
                ),
                where(
                    "empresaId",
                    "==",
                    empresaIdActual
                ),
                where(
                    "trabajoId",
                    "==",
                    trabajoSelect.value
                )
            );


        const snap =
            await getDocs(q);


        fotosTrabajo =
            snap.docs.map(
                documento => ({

                    id:
                        documento.id,

                    ...documento.data()

                })
            );


        fotosTrabajo.sort(
            (a,b) => {

                const aFecha =
                    a.creadoEn?.seconds ||
                    0;

                const bFecha =
                    b.creadoEn?.seconds ||
                    0;

                return bFecha - aFecha;

            }
        );


        mostrarFotos();

    }
    catch(error){

        console.error(
            "ERROR CARGANDO FOTOS:",
            error
        );


        fotosContainer.innerHTML = `

            <div class="vacio">

                ❌ No se pudieron cargar las fotos.

                <br><br>

                ${escapeHTML(
                    error.message
                )}

            </div>

        `;

    }

}


/* =====================================================
   MOSTRAR FOTOS
===================================================== */

function mostrarFotos(){

    if(
        fotosTrabajo.length === 0
    ){

        fotosContainer.innerHTML = `

            <div class="vacio">

                📷 Este trabajo todavía no tiene fotos.

                <br>

                Tomá una foto para comenzar el registro.

            </div>

        `;

        return;

    }


    const grid =
        document.createElement(
            "div"
        );


    grid.className =
        "fotos-grid";


    fotosTrabajo.forEach(
        foto => {

            const card =
                document.createElement(
                    "div"
                );


            card.className =
                "foto-card";


            let fechaTexto =
                "";


            if(
                foto.creadoEn &&
                foto.creadoEn.toDate
            ){

                fechaTexto =
                    foto.creadoEn
                        .toDate()
                        .toLocaleString(
                            "es-AR"
                        );

            }


            card.innerHTML = `

                <img
                    src="${escapeHTML(
                        foto.url ||
                        foto.downloadURL ||
                        ""
                    )}"
                    alt="Foto del trabajo"
                    loading="lazy"
                >

                <div class="foto-info">

                    <strong>
                        📷 Foto del trabajo
                    </strong>

                    ${
                        foto.descripcion ||
                        foto.observacion
                        ?
                        `
                        <p>
                            ${escapeHTML(
                                foto.descripcion ||
                                foto.observacion
                            )}
                        </p>
                        `
                        :
                        ""
                    }

                    ${
                        fechaTexto
                        ?
                        `
                        <div class="foto-fecha">
                            ${escapeHTML(
                                fechaTexto
                            )}
                        </div>
                        `
                        :
                        ""
                    }

                    <div
                        class="buttons"
                        style="margin-top:10px;"
                    >

                        <button
                            type="button"
                            class="btn-primary"
                            data-ver="${escapeHTML(foto.url || foto.downloadURL || "")}"
                        >
                            👁️ Ver
                        </button>

                        <button
                            type="button"
                            class="btn-danger"
                            data-eliminar="${escapeHTML(foto.id)}"
                        >
                            🗑️ Eliminar
                        </button>

                    </div>

                </div>

            `;


            grid.appendChild(
                card
            );

        }
    );


    fotosContainer.innerHTML =
        "";


    fotosContainer.appendChild(
        grid
    );


    grid
        .querySelectorAll(
            "[data-ver]"
        )
        .forEach(
            boton => {

                boton.addEventListener(
                    "click",
                    () => {

                        const url =
                            boton.dataset.ver;


                        if(url){

                            window.open(
                                url,
                                "_blank"
                            );

                        }

                    }
                );

            }
        );


    grid
        .querySelectorAll(
            "[data-eliminar]"
        )
        .forEach(
            boton => {

                boton.addEventListener(
                    "click",
                    async () => {

                        await eliminarFoto(
                            boton.dataset.eliminar
                        );

                    }
                );

            }
        );

}


/* =====================================================
   ELIMINAR FOTO
===================================================== */

async function eliminarFoto(id){

    const foto =
        fotosTrabajo.find(
            item =>
                item.id === id
        );


    if(!foto){

        return;

    }


    const confirmar =
        confirm(
            "¿Querés eliminar esta foto?\n\nLa foto se eliminará de Firebase Storage y de Firestore."
        );


    if(!confirmar){

        return;

    }


    try{

        mostrarMensaje(
            "🗑️ Eliminando foto...",
            "info"
        );


        /*
           Eliminamos del Storage.
        */

        const storagePath =
            foto.storagePath ||
            foto.nombreStorage;


        if(storagePath){

            try{

                const referencia =
                    ref(
                        almacenamiento,
                        storagePath
                    );


                await deleteObject(
                    referencia
                );

            }
            catch(error){

                /*
                   Si el archivo ya no existe,
                   continuamos eliminando Firestore.
                */

                if(
                    error.code !==
                    "storage/object-not-found"
                ){

                    throw error;

                }

            }

        }


        /*
           Eliminamos Firestore.
        */

        await deleteDoc(
            doc(
                db,
                "fotos",
                id
            )
        );


        mostrarMensaje(
            "✅ Foto eliminada correctamente.",
            "exito"
        );


        await cargarFotosTrabajo();

    }
    catch(error){

        console.error(
            "ERROR ELIMINANDO FOTO:",
            error
        );


        mostrarMensaje(
            "❌ No se pudo eliminar la foto: " +
            error.message,
            "error"
        );

    }

}
