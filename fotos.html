/* =====================================================
   MENSAJES
===================================================== */

function mostrarMensaje(texto,tipo){

    mensaje.textContent =
        texto;

    mensaje.className =
        "mensaje " + tipo;

    window.scrollTo({
        top:0,
        behavior:"smooth"
    });

}


function ocultarMensaje(){

    mensaje.textContent = "";

    mensaje.className =
        "mensaje";

}


/* =====================================================
   UTILIDADES
===================================================== */

function limpiarId(valor){

    if(
        valor === undefined ||
        valor === null
    ){

        return "";

    }

    return String(valor).trim();

}


function escapeHTML(valor){

    return String(valor ?? "")
        .replace(/&/g,"&amp;")
        .replace(/</g,"&lt;")
        .replace(/>/g,"&gt;")
        .replace(/"/g,"&quot;")
        .replace(/'/g,"&#039;");

}


function nombreCliente(cliente){

    if(!cliente){

        return "Cliente";

    }


    if(cliente.nombreCompleto){

        return String(
            cliente.nombreCompleto
        );

    }


    if(
        cliente.nombre ||
        cliente.apellido
    ){

        return (
            String(cliente.nombre || "") +
            " " +
            String(cliente.apellido || "")
        ).trim();

    }


    return String(
        cliente.razonSocial ||
        cliente.razon_social ||
        cliente.empresa ||
        cliente.nombreCliente ||
        "Cliente"
    );

}


function nombreTrabajo(trabajo){

    if(!trabajo){

        return "Trabajo";

    }


    return String(
        trabajo.nombreTrabajo ||
        trabajo.nombre ||
        trabajo.titulo ||
        trabajo.descripcion ||
        "Trabajo"
    );

}


/* =====================================================
   OBTENER EMPRESA
===================================================== */

async function obtenerEmpresa(){

    const usuarioRef =
        doc(
            db,
            "usuarios",
            usuarioActual.uid
        );


    const usuarioSnap =
        await getDoc(
            usuarioRef
        );


    if(!usuarioSnap.exists()){

        throw new Error(
            "No existe el usuario en Firestore."
        );

    }


    const datosUsuario =
        usuarioSnap.data();


    const empresaId =
        datosUsuario.empresaId ||
        datosUsuario.idEmpresa ||
        datosUsuario.companyId;


    if(!empresaId){

        throw new Error(
            "El usuario no tiene empresaId asociado."
        );

    }


    empresaIdActual =
        limpiarId(
            empresaId
        );


    empresaDatos = {
        ...datosUsuario
    };


    const empresaRef =
        doc(
            db,
            "empresas",
            empresaIdActual
        );


    const empresaSnap =
        await getDoc(
            empresaRef
        );


    if(empresaSnap.exists()){

        empresaDatos = {

            ...empresaDatos,

            ...empresaSnap.data()

        };

    }


    empresaNombreActual =
        empresaDatos.nombreEmpresa ||
        empresaDatos.nombre ||
        empresaDatos.razonSocial ||
        datosUsuario.nombreEmpresa ||
        "GESBASE";


    document.getElementById(
        "empresaUsuario"
    ).textContent =
        empresaNombreActual;


    document.getElementById(
        "idEmpresaUsuario"
    ).textContent =
        empresaIdActual;

}


/* =====================================================
   CARGAR CLIENTES
===================================================== */

async function cargarClientes(){

    clientes = [];

    const mapa =
        new Map();


    /*
        PRIMERA BÚSQUEDA:
        empresaId
    */

    try{

        const q =
            query(
                collection(
                    db,
                    "clientes"
                ),
                where(
                    "empresaId",
                    "==",
                    empresaIdActual
                )
            );


        const snap =
            await getDocs(q);


        snap.forEach(
            d => {

                mapa.set(
                    d.id,
                    {
                        id:d.id,
                        ...d.data()
                    }
                );

            }
        );

    }
    catch(error){

        console.warn(
            "Error cargando clientes por empresaId:",
            error
        );

    }


    /*
        SEGUNDA BÚSQUEDA:
        uid
    */

    try{

        const q =
            query(
                collection(
                    db,
                    "clientes"
                ),
                where(
                    "uid",
                    "==",
                    usuarioActual.uid
                )
            );


        const snap =
            await getDocs(q);


        snap.forEach(
            d => {

                if(
                    !mapa.has(d.id)
                ){

                    mapa.set(
                        d.id,
                        {
                            id:d.id,
                            ...d.data()
                        }
                    );

                }

            }
        );

    }
    catch(error){

        console.warn(
            "Error cargando clientes por uid:",
            error
        );

    }


    clientes =
        Array.from(
            mapa.values()
        );


    clientes.sort(
        (a,b) =>
            nombreCliente(a)
                .localeCompare(
                    nombreCliente(b),
                    "es"
                )
    );


    cargarSelectClientes();

}

/* =====================================================
   SELECT CLIENTES
===================================================== */

function cargarSelectClientes(){

    clienteSelect.innerHTML =
        "";


    const optionInicial =
        document.createElement(
            "option"
        );


    optionInicial.value =
        "";


    optionInicial.textContent =
        clientes.length
        ?
        "Seleccioná un cliente"
        :
        "No hay clientes registrados";


    clienteSelect.appendChild(
        optionInicial
    );


    clientes.forEach(
        cliente => {

            const option =
                document.createElement(
                    "option"
                );


            option.value =
                cliente.id;


            option.textContent =
                nombreCliente(cliente);


            clienteSelect.appendChild(
                option
            );

        }
    );

}


/* =====================================================
   SELECT TRABAJOS
===================================================== */

function cargarSelectTrabajos(
    clienteId
){

    trabajoSelect.innerHTML =
        "";


    const inicial =
        document.createElement(
            "option"
        );


    inicial.value =
        "";


    if(!clienteId){

        inicial.textContent =
            "Seleccioná primero un cliente";


        trabajoSelect.disabled =
            true;


        trabajoSelect.appendChild(
            inicial
        );


        return;

    }


    /*
        Soportamos varios nombres posibles
        para el campo cliente.
    */

    const trabajosCliente =
        trabajos.filter(
            trabajo => {

                const idClienteTrabajo =
                    trabajo.clienteId ||
                    trabajo.idCliente ||
                    trabajo.cliente_id;


                return (
                    limpiarId(
                        idClienteTrabajo
                    ) ===
                    limpiarId(
                        clienteId
                    )
                );

            }
        );


    inicial.textContent =
        trabajosCliente.length
        ?
        "Seleccioná un trabajo"
        :
        "No hay trabajos para este cliente";


    trabajoSelect.appendChild(
        inicial
    );


    trabajosCliente.forEach(
        trabajo => {

            const option =
                document.createElement(
                    "option"
                );


            option.value =
                trabajo.id;


            option.textContent =
                nombreTrabajo(
                    trabajo
                );


            trabajoSelect.appendChild(
                option
            );

        }
    );


    trabajoSelect.disabled =
        trabajosCliente.length === 0;

}


/* =====================================================
   CAMBIO CLIENTE
===================================================== */

clienteSelect.addEventListener(
    "change",
    async () => {

        ocultarMensaje();


        cargarSelectTrabajos(
            clienteSelect.value
        );


        trabajoSeleccionado =
            null;


        limpiarArchivo();


        limpiarFotos();

    }
);


/* =====================================================
   CAMBIO TRABAJO
===================================================== */

trabajoSelect.addEventListener(
    "change",
    async () => {

        ocultarMensaje();


        const id =
            limpiarId(
                trabajoSelect.value
            );


        trabajoSeleccionado =
            trabajos.find(
                trabajo =>
                    limpiarId(
                        trabajo.id
                    ) === id
            ) || null;


        if(!trabajoSeleccionado){

            limpiarFotos();

            return;

        }


        const cliente =
            clientes.find(
                cliente =>
                    limpiarId(
                        cliente.id
                    ) ===
                    limpiarId(
                        clienteSelect.value
                    )
            );


        const info =
            document.getElementById(
                "infoTrabajo"
            );


        info.innerHTML = `

            <strong>Trabajo seleccionado</strong><br>

            ${escapeHTML(
                nombreTrabajo(
                    trabajoSeleccionado
                )
            )}

            <br>

            Cliente:
            ${escapeHTML(
                cliente
                ?
                nombreCliente(cliente)
                :
                "Cliente"
            )}

            <br>

            ID del trabajo:
            ${escapeHTML(
                trabajoSeleccionado.id
            )}

        `;


        info.style.display =
            "block";


        await cargarFotos();

/* =====================================================
   SELECCIONAR ARCHIVO
===================================================== */

function seleccionarArchivo(
    archivo
){

    ocultarMensaje();


    if(!archivo){

        return;

    }


    if(
        !archivo.type.startsWith(
            "image/"
        )
    ){

        mostrarMensaje(
            "El archivo seleccionado no es una imagen.",
            "error"
        );

        return;

    }


    archivoSeleccionado =
        archivo;


    const reader =
        new FileReader();


    reader.onload =
        () => {

            previewImagen.src =
                reader.result;


            previewNombre.textContent =
                archivo.name;


            preview.style.display =
                "block";


            btnGuardar.disabled =
                false;

        };


    reader.onerror =
        () => {

            mostrarMensaje(
                "No se pudo leer la imagen.",
                "error"
            );

        };


    reader.readAsDataURL(
        archivo
    );

}

    archivoSeleccionado =

    preview.style.display =

    btnGuardar.disabled =

}

/* =====================================================
   VALIDAR
===================================================== */

function validar(){

    if(!clienteSelect.value){

        return {
            ok:false,
            mensaje:"Seleccioná un cliente."
        };

    }


    if(!trabajoSelect.value){

        return {
            ok:false,
            mensaje:"Seleccioná un trabajo."
        };

    }


    if(!archivoSeleccionado){

        return {
            ok:false,
            mensaje:"Tomá una foto o elegí una imagen de la galería."
        };

    }


    return {
        ok:true
    };

}


/* =====================================================
   GUARDAR FOTO
===================================================== */

btnGuardar.addEventListener(
    "click",
    async () => {

        ocultarMensaje();


        const validacion =
            validar();


        if(!validacion.ok){

            mostrarMensaje(
                validacion.mensaje,
                "error"
            );

            return;

        }


        btnGuardar.disabled =
            true;


        btnCamara.disabled =
            true;


        btnGaleria.disabled =
            true;


        try{

            const cliente =
                clientes.find(
                    c =>
                        limpiarId(c.id) ===
                        limpiarId(
                            clienteSelect.value
                        )
                );


            const clienteNombre =
                cliente
                ?
                nombreCliente(cliente)
                :
                "Cliente";


            const trabajoNombreActual =
                nombreTrabajo(
                    trabajoSeleccionado
                );


            /*
                Nombre seguro para Storage.
            */

            const nombreArchivoOriginal =
                archivoSeleccionado.name
                    .replace(
                        /[^a-zA-Z0-9._-]/g,
                        "_"
                    );


            const timestamp =
                Date.now();


            /*
                RUTA DE STORAGE

                empresa
                ↓
                cliente
                ↓
                trabajo
                ↓
                usuario
                ↓
                foto
            */

            const rutaStorage =
                "fotos/" +
                empresaIdActual +
                "/" +
                clienteSelect.value +
                "/" +
                trabajoSeleccionado.id +
                "/" +
                usuarioActual.uid +
                "/" +
                timestamp +
                "_" +
                nombreArchivoOriginal;


            console.log(
                "Subiendo foto a:",
                rutaStorage
            );


            mostrarMensaje(
                "📤 Subiendo foto a Firebase Storage...",
                "info"
            );


            /*
                REFERENCIA STORAGE
            */

            const storageRef =
                ref(
                    almacenamiento,
                    rutaStorage
                );


            /*
                SUBIDA
            */

            const snapshot =
                await uploadBytes(
                    storageRef,
                    archivoSeleccionado,
                    {
                        contentType:
                            archivoSeleccionado.type
                    }
                );


            console.log(
                "Foto subida:",
                snapshot
            );


            /*
                URL PÚBLICA / DOWNLOAD URL
            */

            const url =
                await getDownloadURL(
                    snapshot.ref
                );


            console.log(
                "URL foto:",
                url
            );


            mostrarMensaje(
                "📄 Guardando datos de la foto...",
                "info"
            );


            /*
                DATOS FIRESTORE
            */

            const datosFoto = {

                empresaId:
                    empresaIdActual,

                empresaNombre:
                    empresaNombreActual,

                clienteId:
                    clienteSelect.value,

                clienteNombre:
                    clienteNombre,

                trabajoId:
                    trabajoSeleccionado.id,

                trabajoNombre:
                    trabajoNombreActual,

                usuarioId:
                    usuarioActual.uid,

                uid:
                    usuarioActual.uid,

                usuarioEmail:
                    usuarioActual.email ||
                    "",

                descripcion:
                    descripcion.value.trim(),

                observacion:
                    descripcion.value.trim(),

                nombreArchivo:
                    archivoSeleccionado.name,

                nombreArchivoStorage:
                    nombreArchivoOriginal,

                tipoArchivo:
                    archivoSeleccionado.type,

                tamanio:
                    archivoSeleccionado.size,

                rutaStorage:
                    rutaStorage,

                storagePath:
                    rutaStorage,

                url:
                    url,

                downloadURL:
                    url,

                creadoEn:
                    serverTimestamp(),

                fecha:
                    new Date().toISOString()

            };


            /*
                FIRESTORE

                colección:
                fotos
            */

            const documento =
                await addDoc(
                    collection(
                        db,
                        "fotos"
                    ),
                    datosFoto
                );


            console.log(
                "Foto guardada en Firestore:",
                documento.id
            );


            mostrarMensaje(
                "✅ Foto guardada correctamente en Firebase.",
                "exito"
            );


            limpiarArchivo();


            descripcion.value =
                "";


            await cargarFotos();

        }
        catch(error){

            console.error(
                "ERROR GUARDANDO FOTO:",
                error
            );


            let texto =
                "❌ No se pudo guardar la foto.";


            /*
                ERRORES ESPECÍFICOS DE STORAGE
            */

            if(
                error.code ===
                "storage/unauthorized"
            ){

                texto +=
                    " Firebase Storage rechazó la subida por permisos. Revisá las reglas de Storage.";

            }
            else if(
                error.code ===
                "storage/unauthenticated"
            ){

                texto +=
                    " Firebase no reconoce una sesión autenticada.";

            }
            else if(
                error.code ===
                "storage/quota-exceeded"
            ){

                texto +=
                    " Se alcanzó la cuota de almacenamiento.";

            }
            else if(
                error.code ===
                "storage/canceled"
            ){

                texto +=
                    " La subida fue cancelada.";

            }
            else if(
                error.code ===
                "storage/invalid-argument"
            ){

                texto +=
                    " El archivo seleccionado no es válido.";

            }
            else{

                texto +=
                    " " +
                    (
                        error.message ||
                        "Error desconocido."
                    );

            }


            mostrarMensaje(
                texto,
                "error"
            );

        }
        finally{

            btnGuardar.disabled =
                !archivoSeleccionado;


            btnCamara.disabled =
                false;


            btnGaleria.disabled =
                false;

        }

    }
);


/* =====================================================
   CARGAR FOTOS
===================================================== */

async function cargarFotos(){

    if(
        !clienteSelect.value ||
        !trabajoSelect.value
    ){

        limpiarFotos();

        return;

    }


    cargandoFotos.style.display =
        "block";


    sinSeleccion.style.display =
        "none";


    fotosGrid.innerHTML =
        "";


    try{

        /*
            Buscamos por empresaId + trabajoId.

            De esta manera todas las fotos
            quedan aisladas por empresa.
        */

        const q =
            query(
                collection(
                    db,
                    "fotos"
                ),
                where(
                    "empresaId",
                    "==",
                    empresaIdActual
                ),
                where(
                    "trabajoId",
                    "==",
                    trabajoSelect.value
                )
            );


        const snap =
            await getDocs(q);


        fotosActuales = [];


        snap.forEach(
            documento => {

                fotosActuales.push(
                    {
                        id:
                            documento.id,

                        ...documento.data()

                    }
                );

            }
        );


        /*
            Ordenar de más nueva
            a más antigua.
        */

        fotosActuales.sort(
            (a,b) => {

                const fechaA =
                    String(
                        a.fecha || ""
                    );

                const fechaB =
                    String(
                        b.fecha || ""
                    );

                return fechaB.localeCompare(
                    fechaA
                );

            }
        );


        mostrarFotos();

    }
    catch(error){

        console.error(
            "ERROR CARGANDO FOTOS:",
            error
        );


        let texto =
            "❌ No se pudieron cargar las fotos.";


        if(
            error.code ===
            "permission-denied"
        ){

            texto +=
                " Firestore rechazó la consulta por permisos.";

        }
        else{

            texto +=
                " " +
                (
                    error.message ||
                    ""
                );

        }


        mostrarMensaje(
            texto,
            "error"
        );

    }
    finally{

        cargandoFotos.style.display =
            "none";

    }

}


/* =====================================================
   MOSTRAR FOTOS
===================================================== */

function mostrarFotos(){

    fotosGrid.innerHTML =
        "";


    if(
        fotosActuales.length === 0
    ){

        fotosGrid.innerHTML = `

            <div
                class="vacio"
                style="grid-column:1/-1;"
            >
                📷 Este trabajo todavía no tiene fotos.
            </div>

        `;

        return;

    }


    fotosActuales.forEach(
        foto => {

            const card =
                document.createElement(
                    "div"
                );


            card.className =
                "foto-card";


            const fecha =
                foto.fecha
                ?
                new Date(
                    foto.fecha
                ).toLocaleString(
                    "es-AR"
                )
                :
                "Fecha no disponible";


            card.innerHTML = `

                <img
                    class="foto-imagen"
                    src="${escapeHTML(
                        foto.url ||
                        foto.downloadURL ||
                        ""
                    )}"
                    alt="Foto del trabajo"
                    loading="lazy"
                    data-ver="${escapeHTML(
                        foto.id
                    )}"
                >


                <div class="foto-info">

                    <div class="foto-descripcion">

                        ${
                            escapeHTML(
                                foto.descripcion ||
                                foto.observacion ||
                                "Sin descripción"
                            )
                        }

                    </div>


                    <div class="foto-fecha">

                        ${escapeHTML(
                            fecha
                        )}

                    </div>


                    <div class="foto-acciones">


                        <button
                            type="button"
                            class="btn-primary"
                            data-ver="${escapeHTML(
                                foto.id
                            )}"
                        >
                            👁️ Ver
                        </button>


                        <button
                            type="button"
                            class="btn-danger"
                            data-eliminar="${escapeHTML(
                                foto.id
                            )}"
                        >
                            🗑️ Eliminar
                        </button>


                    </div>

                </div>

            `;


            fotosGrid.appendChild(
                card
            );

        }
    );


    /*
        VER FOTO
    */

    fotosGrid
        .querySelectorAll(
            "[data-ver]"
        )
        .forEach(
            elemento => {

                elemento.addEventListener(
                    "click",
                    () => {

                        const id =
                            elemento.dataset.ver;


                        const foto =
                            fotosActuales.find(
                                f =>
                                    f.id === id
                            );


                        if(
                            foto &&
                            (
                                foto.url ||
                                foto.downloadURL
                            )
                        ){

                            window.open(
                                foto.url ||
                                foto.downloadURL,
                                "_blank"
                            );

                        }

                    }
                );

            }
        );


    /*
        ELIMINAR FOTO
    */

    fotosGrid
        .querySelectorAll(
            "[data-eliminar]"
        )
        .forEach(
            boton => {

                boton.addEventListener(
                    "click",
                    async () => {

                        const id =
                            boton.dataset.eliminar;


                        const foto =
                            fotosActuales.find(
                                f =>
                                    f.id === id
                            );


                        if(!foto){

                            return;

                        }


                        await eliminarFoto(
                            foto
                        );

                    }
                );

            }
        );

}


/* =====================================================
   ELIMINAR FOTO
===================================================== */

async function eliminarFoto(
    foto
){

    const confirmar =
        window.confirm(
            "¿Querés eliminar esta foto? Esta acción eliminará la imagen y sus datos de Firebase."
        );


    if(!confirmar){

        return;

    }


    try{

        mostrarMensaje(
            "🗑️ Eliminando foto...",
            "info"
        );


        /*
            ELIMINAR STORAGE
        */

        const ruta =
            foto.rutaStorage ||
            foto.storagePath;


        if(ruta){

            try{

                const storageRef =
                    ref(
                        almacenamiento,
                        ruta
                    );


                await deleteObject(
                    storageRef
                );


            }
            catch(errorStorage){

                /*
                    Si la imagen ya no existe
                    en Storage, continuamos
                    eliminando Firestore.
                */

                if(
                    errorStorage.code !==
                    "storage/object-not-found"
                ){

                    throw errorStorage;

                }

            }

        }


        /*
            ELIMINAR FIRESTORE
        */

        await deleteDoc(
            doc(
                db,
                "fotos",
                foto.id
            )
        );


        mostrarMensaje(
            "✅ Foto eliminada correctamente.",
            "exito"
        );


        await cargarFotos();

    }
    catch(error){

        console.error(
            "ERROR ELIMINANDO FOTO:",
            error
        );


        mostrarMensaje(
            "❌ No se pudo eliminar la foto: " +
            (
                error.message ||
                "Error desconocido."
            ),
            "error"
        );

    }

}
