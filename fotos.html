<!DOCTYPE html>
<html lang="es">

<head>

<meta charset="UTF-8">

<meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
>

<meta name="theme-color" content="#111827">

<meta
    name="description"
    content="GESBASE - Fotos de trabajos"
>

<title>Fotos - GESBASE</title>

<style>

* {
    box-sizing: border-box;
}

body {
    margin: 0;
    font-family: Arial, Helvetica, sans-serif;
    background: #f3f4f6;
    color: #111827;
}

header {
    background: #111827;
    color: white;
    padding: 18px;
    position: sticky;
    top: 0;
    z-index: 20;
}

.header-content {
    max-width: 900px;
    margin: auto;
}

.logo {
    font-size: 24px;
    font-weight: bold;
}

.subtitle {
    margin-top: 4px;
    font-size: 14px;
    color: #d1d5db;
}

.container {
    width: 100%;
    max-width: 900px;
    margin: auto;
    padding: 18px;
}

.card {
    background: white;
    border-radius: 16px;
    padding: 18px;
    margin-bottom: 18px;
    box-shadow: 0 4px 15px rgba(0,0,0,0.07);
}

h2 {
    margin-top: 0;
    font-size: 20px;
}

label {
    display: block;
    font-weight: bold;
    margin-top: 14px;
    margin-bottom: 6px;
}

select,
textarea,
input[type="text"] {
    width: 100%;
    padding: 13px;
    border: 1px solid #d1d5db;
    border-radius: 10px;
    font-size: 16px;
    background: white;
}

textarea {
    min-height: 90px;
    resize: vertical;
}

.photo-buttons {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 10px;
    margin-top: 15px;
}

.photo-button {
    display: flex;
    align-items: center;
    justify-content: center;
    text-align: center;
    min-height: 52px;
    border-radius: 10px;
    background: #2563eb;
    color: white;
    font-weight: bold;
    cursor: pointer;
    padding: 10px;
}

.photo-button.gallery {
    background: #4b5563;
}

.photo-button input {
    display: none;
}

.preview {
    display: none;
    margin-top: 15px;
}

.preview img {
    width: 100%;
    max-height: 400px;
    object-fit: contain;
    border-radius: 12px;
    background: #e5e7eb;
}

.save-button {
    width: 100%;
    border: none;
    border-radius: 10px;
    background: #16a34a;
    color: white;
    font-size: 17px;
    font-weight: bold;
    padding: 15px;
    margin-top: 15px;
    cursor: pointer;
}

.save-button:disabled {
    background: #9ca3af;
    cursor: not-allowed;
}

.status {
    margin-top: 12px;
    padding: 12px;
    border-radius: 10px;
    display: none;
    font-size: 14px;
}

.status.success {
    display: block;
    background: #dcfce7;
    color: #166534;
}

.status.error {
    display: block;
    background: #fee2e2;
    color: #991b1b;
}

.status.info {
    display: block;
    background: #dbeafe;
    color: #1e40af;
}

.photos-header {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 10px;
    margin-bottom: 15px;
}

.photos-header h2 {
    margin: 0;
}

.photo-count {
    background: #e5e7eb;
    border-radius: 20px;
    padding: 6px 10px;
    font-size: 13px;
    font-weight: bold;
}

.photos-grid {
    display: grid;
    grid-template-columns: repeat(2, 1fr);
    gap: 12px;
}

.photo-card {
    background: #f9fafb;
    border-radius: 12px;
    overflow: hidden;
    border: 1px solid #e5e7eb;
}

.photo-card img {
    width: 100%;
    height: 180px;
    object-fit: cover;
    display: block;
    cursor: pointer;
}

.photo-info {
    padding: 10px;
}

.photo-description {
    font-size: 14px;
    margin-bottom: 8px;
    word-break: break-word;
}

.photo-date {
    font-size: 11px;
    color: #6b7280;
    margin-bottom: 8px;
}

.delete-button {
    width: 100%;
    border: none;
    border-radius: 8px;
    padding: 9px;
    background: #dc2626;
    color: white;
    font-weight: bold;
    cursor: pointer;
}

.empty {
    text-align: center;
    padding: 30px 15px;
    color: #6b7280;
}

.loading {
    text-align: center;
    padding: 20px;
    color: #6b7280;
}

.back-button {
    display: inline-block;
    text-decoration: none;
    color: white;
    margin-top: 10px;
    font-size: 14px;
}

.user-info {
    font-size: 12px;
    color: #6b7280;
    margin-top: 8px;
}

.modal {
    display: none;
    position: fixed;
    z-index: 100;
    left: 0;
    top: 0;
    width: 100%;
    height: 100%;
    background: rgba(0,0,0,0.9);
    align-items: center;
    justify-content: center;
    padding: 20px;
}

.modal img {
    max-width: 100%;
    max-height: 90vh;
    object-fit: contain;
    border-radius: 10px;
}

.close-modal {
    position: absolute;
    right: 20px;
    top: 15px;
    color: white;
    font-size: 35px;
    cursor: pointer;
}

@media (min-width: 700px) {

    .photos-grid {
        grid-template-columns: repeat(3, 1fr);
    }

}

@media (max-width: 500px) {

    .photo-buttons {
        grid-template-columns: 1fr;
    }

}

</style>

</head>

<body>

<header>

    <div class="header-content">

        <div class="logo">
            GESBASE
        </div>

        <div class="subtitle">
            Gestión de fotos de trabajos
        </div>

        <a href="index.html" class="back-button">
            ← Volver al panel
        </a>

    </div>

</header>


<main class="container">


    <!-- SELECCIÓN -->

    <section class="card">

        <h2>
            📁 Seleccionar trabajo
        </h2>

        <label for="clienteSelect">
            Cliente
        </label>

        <select id="clienteSelect">

            <option value="">
                Cargando clientes...
            </option>

        </select>


        <label for="trabajoSelect">
            Trabajo
        </label>

        <select id="trabajoSelect">

            <option value="">
                Seleccioná primero un cliente
            </option>

        </select>

        <div id="userInfo" class="user-info"></div>

    </section>


    <!-- CARGAR FOTO -->

    <section class="card">

        <h2>
            📷 Nueva foto
        </h2>

        <label>
            Imagen
        </label>

        <div class="photo-buttons">

            <!-- CÁMARA -->

            <label class="photo-button">

                📷 Tomar foto

                <input
                    type="file"
                    id="cameraInput"
                    accept="image/*"
                    capture="environment"
                >

            </label>


            <!-- GALERÍA -->

            <label class="photo-button gallery">

                🖼️ Galería

                <input
                    type="file"
                    id="galleryInput"
                    accept="image/*"
                >

            </label>

        </div>


        <div id="preview" class="preview">

            <img
                id="previewImage"
                alt="Vista previa"
            >

        </div>


        <label for="descripcion">
            Descripción
        </label>

        <textarea
            id="descripcion"
            placeholder="Ej.: Antes de comenzar, pared con humedad..."
        ></textarea>


        <button
            id="guardarBtn"
            class="save-button"
            disabled
        >
            Guardar foto
        </button>


        <div
            id="status"
            class="status"
        ></div>

    </section>


    <!-- FOTOS DEL TRABAJO -->

    <section class="card">

        <div class="photos-header">

            <h2>
                📸 Fotos del trabajo
            </h2>

            <span
                id="photoCount"
                class="photo-count"
            >
                0
            </span>

        </div>


        <div
            id="photosContainer"
            class="photos-grid"
        >

            <div class="empty">
                Seleccioná un trabajo para ver sus fotos.
            </div>

        </div>

    </section>


</main>


<!-- MODAL -->

<div
    id="imageModal"
    class="modal"
>

    <span
        id="closeModal"
        class="close-modal"
    >
        ×
    </span>

    <img
        id="modalImage"
        alt="Foto ampliada"
    >

</div>


<script type="module">

import {
    initializeApp
} from "https://www.gstatic.com/firebasejs/12.18.0/firebase-app.js";


import {
    getAuth,
    onAuthStateChanged
} from "https://www.gstatic.com/firebasejs/12.18.0/firebase-auth.js";


import {
    getFirestore,
    collection,
    addDoc,
    getDocs,
    query,
    where,
    orderBy,
    deleteDoc,
    doc,
    serverTimestamp
} from "https://www.gstatic.com/firebasejs/12.18.0/firebase-firestore.js";


import {
    getStorage,
    ref,
    uploadBytes,
    getDownloadURL,
    deleteObject
} from "https://www.gstatic.com/firebasejs/12.18.0/firebase-storage.js";



/* =========================================================
   CONFIGURACIÓN FIREBASE
   ========================================================= */

const firebaseConfig = {

    apiKey: "TU_API_KEY",

    authDomain: "TU_PROYECTO.firebaseapp.com",

    projectId: "TU_PROJECT_ID",

    storageBucket: "TU_PROYECTO.firebasestorage.app",

    messagingSenderId: "TU_MESSAGING_SENDER_ID",

    appId: "TU_APP_ID"

};


/* =========================================================
   INICIALIZAR FIREBASE
   ========================================================= */

const app = initializeApp(firebaseConfig);

const auth = getAuth(app);

const db = getFirestore(app);

const storage = getStorage(app);



/* =========================================================
   ELEMENTOS
   ========================================================= */

const clienteSelect =
    document.getElementById("clienteSelect");

const trabajoSelect =
    document.getElementById("trabajoSelect");

const cameraInput =
    document.getElementById("cameraInput");

const galleryInput =
    document.getElementById("galleryInput");

const preview =
    document.getElementById("preview");

const previewImage =
    document.getElementById("previewImage");

const descripcion =
    document.getElementById("descripcion");

const guardarBtn =
    document.getElementById("guardarBtn");

const status =
    document.getElementById("status");

const photosContainer =
    document.getElementById("photosContainer");

const photoCount =
    document.getElementById("photoCount");

const userInfo =
    document.getElementById("userInfo");

const imageModal =
    document.getElementById("imageModal");

const modalImage =
    document.getElementById("modalImage");

const closeModal =
    document.getElementById("closeModal");



/* =========================================================
   VARIABLES
   ========================================================= */

let usuarioActual = null;

let archivoSeleccionado = null;

let clientes = [];

let trabajos = [];

let fotosActuales = [];



/* =========================================================
   UTILIDADES
   ========================================================= */

function mostrarStatus(mensaje, tipo = "info") {

    status.textContent = mensaje;

    status.className = "status " + tipo;

}


function ocultarStatus() {

    status.textContent = "";

    status.className = "status";

}


function escaparHTML(texto) {

    if (texto === null || texto === undefined) {
        return "";
    }

    return String(texto)
        .replace(/&/g, "&amp;")
        .replace(/</g, "&lt;")
        .replace(/>/g, "&gt;")
        .replace(/"/g, "&quot;")
        .replace(/'/g, "&#039;");

}


/* =========================================================
   AUTENTICACIÓN
   ========================================================= */

onAuthStateChanged(auth, async (user) => {

    if (!user) {

        window.location.href = "login.html";

        return;

    }


    usuarioActual = user;


    userInfo.textContent =
        "Usuario: " +
        (user.email || user.uid);


    await cargarClientes();

});



/* =========================================================
   CLIENTES
   ========================================================= */

async function cargarClientes() {

    clienteSelect.innerHTML =
        '<option value="">Cargando clientes...</option>';

    try {

        const q = query(
            collection(db, "clientes"),
            where("usuarioId", "==", usuarioActual.uid)
        );


        const snapshot = await getDocs(q);


        clientes = [];


        snapshot.forEach((documento) => {

            clientes.push({
                id: documento.id,
                ...documento.data()
            });

        });


        clientes.sort((a, b) => {

            const nombreA =
                String(
                    a.nombre ||
                    a.razonSocial ||
                    a.empresa ||
                    ""
                ).toLowerCase();

            const nombreB =
                String(
                    b.nombre ||
                    b.razonSocial ||
                    b.empresa ||
                    ""
                ).toLowerCase();

            return nombreA.localeCompare(nombreB);

        });


        clienteSelect.innerHTML =
            '<option value="">Seleccionar cliente</option>';


        clientes.forEach((cliente) => {

            const option =
                document.createElement("option");

            option.value = cliente.id;

            option.textContent =
                cliente.nombre ||
                cliente.razonSocial ||
                cliente.empresa ||
                cliente.nombreCompleto ||
                "Cliente sin nombre";

            clienteSelect.appendChild(option);

        });


    } catch (error) {

        console.error(
            "Error cargando clientes:",
            error
        );


        clienteSelect.innerHTML =
            '<option value="">No se pudieron cargar los clientes</option>';


        mostrarStatus(
            "No se pudieron cargar los clientes: " +
            error.message,
            "error"
        );

    }

}



/* =========================================================
   CAMBIO DE CLIENTE
   ========================================================= */

clienteSelect.addEventListener(
    "change",
    async () => {

        const clienteId =
            clienteSelect.value;


        trabajoSelect.innerHTML =
            '<option value="">Cargando trabajos...</option>';


        photosContainer.innerHTML =
            '<div class="empty">Seleccioná un trabajo.</div>';


        photoCount.textContent = "0";


        if (!clienteId) {

            trabajoSelect.innerHTML =
                '<option value="">Seleccioná primero un cliente</option>';

            return;

        }


        await cargarTrabajos(clienteId);

    }
);



/* =========================================================
   TRABAJOS
   ========================================================= */

async function cargarTrabajos(clienteId) {

    try {

        const q = query(
            collection(db, "trabajos"),
            where("usuarioId", "==", usuarioActual.uid),
            where("clienteId", "==", clienteId)
        );


        const snapshot = await getDocs(q);


        trabajos = [];


        snapshot.forEach((documento) => {

            trabajos.push({
                id: documento.id,
                ...documento.data()
            });

        });


        trabajoSelect.innerHTML =
            '<option value="">Seleccionar trabajo</option>';


        trabajos.forEach((trabajo) => {

            const option =
                document.createElement("option");

            option.value = trabajo.id;


            const nombre =
                trabajo.titulo ||
                trabajo.nombre ||
                trabajo.descripcion ||
                trabajo.trabajo ||
                "Trabajo";


            option.textContent =
                nombre;


            trabajoSelect.appendChild(option);

        });


        if (trabajos.length === 0) {

            trabajoSelect.innerHTML =
                '<option value="">No hay trabajos para este cliente</option>';

        }

    } catch (error) {

        console.error(
            "Error cargando trabajos:",
            error
        );


        trabajoSelect.innerHTML =
            '<option value="">Error cargando trabajos</option>';


        mostrarStatus(
            "No se pudieron cargar los trabajos: " +
            error.message,
            "error"
        );

    }

}



/* =========================================================
   CAMBIO DE TRABAJO
   ========================================================= */

trabajoSelect.addEventListener(
    "change",
    async () => {

        const trabajoId =
            trabajoSelect.value;


        if (!trabajoId) {

            photosContainer.innerHTML =
                '<div class="empty">Seleccioná un trabajo para ver sus fotos.</div>';

            photoCount.textContent = "0";

            return;

        }


        await cargarFotos(trabajoId);

    }
);



/* =========================================================
   SELECCIÓN DE IMAGEN
   ========================================================= */

cameraInput.addEventListener(
    "change",
    manejarArchivo
);


galleryInput.addEventListener(
    "change",
    manejarArchivo
);


function manejarArchivo(event) {

    const archivo =
        event.target.files[0];


    if (!archivo) {

        return;

    }


    if (!archivo.type.startsWith("image/")) {

        mostrarStatus(
            "El archivo seleccionado no es una imagen.",
            "error"
        );

        return;

    }


    archivoSeleccionado =
        archivo;


    const url =
        URL.createObjectURL(archivo);


    previewImage.src =
        url;


    preview.style.display =
        "block";


    guardarBtn.disabled =
        false;


    ocultarStatus();

}



/* =========================================================
   GUARDAR FOTO
   ========================================================= */

guardarBtn.addEventListener(
    "click",
    guardarFoto
);


async function guardarFoto() {

    if (!usuarioActual) {

        mostrarStatus(
            "La sesión no está disponible.",
            "error"
        );

        return;

    }


    const clienteId =
        clienteSelect.value;


    const trabajoId =
        trabajoSelect.value;


    if (!clienteId) {

        mostrarStatus(
            "Seleccioná un cliente.",
            "error"
        );

        return;

    }


    if (!trabajoId) {

        mostrarStatus(
            "Seleccioná un trabajo.",
            "error"
        );

        return;

    }


    if (!archivoSeleccionado) {

        mostrarStatus(
            "Seleccioná o tomá una foto.",
            "error"
        );

        return;

    }


    guardarBtn.disabled =
        true;


    mostrarStatus(
        "Subiendo foto...",
        "info"
    );


    try {

        const extension =
            obtenerExtension(
                archivoSeleccionado.name
            );


        const nombreArchivo =
            Date.now() +
            "_" +
            Math.random()
                .toString(36)
                .substring(2, 10) +
            "." +
            extension;


        /*
         * Estructura:
         *
         * fotos/
         *   usuarioId/
         *      trabajoId/
         *          archivo.jpg
         */

        const ruta =
            "fotos/" +
            usuarioActual.uid +
            "/" +
            trabajoId +
            "/" +
            nombreArchivo;


        const storageRef =
            ref(storage, ruta);


        await uploadBytes(
            storageRef,
            archivoSeleccionado,
            {
                contentType:
                    archivoSeleccionado.type
            }
        );


        const url =
            await getDownloadURL(
                storageRef
            );


        await addDoc(
            collection(db, "fotos"),
            {

                usuarioId:
                    usuarioActual.uid,

                empresaId:
                    usuarioActual.uid,

                clienteId:
                    clienteId,

                trabajoId:
                    trabajoId,

                nombreArchivo:
                    nombreArchivo,

                rutaStorage:
                    ruta,

                url:
                    url,

                descripcion:
                    descripcion.value.trim(),

                tipo:
                    archivoSeleccionado.type,

                nombreOriginal:
                    archivoSeleccionado.name,

                fecha:
                    serverTimestamp(),

                creadoPor:
                    usuarioActual.email ||
                    ""

            }
        );


        mostrarStatus(
            "Foto guardada correctamente.",
            "success"
        );


        archivoSeleccionado =
            null;


        cameraInput.value =
            "";


        galleryInput.value =
            "";


        descripcion.value =
            "";


        preview.style.display =
            "none";


        previewImage.src =
            "";


        guardarBtn.disabled =
            true;


        await cargarFotos(trabajoId);


    } catch (error) {

        console.error(
            "Error guardando foto:",
            error
        );


        mostrarStatus(
            "No se pudo guardar la foto: " +
            error.message,
            "error"
        );


        guardarBtn.disabled =
            false;

    }

}



/* =========================================================
   EXTENSIÓN
   ========================================================= */

function obtenerExtension(nombre) {

    const partes =
        nombre.split(".");


    if (partes.length < 2) {

        return "jpg";

    }


    return partes
        .pop()
        .toLowerCase();

}



/* =========================================================
   CARGAR FOTOS
   ========================================================= */

async function cargarFotos(trabajoId) {

    photosContainer.innerHTML =
        '<div class="loading">Cargando fotos...</div>';


    try {

        const q = query(
            collection(db, "fotos"),
            where("usuarioId", "==", usuarioActual.uid),
            where("trabajoId", "==", trabajoId)
        );


        const snapshot =
            await getDocs(q);


        fotosActuales = [];


        snapshot.forEach((documento) => {

            fotosActuales.push({
                id: documento.id,
                ...documento.data()
            });

        });


        fotosActuales.sort((a, b) => {

            const fechaA =
                a.fecha?.seconds || 0;

            const fechaB =
                b.fecha?.seconds || 0;

            return fechaB - fechaA;

        });


        photoCount.textContent =
            fotosActuales.length;


        if (fotosActuales.length === 0) {

            photosContainer.innerHTML =
                '<div class="empty">Todavía no hay fotos para este trabajo.</div>';

            return;

        }


        photosContainer.innerHTML = "";


        fotosActuales.forEach((foto) => {

            const card =
                document.createElement("div");

            card.className =
                "photo-card";


            const fecha =
                formatearFecha(
                    foto.fecha
                );


            card.innerHTML = `

                <img
                    src="${escaparHTML(foto.url)}"
                    alt="Foto del trabajo"
                    data-url="${escaparHTML(foto.url)}"
                >

                <div class="photo-info">

                    <div class="photo-description">
                        ${
                            escaparHTML(
                                foto.descripcion ||
                                "Sin descripción"
                            )
                        }
                    </div>

                    <div class="photo-date">
                        ${fecha}
                    </div>

                    <button
                        class="delete-button"
                        data-id="${foto.id}"
                    >
                        🗑️ Eliminar
                    </button>

                </div>

            `;


            const imagen =
                card.querySelector("img");


            imagen.addEventListener(
                "click",
                () => {

                    abrirImagen(
                        foto.url
                    );

                }
            );


            const eliminar =
                card.querySelector(
                    ".delete-button"
                );


            eliminar.addEventListener(
                "click",
                () => {

                    eliminarFoto(
                        foto
                    );

                }
            );


            photosContainer.appendChild(
                card
            );

        });


    } catch (error) {

        console.error(
            "Error cargando fotos:",
            error
        );


        photosContainer.innerHTML =
            '<div class="empty">No se pudieron cargar las fotos.</div>';


        mostrarStatus(
            "No se pudieron cargar las fotos: " +
            error.message,
            "error"
        );

    }

}



/* =========================================================
   FECHA
   ========================================================= */

function formatearFecha(timestamp) {

    if (!timestamp) {

        return "Fecha no disponible";

    }


    try {

        const fecha =
            timestamp.toDate();


        return fecha.toLocaleString(
            "es-AR",
            {
                day: "2-digit",
                month: "2-digit",
                year: "numeric",
                hour: "2-digit",
                minute: "2-digit"
            }
        );

    } catch {

        return "Fecha no disponible";

    }

}



/* =========================================================
   ELIMINAR FOTO
   ========================================================= */

async function eliminarFoto(foto) {

    const confirmar =
        confirm(
            "¿Querés eliminar esta foto?"
        );


    if (!confirmar) {

        return;

    }


    try {

        mostrarStatus(
            "Eliminando foto...",
            "info"
        );


        if (foto.rutaStorage) {

            const storageRef =
                ref(
                    storage,
                    foto.rutaStorage
                );


            try {

                await deleteObject(
                    storageRef
                );

            } catch (storageError) {

                console.warn(
                    "No se pudo eliminar el archivo de Storage:",
                    storageError
                );

            }

        }


        await deleteDoc(
            doc(
                db,
                "fotos",
                foto.id
            )
        );


        mostrarStatus(
            "Foto eliminada correctamente.",
            "success"
        );


        await cargarFotos(
            trabajoSelect.value
        );


    } catch (error) {

        console.error(
            "Error eliminando foto:",
            error
        );


        mostrarStatus(
            "No se pudo eliminar la foto: " +
            error.message,
            "error"
        );

    }

}
