/* =====================================================
   FIREBASE
===================================================== */

import {
    auth,
    db,
    almacenamiento
} from "./Js/firebase.js";

import {
    onAuthStateChanged
} from "https://www.gstatic.com/firebasejs/12.18.0/firebase-auth.js";

import {
    collection,
    getDocs,
    getDoc,
    doc,
    addDoc,
    query,
    where,
    deleteDoc,
    serverTimestamp
} from "https://www.gstatic.com/firebasejs/12.18.0/firebase-firestore.js";

import {
    ref,
    uploadBytes,
    getDownloadURL,
    deleteObject
} from "https://www.gstatic.com/firebasejs/12.18.0/firebase-storage.js";


/* =====================================================
   VARIABLES
===================================================== */

let usuarioActual = null;

let empresaIdActual = "";

let empresaNombreActual = "";

let empresaDatos = {};

let clientes = [];

let trabajos = [];

let fotos = [];

let archivoSeleccionado = null;


/* =====================================================
   ELEMENTOS
===================================================== */

const clienteSelect =
    document.getElementById("cliente");

const trabajoSelect =
    document.getElementById("trabajo");

const fotoCamara =
    document.getElementById("fotoCamara");

const fotoGaleria =
    document.getElementById("fotoGaleria");

const descripcion =
    document.getElementById("descripcion");

const preview =
    document.getElementById("preview");

const previewImagen =
    document.getElementById("previewImagen");

const btnGuardar =
    document.getElementById("btnGuardar");

const btnLimpiar =
    document.getElementById("btnLimpiar");

const listaFotos =
    document.getElementById("listaFotos");

const mensaje =
    document.getElementById("mensaje");


/* =====================================================
   MENSAJES
===================================================== */

function mostrarMensaje(texto,tipo){

    mensaje.textContent =
        texto;

    mensaje.className =
        "mensaje " + tipo;

    window.scrollTo({
        top:0,
        behavior:"smooth"
    });

}

function ocultarMensaje(){

    mensaje.textContent = "";

    mensaje.className =
        "mensaje";

}


/* =====================================================
   UTILIDADES
===================================================== */

function limpiarId(valor){

    if(
        valor === undefined ||
        valor === null
    ){
        return "";
    }

    return String(valor).trim();

}


function nombreCliente(cliente){

    if(!cliente){
        return "Cliente";
    }

    if(cliente.nombreCompleto){
        return String(
            cliente.nombreCompleto
        );
    }

    if(
        cliente.nombre ||
        cliente.apellido
    ){

        return (
            String(cliente.nombre || "") +
            " " +
            String(cliente.apellido || "")
        ).trim();

    }

    return String(
        cliente.razonSocial ||
        cliente.razon_social ||
        cliente.empresa ||
        cliente.nombreCliente ||
        "Cliente"
    );

}


function nombreTrabajo(trabajo){

    if(!trabajo){
        return "Trabajo";
    }

    return String(
        trabajo.nombreTrabajo ||
        trabajo.nombre ||
        trabajo.titulo ||
        trabajo.descripcion ||
        "Trabajo"
    );

}


function fechaFormato(valor){

    if(!valor){
        return "";
    }

    try{

        if(
            valor.toDate
        ){

            return valor
                .toDate()
                .toLocaleString(
                    "es-AR"
                );

        }

        return new Date(valor)
            .toLocaleString(
                "es-AR"
            );

    }
    catch(error){

        return "";

    }

}


/* =====================================================
   OBTENER EMPRESA
===================================================== */

async function obtenerEmpresa(){

    const usuarioRef =
        doc(
            db,
            "usuarios",
            usuarioActual.uid
        );

    const usuarioSnap =
        await getDoc(
            usuarioRef
        );

    if(!usuarioSnap.exists()){

        throw new Error(
            "No existe el usuario en Firestore."
        );

    }

    const datosUsuario =
        usuarioSnap.data();

    const empresaId =
        datosUsuario.empresaId ||
        datosUsuario.idEmpresa ||
        datosUsuario.companyId;

    if(!empresaId){

        throw new Error(
            "El usuario no tiene empresaId asociado."
        );

    }

    empresaIdActual =
        limpiarId(
            empresaId
        );

    empresaDatos =
        {
            ...datosUsuario
        };

    const empresaRef =
        doc(
            db,
            "empresas",
            empresaIdActual
        );

    const empresaSnap =
        await getDoc(
            empresaRef
        );

    if(empresaSnap.exists()){

        empresaDatos =
            {
                ...empresaDatos,
                ...empresaSnap.data()
            };

    }

    empresaNombreActual =
        empresaDatos.nombreEmpresa ||
        empresaDatos.nombre ||
        empresaDatos.razonSocial ||
        datosUsuario.nombreEmpresa ||
        "GESBASE";

    document.getElementById(
        "empresaUsuario"
    ).textContent =
        empresaNombreActual;

    document.getElementById(
        "idEmpresaUsuario"
    ).textContent =
        empresaIdActual;

}


/* =====================================================
   CARGAR CLIENTES
===================================================== */

async function cargarClientes(){

    const mapa =
        new Map();

    try{

        const q =
            query(
                collection(
                    db,
                    "clientes"
                ),
                where(
                    "empresaId",
                    "==",
                    empresaIdActual
                )
            );

        const snap =
            await getDocs(q);

        snap.forEach(
            d => {

                mapa.set(
                    d.id,
                    {
                        id:d.id,
                        ...d.data()
                    }
                );

            }
        );

    }
    catch(error){

        console.warn(
            "Error clientes empresa:",
            error
        );

    }


    try{

        const q =
            query(
                collection(
                    db,
                    "clientes"
                ),
                where(
                    "uid",
                    "==",
                    usuarioActual.uid
                )
            );

        const snap =
            await getDocs(q);

        snap.forEach(
            d => {

                if(!mapa.has(d.id)){

                    mapa.set(
                        d.id,
                        {
                            id:d.id,
                            ...d.data()
                        }
                    );

                }

            }
        );

    }
    catch(error){

        console.warn(
            "Error clientes uid:",
            error
        );

    }


    clientes =
        Array.from(
            mapa.values()
        );

    clientes.sort(
        (a,b) =>
            nombreCliente(a)
                .localeCompare(
                    nombreCliente(b),
                    "es"
                )
    );


    clienteSelect.innerHTML = "";

    const inicial =
        document.createElement(
            "option"
        );

    inicial.value = "";

    inicial.textContent =
        clientes.length
        ?
        "Seleccioná un cliente"
        :
        "No hay clientes registrados";

    clienteSelect.appendChild(
        inicial
    );


    clientes.forEach(
        cliente => {

            const option =
                document.createElement(
                    "option"
                );

            option.value =
                cliente.id;

            option.textContent =
                nombreCliente(cliente);

            clienteSelect.appendChild(
                option
            );

        }
    );

}


/* =====================================================
   CARGAR TRABAJOS
===================================================== */

async function cargarTrabajos(){

    const mapa =
        new Map();

    try{

        const q =
            query(
                collection(
                    db,
                    "trabajos"
                ),
                where(
                    "empresaId",
                    "==",
                    empresaIdActual
                )
            );

        const snap =
            await getDocs(q);

        snap.forEach(
            d => {

                mapa.set(
                    d.id,
                    {
                        id:d.id,
                        ...d.data()
                    }
                );

            }
        );

    }
    catch(error){

        console.warn(
            "Error trabajos empresa:",
            error
        );

    }


    try{

        const q =
            query(
                collection(
                    db,
                    "trabajos"
                ),
                where(
                    "usuarioId",
                    "==",
                    usuarioActual.uid
                )
            );

        const snap =
            await getDocs(q);

        snap.forEach(
            d => {

                if(!mapa.has(d.id)){

                    mapa.set(
                        d.id,
                        {
                            id:d.id,
                            ...d.data()
                        }
                    );

                }

            }
        );

    }
    catch(error){

        console.warn(
            "Error trabajos usuario:",
            error
        );

    }


    trabajos =
        Array.from(
            mapa.values()
        );

}


/* =====================================================
   MOSTRAR TRABAJOS
===================================================== */

function mostrarTrabajos(clienteId){

    trabajoSelect.innerHTML = "";

    const inicial =
        document.createElement(
            "option"
        );

    inicial.value = "";

    if(!clienteId){

        inicial.textContent =
            "Seleccioná primero un cliente";

        trabajoSelect.disabled =
            true;

        trabajoSelect.appendChild(
            inicial
        );

        return;

    }


    const trabajosCliente =
        trabajos.filter(
            trabajo => {

                return (
                    limpiarId(
                        trabajo.clienteId
                    ) ===
                    limpiarId(
                        clienteId
                    )
                );

            }
        );


    inicial.textContent =
        trabajosCliente.length
        ?
        "Seleccioná un trabajo"
        :
        "No hay trabajos para este cliente";

    trabajoSelect.appendChild(
        inicial
    );


    trabajosCliente.forEach(
        trabajo => {

            const option =
                document.createElement(
                    "option"
                );

            option.value =
                trabajo.id;

            option.textContent =
                nombreTrabajo(
                    trabajo
                );

            trabajoSelect.appendChild(
                option
            );

        }
    );


    trabajoSelect.disabled =
        trabajosCliente.length === 0;

}


/* =====================================================
   CLIENTE
===================================================== */

clienteSelect.addEventListener(
    "change",
    async () => {

        mostrarTrabajos(
            clienteSelect.value
        );

        limpiarSeleccionFoto();

        document.getElementById(
            "infoTrabajo"
        ).style.display =
            "none";

        listaFotos.innerHTML = `

            <div class="vacio">

                Seleccioná un trabajo.

            </div>

        `;

    }
);


/* =====================================================
   TRABAJO
===================================================== */

trabajoSelect.addEventListener(
    "change",
    async () => {

        const trabajoId =
            limpiarId(
                trabajoSelect.value
            );

        if(!trabajoId){

            document.getElementById(
                "infoTrabajo"
            ).style.display =
                "none";

            listaFotos.innerHTML = `

                <div class="vacio">

                    Seleccioná un trabajo.

                </div>

            `;

            return;

        }


        const trabajo =
            trabajos.find(
                item =>
                    limpiarId(
                        item.id
                    ) ===
                    trabajoId
            );


        if(!trabajo){

            return;

        }


        const cliente =
            clientes.find(
                item =>
                    limpiarId(
                        item.id
                    ) ===
                    limpiarId(
                        clienteSelect.value
                    )
            );


        const info =
            document.getElementById(
                "infoTrabajo"
            );


        info.innerHTML = `

            <strong>Trabajo seleccionado</strong><br>

            ${escapeHTML(
                nombreTrabajo(trabajo)
            )}

            <br>

            Cliente:
            ${escapeHTML(
                nombreCliente(cliente)
            )}

            <br>

            ID del trabajo:
            ${escapeHTML(
                trabajo.id
            )}

        `;

        info.style.display =
            "block";


        await cargarFotos();

    }
);


/* =====================================================
   ESCAPE HTML
===================================================== */

function escapeHTML(valor){

    return String(valor ?? "")
        .replace(/&/g,"&amp;")
        .replace(/</g,"&lt;")
        .replace(/>/g,"&gt;")
        .replace(/"/g,"&quot;")
        .replace(/'/g,"&#039;");

}


/* =====================================================
   SELECCIONAR FOTO
===================================================== */

fotoCamara.addEventListener(
    "change",
    () => {

        if(
            fotoCamara.files &&
            fotoCamara.files[0]
        ){

            seleccionarArchivo(
                fotoCamara.files[0]
            );

            fotoGaleria.value =
                "";

        }

    }
);


fotoGaleria.addEventListener(
    "change",
    () => {

        if(
            fotoGaleria.files &&
            fotoGaleria.files[0]
        ){

            seleccionarArchivo(
                fotoGaleria.files[0]
            );

            fotoCamara.value =
                "";

        }

    }
);


/* =====================================================
   ARCHIVO
===================================================== */

function seleccionarArchivo(archivo){

    if(
        !archivo.type.startsWith(
            "image/"
        )
    ){

        mostrarMensaje(
            "Seleccioná una imagen.",
            "error"
        );

        return;

    }


    archivoSeleccionado =
        archivo;


    const reader =
        new FileReader();


    reader.onload =
        evento => {

            previewImagen.src =
                evento.target.result;

            preview.style.display =
                "block";

        };


    reader.readAsDataURL(
        archivo
    );

}


/* =====================================================
   LIMPIAR FOTO
===================================================== */

function limpiarSeleccionFoto(){

    archivoSeleccionado =
        null;

    fotoCamara.value =
        "";

    fotoGaleria.value =
        "";

    descripcion.value =
        "";

    previewImagen.src =
        "";

    preview.style.display =
        "none";

}


/* =====================================================
   BOTÓN LIMPIAR
===================================================== */

btnLimpiar.addEventListener(
    "click",
    () => {

        limpiarSeleccionFoto();

        ocultarMensaje();

    }
);


/* =====================================================
   GUARDAR FOTO
===================================================== */

btnGuardar.addEventListener(
    "click",
    async () => {

        ocultarMensaje();


        if(!usuarioActual){

            mostrarMensaje(
                "No hay una sesión iniciada.",
                "error"
            );

            return;

        }


        if(!empresaIdActual){

            mostrarMensaje(
                "No se encontró la empresa del usuario.",
                "error"
            );

            return;

        }


        if(!clienteSelect.value){

            mostrarMensaje(
                "Seleccioná un cliente.",
                "error"
            );

            return;

        }


        if(!trabajoSelect.value){

            mostrarMensaje(
                "Seleccioná un trabajo.",
                "error"
            );

            return;

        }


        if(!archivoSeleccionado){

            mostrarMensaje(
                "Tomá una foto o elegí una imagen de la galería.",
                "error"
            );

            return;

        }


        btnGuardar.disabled =
            true;


        try{

            const clienteId =
                limpiarId(
                    clienteSelect.value
                );

            const trabajoId =
                limpiarId(
                    trabajoSelect.value
                );


            /*
             * RUTA DE STORAGE
             *
             * fotos/
             *   empresaId/
             *     clienteId/
             *       trabajoId/
             *         usuarioId/
             *           archivo.jpg
             */

            const nombreArchivo =
                Date.now() +
                "_" +
                Math.random()
                    .toString(36)
                    .substring(2,10) +
                "_" +
                archivoSeleccionado.name
                    .replace(
                        /[^a-zA-Z0-9._-]/g,
                        "_"
                    );


            const storagePath =
                "fotos/" +
                empresaIdActual +
                "/" +
                clienteId +
                "/" +
                trabajoId +
                "/" +
                usuarioActual.uid +
                "/" +
                nombreArchivo;


            const storageRef =
                ref(
                    almacenamiento,
                    storagePath
                );


            mostrarMensaje(
                "⏳ Subiendo foto a Firebase...",
                "info"
            );


            const snapshot =
                await uploadBytes(
                    storageRef,
                    archivoSeleccionado,
                    {
                        contentType:
                            archivoSeleccionado.type
                    }
                );


            const fotoURL =
                await getDownloadURL(
                    snapshot.ref
                );


            mostrarMensaje(
                "⏳ Guardando información en Firestore...",
                "info"
            );


            const cliente =
                clientes.find(
                    item =>
                        limpiarId(item.id) ===
                        clienteId
                );


            const trabajo =
                trabajos.find(
                    item =>
                        limpiarId(item.id) ===
                        trabajoId
                );


            const datosFoto = {

                empresaId:
                    empresaIdActual,

                empresaNombre:
                    empresaNombreActual,

                clienteId:
                    clienteId,

                clienteNombre:
                    cliente
                    ?
                    nombreCliente(cliente)
                    :
                    "Cliente",

                trabajoId:
                    trabajoId,

                trabajoNombre:
                    trabajo
                    ?
                    nombreTrabajo(trabajo)
                    :
                    "Trabajo",

                usuarioId:
                    usuarioActual.uid,

                usuarioEmail:
                    usuarioActual.email ||
                    "",

                storagePath:
                    storagePath,

                fotoUrl:
                    fotoURL,

                url:
                    fotoURL,

                nombreArchivo:
                    nombreArchivo,

                nombreOriginal:
                    archivoSeleccionado.name,

                descripcion:
                    descripcion.value.trim(),

                tipo:
                    archivoSeleccionado.type,

                tamaño:
                    archivoSeleccionado.size,

                creadoEn:
                    serverTimestamp()

            };


            await addDoc(
                collection(
                    db,
                    "fotos"
                ),
                datosFoto
            );


            limpiarSeleccionFoto();


            mostrarMensaje(
                "✅ Foto guardada correctamente en Firebase.",
                "exito"
            );


            await cargarFotos();

        }
        catch(error){

            console.error(
                "ERROR GUARDANDO FOTO:",
                error
            );


            let texto =
                error.message ||
                "Error desconocido.";


            if(
                error.code ===
                "storage/unauthorized"
            ){

                texto =
                    "Firebase Storage rechazó la subida. Revisá las reglas de Storage.";

            }
            else if(
                error.code ===
                "storage/object-not-found"
            ){

                texto =
                    "Firebase Storage no encontró el archivo.";

            }
            else if(
                error.code ===
                "storage/quota-exceeded"
            ){

                texto =
                    "Se alcanzó la cuota de almacenamiento de Firebase.";

            }


            mostrarMensaje(
                "❌ No se pudo guardar la foto: " +
                texto,
                "error"
            );

        }
        finally{

            btnGuardar.disabled =
                false;

        }

    }
);


/* =====================================================
   CARGAR FOTOS
===================================================== */

async function cargarFotos(){

    const clienteId =
        limpiarId(
            clienteSelect.value
        );

    const trabajoId =
        limpiarId(
            trabajoSelect.value
        );


    if(
        !clienteId ||
        !trabajoId
    ){

        return;

    }


    listaFotos.innerHTML = `

        <div class="cargando">

            ⏳ Cargando fotos...

        </div>

    `;


    fotos = [];


    try{

        const q =
            query(
                collection(
                    db,
                    "fotos"
                ),
                where(
                    "empresaId",
                    "==",
                    empresaIdActual
                ),
                where(
                    "clienteId",
                    "==",
                    clienteId
                ),
                where(
                    "trabajoId",
                    "==",
                    trabajoId
                )
            );


        const snap =
            await getDocs(q);


        snap.forEach(
            d => {

                fotos.push(
                    {
                        id:d.id,
                        ...d.data()
                    }
                );

            }
        );


        fotos.sort(
            (a,b) => {

                const fechaA =
                    a.creadoEn?.seconds ||
                    0;

                const fechaB =
                    b.creadoEn?.seconds ||
                    0;

                return fechaB - fechaA;

            }
        );


        mostrarFotos();

    }
    catch(error){

        console.error(
            "ERROR CARGANDO FOTOS:",
            error
        );


        listaFotos.innerHTML = `

            <div class="vacio">

                ❌ No se pudieron cargar las fotos.<br><br>

                ${escapeHTML(
                    error.message
                )}

            </div>

        `;

    }

}


/* =====================================================
   MOSTRAR FOTOS
===================================================== */

function mostrarFotos(){

    listaFotos.innerHTML =
        "";


    if(
        fotos.length === 0
    ){

        listaFotos.innerHTML = `

            <div
                class="vacio"
                style="grid-column:1/-1;"
            >

                📷 Este trabajo todavía no tiene fotos.

            </div>

        `;

        return;

    }


    fotos.forEach(
        foto => {

            const card =
                document.createElement(
                    "div"
                );

            card.className =
                "foto-card";


            const url =
                foto.fotoUrl ||
                foto.url ||
                "";


            card.innerHTML = `

                ${
                    url
                    ?
                    `
                    <img
                        src="${escapeHTML(url)}"
                        alt="Foto del trabajo"
                        loading="lazy"
                    >
                    `
                    :
                    `
                    <div
                        style="
                        height:220px;
                        display:flex;
                        align-items:center;
                        justify-content:center;
                        color:#6b7280;
                        "
                    >
                        Sin imagen
                    </div>
                    `
                }


                <div class="foto-info">

                    <div class="foto-descripcion">

                        ${
                            escapeHTML(
                                foto.descripcion ||
                                "Sin descripción"
                            )
                        }

                    </div>


                    <div class="foto-fecha">

                        ${
                            fechaFormato(
                                foto.creadoEn
                            )
                        }

                    </div>


                    <button
                        type="button"
                        class="btn-danger"
                        data-eliminar="${escapeHTML(foto.id)}"
                    >
                        🗑️ Eliminar foto
                    </button>


                    <div class="ruta">

                        ${
                            escapeHTML(
                                foto.storagePath ||
                                ""
                            )
                        }

                    </div>

                </div>

            `;


            listaFotos.appendChild(
                card
            );

        }
    );


    listaFotos
        .querySelectorAll(
            "[data-eliminar]"
        )
        .forEach(
            boton => {

                boton.addEventListener(
                    "click",
                    async () => {

                        const fotoId =
                            boton.dataset.eliminar;


                        const foto =
                            fotos.find(
                                item =>
                                    item.id ===
                                    fotoId
                            );


                        if(foto){

                            await eliminarFoto(
                                foto
                            );

                        }

                    }
                );

            }
        );

}


/* =====================================================
   ELIMINAR FOTO
===================================================== */

async function eliminarFoto(foto){

    const confirmar =
        confirm(
            "¿Querés eliminar esta foto? Esta acción eliminará la foto de Firebase Storage y su registro en Firestore."
        );


    if(!confirmar){

        return;

    }


    try{

        mostrarMensaje(
            "⏳ Eliminando foto...",
            "info"
        );


        /*
         * Primero eliminamos el archivo
         * de Firebase Storage.
         */

        if(
            foto.storagePath
        ){

            const archivoRef =
                ref(
                    almacenamiento,
                    foto.storagePath
                );


            try{

                await deleteObject(
                    archivoRef
                );

            }
            catch(error){

                console.warn(
                    "No se pudo eliminar archivo Storage:",
                    error
                );

            }

        }


        /*
         * Después eliminamos
         * el documento Firestore.
         */

        await deleteDoc(
            doc(
                db,
                "fotos",
                foto.id
            )
        );


        mostrarMensaje(
            "✅ Foto eliminada correctamente.",
            "exito"
        );


        await cargarFotos();

    }
    catch(error){

        console.error(
            "ERROR ELIMINANDO FOTO:",
            error
        );


        mostrarMensaje(
            "❌ No se pudo eliminar la foto: " +
            error.message,
            "error"
        );

    }

}
