<!DOCTYPE html>
<html lang="es">

<head>

<meta charset="UTF-8">

<meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
>

<meta
    name="theme-color"
    content="#111827"
>

<meta
    name="description"
    content="GESBASE - Fotos de trabajos"
>

<title>Fotos - GESBASE</title>


<style>

/* =========================================================
   BASE
   ========================================================= */

* {
    box-sizing: border-box;
}

html,
body {
    margin: 0;
    padding: 0;
    min-height: 100%;
}

body {
    font-family:
        Arial,
        Helvetica,
        sans-serif;

    background: #f3f4f6;

    color: #111827;
}

button,
select,
textarea,
input {
    font-family: inherit;
}


/* =========================================================
   HEADER
   ========================================================= */

header {
    background: #111827;
    color: white;
    padding: 18px;
}

.header-inner {
    width: 100%;
    max-width: 900px;
    margin: auto;
}

.logo {
    font-size: 25px;
    font-weight: 800;
}

.subtitle {
    margin-top: 5px;
    color: #d1d5db;
    font-size: 14px;
}

.back-link {
    display: inline-block;
    margin-top: 12px;
    color: white;
    text-decoration: none;
    font-size: 14px;
}


/* =========================================================
   CONTENEDOR
   ========================================================= */

.container {
    width: 100%;
    max-width: 900px;
    margin: auto;
    padding: 18px;
}


/* =========================================================
   CARDS
   ========================================================= */

.card {
    background: white;
    border-radius: 16px;
    padding: 18px;
    margin-bottom: 18px;

    box-shadow:
        0 4px 16px rgba(0,0,0,0.07);
}

.card-title {
    margin: 0 0 16px 0;
    font-size: 20px;
}


/* =========================================================
   FORMULARIOS
   ========================================================= */

.form-label {
    display: block;
    margin-top: 14px;
    margin-bottom: 6px;
    font-weight: 700;
}

select,
textarea {
    width: 100%;
    border: 1px solid #d1d5db;
    border-radius: 10px;
    padding: 13px;

    font-size: 16px;

    background: white;
    color: #111827;
}

select:focus,
textarea:focus {
    outline: none;
    border-color: #2563eb;
}

textarea {
    min-height: 95px;
    resize: vertical;
}


/* =========================================================
   USUARIO
   ========================================================= */

.user-info {
    margin-top: 10px;
    color: #6b7280;
    font-size: 12px;
}


/* =========================================================
   BOTONES FOTO
   ========================================================= */

.photo-buttons {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 10px;
    margin-top: 10px;
}

.photo-button {
    width: 100%;
    min-height: 54px;

    border: none;
    border-radius: 11px;

    padding: 12px;

    background: #2563eb;
    color: white;

    font-size: 16px;
    font-weight: 700;

    cursor: pointer;

    -webkit-tap-highlight-color: transparent;
}

.photo-button.gallery {
    background: #4b5563;
}

.photo-button:active {
    transform: scale(0.98);
}

.photo-button:disabled {
    opacity: 0.55;
    cursor: not-allowed;
}


/* =========================================================
   INPUT FILE
   ========================================================= */

.file-input {
    position: absolute;

    width: 1px;
    height: 1px;

    opacity: 0;

    pointer-events: none;
}


/* =========================================================
   PREVIEW
   ========================================================= */

.preview {
    display: none;
    margin-top: 15px;
}

.preview img {
    width: 100%;
    max-height: 420px;

    object-fit: contain;

    display: block;

    border-radius: 12px;

    background: #e5e7eb;
}


/* =========================================================
   GUARDAR
   ========================================================= */

.save-button {
    width: 100%;

    border: none;
    border-radius: 11px;

    padding: 15px;

    margin-top: 15px;

    background: #16a34a;
    color: white;

    font-size: 17px;
    font-weight: 700;

    cursor: pointer;
}

.save-button:active {
    transform: scale(0.99);
}

.save-button:disabled {
    background: #9ca3af;
    cursor: not-allowed;
}


/* =========================================================
   MENSAJES
   ========================================================= */

.status {
    display: none;

    margin-top: 13px;

    padding: 12px;

    border-radius: 10px;

    font-size: 14px;

    line-height: 1.4;
}

.status.info {
    display: block;

    background: #dbeafe;
    color: #1e40af;
}

.status.success {
    display: block;

    background: #dcfce7;
    color: #166534;
}

.status.error {
    display: block;

    background: #fee2e2;
    color: #991b1b;
}


/* =========================================================
   HEADER FOTOS
   ========================================================= */

.photos-header {
    display: flex;

    align-items: center;
    justify-content: space-between;

    gap: 10px;

    margin-bottom: 15px;
}

.photos-header h2 {
    margin: 0;
}

.photo-count {
    min-width: 34px;

    text-align: center;

    background: #e5e7eb;

    color: #374151;

    padding: 6px 10px;

    border-radius: 20px;

    font-size: 13px;
    font-weight: 700;
}


/* =========================================================
   GRID
   ========================================================= */

.photos-grid {
    display: grid;

    grid-template-columns:
        repeat(2, minmax(0, 1fr));

    gap: 12px;
}

.photo-card {
    overflow: hidden;

    background: #f9fafb;

    border:
        1px solid #e5e7eb;

    border-radius: 12px;
}

.photo-card img {
    display: block;

    width: 100%;
    height: 180px;

    object-fit: cover;

    background: #e5e7eb;

    cursor: pointer;
}

.photo-info {
    padding: 10px;
}

.photo-description {
    font-size: 14px;

    line-height: 1.35;

    margin-bottom: 7px;

    word-break: break-word;
}

.photo-date {
    color: #6b7280;

    font-size: 11px;

    margin-bottom: 9px;
}

.delete-button {
    width: 100%;

    border: none;

    border-radius: 8px;

    padding: 9px;

    background: #dc2626;

    color: white;

    font-size: 13px;

    font-weight: 700;

    cursor: pointer;
}


/* =========================================================
   EMPTY / LOADING
   ========================================================= */

.empty,
.loading {
    grid-column: 1 / -1;

    text-align: center;

    padding: 30px 15px;

    color: #6b7280;
}


/* =========================================================
   MODAL
   ========================================================= */

.modal {
    display: none;

    position: fixed;

    inset: 0;

    z-index: 9999;

    background:
        rgba(0,0,0,0.92);

    align-items: center;
    justify-content: center;

    padding: 20px;
}

.modal img {
    max-width: 100%;
    max-height: 90vh;

    object-fit: contain;

    border-radius: 10px;
}

.close-modal {
    position: absolute;

    right: 18px;
    top: 8px;

    color: white;

    font-size: 42px;

    line-height: 1;

    cursor: pointer;
}


/* =========================================================
   RESPONSIVE
   ========================================================= */

@media (max-width: 520px) {

    .photo-buttons {
        grid-template-columns: 1fr;
    }

    .photo-card img {
        height: 155px;
    }

}

@media (min-width: 700px) {

    .photos-grid {
        grid-template-columns:
            repeat(3, minmax(0, 1fr));
    }

}

</style>

</head>


<body>


<!-- =======================================================
     HEADER
     ======================================================= -->

<header>

    <div class="header-inner">

        <div class="logo">
            GESBASE
        </div>

        <div class="subtitle">
            Fotos de trabajos
        </div>

        <a
            href="index.html"
            class="back-link"
        >
            ← Volver al panel
        </a>

    </div>

</header>



<!-- =======================================================
     CONTENIDO
     ======================================================= -->

<main class="container">


    <!-- ===================================================
         CLIENTE Y TRABAJO
         =================================================== -->

    <section class="card">

        <h2 class="card-title">
            📁 Seleccionar trabajo
        </h2>


        <label
            class="form-label"
            for="clienteSelect"
        >
            Cliente
        </label>


        <select id="clienteSelect">

            <option value="">
                Cargando clientes...
            </option>

        </select>


        <label
            class="form-label"
            for="trabajoSelect"
        >
            Trabajo
        </label>


        <select id="trabajoSelect">

            <option value="">
                Seleccioná primero un cliente
            </option>

        </select>


        <div
            id="userInfo"
            class="user-info"
        ></div>

    </section>



    <!-- ===================================================
         NUEVA FOTO
         =================================================== -->

    <section class="card">

        <h2 class="card-title">
            📷 Nueva foto
        </h2>


        <label class="form-label">
            Imagen
        </label>


        <div class="photo-buttons">


            <!-- BOTÓN CÁMARA -->

            <button
                type="button"
                id="tomarFotoBtn"
                class="photo-button"
            >
                📷 Tomar foto
            </button>


            <!-- BOTÓN GALERÍA -->

            <button
                type="button"
                id="galeriaBtn"
                class="photo-button gallery"
            >
                🖼️ Galería
            </button>


        </div>


        <!-- =================================================
             INPUT CÁMARA

             capture="environment" intenta abrir la cámara
             trasera del teléfono.

             ================================================= -->

        <input
            type="file"
            id="cameraInput"
            class="file-input"
            accept="image/*"
            capture="environment"
        >


        <!-- INPUT GALERÍA -->

        <input
            type="file"
            id="galleryInput"
            class="file-input"
            accept="image/*"
        >


        <!-- PREVIEW -->

        <div
            id="preview"
            class="preview"
        >

            <img
                id="previewImage"
                alt="Vista previa"
            >

        </div>


        <!-- DESCRIPCIÓN -->

        <label
            class="form-label"
            for="descripcion"
        >
            Descripción
        </label>


        <textarea
            id="descripcion"
            placeholder="Ej.: Antes de comenzar el trabajo..."
        ></textarea>


        <!-- GUARDAR -->

        <button
            type="button"
            id="guardarBtn"
            class="save-button"
            disabled
        >
            💾 Guardar foto
        </button>


        <!-- STATUS -->

        <div
            id="status"
            class="status"
        ></div>

    </section>



    <!-- ===================================================
         FOTOS
         =================================================== -->

    <section class="card">

        <div class="photos-header">

            <h2 class="card-title">
                📸 Fotos del trabajo
            </h2>

            <span
                id="photoCount"
                class="photo-count"
            >
                0
            </span>

        </div>


        <div
            id="photosContainer"
            class="photos-grid"
        >

            <div class="empty">

                Seleccioná un trabajo para ver sus fotos.

            </div>

        </div>

    </section>


</main>



<!-- =======================================================
     MODAL
     ======================================================= -->

<div
    id="imageModal"
    class="modal"
>

    <span
        id="closeModal"
        class="close-modal"
    >
        ×
    </span>


    <img
        id="modalImage"
        alt="Foto ampliada"
    >

</div>



<!-- =======================================================
     JAVASCRIPT
     ======================================================= -->

<script type="module">


/* =========================================================
   FIREBASE

   USAMOS DIRECTAMENTE TU firebase.js

   firebase.js contiene:

   export const auth
   export const db
   export const almacenamiento

   ========================================================= */

import {
    auth,
    db,
    almacenamiento
} from "./firebase.js";


/* =========================================================
   FIRESTORE
   ========================================================= */

import {
    collection,
    addDoc,
    getDocs,
    query,
    where,
    deleteDoc,
    doc,
    serverTimestamp
} from
"https://www.gstatic.com/firebasejs/12.18.0/firebase-firestore.js";


/* =========================================================
   STORAGE
   ========================================================= */

import {
    ref,
    uploadBytes,
    getDownloadURL,
    deleteObject
} from
"https://www.gstatic.com/firebasejs/12.18.0/firebase-storage.js";


/* =========================================================
   AUTH
   ========================================================= */

import {
    onAuthStateChanged
} from
"https://www.gstatic.com/firebasejs/12.18.0/firebase-auth.js";



/* =========================================================
   ELEMENTOS
   ========================================================= */

const clienteSelect =
    document.getElementById(
        "clienteSelect"
    );


const trabajoSelect =
    document.getElementById(
        "trabajoSelect"
    );


const tomarFotoBtn =
    document.getElementById(
        "tomarFotoBtn"
    );


const galeriaBtn =
    document.getElementById(
        "galeriaBtn"
    );


const cameraInput =
    document.getElementById(
        "cameraInput"
    );


const galleryInput =
    document.getElementById(
        "galleryInput"
    );


const preview =
    document.getElementById(
        "preview"
    );


const previewImage =
    document.getElementById(
        "previewImage"
    );


const descripcion =
    document.getElementById(
        "descripcion"
    );


const guardarBtn =
    document.getElementById(
        "guardarBtn"
    );


const status =
    document.getElementById(
        "status"
    );


const photosContainer =
    document.getElementById(
        "photosContainer"
    );


const photoCount =
    document.getElementById(
        "photoCount"
    );


const userInfo =
    document.getElementById(
        "userInfo"
    );


const imageModal =
    document.getElementById(
        "imageModal"
    );


const modalImage =
    document.getElementById(
        "modalImage"
    );


const closeModal =
    document.getElementById(
        "closeModal"
    );



/* =========================================================
   VARIABLES
   ========================================================= */

let usuarioActual = null;

let archivoSeleccionado = null;

let clientes = [];

let trabajos = [];

let fotosActuales = [];

let previewObjectURL = null;



/* =========================================================
   STATUS
   ========================================================= */

function mostrarStatus(
    mensaje,
    tipo = "info"
) {

    status.textContent =
        mensaje;

    status.className =
        "status " + tipo;

}


function ocultarStatus() {

    status.textContent =
        "";

    status.className =
        "status";

}



/* =========================================================
   ESCAPAR HTML
   ========================================================= */

function escaparHTML(
    texto
) {

    if (
        texto === null ||
        texto === undefined
    ) {

        return "";

    }


    return String(texto)

        .replace(
            /&/g,
            "&amp;"
        )

        .replace(
            /</g,
            "&lt;"
        )

        .replace(
            />/g,
            "&gt;"
        )

        .replace(
            /"/g,
            "&quot;"
        )

        .replace(
            /'/g,
            "&#039;"
        );

}



/* =========================================================
   AUTENTICACIÓN
   ========================================================= */

onAuthStateChanged(
    auth,
    async (user) => {

        if (!user) {

            window.location.href =
                "login.html";

            return;

        }


        usuarioActual =
            user;


        userInfo.textContent =
            "Usuario: " +
            (
                user.email ||
                user.uid
            );


        await cargarClientes();

    }
);



/* =========================================================
   CLIENTES
   ========================================================= */

async function cargarClientes() {

    clienteSelect.innerHTML =
        `
        <option value="">
            Cargando clientes...
        </option>
        `;


    try {

        const q =
            query(
                collection(
                    db,
                    "clientes"
                ),

                where(
                    "usuarioId",
                    "==",
                    usuarioActual.uid
                )
            );


        const snapshot =
            await getDocs(q);


        clientes = [];


        snapshot.forEach(
            (documento) => {

                clientes.push({

                    id:
                        documento.id,

                    ...documento.data()

                });

            }
        );


        clientes.sort(
            (a, b) => {

                const nombreA =
                    String(
                        a.nombre ||
                        a.razonSocial ||
                        a.empresa ||
                        a.nombreCompleto ||
                        ""
                    ).toLowerCase();


                const nombreB =
                    String(
                        b.nombre ||
                        b.razonSocial ||
                        b.empresa ||
                        b.nombreCompleto ||
                        ""
                    ).toLowerCase();


                return nombreA.localeCompare(
                    nombreB
                );

            }
        );


        clienteSelect.innerHTML =
            `
            <option value="">
                Seleccionar cliente
            </option>
            `;


        clientes.forEach(
            (cliente) => {

                const option =
                    document.createElement(
                        "option"
                    );


                option.value =
                    cliente.id;


                option.textContent =
                    cliente.nombre ||
                    cliente.razonSocial ||
                    cliente.empresa ||
                    cliente.nombreCompleto ||
                    "Cliente sin nombre";


                clienteSelect.appendChild(
                    option
                );

            }
        );


        if (
            clientes.length === 0
        ) {

            clienteSelect.innerHTML =
                `
                <option value="">
                    No hay clientes
                </option>
                `;

        }

    } catch (error) {

        console.error(
            "Error cargando clientes:",
            error
        );


        clienteSelect.innerHTML =
            `
            <option value="">
                Error cargando clientes
            </option>
            `;


        mostrarStatus(
            "No se pudieron cargar los clientes: " +
            error.message,
            "error"
        );

    }

}



/* =========================================================
   CAMBIO DE CLIENTE
   ========================================================= */

clienteSelect.addEventListener(
    "change",
    async () => {

        const clienteId =
            clienteSelect.value;


        trabajoSelect.innerHTML =
            `
            <option value="">
                Cargando trabajos...
            </option>
            `;


        photosContainer.innerHTML =
            `
            <div class="empty">
                Seleccioná un trabajo.
            </div>
            `;


        photoCount.textContent =
            "0";


        if (!clienteId) {

            trabajoSelect.innerHTML =
                `
                <option value="">
                    Seleccioná primero un cliente
                </option>
                `;

            return;

        }


        await cargarTrabajos(
            clienteId
        );

    }
);



/* =========================================================
   CARGAR TRABAJOS
   ========================================================= */

async function cargarTrabajos(
    clienteId
) {

    try {

        const q =
            query(
                collection(
                    db,
                    "trabajos"
                ),

                where(
                    "usuarioId",
                    "==",
                    usuarioActual.uid
                ),

                where(
                    "clienteId",
                    "==",
                    clienteId
                )
            );


        const snapshot =
            await getDocs(q);


        trabajos = [];


        snapshot.forEach(
            (documento) => {

                trabajos.push({

                    id:
                        documento.id,

                    ...documento.data()

                });

            }
        );


        trabajoSelect.innerHTML =
            `
            <option value="">
                Seleccionar trabajo
            </option>
            `;


        trabajos.forEach(
            (trabajo) => {

                const option =
                    document.createElement(
                        "option"
                    );


                option.value =
                    trabajo.id;


                option.textContent =
                    trabajo.titulo ||
                    trabajo.nombre ||
                    trabajo.descripcion ||
                    trabajo.trabajo ||
                    "Trabajo";


                trabajoSelect.appendChild(
                    option
                );

            }
        );


        if (
            trabajos.length === 0
        ) {

            trabajoSelect.innerHTML =
                `
                <option value="">
                    No hay trabajos para este cliente
                </option>
                `;

        }

    } catch (error) {

        console.error(
            "Error cargando trabajos:",
            error
        );


        trabajoSelect.innerHTML =
            `
            <option value="">
                Error cargando trabajos
            </option>
            `;


        mostrarStatus(
            "No se pudieron cargar los trabajos: " +
            error.message,
            "error"
        );

    }

}



/* =========================================================
   CAMBIO DE TRABAJO
   ========================================================= */

trabajoSelect.addEventListener(
    "change",
    async () => {

        const trabajoId =
            trabajoSelect.value;


        if (!trabajoId) {

            photosContainer.innerHTML =
                `
                <div class="empty">
                    Seleccioná un trabajo para ver sus fotos.
                </div>
                `;


            photoCount.textContent =
                "0";


            return;

        }


        await cargarFotos(
            trabajoId
        );

    }
);



/* =========================================================
   TOMAR FOTO

   ESTE ES EL CAMBIO IMPORTANTE.

   El botón NO es un enlace.
   NO es un label.
   NO navega a ninguna página.

   Simplemente abre el input de cámara.

   ========================================================= */

tomarFotoBtn.addEventListener(
    "click",
    function(event) {

        event.preventDefault();
        event.stopPropagation();

        cameraInput.click();

    }
);



/* =========================================================
   GALERÍA
   ========================================================= */

galeriaBtn.addEventListener(
    "click",
    function(event) {

        event.preventDefault();
        event.stopPropagation();

        galleryInput.click();

    }
);



/* =========================================================
   CAMBIO DE CÁMARA
   ========================================================= */

cameraInput.addEventListener(
    "change",
    manejarArchivo
);



/* =========================================================
   CAMBIO DE GALERÍA
   ========================================================= */

galleryInput.addEventListener(
    "change",
    manejarArchivo
);



/* =========================================================
   MANEJAR ARCHIVO
   ========================================================= */

function manejarArchivo(
    event
) {

    const archivo =
        event.target.files &&
        event.target.files[0];


    if (!archivo) {

        return;

    }


    if (
        !archivo.type ||
        !archivo.type.startsWith(
            "image/"
        )
    ) {

        mostrarStatus(
            "El archivo seleccionado no es una imagen.",
            "error"
        );

        return;

    }


    archivoSeleccionado =
        archivo;


    if (
        previewObjectURL
    ) {

        URL.revokeObjectURL(
            previewObjectURL
        );

    }


    previewObjectURL =
        URL.createObjectURL(
            archivo
        );


    previewImage.src =
        previewObjectURL;


    preview.style.display =
        "block";


    guardarBtn.disabled =
        false;


    mostrarStatus(
        "Foto lista para guardar.",
        "success"
    );

}



/* =========================================================
   GUARDAR FOTO
   ========================================================= */

guardarBtn.addEventListener(
    "click",
    guardarFoto
);



async function guardarFoto() {

    if (!usuarioActual) {

        mostrarStatus(
            "No hay una sesión iniciada.",
            "error"
        );

        return;

    }


    const clienteId =
        clienteSelect.value;


    const trabajoId =
        trabajoSelect.value;


    if (!clienteId) {

        mostrarStatus(
            "Seleccioná un cliente.",
            "error"
        );

        return;

    }


    if (!trabajoId) {

        mostrarStatus(
            "Seleccioná un trabajo.",
            "error"
        );

        return;

    }


    if (!archivoSeleccionado) {

        mostrarStatus(
            "Tomá una foto o seleccioná una imagen.",
            "error"
        );

        return;

    }


    guardarBtn.disabled =
        true;


    tomarFotoBtn.disabled =
        true;


    galeriaBtn.disabled =
        true;


    mostrarStatus(
        "Subiendo foto...",
        "info"
    );


    try {

        const extension =
            obtenerExtension(
                archivoSeleccionado.name
            );


        const nombreArchivo =
            Date.now() +
            "_" +
            Math.random()
                .toString(36)
                .substring(2, 10) +
            "." +
            extension;


        /*
         * STORAGE
         *
         * fotos/
         *    UID/
         *       TRABAJO_ID/
         *          ARCHIVO
         */

        const ruta =
            "fotos/" +
            usuarioActual.uid +
            "/" +
            trabajoId +
            "/" +
            nombreArchivo;


        const storageRef =
            ref(
                almacenamiento,
                ruta
            );


        await uploadBytes(
            storageRef,
            archivoSeleccionado,
            {
                contentType:
                    archivoSeleccionado.type
            }
        );


        mostrarStatus(
            "Foto subida. Guardando información...",
            "info"
        );


        const url =
            await getDownloadURL(
                storageRef
            );


        /*
         * FIRESTORE
         */

        await addDoc(
            collection(
                db,
                "fotos"
            ),
            {

                usuarioId:
                    usuarioActual.uid,

                empresaId:
                    usuarioActual.uid,

                clienteId:
                    clienteId,

                trabajoId:
                    trabajoId,

                nombreArchivo:
                    nombreArchivo,

                nombreOriginal:
                    archivoSeleccionado.name,

                rutaStorage:
                    ruta,

                url:
                    url,

                descripcion:
                    descripcion.value.trim(),

                tipo:
                    archivoSeleccionado.type,

                fecha:
                    serverTimestamp(),

                creadoPor:
                    usuarioActual.email ||
                    ""

            }
        );


        mostrarStatus(
            "✅ Foto guardada correctamente.",
            "success"
        );


        archivoSeleccionado =
            null;


        cameraInput.value =
            "";


        galleryInput.value =
            "";


        descripcion.value =
            "";


        preview.style.display =
            "none";


        previewImage.src =
            "";


        guardarBtn.disabled =
            true;


        if (
            previewObjectURL
        ) {

            URL.revokeObjectURL(
                previewObjectURL
            );

            previewObjectURL =
                null;

        }


        await cargarFotos(
            trabajoId
        );


    } catch (error) {

        console.error(
            "Error guardando foto:",
            error
        );


        mostrarStatus(
            "No se pudo guardar la foto: " +
            error.message,
            "error"
        );


        guardarBtn.disabled =
            false;

    }


    tomarFotoBtn.disabled =
        false;


    galeriaBtn.disabled =
        false;

}



/* =========================================================
   EXTENSIÓN
   ========================================================= */

function obtenerExtension(
    nombre
) {

    if (
        !nombre ||
        !nombre.includes(".")
    ) {

        return "jpg";

    }


    const partes =
        nombre.split(".");


    return (
        partes
            .pop()
            .toLowerCase() ||
        "jpg"
    );

}



/* =========================================================
   CARGAR FOTOS
   ========================================================= */

async function cargarFotos(
    trabajoId
) {

    photosContainer.innerHTML =
        `
        <div class="loading">
            Cargando fotos...
        </div>
        `;


    try {

        const q =
            query(
                collection(
                    db,
                    "fotos"
                ),

                where(
                    "usuarioId",
                    "==",
                    usuarioActual.uid
                ),

                where(
                    "trabajoId",
                    "==",
                    trabajoId
                )
            );


        const snapshot =
            await getDocs(q);


        fotosActuales = [];


        snapshot.forEach(
            (documento) => {

                fotosActuales.push({

                    id:
                        documento.id,

                    ...documento.data()

                });

            }
        );


        fotosActuales.sort(
            (a, b) => {

                const fechaA =
                    a.fecha?.seconds ||
                    0;


                const fechaB =
                    b.fecha?.seconds ||
                    0;


                return fechaB - fechaA;

            }
        );


        photoCount.textContent =
            fotosActuales.length;


        if (
            fotosActuales.length === 0
        ) {

            photosContainer.innerHTML =
                `
                <div class="empty">
                    Todavía no hay fotos para este trabajo.
                </div>
                `;

            return;

        }


        photosContainer.innerHTML =
            "";


        fotosActuales.forEach(
            (foto) => {

                const card =
                    document.createElement(
                        "div"
                    );


                card.className =
                    "photo-card";


                const fecha =
                    formatearFecha(
                        foto.fecha
                    );


                card.innerHTML =
                    `

                    <img
                        src="${escaparHTML(foto.url)}"
                        alt="Foto del trabajo"
                    >

                    <div class="photo-info">

                        <div class="photo-description">
                            ${
                                escaparHTML(
                                    foto.descripcion ||
                                    "Sin descripción"
                                )
                            }
                        </div>

                        <div class="photo-date">
                            ${fecha}
                        </div>

                        <button
                            type="button"
                            class="delete-button"
                        >
                            🗑️ Eliminar
                        </button>

                    </div>

                    `;


                const imagen =
                    card.querySelector(
                        "img"
                    );


                imagen.addEventListener(
                    "click",
                    () => {

                        abrirImagen(
                            foto.url
                        );

                    }
                );


                const eliminar =
                    card.querySelector(
                        ".delete-button"
                    );


                eliminar.addEventListener(
                    "click",
                    () => {

                        eliminarFoto(
                            foto
                        );

                    }
                );


                photosContainer.appendChild(
                    card
                );

            }
        );


    } catch (error) {

        console.error(
            "Error cargando fotos:",
            error
        );


        photosContainer.innerHTML =
            `
            <div class="empty">
                No se pudieron cargar las fotos.
            </div>
            `;


        mostrarStatus(
            "No se pudieron cargar las fotos: " +
            error.message,
            "error"
        );

    }

}



/* =========================================================
   FECHA
   ========================================================= */

function formatearFecha(
    timestamp
) {

    if (!timestamp) {

        return "Fecha no disponible";

    }


    try {

        const fecha =
            timestamp.toDate();


        return fecha.toLocaleString(
            "es-AR",
            {

                day:
                    "2-digit",

                month:
                    "2-digit",

                year:
                    "numeric",

                hour:
                    "2-digit",

                minute:
                    "2-digit"

            }
        );

    } catch {

        return "Fecha no disponible";

    }

}



/* =========================================================
   ELIMINAR FOTO
   ========================================================= */

async function eliminarFoto(
    foto
) {

    const confirmar =
        confirm(
            "¿Querés eliminar esta foto?"
        );


    if (!confirmar) {

        return;

    }


    try {

        mostrarStatus(
            "Eliminando foto...",
            "info"
        );


        /*
         * Primero intentamos borrar Storage.
         */

        if (
            foto.rutaStorage
        ) {

            try {

                const storageRef =
                    ref(
                        almacenamiento,
                        foto.rutaStorage
                    );


                await deleteObject(
                    storageRef
                );

            } catch (storageError) {

                console.warn(
                    "No se pudo eliminar el archivo de Storage:",
                    storageError
                );

            }

        }


        /*
         * Después borramos Firestore.
         */

        await deleteDoc(
            doc(
                db,
                "fotos",
                foto.id
            )
        );


        mostrarStatus(
            "✅ Foto eliminada correctamente.",
            "success"
        );


        if (
            trabajoSelect.value
        ) {

            await cargarFotos(
                trabajoSelect.value
            );

        }

    } catch (error) {

        console.error(
            "Error eliminando foto:",
            error
        );


        mostrarStatus(
            "No se pudo eliminar la foto: " +
            error.message,
            "error"
        );

    }

}



/* =========================================================
   MODAL
   ========================================================= */

function abrirImagen(
    url
) {

    modalImage.src =
        url;


    imageModal.style.display =
        "flex";

}


closeModal.addEventListener(
    "click",
    () => {

        imageModal.style.display =
            "none";

        modalImage.src =
            "";

    }
);


imageModal.addEventListener(
    "click",
    (event) => {

        if (
            event.target ===
            imageModal
        ) {

            imageModal.style.display =
                "none";

            modalImage.src =
                "";

        }

    }
);



/* =========================================================
   ESCAPE
   ========================================================= */

document.addEventListener(
    "keydown",
    (event) => {

        if (
            event.key ===
            "Escape"
        ) {

            imageModal.style.display =
                "none";

            modalImage.src =
                "";

        }

    }
);


</script>
