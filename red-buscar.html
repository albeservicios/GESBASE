import {
    auth,
    db
} from "./Js/firebase.js";

import {
    onAuthStateChanged
} from "https://www.gstatic.com/firebasejs/12.18.0/firebase-auth.js";

import {
    collection,
    getDocs,
    getDoc,
    doc,
    query,
    where,
    addDoc,
    serverTimestamp
} from "https://www.gstatic.com/firebasejs/12.18.0/firebase-firestore.js";


const inputBuscar =
    document.getElementById("inputBuscar");

const inputLocalidad =
    document.getElementById("inputLocalidad");

const resultados =
    document.getElementById("resultados");

const estado =
    document.getElementById("estado");

const filtros =
    document.querySelectorAll(".filter");


let usuarioActual = null;

let usuarios = [];

let usuariosCargados = false;

let cargandoUsuarios = false;

let tipoSeleccionado = "todos";

let temporizadorBusqueda = null;

let estadosConexion = new Map();


/* =========================
   AUTENTICACIÓN
========================= */

onAuthStateChanged(auth, async usuario => {

    if(!usuario){

        window.location.href = "red-login.html";

        return;
    }

    usuarioActual = usuario;

    // IMPORTANTE:
    // NO cargamos usuarios al entrar.
    mostrarEstadoInicial();

});


/* =========================
   ESTADO INICIAL
========================= */

function mostrarEstadoInicial(){

    resultados.innerHTML = "";

    estado.style.display = "block";

    estado.textContent =
        "Escribí algo para comenzar a buscar.";

}


/* =========================
   EVENTOS DE BÚSQUEDA
========================= */

inputBuscar.addEventListener(
    "input",
    programarBusqueda
);

inputLocalidad.addEventListener(
    "input",
    programarBusqueda
);


filtros.forEach(filtro => {

    filtro.addEventListener("click", () => {

        filtros.forEach(f =>
            f.classList.remove("active")
        );

        filtro.classList.add("active");

        tipoSeleccionado =
            filtro.dataset.tipo;

        /*
         * Seleccionar una categoría también
         * se considera una búsqueda.
         */

        programarBusqueda();

    });

});


function programarBusqueda(){

    clearTimeout(temporizadorBusqueda);

    temporizadorBusqueda =
        setTimeout(() => {

            realizarBusqueda();

        }, 300);

}


/* =========================
   REALIZAR BÚSQUEDA
========================= */

async function realizarBusqueda(){

    const texto =
        normalizar(inputBuscar.value);

    const localidad =
        normalizar(inputLocalidad.value);

    const hayTexto =
        texto.length >= 2 ||
        localidad.length >= 2;

    const hayFiltro =
        tipoSeleccionado !== "todos";


    /*
     * NO mostrar usuarios si todavía
     * no se realizó una búsqueda.
     */

    if(!hayTexto && !hayFiltro){

        mostrarEstadoInicial();

        return;

    }


    estado.style.display = "block";

    estado.textContent = "Buscando...";

    resultados.innerHTML = "";


    try{

        /*
         * Los usuarios se cargan recién
         * cuando realmente se comienza
         * una búsqueda.
         */

        await cargarUsuarios();

        aplicarFiltros(
            texto,
            localidad
        );

    }catch(error){

        console.error(
            "Error buscando usuarios:",
            error
        );

        resultados.innerHTML = "";

        estado.style.display = "block";

        estado.textContent =
            "No se pudo realizar la búsqueda.";

    }

}


/* =========================
   CARGAR USUARIOS
========================= */

async function cargarUsuarios(){

    if(usuariosCargados){

        return;

    }

    if(cargandoUsuarios){

        while(cargandoUsuarios){

            await new Promise(
                resolve =>
                    setTimeout(resolve,100)
            );

        }

        return;

    }


    cargandoUsuarios = true;


    try{

        const snapshot =
            await getDocs(
                collection(db,"usuarios")
            );


        usuarios = [];


        snapshot.forEach(documento => {

            const uid =
                documento.id;

            /*
             * Nunca mostrar el propio usuario.
             */

            if(
                usuarioActual &&
                uid === usuarioActual.uid
            ){

                return;

            }


            const datos =
                documento.data();


            usuarios.push(
                transformarUsuario(
                    uid,
                    datos
                )
            );

        });


        usuariosCargados = true;


    }finally{

        cargandoUsuarios = false;

    }

}


/* =========================
   TRANSFORMAR PERFIL
========================= */

function transformarUsuario(
    uid,
    datos
){

    const nombre =
        datos.nombreCompleto ||
        [
            datos.nombre || "",
            datos.apellido || ""
        ]
        .join(" ")
        .trim() ||
        "Usuario GESBASE";


    const tipo =
        normalizarTipo(
            datos.tipo ||
            datos.perfilTipo ||
            datos.rol ||
            datos.perfil ||
            ""
        );


    const rubro =
        datos.rubro ||
        datos.tipoNegocio ||
        "";


    const localidad =
        datos.localidad ||
        datos.ciudad ||
        "";


    const provincia =
        datos.provincia ||
        datos.region ||
        "";


    const empresa =
        datos.nombreEmpresa ||
        datos.empresa ||
        "";


    const foto =
        datos.fotoPerfil ||
        datos.photoURL ||
        datos.foto ||
        "";


    return {

        uid,

        nombre,

        tipo,

        rubro,

        localidad,

        provincia,

        empresa,

        foto

    };

}


/* =========================
   NORMALIZAR TIPO
========================= */

function normalizarTipo(valor){

    const texto =
        normalizar(valor);


    if(
        texto.includes("profesional")
    ){

        return "profesional";

    }


    if(
        texto.includes("trabajador") ||
        texto.includes("empleado") ||
        texto.includes("obrero")
    ){

        return "trabajador";

    }


    if(
        texto.includes("empresa") ||
        texto.includes("administrador") ||
        texto.includes("contratista")
    ){

        return "empresa";

    }


    if(
        texto.includes("comercio") ||
        texto.includes("comercial") ||
        texto.includes("negocio")
    ){

        return "comercio";

    }


    return "persona";

}


/* =========================
   FILTRAR RESULTADOS
========================= */

function aplicarFiltros(
    texto,
    localidad
){

    const resultadosFiltrados =
        usuarios.filter(usuario => {


            /*
             * Búsqueda general:
             * nombre
             * rubro
             * localidad
             * empresa
             * provincia
             */

            const contenido = normalizar(
                [
                    usuario.nombre,
                    usuario.rubro,
                    usuario.localidad,
                    usuario.provincia,
                    usuario.empresa
                ]
                .join(" ")
            );


            /*
             * El texto buscado debe aparecer
             * en alguno de los datos del perfil.
             */

            const coincideTexto =
                !texto ||
                contenido.includes(texto);


            /*
             * Filtro localidad.
             */

            const coincideLocalidad =
                !localidad ||
                normalizar(
                    [
                        usuario.localidad,
                        usuario.provincia
                    ]
                    .join(" ")
                )
                .includes(localidad);


            /*
             * Filtro por categoría.
             */

            const coincideTipo =
                tipoSeleccionado === "todos" ||
                usuario.tipo === tipoSeleccionado;


            return (
                coincideTexto &&
                coincideLocalidad &&
                coincideTipo
            );

        });


    pintarResultados(
        resultadosFiltrados
    );

}


/* =========================
   PINTAR RESULTADOS
========================= */

async function pintarResultados(lista){

    resultados.innerHTML = "";


    if(lista.length === 0){

        estado.style.display = "block";

        estado.textContent =
            "No encontramos personas o negocios que coincidan con la búsqueda.";

        return;

    }


    estado.style.display = "none";


    await cargarEstadosConexion(
        lista
    );


    lista.forEach(usuario => {

        resultados.appendChild(
            crearCard(usuario)
        );

    });

}


/* =========================
   ESTADOS DE CONEXIÓN
========================= */

async function cargarEstadosConexion(lista){

    estadosConexion.clear();


    if(!usuarioActual){

        return;

    }


    try{

        const enviadosSnapshot =
            await getDocs(
                query(
                    collection(db,"conexiones"),
                    where(
                        "emisor",
                        "==",
                        usuarioActual.uid
                    )
                )
            );


        enviadosSnapshot.forEach(documento => {

            const datos =
                documento.data();


            if(datos.receptor){

                estadosConexion.set(
                    datos.receptor,
                    {
                        estado:
                            datos.estado || "pendiente",
                        id:
                            documento.id,
                        direccion:
                            "enviada"
                    }
                );

            }

        });


        const recibidosSnapshot =
            await getDocs(
                query(
                    collection(db,"conexiones"),
                    where(
                        "receptor",
                        "==",
                        usuarioActual.uid
                    )
                )
            );


        recibidosSnapshot.forEach(documento => {

            const datos =
                documento.data();


            if(datos.emisor){

                /*
                 * Si ya existe una solicitud enviada
                 * y además recibida, priorizamos aceptada.
                 */

                const anterior =
                    estadosConexion.get(
                        datos.emisor
                    );


                estadosConexion.set(
                    datos.emisor,
                    {
                        estado:
                            datos.estado || "pendiente",
                        id:
                            documento.id,
                        direccion:
                            "recibida",
                        anterior
                    }
                );

            }

        });


    }catch(error){

        console.error(
            "Error cargando conexiones:",
            error
        );

    }

}


/* =========================
   CREAR TARJETA
========================= */

function crearCard(usuario){

    const card =
        document.createElement("div");

    card.className = "card";


    const perfilArea =
        document.createElement("div");

    perfilArea.className =
        "perfil-area";


    perfilArea.addEventListener(
        "click",
        () => abrirPerfil(usuario.uid)
    );


    const avatar =
        document.createElement("div");

    avatar.className =
        "avatar";


    if(usuario.foto){

        const imagen =
            document.createElement("img");

        imagen.src =
            usuario.foto;

        imagen.alt =
            usuario.nombre;

        imagen.onerror = () => {

            imagen.remove();

            avatar.textContent =
                obtenerInicial(
                    usuario.nombre
                );

        };

        avatar.appendChild(imagen);

    }else{

        avatar.textContent =
            obtenerInicial(
                usuario.nombre
            );

    }


    const info =
        document.createElement("div");

    info.className =
        "info";


    const nombre =
        document.createElement("div");

    nombre.className =
        "nombre";

    nombre.textContent =
        usuario.nombre;


    const tipo =
        document.createElement("div");

    tipo.className =
        "tipo";

    tipo.textContent =
        textoTipo(
            usuario.tipo
        );


    const detalle =
        document.createElement("div");

    detalle.className =
        "detalle";


    const datosDetalle = [];


    if(usuario.rubro){

        datosDetalle.push(
            usuario.rubro
        );

    }


    if(usuario.localidad){

        datosDetalle.push(
            "📍 " + usuario.localidad
        );

    }


    if(usuario.provincia){

        datosDetalle.push(
            usuario.provincia
        );

    }


    if(usuario.empresa){

        datosDetalle.push(
            "🏢 " + usuario.empresa
        );

    }


    detalle.textContent =
        datosDetalle.join(" · ");


    info.appendChild(nombre);

    info.appendChild(tipo);

    if(detalle.textContent){

        info.appendChild(detalle);

    }


    perfilArea.appendChild(avatar);

    perfilArea.appendChild(info);


    const acciones =
        document.createElement("div");

    acciones.className =
        "acciones";


    const botonPerfil =
        document.createElement("button");

    botonPerfil.className =
        "btn btn-perfil";

    botonPerfil.textContent =
        "Ver perfil";


    botonPerfil.addEventListener(
        "click",
        () => abrirPerfil(usuario.uid)
    );


    const botonConectar =
        document.createElement("button");

    botonConectar.className =
        "btn btn-conectar";


    const estadoConexion =
        estadosConexion.get(
            usuario.uid
        );


    if(
        estadoConexion &&
        estadoConexion.estado === "aceptada"
    ){

        botonConectar.textContent =
            "✓ Conectados";

        botonConectar.disabled =
            true;

    }else if(
        estadoConexion &&
        estadoConexion.direccion === "enviada" &&
        estadoConexion.estado === "pendiente"
    ){

        botonConectar.textContent =
            "Solicitud enviada";

        botonConectar.disabled =
            true;

    }else if(
        estadoConexion &&
        estadoConexion.direccion === "recibida" &&
        estadoConexion.estado === "pendiente"
    ){

        botonConectar.textContent =
            "Pendiente";

        botonConectar.disabled =
            true;

    }else{

        botonConectar.textContent =
            "Conectar";

        botonConectar.addEventListener(
            "click",
            () => gestionarConexion(
                usuario.uid,
                botonConectar
            )
        );

    }


    acciones.appendChild(
        botonPerfil
    );

    acciones.appendChild(
        botonConectar
    );


    card.appendChild(
        perfilArea
    );

    card.appendChild(
        acciones
    );


    return card;

}


/* =========================
   ENVIAR CONEXIÓN
========================= */

async function gestionarConexion(
    receptorUid,
    boton
){

    if(!usuarioActual){

        return;

    }


    if(
        receptorUid ===
        usuarioActual.uid
    ){

        return;

    }


    boton.disabled = true;

    boton.textContent =
        "Enviando...";


    try{

        /*
         * Verificamos nuevamente
         * que no exista una conexión.
         */

        const enviadosSnapshot =
            await getDocs(
                query(
                    collection(db,"conexiones"),
                    where(
                        "emisor",
                        "==",
                        usuarioActual.uid
                    ),
                    where(
                        "receptor",
                        "==",
                        receptorUid
                    )
                )
            );


        const recibidosSnapshot =
            await getDocs(
                query(
                    collection(db,"conexiones"),
                    where(
                        "emisor",
                        "==",
                        receptorUid
                    ),
                    where(
                        "receptor",
                        "==",
                        usuarioActual.uid
                    )
                )
            );


        if(
            !enviadosSnapshot.empty ||
            !recibidosSnapshot.empty
        ){

            boton.textContent =
                "Pendiente";

            return;

        }


        const perfilActual =
            await getDoc(
                doc(
                    db,
                    "usuarios",
                    usuarioActual.uid
                )
            );


        const datosActual =
            perfilActual.exists()
                ? perfilActual.data()
                : {};


        const nombreEmisor =
            datosActual.nombreCompleto ||
            [
                datosActual.nombre || "",
                datosActual.apellido || ""
            ]
            .join(" ")
            .trim() ||
            usuarioActual.email ||
            "Usuario GESBASE";


        /*
         * UNA SOLA IDENTIDAD:
         * emisor y receptor son UIDs.
         */

        await addDoc(
            collection(db,"conexiones"),
            {

                emisor:
                    usuarioActual.uid,

                receptor:
                    receptorUid,

                estado:
                    "pendiente",

                fecha:
                    serverTimestamp(),

                fechaCliente:
                    Date.now()

            }
        );


        /*
         * Notificación para el receptor.
         */

        await addDoc(
            collection(db,"notificaciones"),
            {

                usuarioId:
                    receptorUid,

                tipo:
                    "solicitud_conexion",

                titulo:
                    "Nueva solicitud de conexión",

                mensaje:
                    nombreEmisor +
                    " quiere conectarse contigo.",

                emisorUid:
                    usuarioActual.uid,

                receptorUid:
                    receptorUid,

                leida:
                    false,

                fecha:
                    serverTimestamp(),

                fechaCliente:
                    Date.now()

            }
        );


        estadosConexion.set(
            receptorUid,
            {
                estado:"pendiente",
                direccion:"enviada"
            }
        );


        boton.textContent =
            "Solicitud enviada";


    }catch(error){

        console.error(
            "Error enviando conexión:",
            error
        );

        boton.disabled = false;

        boton.textContent =
            "Conectar";

        alert(
            "No se pudo enviar la solicitud."
        );

    }

}


/* =========================
   ABRIR PERFIL
========================= */

function abrirPerfil(uid){

    if(!uid){

        return;

    }

    window.location.href =
        "red-perfil.html?uid=" +
        encodeURIComponent(uid);

}


/* =========================
   NAVEGACIÓN
========================= */

window.irA = function(pagina){

    window.location.href =
        pagina;

};


/* =========================
   UTILIDADES
========================= */

function normalizar(valor){

    return String(
        valor || ""
    )
    .toLowerCase()
    .normalize("NFD")
    .replace(
        /[\u0300-\u036f]/g,
        ""
    )
    .trim();

}


function obtenerInicial(nombre){

    const texto =
        String(
            nombre || "U"
        )
        .trim();

    return (
        texto.charAt(0)
            .toUpperCase()
    );

}


function textoTipo(tipo){

    const tipos = {

        persona:
            "Persona",

        profesional:
            "Profesional",

        trabajador:
            "Trabajador",

        empresa:
            "Empresa",

        comercio:
            "Comercio"

    };


    return tipos[tipo] ||
        "Usuario GESBASE";

}
