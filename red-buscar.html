<!DOCTYPE html>
<html lang="es-AR">

<head>

<meta charset="UTF-8">

<meta
    name="viewport"
    content="width=device-width, initial-scale=1.0, viewport-fit=cover"
>

<meta
    name="theme-color"
    content="#111827"
>

<meta
    name="description"
    content="Buscar personas, profesionales, trabajadores, empresas y comercios en Red GESBASE."
>

<title>Buscar - Red GESBASE</title>


<style>

*{
    box-sizing:border-box;
    margin:0;
    padding:0;
}

body{
    font-family:Arial,Helvetica,sans-serif;
    background:#f3f4f6;
    color:#111827;
    padding-bottom:85px;
}


/* HEADER */

header{
    position:sticky;
    top:0;
    z-index:100;
    background:#111827;
    color:white;
    padding:16px;
    box-shadow:0 2px 8px rgba(0,0,0,.18);
}

.header-inner{
    max-width:900px;
    margin:auto;
    display:flex;
    align-items:center;
    justify-content:space-between;
}

.logo{
    font-size:21px;
    font-weight:700;
}

.logout{
    border:0;
    background:#374151;
    color:white;
    padding:9px 13px;
    border-radius:9px;
    cursor:pointer;
}


/* CONTENEDOR */

.container{
    width:100%;
    max-width:900px;
    margin:auto;
    padding:15px;
}


/* TITULO */

.title-box{
    background:white;
    border-radius:16px;
    padding:20px;
    margin-bottom:15px;
    box-shadow:0 2px 8px rgba(0,0,0,.06);
}

.title-box h1{
    font-size:24px;
    margin-bottom:6px;
}

.title-box p{
    color:#6b7280;
    font-size:14px;
}


/* BUSCADOR */

.search-box{
    background:white;
    border-radius:16px;
    padding:15px;
    margin-bottom:15px;
    box-shadow:0 2px 8px rgba(0,0,0,.06);
}

.search-input{
    width:100%;
    border:1px solid #d1d5db;
    border-radius:12px;
    padding:14px;
    font-size:15px;
    outline:none;
}

.search-input:focus{
    border-color:#2563eb;
}


/* FILTROS */

.filters{
    display:grid;
    grid-template-columns:1fr 1fr;
    gap:10px;
    margin-top:10px;
}

.filter{
    width:100%;
    border:1px solid #d1d5db;
    background:white;
    border-radius:10px;
    padding:11px;
    font-size:14px;
    outline:none;
}

.filter:focus{
    border-color:#2563eb;
}


/* RESULTADOS */

.section-title{
    font-size:18px;
    font-weight:700;
    margin:18px 2px 10px;
}

.results{
    display:flex;
    flex-direction:column;
    gap:12px;
}


/* TARJETA */

.person-card{
    background:white;
    border-radius:16px;
    padding:15px;
    box-shadow:0 2px 8px rgba(0,0,0,.06);
    display:flex;
    gap:13px;
    align-items:flex-start;
}

.avatar{
    width:58px;
    height:58px;
    border-radius:50%;
    background:#e5e7eb;
    display:flex;
    align-items:center;
    justify-content:center;
    font-size:23px;
    font-weight:bold;
    overflow:hidden;
    flex-shrink:0;
}

.avatar img{
    width:100%;
    height:100%;
    object-fit:cover;
}

.person-info{
    flex:1;
    min-width:0;
}

.person-name{
    font-size:16px;
    font-weight:700;
    margin-bottom:4px;
}

.person-type{
    color:#374151;
    font-size:13px;
    margin-bottom:4px;
}

.person-location{
    color:#6b7280;
    font-size:12px;
    margin-bottom:4px;
}

.person-rubro{
    color:#6b7280;
    font-size:12px;
}


/* BOTON */

.connect-button{
    border:0;
    background:#111827;
    color:white;
    padding:9px 12px;
    border-radius:9px;
    cursor:pointer;
    font-size:12px;
    white-space:nowrap;
}

.connect-button:hover{
    background:#1f2937;
}

.connect-button:disabled{
    opacity:.6;
    cursor:not-allowed;
}


/* MENSAJES */

.loading,
.empty{
    background:white;
    border-radius:16px;
    padding:30px 20px;
    text-align:center;
    color:#6b7280;
}


/* NAVEGACION */

.bottom-nav{
    position:fixed;
    bottom:0;
    left:0;
    right:0;
    z-index:200;
    background:white;
    border-top:1px solid #e5e7eb;
    box-shadow:0 -2px 10px rgba(0,0,0,.08);
}

.bottom-nav-inner{
    max-width:900px;
    margin:auto;
    display:flex;
    justify-content:space-around;
}

.nav-button{
    flex:1;
    border:0;
    background:white;
    padding:10px 3px 9px;
    cursor:pointer;
    color:#6b7280;
    font-size:11px;
}

.nav-button span{
    display:block;
    font-size:21px;
    margin-bottom:3px;
}

.nav-button.active{
    color:#111827;
    font-weight:700;
}


/* TOAST */

.toast{
    position:fixed;
    left:50%;
    bottom:100px;
    transform:translateX(-50%);
    background:#111827;
    color:white;
    padding:12px 17px;
    border-radius:10px;
    font-size:13px;
    display:none;
    z-index:800;
    max-width:90%;
    text-align:center;
}

.toast.show{
    display:block;
}


/* CELULAR */

@media(max-width:600px){

    .container{
        padding:12px;
    }

    .title-box h1{
        font-size:21px;
    }

    .filters{
        grid-template-columns:1fr;
    }

    .person-card{
        padding:13px;
    }

    .connect-button{
        padding:8px 10px;
    }

}

</style>

</head>


<body>


<header>

    <div class="header-inner">

        <div class="logo">
            Red GESBASE
        </div>

        <button
            class="logout"
            id="btnSalir"
        >
            Salir
        </button>

    </div>

</header>



<main class="container">


    <section class="title-box">

        <h1>
            🔎 Buscar
        </h1>

        <p>
            Encontrá personas, profesionales, trabajadores,
            empresas y comercios dentro de Red GESBASE.
        </p>

    </section>



    <section class="search-box">

        <input
            type="search"
            id="busqueda"
            class="search-input"
            placeholder="Buscar por nombre, rubro o localidad..."
            autocomplete="off"
        >


        <div class="filters">

            <select
                id="filtroTipo"
                class="filter"
            >

                <option value="">
                    Todos los perfiles
                </option>

                <option value="persona">
                    Personas
                </option>

                <option value="profesional">
                    Profesionales
                </option>

                <option value="trabajador">
                    Trabajadores
                </option>

                <option value="empresa">
                    Empresas
                </option>

                <option value="comercio">
                    Comercios
                </option>

            </select>


            <input
                type="text"
                id="filtroLocalidad"
                class="filter"
                placeholder="Localidad"
            >

        </div>

    </section>



    <div class="section-title">
        Resultados
    </div>


    <section
        id="resultados"
        class="results"
    >

        <div class="loading">
            Cargando personas y empresas...
        </div>

    </section>


</main>



<nav class="bottom-nav">

    <div class="bottom-nav-inner">


        <button
            class="nav-button"
            onclick="location.href='red.html'"
        >
            <span>🏠</span>
            Inicio
        </button>


        <button
            class="nav-button active"
            onclick="location.href='red-buscar.html'"
        >
            <span>🔎</span>
            Buscar
        </button>


        <button
            class="nav-button"
            onclick="location.href='conexiones.html'"
        >
            <span>👥</span>
            Conexiones
        </button>


        <button
            class="nav-button"
            onclick="location.href='red-notificaciones.html'"
        >
            <span>🔔</span>
            Notificaciones
        </button>


        <button
            class="nav-button"
            onclick="location.href='red-perfil.html'"
        >
            <span>👤</span>
            Perfil
        </button>


    </div>

</nav>



<div
    id="toast"
    class="toast"
></div>



<script type="module">


import {
    auth,
    db
} from "./Js/firebase.js";


import {
    onAuthStateChanged,
    signOut
} from "https://www.gstatic.com/firebasejs/12.18.0/firebase-auth.js";


import {
    collection,
    getDocs,
    query,
    where,
    addDoc,
    serverTimestamp
} from "https://www.gstatic.com/firebasejs/12.18.0/firebase-firestore.js";



const resultados =
    document.getElementById(
        "resultados"
    );


const busqueda =
    document.getElementById(
        "busqueda"
    );


const filtroTipo =
    document.getElementById(
        "filtroTipo"
    );


const filtroLocalidad =
    document.getElementById(
        "filtroLocalidad"
    );


const btnSalir =
    document.getElementById(
        "btnSalir"
    );


const toast =
    document.getElementById(
        "toast"
    );



let usuarioActual = null;

let todosLosPerfiles = [];



/* =========================
   TOAST
========================= */

function mostrarToast(
    mensaje
){

    toast.textContent =
        mensaje;

    toast.classList.add(
        "show"
    );


    setTimeout(
        () => {

            toast.classList.remove(
                "show"
            );

        },
        2500
    );

}



/* =========================
   AUTENTICACION
========================= */

onAuthStateChanged(
    auth,
    async (user) => {

        if(!user){

            window.location.href =
                "red-login.html";

            return;

        }


        usuarioActual =
            user;


        await cargarDirectorio();

    }
);



/* =========================
   CARGAR DIRECTORIO
========================= */

async function cargarDirectorio(){

    resultados.innerHTML =
        `<div class="loading">
            Cargando personas y empresas...
        </div>`;


    try{

        const referencia =
            collection(
                db,
                "directorio_red"
            );


        const snapshot =
            await getDocs(
                referencia
            );


        todosLosPerfiles = [];


        snapshot.forEach(
            documento => {

                const data =
                    documento.data();


                if(
                    data.activo === false
                ){

                    return;

                }


                todosLosPerfiles.push({

                    id:
                        documento.id,

                    ...data

                });

            }
        );


        mostrarResultados();


    }catch(error){

        console.error(
            "Error cargando directorio:",
            error
        );


        resultados.innerHTML =
            `<div class="empty">
                No se pudo cargar el directorio.
                <br><br>
                Revisá tu conexión e intentá nuevamente.
            </div>`;

    }

}



/* =========================
   BUSQUEDA
========================= */

busqueda.addEventListener(
    "input",
    mostrarResultados
);


filtroTipo.addEventListener(
    "change",
    mostrarResultados
);


filtroLocalidad.addEventListener(
    "input",
    mostrarResultados
);



function mostrarResultados(){

    const texto =
        busqueda.value
            .trim()
            .toLowerCase();


    const tipo =
        filtroTipo.value
            .trim()
            .toLowerCase();


    const localidad =
        filtroLocalidad.value
            .trim()
            .toLowerCase();


    const filtrados =
        todosLosPerfiles.filter(
            perfil => {


                const nombre =
                    String(
                        perfil.nombreCompleto || ""
                    ).toLowerCase();


                const rubro =
                    String(
                        perfil.rubro || ""
                    ).toLowerCase();


                const localidadPerfil =
                    String(
                        perfil.localidad || ""
                    ).toLowerCase();


                const provincia =
                    String(
                        perfil.provincia || ""
                    ).toLowerCase();


                const tipoPerfil =
                    String(
                        perfil.tipo || ""
                    ).toLowerCase();


                const coincideTexto =
                    !texto ||
                    nombre.includes(texto) ||
                    rubro.includes(texto) ||
                    localidadPerfil.includes(texto) ||
                    provincia.includes(texto);


                const coincideTipo =
                    !tipo ||
                    tipoPerfil === tipo;


                const coincideLocalidad =
                    !localidad ||
                    localidadPerfil.includes(
                        localidad
                    );


                return (
                    coincideTexto &&
                    coincideTipo &&
                    coincideLocalidad
                );

            }
        );


    renderizarResultados(
        filtrados
    );

}



/* =========================
   MOSTRAR RESULTADOS
========================= */

function renderizarResultados(
    perfiles
){

    resultados.innerHTML = "";


    if(
        perfiles.length === 0
    ){

        resultados.innerHTML =
            `<div class="empty">
                No encontramos resultados.
                <br><br>
                Probá con otro nombre, rubro o localidad.
            </div>`;

        return;

    }


    perfiles.forEach(
        perfil => {

            const tarjeta =
                crearTarjeta(
                    perfil
                );


            resultados.appendChild(
                tarjeta
            );

        }
    );

}



/* =========================
   TARJETA
========================= */

function crearTarjeta(
    perfil
){

    const tarjeta =
        document.createElement(
            "article"
        );


    tarjeta.className =
        "person-card";


    const avatar =
        document.createElement(
            "div"
        );


    avatar.className =
        "avatar";


    const foto =
        perfil.fotoURL ||
        perfil.fotoPerfil ||
        "";


    const nombre =
        perfil.nombreCompleto ||
        "Usuario GESBASE";


    if(foto){

        const img =
            document.createElement(
                "img"
            );


        img.src =
            foto;


        img.alt =
            "";


        img.onerror =
            () => {

                img.remove();

                avatar.textContent =
                    nombre
                        .charAt(0)
                        .toUpperCase();

            };


        avatar.appendChild(
            img
        );

    }else{

        avatar.textContent =
            nombre
                .charAt(0)
                .toUpperCase();

    }



    const info =
        document.createElement(
            "div"
        );


    info.className =
        "person-info";


    const nombreElement =
        document.createElement(
            "div"
        );


    nombreElement.className =
        "person-name";


    nombreElement.textContent =
        nombre;



    const tipoElement =
        document.createElement(
            "div"
        );


    tipoElement.className =
        "person-type";


    tipoElement.textContent =
        convertirTipo(
            perfil.tipo
        );



    const ubicacionElement =
        document.createElement(
            "div"
        );


    ubicacionElement.className =
        "person-location";


    const localidad =
        perfil.localidad ||
        "";


    const provincia =
        perfil.provincia ||
        "";


    if(
        localidad ||
        provincia
    ){

        ubicacionElement.textContent =
            `📍 ${
                localidad
            }${
                localidad && provincia
                    ? ", "
                    : ""
            }${
                provincia
            }`;

    }



    const rubroElement =
        document.createElement(
            "div"
        );


    rubroElement.className =
        "person-rubro";


    if(
        perfil.rubro
    ){

        rubroElement.textContent =
            `Rubro: ${
                perfil.rubro
            }`;

    }



    info.appendChild(
        nombreElement
    );


    info.appendChild(
        tipoElement
    );


    if(
        ubicacionElement.textContent
    ){

        info.appendChild(
            ubicacionElement
        );

    }


    if(
        perfil.rubro
    ){

        info.appendChild(
            rubroElement
        );

    }



    const boton =
        document.createElement(
            "button"
        );


    boton.className =
        "connect-button";


    boton.textContent =
        "Conectar";


    boton.addEventListener(
        "click",
        () => {

            enviarSolicitud(
                perfil,
                boton
            );

        }
    );



    tarjeta.appendChild(
        avatar
    );


    tarjeta.appendChild(
        info
    );


    tarjeta.appendChild(
        boton
    );


    return tarjeta;

}



/* =========================
   TIPO DE PERFIL
========================= */

function convertirTipo(
    tipo
){

    const valor =
        String(
            tipo || ""
        ).toLowerCase();


    const tipos = {

        persona:
            "Persona",

        profesional:
            "Profesional",

        trabajador:
            "Trabajador",

        empresa:
            "Empresa",

        comercio:
            "Comercio"

    };


    return tipos[valor] ||
        tipo ||
        "Usuario GESBASE";

}



/* =========================
   ENVIAR SOLICITUD
========================= */

async function enviarSolicitud(
    perfil,
    boton
){

    if(!usuarioActual){

        mostrarToast(
            "Debés iniciar sesión."
        );

        return;

    }


    const receptor =
        perfil.uid ||
        perfil.id;


    if(
        !receptor
    ){

        mostrarToast(
            "Este perfil no tiene un identificador válido."
        );

        return;

    }


    if(
        receptor ===
        usuarioActual.uid
    ){

        mostrarToast(
            "No podés conectarte con vos mismo."
        );

        return;

    }


    boton.disabled =
        true;


    boton.textContent =
        "Enviando...";


    try{

        await addDoc(
            collection(
                db,
                "conexiones"
            ),
            {

                emisor:
                    usuarioActual.uid,

                receptor:
                    receptor,

                estado:
                    "pendiente",

                fecha:
                    serverTimestamp()

            }
        );


        boton.textContent =
            "Solicitud enviada";


        mostrarToast(
            "Solicitud de conexión enviada."
        );


    }catch(error){

        console.error(
            "Error enviando solicitud:",
            error
        );


        boton.disabled =
            false;


        boton.textContent =
            "Conectar";


        mostrarToast(
            "No se pudo enviar la solicitud."
        );

    }

}



/* =========================
   SALIR
========================= */

btnSalir.addEventListener(
    "click",
    async () => {

        try{

            await signOut(
                auth
            );


            window.location.href =
                "red-login.html";


        }catch(error){

            console.error(
                error
            );


            mostrarToast(
                "No se pudo cerrar sesión."
            );

        }

    }
);

</script>

</body>
  </html>
