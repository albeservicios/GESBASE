<!DOCTYPE html>
<html lang="es-AR">

<head>

<meta charset="UTF-8">

<meta
    name="viewport"
    content="width=device-width, initial-scale=1.0, viewport-fit=cover"
>

<meta name="theme-color" content="#111827">

<meta
    name="description"
    content="Buscar personas, profesionales, trabajadores, empresas y comercios en Red GESBASE"
>

<title>Buscar - Red GESBASE</title>

<style>

*{
    box-sizing:border-box;
    margin:0;
    padding:0;
}

html,
body{
    width:100%;
    min-height:100%;
}

body{
    font-family:
        -apple-system,
        BlinkMacSystemFont,
        "Segoe UI",
        Roboto,
        Arial,
        sans-serif;

    background:#f3f4f6;
    color:#111827;

    padding-bottom:90px;
}

/* =========================
   HEADER
========================= */

.header{
    position:sticky;
    top:0;
    z-index:100;

    background:#111827;
    color:white;

    padding:
        calc(14px + env(safe-area-inset-top))
        16px
        14px;

    box-shadow:
        0 2px 12px rgba(0,0,0,.15);
}

.header-inner{
    width:100%;
    max-width:1100px;
    margin:auto;
}

.header-title{
    display:flex;
    align-items:center;
    gap:10px;
}

.header-icon{
    width:42px;
    height:42px;

    border-radius:50%;

    background:#1f2937;

    display:flex;
    align-items:center;
    justify-content:center;

    font-size:21px;
}

.header-title h1{
    font-size:20px;
    font-weight:700;
}

.header-title p{
    font-size:12px;
    color:#9ca3af;
    margin-top:2px;
}

/* =========================
   CONTENEDOR
========================= */

.container{
    width:100%;
    max-width:1000px;

    margin:auto;

    padding:18px 14px 30px;
}

/* =========================
   BUSCADOR
========================= */

.search-card{
    background:white;

    border-radius:16px;

    padding:16px;

    box-shadow:
        0 2px 10px rgba(0,0,0,.06);

    margin-bottom:14px;
}

.search-box{
    display:flex;
    align-items:center;
    gap:10px;

    background:#f3f4f6;

    border:1px solid #e5e7eb;

    border-radius:13px;

    padding:0 13px;
}

.search-box span{
    font-size:20px;
}

.search-box input{
    width:100%;

    border:0;
    outline:0;

    background:transparent;

    padding:14px 0;

    font-size:15px;
    color:#111827;
}

.search-box input::placeholder{
    color:#9ca3af;
}

/* =========================
   FILTROS
========================= */

.filters{
    display:flex;

    gap:8px;

    overflow-x:auto;

    padding-top:13px;

    scrollbar-width:none;
}

.filters::-webkit-scrollbar{
    display:none;
}

.filter-btn{
    flex-shrink:0;

    border:1px solid #e5e7eb;

    background:white;

    color:#4b5563;

    border-radius:20px;

    padding:8px 13px;

    font-size:12px;

    cursor:pointer;

    white-space:nowrap;
}

.filter-btn.active{
    background:#111827;
    color:white;
    border-color:#111827;
}

/* =========================
   LOCALIDAD
========================= */

.locality-box{
    margin-top:10px;
}

.locality-box input{
    width:100%;

    border:1px solid #e5e7eb;

    border-radius:11px;

    padding:11px 12px;

    outline:none;

    font-size:13px;

    background:#fff;
}

.locality-box input:focus{
    border-color:#9ca3af;
}

/* =========================
   RESULTADOS
========================= */

.results-header{
    display:flex;
    align-items:center;
    justify-content:space-between;

    margin:15px 3px 10px;
}

.results-header h2{
    font-size:17px;
}

.results-count{
    font-size:12px;
    color:#6b7280;
}

/* =========================
   LISTA
========================= */

#resultados{
    display:grid;

    grid-template-columns:1fr;

    gap:10px;
}

/* =========================
   TARJETA PERFIL
========================= */

.profile-card{
    background:white;

    border-radius:16px;

    padding:15px;

    box-shadow:
        0 2px 9px rgba(0,0,0,.05);

    display:flex;
    align-items:center;

    gap:13px;
}

.avatar{
    width:55px;
    height:55px;

    min-width:55px;

    border-radius:50%;

    overflow:hidden;

    background:#e5e7eb;

    display:flex;
    align-items:center;
    justify-content:center;

    font-size:23px;
    font-weight:700;

    color:#4b5563;
}

.avatar img{
    width:100%;
    height:100%;

    object-fit:cover;
}

.profile-info{
    flex:1;
    min-width:0;
}

.profile-name{
    font-size:15px;
    font-weight:700;

    color:#111827;

    overflow:hidden;
    text-overflow:ellipsis;
    white-space:nowrap;
}

.profile-type{
    display:inline-block;

    font-size:11px;

    color:#4f46e5;

    margin-top:3px;
}

.profile-location{
    font-size:12px;

    color:#6b7280;

    margin-top:4px;

    overflow:hidden;
    text-overflow:ellipsis;
    white-space:nowrap;
}

.profile-rubro{
    font-size:12px;

    color:#6b7280;

    margin-top:2px;

    overflow:hidden;
    text-overflow:ellipsis;
    white-space:nowrap;
}

/* =========================
   BOTÓN CONECTAR
========================= */

.connect-btn{
    flex-shrink:0;

    border:0;

    background:#111827;
    color:white;

    border-radius:11px;

    padding:10px 13px;

    font-size:12px;
    font-weight:700;

    cursor:pointer;

    min-width:86px;
}

.connect-btn:active{
    transform:scale(.97);
}

.connect-btn:disabled{
    opacity:.55;
    cursor:not-allowed;
}

.connect-btn.connected{
    background:#e5e7eb;
    color:#374151;
}

/* =========================
   VACÍO
========================= */

.empty{
    background:white;

    border-radius:17px;

    padding:42px 20px;

    text-align:center;

    box-shadow:
        0 2px 10px rgba(0,0,0,.05);
}

.empty-icon{
    font-size:45px;

    margin-bottom:12px;
}

.empty h3{
    font-size:18px;

    margin-bottom:6px;
}

.empty p{
    color:#6b7280;

    font-size:13px;

    line-height:1.5;
}

/* =========================
   LOADING
========================= */

.loading{
    background:white;

    border-radius:16px;

    padding:35px;

    text-align:center;

    color:#6b7280;
}

.spinner{
    width:30px;
    height:30px;

    margin:0 auto 12px;

    border:3px solid #e5e7eb;
    border-top-color:#111827;

    border-radius:50%;

    animation:girar .8s linear infinite;
}

@keyframes girar{

    to{
        transform:rotate(360deg);
    }

}

/* =========================
   TOAST
========================= */

.toast{
    position:fixed;

    left:50%;
    bottom:100px;

    transform:
        translateX(-50%)
        translateY(20px);

    z-index:500;

    background:#111827;
    color:white;

    padding:12px 17px;

    border-radius:12px;

    font-size:13px;

    box-shadow:
        0 5px 20px rgba(0,0,0,.2);

    opacity:0;

    pointer-events:none;

    transition:
        opacity .2s ease,
        transform .2s ease;

    max-width:
        calc(100% - 30px);

    text-align:center;
}

.toast.show{
    opacity:1;

    transform:
        translateX(-50%)
        translateY(0);
}

/* =========================
   NAVEGACIÓN
========================= */

.bottom-nav{
    position:fixed;

    left:0;
    right:0;
    bottom:0;

    z-index:200;

    background:white;

    border-top:1px solid #e5e7eb;

    padding:
        8px
        8px
        calc(8px + env(safe-area-inset-bottom));

    box-shadow:
        0 -3px 15px rgba(0,0,0,.08);
}

.bottom-nav-inner{
    width:100%;
    max-width:700px;

    margin:auto;

    display:grid;

    grid-template-columns:
        repeat(5,1fr);

    gap:3px;
}

.nav-item{
    position:relative;

    border:0;
    background:transparent;

    color:#6b7280;

    padding:7px 2px;

    border-radius:10px;

    cursor:pointer;

    display:flex;
    flex-direction:column;

    align-items:center;
    justify-content:center;

    gap:3px;

    font-size:10px;
}

.nav-item span:first-child{
    font-size:21px;
    line-height:22px;
}

.nav-item.active{
    color:#111827;

    background:#f3f4f6;
}

.nav-badge{
    position:absolute;

    top:1px;
    right:calc(50% - 18px);

    min-width:16px;
    height:16px;

    padding:0 4px;

    border-radius:20px;

    background:#ef4444;
    color:white;

    display:none;

    align-items:center;
    justify-content:center;

    font-size:9px;
    font-weight:800;

    border:2px solid white;
}

/* =========================
   TABLET
========================= */

@media (min-width:700px){

    .container{
        padding:25px 22px 35px;
    }

    #resultados{
        grid-template-columns:
            repeat(2,1fr);
    }

}

/* =========================
   DESKTOP
========================= */

@media (min-width:1000px){

    body{
        padding-bottom:20px;
    }

    .container{
        padding-top:30px;
    }

    #resultados{
        grid-template-columns:
            repeat(2,1fr);
    }

    .bottom-nav{
        position:static;

        background:transparent;

        border:0;

        box-shadow:none;

        padding:
            0 20px 25px;
    }

    .bottom-nav-inner{
        background:white;

        border-radius:15px;

        padding:7px;

        box-shadow:
            0 2px 10px rgba(0,0,0,.05);
    }

}

</style>

</head>

<body>

========================= -->

<!-- =========================
     FIREBASE
========================= -->

<script type="module">

import {
    auth,
    db
} from "./Js/firebase.js";


import {
    onAuthStateChanged
} from "https://www.gstatic.com/firebasejs/12.18.0/firebase-auth.js";


import {
    collection,
    getDocs,
    addDoc,
    query,
    where,
    serverTimestamp
} from "https://www.gstatic.com/firebasejs/12.18.0/firebase-firestore.js";


/* =========================
   ELEMENTOS
========================= */

const busqueda =
    document.getElementById(
        "busqueda"
    );

const localidad =
    document.getElementById(
        "localidad"
    );

const resultados =
    document.getElementById(
        "resultados"
    );

const contadorResultados =
    document.getElementById(
        "contadorResultados"
    );

const toast =
    document.getElementById(
        "toast"
    );


let usuarioActual = null;

let perfiles = [];

let tipoSeleccionado = "todos";


/* =========================
   NAVEGACIÓN
========================= */

window.irA = function(ruta){

    window.location.href = ruta;

};


/* =========================
   AUTH
========================= */

onAuthStateChanged(
    auth,
    async (user) => {

        if(!user){

            window.location.href =
                "red-login.html";

            return;

        }

        usuarioActual = user;

        await cargarPerfiles();

    }
);


/* =========================
   CARGAR DIRECTORIO
========================= */

async function cargarPerfiles(){

    resultados.innerHTML = `

        <div class="loading">

            <div class="spinner"></div>

            Cargando perfiles...

        </div>

    `;


    try{

        const snapshot =
            await getDocs(
                collection(
                    db,
                    "directorio_red"
                )
            );


        perfiles =
            snapshot.docs.map(
                documento => ({

                    id:
                        documento.id,

                    ...documento.data()

                })
            );


        perfiles =
            perfiles.filter(
                perfil =>
                    perfil.activo !== false
            );


        aplicarFiltros();

    }
    catch(error){

        console.error(
            "Error cargando perfiles:",
            error
        );


        resultados.innerHTML = `

            <div class="empty">

                <div class="empty-icon">
                    ⚠️
                </div>

                <h3>
                    No se pudieron cargar los perfiles
                </h3>

                <p>
                    ${escaparHTML(error.message)}
                </p>

            </div>

        `;

    }

}


/* =========================
   FILTROS
========================= */

document.querySelectorAll(
    ".filter-btn"
).forEach(
    boton => {

        boton.addEventListener(
            "click",
            () => {

                document
                    .querySelectorAll(
                        ".filter-btn"
                    )
                    .forEach(
                        b =>
                            b.classList.remove(
                                "active"
                            )
                    );


                boton.classList.add(
                    "active"
                );


                tipoSeleccionado =
                    boton.dataset.tipo;


                aplicarFiltros();

            }
        );

    }
);


busqueda.addEventListener(
    "input",
    aplicarFiltros
);


localidad.addEventListener(
    "input",
    aplicarFiltros
);


/* =========================
   APLICAR FILTROS
========================= */

function aplicarFiltros(){

    const texto =
        busqueda.value
            .trim()
            .toLowerCase();


    const localidadTexto =
        localidad.value
            .trim()
            .toLowerCase();


    const filtrados =
        perfiles.filter(
            perfil => {

                const nombre =
                    String(
                        perfil.nombreCompleto ||
                        perfil.nombre ||
                        ""
                    )
                    .toLowerCase();


                const rubro =
                    String(
                        perfil.rubro ||
                        ""
                    )
                    .toLowerCase();


                const localidadPerfil =
                    String(
                        perfil.localidad ||
                        ""
                    )
                    .toLowerCase();


                const provincia =
                    String(
                        perfil.provincia ||
                        ""
                    )
                    .toLowerCase();


                const tipo =
                    normalizarTipo(
                        perfil.tipo ||
                        perfil.tipoPerfil ||
                        ""
                    );


                const coincideTexto =
                    !texto
                    ||
                    nombre.includes(texto)
                    ||
                    rubro.includes(texto)
                    ||
                    localidadPerfil.includes(texto)
                    ||
                    provincia.includes(texto);


                const coincideLocalidad =
                    !localidadTexto
                    ||
                    localidadPerfil.includes(
                        localidadTexto
                    )
                    ||
                    provincia.includes(
                        localidadTexto
                    );


                const coincideTipo =
                    tipoSeleccionado ===
                    "todos"
                    ||
                    tipo ===
                    tipoSeleccionado;


                return (
                    coincideTexto
                    &&
                    coincideLocalidad
                    &&
                    coincideTipo
                );

            }
        );


    renderizar(
        filtrados
    );

}


/* =========================
   RENDER
========================= */

function renderizar(
    lista
){

    resultados.innerHTML = "";


    contadorResultados.textContent =
        `${lista.length} ${
            lista.length === 1
                ? "resultado"
                : "resultados"
        }`;


    if(lista.length === 0){

        resultados.innerHTML = `

            <div class="empty">

                <div class="empty-icon">
                    🔎
                </div>

                <h3>
                    No encontramos perfiles
                </h3>

                <p>
                    Probá con otro nombre,
                    rubro o localidad.
                </p>

            </div>

        `;

        return;

    }


    lista.forEach(
        perfil => {

            resultados.appendChild(
                crearTarjeta(
                    perfil
                )
            );

        }
    );

}


/* =========================
   TARJETA
========================= */

function crearTarjeta(
    perfil
){

    const tarjeta =
        document.createElement(
            "article"
        );


    tarjeta.className =
        "profile-card";


    const nombre =
        perfil.nombreCompleto ||
        perfil.nombre ||
        "Usuario GESBASE";


    const tipo =
        mostrarTipo(
            perfil.tipo ||
            perfil.tipoPerfil ||
            ""
        );


    const rubro =
        perfil.rubro ||
        "";


    const localidadPerfil =
        perfil.localidad ||
        "";


    const provincia =
        perfil.provincia ||
        "";


    const ubicacion =
        [localidadPerfil, provincia]
            .filter(Boolean)
            .join(", ");


    const foto =
        perfil.fotoURL ||
        perfil.fotoPerfil ||
        "";


    const uidPerfil =
        perfil.uid ||
        perfil.id;


    const esMismoUsuario =
        uidPerfil ===
        usuarioActual.uid;


    tarjeta.innerHTML = `

        <div class="avatar">

            ${
                foto
                    ? `
                        <img
                            src="${escaparAtributo(foto)}"
                            alt=""
                        >
                    `
                    : `
                        ${obtenerIniciales(nombre)}
                    `
            }

        </div>


        <div class="profile-info">

            <div class="profile-name">
                ${escaparHTML(nombre)}
            </div>


            <div class="profile-type">
                ${escaparHTML(tipo)}
            </div>


            ${
                ubicacion
                    ? `
                        <div class="profile-location">
                            📍 ${escaparHTML(ubicacion)}
                        </div>
                    `
                    : ""
            }


            ${
                rubro
                    ? `
                        <div class="profile-rubro">
                            🔧 ${escaparHTML(rubro)}
                        </div>
                    `
                    : ""
            }

        </div>


        ${
            esMismoUsuario
                ? `
                    <button
                        class="connect-btn connected"
                        disabled
                    >
                        Tu perfil
                    </button>
                `
                : `
                    <button
                        class="connect-btn"
                        data-uid="${escaparAtributo(uidPerfil)}"
                    >
                        Conectar
                    </button>
                `
        }

    `;


    const boton =
        tarjeta.querySelector(
            ".connect-btn:not(:disabled)"
        );


    if(boton){

        boton.addEventListener(
            "click",
            async (evento) => {

                evento.stopPropagation();

                await enviarSolicitud(
                    perfil,
                    boton
                );

            }
        );

    }


    return tarjeta;

}


/* =========================
   ENVIAR SOLICITUD
========================= */

async function enviarSolicitud(
    perfil,
    boton
){

    const receptorUid =
        perfil.uid ||
        perfil.id;


    if(
        !receptorUid
    ){

        mostrarToast(
            "Este perfil no tiene un identificador válido."
        );

        return;

    }


    if(
        receptorUid ===
        usuarioActual.uid
    ){

        mostrarToast(
            "No podés conectarte con vos mismo."
        );

        return;

    }


    boton.disabled =
        true;

    boton.textContent =
        "Verificando...";


    try{

        /*
         * Buscamos solicitudes enviadas
         * por el usuario actual.
         */

        const enviadasQuery =
            query(
                collection(
                    db,
                    "conexiones"
                ),
                where(
                    "emisor",
                    "==",
                    usuarioActual.uid
                )
            );


        /*
         * Buscamos solicitudes recibidas
         * por el usuario actual.
         */

        const recibidasQuery =
            query(
                collection(
                    db,
                    "conexiones"
                ),
                where(
                    "receptor",
                    "==",
                    usuarioActual.uid
                )
            );


        const [
            enviadasSnapshot,
            recibidasSnapshot
        ] =
            await Promise.all([

                getDocs(
                    enviadasQuery
                ),

                getDocs(
                    recibidasQuery
                )

            ]);


        /*
         * Revisamos si ya existe
         * cualquier conexión entre ambos.
         */

        let conexionExistente =
            null;


        enviadasSnapshot.forEach(
            documento => {

                const data =
                    documento.data();


                if(
                    data.receptor ===
                    receptorUid
                ){

                    conexionExistente = data;

                }

            }
        );


        recibidasSnapshot.forEach(
            documento => {

                const data =
                    documento.data();


                if(
                    data.emisor ===
                    receptorUid
                ){

                    conexionExistente = data;

                }

            }
        );


        if(
            conexionExistente
        ){

            if(
                conexionExistente.estado ===
                "aceptada"
            ){

                boton.textContent =
                    "Conectados";

                boton.classList.add(
                    "connected"
                );

                mostrarToast(
                    "Ya están conectados."
                );

            }
            else if(
                conexionExistente.estado ===
                "pendiente"
            ){

                boton.textContent =
                    "Pendiente";

                boton.classList.add(
                    "connected"
                );

                mostrarToast(
                    "La solicitud ya existe."
                );

            }
            else{

                boton.disabled =
                    false;

                boton.textContent =
                    "Conectar";

            }

            return;

        }


        /*
         * Creamos la conexión.
         */

        const conexion =
            await addDoc(

                collection(
                    db,
                    "conexiones"
                ),

                {

                    emisor:
                        usuarioActual.uid,

                    receptor:
                        receptorUid,

                    estado:
                        "pendiente",

                    fecha:
                        serverTimestamp()

                }

            );


        /*
         * Creamos la notificación
         * para el receptor.
         */

        await addDoc(

            collection(
                db,
                "notificaciones"
            ),

            {

                receptorUid:
                    receptorUid,

                emisorUid:
                    usuarioActual.uid,

                tipo:
                    "solicitud_conexion",

                titulo:
                    "Nueva solicitud de conexión",

                mensaje:
                    `${obtenerNombreUsuario()} quiere conectarse contigo.`,

                leida:
                    false,

                fecha:
                    serverTimestamp(),

                referenciaId:
                    conexion.id,

                url:
                    "conexiones.html"

            }

        );


        boton.textContent =
            "Pendiente";


        boton.classList.add(
            "connected"
        );


        mostrarToast(
            "Solicitud enviada correctamente."
        );

    }
    catch(error){

        console.error(
            "Error enviando solicitud:",
            error
        );


        boton.disabled =
            false;

        boton.textContent =
            "Conectar";


        mostrarToast(
            "No se pudo enviar la solicitud."
        );

    }

}


/* =========================
   NOMBRE USUARIO
========================= */

function obtenerNombreUsuario(){

    return (
        usuarioActual.displayName
        ||
        usuarioActual.email
        ||
        "Un usuario"
    );

}


/* =========================
   NORMALIZAR TIPO
========================= */

function normalizarTipo(
    tipo
){

    const valor =
        String(tipo)
            .trim()
            .toLowerCase();


    if(
        valor.includes(
            "profesional"
        )
    ){

        return "profesional";

    }


    if(
        valor.includes(
            "trabajador"
        )
    ){

        return "trabajador";

    }


    if(
        valor.includes(
            "empresa"
        )
    ){

        return "empresa";

    }


    if(
        valor.includes(
            "comercio"
        )
        ||
        valor.includes(
            "comerciante"
        )
    ){

        return "comercio";

    }


    if(
        valor.includes(
            "persona"
        )
        ||
        valor.includes(
            "usuario"
        )
    ){

        return "persona";

    }


    return valor;

}


/* =========================
   MOSTRAR TIPO
========================= */

function mostrarTipo(
    tipo
){

    const normalizado =
        normalizarTipo(
            tipo
        );


    switch(
        normalizado
    ){

        case "profesional":
            return "Profesional";

        case "trabajador":
            return "Trabajador";

        case "empresa":
            return "Empresa";

        case "comercio":
            return "Comercio";

        case "persona":
            return "Persona";

        default:
            return tipo ||
                "Usuario GESBASE";

    }

}


/* =========================
   INICIALES
========================= */

function obtenerIniciales(
    nombre
){

    const partes =
        String(nombre)
            .trim()
            .split(/\s+/)
            .filter(Boolean);


    if(
        partes.length === 0
    ){

        return "G";

    }


    if(
        partes.length === 1
    ){

        return partes[0]
            .charAt(0)
            .toUpperCase();

    }


    return (
        partes[0].charAt(0)
        +
        partes[1].charAt(0)
    ).toUpperCase();

}


/* =========================
   ESCAPAR HTML
========================= */

function escaparHTML(
    texto
){

    return String(
        texto ?? ""
    )
    .replaceAll(
        "&",
        "&amp;"
    )
    .replaceAll(
        "<",
        "&lt;"
    )
    .replaceAll(
        ">",
        "&gt;"
    )
    .replaceAll(
        '"',
        "&quot;"
    )
    .replaceAll(
        "'",
        "&#039;"
    );

}


/* =========================
   ESCAPAR ATRIBUTO
========================= */

function escaparAtributo(
    texto
){

    return escaparHTML(
        texto
    );

}


/* =========================
   TOAST
========================= */

let toastTimer = null;


function mostrarToast(
    texto
){

    toast.textContent =
        texto;


    toast.classList.add(
        "show"
    );


    clearTimeout(
        toastTimer
    );


    toastTimer =
        setTimeout(
            () => {

                toast.classList.remove(
                    "show"
                );

            },
            2600
        );

}
