/* ==========================================
   FIREBASE
========================================== */

import {
    auth,
    db
} from "./Js/firebase.js";


import {
    onAuthStateChanged
} from "https://www.gstatic.com/firebasejs/12.18.0/firebase-auth.js";


import {
    collection,
    getDocs,
    getDoc,
    doc,
    addDoc,
    setDoc,
    query,
    where,
    serverTimestamp
} from "https://www.gstatic.com/firebasejs/12.18.0/firebase-firestore.js";



/* ==========================================
   VARIABLES
========================================== */

let usuarioActual = null;

let perfiles = [];

let filtroTipo =
    "todos";


/* ==========================================
   ELEMENTOS
========================================== */

const inputBuscar =
    document.getElementById(
        "inputBuscar"
    );

const inputLocalidad =
    document.getElementById(
        "inputLocalidad"
    );

const resultados =
    document.getElementById(
        "resultados"
    );

const contador =
    document.getElementById(
        "contador"
    );

const toast =
    document.getElementById(
        "toast"
    );



/* ==========================================
   TOAST
========================================== */

function mostrarToast(
    mensaje
){

    toast.textContent =
        mensaje;

    toast.classList.add(
        "show"
    );


    setTimeout(() => {

        toast.classList.remove(
            "show"
        );

    },3000);

}



/* ==========================================
   NORMALIZAR TEXTO
========================================== */

function normalizar(
    texto
){

    return String(
        texto || ""
    )
    .normalize(
        "NFD"
    )
    .replace(
        /[\u0300-\u036f]/g,
        ""
    )
    .toLowerCase()
    .trim();

}



/* ==========================================
   CAPITALIZAR
========================================== */

function capitalizar(
    texto
){

    if(!texto){
        return "";
    }


    return texto
        .charAt(0)
        .toUpperCase() +
        texto.slice(1);

}



/* ==========================================
   INICIALES
========================================== */

function iniciales(
    nombre
){

    const partes =
        String(nombre || "")
            .trim()
            .split(/\s+/)
            .filter(Boolean);


    if(
        partes.length === 0
    ){

        return "U";

    }


    if(
        partes.length === 1
    ){

        return partes[0]
            .substring(0,2)
            .toUpperCase();

    }


    return (
        partes[0][0] +
        partes[1][0]
    ).toUpperCase();

}



/* ==========================================
   ESCAPAR HTML
========================================== */

function escaparHTML(
    valor
){

    const div =
        document.createElement(
            "div"
        );


    div.textContent =
        valor ?? "";


    return div.innerHTML;

}



/* ==========================================
   OBTENER NOMBRE
========================================== */

function obtenerNombre(
    perfil
){

    if(
        perfil.nombreCompleto
    ){

        return perfil.nombreCompleto;

    }


    const nombre =
        perfil.nombre ||
        "";

    const apellido =
        perfil.apellido ||
        "";


    const completo =
        `${nombre} ${apellido}`.trim();


    return (
        completo ||
        "Usuario GESBASE"
    );

}



/* ==========================================
   SINCRONIZAR USUARIO ACTUAL
========================================== */

/*
 * IMPORTANTE:
 *
 * Por las reglas actuales de Firestore,
 * solamente podemos leer usuariosRed/{uid}
 * del usuario autenticado.
 *
 * Por eso esta función sincroniza al
 * usuario que está usando la aplicación.
 */

async function sincronizarUsuarioActual(){

    if(!usuarioActual){
        return;
    }


    try{

        const referencia =
            doc(
                db,
                "usuariosRed",
                usuarioActual.uid
            );


        const snap =
            await getDoc(
                referencia
            );


        if(!snap.exists()){

            return;

        }


        const perfil =
            snap.data();


        await setDoc(

            doc(
                db,
                "directorio_red",
                usuarioActual.uid
            ),

            {

                uid:
                    usuarioActual.uid,

                nombreCompleto:
                    obtenerNombre(perfil),

                tipo:
                    perfil.tipoPerfil ||
                    "persona",

                rubro:
                    perfil.rubro ||
                    "",

                localidad:
                    perfil.localidad ||
                    "",

                provincia:
                    perfil.provincia ||
                    "",

                fotoURL:
                    perfil.fotoPerfil ||
                    "",

                fotoPortada:
                    perfil.fotoPortada ||
                    "",

                activo:
                    perfil.visible !== false

            },

            {
                merge:true
            }

        );


    }catch(error){

        console.error(
            "No se pudo sincronizar usuario:",
            error
        );

    }

}



/* ==========================================
   CARGAR DIRECTORIO
========================================== */

async function cargarDirectorio(){

    resultados.innerHTML =
        `
        <div class="loading">
            Cargando usuarios...
        </div>
        `;


    try{

        /*
         * Primero aseguramos que el usuario
         * actual esté en el directorio.
         */

        await sincronizarUsuarioActual();


        /*
         * Leemos directorio_red completo.
         *
         * No usamos where + orderBy.
         * Así evitamos problemas de índices.
         */

        const snapshot =
            await getDocs(
                collection(
                    db,
                    "directorio_red"
                )
            );


        perfiles = [];


        snapshot.forEach(
            (documento) => {

                const data =
                    documento.data();


                perfiles.push({

                    id:
                        documento.id,

                    ...data

                });

            }
        );


        /*
         * Orden alfabético.
         */

        perfiles.sort(
            (a,b) => {

                return normalizar(
                    a.nombreCompleto
                )
                .localeCompare(
                    normalizar(
                        b.nombreCompleto
                    ),
                    "es"
                );

            }
        );


        renderizarResultados();


    }catch(error){

        console.error(
            "Error cargando directorio:",
            error
        );


        resultados.innerHTML =
            `
            <div class="error">

                No se pudo cargar el directorio.

                <br><br>

                <small>
                    ${escaparHTML(
                        error.message
                    )}
                </small>

            </div>
            `;

    }

}



/* ==========================================
   FILTRAR
========================================== */

function obtenerResultadosFiltrados(){

    const texto =
        normalizar(
            inputBuscar.value
        );


    const localidad =
        normalizar(
            inputLocalidad.value
        );


    return perfiles.filter(
        (perfil) => {


            /*
             * Nunca mostrar el propio perfil.
             */

            if(
                perfil.uid ===
                usuarioActual.uid
            ){

                return false;

            }


            /*
             * Usuarios inactivos no aparecen.
             */

            if(
                perfil.activo === false
            ){

                return false;

            }


            /*
             * FILTRO DE TIPO
             */

            if(
                filtroTipo !==
                "todos"
            ){

                const tipo =
                    normalizar(
                        perfil.tipo
                    );


                if(
                    tipo !==
                    normalizar(
                        filtroTipo
                    )
                ){

                    return false;

                }

            }


            /*
             * BUSQUEDA GENERAL
             */

            if(texto){

                const contenido = [

                    perfil.nombreCompleto,

                    perfil.nombre,

                    perfil.apellido,

                    perfil.rubro,

                    perfil.localidad,

                    perfil.provincia,

                    perfil.tipo

                ]
                .map(
                    normalizar
                )
                .join(" ");


                if(
                    !contenido.includes(
                        texto
                    )
                ){

                    return false;

                }

            }


            /*
             * LOCALIDAD / PROVINCIA
             */

            if(localidad){

                const ubicacion = [

                    perfil.localidad,

                    perfil.provincia

                ]
                .map(
                    normalizar
                )
                .join(" ");


                if(
                    !ubicacion.includes(
                        localidad
                    )
                ){

                    return false;

                }

            }


            return true;

        }
    );

}



/* ==========================================
   RENDER RESULTADOS
========================================== */

async function renderizarResultados(){

    const lista =
        obtenerResultadosFiltrados();


    contador.textContent =
        `${lista.length} ${
            lista.length === 1
                ? "resultado"
                : "resultados"
        }`;


    resultados.innerHTML =
        "";


    if(
        lista.length === 0
    ){

        resultados.innerHTML =
            `
            <div class="empty">

                <div
                    style="
                        font-size:42px;
                        margin-bottom:10px;
                    "
                >
                    🔎
                </div>

                <strong>
                    No encontramos resultados.
                </strong>

                <br><br>

                Probá con otro nombre,
                rubro o localidad.

            </div>
            `;

        return;

    }


    /*
     * Primero cargamos el estado de
     * conexión de los resultados.
     */

    for(
        const perfil of lista
    ){

        const estado =
            await obtenerEstadoConexion(
                perfil.uid
            );


        crearTarjeta(
            perfil,
            estado
        );

    }

}



/* ==========================================
   OBTENER ESTADO CONEXION
========================================== */

async function obtenerEstadoConexion(
    receptorUid
){

    if(
        receptorUid ===
        usuarioActual.uid
    ){

        return "propio";

    }


    try{

        /*
         * Solicitudes enviadas.
         */

        const enviadas =
            await getDocs(
                query(
                    collection(
                        db,
                        "conexiones"
                    ),
                    where(
                        "emisor",
                        "==",
                        usuarioActual.uid
                    )
                )
            );


        for(
            const documento of enviadas.docs
        ){

            const conexion =
                documento.data();


            if(
                conexion.receptor ===
                receptorUid
            ){

                if(
                    conexion.estado ===
                    "aceptada"
                ){

                    return "aceptada";

                }


                if(
                    conexion.estado ===
                    "pendiente"
                ){

                    return "pendiente_enviada";

                }

            }

        }


        /*
         * Solicitudes recibidas.
         */

        const recibidas =
            await getDocs(
                query(
                    collection(
                        db,
                        "conexiones"
                    ),
                    where(
                        "receptor",
                        "==",
                        usuarioActual.uid
                    )
                )
            );


        for(
            const documento of recibidas.docs
        ){

            const conexion =
                documento.data();


            if(
                conexion.emisor ===
                receptorUid
            ){

                if(
                    conexion.estado ===
                    "aceptada"
                ){

                    return "aceptada";

                }


                if(
                    conexion.estado ===
                    "pendiente"
                ){

                    return "pendiente_recibida";

                }

            }

        }


        return "ninguna";


    }catch(error){

        console.error(
            "Error comprobando conexión:",
            error
        );


        return "ninguna";

    }

}



/* ==========================================
   CREAR TARJETA
========================================== */

function crearTarjeta(
    perfil,
    estado
){

    const tarjeta =
        document.createElement(
            "article"
        );


    tarjeta.className =
        "user-card";


    const nombre =
        obtenerNombre(
            perfil
        );


    const foto =
        perfil.fotoURL ||
        perfil.fotoPerfil ||
        "";


    let avatarHTML;


    if(foto){

        avatarHTML =
            `
            <img
                src="${escaparHTML(
                    foto
                )}"
                alt=""
                onerror="
                    this.style.display='none';
                    this.parentElement.textContent='${escaparHTML(
                        iniciales(nombre)
                    )}';
                "
            >
            `;

    }else{

        avatarHTML =
            escaparHTML(
                iniciales(nombre)
            );

    }


    const ubicacion = [

        perfil.localidad,

        perfil.provincia

    ]
    .filter(Boolean)
    .join(
        ", "
    );


    const rubro =
        perfil.rubro ||
        "";


    let botonTexto =
        "Conectar";


    let botonClase =
        "";


    let disabled =
        "";


    if(
        estado ===
        "aceptada"
    ){

        botonTexto =
            "✓ Conectados";

        botonClase =
            "connected";

        disabled =
            "disabled";

    }


    if(
        estado ===
        "pendiente_enviada"
    ){

        botonTexto =
            "Pendiente";

        botonClase =
            "pending";

        disabled =
            "disabled";

    }


    if(
        estado ===
        "pendiente_recibida"
    ){

        botonTexto =
            "Responder";

        botonClase =
            "";

    }


    tarjeta.innerHTML =
        `

        <div class="avatar">

            ${avatarHTML}

        </div>


        <div class="user-info">

            <div class="user-name">

                ${escaparHTML(
                    nombre
                )}

            </div>


            <div class="user-type">

                ${escaparHTML(
                    capitalizar(
                        perfil.tipo ||
                        "persona"
                    )
                )}

            </div>


            ${
                ubicacion

                ?

                `
                <div class="user-location">

                    📍 ${escaparHTML(
                        ubicacion
                    )}

                </div>
                `

                :

                ""

            }


            ${
                rubro

                ?

                `
                <div class="user-rubro">

                    🔧 ${escaparHTML(
                        rubro
                    )}

                </div>
                `

                :

                ""

            }

        </div>


        <div class="card-action">

            <button
                class="connect-btn ${botonClase}"
                data-uid="${escaparHTML(
                    perfil.uid
                )}"
                data-estado="${escaparHTML(
                    estado
                )}"
                ${disabled}
            >
                ${botonTexto}
            </button>

        </div>

        `;


    resultados.appendChild(
        tarjeta
    );

}



/* ==========================================
   CONECTAR
========================================== */

async function enviarSolicitud(
    receptorUid,
    boton
){

    if(
        !usuarioActual ||
        !receptorUid
    ){

        return;

    }


    if(
        receptorUid ===
        usuarioActual.uid
    ){

        mostrarToast(
            "No podés conectarte con vos mismo."
        );

        return;

    }


    boton.disabled =
        true;

    boton.textContent =
        "Enviando...";


    try{

        /*
         * Comprobamos primero solicitudes
         * enviadas.
         */

        const enviadas =
            await getDocs(
                query(
                    collection(
                        db,
                        "conexiones"
                    ),
                    where(
                        "emisor",
                        "==",
                        usuarioActual.uid
                    )
                )
            );


        for(
            const documento of enviadas.docs
        ){

            const conexion =
                documento.data();


            if(
                conexion.receptor ===
                receptorUid
            ){

                if(
                    conexion.estado ===
                    "aceptada"
                ){

                    boton.textContent =
                        "✓ Conectados";

                    boton.classList.add(
                        "connected"
                    );

                    return;

                }


                if(
                    conexion.estado ===
                    "pendiente"
                ){

                    boton.textContent =
                        "Pendiente";

                    boton.classList.add(
                        "pending"
                    );

                    return;

                }

            }

        }


        /*
         * Comprobamos solicitudes recibidas.
         */

        const recibidas =
            await getDocs(
                query(
                    collection(
                        db,
                        "conexiones"
                    ),
                    where(
                        "receptor",
                        "==",
                        usuarioActual.uid
                    )
                )
            );


        for(
            const documento of recibidas.docs
        ){

            const conexion =
                documento.data();


            if(
                conexion.emisor ===
                receptorUid
            ){

                if(
                    conexion.estado ===
                    "aceptada"
                ){

                    boton.textContent =
                        "✓ Conectados";

                    boton.classList.add(
                        "connected"
                    );

                    return;

                }


                if(
                    conexion.estado ===
                    "pendiente"
                ){

                    boton.textContent =
                        "Responder";

                    boton.disabled =
                        false;

                    return;

                }

            }

        }


        /*
         * CREAR SOLICITUD
         */

        const conexionRef =
            await addDoc(
                collection(
                    db,
                    "conexiones"
                ),
                {

                    emisor:
                        usuarioActual.uid,

                    receptor:
                        receptorUid,

                    estado:
                        "pendiente",

                    fecha:
                        serverTimestamp()

                }
            );


        /*
         * OBTENER NOMBRE DEL EMISOR.
         *
         * Solamente podemos leer
         * nuestro propio usuariosRed.
         */

        const miPerfil =
            await getDoc(
                doc(
                    db,
                    "usuariosRed",
                    usuarioActual.uid
                )
            );


        let nombreEmisor =
            usuarioActual.displayName ||
            "Usuario GESBASE";


        if(
            miPerfil.exists()
        ){

            nombreEmisor =
                obtenerNombre(
                    miPerfil.data()
                );

        }


        /*
         * CREAR NOTIFICACION
         */

        await addDoc(
            collection(
                db,
                "notificaciones"
            ),
            {

                receptorUid:
                    receptorUid,

                emisorUid:
                    usuarioActual.uid,

                tipo:
                    "solicitud_conexion",

                titulo:
                    "Nueva solicitud de conexión",

                mensaje:
                    `${nombreEmisor} quiere conectarse contigo.`,

                leida:
                    false,

                fecha:
                    serverTimestamp(),

                referenciaId:
                    conexionRef.id,

                url:
                    "conexiones.html"

            }
        );


        boton.textContent =
            "Pendiente";


        boton.classList.add(
            "pending"
        );


        mostrarToast(
            "Solicitud de conexión enviada."
        );


    }catch(error){

        console.error(
            "Error enviando conexión:",
            error
        );


        boton.disabled =
            false;

        boton.textContent =
            "Conectar";


        mostrarToast(
            "No se pudo enviar la solicitud."
        );

    }

}



/* ==========================================
   EVENTO CONECTAR
========================================== */

resultados.addEventListener(
    "click",
    async (event) => {

        const boton =
            event.target.closest(
                ".connect-btn"
            );


        if(!boton){
            return;
        }


        const estado =
            boton.dataset.estado;


        if(
            estado ===
            "aceptada"
        ){

            return;

        }


        if(
            estado ===
            "pendiente_enviada"
        ){

            return;

        }


        /*
         * Si hay una solicitud recibida,
         * llevamos al usuario a Conexiones
         * para aceptarla.
         */

        if(
            estado ===
            "pendiente_recibida"
        ){

            location.href =
                "conexiones.html";

            return;

        }


        await enviarSolicitud(
            boton.dataset.uid,
            boton
        );

    }
);
