</nav><script type="module">

import {
    auth,
    db
} from "./Js/firebase.js";


import {
    onAuthStateChanged
} from "https://www.gstatic.com/firebasejs/12.18.0/firebase-auth.js";


import {
    collection,
    getDocs,
    doc,
    getDoc,
    addDoc,
    query,
    where,
    serverTimestamp
} from "https://www.gstatic.com/firebasejs/12.18.0/firebase-firestore.js";


/* =========================================================
   VARIABLES
========================================================= */

let usuarioActual = null;

let todosLosPerfiles = [];

let filtroTipo = "todos";

let cargando = false;


/*
 * Guardamos las conexiones existentes.
 *
 * La clave es:
 *
 * UID del otro usuario
 *
 * Esto evita mostrar "Conectar" cuando ya existe
 * una solicitud o conexión.
 */

const estadosConexion = new Map();


/* =========================================================
   ELEMENTOS
========================================================= */

const inputBuscar =
    document.getElementById("inputBuscar");

const inputLocalidad =
    document.getElementById("inputLocalidad");

const resultados =
    document.getElementById("resultados");

const estado =
    document.getElementById("estado");

const toast =
    document.getElementById("toast");


/* =========================================================
   AUTENTICACIÓN
========================================================= */

onAuthStateChanged(
    auth,
    async (usuario) => {

        if(!usuario){

            location.href =
                "red-login.html";

            return;
        }


        usuarioActual =
            usuario;


        await cargarDatos();

    }
);


/* =========================================================
   CARGAR DATOS
========================================================= */

async function cargarDatos(){

    if(cargando) return;


    cargando = true;


    estado.style.display =
        "block";


    estado.textContent =
        "Cargando usuarios...";


    resultados.innerHTML =
        "";


    try{

        /*
         * Primero cargamos los perfiles
         * reales de GESBASE.
         *
         * Fuente única:
         *
         * usuarios/{uid}
         */

        await cargarUsuarios();


        /*
         * Después cargamos las conexiones.
         */

        await cargarConexiones();


        estado.style.display =
            "none";


        renderizar();


    }catch(error){

        console.error(
            "Error cargando Red GESBASE:",
            error
        );


        estado.style.display =
            "block";


        estado.textContent =
            "No se pudieron cargar los usuarios.";


        mostrarToast(
            "No se pudieron cargar los usuarios."
        );


    }finally{

        cargando =
            false;

    }

}


/* =========================================================
   CARGAR USUARIOS
========================================================= */

async function cargarUsuarios(){

    todosLosPerfiles =
        [];


    /*
     * IMPORTANTE:
     *
     * No utilizamos:
     *
     * usuariosRed
     * directorio_red
     *
     * porque NO son perfiles independientes.
     *
     * El perfil real está en:
     *
     * usuarios/{uid}
     */

    const usuariosSnap =
        await getDocs(
            collection(
                db,
                "usuarios"
            )
        );


    usuariosSnap.forEach(
        (documento) => {

            const datos =
                documento.data();


            const uid =
                documento.id;


            /*
             * Nunca mostrar al usuario actual.
             */

            if(
                uid ===
                usuarioActual.uid
            ){

                return;

            }


            /*
             * Estado del usuario.
             */

            if(
                datos.estado ===
                "inactivo"
            ){

                return;

            }


            if(
                datos.activo ===
                false
            ){

                return;

            }


            /*
             * Nombre.
             */

            const nombreCompleto =
                datos.nombreCompleto ||
                [
                    datos.nombre || "",
                    datos.apellido || ""
                ]
                .filter(Boolean)
                .join(" ")
                .trim() ||
                datos.nombreEmpresa ||
                datos.razonSocial ||
                "Usuario GESBASE";


            /*
             * Tipo de perfil.
             *
             * Si en el futuro agregamos un campo
             * tipoPerfil, lo utilizamos.
             *
             * También soportamos los nombres
             * existentes para no romper perfiles.
             */

            const tipo =
                normalizarTipo(
                    datos.tipoPerfil ||
                    datos.tipo ||
                    datos.perfilTipo ||
                    datos.tipoNegocio ||
                    datos.rubro ||
                    "persona"
                );


            const perfil = {

                uid: uid,

                nombreCompleto:
                    nombreCompleto,

                tipo:
                    tipo,

                rubro:
                    datos.rubro ||
                    datos.tipoNegocio ||
                    "",

                localidad:
                    datos.localidad ||
                    datos.ciudad ||
                    "",

                provincia:
                    datos.provincia ||
                    "",

                fotoURL:
                    datos.fotoPerfil ||
                    datos.photoURL ||
                    datos.foto ||
                    "",

                fotoPortada:
                    datos.fotoPortada ||
                    "",

                empresaId:
                    datos.empresaId ||
                    datos.idEmpresa ||
                    "",

                nombreEmpresa:
                    datos.nombreEmpresa ||
                    "",

                telefono:
                    datos.telefono ||
                    "",

                email:
                    datos.email ||
                    ""

            };


            todosLosPerfiles.push(
                perfil
            );

        }
    );


    /*
     * Orden alfabético.
     */

    todosLosPerfiles.sort(
        (a,b) => {

            return a.nombreCompleto
                .localeCompare(
                    b.nombreCompleto,
                    "es",
                    {
                        sensitivity:"base"
                    }
                );

        }
    );

}


/* =========================================================
   CARGAR CONEXIONES
========================================================= */

async function cargarConexiones(){

    estadosConexion.clear();


    if(!usuarioActual){
        return;
    }


    /*
     * Enviadas.
     */

    const enviadasQuery =
        query(
            collection(
                db,
                "conexiones"
            ),
            where(
                "emisor",
                "==",
                usuarioActual.uid
            )
        );


    /*
     * Recibidas.
     */

    const recibidasQuery =
        query(
            collection(
                db,
                "conexiones"
            ),
            where(
                "receptor",
                "==",
                usuarioActual.uid
            )
        );


    const [
        enviadasSnap,
        recibidasSnap
    ] = await Promise.all([

        getDocs(
            enviadasQuery
        ),

        getDocs(
            recibidasQuery
        )

    ]);


    /*
     * Solicitudes enviadas.
     */

    enviadasSnap.forEach(
        documento => {

            const datos =
                documento.data();


            const otroUid =
                datos.receptor;


            if(!otroUid){
                return;
            }


            estadosConexion.set(
                otroUid,
                {

                    estado:
                        datos.estado ||
                        "pendiente",

                    direccion:
                        "enviada",

                    id:
                        documento.id

                }
            );

        }
    );


    /*
     * Solicitudes recibidas.
     */

    recibidasSnap.forEach(
        documento => {

            const datos =
                documento.data();


            const otroUid =
                datos.emisor;


            if(!otroUid){
                return;
            }


            /*
             * Si ya tenemos una conexión aceptada
             * enviada, la dejamos.
             *
             * De lo contrario usamos la recibida.
             */

            const existente =
                estadosConexion.get(
                    otroUid
                );


            if(
                existente &&
                existente.estado ===
                "aceptada"
            ){

                return;

            }


            estadosConexion.set(
                otroUid,
                {

                    estado:
                        datos.estado ||
                        "pendiente",

                    direccion:
                        "recibida",

                    id:
                        documento.id

                }
            );

        }
    );

}


/* =========================================================
   NORMALIZAR TIPO
========================================================= */

function normalizarTipo(tipo){

    if(!tipo){
        return "persona";
    }


    const valor =
        String(tipo)
        .toLowerCase()
        .trim();


    if(
        valor.includes("profes")
    ){

        return "profesional";

    }


    if(
        valor.includes("trabaj") ||
        valor.includes("emple")
    ){

        return "trabajador";

    }


    if(
        valor.includes("empresa") ||
        valor.includes("contrat")
    ){

        return "empresa";

    }


    if(
        valor.includes("comerc") ||
        valor.includes("negocio") ||
        valor.includes("indumentaria") ||
        valor.includes("calzado") ||
        valor.includes("accesorios") ||
        valor.includes("distribuidora") ||
        valor.includes("almacen") ||
        valor.includes("ferreteria") ||
        valor.includes("gastronomia")
    ){

        return "comercio";

    }


    /*
     * El campo "perfil" del registro principal
     * normalmente contiene "administrador".
     *
     * Eso NO significa que la persona sea
     * una empresa para la Red.
     *
     * Por defecto la mostramos como persona
     * si no existe un tipo específico.
     */

    return "persona";

}


/* =========================================================
   RENDERIZAR
========================================================= */

function renderizar(){

    const texto =
        inputBuscar.value
        .toLowerCase()
        .trim();


    const localidad =
        inputLocalidad.value
        .toLowerCase()
        .trim();


    const filtrados =
        todosLosPerfiles.filter(
            perfil => {


                /*
                 * FILTRO TIPO
                 */

                if(
                    filtroTipo !==
                    "todos" &&
                    perfil.tipo !==
                    filtroTipo
                ){

                    return false;

                }


                /*
                 * FILTRO LOCALIDAD
                 */

                if(localidad){

                    const ubicacion = (

                        (perfil.localidad || "") +
                        " " +
                        (perfil.provincia || "")

                    )
                    .toLowerCase();


                    if(
                        !ubicacion.includes(
                            localidad
                        )
                    ){

                        return false;

                    }

                }


                /*
                 * BUSCADOR GENERAL
                 */

                if(texto){

                    const contenido = (

                        (perfil.nombreCompleto || "") +
                        " " +
                        (perfil.rubro || "") +
                        " " +
                        (perfil.localidad || "") +
                        " " +
                        (perfil.provincia || "") +
                        " " +
                        (perfil.tipo || "") +
                        " " +
                        (perfil.nombreEmpresa || "")

                    )
                    .toLowerCase();


                    if(
                        !contenido.includes(
                            texto
                        )
                    ){

                        return false;

                    }

                }


                return true;

            }
        );


    resultados.innerHTML =
        "";


    if(
        filtrados.length === 0
    ){

        resultados.innerHTML = `

            <div class="sin-resultados">

                <div class="icono">
                    🔎
                </div>

                <strong>
                    No encontramos resultados
                </strong>

                <p style="margin-top:7px;">
                    Probá con otro nombre, rubro,
                    localidad o categoría.
                </p>

            </div>

        `;

        return;

    }


    filtrados.forEach(
        perfil => {

            resultados.appendChild(
                crearTarjeta(
                    perfil
                )
            );

        }
    );

}


/* =========================================================
   CREAR TARJETA
========================================================= */

function crearTarjeta(perfil){

    const card =
        document.createElement(
            "article"
        );


    card.className =
        "card";


    /*
     * PERFIL SUPERIOR
     */

    const perfilDiv =
        document.createElement(
            "div"
        );


    perfilDiv.className =
        "perfil";


    perfilDiv.addEventListener(
        "click",
        () => {

            abrirPerfil(
                perfil.uid
            );

        }
    );


    /*
     * AVATAR
     */

    if(perfil.fotoURL){

        const img =
            document.createElement(
                "img"
            );


        img.className =
            "avatar";


        img.src =
            perfil.fotoURL;


        img.alt =
            perfil.nombreCompleto;


        img.onerror =
            () => {

                img.style.display =
                    "none";


                const placeholder =
                    crearPlaceholder(
                        perfil.nombreCompleto
                    );


                perfilDiv.insertBefore(
                    placeholder,
                    perfilDiv.firstChild
                );

            };


        perfilDiv.appendChild(
            img
        );

    }else{

        perfilDiv.appendChild(
            crearPlaceholder(
                perfil.nombreCompleto
            )
        );

    }


    /*
     * INFORMACIÓN PRINCIPAL
     */

    const info =
        document.createElement(
            "div"
        );


    info.style.minWidth =
        "0";


    const nombre =
        document.createElement(
            "div"
        );


    nombre.className =
        "nombre";


    nombre.textContent =
        perfil.nombreCompleto;


    const tipo =
        document.createElement(
            "span"
        );


    tipo.className =
        "tipo";


    tipo.textContent =
        textoTipo(
            perfil.tipo
        );


    info.appendChild(
        nombre
    );


    info.appendChild(
        tipo
    );


    perfilDiv.appendChild(
        info
    );


    card.appendChild(
        perfilDiv
    );


    /*
     * DATOS
     */

    const datos =
        document.createElement(
            "div"
        );


    datos.className =
        "datos";


    if(perfil.rubro){

        const rubro =
            document.createElement(
                "div"
            );


        rubro.textContent =
            "🛠️ " +
            perfil.rubro;


        datos.appendChild(
            rubro
        );

    }


    if(
        perfil.localidad ||
        perfil.provincia
    ){

        const ubicacion =
            document.createElement(
                "div"
            );


        ubicacion.textContent =
            "📍 " +
            [
                perfil.localidad,
                perfil.provincia
            ]
            .filter(Boolean)
            .join(", ");


        datos.appendChild(
            ubicacion
        );

    }


    if(perfil.nombreEmpresa){

        const empresa =
            document.createElement(
                "div"
            );


        empresa.textContent =
            "🏢 " +
            perfil.nombreEmpresa;


        datos.appendChild(
            empresa
        );

    }
    else if(perfil.empresaId){

        const empresa =
            document.createElement(
                "div"
            );


        empresa.textContent =
            "🏢 Empresa GESBASE";


        datos.appendChild(
            empresa
        );

    }


    if(
        datos.children.length
    ){

        card.appendChild(
            datos
        );

    }


    /*
     * ACCIONES
     */

    const acciones =
        document.createElement(
            "div"
        );


    acciones.className =
        "acciones";


    /*
     * BOTÓN PERFIL
     */

    const perfilBtn =
        document.createElement(
            "button"
        );


    perfilBtn.className =
        "btn btn-perfil";


    perfilBtn.textContent =
        "Ver perfil";


    perfilBtn.addEventListener(
        "click",
        () => {

            abrirPerfil(
                perfil.uid
            );

        }
    );


    acciones.appendChild(
        perfilBtn
    );


    /*
     * BOTÓN CONEXIÓN
     */

    const conectar =
        document.createElement(
            "button"
        );


    conectar.className =
        "btn btn-conectar";


    actualizarBotonConexion(
        conectar,
        perfil.uid
    );


    conectar.addEventListener(
        "click",
        async (evento) => {

            evento.stopPropagation();


            await gestionarConexion(
                perfil.uid,
                conectar
            );

        }
    );


    acciones.appendChild(
        conectar
    );


    card.appendChild(
        acciones
    );


    return card;

}


/* =========================================================
   BOTÓN DE CONEXIÓN
========================================================= */

function actualizarBotonConexion(
    boton,
    uid
){

    const conexion =
        estadosConexion.get(
            uid
        );


    boton.disabled =
        false;


    if(!conexion){

        boton.textContent =
            "Conectar";

        return;

    }


    if(
        conexion.estado ===
        "aceptada"
    ){

        boton.textContent =
            "✓ Conectados";

        boton.disabled =
            true;

        return;

    }


    if(
        conexion.estado ===
        "pendiente"
    ){

        if(
            conexion.direccion ===
            "enviada"
        ){

            boton.textContent =
                "Solicitud enviada";

        }else{

            boton.textContent =
                "Pendiente";

        }


        boton.disabled =
            true;


        return;

    }


    /*
     * Cualquier otro estado:
     * permitimos volver a conectar.
     */

    boton.textContent =
        "Conectar";

}


/* =========================================================
   GESTIONAR CONEXIÓN
========================================================= */

async function gestionarConexion(
    receptorUid,
    boton
){

    if(!usuarioActual){

        mostrarToast(
            "Tenés que iniciar sesión."
        );

        return;

    }


    if(
        receptorUid ===
        usuarioActual.uid
    ){

        mostrarToast(
            "No podés conectarte con vos mismo."
        );

        return;

    }


    /*
     * Si ya conocemos el estado,
     * no hacemos otra operación.
     */

    const existente =
        estadosConexion.get(
            receptorUid
        );


    if(existente){

        if(
            existente.estado ===
            "aceptada"
        ){

            mostrarToast(
                "Ya están conectados."
            );

            actualizarBotonConexion(
                boton,
                receptorUid
            );

            return;

        }


        if(
            existente.estado ===
            "pendiente"
        ){

            if(
                existente.direccion ===
                "enviada"
            ){

                mostrarToast(
                    "La solicitud ya fue enviada."
                );

            }else{

                mostrarToast(
                    "Esta persona ya te envió una solicitud."
                );

            }


            actualizarBotonConexion(
                boton,
                receptorUid
            );

            return;

        }

    }


    try{

        boton.disabled =
            true;


        boton.textContent =
            "Enviando...";


        /*
         * Verificación adicional contra Firestore.
         *
         * Esto evita duplicados si el estado local
         * estaba desactualizado.
         */

        const enviadasQuery =
            query(
                collection(
                    db,
                    "conexiones"
                ),
                where(
                    "emisor",
                    "==",
                    usuarioActual.uid
                )
            );


        const recibidasQuery =
            query(
                collection(
                    db,
                    "conexiones"
                ),
                where(
                    "receptor",
                    "==",
                    usuarioActual.uid
                )
            );


        const [
            enviadasSnap,
            recibidasSnap
        ] = await Promise.all([

            getDocs(
                enviadasQuery
            ),

            getDocs(
                recibidasQuery
            )

        ]);


        let conexionExistente =
            null;


        enviadasSnap.forEach(
            documento => {

                const datos =
                    documento.data();


                if(
                    datos.receptor ===
                    receptorUid
                ){

                    conexionExistente = {

                        id:
                            documento.id,

                        ...datos,

                        direccion:
                            "enviada"

                    };

                }

            }
        );


        recibidasSnap.forEach(
            documento => {

                const datos =
                    documento.data();


                if(
                    datos.emisor ===
                    receptorUid
                ){

                    conexionExistente = {

                        id:
                            documento.id,

                        ...datos,

                        direccion:
                            "recibida"

                    };

                }

            }
        );


        /*
         * Ya existe.
         */

        if(
            conexionExistente
        ){

            estadosConexion.set(
                receptorUid,
                {

                    estado:
                        conexionExistente.estado ||
                        "pendiente",

                    direccion:
                        conexionExistente.direccion,

                    id:
                        conexionExistente.id

                }
            );


            actualizarBotonConexion(
                boton,
                receptorUid
            );


            if(
                conexionExistente.estado ===
                "aceptada"
            ){

                mostrarToast(
                    "Ya están conectados."
                );

            }
            else{

                mostrarToast(
                    "Ya existe una solicitud de conexión."
                );

            }


            return;

        }


        /*
         * Crear nueva conexión.
         */

        const conexion =
            await addDoc(
                collection(
                    db,
                    "conexiones"
                ),
                {

                    emisor:
                        usuarioActual.uid,

                    receptor:
                        receptorUid,

                    estado:
                        "pendiente",

                    fecha:
                        serverTimestamp(),

                    fechaCliente:
                        Date.now()

                }
            );


        /*
         * Guardamos inmediatamente
         * el nuevo estado local.
         */

        estadosConexion.set(
            receptorUid,
            {

                estado:
                    "pendiente",

                direccion:
                    "enviada",

                id:
                    conexion.id

            }
        );


        actualizarBotonConexion(
            boton,
            receptorUid
        );


        /*
         * Obtener nombre real
         * desde usuarios/{uid}.
         */

        let nombreEmisor =
            "Un usuario";


        try{

            const perfilRef =
                doc(
                    db,
                    "usuarios",
                    usuarioActual.uid
                );


            const perfilSnap =
                await getDoc(
                    perfilRef
                );


            if(
                perfilSnap.exists()
            ){

                const datos =
                    perfilSnap.data();


                nombreEmisor =
                    datos.nombreCompleto ||
                    [
                        datos.nombre || "",
                        datos.apellido || ""
                    ]
                    .filter(Boolean)
                    .join(" ")
                    .trim() ||
                    datos.nombreEmpresa ||
                    datos.razonSocial ||
                    "Un usuario";

            }

        }catch(error){

            console.warn(
                "No se pudo obtener el perfil:",
                error
            );

        }


        /*
         * Crear notificación.
         */

        try{

            await addDoc(
                collection(
                    db,
                    "notificaciones"
                ),
                {

                    receptorUid:
                        receptorUid,

                    emisorUid:
                        usuarioActual.uid,

                    tipo:
                        "solicitud_conexion",

                    titulo:
                        "Nueva solicitud de conexión",

                    mensaje:
                        `${nombreEmisor} quiere conectarse contigo.`,

                    leida:
                        false,

                    fecha:
                        serverTimestamp(),

                    fechaCliente:
                        Date.now(),

                    referenciaId:
                        conexion.id,

                    url:
                        "conexiones.html"

                }
            );

        }catch(error){

            /*
             * La conexión ya fue creada.
             *
             * Si falla solamente la notificación,
             * no deshacemos la conexión.
             */

            console.warn(
                "No se pudo crear la notificación:",
                error
            );

        }


        mostrarToast(
            "Solicitud de conexión enviada."
        );


    }catch(error){

        console.error(
            "Error creando conexión:",
            error
        );


        /*
         * Volvemos el botón a su estado original.
         */

        estadosConexion.delete(
            receptorUid
        );


        boton.disabled =
            false;


        boton.textContent =
            "Conectar";


        mostrarToast(
            "No se pudo enviar la solicitud."
        );

    }

}


/* =========================================================
   ABRIR PERFIL
========================================================= */

function abrirPerfil(uid){

    if(!uid){
        return;
    }


    location.href =
        "red-perfil.html?uid=" +
        encodeURIComponent(uid);

}


/* =========================================================
   PLACEHOLDER
========================================================= */

function crearPlaceholder(nombre){

    const div =
        document.createElement(
            "div"
        );


    div.className =
        "avatar-placeholder";


    div.textContent =
        obtenerIniciales(
            nombre
        );


    return div;

}


function obtenerIniciales(nombre){

    if(!nombre){
        return "G";
    }


    const partes =
        String(nombre)
        .trim()
        .split(/\s+/)
        .filter(Boolean);


    if(
        partes.length === 1
    ){

        return partes[0]
            .substring(
                0,
                2
            )
            .toUpperCase();

    }


    return (

        partes[0][0] +
        partes[partes.length - 1][0]

    ).toUpperCase();

}

function textoTipo(tipo){

            "Persona",

        profesional:
            "Profesional",

        trabajador:
            "Trabajador",

        empresa:
            "Empresa",

        comercio:

    };


    return (
        nombres[tipo] ||
        "Usuario"
    );

}

/* =========================================================
   TOAST
========================================================= */

let toastTimer =
    null;


function mostrarToast(
    mensaje
){

    toast.textContent =
        mensaje;


    toast.classList.add(
        "mostrar"
    );


    clearTimeout(
        toastTimer
    );


    toastTimer =
        setTimeout(
            () => {

                toast.classList.remove(
                    "mostrar"
                );

            },
            2800
        );

}
