<!DOCTYPE html>
<html lang="es-AR">
<head>
    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0, viewport-fit=cover"
    >

    <meta name="theme-color" content="#12343B">

    <title>Buscar - Red GESBASE</title>

    <style>
        *{
            box-sizing:border-box;
            margin:0;
            padding:0;
        }

        body{
            font-family:Arial,Helvetica,sans-serif;
            background:#f3f6f7;
            color:#17252a;
            padding-bottom:90px;
        }

        header{
            position:sticky;
            top:0;
            z-index:100;
            background:#12343B;
            color:white;
            padding:16px 18px;
            box-shadow:0 2px 8px rgba(0,0,0,.15);
        }

        .header-inner{
            max-width:900px;
            margin:auto;
        }

        .titulo{
            font-size:22px;
            font-weight:700;
        }

        .subtitulo{
            margin-top:4px;
            font-size:13px;
            opacity:.82;
        }

        main{
            width:100%;
            max-width:900px;
            margin:auto;
            padding:16px;
        }

        .buscador-card{
            background:white;
            border-radius:16px;
            padding:16px;
            box-shadow:0 2px 10px rgba(0,0,0,.08);
            margin-bottom:14px;
        }

        .buscador{
            width:100%;
            border:1px solid #d6dfe2;
            border-radius:12px;
            padding:14px 15px;
            font-size:16px;
            outline:none;
            background:#fff;
        }

        .buscador:focus{
            border-color:#12343B;
            box-shadow:0 0 0 3px rgba(18,52,59,.08);
        }

        .filtros{
            display:flex;
            gap:8px;
            overflow-x:auto;
            padding-top:12px;
            padding-bottom:2px;
        }

        .filtro{
            flex:0 0 auto;
            border:none;
            border-radius:20px;
            padding:9px 13px;
            background:#e8eef0;
            color:#23434a;
            font-weight:600;
            cursor:pointer;
        }

        .filtro.activo{
            background:#12343B;
            color:white;
        }

        .ubicacion{
            margin-top:10px;
        }

        .ubicacion input{
            width:100%;
            border:1px solid #d6dfe2;
            border-radius:11px;
            padding:11px 13px;
            font-size:14px;
            outline:none;
        }

        .estado{
            text-align:center;
            padding:24px 10px;
            color:#64757b;
        }

        .resultados{
            display:flex;
            flex-direction:column;
            gap:12px;
        }

        .card{
            background:white;
            border-radius:16px;
            padding:15px;
            box-shadow:0 2px 10px rgba(0,0,0,.07);
        }

        .perfil{
            display:flex;
            gap:12px;
            align-items:center;
        }

        .avatar{
            width:58px;
            height:58px;
            min-width:58px;
            border-radius:50%;
            object-fit:cover;
            background:#dfe8ea;
            border:2px solid #edf2f3;
        }

        .avatar-placeholder{
            width:58px;
            height:58px;
            min-width:58px;
            border-radius:50%;
            background:#12343B;
            color:white;
            display:flex;
            align-items:center;
            justify-content:center;
            font-size:21px;
            font-weight:700;
        }

        .nombre{
            font-size:17px;
            font-weight:700;
            color:#17252a;
        }

        .tipo{
            display:inline-block;
            margin-top:4px;
            font-size:12px;
            color:#48636a;
            background:#edf3f4;
            padding:4px 8px;
            border-radius:10px;
        }

        .datos{
            margin-top:12px;
            display:flex;
            flex-direction:column;
            gap:5px;
            font-size:13px;
            color:#566a70;
        }

        .acciones{
            margin-top:14px;
            display:flex;
            gap:8px;
        }

        .btn{
            flex:1;
            border:none;
            border-radius:11px;
            padding:11px;
            font-size:14px;
            font-weight:700;
            cursor:pointer;
        }

        .btn-conectar{
            background:#12343B;
            color:white;
        }

        .btn-conectar:disabled{
            opacity:.65;
            cursor:not-allowed;
        }

        .btn-perfil{
            background:#e9eff1;
            color:#12343B;
        }

        .sin-resultados{
            background:white;
            border-radius:16px;
            padding:30px 18px;
            text-align:center;
            color:#61747a;
            box-shadow:0 2px 10px rgba(0,0,0,.06);
        }

        .sin-resultados .icono{
            font-size:38px;
            margin-bottom:10px;
        }

        .toast{
            position:fixed;
            left:50%;
            bottom:100px;
            transform:translateX(-50%) translateY(20px);
            background:#12343B;
            color:white;
            padding:12px 16px;
            border-radius:12px;
            font-size:14px;
            opacity:0;
            pointer-events:none;
            transition:.25s;
            z-index:500;
            max-width:90%;
            text-align:center;
        }

        .toast.mostrar{
            opacity:1;
            transform:translateX(-50%) translateY(0);
        }

        .bottom-nav{
            position:fixed;
            left:0;
            right:0;
            bottom:0;
            z-index:200;
            background:white;
            border-top:1px solid #dce4e6;
            display:flex;
            justify-content:center;
            box-shadow:0 -2px 10px rgba(0,0,0,.08);
            padding-bottom:env(safe-area-inset-bottom);
        }

        .nav-inner{
            width:100%;
            max-width:900px;
            display:flex;
        }

        .nav-btn{
            flex:1;
            border:none;
            background:white;
            padding:10px 4px 9px;
            color:#60747a;
            font-size:11px;
            cursor:pointer;
        }

        .nav-btn span{
            display:block;
            font-size:21px;
            margin-bottom:3px;
        }

        .nav-btn.activo{
            color:#12343B;
            font-weight:700;
        }

        @media(min-width:700px){
            main{
                padding:24px;
            }

            .resultados{
                display:grid;
                grid-template-columns:repeat(2,minmax(0,1fr));
            }
        }

        @media(min-width:1050px){
            .resultados{
                grid-template-columns:repeat(3,minmax(0,1fr));
            }
        }
    </style>
</head>

<body>

<header>
    <div class="header-inner">
        <div class="titulo">🔎 Buscar</div>
        <div class="subtitulo">
            Encontrá personas, profesionales, trabajadores, empresas y comercios.
        </div>
    </div>
</header>

<main>

    <section class="buscador-card">

        <input
            type="search"
            id="inputBuscar"
            class="buscador"
            placeholder="Buscar por nombre, rubro o localidad..."
            autocomplete="off"
        >

        <div class="filtros">

            <button
                class="filtro activo"
                data-tipo="todos"
            >
                Todos
            </button>

            <button
                class="filtro"
                data-tipo="persona"
            >
                Personas
            </button>

            <button
                class="filtro"
                data-tipo="profesional"
            >
                Profesionales
            </button>

            <button
                class="filtro"
                data-tipo="trabajador"
            >
                Trabajadores
            </button>

            <button
                class="filtro"
                data-tipo="empresa"
            >
                Empresas
            </button>

            <button
                class="filtro"
                data-tipo="comercio"
            >
                Comercios
            </button>

        </div>

        <div class="ubicacion">
            <input
                type="text"
                id="inputLocalidad"
                placeholder="Filtrar por localidad..."
                autocomplete="off"
            >
        </div>

    </section>

    <div id="estado" class="estado">
        Cargando usuarios...
    </div>

    <section
        id="resultados"
        class="resultados"
    ></section>

</main>

<div id="toast" class="toast"></div>

<nav class="bottom-nav">

    <div class="nav-inner">

        <button
            class="nav-btn"
            onclick="location.href='red.html'"
        >
            <span>🏠</span>
            Inicio
        </button>

        <button
            class="nav-btn activo"
            onclick="location.href='red-buscar.html'"
        >
            <span>🔎</span>
            Buscar
        </button>

        <button
            class="nav-btn"
            onclick="location.href='conexiones.html'"
        >
            <span>👥</span>
            Conexiones
        </button>

        <button
            class="nav-btn"
            onclick="location.href='red-notificaciones.html'"
        >
            <span>🔔</span>
            Notificaciones
        </button>

        <button
            class="nav-btn"
            onclick="location.href='red-perfil.html'"
        >
            <span>👤</span>
            Perfil
        </button>

    </div>

</nav>

<script type="module">

import {
    auth,
    db
} from "./Js/firebase.js";

import {
    onAuthStateChanged
} from "https://www.gstatic.com/firebasejs/12.18.0/firebase-auth.js";

import {
    collection,
    getDocs,
    doc,
    getDoc,
    addDoc,
    query,
    where,
    serverTimestamp
} from "https://www.gstatic.com/firebasejs/12.18.0/firebase-firestore.js";


/* =========================================================
   VARIABLES
========================================================= */

let usuarioActual = null;

let todosLosPerfiles = [];

let filtroTipo = "todos";

let cargando = false;


/* =========================================================
   ELEMENTOS
========================================================= */

const inputBuscar =
    document.getElementById("inputBuscar");

const inputLocalidad =
    document.getElementById("inputLocalidad");

const resultados =
    document.getElementById("resultados");

const estado =
    document.getElementById("estado");

const toast =
    document.getElementById("toast");


/* =========================================================
   AUTENTICACIÓN
========================================================= */

onAuthStateChanged(auth, async (usuario) => {

    if(!usuario){

        location.href = "red-login.html";

        return;
    }

    usuarioActual = usuario;

    await cargarUsuarios();

});


/* =========================================================
   CARGAR USUARIOS
========================================================= */

async function cargarUsuarios(){

    if(cargando) return;

    cargando = true;

    estado.style.display = "block";

    estado.textContent = "Cargando usuarios...";

    resultados.innerHTML = "";

    try{

        /*
         * IMPORTANTE:
         *
         * No buscamos directamente en "usuarios".
         *
         * La colección usuarios tiene acceso individual
         * por UID.
         *
         * Para Red GESBASE utilizamos:
         *
         * 1. directorio_red
         * 2. usuariosRed
         *
         * Ambas colecciones pueden ser utilizadas por la Red
         * con las reglas actuales.
         */

        const [
            directorioSnap,
            usuariosRedSnap
        ] = await Promise.all([

            getDocs(
                collection(db, "directorio_red")
            ),

            getDocs(
                collection(db, "usuariosRed")
            )

        ]);


        const mapa =
            new Map();


        /* =====================================================
           DIRECTORIO_RED
        ===================================================== */

        directorioSnap.forEach((documento) => {

            const datos =
                documento.data();

            const uid =
                datos.uid || documento.id;

            if(!uid) return;

            mapa.set(uid, {

                uid: uid,

                nombreCompleto:
                    datos.nombreCompleto ||
                    datos.nombre ||
                    datos.nombreEmpresa ||
                    datos.razonSocial ||
                    "Usuario GESBASE",

                tipo:
                    normalizarTipo(
                        datos.tipo ||
                        datos.tipoPerfil ||
                        datos.tipoAcceso ||
                        "persona"
                    ),

                rubro:
                    datos.rubro || "",

                localidad:
                    datos.localidad || "",

                provincia:
                    datos.provincia || "",

                fotoURL:
                    datos.fotoURL ||
                    datos.fotoPerfil ||
                    "",

                fotoPortada:
                    datos.fotoPortada || "",

                activo:
                    datos.activo !== false,

                empresaId:
                    datos.empresaId || "",

                propietarioUid:
                    datos.propietarioUid || "",

                origen:
                    "directorio_red"

            });

        });


        /* =====================================================
           USUARIOS_RED
        ===================================================== */

        usuariosRedSnap.forEach((documento) => {

            const datos =
                documento.data();

            const uid =
                datos.uid || documento.id;

            if(!uid) return;


            const perfilExistente =
                mapa.get(uid);


            const perfilNuevo = {

                uid: uid,

                nombreCompleto:
                    datos.nombreCompleto ||
                    datos.nombre ||
                    datos.nombreEmpresa ||
                    datos.razonSocial ||
                    perfilExistente?.nombreCompleto ||
                    "Usuario GESBASE",

                tipo:
                    normalizarTipo(
                        datos.tipo ||
                        datos.tipoPerfil ||
                        datos.tipoAcceso ||
                        perfilExistente?.tipo ||
                        "persona"
                    ),

                rubro:
                    datos.rubro ||
                    perfilExistente?.rubro ||
                    "",

                localidad:
                    datos.localidad ||
                    perfilExistente?.localidad ||
                    "",

                provincia:
                    datos.provincia ||
                    perfilExistente?.provincia ||
                    "",

                fotoURL:
                    datos.fotoURL ||
                    datos.fotoPerfil ||
                    perfilExistente?.fotoURL ||
                    "",

                fotoPortada:
                    datos.fotoPortada ||
                    perfilExistente?.fotoPortada ||
                    "",

                activo:
                    datos.activo !== false,

                empresaId:
                    datos.empresaId ||
                    perfilExistente?.empresaId ||
                    "",

                propietarioUid:
                    datos.propietarioUid ||
                    perfilExistente?.propietarioUid ||
                    "",

                origen:
                    "usuariosRed"

            };


            mapa.set(uid, perfilNuevo);

        });


        /*
         * Quitamos al usuario actual de los resultados.
         */

        todosLosPerfiles =
            Array.from(mapa.values())
            .filter(perfil => {

                return (
                    perfil.uid !== usuarioActual.uid &&
                    perfil.activo !== false
                );

            });


        /*
         * Orden alfabético.
         */

        todosLosPerfiles.sort((a,b) => {

            return a.nombreCompleto
                .localeCompare(
                    b.nombreCompleto,
                    "es",
                    {
                        sensitivity:"base"
                    }
                );

        });


        estado.style.display = "none";

        renderizar();


    }catch(error){

        console.error(
            "Error cargando usuarios:",
            error
        );

        estado.style.display = "block";

        estado.textContent =
            "No se pudieron cargar los usuarios.";

        mostrarToast(
            "No se pudieron cargar los usuarios."
        );

    }finally{

        cargando = false;

    }

}


/* =========================================================
   NORMALIZAR TIPO
========================================================= */

function normalizarTipo(tipo){

    if(!tipo) return "persona";

    const valor =
        String(tipo)
        .toLowerCase()
        .trim();

    if(
        valor.includes("profes")
    ){
        return "profesional";
    }

    if(
        valor.includes("trabaj")
        ||
        valor.includes("emple")
    ){
        return "trabajador";
    }

    if(
        valor.includes("empresa")
        ||
        valor.includes("contrat")
    ){
        return "empresa";
    }

    if(
        valor.includes("comerc")
        ||
        valor.includes("negocio")
    ){
        return "comercio";
    }

    return "persona";

}


/* =========================================================
   RENDERIZAR
========================================================= */

function renderizar(){

    const texto =
        inputBuscar.value
        .toLowerCase()
        .trim();

    const localidad =
        inputLocalidad.value
        .toLowerCase()
        .trim();


    const filtrados =
        todosLosPerfiles.filter(perfil => {

            /*
             * FILTRO DE TIPO
             */

            if(
                filtroTipo !== "todos" &&
                perfil.tipo !== filtroTipo
            ){
                return false;
            }


            /*
             * FILTRO DE LOCALIDAD
             */

            if(localidad){

                const ubicacion = (

                    (perfil.localidad || "") +
                    " " +
                    (perfil.provincia || "")

                )
                .toLowerCase();

                if(
                    !ubicacion.includes(localidad)
                ){
                    return false;
                }

            }


            /*
             * BUSCADOR GENERAL
             */

            if(texto){

                const contenido = (

                    (perfil.nombreCompleto || "") +
                    " " +
                    (perfil.rubro || "") +
                    " " +
                    (perfil.localidad || "") +
                    " " +
                    (perfil.provincia || "") +
                    " " +
                    (perfil.tipo || "")

                )
                .toLowerCase();

                if(
                    !contenido.includes(texto)
                ){
                    return false;
                }

            }


            return true;

        });


    resultados.innerHTML = "";


    if(filtrados.length === 0){

        resultados.innerHTML = `

            <div class="sin-resultados">

                <div class="icono">
                    🔎
                </div>

                <strong>
                    No encontramos resultados
                </strong>

                <p style="margin-top:7px;">
                    Probá con otro nombre, rubro,
                    localidad o categoría.
                </p>

            </div>

        `;

        return;

    }


    filtrados.forEach(perfil => {

        resultados.appendChild(
            crearTarjeta(perfil)
        );

    });

}


/* =========================================================
   CREAR TARJETA
========================================================= */

function crearTarjeta(perfil){

    const card =
        document.createElement("article");

    card.className = "card";


    const perfilDiv =
        document.createElement("div");

    perfilDiv.className = "perfil";


    /*
     * AVATAR
     */

    if(perfil.fotoURL){

        const img =
            document.createElement("img");

        img.className = "avatar";

        img.src = perfil.fotoURL;

        img.alt =
            perfil.nombreCompleto;

        img.onerror = () => {

            img.style.display = "none";

            const placeholder =
                crearPlaceholder(
                    perfil.nombreCompleto
                );

            perfilDiv.insertBefore(
                placeholder,
                perfilDiv.firstChild
            );

        };

        perfilDiv.appendChild(img);

    }else{

        perfilDiv.appendChild(
            crearPlaceholder(
                perfil.nombreCompleto
            )
        );

    }


    /*
     * INFORMACIÓN PRINCIPAL
     */

    const info =
        document.createElement("div");

    info.style.minWidth = "0";


    const nombre =
        document.createElement("div");

    nombre.className = "nombre";

    nombre.textContent =
        perfil.nombreCompleto;


    const tipo =
        document.createElement("span");

    tipo.className = "tipo";

    tipo.textContent =
        textoTipo(perfil.tipo);


    info.appendChild(nombre);

    info.appendChild(tipo);

    perfilDiv.appendChild(info);


    card.appendChild(perfilDiv);


    /*
     * DATOS
     */

    const datos =
        document.createElement("div");

    datos.className = "datos";


    if(perfil.rubro){

        const rubro =
            document.createElement("div");

        rubro.textContent =
            "🛠️ " + perfil.rubro;

        datos.appendChild(rubro);

    }


    if(
        perfil.localidad ||
        perfil.provincia
    ){

        const ubicacion =
            document.createElement("div");

        ubicacion.textContent =
            "📍 " +
            [perfil.localidad, perfil.provincia]
            .filter(Boolean)
            .join(", ");

        datos.appendChild(ubicacion);

    }


    if(perfil.empresaId){

        const empresa =
            document.createElement("div");

        empresa.textContent =
            "🏢 Empresa GESBASE";

        datos.appendChild(empresa);

    }


    if(datos.children.length){

        card.appendChild(datos);

    }


    /*
     * ACCIONES
     */

    const acciones =
        document.createElement("div");

    acciones.className = "acciones";


    const conectar =
        document.createElement("button");

    conectar.className =
        "btn btn-conectar";

    conectar.textContent =
        "Conectar";


    conectar.addEventListener(
        "click",
        async () => {

            conectar.disabled = true;

            conectar.textContent =
                "Verificando...";

            const resultado =
                await gestionarConexion(
                    perfil.uid
                );

            if(resultado === "conectados"){

                conectar.textContent =
                    "✓ Conectados";

            }
            else if(resultado === "pendiente"){

                conectar.textContent =
                    "Pendiente";

            }
            else if(resultado === "enviada"){

                conectar.textContent =
                    "✓ Solicitud enviada";

            }
            else{

                conectar.disabled = false;

                conectar.textContent =
                    "Conectar";

            }

        }
    );


    acciones.appendChild(conectar);

    card.appendChild(acciones);


    return card;

}


/* =========================================================
   PLACEHOLDER
========================================================= */

function crearPlaceholder(nombre){

    const div =
        document.createElement("div");

    div.className =
        "avatar-placeholder";

    div.textContent =
        obtenerIniciales(nombre);

    return div;

}


function obtenerIniciales(nombre){

    if(!nombre) return "G";

    const partes =
        String(nombre)
        .trim()
        .split(/\s+/)
        .filter(Boolean);

    if(partes.length === 1){

        return partes[0]
            .substring(0,2)
            .toUpperCase();

    }

    return (
        partes[0][0] +
        partes[partes.length - 1][0]
    ).toUpperCase();

}


/* =========================================================
   TEXTO TIPO
========================================================= */

function textoTipo(tipo){

    const nombres = {

        persona: "Persona",

        profesional: "Profesional",

        trabajador: "Trabajador",

        empresa: "Empresa",

        comercio: "Comercio"

    };

    return nombres[tipo] || "Usuario";

}


/* =========================================================
   CONEXIONES
========================================================= */

async function gestionarConexion(receptorUid){

    if(!usuarioActual){

        mostrarToast(
            "Tenés que iniciar sesión."
        );

        return "error";

    }


    if(
        receptorUid === usuarioActual.uid
    ){

        mostrarToast(
            "No podés conectarte con vos mismo."
        );

        return "error";

    }


    try{

        /*
         * SOLICITUDES ENVIADAS
         */

        const enviadasQuery =
            query(
                collection(db, "conexiones"),
                where(
                    "emisor",
                    "==",
                    usuarioActual.uid
                )
            );


        /*
         * SOLICITUDES RECIBIDAS
         */

        const recibidasQuery =
            query(
                collection(db, "conexiones"),
                where(
                    "receptor",
                    "==",
                    usuarioActual.uid
                )
            );


        const [
            enviadasSnap,
            recibidasSnap
        ] = await Promise.all([

            getDocs(enviadasQuery),

            getDocs(recibidasQuery)

        ]);


        let conexionExistente = null;


        enviadasSnap.forEach(documento => {

            const datos =
                documento.data();

            if(
                datos.receptor === receptorUid
            ){

                conexionExistente = {

                    id: documento.id,

                    ...datos

                };

            }

        });


        recibidasSnap.forEach(documento => {

            const datos =
                documento.data();

            if(
                datos.emisor === receptorUid
            ){

                conexionExistente = {

                    id: documento.id,

                    ...datos

                };

            }

        });


        /*
         * YA EXISTE
         */

        if(conexionExistente){

            if(
                conexionExistente.estado ===
                "aceptada"
            ){

                mostrarToast(
                    "Ya están conectados."
                );

                return "conectados";

            }


            if(
                conexionExistente.estado ===
                "pendiente"
            ){

                if(
                    conexionExistente.emisor ===
                    usuarioActual.uid
                ){

                    mostrarToast(
                        "La solicitud ya fue enviada."
                    );

                    return "pendiente";

                }

                mostrarToast(
                    "Esta persona ya te envió una solicitud."
                );

                return "pendiente";

            }

        }


        /*
         * CREAR SOLICITUD
         */

        const conexion =
            await addDoc(
                collection(db, "conexiones"),
                {

                    emisor:
                        usuarioActual.uid,

                    receptor:
                        receptorUid,

                    estado:
                        "pendiente",

                    fecha:
                        serverTimestamp()

                }
            );


        /*
         * NOMBRE DEL USUARIO ACTUAL
         */

        let nombreEmisor =
            "Un usuario";


        try{

            const perfilRef =
                doc(
                    db,
                    "usuariosRed",
                    usuarioActual.uid
                );

            const perfilSnap =
                await getDoc(perfilRef);


            if(perfilSnap.exists()){

                const datos =
                    perfilSnap.data();

                nombreEmisor =
                    datos.nombreCompleto ||
                    datos.nombre ||
                    datos.nombreEmpresa ||
                    "Un usuario";

            }

        }catch(error){

            console.warn(
                "No se pudo obtener el nombre:",
                error
            );

        }


        /*
         * CREAR NOTIFICACIÓN
         */

        try{

            await addDoc(
                collection(db, "notificaciones"),
                {

                    receptorUid:
                        receptorUid,

                    emisorUid:
                        usuarioActual.uid,

                    tipo:
                        "solicitud_conexion",

                    titulo:
                        "Nueva solicitud de conexión",

                    mensaje:
                        `${nombreEmisor} quiere conectarse contigo.`,

                    leida:
                        false,

                    fecha:
                        serverTimestamp(),

                    referenciaId:
                        conexion.id,

                    url:
                        "conexiones.html"

                }
            );

        }catch(error){

            console.warn(
                "No se pudo crear la notificación:",
                error
            );

        }


        mostrarToast(
            "Solicitud de conexión enviada."
        );


        return "enviada";


    }catch(error){

        console.error(
            "Error creando conexión:",
            error
        );

        mostrarToast(
            "No se pudo enviar la solicitud."
        );

        return "error";

    }

}

    .forEach(boton => {

        boton.addEventListener(

                document
                    .querySelectorAll(".filtro")
                    .forEach(b =>
                        b.classList.remove("activo")
                    );


                boton.classList.add("activo");


                filtroTipo =
                    boton.dataset.tipo;


                renderizar();

            }
        );

    });


/* =========================================================
   BUSCADOR
========================================================= */

inputBuscar.addEventListener(
    "input",
    renderizar
);


inputLocalidad.addEventListener(
    "input",
    renderizar
);


/* =========================================================
   TOAST
========================================================= */

let toastTimer = null;

function mostrarToast(mensaje){

    toast.textContent =
        mensaje;

    toast.classList.add(
        "mostrar"
    );


    clearTimeout(toastTimer);


    toastTimer =
        setTimeout(() => {

            toast.classList.remove(
                "mostrar"
            );

        }, 2800);

}

</script>
