<style>

*{
    box-sizing:border-box;
    margin:0;
    padding:0;
}

body{
    font-family:Arial,sans-serif;

/* =========================
   HEADER
========================= */

header{

.logo{

}

.subtitulo{

}

/* =========================
   MAIN
========================= */

main{

}

.titulo{
    font-size:27px;
    margin-bottom:5px;
}

.descripcion{
    color:#6b7280;
    font-size:14px;
    margin-bottom:20px;
}

/* =========================
   BOTONES PRINCIPALES
========================= */

.toolbar{
    display:flex;
    gap:10px;
    flex-wrap:wrap;
    margin-bottom:18px;
}

.toolbar button{
    border:none;
    border-radius:10px;
    padding:12px 15px;
    font-weight:bold;
    cursor:pointer;
}

.btn-nuevo{
    background:#111827;
    color:white;
}

.btn-recibidos{

    color:#111827;
}

.btn-enviados{

}

/* =========================
   ESTADO
========================= */

.estado{

    padding:13px;

    font-size:14px;

}

.estado.visible{

}

.estado.error{

    color:#991b1b;
}

.estado.exito{

}

/* =========================

========================= */

/* =========================

========================= */

// ==========================================

// ==========================================
// ESCAPAR HTML
// ==========================================

function escapar(
    valor
){

    return String(
        valor ?? ""
    )
    .replaceAll("&","&amp;")
    .replaceAll("<","&lt;")
    .replaceAll(">","&gt;")
    .replaceAll('"',"&quot;")
    .replaceAll("'","&#039;");

}


// ==========================================
// FECHA
// ==========================================

function formatoFecha(
    valor
){

    if(!valor){

        return "-";

    }

    try{

        if(
            typeof valor.toDate ===
            "function"
        ){

            return valor
            .toDate()
            .toLocaleString(
                "es-AR"
            );

        }

        const fecha =
        new Date(valor);

        if(
            !isNaN(
                fecha.getTime()
            )
        ){

            return fecha.toLocaleString(
                "es-AR"
            );

        }

    }
    catch(error){

        console.error(error);

    }

    return String(valor);

}

// ==========================================
// OBTENER EMPRESA
// ==========================================

async function cargarEmpresa(){

    empresaIdActual = "";

    empresaActual = {};

    const referenciaUsuario =
    doc(
        db,
        "usuarios",
        usuarioActual.uid
    );

    const documentoUsuario =
    await getDoc(
        referenciaUsuario
    );

    if(
        documentoUsuario.exists()
    ){

        const datos =
        documentoUsuario.data();

        empresaIdActual =
        String(
            datos.empresaId ||
            datos.empresa ||
            ""
        ).trim();

    }


    if(!empresaIdActual){

        empresaIdActual =
        usuarioActual.uid;

    }


    try{

        const referenciaEmpresa =
        doc(
            db,
            "empresas",
            empresaIdActual
        );

        const documentoEmpresa =
        await getDoc(
            referenciaEmpresa
        );

        if(
            documentoEmpresa.exists()
        ){

            empresaActual =
            documentoEmpresa.data();

        }

    }
    catch(error){

        console.error(
            "Error empresa:",
            error
        );

    }

}


// ==========================================
// CARGAR USUARIOS DE EMPRESA
// ==========================================

async function cargarUsuariosEmpresa(){

    usuariosEmpresa = [];

    destinatario.innerHTML = `
        <option value="">
            Cargando empleados...
        </option>
    `;


    const snapshot =
    await getDocs(
        collection(
            db,
            "usuarios"
        )
    );


    snapshot.forEach(
        function(documento){

            const datos =
            documento.data();


            const pertenece =
            String(
                datos.empresaId ||
                datos.empresa ||
                ""
            ) ===
            String(
                empresaIdActual
            );


            if(!pertenece){

                return;

            }


            if(
                documento.id ===
                usuarioActual.uid
            ){

                return;

            }


            const nombre =
            [
                datos.nombre,
                datos.apellido
            ]
            .filter(Boolean)
            .join(" ");


            usuariosEmpresa.push({

                id:
                documento.id,

                nombre:
                nombre ||
                datos.email ||
                "Usuario",

                email:
                datos.email ||
                "",

                datos:
                datos

            });

        }
    );


    usuariosEmpresa.sort(
        function(a,b){

            return a.nombre.localeCompare(
                b.nombre,
                "es"
            );

        }
    );


    destinatario.innerHTML = `
        <option value="">
            Seleccionar empleado
        </option>
    `;


    usuariosEmpresa.forEach(
        function(usuario){

            const opcion =
            document.createElement(
                "option"
            );

            opcion.value =
            usuario.id;

            opcion.textContent =
            usuario.nombre +
            (
                usuario.email
                ? " — " +
                  usuario.email
                : ""
            );

            destinatario.appendChild(
                opcion
            );

        }
    );


    if(
        usuariosEmpresa.length === 0
    ){

        destinatario.innerHTML = `
            <option value="">
                No hay otros usuarios
            </option>
        `;

    }

}

    if(
        uid ===
        usuarioActual?.uid
    ){

        return "Yo";

    }


    const encontrado =
    usuariosEmpresa.find(
        function(item){

            return item.id ===
            uid;

        }
    );


    if(encontrado){

        return encontrado.nombre;

    }


    return "Usuario";

}


// ==========================================
// CORREOS
// ==========================================

async function cargarCorreos(){

    cargando.style.display =
    "block";

    lista.style.display =
    "none";

    sinMensajes.style.display =
    "none";


    try{

        const snapshot =
        await getDocs(
            collection(
                db,
                "correos"
            )
        );


        correos = [];


        snapshot.forEach(
            function(documento){

                const datos =
                documento.data();


                if(
                    String(
                        datos.empresaId ||
                        ""
                    ) !==
                    String(
                        empresaIdActual
                    )
                ){

                    return;

                }


                const esMio =
                datos.remitenteId ===
                usuarioActual.uid;


                const esParaMi =
                datos.destinatarioId ===
                usuarioActual.uid;


                if(
                    !esMio &&
                    !esParaMi
                ){

                    return;

                }


                correos.push({

                    id:
                    documento.id,

                    ...datos

                });

            }
        );


        actualizarContadores();

        renderizarBandeja();


    }
    catch(error){

        console.error(
            "Error cargando correos:",
            error
        );


        mostrarEstado(
            "No se pudieron cargar los correos. " +
            error.message,
            "error"
        );

    }
    finally{

        cargando.style.display =
        "none";

    }

}


// ==========================================
// CONTADORES
// ==========================================

function actualizarContadores(){

    const recibidos =
    correos.filter(
        function(item){

            return (
                item.destinatarioId ===
                usuarioActual.uid
            );

        }
    );


    const enviados =
    correos.filter(
        function(item){

            return (
                item.remitenteId ===
                usuarioActual.uid
            );

        }
    );


    const noLeidos =
    recibidos.filter(
        function(item){

            return !item.leido;

        }
    );


    contadorRecibidos.textContent =
    recibidos.length;

    contadorEnviados.textContent =
    enviados.length;

    contadorNoLeidos.textContent =
    noLeidos.length;

}


// ==========================================
// RENDERIZAR BANDEJA
// ==========================================

function renderizarBandeja(){

    lista.innerHTML = "";


    let resultados;


    if(
        bandejaActual ===
        "enviados"
    ){

        resultados =
        correos.filter(
            function(item){

                return (
                    item.remitenteId ===
                    usuarioActual.uid
                );

            }
        );

    }
    else{

        resultados =
        correos.filter(
            function(item){

                return (
                    item.destinatarioId ===
                    usuarioActual.uid
                );

            }
        );

    }


    resultados.sort(
        function(a,b){

            const fechaA =
            a.creado?.seconds ||
            0;

            const fechaB =
            b.creado?.seconds ||
            0;

            return fechaB - fechaA;

        }
    );


    if(
        resultados.length === 0
    ){

        lista.style.display =
        "none";

        sinMensajes.style.display =
        "block";

        return;

    }


    sinMensajes.style.display =
    "none";

    lista.style.display =
    "flex";


    resultados.forEach(
        function(correo){

            crearTarjeta(
                correo
            );

        }
    );

}


// ==========================================
// TARJETA
// ==========================================

function crearTarjeta(
    correo
){

    const tarjeta =
    document.createElement(
        "div"
    );


    const recibido =
    correo.destinatarioId ===
    usuarioActual.uid;


    const noLeido =
    recibido &&
    !correo.leido;


    tarjeta.className =
    "mensaje " +
    (
        noLeido
        ? "no-leido"
        : ""
    );


    const persona =
    recibido
    ? nombreUsuario(
        correo.remitenteId
      )
    : nombreUsuario(
        correo.destinatarioId
      );


    const adjuntos =
    Array.isArray(
        correo.adjuntos
    )
    ? correo.adjuntos.length
    : 0;


    tarjeta.innerHTML = `

        <div class="mensaje-cabecera">

            <div class="mensaje-remitente">

                ${
                    recibido
                    ? "De: "
                    : "Para: "
                }

                ${escapar(
                    persona
                )}

            </div>


            <div class="mensaje-fecha">

                ${escapar(
                    formatoFecha(
                        correo.creado
                    )
                )}

            </div>

        </div>


        <div class="mensaje-asunto">

            ${escapar(
                correo.asunto ||
                "(Sin asunto)"
            )}

        </div>


        <div class="mensaje-vista">

            ${escapar(
                String(
                    correo.mensaje ||
                    ""
                ).substring(
                    0,
                    150
                )
            )}

            ${
                String(
                    correo.mensaje ||
                    ""
                ).length > 150
                ? "..."
                : ""
            }

        </div>


        ${
            adjuntos > 0
            ?
            `
            <div class="adjunto-mini">
                📎 ${adjuntos}
                ${
                    adjuntos === 1
                    ? "archivo"
                    : "archivos"
                }
            </div>
            `
            :
            ""
        }


        ${
            noLeido
            ?
            `
            <div class="indicador-no-leido">
                NUEVO
            </div>
            `
            :
            ""
        }

    `;


    tarjeta.addEventListener(
        "click",
        function(){

            abrirCorreo(
                correo
            );

        }
    );


    lista.appendChild(
        tarjeta
    );

}


// ==========================================
// ABRIR CORREO
// ==========================================

async function abrirCorreo(
    correo
){

    correoSeleccionado =
    correo;


    if(
        correo.destinatarioId ===
        usuarioActual.uid &&
        !correo.leido
    ){

        try{

            await updateDoc(
                doc(
                    db,
                    "correos",
                    correo.id
                ),
                {
                    leido:true,
                    fechaLectura:
                    serverTimestamp()
                }
            );


            correo.leido =
            true;


            actualizarContadores();

        }
        catch(error){

            console.error(
                "Error marcando leído:",
                error
            );

        }

    }


    const recibido =
    correo.destinatarioId ===
    usuarioActual.uid;


    const persona =
    recibido
    ? nombreUsuario(
        correo.remitenteId
      )
    : nombreUsuario(
        correo.destinatarioId
      );


    let adjuntosHTML = "";


    if(
        Array.isArray(
            correo.adjuntos
        ) &&
        correo.adjuntos.length
    ){

        adjuntosHTML = `

            <div class="detalle-adjuntos">

                <h3>
                📎 Archivos adjuntos
                </h3>

                ${
                    correo.adjuntos
                    .map(
                        function(archivo){

                            return `

                                <div class="adjunto">

                                    <div class="adjunto-info">

                                        <div class="adjunto-nombre">

                                            ${escapar(
                                                archivo.nombre
                                            )}

                                        </div>

                                        <div class="adjunto-tamano">

                                            ${escapar(
                                                archivo.tipo ||
                                                "Archivo"
                                            )}

                                        </div>

                                    </div>


                                    <button
                                        type="button"
                                        data-descargar="${escapar(
                                            archivo.url
                                        )}"
                                    >
                                        📥 Abrir
                                    </button>

                                </div>

                            `;

                        }
                    )
                    .join("")
                }

            </div>

        `;

    }


    detalleBody.innerHTML = `

        <div class="detalle-linea">

            <div class="detalle-label">
            ${recibido ? "REMITENTE" : "DESTINATARIO"}
            </div>

            <div class="detalle-valor">
            ${escapar(persona)}
            </div>

        </div>


        <div class="detalle-linea">

            <div class="detalle-label">
            ASUNTO
            </div>

            <div class="detalle-valor">

            ${escapar(
                correo.asunto ||
                "(Sin asunto)"
            )}

            </div>

        </div>


        <div class="detalle-linea">

            <div class="detalle-label">
            FECHA
            </div>

            <div class="detalle-valor">

            ${escapar(
                formatoFecha(
                    correo.creado
                )
            )}

            </div>

        </div>


        <div class="detalle-mensaje">

            ${escapar(
                correo.mensaje ||
                ""
            )}

        </div>


        ${adjuntosHTML}


        <div class="detalle-acciones">

            ${
                recibido
                ?
                `
                <button
                    id="btnContestar"
                    class="btn-contestar"
                    type="button"
                >
                    ↩️ Contestar
                </button>
                `
                :
                `
                <button
                    id="btnContestar"
                    class="btn-contestar"
                    type="button"
                >
                    ↩️ Responder
                </button>
                `
            }


            <button
                id="btnReenviar"
                class="btn-reenviar"
                type="button"
            >
                🔁 Reenviar
            </button>


            <button
                id="btnEliminarMensaje"
                class="btn-eliminar-mensaje"
                type="button"
            >
                🗑️ Eliminar
            </button>


            <button
                id="btnCerrarDetalle2"
                class="btn-cerrar-detalle"
                type="button"
            >
                Cerrar
            </button>

        </div>

    `;


    detalleBody
    .querySelectorAll(
        "[data-descargar]"
    )
    .forEach(
        function(boton){

            boton.addEventListener(
                "click",
                function(){

                    const url =
                    boton.dataset.descargar;

                    if(url){

                        window.open(
                            url,
                            "_blank"
                        );

                    }

                }
            );

        }
    );


    document
    .getElementById(
        "btnContestar"
    )
    .addEventListener(
        "click",
        function(){

            abrirResponder(
                correo
            );

        }
    );

    .getElementById(
        "btnReenviar"
    )
    .addEventListener(

        function(){

            abrirReenviar(
                correo

        }

    .getElementById(

    )

        function(){

    .getElementById(

    )

// REENVIAR
// ==========================================

function abrirReenviar(
    correo
){

    cerrarModalDetalle();


    modoFormulario =
    "reenviar";


    tituloFormulario.textContent =
    "Reenviar correo";


    destinatario.disabled =
    false;


    destinatario.value =

    correo.asunto
    ? (
        correo.asunto
        .toLowerCase()
        .startsWith("fwd:")
        ? correo.asunto
        : "Fwd: " +
          correo.asunto
      )
    : "Fwd:";

    "\n\n--- Mensaje reenviado ---\n" +
    "De: " +
    nombreUsuario(
        correo.remitenteId
    ) +
    "\n" +
    "Fecha: " +
    formatoFecha(
        correo.creado
    ) +
    "\n\n" +
    (
        correo.mensaje ||
        ""
    );


    archivosSeleccionados =
    [];


    archivosInput.value =
    "";


    renderizarArchivos();


    modalNuevo.classList.add(
        "visible"
    );

}


// ==========================================
// ARCHIVOS SELECCIONADOS
// ==========================================

archivosInput.addEventListener(
    "change",
    function(){

        const nuevos =
        Array.from(
            archivosInput.files
        );


        nuevos.forEach(
            function(archivo){

                archivosSeleccionados.push(
                    archivo
                );

            }
        );


        archivosInput.value =
        "";


        renderizarArchivos();

    }
);


// ==========================================
// RENDERIZAR ARCHIVOS
// ==========================================

function renderizarArchivos(){

    listaArchivos.innerHTML =
    "";


    archivosSeleccionados.forEach(
        function(archivo,index){

            const div =
            document.createElement(
                "div"
            );


            div.className =
            "archivo";


            div.innerHTML = `

                <span>
                    📎 ${escapar(
                        archivo.name
                    )}
                </span>

                <button
                    type="button"
                    data-quitar="${index}"
                >
                    Quitar
                </button>

            `;


            div
            .querySelector(
                "[data-quitar]"
            )
            .addEventListener(
                "click",
                function(){

                    archivosSeleccionados
                    .splice(
                        index,
                        1
                    );

                    renderizarArchivos();

                }
            );


            listaArchivos.appendChild(
                div
            );

        }
    );

}


// ==========================================
// SUBIR ARCHIVOS
// ==========================================

async function subirArchivos(
    correoId
){

    const resultado = [];


    for(
        const archivo
        of archivosSeleccionados
    ){

        const nombreSeguro =
        archivo.name
        .replace(
            /[^a-zA-Z0-9._-]/g,
            "_"
        );


        const ruta =
        "correos/" +
        empresaIdActual +
        "/" +
        correoId +
        "/" +
        Date.now() +
        "_" +
        nombreSeguro;


        const referencia =
        ref(
            almacenamiento,
            ruta
        );


        await uploadBytes(
            referencia,
            archivo
        );


        const url =
        await getDownloadURL(
            referencia
        );


        resultado.push({

            nombre:
            archivo.name,

            tipo:
            archivo.type ||
            "Archivo",

            tamaño:
            archivo.size,

            ruta:
            ruta,

            url:
            url

        });

    }


    return resultado;

}


// ==========================================
// ENVIAR CORREO
// ==========================================

btnEnviar.addEventListener(
    "click",
    async function(){

        if(!usuarioActual){

            mostrarEstado(
                "No hay una sesión activa.",
                "error"
            );

            return;

        }


        if(!empresaIdActual){

            mostrarEstado(
                "No se pudo identificar la empresa.",
                "error"
            );

            return;

        }


        const destinatarioId =
        destinatario.value;


        if(!destinatarioId){

            mostrarEstado(
                "Seleccioná un destinatario.",
                "error"
            );

            return;

        }


        if(
            destinatarioId ===
            usuarioActual.uid
        ){

            mostrarEstado(
                "No podés enviarte un correo a vos mismo.",
                "error"
            );

            return;

        }


        const empleado =
        usuariosEmpresa.find(
            function(item){

                return item.id ===
                destinatarioId;

            }
        );


        if(!empleado){

            mostrarEstado(
                "El destinatario no pertenece a tu empresa.",
                "error"
            );

            return;

        }


        const asuntoTexto =
        asunto.value.trim();


        const mensajeTexto =
        mensaje.value.trim();


        if(!asuntoTexto){

            mostrarEstado(
                "Ingresá un asunto.",
                "error"
            );

            return;

        }


        if(!mensajeTexto){

            mostrarEstado(
                "Escribí el mensaje.",
                "error"
            );

            return;

        }


        btnEnviar.disabled =
        true;

        btnEnviar.textContent =
        "Enviando...";


        try{

            /*
             * Primero creamos el correo
             * para obtener su ID.
             */

            const referencia =
            await addDoc(
                collection(
                    db,
                    "correos"
                ),
                {

                    empresaId:
                    empresaIdActual,

                    remitenteId:
                    usuarioActual.uid,

                    remitenteEmail:
                    usuarioActual.email ||
                    "",

                    destinatarioId:
                    destinatarioId,

                    destinatarioEmail:
                    empleado.email ||
                    "",

                    asunto:
                    asuntoTexto,

                    mensaje:
                    mensajeTexto,

                    adjuntos:
                    [],

                    leido:
                    false,

                    tipo:
                    modoFormulario,

                    correoOriginalId:
                    correoSeleccionado?.id ||
                    "",

                    creado:
                    serverTimestamp()

                }
            );


            /*
             * Subir archivos
             */

            let adjuntos = [];


            if(
                archivosSeleccionados.length > 0
            ){

                mostrarEstado(
                    "Subiendo archivos...",
                    "info"
                );


                adjuntos =
                await subirArchivos(
                    referencia.id
                );


                await updateDoc(
                    referencia,
                    {
                        adjuntos:
                        adjuntos
                    }
                );

            }


            mostrarEstado(
                "Correo enviado correctamente.",
                "exito"
            );


            cerrarModalNuevo();


            await cargarCorreos();

        }
        catch(error){

            console.error(
                "Error enviando correo:",
                error
            );


            mostrarEstado(
                "No se pudo enviar el correo. " +
                error.message,
                "error"
            );

        }
        finally{

            btnEnviar.disabled =
            false;

            btnEnviar.textContent =
            "📤 Enviar correo";

        }

    }
);


// ==========================================
// ELIMINAR
// ==========================================

async function eliminarCorreo(
    correo
){

    if(!confirm(
        "¿Querés eliminar este correo?"
    )){

        return;

    }


    try{

        /*
         * Solo permitimos eliminar
         * correos donde el usuario participa.
         */

        if(
            correo.remitenteId !==
            usuarioActual.uid &&
            correo.destinatarioId !==
            usuarioActual.uid
        ){

            mostrarEstado(
                "No tenés permiso para eliminar este correo.",
                "error"
            );

            return;

        }


        await deleteDoc(
            doc(
                db,
                "correos",
                correo.id
            )
        );


        cerrarModalDetalle();


        mostrarEstado(
            "Correo eliminado correctamente.",
            "exito"
        );


        await cargarCorreos();

    }
    catch(error){

        console.error(
            "Error eliminando correo:",
            error
        );


        mostrarEstado(
            "No se pudo eliminar el correo. " +
            error.message,
            "error"
        );

    }

}
