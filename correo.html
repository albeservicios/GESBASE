/* =====================================================

/* =====================================================
   UTILIDADES
===================================================== */

function texto(valor){

    if(
        valor === null ||
        valor === undefined
    ){
        return "";
    }

    return String(valor);

}


function escaparHTML(valor){

    return texto(valor)
        .replace(/&/g,"&amp;")
        .replace(/</g,"&lt;")
        .replace(/>/g,"&gt;")
        .replace(/"/g,"&quot;")
        .replace(/'/g,"&#039;");

}


function nombreCompleto(datos){

    return (
        texto(datos.nombre) +
        " " +
        texto(datos.apellido)
    ).trim();

}


function mostrarError(error){

function fechaActual(){

/* =====================================================
   BUSCAR EMPLEADO POR UID
===================================================== */

async function buscarEmpleado(){

    console.log(
        "Buscando empleado por UID:",
        usuarioSesion.uid
    );


    try{

        const consulta =
        query(
            collection(db,"empleados"),
            where(
                "uid",
                "==",
                usuarioSesion.uid
            ),
            limit(1)
        );


        const resultado =
        await getDocs(
            consulta
        );


        if(!resultado.empty){

            const documento =
            resultado.docs[0];

            console.log(
                "Empleado encontrado por uid"
            );

            return {
                id:documento.id,
                ...documento.data()
            };

        }

    }
    catch(error){

        console.warn(
            "Error buscando empleado por uid:",
            error
        );

    }


    try{

        const consulta =
        query(
            collection(db,"empleados"),
            where(
                "authUid",
                "==",
                usuarioSesion.uid
            ),
            limit(1)
        );


        const resultado =
        await getDocs(
            consulta
        );


        if(!resultado.empty){

            const documento =
            resultado.docs[0];

            console.log(
                "Empleado encontrado por authUid"
            );

            return {
                id:documento.id,
                ...documento.data()
            };

        }

    }
    catch(error){

        console.warn(
            "Error buscando empleado por authUid:",
            error
        );

    }


    try{

        const documento =
        await getDoc(
            doc(
                db,
                "empleados",
                usuarioSesion.uid
            )
        );


        if(documento.exists()){

            console.log(
                "Empleado encontrado por ID del documento"
            );

            return {
                id:documento.id,
                ...documento.data()
            };

        }

    }
    catch(error){

        console.warn(
            "Error buscando empleado por ID:",
            error
        );

    }


    return null;

}


/* =====================================================
   BUSCAR USUARIO
===================================================== */

async function buscarUsuario(){

    try{

        const documento =
        await getDoc(
            doc(
                db,
                "usuarios",
                usuarioSesion.uid
            )
        );


        if(documento.exists()){

            return {
                id:documento.id,
                ...documento.data()
            };

        }

    }
    catch(error){

        console.warn(
            "No se pudo buscar usuario por ID:",
            error
        );

    }


    try{

        const consulta =
        query(
            collection(db,"usuarios"),
            where(
                "uid",
                "==",
                usuarioSesion.uid
            ),
            limit(1)
        );


        const resultado =
        await getDocs(
            consulta
        );


        if(!resultado.empty){

            const documento =
            resultado.docs[0];

            return {
                id:documento.id,
                ...documento.data()
            };

        }

    }
    catch(error){

        console.warn(
            "No se pudo buscar usuario por uid:",
            error
        );

    }


    return null;

}


/* =====================================================
   CARGAR PERFIL
===================================================== */

async function cargarPerfil(){

    if(!usuarioSesion){

        throw new Error(
            "No hay una sesión activa."
        );

    }


    /*
       IMPORTANTE:

       Primero buscamos en EMPLEADOS.
       Esto corrige el problema principal.
    */

    let perfil =
    await buscarEmpleado();


    /*
       Si no está en empleados,
       buscamos en usuarios.
    */

    if(!perfil){

        perfil =
        await buscarUsuario();

    }


    if(!perfil){

        throw new Error(
            "No se encontró tu perfil en GESBASE. Verificá que tu usuario esté registrado en la colección empleados o usuarios."
        );

    }


    perfilActual =
    perfil;

    perfilId =
    perfil.id;


    /*
       BUSCAR EMPRESA ID
    */

    empresaId =

        texto(perfil.empresaId).trim() ||

        texto(perfil.idEmpresa).trim() ||

        texto(perfil.empresaID).trim() ||

        texto(perfil.empresa).trim();


    /*
       Si el perfil es una empresa
       puede usar su propio UID.
    */

    if(!empresaId){

        const esEmpresa =

            texto(perfil.tipo)
            .toLowerCase() === "empresa" ||

            texto(perfil.rol)
            .toLowerCase() === "empresa" ||

            Boolean(
                texto(perfil.nombreEmpresa).trim()
            ) ||

            Boolean(
                texto(perfil.razonSocial).trim()
            );


        if(esEmpresa){

            empresaId =
            texto(perfil.uid).trim() ||
            usuarioSesion.uid;

        }

    }


    if(!empresaId){

        throw new Error(
            "El empleado fue encontrado, pero no tiene empresaId. Hay que asignarle el empresaId de la empresa en Firebase."
        );

    }


    tipoPerfil =

        texto(perfil.rol).trim() ||

        texto(perfil.tipo).trim() ||

        "Empleado";


    const nombre =

        texto(perfil.nombreEmpresa).trim() ||

        texto(perfil.razonSocial).trim() ||

        nombreCompleto(perfil) ||

        "Empleado";


    const email =

        texto(perfil.email).trim() ||

        texto(usuarioSesion.email).trim();


    usuarioActual.innerHTML = `

        <strong>
            ${escaparHTML(nombre)}
        </strong>

        <br>

        Tipo:
        ${escaparHTML(tipoPerfil)}

        <br>

        Correo:
        ${escaparHTML(email)}

        <br>

        Empresa ID:
        ${escaparHTML(empresaId)}

    `;


    console.log(
        "PERFIL CARGADO:",
        perfilActual
    );

    console.log(
        "EMPRESA ID:",
        empresaId
    );

}


/* =====================================================
   AGREGAR DESTINATARIO
===================================================== */

function agregarDestinatario(datos){

    if(!datos){
        return;
    }


    const id =
    texto(datos.id).trim();


    if(!id){
        return;
    }


    /*
       No agregamos al usuario actual.
    */

    if(id === perfilId){
        return;
    }


    const uid =
    texto(datos.uid).trim() ||
    texto(datos.authUid).trim();


    if(
        uid &&
        uid === usuarioSesion.uid
    ){
        return;
    }


    const empresaPersona =

        texto(datos.empresaId).trim() ||

        texto(datos.idEmpresa).trim() ||

        texto(datos.empresaID).trim();


    /*
       Seguridad adicional:
       solamente personas de la misma empresa.
    */

    if(
        empresaPersona &&
        empresaPersona !== empresaId
    ){

        return;

    }


    const existe =
    destinatarios.some(
        persona => {

            return (

                persona.id === id

                ||

                (
                    uid &&
                    persona.uid &&
                    uid === persona.uid
                )

            );

        }
    );


    if(existe){
        return;
    }


    let nombre =

        nombreCompleto(datos) ||

        texto(datos.nombreEmpresa).trim() ||

        texto(datos.razonSocial).trim() ||

        texto(datos.nombre).trim() ||

        texto(datos.email).trim() ||

        "Usuario";


    let tipo =

        texto(datos.rol).trim() ||

        texto(datos.tipo).trim() ||

        "Usuario";


    destinatarios.push({

        id:id,

        uid:
        texto(datos.uid).trim(),

        authUid:
        texto(datos.authUid).trim(),

        nombre:nombre,

        email:
        texto(datos.email).trim(),

        tipo:tipo

    });

}

/* =====================================================
   GRABAR AUDIO
===================================================== */

btnGrabar.addEventListener(
    "click",
    async function(){

        limpiarMensajes();


        if(
            !navigator.mediaDevices ||
            !navigator.mediaDevices.getUserMedia
        ){

            mostrarError(
                "Tu navegador no permite acceder al micrófono."
            );

            return;

        }


        try{

            const stream =
            await navigator.mediaDevices.getUserMedia({
                audio:true
            });


            audioChunks = [];

            audioBlob = null;


            let tipoAudio =
            "audio/webm";


            if(
                MediaRecorder.isTypeSupported(
                    "audio/webm;codecs=opus"
                )
            ){

                tipoAudio =
                "audio/webm;codecs=opus";

            }


            mediaRecorder =
            new MediaRecorder(
                stream,
                {
                    mimeType:tipoAudio
                }
            );


            mediaRecorder.ondataavailable =
            function(event){

                if(
                    event.data &&
                    event.data.size > 0
                ){

                    audioChunks.push(
                        event.data
                    );

                }

            };


            mediaRecorder.onstop =
            function(){

                audioBlob =
                new Blob(
                    audioChunks,
                    {
                        type:
                        mediaRecorder.mimeType ||
                        "audio/webm"
                    }
                );


                if(audioURL){

                    URL.revokeObjectURL(
                        audioURL
                    );

                }


                audioURL =
                URL.createObjectURL(
                    audioBlob
                );


                audioPreview.src =
                audioURL;


                audioPreview.style.display =
                "block";


                estadoGrabacion.style.display =
                "none";


                btnGrabar.disabled =
                false;


                btnDetener.disabled =
                true;


                stream.getTracks()
                .forEach(
                    track =>
                    track.stop()
                );

            };


            mediaRecorder.start();


            estadoGrabacion.style.display =
            "block";


            btnGrabar.disabled =
            true;


            btnDetener.disabled =
            false;

        }
        catch(error){

            console.error(
                "ERROR MICRÓFONO:",
                error
            );


            mostrarError(
                "No se pudo acceder al micrófono. Permití el acceso desde el navegador e intentá nuevamente."
            );

        }

    }
);

/* =====================================================
   SUBIR ARCHIVO
===================================================== */

async function subirArchivo(file){

    if(!file){

        return null;

    }


    const nombreSeguro =
    file.name.replace(
        /[^a-zA-Z0-9._-]/g,
        "_"
    );


    const ruta =

        "correos/" +

        empresaId +

        "/" +

        usuarioSesion.uid +

        "/" +

        Date.now() +

        "_" +

        nombreSeguro;


    const referencia =
    ref(
        storage,
        ruta
    );


    await uploadBytes(
        referencia,
        file
    );


    const url =
    await getDownloadURL(
        referencia
    );


    return {

        tipo:"archivo",

        nombre:file.name,

        mimeType:file.type,

        tamanio:file.size,

        url:url,

        ruta:ruta

    };

}


/* =====================================================
   SUBIR AUDIO
===================================================== */

async function subirAudio(){

    if(!audioBlob){

        return null;

    }


    const extension =
    audioBlob.type.includes("ogg")
    ? "ogg"
    : "webm";


    const nombre =

        "audio_" +

        Date.now() +

        "." +

        extension;


    const ruta =

        "correos/" +

        empresaId +

        "/" +

        usuarioSesion.uid +

        "/" +

        nombre;


    const referencia =
    ref(
        storage,
        ruta
    );


    await uploadBytes(
        referencia,
        audioBlob,
        {
            contentType:
            audioBlob.type
        }
    );


    const url =
    await getDownloadURL(
        referencia
    );


    return {

        tipo:"audio",

        nombre:nombre,

        mimeType:
        audioBlob.type,

        tamanio:
        audioBlob.size,

        url:url,

        ruta:ruta

    };

}

/* =====================================================
   OBTENER TIEMPO
===================================================== */

function obtenerTiempo(correo){

    try{

        if(
            correo.creado &&
            typeof correo.creado.toMillis ===
            "function"
        ){

            return correo.creado.toMillis();

        }

    }
    catch(error){

        console.warn(error);

    }


    const fecha =
    texto(correo.fecha);


    const hora =
    texto(correo.hora) ||
    "00:00:00";


    const valor =
    new Date(
        `${fecha}T${hora}`
    ).getTime();


    return isNaN(valor)
        ? 0
        : valor;

}


/* =====================================================
   RECIBIDOS
===================================================== */

async function cargarRecibidos(){

    recibidos.innerHTML = `

        <div class="cargando">
            Cargando mensajes...
        </div>

    `;


    try{

        const correos = [];


        /*
           BUSCAR POR UID
        */

        try{

            const consulta =
            query(

                collection(
                    db,
                    "correos"
                ),

                where(
                    "destinatarioUid",
                    "==",
                    usuarioSesion.uid
                ),

                limit(100)

            );


            const resultado =
            await getDocs(
                consulta
            );


            resultado.forEach(
                documento => {

                    correos.push({

                        id:
                        documento.id,

                        ...documento.data()

                    });

                }
            );

        }
        catch(error){

            console.warn(
                "No se pudo buscar recibidos por UID:",
                error
            );

        }


        /*
           BUSCAR POR EMAIL
        */

        const emailActual =

            texto(
                perfilActual.email
            ).trim() ||

            texto(
                usuarioSesion.email
            ).trim();


        if(emailActual){

            try{

                const consulta =
                query(

                    collection(
                        db,
                        "correos"
                    ),

                    where(
                        "destinatarioEmail",
                        "==",
                        emailActual
                    ),

                    limit(100)

                );


                const resultado =
                await getDocs(
                    consulta
                );


                resultado.forEach(
                    documento => {

                        if(
                            !correos.some(
                                correo =>
                                correo.id ===
                                documento.id
                            )
                        ){

                            correos.push({

                                id:
                                documento.id,

                                ...documento.data()

                            });

                        }

                    }
                );

            }
            catch(error){

                console.warn(
                    "No se pudo buscar por destinatarioEmail:",
                    error
                );

            }


            try{

                const consulta =
                query(

                    collection(
                        db,
                        "correos"
                    ),

                    where(
                        "para",
                        "==",
                        emailActual
                    ),

                    limit(100)

                );


                const resultado =
                await getDocs(
                    consulta
                );


                resultado.forEach(
                    documento => {

                        if(
                            !correos.some(
                                correo =>
                                correo.id ===
                                documento.id
                            )
                        ){

                            correos.push({

                                id:
                                documento.id,

                                ...documento.data()

                            });

                        }

                    }
                );

            }
            catch(error){

                console.warn(
                    "No se pudo buscar por para:",
                    error
                );

            }

        }


        /*
           FILTRAR EMPRESA
        */

        const filtrados =
        correos.filter(
            correo => {

                const empresaCorreo =

                    texto(
                        correo.empresaId
                    ).trim();


                if(
                    empresaCorreo &&
                    empresaCorreo !== empresaId
                ){

                    return false;

                }


                return true;

            }
        );


        correosRecibidos =
        filtrados;


        correosRecibidos.sort(
            function(a,b){

                return (
                    obtenerTiempo(b) -
                    obtenerTiempo(a)
                );

            }
        );


        mostrarRecibidos();

    }
    catch(error){

        console.error(
            "ERROR RECIBIDOS:",
            error
        );


        recibidos.innerHTML = `

            <div class="sin-registros">

                No se pudieron cargar los mensajes.

                <br><br>

                ${escaparHTML(
                    error.message
                )}

            </div>

        `;

    }

}

                        id:
                        documento.id,

                        ...documento.data()

                    });

                }
            );

        }
        catch(error){

            console.warn(
                "Error buscando enviados por usuarioId:",
                error
            );

        }


        /*
           remitenteUid
        */

        try{

            const consulta =
            query(

                collection(
                    db,
                    "correos"
                ),

                where(
                    "remitenteUid",
                    "==",
                    usuarioSesion.uid
                ),

                limit(100)

            );


            const resultado =
            await getDocs(
                consulta
            );


            resultado.forEach(
                documento => {

                    if(
                        !correos.some(
                            correo =>
                            correo.id ===
                            documento.id
                        )
                    ){

                        correos.push({

                            id:
                            documento.id,

                            ...documento.data()

                        });

                    }

                }
            );

        }
        catch(error){

            console.warn(
                "Error buscando enviados por remitenteUid:",
                error
            );

        }


        /*
           Filtrar empresa
        */

        correosEnviados =
        correos.filter(
            correo => {

                const empresaCorreo =
                texto(
                    correo.empresaId
                ).trim();


                if(
                    empresaCorreo &&
                    empresaCorreo !== empresaId
                ){

                    return false;

                }


                return true;

            }
        );


        correosEnviados.sort(
            function(a,b){

                return (
                    obtenerTiempo(b) -
                    obtenerTiempo(a)
                );

            }
        );


        mostrarEnviados();

    }
    catch(error){

        console.error(
            "ERROR ENVIADOS:",
            error
        );


        enviados.innerHTML = `

            <div class="sin-registros">

                No se pudieron cargar los enviados.

                <br><br>

                ${escaparHTML(
                    error.message
                )}

            </div>

        `;

    }

}


/* =====================================================
   MOSTRAR ENVIADOS
===================================================== */

function mostrarEnviados(){

    if(
        correosEnviados.length === 0
    ){

        enviados.innerHTML = `

            <div class="sin-registros">
                No tenés mensajes enviados.
            </div>

        `;

        return;

    }


    enviados.innerHTML = "";


    correosEnviados.forEach(
        correo => {

            const item =
            document.createElement("div");


            item.className =
            "correo-item";


            const destinatarioNombre =

                texto(
                    correo.destinatarioNombre
                ) ||

                texto(
                    correo.para
                ) ||

                "Usuario";


            const icono =

                correo.tieneAudio
                ? " 🎙️"
                : correo.tieneArchivo
                ? " 📎"
                : "";


            item.innerHTML = `

                <div class="correo-cabecera">

                    <div class="correo-persona">

                        Para:
                        ${escaparHTML(
                            destinatarioNombre
                        )}

                    </div>

                    <div class="correo-fecha">

                        ${escaparHTML(
                            correo.fecha ||
                            fechaHora(
                                correo.creado
                            )
                        )}

                        ${escaparHTML(
                            correo.hora
                        )}

                    </div>

                </div>


                <div class="correo-asunto">

                    ${escaparHTML(
                        correo.asunto
                    )}

                    ${icono}

                </div>


                <div class="correo-resumen">

                    ${escaparHTML(

                        texto(
                            correo.mensaje
                        ).substring(
                            0,
                            180
                        )

                    )}

                </div>

            `;


            item.addEventListener(
                "click",
                function(){

                    abrirCorreo(
                        correo,
                        false
                    );

                }
            );


            enviados.appendChild(
                item
            );

        }
    );

}


/* =====================================================
   ABRIR CORREO
===================================================== */

async function abrirCorreo(
    correo,
    esRecibido
){

    const remitente =

        texto(
            correo.remitenteNombre
        ) ||

        texto(
            correo.de
        ) ||

        "Usuario";


    const destinatarioNombre =

        texto(
            correo.destinatarioNombre
        ) ||

        texto(
            correo.para
        ) ||

        "Usuario";


    detalleCorreo.innerHTML = `

        <div class="detalle-linea">

            <strong>
                De:
            </strong>

            ${escaparHTML(
                remitente
            )}

        </div>


        <div class="detalle-linea">

            <strong>
                Para:
            </strong>

            ${escaparHTML(
                destinatarioNombre
            )}

        </div>


        <div class="detalle-linea">

            <strong>
                Asunto:
            </strong>

            ${escaparHTML(
                correo.asunto
            )}

        </div>


        <div class="detalle-linea">

            <strong>
                Fecha:
            </strong>

            ${escaparHTML(
                correo.fecha ||
                fechaHora(
                    correo.creado
                )
            )}

            ${escaparHTML(
                correo.hora
            )}

        </div>


        <div
            style="
                height:1px;
                background:#e5e7eb;
                margin:18px 0;
            "
        ></div>


        <div class="detalle-mensaje">

            ${escaparHTML(
                correo.mensaje
            )}

        </div>


        ${generarAdjuntosHTML(correo)}

    `;


    tarjetaDetalle.classList.remove(
        "oculto"
    );


    tarjetaDetalle.scrollIntoView({
        behavior:"smooth"
    });


    /*
       MARCAR COMO LEÍDO
    */

    if(
        esRecibido &&
        !correo.leido &&
        correo.id
    ){

        try{

            await updateDoc(

                doc(
                    db,
                    "correos",
                    correo.id
                ),

                {
                    leido:true
                }

            );


            correo.leido =
            true;


            mostrarRecibidos();

        }
        catch(error){

            console.warn(
                "No se pudo marcar como leído:",
                error
            );

        }

    }

}

);
