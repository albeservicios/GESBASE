<script type="module">


/* =====================================================
   FIREBASE
===================================================== */

import {
auth,
db
} from "./Js/firebase.js";

import {
onAuthStateChanged,
signOut
}
from
"https://www.gstatic.com/firebasejs/12.1.0/firebase-auth.js";

import {
collection,
addDoc,
getDocs,
updateDoc,
doc,
query,
where,
limit,
serverTimestamp
}
from
"https://www.gstatic.com/firebasejs/12.1.0/firebase-firestore.js";


/* =====================================================
   ELEMENTOS
===================================================== */

const usuarioActual =
document.getElementById("usuarioActual");

const destinatario =
document.getElementById("destinatario");

const asunto =
document.getElementById("asunto");

const mensaje =
document.getElementById("mensaje");

const btnEnviar =
document.getElementById("btnEnviar");

const btnRecibidos =
document.getElementById("btnRecibidos");

const btnEnviados =
document.getElementById("btnEnviados");

const recibidos =
document.getElementById("recibidos");

const enviados =
document.getElementById("enviados");

const tarjetaDetalle =
document.getElementById("tarjetaDetalle");

const detalleCorreo =
document.getElementById("detalleCorreo");

const btnCerrarDetalle =
document.getElementById("btnCerrarDetalle");

const btnVolver =
document.getElementById("btnVolver");

const btnCerrarSesion =
document.getElementById("btnCerrarSesion");

const mensajeError =
document.getElementById("mensajeError");

const mensajeExito =
document.getElementById("mensajeExito");


/* =====================================================
   VARIABLES
===================================================== */

let usuarioSesion = null;

let empleadoActual = null;

let empleadoId = "";

let empresaId = "";

let destinatarios = [];

let correosRecibidos = [];

let correosEnviados = [];


/* =====================================================
   UTILIDADES
===================================================== */

function texto(valor){

if(
valor === undefined ||
valor === null
){
return "";
}

return String(valor);

}


function mostrarError(mensajeTexto){

mensajeError.textContent =
mensajeTexto;

mensajeError.style.display =
"block";

mensajeExito.style.display =
"none";

}


function mostrarExito(mensajeTexto){

mensajeExito.textContent =
mensajeTexto;

mensajeExito.style.display =
"block";

mensajeError.style.display =
"none";

}


function limpiarMensajes(){

mensajeError.style.display =
"none";

mensajeExito.style.display =
"none";

}


function escaparHTML(valor){

return texto(valor)
.replace(/&/g,"&amp;")
.replace(/</g,"&lt;")
.replace(/>/g,"&gt;")
.replace(/"/g,"&quot;")
.replace(/'/g,"&#039;");

}


function nombreCompleto(datos){

const nombre =
texto(datos.nombre).trim();

const apellido =
texto(datos.apellido).trim();

return (
nombre +
" " +
apellido
).trim();

}


function obtenerNombre(datos){

return (

nombreCompleto(datos) ||

texto(datos.nombreCompleto) ||

texto(datos.nombreUsuario) ||

texto(datos.displayName) ||

texto(datos.email) ||

"Usuario"

);

}


function obtenerEmpresa(datos){

return (

texto(datos.empresaId).trim() ||

texto(datos.empresa_id).trim() ||

texto(datos.idEmpresa).trim()

);

}


function obtenerAuthUid(datos){

return (

texto(datos.authUid).trim() ||

texto(datos.uid).trim() ||

texto(datos.userId).trim()

);

}


function obtenerEmail(datos){

return (

texto(datos.email).trim() ||

texto(datos.correo).trim() ||

texto(datos.mail).trim()

);

}


function fechaActual(){

const ahora =
new Date();

return (

ahora.getFullYear() +
"-" +
String(
ahora.getMonth()+1
).padStart(2,"0") +
"-" +
String(
ahora.getDate()
).padStart(2,"0")

);

}


function horaActual(){

const ahora =
new Date();

return (

String(
ahora.getHours()
).padStart(2,"0") +
":" +
String(
ahora.getMinutes()
).padStart(2,"0") +
":" +
String(
ahora.getSeconds()
).padStart(2,"0")

);

}


/* =====================================================
   CARGAR EMPLEADO
===================================================== */

async function cargarEmpleado(){

if(!usuarioSesion){

throw new Error(
"No hay una sesión activa."
);

}

const consulta =
query(
collection(
db,
"empleados"
),
where(
"authUid",
"==",
usuarioSesion.uid
),
limit(1)
);

const resultados =
await getDocs(
consulta
);

if(
resultados.empty
){

throw new Error(
"No encontramos el perfil de empleado vinculado a esta cuenta."
);

}

const documento =
resultados.docs[0];

empleadoId =
documento.id;

empleadoActual = {

id: documento.id,

...documento.data()

};


empresaId =
obtenerEmpresa(
empleadoActual
);


if(!empresaId){

throw new Error(
"El empleado no tiene empresaId. Es necesario vincularlo con la empresa."
);

}


const nombre =
obtenerNombre(
empleadoActual
);


const empresa =
texto(
empleadoActual.empresa
) ||

texto(
empleadoActual.empresaNombre
) ||

"Empresa";


usuarioActual.innerHTML =

`
<strong>
${escaparHTML(nombre)}
</strong>

<br>

Puesto:
${escaparHTML(
texto(
empleadoActual.puesto
) ||
"Empleado"
)}

<br>

Empresa:
${escaparHTML(empresa)}

<br>

Correo:
${escaparHTML(
obtenerEmail(
empleadoActual
) ||
usuarioSesion.email
)}

<br>

Empresa ID:
${escaparHTML(empresaId)}
`;

}


/* =====================================================
   AGREGAR DESTINATARIO SIN DUPLICADOS
===================================================== */

function agregarDestinatario(persona){

if(!persona){

return;

}

if(!persona.id){

return;

}

if(
persona.id === empleadoId &&
persona.tipo === "Empleado"
){

return;

}

const existe =
destinatarios.some(
item =>

(
item.id === persona.id &&
item.tipo === persona.tipo
)

||

(
persona.authUid &&
item.authUid &&
item.authUid === persona.authUid
)

);

if(existe){

return;

}

destinatarios.push(persona);

}


/* =====================================================
   CARGAR EMPLEADOS
===================================================== */

async function cargarEmpleados(){

try{

const consulta =
query(
collection(
db,
"empleados"
),
where(
"empresaId",
"==",
empresaId
)
);

const resultados =
await getDocs(
consulta
);

resultados.forEach(
documento => {

const datos =
documento.data();

agregarDestinatario({

id:
documento.id,

authUid:
obtenerAuthUid(datos),

nombre:
obtenerNombre(datos),

email:
obtenerEmail(datos),

tipo:
"Empleado"

});

});

}
catch(error){

console.warn(
"No se pudieron cargar empleados:",
error
);

}

}


/* =====================================================
   CARGAR ADMINISTRACIÓN
===================================================== */

async function cargarAdministracion(){

/*
   BUSCAMOS ADMINISTRACIÓN EN:

   1. administradores
   2. administracion
   3. usuarios

   Esto permite que el correo funcione aunque
   la estructura actual de GESBASE tenga la
   administración en una de esas colecciones.
*/


const colecciones = [

"administradores",

"administracion",

"usuarios"

];


for(
const nombreColeccion
of colecciones
){

try{

const consulta =
query(
collection(
db,
nombreColeccion
),
where(
"empresaId",
"==",
empresaId
),
limit(100)
);

const resultados =
await getDocs(
consulta
);


resultados.forEach(
documento => {

const datos =
documento.data();


/*
   Si estamos leyendo "usuarios",
   verificamos que realmente sea
   administración.
*/

if(
nombreColeccion === "usuarios"
){

const rol = (
texto(datos.rol) +
" " +
texto(datos.tipo) +
" " +
texto(datos.perfil) +
" " +
texto(datos.puesto)
).toLowerCase();


const esAdmin =

rol.includes("admin") ||

rol.includes("administracion") ||

rol.includes("administración") ||

rol.includes("gerente") ||

rol.includes("dueño") ||

rol.includes("dueno") ||

rol.includes("propietario");


if(!esAdmin){

return;

}

}


const authUid =
obtenerAuthUid(datos);


const email =
obtenerEmail(datos);


const nombre =
obtenerNombre(datos);


if(
!authUid &&
!email
){

return;

}


agregarDestinatario({

id:
documento.id,

authUid:
authUid,

nombre:
nombre,

email:
email,

tipo:
"Administración"

});

});

}
catch(error){

console.warn(
"No se pudo consultar " +
nombreColeccion +
":",
error
);

}

}

}


/* =====================================================
   CARGAR DESTINATARIOS
===================================================== */

async function cargarDestinatarios(){

destinatarios = [];


await cargarEmpleados();

await cargarAdministracion();


destinatario.innerHTML =
"";


if(
destinatarios.length === 0
){

destinatario.innerHTML =

`
<option value="">
No hay destinatarios disponibles
</option>
`;

btnEnviar.disabled =
true;

return;

}


destinatario.innerHTML =

`
<option value="">
Seleccionar destinatario...
</option>
`;


/*
   Primero Administración
   después Empleados.
*/

destinatarios.sort(
function(a,b){

if(
a.tipo === "Administración" &&
b.tipo !== "Administración"
){

return -1;

}

if(
a.tipo !== "Administración" &&
b.tipo === "Administración"
){

return 1;

}

return a.nombre.localeCompare(
b.nombre,
"es"
);

}
);


destinatarios.forEach(
persona => {

const option =
document.createElement(
"option"
);

option.value =
persona.id +
"|" +
persona.tipo;

option.textContent =

(
persona.tipo ===
"Administración"

?

"🧑‍💼 "

:

"👷 "

) +

persona.nombre +

" — " +

persona.tipo;

destinatario.appendChild(
option
);

});

btnEnviar.disabled =
false;

}


/* =====================================================
   OBTENER DESTINATARIO
===================================================== */

function obtenerDestinatario(){

const valor =
destinatario.value;

if(!valor){

return null;

}

const partes =
valor.split("|");

const id =
partes[0];

const tipo =
partes[1];


return destinatarios.find(
persona =>

persona.id === id &&
persona.tipo === tipo
);

}


/* =====================================================
   ENVIAR CORREO
===================================================== */

btnEnviar.addEventListener(
"click",
async function(){

limpiarMensajes();


const persona =
obtenerDestinatario();


const asuntoTexto =
asunto.value.trim();


const mensajeTexto =
mensaje.value.trim();


if(!persona){

mostrarError(
"Seleccioná un destinatario."
);

return;

}


if(!asuntoTexto){

mostrarError(
"Escribí un asunto."
);

asunto.focus();

return;

}


if(!mensajeTexto){

mostrarError(
"Escribí el mensaje."
);

mensaje.focus();

return;

}


if(
!persona.authUid
){

mostrarError(
"El destinatario no tiene una cuenta vinculada. Revisá el authUid de Administración."
);

return;

}


btnEnviar.disabled =
true;

btnEnviar.textContent =
"📤 ENVIANDO...";


try{

const nombreRemitente =
obtenerNombre(
empleadoActual
);


const emailRemitente =
obtenerEmail(
empleadoActual
) ||

usuarioSesion.email;


await addDoc(

collection(
db,
"correos"
),

{

empresaId:
empresaId,

remitenteUid:
usuarioSesion.uid,

remitenteId:
empleadoId,

remitenteNombre:
nombreRemitente,

remitenteEmail:
emailRemitente,

destinatarioUid:
persona.authUid,

destinatarioId:
persona.id,

destinatarioNombre:
persona.nombre,

destinatarioEmail:
persona.email,

destinatarioTipo:
persona.tipo,

asunto:
asuntoTexto,

mensaje:
mensajeTexto,

fecha:
fechaActual(),

hora:
horaActual(),

creado:
serverTimestamp(),

leido:
false,

tipo:
"interno",

estado:
"enviado"

}

);


asunto.value =
"";

mensaje.value =
"";

destinatario.value =
"";


mostrarExito(
"Mensaje enviado correctamente a " +
persona.nombre +
"."
);


await cargarEnviados();

}
catch(error){

console.error(
"Error enviando correo:",
error
);

mostrarError(
"No se pudo enviar el mensaje: " +
error.message
);

}
finally{

btnEnviar.disabled =
false;

btnEnviar.textContent =
"📤 ENVIAR MENSAJE";

}

});


/* =====================================================
   CARGAR RECIBIDOS
===================================================== */

async function cargarRecibidos(){

recibidos.innerHTML =

`
<div class="cargando">
Cargando mensajes...
</div>
`;


try{

const consulta =
query(

collection(
db,
"correos"
),

where(
"destinatarioUid",
"==",
usuarioSesion.uid
),

limit(100)

);


const resultados =
await getDocs(
consulta
);


correosRecibidos = [];


resultados.forEach(
documento => {

correosRecibidos.push({

id:
documento.id,

...documento.data()

});

});


correosRecibidos.sort(
function(a,b){

const fechaA =
texto(a.fecha) +
" " +
texto(a.hora);

const fechaB =
texto(b.fecha) +
" " +
texto(b.hora);

return fechaB.localeCompare(
fechaA
);

}
);


mostrarRecibidos();

}
catch(error){

console.error(
"Error recibidos:",
error
);

recibidos.innerHTML =

`
<div class="sin-registros">
No se pudieron cargar los mensajes.
</div>
`;

}

}


/* =====================================================
   MOSTRAR RECIBIDOS
===================================================== */

function mostrarRecibidos(){

if(
correosRecibidos.length === 0
){

recibidos.innerHTML =

`

/* =====================================================
   CARGAR ENVIADOS
===================================================== */

async function cargarEnviados(){

enviados.innerHTML =

`
<div class="cargando">
Cargando mensajes...
</div>
`;


try{

const consulta =
query(

collection(
db,
"correos"
),

where(
"remitenteUid",
"==",
usuarioSesion.uid
),

limit(100)

);


const resultados =
await getDocs(
consulta
);


correosEnviados = [];


resultados.forEach(
documento => {

correosEnviados.push({

id:
documento.id,

...documento.data()

});

});


correosEnviados.sort(
function(a,b){

const fechaA =
texto(a.fecha) +
" " +
texto(a.hora);

const fechaB =
texto(b.fecha) +
" " +
texto(b.hora);

return fechaB.localeCompare(
fechaA
);

}
);


mostrarEnviados();

}
catch(error){

console.error(
"Error enviados:",
error
);

enviados.innerHTML =

`
<div class="sin-registros">
No se pudieron cargar los mensajes enviados.
</div>
`;

}

}


/* =====================================================
   MOSTRAR ENVIADOS

if(

enviados.innerHTML =

`

return;

enviados.innerHTML =

${escaparHTML(

)}

</div>


<div class="correo-resumen">

${escaparHTML(
texto(
correo.mensaje
).substring(
0,
180
)
)}

${
texto(correo.mensaje).length > 180
?

:

}

</div>

`;


item.addEventListener(

/* =====================================================
   ABRIR CORREO
===================================================== */

async function abrirCorreo(
correo,
esRecibido
){

detalleCorreo.innerHTML =

`
<div class="detalle-linea">

<strong>De:</strong>

${escaparHTML(
correo.remitenteNombre
)}

</div>


<div class="detalle-linea">

<strong>Para:</strong>

${escaparHTML(
correo.destinatarioNombre
)}

</div>


<div class="detalle-linea">

<strong>Asunto:</strong>

${escaparHTML(
correo.asunto
)}

</div>


<div class="detalle-linea">

<strong>Fecha:</strong>

${escaparHTML(
correo.fecha
)}

${escaparHTML(
correo.hora
)}

</div>


<div class="separador"></div>


<div class="detalle-mensaje">

${escaparHTML(
correo.mensaje
)}

</div>

`;


tarjetaDetalle.classList.remove(
"oculto"
);


tarjetaDetalle.scrollIntoView({
behavior:"smooth"
});


if(
esRecibido &&
!correo.leido
){

try{

await updateDoc(

doc(
db,
"correos",
correo.id
),

{
leido:true
}

);


correo.leido =
true;


mostrarRecibidos();

}
catch(error){

console.error(
"Error marcando leído:",
error
);

}

}

}
