<script type="module">


/* =========================================
   FIREBASE
========================================= */

import {
    auth,
    db
} from "./Js/firebase.js";


import {
    onAuthStateChanged,
    signOut
} from
"https://www.gstatic.com/firebasejs/12.1.0/firebase-auth.js";


import {
    collection,
    addDoc,
    getDocs,
    updateDoc,
    doc,
    query,
    where,
    limit,
    serverTimestamp
} from
"https://www.gstatic.com/firebasejs/12.1.0/firebase-firestore.js";


/* =========================================
   ELEMENTOS
========================================= */

const usuarioActual =
document.getElementById(
    "usuarioActual"
);

const destinatario =
document.getElementById(
    "destinatario"
);

const asunto =
document.getElementById(
    "asunto"
);

const mensaje =
document.getElementById(
    "mensaje"
);

const btnEnviar =
document.getElementById(
    "btnEnviar"
);

const btnRecibidos =
document.getElementById(
    "btnRecibidos"
);

const btnEnviados =
document.getElementById(
    "btnEnviados"
);

const recibidos =
document.getElementById(
    "recibidos"
);

const enviados =
document.getElementById(
    "enviados"
);

const tarjetaDetalle =
document.getElementById(
    "tarjetaDetalle"
);

const detalleCorreo =
document.getElementById(
    "detalleCorreo"
);

const btnCerrarDetalle =
document.getElementById(
    "btnCerrarDetalle"
);

const btnVolver =
document.getElementById(
    "btnVolver"
);

const btnCerrarSesion =
document.getElementById(
    "btnCerrarSesion"
);

const mensajeError =
document.getElementById(
    "mensajeError"
);

const mensajeExito =
document.getElementById(
    "mensajeExito"
);


/* =========================================
   VARIABLES
========================================= */

let usuarioSesion = null;

let empleadoActual = null;

let empleadoId = "";

let empresaId = "";

let destinatarios = [];

let correosRecibidos = [];

let correosEnviados = [];


/* =========================================
   UTILIDADES
========================================= */

function texto(valor){

    if(
        valor === undefined ||
        valor === null
    ){
        return "";
    }

    return String(valor);

}


function mostrarError(mensaje){

    mensajeError.textContent =
    mensaje;

    mensajeError.style.display =
    "block";

    mensajeExito.style.display =
    "none";

}


function mostrarExito(mensaje){

    mensajeExito.textContent =
    mensaje;

    mensajeExito.style.display =
    "block";

    mensajeError.style.display =
    "none";

}


function limpiarMensajes(){

    mensajeError.style.display =
    "none";

    mensajeExito.style.display =
    "none";

}


function escaparHTML(valor){

    return texto(valor)
    .replace(/&/g,"&amp;")
    .replace(/</g,"&lt;")
    .replace(/>/g,"&gt;")
    .replace(/"/g,"&quot;")
    .replace(/'/g,"&#039;");

}


function nombreCompleto(datos){

    return (
        texto(datos.nombre) +
        " " +
        texto(datos.apellido)
    ).trim();

}


function fechaActual(){

    const ahora =
    new Date();

    return (
        ahora.getFullYear() +
        "-" +
        String(
            ahora.getMonth()+1
        ).padStart(2,"0") +
        "-" +
        String(
            ahora.getDate()
        ).padStart(2,"0")
    );

}


function horaActual(){

    const ahora =
    new Date();

    return (
        String(
            ahora.getHours()
        ).padStart(2,"0") +
        ":" +
        String(
            ahora.getMinutes()
        ).padStart(2,"0") +
        ":" +
        String(
            ahora.getSeconds()
        ).padStart(2,"0")
    );

}


function fechaHora(valor){

    if(
        valor &&
        typeof valor.toDate ===
        "function"
    ){

        const fecha =
        valor.toDate();

        return fecha.toLocaleString(
            "es-AR"
        );

    }

    return texto(valor);

}


/* =========================================
   CARGAR EMPLEADO
========================================= */

async function cargarEmpleado(){

    if(!usuarioSesion){

        throw new Error(
            "No hay una sesión activa."
        );

    }


    const consulta =
    query(
        collection(
            db,
            "empleados"
        ),
        where(
            "authUid",
            "==",
            usuarioSesion.uid
        ),
        limit(1)
    );


    const resultados =
    await getDocs(
        consulta
    );


    if(
        resultados.empty
    ){

        throw new Error(
            "No encontramos el perfil de empleado vinculado a esta cuenta."
        );

    }


    const documento =
    resultados.docs[0];


    empleadoId =
    documento.id;


    empleadoActual = {

        id:
        documento.id,

        ...documento.data()

    };


    empresaId =
    texto(
        empleadoActual.empresaId
    ).trim();


    const nombre =
    nombreCompleto(
        empleadoActual
    ) ||
    "Empleado";


    const empresa =
    texto(
        empleadoActual.empresa
    ) ||
    texto(
        empleadoActual.empresaNombre
    ) ||
    "Empresa";


    usuarioActual.innerHTML =
    `
    <strong>${escaparHTML(nombre)}</strong>
    <br>
    Puesto:
    ${escaparHTML(
        texto(
            empleadoActual.puesto
        ) || "Empleado"
    )}
    <br>
    Empresa:
    ${escaparHTML(empresa)}
    <br>
    Correo:
    ${escaparHTML(
        texto(
            empleadoActual.email
        ) ||
        texto(
            usuarioSesion.email
        )
    )}
    `;

}


/* =========================================
   CARGAR DESTINATARIOS
========================================= */

async function cargarDestinatarios(){

    destinatarios = [];


    /*
     * EMPLEADOS
     */

    try{

        const consultaEmpleados =
        query(
            collection(
                db,
                "empleados"
            ),
            where(
                "empresaId",
                "==",
                empresaId
            )
        );


        const resultados =
        await getDocs(
            consultaEmpleados
        );


        resultados.forEach(
            documento => {

                const datos =
                documento.data();


                if(
                    documento.id ===
                    empleadoId
                ){

                    return;

                }


                destinatarios.push({

                    id:
                    documento.id,

                    authUid:
                    texto(
                        datos.authUid
                    ),

                    nombre:
                    nombreCompleto(
                        datos
                    ) ||
                    "Empleado",

                    email:
                    texto(
                        datos.email
                    ),

                    tipo:
                    "Empleado"

                });

            }
        );

    }
    catch(error){

        console.error(
            "Error empleados:",
            error
        );

    }


    /*
     * ADMINISTRACIÓN
     *
     * Se buscan usuarios en la colección
     * administradores usando empresaId.
     */

    try{

        const consultaAdministradores =
        query(
            collection(
                db,
                "administradores"
            ),
            where(
                "empresaId",
                "==",
                empresaId
            )
        );


        const resultadosAdmin =
        await getDocs(
            consultaAdministradores
        );


        resultadosAdmin.forEach(
            documento => {

                const datos =
                documento.data();


                destinatarios.push({

                    id:
                    documento.id,

                    authUid:
                    texto(
                        datos.authUid
                    ),

                    nombre:
                    nombreCompleto(
                        datos
                    ) ||
                    texto(
                        datos.nombre
                    ) ||
                    "Administración",

                    email:
                    texto(
                        datos.email
                    ),

                    tipo:
                    "Administración"

                });

            }
        );

    }
    catch(error){

        console.warn(
            "No se pudo cargar administración:",
            error
        );

    }


    /*
     * ARMAR SELECT
     */

    destinatario.innerHTML =
    "";


    if(
        destinatarios.length === 0
    ){

        destinatario.innerHTML =
        `
        <option value="">
        No hay destinatarios disponibles
        </option>
        `;

        btnEnviar.disabled =
        true;

        return;

    }


    destinatario.innerHTML =
    `
    <option value="">
    Seleccionar destinatario...
    </option>
    `;


    destinatarios.forEach(
        persona => {

            const option =
            document.createElement(
                "option"
            );


            option.value =
            persona.id;


            option.textContent =
            persona.nombre +
            " — " +
            persona.tipo;


            destinatario.appendChild(
                option
            );

        }
    );


    btnEnviar.disabled =
    false;

}


/* =========================================
   OBTENER DESTINATARIO
========================================= */

function obtenerDestinatario(){

    const id =
    destinatario.value;


    return destinatarios.find(
        persona =>
        persona.id === id
    );

}


/* =========================================
   ENVIAR CORREO
========================================= */

btnEnviar.addEventListener(
    "click",
    async function(){

        limpiarMensajes();


        const persona =
        obtenerDestinatario();


        const asuntoTexto =
        asunto.value.trim();


        const mensajeTexto =
        mensaje.value.trim();


        if(!persona){

            mostrarError(
                "Seleccioná un destinatario."
            );

            return;

        }


        if(!asuntoTexto){

            mostrarError(
                "Escribí un asunto."
            );

            asunto.focus();

            return;

        }


        if(!mensajeTexto){

            mostrarError(
                "Escribí el mensaje."
            );

            mensaje.focus();

            return;

        }


        btnEnviar.disabled =
        true;

        btnEnviar.textContent =
        "📤 ENVIANDO...";


        try{

            const nombreRemitente =
            nombreCompleto(
                empleadoActual
            ) ||
            "Empleado";


            const emailRemitente =
            texto(
                empleadoActual.email
            ) ||
            texto(
                usuarioSesion.email
            );


            await addDoc(
                collection(
                    db,
                    "correos"
                ),
                {

                    empresaId:
                    empresaId,

                    remitenteUid:
                    usuarioSesion.uid,

                    remitenteId:
                    empleadoId,

                    remitenteNombre:
                    nombreRemitente,

                    remitenteEmail:
                    emailRemitente,

                    destinatarioUid:
                    persona.authUid,

                    destinatarioId:
                    persona.id,

                    destinatarioNombre:
                    persona.nombre,

                    destinatarioEmail:
                    persona.email,

                    destinatarioTipo:
                    persona.tipo,

                    asunto:
                    asuntoTexto,

                    mensaje:
                    mensajeTexto,

                    fecha:
                    fechaActual(),

                    hora:
                    horaActual(),

                    creado:
                    serverTimestamp(),

                    leido:
                    false,

                    tipo:
                    "interno",

                    estado:
                    "enviado"

                }
            );


            asunto.value =
            "";

            mensaje.value =
            "";

            destinatario.value =
            "";


            mostrarExito(
                "Mensaje enviado correctamente."
            );


            await cargarEnviados();

        }
        catch(error){

            console.error(
                "Error enviando correo:",
                error
            );


            mostrarError(
                "No se pudo enviar el mensaje: " +
                error.message
            );

        }
        finally{

            btnEnviar.disabled =
            false;

            btnEnviar.textContent =
            "📤 ENVIAR MENSAJE";

        }

    }
);


/* =========================================
   CARGAR RECIBIDOS
========================================= */

async function cargarRecibidos(){

    recibidos.innerHTML =
    `
    <div class="cargando">
    Cargando mensajes...
    </div>
    `;


    try{

        const consulta =
        query(
            collection(
                db,
                "correos"
            ),
            where(
                "destinatarioUid",
                "==",
                usuarioSesion.uid
            ),
            limit(50)
        );


        const resultados =
        await getDocs(
            consulta
        );


        correosRecibidos = [];


        resultados.forEach(
            documento => {

                correosRecibidos.push({

                    id:
                    documento.id,

                    ...documento.data()

                });

            }
        );


        correosRecibidos.sort(
            function(a,b){

                const fechaA =
                texto(a.fecha) +
                " " +
                texto(a.hora);

                const fechaB =
                texto(b.fecha) +
                " " +
                texto(b.hora);

                return fechaB.localeCompare(
                    fechaA
                );

            }
        );


        mostrarRecibidos();

    }
    catch(error){

        console.error(
            "Error recibidos:",
            error
        );


        recibidos.innerHTML =
        `
        <div class="sin-registros">
        No se pudieron cargar los mensajes.
        </div>
        `;

    }

}


/* =========================================
   MOSTRAR RECIBIDOS
========================================= */

function mostrarRecibidos(){

    if(
        correosRecibidos.length === 0
    ){

        recibidos.innerHTML =
        `
        <div class="sin-registros">
        No tenés mensajes recibidos.
        </div>
        `;

        return;

    }


    recibidos.innerHTML =
    "";


    correosRecibidos.forEach(
        correo => {

            const item =
            document.createElement(
                "div"
            );


            item.className =
            "correo-item" +
            (
                correo.leido
                ? ""
                : " no-leido"
            );


            item.innerHTML =
            `
            <div class="correo-cabecera">

                <div class="correo-persona">
                    De:
                    ${escaparHTML(
                        correo.remitenteNombre
                    )}
                </div>

                <div class="correo-fecha">
                    ${escaparHTML(
                        correo.fecha
                    )}
                    ${escaparHTML(
                        correo.hora
                    )}
                </div>

            </div>

            <div class="correo-asunto">
                ${escaparHTML(
                    correo.asunto
                )}
            </div>

            <div class="correo-resumen">
                ${escaparHTML(
                    texto(
                        correo.mensaje
                    ).substring(0,180)
                )}
                ${texto(correo.mensaje).length > 180 ? "..." : ""}
            </div>

            <span class="estado-correo ${
                correo.leido
                ? ""
                : "estado-no-leido"
            }">
                ${
                    correo.leido
                    ? "LEÍDO"
                    : "NO LEÍDO"
                }
            </span>
            `;


            item.addEventListener(
                "click",
                function(){

                    abrirCorreo(
                        correo,
                        true
                    );

                }
            );


            recibidos.appendChild(
                item
            );

        }
    );

}


/* =========================================
   CARGAR ENVIADOS
========================================= */

async function cargarEnviados(){

    enviados.innerHTML =
    `
    <div class="cargando">
    Cargando mensajes...
    </div>
    `;


    try{

        const consulta =
        query(
            collection(
                db,
                "correos"
            ),
            where(
                "remitenteUid",
                "==",
                usuarioSesion.uid
            ),
            limit(50)
        );


        const resultados =
        await getDocs(
            consulta
        );


        correosEnviados = [];


        resultados.forEach(
            documento => {

                correosEnviados.push({

                    id:
                    documento.id,

                    ...documento.data()

                });

            }
        );


        correosEnviados.sort(
            function(a,b){

                const fechaA =
                texto(a.fecha) +
                " " +
                texto(a.hora);

                const fechaB =
                texto(b.fecha) +
                " " +
                texto(b.hora);

                return fechaB.localeCompare(
                    fechaA
                );

            }
        );


        mostrarEnviados();

    }
    catch(error){

        console.error(
            "Error enviados:",
            error
        );


        enviados.innerHTML =
        `
        <div class="sin-registros">
        No se pudieron cargar los mensajes enviados.
        </div>
        `;

    }

}


/* =========================================
   MOSTRAR ENVIADOS
========================================= */

function mostrarEnviados(){

    if(
        correosEnviados.length === 0
    ){

        enviados.innerHTML =
        `
        <div class="sin-registros">
        No tenés mensajes enviados.
        </div>
        `;

        return;

    }


    enviados.innerHTML =
    "";


    correosEnviados.forEach(
        correo => {

            const item =
            document.createElement(
                "div"
            );


            item.className =
            "correo-item";


            item.innerHTML =
            `
            <div class="correo-cabecera">

                <div class="correo-persona">
                    Para:
                    ${escaparHTML(
                        correo.destinatarioNombre
                    )}
                </div>

                <div class="correo-fecha">
                    ${escaparHTML(
                        correo.fecha
                    )}
                    ${escaparHTML(
                        correo.hora
                    )}
                </div>

            </div>

            <div class="correo-asunto">
                ${escaparHTML(
                    correo.asunto
                )}
            </div>

            <div class="correo-resumen">
                ${escaparHTML(
                    texto(
                        correo.mensaje
                    ).substring(0,180)
                )}
                ${texto(correo.mensaje).length > 180 ? "..." : ""}
            </div>
            `;


            item.addEventListener(
                "click",
                function(){

                    abrirCorreo(
                        correo,
                        false
                    );

                }
            );


            enviados.appendChild(
                item
            );

        }
    );

}


/* =========================================
   ABRIR CORREO
========================================= */

async function abrirCorreo(
    correo,
    esRecibido
){

    detalleCorreo.innerHTML =
    `
    <div class="detalle-linea">
        <strong>De:</strong>
        ${escaparHTML(
            correo.remitenteNombre
        )}
    </div>

    <div class="detalle-linea">
        <strong>Para:</strong>
        ${escaparHTML(
            correo.destinatarioNombre
        )}
    </div>

    <div class="detalle-linea">
        <strong>Asunto:</strong>
        ${escaparHTML(
            correo.asunto
        )}
    </div>

    <div class="detalle-linea">
        <strong>Fecha:</strong>
        ${escaparHTML(
            correo.fecha
        )}
        ${escaparHTML(
            correo.hora
        )}
    </div>

    <div class="separador"></div>

    <div class="detalle-mensaje">
        ${escaparHTML(
            correo.mensaje
        )}
    </div>
    `;


    tarjetaDetalle.classList.remove(
        "oculto"
    );


    tarjetaDetalle.scrollIntoView({
        behavior:"smooth"
    });


    /*
     * MARCAR COMO LEÍDO
     */

    if(
        esRecibido &&
        !correo.leido
    ){

        try{

            await updateDoc(
                doc(
                    db,
                    "correos",
                    correo.id
                ),
                {
                    leido:true
                }
            );


            correo.leido =
            true;


            mostrarRecibidos();

        }
        catch(error){

            console.error(
                "Error marcando leído:",
                error
            );

        }

    }

}

/* =========================================

========================================= */

btnCerrarSesion.addEventListener(
    "click",
    async function(){

        if(
            !confirm(
                "¿Querés cerrar la sesión?"
            )
        ){

            return;

        }


        try{

            await signOut(
                auth
            );


            window.location.href =
            "empleado-login.html";

        }
        catch(error){

            mostrarError(
                "No se pudo cerrar la sesión: " +
                error.message
            );

        }

    }
);


/* =========================================
   INICIO
========================================= */

onAuthStateChanged(
    auth,
    async function(usuario){

        if(!usuario){

            window.location.href =
            "empleado-login.html";

            return;

        }


        usuarioSesion =
        usuario;


        try{

            limpiarMensajes();


            usuarioActual.textContent =
            "Cargando usuario...";


            await cargarEmpleado();


            await cargarDestinatarios();


            await cargarRecibidos();


            console.log(
                "CORREO GESBASE INICIALIZADO"
            );

        }
        catch(error){

            console.error(
                "Error iniciando correo:",
                error
            );


            btnEnviar.disabled =
            true;


            mostrarError(
                error.message
            );

        }

    }
);
