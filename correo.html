<!DOCTYPE html>
<html lang="es">

<head>

<meta charset="UTF-8">

<meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
>

<meta
    name="theme-color"
    content="#111827"
>

<meta
    name="description"
    content="GESBASE - Correo interno"
>

<title>GESBASE - Correo interno</title>

<style>

*{
    box-sizing:border-box;
    margin:0;
    padding:0;
}

body{
    font-family:Arial,sans-serif;
    background:#f3f4f6;
    color:#111827;
    min-height:100vh;
}

.app{
    width:100%;
    max-width:900px;
    min-height:100vh;
    margin:auto;
    background:#fff;
}

/* ============================= */
/* HEADER */
/* ============================= */

header{
    background:#111827;
    color:white;
    padding:18px;
}

.header-content{
    display:flex;
    align-items:center;
    gap:12px;
}

.btn-volver{
    width:42px;
    height:42px;
    border:none;
    border-radius:10px;
    background:#374151;
    color:white;
    font-size:21px;
    cursor:pointer;
}

.logo{
    font-size:24px;
    font-weight:bold;
    letter-spacing:1px;
}

.subtitulo{
    color:#d1d5db;
    font-size:13px;
    margin-top:3px;
}

/* ============================= */
/* MAIN */
/* ============================= */

main{
    padding:18px;
}

.titulo{
    font-size:26px;
    margin-bottom:6px;
}

.descripcion{
    color:#6b7280;
    font-size:14px;
    margin-bottom:18px;
}

/* ============================= */
/* TABS */
/* ============================= */

.tabs{
    display:grid;
    grid-template-columns:1fr 1fr 1fr;
    gap:8px;
    margin-bottom:16px;
}

.tab{
    border:none;
    border-radius:10px;
    padding:13px 8px;
    background:#e5e7eb;
    color:#111827;
    font-weight:bold;
    cursor:pointer;
}

.tab.activo{
    background:#111827;
    color:white;
}

/* ============================= */
/* BUSCAR */
/* ============================= */

.busqueda{
    margin-bottom:16px;
}

.busqueda input{
    width:100%;
    padding:13px;
    border:1px solid #d1d5db;
    border-radius:10px;
    font-size:15px;
    outline:none;
}

.busqueda input:focus{
    border-color:#111827;
}

/* ============================= */
/* ESTADO */
/* ============================= */

.estado{
    display:none;
    padding:12px;
    border-radius:10px;
    margin-bottom:15px;
    font-size:14px;
    line-height:1.4;
}

.estado.visible{
    display:block;
}

.estado.info{
    background:#dbeafe;
    color:#1e40af;
}

.estado.exito{
    background:#dcfce7;
    color:#166534;
}

.estado.error{
    background:#fee2e2;
    color:#991b1b;
}

/* ============================= */
/* LISTA */
/* ============================= */

.lista{
    display:flex;
    flex-direction:column;
    gap:10px;
}

.correo{
    border:1px solid #e5e7eb;
    border-radius:12px;
    padding:15px;
    background:white;
    cursor:pointer;
    transition:.15s;
}

.correo:hover{
    background:#f9fafb;
}

.correo.no-leido{
    border-left:5px solid #2563eb;
    background:#eff6ff;
}

.correo-cabecera{
    display:flex;
    justify-content:space-between;
    gap:10px;
}

.correo-persona{
    font-weight:bold;
    font-size:15px;
}

.correo-fecha{
    color:#6b7280;
    font-size:11px;
    white-space:nowrap;
}

.correo-asunto{
    margin-top:7px;
    font-size:15px;
    font-weight:bold;
}

.correo-preview{
    margin-top:5px;
    color:#6b7280;
    font-size:13px;
    line-height:1.4;
}

.badge-no-leido{
    display:inline-block;
    margin-top:8px;
    background:#2563eb;
    color:white;
    border-radius:20px;
    padding:4px 8px;
    font-size:10px;
    font-weight:bold;
}

.sin-resultados{
    text-align:center;
    padding:45px 20px;
    background:#f9fafb;
    border-radius:12px;
    color:#6b7280;
}

.sin-icono{
    font-size:42px;
    margin-bottom:10px;
}

/* ============================= */
/* BOTON REDACTAR */
/* ============================= */

.btn-redactar{
    width:100%;
    border:none;
    background:#2563eb;
    color:white;
    padding:14px;
    border-radius:10px;
    font-weight:bold;
    font-size:15px;
    cursor:pointer;
    margin-bottom:16px;
}

/* ============================= */
/* FORMULARIO */
/* ============================= */

.formulario{
    display:none;
    background:#f9fafb;
    border:1px solid #e5e7eb;
    border-radius:14px;
    padding:17px;
    margin-bottom:18px;
}

.formulario.visible{
    display:block;
}

.formulario h2{
    font-size:19px;
    margin-bottom:15px;
}

.campo{
    margin-bottom:13px;
}

.campo label{
    display:block;
    font-size:12px;
    font-weight:bold;
    margin-bottom:6px;
}

.campo input,
.campo textarea{
    width:100%;
    border:1px solid #d1d5db;
    border-radius:9px;
    padding:12px;
    font-size:14px;
    outline:none;
    background:white;
}

.campo textarea{
    min-height:160px;
    resize:vertical;
}

.campo input:focus,
.campo textarea:focus{
    border-color:#111827;
}

.botones-form{
    display:grid;
    grid-template-columns:1fr 1fr;
    gap:9px;
}

.btn-enviar{
    border:none;
    border-radius:9px;
    padding:13px;
    background:#111827;
    color:white;
    font-weight:bold;
    cursor:pointer;
}

.btn-cancelar{
    border:none;
    border-radius:9px;
    padding:13px;
    background:#e5e7eb;
    color:#111827;
    font-weight:bold;
    cursor:pointer;
}

/* ============================= */
/* MODAL */
/* ============================= */

.modal{
    position:fixed;
    inset:0;
    background:rgba(0,0,0,.65);
    display:none;
    z-index:9999;
    overflow-y:auto;
    padding:10px;
}

.modal.visible{
    display:block;
}

.modal-contenedor{
    max-width:700px;
    margin:15px auto;
    background:white;
    border-radius:14px;
    overflow:hidden;
}

.modal-header{
    background:#111827;
    color:white;
    padding:16px;
    display:flex;
    justify-content:space-between;
    align-items:center;
    gap:10px;
}

.modal-header h2{
    font-size:18px;
}

.btn-cerrar{
    width:36px;
    height:36px;
    border:none;
    border-radius:8px;
    background:#374151;
    color:white;
    font-size:20px;
    cursor:pointer;
}

.modal-body{
    padding:18px;
}

.detalle{
    margin-bottom:15px;
}

.detalle small{
    display:block;
    color:#6b7280;
    font-size:11px;
    margin-bottom:4px;
}

.detalle strong{
    font-size:14px;
}

.mensaje{
    border:1px solid #e5e7eb;
    border-radius:10px;
    padding:15px;
    line-height:1.6;
    white-space:pre-wrap;
    margin-top:10px;
}

.modal-botones{
    display:grid;
    grid-template-columns:1fr 1fr;
    gap:9px;
    margin-top:18px;
}

.btn-responder{
    border:none;
    background:#2563eb;
    color:white;
    padding:12px;
    border-radius:9px;
    font-weight:bold;
    cursor:pointer;
}

.btn-eliminar{
    border:none;
    background:#fee2e2;
    color:#991b1b;
    padding:12px;
    border-radius:9px;
    font-weight:bold;
    cursor:pointer;
}

/* ============================= */
/* RESPONSIVE */
/* ============================= */

@media(max-width:600px){

    main{
        padding:15px;
    }

    .tabs{
        grid-template-columns:1fr 1fr;
    }

    .tabs .tab:last-child{
        grid-column:1/-1;
    }

    .correo-cabecera{
        flex-direction:column;
        gap:4px;
    }

    .botones-form,
    .modal-botones{
        grid-template-columns:1fr;
    }

}

</style>

</head>

<body>

<header>

>

<div>

<div class="logo">
GESBASE

</div>

</header>

<main>

<h1 class="titulo">

<p class="descripcion">

<button
    id="btnRedactar"

<div class="tabs">

<script type="module">

// ==========================================
// FIREBASE
// ==========================================

import {
    auth,
    db
} from "./Js/firebase.js";

import {
    onAuthStateChanged
} from
"https://www.gstatic.com/firebasejs/12.18.0/firebase-auth.js";

import {
    collection,
    getDocs,
    getDoc,
    addDoc,
    updateDoc,
    deleteDoc,
    doc,
    serverTimestamp
} from
"https://www.gstatic.com/firebasejs/12.18.0/firebase-firestore.js";


// ==========================================
// ELEMENTOS
// ==========================================

const btnVolver =
document.getElementById("btnVolver");

const btnRedactar =
document.getElementById("btnRedactar");

const formulario =
document.getElementById("formulario");

const destinatario =
document.getElementById("destinatario");

const asunto =
document.getElementById("asunto");

const mensaje =
document.getElementById("mensaje");

const btnEnviar =
document.getElementById("btnEnviar");

const btnCancelar =
document.getElementById("btnCancelar");

const tabRecibidos =
document.getElementById("tabRecibidos");

const tabEnviados =
document.getElementById("tabEnviados");

const tabTodos =
document.getElementById("tabTodos");

const buscar =
document.getElementById("buscar");

const lista =
document.getElementById("lista");

const sinResultados =
document.getElementById("sinResultados");

const estado =
document.getElementById("estado");

const modal =
document.getElementById("modal");

const modalBody =
document.getElementById("modalBody");

const btnCerrarModal =
document.getElementById("btnCerrarModal");


// ==========================================
// VARIABLES
// ==========================================

let usuarioActual = null;

let empresaIdActual = "";

let correos = [];

let vistaActual = "recibidos";

let correoSeleccionado = null;


// ==========================================
// VOLVER
// ==========================================

btnVolver.addEventListener(
    "click",
    function(){

        window.location.href =
        "index.html";

    }
);


// ==========================================
// ESTADO
// ==========================================

function mostrarEstado(
    texto,
    tipo
){

    estado.textContent =
    texto;

    estado.className =
    "estado visible " +
    tipo;

}


// ==========================================
// ESCAPAR
// ==========================================

function escapar(
    valor
){

    return String(
        valor ?? ""
    )
    .replaceAll("&","&amp;")
    .replaceAll("<","&lt;")
    .replaceAll(">","&gt;")
    .replaceAll('"',"&quot;")
    .replaceAll("'","&#039;");

}


// ==========================================
// FECHA
// ==========================================

function formatoFecha(
    valor
){

    if(!valor){

        return "";

    }

    try{

        if(
            typeof valor.toDate ===
            "function"
        ){

            return valor
            .toDate()
            .toLocaleString(
                "es-AR"
            );

        }

        const fecha =
        new Date(valor);

        if(
            !isNaN(
                fecha.getTime()
            )
        ){

            return fecha.toLocaleString(
                "es-AR"
            );

        }

    }
    catch(error){

        console.error(error);

    }

    return String(valor);

}


// ==========================================
// OBTENER EMPRESA
// ==========================================

async function cargarEmpresa(){

    empresaIdActual = "";

    try{

        const referenciaUsuario =
        doc(
            db,
            "usuarios",
            usuarioActual.uid
        );

        const documentoUsuario =
        await getDoc(
            referenciaUsuario
        );

        if(
            documentoUsuario.exists()
        ){

            const datos =
            documentoUsuario.data();

            empresaIdActual =
            String(
                datos.empresaId ||
                datos.empresa ||
                ""
            ).trim();

        }


        /*
         * Compatibilidad:
         * si todavía no existe empresaId,
         * utilizamos el UID.
         */

        if(!empresaIdActual){

            empresaIdActual =
            usuarioActual.uid;

        }

    }
    catch(error){

        console.error(
            "Error obteniendo empresa:",
            error
        );

        empresaIdActual =
        usuarioActual.uid;

    }

}


// ==========================================
// ABRIR REDACTAR
// ==========================================

btnRedactar.addEventListener(
    "click",
    function(){

        formulario.classList.add(
            "visible"
        );

        destinatario.focus();

        window.scrollTo({
            top:0,
            behavior:"smooth"
        });

    }
);


// ==========================================
// CANCELAR
// ==========================================

btnCancelar.addEventListener(
    "click",
    function(){

        formulario.classList.remove(
            "visible"
        );

        limpiarFormulario();

    }
);


// ==========================================
// LIMPIAR FORMULARIO
// ==========================================

function limpiarFormulario(){

    destinatario.value =
    "";

    asunto.value =
    "";

    mensaje.value =
    "";

}


// ==========================================
// TABS
// ==========================================

function activarTab(
    tab
){

    tabRecibidos.classList.remove(
        "activo"
    );

    tabEnviados.classList.remove(
        "activo"
    );

    tabTodos.classList.remove(
        "activo"
    );

    tab.classList.add(
        "activo"
    );

}


tabRecibidos.addEventListener(
    "click",
    function(){

        vistaActual =
        "recibidos";

        activarTab(
            tabRecibidos
        );

        renderizar();

    }
);


tabEnviados.addEventListener(
    "click",
    function(){

        vistaActual =
        "enviados";

        activarTab(
            tabEnviados
        );

        renderizar();

    }
);


tabTodos.addEventListener(
    "click",
    function(){

        vistaActual =
        "todos";

        activarTab(
            tabTodos
        );

        renderizar();

    }
);


// ==========================================
// BUSQUEDA
// ==========================================

buscar.addEventListener(
    "input",
    renderizar
);


// ==========================================
// PERTENENCIA
// ==========================================

function perteneceEmpresa(
    datos
){

    return (
        String(
            datos.empresaId || ""
        ) ===
        String(
            empresaIdActual
        )
    );

}


// ==========================================
// CARGAR CORREOS
// ==========================================

async function cargarCorreos(){

    lista.innerHTML = `
        <div class="sin-resultados">
            📥 Cargando correos...
        </div>
    `;

    sinResultados.style.display =
    "none";

    try{

        const snapshot =
        await getDocs(
            collection(
                db,
                "correos"
            )
        );

        correos = [];

        snapshot.forEach(
            function(documento){

                const datos =
                documento.data();

                /*
                 * SOLAMENTE CORREOS
                 * DE LA EMPRESA.
                 */

                if(
                    !perteneceEmpresa(
                        datos
                    )
                ){

                    return;

                }


                /*
                 * El usuario debe ser
                 * remitente o destinatario.
                 */

                const esMio =
                String(
                    datos.remitenteId || ""
                ) ===
                String(
                    usuarioActual.uid
                )
                ||
                String(
                    datos.destinatarioId || ""
                ) ===
                String(
                    usuarioActual.uid
                );


                /*
                 * También permitimos
                 * compatibilidad por email.
                 */

                const esMioEmail =
                String(
                    datos.remitenteEmail || ""
                ).toLowerCase() ===
                String(
                    usuarioActual.email || ""
                ).toLowerCase()
                ||
                String(
                    datos.destinatarioEmail || ""
                ).toLowerCase() ===
                String(
                    usuarioActual.email || ""
                ).toLowerCase();


                if(
                    !esMio &&
                    !esMioEmail
                ){

                    return;

                }


                correos.push({

                    id:
                    documento.id,

                    ...datos

                });

            }
        );


        correos.sort(
            function(a,b){

                const fechaA =
                a.creado?.toMillis
                ? a.creado.toMillis()
                : 0;

                const fechaB =
                b.creado?.toMillis
                ? b.creado.toMillis()
                : 0;

                return fechaB - fechaA;

            }
        );


        renderizar();

    }
    catch(error){

        console.error(
            "Error cargando correos:",
            error
        );

        lista.innerHTML =
        "";

        mostrarEstado(
            "No se pudieron cargar los correos. " +
            error.message,
            "error"
        );

    }

}


// ==========================================
// RENDERIZAR
// ==========================================

function renderizar(){

    const texto =
    buscar.value
    .trim()
    .toLowerCase();


    let resultados =
    correos.filter(
        function(correo){

            const esEnviado =
            String(
                correo.remitenteId || ""
            ) ===
            String(
                usuarioActual.uid
            )
            ||
            String(
                correo.remitenteEmail || ""
            ).toLowerCase() ===
            String(
                usuarioActual.email || ""
            ).toLowerCase();


            const esRecibido =
            String(
                correo.destinatarioId || ""
            ) ===
            String(
                usuarioActual.uid
            )
            ||
            String(
                correo.destinatarioEmail || ""
            ).toLowerCase() ===
            String(
                usuarioActual.email || ""
            ).toLowerCase();


            if(
                vistaActual ===
                "enviados" &&
                !esEnviado
            ){

                return false;

            }


            if(
                vistaActual ===
                "recibidos" &&
                !esRecibido
            ){

                return false;

            }


            if(!texto){

                return true;

            }


            const contenido = [

                correo.asunto,

                correo.mensaje,

                correo.remitenteEmail,

                correo.destinatarioEmail

            ]
            .join(" ")
            .toLowerCase();


            return contenido.includes(
                texto
            );

        }
    );


    lista.innerHTML =
    "";


    if(
        resultados.length === 0
    ){

        sinResultados.style.display =
        "block";

        return;

    }


    sinResultados.style.display =
    "none";


    resultados.forEach(
        function(correo){

            const esEnviado =
            String(
                correo.remitenteId || ""
            ) ===
            String(
                usuarioActual.uid
            )
            ||
            String(
                correo.remitenteEmail || ""
            ).toLowerCase() ===
            String(
                usuarioActual.email || ""
            ).toLowerCase();


            const noLeido =
            !esEnviado &&
            correo.leido !== true;


            const tarjeta =
            document.createElement(
                "div"
            );


            tarjeta.className =
            "correo" +
            (
                noLeido
                ? " no-leido"
                : ""
            );


            const persona =
            esEnviado
            ? (
                "Para: " +
                (
                    correo.destinatarioEmail ||
                    "Usuario"
                )
            )
            : (
                "De: " +
                (
                    correo.remitenteEmail ||
                    "Usuario"
                )
            );


            const preview =
            String(
                correo.mensaje || ""
            )
            .substring(
                0,
                120
            );


            tarjeta.innerHTML = `

                <div class="correo-cabecera">

                    <div class="correo-persona">
                        ${escapar(persona)}
                    </div>

                    <div class="correo-fecha">
                        ${escapar(
                            formatoFecha(
                                correo.creado
                            )
                        )}
                    </div>

                </div>

                <div class="correo-asunto">
                    ${escapar(
                        correo.asunto ||
                        "(Sin asunto)"
                    )}
                </div>

                <div class="correo-preview">
                    ${escapar(
                        preview
                    )}
                    ${
                        String(
                            correo.mensaje || ""
                        ).length > 120
                        ? "..."
                        : ""
                    }
                </div>

                ${
                    noLeido
                    ?
                    `
                    <span class="badge-no-leido">
                        NUEVO
                    </span>
                    `
                    :
                    ""
                }

            `;


            tarjeta.addEventListener(
                "click",
                function(){

                    abrirCorreo(
                        correo
                    );

                }
            );


            lista.appendChild(
                tarjeta
            );

        }
    );

}


// ==========================================
// ENVIAR CORREO
// ==========================================

btnEnviar.addEventListener(
    "click",
    async function(){

        if(!usuarioActual){

            mostrarEstado(
                "No hay una sesión activa.",
                "error"
            );

            return;

        }


        const emailDestino =
        destinatario.value
        .trim()
        .toLowerCase();


        const asuntoTexto =
        asunto.value.trim();


        const mensajeTexto =
        mensaje.value.trim();


        if(!emailDestino){

            mostrarEstado(
                "Ingresá el correo del destinatario.",
                "error"
            );

            return;

        }


        if(
            !emailDestino.includes("@")
        ){

            mostrarEstado(
                "Ingresá un correo válido.",
                "error"
            );

            return;

        }


        if(!asuntoTexto){

            mostrarEstado(
                "Ingresá un asunto.",
                "error"
            );

            return;

        }


        if(!mensajeTexto){

            mostrarEstado(
                "Escribí un mensaje.",
                "error"
            );

            return;

        }


        if(
            emailDestino ===
            String(
                usuarioActual.email || ""
            ).toLowerCase()
        ){

            mostrarEstado(
                "No es necesario enviarte un correo a vos mismo.",
                "error"
            );

            return;

        }


        btnEnviar.disabled =
        true;

        btnEnviar.textContent =
        "Enviando...";


        try{

            /*
             * BUSCAR USUARIO DESTINO
             * DENTRO DE LA EMPRESA.
             */

            let destinatarioId =
            "";


            const usuariosSnapshot =
            await getDocs(
                collection(
                    db,
                    "usuarios"
                )
            );


            usuariosSnapshot.forEach(
                function(documento){

                    if(
                        destinatarioId
                    ){

                        return;

                    }


                    const datos =
                    documento.data();


                    const pertenece =
                    String(
                        datos.empresaId ||
                        datos.empresa ||
                        ""
                    ) ===
                    String(
                        empresaIdActual
                    );


                    const coincide =
                    String(
                        datos.email ||
                        ""
                    ).toLowerCase() ===
                    emailDestino;


                    if(
                        pertenece &&
                        coincide
                    ){

                        destinatarioId =
                        documento.id;

                    }

                }
            );


            /*
             * Guardamos el correo.
             *
             * Si el usuario destino no fue
             * encontrado, igualmente se
             * guarda por email para evitar
             * perder el mensaje.
             */

            await addDoc(
                collection(
                    db,
                    "correos"
                ),
                {

                    empresaId:
                    empresaIdActual,

                    remitenteId:
                    usuarioActual.uid,

                    remitenteEmail:
                    usuarioActual.email || "",

                    destinatarioId:
                    destinatarioId,

                    destinatarioEmail:
                    emailDestino,

                    asunto:
                    asuntoTexto,

                    mensaje:
                    mensajeTexto,

                    leido:
                    false,

                    creado:
                    serverTimestamp()

                }
            );


            mostrarEstado(
                "Correo enviado correctamente.",
                "exito"
            );


            limpiarFormulario();


            formulario.classList.remove(
                "visible"
            );


            await cargarCorreos();

        }
        catch(error){

            console.error(
                "Error enviando correo:",
                error
            );


            mostrarEstado(
                "No se pudo enviar el correo. " +
                error.message,
                "error"
            );

        }
        finally{

            btnEnviar.disabled =
            false;

            btnEnviar.textContent =
            "📤 Enviar correo";

        }

    }
);


// ==========================================
// ABRIR CORREO
// ==========================================

async function abrirCorreo(
    correo
){

    correoSeleccionado =
    correo;


    const esEnviado =
    String(
        correo.remitenteId || ""
    ) ===
    String(
        usuarioActual.uid
    )
    ||
    String(
        correo.remitenteEmail || ""
    ).toLowerCase() ===
    String(
        usuarioActual.email || ""
    ).toLowerCase();


    /*
     * Si es recibido y está sin leer,
     * marcarlo como leído.
     */

    if(
        !esEnviado &&
        correo.leido !== true
    ){

        try{

            await updateDoc(
                doc(
                    db,
                    "correos",
                    correo.id
                ),
                {

                    leido:
                    true

                }
            );


            correo.leido =
            true;

        }
        catch(error){

            console.error(
                "Error marcando leído:",
                error
            );

        }

    }


    modalBody.innerHTML = `

        <div class="detalle">

            <small>
            DE
            </small>

            <strong>
            ${escapar(
                correo.remitenteEmail ||
                "-"
            )}
            </strong>

        </div>


        <div class="detalle">

            <small>
            PARA
            </small>

            <strong>
            ${escapar(
                correo.destinatarioEmail ||
                "-"
            )}
            </strong>

        </div>


        <div class="detalle">

            <small>
            FECHA
            </small>

            <strong>
            ${escapar(
                formatoFecha(
                    correo.creado
                )
            )}
            </strong>

        </div>


        <div class="detalle">

            <small>
            ASUNTO
            </small>

            <strong>
            ${escapar(
                correo.asunto ||
                "(Sin asunto)"
            )}
            </strong>

        </div>


        <div class="mensaje">
            ${escapar(
                correo.mensaje ||
                ""
            )}
        </div>


        <div class="modal-botones">

            ${
                !esEnviado
                ?
                `
                <button
                    id="btnResponder"
                    class="btn-responder"
                    type="button"
                >
                    ↩️ Responder
                </button>
                `
                :
                `
                <button
                    id="btnResponder"
                    class="btn-responder"
                    type="button"
                >
                    ✉️ Nuevo correo
                </button>
                `
            }


            <button
                id="btnEliminarCorreo"
                class="btn-eliminar"
                type="button"
            >
                🗑️ Eliminar
            </button>

        </div>

    `;


    document
    .getElementById(
        "btnResponder"
    )
    .addEventListener(
        "click",
        function(){

            if(!esEnviado){

                destinatario.value =
                correo.remitenteEmail || "";

                asunto.value =
                "Re: " +
                (
                    correo.asunto ||
                    ""
                );

                mensaje.value =
                "\n\n--- Mensaje original ---\n" +
                (
                    correo.mensaje ||
                    ""
                );

            }
            else{

                destinatario.value =
                "";

                asunto.value =
                "";

                mensaje.value =
                "";

            }


            cerrarModal();


            formulario.classList.add(
                "visible"
            );


            destinatario.focus();

            window.scrollTo({
                top:0,
                behavior:"smooth"
            });

        }
    );


    document
    .getElementById(
        "btnEliminarCorreo"
    )
    .addEventListener(
        "click",
        function(){

            eliminarCorreo(
                correo
            );

        }
    );


    modal.classList.add(
        "visible"
    );


    /*
     * Actualizar la lista
     * inmediatamente.
     */

    renderizar();

}


// ==========================================
// CERRAR MODAL
// ==========================================

function cerrarModal(){

    modal.classList.remove(
        "visible"
    );

    correoSeleccionado =
    null;

}


btnCerrarModal.addEventListener(
    "click",
    cerrarModal
);


modal.addEventListener(
    "click",
    function(evento){

        if(
            evento.target === modal
        ){

            cerrarModal();

        }

    }
);


// ==========================================
// ELIMINAR CORREO
// ==========================================

async function eliminarCorreo(
    correo
){

    if(!correo){

        return;

    }


    const confirmar =
    confirm(
        "¿Querés eliminar este correo?\n\n" +
        "La eliminación no se puede deshacer."
    );


    if(!confirmar){

        return;

    }


    try{

        await deleteDoc(
            doc(
                db,
                "correos",
                correo.id
            )
        );


        cerrarModal();


        mostrarEstado(
            "Correo eliminado correctamente.",
            "exito"
        );


        await cargarCorreos();

    }
    catch(error){

        console.error(
            "Error eliminando correo:",
            error
        );


        mostrarEstado(
            "No se pudo eliminar el correo. " +
            error.message,
            "error"
        );

    }

}

// INICIO
// ==========================================

onAuthStateChanged(
    auth,
    async function(usuario){

        if(!usuario){

            window.location.replace(
                "login.html"
            );

            return;

        }


        usuarioActual =
        usuario;


        try{

            await cargarEmpresa();

            await cargarCorreos();

        }
        catch(error){

            console.error(
                "Error iniciando Correo:",
                error
            );


            mostrarEstado(
                "No se pudo iniciar el correo interno. " +
                error.message,
                "error"
            );

        }

    }
);

</script>
