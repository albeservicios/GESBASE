*{

body{

.contenedor{

}

.titulo{
    font-size:20px;

}

label{

}

input,

    background:#fff;
}

textarea{
    min-height:150px;

}

input:focus,

    outline:none;
    border-color:#2563eb;

button{
    font-family:Arial,sans-serif;
}

.boton{
    width:100%;
    border:0;
    border-radius:12px;
    padding:15px;
    font-size:15px;
    font-weight:bold;
    cursor:pointer;
    margin-top:8px;
}

.boton:disabled{
    opacity:.5;
    cursor:not-allowed;
}

.boton-enviar{
    background:#2563eb;
    color:#fff;
}

.boton-recibidos{
    background:#16a34a;
    color:#fff;
}

.boton-enviados{
    background:#6b7280;
    color:#fff;
}

.boton-volver{
    background:#e5e7eb;
    color:#111827;
}

.boton-cerrar{
    background:#111827;
    color:#fff;
}

.boton-audio{
    background:#7c3aed;
    color:#fff;
}

.boton-detener{
    background:#dc2626;
    color:#fff;
}

.info{
    background:#eff6ff;
    border:1px solid #bfdbfe;
    color:#1e40af;
    padding:14px;
    border-radius:10px;
    font-size:14px;
    line-height:1.6;
}

.error{
    background:#fee2e2;
    color:#991b1b;
    border:1px solid #fecaca;
    padding:14px;
    border-radius:10px;
    margin-bottom:15px;
    display:none;
    line-height:1.5;
}

.exito{
    background:#dcfce7;
    color:#166534;
    border:1px solid #bbf7d0;
    padding:14px;
    border-radius:10px;
    margin-bottom:15px;
    display:none;
    line-height:1.5;
}

.adjuntos{
    border:1px dashed #9ca3af;
    border-radius:12px;
    padding:15px;
    margin-bottom:15px;
    background:#f9fafb;
}

.archivo-seleccionado{
    font-size:13px;
    color:#374151;
    margin-top:8px;
    word-break:break-word;
}

.audio-controles{
    display:flex;
    gap:10px;
    flex-wrap:wrap;
}

.audio-controles button{
    flex:1;
    min-width:130px;
    border:0;
    border-radius:10px;
    padding:12px;
    font-weight:bold;
    cursor:pointer;
}

.audio-preview{
    width:100%;
    margin-top:12px;
}

.grabando{

    color:#991b1b;
    padding:12px;
    border-radius:10px;
    text-align:center;
    font-weight:bold;
    margin-bottom:10px;
}
