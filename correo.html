<head>

>

<meta

<title>Correo - GESBASE</title>

<style>

*{
    box-sizing:border-box;
    margin:0;
    padding:0;
}

body{
    font-family:Arial,sans-serif;
    background:#f3f4f6;
    color:#111827;
}

.app{
    width:100%;
    max-width:1000px;
    min-height:100vh;
    margin:auto;
    background:white;
}

header{
    background:#111827;
    color:white;
    padding:20px;
}

.header-superior{
    display:flex;
    justify-content:space-between;
    align-items:center;
    gap:15px;
}

.logo{
    font-size:25px;
    font-weight:bold;
}

.subtitulo{
    margin-top:5px;
    color:#d1d5db;
    font-size:13px;
}

.btn-volver{
    border:none;
    background:#374151;
    color:white;
    padding:10px 14px;
    border-radius:9px;
    cursor:pointer;
    font-weight:bold;
}

main{
    padding:20px;
}

.error,
.exito{
    padding:14px;
    border-radius:10px;
    margin-bottom:15px;

}

.error{
    background:#fee2e2;
    color:#991b1b;
}

.exito{

    color:#166534;
}

.cuenta{
    background:#eff6ff;
    border:1px solid #bfdbfe;

}

.cuenta-titulo{
    font-size:12px;

}

.cuenta-nombre{

}

.cuenta-email{

    color:#2563eb;
    font-size:14px;
}

.menu{
    display:grid;
    grid-template-columns:repeat(4,1fr);
    gap:8px;
    margin-bottom:20px;
}

.menu button{
    border:none;
    padding:13px 8px;
    border-radius:10px;
    background:#e5e7eb;
    color:#111827;
    font-weight:bold;
    cursor:pointer;
}

.menu button.activo{
    background:#111827;
    color:white;
}

.nuevo{
    width:100%;
    border:none;
    background:#2563eb;
    color:white;
    padding:15px;
    border-radius:10px;
    font-size:16px;
    font-weight:bold;
    cursor:pointer;
    margin-bottom:20px;
}

.lista{
    display:flex;
    flex-direction:column;
    gap:10px;
}

.correo{
    border:1px solid #d1d5db;
    border-radius:12px;
    padding:15px;
    cursor:pointer;
    background:white;
}

.correo:hover{

}

.correo.no-leido{
    border-left:5px solid #2563eb;
    background:#eff6ff;
}

.correo-cabecera{
    display:flex;
    justify-content:space-between;
    gap:10px;
}

.correo-persona{
    font-weight:bold;
}

.correo-fecha{
    font-size:12px;
    color:#6b7280;
}

.correo-asunto{
    margin-top:7px;
    font-weight:bold;
}

.correo-preview{
    margin-top:5px;
    color:#6b7280;
    font-size:14px;
    white-space:nowrap;
    overflow:hidden;
    text-overflow:ellipsis;
}

.vacio{
    text-align:center;
    padding:45px 15px;
    border:1px dashed #d1d5db;
    border-radius:12px;
    color:#6b7280;
}

.cargando{
    text-align:center;
    padding:35px;
    color:#6b7280;
}

.formulario{
    display:none;
    border:1px solid #d1d5db;
    border-radius:12px;
    padding:18px;
    margin-bottom:20px;
    background:#f9fafb;
}

.formulario h2{
    margin-bottom:15px;
}

.campo{
    margin-bottom:14px;
}

.campo label{
    display:block;
    font-weight:bold;
    font-size:14px;
    margin-bottom:6px;
}

.campo input,
.campo select,
.campo textarea{
    width:100%;
    padding:13px;
    border:1px solid #d1d5db;
    border-radius:9px;
    font-size:15px;
    background:white;
}

.campo textarea{
    min-height:180px;
    resize:vertical;
}

.botones-formulario{
    display:grid;
    grid-template-columns:1fr 1fr;
    gap:10px;
}

.btn-enviar{
    border:none;
    background:#2563eb;
    color:white;
    padding:14px;
    border-radius:10px;
    font-weight:bold;
    cursor:pointer;
}

.btn-borrador{
    border:none;
    background:#e5e7eb;
    color:#111827;
    padding:14px;
    border-radius:10px;
    font-weight:bold;
    cursor:pointer;
}

.btn-cancelar{
    width:100%;
    border:none;
    background:#fee2e2;
    color:#991b1b;
    padding:12px;
    border-radius:10px;
    font-weight:bold;
    cursor:pointer;
    margin-top:10px;
}

.visor{
    display:none;
    border:1px solid #d1d5db;
    border-radius:12px;
    padding:20px;
    margin-bottom:20px;
}

.visor h2{
    margin-bottom:15px;
}

.visor-dato{
    margin-bottom:10px;
    font-size:14px;
}

.visor-mensaje{
    margin-top:18px;
    padding-top:18px;
    border-top:1px solid #e5e7eb;
    white-space:pre-wrap;
    line-height:1.6;
}

.btn-cerrar{
    border:none;
    background:#e5e7eb;
    padding:11px 15px;
    border-radius:9px;
    cursor:pointer;
    font-weight:bold;
    margin-bottom:15px;
}

@media(max-width:700px){

    .menu{
        grid-template-columns:1fr 1fr;
    }

}

@media(max-width:500px){

    main{
        padding:15px;
    }

    .header-superior{
        align-items:flex-start;
    }

    .botones-formulario{
        grid-template-columns:1fr;
    }

}

</style>

</head>

<script type="module">

/* ==========================================
   FIREBASE ACTUAL DE GESBASE
========================================== */

import {
    auth,
    db
} from "./Js/firebase.js";


import {
    onAuthStateChanged
} from
"https://www.gstatic.com/firebasejs/12.1.0/firebase-auth.js";


import {
    collection,
    addDoc,
    getDocs,
    getDoc,
    doc,
    updateDoc,
    query,
    where,
    orderBy,
    serverTimestamp
} from
"https://www.gstatic.com/firebasejs/12.1.0/firebase-firestore.js";


/* ==========================================
   ELEMENTOS
========================================== */

const mensajeError =
document.getElementById(
    "mensajeError"
);

const mensajeExito =
document.getElementById(
    "mensajeExito"
);

const nombreCuenta =
document.getElementById(
    "nombreCuenta"
);

const emailCuenta =
document.getElementById(
    "emailCuenta"
);

const destinatario =
document.getElementById(
    "destinatario"
);

const asunto =
document.getElementById(
    "asunto"
);

const mensaje =
document.getElementById(
    "mensaje"
);

const formularioCorreo =
document.getElementById(
    "formularioCorreo"
);

const visor =
document.getElementById(
    "visor"
);

const listaCorreos =
document.getElementById(
    "listaCorreos"
);

const cargando =
document.getElementById(
    "cargando"
);

const btnEntrada =
document.getElementById(
    "btnEntrada"
);

const btnEnviados =
document.getElementById(
    "btnEnviados"
);

const btnBorradores =
document.getElementById(
    "btnBorradores"
);

const btnNuevoMenu =
document.getElementById(
    "btnNuevoMenu"
);

const btnNuevoCorreo =
document.getElementById(
    "btnNuevoCorreo"
);

const btnEnviar =
document.getElementById(
    "btnEnviar"
);

const btnGuardarBorrador =
document.getElementById(
    "btnGuardarBorrador"
);

const btnCancelarCorreo =
document.getElementById(
    "btnCancelarCorreo"
);

const btnCerrarVisor =
document.getElementById(
    "btnCerrarVisor"
);

const btnVolver =
document.getElementById(
    "btnVolver"
);


/* ==========================================
   VARIABLES
========================================== */

let usuarioActual = null;

let datosUsuario = {};

let empresaId = "";

let vistaActual = "entrada";

let empleados = [];


/* ==========================================
   UTILIDADES
========================================== */

function texto(valor){

    if(
        valor === undefined ||
        valor === null
    ){

        return "";

    }

    return String(valor);

}


function mostrarError(textoMensaje){

    mensajeError.textContent =
    textoMensaje;

    mensajeError.style.display =
    "block";

    mensajeExito.style.display =
    "none";

    window.scrollTo({
        top:0,
        behavior:"smooth"
    });

}


function mostrarExito(textoMensaje){

    mensajeExito.textContent =
    textoMensaje;

    mensajeExito.style.display =
    "block";

    mensajeError.style.display =
    "none";

}


function limpiarMensajes(){

    mensajeError.style.display =
    "none";

    mensajeExito.style.display =
    "none";

}


function fechaCorreo(fecha){

    if(!fecha){

        return "";

    }

    try{

        return fecha.toLocaleString(
            "es-AR"
        );

    }
    catch{

        return "";

    }

}


/* ==========================================
   CARGAR PERFIL
========================================== */

async function cargarPerfil(){

    const referencia =
    doc(
        db,
        "usuarios",
        usuarioActual.uid
    );

    const resultado =
    await getDoc(
        referencia
    );


    if(
        !resultado.exists()
    ){

        throw new Error(
            "No encontramos el perfil del usuario."
        );

    }


    datosUsuario =
    resultado.data();


    empresaId =
    datosUsuario.empresaId ||
    usuarioActual.uid;


    const nombre =
    (
        texto(datosUsuario.nombre) +
        " " +
        texto(datosUsuario.apellido)
    ).trim();


    nombreCuenta.textContent =
    nombre ||
    datosUsuario.nombreEmpresa ||
    datosUsuario.empresa ||
    "Usuario";


    emailCuenta.textContent =
    datosUsuario.email ||
    usuarioActual.email ||
    "Sin email";

}


/* ==========================================
   CARGAR DESTINATARIOS
========================================== */

async function cargarDestinatarios(){

    destinatario.innerHTML = `

        <option value="">
            Seleccionar destinatario
        </option>

    `;


    empleados = [];


    try{

        const consulta =
        query(
            collection(
                db,
                "empleados"
            ),
            where(
                "empresaId",
                "==",
                empresaId
            )
        );


        const resultado =
        await getDocs(
            consulta
        );


        resultado.forEach(
            documento => {

                empleados.push({
                    id:documento.id,
                    ...documento.data()
                });

            }
        );


        empleados.sort(
            (a,b) => {

                const nombreA =
                (
                    texto(a.nombre) +
                    " " +
                    texto(a.apellido)
                ).toLowerCase();

                const nombreB =
                (
                    texto(b.nombre) +
                    " " +
                    texto(b.apellido)
                ).toLowerCase();

                return nombreA.localeCompare(
                    nombreB
                );

            }
        );


        empleados.forEach(
            empleado => {

                const opcion =
                document.createElement(
                    "option"
                );


                opcion.value =
                empleado.id;


                opcion.textContent =
                (
                    texto(empleado.nombre) +
                    " " +
                    texto(empleado.apellido)
                ).trim();


                if(empleado.email){

                    opcion.textContent +=
                    " — " +
                    empleado.email;

                }


                destinatario.appendChild(
                    opcion
                );

            }
        );


        /* ================================
           AGREGAR ADMINISTRADOR
        ================================= */

        const opcionEmpresa =
        document.createElement(
            "option"
        );


        opcionEmpresa.value =
        usuarioActual.uid;


        opcionEmpresa.textContent =
        "🏢 Administración";


        destinatario.appendChild(
            opcionEmpresa
        );


    }
    catch(error){

        console.error(error);

        mostrarError(
            "No se pudieron cargar los destinatarios: " +
            error.message
        );

    }

}


/* ==========================================
   ABRIR NUEVO CORREO
========================================== */

function abrirNuevoCorreo(){

    limpiarMensajes();

    visor.style.display =
    "none";

    formularioCorreo.style.display =
    "block";

    listaCorreos.style.display =
    "none";

    btnNuevoCorreo.style.display =
    "none";

    destinatario.value =
    "";

    asunto.value =
    "";

    mensaje.value =
    "";

}


/* ==========================================
   CERRAR FORMULARIO
========================================== */

function cerrarFormulario(){

    formularioCorreo.style.display =
    "none";

    listaCorreos.style.display =
    "flex";

    btnNuevoCorreo.style.display =
    "block";

    asunto.value =
    "";

    mensaje.value =
    "";

    destinatario.value =
    "";

}


/* ==========================================
   OBTENER DATOS DESTINATARIO
========================================== */

async function obtenerDestinatario(){

    const id =
    destinatario.value;


    if(!id){

        return null;

    }


    if(
        id === usuarioActual.uid
    ){

        return {

            uid:
            usuarioActual.uid,

            nombre:
            datosUsuario.nombre ||
            "Administración",

            apellido:
            datosUsuario.apellido ||
            "",

            email:
            datosUsuario.email ||
            usuarioActual.email ||
            "",

            tipo:
            "administrador"

        };

    }


    const empleado =
    empleados.find(
        e => e.id === id
    );


    if(!empleado){

        return null;

    }


    return {

        uid:
        empleado.authUid ||
        "",

        empleadoId:
        empleado.id,

        nombre:
        empleado.nombre ||
        "",

        apellido:
        empleado.apellido ||
        "",

        email:
        empleado.email ||
        "",

        tipo:
        "empleado"

    };

}


/* ==========================================
   ENVIAR CORREO
========================================== */

async function enviarCorreo(){

    limpiarMensajes();


    const asuntoValor =
    asunto.value.trim();

    const mensajeValor =
    mensaje.value.trim();


    if(!destinatario.value){

        mostrarError(
            "Seleccioná un destinatario."
        );

        return;

    }


    if(!asuntoValor){

        mostrarError(
            "Ingresá un asunto."
        );

        return;

    }


    if(!mensajeValor){

        mostrarError(
            "Escribí el mensaje."
        );

        return;

    }


    const receptor =
    await obtenerDestinatario();


    if(!receptor){

        mostrarError(
            "No se pudo encontrar el destinatario."
        );

        return;

    }


    if(!receptor.uid){

        mostrarError(
            "Ese empleado todavía no tiene un acceso de GESBASE creado."
        );

        return;

    }


    btnEnviar.disabled =
    true;

    btnEnviar.textContent =
    "ENVIANDO...";


    try{

        await addDoc(
            collection(
                db,
                "correos"
            ),
            {

                empresaId:
                empresaId,

                remitenteUid:
                usuarioActual.uid,

                remitenteNombre:
                (
                    texto(datosUsuario.nombre) +
                    " " +
                    texto(datosUsuario.apellido)
                ).trim() ||
                "Administración",

                remitenteEmail:
                datosUsuario.email ||
                usuarioActual.email ||
                "",

                destinatarioUid:
                receptor.uid,

                destinatarioEmpleadoId:
                receptor.empleadoId ||
                null,

                destinatarioNombre:
                (
                    texto(receptor.nombre) +
                    " " +
                    texto(receptor.apellido)
                ).trim(),

                destinatarioEmail:
                receptor.email ||
                "",

                asunto:
                asuntoValor,

                mensaje:
                mensajeValor,

                estado:
                "enviado",

                leido:
                false,

                creado:
                serverTimestamp(),

                actualizado:
                serverTimestamp()

            }
        );


        mostrarExito(
            "Correo enviado correctamente."
        );


        cerrarFormulario();


        await cargarCorreos(
            "enviados"
        );


        seleccionarVista(
            "enviados"
        );

    }
    catch(error){

        console.error(error);

        mostrarError(
            "No se pudo enviar el correo: " +
            error.message
        );

    }
    finally{

        btnEnviar.disabled =
        false;

        btnEnviar.textContent =
        "📤 ENVIAR";

    }

}


/* ==========================================
   GUARDAR BORRADOR
========================================== */

async function guardarBorrador(){

    limpiarMensajes();


    if(
        !asunto.value.trim() &&
        !mensaje.value.trim()
    ){

        mostrarError(
            "Escribí al menos un asunto o mensaje."
        );

        return;

    }


    let receptor =
    null;


    if(destinatario.value){

        receptor =
        await obtenerDestinatario();

    }


    btnGuardarBorrador.disabled =
    true;

    btnGuardarBorrador.textContent =
    "GUARDANDO...";


    try{

        await addDoc(
            collection(
                db,
                "correos"
            ),
            {

                empresaId:
                empresaId,

                remitenteUid:
                usuarioActual.uid,

                remitenteNombre:
                (
                    texto(datosUsuario.nombre) +
                    " " +
                    texto(datosUsuario.apellido)
                ).trim() ||
                "Administración",

                remitenteEmail:
                datosUsuario.email ||
                usuarioActual.email ||
                "",

                destinatarioUid:
                receptor?.uid ||
                "",

                destinatarioEmpleadoId:
                receptor?.empleadoId ||
                null,

                destinatarioNombre:
                receptor
                    ?
                    (
                        texto(receptor.nombre) +
                        " " +
                        texto(receptor.apellido)
                    ).trim()
                    :
                    "",

                destinatarioEmail:
                receptor?.email ||
                "",

                asunto:
                asunto.value.trim(),

                mensaje:
                mensaje.value.trim(),

                estado:
                "borrador",

                leido:
                false,

                creado:
                serverTimestamp(),

                actualizado:
                serverTimestamp()

            }
        );


        mostrarExito(
            "Borrador guardado correctamente."
        );


        cerrarFormulario();


        seleccionarVista(
            "borradores"
        );

    }
    catch(error){

        console.error(error);

        mostrarError(
            "No se pudo guardar el borrador: " +
            error.message
        );

    }
    finally{

        btnGuardarBorrador.disabled =
        false;

        btnGuardarBorrador.textContent =
        "📝 GUARDAR BORRADOR";

    }

}


/* ==========================================
   CARGAR CORREOS
========================================== */

async function cargarCorreos(
    tipo
){

    cargando.style.display =
    "block";

    listaCorreos.innerHTML =
    "";


    try{

        let consulta;


        if(tipo === "entrada"){

            consulta =
            query(
                collection(
                    db,
                    "correos"
                ),
                where(
                    "empresaId",
                    "==",
                    empresaId
                ),
                where(
                    "destinatarioUid",
                    "==",
                    usuarioActual.uid
                ),
                where(
                    "estado",
                    "==",
                    "enviado"
                )
            );

        }
        else if(tipo === "enviados"){

            consulta =
            query(
                collection(
                    db,
                    "correos"
                ),
                where(
                    "empresaId",
                    "==",
                    empresaId
                ),
                where(
                    "remitenteUid",
                    "==",
                    usuarioActual.uid
                ),
                where(
                    "estado",
                    "==",
                    "enviado"
                )
            );

        }
        else{

            consulta =
            query(
                collection(
                    db,
                    "correos"
                ),
                where(
                    "empresaId",
                    "==",
                    empresaId
                ),
                where(
                    "remitenteUid",
                    "==",
                    usuarioActual.uid
                ),
                where(
                    "estado",
                    "==",
                    "borrador"
                )
            );

        }


        const resultado =
        await getDocs(
            consulta
        );


        cargando.style.display =
        "none";


        const correos = [];


        resultado.forEach(
            documento => {

                correos.push({
                    id:
                    documento.id,

                    ...documento.data()
                });

            }
        );


        correos.sort(
            (a,b) => {

                const fechaA =
                a.creado?.toMillis
                    ?
                    a.creado.toMillis()
                    :
                    0;

                const fechaB =
                b.creado?.toMillis
                    ?
                    b.creado.toMillis()
                    :
                    0;

                return fechaB - fechaA;

            }
        );


        if(!correos.length){

            listaCorreos.innerHTML = `

                <div class="vacio">

                    ${
                        tipo === "entrada"
                        ?
                        "📥 No tenés correos recibidos."
                        :
                        tipo === "enviados"
                        ?
                        "📤 No tenés correos enviados."
                        :
                        "📝 No tenés borradores."
                    }

                </div>

            `;

            return;

        }


        correos.forEach(
            correo => {

                mostrarCorreo(
                    correo,
                    tipo
                );

            }
        );

    }
    catch(error){

        cargando.style.display =
        "none";

        console.error(error);


        /* =================================
           FIRESTORE PUEDE PEDIR ÍNDICE.
        ================================= */

        mostrarError(
            "No se pudieron cargar los correos: " +
            error.message
        );

    }

}


/* ==========================================
   MOSTRAR CORREO
========================================== */

function mostrarCorreo(
    correo,
    tipo
){

    const tarjeta =
    document.createElement(
        "div"
    );


    tarjeta.className =
    "correo";


    if(
        tipo === "entrada" &&
        correo.leido === false
    ){

        tarjeta.classList.add(
            "no-leido"
        );

    }


    const cabecera =
    document.createElement(
        "div"
    );


    cabecera.className =
    "correo-cabecera";


    const persona =
    document.createElement(
        "div"
    );


    persona.className =
    "correo-persona";


    if(tipo === "entrada"){

        persona.textContent =
        "De: " +
        (
            correo.remitenteNombre ||
            correo.remitenteEmail ||
            "Usuario"
        );

    }
    else{

        persona.textContent =
        "Para: " +
        (
            correo.destinatarioNombre ||
            correo.destinatarioEmail ||
            "Sin destinatario"
        );

    }


    const fecha =
    document.createElement(
        "div"
    );


    fecha.className =
    "correo-fecha";


    fecha.textContent =
    fechaCorreo(
        correo.creado?.toDate
            ?
            correo.creado.toDate()
            :
            null
    );


    cabecera.appendChild(
        persona
    );

    cabecera.appendChild(
        fecha
    );


    const asuntoElemento =
    document.createElement(
        "div"
    );


    asuntoElemento.className =
    "correo-asunto";


    asuntoElemento.textContent =
    correo.asunto ||
    "(Sin asunto)";


    const preview =
    document.createElement(
        "div"
    );


    preview.className =
    "correo-preview";


    preview.textContent =
    correo.mensaje ||
    "(Sin contenido)";


    tarjeta.appendChild(
        cabecera
    );

    tarjeta.appendChild(
        asuntoElemento
    );

    tarjeta.appendChild(
        preview
    );


    tarjeta.onclick =
    function(){

        abrirCorreo(
            correo
        );

    };


    listaCorreos.appendChild(
        tarjeta
    );

}


/* ==========================================
   ABRIR CORREO
========================================== */

async function abrirCorreo(
    correo
){

    limpiarMensajes();


    formularioCorreo.style.display =
    "none";

    listaCorreos.style.display =
    "none";

    btnNuevoCorreo.style.display =
    "none";

    visor.style.display =
    "block";


    document.getElementById(
        "visorAsunto"
    ).textContent =
    correo.asunto ||
    "(Sin asunto)";


    document.getElementById(
        "visorDe"
    ).textContent =
    correo.remitenteNombre ||
    correo.remitenteEmail ||
    "";


    document.getElementById(
        "visorPara"
    ).textContent =
    correo.destinatarioNombre ||
    correo.destinatarioEmail ||
    "";


    document.getElementById(
        "visorFecha"
    ).textContent =
    fechaCorreo(
        correo.creado?.toDate
            ?
            correo.creado.toDate()
            :
            null
    );


    document.getElementById(
        "visorMensaje"
    ).textContent =
    correo.mensaje ||
    "";


    /* MARCAR COMO LEÍDO */

    if(
        correo.destinatarioUid ===
        usuarioActual.uid &&
        correo.leido === false
    ){

        try{

            await updateDoc(
                doc(
                    db,
                    "correos",
                    correo.id
                ),
                {

                    leido:
                    true,

                    actualizado:
                    serverTimestamp()

                }
            );

        }
        catch(error){

            console.error(
                "No se pudo marcar como leído:",
                error
            );

        }

    }

}


/* ==========================================
   SELECCIONAR VISTA
========================================== */

async function seleccionarVista(
    vista
){

    vistaActual =
    vista;


    btnEntrada.classList.remove(
        "activo"
    );

    btnEnviados.classList.remove(
        "activo"
    );

    btnBorradores.classList.remove(
        "activo"
    );


    if(vista === "entrada"){

        btnEntrada.classList.add(
            "activo"
        );

    }
    else if(vista === "enviados"){

        btnEnviados.classList.add(
            "activo"
        );

    }
    else{

        btnBorradores.classList.add(
            "activo"
        );

    }


    visor.style.display =
    "none";

    formularioCorreo.style.display =
    "none";

    listaCorreos.style.display =
    "flex";

    btnNuevoCorreo.style.display =
    "block";


    await cargarCorreos(
        vista
    );

}
