<script type="module">

/*
==================================================
 GESBASE - CORREO INTERNO
==================================================
*/


/* =================================================
   IMPORTACIÓN SEGURA DE FIREBASE
================================================= */

let auth;
let db;
let storage;

let firebaseOK = false;


const errorBox =
document.getElementById("error");


const successBox =
document.getElementById("success");


const usuarioBox =
document.getElementById("usuario");


function mostrarError(mensaje){

    errorBox.textContent =
    mensaje;

    errorBox.style.display =
    "block";

    successBox.style.display =
    "none";

}


function mostrarExito(mensaje){

    successBox.textContent =
    mensaje;

    successBox.style.display =
    "block";

    errorBox.style.display =
    "none";

}


function limpiarMensajes(){

    errorBox.style.display =
    "none";

    successBox.style.display =
    "none";

}


/* =================================================
   CARGAR FIREBASE.JS
================================================= */

try{

    const modulo =
    await import("./Js/firebase.js");

    auth =
    modulo.auth;

    db =
    modulo.db;

    storage =
    modulo.storage;


    if(!auth){

        throw new Error(
            "firebase.js no exporta 'auth'."
        );

    }


    if(!db){

        throw new Error(
            "firebase.js no exporta 'db'."
        );

    }


    firebaseOK =
    true;

}
catch(error){

    console.error(
        "ERROR FIREBASE:",
        error
    );


    usuarioBox.innerHTML = `
    
        <strong>
        Error de conexión
        </strong>

        <br><br>

        No se pudo cargar Firebase.

        <br><br>

        ${escapeHTML(error.message)}

    `;


    mostrarError(
        "No se pudo iniciar Firebase.\n\n" +
        error.message +
        "\n\nRevisá que exista:\nJs/firebase.js"
    );

}


/* =================================================
   FIREBASE AUTH
================================================= */

let onAuthStateChanged;
let signOut;


if(firebaseOK){

    try{

        const firebaseAuth =
        await import(
            "https://www.gstatic.com/firebasejs/12.1.0/firebase-auth.js"
        );


        onAuthStateChanged =
        firebaseAuth.onAuthStateChanged;


        signOut =
        firebaseAuth.signOut;

    }
    catch(error){

        mostrarError(
            "No se pudo cargar Firebase Authentication.\n\n" +
            error.message
        );

        firebaseOK =
        false;

    }

}


/* =================================================
   FIRESTORE
================================================= */

let collection;
let addDoc;
let getDocs;
let getDoc;
let updateDoc;
let doc;
let query;
let where;
let limit;
let serverTimestamp;


if(firebaseOK){

    try{

        await import(

        collection =

        addDoc =
        firestore.addDoc;

        getDocs =
        firestore.getDocs;

        getDoc =
        firestore.getDoc;

        updateDoc =
        firestore.updateDoc;

        doc =
        firestore.doc;

        query =
        firestore.query;

        where =
        firestore.where;

        limit =
        firestore.limit;

        serverTimestamp =
        firestore.serverTimestamp;

    }
    catch(error){

        mostrarError(
            "No se pudo cargar Firestore.\n\n" +
            error.message
        );

        firebaseOK =
        false;

    }

}


/* =================================================

================================================= */

let ref;
let uploadBytes;
let getDownloadURL;


if(firebaseOK && storage){

        );

}

let usuarioSesion =

[];

/* =================================================
   UTILIDADES
================================================= */

function texto(valor){

    if(
        valor === null ||
        valor === undefined
    ){

        return "";

    }

    return String(valor);

}


function escapeHTML(valor){

    return texto(valor)
    .replace(/&/g,"&amp;")
    .replace(/</g,"&lt;")
    .replace(/>/g,"&gt;")
    .replace(/"/g,"&quot;")
    .replace(/'/g,"&#039;");

}


function nombrePersona(datos){

    const nombre =
    texto(datos.nombre).trim();

    const apellido =
    texto(datos.apellido).trim();

    return (
        nombre +
        " " +
        apellido
    ).trim();

}


function fechaHora(timestamp){

    try{

        if(
            timestamp &&
            typeof timestamp.toDate ===
            "function"
        ){

            return timestamp
            .toDate()
            .toLocaleString("es-AR");

        }

    }
    catch(e){}

    return "";

}


function tiempoCorreo(correo){

    if(
        correo.creado &&
        typeof correo.creado.toMillis ===
        "function"
    ){

        return correo.creado.toMillis();

    }

    const fecha =
    texto(correo.fecha);

    const hora =
    texto(correo.hora);

    const resultado =
    new Date(
        fecha +
        "T" +
        (hora || "00:00:00")
    ).getTime();

    return isNaN(resultado)
        ? 0
        : resultado;

}


/* =================================================
   BUSCAR USUARIO
================================================= */

async function buscarUsuario(){

    /*
       PRIMERA OPCIÓN:
       usuarios/{UID}
    */

    try{

        const referencia =
        doc(
            db,
            "usuarios",
            usuarioSesion.uid
        );


        const resultado =
        await getDoc(
            referencia
        );


        if(resultado.exists()){

            return {

                id:
                resultado.id,

                ...resultado.data()

            };

        }

    }
    catch(error){

        console.warn(
            "usuarios/UID:",
            error
        );

    }


    /*
       SEGUNDA OPCIÓN:
       usuarios.uid
    */

    try{

        const consulta =
        query(
            collection(db,"usuarios"),
            where(
                "uid",
                "==",
                usuarioSesion.uid
            ),
            limit(1)
        );


        const resultado =
        await getDocs(
            consulta
        );


        if(!resultado.empty){

            const d =
            resultado.docs[0];


            return {

                id:d.id,

                ...d.data()

            };

        }

    }
    catch(error){

        console.warn(
            "usuarios uid:",
            error
        );

    }


    /*
       TERCERA OPCIÓN:
       usuarios.authUid
    */

    try{

        const consulta =
        query(
            collection(db,"usuarios"),
            where(
                "authUid",
                "==",
                usuarioSesion.uid
            ),
            limit(1)
        );


        const resultado =
        await getDocs(
            consulta
        );


        if(!resultado.empty){

            const d =
            resultado.docs[0];


            return {

                id:d.id,

                ...d.data()

            };

        }

    }
    catch(error){

        console.warn(
            "usuarios authUid:",
            error
        );

    }


    return null;

}


/* =================================================

async function buscarEmpleado(){

    /*
       Busca empleado por UID.
    */

    try{

        const consulta =
        query(
            collection(db,"empleados"),
            where(
                "uid",

    }
    catch(error){

        console.warn(
            "empleados uid:",
            error
        );

    }


    /*
       Busca empleado por authUid.
    */

    try{

        const consulta =
        query(
            collection(db,"empleados"),
            where(
                "authUid",
                "==",

            ),

    }
    catch(error){

        );

    }


    /*
       Busca empleado por email.
    */

    if(usuarioSesion.email){

        try{

            const consulta =
            query(
                collection(db,"empleados"),
                where(

        }

    }


    return null;

}


/* =================================================
   CARGAR PERFIL
================================================= */

async function cargarPerfil(){

    let datos =
    await buscarUsuario();


    let esEmpleado =
    false;


    /*
       Si no está en usuarios,
       buscamos empleados.
    */

    if(!datos){

        datos =
        await buscarEmpleado();

        esEmpleado =
        true;

    }


    if(!datos){

        throw new Error(
            "El usuario inició sesión correctamente, pero no existe en las colecciones 'usuarios' ni 'empleados'."
        );

    }


    perfil =
    datos;


    perfilId =
    datos.id;


    /*
       EMPRESA ID
    */

    empresaId =

        texto(
            datos.empresaId
        ).trim() ||

        texto(
            datos.idEmpresa
        ).trim() ||

        texto(
            datos.empresaID
        ).trim();


    /*
       Algunos sistemas guardan
       la empresa directamente.
    */

    if(!empresaId){

        empresaId =
        texto(
            datos.empresa
        ).trim();

    }


    /*
       Si el documento tiene
       empresaId, usamos eso.
    */

    const nombre =
    nombrePersona(datos) ||

    texto(
        datos.nombreEmpresa
    ).trim() ||

    texto(
        datos.razonSocial
    ).trim() ||

    texto(
        datos.email
    ).trim() ||

    "Usuario";


    const email =

    texto(
        datos.email
    ).trim() ||

    texto(
        usuarioSesion.email
    ).trim();


    const rol =

    texto(
        datos.rol
    ).trim() ||

    texto(
        datos.tipo
    ).trim() ||

    (
        esEmpleado
        ? "Empleado"
        : "Usuario"
    );


    /*
       Si el usuario es empresa
       y no tiene empresaId,
       usamos su UID.
    */

    const esEmpresa =
    texto(datos.tipo)
    .toLowerCase() === "empresa" ||

    texto(datos.rol)
    .toLowerCase() === "empresa" ||

    Boolean(
        texto(
            datos.nombreEmpresa
        ).trim()
    );


    if(
        !empresaId &&
        esEmpresa
    ){

/* =================================================
   AGREGAR DESTINATARIO
================================================= */

function agregarDestinatario(datos){

    if(!datos){

        return;

    }


    const id =
    texto(datos.id).trim();


    if(!id){

        return;

    }


    /*
       No mostrar al usuario actual.
    */

    if(id === perfilId){

        return;

    }


    if(
        datos.uid &&
        texto(datos.uid) ===
        usuarioSesion.uid
    ){

        return;

    }


    if(
        datos.authUid &&
        texto(datos.authUid) ===
        usuarioSesion.uid
    ){

        return;

    }


    const yaExiste =
    destinatarios.some(
        item => {

            return (

                item.id === id ||

                (
                    item.uid &&
                    datos.uid &&
                    item.uid ===
                    datos.uid
                ) ||

                (
                    item.authUid &&
                    datos.authUid &&
                    item.authUid ===
                    datos.authUid
                )

            );

        }
    );


    if(yaExiste){

        return;

    }


    const nombre =

    nombrePersona(datos) ||

    texto(
        datos.nombreEmpresa
    ).trim() ||

    texto(
        datos.razonSocial
    ).trim() ||

    texto(
        datos.email
    ).trim() ||

    "Usuario";


    destinatarios.push({

        id:id,

        uid:
        texto(datos.uid),

        authUid:
        texto(datos.authUid),

        nombre:nombre,

        email:
        texto(datos.email),

        tipo:
        texto(datos.tipo) ||

        texto(datos.rol) ||

        "Usuario"

    });

}

/* =================================================
   AUDIO
================================================= */

btnGrabar.addEventListener(
    "click",
    async function(){

        limpiarMensajes();


        if(
            !navigator.mediaDevices ||
            !navigator.mediaDevices.getUserMedia
        ){

            mostrarError(
                "Este navegador no permite acceder al micrófono."
            );

            return;

        }


        try{

            const stream =
            await navigator.mediaDevices.getUserMedia({
                audio:true
            });


            audioChunks =
            [];


            audioBlob =
            null;


            let tipoAudio =
            "audio/webm";


            if(
                MediaRecorder.isTypeSupported(
                    "audio/webm;codecs=opus"
                )
            ){

                tipoAudio =
                "audio/webm;codecs=opus";

            }


            mediaRecorder =
            new MediaRecorder(
                stream,
                {
                    mimeType:
                    tipoAudio
                }
            );


            mediaRecorder.ondataavailable =
            function(event){

                if(event.data.size > 0){

                    audioChunks.push(
                        event.data
                    );

                }

            };


            mediaRecorder.onstop =
            function(){

                audioBlob =
                new Blob(
                    audioChunks,
                    {
                        type:
                        mediaRecorder.mimeType ||
                        "audio/webm"
                    }
                );


                if(audioURL){

                    URL.revokeObjectURL(
                        audioURL
                    );

                }


                audioURL =
                URL.createObjectURL(
                    audioBlob
                );


                audioPreview.src =
                audioURL;


                audioPreview.style.display =
                "block";


                grabando.style.display =
                "none";


                btnGrabar.disabled =
                false;


                btnDetener.disabled =
                true;


                stream.getTracks()
                .forEach(
                    track =>
                    track.stop()
                );


                actualizarBotonEnviar();

            };


            mediaRecorder.start();


            grabando.style.display =
            "block";


            btnGrabar.disabled =
            true;


            btnDetener.disabled =
            false;

        }
        catch(error){

            console.error(
                error
            );


            mostrarError(
                "No se pudo acceder al micrófono.\n\nPermití el acceso al micrófono y volvé a intentarlo."
            );

        }

    }
);

/* =================================================
   SUBIR ARCHIVO
================================================= */

async function subirArchivo(file){

    if(!file){

        return null;

    }


    if(
        !storage ||
        !ref ||
        !uploadBytes ||
        !getDownloadURL
    ){

        throw new Error(
            "Firebase Storage no está disponible."
        );

    }


    const nombreSeguro =
    file.name.replace(
        /[^a-zA-Z0-9._-]/g,
        "_"
    );


    const ruta =

    "correos/" +
    empresaId +
    "/" +
    usuarioSesion.uid +
    "/" +
    Date.now() +
    "_" +
    nombreSeguro;


    const referencia =
    ref(
        storage,
        ruta
    );


    await uploadBytes(
        referencia,
        file
    );


    const url =
    await getDownloadURL(
        referencia
    );


    return {

        tipo:
        "archivo",

        nombre:
        file.name,

        mimeType:
        file.type,

        tamanio:
        file.size,

        url:
        url,

        ruta:
        ruta

    };

}


/* =================================================
   SUBIR AUDIO
================================================= */

async function subirAudio(){

    if(!audioBlob){

        return null;

    }


    if(
        !storage ||
        !ref ||
        !uploadBytes ||
        !getDownloadURL
    ){

        throw new Error(
            "Firebase Storage no está disponible."
        );

    }


    const extension =
    audioBlob.type.includes("ogg")
        ? "ogg"
        : "webm";


    const nombre =
    "audio_" +
    Date.now() +
    "." +
    extension;


    const ruta =

    "correos/" +
    empresaId +
    "/" +
    usuarioSesion.uid +
    "/" +
    nombre;


    const referencia =
    ref(
        storage,
        ruta
    );


    await uploadBytes(
        referencia,
        audioBlob,
        {
            contentType:
            audioBlob.type
        }
    );


    const url =
    await getDownloadURL(
        referencia
    );


    return {

        tipo:
        "audio",

        nombre:
        nombre,

        mimeType:
        audioBlob.type,

        tamanio:
        audioBlob.size,

        url:
        url,

        ruta:
        ruta

    };

}

async function cargarRecibidos(){

    if(!usuarioSesion){

        return;

    }


    recibidos.innerHTML = `

        <div class="loading">
        Cargando mensajes...
        </div>

    `;


    try{

        const lista =
        [];


        /*
           Buscar por UID
        */

        try{

            const consulta =
            query(
                collection(
                    db,
                    "correos"
                ),
                where(
                    "destinatarioUid",
                    "==",
                    usuarioSesion.uid
                ),
                limit(100)
            );


            const resultado =
            await getDocs(
                consulta
            );


            resultado.forEach(
                d => {

                    lista.push({

                        id:d.id,

                        ...d.data()

                    });

                }
            );

        }
        catch(error){

            console.warn(
                "Recibidos UID:",
                error
            );

        }


        /*
           Buscar por email
        */

        const email =
        texto(
            usuarioSesion.email
        );


        if(email){

            try{

                const consulta =
                query(
                    collection(
                        db,
                        "correos"
                    ),
                    where(
                        "para",
                        "==",
                        email
                    ),
                    limit(100)
                );


                const resultado =
                await getDocs(
                    consulta
                );


                resultado.forEach(
                    d => {

                        const existe =
                        lista.some(
                            x =>
                            x.id ===
                            d.id
                        );


                        if(!existe){

                            lista.push({

                                id:d.id,

                                ...d.data()

                            });

                        }

                    }
                );

            }
            catch(error){

                console.warn(
                    "Recibidos email:",
                    error
                );

            }

        }


        recibidosArray =
        lista;


        recibidosArray.sort(
            (a,b) =>
            tiempoCorreo(b) -
            tiempoCorreo(a)
        );


        mostrarRecibidos();

    }
    catch(error){

        console.error(
            error
        );


        recibidos.innerHTML = `

            <div class="empty">

            No se pudieron cargar
            los mensajes.

            <br><br>

            ${escapeHTML(
                error.message
            )}

            </div>

        `;

    }

}

            const resultado =
            await getDocs(
                consulta
            );


            resultado.forEach(
                d => {

                    const existe =
                    lista.some(
                        x =>
                        x.id ===
                        d.id
                    );


                    if(!existe){

                        lista.push({

                            id:d.id,

                            ...d.data()

                        });

                    }

                }
            );

        }
        catch(error){

            console.warn(
                "Enviados remitenteUid:",
                error
            );

        }


        enviadosArray =
        lista;


        enviadosArray.sort(
            (a,b) =>
            tiempoCorreo(b) -
            tiempoCorreo(a)
        );


        mostrarEnviados();

    }
    catch(error){

        console.error(
            error
        );


        enviados.innerHTML = `

            <div class="empty">

            No se pudieron cargar
            los mensajes enviados.

            <br><br>

            ${escapeHTML(
                error.message
            )}

            </div>

        `;

    }

}


/* =================================================
   MOSTRAR ENVIADOS
================================================= */

function mostrarEnviados(){

    if(
        enviadosArray.length === 0
    ){

        enviados.innerHTML = `

            <div class="empty">

            📭 No tenés mensajes enviados.

            </div>

        `;

        return;

    }


    enviados.innerHTML =
    "";


    enviadosArray.forEach(
        correo => {

            const div =
            document.createElement(
                "div"
            );


            div.className =
            "mail";


            const nombre =

            texto(
                correo.destinatarioNombre
            ) ||

            texto(
                correo.para
            ) ||

            "Usuario";


            const fecha =

            texto(
                correo.fecha
            ) ||

            fechaHora(
                correo.creado
            );


            const icono =

            correo.tieneAudio
                ? " 🎙️"
                : correo.tieneArchivo
                ? " 📎"
                : "";


            div.innerHTML = `

                <div class="mail-top">

                    <div class="mail-person">

                        Para:
                        ${escapeHTML(
                            nombre
                        )}

                    </div>

                    <div class="mail-date">

                        ${escapeHTML(
                            fecha
                        )}

                        ${escapeHTML(
                            correo.hora
                        )}

                    </div>

                </div>


                <div class="mail-subject">

                    ${escapeHTML(
                        correo.asunto ||
                        "(Sin asunto)"
                    )}

                    ${icono}

                </div>


                <div class="mail-preview">

                    ${escapeHTML(
                        texto(
                            correo.mensaje
                        ).substring(
                            0,
                            180
                        )
                    )}

                </div>

            `;


            div.addEventListener(
                "click",
                function(){

                    abrirCorreo(
                        correo,
                        false
                    );

                }
            );


            enviados.appendChild(
                div
            );

        }
    );

}


/* =================================================
   ABRIR CORREO
================================================= */

async function abrirCorreo(
    correo,
    recibido
){

    const de =

    texto(
        correo.remitenteNombre
    ) ||

    texto(
        correo.de
    ) ||

    "Usuario";


    const para =

    texto(
        correo.destinatarioNombre
    ) ||

    texto(
        correo.para
    ) ||

    "Usuario";


    const fecha =

    texto(
        correo.fecha
    ) ||

    fechaHora(
        correo.creado
    );


    detalle.innerHTML = `

        <div class="detail-line">

            <strong>
            De:
            </strong>

            ${escapeHTML(de)}

        </div>


        <div class="detail-line">

            <strong>
            Para:
            </strong>

            ${escapeHTML(para)}

        </div>


        <div class="detail-line">

            <strong>
            Asunto:
            </strong>

            ${escapeHTML(
                correo.asunto ||
                "(Sin asunto)"
            )}

        </div>


        <div class="detail-line">

            <strong>
            Fecha:
            </strong>

            ${escapeHTML(fecha)}

            ${escapeHTML(
                correo.hora
            )}

        </div>


        <div class="detail-message">

            ${escapeHTML(
                correo.mensaje
            )}

        </div>


        ${adjuntosHTML(correo)}

    `;


    detalleCard.classList.remove(
        "hidden"
    );


    detalleCard.scrollIntoView({
        behavior:"smooth"
    });


    /*
       MARCAR COMO LEÍDO
    */

    if(
        recibido &&
        !correo.leido &&
        correo.id
    ){

        try{

            await updateDoc(

                doc(
                    db,
                    "correos",
                    correo.id
                ),

                {
                    leido:true
                }

            );


            correo.leido =
            true;


            mostrarRecibidos();

        }
        catch(error){

            console.warn(
                "No se pudo marcar leído:",
                error
            );

        }

    }

}
