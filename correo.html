/* =========================================

function texto(valor){

    if(
        valor === undefined ||
        valor === null
    ){

        return "";

    }

    return String(valor);

}


function escaparHTML(valor){

    return texto(valor)

        .replace(/&/g,"&amp;")

        .replace(/</g,"&lt;")

        .replace(/>/g,"&gt;")

        .replace(/"/g,"&quot;")

        .replace(/'/g,"&#039;");

}


function nombreCompleto(datos){

    return (

        texto(datos.nombre) +
        " " +
        texto(datos.apellido)

    ).trim();

}

/* =========================================
   BUSCAR USUARIO
========================================= */

async function buscarUsuario(){

    try{

        const referencia =
        doc(
            db,
            "usuarios",
            usuarioSesion.uid
        );

        const resultado =
        await getDoc(
            referencia
        );

        if(
            resultado.exists()
        ){

            return {

                id:
                resultado.id,

                ...resultado.data()

            };

        }

    }
    catch(error){

        console.warn(
            "No se encontró usuarios por UID:",
            error
        );

    }


    try{

        const consulta =
        query(

            collection(
                db,
                "usuarios"
            ),

            where(
                "authUid",
                "==",
                usuarioSesion.uid
            ),

            limit(1)

        );

        const resultado =
        await getDocs(
            consulta
        );

        if(
            !resultado.empty
        ){

            const documento =
            resultado.docs[0];

            return {

                id:
                documento.id,

                ...documento.data()

            };

        }

    }
    catch(error){

        console.warn(
            "No se pudo buscar usuarios por authUid:",
            error
        );

    }


    return null;

}


/* =========================================

async function buscarEmpleado(){

    try{

        const consulta =
        query(

            where(

            ),

        );

        if(

        ){

            resultado.docs[0];

            return {

                id:

                ...documento.data()

            };

        }

    }
    catch(error){

        console.warn(
            "Error buscando empleado:",
            error
        );

    }


    return null;

}


/* =========================================
   CARGAR PERFIL
========================================= */

async function cargarPerfil(){

    if(!usuarioSesion){

        throw new Error(
            "No hay una sesión activa."
        );

    }


    const empleado =
    await buscarEmpleado();


    if(empleado){

        perfilActual =
        empleado;

        perfilId =
        empleado.id;

        empresaId =
        texto(
            empleado.empresaId
        ).trim();

    }


    if(!perfilActual){

        const usuario =
        await buscarUsuario();


        if(usuario){

            perfilActual =
            usuario;

            perfilId =
            usuario.id;

            empresaId =
            texto(
                usuario.empresaId
            ).trim();

        }

    }


    if(!perfilActual){

        throw new Error(
            "No encontramos el perfil del usuario vinculado a esta cuenta."
        );

    }


    const nombre =
    nombreCompleto(
        perfilActual
    ) ||
    texto(
        perfilActual.nombre
    ) ||
    texto(
        perfilActual.nombreEmpresa
    ) ||
    "Usuario";


    const puesto =
    texto(
        perfilActual.puesto
    ) ||
    texto(
        perfilActual.rol
    ) ||
    "Usuario";


    const empresa =
    texto(
        perfilActual.nombreEmpresa
    ) ||
    texto(
        perfilActual.empresa
    ) ||
    "Empresa";


    const email =
    texto(
        perfilActual.email
    ) ||
    texto(
        usuarioSesion.email
    );


    usuarioActual.innerHTML = `

        <strong>
        ${escaparHTML(nombre)}
        </strong>

        <br>

        Puesto:
        ${escaparHTML(puesto)}

        <br>

        Empresa:
        ${escaparHTML(empresa)}

        <br>

        Correo:
        ${escaparHTML(email)}

        <br>

        Empresa ID:
        ${escaparHTML(
            empresaId ||
            "No asignado"
        )}

    `;


    if(!empresaId){

        throw new Error(
            "El usuario está creado, pero no tiene empresaId asignado."
        );

    }

}


/* =========================================
   DESTINATARIOS
========================================= */

function agregarDestinatario(datos){

    if(!datos){

        return;

    }


    const id =
    texto(
        datos.id
    );


    if(!id){

        return;

    }


    if(id === perfilId){

        return;

    }


    if(
        datos.authUid &&
        datos.authUid ===
        usuarioSesion.uid
    ){

        return;

    }


    const yaExiste =
    destinatarios.some(
        persona =>

        persona.id === id ||

        (
            persona.authUid &&
            datos.authUid &&
            persona.authUid ===
            datos.authUid
        )

    );


    if(yaExiste){

        return;

    }


    destinatarios.push({

        id:

        id,

        authUid:

        texto(
            datos.authUid
        ),

        nombre:

        nombreCompleto(
            datos
        ) ||

        texto(
            datos.nombre
        ) ||

        texto(
            datos.nombreEmpresa
        ) ||

        "Usuario",

        email:

        texto(
            datos.email
        ),

        tipo:

        texto(
            datos.tipo
        ) ||

        texto(
            datos.rol
        ) ||

        texto(
            datos.puesto
        ) ||

        "Usuario"

    });

}


async function cargarEmpleadosDestinatarios(){

    try{

        const consulta =
        query(

            collection(
                db,
                "empleados"
            ),

            where(
                "empresaId",
                "==",
                empresaId
            )

        );


        const resultados =
        await getDocs(
            consulta
        );


        resultados.forEach(
            documento => {

                const datos =
                documento.data();


                agregarDestinatario({

                    id:
                    documento.id,

                    ...datos,

                    tipo:
                    "Empleado"

                });

            }
        );

    }
    catch(error){

        console.warn(
            "No se pudieron cargar empleados:",
            error
        );

    }

}


async function cargarUsuariosDestinatarios(){

    try{

        const consulta =
        query(

            collection(
                db,
                "usuarios"
            ),

            where(
                "empresaId",
                "==",
                empresaId
            )

        );


        const resultados =
        await getDocs(
            consulta
        );


        resultados.forEach(
            documento => {

                const datos =
                documento.data();


                let tipo =
                "Usuario";


                const rol =
                texto(
                    datos.rol
                ).toLowerCase();


                if(
                    rol.includes("admin") ||
                    rol.includes("administr")
                ){

                    tipo =
                    "Administración";

                }

/* =========================================
   AUDIO
========================================= */

btnGrabarAudio.addEventListener(

    "click",

    async function(){

        limpiarMensajes();


        if(
            !navigator.mediaDevices ||
            !navigator.mediaDevices.getUserMedia
        ){

            mostrarError(
                "Tu navegador no permite grabar audio."
            );

            return;

        }


        try{

            const stream =
            await navigator.mediaDevices.getUserMedia(
                {
                    audio:true
                }
            );


            audioChunks = [];


            let opciones = {};


            if(
                MediaRecorder.isTypeSupported(
                    "audio/webm;codecs=opus"
                )
            ){

                opciones.mimeType =
                "audio/webm;codecs=opus";

            }
            else if(
                MediaRecorder.isTypeSupported(
                    "audio/webm"
                )
            ){

                opciones.mimeType =
                "audio/webm";

            }


            mediaRecorder =
            new MediaRecorder(
                stream,
                opciones
            );


            mediaRecorder.ondataavailable =
            function(event){

                if(
                    event.data &&
                    event.data.size > 0
                ){

                    audioChunks.push(
                        event.data
                    );

                }

            };


            mediaRecorder.onstop =
            function(){

                const tipo =
                mediaRecorder.mimeType ||
                "audio/webm";


                audioBlob =
                new Blob(
                    audioChunks,
                    {
                        type:tipo
                    }
                );


                audioNombre =
                "audio-" +
                Date.now() +
                ".webm";


                const url =
                URL.createObjectURL(
                    audioBlob
                );


                audioPreview.innerHTML = `

                    <audio
                        controls
                        src="${url}"
                    ></audio>

                `;


                audioEstado.textContent =
                "✅ Audio listo para enviar";


                stream
                .getTracks()
                .forEach(
                    track =>
                    track.stop()
                );


                actualizarEstadoEnviar();

            };


            mediaRecorder.start();


            btnGrabarAudio.disabled =
            true;

            btnDetenerAudio.disabled =
            false;


            audioEstado.textContent =
            "🔴 Grabando audio...";

        }
        catch(error){

            console.error(
                "ERROR AUDIO:",
                error
            );


            mostrarError(
                "No se pudo acceder al micrófono. Revisá los permisos del navegador."
            );

        }

    }

);


btnDetenerAudio.addEventListener(

    "click",

    function(){

        if(
            mediaRecorder &&
            mediaRecorder.state !==
            "inactive"
        ){

            mediaRecorder.stop();

        }


        btnGrabarAudio.disabled =
        false;

        btnDetenerAudio.disabled =
        true;

    }

);

/* =========================================
   SUBIR ARCHIVO A STORAGE
========================================= */

async function subirArchivo(
    archivo
){

    const ruta =

    "correos/" +

    empresaId +

    "/" +

    usuarioSesion.uid +

    "/" +

    Date.now() +

    "_" +

    archivo.name;


    const referencia =
    ref(
        storage,
        ruta
    );


    await uploadBytes(
        referencia,
        archivo
    );


    const url =
    await getDownloadURL(
        referencia
    );


    return {

        nombre:
        archivo.name,

        tipo:
        archivo.type ||

        "application/octet-stream",

        tamaño:
        archivo.size,

        url:
        url,

        ruta:
        ruta

    };

}


/* =========================================
   SUBIR AUDIO
========================================= */

async function subirAudio(){

    if(!audioBlob){

        return null;

    }


    const ruta =

    "correos/" +

    empresaId +

    "/" +

    usuarioSesion.uid +

    "/audios/" +

    audioNombre;


    const referencia =
    ref(
        storage,
        ruta
    );


    await uploadBytes(
        referencia,
        audioBlob,
        {
            contentType:
            audioBlob.type
        }
    );


    const url =
    await getDownloadURL(
        referencia
    );


    return {

        nombre:
        audioNombre,

        tipo:
        audioBlob.type ||

        "audio/webm",

        tamaño:
        audioBlob.size,

        url:
        url,

        ruta:
        ruta

    };

}

async function cargarRecibidos(){

    recibidos.innerHTML = `

        <div class="cargando">
        Cargando mensajes...
        </div>

    `;


    try{

        const consulta =
        query(

            collection(
                db,
                "correos"
            ),

            where(
                "destinatarioUid",
                "==",
                usuarioSesion.uid
            ),

            limit(50)

        );


        const resultados =
        await getDocs(
            consulta
        );


        correosRecibidos = [];


        resultados.forEach(
            documento => {

                correosRecibidos.push({

                    id:
                    documento.id,

                    ...documento.data()

                });

            }
        );


        if(
            correosRecibidos.length === 0
        ){

            const consultaAntigua =
            query(

                collection(
                    db,
                    "correos"
                ),

                where(
                    "para",
                    "==",
                    texto(
                        perfilActual.email
                    )
                ),

                limit(50)

            );


            const antiguos =
            await getDocs(
                consultaAntigua
            );


            antiguos.forEach(
                documento => {

                    const existe =
                    correosRecibidos.some(

                        correo =>

                        correo.id ===
                        documento.id

                    );


                    if(!existe){

                        correosRecibidos.push({

                            id:
                            documento.id,

                            ...documento.data()

                        });

                    }

                }
            );

        }


        correosRecibidos.sort(

            function(a,b){

                return (

                    texto(
                        b.fecha
                    ) +
                    texto(
                        b.hora
                    )

                ).localeCompare(

                    texto(
                        a.fecha
                    ) +
                    texto(
                        a.hora
                    )

                );

            }

        );


        mostrarRecibidos();

    }
    catch(error){

        console.error(
            "ERROR RECIBIDOS:",
            error
        );


        recibidos.innerHTML = `

            <div class="sin-registros">

            No se pudieron cargar los mensajes.

            <br><br>

            ${escaparHTML(
                error.message
            )}

            </div>

        `;

    }

}

        correo.de
    ) ||

    "Usuario";


    const destinatarioNombre =

    texto(
        correo.destinatarioNombre
    ) ||

    texto(
        correo.para
    ) ||

    "Usuario";


    detalleCorreo.innerHTML = `

        <div class="detalle-linea">

            <strong>
            De:
            </strong>

            ${escaparHTML(
                remitente
            )}

        </div>


        <div class="detalle-linea">

            <strong>
            Para:
            </strong>

            ${escaparHTML(
                destinatarioNombre
            )}

        </div>


        <div class="detalle-linea">

            <strong>
            Asunto:
            </strong>

            ${escaparHTML(
                correo.asunto
            )}

        </div>


        <div class="detalle-linea">

            <strong>
            Fecha:
            </strong>

            ${escaparHTML(
                correo.fecha ||
                fechaHora(
                    correo.creado
                )
            )}

            ${escaparHTML(
                correo.hora
            )}

        </div>


        <div class="separador"></div>


        <div class="detalle-mensaje">

            ${escaparHTML(
                correo.mensaje
            )}

        </div>


        ${generarAdjuntosHTML(
            correo
        )}

    `;


    tarjetaDetalle.classList.remove(
        "oculto"
    );


    tarjetaDetalle.scrollIntoView({

        behavior:"smooth"

    });


    if(
        esRecibido &&
        !correo.leido &&
        correo.id
    ){

        try{

            await updateDoc(

                doc(
                    db,
                    "correos",
                    correo.id
                ),

                {
                    leido:true
                }

            );


            correo.leido =
            true;


            mostrarRecibidos();

        }
        catch(error){

            console.warn(
                "No se pudo marcar como leído:",
                error
            );

        }

    }

}

   CERRAR DETALLE

    function(){

        tarjetaDetalle.classList.add(
            "oculto"
        );

    }

);

   RECIBIDOS

btnRecibidos.addEventListener(

        limpiarMensajes();

        await cargarRecibidos();

    }

);


/* =========================================
   ENVIADOS
========================================= */

btnEnviados.addEventListener(

    async function(){

        limpiarMensajes();

        await cargarEnviados();

    }

);


/* =========================================
   VOLVER
========================================= */

btnVolver.addEventListener(

        window.history.back();

    }

);


/* =========================================
   CERRAR SESIÓN
========================================= */

btnCerrarSesion.addEventListener(

    "click",

    async function(){

        if(
            !confirm(
                "¿Querés cerrar la sesión?"
            )
        ){

            return;

        }


        try{

            await signOut(
                auth
            );


            window.location.replace(
                "empleado-login.html"
            );

        }
        catch(error){

            mostrarError(

                "No se pudo cerrar la sesión: " +
                error.message

            );

        }

    }

);


/* =========================================
   INICIO
========================================= */

onAuthStateChanged(

    auth,

    async function(usuario){

        if(!usuario){

            window.location.replace(
                "empleado-login.html"
            );

            return;

        }


        usuarioSesion =
        usuario;


        try{

            limpiarMensajes();


            usuarioActual.textContent =
            "Cargando usuario...";


            await cargarPerfil();

            await cargarDestinatarios();

            await cargarRecibidos();


            console.log(
                "GESBASE CORREO INICIALIZADO"
            );

        }
        catch(error){

            console.error(
                "ERROR INICIANDO CORREO:",
                error
            );


            btnEnviar.disabled =
            true;


            mostrarError(
                error.message
            );

        }

    }

);

</script>
