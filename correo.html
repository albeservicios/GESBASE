/* =========================================

========================================= */

function texto(valor){

    if(
        valor === undefined ||
        valor === null
    ){

        return "";

    }

    return String(valor);

}


function escaparHTML(valor){

    return texto(valor)

        .replace(/&/g,"&amp;")

        .replace(/</g,"&lt;")

        .replace(/>/g,"&gt;")

        .replace(/"/g,"&quot;")

        .replace(/'/g,"&#039;");

}


function nombreCompleto(datos){

    return (

        texto(datos.nombre) +
        " " +
        texto(datos.apellido)

    ).trim();

}


function mostrarError(textoError){

    mensajeError.textContent =
    textoError;

    mensajeError.style.display =
    "block";

    mensajeExito.style.display =
    "none";

function mostrarExito(textoExito){

    mensajeExito.textContent =
    textoExito;

    mensajeExito.style.display =
    "block";

    mensajeError.style.display =

}


function limpiarMensajes(){

/* =========================================
   BUSCAR USUARIO EN "usuarios"
========================================= */

async function buscarUsuario(){

    try{

        const referencia =
        doc(
            db,
            "usuarios",
            usuarioSesion.uid
        );

        const resultado =
        await getDoc(
            referencia
        );

        if(
            resultado.exists()
        ){

            return {

                id:
                resultado.id,

                ...resultado.data()

            };

        }

    }
    catch(error){

        console.warn(
            "No se encontró usuarios por UID:",
            error
        );

    }


    try{

        const consulta =
        query(

            collection(
                db,
                "usuarios"
            ),

            where(
                "authUid",
                "==",
                usuarioSesion.uid
            ),

            limit(1)

        );

        const resultado =
        await getDocs(
            consulta
        );

        if(
            !resultado.empty
        ){

            const documento =
            resultado.docs[0];

            return {

                id:
                documento.id,

                ...documento.data()

            };

        }

    }
    catch(error){

        console.warn(
            "No se pudo buscar usuarios por authUid:",
            error
        );

    }


    return null;

}


/* =========================================
   BUSCAR EMPLEADO
========================================= */

async function buscarEmpleado(){

    try{

        const consulta =
        query(

            collection(
                db,
                "empleados"
            ),

            where(
                "authUid",
                "==",
                usuarioSesion.uid
            ),

            limit(1)

        );

        const resultado =
        await getDocs(
            consulta
        );

        if(
            !resultado.empty
        ){

            const documento =
            resultado.docs[0];

            return {

                id:
                documento.id,

                ...documento.data()

            };

        }

    }
    catch(error){

        console.warn(
            "Error buscando empleado:",
            error
        );

    }


    return null;

}


/* =========================================
   CARGAR PERFIL
========================================= */

async function cargarPerfil(){

    if(!usuarioSesion){

        throw new Error(
            "No hay una sesión activa."
        );

    }


    /*
     * PRIMERO EMPLEADOS
     */

    const empleado =
    await buscarEmpleado();


    if(empleado){

        perfilActual =
        empleado;

        perfilId =
        empleado.id;

        empresaId =
        texto(
            empleado.empresaId
        ).trim();

    }


    /*
     * SI NO HAY EMPLEADO,
     * BUSCAMOS EN USUARIOS
     */

    if(!perfilActual){

        const usuario =
        await buscarUsuario();


        if(usuario){

            perfilActual =
            usuario;

            perfilId =
            usuario.id;

            empresaId =
            texto(
                usuario.empresaId
            ).trim();

        }

    }


    /*
     * SI TODAVÍA NO HAY PERFIL
     */

    if(!perfilActual){

        throw new Error(
            "No encontramos el perfil del usuario vinculado a esta cuenta."
        );

    }


    /*
     * MOSTRAR INFORMACIÓN
     */

    const nombre =
    nombreCompleto(
        perfilActual
    ) ||
    texto(
        perfilActual.nombre
    ) ||
    texto(
        perfilActual.nombreEmpresa
    ) ||
    "Usuario";


    const puesto =
    texto(
        perfilActual.puesto
    ) ||
    texto(
        perfilActual.rol
    ) ||
    "Usuario";


    const empresa =
    texto(
        perfilActual.nombreEmpresa
    ) ||
    texto(
        perfilActual.empresa
    ) ||
    "Empresa";


    const email =
    texto(
        perfilActual.email
    ) ||
    texto(
        usuarioSesion.email
    );


    usuarioActual.innerHTML = `

        <strong>
        ${escaparHTML(nombre)}
        </strong>

        <br>

        Puesto:
        ${escaparHTML(puesto)}

        <br>

        Empresa:
        ${escaparHTML(empresa)}

        <br>

        Correo:
        ${escaparHTML(email)}

        <br>

        Empresa ID:
        ${escaparHTML(
            empresaId ||
            "No asignado"
        )}

    `;


    /*
     * SI NO TIENE EMPRESA
     */

    if(!empresaId){

        throw new Error(

            "El usuario está creado, pero no tiene empresaId asignado. Debemos vincularlo a la empresa antes de cargar los destinatarios."

        );

    }

}


/* =========================================
   AGREGAR DESTINATARIO SIN DUPLICAR
========================================= */

function agregarDestinatario(datos){

    if(!datos){

        return;

    }


    const id =
    texto(
        datos.id
    );


    if(!id){

        return;

    }


    if(
        id === perfilId
    ){

        return;

    }


    if(
        datos.authUid &&
        datos.authUid ===
        usuarioSesion.uid
    ){

        return;

    }


    const yaExiste =
    destinatarios.some(
        persona =>

        persona.id === id ||

        (
            persona.authUid &&
            datos.authUid &&
            persona.authUid ===
            datos.authUid
        )

    );


    if(yaExiste){

        return;

    }


    destinatarios.push({

        id:

        id,

        authUid:

        texto(
            datos.authUid
        ),

        nombre:

        nombreCompleto(
            datos
        ) ||

        texto(
            datos.nombre
        ) ||

        texto(
            datos.nombreEmpresa
        ) ||

        "Usuario",

        email:

        texto(
            datos.email
        ),

        tipo:

        texto(
            datos.tipo
        ) ||

        texto(
            datos.rol
        ) ||

        texto(
            datos.puesto
        ) ||

        "Usuario"

    });

}


/* =========================================
   CARGAR DESTINATARIOS DE EMPLEADOS
========================================= */

async function cargarEmpleadosDestinatarios(){

    try{

        const consulta =
        query(

            collection(
                db,
                "empleados"
            ),

            where(
                "empresaId",
                "==",
                empresaId
            )

        );


        const resultados =
        await getDocs(
            consulta
        );


        resultados.forEach(
            documento => {

                const datos =
                documento.data();


                agregarDestinatario({

                    id:
                    documento.id,

                    ...datos,

                    tipo:
                    "Empleado"

                });

            }
        );

    }
    catch(error){

        console.warn(
            "No se pudieron cargar empleados:",
            error
        );

    }

}


/* =========================================
   CARGAR DESTINATARIOS DE USUARIOS
========================================= */

async function cargarUsuariosDestinatarios(){

    try{

        const consulta =
        query(

            collection(
                db,
                "usuarios"
            ),

            where(
                "empresaId",
                "==",
                empresaId
            )

        );


        const resultados =
        await getDocs(
            consulta
        );


        resultados.forEach(
            documento => {

                const datos =
                documento.data();


                let tipo =
                "Usuario";


                const rol =
                texto(
                    datos.rol
                ).toLowerCase();


                if(
                    rol.includes(
                        "admin"
                    ) ||
                    rol.includes(
                        "administr"
                    )
                ){

                    tipo =
                    "Administración";

                }


                agregarDestinatario({

                    id:
                    documento.id,

                    ...datos,

                    tipo:
                    tipo

                });

            }
        );

    }
    catch(error){

        console.warn(
            "No se pudieron cargar usuarios:",
            error
        );

    }

}

/* =========================================
   CARGAR TODOS LOS DESTINATARIOS
========================================= */

async function cargarDestinatarios(){

    destinatarios = [];


    if(!empresaId){

        destinatario.innerHTML = `

            <option value="">
            Empresa no asignada
            </option>

        `;

        btnEnviar.disabled =
        true;

        return;

    }


    destinatario.innerHTML = `

        <option value="">
        Cargando destinatarios...
        </option>

    `;


    /*
     * EMPLEADOS
     */

    await cargarEmpleadosDestinatarios();


    /*
     * USUARIOS
     */

    await cargarUsuariosDestinatarios();


    /*
     * ADMINISTRACIÓN
     */

    await cargarAdministracion();


    /*
     * SELECT
     */

    destinatario.innerHTML = `

        <option value="">
        Seleccionar destinatario...
        </option>

    `;


    if(
        destinatarios.length === 0
    ){

        destinatario.innerHTML = `

            <option value="">
            No hay destinatarios en esta empresa
            </option>

        `;

        btnEnviar.disabled =
        true;

        return;

    }


    /*
     * ORDENAR
     */

    destinatarios.sort(
        function(a,b){

            return a.nombre.localeCompare(
                b.nombre
            );

        }
    );


    /*
     * MOSTRAR
     */

    destinatarios.forEach(
        persona => {

            const option =
            document.createElement(
                "option"
            );


            option.value =
            persona.id;


            option.textContent =

            persona.nombre +

            " — " +

            persona.tipo;


            destinatario.appendChild(
                option
            );

        }
    );


    btnEnviar.disabled =
    false;

}


/* =========================================
   OBTENER DESTINATARIO
========================================= */

function obtenerDestinatario(){

    const id =
    destinatario.value;


    return destinatarios.find(

        persona =>

        persona.id === id

    );

}

                    persona.id,

                    persona.nombre,

                    persona.email,

                    asuntoTexto,

                    mensaje:

            asunto.value =

            mensaje.value =
            "";

            destinatario.value =

            mostrarExito(

            await cargarEnviados();

        }

                "ERROR ENVIANDO CORREO:",

            );


            mostrarError(

                "No se pudo enviar el mensaje: " +

            );

        }

            btnEnviar.disabled =
            false;

            btnEnviar.textContent =
            "📤 ENVIAR MENSAJE";

        }

    }

);


/* =========================================
   CARGAR RECIBIDOS
========================================= */

async function cargarRecibidos(){

    recibidos.innerHTML = `

        <div class="cargando">
        Cargando mensajes...
        </div>

    `;


    try{

        const consulta =
        query(

            collection(
                db,
                "correos"
            ),

            where(
                "destinatarioUid",
                "==",
                usuarioSesion.uid
            ),

            limit(50)

        );


        const resultados =
        await getDocs(
            consulta
        );


        correosRecibidos = [];


        resultados.forEach(
            documento => {

                correosRecibidos.push({

                    id:
                    documento.id,

                    ...documento.data()

                });

            }
        );


        /*
         * COMPATIBILIDAD CON
         * CORREOS ANTIGUOS
         */

        if(
            correosRecibidos.length === 0
        ){

            const consultaAntigua =
            query(

                collection(
                    db,
                    "correos"
                ),

                where(
                    "para",
                    "==",
                    texto(
                        perfilActual.email
                    )
                ),

                limit(50)

            );


            const antiguos =
            await getDocs(
                consultaAntigua
            );


            antiguos.forEach(
                documento => {

                    const existe =
                    correosRecibidos.some(

                        correo =>

                        correo.id ===
                        documento.id

                    );


                    if(!existe){

                        correosRecibidos.push({

                            id:
                            documento.id,

                            ...documento.data()

                        });

                    }

                }
            );

        }


        correosRecibidos.sort(

            function(a,b){

                return (

                    texto(
                        b.fecha
                    ) +
                    texto(
                        b.hora
                    )

                ).localeCompare(

                    texto(
                        a.fecha
                    ) +
                    texto(
                        a.hora
                    )

                );

            }

        );


        mostrarRecibidos();

    }
    catch(error){

        console.error(
            "ERROR RECIBIDOS:",
            error
        );


        recibidos.innerHTML = `

            <div class="sin-registros">

            No se pudieron cargar los mensajes.

            <br><br>

            ${escaparHTML(
                error.message
            )}

            </div>

        `;

    }

}


/* =========================================
   MOSTRAR RECIBIDOS
========================================= */

function mostrarRecibidos(){

    if(
        correosRecibidos.length === 0
    ){

        recibidos.innerHTML = `

            <div class="sin-registros">

            No tenés mensajes recibidos.

            </div>

        `;

        return;

    }


    recibidos.innerHTML =
    "";


    correosRecibidos.forEach(
        correo => {

            const item =
            document.createElement(
                "div"
            );


            item.className =

            "correo-item" +

            (
                correo.leido
                ? ""
                : " no-leido"
            );


            const remitente =

            texto(
                correo.remitenteNombre
            ) ||

            texto(
                correo.de
            ) ||

            "Usuario";


            item.innerHTML = `

                <div class="correo-cabecera">

                    <div class="correo-persona">

                        De:
                        ${escaparHTML(
                            remitente
                        )}

                    </div>

                    <div class="correo-fecha">

                        ${escaparHTML(
                            correo.fecha ||
                            fechaHora(
                                correo.creado
                            )
                        )}

                        ${escaparHTML(
                            correo.hora
                        )}

                    </div>

                </div>


                <div class="correo-asunto">

                    ${escaparHTML(
                        correo.asunto
                    )}

                </div>


                <div class="correo-resumen">

                    ${escaparHTML(

                        texto(
                            correo.mensaje
                        ).substring(
                            0,
                            180
                        )

                    )}

                </div>


                <span
                    class="estado-correo ${
                        correo.leido
                        ? ""
                        : "estado-no-leido"
                    }"
                >

                    ${
                        correo.leido
                        ? "LEÍDO"
                        : "NO LEÍDO"
                    }

                </span>

            `;


            item.addEventListener(
                "click",
                function(){

                    abrirCorreo(
                        correo,
                        true
                    );

                }
            );


            recibidos.appendChild(
                item
            );

        }
    );

}

/* =========================================
   ABRIR CORREO
========================================= */

async function abrirCorreo(
    correo,
    esRecibido
){

    const remitente =

    texto(
        correo.remitenteNombre
    ) ||

    texto(
        correo.de
    ) ||

    "Usuario";


    const destinatarioNombre =

    texto(
        correo.destinatarioNombre
    ) ||

    texto(
        correo.para
    ) ||

    "Usuario";


    detalleCorreo.innerHTML = `

        <div class="detalle-linea">

            <strong>
            De:
            </strong>

            ${escaparHTML(
                remitente
            )}

        </div>


        <div class="detalle-linea">

            <strong>
            Para:
            </strong>

            ${escaparHTML(
                destinatarioNombre
            )}

        </div>


        <div class="detalle-linea">

            <strong>
            Asunto:
            </strong>

            ${escaparHTML(
                correo.asunto
            )}

        </div>


        <div class="detalle-linea">

            <strong>
            Fecha:
            </strong>

            ${escaparHTML(
                correo.fecha ||
                fechaHora(
                    correo.creado
                )
            )}

            ${escaparHTML(
                correo.hora
            )}

        </div>


        <div class="separador"></div>


        <div class="detalle-mensaje">

            ${escaparHTML(
                correo.mensaje
            )}

        </div>

    `;


    tarjetaDetalle.classList.remove(
        "oculto"
    );


    tarjetaDetalle.scrollIntoView({

        behavior:"smooth"

    });


    if(
        esRecibido &&
        !correo.leido &&
        correo.id
    ){

        try{

            await updateDoc(

                doc(
                    db,
                    "correos",
                    correo.id
                ),

                {
                    leido:true
                }

            );


            correo.leido =
            true;


            mostrarRecibidos();

        }
        catch(error){

            console.warn(
                "No se pudo marcar como leído:",
                error
            );

        }

    }

}
