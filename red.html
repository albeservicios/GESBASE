<!DOCTYPE html>
<html lang="es-AR">

<head>
<meta charset="UTF-8">

<meta
    name="viewport"
    content="width=device-width, initial-scale=1.0, viewport-fit=cover"
>

<meta name="theme-color" content="#111827">

<meta
    name="description"
    content="Red GESBASE - Red profesional para conectar personas, trabajadores, profesionales, empresas y comercios."
>

<title>Red GESBASE</title>

<style>

*{
    box-sizing:border-box;
    margin:0;
    padding:0;
}

body{
    font-family:Arial,Helvetica,sans-serif;
    background:#f3f4f6;
    color:#111827;
    padding-bottom:85px;
}

header{
    position:sticky;
    top:0;
    z-index:100;
    background:#111827;
    color:white;
    padding:16px;
    box-shadow:0 2px 8px rgba(0,0,0,.18);
}

.header-inner{
    max-width:900px;
    margin:auto;
    display:flex;
    align-items:center;
    justify-content:space-between;
}

.logo{
    font-size:21px;
    font-weight:700;
}

.logout{
    border:0;
    background:#374151;
    color:white;
    padding:9px 13px;
    border-radius:9px;
    cursor:pointer;
}

.container{
    width:100%;
    max-width:900px;
    margin:auto;
    padding:15px;
}

.welcome{
    background:white;
    border-radius:16px;
    padding:20px;
    margin-bottom:15px;
    box-shadow:0 2px 8px rgba(0,0,0,.06);
}

.welcome h1{
    font-size:24px;
    margin-bottom:6px;
}

.welcome p{
    color:#6b7280;
    font-size:14px;
}

.create-box{
    background:white;
    border-radius:16px;
    padding:15px;
    margin-bottom:15px;
    box-shadow:0 2px 8px rgba(0,0,0,.06);
}

.create-button{
    width:100%;
    border:1px solid #d1d5db;
    background:#f9fafb;
    color:#6b7280;
    padding:14px;
    border-radius:12px;
    text-align:left;
    cursor:pointer;
    font-size:15px;
}

.section-title{
    font-size:18px;
    font-weight:700;
    margin:18px 2px 10px;
}

.post{
    background:white;
    border-radius:16px;
    margin-bottom:15px;
    padding:16px;
    box-shadow:0 2px 8px rgba(0,0,0,.06);
}

.post-header{
    display:flex;
    align-items:center;
    gap:11px;
    margin-bottom:12px;
}

.avatar{
    width:44px;
    height:44px;
    border-radius:50%;
    background:#e5e7eb;
    display:flex;
    align-items:center;
    justify-content:center;
    font-size:20px;
    font-weight:bold;
    overflow:hidden;
    flex-shrink:0;
}

.avatar img{
    width:100%;
    height:100%;
    object-fit:cover;
}

.post-name{
    font-weight:700;
    font-size:15px;
}

.post-type{
    color:#6b7280;
    font-size:12px;
    margin-top:2px;
}

.post-date{
    color:#9ca3af;
    font-size:11px;
    margin-top:2px;
}

.post-text{
    font-size:15px;
    line-height:1.5;
    white-space:pre-wrap;
    word-break:break-word;
    margin-bottom:14px;
}

.post-actions{
    display:flex;
    border-top:1px solid #e5e7eb;
    padding-top:10px;
    gap:7px;
}

.post-action{
    flex:1;
    border:0;
    background:transparent;
    padding:9px 5px;
    border-radius:8px;
    cursor:pointer;
    color:#4b5563;
    font-size:13px;
}

.post-action:hover{
    background:#f3f4f6;
}

.post-action.liked{
    color:#2563eb;
    font-weight:700;
}

.empty{
    background:white;
    border-radius:16px;
    padding:30px 20px;
    text-align:center;
    color:#6b7280;
}

.loading{
    text-align:center;
    padding:30px;
    color:#6b7280;
}

.shared-title{
    background:#111827;
    color:white;
    padding:12px 15px;
    border-radius:12px;
    margin-bottom:15px;
    font-size:14px;
    font-weight:600;
}

.modal{
    display:none;
    position:fixed;
    inset:0;
    z-index:500;
    background:rgba(0,0,0,.55);
    padding:20px;
    align-items:center;
    justify-content:center;
}

.modal.active{
    display:flex;
}

.modal-box{
    width:100%;
    max-width:520px;
    background:white;
    border-radius:18px;
    padding:20px;
}

.modal-box h2{
    margin-bottom:15px;
    font-size:20px;
}

textarea{
    width:100%;
    min-height:150px;
    resize:vertical;
    border:1px solid #d1d5db;
    border-radius:12px;
    padding:13px;
    font-family:inherit;
    font-size:15px;
    outline:none;
}

textarea:focus{
    border-color:#2563eb;
}

.modal-actions{
    display:flex;
    gap:10px;
    margin-top:15px;
}

.modal-actions button{
    flex:1;
    border:0;
    padding:12px;
    border-radius:10px;
    cursor:pointer;
    font-weight:600;
}

.cancel{
    background:#e5e7eb;
    color:#111827;
}

.publish{
    background:#111827;
    color:white;
}

.bottom-nav{
    position:fixed;
    bottom:0;
    left:0;
    right:0;
    z-index:200;
    background:white;
    border-top:1px solid #e5e7eb;
    box-shadow:0 -2px 10px rgba(0,0,0,.08);
}

.bottom-nav-inner{
    max-width:900px;
    margin:auto;
    display:flex;
    justify-content:space-around;
}

.nav-button{
    flex:1;
    border:0;
    background:white;
    padding:10px 3px 9px;
    cursor:pointer;
    color:#6b7280;
    font-size:11px;
}

.nav-button span{
    display:block;
    font-size:21px;
    margin-bottom:3px;
}

.nav-button.active{
    color:#111827;
    font-weight:700;
}

.toast{
    position:fixed;
    left:50%;
    bottom:100px;
    transform:translateX(-50%);
    background:#111827;
    color:white;
    padding:12px 17px;
    border-radius:10px;
    font-size:13px;
    display:none;
    z-index:800;
    max-width:90%;
    text-align:center;
}

.toast.show{
    display:block;
}

@media(max-width:600px){

    .container{
        padding:12px;
    }

    .welcome h1{
        font-size:21px;
    }

    .post{
        padding:14px;
    }

    .post-action{
        font-size:12px;
    }

}

</style>
</head>

<body>

<header>

    <div class="header-inner">

        <div class="logo">
            Red GESBASE
        </div>

        <button
            class="logout"
            id="btnSalir"
        >
            Salir
        </button>

    </div>

</header>


<main class="container">

    <section class="welcome">

        <h1 id="saludo">
            Red GESBASE
        </h1>

        <p>
            Conectá, compartí y encontrá oportunidades.
        </p>

    </section>


    <section class="create-box">

        <button
            class="create-button"
            id="btnCrearPublicacion"
        >
            ¿Qué querés compartir?
        </button>

    </section>


    <div id="contenedorCompartida"></div>


    <div class="section-title">
        Publicaciones
    </div>


    <section id="feed">

        <div class="loading">
            Cargando publicaciones...
        </div>

    </section>

</main>


<nav class="bottom-nav">

    <div class="bottom-nav-inner">

        <button
            class="nav-button active"
            onclick="location.href='red.html'"
        >
            <span>🏠</span>
            Inicio
        </button>

        <button
            class="nav-button"
            onclick="location.href='red-buscar.html'"
        >
            <span>🔎</span>
            Buscar
        </button>

        <button
            class="nav-button"
            onclick="location.href='conexiones.html'"
        >
            <span>👥</span>
            Conexiones
        </button>

        <button
            class="nav-button"
            onclick="location.href='red-notificaciones.html'"
        >
            <span>🔔</span>
            Notificaciones
        </button>

        <button
            class="nav-button"
            onclick="location.href='red-perfil.html'"
        >
            <span>👤</span>
            Perfil
        </button>

    </div>

</nav>


<div
    class="modal"
    id="modalPublicacion"
>

    <div class="modal-box">

        <h2>
            Crear publicación
        </h2>

        <textarea
            id="textoPublicacion"
            maxlength="5000"
            placeholder="Escribí algo para compartir..."
        ></textarea>

        <div class="modal-actions">

            <button
                class="cancel"
                id="btnCancelar"
            >
                Cancelar
            </button>

            <button
                class="publish"
                id="btnPublicar"
            >
                Publicar
            </button>

        </div>

    </div>

</div>


<div
    class="toast"
    id="toast"
></div>


<script type="module">

import { auth, db } from "./Js/firebase.js";

import {
    onAuthStateChanged,
    signOut
} from "https://www.gstatic.com/firebasejs/12.18.0/firebase-auth.js";

import {
    collection,
    addDoc,
    query,
    orderBy,
    limit,
    getDocs,
    doc,
    getDoc,
    serverTimestamp
} from "https://www.gstatic.com/firebasejs/12.18.0/firebase-firestore.js";


const feed = document.getElementById("feed");
const saludo = document.getElementById("saludo");

const modal = document.getElementById("modalPublicacion");
const textoPublicacion = document.getElementById("textoPublicacion");

const btnCrearPublicacion =
    document.getElementById("btnCrearPublicacion");

const btnCancelar =
    document.getElementById("btnCancelar");

const btnPublicar =
    document.getElementById("btnPublicar");

const btnSalir =
    document.getElementById("btnSalir");

const contenedorCompartida =
    document.getElementById("contenedorCompartida");

const toast =
    document.getElementById("toast");


let usuarioActual = null;


/* =========================
   TOAST
========================= */

function mostrarToast(mensaje){

    toast.textContent = mensaje;
    toast.classList.add("show");

    setTimeout(() => {
        toast.classList.remove("show");
    }, 2500);

}


/* =========================
   FECHA
========================= */

function formatearFecha(timestamp){

    if(!timestamp){
        return "Ahora";
    }

    try{

        const fecha = timestamp.toDate();

        return fecha.toLocaleString(
            "es-AR",
            {
                day:"2-digit",
                month:"2-digit",
                year:"numeric",
                hour:"2-digit",
                minute:"2-digit"
            }
        );

    }catch(error){

        return "Ahora";

    }

}


/* =========================
   URL DE PUBLICACIÓN
========================= */

function obtenerURLPublicacion(id){

    const url =
        new URL(
            window.location.href
        );

    url.search = "";

    url.hash = "";

    url.searchParams.set(
        "publicacion",
        id
    );

    return url.toString();

}


/* =========================
   CREAR PUBLICACIÓN
========================= */

btnCrearPublicacion.addEventListener(
    "click",
    () => {

        modal.classList.add("active");

        setTimeout(() => {
            textoPublicacion.focus();
        },100);

    }
);


btnCancelar.addEventListener(
    "click",
    () => {

        cerrarModal();

    }
);


modal.addEventListener(
    "click",
    (event) => {

        if(event.target === modal){

            cerrarModal();

        }

    }
);


function cerrarModal(){

    modal.classList.remove("active");

    textoPublicacion.value = "";

}


/* =========================
   PUBLICAR
========================= */

btnPublicar.addEventListener(
    "click",
    async () => {

        if(!usuarioActual){

            mostrarToast(
                "Debés iniciar sesión."
            );

            return;

        }


        const texto =
            textoPublicacion.value.trim();


        if(!texto){

            mostrarToast(
                "Escribí algo antes de publicar."
            );

            return;

        }


        btnPublicar.disabled = true;

        btnPublicar.textContent =
            "Publicando...";


        try{

            const nombreCompleto =
                usuarioActual.displayName ||
                usuarioActual.email ||
                "Usuario GESBASE";


            /*
             * IMPORTANTE:
             * addDoc genera automáticamente
             * un ID único.
             */

            const referencia =
                await addDoc(
                    collection(
                        db,
                        "publicaciones"
                    ),
                    {

                        uid:
                            usuarioActual.uid,

                        nombreCompleto:
                            nombreCompleto,

                        tipoPerfil:
                            "Usuario GESBASE",

                        texto:
                            texto,

                        fotoPerfil:
                            usuarioActual.photoURL || "",

                        fecha:
                            serverTimestamp(),

                        likes:
                            0,

                        comentarios:
                            0

                    }
                );


            /*
             * referencia.id es el ID único
             * de esta publicación.
             */

            const urlPublicacion =
                obtenerURLPublicacion(
                    referencia.id
                );


            cerrarModal();


            mostrarToast(
                "Publicación creada."
            );


            /*
             * Si estamos en una vista
             * de publicación compartida,
             * volvemos al inicio normal.
             */

            if(
                window.location.search
            ){

                window.history.replaceState(
                    {},
                    document.title,
                    window.location.pathname
                );

            }


            await cargarPublicaciones();


        }catch(error){

            console.error(
                "Error al publicar:",
                error
            );

            mostrarToast(
                "No se pudo publicar. Revisá tu conexión."
            );

        }finally{

            btnPublicar.disabled = false;

            btnPublicar.textContent =
                "Publicar";

        }

    }
);


/* =========================
   CREAR HTML PUBLICACIÓN
========================= */

function crearPublicacion(
    data,
    id
){

    const article =
        document.createElement("article");

    article.className = "post";


    const nombre =
        data.nombreCompleto ||
        "Usuario GESBASE";


    const tipo =
        data.tipoPerfil ||
        "Usuario GESBASE";


    const foto =
        data.fotoPerfil ||
        data.fotoURL ||
        "";


    const fecha =
        formatearFecha(
            data.fecha
        );


    const avatar =
        document.createElement("div");

    avatar.className = "avatar";


    if(foto){

        const img =
            document.createElement("img");

        img.src = foto;

        img.alt = "";

        img.onerror = () => {

            img.remove();

            avatar.textContent =
                nombre.charAt(0).toUpperCase();

        };

        avatar.appendChild(img);

    }else{

        avatar.textContent =
            nombre.charAt(0).toUpperCase();

    }


    const header =
        document.createElement("div");

    header.className =
        "post-header";


    const datosUsuario =
        document.createElement("div");


    const nombreElement =
        document.createElement("div");

    nombreElement.className =
        "post-name";

    nombreElement.textContent =
        nombre;


    const tipoElement =
        document.createElement("div");

    tipoElement.className =
        "post-type";

    tipoElement.textContent =
        tipo;


    const fechaElement =
        document.createElement("div");

    fechaElement.className =
        "post-date";

    fechaElement.textContent =
        fecha;


    datosUsuario.appendChild(
        nombreElement
    );

    datosUsuario.appendChild(
        tipoElement
    );

    datosUsuario.appendChild(
        fechaElement
    );


    header.appendChild(
        avatar
    );

    header.appendChild(
        datosUsuario
    );


    const texto =
        document.createElement("div");

    texto.className =
        "post-text";

    texto.textContent =
        data.texto || "";


    const actions =
        document.createElement("div");

    actions.className =
        "post-actions";


    /* ME GUSTA */

    const likeButton =
        document.createElement("button");

    likeButton.className =
        "post-action";

    likeButton.innerHTML =
        "👍 Me gusta";


    likeButton.addEventListener(
        "click",
        () => {

            likeButton.classList.toggle(
                "liked"
            );

        }
    );


    /* COMENTAR */

    const commentButton =
        document.createElement("button");

    commentButton.className =
        "post-action";

    commentButton.innerHTML =
        "💬 Comentar";


    commentButton.addEventListener(
        "click",
        () => {

            mostrarToast(
                "Comentarios próximamente."
            );

        }
    );


    /* COMPARTIR */

    const shareButton =
        document.createElement("button");

    shareButton.className =
        "post-action";

    shareButton.innerHTML =
        "↗ Compartir";


    shareButton.addEventListener(
        "click",
        async () => {

            await compartirPublicacion(
                data,
                id
            );

        }
    );


    actions.appendChild(
        likeButton
    );

    actions.appendChild(
        commentButton
    );

    actions.appendChild(
        shareButton
    );


    article.appendChild(
        header
    );

    article.appendChild(
        texto
    );

    article.appendChild(
        actions
    );


    return article;

}


/* =========================
   COMPARTIR
========================= */

async function compartirPublicacion(
    data,
    id
){

    const url =
        obtenerURLPublicacion(
            id
        );


    const nombre =
        data.nombreCompleto ||
        "Usuario GESBASE";


    const texto =
        data.texto ||
        "";


    const mensaje =
        `${nombre} publicó en Red GESBASE:\n\n${texto}\n\nVer publicación:\n${url}`;


    try{

        /*
         * En Android/iPhone abre
         * el menú nativo de compartir.
         */

        if(
            navigator.share
        ){

            await navigator.share({

                title:
                    "Publicación - Red GESBASE",

                text:
                    `${nombre} publicó en Red GESBASE:\n\n${texto}`,

                url:
                    url

            });

            return;

        }


        /*
         * Si no existe navigator.share,
         * copiamos texto + URL.
         */

        if(
            navigator.clipboard
        ){

            await navigator.clipboard.writeText(
                mensaje
            );

            mostrarToast(
                "Texto y URL copiados."
            );

            return;

        }


        /*
         * Último recurso.
         */

        window.prompt(
            "Copiá el enlace de la publicación:",
            url
        );


    }catch(error){

        /*
         * El usuario puede cancelar
         * el menú de compartir.
         */

        if(
            error.name !== "AbortError"
        ){

            console.error(
                "Error al compartir:",
                error
            );

            mostrarToast(
                "No se pudo compartir."
            );

        }

    }

}


/* =========================
   CARGAR PUBLICACIONES
========================= */

async function cargarPublicaciones(){

    feed.innerHTML =
        `<div class="loading">
            Cargando publicaciones...
        </div>`;


    try{

        const q =
            query(
                collection(
                    db,
                    "publicaciones"
                ),
                orderBy(
                    "fecha",
                    "desc"
                ),
                limit(30)
            );


        const snapshot =
            await getDocs(q);


        feed.innerHTML = "";


        if(snapshot.empty){

            feed.innerHTML =
                `<div class="empty">
                    Todavía no hay publicaciones.<br><br>
                    ¡Sé el primero en publicar!
                </div>`;

            return;

        }


        snapshot.forEach(
            (documento) => {

                const data =
                    documento.data();

                const post =
                    crearPublicacion(
                        data,
                        documento.id
                    );

                feed.appendChild(
                    post
                );

            }
        );


    }catch(error){

        console.error(
            "Error cargando publicaciones:",
            error
        );


        feed.innerHTML =
            `<div class="empty">
                No se pudieron cargar las publicaciones.
                <br><br>
                Revisá tu conexión e intentá nuevamente.
            </div>`;

    }

}


/* =========================
   PUBLICACIÓN COMPARTIDA
========================= */

async function cargarPublicacionCompartida(
    id
){

    feed.innerHTML =
        `<div class="loading">
            Cargando publicación...
        </div>`;


    contenedorCompartida.innerHTML =
        `<div class="shared-title">
            🔗 Publicación compartida
        </div>`;


    try{

        const referencia =
            doc(
                db,
                "publicaciones",
                id
            );


        const snapshot =
            await getDoc(
                referencia
            );


        feed.innerHTML = "";


        if(
            !snapshot.exists()
        ){

            feed.innerHTML =
                `<div class="empty">
                    Esta publicación no existe
                    o fue eliminada.
                </div>`;

            return;

        }


        const data =
            snapshot.data();


        const post =
            crearPublicacion(
                data,
                snapshot.id
            );


        feed.appendChild(
            post
        );


    }catch(error){

        console.error(
            "Error cargando publicación compartida:",
            error
        );


        feed.innerHTML =
            `<div class="empty">
                No se pudo cargar esta publicación.
            </div>`;

    }

}


/* =========================
   SALIR
========================= */

btnSalir.addEventListener(
    "click",
    async () => {

        try{

            await signOut(auth);

            window.location.href =
                "red-login.html";

        }catch(error){

            console.error(
                "Error al cerrar sesión:",
                error
            );

            mostrarToast(
                "No se pudo cerrar sesión."
            );

        }

    }
);


/* =========================
   AUTENTICACIÓN
========================= */

onAuthStateChanged(
    auth,
    async (user) => {

        if(!user){

            window.location.href =
                "red-login.html";

            return;

        }


        usuarioActual =
            user;


        saludo.textContent =
            `Hola, ${
                user.displayName ||
                "Usuario"
            } 👋`;


        /*
         * Detectamos si entró mediante
         * un enlace compartido.
         */

        const parametros =
            new URLSearchParams(
                window.location.search
            );


        const publicacionId =
            parametros.get(
                "publicacion"
            );


        if(publicacionId){

            await cargarPublicacionCompartida(
                publicacionId
            );

        }else{

            await cargarPublicaciones();

        }

    }
);

</script>

</body>
</html>
