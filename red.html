<!DOCTYPE html>
<html lang="es-AR">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0, viewport-fit=cover"
    >

    <meta
        name="theme-color"
        content="#12343B"
    >

    <meta
        name="description"
        content="Red GESBASE - Red profesional para conectar personas, profesionales, trabajadores, empresas y comercios."
    >

    <title>Red GESBASE</title>


    <style>

        *{
            box-sizing:border-box;
            margin:0;
            padding:0;
        }

        html{
            scroll-behavior:smooth;
        }

        body{
            font-family:
                Arial,
                Helvetica,
                sans-serif;

            background:#eef2f3;

            color:#17252a;

            padding-bottom:90px;
        }


        /* =====================================================
           HEADER
        ===================================================== */

        .header{
            position:sticky;
            top:0;
            z-index:1000;

            background:#12343B;

            color:white;

            box-shadow:
                0 2px 10px rgba(0,0,0,.15);
        }

        .header-inner{
            width:100%;
            max-width:900px;

            margin:auto;

            padding:
                14px 16px;
        }

        .header-top{
            display:flex;

            align-items:center;

            justify-content:space-between;

            gap:12px;
        }

        .brand{
            display:flex;

            align-items:center;

            gap:10px;
        }

        .brand-logo{
            width:42px;
            height:42px;

            border-radius:12px;

            background:white;

            color:#12343B;

            display:flex;

            align-items:center;
            justify-content:center;

            font-weight:800;

            font-size:20px;
        }

        .brand-text{
            line-height:1.1;
        }

        .brand-name{
            font-size:20px;
            font-weight:800;
        }

        .brand-subtitle{
            margin-top:3px;

            font-size:11px;

            opacity:.78;
        }

        .header-notification{
            width:42px;
            height:42px;

            border:0;

            border-radius:50%;

            background:
                rgba(255,255,255,.12);

            color:white;

            font-size:20px;

            cursor:pointer;

            position:relative;
        }

        .header-notification:hover{
            background:
                rgba(255,255,255,.20);
        }


        /* =====================================================
           CONTENEDOR
        ===================================================== */

        .main{
            width:100%;
            max-width:900px;

            margin:auto;

            padding:
                14px 12px 30px;
        }


        /* =====================================================
           BIENVENIDA
        ===================================================== */

        .welcome{
            background:white;

            border-radius:18px;

            padding:18px;

            margin-bottom:12px;

            box-shadow:
                0 2px 9px rgba(0,0,0,.07);
        }

        .welcome-content{
            display:flex;

            align-items:center;

            gap:13px;
        }

        .welcome-avatar{
            width:54px;
            height:54px;

            min-width:54px;

            border-radius:50%;

            object-fit:cover;

            background:#dce6e8;

            border:
                2px solid #edf2f3;
        }

        .welcome-placeholder{
            width:54px;
            height:54px;

            min-width:54px;

            border-radius:50%;

            background:#12343B;

            color:white;

            display:flex;

            align-items:center;
            justify-content:center;

            font-size:18px;
            font-weight:800;
        }

        .welcome-title{
            font-size:18px;
            font-weight:800;
        }

        .welcome-text{
            margin-top:4px;

            font-size:13px;

            color:#64757b;
        }


        /* =====================================================
           CREAR PUBLICACIÓN
        ===================================================== */

        .crear-publicacion{
            background:white;

            border-radius:18px;

            padding:15px;

            margin-bottom:14px;

            box-shadow:
                0 2px 9px rgba(0,0,0,.07);
        }

        .crear-top{
            display:flex;

            align-items:center;

            gap:10px;
        }

        .crear-avatar{
            width:44px;
            height:44px;

            min-width:44px;

            border-radius:50%;

            object-fit:cover;

            background:#dce6e8;
        }

        .crear-input{
            flex:1;

            border:1px solid #d8e0e2;

            border-radius:24px;

            padding:12px 15px;

            background:#f5f7f8;

            color:#65777c;

            font-size:14px;

            cursor:pointer;
        }

        .crear-input:hover{
            background:#edf2f3;
        }

        .crear-acciones{
            display:flex;

            gap:8px;

            margin-top:12px;

            border-top:
                1px solid #edf0f1;

            padding-top:10px;
        }

        .crear-accion{
            flex:1;

            border:0;

            background:transparent;

            border-radius:10px;

            padding:9px 5px;

            color:#53676d;

            font-size:13px;

            font-weight:700;

            cursor:pointer;
        }

        .crear-accion:hover{
            background:#f0f4f5;
        }


        /* =====================================================
           FEED
        ===================================================== */

        .feed{
            display:flex;

            flex-direction:column;

            gap:14px;
        }


        /* =====================================================
           PUBLICACIÓN
        ===================================================== */

        .publicacion{
            background:white;

            border-radius:18px;

            overflow:hidden;

            box-shadow:
                0 2px 9px rgba(0,0,0,.07);
        }

        .publicacion-header{
            display:flex;

            align-items:center;

            gap:10px;

            padding:
                15px 15px 10px;
        }

        .autor-avatar{
            width:46px;
            height:46px;

            min-width:46px;

            border-radius:50%;

            object-fit:cover;

            background:#dce6e8;

            border:
                1px solid #e8eeee;
        }

        .autor-placeholder{
            width:46px;
            height:46px;

            min-width:46px;

            border-radius:50%;

            background:#12343B;

            color:white;

            display:flex;

            align-items:center;
            justify-content:center;

            font-size:16px;
            font-weight:800;
        }

        .autor-info{
            min-width:0;

            flex:1;
        }

        .autor-nombre{
            font-size:15px;

            font-weight:800;

            overflow:hidden;

            text-overflow:ellipsis;

            white-space:nowrap;
        }

        .autor-tipo{
            margin-top:3px;

            color:#687a80;

            font-size:11px;
        }

        .publicacion-fecha{
            margin-top:3px;

            color:#8a999d;

            font-size:10px;
        }

        .publicacion-menu{
            border:0;

            background:transparent;

            color:#68797e;

            font-size:20px;

            cursor:pointer;

            padding:5px;
        }

        .publicacion-texto{
            padding:
                4px 15px 15px;

            font-size:15px;

            line-height:1.55;

            white-space:pre-wrap;

            overflow-wrap:anywhere;
        }


        /* =====================================================
           ACCIONES PUBLICACIÓN
        ===================================================== */

        .publicacion-estadisticas{
            display:flex;

            justify-content:space-between;

            padding:
                8px 15px;

            color:#74858a;

            font-size:12px;

            border-top:
                1px solid #f0f2f3;
        }

        .publicacion-acciones{
            display:flex;

            border-top:
                1px solid #edf0f1;

            padding:
                4px 7px;
        }

        .accion{
            flex:1;

            border:0;

            background:transparent;

            color:#5e7177;

            padding:10px 4px;

            border-radius:9px;

            font-size:13px;

            font-weight:700;

            cursor:pointer;
        }

        .accion:hover{
            background:#f1f4f5;
        }

        .accion.activo{
            color:#12343B;
        }


        /* =====================================================
           ESTADO
        ===================================================== */

        .estado{
            background:white;

            border-radius:18px;

            padding:35px 20px;

            text-align:center;

            color:#697b80;

            box-shadow:
                0 2px 9px rgba(0,0,0,.06);
        }

        .estado-icono{
            font-size:40px;

            margin-bottom:10px;
        }

        .estado-titulo{
            font-size:16px;

            font-weight:800;

            color:#30474d;
        }

        .estado-texto{
            margin-top:6px;

            font-size:13px;
        }


        /* =====================================================
           MODAL
        ===================================================== */

        .modal{
            position:fixed;

            inset:0;

            z-index:3000;

            background:
                rgba(0,0,0,.58);

            display:none;

            align-items:center;

            justify-content:center;

            padding:16px;
        }

        .modal.mostrar{
            display:flex;
        }

        .modal-card{
            width:100%;

            max-width:520px;

            background:white;

            border-radius:20px;

            overflow:hidden;

            box-shadow:
                0 15px 50px rgba(0,0,0,.25);
        }

        .modal-header{
            display:flex;

            align-items:center;

            justify-content:space-between;

            padding:16px;

            border-bottom:
                1px solid #edf0f1;
        }

        .modal-title{
            font-size:18px;

            font-weight:800;
        }

        .modal-close{
            width:36px;
            height:36px;

            border:0;

            border-radius:50%;

            background:#eef2f3;

            color:#455c62;

            font-size:20px;

            cursor:pointer;
        }

        .modal-body{
            padding:16px;
        }

        .modal-textarea{
            width:100%;

            min-height:170px;

            resize:vertical;

            border:
                1px solid #d7e0e2;

            border-radius:14px;

            padding:14px;

            font-family:inherit;

            font-size:15px;

            line-height:1.5;

            outline:none;
        }

        .modal-textarea:focus{
            border-color:#12343B;

            box-shadow:
                0 0 0 3px
                rgba(18,52,59,.08);
        }

        .modal-footer{
            display:flex;

            gap:10px;

            padding:0 16px 16px;
        }

        .modal-btn{
            flex:1;

            border:0;

            border-radius:12px;

            padding:12px;

            font-size:14px;

            font-weight:800;

            cursor:pointer;
        }

        .modal-cancelar{
            background:#edf2f3;

            color:#345057;
        }

        .modal-publicar{
            background:#12343B;

            color:white;
        }

        .modal-publicar:disabled{
            opacity:.6;

            cursor:not-allowed;
        }


        /* =====================================================
           MENÚ INFERIOR TIPO RED SOCIAL
        ===================================================== */

        .red-nav{
            position:fixed;

            left:0;
            right:0;
            bottom:0;

            z-index:2000;

            height:72px;

            background:white;

            border-top:
                1px solid #dce4e6;

            box-shadow:
                0 -3px 15px
                rgba(0,0,0,.09);

            padding-bottom:
                env(safe-area-inset-bottom);
        }

        .red-nav-inner{
            width:100%;

            max-width:900px;

            height:100%;

            margin:auto;

            display:flex;

            align-items:stretch;
        }

        .red-nav-item{
            position:relative;

            flex:1;

            border:0;

            background:white;

            color:#718288;

            display:flex;

            flex-direction:column;

            align-items:center;

            justify-content:center;

            gap:2px;

            font-size:10px;

            font-weight:700;

            cursor:pointer;
        }

        .red-nav-item:hover{
            color:#12343B;
        }

        .red-nav-item.activo{
            color:#12343B;
        }

        .red-nav-icon{
            font-size:22px;

            line-height:25px;
        }

        .red-nav-item.activo::before{
            content:"";

            position:absolute;

            top:0;

            left:30%;

            right:30%;

            height:3px;

            background:#12343B;

            border-radius:
                0 0 5px 5px;
        }

        .nav-badge{
            position:absolute;

            top:5px;

            left:calc(50% + 7px);

            min-width:18px;

            height:18px;

            padding:0 5px;

            border-radius:20px;

            display:flex;

            align-items:center;

            justify-content:center;

            background:#d62828;

            color:white;

            font-size:9px;

            font-weight:800;

            border:2px solid white;
        }


        /* =====================================================
           TOAST
        ===================================================== */

        .toast{
            position:fixed;

            left:50%;

            bottom:88px;

            z-index:5000;

            transform:
                translateX(-50%)
                translateY(20px);

            background:#12343B;

            color:white;

            padding:
                12px 17px;

            border-radius:12px;

            font-size:13px;

            text-align:center;

            max-width:90%;

            opacity:0;

            pointer-events:none;

            transition:
                opacity .25s ease,
                transform .25s ease;
        }

        .toast.mostrar{
            opacity:1;

            transform:
                translateX(-50%)
                translateY(0);
        }


        /* =====================================================
           TABLET
        ===================================================== */

        @media(min-width:700px){

            .main{
                padding:
                    20px 18px 40px;
            }

            .header-inner{
                padding:
                    15px 18px;
            }

            .brand-name{
                font-size:21px;
            }

            .publicacion-texto{
                font-size:16px;
            }

            .red-nav{
                height:74px;
            }

            .red-nav-item{
                font-size:11px;
            }

            .red-nav-icon{
                font-size:23px;
            }

        }


        /* =====================================================
           COMPUTADORA
        ===================================================== */

        @media(min-width:1000px){

            body{
                padding-bottom:35px;
            }

            .main{
                max-width:850px;

                padding-top:25px;
            }

            .red-nav{
                left:50%;

                right:auto;

                bottom:18px;

                width:min(760px,92%);

                height:66px;

                transform:
                    translateX(-50%);

                border:
                    1px solid #dce4e6;

                border-radius:18px;

                overflow:hidden;
            }

            .toast{
                bottom:100px;
            }

        }


        /* =====================================================
           CELULARES PEQUEÑOS
        ===================================================== */

        @media(max-width:380px){

            .main{
                padding-left:8px;
                padding-right:8px;
            }

            .brand-subtitle{
                display:none;
            }

            .brand-logo{
                width:38px;
                height:38px;
            }

            .brand-name{
                font-size:18px;
            }

            .header-notification{
                width:38px;
                height:38px;
            }

            .red-nav-item{
                font-size:9px;
            }

            .red-nav-icon{
                font-size:20px;
            }

        }

    </style>

</head>


<body>

<!-- =====================================================
     FIREBASE
===================================================== -->

<script type="module">


import {
    auth,
    db
} from "./Js/firebase.js";


import {
    onAuthStateChanged
} from "https://www.gstatic.com/firebasejs/12.18.0/firebase-auth.js";


import {
    collection,
    query,
    orderBy,
    limit,
    onSnapshot,
    addDoc,
    getDoc,
    doc,
    serverTimestamp,
    where,
    getDocs,
    updateDoc
} from "https://www.gstatic.com/firebasejs/12.18.0/firebase-firestore.js";


/* =====================================================
   VARIABLES
===================================================== */

let usuarioActual = null;

let perfilActual = null;

const perfilesCache =
    new Map();

let publicacionesEscuchadas = false;


/* =====================================================
   ELEMENTOS
===================================================== */

const feed =
    document.getElementById("feed");

const estado =
    document.getElementById("estado");

const welcomeTitle =
    document.getElementById("welcomeTitle");

const welcomeAvatar =
    document.getElementById("welcomeAvatar");

const crearAvatar =
    document.getElementById("crearAvatar");

const modal =
    document.getElementById("modalPublicacion");

const textoPublicacion =
    document.getElementById("textoPublicacion");

const abrirModal =
    document.getElementById("abrirModal");

const btnPublicar =
    document.getElementById("btnPublicar");

const cerrarModal =
    document.getElementById("cerrarModal");

const cancelarPublicacion =
    document.getElementById("cancelarPublicacion");

const confirmarPublicacion =
    document.getElementById("confirmarPublicacion");

const toast =
    document.getElementById("toast");

const navBadge =
    document.getElementById("navBadge");


/* =====================================================
   AUTENTICACIÓN
===================================================== */

onAuthStateChanged(
    auth,
    async usuario => {

        if(!usuario){

            location.href =
                "red-login.html";

            return;

        }


        usuarioActual =
            usuario;


        await cargarUsuario();

        cargarPublicaciones();

        cargarContadorNotificaciones();

        abrirPublicacionCompartida();

    }
);


/* =====================================================
   CARGAR PERFIL
===================================================== */

async function cargarUsuario(){

    try{

        const referencia =
            doc(
                db,
                "usuariosRed",
                usuarioActual.uid
            );

        const snapshot =
            await getDoc(referencia);


        if(snapshot.exists()){

            perfilActual =
                snapshot.data();

            perfilesCache.set(
                usuarioActual.uid,
                perfilActual
            );

        }
        else{

            /*
             * Si todavía no existe el perfil
             * de Red, intentamos utilizar
             * los datos básicos disponibles
             * del usuario autenticado.
             */

            perfilActual = {

                uid:
                    usuarioActual.uid,

                nombreCompleto:
                    usuarioActual.displayName ||
                    usuarioActual.email ||
                    "Usuario GESBASE",

                tipoPerfil:
                    "persona",

                fotoPerfil:
                    usuarioActual.photoURL ||
                    ""

            };

        }


        const nombre =
            obtenerNombrePerfil(
                perfilActual
            );


        welcomeTitle.textContent =
            "¡Hola, " + nombre + "!";


        colocarAvatar(
            welcomeAvatar,
            perfilActual.fotoPerfil ||
            usuarioActual.photoURL ||
            "",
            nombre
        );


        colocarAvatar(
            crearAvatar,
            perfilActual.fotoPerfil ||
            usuarioActual.photoURL ||
            "",
            nombre,
            true
        );


    }catch(error){

        console.error(
            "Error cargando perfil:",
            error
        );


        welcomeTitle.textContent =
            "¡Hola!";


        colocarAvatar(
            welcomeAvatar,
            "",
            "Usuario"
        );


        colocarAvatar(
            crearAvatar,
            "",
            "Usuario",
            true
        );

    }

}


/* =====================================================
   OBTENER PERFIL
===================================================== */

async function obtenerPerfil(uid){

    if(!uid){

        return null;

    }


    if(
        perfilesCache.has(uid)
    ){

        return perfilesCache.get(uid);

    }


    try{

        const referencia =
            doc(
                db,
                "usuariosRed",
                uid
            );


        const snapshot =
            await getDoc(referencia);


        if(snapshot.exists()){

            const perfil =
                snapshot.data();


            perfilesCache.set(
                uid,
                perfil
            );


            return perfil;

        }


    }catch(error){

        console.warn(
            "No se pudo cargar perfil:",
            uid,
            error
        );

    }


    return null;

}


/* =====================================================
   OBTENER NOMBRE
===================================================== */

function obtenerNombrePerfil(perfil){

    if(!perfil){

        return "Usuario GESBASE";

    }


    return (
        perfil.nombreCompleto ||
        perfil.nombre ||
        perfil.nombreEmpresa ||
        perfil.razonSocial ||
        "Usuario GESBASE"
    );

}


/* =====================================================
   CARGAR PUBLICACIONES
===================================================== */

function cargarPublicaciones(){

    if(publicacionesEscuchadas){

        return;

    }


    publicacionesEscuchadas =
        true;


    try{

        const consulta =
            query(
                collection(
                    db,
                    "publicaciones"
                ),
                orderBy(
                    "fecha",
                    "desc"
                ),
                limit(30)
            );


        onSnapshot(
            consulta,
            async snapshot => {

                feed.innerHTML = "";


                if(snapshot.empty){

                    estado.style.display =
                        "block";

                    return;

                }


                estado.style.display =
                    "none";


                const publicaciones = [];


                snapshot.forEach(
                    documento => {

                        publicaciones.push({

                            id:
                                documento.id,

                            ...documento.data()

                        });

                    }
                );


                for(
                    const publicacion
                    of publicaciones
                ){

                    const tarjeta =
                        await renderizarPublicacion(
                            publicacion
                        );


                    if(tarjeta){

                        feed.appendChild(
                            tarjeta
                        );

                    }

                }

            },

            error => {

                console.error(
                    "Error en publicaciones:",
                    error
                );


                estado.style.display =
                    "block";


                estado.innerHTML = `

                    <div class="estado-icono">
                        ⚠️
                    </div>

                    <div class="estado-titulo">
                        No se pudieron cargar las publicaciones
                    </div>

                    <div class="estado-texto">
                        Revisá la conexión e intentá nuevamente.
                    </div>

                `;

            }

        );


    }catch(error){

        console.error(
            "Error iniciando feed:",
            error
        );

    }

}


/* =====================================================
   RENDERIZAR PUBLICACIÓN
===================================================== */

async function renderizarPublicacion(
    publicacion
){

    const autorUid =
        publicacion.uid ||
        publicacion.autorUid ||
        "";


    const perfilAutor =
        await obtenerPerfil(
            autorUid
        );


    const nombre =
        obtenerNombrePerfil(
            perfilAutor
        ) ||
        publicacion.nombreCompleto ||
        "Usuario GESBASE";


    const foto =
        perfilAutor?.fotoPerfil ||
        perfilAutor?.fotoURL ||
        publicacion.fotoPerfil ||
        publicacion.fotoURL ||
        "";


    const tipo =
        perfilAutor?.tipoPerfil ||
        perfilAutor?.tipo ||
        publicacion.tipoPerfil ||
        "Usuario";


    const tarjeta =
        document.createElement("article");


    tarjeta.className =
        "publicacion";


    tarjeta.dataset.id =
        publicacion.id;


    /* =================================================
       HEADER
    ================================================= */

    const header =
        document.createElement("div");

    header.className =
        "publicacion-header";


    colocarAvatar(
        header,
        foto,
        nombre,
        false,
        true
    );


    /*
     * colocarAvatar no debe modificar
     * el header completo.
     *
     * Quitamos el último elemento y
     * creamos el avatar correctamente.
     */

    const avatarExistente =
        header.querySelector(
            ".autor-avatar, .autor-placeholder"
        );


    if(avatarExistente){

        avatarExistente.remove();

    }


    const avatar =
        crearAvatarElemento(
            foto,
            nombre
        );


    header.appendChild(
        avatar
    );


    const autorInfo =
        document.createElement("div");

    autorInfo.className =
        "autor-info";


    const autorNombre =
        document.createElement("div");

    autorNombre.className =
        "autor-nombre";

    autorNombre.textContent =
        nombre;


    const autorTipo =
        document.createElement("div");

    autorTipo.className =
        "autor-tipo";

    autorTipo.textContent =
        textoTipo(tipo);


    const fecha =
        document.createElement("div");

    fecha.className =
        "publicacion-fecha";

    fecha.textContent =
        formatearFecha(
            publicacion.fecha
        );


    autorInfo.appendChild(
        autorNombre
    );

    autorInfo.appendChild(
        autorTipo
    );

    autorInfo.appendChild(
        fecha
    );


    header.appendChild(
        autorInfo
    );


    const menu =
        document.createElement("button");

    menu.className =
        "publicacion-menu";

    menu.type =
        "button";

    menu.textContent =
        "⋯";

    menu.setAttribute(
        "aria-label",
        "Opciones"
    );


    header.appendChild(
        menu
    );


    tarjeta.appendChild(
        header
    );


    /* =================================================
       TEXTO
    ================================================= */

    if(publicacion.texto){

        const texto =
            document.createElement("div");

        texto.className =
            "publicacion-texto";

        texto.textContent =
            publicacion.texto;

        tarjeta.appendChild(
            texto
        );

    }


    /* =================================================
       ESTADÍSTICAS
    ================================================= */

    const estadisticas =
        document.createElement("div");

    estadisticas.className =
        "publicacion-estadisticas";


    const likes =
        document.createElement("span");

    likes.textContent =
        "👍 " +
        Number(
            publicacion.likes || 0
        );


    const comentarios =
        document.createElement("span");

    comentarios.textContent =
        Number(
            publicacion.comentarios || 0
        ) +
        " comentarios";


    estadisticas.appendChild(
        likes
    );

    estadisticas.appendChild(
        comentarios
    );


    tarjeta.appendChild(
        estadisticas
    );


    /* =================================================
       ACCIONES
    ================================================= */

    const acciones =
        document.createElement("div");

    acciones.className =
        "publicacion-acciones";


    const like =
        document.createElement("button");

    like.className =
        "accion";

    like.type =
        "button";

    like.textContent =
        "👍 Me gusta";


    like.addEventListener(
        "click",
        () => {

            like.classList.toggle(
                "activo"
            );

        }
    );


    const comentar =
        document.createElement("button");

    comentar.className =
        "accion";

    comentar.type =
        "button";

    comentar.textContent =
        "💬 Comentar";


    comentar.addEventListener(
        "click",
        () => {

            mostrarToast(
                "Los comentarios estarán disponibles próximamente."
            );

        }
    );


    const compartir =
        document.createElement("button");

    compartir.className =
        "accion";

    compartir.type =
        "button";

    compartir.textContent =
        "↗ Compartir";


    compartir.addEventListener(
        "click",
        () => {

            compartirPublicacion(
                publicacion
            );

        }
    );


    acciones.appendChild(
        like
    );

    acciones.appendChild(
        comentar
    );

    acciones.appendChild(
        compartir
    );


    tarjeta.appendChild(
        acciones
    );


    return tarjeta;

}


/* =====================================================
   CREAR AVATAR ELEMENTO
===================================================== */

function crearAvatarElemento(
    foto,
    nombre
){

    if(foto){

        const img =
            document.createElement("img");

        img.className =
            "autor-avatar";

        img.src =
            foto;

        img.alt =
            nombre;

        img.loading =
            "lazy";


        img.onerror = () => {

            const placeholder =
                document.createElement("div");

            placeholder.className =
                "autor-placeholder";

            placeholder.textContent =
                obtenerIniciales(
                    nombre
                );

            img.replaceWith(
                placeholder
            );

        };


        return img;

    }


    const placeholder =
        document.createElement("div");

    placeholder.className =
        "autor-placeholder";

    placeholder.textContent =
        obtenerIniciales(
            nombre
        );


    return placeholder;

}


/* =====================================================
   COLOCAR AVATAR
===================================================== */

function colocarAvatar(
    contenedor,
    foto,
    nombre,
    simple = false,
    temporal = false
){

    contenedor.innerHTML = "";


    if(foto){

        const img =
            document.createElement("img");


        img.src =
            foto;


        img.alt =
            nombre;


        img.loading =
            "lazy";


        if(
            contenedor === welcomeAvatar
        ){

            img.className =
                "welcome-avatar";

        }
        else if(
            contenedor === crearAvatar
        ){

            img.className =
                "crear-avatar";

        }
        else{

            img.className =
                "autor-avatar";

        }


        img.onerror = () => {

            contenedor.innerHTML = "";

            colocarPlaceholder(
                contenedor,
                nombre
            );

        };


        contenedor.appendChild(
            img
        );


        return;

    }


    colocarPlaceholder(
        contenedor,
        nombre
    );

}


function colocarPlaceholder(
    contenedor,
    nombre
){

    const div =
        document.createElement("div");


    if(
        contenedor === welcomeAvatar
    ){

        div.className =
            "welcome-placeholder";

    }
    else if(
        contenedor === crearAvatar
    ){

        div.className =
            "welcome-placeholder";

        div.style.width =
            "44px";

        div.style.height =
            "44px";

        div.style.minWidth =
            "44px";

        div.style.fontSize =
            "14px";

    }
    else{

        div.className =
            "autor-placeholder";

    }


    div.textContent =
        obtenerIniciales(
            nombre
        );


    contenedor.appendChild(
        div
    );

}


/* =====================================================
   INICIALES
===================================================== */

function obtenerIniciales(
    nombre
){

    if(!nombre){

        return "G";

    }


    const partes =
        String(nombre)
            .trim()
            .split(/\s+/)
            .filter(Boolean);


    if(
        partes.length === 1
    ){

        return partes[0]
            .substring(0,2)
            .toUpperCase();

    }


    return (
        partes[0][0] +
        partes[
            partes.length - 1
        ][0]
    ).toUpperCase();

}


/* =====================================================
   TIPO
===================================================== */

function textoTipo(tipo){

    if(!tipo){

        return "Usuario";

    }


    const valor =
        String(tipo)
            .toLowerCase();


    if(
        valor.includes("profes")
    ){

        return "Profesional";

    }


    if(
        valor.includes("trabaj") ||
        valor.includes("emple")
    ){

        return "Trabajador";

    }


    if(
        valor.includes("empresa")
    ){

        return "Empresa";

    }


    if(
        valor.includes("comerc") ||
        valor.includes("negocio")
    ){

        return "Comercio";

    }


    return "Usuario";

}


/* =====================================================
   FECHA
===================================================== */

function formatearFecha(
    timestamp
){

    if(!timestamp){

        return "Ahora";

    }


    try{

        const fecha =
            timestamp.toDate
                ? timestamp.toDate()
                : new Date(timestamp);


        if(
            Number.isNaN(
                fecha.getTime()
            )
        ){

            return "Ahora";

        }


        return fecha.toLocaleString(
            "es-AR",
            {
                day:"2-digit",
                month:"2-digit",
                year:"numeric",
                hour:"2-digit",
                minute:"2-digit"
            }
        );

    }catch(error){

        return "Ahora";

    }

}


/* =====================================================
   MODAL
===================================================== */

function abrirModalPublicacion(){

    modal.classList.add(
        "mostrar"
    );


    setTimeout(
        () => {

            textoPublicacion.focus();

        },
        100
    );

}


function cerrarModalPublicacion(){

    modal.classList.remove(
        "mostrar"
    );

    textoPublicacion.value = "";

}


abrirModal.addEventListener(
    "click",
    abrirModalPublicacion
);


btnPublicar.addEventListener(
    "click",
    abrirModalPublicacion
);


cerrarModal.addEventListener(
    "click",
    cerrarModalPublicacion
);


cancelarPublicacion.addEventListener(
    "click",
    cerrarModalPublicacion
);


modal.addEventListener(
    "click",
    event => {

        if(
            event.target === modal
        ){

            cerrarModalPublicacion();

        }

    }
);


/* =====================================================
   PUBLICAR
===================================================== */

confirmarPublicacion.addEventListener(
    "click",
    async () => {

        const texto =
            textoPublicacion.value
                .trim();


        if(!texto){

            mostrarToast(
                "Escribí algo antes de publicar."
            );

            textoPublicacion.focus();

            return;

        }


        if(!usuarioActual){

            mostrarToast(
                "Tu sesión no está disponible."
            );

            return;

        }


        confirmarPublicacion.disabled =
            true;

        confirmarPublicacion.textContent =
            "Publicando...";


        try{

            const perfil =
                await obtenerPerfil(
                    usuarioActual.uid
                );


            const nombre =
                obtenerNombrePerfil(
                    perfil
                );


            await addDoc(
                collection(
                    db,
                    "publicaciones"
                ),
                {

                    uid:
                        usuarioActual.uid,

                    nombreCompleto:
                        nombre,

                    tipoPerfil:
                        perfil?.tipoPerfil ||
                        perfil?.tipo ||
                        "persona",

                    texto:
                        texto,

                    fotoPerfil:
                        perfil?.fotoPerfil ||
                        perfil?.fotoURL ||
                        usuarioActual.photoURL ||
                        "",

                    fecha:
                        serverTimestamp(),

                    likes:
                        0,

                    comentarios:
                        0

                }
            );


            cerrarModalPublicacion();


            mostrarToast(
                "Publicación realizada."
            );


        }catch(error){

            console.error(
                "Error publicando:",
                error
            );


            mostrarToast(
                "No se pudo publicar."
            );


        }finally{

            confirmarPublicacion.disabled =
                false;

            confirmarPublicacion.textContent =
                "Publicar";

        }

    }
);


/* =====================================================
   COMPARTIR
===================================================== */

async function compartirPublicacion(
    publicacion
){

    const url =
        new URL(
            window.location.href
        );


    url.search = "";

    url.searchParams.set(
        "publicacion",
        publicacion.id
    );


    const nombre =
        publicacion.nombreCompleto ||
        "Usuario GESBASE";


    const texto =
        publicacion.texto ||
        "Mirá esta publicación en Red GESBASE.";


    try{

        if(
            navigator.share
        ){

            await navigator.share({

                title:
                    "Red GESBASE",

                text:
                    `${nombre}: ${texto}`,

                url:
                    url.toString()

            });

            return;

        }


        if(
            navigator.clipboard
        ){

            await navigator.clipboard.writeText(
                url.toString()
            );


            mostrarToast(
                "Enlace copiado."
            );


            return;

        }


        window.prompt(
            "Copiá este enlace:",
            url.toString()
        );


    }catch(error){

        if(
            error?.name !==
            "AbortError"
        ){

            console.warn(
                "Error compartiendo:",
                error
            );

        }

    }

}


/* =====================================================
   ABRIR PUBLICACIÓN COMPARTIDA
===================================================== */

async function abrirPublicacionCompartida(){

    const parametros =
        new URLSearchParams(
            window.location.search
        );


    const id =
        parametros.get(
            "publicacion"
        );


    if(!id){

        return;

    }


    try{

        const referencia =
            doc(
                db,
                "publicaciones",
                id
            );


        const snapshot =
            await getDoc(
                referencia
            );


        if(!snapshot.exists()){

            mostrarToast(
                "La publicación ya no está disponible."
            );

            return;

        }


        const publicacion = {

            id:
                snapshot.id,

            ...snapshot.data()

        };


        const tarjeta =
            await renderizarPublicacion(
                publicacion
            );


        if(!tarjeta){

            return;

        }


        tarjeta.style.outline =
            "3px solid #12343B";


        feed.prepend(
            tarjeta
        );


        setTimeout(
            () => {

                tarjeta.scrollIntoView({
                    behavior:"smooth",
                    block:"center"
                });

            },
            300
        );


    }catch(error){

        console.error(
            "Error abriendo publicación:",
            error
        );

    }

}


/* =====================================================
   CONTADOR NOTIFICACIONES
===================================================== */

function cargarContadorNotificaciones(){

    try{

        const consulta =
            query(
                collection(
                    db,
                    "notificaciones"
                ),
                where(
                    "receptorUid",
                    "==",
                    usuarioActual.uid
                )
            );


        onSnapshot(
            consulta,
            snapshot => {

                let cantidad = 0;


                snapshot.forEach(
                    documento => {

                        const datos =
                            documento.data();


                        if(
                            datos.leida !== true
                        ){

                            cantidad++;

                        }

                    }
                );


                if(cantidad > 0){

                    navBadge.style.display =
                        "flex";


                    navBadge.textContent =
                        cantidad > 99
                            ? "99+"
                            : cantidad;

                }
                else{

                    navBadge.style.display =
                        "none";

                }

            },

            error => {

                console.warn(
                    "No se pudo cargar contador:",
                    error
                );

            }
        );


    }catch(error){

        console.warn(
            "Error contador:",
            error
        );

    }

}


/* =====================================================
   TOAST
===================================================== */

let toastTimer = null;


function mostrarToast(
    mensaje
){

    toast.textContent =
        mensaje;


    toast.classList.add(
        "mostrar"
    );


    clearTimeout(
        toastTimer
    );


    toastTimer =
        setTimeout(
            () => {

                toast.classList.remove(
                    "mostrar"
                );

            },
            2800
        );

}


/* =====================================================
   CERRAR MODAL CON ESC
===================================================== */

document.addEventListener(
    "keydown",
    event => {

        if(
            event.key === "Escape" &&
            modal.classList.contains(
                "mostrar"
            )
        ){

            cerrarModalPublicacion();

        }

    }
);
