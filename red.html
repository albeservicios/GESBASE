<style>

*{
    box-sizing:border-box;
    margin:0;
    padding:0;
}

html,
body{
    width:100%;
    min-height:100%;
}

body{
    font-family:Arial,Helvetica,sans-serif;
    background:#f0f2f5;
    color:#1c1e21;
    padding-bottom:80px;
}

button,
input,
textarea,
select{
    font:inherit;
}

button{
    cursor:pointer;
}


/* =========================================================
   BARRA SUPERIOR
========================================================= */

.topbar{
    position:sticky;
    top:0;
    z-index:1000;

    background:#12343B;
    color:#fff;

    box-shadow:
        0 2px 8px rgba(0,0,0,.18);

    padding:
        calc(8px + env(safe-area-inset-top))
        12px
        8px;
}

.topbar-inner{
    width:100%;
    max-width:1100px;
    margin:auto;

    display:flex;
    align-items:center;
    justify-content:space-between;

    gap:10px;
}

.logo-area{
    min-width:0;
}

.logo{
    font-size:21px;
    font-weight:900;
    letter-spacing:.2px;
}

.logo-sub{
    font-size:11px;
    opacity:.82;
    margin-top:2px;
}

.top-actions{
    display:flex;
    align-items:center;
    gap:6px;
}

.icon-btn{
    position:relative;

    width:42px;
    height:42px;

    border:0;
    border-radius:50%;

    background:rgba(255,255,255,.12);
    color:#fff;

    display:flex;
    align-items:center;
    justify-content:center;

    font-size:20px;
}

.icon-btn:active{
    transform:scale(.96);
}

.notification-count{
    position:absolute;

    top:-2px;
    right:-2px;

    min-width:19px;
    height:19px;

    padding:0 5px;

    border-radius:999px;

    background:#e11d48;
    color:#fff;

    display:none;
    align-items:center;
    justify-content:center;

    font-size:10px;
    font-weight:900;

    border:2px solid #12343B;
}


/* =========================================================
   CONTENEDOR
========================================================= */

.page{
    width:100%;
    max-width:1100px;

    margin:auto;

    padding:
        14px
        10px
        25px;
}


/* =========================================================
   PERFIL RESUMIDO
========================================================= */

.profile-mini{
    background:#fff;

    border-radius:14px;

    padding:13px;

    margin-bottom:12px;

    box-shadow:
        0 1px 3px rgba(0,0,0,.10);

    display:flex;
    align-items:center;

    gap:11px;
}

.profile-avatar{
    width:46px;
    height:46px;

    flex:0 0 46px;

    border-radius:50%;

    background:#12343B;
    color:#fff;

    display:flex;
    align-items:center;
    justify-content:center;

    font-size:18px;
    font-weight:900;

    overflow:hidden;
}

.profile-avatar img{
    width:100%;
    height:100%;
    object-fit:cover;
}

.profile-info{
    min-width:0;
    flex:1;
}

.profile-name{
    font-size:15px;
    font-weight:800;

    white-space:nowrap;
    overflow:hidden;
    text-overflow:ellipsis;
}

.profile-type{
    color:#65676b;
    font-size:12px;
    margin-top:2px;
}

.profile-link{
    border:0;
    background:none;

    color:#12343B;

    font-size:12px;
    font-weight:800;
}


/* =========================================================
   CREAR PUBLICACIÓN
========================================================= */

.create-post{
    background:#fff;

    border-radius:14px;

    padding:13px;

    margin-bottom:12px;

    box-shadow:
        0 1px 3px rgba(0,0,0,.10);
}

.create-row{
    display:flex;
    align-items:center;
    gap:9px;
}

.create-input{
    flex:1;

    border:0;
    outline:0;

    background:#f0f2f5;

    border-radius:22px;

    padding:11px 15px;

    color:#65676b;

    cursor:pointer;

    text-align:left;
}

.create-options{
    display:grid;

    grid-template-columns:
        repeat(3,1fr);

    gap:5px;

    margin-top:10px;

    padding-top:10px;

    border-top:1px solid #e4e6eb;
}

.create-option{
    border:0;
    background:#fff;

    padding:9px 4px;

    border-radius:8px;

    font-size:12px;
    font-weight:700;

    color:#475569;
}

.create-option:hover{
    background:#f0f2f5;
}


/* =========================================================
   MODAL
========================================================= */

.modal-overlay{
    position:fixed;

    inset:0;

    z-index:3000;

    background:rgba(0,0,0,.58);

    display:none;

    align-items:center;
    justify-content:center;

    padding:15px;
}

.modal-overlay.open{
    display:flex;
}

.modal{
    width:100%;
    max-width:550px;

    max-height:
        calc(100vh - 30px);

    overflow:auto;

    background:#fff;

    border-radius:16px;

    box-shadow:
        0 15px 40px rgba(0,0,0,.25);
}

.modal-header{
    display:flex;

    align-items:center;
    justify-content:space-between;

    padding:15px;

    border-bottom:1px solid #e4e6eb;
}

.modal-title{
    font-size:18px;
    font-weight:900;
}

.close-btn{
    width:34px;
    height:34px;

    border:0;
    border-radius:50%;

    background:#f0f2f5;

    font-size:19px;
}

.modal-body{
    padding:15px;
}

.post-textarea{
    width:100%;

    min-height:150px;

    resize:vertical;

    border:1px solid #d8dce1;
    border-radius:10px;

    padding:12px;

    outline:none;

    line-height:1.5;
}

.post-textarea:focus{
    border-color:#12343B;

    box-shadow:
        0 0 0 3px rgba(18,52,59,.10);
}

.modal-footer{
    display:flex;
    justify-content:flex-end;

    gap:8px;

    padding:12px 15px;

    border-top:1px solid #e4e6eb;
}

.btn{
    border:0;

    border-radius:9px;

    padding:10px 15px;

    font-size:13px;
    font-weight:800;
}

.btn-primary{
    background:#12343B;
    color:#fff;
}

.btn-secondary{
    background:#e4e6eb;
    color:#1c1e21;
}


/* =========================================================
   FEED
========================================================= */

.feed-title{
    font-size:18px;
    font-weight:900;

    margin:
        16px
        3px
        9px;
}

.feed{
    display:grid;
    gap:12px;
}


/* =========================================================
   PUBLICACIÓN
========================================================= */

.post{
    background:#fff;

    border-radius:14px;

    box-shadow:
        0 1px 3px rgba(0,0,0,.10);

    overflow:hidden;
}

.post-header{
    display:flex;

    align-items:center;

    padding:
        13px
        13px
        7px;

    gap:10px;
}

.post-avatar{
    width:42px;
    height:42px;

    flex:0 0 42px;

    border-radius:50%;

    background:#12343B;
    color:#fff;

    display:flex;
    align-items:center;
    justify-content:center;

    font-weight:900;

    overflow:hidden;
}

.post-avatar img{
    width:100%;
    height:100%;
    object-fit:cover;
}

.post-author{
    min-width:0;
    flex:1;
}

.post-name{
    font-size:14px;
    font-weight:800;

    white-space:nowrap;
    overflow:hidden;
    text-overflow:ellipsis;
}

.post-meta{
    font-size:11px;
    color:#65676b;

    margin-top:2px;
}

.post-menu{
    position:relative;
}

.menu-button{
    width:35px;
    height:35px;

    border:0;
    border-radius:50%;

    background:#fff;

    font-size:20px;

    color:#65676b;
}

.menu-button:hover{
    background:#f0f2f5;
}

.menu{
    position:absolute;

    top:38px;
    right:0;

    z-index:20;

    width:170px;

    background:#fff;

    border-radius:10px;

    box-shadow:
        0 5px 20px rgba(0,0,0,.18);

    padding:5px;

    display:none;
}

.menu.open{
    display:block;
}

.menu-item{
    width:100%;

    border:0;
    background:#fff;

    text-align:left;

    padding:10px;

    border-radius:7px;

    font-size:13px;
}

.menu-item:hover{
    background:#f0f2f5;
}

.menu-item.danger{
    color:#b91c1c;
}


/* =========================================================
   CONTENIDO
========================================================= */

.post-content{
    padding:
        5px
        14px
        12px;
}

.post-text{
    white-space:pre-wrap;

    word-break:break-word;

    line-height:1.5;

    font-size:15px;
}


/* =========================================================
   ESTADÍSTICAS
========================================================= */

.post-stats{
    display:flex;

    align-items:center;
    justify-content:space-between;

    padding:
        8px
        13px;

    color:#65676b;

    font-size:12px;

    border-top:1px solid #f0f2f5;
}

.post-actions{
    display:grid;

    grid-template-columns:
        repeat(3,1fr);

    border-top:1px solid #e4e6eb;
}

.post-action{
    border:0;
    background:#fff;

    padding:10px 5px;

    color:#65676b;

    font-size:13px;
    font-weight:700;
}

.post-action:hover{
    background:#f0f2f5;
}

.post-action.liked{
    color:#e11d48;
}


/* =========================================================
   COMENTARIOS
========================================================= */

.comments{
    display:none;

    padding:
        8px
        13px
        13px;

    background:#fafafa;

    border-top:1px solid #e4e6eb;
}

.comments.open{
    display:block;
}

.comment-list{
    display:grid;
    gap:8px;

    margin-bottom:9px;
}

.comment{
    display:flex;
    gap:7px;
}

.comment-avatar{
    width:30px;
    height:30px;

    flex:0 0 30px;

    border-radius:50%;

    background:#12343B;
    color:#fff;

    display:flex;
    align-items:center;
    justify-content:center;

    font-size:11px;
    font-weight:800;
}

.comment-body{
    background:#f0f2f5;

    border-radius:11px;

    padding:7px 9px;

    min-width:0;
}

.comment-name{
    font-size:11px;
    font-weight:800;
}

.comment-text{
    margin-top:2px;

    font-size:12px;

    line-height:1.4;

    white-space:pre-wrap;
    word-break:break-word;
}

.comment-form{
    display:flex;
    gap:7px;
}

.comment-input{
    flex:1;

    border:1px solid #d8dce1;

    border-radius:20px;

    padding:9px 12px;

    outline:none;

    background:#fff;

    font-size:12px;
}

.comment-send{
    width:38px;

    border:0;

    border-radius:50%;

    background:#12343B;
    color:#fff;

    font-size:15px;
}


/* =========================================================
   ESTADOS
========================================================= */

.state{
    background:#fff;

    border-radius:14px;

    padding:30px 20px;

    text-align:center;

    box-shadow:
        0 1px 3px rgba(0,0,0,.10);
}

.state-icon{
    font-size:35px;
    margin-bottom:8px;
}

.state-title{
    font-size:16px;
    font-weight:900;
    margin-bottom:5px;
}

.state-text{
    color:#65676b;
    font-size:13px;
    line-height:1.5;
}


/* =========================================================
   TOAST
========================================================= */

.toast{
    position:fixed;

    left:50%;
    bottom:88px;

    transform:
        translateX(-50%)
        translateY(20px);

    z-index:5000;

    background:#12343B;
    color:#fff;

    padding:
        11px
        16px;

    border-radius:10px;

    font-size:13px;
    font-weight:700;

    box-shadow:
        0 5px 20px rgba(0,0,0,.22);

    opacity:0;

    pointer-events:none;

    transition:
        opacity .2s ease,
        transform .2s ease;

    max-width:
        calc(100vw - 30px);

    text-align:center;
}

.toast.show{
    opacity:1;

    transform:
        translateX(-50%)
        translateY(0);
}


/* =========================================================
   NAVEGACIÓN INFERIOR
========================================================= */

.bottom-nav{
    position:fixed;

    left:0;
    right:0;
    bottom:0;

    z-index:2000;

    background:#fff;

    border-top:1px solid #ddd;

    box-shadow:
        0 -2px 10px rgba(0,0,0,.08);

    padding:
        5px
        5px
        calc(5px + env(safe-area-inset-bottom));
}

.bottom-nav-inner{
    width:100%;
    max-width:700px;

    margin:auto;

    display:grid;

    grid-template-columns:
        repeat(5,1fr);
}

.nav-item{
    position:relative;

    text-decoration:none;

    color:#65676b;

    text-align:center;

    border-radius:9px;

    padding:5px 2px;

    font-size:10px;
    font-weight:700;
}

.nav-icon{
    display:block;

    font-size:20px;

    line-height:23px;
}

.nav-item.active{
    color:#12343B;
    background:#eef3f4;
}


/* =========================================================
   DESKTOP
========================================================= */

@media(min-width:800px){

    .page{
        padding:
            20px
            15px
            35px;
    }

    .feed{
        max-width:700px;
        margin:0 auto;
    }

    .feed-title{
        max-width:700px;
        margin-left:auto;
        margin-right:auto;
    }

    .create-post,
    .profile-mini{
        max-width:700px;
        margin-left:auto;
        margin-right:auto;
    }

}


/* =========================================================
   CELULAR
========================================================= */

@media(max-width:560px){

    .logo{
        font-size:19px;
    }

    .logo-sub{
        font-size:10px;
    }

    .icon-btn{
        width:39px;
        height:39px;
    }

    .post-action{
        font-size:12px;
    }

}


/* =========================================================
   MUY PEQUEÑO
========================================================= */

@media(max-width:370px){

    .top-actions{
        gap:3px;
    }

    .icon-btn{
        width:36px;
        height:36px;
        font-size:17px;
    }

    .nav-item{
        font-size:9px;
    }

    .nav-icon{
        font-size:18px;
    }

}

</style>

</head>

<header class="topbar">

    <div class="topbar-inner">

        <div class="logo-area">

            <div class="logo">
                GESBASE
            </div>

            <div class="logo-sub">
                Red profesional
            </div>

        </div>


        <div class="top-actions">

            <button
                type="button"
                class="icon-btn"
                id="btnMensajes"
                title="Mensajes"
                aria-label="Mensajes"
            >
                💬
            </button>


            <button
                type="button"
                class="icon-btn"
                id="btnNotificaciones"
                title="Notificaciones"
                aria-label="Notificaciones"
            >

                🔔

                <span
                    id="notificationCount"
                    class="notification-count"
                >
                    0
                </span>

            </button>

        </div>

    </div>

</header>



<main class="page">


<section
    class="profile-mini"
    id="profileMini"
>

    <div
        class="profile-avatar"
        id="profileAvatar"
    >
        G
    </div>

    <div class="profile-info">

        <div
            class="profile-name"
            id="profileName"
        >
            Cargando...
        </div>

        <div
            class="profile-type"
            id="profileType"
        >
            Red GESBASE
        </div>

    </div>

    <button
        type="button"
        class="profile-link"
        id="btnPerfil"
    >
        Ver perfil
    </button>

</section>



<section class="create-post">

    <div class="create-row">

        <div
            class="profile-avatar"
            id="createAvatar"
        >
            G
        </div>


        <button
            type="button"
            class="create-input"
            id="btnCrearPublicacion"
        >
            ¿Qué querés publicar?
        </button>

    </div>


    <div class="create-options">

        <button
            type="button"
            class="create-option"
            id="btnPublicarTexto"
        >
            📝 Publicación
        </button>


        <button
            type="button"
            class="create-option"
            id="btnPublicarEmpleo"
        >
            💼 Empleo
        </button>


        <button
            type="button"
            class="create-option"

async function cargarPerfil(){

    try{

        const referencia =
            doc(
                db,
                "usuariosRed",
                usuarioActual.uid
            );

            await getDoc(
                referencia

        }

            obtenerNombre();

        colocarAvatar(

function obtenerNombre(){

    if(
        perfilActual &&
        perfilActual.nombreCompleto
    ){

        return perfilActual.nombreCompleto;
    }


    if(
        perfilActual &&
        perfilActual.nombre
    ){

        const nombre =
            perfilActual.nombre ||
            "";

        const apellido =
            perfilActual.apellido ||
            "";


        const completo =
            (
                nombre +
                " " +
                apellido
            ).trim();


        if(completo){

            return completo;

        }

    }


    if(
        usuarioActual &&
        usuarioActual.displayName
    ){

        return usuarioActual.displayName;
    }


    if(
        usuarioActual &&
        usuarioActual.email
    ){

        return usuarioActual.email
            .split("@")[0];
    }


    return "Usuario GESBASE";
}



function colocarAvatar(
    elemento,
    foto,
    nombre
){

    elemento.innerHTML = "";


    if(foto){

        const img =
            document.createElement("img");


        img.src =
            foto;


        img.alt =
            nombre;


        img.onerror =
            () => {

                elemento.textContent =
                    obtenerInicial(nombre);

            };


        elemento.appendChild(
            img
        );

    }else{

        elemento.textContent =
            obtenerInicial(nombre);

    }

}



function obtenerInicial(
    nombre
){

    const texto =
        String(
            nombre ||
            "G"
        ).trim();


    return texto
        ? texto.charAt(0).toUpperCase()
        : "G";
}



function cargarPublicaciones(){

    if(
        unsubscribeFeed
    ){

        unsubscribeFeed();

    }


    unsubscribeFeed =
        onSnapshot(

            collection(
                db,
                "publicaciones"
            ),

            snapshot => {

                publicaciones =
                    snapshot.docs
                        .map(
                            documento => {

                                return {
                                    id:
                                        documento.id,

                                    ...documento.data()
                                };

                            }
                        );


                publicaciones.sort(
                    (a,b) =>
                        obtenerFecha(b)
                        -
                        obtenerFecha(a)
                );


                renderizarFeed();

            },

            error => {

                console.error(
                    "Error cargando publicaciones:",
                    error
                );


                mostrarEstadoError();

            }

        );

}



function obtenerFecha(
    objeto
){

    if(
        typeof objeto.fechaCliente ===
        "number"
    ){

        return objeto.fechaCliente;
    }


    if(
        objeto.fecha &&
        typeof objeto.fecha.toMillis ===
        "function"
    ){

        return objeto.fecha.toMillis();
    }


    if(
        objeto.fecha &&
        typeof objeto.fecha.seconds ===
        "number"
    ){

        return objeto.fecha.seconds * 1000;
    }


    return 0;
}

async function gestionarLike(
    publicacion
){

    try{

        const referencia =
            doc(
                db,
                "publicaciones",
                publicacion.id
            );


        const actual =
            await getDoc(
                referencia
            );


        if(
            !actual.exists()
        ){

            return;
        }


        const datos =
            actual.data();


        let usuarios =
            Array.isArray(
                datos.usuariosLike
            )
                ? [
                    ...datos.usuariosLike
                ]
                : [];


        const existe =
            usuarios.includes(
                usuarioActual.uid
            );


        if(
            existe
        ){

            usuarios =
                usuarios.filter(
                    uid =>
                        uid !==
                        usuarioActual.uid
                );

        }else{

            usuarios.push(
                usuarioActual.uid
            );

        }


        await updateDoc(
            referencia,
            {

                usuariosLike:
                    usuarios,

                meGusta:
                    usuarios.length

            }
        );


    }catch(error){

        console.error(
            "Error en Me gusta:",
            error
        );


        mostrarToast(
            "No se pudo actualizar Me gusta."
        );

    }

}



function obtenerCantidadLikes(
    publicacion
){

    if(
        Array.isArray(
            publicacion.usuariosLike
        )
    ){

        return publicacion.usuariosLike.length;
    }


    return Number(
        publicacion.meGusta ||
        0
    );

}



function cargarComentarios(
    publicacionId,
    contenedor
){

    const lista =
        contenedor.querySelector(
            ".comment-list"
        );


    lista.innerHTML = "";


    onSnapshot(

        collection(
            db,
            "publicaciones",
            publicacionId,
            "comentarios"
        ),

        snapshot => {

            lista.innerHTML = "";


            const comentarios =
                snapshot.docs
                    .map(
                        documento => {

                            return {
                                id:
                                    documento.id,

                                ...documento.data()
                            };

                        }
                    );


            comentarios.sort(
                (a,b) =>
                    obtenerFecha(b)
                    -
                    obtenerFecha(a)
            );


            comentarios.forEach(
                comentario => {

                    const elemento =
                        document.createElement("div");


                    elemento.className =
                        "comment";


                    const avatar =
                        document.createElement("div");


                    avatar.className =
                        "comment-avatar";


                    avatar.textContent =
                        obtenerInicial(
                            comentario.nombreAutor ||
                            "U"
                        );


                    const body =
                        document.createElement("div");


                    body.className =
                        "comment-body";


                    const nombre =
                        document.createElement("div");


                    nombre.className =
                        "comment-name";


                    nombre.textContent =
                        comentario.nombreAutor ||
                        "Usuario GESBASE";


                    const texto =
                        document.createElement("div");


                    texto.className =
                        "comment-text";


                    texto.textContent =
                        comentario.texto ||
                        "";


                    body.appendChild(
                        nombre
                    );


                    body.appendChild(
                        texto
                    );


                    elemento.appendChild(
                        avatar
                    );


                    elemento.appendChild(
                        body
                    );


                    lista.appendChild(
                        elemento
                    );

                }
            );


            if(
                comentarios.length ===
                0
            ){

                const vacio =
                    document.createElement("div");


                vacio.style.color =
                    "#65676b";


                vacio.style.fontSize =
                    "12px";


                vacio.textContent =
                    "Todavía no hay comentarios.";


                lista.appendChild(
                    vacio
                );

            }

        },

        error => {

            console.error(
                "Error comentarios:",
                error
            );

        }

    );

}



async function compartirPublicacion(
    publicacion
){

    const url =
        window.location.origin +
        window.location.pathname +
        "?publicacion=" +
        encodeURIComponent(
            publicacion.id
        );


    try{

        if(
            navigator.share
        ){

            await navigator.share({

                title:
                    "Publicación de Red GESBASE",

                text:
                    publicacion.texto ||
                    "Mirá esta publicación en Red GESBASE.",

                url:
                    url

            });

        }else{

            await navigator.clipboard.writeText(
                url
            );


            mostrarToast(
                "Enlace copiado."
            );

        }

    }catch(error){

        console.log(
            "Compartir cancelado:",
            error
        );

    }

}



async function publicar(){

    if(
        !usuarioActual
    ){

        return;
    }


    const texto =
        postText.value.trim();


    if(
        !texto
    ){

        mostrarToast(
            "Escribí algo antes de publicar."
        );


        return;
    }


    const boton =
        document.getElementById(
            "publishPost"
        );


    boton.disabled =
        true;


    boton.textContent =
        "Publicando...";


    try{

        await addDoc(
            collection(
                db,
                "publicaciones"
            ),
            {

                uid:
                    usuarioActual.uid,

                nombreAutor:
                    obtenerNombre(),

                fotoAutor:
                    perfilActual.fotoPerfil ||
                    perfilActual.fotoURL ||
                    "",

                texto:
                    texto,

                meGusta:
                    0,

                usuariosLike:
                    [],

                comentarios:
                    0,

                fecha:
                    serverTimestamp(),

                fechaCliente:
                    Date.now(),

                editada:
                    false

            }
        );


        cerrarModal();


        postText.value =
            "";


        mostrarToast(
            "Publicación publicada."
        );


    }catch(error){

        console.error(
            "Error publicando:",
            error
        );


        mostrarToast(
            "No se pudo publicar. Intentá nuevamente."
        );

    }finally{

        boton.disabled =
            false;


        boton.textContent =
            "Publicar";

    }

}



function cargarNotificaciones(){

    if(
        unsubscribeNotifications
    ){

        unsubscribeNotifications();

    }


    const consulta =
        query(
            collection(
                db,
                "notificaciones"
            ),
            where(
                "receptorUid",
                "==",
                usuarioActual.uid
            )
        );


    unsubscribeNotifications =
        onSnapshot(
            consulta,

            snapshot => {

                let sinLeer =
                    0;


                snapshot.forEach(
                    documento => {

                        const datos =
                            documento.data();


                        if(
                            datos.leida !==
                            true
                        ){

                            sinLeer++;

                        }

                    }
                );


                if(
                    sinLeer > 0
                ){

                    notificationCount.style.display =
                        "flex";


                    notificationCount.textContent =
                        sinLeer > 99
                            ? "99+"
                            : String(
                                sinLeer
                            );

                }else{

                    notificationCount.style.display =
                        "none";

                }

            },

            error => {

                console.error(
                    "Error notificaciones:",
                    error
                );

            }
        );

}



function formatearFecha(
    publicacion
){

    const timestamp =
        obtenerFecha(
            publicacion
        );


    if(
        !timestamp
    ){

        return "Ahora";
    }


    const fecha =
        new Date(
            timestamp
        );


    const diferencia =
        Date.now() -
        timestamp;


    const minuto =
        60 * 1000;


    const hora =
        60 * minuto;


    const dia =
        24 * hora;


    if(
        diferencia < minuto
    ){

        return "Ahora";
    }


    if(
        diferencia < hora
    ){

        return (
            Math.floor(
                diferencia /
                minuto
            ) +
            " min"
        );

    }


    if(
        diferencia < dia
    ){

        return (
            Math.floor(
                diferencia /
                hora
            ) +
            " h"
        );

    }


    return fecha.toLocaleDateString(
        "es-AR",
        {
            day:
                "2-digit",

            month:
                "2-digit",

            year:
                "numeric"
        }
    );

}

){

function revisarPublicacionURL(){

    const parametros =
        new URLSearchParams(
            window.location.search
        );


    const id =
        parametros.get(
            "publicacion"
        );


    if(
        !id
    ){

        return;
    }


    const elementos =
        document.querySelectorAll(
            ".post"
        );


    elementos.forEach(
        elemento => {

            if(
                elemento.dataset.id ===
                id
            ){

                elemento.scrollIntoView({
                    behavior:
                        "smooth",
                    block:
                        "center"
                });


                elemento.style.boxShadow =
                    "0 0 0 3px rgba(18,52,59,.35)";


                setTimeout(
                    () => {

                        elemento.style.boxShadow =
                            "";

                    },
                    3000
                );

            }

        }
    );

}
