<!DOCTYPE html>
<html lang="es-AR">

<head>

<meta charset="UTF-8">

<meta
    name="viewport"
    content="width=device-width, initial-scale=1.0, viewport-fit=cover"
>

<link rel="manifest" href="./manifest.json">

<meta name="theme-color" content="#12343B">

<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">

<meta
    name="description"
    content="Red Laboral GESBASE - personas, trabajadores, profesionales, empresas y comercios."
>

<meta
    name="keywords"
    content="GESBASE, Red Laboral, empleo, trabajadores, profesionales, empresas, comercios"
>

<link
    rel="canonical"
    href="https://albeservicios.github.io/GESBASE/red.html"
>

<meta
    property="og:title"
    content="GESBASE | Red Laboral"
>

<meta
    property="og:description"
    content="Conectá personas, trabajadores, profesionales, empresas y comercios."
>

<meta
    property="og:type"
    content="website"
>

<meta
    property="og:url"
    content="https://albeservicios.github.io/GESBASE/red.html"
>

<meta
    property="og:image"
    content="https://albeservicios.github.io/GESBASE-WEB/logo.png"
>

<title>Red Laboral - GESBASE</title>

<style>

*{
    box-sizing:border-box;
    margin:0;
    padding:0;
}

html{
    scroll-behavior:smooth;
}

body{
    font-family:
        -apple-system,
        BlinkMacSystemFont,
        "Segoe UI",
        Roboto,
        Arial,
        sans-serif;

    background:#f3f5f5;
    color:#172126;

    padding-bottom:
        calc(76px + env(safe-area-inset-bottom));
}

/* =====================================================
   HEADER
===================================================== */

.header{

    position:sticky;
    top:0;
    z-index:1000;

    background:#12343B;
    color:white;

    min-height:64px;

    display:flex;
    align-items:center;
    justify-content:space-between;

    padding:9px 12px;

    box-shadow:0 2px 12px rgba(0,0,0,.18);
}

.brand{

    display:flex;
    align-items:center;
    gap:10px;

    min-width:0;
}

.brand-logo{

    width:42px;
    height:42px;

    border-radius:12px;

    background:#1B4D50;

    display:flex;
    align-items:center;
    justify-content:center;

    font-size:19px;
    font-weight:900;

    color:white;

    border:1px solid rgba(255,255,255,.15);

    flex-shrink:0;
}

.brand-text{
    min-width:0;
}

.brand-title{

    font-size:20px;
    font-weight:900;
    letter-spacing:.2px;
}

.brand-subtitle{

    font-size:12px;
    color:#dce8e7;

    margin-top:1px;
}

.header-actions{

    display:flex;
    align-items:center;
    gap:5px;
}

.icon-btn{

    width:39px;
    height:39px;

    border:none;
    border-radius:12px;

    background:#1B4D50;
    color:white;

    display:flex;
    align-items:center;
    justify-content:center;

    cursor:pointer;

    position:relative;

    font-size:18px;
}

.icon-btn:hover{
    background:#286B65;
}

.badge{

    position:absolute;

    top:-4px;
    right:-4px;

    min-width:18px;
    height:18px;

    padding:0 5px;

    border-radius:20px;

    background:#E97824;
    color:white;

    font-size:10px;
    font-weight:800;

    display:flex;
    align-items:center;
    justify-content:center;
}

/* =====================================================
   PAGE
===================================================== */

.page{

    width:min(100%,760px);

    margin:0 auto;

    padding:12px;
}

/* =====================================================
   PERFIL MINI
===================================================== */

.profile-mini{

    background:white;

    border-radius:18px;

    padding:13px;

    display:flex;
    align-items:center;
    gap:11px;

    box-shadow:0 2px 10px rgba(0,0,0,.07);

    margin-bottom:13px;

    cursor:pointer;

    transition:.15s;
}

.profile-mini:hover{
    transform:translateY(-1px);
}

.avatar{

    width:48px;
    height:48px;

    border-radius:50%;

    object-fit:cover;

    background:#286B65;
    color:white;

    display:flex;
    align-items:center;
    justify-content:center;

    font-weight:900;
    font-size:17px;

    flex-shrink:0;

    overflow:hidden;
}

.avatar img{

    width:100%;
    height:100%;

    object-fit:cover;

    display:block;
}

.profile-info{

    flex:1;
    min-width:0;
}

.profile-name{

    font-weight:900;
    font-size:15px;

    overflow:hidden;
    text-overflow:ellipsis;
    white-space:nowrap;
}

.profile-type{

    color:#66757a;
    font-size:12px;

    margin-top:2px;

    overflow:hidden;
    text-overflow:ellipsis;
    white-space:nowrap;
}

.profile-link{

    border:none;

    background:#edf2f2;

    color:#12343B;

    font-weight:900;

    cursor:pointer;

    padding:8px 10px;

    border-radius:11px;

    white-space:nowrap;
}

/* =====================================================
   CREAR PUBLICACIÓN
===================================================== */

.create-post{

    background:white;

    border-radius:18px;

    padding:13px;

    box-shadow:0 2px 10px rgba(0,0,0,.07);

    margin-bottom:13px;
}

.create-top{

    display:flex;
    gap:10px;
    align-items:center;
}

.create-input{

    flex:1;

    border:none;

    background:#f0f3f3;

    border-radius:25px;

    padding:12px 15px;

    color:#68767a;

    cursor:pointer;

    font-size:14px;

    text-align:left;
}

.create-input:hover{
    background:#e9eeee;
}

.create-options{

    display:flex;

    gap:6px;

    margin-top:11px;

    border-top:1px solid #edf0f0;

    padding-top:9px;
}

.create-option{

    flex:1;

    border:none;

    background:white;

    border-radius:12px;

    padding:9px 4px;

    font-size:12px;

    font-weight:900;

    color:#46565a;

    cursor:pointer;
}

.create-option:hover{
    background:#f1f4f4;
}

.create-option.empleo{
    color:#286B65;
}

.create-option.buscar{
    color:#E97824;
}

/* =====================================================
   FEED HEADER
===================================================== */

.feed-header{

    display:flex;
    align-items:center;
    justify-content:space-between;

    margin:7px 3px 9px;
}

.feed-title{

    font-size:18px;
    font-weight:900;
}

.feed-subtitle{

    color:#6a777b;
    font-size:12px;

    margin-top:2px;
}

/* =====================================================
   NUEVAS
===================================================== */

.new-posts{

    display:none;

    width:100%;

    border:none;

    background:#E97824;
    color:white;

    padding:10px 14px;

    border-radius:14px;

    font-weight:900;

    cursor:pointer;

    margin-bottom:10px;
}

.new-posts.show{
    display:block;
}

/* =====================================================
   POST
===================================================== */

.post-card{

    background:white;

    border-radius:18px;

    margin-bottom:13px;

    box-shadow:0 2px 10px rgba(0,0,0,.07);

    overflow:hidden;
}

.post-header{

    display:flex;
    align-items:center;

    padding:13px 13px 8px;

    gap:10px;
}

.post-avatar-button{

    border:none;
    background:none;

    padding:0;

    cursor:pointer;

    border-radius:50%;

    flex-shrink:0;
}

.post-avatar-button:hover .avatar{

    box-shadow:
        0 0 0 3px rgba(233,120,36,.22);
}

.post-author{

    flex:1;

    min-width:0;

    cursor:pointer;

    border-radius:10px;

    padding:3px 5px;
}

.post-author:hover{

    background:#f1f4f4;
}

.post-author-name{

    font-size:14px;
    font-weight:900;

    overflow:hidden;
    text-overflow:ellipsis;
    white-space:nowrap;
}

.post-author-type{

    color:#738084;
    font-size:11px;

    margin-top:2px;
}

.post-date{

    color:#8a9699;
    font-size:10px;

    margin-top:2px;
}

.post-menu-btn{

    width:35px;
    height:35px;

    border:none;

    border-radius:50%;

    background:transparent;

    color:#667377;

    font-size:20px;

    cursor:pointer;

    flex-shrink:0;
}

.post-menu-btn:hover{
    background:#eef1f1;
}

.post-content{

    padding:7px 15px 14px;

    font-size:14px;

    line-height:1.55;

    white-space:pre-wrap;

    word-break:break-word;
}

.post-edited{

    color:#8a9699;
    font-size:10px;

    margin-left:4px;
}

.post-stats{

    display:flex;
    align-items:center;
    justify-content:space-between;

    padding:7px 14px;

    border-top:1px solid #edf0f0;

    color:#718084;

    font-size:11px;
}

.post-actions{

    display:flex;

    border-top:1px solid #edf0f0;
}

.post-action{

    flex:1;

    border:none;

    background:white;

    padding:11px 4px;

    color:#566469;

    font-weight:800;

    font-size:12px;

    cursor:pointer;
}

.post-action:hover{
    background:#f2f5f5;
}

.post-action.liked{
    color:#E97824;
}

/* =====================================================
   COMMENTS
===================================================== */

.comments{

    display:none;

    border-top:1px solid #edf0f0;

    padding:10px 14px;
}

.comments.show{
    display:block;
}

.comment{

    display:flex;
    gap:8px;

    margin-bottom:9px;
}

.comment-avatar{

    width:30px;
    height:30px;

    border-radius:50%;

    background:#286B65;
    color:white;

    display:flex;
    align-items:center;
    justify-content:center;

    font-size:11px;
    font-weight:900;

    flex-shrink:0;

    overflow:hidden;
}

.comment-avatar img{

    width:100%;
    height:100%;

    object-fit:cover;
}

.comment-body{

    background:#f1f3f3;

    border-radius:12px;

    padding:7px 10px;

    flex:1;

    font-size:12px;
}

.comment-name{

    font-weight:900;

    margin-bottom:2px;
}

.comment-form{

    display:flex;
    gap:7px;

    margin-top:8px;
}

.comment-input{

    flex:1;

    border:1px solid #dfe5e5;

    border-radius:20px;

    padding:9px 12px;

    outline:none;
}

.comment-send{

    border:none;

    width:38px;
    height:38px;

    border-radius:50%;

    background:#12343B;
    color:white;

    cursor:pointer;
}

/* =====================================================
   EMPTY
===================================================== */

.loading,
.empty{

    background:white;

    border-radius:18px;

    padding:30px 18px;

    text-align:center;

    color:#718084;

    box-shadow:0 2px 10px rgba(0,0,0,.06);
}

.empty-icon{

    font-size:34px;

    margin-bottom:10px;
}

.empty-title{

    font-weight:900;

    color:#344247;

    margin-bottom:5px;
}

.empty-text{

    font-size:13px;

    line-height:1.5;
}

/* =====================================================
   MODAL
===================================================== */

.modal{

    position:fixed;

    inset:0;

    background:rgba(10,25,28,.62);

    display:none;

    align-items:flex-end;

    justify-content:center;

    z-index:3000;

    padding:10px;
}

.modal.show{
    display:flex;
}

.modal-box{

    width:min(100%,580px);

    background:white;

    border-radius:22px 22px 16px 16px;

    padding:18px;

    max-height:90vh;

    overflow:auto;
}

.modal-header{

    display:flex;

    align-items:center;
    justify-content:space-between;

    margin-bottom:14px;
}

.modal-title{

    font-size:18px;
    font-weight:900;
}

.close-btn{

    border:none;

    background:#eef1f1;

    width:35px;
    height:35px;

    border-radius:50%;

    cursor:pointer;

    font-size:18px;
}

.form-label{

    display:block;

    font-size:12px;
    font-weight:900;

    margin-bottom:6px;

    color:#4c5c60;
}

textarea{

    width:100%;

    min-height:130px;

    resize:vertical;

    border:1px solid #dce3e3;

    border-radius:14px;

    padding:12px;

    outline:none;

    font-family:inherit;

    font-size:14px;
}

textarea:focus{
    border-color:#286B65;
}

.form-actions{

    display:flex;

    gap:8px;

    margin-top:12px;
}

.btn{

    border:none;

    border-radius:13px;

    padding:11px 15px;

    font-weight:900;

    cursor:pointer;
}

.btn-primary{

    background:#12343B;
    color:white;

    flex:1;
}

.btn-primary:hover{
    background:#1B4D50;
}

.btn-secondary{

    background:#edf1f1;
    color:#435256;
}

/* =====================================================
   MENU POST
===================================================== */

.menu-list{

    display:flex;
    flex-direction:column;
    gap:5px;
}

.menu-item{

    width:100%;

    border:none;

    background:white;

    text-align:left;

    padding:13px;

    border-radius:12px;

    font-weight:800;

    cursor:pointer;

    font-size:14px;
}

.menu-item:hover{
    background:#f1f4f4;
}

.menu-item.danger{
    color:#b52e25;
}

/* =====================================================
   REPORT
===================================================== */

.report-info{

    background:#f3f5f5;

    border-radius:12px;

    padding:10px;

    font-size:12px;

    color:#68767a;

    margin-bottom:12px;
}

.report-reasons{

    display:flex;
    flex-direction:column;

    gap:7px;

    margin-bottom:12px;
}

.report-reason{

    border:1px solid #dfe5e5;

    background:white;

    border-radius:12px;

    padding:11px;

    cursor:pointer;

    text-align:left;

    font-size:13px;
}

.report-reason.selected{

    border-color:#E97824;

    background:#fff6ef;
}

.report-description{
    display:none;
}

.report-description.show{
    display:block;
}

/* =====================================================
   TOAST
===================================================== */

.toast{

    position:fixed;

    left:50%;
    bottom:90px;

    transform:
        translateX(-50%)
        translateY(20px);

    background:#12343B;
    color:white;

    padding:11px 16px;

    border-radius:13px;

    font-size:13px;
    font-weight:800;

    opacity:0;

    pointer-events:none;

    transition:.25s;

    z-index:5000;

    max-width:90%;

    text-align:center;
}

.toast.show{

    opacity:1;

    transform:
        translateX(-50%)
        translateY(0);
}

/* =====================================================
   MENÚ INFERIOR
===================================================== */

.bottom-nav{

    position:fixed;

    left:0;
    right:0;
    bottom:0;

    z-index:2000;

    background:white;

    border-top:1px solid #dfe5e5;

    box-shadow:
        0 -3px 15px rgba(0,0,0,.08);

    display:flex;

    padding:
        5px
        5px
        calc(5px + env(safe-area-inset-bottom));
}

.nav-item{

    flex:1;

    border:none;

    background:white;

    color:#657377;

    display:flex;

    flex-direction:column;

    align-items:center;

    justify-content:center;

    gap:2px;

    min-height:51px;

    border-radius:12px;

    cursor:pointer;
}

.nav-item:hover{
    background:#f0f3f3;
}

.nav-item.active{

    color:#12343B;

    font-weight:900;
}

.nav-icon{

    font-size:18px;

    line-height:19px;
}

.nav-label{

    font-size:9px;

    font-weight:800;
}

/* =====================================================
   DESKTOP
===================================================== */

@media(min-width:900px){

    .page{
        padding-top:18px;
    }

    .bottom-nav{

        left:50%;
        right:auto;

        transform:translateX(-50%);

        width:min(760px,100%);

        border-radius:
            18px
            18px
            0
            0;
    }

    .modal{
        align-items:center;
    }

    .modal-box{
        border-radius:20px;
    }

}

/* =====================================================
   MOBILE
===================================================== */

@media(max-width:430px){

    .brand-title{
        font-size:18px;
    }

    .brand-subtitle{
        font-size:11px;
    }

    .header{
        padding-left:9px;
        padding-right:9px;
    }

    .header-actions{
        gap:2px;
    }

    .icon-btn{
        width:35px;
        height:35px;
    }

    .page{
        padding:9px;
    }

    .profile-link{
        padding:7px 8px;
        font-size:11px;
    }

    .nav-label{
        font-size:8px;
    }

}

</style>

</head>

<body>

<header class="header">

    <div class="brand">

        <div class="brand-logo">
            G
        </div>

        <div class="brand-text">

            <div class="brand-title">
                GESBASE
            </div>

            <div class="brand-subtitle">
                Red Laboral
            </div>

        </div>

    </div>

    <div class="header-actions">

        <button
            class="icon-btn"
            id="securityBtn"
            title="Seguridad"
            style="display:none;"
        >
            🛡️
        </button>

        <button
            class="icon-btn"
            id="messagesBtn"
            title="Mensajes"
        >
            💬

            <span
                class="badge"
                id="messagesBadge"
                style="display:none;"
            >
                0
            </span>

        </button>

        <button
            class="icon-btn"
            id="notificationsBtn"
            title="Notificaciones"
        >
            🔔

            <span
                class="badge"
                id="notificationsBadge"
                style="display:none;"
            >
                0
            </span>

        </button>

    </div>

</header>


<main class="page">

    <section
        class="profile-mini"
        id="profileMini"
    >

        <div
            class="avatar"
            id="profileAvatar"
        >
            G
        </div>

        <div class="profile-info">

            <div
                class="profile-name"
                id="profileName"
            >
                Cargando...
            </div>

            <div
                class="profile-type"
                id="profileType"
            >
                Red Laboral
            </div>

        </div>

        <button
            class="profile-link"
            id="profileBtn"
        >
            Perfil
        </button>

    </section>


    <section class="create-post">

        <div class="create-top">

            <div
                class="avatar"
                id="createAvatar"
            >
                G
            </div>

            <button
                class="create-input"
                id="openPostBtn"
            >
                ¿Qué querés publicar?
            </button>

        </div>

        <div class="create-options">

            <button
                class="create-option"
                id="createPublicationBtn"
            >
                📝 Publicación
            </button>

            <button
                class="create-option empleo"
                id="createEmploymentBtn"
            >
                💼 Empleo
            </button>

            <button
                class="create-option buscar"
                id="createSearchBtn"
            >
                🔎 Buscar
            </button>

        </div>

    </section>


    <div class="feed-header">

        <div>

            <div class="feed-title">
                Social
            </div>

            <div class="feed-subtitle">
                Compartí, conectá y descubrí novedades
            </div>

        </div>

    </div>


    <button
        class="new-posts"
        id="newPostsBtn"
    >
        🆕 Hay nuevas publicaciones
    </button>


    <section id="feed">

        <div class="loading">
            Cargando publicaciones...
        </div>

    </section>

</main>


<!-- =====================================================
     MENÚ INFERIOR ÚNICO
===================================================== -->

<nav class="bottom-nav">

    <button
        class="nav-item active"
        id="bottomSocial"
    >
        <span class="nav-icon">🏠</span>
        <span class="nav-label">Inicio</span>
    </button>

    <button
        class="nav-item"
        id="bottomSearch"
    >
        <span class="nav-icon">🔎</span>
        <span class="nav-label">Buscar</span>
    </button>

    <button
        class="nav-item"
        id="bottomJobs"
    >
        <span class="nav-icon">💼</span>
        <span class="nav-label">Empleos</span>
    </button>

    <button
        class="nav-item"
        id="bottomShop"
    >
        <span class="nav-icon">🛒</span>
        <span class="nav-label">Shop</span>
    </button>

    <button
        class="nav-item"
        id="bottomProfile"
    >
        <span class="nav-icon">👤</span>
        <span class="nav-label">Perfil</span>
    </button>

</nav>


<!-- =====================================================
     MODAL CREAR
===================================================== -->

<div
    class="modal"
    id="postModal"
>

    <div class="modal-box">

        <div class="modal-header">

            <div class="modal-title">
                Crear publicación
            </div>

            <button
                class="close-btn"
                id="closePostModal"
            >
                ×
            </button>

        </div>

        <label class="form-label">
            ¿Qué querés compartir?
        </label>

        <textarea
            id="postText"
            placeholder="Escribí algo para la Red Laboral..."
            maxlength="5000"
        ></textarea>

        <div class="form-actions">

            <button
                class="btn btn-secondary"
                id="cancelPostBtn"
            >
                Cancelar
            </button>

            <button
                class="btn btn-primary"
                id="publishPostBtn"
            >
                Publicar
            </button>

        </div>

    </div>

</div>


<!-- =====================================================
     MODAL MENÚ PUBLICACIÓN
===================================================== -->

<div
    class="modal"
    id="postMenuModal"
>

    <div class="modal-box">

        <div class="modal-header">

            <div class="modal-title">
                Opciones
            </div>

            <button
                class="close-btn"
                id="closePostMenu"
            >
                ×

/* =====================================================
   ESCAPAR HTML
===================================================== */

function escaparHTML(texto){

    if(
        texto === null ||
        texto === undefined
    ){
        return "";
    }

    return String(texto)
        .replace(/&/g,"&amp;")
        .replace(/</g,"&lt;")
        .replace(/>/g,"&gt;")
        .replace(/"/g,"&quot;")
        .replace(/'/g,"&#039;");
}


/* =====================================================
   VALIDAR NOMBRE
===================================================== */

function nombreValido(nombre){

    if(
        nombre === null ||
        nombre === undefined
    ){
        return false;
    }

    const valor =
        String(nombre).trim();

    if(!valor){
        return false;
    }


    /*
       Nunca mostrar UID como nombre.
    */

    if(
        usuarioActual &&
        valor === usuarioActual.uid
    ){
        return false;
    }


    /*
       Identificadores largos.
    */

    if(
        /^uid[_-]/i.test(valor)
    ){
        return false;
    }


    /*
       Email no se considera nombre.
    */

    if(
        /^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(valor)
    ){
        return false;
    }


    /*
       ID alfanumérico largo sin espacios.
    */

    if(
        !valor.includes(" ") &&
        /^[A-Za-z0-9_-]{20,}$/.test(valor)
    ){
        return false;
    }


    return true;
}


/* =====================================================
   OBTENER NOMBRE
===================================================== */

function obtenerNombrePerfil(perfil){

    if(!perfil){
        return "";
    }


    const candidatos = [

        perfil.nombreCompleto,

        perfil.nombreUsuario,

        perfil.nombre,

        perfil.apellido
            ? `${perfil.nombre || ""} ${perfil.apellido || ""}`.trim()
            : "",

        perfil.nombreEmpresa,

        perfil.razonSocial,

        perfil.displayName

    ];


    for(
        const candidato
        of candidatos
    ){

        if(
            nombreValido(candidato)
        ){

            return String(candidato)
                .trim();

        }

    }


    return "";
}


/* =====================================================
   TIPO
===================================================== */

function obtenerTipoPerfil(perfil){

    if(!perfil){
        return "Usuario";
    }

    return (

        perfil.tipoPerfil ||

        perfil.tipoUsuario ||

        perfil.tipo ||

        perfil.rol ||

        perfil.role ||

        "Usuario"

    );

}


/* =====================================================
   FOTO
===================================================== */

function obtenerAvatar(perfil){

    if(!perfil){
        return "";
    }

    return (

        perfil.fotoPerfil ||

        perfil.fotoPerfilUrl ||

        perfil.fotoURL ||

        perfil.avatar ||

        perfil.photoURL ||

        perfil.foto ||

        perfil.imagenPerfil ||

        perfil.imagen ||

        perfil.urlFoto ||

        perfil.profilePhoto ||

        perfil.profilePicture ||

        ""

    );

}


/* =====================================================
   UID PUBLICACIÓN
===================================================== */

function obtenerUidPublicacion(post){

        post.usuarioId ||

        post.autorUid ||

        post.uid ||

        post.userId ||

    );

}


/* =====================================================
   NOMBRE AUTOR
===================================================== */

function obtenerNombreAutor(post){

        post.nombreAutor,

        post.autorNombre,

/* =====================================================
   FOTO AUTOR
===================================================== */

function obtenerFotoAutor(post){

    return (

        post.fotoAutor ||

        post.autorFoto ||

        post.fotoPerfil ||

        post.fotoURL ||

        post.avatar ||

        post.photoURL ||

    );

}


/* =====================================================
   INICIAL
===================================================== */

function inicialNombre(nombre){

    if(!nombre){
        return "G";
    }

    return String(nombre)
        .trim()
        .charAt(0)
        .toUpperCase();

}


/* =====================================================
   FECHA ORDEN
===================================================== */

function fechaParaOrden(data){

    if(data.fechaCliente){

        const valor =
            new Date(
                data.fechaCliente
            ).getTime();

        if(!isNaN(valor)){
            return valor;
        }

    }


    if(data.fecha?.seconds){

        return data.fecha.seconds * 1000;

    }


    if(data.fechaCreacion?.seconds){

        return data.fechaCreacion.seconds * 1000;

    }


    return 0;

}


/* =====================================================
   FECHA TEXTO
===================================================== */

function formatearFecha(data){

    let fecha = null;


    if(data.fechaCliente){

        fecha =
            new Date(
                data.fechaCliente
            );

    }else if(data.fecha?.seconds){

        fecha =
            new Date(
                data.fecha.seconds * 1000
            );

    }else if(data.fechaCreacion?.seconds){

        fecha =
            new Date(
                data.fechaCreacion.seconds * 1000
            );

    }


    if(
        !fecha ||
        isNaN(fecha.getTime())
    ){

        return "";

    }


    return fecha.toLocaleString(
        "es-AR",
        {
            day:"2-digit",
            month:"2-digit",
            year:"numeric",
            hour:"2-digit",
            minute:"2-digit"
        }
    );

}

   ADMIN

function esAdmin(){

/* =====================================================
   PINTAR AVATAR
===================================================== */

function pintarAvatar(
    elemento,
    nombre,
    foto
){

    if(!elemento){
        return;
    }


    const inicial =
        escaparHTML(
            inicialNombre(nombre)
        );


    elemento.innerHTML = "";


    if(foto){

        img.src = foto;

        img.addEventListener(

                elemento.textContent =
                    inicial;

            }
        );


        elemento.appendChild(img);


    }else{

        elemento.textContent =
            inicial;

    }

}


/* =====================================================
   CARGAR PERFIL COMPLETO
===================================================== */

async function obtenerPerfilCompleto(uid){

    if(!uid){
        return {};
    }


    if(perfilesCache[uid]){
        return perfilesCache[uid];
    }


    let datosRed = {};
    let datosUsuario = {};


    /*
       RED LABORAL
    */

    try{

        const snapRed =
            await getDoc(
                doc(
                    db,
                    "usuariosRed",
                    uid
                )
            );


        if(
            snapRed.exists()
        ){

            datosRed =
                snapRed.data();

        }

    }catch(error){

        console.warn(
            "Error usuariosRed:",
            error
        );

    }


    /*
       USUARIO GENERAL
    */

    try{

        const snapUsuario =
            await getDoc(
                doc(
                    db,
                    "usuarios",
                    uid
                )
            );


        if(
            snapUsuario.exists()
        ){

            datosUsuario =
                snapUsuario.data();

        }

    }catch(error){

        console.warn(
            "Error usuarios:",
            error
        );

    }


    /*
       IMPORTANTE:
       combinamos ambos perfiles.
       usuariosRed tiene prioridad,
       pero si un campo no existe
       buscamos en usuarios.
    */

    const perfil = {

        ...datosUsuario,

        ...datosRed

    };


    /*
       Para el usuario actual,
       Firebase Auth tiene información
       actualizada que también usamos.
    */

    if(
        uid === usuarioActual?.uid
    ){

        if(
            usuarioActual.displayName
        ){

            perfil.authDisplayName =
                usuarioActual.displayName;

        }


        if(
            usuarioActual.photoURL
        ){

            perfil.authPhotoURL =
                usuarioActual.photoURL;

        }


        if(
            usuarioActual.email
        ){

            perfil.authEmail =
                usuarioActual.email;

        }

    }


    perfilesCache[uid] =
        perfil;


    return perfil;

}


/* =====================================================
   RESOLVER NOMBRE ACTUAL
===================================================== */

function resolverNombreActual(
    perfil,
    uid
){

    /*
       Para el usuario actual,
       primero usamos el nombre real de
       Firebase Authentication si existe.
    */

    if(
        uid === usuarioActual?.uid &&
        nombreValido(
            usuarioActual?.displayName
        )
    ){

        return String(
            usuarioActual.displayName
        ).trim();

    }


    const nombre =
        obtenerNombrePerfil(
            perfil
        );


    if(nombre){
        return nombre;
    }


    if(
        nombreValido(
            perfil?.authDisplayName
        )
    ){

        return String(
            perfil.authDisplayName
        ).trim();

    }


    return "Usuario GESBASE";

}


/* =====================================================
   CARGAR PERFIL ACTUAL
===================================================== */

async function cargarPerfil(uid){

    const perfil =
        await obtenerPerfilCompleto(uid);


    const nombre =
        resolverNombreActual(
            perfil,
            uid
        );


    const foto =
        obtenerAvatar(perfil) ||

        usuarioActual?.photoURL ||

        perfil?.authPhotoURL ||

        "";


    perfilActual = {

        ...perfil,

        nombreCompleto:
            nombre,

        fotoPerfil:
            foto,

        email:
            perfil?.email ||
            perfil?.authEmail ||
            usuarioActual?.email ||
            ""

    };


    perfilesCache[uid] =
        perfilActual;


    profileName.textContent =
        nombre;


    profileType.textContent =
        obtenerTipoPerfil(
            perfilActual
        );


    pintarAvatar(
        profileAvatar,
        nombre,
        foto
    );


    pintarAvatar(
        createAvatar,
        nombre,
        foto
    );


    if(esAdmin()){

        document
            .getElementById("securityBtn")
            .style.display =
                "flex";

    }

}


/* =====================================================
   ACTUALIZAR AUTORES
===================================================== */

async function actualizarPerfilesPublicaciones(){

    const autores = [

        ...new Set(

            publicaciones
                .map(
                    post =>
                        obtenerUidPublicacion(post)
                )
                .filter(Boolean)

        )

    ];


    if(!autores.length){
        return;
    }


    await Promise.all(

        autores.map(
            uid =>
                obtenerPerfilCompleto(uid)
        )

    );


    renderFeed();

}


/* =====================================================
   ESCUCHAR FEED
===================================================== */

function escucharFeed(){

    if(unsubscribeFeed){

        unsubscribeFeed();

    }


    unsubscribeFeed =
        onSnapshot(

            collection(
                db,
                "publicaciones"
            ),

            async snapshot => {

                const nuevas = [];


                snapshot.forEach(item => {

                    nuevas.push({

                        id:item.id,

                        ...item.data()

                    });

                });


                nuevas.sort(
                    (a,b) =>
                        fechaParaOrden(b) -
                        fechaParaOrden(a)
                );


                publicaciones =
                    nuevas;


                if(
                    primeraCargaFeed
                ){

                    primeraCargaFeed =
                        false;


                    renderFeed();


                    await actualizarPerfilesPublicaciones();


                }else{

                    publicacionesPendientes =
                        true;


                    newPostsBtn
                        .classList
                        .add("show");

                }

            },

            error => {

                console.error(
                    "Error escuchando publicaciones:",
                    error
                );


                feed.innerHTML = `

                    <div class="empty">

                        <div class="empty-icon">
                            ⚠️
                        </div>

                        <div class="empty-title">
                            No pudimos cargar las publicaciones
                        </div>

                        <div class="empty-text">
                            Revisá tu conexión e intentá nuevamente.
                        </div>

                    </div>

                `;

            }

        );

}


/* =====================================================
   HTML PUBLICACIÓN
===================================================== */

function publicacionHTML(post){

    const uidAutor =
        obtenerUidPublicacion(post);


    const perfilAutor =
        perfilesCache[uidAutor] || {};


    /*
       PERFIL ACTUAL > DATOS VIEJOS
    */

    const autorNombre =
        resolverNombreActual(
            perfilAutor,
            uidAutor
        ) !== "Usuario GESBASE"

            ? resolverNombreActual(
                perfilAutor,
                uidAutor
            )

            : obtenerNombreAutor(post);


    const autorFoto =
        obtenerAvatar(
            perfilAutor
        ) ||
        obtenerFotoAutor(post);


    const texto =
        post.texto ||
        post.contenido ||
        "";


    const likes =
        Array.isArray(
            post.usuariosLike
        )
            ? post.usuariosLike
            : [];


    const cantidadLikes =

    const meGusta =

        likes.includes(
            usuarioActual.uid
        );


    const comentarios =
        Number(
            post.cantidadComentarios ||
            post.comentariosCount ||
            0
        );


    const fecha =
        formatearFecha(post);


    const editado =
        post.editada
            ? `
                <span class="post-edited">
                    (editada)
                </span>
            `
            : "";


    const tipo =
        obtenerTipoPerfil(
            perfilAutor
        ) ||
        post.tipoAutor ||
        post.rolAutor ||
        "Red Laboral";


    return `

        <article
            class="post-card"
            data-id="${escaparHTML(post.id)}"
        >

            <div class="post-header">

                <button
                    class="post-avatar-button"
                    data-action="profile"
                    data-uid="${escaparHTML(uidAutor)}"
                    title="Ver perfil"
                    aria-label="Ver perfil de ${escaparHTML(autorNombre)}"
                >

                    <div class="avatar">

                        ${
                            autorFoto
                                ? `
                                    <img
                                        src="${escaparHTML(autorFoto)}"
                                        alt="Foto de ${escaparHTML(autorNombre)}"
                                    >
                                `
                                : escaparHTML(
                                    inicialNombre(
                                        autorNombre
                                    )
                                )
                        }

                    </div>

                </button>


                <div
                    class="post-author"
                    data-action="profile"
                    data-uid="${escaparHTML(uidAutor)}"
                    title="Ver perfil"
                >

                    <div class="post-author-name">

                        ${escaparHTML(
                            autorNombre
                        )}

                    </div>

                    <div class="post-author-type">

                        ${escaparHTML(
                            tipo
                        )}

                    </div>

                    ${
                        fecha
                            ? `
                                <div class="post-date">
                                    ${escaparHTML(fecha)}
                                </div>
                            `
                            : ""
                    }

                </div>


                <button
                    class="post-menu-btn"
                    data-action="menu"
                    data-id="${escaparHTML(post.id)}"
                    title="Opciones"
                >
                    ⋮
                </button>

            </div>


            <div class="post-content">

                ${escaparHTML(texto)}

                ${editado}

            </div>


            <div class="post-stats">

                <span>

                    ${
                        cantidadLikes > 0
                            ? `👍 ${cantidadLikes}`
                            : " "
                    }

                </span>

                <span>

                    ${
                        comentarios > 0
                            ? `${comentarios} comentarios`
                            : ""
                    }

                </span>

            </div>


            <div class="post-actions">

                <button
                    class="post-action ${meGusta ? "liked" : ""}"
                    data-action="like"
                    data-id="${escaparHTML(post.id)}"
                >
                    👍 Me gusta
                </button>

                <button
                    class="post-action"
                    data-action="comment"
                    data-id="${escaparHTML(post.id)}"
                >
                    💬 Comentar
                </button>

                <button
                    class="post-action"
                    data-action="share"
                    data-id="${escaparHTML(post.id)}"
                >
                    ↗️ Compartir
                </button>

            </div>


            <div
                class="comments"
                id="comments-${escaparHTML(post.id)}"
            >

                <div
                    class="comments-list"
                    id="comments-list-${escaparHTML(post.id)}"
                ></div>


                <div class="comment-form">

                    <input
                        class="comment-input"
                        id="comment-input-${escaparHTML(post.id)}"
                        placeholder="Escribí un comentario..."
                        maxlength="1000"
                    >

                    <button
                        class="comment-send"
                        data-action="send-comment"
                        data-id="${escaparHTML(post.id)}"
                    >
                        ➤
                    </button>

                </div>

            </div>

        </article>

    `;

}


/* =====================================================
   RENDER
===================================================== */

function renderFeed(){

    if(!publicaciones.length){

        feed.innerHTML = `

            <div class="empty">

                <div class="empty-icon">
                    📝
                </div>

                <div class="empty-title">
                    Todavía no hay publicaciones
                </div>

                <div class="empty-text">
                    Sé la primera persona en compartir algo
                    con la Red Laboral.
                </div>

            </div>

        `;

        return;

    }


    feed.innerHTML =
        publicaciones
            .map(publicacionHTML)
            .join("");


    conectarEventosPublicaciones();

}


/* =====================================================
   EVENTOS
===================================================== */

function conectarEventosPublicaciones(){

    /*
       PERFIL
    */

    document
        .querySelectorAll(
            "[data-action='profile']"
        )
        .forEach(elemento => {

            elemento.addEventListener(
                "click",
                () => {

                    const uid =
                        elemento.dataset.uid;


                    if(!uid){

/* =====================================================
   LIKE
===================================================== */

async function darLike(id){

    if(!usuarioActual){
        return;
    }


    const post =
        publicaciones.find(
            item =>
                item.id === id
        );


    if(!post){
        return;
    }


    const likes =
        Array.isArray(
            post.usuariosLike
        )
            ? post.usuariosLike
            : [];


    const yaExiste =
        likes.includes(
            usuarioActual.uid
        );


    try{

        await updateDoc(
            doc(
                db,
                "publicaciones",
                id
            ),
            {

                usuariosLike:
                    yaExiste
                        ? arrayRemove(
                            usuarioActual.uid
                        )
                        : arrayUnion(
                            usuarioActual.uid
                        )

            }
        );


    }catch(error){

        console.error(
            "Error en like:",
            error
        );

        mostrarToast(
            "No se pudo actualizar el Me gusta."
        );

    }

}


/* =====================================================
   COMENTARIOS
===================================================== */

function mostrarComentarios(id){

    const caja =
        document.getElementById(
            `comments-${id}`
        );


    if(!caja){
        return;
    }


    caja.classList.toggle(
        "show"
    );


    if(
        caja.classList.contains(
            "show"
        )
    ){

        escucharComentarios(id);

    }

}


function escucharComentarios(id){

    if(
        listenersComentarios[id]
    ){
        return;
    }


    listenersComentarios[id] =
        onSnapshot(

            collection(
                db,
                "publicaciones",
                id,
                "comentarios"
            ),

            snapshot => {

                const lista = [];


                snapshot.forEach(item => {

                    lista.push({

                        id:item.id,

                        ...item.data()

                    });

                });


                lista.sort(
                    (a,b) =>
                        fechaParaOrden(b) -
                        fechaParaOrden(a)
                );


                renderComentarios(
                    id,
                    lista
                );

            }

        );

}


function renderComentarios(
    id,
    comentarios
){

    const lista =
        document.getElementById(
            `comments-list-${id}`
        );


    if(!lista){
        return;
    }


    if(!comentarios.length){

        lista.innerHTML = `

            <div
                style="
                    color:#849093;
                    font-size:12px;
                    padding:5px 0 10px;
                "
            >
                Todavía no hay comentarios.
            </div>

        `;

        return;

    }


    lista.innerHTML =
        comentarios
            .map(comment => {

                const nombre =
                    comment.nombre ||
                    comment.usuarioNombre ||
                    "Usuario";


                const foto =
                    comment.fotoPerfil ||
                    comment.foto ||
                    "";


                return `

                    <div class="comment">

                        <div class="comment-avatar">

                            ${
                                foto
                                    ? `
                                        <img
                                            src="${escaparHTML(foto)}"
                                            alt="Foto"
                                        >
                                    `
                                    : escaparHTML(
                                        inicialNombre(
                                            nombre
                                        )
                                    )
                            }

                        </div>

                        <div class="comment-body">

                            <div class="comment-name">
                                ${escaparHTML(nombre)}
                            </div>

                            <div>
                                ${escaparHTML(
                                    comment.texto ||
                                    ""
                                )}
                            </div>

                        </div>

                    </div>

                `;

            })
            .join("");

}


/* =====================================================
   AGREGAR COMENTARIO
===================================================== */

async function agregarComentario(id){

    if(!usuarioActual){
        return;
    }


    const input =
        document.getElementById(
            `comment-input-${id}`
        );


    if(!input){
        return;
    }


    const texto =
        input.value.trim();


    if(!texto){
        return;
    }


    const nombre =
        resolverNombreActual(
            perfilActual,
            usuarioActual.uid
        );


    const foto =
        obtenerAvatar(
            perfilActual
        ) ||
        usuarioActual.photoURL ||
        "";


    try{

        await addDoc(
            collection(
                db,
                "publicaciones",
                id,
                "comentarios"
            ),
            {

                usuarioId:
                    usuarioActual.uid,

                nombre,

                fotoPerfil:
                    foto,

                texto,

                fecha:
                    serverTimestamp(),

                fechaCliente:
                    new Date().toISOString()

            }
        );


        input.value = "";


        mostrarToast(
            "Comentario publicado."
        );


        const post =
            publicaciones.find(
                item =>
                    item.id === id
            );


        if(post){

            const actual =
                Number(
                    post.cantidadComentarios ||
                    post.comentariosCount ||
                    0
                );


            await updateDoc(
                doc(
                    db,
                    "publicaciones",
                    id
                ),
                {

                    cantidadComentarios:
                        actual + 1

                }
            );

        }


        const postActual =
            publicaciones.find(
                item =>
                    item.id === id
            );


        const uidAutor =
            obtenerUidPublicacion(
                postActual || {}
            );


        if(
            uidAutor &&
            uidAutor !==
                usuarioActual.uid
        ){

            await addDoc(
                collection(
                    db,
                    "notificaciones"
                ),
                {

                    receptorUid:
                        uidAutor,

                    emisorUid:
                        usuarioActual.uid,

                    tipo:
                        "comentario",

                    mensaje:
                        `${nombre} comentó tu publicación.`,

                    publicacionId:
                        id,

                    leido:false,

                    fecha:
                        serverTimestamp(),

                    fechaCliente:
                        new Date().toISOString()

                }
            );

        }


    }catch(error){

        console.error(error);

        mostrarToast(
            "No se pudo publicar el comentario."
        );

    }

}


/* =====================================================
   COMPARTIR
===================================================== */

async function compartirPost(id){

    const post =
        publicaciones.find(
            item =>
                item.id === id
        );


    if(!post){
        return;
    }


    const texto =
        post.texto ||
        post.contenido ||
        "";


    const url =
        `${window.location.origin}${window.location.pathname}#post-${id}`;


    try{

        if(navigator.share){

            await navigator.share({

                title:
                    "Publicación - Red Laboral GESBASE",

                text:texto,

                url

            });

        }else{

            await navigator.clipboard.writeText(
                `${texto}\n\n${url}`
            );


            mostrarToast(
                "Enlace copiado."
            );

        }

    }catch(error){

        console.log(
            "Compartir cancelado",
            error
        );

    }

}

async function enviarReporte(){

    if(!usuarioActual){
        return;
    }


    if(!publicacionSeleccionada){

        mostrarToast(
            "No se encontró la publicación."
        );

        return;

    }


    if(!motivoReporte){

        mostrarToast(
            "Seleccioná un motivo."
        );

        return;

    }


    const nombreReportante =
        resolverNombreActual(
            perfilActual,
            usuarioActual.uid
        );


    const uidReportado =
        obtenerUidPublicacion(
            publicacionSeleccionada
        );


    const perfilReportado =
        perfilesCache[uidReportado] ||
        {};


    const nombreReportado =
        resolverNombreActual(
            perfilReportado,
            uidReportado
        ) !== "Usuario GESBASE"

            ? resolverNombreActual(
                perfilReportado,
                uidReportado
            )

            : obtenerNombreAutor(
                publicacionSeleccionada
            );


    try{

        await addDoc(
            collection(
                db,
                "reportes"
            ),
            {

                tipo:
                    "publicacion",

                publicacionId:
                    publicacionSeleccionada.id,

                publicacionTexto:
                    publicacionSeleccionada.texto ||
                    publicacionSeleccionada.contenido ||
                    "",

                reportadoUid:
                    uidReportado,

                reportadoNombre:
                    nombreReportado,

                reportanteUid:
                    usuarioActual.uid,

                reportanteNombre:
                    nombreReportante,

                reportanteEmail:
                    usuarioActual.email ||
                    "",

                motivo:
                    motivoReporte,

                descripcion:
                    reportDescription.value.trim(),

                estado:
                    "pendiente",

                fecha:
                    serverTimestamp(),

                fechaCliente:
                    new Date().toISOString()

            }
        );


        await addDoc(
            collection(
                db,
                "notificaciones"
            ),
            {

                receptorUid:
                    usuarioActual.uid,

                emisorUid:
                    usuarioActual.uid,

                tipo:
                    "reporte",

                mensaje:
                    "Tu reporte fue recibido y será revisado.",

                publicacionId:
                    publicacionSeleccionada.id,

                leido:false,

                fecha:
                    serverTimestamp(),

                fechaCliente:
                    new Date().toISOString()

            }
        );


        cerrarModal(
            reportModal
        );


        mostrarToast(
            "Reporte enviado correctamente."
        );


    }catch(error){

        console.error(
            "Error enviando reporte:",
            error
        );

        mostrarToast(
            "No se pudo enviar el reporte."
        );

    }

}

   NOTIFICACIONES
===================================================== */

function escucharNotificaciones(){

    if(!usuarioActual){
        return;
    }


    if(
        unsubscribeNotificaciones
    ){

        unsubscribeNotificaciones();

    }


    const q =
        query(
            collection(
                db,
                "notificaciones"
            ),
            where(
                "receptorUid",
                "==",
                usuarioActual.uid
            )
        );


    unsubscribeNotificaciones =
        onSnapshot(
            q,
            snapshot => {

                let contador = 0;


                snapshot.forEach(
                    item => {

                        const data =
                            item.data();


                        if(
                            data.leido === false
                        ){

                            contador++;

                        }

                    }
                );


                const badge =
                    document.getElementById(
                        "notificationsBadge"
                    );


                if(contador > 0){

                    badge.textContent =
                        contador > 99
                            ? "99+"
                            : contador;

                    badge.style.display =
                        "flex";

                }else{

                    badge.style.display =
                        "none";

                }

            },

            error => {

                console.warn(
                    "Notificaciones:",
                    error
                );

            }
        );

}


/* =====================================================
   MENSAJES

}


/* =====================================================
   AUTENTICACIÓN
===================================================== */

onAuthStateChanged(
    auth,
    async user => {

        if(!user){

            window.location.href =
                "red-login.html";

            return;

        }


        usuarioActual =
            user;


        try{

            /*
               Primero cargamos el perfil completo.
            */

            await cargarPerfil(
                user.uid
            );


            /*
               Después cargamos Red.
            */

            escucharFeed();

            escucharNotificaciones();

            escucharMensajes();


        }catch(error){

            console.error(
                "Error inicializando Red Laboral:",
                error
            );


            mostrarToast(
                "No se pudo cargar tu perfil."
            );

        }

    }
);

        }
    );

}
