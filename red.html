<style>

*{
    box-sizing:border-box;
    margin:0;
    padding:0;
}

html,
body{
    min-height:100%;
}

body{
    font-family:
        Arial,
        Helvetica,
        sans-serif;

    background:#f3f6f7;
    color:#17252b;

    padding-bottom:85px;
}


/* =========================
   HEADER
========================= */

header{
    position:sticky;
    top:0;
    z-index:100;

    height:64px;

    display:flex;
    align-items:center;
    justify-content:space-between;

    padding:0 18px;

    background:#12343B;
    color:white;

    box-shadow:
        0 2px 10px rgba(0,0,0,.18);
}

.logo{
    font-size:20px;
    font-weight:800;
}

.header-actions{
    display:flex;
    align-items:center;
    gap:8px;
}

.header-btn{
    width:40px;
    height:40px;

    border:0;
    border-radius:50%;

    background:
        rgba(255,255,255,.12);

    color:white;

    font-size:18px;

    cursor:pointer;
}

.header-btn:active{
    transform:scale(.95);
}


/* =========================
   CONTENEDOR
========================= */

.container{
    width:100%;
    max-width:900px;

    margin:auto;

    padding:18px;
}


/* =========================
   BIENVENIDA
========================= */

.welcome{
    background:white;

    border-radius:18px;

    padding:22px;

    margin-bottom:15px;

    box-shadow:
        0 4px 18px rgba(0,0,0,.07);
}

.welcome h1{
    color:#12343B;

    font-size:25px;

    margin-bottom:7px;
}

.welcome p{
    color:#68777c;

    line-height:1.5;
}


/* =========================
   CREAR PUBLICACION
========================= */

.create-card{
    background:white;

    border-radius:18px;

    padding:16px;

    margin-bottom:15px;

    box-shadow:
        0 4px 18px rgba(0,0,0,.07);
}

.create-row{
    display:flex;
    align-items:center;

    gap:12px;
}

.current-avatar{
    width:46px;
    height:46px;

    border-radius:50%;

    flex-shrink:0;

    background:#12343B;

    color:white;

    display:flex;
    align-items:center;
    justify-content:center;

    font-weight:800;

    overflow:hidden;
}

.current-avatar img{
    width:100%;
    height:100%;

    object-fit:cover;
}

.create-button{
    flex:1;

    border:1px solid #dce4e6;

    background:#f7f9fa;

    color:#718085;

    border-radius:25px;

    padding:12px 16px;

    text-align:left;

    cursor:pointer;

    font-size:14px;
}

.create-button:active{
    transform:scale(.99);
}


/* =========================
   FEED
========================= */

.feed{
    display:flex;

    flex-direction:column;

    gap:15px;
}

.post{
    background:white;

    border-radius:18px;

    padding:18px;

    box-shadow:
        0 4px 18px rgba(0,0,0,.07);
}

.post-header{
    display:flex;

    align-items:center;

    gap:11px;
}

.post-avatar{
    width:46px;
    height:46px;

    border-radius:50%;

    background:#12343B;

    color:white;

    display:flex;
    align-items:center;
    justify-content:center;

    overflow:hidden;

    flex-shrink:0;

    font-weight:800;
}

.post-avatar img{
    width:100%;
    height:100%;

    object-fit:cover;
}

.post-author{
    color:#12343B;

    font-size:15px;

    font-weight:800;
}

.post-type{
    color:#718085;

    font-size:12px;

    margin-top:2px;
}

.post-date{
    color:#89969a;

    font-size:11px;

    margin-top:2px;
}

.post-text{
    margin-top:15px;

    color:#263a40;

    line-height:1.6;

    white-space:pre-wrap;

    word-break:break-word;
}

.post-actions{
    display:flex;

    align-items:center;

    gap:8px;

    margin-top:16px;

    padding-top:12px;

    border-top:1px solid #edf1f2;
}

.post-action{
    border:0;

    background:#f2f5f6;

    color:#53656a;

    border-radius:10px;

    padding:9px 12px;

    font-size:13px;

    cursor:pointer;
}

.post-action:hover{
    background:#e8edef;
}

.post-action.liked{
    color:#12343B;

    font-weight:800;
}


/* =========================
   LOADING
========================= */

.loading{
    background:white;

    border-radius:18px;

    padding:35px;

    text-align:center;

    color:#68777c;

    box-shadow:
        0 4px 18px rgba(0,0,0,.06);
}

.empty{
    background:white;

    border-radius:18px;

    padding:35px 20px;

    text-align:center;

    color:#68777c;

    box-shadow:
        0 4px 18px rgba(0,0,0,.06);
}


/* =========================
   MODAL
========================= */

.modal{
    position:fixed;

    inset:0;

    z-index:500;

    background:
        rgba(0,0,0,.58);

    display:none;

    align-items:center;
    justify-content:center;

    padding:18px;
}

.modal.show{
    display:flex;
}

.modal-box{
    width:100%;
    max-width:600px;

    background:white;

    border-radius:18px;

    padding:22px;

    box-shadow:
        0 10px 35px rgba(0,0,0,.2);
}

.modal-title{
    color:#12343B;

    font-size:21px;

    font-weight:800;

    margin-bottom:15px;
}

.modal textarea{
    width:100%;

    min-height:150px;

    resize:vertical;

    border:1px solid #d8e1e3;

    border-radius:12px;

    padding:14px;

    outline:none;

    font-family:inherit;

    font-size:15px;

    line-height:1.5;
}

.modal textarea:focus{
    border-color:#12343B;
}

.modal-actions{
    display:flex;

    justify-content:flex-end;

    gap:10px;

    margin-top:15px;
}

.btn{
    border:0;

    border-radius:11px;

    padding:11px 17px;

    font-size:14px;

    font-weight:700;

    cursor:pointer;
}

.btn-primary{
    background:#12343B;

    color:white;
}

.btn-secondary{
    background:#e9eef0;

    color:#12343B;
}


/* =========================
   TOAST
========================= */

.toast{
    position:fixed;

    left:50%;
    bottom:92px;

    transform:
        translateX(-50%)
        translateY(20px);

    opacity:0;

    pointer-events:none;

    z-index:1000;

    max-width:
        calc(100% - 30px);

    padding:12px 18px;

    border-radius:12px;

    background:#12343B;

    color:white;

    font-size:14px;

    text-align:center;

    transition:
        opacity .25s,
        transform .25s;
}

.toast.show{
    opacity:1;

    transform:
        translateX(-50%)
        translateY(0);
}


/* =========================
   MENU INFERIOR
========================= */

.bottom-nav{
    position:fixed;

    left:0;
    right:0;
    bottom:0;

    height:74px;

    background:white;

    border-top:1px solid #dce4e6;

    display:flex;

    align-items:center;
    justify-content:space-around;

    z-index:200;

    box-shadow:
        0 -3px 14px rgba(0,0,0,.08);
}

.nav-item{

    min-width:60px;

    align-items:center;
    justify-content:center;

    gap:4px;

    cursor:pointer;

    font-size:11px;
}

.nav-icon{
    font-size:22px;
}

.nav-item.active{
    color:#12343B;

    font-weight:800;
}


/* =========================
   RESPONSIVE
========================= */

@media (min-width:700px){

    .container{

    }

}

@media (max-width:480px){

    header{

    }

    }

    .welcome{
        padding:18px;
    }

        font-size:22px;
    }

    .post{
        padding:15px;
    }

    .post-actions{
        flex-wrap:wrap;
    }

    .post-action{
        flex:1;
    }

    .bottom-nav{
        height:70px;
    }

}

</style>

<script type="module">


/* ==========================================
   FIREBASE
========================================== */

import {
    auth,
    db
} from "./Js/firebase.js";


import {
    onAuthStateChanged,
    signOut
} from "https://www.gstatic.com/firebasejs/12.18.0/firebase-auth.js";


import {
    collection,
    addDoc,
    getDocs,
    getDoc,
    doc,
    query,
    orderBy,
    limit,
    serverTimestamp
} from "https://www.gstatic.com/firebasejs/12.18.0/firebase-firestore.js";



/* ==========================================
   VARIABLES
========================================== */

let usuarioActual = null;


/*
 * Caché de perfiles.
 *
 * Esto evita pedir varias veces el mismo
 * perfil cuando una persona tiene varias
 * publicaciones.
 */

const perfilesCache =
    new Map();



/* ==========================================
   ELEMENTOS
========================================== */

const feed =
    document.getElementById("feed");

const tituloBienvenida =
    document.getElementById(
        "tituloBienvenida"
    );

const avatarActual =
    document.getElementById(
        "avatarActual"
    );

const fotoActual =
    document.getElementById(
        "fotoActual"
    );

const inicialActual =
    document.getElementById(
        "inicialActual"
    );

const modalPublicacion =
    document.getElementById(
        "modalPublicacion"
    );

const textoPublicacion =
    document.getElementById(
        "textoPublicacion"
    );

const toast =
    document.getElementById(
        "toast"
    );



/* ==========================================
   TOAST
========================================== */

function mostrarToast(mensaje){

    toast.textContent =
        mensaje;

    toast.classList.add(
        "show"
    );


    setTimeout(() => {

        toast.classList.remove(
            "show"
        );

    },3000);

}



/* ==========================================
   OBTENER PERFIL ACTUAL
========================================== */

async function obtenerPerfil(uid){

    if(!uid){
        return {};
    }


    /*
     * Si ya lo tenemos en memoria,
     * no volvemos a consultar.
     */

    if(
        perfilesCache.has(uid)
    ){

        return perfilesCache.get(
            uid
        );

    }


    try{

        const referencia =
            doc(
                db,
                "usuariosRed",
                uid
            );


        const snap =
            await getDoc(
                referencia
            );


        const perfil =
            snap.exists()
                ? snap.data()
                : {};


        perfilesCache.set(
            uid,
            perfil
        );


        return perfil;


    }catch(error){

        console.error(
            "Error obteniendo perfil:",
            error
        );


        return {};

    }

}



/* ==========================================
   NOMBRE
========================================== */

function obtenerNombre(
    perfil,
    fallback=""
){

    if(
        perfil.nombreCompleto
    ){

        return perfil.nombreCompleto;

    }


    const nombre =
        perfil.nombre ||
        "";

    const apellido =
        perfil.apellido ||
        "";


    const completo =
        `${nombre} ${apellido}`.trim();


    return (
        completo ||
        fallback ||
        "Usuario GESBASE"
    );

}



/* ==========================================
   INICIALES
========================================== */

function obtenerIniciales(
    nombre
){

    const partes =
        String(nombre)
            .trim()
            .split(/\s+/)
            .filter(Boolean);


    if(
        partes.length === 0
    ){

        return "U";

    }


    if(
        partes.length === 1
    ){

        return partes[0]
            .substring(0,2)
            .toUpperCase();

    }


    return (
        partes[0][0] +
        partes[1][0]
    ).toUpperCase();

}



/* ==========================================
   ESCAPAR HTML
========================================== */

function escaparHTML(
    valor
){

    const div =
        document.createElement(
            "div"
        );


    div.textContent =
        valor ?? "";


    return div.innerHTML;

}



/* ==========================================
   FECHA
========================================== */

function formatearFecha(
    timestamp
){

    if(!timestamp){
        return "";
    }


    try{

        const fecha =
            timestamp.toDate
                ? timestamp.toDate()
                : new Date(timestamp);


        return fecha.toLocaleString(
            "es-AR",
            {
                day:"2-digit",
                month:"2-digit",
                year:"numeric",
                hour:"2-digit",
                minute:"2-digit"
            }
        );


    }catch(error){

        return "";

    }

}



/* ==========================================
   CARGAR PERFIL DEL USUARIO LOGUEADO
========================================== */

async function cargarUsuario(){

    const perfil =
        await obtenerPerfil(
            usuarioActual.uid
        );


    const nombre =
        obtenerNombre(
            perfil,
            usuarioActual.displayName
        );


    tituloBienvenida.textContent =
        `Hola, ${nombre}`;


    inicialActual.textContent =
        obtenerIniciales(
            nombre
        );


    if(
        perfil.fotoPerfil
    ){

        fotoActual.src =
            perfil.fotoPerfil;

        fotoActual.style.display =
            "block";

        inicialActual.style.display =
            "none";

    }else{

        fotoActual.style.display =
            "none";

        inicialActual.style.display =
            "block";

    }

}



/* ==========================================
   CARGAR PUBLICACIONES
========================================== */

async function cargarPublicaciones(){

    feed.innerHTML =
        `
        <div class="loading">
            Cargando publicaciones...
        </div>
        `;


    try{

        /*
         * No agregamos filtros adicionales.
         *
         * Así mantenemos la consulta simple
         * y evitamos nuevos problemas de índices.
         */

        const consulta =
            query(
                collection(
                    db,
                    "publicaciones"
                ),
                orderBy(
                    "fecha",
                    "desc"
                ),
                limit(30)
            );


        const snapshot =
            await getDocs(
                consulta
            );


        const publicaciones =
            [];


        snapshot.forEach(
            (documento) => {

                publicaciones.push({

                    id:
                        documento.id,

                    ...documento.data()

                });

            }
        );


        if(
            publicaciones.length === 0
        ){

            feed.innerHTML =
                `
                <div class="empty">

                    <div
                        style="
                            font-size:40px;
                            margin-bottom:10px;
                        "
                    >
                        📝
                    </div>

                    <strong>
                        Todavía no hay publicaciones.
                    </strong>

                    <br><br>

                    Sé el primero en publicar
                    algo en la Red GESBASE.

                </div>
                `;

            return;

        }


        feed.innerHTML =
            "";


        /*
         * Importante:
         *
         * Usamos for...of porque necesitamos
         * esperar a que se cargue el perfil
         * actual de cada autor.
         */

        for(
            const publicacion of publicaciones
        ){

            await renderizarPublicacion(
                publicacion
            );

        }


    }catch(error){

        console.error(
            "Error cargando publicaciones:",
            error
        );


        feed.innerHTML =
            `
            <div class="empty">

                No se pudieron cargar
                las publicaciones.

                <br><br>

                <small>
                    ${escaparHTML(
                        error.message
                    )}
                </small>

            </div>
            `;

    }

}



/* ==========================================
   RENDER PUBLICACION
========================================== */

async function renderizarPublicacion(
    publicacion
){

    /*
     * BUSCAMOS EL PERFIL ACTUAL
     * DEL AUTOR.
     */

    const perfilAutor =
        await obtenerPerfil(
            publicacion.uid
        );


    /*
     * El perfil actual tiene prioridad
     * sobre los datos viejos guardados
     * dentro de la publicación.
     */

    const nombreAutor =
        obtenerNombre(
            perfilAutor,
            publicacion.nombreCompleto
        );


    const tipoAutor =
        perfilAutor.tipoPerfil ||
        publicacion.tipoPerfil ||
        "Usuario GESBASE";


    const fotoAutor =
        perfilAutor.fotoPerfil ||
        publicacion.fotoPerfil ||
        "";


    const elemento =
        document.createElement(
            "article"
        );


    elemento.className =
        "post";


    elemento.dataset.id =
        publicacion.id;


    const fecha =
        formatearFecha(
            publicacion.fecha
        );


    let avatarHTML;


    if(fotoAutor){

        avatarHTML =
            `
            <img
                src="${escaparHTML(
                    fotoAutor
                )}"
                alt=""
                onerror="
                    this.style.display='none';
                    this.parentElement.textContent='${escaparHTML(
                        obtenerIniciales(nombreAutor)
                    )}';
                "
            >
            `;

    }else{

        avatarHTML =
            escaparHTML(
                obtenerIniciales(
                    nombreAutor
                )
            );

    }


    elemento.innerHTML =
        `

        <div class="post-header">

            <div class="post-avatar">

                ${avatarHTML}

            </div>


            <div>

                <div class="post-author">

                    ${escaparHTML(
                        nombreAutor
                    )}

                </div>


                <div class="post-type">

                    ${escaparHTML(
                        tipoAutor
                    )}

                </div>


                <div class="post-date">

                    ${escaparHTML(
                        fecha
                    )}

                </div>

            </div>

        </div>


        <div class="post-text">

            ${escaparHTML(
                publicacion.texto || ""
            )}

        </div>


        <div class="post-actions">


            <button
                class="post-action btn-like"
                data-id="${escaparHTML(
                    publicacion.id
                )}"
            >
                👍 Me gusta
            </button>


            <button
                class="post-action btn-comment"
                data-id="${escaparHTML(
                    publicacion.id
                )}"
            >
                💬 Comentar
            </button>


            <button
                class="post-action btn-share"
                data-id="${escaparHTML(
                    publicacion.id
                )}"
            >
                ↗ Compartir
            </button>


        </div>

        `;


    feed.appendChild(
        elemento
    );

}



/* ==========================================
   CREAR PUBLICACION
========================================== */

async function crearPublicacion(){

    const texto =
        textoPublicacion.value.trim();


    if(!texto){

        mostrarToast(
            "Escribí algo antes de publicar."
        );

        return;

    }


    const btn =
        document.getElementById(
            "btnPublicar"
        );


    btn.disabled =
        true;

    btn.textContent =
        "Publicando...";


    try{

        /*
         * Obtenemos el perfil ACTUAL.
         *
         * Así las nuevas publicaciones
         * ya nacen con la foto correcta.
         */

        const perfil =
            await obtenerPerfil(
                usuarioActual.uid
            );


        const nombreCompleto =
            obtenerNombre(
                perfil,
                usuarioActual.displayName
            );


        const fotoPerfil =
            perfil.fotoPerfil ||
            "";


        const referencia =
            await addDoc(
                collection(
                    db,
                    "publicaciones"
                ),
                {

                    uid:
                        usuarioActual.uid,

                    nombreCompleto:
                        nombreCompleto,

                    tipoPerfil:
                        perfil.tipoPerfil ||
                        "Usuario GESBASE",

                    texto:
                        texto,

                    fotoPerfil:
                        fotoPerfil,

                    fecha:
                        serverTimestamp(),

                    likes:
                        0,

                    comentarios:
                        0

                }
            );


        textoPublicacion.value =
            "";


        modalPublicacion.classList.remove(
            "show"
        );


        mostrarToast(
            "Publicación creada correctamente."
        );


        /*
         * Actualizamos el feed.
         */

        await cargarPublicaciones();


    }catch(error){

        console.error(
            "Error creando publicación:",
            error
        );


        mostrarToast(
            "No se pudo crear la publicación."
        );

    }finally{

        btn.disabled =
            false;

        btn.textContent =
            "Publicar";

    }

}



/* ==========================================
   COMPARTIR
========================================== */

async function compartirPublicacion(
    id
){

    const url =
        `${location.origin}${location.pathname}?publicacion=${encodeURIComponent(id)}`;


    const texto =
        "Mirá esta publicación en Red GESBASE";


    try{

        if(
            navigator.share
        ){

            await navigator.share({

                title:
                    "Red GESBASE",

                text:
                    texto,

                url:
                    url

            });

            return;

        }


        if(
            navigator.clipboard
        ){

            await navigator.clipboard.writeText(
                url
            );


            mostrarToast(
                "Enlace copiado."
            );


            return;

        }


        mostrarToast(
            url
        );


    }catch(error){

        /*
         * El usuario puede cancelar
         * navigator.share().
         *
         * No mostramos error en ese caso.
         */

        console.log(
            "Compartir cancelado:",
            error
        );

    }

}



/* ==========================================
   PUBLICACION ESPECIFICA
========================================== */

async function cargarPublicacionCompartida(){

    const parametros =
        new URLSearchParams(
            location.search
        );


    const id =
        parametros.get(
            "publicacion"
        );


    if(!id){
        return;
    }


    try{

        const referencia =
            doc(
                db,
                "publicaciones",
                id
            );


        const snap =
            await getDoc(
                referencia
            );


        if(!snap.exists()){

            mostrarToast(
                "La publicación no existe."
            );

            return;

        }


        const publicacion = {

            id:
                snap.id,

            ...snap.data()

        };


        feed.innerHTML =
            "";


        const titulo =
            document.createElement(
                "div"
            );


        titulo.style.cssText =
            `
            color:#12343B;
            font-size:20px;
            font-weight:800;
            margin-bottom:0;
            `;


        titulo.textContent =
            "Publicación compartida";


        feed.appendChild(
            titulo
        );


        await renderizarPublicacion(
            publicacion
        );


    }catch(error){

        console.error(
            error
        );

    }

}



/* ==========================================
   CERRAR MODAL
========================================== */

function cerrarModal(){

    modalPublicacion.classList.remove(
        "show"
    );

    textoPublicacion.value =
        "";

}

/* ==========================================
   CLIC EN ACCIONES DEL FEED
========================================== */

feed.addEventListener(
    "click",
    async (event) => {


        const like =
            event.target.closest(
                ".btn-like"
            );


        if(like){

            like.classList.toggle(
                "liked"
            );


            like.textContent =
                like.classList.contains(
                    "liked"
                )
                    ? "👍 Te gusta"
                    : "👍 Me gusta";


            return;

        }


        const comment =
            event.target.closest(
                ".btn-comment"
            );


        if(comment){

            mostrarToast(
                "Comentarios próximamente."
            );


            return;

        }


        const share =
            event.target.closest(
                ".btn-share"
            );


        if(share){

            await compartirPublicacion(
                share.dataset.id
            );


            return;

        }

    }
);



/* ==========================================
   CERRAR MODAL TOCANDO AFUERA
========================================== */

modalPublicacion.addEventListener(
    "click",
    (event) => {

        if(
            event.target ===
            modalPublicacion
        ){

            cerrarModal();

        }

    }
);



/* ==========================================
   ESCAPE
========================================== */

document.addEventListener(
    "keydown",
    (event) => {

        if(
            event.key === "Escape"
        ){

            cerrarModal();

        }

    }
);



/* ==========================================
   AUTENTICACION
========================================== */

onAuthStateChanged(
    auth,
    async (user) => {

        if(!user){

            location.href =
                "red-login.html";

            return;

        }


        usuarioActual =
            user;


        try{

            await cargarUsuario();


            /*
             * Si venimos de un enlace
             * compartido, mostramos solamente
             * esa publicación.
             *
             * Si no, mostramos el feed normal.
             */

            const parametros =
                new URLSearchParams(
                    location.search
                );


            if(
                parametros.has(
                    "publicacion"
                )
            ){

                await cargarPublicacionCompartida();

            }else{

                await cargarPublicaciones();

            }


        }catch(error){

            console.error(
                "Error iniciando Red GESBASE:",
                error
            );


            feed.innerHTML =
                `
                <div class="empty">

                    No se pudo iniciar la Red GESBASE.

                    <br><br>

                    <small>
                        ${escaparHTML(
                            error.message
                        )}
                    </small>

                </div>
                `;

        }

    }
);

</script>
