<!DOCTYPE html>
<html lang="es-AR">

<head>

<meta charset="UTF-8">

<meta name="viewport"
      content="width=device-width, initial-scale=1.0, viewport-fit=cover">

<meta name="theme-color" content="#12343B">

<meta name="description"
      content="Red GESBASE - Red profesional para conectar personas, profesionales, trabajadores, empresas y comercios.">

<title>Red GESBASE</title>


<style>

/* =========================================================
   BASE
========================================================= */

*{
    box-sizing:border-box;
    margin:0;
    padding:0;
}

body{
    font-family:Arial,Helvetica,sans-serif;
    background:#eef2f3;
    color:#17252a;
    padding-bottom:90px;
}

button,
input,
textarea{
    font-family:inherit;
}


/* =========================================================
   HEADER
========================================================= */

.header{
    position:sticky;
    top:0;
    z-index:1000;

    background:#12343B;
    color:#fff;

    box-shadow:0 2px 10px rgba(0,0,0,.15);
}

.header-inner{
    width:100%;
    max-width:900px;
    margin:auto;
    padding:13px 15px;
}

.header-row{
    display:flex;
    align-items:center;
    justify-content:space-between;
}

.brand{
    display:flex;
    align-items:center;
    gap:10px;
}

.logo{
    width:42px;
    height:42px;
    border-radius:12px;

    background:#fff;
    color:#12343B;

    display:flex;
    align-items:center;
    justify-content:center;

    font-weight:900;
    font-size:20px;
}

.brand-name{
    font-size:20px;
    font-weight:800;
}

.brand-sub{
    margin-top:3px;
    font-size:11px;
    opacity:.75;
}

.header-bell{
    position:relative;

    width:42px;
    height:42px;

    border:0;
    border-radius:50%;

    background:rgba(255,255,255,.12);
    color:#fff;

    font-size:20px;
    cursor:pointer;
}

.header-bell:hover{
    background:rgba(255,255,255,.20);
}


/* =========================================================
   MAIN
========================================================= */

.main{
    width:100%;
    max-width:850px;
    margin:auto;
    padding:15px 12px 35px;
}


/* =========================================================
   BIENVENIDA
========================================================= */

.welcome{
    background:#fff;
    border-radius:18px;
    padding:16px;
    margin-bottom:13px;

    box-shadow:0 2px 9px rgba(0,0,0,.07);
}

.welcome-row{
    display:flex;
    align-items:center;
    gap:12px;
}

.welcome-avatar{
    width:52px;
    height:52px;
    min-width:52px;

    border-radius:50%;
    object-fit:cover;

    background:#12343B;
}

.welcome-iniciales{
    width:52px;
    height:52px;
    min-width:52px;

    border-radius:50%;

    background:#12343B;
    color:#fff;

    display:flex;
    align-items:center;
    justify-content:center;

    font-weight:800;
}

.welcome-title{
    font-size:17px;
    font-weight:800;
}

.welcome-sub{
    margin-top:4px;
    color:#6b7b80;
    font-size:13px;
}


/* =========================================================
   CREAR PUBLICACIÓN
========================================================= */

.crear{
    background:#fff;
    border-radius:18px;
    padding:15px;
    margin-bottom:14px;

    box-shadow:0 2px 9px rgba(0,0,0,.07);
}

.crear-row{
    display:flex;
    align-items:center;
    gap:10px;
}

.crear-avatar{
    width:43px;
    height:43px;
    min-width:43px;

    border-radius:50%;
    object-fit:cover;
    background:#12343B;
}

.crear-avatar-iniciales{
    width:43px;
    height:43px;
    min-width:43px;

    border-radius:50%;

    background:#12343B;
    color:#fff;

    display:flex;
    align-items:center;
    justify-content:center;

    font-size:13px;
    font-weight:800;
}

.crear-input{
    flex:1;

    border:1px solid #d9e1e3;
    background:#f5f7f8;

    border-radius:25px;

    padding:12px 15px;

    text-align:left;

    color:#65777c;

    cursor:pointer;
}

.crear-input:hover{
    background:#edf1f2;
}

.crear-linea{
    height:1px;
    background:#edf0f1;
    margin:12px 0 8px;
}

.crear-btn{
    width:100%;

    border:0;
    background:transparent;

    padding:8px;

    border-radius:10px;

    color:#53676d;

    font-weight:700;

    cursor:pointer;
}

.crear-btn:hover{
    background:#f1f4f5;
}


/* =========================================================
   FEED
========================================================= */

.feed{
    display:flex;
    flex-direction:column;
    gap:14px;
}


/* =========================================================
   PUBLICACIÓN
========================================================= */

.publicacion{
    background:#fff;
    border-radius:18px;
    overflow:hidden;

    box-shadow:0 2px 9px rgba(0,0,0,.07);
}

.publicacion-header{
    display:flex;
    align-items:center;
    gap:10px;

    padding:14px 15px 9px;
}

.autor-avatar{
    width:45px;
    height:45px;
    min-width:45px;

    border-radius:50%;
    object-fit:cover;

    background:#12343B;
}

.autor-iniciales{
    width:45px;
    height:45px;
    min-width:45px;

    border-radius:50%;

    background:#12343B;
    color:#fff;

    display:flex;
    align-items:center;
    justify-content:center;

    font-size:14px;
    font-weight:800;
}

.autor-info{
    flex:1;
    min-width:0;
}

.autor-nombre{
    font-size:15px;
    font-weight:800;

    overflow:hidden;
    white-space:nowrap;
    text-overflow:ellipsis;
}

.autor-tipo{
    margin-top:2px;
    color:#697b80;
    font-size:11px;
}

.fecha{
    margin-top:2px;
    color:#8b999d;
    font-size:10px;
}

.btn-opciones{
    width:36px;
    height:36px;

    border:0;
    background:transparent;

    border-radius:50%;

    color:#68797e;

    font-size:22px;

    cursor:pointer;
}

.btn-opciones:hover{
    background:#eef2f3;
}

.publicacion-texto{
    padding:5px 15px 15px;

    font-size:15px;
    line-height:1.55;

    white-space:pre-wrap;
    overflow-wrap:anywhere;
}

.publicacion-stats{
    display:flex;
    justify-content:space-between;

    padding:8px 15px;

    border-top:1px solid #f0f2f3;

    color:#718287;
    font-size:12px;
}

.publicacion-actions{
    display:flex;

    border-top:1px solid #edf0f1;

    padding:4px 7px;
}

.accion{
    flex:1;

    border:0;
    background:transparent;

    border-radius:9px;

    padding:10px 4px;

    color:#5d7177;

    font-size:13px;
    font-weight:700;

    cursor:pointer;
}

.accion:hover{
    background:#f1f4f5;
}

.accion.liked{
    color:#12343B;
}


/* =========================================================
   ESTADOS
========================================================= */

.estado{
    background:#fff;

    border-radius:18px;

    padding:35px 20px;

    text-align:center;

    color:#6d7e83;

    box-shadow:0 2px 9px rgba(0,0,0,.06);
}

.estado-icono{
    font-size:38px;
    margin-bottom:9px;
}

.estado-title{
    color:#30474d;
    font-size:16px;
    font-weight:800;
}

.estado-text{
    margin-top:6px;
    font-size:13px;
}


/* =========================================================
   MODAL GENERAL
========================================================= */

.modal{
    position:fixed;
    inset:0;

    z-index:3000;

    display:none;
    align-items:center;
    justify-content:center;

    padding:15px;

    background:rgba(0,0,0,.58);
}

.modal.visible{
    display:flex;
}

.modal-box{
    width:100%;
    max-width:540px;

    max-height:calc(100vh - 30px);

    background:#fff;

    border-radius:20px;

    overflow:hidden;

    box-shadow:0 15px 50px rgba(0,0,0,.25);

    display:flex;
    flex-direction:column;
}

.modal-header{
    display:flex;
    align-items:center;
    justify-content:space-between;

    padding:15px;

    border-bottom:1px solid #edf0f1;
}

.modal-title{
    font-size:18px;
    font-weight:800;
}

.modal-close{
    width:36px;
    height:36px;

    border:0;
    border-radius:50%;

    background:#eef2f3;

    color:#455c62;

    font-size:20px;

    cursor:pointer;
}

.modal-body{
    padding:15px;

    overflow-y:auto;
}

.modal-textarea{
    width:100%;

    min-height:170px;

    resize:vertical;

    border:1px solid #d7e0e2;

    border-radius:14px;

    padding:13px;

    outline:none;

    font-size:15px;

    line-height:1.5;
}

.modal-textarea:focus{
    border-color:#12343B;
}

.modal-footer{
    display:flex;
    gap:9px;

    padding:0 15px 15px;
}

.modal-btn{
    flex:1;

    border:0;

    border-radius:12px;

    padding:12px;

    font-weight:800;

    cursor:pointer;
}

.btn-cancelar{
    background:#edf2f3;
    color:#345057;
}

.btn-confirmar{
    background:#12343B;
    color:#fff;
}

.modal-btn:disabled{
    opacity:.6;
}


/* =========================================================
   COMENTARIOS
========================================================= */

.comentarios-box{
    max-width:600px;
}

.lista-comentarios{
    padding:14px;

    overflow-y:auto;

    max-height:55vh;

    display:flex;
    flex-direction:column;

    gap:11px;
}

.comentario{
    display:flex;

    align-items:flex-start;

    gap:9px;
}

.comentario-avatar{
    width:38px;
    height:38px;

    min-width:38px;

    border-radius:50%;

    object-fit:cover;

    background:#12343B;
}

.comentario-iniciales{
    width:38px;
    height:38px;

    min-width:38px;

    border-radius:50%;

    background:#12343B;

    color:#fff;

    display:flex;
    align-items:center;
    justify-content:center;

    font-size:11px;
    font-weight:800;
}

.comentario-burbuja{
    flex:1;

    min-width:0;

    background:#f0f3f4;

    border-radius:14px;

    padding:9px 11px;
}

.comentario-nombre{
    font-size:12px;
    font-weight:800;
    color:#233b41;
}

.comentario-texto{
    margin-top:4px;

    font-size:13px;
    line-height:1.4;

    white-space:pre-wrap;
    overflow-wrap:anywhere;
}

.comentario-fecha{
    margin-top:5px;

    color:#809095;
    font-size:10px;
}

.comentario-eliminar{
    margin-top:5px;

    border:0;
    background:transparent;

    color:#c62828;

    font-size:10px;
    font-weight:700;

    cursor:pointer;
}

.sin-comentarios{
    text-align:center;

    padding:30px 15px;

    color:#718287;

    font-size:13px;
}

.comentario-form{
    display:flex;
    gap:8px;

    padding:11px;

    border-top:1px solid #e1e7e8;
}

.comentario-input{
    flex:1;

    border:1px solid #d5dfe1;

    border-radius:22px;

    padding:11px 14px;

    outline:none;

    font-size:13px;
}

.comentario-enviar{
    width:43px;
    height:43px;

    border:0;
    border-radius:50%;

    background:#12343B;

    color:#fff;

    font-size:17px;

    cursor:pointer;
}


/* =========================================================
   MENÚ DE PUBLICACIÓN
========================================================= */

.menu-publicacion{
    position:fixed;

    inset:0;

    z-index:4000;

    display:none;
}

.menu-publicacion.visible{
    display:block;
}

.menu-fondo{
    position:absolute;

    inset:0;

    background:rgba(0,0,0,.18);
}

.menu-panel{
    position:absolute;

    right:14px;
    top:72px;

    width:215px;

    background:#fff;

    border-radius:14px;

    overflow:hidden;

    box-shadow:0 8px 30px rgba(0,0,0,.20);
}

.menu-item{
    width:100%;

    border:0;

    background:#fff;

    padding:14px;

    text-align:left;

    font-size:14px;

    cursor:pointer;
}

.menu-item:hover{
    background:#f1f4f5;
}

.menu-eliminar{
    color:#c62828;
    font-weight:700;
}


/* =========================================================
   NAV
========================================================= */

.nav{
    position:fixed;

    left:0;
    right:0;
    bottom:0;

    z-index:2000;

    height:72px;

    background:#fff;

    border-top:1px solid #dce4e6;

    box-shadow:
        0 -3px 15px rgba(0,0,0,.09);

    padding-bottom:
        env(safe-area-inset-bottom);
}

.nav-inner{
    width:100%;
    max-width:900px;

    height:100%;

    margin:auto;

    display:flex;
}

.nav-item{
    position:relative;

    flex:1;

    border:0;

    background:#fff;

    color:#718288;

    display:flex;

    flex-direction:column;

    align-items:center;
    justify-content:center;

    gap:2px;

    font-size:10px;
    font-weight:700;

    cursor:pointer;
}

.nav-item.active{
    color:#12343B;
}

.nav-icon{
    font-size:21px;
    line-height:25px;
}

.nav-item.active::before{
    content:"";

    position:absolute;

    top:0;

    left:30%;
    right:30%;

    height:3px;

    background:#12343B;

    border-radius:0 0 5px 5px;
}

.badge{
    position:absolute;

    top:5px;

    left:calc(50% + 7px);

    min-width:18px;
    height:18px;

    padding:0 5px;

    border-radius:20px;

    background:#d62828;

    color:#fff;

    border:2px solid #fff;

    display:flex;

    align-items:center;
    justify-content:center;

    font-size:9px;
    font-weight:800;
}


/* =========================================================
   TOAST
========================================================= */

.toast{
    position:fixed;

    left:50%;
    bottom:88px;

    z-index:5000;

    max-width:90%;

    transform:
        translate(-50%,20px);

    background:#12343B;

    color:#fff;

    padding:11px 16px;

    border-radius:12px;

    font-size:13px;

    text-align:center;

    opacity:0;

    pointer-events:none;

    transition:.25s;
}

.toast.show{
    opacity:1;

    transform:
        translate(-50%,0);
}


/* =========================================================
   DESKTOP
========================================================= */

@media(min-width:1000px){

    body{
        padding-bottom:30px;
    }

    .nav{
        left:50%;
        right:auto;
        bottom:18px;

        width:min(760px,92%);

        height:66px;

        transform:translateX(-50%);

        border:1px solid #dce4e6;

        border-radius:18px;

        overflow:hidden;
    }

    .toast{
        bottom:100px;
    }

}

</style>

</head>


<body>


<!-- =========================================================
     HEADER
========================================================= -->

<header class="header">

    <div class="header-inner">

        <div class="header-row">

            <div class="brand">

                <div class="logo">
                    G
                </div>

                <div>

                    <div class="brand-name">
                        Red GESBASE
                    </div>

                    <div class="brand-sub">
                        Red profesional
                    </div>

                </div>

            </div>


            <button
                class="header-bell"
                type="button"
                onclick="location.href='red-notificaciones.html'"
            >
                🔔
            </button>

        </div>

    </div>

</header>


<!-- =========================================================
     MAIN
========================================================= -->

<main class="main">


<!-- BIENVENIDA -->

<section class="welcome">

    <div class="welcome-row">

        <div id="welcomeAvatar"></div>

        <div>

            <div
                id="welcomeTitle"
                class="welcome-title"
            >
                ¡Bienvenido a Red GESBASE!
            </div>

            <div class="welcome-sub">
                Compartí y conectate con la comunidad.
            </div>

        </div>

    </div>

</section>


<!-- CREAR -->

<section class="crear">

    <div class="crear-row">

        <div id="crearAvatar"></div>

        <button

        </button>

    </div>


    <div class="crear-linea"></div>


    <button

    </button>

</section>


<!-- FEED -->

<section
    id="feed"
    class="feed"
></section>


<!-- ESTADO -->

<section

    class="estado"
    style="display:none;"
>

    <div class="estado-icono">
        📭
    </div>

    <div class="estado-title">
        Todavía no hay publicaciones
    </div>

    <div class="estado-text">
        Sé el primero en publicar en Red GESBASE.
    </div>

</section>


</main>


<!-- =========================================================
     MODAL CREAR / EDITAR
========================================================= -->

<div
    id="modalPublicacion"
    class="modal"
>

    <div class="modal-box">

        <div class="modal-header">

            <div
                id="modalPublicacionTitulo"
                class="modal-title"
            >
                Crear publicación
            </div>

            <button
                id="cerrarPublicacion"
                class="modal-close"
                type="button"
            >
                ×
            </button>

        </div>


        <div class="modal-body">

            <textarea
                id="textoPublicacion"
                class="modal-textarea"
                maxlength="5000"
                placeholder="¿Qué querés compartir con la Red GESBASE?"
            ></textarea>

        </div>


        <div class="modal-footer">

            <button
                id="cancelarPublicacion"
                class="modal-btn btn-cancelar"
                type="button"
            >
                Cancelar
            </button>

            <button
                id="guardarPublicacion"
                class="modal-btn btn-confirmar"
                type="button"
            >
                Publicar
            </button>

        </div>

    </div>

</div>


<!-- =========================================================
     MODAL COMENTARIOS
========================================================= -->

<div
    id="modalComentarios"
    class="modal"
>

    <div class="modal-box comentarios-box">

        <div class="modal-header">

            <div
                id="tituloComentarios"
                class="modal-title"
            >
                Comentarios
            </div>

            <button
                id="cerrarComentarios"
                class="modal-close"
                type="button"
            >
                ×
            </button>

        </div>


        <div
            id="listaComentarios"
            class="lista-comentarios"
        ></div>


        <form
            id="formComentario"
            class="comentario-form"
        >

            <input
                id="inputComentario"
                class="comentario-input"
                type="text"
                maxlength="1000"
                autocomplete="off"
                placeholder="Escribí un comentario..."
            >

            <button
                class="comentario-enviar"
                type="submit"
            >
                ➤
            </button>

        </form>

    </div>

</div>


<!-- =========================================================
     MENÚ PUBLICACIÓN
========================================================= -->

<div
    id="menuPublicacion"
    class="menu-publicacion"
>

    <div
        id="menuFondo"
        class="menu-fondo"
    ></div>


    <div class="menu-panel">

        <button
            id="editarPublicacion"
            class="menu-item"
            type="button"
        >
            ✏️ Editar publicación
        </button>


        <button
            id="eliminarPublicacion"
            class="menu-item menu-eliminar"
            type="button"
        >
            🗑️ Eliminar publicación
        </button>

    </div>

</div>


<!-- =========================================================
     TOAST
========================================================= -->

<div
    id="toast"
    class="toast"
></div>


<!-- =========================================================
     NAV
========================================================= -->

<nav class="nav">

    <div class="nav-inner">


        <button
            class="nav-item active"
            type="button"

        >

            <span class="nav-icon">
                🏠
            </span>

            <span>
                Inicio
            </span>

        </button>


        <button
            class="nav-item"
            type="button"

            <span class="nav-icon">
                🔎
            </span>

            <span>
                Buscar
            </span>

        </button>


        <button
            class="nav-item"
            type="button"
            onclick="location.href='conexiones.html'"
        >

            <span class="nav-icon">

            </span>

            <span>
                Conexiones
            </span>

        </button>


        <button
            class="nav-item"
            type="button"
            onclick="location.href='red-notificaciones.html'"
        >

            <span class="nav-icon">
                🔔
            </span>

            <span>
                Notificaciones
            </span>

            <span

            </span>

        </button>


        <button

            type="button"

            <span class="nav-icon">
                👤
            </span>

            <span>
                Perfil
            </span>

        </button>


    </div>

</nav>


<!-- =========================================================
     FIREBASE
========================================================= -->

<script type="module">


import {
    auth,
    db
} from "./Js/firebase.js";


import {
    onAuthStateChanged
} from "https://www.gstatic.com/firebasejs/12.18.0/firebase-auth.js";


import {
    collection,
    query,
    orderBy,
    limit,
    onSnapshot,
    addDoc,
    getDoc,
    getDocs,
    doc,
    setDoc,
    updateDoc,
    deleteDoc,
    where,
    serverTimestamp,
    increment
} from "https://www.gstatic.com/firebasejs/12.18.0/firebase-firestore.js";


/* =========================================================
   VARIABLES
========================================================= */

let usuarioActual = null;

/* =========================================================
   PERFIL ACTUAL
========================================================= */

async function cargarPerfilActual(){

    try{

        const ref =
            doc(
                db,
                "usuariosRed",
                usuarioActual.uid
            );


        const snap =
            await getDoc(ref);


        if(snap.exists()){

            perfilActual =
                snap.data();

            perfilesCache.set(
                usuarioActual.uid,
                perfilActual
            );

        }
        else{

            perfilActual = {

                uid:
                    usuarioActual.uid,

                nombreCompleto:
                    usuarioActual.displayName ||
                    usuarioActual.email ||
                    "Usuario GESBASE",

                tipoPerfil:
                    "persona",

                fotoPerfil:
                    usuarioActual.photoURL ||
                    ""

            };

        }


        const nombre =
            obtenerNombre(
                perfilActual
            );


        welcomeTitle.textContent =
            "¡Hola, " + nombre + "!";


        colocarAvatar(
            welcomeAvatar,
            perfilActual.fotoPerfil ||
            perfilActual.fotoURL ||
            usuarioActual.photoURL ||
            "",
            nombre,
            "welcome"
        );


        colocarAvatar(
            crearAvatar,
            perfilActual.fotoPerfil ||
            perfilActual.fotoURL ||
            usuarioActual.photoURL ||
            "",
            nombre,
            "crear"
        );


    }catch(error){

        console.error(
            "Error perfil:",
            error
        );

    }

}


/* =========================================================
   OBTENER PERFIL
========================================================= */

async function obtenerPerfil(uid){

    if(!uid){

        return null;

    }


    if(
        perfilesCache.has(uid)
    ){

        return perfilesCache.get(uid);

    }


    try{

        const snap =
            await getDoc(
                doc(
                    db,
                    "usuariosRed",
                    uid
                )
            );


        if(snap.exists()){

            const perfil =
                snap.data();


            perfilesCache.set(
                uid,
                perfil
            );


            return perfil;

        }

    }catch(error){

        console.warn(
            "Perfil no disponible:",
            error
        );

    }


    return null;

}


/* =========================================================
   NOMBRE
========================================================= */

function obtenerNombre(perfil){

    if(!perfil){

        return "Usuario GESBASE";

    }


    return (
        perfil.nombreCompleto ||
        perfil.nombre ||
        perfil.nombreEmpresa ||
        perfil.razonSocial ||
        "Usuario GESBASE"
    );

}


/* =========================================================
   AVATAR
========================================================= */

function colocarAvatar(
    contenedor,
    foto,
    nombre,
    tipo
){

    contenedor.innerHTML = "";


    if(foto){

        const img =
            document.createElement("img");


        img.src =
            foto;

        img.alt =
            nombre;

        img.loading =
            "lazy";


        if(tipo === "welcome"){

            img.className =
                "welcome-avatar";

        }
        else{

            img.className =
                "crear-avatar";

        }


        img.onerror = () => {

            contenedor.innerHTML = "";

            const div =
                document.createElement("div");


            div.className =
                tipo === "welcome"
                    ? "welcome-iniciales"
                    : "crear-avatar-iniciales";


            div.textContent =
                iniciales(nombre);


            contenedor.appendChild(
                div
            );

        };


        contenedor.appendChild(
            img
        );

        return;

    }


    const div =
        document.createElement("div");


    div.className =
        tipo === "welcome"
            ? "welcome-iniciales"
            : "crear-avatar-iniciales";


    div.textContent =
        iniciales(nombre);


    contenedor.appendChild(
        div
    );

}


/* =========================================================
   AVATAR PUBLICACIÓN
========================================================= */

function crearAvatarPublicacion(
    foto,
    nombre
){

    if(foto){

        const img =
            document.createElement("img");

        img.className =
            "autor-avatar";

        img.src =
            foto;

        img.alt =
            nombre;

        img.loading =
            "lazy";


        img.onerror = () => {

            const div =
                document.createElement("div");

            div.className =
                "autor-iniciales";

            div.textContent =
                iniciales(nombre);

            img.replaceWith(
                div
            );

        };


        return img;

    }


    const div =
        document.createElement("div");

    div.className =
        "autor-iniciales";

    div.textContent =
        iniciales(nombre);


    return div;

}


/* =========================================================
   INICIALES
========================================================= */

function iniciales(nombre){

    if(!nombre){

        return "G";

    }


    const partes =
        String(nombre)
            .trim()
            .split(/\s+/)
            .filter(Boolean);


    if(
        partes.length === 1
    ){

        return partes[0]
            .substring(0,2)
            .toUpperCase();

    }


    return (
        partes[0][0] +
        partes[partes.length - 1][0]
    ).toUpperCase();

}


/* =========================================================
   TIPO
========================================================= */

function textoTipo(tipo){

    if(!tipo){

        return "Usuario";

    }


    const t =
        String(tipo)
            .toLowerCase();


    if(t.includes("empresa")){

        return "Empresa";

    }

    if(
        t.includes("profes")
    ){

        return "Profesional";

    }

    if(
        t.includes("trabaj") ||
        t.includes("emple")
    ){

        return "Trabajador";

    }

    if(
        t.includes("comerc") ||
        t.includes("negocio")
    ){

        return "Comercio";

    }


    return "Usuario";

}


/* =========================================================
   FECHA
========================================================= */

function fechaTexto(timestamp){

    if(!timestamp){

        return "Ahora";

    }


    try{

        const fecha =
            timestamp.toDate
                ? timestamp.toDate()
                : new Date(timestamp);


        if(
            Number.isNaN(
                fecha.getTime()
            )
        ){

            return "Ahora";

        }


        return fecha.toLocaleString(
            "es-AR",
            {
                day:"2-digit",
                month:"2-digit",
                year:"numeric",
                hour:"2-digit",
                minute:"2-digit"
            }
        );

    }catch(error){

        return "Ahora";

    }

}


/* =========================================================
   FEED
========================================================= */

function cargarFeed(){

    if(publicacionesListener){

        return;

    }


    const consulta =
        query(
            collection(
                db,
                "publicaciones"
            ),
            orderBy(
                "fecha",
                "desc"
            ),
            limit(30)
        );


    publicacionesListener =
        onSnapshot(
            consulta,
            async snapshot => {

                feed.innerHTML = "";


                if(snapshot.empty){

                    estado.style.display =
                        "block";

                    return;

                }


                estado.style.display =
                    "none";


                for(
                    const documento
                    of snapshot.docs
                ){

                    const publicacion = {

                        id:
                            documento.id,

                        ...documento.data()

                    };


                    const elemento =
                        await crearPublicacionElemento(
                            publicacion
                        );


                    feed.appendChild(
                        elemento
                    );

                }

            },

            error => {

                console.error(
                    "Error feed:",
                    error
                );


                estado.style.display =
                    "block";


                estado.innerHTML = `

                    <div class="estado-icono">
                        ⚠️
                    </div>

                    <div class="estado-title">
                        No se pudieron cargar las publicaciones
                    </div>

                    <div class="estado-text">
                        Verificá tu conexión e intentá nuevamente.
                    </div>

                `;

            }
        );

}


/* =========================================================
   CREAR ELEMENTO PUBLICACIÓN
========================================================= */

async function crearPublicacionElemento(
    publicacion
){

    const autorUid =
        publicacion.uid ||
        publicacion.autorUid ||
        "";


    const perfil =
        await obtenerPerfil(
            autorUid
        );


    const nombre =
        obtenerNombre(
            perfil
        ) !== "Usuario GESBASE"
            ? obtenerNombre(perfil)
            : (
                publicacion.nombreCompleto ||
                "Usuario GESBASE"
            );


    const foto =
        perfil?.fotoPerfil ||
        perfil?.fotoURL ||
        publicacion.fotoPerfil ||
        publicacion.fotoURL ||
        "";


    const tipo =
        perfil?.tipoPerfil ||
        perfil?.tipo ||
        publicacion.tipoPerfil ||
        "usuario";


    const tarjeta =
        document.createElement("article");


    tarjeta.className =
        "publicacion";


    tarjeta.dataset.id =
        publicacion.id;


    /* HEADER */

    const header =
        document.createElement("div");

    header.className =
        "publicacion-header";


    header.appendChild(
        crearAvatarPublicacion(
            foto,
            nombre
        )
    );


    const info =
        document.createElement("div");

    info.className =
        "autor-info";


    const nombreEl =
        document.createElement("div");

    nombreEl.className =
        "autor-nombre";

    nombreEl.textContent =
        nombre;


    const tipoEl =
        document.createElement("div");

    tipoEl.className =
        "autor-tipo";

    tipoEl.textContent =
        textoTipo(tipo);


    const fechaEl =
        document.createElement("div");

    fechaEl.className =
        "fecha";

    fechaEl.textContent =
        fechaTexto(
            publicacion.fecha
        );


    info.appendChild(
        nombreEl
    );

    info.appendChild(
        tipoEl
    );

    info.appendChild(
        fechaEl
    );


    header.appendChild(
        info
    );


    /* MENÚ ⋯ */

    const opciones =
        document.createElement("button");

    opciones.className =
        "btn-opciones";

    opciones.type =
        "button";

    opciones.textContent =
        "⋯";


    /*
     * El menú solamente se muestra
     * si la publicación pertenece
     * al usuario actual.
     */

    if(
        autorUid ===
        usuarioActual.uid
    ){

        opciones.addEventListener(
            "click",
            event => {

                event.stopPropagation();

                abrirMenuPublicacion(
                    publicacion
                );

            }
        );

    }
    else{

        opciones.style.visibility =
            "hidden";

    }


    header.appendChild(
        opciones
    );


    tarjeta.appendChild(
        header
    );


    /* TEXTO */

    const texto =
        document.createElement("div");

    texto.className =
        "publicacion-texto";

    texto.textContent =
        publicacion.texto || "";


    tarjeta.appendChild(
        texto
    );


    /* ESTADÍSTICAS */

    const stats =
        document.createElement("div");

    stats.className =
        "publicacion-stats";


    const likes =
        document.createElement("span");

    likes.textContent =
        "👍 " +
        Number(
            publicacion.likes || 0
        );


    const comentarios =
        document.createElement("span");

    comentarios.textContent =
        Number(
            publicacion.comentarios || 0
        ) +
        (
            Number(
                publicacion.comentarios || 0
            ) === 1
                ? " comentario"
                : " comentarios"
        );


    stats.appendChild(
        likes
    );

    stats.appendChild(
        comentarios
    );


    tarjeta.appendChild(
        stats
    );


    /* ACCIONES */

    const acciones =
        document.createElement("div");

    acciones.className =
        "publicacion-actions";


    const like =
        document.createElement("button");

    like.className =
        "accion";

    like.type =
        "button";

    like.textContent =
        "👍 Me gusta";


    like.addEventListener(
        "click",
        () => {

            like.classList.toggle(
                "liked"
            );

        }
    );


    const comentar =
        document.createElement("button");

    comentar.className =
        "accion";

    comentar.type =
        "button";

    comentar.textContent =
        "💬 Comentar";


    comentar.addEventListener(
        "click",
        () => {

            abrirComentarios(
                publicacion
            );

        }
    );


    const compartir =
        document.createElement("button");

    compartir.className =
        "accion";

    compartir.type =
        "button";

    compartir.textContent =
        "↗ Compartir";


    compartir.addEventListener(
        "click",
        () => {

            compartirPublicacion(
                publicacion
            );

        }
    );


    acciones.appendChild(
        like
    );

    acciones.appendChild(
        comentar
    );

    acciones.appendChild(
        compartir
    );


    tarjeta.appendChild(
        acciones
    );


    return tarjeta;

}

/* =========================================================
   GUARDAR / EDITAR PUBLICACIÓN
========================================================= */

guardarPublicacion.addEventListener(
    "click",
    async () => {

        const texto =
            textoPublicacion.value
                .trim();


        if(!texto){

            mostrarToast(
                "Escribí algo antes de publicar."
            );

            return;

        }


        if(!usuarioActual){

            mostrarToast(
                "Tu sesión no está disponible."
            );

            return;

        }


        guardarPublicacion.disabled =
            true;


        try{

            /* =========================================
               EDITAR
            ========================================= */

            if(publicacionEditando){

                /*
                 * Verificación adicional:
                 * volvemos a leer la publicación
                 * antes de modificarla.
                 */

                const ref =
                    doc(
                        db,
                        "publicaciones",
                        publicacionEditando.id
                    );


                const snap =
                    await getDoc(ref);


                if(!snap.exists()){

                    mostrarToast(
                        "La publicación ya no existe."
                    );

                    cerrarModalPublicacion();

                    return;

                }


                const datos =
                    snap.data();


                if(
                    datos.uid !==
                    usuarioActual.uid
                ){

                    mostrarToast(
                        "No podés editar esta publicación."
                    );

                    cerrarModalPublicacion();

                    return;

                }


                await updateDoc(
                    ref,
                    {
                        texto:
                            texto,

                        editado:
                            true,

                        fechaEdicion:
                            serverTimestamp()
                    }
                );


                mostrarToast(
                    "Publicación editada."
                );


            }

            /* =========================================
               CREAR
            ========================================= */

            else{

                const perfil =
                    perfilActual ||
                    {};


                const nombre =
                    obtenerNombre(
                        perfil
                    );


                await addDoc(
                    collection(
                        db,
                        "publicaciones"
                    ),
                    {

                        uid:
                            usuarioActual.uid,

                        nombreCompleto:
                            nombre,

                        tipoPerfil:
                            perfil.tipoPerfil ||
                            perfil.tipo ||
                            "persona",

                        texto:
                            texto,

                        fotoPerfil:
                            perfil.fotoPerfil ||
                            perfil.fotoURL ||
                            usuarioActual.photoURL ||
                            "",

                        fecha:
                            serverTimestamp(),

                        likes:
                            0,

                        comentarios:
                            0

                    }
                );


                mostrarToast(
                    "¡Publicación realizada!"
                );

            }


            cerrarModalPublicacion();


        }catch(error){

            console.error(
                "ERROR PUBLICANDO:",
                error
            );


            console.error(
                "Código:",
                error.code
            );


            console.error(
                "Mensaje:",
                error.message
            );


            mostrarToast(
                "No se pudo guardar la publicación."
            );


        }finally{

            guardarPublicacion.disabled =
                false;

        }

    }
);


/* =========================================================
   MENÚ PUBLICACIÓN
========================================================= */

function abrirMenuPublicacion(
    publicacion
){

    /*
     * Seguridad visual:
     * solamente el autor puede
     * abrir este menú.
     */

    if(
        !usuarioActual ||
        publicacion.uid !==
        usuarioActual.uid
    ){

        return;

    }


    publicacionMenuActual =
        publicacion;


    menuPublicacion.classList.add(
        "visible"
    );

}


function cerrarMenuPublicacion(){

    menuPublicacion.classList.remove(
        "visible"
    );

    publicacionMenuActual =
        null;

}


document.getElementById(
    "menuFondo"
).addEventListener(
    "click",
    cerrarMenuPublicacion
);


/* =========================================================
   EDITAR
========================================================= */

document.getElementById(
    "editarPublicacion"
).addEventListener(
    "click",
    async () => {

        const publicacion =
            publicacionMenuActual;


        cerrarMenuPublicacion();


        if(
            !publicacion ||
            !usuarioActual ||
            publicacion.uid !==
            usuarioActual.uid
        ){

            mostrarToast(
                "No podés editar esta publicación."
            );

            return;

        }


        publicacionEditando =
            publicacion;


        modalPublicacionTitulo.textContent =
            "Editar publicación";


        textoPublicacion.value =
            publicacion.texto || "";


        guardarPublicacion.textContent =
            "Guardar cambios";


        modalPublicacion.classList.add(
            "visible"
        );


        setTimeout(
            () => {

                textoPublicacion.focus();

            },
            100
        );

    }
);


/* =========================================================
   ELIMINAR
========================================================= */

document.getElementById(
    "eliminarPublicacion"
).addEventListener(
    "click",
    async () => {

        const publicacion =
            publicacionMenuActual;


        cerrarMenuPublicacion();


        if(
            !publicacion ||
            !usuarioActual ||
            publicacion.uid !==
            usuarioActual.uid
        ){

            mostrarToast(
                "No podés eliminar esta publicación."
            );

            return;

        }


        const confirmar =
            confirm(
                "¿Querés eliminar esta publicación?\n\nEsta acción no se puede deshacer."
            );


        if(!confirmar){

            return;

        }


        try{

            const ref =
                doc(
                    db,
                    "publicaciones",
                    publicacion.id
                );


            /*
             * Verificación final antes de borrar.
             */

            const snap =
                await getDoc(ref);


            if(!snap.exists()){

                mostrarToast(
                    "La publicación ya no existe."
                );

                return;

            }


            const datos =
                snap.data();


            if(
                datos.uid !==
                usuarioActual.uid
            ){

                mostrarToast(
                    "No tenés permiso para eliminarla."
                );

                return;

            }


            await deleteDoc(ref);


            mostrarToast(
                "Publicación eliminada."
            );


        }catch(error){

            console.error(
                "Error eliminando:",
                error
            );


            mostrarToast(
                "No se pudo eliminar la publicación."
            );

        }

    }
);


/* =========================================================
   COMENTARIOS
========================================================= */

async function abrirComentarios(
    publicacion
){

    publicacionComentariosActual =
        publicacion;


    tituloComentarios.textContent =
        "Comentarios";


    modalComentarios.classList.add(
        "visible"
    );


    listaComentarios.innerHTML = `

        <div class="sin-comentarios">
            Cargando comentarios...
        </div>

    `;


    await cargarComentarios();

}


async function cargarComentarios(){

    if(!publicacionComentariosActual){

        return;

    }


    if(comentariosListener){

        comentariosListener();

        comentariosListener =
            null;

    }


    const consulta =
        query(
            collection(
                db,
                "publicaciones",
                publicacionComentariosActual.id,
                "comentarios"
            ),
            orderBy(
                "fecha",
                "asc"
            )
        );


    comentariosListener =
        onSnapshot(
            consulta,
            async snapshot => {

                listaComentarios.innerHTML =
                    "";


                if(snapshot.empty){

                    listaComentarios.innerHTML = `

                        <div class="sin-comentarios">
                            Todavía no hay comentarios.
                        </div>

                    `;

                    return;

                }


                for(
                    const documento
                    of snapshot.docs
                ){

                    const comentario = {

                        id:
                            documento.id,

                        ...documento.data()

                    };


                    const elemento =
                        await crearComentarioElemento(
                            comentario
                        );


                    listaComentarios.appendChild(
                        elemento
                    );

                }


                listaComentarios.scrollTop =
                    listaComentarios.scrollHeight;

            },

            error => {

                console.error(
                    "Error comentarios:",
                    error
                );


                listaComentarios.innerHTML = `

                    <div class="sin-comentarios">
                        No se pudieron cargar los comentarios.
                    </div>

                `;

            }
        );

}


/* =========================================================
   ELEMENTO COMENTARIO
========================================================= */

async function crearComentarioElemento(
    comentario
){

    const uid =
        comentario.uid ||
        comentario.autorUid ||
        "";


    const perfil =
        await obtenerPerfil(uid);


    const nombre =
        obtenerNombre(
            perfil
        ) !== "Usuario GESBASE"
            ? obtenerNombre(perfil)
            : (
                comentario.nombreCompleto ||
                "Usuario GESBASE"
            );


    const foto =
        perfil?.fotoPerfil ||
        perfil?.fotoURL ||
        comentario.fotoPerfil ||
        "";


    const contenedor =
        document.createElement("div");

    contenedor.className =
        "comentario";


    if(foto){

        const img =
            document.createElement("img");

        img.className =
            "comentario-avatar";

        img.src =
            foto;

        img.alt =
            nombre;


        img.onerror = () => {

            const div =
                document.createElement("div");

            div.className =
                "comentario-iniciales";

            div.textContent =
                iniciales(nombre);

            img.replaceWith(
                div
            );

        };


        contenedor.appendChild(
            img
        );

    }
    else{

        const div =
            document.createElement("div");

        div.className =
            "comentario-iniciales";

        div.textContent =
            iniciales(nombre);

        contenedor.appendChild(
            div
        );

    }


    const burbuja =
        document.createElement("div");

    burbuja.className =
        "comentario-burbuja";


    const nombreEl =
        document.createElement("div");

    nombreEl.className =
        "comentario-nombre";

    nombreEl.textContent =
        nombre;


    const textoEl =
        document.createElement("div");

    textoEl.className =
        "comentario-texto";

    textoEl.textContent =
        comentario.texto || "";


    const fechaEl =
        document.createElement("div");

    fechaEl.className =
        "comentario-fecha";

    fechaEl.textContent =
        fechaTexto(
            comentario.fecha
        );


    burbuja.appendChild(
        nombreEl
    );

    burbuja.appendChild(
        textoEl
    );

    burbuja.appendChild(
        fechaEl
    );


    /*
     * Un usuario puede eliminar
     * sus propios comentarios.
     */

    if(
        usuarioActual &&
        uid ===
        usuarioActual.uid
    ){

        const eliminar =
            document.createElement("button");

        eliminar.className =
            "comentario-eliminar";

        eliminar.type =
            "button";

        eliminar.textContent =
            "Eliminar";


        eliminar.addEventListener(
            "click",
            () => {

                eliminarComentario(
                    comentario
                );

            }
        );


        burbuja.appendChild(
            eliminar
        );

    }


    contenedor.appendChild(
        burbuja
    );


    return contenedor;

}


/* =========================================================
   PUBLICAR COMENTARIO
========================================================= */

document.getElementById(
    "formComentario"
).addEventListener(
    "submit",
    async event => {

        event.preventDefault();


        const texto =
            inputComentario.value
                .trim();


        if(!texto){

            return;

        }


        if(
            !usuarioActual ||
            !publicacionComentariosActual
        ){

            return;

        }


        enviarComentarioBoton(
            true
        );


        try{

            const perfil =
                perfilActual ||
                {};


            await addDoc(
                collection(
                    db,
                    "publicaciones",
                    publicacionComentariosActual.id,
                    "comentarios"
                ),
                {

                    uid:
                        usuarioActual.uid,

                    nombreCompleto:
                        obtenerNombre(
                            perfil
                        ),

                    fotoPerfil:
                        perfil.fotoPerfil ||
                        perfil.fotoURL ||
                        usuarioActual.photoURL ||
                        "",

                    texto:
                        texto,

                    fecha:
                        serverTimestamp()

                }
            );


            /*
             * Actualizamos contador
             * de comentarios.
             */

            await updateDoc(
                doc(
                    db,
                    "publicaciones",
                    publicacionComentariosActual.id
                ),
                {
                    comentarios:
                        increment(1)
                }
            );


            inputComentario.value =
                "";


        }catch(error){

            console.error(
                "Error comentario:",
                error
            );


            mostrarToast(
                "No se pudo publicar el comentario."
            );

        }finally{

            enviarComentarioBoton(
                false
            );

        }

    }
);


function enviarComentarioBoton(
    cargando
){

    const boton =
        document.querySelector(
            ".comentario-enviar"
        );


    if(boton){

        boton.disabled =
            cargando;

    }

}


/* =========================================================
   ELIMINAR COMENTARIO
========================================================= */

async function eliminarComentario(
    comentario
){

    if(
        !usuarioActual ||
        !publicacionComentariosActual
    ){

        return;

    }


    if(
        comentario.uid !==
        usuarioActual.uid
    ){

        mostrarToast(
            "Solo podés eliminar tus propios comentarios."
        );

        return;

    }


    if(
        !confirm(
            "¿Eliminar este comentario?"
        )
    ){

        return;

    }


    try{

        const ref =
            doc(
                db,
                "publicaciones",
                publicacionComentariosActual.id,
                "comentarios",
                comentario.id
            );


        const snap =
            await getDoc(ref);


        if(!snap.exists()){

            return;

        }


        const datos =
            snap.data();


        if(
            datos.uid !==
            usuarioActual.uid
        ){

            mostrarToast(
                "No podés eliminar este comentario."
            );

            return;

        }


        await deleteDoc(ref);


        /*
         * Reducimos el contador sin permitir
         * valores negativos.
         */

        const publicacionRef =
            doc(
                db,
                "publicaciones",
                publicacionComentariosActual.id
            );


        const publicacionSnap =
            await getDoc(
                publicacionRef
            );


        if(publicacionSnap.exists()){

            const cantidad =
                Number(
                    publicacionSnap.data()
                        .comentarios || 0
                );


            await updateDoc(
                publicacionRef,
                {
                    comentarios:
                        Math.max(
                            0,
                            cantidad - 1
                        )
                }
            );

        }


    }catch(error){

        console.error(
            "Error eliminando comentario:",
            error
        );


        mostrarToast(
            "No se pudo eliminar el comentario."
        );

    }

}


/* =========================================================
   CERRAR COMENTARIOS
========================================================= */

function cerrarComentarios(){

    modalComentarios.classList.remove(
        "visible"
    );


    if(comentariosListener){

        comentariosListener();

        comentariosListener =
            null;

    }


    publicacionComentariosActual =
        null;

}


document.getElementById(
    "cerrarComentarios"
).addEventListener(
    "click",
    cerrarComentarios
);


modalComentarios.addEventListener(
    "click",
    event => {

        if(
            event.target ===
            modalComentarios
        ){

            cerrarComentarios();

        }

    }
);


/* =========================================================
   COMPARTIR
========================================================= */

async function compartirPublicacion(
    publicacion
){

    const url =
        new URL(
            window.location.href
        );


    url.search = "";


    url.searchParams.set(
        "publicacion",
        publicacion.id
    );


    const texto =
        publicacion.texto ||
        "Mirá esta publicación en Red GESBASE.";


    try{

        if(
            navigator.share
        ){

            await navigator.share({

                title:
                    "Red GESBASE",

                text:
                    texto,

                url:
                    url.toString()

            });

            return;

        }


        if(
            navigator.clipboard
        ){

            await navigator.clipboard.writeText(
                url.toString()
            );


            mostrarToast(
                "Enlace copiado."
            );

            return;

        }


        window.prompt(
            "Copiá este enlace:",
            url.toString()
        );


    }catch(error){

        if(
            error?.name !==
            "AbortError"
        ){

            console.warn(
                "Compartir:",
                error
            );

        }

    }

}


/* =========================================================
   PUBLICACIÓN COMPARTIDA
========================================================= */

async function abrirPublicacionCompartida(){

    const parametros =
        new URLSearchParams(
            window.location.search
        );


    const id =
        parametros.get(
            "publicacion"
        );


    if(!id){

        return;

    }


    try{

        const snap =
            await getDoc(
                doc(
                    db,
                    "publicaciones",
                    id
                )
            );


        if(!snap.exists()){

            mostrarToast(
                "La publicación ya no está disponible."
            );

            return;

        }


        const publicacion = {

            id:
                snap.id,

            ...snap.data()

        };


        const elemento =
            await crearPublicacionElemento(
                publicacion
            );


        feed.prepend(
            elemento
        );


        elemento.scrollIntoView({

            behavior:
                "smooth",

            block:
                "center"

        });


    }catch(error){

        console.error(
            "Publicación compartida:",
            error
        );

    }

}


/* =========================================================
   NOTIFICACIONES
========================================================= */

function cargarNotificaciones(){

    if(!usuarioActual){

        return;

    }


    try{

        const consulta =
            query(
                collection(
                    db,
                    "notificaciones"
                ),
                where(
                    "receptorUid",
                    "==",
                    usuarioActual.uid
                )
            );


        onSnapshot(
            consulta,
            snapshot => {

                let cantidad = 0;


                snapshot.forEach(
                    documento => {

                        const datos =
                            documento.data();


                        if(
                            datos.leida !== true
                        ){

                            cantidad++;

                        }

                    }
                );


                if(cantidad > 0){

                    badgeNotificaciones.style.display =
                        "flex";


                    badgeNotificaciones.textContent =
                        cantidad > 99
                            ? "99+"
                            : cantidad;

                }
                else{

                    badgeNotificaciones.style.display =
                        "none";

                }

            },

            error => {

                console.warn(
                    "Notificaciones:",
                    error
                );

            }
        );


    }catch(error){

        console.warn(
            "Error notificaciones:",
            error
        );

    }

}


/* =========================================================
   TOAST
========================================================= */

let toastTimer = null;


function mostrarToast(
    mensaje
){

    const toast =
        document.getElementById(
            "toast"
        );


    toast.textContent =
        mensaje;


    toast.classList.add(
        "show"
    );


    clearTimeout(
        toastTimer
    );


    toastTimer =
        setTimeout(
            () => {

                toast.classList.remove(
                    "show"
                );

            },
            2800
        );

}


/* =========================================================
   TECLA ESC
========================================================= */

document.addEventListener(
    "keydown",
    event => {

        if(
            event.key !==
            "Escape"
        ){

            return;

        }


        if(
            modalPublicacion.classList.contains(
                "visible"
            )
        ){

            cerrarModalPublicacion();

        }


        if(
            modalComentarios.classList.contains(
                "visible"
            )
        ){

            cerrarComentarios();

        }


        if(
            menuPublicacion.classList.contains(
                "visible"
            )
        ){

            cerrarMenuPublicacion();

        }

    }
);


/* =========================================================
   INICIAR PUBLICACIÓN COMPARTIDA
========================================================= */

const esperarUsuario =
    setInterval(
        () => {

            if(usuarioActual){

                clearInterval(
                    esperarUsuario
                );

                abrirPublicacionCompartida();

            }

        },
        300
    );

</script>
