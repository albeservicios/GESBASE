<style>

*{
    box-sizing:border-box;

    padding:0;

html,
body{

body{

/* =========================
   APP
========================= */

.app{
    width:100%;
    min-height:100vh;
    overflow-x:hidden;
}


/* =========================
   HEADER
========================= */

.header{

    position:sticky;
    top:0;
    z-index:100;

    width:100%;

    background:#111827;
    color:white;

    border-bottom:
        1px solid rgba(255,255,255,.08);
}

.header-inner{

    width:100%;
    max-width:900px;

    min-height:68px;

    margin:auto;

    padding:
        9px 16px;

    display:flex;

    align-items:center;

.brand{

    display:flex;

.brand-icon{

    color:#111827;

    display:flex;

    font-size:14px;
    font-weight:900;
}

.brand-info{
    min-width:0;
}

.brand-title{

    font-size:18px;
    font-weight:900;

    white-space:nowrap;
}

.brand-subtitle{

    margin-top:2px;

    font-size:10px;

    opacity:.65;

    white-space:nowrap;
}

.header-actions{

    display:flex;
    align-items:center;
    gap:7px;
}

.header-button{

    width:40px;
    height:40px;

    border:0;
    border-radius:12px;

    background:
        rgba(255,255,255,.08);

    color:white;

    display:flex;
    align-items:center;
    justify-content:center;

    font-size:18px;
}

.header-button:hover{

    background:
        rgba(255,255,255,.16);
}

.notification-wrap{
    position:relative;
}

.notification-badge{

    position:absolute;

    top:-3px;
    right:-3px;

    min-width:17px;
    height:17px;

    padding:0 4px;

    border-radius:20px;

    background:#ef4444;
    color:white;

    display:none;

    align-items:center;
    justify-content:center;

    font-size:9px;
    font-weight:900;
}


/* =========================
   MAIN
========================= */

.main{

    width:100%;
    max-width:700px;

    margin:auto;

    padding:
        18px 14px 100px;
}


/* =========================
   WELCOME
========================= */

.welcome{

    width:100%;

    background:white;

    border-radius:18px;

    padding:20px;

    margin-bottom:15px;

    box-shadow:
        0 5px 18px rgba(0,0,0,.06);
}

.welcome-title{

    font-size:22px;
    font-weight:900;

    line-height:1.2;

    margin-bottom:5px;
}

.welcome-text{

    color:#6b7280;

    font-size:13px;

    line-height:1.5;
}


/* =========================
   CREATE POST
========================= */

.create-post{

    width:100%;

    background:white;

    border-radius:18px;

    padding:17px;

    margin-bottom:17px;

    box-shadow:
        0 5px 18px rgba(0,0,0,.06);
}

.create-top{

    display:flex;
    gap:11px;
    align-items:flex-start;
}

.create-avatar{

    width:45px;
    height:45px;

    flex:0 0 45px;

    border-radius:50%;

    background:#111827;
    color:white;

    display:flex;
    align-items:center;
    justify-content:center;

    font-size:14px;
    font-weight:900;

    overflow:hidden;
}

.create-avatar img{

    width:100%;
    height:100%;

    object-fit:cover;
}

.post-input{

    flex:1;
    min-width:0;

    min-height:48px;

    padding:

    border:
        1px solid #e5e7eb;

    border-radius:14px;

    cursor:text;

    font-size:14px;
}

.post-input:focus{

    outline:none;

    border-color:#9ca3af;

    background:white;
}

.create-options{

    display:flex;

    gap:8px;

    margin-top:12px;

    padding-top:12px;

    border-top:
        1px solid #f3f4f6;
}

.create-option{

    flex:1;

    min-height:39px;

    border:0;

    border-radius:10px;

    background:#f3f4f6;

    color:#374151;

    font-size:12px;

    font-weight:800;
}

.create-option:hover{

    background:#e5e7eb;
}


/* =========================
   FEED
========================= */

.feed-title{

    font-size:17px;
    font-weight:900;

    margin:
        5px 0 12px;
}

.feed{

    display:flex;

    flex-direction:column;

    gap:14px;
}


/* =========================
   POST
========================= */

.post{

    width:100%;

    background:white;

    border-radius:18px;

    overflow:hidden;

    box-shadow:
        0 5px 18px rgba(0,0,0,.06);
}

.post-header{

    display:flex;

    align-items:center;

    gap:11px;

    padding:16px 17px 12px;
}

.post-avatar{

    width:44px;
    height:44px;

    flex:0 0 44px;

    border-radius:50%;

    background:#111827;
    color:white;

    display:flex;
    align-items:center;
    justify-content:center;

    overflow:hidden;

    font-size:13px;
    font-weight:900;
}

.post-avatar img{

    width:100%;
    height:100%;

    object-fit:cover;
}

.post-user{

    min-width:0;
    flex:1;
}

.post-name{

    font-size:14px;

    font-weight:900;

    overflow:hidden;

    text-overflow:ellipsis;

    white-space:nowrap;
}

.post-type{

    margin-top:2px;

    color:#6b7280;

    font-size:11px;
}

.post-date{

    color:#9ca3af;

    font-size:10px;

    white-space:nowrap;
}

.post-body{

    padding:
        3px 17px 16px;
}

.post-text{

    color:#1f2937;

    font-size:14px;

    line-height:1.6;

    white-space:pre-wrap;

    overflow-wrap:anywhere;
}

.post-image{

    width:100%;

    max-height:500px;

    object-fit:cover;

    display:block;

    margin-top:12px;
}

.post-actions{

    display:grid;

    grid-template-columns:
        repeat(3,minmax(0,1fr));

    border-top:
        1px solid #f3f4f6;

    padding:5px;
}

.post-action{

    height:40px;

    border:0;

    border-radius:9px;

    background:white;

    color:#6b7280;

    font-size:12px;

    font-weight:800;
}

.post-action:hover{

    background:#f3f4f6;
}

.post-action.liked{

    color:#111827;
}


/* =========================
   EMPTY
========================= */

.empty{

    background:white;

    border-radius:18px;

    padding:35px 20px;

    text-align:center;

    color:#6b7280;

    font-size:14px;

    line-height:1.5;

    box-shadow:
        0 5px 18px rgba(0,0,0,.05);
}

.loading{

    text-align:center;

    padding:35px 20px;

    color:#6b7280;

    font-size:14px;
}


/* =========================
   BOTTOM NAV
========================= */

.bottom-nav{

    position:fixed;

    left:0;
    right:0;
    bottom:0;

    z-index:200;

    width:100%;

    background:white;

    border-top:
        1px solid #e5e7eb;

    box-shadow:
        0 -5px 20px rgba(0,0,0,.08);
}

.bottom-nav-inner{

    width:100%;
    max-width:700px;

    min-height:67px;

    margin:auto;

    display:grid;

    grid-template-columns:
        repeat(5,minmax(0,1fr));
}

.nav-button{

    border:0;

    background:white;

    color:#6b7280;

    display:flex;

    flex-direction:column;

    align-items:center;

    justify-content:center;

    gap:3px;

    font-size:10px;

    font-weight:800;

    min-width:0;
}

.nav-icon{

    font-size:20px;

    line-height:1;
}

.nav-button.active{

    color:#111827;
}


/* =========================
   MODAL
========================= */

.modal{

    position:fixed;

    inset:0;

    z-index:1000;

    background:
        rgba(0,0,0,.55);

    display:none;

    align-items:center;
    justify-content:center;

    padding:18px;
}

.modal.show{

    display:flex;
}

.modal-card{

    width:100%;
    max-width:500px;

    background:white;

    border-radius:20px;

    padding:21px;

    box-shadow:
        0 20px 60px rgba(0,0,0,.3);
}

.modal-title{

    font-size:20px;

    font-weight:900;

    margin-bottom:14px;
}

.modal-textarea{

    width:100%;

    min-height:130px;

    resize:vertical;

    border:
        1px solid #d1d5db;

    border-radius:13px;

    padding:13px;

    outline:none;

    font-size:14px;

    line-height:1.5;
}

.modal-textarea:focus{

    border-color:#111827;

    box-shadow:
        0 0 0 3px rgba(17,24,39,.08);
}

.modal-actions{

    display:flex;

    gap:9px;

    margin-top:14px;
}

.modal-button{

    flex:1;

    height:44px;

    border:0;

    border-radius:11px;

    font-weight:800;
}

.modal-cancel{

    background:#f3f4f6;

    color:#111827;
}

.modal-publish{

    background:#111827;

    color:white;
}

.modal-publish:disabled{

    opacity:.6;

    cursor:not-allowed;
}


/* =========================
   RESPONSIVE
========================= */

@media(max-width:600px){

    .header-inner{

        min-height:62px;

        padding:
            8px 11px;
    }

    .brand-icon{

        width:39px;
        height:39px;

        flex-basis:39px;

        border-radius:11px;
    }

    .brand-title{

        font-size:16px;
    }

    .brand-subtitle{

        font-size:9px;
    }

    .header-button{

        width:37px;
        height:37px;
    }

    .main{

        padding:
            13px 10px 91px;
    }

    .welcome{

        padding:18px;

        border-radius:17px;
    }

    .welcome-title{

        font-size:20px;
    }

    .create-post{

        padding:14px;

        border-radius:17px;
    }

    .create-options{

        gap:6px;
    }

    .create-option{

        font-size:11px;
    }

    .post-header{

        padding:
            14px 14px 10px;
    }

    .post-body{

        padding:
            3px 14px 14px;
    }

    .post-text{

        font-size:13px;
    }

}

@media(max-width:370px){

    .brand-subtitle{

        display:none;
    }

    .create-options{

        flex-direction:column;
    }

    .create-option{

        width:100%;
    }

    .nav-button{

        font-size:9px;
    }

    .nav-icon{

        font-size:18px;
    }

}

</style>

</head>


<body>

>

        >

<script type="module">

import {
    auth,
    db
} from "./Js/firebase.js";


import {
    onAuthStateChanged,
    signOut
} from "https://www.gstatic.com/firebasejs/12.18.0/firebase-auth.js";


import {
    collection,
    addDoc,
    query,
    orderBy,
    limit,
    getDocs,
    serverTimestamp
} from "https://www.gstatic.com/firebasejs/12.18.0/firebase-firestore.js";


const feed =
    document.getElementById("feed");

const welcomeTitle =
    document.getElementById("welcomeTitle");

const createAvatar =
    document.getElementById("createAvatar");

const postModal =
    document.getElementById("postModal");

const postText =
    document.getElementById("postText");

const publishPost =
    document.getElementById("publishPost");

const cancelPost =
    document.getElementById("cancelPost");

const openPostButton =
    document.getElementById("openPostButton");

const textButton =
    document.getElementById("textButton");

const photoButton =
    document.getElementById("photoButton");

const logoutButton =
    document.getElementById("logoutButton");

const navBuscar =
    document.getElementById("navBuscar");

const navConexiones =
    document.getElementById("navConexiones");

const navNotificaciones =
    document.getElementById("navNotificaciones");

const navPerfil =
    document.getElementById("navPerfil");

const notificationsButton =
    document.getElementById("notificationsButton");


let usuarioActual = null;


/* =========================
   SESIÓN
========================= */

onAuthStateChanged(
    auth,
    async (user) => {

        if(!user){

            window.location.replace(
                "red-login.html"
            );

            return;

        }


        usuarioActual = user;


        const nombre =
            user.displayName ||
            "Usuario";


        welcomeTitle.textContent =
            `Hola, ${nombre}`;


        createAvatar.textContent =
            obtenerIniciales(nombre);


        await cargarPerfilUsuario();

        await cargarPublicaciones();

        await cargarNotificaciones();

    }
);


/* =========================
   PERFIL DEL USUARIO
========================= */

async function cargarPerfilUsuario(){

    try{

        /*
         * El perfil de Red se encuentra
         * en usuariosRed.
         */

        const { doc, getDoc } =
            await import(
                "https://www.gstatic.com/firebasejs/12.18.0/firebase-firestore.js"
            );


        const ref =
            doc(
                db,
                "usuariosRed",
                usuarioActual.uid
            );


        const snap =
            await getDoc(ref);


        if(!snap.exists()){

            return;

        }


        const data =
            snap.data();


        const nombre =
            data.nombreCompleto ||
            usuarioActual.displayName ||
            "Usuario";


        welcomeTitle.textContent =
            `Hola, ${nombre}`;


        createAvatar.textContent =
            obtenerIniciales(nombre);


        if(data.fotoPerfil){

            createAvatar.innerHTML = `
                <img
                    src="${escapeHtml(data.fotoPerfil)}"
                    alt=""
                >
            `;

        }

    }catch(error){

        console.error(
            "Error cargando perfil:",
            error
        );

    }

}


/* =========================
   PUBLICACIONES
========================= */

async function cargarPublicaciones(){

    feed.innerHTML = `
        <div class="loading">
            Cargando publicaciones...
        </div>
    `;


    try{

        const q =
            query(
                collection(
                    db,
                    "publicaciones"
                ),
                orderBy(
                    "fecha",
                    "desc"
                ),
                limit(30)
            );


        const snapshot =
            await getDocs(q);


        if(snapshot.empty){

            feed.innerHTML = `
                <div class="empty">
                    <strong>
                        Todavía no hay publicaciones.
                    </strong>
                    <br><br>
                    Sé el primero en compartir algo
                    con la comunidad de Red GESBASE.
                </div>
            `;

            return;

        }


        feed.innerHTML = "";


        snapshot.forEach(
            documento => {

                const data =
                    documento.data();


                feed.appendChild(
                    crearPublicacion(
                        data,
                        documento.id
                    )
                );

            }
        );


    }catch(error){

        console.error(
            "Error cargando publicaciones:",
            error
        );


        /*
         * Si todavía no existe el índice
         * de fecha, mostramos igualmente
         * un mensaje claro.
         */

        feed.innerHTML = `
            <div class="empty">
                No se pudieron cargar las publicaciones.
                <br><br>
                Intentá nuevamente.
            </div>
        `;

    }

}


/* =========================
   CREAR PUBLICACIÓN VISUAL
========================= */

function crearPublicacion(
    data,
    id
){

    const article =
        document.createElement("article");


    article.className =
        "post";


    const nombre =
        data.nombreCompleto ||
        data.nombre ||
        "Usuario";


    const tipo =
        data.tipoPerfil ||
        data.tipo ||
        "Usuario GESBASE";


    const texto =
        data.texto ||
        data.contenido ||
        "";


    const foto =
        data.fotoPerfil ||
        data.fotoURL ||
        "";


    const imagenPublicacion =
        data.imagenURL ||
        data.fotoPublicacion ||
        "";


    const fecha =
        formatearFecha(
            data.fecha
        );


    const avatarHTML =
        foto
            ? `
                <img
                    src="${escapeHtml(foto)}"
                    alt=""
                >
            `
            : `
                <span>
                    ${escapeHtml(
                        obtenerIniciales(nombre)
                    )}
                </span>
            `;


    article.innerHTML = `

        <div class="post-header">

            <div class="post-avatar">
                ${avatarHTML}
            </div>


            <div class="post-user">

                <div class="post-name">
                    ${escapeHtml(nombre)}
                </div>

                <div class="post-type">
                    ${escapeHtml(tipo)}
                </div>

            </div>


            <div class="post-date">
                ${escapeHtml(fecha)}
            </div>

        </div>


        <div class="post-body">

            ${
                texto
                    ? `
                        <div class="post-text">
                            ${escapeHtml(texto)}
                        </div>
                    `
                    : ""
            }


            ${
                imagenPublicacion
                    ? `
                        <img
                            class="post-image"
                            src="${escapeHtml(
                                imagenPublicacion
                            )}"
                            alt="Publicación"
                        >
                    `
                    : ""
            }

        </div>


        <div class="post-actions">

            <button
                class="post-action like-button"
            >
                👍 Me gusta
            </button>

            <button
                class="post-action comment-button"
            >
                💬 Comentar
            </button>

            <button
                class="post-action share-button"
            >
                ↗ Compartir
            </button>

        </div>

    `;


    const likeButton =
        article.querySelector(
            ".like-button"
        );


    likeButton.addEventListener(
        "click",
        () => {

            likeButton.classList.toggle(
                "liked"
            );

        }
    );


    const commentButton =
        article.querySelector(
            ".comment-button"
        );


    commentButton.addEventListener(
        "click",
        () => {

            alert(
                "Los comentarios estarán disponibles próximamente."
            );

        }
    );


    const shareButton =
        article.querySelector(
            ".share-button"
        );


    shareButton.addEventListener(
        "click",
        async () => {

            const textoCompartir =
                `${nombre}\n\n${texto}`;


            if(
                navigator.share
            ){

                try{

                    await navigator.share({
                        title:
                            "Red GESBASE",
                        text:
                            textoCompartir
                    });

                }catch(error){

                    console.log(
                        "Compartir cancelado."
                    );

                }

            }else{

                try{

                    await navigator.clipboard.writeText(
                        textoCompartir
                    );

                    alert(
                        "Publicación copiada."
                    );

                }catch(error){

                    alert(
                        "No se pudo compartir."
                    );

                }

            }

        }
    );


    return article;

}

function cerrarModal(){

publishPost.addEventListener(
    "click",
    async () => {

        const texto =
            postText.value.trim();


        if(!texto){

            alert(
                "Escribí algo para publicar."
            );

            postText.focus();

            return;

        }


        publishPost.disabled =
            true;

        publishPost.textContent =
            "Publicando...";


        try{

            const nombre =
                usuarioActual.displayName ||
                "Usuario";


            await addDoc(
                collection(
                    db,
                    "publicaciones"
                ),
                {

                    uid:
                        usuarioActual.uid,

                    nombreCompleto:
                        nombre,

                    tipoPerfil:
                        "Usuario GESBASE",

                    texto:
                        texto,

                    fotoPerfil:
                        "",

                    fecha:
                        serverTimestamp(),

                    likes:
                        0,

                    comentarios:
                        0

                }
            );


            cerrarModal();


            await cargarPublicaciones();


        }catch(error){

            console.error(
                "Error publicando:",
                error
            );


            alert(
                "No se pudo publicar. Intentá nuevamente."
            );

        }


        publishPost.disabled =
            false;

        publishPost.textContent =
            "Publicar";

    }
);


/* =========================
   NOTIFICACIONES
========================= */

async function cargarNotificaciones(){

    try{

        const {
            collection,
            query,
            where,
            getDocs
        } =
            await import(
                "https://www.gstatic.com/firebasejs/12.18.0/firebase-firestore.js"
            );


        const q =
            query(
                collection(
                    db,
                    "notificaciones"
                ),
                where(
                    "receptor",
                    "==",
                    usuarioActual.uid
                )
            );


        const snapshot =
            await getDocs(q);


        let cantidad =
            0;


        snapshot.forEach(
            documento => {

                const data =
                    documento.data();


                if(!data.leida){

                    cantidad++;

                }

            }
        );


        const badge =
            document.getElementById(
                "notificationBadge"
            );


        if(cantidad > 0){

            badge.textContent =
                cantidad > 99
                    ? "99+"
                    : cantidad;

            badge.style.display =
                "flex";

        }else{

            badge.style.display =
                "none";

        }

    }catch(error){

        console.error(
            "Error notificacaciones:",
            error
        );

    }

}

/* =========================
   UTILIDADES
========================= */

function obtenerIniciales(
    nombre
){

    return String(nombre)
        .split(" ")
        .filter(Boolean)
        .slice(0,2)
        .map(
            palabra =>
                palabra
                    .charAt(0)
                    .toUpperCase()
        )
        .join("");

}


function formatearFecha(
    timestamp
){

    if(
        !timestamp ||
        !timestamp.toDate
    ){

        return "Ahora";

    }


    const fecha =
        timestamp.toDate();


    return fecha.toLocaleDateString(
        "es-AR",
        {
            day:"2-digit",
            month:"2-digit",
            year:"numeric"
        }
    );

}


function escapeHtml(
    text
){

    return String(text)
        .replaceAll(
            "&",
            "&amp;"
        )
        .replaceAll(
            "<",
            "&lt;"
        )
        .replaceAll(
            ">",
            "&gt;"
        )
        .replaceAll(
            '"',
            "&quot;"
        )
        .replaceAll(
            "'",
            "&#039;"
        );

}
