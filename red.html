<!-- =====================================================
     MENÚ PRINCIPAL — RED GESBASE
     Solo funciones de la Red Social
===================================================== -->

<nav class="red-menu" aria-label="Navegación principal">

    <button
        class="red-menu-item"
        data-pagina="inicio"
        onclick="location.href='red.html'"
    >
        <span class="red-menu-icon">🏠</span>
        <span>Inicio</span>
    </button>

    <button
        class="red-menu-item"
        data-pagina="buscar"
        onclick="location.href='red-buscar.html'"
    >
        <span class="red-menu-icon">🔎</span>
        <span>Buscar</span>
    </button>

    <button
        class="red-menu-item"
        data-pagina="conexiones"
        onclick="location.href='conexiones.html'"
    >
        <span class="red-menu-icon">👥</span>
        <span>Conexiones</span>
    </button>

    <button
        class="red-menu-item"
        data-pagina="notificaciones"
        onclick="location.href='red-notificaciones.html'"
    >
        <span class="red-menu-icon">🔔</span>
        <span>Notificaciones</span>
        <span
            id="contadorNotificaciones"
            class="contador-notificaciones"
            style="display:none;"
        >
            0
        </span>
    </button>

    <button
        class="red-menu-item"
        data-pagina="perfil"
        onclick="location.href='red-perfil.html'"
    >
        <span class="red-menu-icon">👤</span>
        <span>Perfil</span>
    </button>

</nav>


<style>

/* =====================================================
   MENÚ RED GESBASE
===================================================== */

.red-menu{
    position:fixed;
    left:0;
    right:0;
    bottom:0;
    z-index:1000;

    height:70px;

    display:flex;
    align-items:stretch;
    justify-content:center;

    background:#ffffff;

    border-top:1px solid #dfe6e8;

    box-shadow:
        0 -3px 15px rgba(0,0,0,.08);

    padding:
        4px 8px
        env(safe-area-inset-bottom)
        4px 8px;
}

.red-menu-item{

    position:relative;

    flex:1;

    max-width:180px;

    border:0;

    background:transparent;

    color:#64767c;

    display:flex;
    flex-direction:column;
    align-items:center;
    justify-content:center;

    gap:2px;

    font-family:Arial,Helvetica,sans-serif;

    font-size:11px;
    font-weight:600;

    cursor:pointer;

    transition:
        color .2s ease,
        transform .15s ease;
}

.red-menu-item:hover{
    color:#12343B;
}

.red-menu-item:active{
    transform:scale(.94);
}

.red-menu-item.activo{
    color:#12343B;
    font-weight:700;
}

.red-menu-icon{

    font-size:22px;

    line-height:24px;

    display:block;
}


/* =====================================================
   INDICADOR DE SECCIÓN ACTIVA
===================================================== */

.red-menu-item.activo::before{

    content:"";

    position:absolute;

    top:0;

    left:28%;

    right:28%;

    height:3px;

    border-radius:
        0 0 5px 5px;

    background:#12343B;
}


/* =====================================================
   CONTADOR DE NOTIFICACIONES
===================================================== */

.contador-notificaciones{

    position:absolute;

    top:5px;
    right:calc(50% - 23px);

    min-width:18px;
    height:18px;

    padding:0 5px;

    display:flex;
    align-items:center;
    justify-content:center;

    background:#d62828;

    color:#ffffff;

    border-radius:20px;

    font-size:10px;
    font-weight:700;

    border:2px solid #ffffff;
}


/* =====================================================
   ESPACIO PARA QUE EL CONTENIDO NO QUEDE TAPADO
===================================================== */

body{
    padding-bottom:90px;
}


/* =====================================================
   TABLET
===================================================== */

@media (min-width:700px){

    .red-menu{
        height:74px;
    }

    .red-menu-item{
        font-size:12px;
    }

    .red-menu-icon{
        font-size:24px;
    }

}


/* =====================================================
   COMPUTADORA
===================================================== */

@media (min-width:1000px){

    .red-menu{
        bottom:20px;

        left:50%;

        right:auto;

        transform:translateX(-50%);

        width:min(760px,92%);

        height:68px;

        border:1px solid #dfe6e8;

        border-radius:18px;

        padding:5px 12px;

        box-shadow:
            0 5px 25px rgba(0,0,0,.12);
    }

    body{
        padding-bottom:40px;
    }

    .red-menu-item{
        max-width:none;
    }

}


/* =====================================================
   CELULAR PEQUEÑO
===================================================== */

@media (max-width:380px){

    .red-menu{
        padding-left:2px;
        padding-right:2px;
    }

    .red-menu-item{
        font-size:10px;
    }

    .red-menu-icon{
        font-size:20px;
    }

}

</style>


<script>

/* =====================================================
   DETECTAR PÁGINA ACTUAL
===================================================== */

(function(){

    const pagina =
        location.pathname
            .split("/")
            .pop()
            .toLowerCase();


    let activa = "inicio";


    if(
        pagina === "red-buscar.html"
    ){

        activa = "buscar";

    }
    else if(
        pagina === "conexiones.html"
    ){

        activa = "conexiones";

    }
    else if(
        pagina === "red-notificaciones.html"
    ){

        activa = "notificaciones";

    }
    else if(
        pagina === "red-perfil.html"
    ){

        activa = "perfil";

    }


    document
        .querySelectorAll(".red-menu-item")
        .forEach(item => {

            if(
                item.dataset.pagina === activa
            ){

                item.classList.add("activo");

            }

        });

})();

</script>
