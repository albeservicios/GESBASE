<script type="module">

import { auth, db } from "./firebase.js";

import {
    collection,
    query,
    where,
    getDocs,
    addDoc,
    updateDoc,
    doc,
    serverTimestamp
} from "https://www.gstatic.com/firebasejs/12.18.0/firebase-firestore.js";

import {
    onAuthStateChanged
} from "https://www.gstatic.com/firebasejs/12.18.0/firebase-auth.js";


let usuarioActual = null;


/* =====================================
   USUARIO ACTUAL
===================================== */

onAuthStateChanged(auth, async (user) => {

    if (!user) {

        usuarioActual = null;

        console.log("Red GESBASE: usuario no autenticado");

        return;
    }

    usuarioActual = user;

    console.log(
        "Red GESBASE: usuario conectado",
        user.uid
    );

});


/* =====================================
   ABRIR CONEXIONES
===================================== */

window.abrirConexiones = function(){

    if (!usuarioActual) {

        showToast(
            "Iniciá sesión para ver tus conexiones"
        );

        setTimeout(() => {

            window.location.href =
                "red-login.html";

        }, 1000);

        return;
    }


    showToast(
        "Cargando tus conexiones..."
    );


    /*
     * Próximo paso:
     * mostrar solicitudes y conexiones
     */

};


/* =====================================
   ENVIAR SOLICITUD
===================================== */

window.enviarSolicitud = async function(toUid){

    try {

        if (!usuarioActual) {

            showToast(
                "Iniciá sesión para conectarte"
            );

            return;
        }


        if (usuarioActual.uid === toUid) {

            showToast(
                "No podés conectarte con vos mismo"
            );

            return;
        }


        /*
         * Comprobar si ya existe una
         * conexión o solicitud.
         */

        const q1 = query(
            collection(db, "connections"),
            where(
                "fromUid",
                "==",
                usuarioActual.uid
            ),
            where(
                "toUid",
                "==",
                toUid
            )
        );


        const q2 = query(
            collection(db, "connections"),
            where(
                "fromUid",
                "==",
                toUid
            ),
            where(
                "toUid",
                "==",
                usuarioActual.uid
            )
        );


        const [resultado1, resultado2] =
            await Promise.all([
                getDocs(q1),
                getDocs(q2)
            ]);


        if (
            !resultado1.empty ||
            !resultado2.empty
        ){

            showToast(
                "Ya existe una solicitud o conexión"
            );

            return;
        }


        /*
         * Crear solicitud
         */

        const nuevaConexion =
            await addDoc(
                collection(db, "connections"),
                {

                    fromUid:
                        usuarioActual.uid,

                    toUid:
                        toUid,

                    status:
                        "pending",

                    createdAt:
                        serverTimestamp(),

                    updatedAt:
                        serverTimestamp()

                }
            );


        /*
         * Crear notificación
         */

        await addDoc(
            collection(db, "notificaciones"),
            {

                uid:
                    toUid,

                tipo:
                    "connection_request",

                titulo:
                    "Nueva solicitud de conexión",

                mensaje:
                    `${usuarioActual.displayName || "Un usuario"} quiere conectarse con vos.`,

                connectionId:
                    nuevaConexion.id,

                deUid:
                    usuarioActual.uid,

                leida:
                    false,

                createdAt:
                    serverTimestamp()

            }
        );


        showToast(
            "Solicitud de conexión enviada"
        );


    } catch(error) {

        console.error(
            "Error enviando solicitud:",
            error
        );

        showToast(
            "No se pudo enviar la solicitud"
        );

    }

};


/* =====================================
   ACEPTAR SOLICITUD
===================================== */

window.aceptarSolicitud = async function(
    connectionId
){

    try {

        if (!usuarioActual) {

            showToast(
                "Iniciá sesión"
            );

            return;
        }


        const referencia =
            doc(
                db,
                "connections",
                connectionId
            );


        await updateDoc(
            referencia,
            {

                status:
                    "accepted",

                updatedAt:
                    serverTimestamp()

            }
        );


        showToast(
            "¡Ahora están conectados!"
        );


        /*
         * Más adelante actualizaremos
         * automáticamente la pantalla.
         */

    } catch(error) {

        console.error(
            "Error aceptando solicitud:",
            error
        );

        showToast(
            "No se pudo aceptar la solicitud"
        );

    }

};


/* =====================================
   RECHAZAR SOLICITUD
===================================== */

window.rechazarSolicitud = async function(
    connectionId
){

    try {

        if (!usuarioActual) {

            showToast(
                "Iniciá sesión"
            );

            return;
        }


        const referencia =
            doc(
                db,
                "connections",
                connectionId
            );


        await updateDoc(
            referencia,
            {

                status:
                    "rejected",

                updatedAt:
                    serverTimestamp()

            }
        );


        showToast(
            "Solicitud rechazada"
        );


    } catch(error) {

        console.error(
            "Error rechazando solicitud:",
            error
        );

        showToast(
            "No se pudo rechazar la solicitud"
        );

    }

};

</script>
