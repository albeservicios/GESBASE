<!DOCTYPE html>
<html lang="es-AR">

<head>

<meta charset="UTF-8">

<meta
    name="viewport"
    content="width=device-width, initial-scale=1.0, viewport-fit=cover"
>

<meta
    name="theme-color"
    content="#12343B"
>

<meta
    name="description"
    content="Red GESBASE - Red profesional para conectar personas, profesionales, trabajadores, empresas y comercios."
>

<title>Red GESBASE</title>


<style>

/* =========================================================
   BASE
========================================================= */

*{
    box-sizing:border-box;
    margin:0;
    padding:0;
}

html{
    scroll-behavior:smooth;
}

body{
    font-family:
        Arial,
        Helvetica,
        sans-serif;

    background:#eef2f3;

    color:#17252a;

    padding-bottom:90px;
}


/* =========================================================
   HEADER
========================================================= */

.header{
    position:sticky;
    top:0;
    z-index:1000;

    background:#12343B;

    color:white;

    box-shadow:
        0 2px 10px rgba(0,0,0,.15);
}

.header-inner{
    width:100%;
    max-width:900px;

    margin:auto;

    padding:14px 16px;
}

.header-top{
    display:flex;

    align-items:center;

    justify-content:space-between;

    gap:12px;
}

.brand{
    display:flex;

    align-items:center;

    gap:10px;
}

.brand-logo{
    width:42px;
    height:42px;

    border-radius:12px;

    background:white;

    color:#12343B;

    display:flex;

    align-items:center;
    justify-content:center;

    font-weight:800;

    font-size:20px;
}

.brand-text{
    line-height:1.1;
}

.brand-name{
    font-size:20px;

    font-weight:800;
}

.brand-subtitle{
    margin-top:3px;

    font-size:11px;

    opacity:.78;
}

.header-notification{
    width:42px;
    height:42px;

    border:0;

    border-radius:50%;

    background:
        rgba(255,255,255,.12);

    color:white;

    font-size:20px;

    cursor:pointer;

    position:relative;
}

.header-notification:hover{
    background:
        rgba(255,255,255,.20);
}


/* =========================================================
   MAIN
========================================================= */

.main{
    width:100%;
    max-width:900px;

    margin:auto;

    padding:
        14px 12px 30px;
}


/* =========================================================
   WELCOME
========================================================= */

.welcome{
    background:white;

    border-radius:18px;

    padding:18px;

    margin-bottom:12px;

    box-shadow:
        0 2px 9px rgba(0,0,0,.07);
}

.welcome-content{
    display:flex;

    align-items:center;

    gap:13px;
}

.welcome-avatar{
    width:54px;
    height:54px;

    min-width:54px;

    border-radius:50%;

    object-fit:cover;

    background:#dce6e8;

    border:
        2px solid #edf2f3;
}

.welcome-placeholder{
    width:54px;
    height:54px;

    min-width:54px;

    border-radius:50%;

    background:#12343B;

    color:white;

    display:flex;

    align-items:center;
    justify-content:center;

    font-size:18px;

    font-weight:800;
}

.welcome-title{
    font-size:18px;

    font-weight:800;
}

.welcome-text{
    margin-top:4px;

    font-size:13px;

    color:#64757b;
}


/* =========================================================
   CREAR PUBLICACIÓN
========================================================= */

.crear-publicacion{
    background:white;

    border-radius:18px;

    padding:15px;

    margin-bottom:14px;

    box-shadow:
        0 2px 9px rgba(0,0,0,.07);
}

.crear-top{
    display:flex;

    align-items:center;

    gap:10px;
}

.crear-avatar{
    width:44px;
    height:44px;

    min-width:44px;

    border-radius:50%;

    object-fit:cover;

    background:#dce6e8;
}

.crear-input{
    flex:1;

    border:1px solid #d8e0e2;

    border-radius:24px;

    padding:12px 15px;

    background:#f5f7f8;

    color:#65777c;

    font-size:14px;

    cursor:pointer;

    text-align:left;
}

.crear-input:hover{
    background:#edf2f3;
}

.crear-acciones{
    display:flex;

    gap:8px;

    margin-top:12px;

    border-top:
        1px solid #edf0f1;

    padding-top:10px;
}

.crear-accion{
    flex:1;

    border:0;

    background:transparent;

    border-radius:10px;

    padding:9px 5px;

    color:#53676d;

    font-size:13px;

    font-weight:700;

    cursor:pointer;
}

.crear-accion:hover{
    background:#f0f4f5;
}


/* =========================================================
   FEED
========================================================= */

.feed{
    display:flex;

    flex-direction:column;

    gap:14px;
}


/* =========================================================
   PUBLICACIÓN
========================================================= */

.publicacion{
    background:white;

    border-radius:18px;

    overflow:hidden;

    box-shadow:
        0 2px 9px rgba(0,0,0,.07);
}

.publicacion-header{
    display:flex;

    align-items:center;

    gap:10px;

    padding:
        15px 15px 10px;
}

.autor-avatar{
    width:46px;
    height:46px;

    min-width:46px;

    border-radius:50%;

    object-fit:cover;

    background:#dce6e8;

    border:
        1px solid #e8eeee;
}

.autor-placeholder{
    width:46px;
    height:46px;

    min-width:46px;

    border-radius:50%;

    background:#12343B;

    color:white;

    display:flex;

    align-items:center;
    justify-content:center;

    font-size:16px;

    font-weight:800;
}

.autor-info{
    min-width:0;

    flex:1;
}

.autor-nombre{
    font-size:15px;

    font-weight:800;

    overflow:hidden;

    text-overflow:ellipsis;

    white-space:nowrap;
}

.autor-tipo{
    margin-top:3px;

    color:#687a80;

    font-size:11px;
}

.publicacion-fecha{
    margin-top:3px;

    color:#8a999d;

    font-size:10px;
}

.publicacion-menu{
    width:36px;
    height:36px;

    border:0;

    background:transparent;

    color:#68797e;

    font-size:22px;

    cursor:pointer;

    border-radius:50%;
}

.publicacion-menu:hover{
    background:#eef2f3;
}

.publicacion-texto{
    padding:
        4px 15px 15px;

    font-size:15px;

    line-height:1.55;

    white-space:pre-wrap;

    overflow-wrap:anywhere;
}


/* =========================================================
   ESTADÍSTICAS
========================================================= */

.publicacion-estadisticas{
    display:flex;

    justify-content:space-between;

    padding:
        8px 15px;

    color:#74858a;

    font-size:12px;

    border-top:
        1px solid #f0f2f3;
}


/* =========================================================
   ACCIONES
========================================================= */

.publicacion-acciones{
    display:flex;

    border-top:
        1px solid #edf0f1;

    padding:
        4px 7px;
}

.accion{
    flex:1;

    border:0;

    background:transparent;

    color:#5e7177;

    padding:10px 4px;

    border-radius:9px;

    font-size:13px;

    font-weight:700;

    cursor:pointer;
}

.accion:hover{
    background:#f1f4f5;
}

.accion.activo{
    color:#12343B;
}


/* =========================================================
   ESTADO
========================================================= */

.estado{
    background:white;

    border-radius:18px;

    padding:35px 20px;

    text-align:center;

    color:#697b80;

    box-shadow:
        0 2px 9px rgba(0,0,0,.06);
}

.estado-icono{
    font-size:40px;

    margin-bottom:10px;
}

.estado-titulo{
    font-size:16px;

    font-weight:800;

    color:#30474d;
}

.estado-texto{
    margin-top:6px;

    font-size:13px;
}


/* =========================================================
   MODAL PUBLICACIÓN
========================================================= */

.modal{
    position:fixed;

    inset:0;

    z-index:3000;

    background:
        rgba(0,0,0,.58);

    display:none;

    align-items:center;

    justify-content:center;

    padding:16px;
}

.modal.mostrar{
    display:flex;
}

.modal-card{
    width:100%;

    max-width:520px;

    max-height:
        calc(100vh - 32px);

    background:white;

    border-radius:20px;

    overflow:hidden;

    box-shadow:
        0 15px 50px rgba(0,0,0,.25);

    display:flex;

    flex-direction:column;
}

.modal-header{
    display:flex;

    align-items:center;

    justify-content:space-between;

    padding:16px;

    border-bottom:
        1px solid #edf0f1;
}

.modal-title{
    font-size:18px;

    font-weight:800;
}

.modal-close{
    width:36px;
    height:36px;

    border:0;

    border-radius:50%;

    background:#eef2f3;

    color:#455c62;

    font-size:20px;

    cursor:pointer;
}

.modal-body{
    padding:16px;

    overflow-y:auto;
}

.modal-textarea{
    width:100%;

    min-height:170px;

    resize:vertical;

    border:
        1px solid #d7e0e2;

    border-radius:14px;

    padding:14px;

    font-family:inherit;

    font-size:15px;

    line-height:1.5;

    outline:none;
}

.modal-textarea:focus{
    border-color:#12343B;

    box-shadow:
        0 0 0 3px
        rgba(18,52,59,.08);
}

.modal-footer{
    display:flex;

    gap:10px;

    padding:0 16px 16px;
}

.modal-btn{
    flex:1;

    border:0;

    border-radius:12px;

    padding:12px;

    font-size:14px;

    font-weight:800;

    cursor:pointer;
}

.modal-cancelar{
    background:#edf2f3;

    color:#345057;
}

.modal-publicar{
    background:#12343B;

    color:white;
}

.modal-publicar:disabled{
    opacity:.6;

    cursor:not-allowed;
}


/* =========================================================
   MODAL COMENTARIOS
========================================================= */

.comentarios-modal-card{
    width:100%;

    max-width:600px;

    max-height:
        calc(100vh - 24px);

    background:white;

    border-radius:20px;

    overflow:hidden;

    display:flex;

    flex-direction:column;

    box-shadow:
        0 15px 50px rgba(0,0,0,.28);
}

.comentarios-lista{
    padding:15px;

    overflow-y:auto;

    flex:1;

    min-height:150px;

    max-height:55vh;

    display:flex;

    flex-direction:column;

    gap:12px;
}

.comentario{
    display:flex;

    gap:10px;

    align-items:flex-start;
}

.comentario-avatar{
    width:38px;
    height:38px;

    min-width:38px;

    border-radius:50%;

    object-fit:cover;

    background:#dce6e8;
}

.comentario-avatar-placeholder{
    width:38px;
    height:38px;

    min-width:38px;

    border-radius:50%;

    background:#12343B;

    color:white;

    display:flex;

    align-items:center;
    justify-content:center;

    font-size:12px;

    font-weight:800;
}

.comentario-contenido{
    background:#f0f3f4;

    border-radius:14px;

    padding:9px 12px;

    flex:1;

    min-width:0;
}

.comentario-nombre{
    font-size:12px;

    font-weight:800;

    color:#233b41;
}

.comentario-texto{
    margin-top:4px;

    font-size:13px;

    line-height:1.4;

    white-space:pre-wrap;

    overflow-wrap:anywhere;
}

.comentario-fecha{
    margin-top:5px;

    font-size:10px;

    color:#809095;
}

.sin-comentarios{
    text-align:center;

    padding:35px 15px;

    color:#75868b;

    font-size:13px;
}

.comentario-form{
    border-top:
        1px solid #e1e7e8;

    padding:12px;

    display:flex;

    gap:8px;

    background:white;
}

.comentario-input{
    flex:1;

    border:
        1px solid #d6dfe1;

    border-radius:22px;

    padding:11px 14px;

    outline:none;

    font-family:inherit;

    font-size:13px;
}

.comentario-input:focus{
    border-color:#12343B;
}

.comentario-enviar{
    width:44px;
    height:44px;

    border:0;

    border-radius:50%;

    background:#12343B;

    color:white;

    font-size:18px;

    cursor:pointer;
}

.comentario-enviar:disabled{
    opacity:.6;
}


/* =========================================================
   MENÚ OPCIONES PUBLICACIÓN
========================================================= */

.menu-publicacion{
    position:fixed;

    inset:0;

    z-index:4000;

    display:none;
}

.menu-publicacion.mostrar{
    display:block;
}

.menu-fondo{
    position:absolute;

    inset:0;

    background:
        rgba(0,0,0,.25);
}

.menu-panel{
    position:absolute;

    right:15px;

    top:75px;

    width:210px;

    background:white;

    border-radius:14px;

    overflow:hidden;

    box-shadow:
        0 8px 30px rgba(0,0,0,.20);
}

.menu-item{
    width:100%;

    border:0;

    background:white;

    padding:14px;

    text-align:left;

    font-size:14px;

    cursor:pointer;
}

.menu-item:hover{
    background:#f1f4f5;
}

.menu-eliminar{
    color:#c62828;

    font-weight:700;
}


/* =========================================================
   NAVEGACIÓN
========================================================= */

.red-nav{
    position:fixed;

    left:0;
    right:0;
    bottom:0;

    z-index:2000;

    height:72px;

    background:white;

    border-top:
        1px solid #dce4e6;

    box-shadow:
        0 -3px 15px
        rgba(0,0,0,.09);

    padding-bottom:
        env(safe-area-inset-bottom);
}

.red-nav-inner{
    width:100%;

    max-width:900px;

    height:100%;

    margin:auto;

    display:flex;

    align-items:stretch;
}

.red-nav-item{
    position:relative;

    flex:1;

    border:0;

    background:white;

    color:#718288;

    display:flex;

    flex-direction:column;

    align-items:center;

    justify-content:center;

    gap:2px;

    font-size:10px;

    font-weight:700;

    cursor:pointer;
}

.red-nav-item:hover{
    color:#12343B;
}

.red-nav-item.activo{
    color:#12343B;
}

.red-nav-icon{
    font-size:22px;

    line-height:25px;
}

.red-nav-item.activo::before{
    content:"";

    position:absolute;

    top:0;

    left:30%;

    right:30%;

    height:3px;

    background:#12343B;

    border-radius:
        0 0 5px 5px;
}

.nav-badge{
    position:absolute;

    top:5px;

    left:calc(50% + 7px);

    min-width:18px;

    height:18px;

    padding:0 5px;

    border-radius:20px;

    display:flex;

    align-items:center;
    justify-content:center;

    background:#d62828;

    color:white;

    font-size:9px;

    font-weight:800;

    border:2px solid white;
}


/* =========================================================
   TOAST
========================================================= */

.toast{
    position:fixed;

    left:50%;

    bottom:88px;

    z-index:5000;

    transform:
        translateX(-50%)
        translateY(20px);

    background:#12343B;

    color:white;

    padding:
        12px 17px;

    border-radius:12px;

    font-size:13px;

    text-align:center;

    max-width:90%;

    opacity:0;

    pointer-events:none;

    transition:
        opacity .25s ease,
        transform .25s ease;
}

.toast.mostrar{
    opacity:1;

    transform:
        translateX(-50%)
        translateY(0);
}


/* =========================================================
   RESPONSIVE
========================================================= */

@media(min-width:700px){

    .main{
        padding:
            20px 18px 40px;
    }

    .header-inner{
        padding:
            15px 18px;
    }

    .brand-name{
        font-size:21px;
    }

    .publicacion-texto{
        font-size:16px;
    }

}

@media(min-width:1000px){

    body{
        padding-bottom:35px;
    }

    .main{
        max-width:850px;

        padding-top:25px;
    }

    .red-nav{
        left:50%;

        right:auto;

        bottom:18px;

        width:min(760px,92%);

        height:66px;

        transform:
            translateX(-50%);

        border:
            1px solid #dce4e6;

        border-radius:18px;

        overflow:hidden;
    }

    .toast{
        bottom:100px;
    }

}

@media(max-width:380px){

    .main{
        padding-left:8px;
        padding-right:8px;
    }

    .brand-subtitle{
        display:none;
    }

    .brand-logo{
        width:38px;
        height:38px;
    }

    .brand-name{
        font-size:18px;
    }

    .header-notification{
        width:38px;
        height:38px;
    }

    .red-nav-item{
        font-size:9px;
    }

    .red-nav-icon{
        font-size:20px;
    }

}

</style>

</head>


<body>


<!-- =========================================================
     HEADER
========================================================= -->

<header class="header">

    <div class="header-inner">

        <div class="header-top">

            <div class="brand">

                <div class="brand-logo">
                    G
                </div>

                <div class="brand-text">

                    <div class="brand-name">
                        Red GESBASE
                    </div>

                    <div class="brand-subtitle">
                        Red profesional
                    </div>

                </div>

            </div>


            <button
                class="header-notification"
                type="button"
                onclick="location.href='red-notificaciones.html'"
                aria-label="Notificaciones"
            >
                🔔
            </button>

        </div>

    </div>

</header>


<!-- =========================================================
     MAIN
========================================================= -->

<main class="main">


<section class="welcome">

    <div class="welcome-content">

        <div id="welcomeAvatar"></div>

        <div>

            <div
                id="welcomeTitle"
                class="welcome-title"
            >
                ¡Bienvenido a Red GESBASE!
            </div>

            <div class="welcome-text">
                Compartí, conectate y descubrí personas y negocios.
            </div>

        </div>

    </div>

</section>


<section class="crear-publicacion">

    <div class="crear-top">

        <div id="crearAvatar"></div>

        <button
            id="abrirModal"
            class="crear-input"
            type="button"
        >
            ¿Qué querés publicar?
        </button>

    </div>


    <div class="crear-acciones">

        <button
            class="crear-accion"
            type="button"
            id="btnPublicar"
        >
            📝 Publicación
        </button>

        <button
            class="crear-accion"
            type="button"
            onclick="location.href='red-perfil.html'"
        >
            👤 Mi perfil
        </button>

    </div>

</section>


<section
    id="feed"
    class="feed"
></section>


<div
    id="estado"
    class="estado"
    style="display:none;"
>

    <div class="estado-icono">
        📭
    </div>

    <div class="estado-titulo">
        Todavía no hay publicaciones
    </div>

    <div class="estado-texto">
        Sé el primero en publicar algo en la Red GESBASE.
    </div>

</div>


</main>


<!-- =========================================================
     MODAL CREAR PUBLICACIÓN
========================================================= -->

<div
    id="modalPublicacion"
    class="modal"
>

    <div class="modal-card">

        <div class="modal-header">

            <div class="modal-title">
                Crear publicación
            </div>

            <button
                id="cerrarModal"
                class="modal-close"
                type="button"
            >
                ×
            </button>

        </div>


        <div class="modal-body">

            <textarea
                id="textoPublicacion"
                class="modal-textarea"
                maxlength="5000"
                placeholder="¿Qué querés compartir con la Red GESBASE?"
            ></textarea>

        </div>


        <div class="modal-footer">

            <button
                id="cancelarPublicacion"
                class="modal-btn modal-cancelar"
                type="button"
            >
                Cancelar
            </button>

            <button
                id="confirmarPublicacion"
                class="modal-btn modal-publicar"
                type="button"
            >
                Publicar
            </button>

        </div>

    </div>

</div>


<!-- =========================================================
     MODAL COMENTARIOS
========================================================= -->

<div
    id="modalComentarios"
    class="modal"
>

    <div class="comentarios-modal-card">

        <div class="modal-header">

            <div
                id="tituloComentarios"
                class="modal-title"
            >
                Comentarios
            </div>

            <button
                id="cerrarComentarios"
                class="modal-close"
                type="button"
            >
                ×
            </button>

        </div>


        <div
            id="listaComentarios"
            class="comentarios-lista"
        >

            <div class="sin-comentarios">
                Cargando comentarios...
            </div>

        </div>


        <form
            id="formComentario"
            class="comentario-form"
        >

            <input
                id="inputComentario"
                class="comentario-input"
                type="text"
                maxlength="1000"
                autocomplete="off"
                placeholder="Escribí un comentario..."
            >

            <button
                id="enviarComentario"
                class="comentario-enviar"
                type="submit"
                aria-label="Enviar comentario"
            >
                ➤
            </button>

        </form>

    </div>

</div>


<!-- =========================================================
     MENÚ DE PUBLICACIÓN
========================================================= -->

<div
    id="menuPublicacion"
    class="menu-publicacion"
>

    <div
        id="menuFondo"
        class="menu-fondo"
    ></div>


    <div class="menu-panel">

        <button
            id="btnEliminarPublicacion"
            class="menu-item menu-eliminar"
            type="button"
        >
            🗑️ Eliminar publicación
        </button>

    </div>

</div>


<!-- =========================================================
     TOAST
========================================================= -->

/* =========================================================
   CARGAR USUARIO
========================================================= */

async function cargarUsuario(){

    try{

        const referencia =
            doc(
                db,
                "usuariosRed",
                usuarioActual.uid
            );


        const snapshot =
            await getDoc(
                referencia
            );


        if(snapshot.exists()){

            perfilActual =
                snapshot.data();

            perfilesCache.set(
                usuarioActual.uid,
                perfilActual
            );

        }
        else{

            perfilActual = {

                uid:
                    usuarioActual.uid,

                nombreCompleto:
                    usuarioActual.displayName ||
                    usuarioActual.email ||
                    "Usuario GESBASE",

                tipoPerfil:
                    "persona",

                fotoPerfil:
                    usuarioActual.photoURL ||
                    ""

            };

        }


        const nombre =
            obtenerNombrePerfil(
                perfilActual
            );


        welcomeTitle.textContent =
            "¡Hola, " + nombre + "!";


        colocarAvatar(
            welcomeAvatar,
            perfilActual.fotoPerfil ||
            usuarioActual.photoURL ||
            "",
            nombre,
            "welcome"
        );


        colocarAvatar(
            crearAvatar,
            perfilActual.fotoPerfil ||
            usuarioActual.photoURL ||
            "",
            nombre,
            "crear"
        );


    }catch(error){

        console.error(
            "Error cargando usuario:",
            error
        );


        welcomeTitle.textContent =
            "¡Hola!";


        colocarAvatar(
            welcomeAvatar,
            "",
            "Usuario",
            "welcome"
        );


        colocarAvatar(
            crearAvatar,
            "",
            "Usuario",
            "crear"
        );

    }

}


/* =========================================================
   PERFIL
========================================================= */

async function obtenerPerfil(uid){

    if(!uid){

        return null;

    }


    if(
        perfilesCache.has(uid)
    ){

        return perfilesCache.get(uid);

    }


    try{

        const referencia =
            doc(
                db,
                "usuariosRed",
                uid
            );


        const snapshot =
            await getDoc(
                referencia
            );


        if(snapshot.exists()){

            const perfil =
                snapshot.data();


            perfilesCache.set(
                uid,
                perfil
            );


            return perfil;

        }

    }catch(error){

        console.warn(
            "No se pudo obtener perfil:",
            error
        );

    }


    return null;

}


function obtenerNombrePerfil(perfil){

    if(!perfil){

        return "Usuario GESBASE";

    }


    return (
        perfil.nombreCompleto ||
        perfil.nombre ||
        perfil.nombreEmpresa ||
        perfil.razonSocial ||
        "Usuario GESBASE"
    );

}


/* =========================================================
   AVATAR
========================================================= */

function colocarAvatar(
    contenedor,
    foto,
    nombre,
    tipo
){

    contenedor.innerHTML = "";


    if(foto){

        const img =
            document.createElement("img");


        img.src =
            foto;

        img.alt =
            nombre;

        img.loading =
            "lazy";


        if(tipo === "welcome"){

            img.className =
                "welcome-avatar";

        }
        else if(tipo === "crear"){

            img.className =
                "crear-avatar";

        }


        img.onerror = () => {

            contenedor.innerHTML = "";

            colocarPlaceholder(
                contenedor,
                nombre,
                tipo
            );

        };


        contenedor.appendChild(
            img
        );


        return;

    }


    colocarPlaceholder(
        contenedor,
        nombre,
        tipo
    );

}


function colocarPlaceholder(
    contenedor,
    nombre,
    tipo
){

    const div =
        document.createElement("div");


    if(tipo === "welcome"){

        div.className =
            "welcome-placeholder";

    }
    else if(tipo === "crear"){

        div.className =
            "welcome-placeholder";

        div.style.width =
            "44px";

        div.style.height =
            "44px";

        div.style.minWidth =
            "44px";

        div.style.fontSize =
            "14px";

    }


    div.textContent =
        obtenerIniciales(
            nombre
        );


    contenedor.appendChild(
        div
    );

}


function obtenerIniciales(nombre){

    if(!nombre){

        return "G";

    }


    const partes =
        String(nombre)
            .trim()
            .split(/\s+/)
            .filter(Boolean);


    if(partes.length === 1){

        return partes[0]
            .substring(0,2)
            .toUpperCase();

    }


    return (
        partes[0][0] +
        partes[
            partes.length - 1
        ][0]
    ).toUpperCase();

}


/* =========================================================
   CARGAR PUBLICACIONES
========================================================= */

function cargarPublicaciones(){

    if(publicacionesEscuchadas){

        return;

    }


    publicacionesEscuchadas =
        true;


    const consulta =
        query(
            collection(
                db,
                "publicaciones"
            ),
            orderBy(
                "fecha",
                "desc"
            ),
            limit(30)
        );


    onSnapshot(
        consulta,
        async snapshot => {

            feed.innerHTML = "";


            if(snapshot.empty){

                estado.style.display =
                    "block";

                return;

            }


            estado.style.display =
                "none";


            const publicaciones = [];


            snapshot.forEach(
                documento => {

                    publicaciones.push({

                        id:
                            documento.id,

                        ...documento.data()

                    });

                }
            );


            for(
                const publicacion
                of publicaciones
            ){

                const tarjeta =
                    await renderizarPublicacion(
                        publicacion
                    );


                if(tarjeta){

                    feed.appendChild(
                        tarjeta
                    );

                }

            }

        },

        error => {

            console.error(
                "Error cargando publicaciones:",
                error
            );


            estado.style.display =
                "block";


            estado.innerHTML = `

                <div class="estado-icono">
                    ⚠️
                </div>

                <div class="estado-titulo">
                    No se pudieron cargar las publicaciones
                </div>

                <div class="estado-texto">
                    Revisá la conexión e intentá nuevamente.
                </div>

            `;

        }
    );

}
