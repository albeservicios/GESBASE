</main></div><script type="module">


// =====================================================
// GESBASE - EDITAR CLIENTE
// =====================================================
// No modifica Js/firebase.js
//
// Utiliza:
// auth
// db
//
// Cliente:
// clientes/{clienteId}
// =====================================================


import {
    auth,
    db
} from "./Js/firebase.js";


import {
    onAuthStateChanged
} from "https://www.gstatic.com/firebasejs/12.18.0/firebase-auth.js";


import {
    doc,
    getDoc,
    updateDoc,
    serverTimestamp
} from "https://www.gstatic.com/firebasejs/12.18.0/firebase-firestore.js";


// =====================================================
// ELEMENTOS
// =====================================================

const usuarioElemento =
    document.getElementById("usuario");

const errorElemento =
    document.getElementById("error");

const exitoElemento =
    document.getElementById("exito");

const estadoElemento =
    document.getElementById("estado");

const formulario =
    document.getElementById("formulario");

const botonGuardar =
    document.getElementById("botonGuardar");

const botonVolver =
    document.getElementById("botonVolver");


// Campos

const nombre =
    document.getElementById("nombre");

const cuit =
    document.getElementById("cuit");

const telefono =
    document.getElementById("telefono");

const email =
    document.getElementById("email");

const direccion =
    document.getElementById("direccion");

const localidad =
    document.getElementById("localidad");

const provincia =
    document.getElementById("provincia");

const observaciones =
    document.getElementById("observaciones");


// =====================================================
// ID DEL CLIENTE
// =====================================================

const parametros =
    new URLSearchParams(
        window.location.search
    );

const clienteId =
    parametros.get("id");


// =====================================================
// USUARIO
// =====================================================

let usuarioActual = null;


// =====================================================
// MOSTRAR ERROR
// =====================================================

function mostrarError(mensaje){

    errorElemento.textContent =
        mensaje;

    errorElemento.style.display =
        "block";
}


// =====================================================
// OCULTAR ERROR
// =====================================================

function ocultarError(){

    errorElemento.textContent =
        "";

    errorElemento.style.display =
        "none";
}


// =====================================================
// MOSTRAR ÉXITO
// =====================================================

function mostrarExito(mensaje){

    exitoElemento.textContent =
        mensaje;

    exitoElemento.style.display =
        "block";
}


// =====================================================
// OCULTAR ÉXITO
// =====================================================

function ocultarExito(){

    exitoElemento.textContent =
        "";

    exitoElemento.style.display =
        "none";
}


// =====================================================
// CARGAR CLIENTE
// =====================================================

async function cargarCliente(){

    ocultarError();
    ocultarExito();


    if(!clienteId){

        mostrarError(
            "No se recibió el ID del cliente."
        );

        estadoElemento.style.display =
            "none";

        return;
    }


    try{

        estadoElemento.style.display =
            "block";

        estadoElemento.textContent =
            "Cargando cliente...";


        formulario.style.display =
            "none";


        const referencia =
            doc(
                db,
                "clientes",
                clienteId
            );


        const resultado =
            await getDoc(
                referencia
            );


        if(!resultado.exists()){

            mostrarError(
                "El cliente no existe o fue eliminado."
            );

            estadoElemento.style.display =
                "none";

            return;
        }


        const datos =
            resultado.data();


        // =================================================
        // VERIFICAR PROPIETARIO
        // =================================================

        if(
            datos.uid &&
            datos.uid !== usuarioActual.uid
        ){

            mostrarError(
                "No tenés permiso para editar este cliente."
            );

            estadoElemento.style.display =
                "none";

            return;
        }


        // =================================================
        // CARGAR DATOS EN FORMULARIO
        // =================================================

        nombre.value =
            datos.nombre ||
            datos.empresa ||
            "";

        cuit.value =
            datos.cuit ||
            "";

        telefono.value =
            datos.telefono ||
            "";

        email.value =
            datos.email ||
            "";

        direccion.value =
            datos.direccion ||
            "";

        localidad.value =
            datos.localidad ||
            "";

        provincia.value =
            datos.provincia ||
            "";

        observaciones.value =
            datos.observaciones ||
            "";


        estadoElemento.style.display =
            "none";

        formulario.style.display =
            "block";

    }
    catch(error){

        console.error(
            "Error cargando cliente:",
            error
        );


        estadoElemento.style.display =
            "none";


        mostrarError(
            "No se pudo cargar el cliente: " +
            error.message
        );
    }
}


// =====================================================
// GUARDAR CAMBIOS
// =====================================================

formulario.addEventListener(
    "submit",
    async function(event){

        event.preventDefault();


        ocultarError();
        ocultarExito();


        if(!usuarioActual){

            mostrarError(
                "No hay una sesión activa."
            );

            return;
        }


        if(!clienteId){

            mostrarError(
                "No se encontró el ID del cliente."
            );

            return;
        }


        const nombreFinal =
            nombre.value.trim();


        if(!nombreFinal){

            mostrarError(
                "Ingresá el nombre o empresa del cliente."
            );

            nombre.focus();

            return;
        }


        botonGuardar.disabled =
            true;

        botonGuardar.textContent =
            "⏳ GUARDANDO...";


        try{

            const referencia =
                doc(
                    db,
                    "clientes",
                    clienteId
                );


            // =================================================
            // COMPROBAR NUEVAMENTE EL PROPIETARIO
            // =================================================

            const resultado =
                await getDoc(
                    referencia
                );


            if(!resultado.exists()){

                throw new Error(
                    "El cliente ya no existe."
                );
            }


            const datosActuales =
                resultado.data();


            if(
                datosActuales.uid &&
                datosActuales.uid !==
                usuarioActual.uid
            ){

                throw new Error(
                    "No tenés permiso para modificar este cliente."
                );
            }


            // =================================================
            // ACTUALIZAR
            // =================================================

            await updateDoc(
                referencia,
                {

                    nombre:
                        nombreFinal,

                    cuit:
                        cuit.value.trim(),

                    telefono:
                        telefono.value.trim(),

                    email:
                        email.value.trim(),

                    direccion:
                        direccion.value.trim(),

                    localidad:
                        localidad.value.trim(),

                    provincia:
                        provincia.value.trim(),

                    observaciones:
                        observaciones.value.trim(),

                    actualizadoEn:
                        serverTimestamp()

                }
            );


            mostrarExito(
                "Cliente actualizado correctamente."
            );


            botonGuardar.textContent =
                "✅ CAMBIOS GUARDADOS";


            setTimeout(
                function(){

                    window.location.href =
                        "ver-cliente.html?id=" +
                        encodeURIComponent(
                            clienteId
                        );

                },
                1000
            );

    }
        catch(error){

            console.error(
                "Error actualizando cliente:",
                error
            );


            mostrarError(
                "No se pudo actualizar el cliente: " +
                error.message
            );


            botonGuardar.disabled =
                false;

            botonGuardar.textContent =
                "💾 GUARDAR CAMBIOS";

        }

    }
);


// =====================================================
// AUTENTICACIÓN
// =====================================================

onAuthStateChanged(
    auth,
    async function(usuario){

        if(!usuario){

            window.location.replace(
                "login.html"
            );

            return;
        }


        usuarioActual =
            usuario;


        usuarioElemento.textContent =
            "Usuario: " +
            (
                usuario.email ||
                "Usuario autenticado"
            );


        await cargarCliente();

    }
);

</script></body></html>
