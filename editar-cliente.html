<!DOCTYPE html>
<html lang="es">

<head>

<meta charset="UTF-8">

<meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
>

<meta
    name="theme-color"
    content="#111827"
>

<title>Editar cliente - GESBASE</title>

<style>

*{
    box-sizing:border-box;
    margin:0;
    padding:0;
}

body{
    font-family:Arial,sans-serif;
    background:#f3f4f6;
    color:#111827;
}

.contenedor{
    max-width:700px;
    margin:auto;
    min-height:100vh;
    background:white;
}

header{
    background:#111827;
    color:white;
    padding:25px 20px;
}

header h1{
    font-size:25px;
}

header p{
    margin-top:6px;
    color:#d1d5db;
    font-size:14px;
}

main{
    padding:20px;
}

.usuario{
    background:#f3f4f6;
    padding:13px;
    border-radius:10px;
    margin-bottom:18px;
    font-size:14px;
}

.formulario{
    border:1px solid #d1d5db;
    border-radius:14px;
    padding:20px;
}

.grupo{
    margin-bottom:16px;
}

label{
    display:block;
    font-size:14px;
    font-weight:bold;
    margin-bottom:7px;
}

input,
textarea{
    width:100%;
    padding:13px;
    border:1px solid #d1d5db;
    border-radius:9px;
    font-size:15px;
    outline:none;
    font-family:Arial,sans-serif;
}

input:focus,
textarea:focus{
    border-color:#2563eb;
}

textarea{
    min-height:110px;
    resize:vertical;
}

.boton{
    display:block;
    width:100%;
    padding:15px;
    border:none;
    border-radius:10px;
    margin-top:12px;
    font-size:16px;
    font-weight:bold;
    cursor:pointer;
    text-align:center;
    text-decoration:none;
}

.guardar{
    background:#111827;
    color:white;
}

.guardar:disabled{
    opacity:.6;
    cursor:not-allowed;
}

.volver{
    background:#e5e7eb;
    color:#111827;
}

.cargando{
    text-align:center;
    padding:40px 20px;
    color:#6b7280;
}

.error{
    display:none;
    background:#fee2e2;
    color:#991b1b;
    padding:14px;
    border-radius:10px;
    margin-bottom:15px;
    line-height:1.5;
}

.exito{
    display:none;
    background:#dcfce7;
    color:#166534;
    padding:14px;
    border-radius:10px;
    margin-bottom:15px;
    line-height:1.5;
}

</style>

</head>


<body>


<div class="contenedor">


<header>

<h1>
Editar cliente
</h1>

<p>
GESBASE
</p>

</header>


<main>


<div
    id="usuario"
    class="usuario"
>
Verificando usuario...
</div>


<div
    id="cargando"
    class="cargando"
>
Cargando cliente...
</div>


<div
    id="error"
    class="error"
></div>


<div
    id="exito"
    class="exito"
>
Cliente actualizado correctamente.
</div>


<div
    id="formulario"
    class="formulario"
    style="display:none;"
>


<div class="grupo">

<label for="nombre">
Nombre / Empresa
</label>

<input
    type="text"
    id="nombre"
    placeholder="Nombre del cliente o empresa"
    autocomplete="name"
>

</div>


<div class="grupo">

<label for="cuit">
CUIT
</label>

<input
    type="text"
    id="cuit"
    placeholder="20-12345678-9"
    autocomplete="off"
>

</div>


<div class="grupo">

<label for="telefono">
Teléfono
</label>

<input
    type="tel"
    id="telefono"
    placeholder="Teléfono del cliente"
    autocomplete="tel"
>

</div>


<div class="grupo">

<label for="email">
Email
</label>

<input
    type="email"
    id="email"
    placeholder="correo@ejemplo.com"
    autocomplete="email"
>

</div>


<div class="grupo">

<label for="direccion">
Dirección
</label>

<input
    type="text"
    id="direccion"
    placeholder="Dirección"
    autocomplete="street-address"
>

</div>


<div class="grupo">

<label for="localidad">
Localidad
</label>

<input
    type="text"
    id="localidad"
    placeholder="Localidad"
>

</div>


<div class="grupo">

<label for="provincia">
Provincia
</label>

<input
    type="text"
    id="provincia"
    placeholder="Provincia"
>

</div>


<div class="grupo">

<label for="observaciones">
Observaciones
</label>

<textarea
    id="observaciones"
    placeholder="Observaciones del cliente"
></textarea>

</div>


<button
    id="btnGuardar"
    class="boton guardar"
    type="button"
>
💾 GUARDAR CAMBIOS
</button>


<a
    href="clientes.html"
    class="boton volver"
>
⬅️ VOLVER A CLIENTES
</a>


</div>


</main>

</div>


<script type="module">


// ==========================================
// FIREBASE
// ==========================================

import {
    auth,
    db
} from "./Js/firebase.js";


import {
    onAuthStateChanged
} from
"https://www.gstatic.com/firebasejs/12.1.0/firebase-auth.js";


import {
    doc,
    getDoc,
    updateDoc,
    serverTimestamp
} from
"https://www.gstatic.com/firebasejs/12.1.0/firebase-firestore.js";


// ==========================================
// ELEMENTOS
// ==========================================

const usuarioElemento =
document.getElementById("usuario");

const cargando =
document.getElementById("cargando");

const errorElemento =
document.getElementById("error");

const exitoElemento =
document.getElementById("exito");

const formulario =
document.getElementById("formulario");

const btnGuardar =
document.getElementById("btnGuardar");

const campoNombre =
document.getElementById("nombre");

const campoCuit =
document.getElementById("cuit");

const campoTelefono =
document.getElementById("telefono");

const campoEmail =
document.getElementById("email");

const campoDireccion =
document.getElementById("direccion");

const campoLocalidad =
document.getElementById("localidad");

const campoProvincia =
document.getElementById("provincia");

const campoObservaciones =
document.getElementById("observaciones");


// ==========================================
// ID DEL CLIENTE
// ==========================================

const parametros =
new URLSearchParams(
    window.location.search
);

const clienteId =
parametros.get("id");


let usuarioActual = null;

let datosCliente = null;


// ==========================================
// MOSTRAR ERROR
// ==========================================

function mostrarError(mensaje){

    errorElemento.textContent =
    mensaje;

    errorElemento.style.display =
    "block";

}


function ocultarError(){

    errorElemento.textContent =
    "";

    errorElemento.style.display =
    "none";

}


// ==========================================
// MOSTRAR ÉXITO
// ==========================================

function mostrarExito(mensaje){

    exitoElemento.textContent =
    mensaje;

    exitoElemento.style.display =
    "block";

}


// ==========================================
// VERIFICAR PROPIETARIO DEL CLIENTE
// ==========================================

function clientePerteneceAlUsuario(datos){

    if(!usuarioActual){
        return false;
    }

    const uid =
    usuarioActual.uid;


    /*
     * GESBASE puede tener clientes
     * guardados con diferentes campos
     * según la versión del módulo.
     *
     * Aceptamos:
     *
     * uid
     * usuarioId
     * empresaId
     *
     * cuando alguno coincide con
     * el usuario autenticado.
     */

    return (
        datos.uid === uid ||
        datos.usuarioId === uid ||
        datos.empresaId === uid
    );

}


// ==========================================
// CARGAR CLIENTE
// ==========================================

async function cargarCliente(){

    ocultarError();


    if(!clienteId){

        mostrarError(
            "No se recibió el ID del cliente. Volvé a Clientes y seleccioná nuevamente el cliente."
        );

        cargando.style.display =
        "none";

        return;

    }


    if(!usuarioActual){

        mostrarError(
            "No hay un usuario autenticado."
        );

        cargando.style.display =
        "none";

        return;

    }


    try{

        const referencia =
        doc(
            db,
            "clientes",
            clienteId
        );


        const resultado =
        await getDoc(
            referencia
        );


        if(!resultado.exists()){

            mostrarError(
                "El cliente no existe o fue eliminado."
            );

            cargando.style.display =
            "none";

            return;

        }


        datosCliente =
        resultado.data();


        // ==================================
        // SEGURIDAD
        // ==================================

        if(
            !clientePerteneceAlUsuario(
                datosCliente
            )
        ){

            mostrarError(
                "No tenés permiso para editar este cliente."
            );

            cargando.style.display =
            "none";

            return;

        }


        // ==================================
        // CARGAR DATOS
        // ==================================

        campoNombre.value =
        datosCliente.nombre ||
        datosCliente.empresa ||
        datosCliente.razonSocial ||
        datosCliente.razon_social ||
        "";


        campoCuit.value =
        datosCliente.cuit ||
        datosCliente.CUIT ||
        "";


        campoTelefono.value =
        datosCliente.telefono ||
        datosCliente.tel ||
        datosCliente.celular ||
        "";


        campoEmail.value =
        datosCliente.email ||
        datosCliente.correo ||
        "";


        campoDireccion.value =
        datosCliente.direccion ||
        datosCliente.domicilio ||
        "";


        campoLocalidad.value =
        datosCliente.localidad ||
        "";


        campoProvincia.value =
        datosCliente.provincia ||
        "";


        campoObservaciones.value =
        datosCliente.observaciones ||
        "";


        // ==================================
        // MOSTRAR FORMULARIO
        // ==================================

        cargando.style.display =
        "none";

        formulario.style.display =
        "block";

    }
    catch(error){

        console.error(
            "Error cargando cliente:",
            error
        );


        cargando.style.display =
        "none";


        mostrarError(
            "Error al cargar el cliente: " +
            error.message
        );

    }

}


// ==========================================
// GUARDAR CAMBIOS
// ==========================================

btnGuardar.addEventListener(
    "click",
    async function(){

        ocultarError();


        if(!usuarioActual){

            mostrarError(
                "La sesión expiró. Volvé a iniciar sesión."
            );

            return;

        }


        if(!clienteId){

            mostrarError(
                "No se encontró el ID del cliente."
            );

            return;

        }


        const nombre =
        campoNombre.value.trim();


        if(!nombre){

            mostrarError(
                "Ingresá el nombre o empresa del cliente."
            );

            campoNombre.focus();

            return;

        }


        btnGuardar.disabled =
        true;

        btnGuardar.textContent =
        "⏳ GUARDANDO...";


        try{

            // ==================================
            // REFERENCIA
            // ==================================

            const referencia =
            doc(
                db,
                "clientes",
                clienteId
            );


            // ==================================
            // VERIFICACIÓN FINAL
            // ==================================

            const resultado =
            await getDoc(
                referencia
            );


            if(!resultado.exists()){

                throw new Error(
                    "El cliente ya no existe."
                );

            }


            const datos =
            resultado.data();


            if(
                !clientePerteneceAlUsuario(
                    datos
                )
            ){

                throw new Error(
                    "No tenés permiso para modificar este cliente."
                );

            }


            // ==================================
            // DATOS A GUARDAR
            // ==================================

            const datosActualizados = {

                nombre:
                nombre,

                cuit:
                campoCuit.value.trim(),

                telefono:
                campoTelefono.value.trim(),

                email:
                campoEmail.value.trim(),

                direccion:
                campoDireccion.value.trim(),

                localidad:
                campoLocalidad.value.trim(),

                provincia:
                campoProvincia.value.trim(),

                observaciones:
                campoObservaciones.value.trim(),

                actualizado:
                serverTimestamp()

            };


            // ==================================
            // ACTUALIZAR FIRESTORE
            // ==================================

            await updateDoc(
                referencia,
                datosActualizados
            );


            // ==================================
            // ÉXITO
            // ==================================

            mostrarExito(
                "Cliente actualizado correctamente."
            );


            btnGuardar.textContent =
            "✅ CAMBIOS GUARDADOS";


            /*
             * Volvemos al listado después
             * de guardar correctamente.
             */

            setTimeout(
                function(){

                    window.location.href =
                    "clientes.html";

                },
                1000
            );

        }
        catch(error){

            console.error(
                "Error actualizando cliente:",
                error
            );


            mostrarError(
                "No se pudieron guardar los cambios: " +
                error.message
            );


            btnGuardar.disabled =
            false;


            btnGuardar.textContent =
            "💾 GUARDAR CAMBIOS";

        }

    }
);


// ==========================================
// AUTENTICACIÓN
// ==========================================

onAuthStateChanged(
    auth,
    async function(usuario){

        if(!usuario){

            window.location.replace(
                "login.html"
            );

            return;

        }


        usuarioActual =
        usuario;


        usuarioElemento.textContent =
        "Usuario: " +
        (
            usuario.email ||
            "Usuario autenticado"
        );


        await cargarCliente();

    }
);

</script>


</body>

</html>
