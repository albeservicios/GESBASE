<!DOCTYPE html>
<html lang="es">

<head>

<meta charset="UTF-8">

<meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
>

<meta
    name="theme-color"
    content="#111827"
>

<title>GESBASE - Choferes</title>

<style>

* {
    box-sizing: border-box;
}

body {
    margin: 0;
    font-family:
        -apple-system,
        BlinkMacSystemFont,
        "Segoe UI",
        Roboto,
        Arial,
        sans-serif;

    background: #f3f4f6;
    color: #111827;
}

header {
    background: #111827;
    color: white;
    padding: 18px 20px;
}

.header-contenido {
    max-width: 1150px;
    margin: auto;
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 15px;
}

.logo {
    font-size: 22px;
    font-weight: 800;
}

.subtitulo {
    font-size: 13px;
    opacity: .75;
    margin-top: 3px;
}

.contenedor {
    max-width: 1150px;
    margin: auto;
    padding: 20px;
}

.barra-superior {
    display: flex;
    justify-content: space-between;
    align-items: center;
    gap: 15px;
    margin-bottom: 20px;
    flex-wrap: wrap;
}

h1 {
    margin: 0;
    font-size: 26px;
}

.descripcion {
    color: #6b7280;
    margin-top: 5px;
}

.boton {
    border: 0;
    border-radius: 10px;
    padding: 12px 17px;
    cursor: pointer;
    font-size: 14px;
    font-weight: 700;
}

.boton-principal {
    background: #111827;
    color: white;
}

.boton-secundario {
    background: #e5e7eb;
    color: #111827;
}

.boton:hover {
    opacity: .9;
}

.resumen {
    display: grid;
    grid-template-columns: repeat(4, 1fr);
    gap: 15px;
    margin-bottom: 20px;
}

.tarjeta-resumen {
    background: white;
    border-radius: 15px;
    padding: 18px;
    box-shadow: 0 3px 12px rgba(0,0,0,.06);
}

.tarjeta-resumen .numero {
    font-size: 28px;
    font-weight: 800;
}

.tarjeta-resumen .texto {
    color: #6b7280;
    font-size: 14px;
    margin-top: 4px;
}

.panel {
    background: white;
    border-radius: 16px;
    padding: 20px;
    margin-bottom: 20px;
    box-shadow: 0 3px 12px rgba(0,0,0,.06);
}

.panel h2 {
    margin-top: 0;
    font-size: 20px;
}

.formulario {
    display: grid;
    grid-template-columns: repeat(2, 1fr);
    gap: 15px;
}

.campo {
    display: flex;
    flex-direction: column;
    gap: 6px;
}

.campo-completo {
    grid-column: 1 / -1;
}

label {
    font-size: 13px;
    font-weight: 700;
    color: #374151;
}

input,
select {
    width: 100%;
    padding: 12px;
    border: 1px solid #d1d5db;
    border-radius: 9px;
    font-size: 15px;
    background: white;
}

input:focus,
select:focus {
    outline: none;
    border-color: #111827;
}

.botones-formulario {
    grid-column: 1 / -1;
    display: flex;
    gap: 10px;
    margin-top: 5px;
}

.lista {
    display: grid;
    grid-template-columns: repeat(2, 1fr);
    gap: 15px;
}

.chofer {
    border: 1px solid #e5e7eb;
    border-radius: 14px;
    padding: 17px;
    background: #fff;
}

.chofer-cabecera {
    display: flex;
    justify-content: space-between;
    align-items: flex-start;
    gap: 10px;
}

.nombre {
    font-size: 19px;
    font-weight: 800;
}

.documento {
    color: #6b7280;
    font-size: 13px;
    margin-top: 3px;
}

.estado {
    padding: 5px 9px;
    border-radius: 20px;
    font-size: 12px;
    font-weight: 800;
}

.estado-activo {
    background: #dcfce7;
    color: #166534;
}

.estado-inactivo {
    background: #fee2e2;
    color: #991b1b;
}

.datos {
    margin-top: 15px;
    display: grid;
    gap: 8px;
}

.dato {
    font-size: 14px;
    color: #374151;
}

.dato strong {
    color: #111827;
}

.unidad-asignada {
    margin-top: 15px;
    padding: 12px;
    background: #f3f4f6;
    border-radius: 10px;
    font-size: 14px;
}

.sin-unidad {
    color: #6b7280;
}

.acciones {
    display: flex;
    gap: 8px;
    margin-top: 15px;
    flex-wrap: wrap;
}

.boton-pequeno {
    padding: 9px 12px;
    font-size: 13px;
}

.mensaje {
    padding: 14px;
    border-radius: 10px;
    margin-bottom: 15px;
    display: none;
}

.mensaje-error {
    background: #fee2e2;
    color: #991b1b;
}

.mensaje-ok {
    background: #dcfce7;
    color: #166534;
}

.cargando,
.vacio {
    text-align: center;
    padding: 35px 15px;
    color: #6b7280;
}

.bloqueado {
    text-align: center;
    padding: 60px 20px;
}

.bloqueado h2 {
    margin-bottom: 10px;
}

.bloqueado p {
    color: #6b7280;
}

@media (max-width: 800px) {

    .resumen {
        grid-template-columns: repeat(2, 1fr);
    }

    .lista {
        grid-template-columns: 1fr;
    }

}

@media (max-width: 600px) {

    .contenedor {
        padding: 15px;
    }

    .formulario {
        grid-template-columns: 1fr;
    }

    .campo-completo,
    .botones-formulario {
        grid-column: auto;
    }

    .resumen {
        grid-template-columns: 1fr 1fr;
    }

    .header-contenido {
        align-items: flex-start;
    }

}

</style>

</head>

<body>

<header>

    <div class="header-contenido">

        <div>
            <div class="logo">GESBASE</div>
            <div class="subtitulo">Gestión de choferes</div>
        </div>

        <button
            class="boton boton-secundario"
            onclick="volver()"
        >
            ← Volver
        </button>

    </div>

</header>


<div class="contenedor">

    <div id="mensaje" class="mensaje"></div>

    <div
        id="contenidoBloqueado"
        class="panel bloqueado"
        style="display:none;"
    >

        <h2>🚫 Módulo no habilitado</h2>

        <p>
            El módulo de Choferes no está habilitado
            para esta empresa.
        </p>

    </div>


    <div id="contenidoPrincipal" style="display:none;">

        <div class="barra-superior">

            <div>

                <h1>👨‍✈️ Choferes</h1>

                <div class="descripcion">
                    Administrá los choferes y sus unidades asignadas.
                </div>

            </div>

            <button
                id="botonNuevo"
                class="boton boton-principal"
                onclick="mostrarFormulario()"
            >
                + Registrar chofer
            </button>

        </div>


        <!-- RESUMEN -->

        <div class="resumen">

            <div class="tarjeta-resumen">

                <div
                    id="totalChoferes"
                    class="numero"
                >
                    0
                </div>

                <div class="texto">
                    Total choferes
                </div>

            </div>


            <div class="tarjeta-resumen">

                <div
                    id="choferesActivos"
                    class="numero"
                >
                    0
                </div>

                <div class="texto">
                    Activos
                </div>

            </div>


            <div class="tarjeta-resumen">

                <div
                    id="choferesConUnidad"
                    class="numero"
                >
                    0
                </div>

                <div class="texto">
                    Con unidad
                </div>

            </div>


            <div class="tarjeta-resumen">

                <div
                    id="choferesSinUnidad"
                    class="numero"
                >
                    0
                </div>

                <div class="texto">
                    Sin unidad
                </div>

            </div>

        </div>


        <!-- FORMULARIO -->

        <div
            id="panelFormulario"
            class="panel"
            style="display:none;"
        >

            <h2 id="tituloFormulario">
                Registrar chofer
            </h2>

            <div class="formulario">

                <div class="campo">

                    <label>
                        Nombre
                    </label>

                    <input
                        id="nombre"
                        type="text"
                        placeholder="Nombre"
                    >

                </div>


                <div class="campo">

                    <label>
                        Apellido
                    </label>

                    <input
                        id="apellido"
                        type="text"
                        placeholder="Apellido"
                    >

                </div>


                <div class="campo">

                    <label>
                        Documento
                    </label>

                    <input
                        id="documento"
                        type="text"
                        placeholder="DNI"
                    >

                </div>


                <div class="campo">

                    <label>
                        Teléfono
                    </label>

                    <input
                        id="telefono"
                        type="tel"
                        placeholder="Teléfono"
                    >

                </div>


                <div class="campo">

                    <label>
                        Licencia
                    </label>

                    <input
                        id="licencia"
                        type="text"
                        placeholder="Número de licencia"
                    >

                </div>


                <div class="campo">

                    <label>
                        Vencimiento de licencia
                    </label>

                    <input
                        id="vencimientoLicencia"
                        type="date"
                    >

                </div>


                <div class="campo">

                    <label>
                        Estado
                    </label>

                    <select id="estado">

                        <option value="Activo">
                            Activo
                        </option>

                        <option value="Inactivo">
                            Inactivo
                        </option>

                    </select>

                </div>


                <div class="campo">

                    <label>
                        Unidad asignada
                    </label>

                    <select id="unidad">

                        <option value="">
                            Sin unidad asignada
                        </option>

                    </select>

                </div>


                <div class="botones-formulario">

                    <button
                        class="boton boton-principal"
                        onclick="guardarChofer()"
                    >
                        Guardar chofer
                    </button>

                    <button
                        class="boton boton-secundario"
                        onclick="cerrarFormulario()"
                    >
                        Cancelar
                    </button>

                </div>

            </div>

        </div>


        <!-- LISTADO -->

        <div class="panel">

            <h2>📋 Choferes registrados</h2>

            <div
                id="listaChoferes"
                class="lista"
            >

                <div class="cargando">
                    Cargando choferes...
                </div>

            </div>

        </div>

    </div>

</div>


<script type="module">

import { auth, db } from "./Js/firebase.js";

import {
    onAuthStateChanged
} from "https://www.gstatic.com/firebasejs/12.18.0/firebase-auth.js";

import {
    doc,
    getDoc,
    collection,
    query,
    where,
    onSnapshot,
    addDoc,
    updateDoc,
    serverTimestamp,
    writeBatch
} from "https://www.gstatic.com/firebasejs/12.18.0/firebase-firestore.js";


const ADMIN_EMAIL =
    "julianbattauz006@gmail.com";


let usuarioActual = null;
let datosUsuario = null;
let empresaActualId = null;

let choferes = [];
let unidades = [];

let choferEditando = null;


/* =========================================================
   MENSAJES
========================================================= */

function mostrarMensaje(texto, tipo = "ok") {

    const mensaje =
        document.getElementById("mensaje");

    mensaje.textContent = texto;

    mensaje.className =
        "mensaje " +
        (tipo === "error"
            ? "mensaje-error"
            : "mensaje-ok");

    mensaje.style.display = "block";

    setTimeout(() => {

        mensaje.style.display = "none";

    }, 4000);
}


/* =========================================================
   AUTENTICACIÓN
========================================================= */

onAuthStateChanged(auth, async (usuario) => {

    if (!usuario) {

        window.location.href = "index.html";

        return;
    }

    usuarioActual = usuario;

    try {

        const refUsuario =
            doc(db, "usuarios", usuario.uid);

        const snapUsuario =
            await getDoc(refUsuario);

        if (!snapUsuario.exists()) {

            mostrarMensaje(
                "No se encontró la información del usuario.",
                "error"
            );

            return;
        }

        datosUsuario =
            snapUsuario.data();


        empresaActualId =
            datosUsuario.empresaId ||
            datosUsuario.idEmpresa ||
            datosUsuario.empresa ||
            usuario.uid;


        const refEmpresa =
            doc(db, "empresas", empresaActualId);

        const snapEmpresa =
            await getDoc(refEmpresa);


        if (!snapEmpresa.exists()) {

            mostrarMensaje(
                "No se encontró la empresa.",
                "error"
            );

            return;
        }


        const datosEmpresa =
            snapEmpresa.data();


        const esAdmin =
            usuario.email === ADMIN_EMAIL ||
            datosUsuario.rol === "admin" ||
            datosUsuario.rol === "administrador";


        const moduloHabilitado =
            datosEmpresa.modulos &&
            datosEmpresa.modulos.choferes === true;


        if (!moduloHabilitado && !esAdmin) {

            document
                .getElementById("contenidoBloqueado")
                .style.display = "block";

            return;
        }


        document
            .getElementById("contenidoPrincipal")
            .style.display = "block";


        if (!esAdmin) {

            document
                .getElementById("botonNuevo")
                .style.display = "none";

        }


        cargarChoferes();

        cargarUnidades();

    } catch (error) {

        console.error(error);

        mostrarMensaje(
            "Ocurrió un error al cargar el módulo.",
            "error"
        );

    }

});


/* =========================================================
   CARGAR CHOFERES
========================================================= */

function cargarChoferes() {

    const referencia =
        collection(db, "choferes");

    const consulta =
        query(
            referencia,
            where(
                "empresaId",
                "==",
                empresaActualId
            )
        );


    onSnapshot(
        consulta,
        (snapshot) => {

            choferes = [];

            snapshot.forEach((docSnap) => {

                choferes.push({

                    id: docSnap.id,
                    ...docSnap.data()

                });

            });


            renderizarChoferes();

            actualizarResumen();

        },
        (error) => {

            console.error(error);

            mostrarMensaje(
                "No se pudieron cargar los choferes.",
                "error"
            );

        }
    );

}


/* =========================================================
   CARGAR UNIDADES
========================================================= */

function cargarUnidades() {

    const referencia =
        collection(db, "unidades");

    const consulta =
        query(
            referencia,
            where(
                "empresaId",
                "==",
                empresaActualId
            )
        );


    onSnapshot(
        consulta,
        (snapshot) => {

            unidades = [];

            snapshot.forEach((docSnap) => {

                unidades.push({

                    id: docSnap.id,
                    ...docSnap.data()

                });

            });


            actualizarSelectorUnidades();

            renderizarChoferes();

        },
        (error) => {

            console.error(error);

            mostrarMensaje(
                "No se pudieron cargar las unidades.",
                "error"
            );

        }
    );

}


/* =========================================================
   SELECTOR DE UNIDADES
========================================================= */

function actualizarSelectorUnidades() {

    const select =
        document.getElementById("unidad");

    if (!select) return;


    const valorActual =
        select.value;


    select.innerHTML = `
        <option value="">
            Sin unidad asignada
        </option>
    `;


    unidades.forEach(unidad => {

        const ocupadaPor =
            choferes.find(
                chofer =>
                    chofer.unidadId === unidad.id &&
                    chofer.id !== choferEditando
            );


        if (ocupadaPor) {

            return;
        }


        const option =
            document.createElement("option");

        option.value =
            unidad.id;


        const patente =
            unidad.patente ||
            "Sin patente";


        const tipo =
            unidad.tipo ||
            "Unidad";


        option.textContent =
            `${patente} - ${tipo}`;


        select.appendChild(option);

    });


    if (valorActual) {

        select.value = valorActual;

    }

}


/* =========================================================
   RENDERIZAR CHOFERES
========================================================= */

function renderizarChoferes() {

    const contenedor =
        document.getElementById("listaChoferes");


    if (choferes.length === 0) {

        contenedor.innerHTML = `
            <div class="vacio">
                Todavía no hay choferes registrados.
            </div>
        `;

        return;
    }


    contenedor.innerHTML = "";


    choferes.forEach(chofer => {

        const tarjeta =
            document.createElement("div");

        tarjeta.className = "chofer";


        const nombreCompleto =
            `${chofer.nombre || ""} ${chofer.apellido || ""}`
                .trim() ||
            "Chofer sin nombre";


        const estado =
            chofer.estado || "Activo";


        const claseEstado =
            estado === "Activo"
                ? "estado-activo"
                : "estado-inactivo";


        let unidadHTML = `
            <div class="unidad-asignada sin-unidad">
                🚛 Sin unidad asignada
            </div>
        `;


        if (chofer.unidadId) {

            const unidad =
                unidades.find(
                    u => u.id === chofer.unidadId
                );


            const patente =
                chofer.unidadPatente ||
                unidad?.patente ||
                "Sin patente";


            const tipo =
                unidad?.tipo ||
                "Unidad";


            unidadHTML = `
                <div class="unidad-asignada">
                    🚛 <strong>${patente}</strong>
                    · ${tipo}
                </div>
            `;

        }


        tarjeta.innerHTML = `

            <div class="chofer-cabecera">

                <div>

                    <div class="nombre">
                        👨‍✈️ ${nombreCompleto}
                    </div>

                    <div class="documento">
                        DNI:
                        ${chofer.documento || "No informado"}
                    </div>

                </div>

                <span class="estado ${claseEstado}">
                    ${estado}
                </span>

            </div>


            <div class="datos">

                <div class="dato">
                    📱 <strong>Teléfono:</strong>
                    ${chofer.telefono || "No informado"}
                </div>

                <div class="dato">
                    📄 <strong>Licencia:</strong>
                    ${chofer.licencia || "No informada"}
                </div>

                <div class="dato">
                    📅 <strong>Vencimiento:</strong>
                    ${chofer.vencimientoLicencia || "No informado"}
                </div>

            </div>


            ${unidadHTML}


            <div class="acciones">

                <button
                    class="boton boton-secundario boton-pequeno"
                    data-editar="${chofer.id}"
                >
                    ✏️ Editar
                </button>

                <button
                    class="boton boton-secundario boton-pequeno"
                    data-unidad="${chofer.id}"
                >
                    🚛 Asignar unidad
                </button>

            </div>

        `;


        tarjeta
            .querySelector("[data-editar]")
            .addEventListener(
                "click",
                () => editarChofer(chofer.id)
            );


        tarjeta
            .querySelector("[data-unidad]")
            .addEventListener(
                "click",
                () => editarChofer(chofer.id, true)
            );


        contenedor.appendChild(tarjeta);

    });

}


/* =========================================================
   RESUMEN
========================================================= */

function actualizarResumen() {

    const total =
        choferes.length;


    const activos =
        choferes.filter(
            c => c.estado === "Activo"
        ).length;


    const conUnidad =
        choferes.filter(
            c => c.unidadId
        ).length;


    const sinUnidad =
        total - conUnidad;


    document
        .getElementById("totalChoferes")
        .textContent = total;


    document
        .getElementById("choferesActivos")
        .textContent = activos;


    document
        .getElementById("choferesConUnidad")
        .textContent = conUnidad;


    document
        .getElementById("choferesSinUnidad")
        .textContent = sinUnidad;

}


/* =========================================================
   MOSTRAR FORMULARIO
========================================================= */

window.mostrarFormulario =
function mostrarFormulario() {

    choferEditando = null;


    document
        .getElementById("tituloFormulario")
        .textContent =
        "Registrar chofer";


    limpiarFormulario();


    actualizarSelectorUnidades();


    document
        .getElementById("panelFormulario")
        .style.display = "block";


    window.scrollTo({
        top: 0,
        behavior: "smooth"
    });

};


/* =========================================================
   EDITAR CHOFER
========================================================= */

function editarChofer(id, soloUnidad = false) {

    const chofer =
        choferes.find(
            c => c.id === id
        );


    if (!chofer) return;


    choferEditando = id;


    document
        .getElementById("tituloFormulario")
        .textContent =
        "Editar chofer";


    document
        .getElementById("nombre")
        .value =
        chofer.nombre || "";


    document
        .getElementById("apellido")
        .value =
        chofer.apellido || "";


    document
        .getElementById("documento")
        .value =
        chofer.documento || "";


    document
        .getElementById("telefono")
        .value =
        chofer.telefono || "";


    document
        .getElementById("licencia")
        .value =
        chofer.licencia || "";


    document
        .getElementById("vencimientoLicencia")
        .value =
        chofer.vencimientoLicencia || "";


    document
        .getElementById("estado")
        .value =
        chofer.estado || "Activo";


    actualizarSelectorUnidades();


    document
        .getElementById("unidad")
        .value =
        chofer.unidadId || "";


    document
        .getElementById("panelFormulario")
        .style.display = "block";


    window.scrollTo({
        top: 0,
        behavior: "smooth"
    });

}


/* =========================================================
   GUARDAR CHOFER
========================================================= */

window.guardarChofer =
async function guardarChofer() {

    const nombre =
        document
            .getElementById("nombre")
            .value
            .trim();


    const apellido =
        document
            .getElementById("apellido")
            .value
            .trim();


    const documento =
        document
            .getElementById("documento")
            .value
            .trim();


    const telefono =
        document
            .getElementById("telefono")
            .value
            .trim();


    const licencia =
        document
            .getElementById("licencia")
            .value
            .trim();


    const vencimientoLicencia =
        document
            .getElementById("vencimientoLicencia")
            .value;


    const estado =
        document
            .getElementById("estado")
            .value;


    const unidadId =
        document
            .getElementById("unidad")
            .value;


    if (!nombre || !apellido) {

        mostrarMensaje(
            "Ingresá nombre y apellido.",
            "error"
        );

        return;
    }


    try {

        let unidadNueva = null;


        if (unidadId) {

            unidadNueva =
                unidades.find(
                    u => u.id === unidadId
                );

        }


        /*
         * SI ESTAMOS EDITANDO
         */

        if (choferEditando) {

            const choferAnterior =
                choferes.find(
                    c => c.id === choferEditando
                );


            const batch =
                writeBatch(db);


            /*
             * Liberar unidad anterior
             */

            if (
                choferAnterior?.unidadId &&
                choferAnterior.unidadId !== unidadId
            ) {

                const unidadAnteriorRef =
                    doc(
                        db,
                        "unidades",
                        choferAnterior.unidadId
                    );


                batch.update(
                    unidadAnteriorRef,
                    {
                        choferId: null,
                        choferNombre: "",
                        actualizadoEn:
                            serverTimestamp()
                    }
                );

            }


            /*
             * Asignar nueva unidad
             */

            if (unidadNueva) {

                const unidadNuevaRef =
                    doc(
                        db,
                        "unidades",
                        unidadNueva.id
                    );


                batch.update(
                    unidadNuevaRef,
                    {
                        choferId:
                            choferEditando,

                        choferNombre:
                            `${nombre} ${apellido}`,

                        actualizadoEn:
                            serverTimestamp()
                    }
                );

            }


            /*
             * Actualizar chofer
             */

            const choferRef =
                doc(
                    db,
                    "choferes",
                    choferEditando
                );


            batch.update(
                choferRef,
                {
                    nombre,
                    apellido,
                    documento,
                    telefono,
                    licencia,
                    vencimientoLicencia,
                    estado,

                    unidadId:
                        unidadId || null,

                    unidadPatente:
                        unidadNueva?.patente || "",

                    actualizadoEn:
                        serverTimestamp()
                }
            );


            await batch.commit();


            mostrarMensaje(
                "Chofer actualizado correctamente."
            );

        } else {

            /*
             * CREAR CHOFER
             */

            const nuevoChoferRef =
                await addDoc(
                    collection(db, "choferes"),
                    {
                        empresaId:
                            empresaActualId,

                        nombre,
                        apellido,
                        documento,
                        telefono,
                        licencia,
                        vencimientoLicencia,
                        estado,

                        unidadId:
                            unidadId || null,

                        unidadPatente:
                            unidadNueva?.patente || "",

                        creadoPor:
                            usuarioActual.uid,

                        creadoEn:
                            serverTimestamp(),

                        actualizadoEn:
                            serverTimestamp()
                    }
                );


            /*
             * Actualizar unidad
             */

            if (unidadNueva) {

                await updateDoc(
                    doc(
                        db,
                        "unidades",
                        unidadNueva.id
                    ),
                    {
                        choferId:
                            nuevoChoferRef.id,

                        choferNombre:
                            `${nombre} ${apellido}`,

                        actualizadoEn:
                            serverTimestamp()
                    }
                );

            }


            mostrarMensaje(
                "Chofer registrado correctamente."
            );

        }


        cerrarFormulario();

    } catch (error) {

        console.error(error);

        mostrarMensaje(
            "No se pudo guardar el chofer.",
            "error"
        );

    }

};


/* =========================================================
   LIMPIAR FORMULARIO
========================================================= */

function limpiarFormulario() {

    document
        .getElementById("nombre")
        .value = "";


    document
        .getElementById("apellido")
        .value = "";


    document
        .getElementById("documento")
        .value = "";


    document
        .getElementById("telefono")
        .value = "";


    document
        .getElementById("licencia")
        .value = "";


    document
        .getElementById("vencimientoLicencia")
        .value = "";


    document
        .getElementById("estado")
        .value = "Activo";


    document
        .getElementById("unidad")
        .value = "";

}


/* =========================================================
   CERRAR FORMULARIO
========================================================= */

window.cerrarFormulario =
function cerrarFormulario() {

    choferEditando = null;

    document
        .getElementById("panelFormulario")
        .style.display = "none";

    limpiarFormulario();

};


/* =========================================================
   VOLVER
========================================================= */

window.volver =
function volver() {

    window.location.href =
        "index.html";

};

</script>
