<!DOCTYPE html>

<head>

<title>Reservas - Alquileres temporarios | GESBASE</title>

<style>

*{
    box-sizing:border-box;
}

body{
    margin:0;
    font-family:Arial,Helvetica,sans-serif;
    background:#f3f4f6;

}

.oculto{

.topbar{

.marca{

.logo{

    height:44px;

}

.marca-texto h1{

.marca-texto p{

}

.btn{

}

.btn-primary{

}

.btn-secondary{

}

.btn-light{

}

.btn-danger{

}

.contenedor{
    width:calc(100% - 30px);

}

.cabecera{

    border-radius:18px;
    padding:22px;
    margin-bottom:20px;

}

.cabecera h2{

.cabecera p{

.empresa{

.barra{
    display:flex;

.barra h3{

}

.formulario{

    border-radius:18px;
    padding:22px;

}

.formulario h3{

}

.form-grid{

    grid-template-columns:repeat(2,1fr);

}

.campo{

    flex-direction:column;

}

.campo-completo{

}

.campo label{

}

.campo input,

.campo textarea{

.campo input:focus,
.campo select:focus,

}

.reserva-subtitulo{

}

.dato{

.dato span:first-child{

.estado{

.estado-pendiente{

}

.estado-confirmada{

}

.estado-cancelada{

}

<section class="cabecera">

<script type="module">

import {
    auth,
    db
} from "./Js/firebase.js";


import {
    onAuthStateChanged
} from
"https://www.gstatic.com/firebasejs/12.18.0/firebase-auth.js";


import {
    collection,
    addDoc,
    getDocs,
    getDoc,
    doc,
    updateDoc,
    deleteDoc,
    query,
    where,
    serverTimestamp
} from
"https://www.gstatic.com/firebasejs/12.18.0/firebase-firestore.js";


/* =====================================================
   ELEMENTOS
===================================================== */

const cargando =
    document.getElementById("cargando");

const contenido =
    document.getElementById("contenido");

const formulario =
    document.getElementById("formulario");

const formReserva =
    document.getElementById("formReserva");

const listado =
    document.getElementById("listado");

const propiedad =
    document.getElementById("propiedad");

const cliente =
    document.getElementById("cliente");

const telefono =
    document.getElementById("telefono");

const entrada =
    document.getElementById("entrada");

const salida =
    document.getElementById("salida");

const huespedes =
    document.getElementById("huespedes");

const precioNoche =
    document.getElementById("precioNoche");

const descuento =
    document.getElementById("descuento");

const senia =
    document.getElementById("senia");

const estado =
    document.getElementById("estado");

const observaciones =
    document.getElementById("observaciones");

const resumenNoches =
    document.getElementById("resumenNoches");

const resumenTotal =
    document.getElementById("resumenTotal");

const resumenSaldo =
    document.getElementById("resumenSaldo");

const errorReserva =
    document.getElementById("errorReserva");

const empresaActual =
    document.getElementById("empresaActual");

const tituloFormulario =
    document.getElementById("tituloFormulario");

const notificacion =
    document.getElementById("notificacion");


/* =====================================================
   VARIABLES
===================================================== */

let usuarioActual = null;

let empresaIdActual = null;

let reservas = [];

let propiedades = [];

let reservaEditando = null;


/* =====================================================
   UTILIDADES
===================================================== */

function notificar(mensaje){

    notificacion.textContent =
        mensaje;

    notificacion.classList.remove(
        "oculto"
    );

    setTimeout(
        () => {
            notificacion.classList.add(
                "oculto"
            );
        },
        3000
    );

}


function dinero(valor){

    return Number(
        valor || 0
    ).toLocaleString(
        "es-AR",
        {
            style:"currency",
            currency:"ARS"
        }
    );

}


function escapar(valor){

    return String(
        valor ?? ""
    )
    .replace(/&/g,"&amp;")
    .replace(/</g,"&lt;")
    .replace(/>/g,"&gt;")
    .replace(/"/g,"&quot;")
    .replace(/'/g,"&#039;");

}


function nochesEntre(
    fechaEntrada,
    fechaSalida
){

    if(
        !fechaEntrada ||
        !fechaSalida
    ){

        return 0;

    }


    const inicio =
        new Date(
            fechaEntrada +
            "T00:00:00"
        );

    const fin =
        new Date(
            fechaSalida +
            "T00:00:00"
        );


    const diferencia =
        fin.getTime() -
        inicio.getTime();


    return Math.max(
        0,
        Math.round(
            diferencia /
            (1000 * 60 * 60 * 24)
        )
    );

}


/* =====================================================
   EMPRESA
===================================================== */

async function obtenerEmpresa(
    usuario
){

    const usuarioSnap =
        await getDoc(
            doc(
                db,
                "usuarios",
                usuario.uid
            )
        );


    let datosUsuario = {};


    if(
        usuarioSnap.exists()
    ){

        datosUsuario =
            usuarioSnap.data() || {};

    }


    let empresaId =
        datosUsuario.empresaId ||
        datosUsuario.idEmpresa ||
        datosUsuario.empresa ||
        null;


    if(!empresaId){

        const q =
            query(
                collection(
                    db,
                    "empresas"
                ),
                where(
                    "propietarioUid",
                    "==",
                    usuario.uid
                )
            );


        const resultado =
            await getDocs(q);


        if(
            !resultado.empty
        ){

            empresaId =
                resultado.docs[0].id;

        }

    }


    if(!empresaId){

        return null;

    }


    const empresaSnap =
        await getDoc(
            doc(
                db,
                "empresas",
                empresaId
            )
        );


    if(
        !empresaSnap.exists()
    ){

        return null;

    }


    return {

        id:empresaSnap.id,
        ...empresaSnap.data()

    };

}


/* =====================================================
   COMPROBAR RUBRO
===================================================== */

function esAlquileres(
    rubro
){

    const valor =
        String(
            rubro || ""
        )
        .trim()
        .toLowerCase()
        .normalize("NFD")
        .replace(
            /[\u0300-\u036f]/g,
            ""
        );


    return [

        "alquileres",
        "alquiler",
        "alquiler temporario",
        "alquileres temporarios"

    ].includes(
        valor
    );

}


/* =====================================================
   CARGAR PROPIEDADES
===================================================== */

async function cargarPropiedades(){

    propiedad.innerHTML = `
        <option value="">
            Seleccionar propiedad
        </option>
    `;


    const q =
        query(
            collection(
                db,
                "propiedadesAlquiler"
            ),
            where(
                "empresaId",
                "==",
                empresaIdActual
            )
        );


    const resultado =
        await getDocs(q);


    propiedades = [];


    resultado.forEach(
        documento => {

            const datos = {
                id:documento.id,
                ...documento.data()
            };


            propiedades.push(
                datos
            );


            if(
                datos.estado !==
                "inactiva"
            ){

                const option =
                    document.createElement(
                        "option"
                    );

                option.value =
                    datos.id;

                option.textContent =
                    datos.nombre ||
                    "Propiedad";

                option.dataset.precio =
                    datos.precioNoche ||
                    0;

                propiedad.appendChild(
                    option
                );

            }

        }
    );

}


/* =====================================================
   CARGAR RESERVAS
===================================================== */

async function cargarReservas(){

    listado.innerHTML = `
        <div class="cargando">
            Cargando reservas...
        </div>
    `;


    const q =
        query(
            collection(
                db,
                "reservasAlquiler"
            ),
            where(
                "empresaId",
                "==",
                empresaIdActual
            )
        );


    const resultado =
        await getDocs(q);


    reservas = [];


    resultado.forEach(
        documento => {

            reservas.push({

                id:documento.id,

                ...documento.data()

            });

        }
    );


    reservas.sort(
        (a,b) =>
            String(
                a.fechaEntrada || ""
            )
            .localeCompare(
                String(
                    b.fechaEntrada || ""
                )
            )
    );


    renderizarReservas();

}


/* =====================================================
   RENDER
===================================================== */

function renderizarReservas(){

    if(
        !reservas.length
    ){

        listado.innerHTML = `
            <div class="sin-datos">

                <div style="font-size:42px">
                    📅
                </div>

                <strong>
                    No hay reservas registradas.
                </strong>

                <p>
                    Creá la primera reserva para comenzar
                    a organizar tus alquileres.
                </p>

                <button
                    class="btn btn-primary"
                    id="btnPrimeraReserva"
                >
                    + Nueva reserva
                </button>

            </div>
        `;


        document
            .getElementById(
                "btnPrimeraReserva"
            )
            .addEventListener(
                "click",
                abrirFormulario
            );


        return;

    }


    listado.innerHTML = "";


    reservas.forEach(
        reserva => {

            const tarjeta =
                document.createElement(
                    "article"
                );


            tarjeta.className =
                "reserva";


            const propiedadNombre =
                propiedades.find(
                    p =>
                        p.id ===
                        reserva.propiedadId
                )?.nombre ||
                reserva.propiedadNombre ||
                "Propiedad";


            const estadoClase =
                reserva.estado ||
                "pendiente";


            tarjeta.innerHTML = `

                <h3>
                    ${escapar(
                        propiedadNombre
                    )}
                </h3>

                <div class="reserva-subtitulo">
                    👤 ${escapar(
                        reserva.clienteNombre ||
                        "Cliente"
                    )}
                </div>


                <div class="dato">

                    <span>
                        Entrada
                    </span>

                    <strong>
                        ${escapar(
                            reserva.fechaEntrada ||
                            "-"
                        )}
                    </strong>

                </div>


                <div class="dato">

                    <span>
                        Salida
                    </span>

                    <strong>
                        ${escapar(
                            reserva.fechaSalida ||
                            "-"
                        )}
                    </strong>

                </div>


                <div class="dato">

                    <span>
                        Huéspedes
                    </span>

                    <strong>
                        ${reserva.huespedes || 1}
                    </strong>

                </div>


                <div class="dato">

                    <span>
                        Noches
                    </span>

                    <strong>
                        ${reserva.noches || 0}
                    </strong>

                </div>


                <div class="dato">

                    <span>
                        Total
                    </span>

                    <strong>
                        ${dinero(
                            reserva.total
                        )}
                    </strong>

                </div>


                <div class="dato">

                    <span>
                        Seña
                    </span>

                    <strong>
                        ${dinero(
                            reserva.senia
                        )}
                    </strong>

                </div>


                <div class="dato">

                    <span>
                        Saldo
                    </span>

                    <strong>
                        ${dinero(
                            reserva.saldo
                        )}
                    </strong>

                </div>


                <div class="dato">

                    <span>
                        Estado
                    </span>

                    <strong>

                        <span
                            class="estado estado-${escapar(
                                estadoClase
                            )}"
                        >
                            ${escapar(
                                reserva.estado ||
                                "pendiente"
                            )}
                        </span>

                    </strong>

                </div>


                <div class="acciones-reserva">

                    <button
                        class="btn btn-light"
                        data-editar
                    >
                        ✏️ Editar
                    </button>

                    <button
                        class="btn btn-danger"
                        data-eliminar
                    >
                        🗑️ Eliminar
                    </button>

                </div>

            `;


            tarjeta
                .querySelector(
                    "[data-editar]"
                )
                .addEventListener(
                    "click",
                    () =>
                        abrirFormulario(
                            reserva
                        )
                );


            tarjeta
                .querySelector(
                    "[data-eliminar]"
                )
                .addEventListener(
                    "click",
                    () =>
                        eliminarReserva(
                            reserva
                        )
                );


            listado.appendChild(
                tarjeta
            );

        }
    );

}


/* =====================================================
   CALCULAR RESUMEN
===================================================== */

function actualizarResumen(){

    const noches =
        nochesEntre(
            entrada.value,
            salida.value
        );


    const precio =
        Number(
            precioNoche.value
        ) || 0;


    const descuentoValor =
        Number(
            descuento.value
        ) || 0;


    const seniaValor =
        Number(
            senia.value
        ) || 0;


    const total =
        Math.max(
            0,
            (noches * precio) -
            descuentoValor
        );


    const saldo =
        Math.max(
            0,
            total - seniaValor
        );


    resumenNoches.textContent =
        noches;


    resumenTotal.textContent =
        dinero(total);


    resumenSaldo.textContent =
        dinero(saldo);

}


/* =====================================================
   PRECIO AUTOMÁTICO
===================================================== */

propiedad.addEventListener(
    "change",
    () => {

        const seleccionada =
            propiedades.find(
                p =>
                    p.id ===
                    propiedad.value
            );


        if(
            seleccionada &&
            !precioNoche.value
        ){

            precioNoche.value =
                seleccionada.precioNoche ||
                0;

        }


        actualizarResumen();

    }
);


/* =====================================================
   FECHAS
===================================================== */

entrada.addEventListener(
    "change",
    actualizarResumen
);

salida.addEventListener(
    "change",
    actualizarResumen
);

precioNoche.addEventListener(
    "input",
    actualizarResumen
);

descuento.addEventListener(
    "input",
    actualizarResumen
);

senia.addEventListener(
    "input",
    actualizarResumen
);


/* =====================================================
   VALIDAR SUPERPOSICIÓN
===================================================== */

function existeSuperposicion(
    propiedadId,
    fechaEntrada,
    fechaSalida,
    idIgnorar = null
){

    return reservas.some(
        reserva => {

            if(
                reserva.id ===
                idIgnorar
            ){

                return false;

            }


            if(
                reserva.propiedadId !==
                propiedadId
            ){

                return false;

            }


            const estadoReserva =
                String(
                    reserva.estado ||
                    ""
                ).toLowerCase();


            /*
             * Las canceladas no bloquean
             * fechas.
             */

            if(
                estadoReserva ===
                "cancelada"
            ){

                return false;

            }


            const entradaExistente =
                reserva.fechaEntrada;

            const salidaExistente =
                reserva.fechaSalida;


            if(
                !entradaExistente ||
                !salidaExistente
            ){

                return false;

            }


            /*
             * Condición estándar:
             *
             * A entra antes de que B salga
             * Y A sale después de que B entra.
             */

            return (

                fechaEntrada <
                salidaExistente &&

                fechaSalida >
                entradaExistente

            );

        }
    );

}


/* =====================================================
   ABRIR FORMULARIO
===================================================== */

function abrirFormulario(
    reserva = null
){

    reservaEditando =
        reserva;


    formulario.classList.remove(
        "oculto"
    );


    errorReserva.classList.add(
        "oculto"
    );


    if(reserva){

        tituloFormulario.textContent =
            "Editar reserva";


        propiedad.value =
            reserva.propiedadId ||
            "";

        cliente.value =
            reserva.clienteNombre ||
            "";

        telefono.value =
            reserva.telefono ||
            "";

        entrada.value =
            reserva.fechaEntrada ||
            "";

        salida.value =
            reserva.fechaSalida ||
            "";

        huespedes.value =
            reserva.huespedes ||
            1;

        precioNoche.value =
            reserva.precioNoche ||
            0;

        descuento.value =
            reserva.descuento ||
            0;

        senia.value =
            reserva.senia ||
            0;

        estado.value =
            reserva.estado ||
            "pendiente";

        observaciones.value =
            reserva.observacionesInternas ||
            "";

    }
    else{

        tituloFormulario.textContent =
            "Nueva reserva";

        formReserva.reset();

        huespedes.value =
            1;

        descuento.value =
            0;

        senia.value =
            0;

        estado.value =
            "pendiente";

    }


    actualizarResumen();


    formulario.scrollIntoView({
        behavior:"smooth",
        block:"start"
    });

}


/* =====================================================
   CERRAR FORMULARIO
===================================================== */

function cerrarFormulario(){

    reservaEditando =
        null;

    formReserva.reset();

    formulario.classList.add(
        "oculto"
    );

    errorReserva.classList.add(
        "oculto"
    );

}


/* =====================================================
   GUARDAR RESERVA
===================================================== */

formReserva.addEventListener(
    "submit",
    async event => {

        event.preventDefault();


        errorReserva.classList.add(
            "oculto"
        );


        if(
            !propiedad.value
        ){

            mostrarError(
                "Seleccioná una propiedad."
            );

            return;

        }


        if(
            !entrada.value ||
            !salida.value
        ){

            mostrarError(
                "Ingresá las fechas de entrada y salida."
            );

            return;

        }


        if(
            salida.value <=
            entrada.value
        ){

            mostrarError(
                "La fecha de salida debe ser posterior a la fecha de entrada."
            );

            return;

        }


        const noches =
            nochesEntre(
                entrada.value,
                salida.value
            );


        if(
            noches <= 0
        ){

            mostrarError(
                "La reserva debe tener al menos una noche."
            );

            return;

        }


        if(
            existeSuperposicion(
                propiedad.value,
                entrada.value,
                salida.value,
                reservaEditando?.id ||
                null
            )
        ){

            mostrarError(
                "La propiedad ya tiene una reserva que se superpone con esas fechas."
            );

            return;

        }


        const precio =
            Number(
                precioNoche.value
            ) || 0;


        const descuentoValor =
            Number(
                descuento.value
            ) || 0;


        const seniaValor =
            Number(
                senia.value
            ) || 0;


        const total =
            Math.max(
                0,
                noches * precio -
                descuentoValor
            );


        const saldo =
            Math.max(
                0,
                total -
                seniaValor
            );


        const propiedadDatos =
            propiedades.find(
                p =>
                    p.id ===
                    propiedad.value
            );


        const datos = {

            empresaId:
                empresaIdActual,

            propietarioUid:
                usuarioActual.uid,

            propiedadId:
                propiedad.value,

            propiedadNombre:
                propiedadDatos?.nombre ||
                "",

            clienteNombre:
                cliente.value.trim(),

            telefono:
                telefono.value.trim(),

            fechaEntrada:
                entrada.value,

            fechaSalida:
                salida.value,

            huespedes:
                Number(
                    huespedes.value
                ) || 1,

            noches:

                noches,

            precioNoche:
                precio,

            descuento:
                descuentoValor,

            total:
                total,

            senia:
                seniaValor,

            saldo:
                saldo,

            estado:
                estado.value,

            observacionesInternas:
                observaciones.value.trim(),

            actualizadoEn:
                serverTimestamp()

        };


        try{

            if(
                reservaEditando
            ){

                await updateDoc(
                    doc(
                        db,
                        "reservasAlquiler",
                        reservaEditando.id
                    ),
                    datos
                );


                notificar(
                    "Reserva actualizada correctamente."
                );

            }
            else{

                datos.creadoEn =
                    serverTimestamp();


                await addDoc(
                    collection(
                        db,
                        "reservasAlquiler"
                    ),
                    datos
                );


                notificar(
                    "Reserva creada correctamente."
                );

            }


            cerrarFormulario();

            await cargarReservas();

        }
        catch(error){

            console.error(
                error
            );

            mostrarError(
                "No se pudo guardar la reserva."
            );

        }

    }
);


/* =====================================================
   ERROR
===================================================== */

function mostrarError(
    mensaje
){

    errorReserva.textContent =
        mensaje;

    errorReserva.classList.remove(
        "oculto"
    );

}


/* =====================================================
   ELIMINAR
===================================================== */

async function eliminarReserva(
    reserva
){

    const confirmar =
        confirm(
            `¿Querés eliminar la reserva de ${reserva.clienteNombre || "este cliente"}?`
        );


    if(!confirmar){

        return;

    }


    try{

        await deleteDoc(
            doc(
                db,
                "reservasAlquiler",
                reserva.id
            )
        );


        notificar(
            "Reserva eliminada."
        );


        await cargarReservas();

    }
    catch(error){

        console.error(
            error
        );

        notificar(
            "No se pudo eliminar la reserva."
        );

    }

}


/* =====================================================
   BOTONES
===================================================== */

document
    .getElementById(
        "btnNueva"
    )
    .addEventListener(
        "click",
        () => abrirFormulario()
    );


document
    .getElementById(
        "btnCancelar"
    )

    );


document

    )
    .addEventListener(

            window.location.href =
                "alquileres.html";

        }
    );

===================================================== */

onAuthStateChanged(
    auth,
    async usuario => {

        try{

            if(!usuario){

                window.location.replace(
                    "login.html"
                );

                return;

            }


            usuarioActual =
                usuario;


            const empresa =
                await obtenerEmpresa(
                    usuario
                );


            if(!empresa){

                cargando.textContent =
                    "No se encontró una empresa asociada a esta cuenta.";

                return;

            }


            const rubro =
                empresa.rubro ||
                empresa.tipoNegocio ||
                empresa.tipoEmpresa ||
                "";


            if(
                !esAlquileres(rubro)
            ){

                cargando.innerHTML = `
                    <strong>
                        Este módulo pertenece al rubro
                        Alquileres temporarios.
                    </strong>

                    <br><br>

                    <button
                        class="btn btn-secondary"
                        onclick="location.href='index.html'"
                    >
                        Volver a GESBASE
                    </button>
                `;

                return;

            }


            if(
                empresa.accesoHabilitado === false
            ){

                cargando.innerHTML = `
                    <strong>
                        El acceso de esta empresa está bloqueado.
                    </strong>

                    <br><br>

                    <button
                        class="btn btn-secondary"
                        onclick="location.href='index.html'"
                    >
                        Volver a GESBASE
                    </button>
                `;

                return;

            }


            empresaIdActual =
                empresa.id;


            empresaActual.textContent =
                "🏢 " +
                (
                    empresa.nombreEmpresa ||
                    empresa.nombre ||
                    "Mi empresa"
                );


            await cargarPropiedades();

            await cargarReservas();


            cargando.classList.add(
                "oculto"
            );

            contenido.classList.remove(
                "oculto"
            );

        }
        catch(error){

            console.error(
                error
            );


            cargando.innerHTML = `
                <strong>
                    Ocurrió un error al cargar las reservas.
                </strong>

                <p>
                    ${error.message || ""}
                </p>
            `;

        }

    }
);
