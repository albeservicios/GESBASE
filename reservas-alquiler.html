<!DOCTYPE html>
<html lang="es-AR">

<head>

<meta charset="UTF-8">

<meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
>

<meta
    name="theme-color"
    content="#111827"
>

<title>GESBASE - Reservas</title>

<style>

*{
    box-sizing:border-box;
}

body{
    margin:0;
    font-family:
        Inter,
        system-ui,
        -apple-system,
        BlinkMacSystemFont,
        "Segoe UI",
        sans-serif;

    background:#f3f4f6;
    color:#111827;
}

header{
    background:#111827;
    color:white;

    padding:15px 20px;

    display:flex;
    justify-content:space-between;
    align-items:center;

    gap:15px;
}

.header-left{
    display:flex;
    align-items:center;
    gap:12px;
}

.logo{
    width:42px;
    height:42px;
    border-radius:12px;

    background:#16a34a;

    display:flex;
    align-items:center;
    justify-content:center;

    font-size:22px;
}

header h1{
    margin:0;
    font-size:18px;
}

header p{
    margin:3px 0 0;
    color:#d1d5db;
    font-size:12px;
}

main{
    max-width:1200px;
    margin:auto;
    padding:20px;
}

.top{
    display:flex;
    justify-content:space-between;
    align-items:center;
    gap:15px;

    margin-bottom:18px;
}

.top h2{
    margin:0;
    font-size:22px;
}

.top p{
    margin:4px 0 0;
    color:#6b7280;
    font-size:13px;
}

.btn{
    border:0;
    border-radius:10px;
    padding:10px 14px;

    cursor:pointer;

    font-size:13px;
    font-weight:700;
}

.btn-primary{
    background:#16a34a;
    color:white;
}

.btn-primary:hover{
    background:#15803d;
}

.btn-secondary{
    background:#374151;
    color:white;
}

.btn-light{
    background:white;
    color:#111827;
    border:1px solid #d1d5db;
}

.btn-danger{
    background:#dc2626;
    color:white;
}

.filters{
    background:white;
    border:1px solid #e5e7eb;
    border-radius:14px;

    padding:14px;

    display:grid;

    grid-template-columns:
        1fr 200px 180px;

    gap:10px;

    margin-bottom:18px;
}

input,
select,
textarea{

    width:100%;

    padding:11px;

    border:1px solid #d1d5db;

    border-radius:9px;

    background:white;

    font-family:inherit;

    font-size:14px;
}

label{
    display:block;

    font-size:12px;
    font-weight:700;

    margin-bottom:6px;
}

.reservas{
    display:grid;
    gap:12px;
}

.card{
    background:white;

    border:1px solid #e5e7eb;

    border-radius:15px;

    padding:16px;

    box-shadow:
        0 2px 7px rgba(0,0,0,.04);
}

.card-header{
    display:flex;
    justify-content:space-between;

    gap:15px;

    margin-bottom:13px;
}

.nombre{
    font-size:16px;
    font-weight:700;
}

.sub{
    margin-top:3px;

    color:#6b7280;
    font-size:12px;
}

.estado{
    padding:6px 10px;

    border-radius:999px;

    font-size:11px;

    font-weight:700;

    white-space:nowrap;
}

.estado-pendiente{
    background:#fef3c7;
    color:#92400e;
}

.estado-confirmada{
    background:#dcfce7;
    color:#166534;
}

.estado-cancelada{
    background:#fee2e2;
    color:#991b1b;
}

.estado-finalizada{
    background:#e5e7eb;
    color:#374151;
}

.info-grid{
    display:grid;

    grid-template-columns:
        repeat(5,1fr);

    gap:9px;
}

.info{
    background:#f9fafb;

    padding:10px;

    border-radius:9px;
}

.info small{
    display:block;

    color:#6b7280;

    font-size:10px;

    margin-bottom:3px;
}

.info strong{
    font-size:13px;
}

.acciones{
    display:flex;
    flex-wrap:wrap;

    gap:8px;

    margin-top:14px;

    padding-top:12px;

    border-top:1px solid #e5e7eb;
}

.empty{
    background:white;

    border:1px dashed #d1d5db;

    border-radius:14px;

    padding:40px 20px;

    text-align:center;

    color:#6b7280;
}

.modal{
    position:fixed;
    inset:0;

    background:rgba(0,0,0,.55);

    display:none;

    align-items:center;
    justify-content:center;

    padding:20px;

    z-index:1000;
}

.modal.active{
    display:flex;
}

.modal-content{
    width:100%;
    max-width:650px;

    max-height:90vh;

    overflow:auto;

    background:white;

    border-radius:16px;

    padding:20px;
}

.modal-header{
    display:flex;
    justify-content:space-between;
    align-items:center;

    margin-bottom:16px;
}

.modal-header h3{
    margin:0;
}

.close{
    width:34px;
    height:34px;

    border:0;
    border-radius:50%;

    background:#f3f4f6;

    cursor:pointer;

    font-size:18px;
}

.form-grid{
    display:grid;

    grid-template-columns:
        repeat(2,1fr);

    gap:12px;
}

.form-group{
    margin-bottom:14px;
}

.form-group.full{
    grid-column:1 / -1;
}

.form-actions{
    display:flex;
    justify-content:flex-end;

    gap:8px;

    margin-top:18px;
}

.alert{
    display:none;

    padding:12px;

    border-radius:10px;

    margin-bottom:15px;

    font-size:13px;
}

.alert.error{
    display:block;

    background:#fee2e2;
    color:#991b1b;
}

.alert.success{
    display:block;

    background:#dcfce7;
    color:#166534;
}

.disponibilidad{
    padding:11px;

    border-radius:9px;

    font-size:12px;

    margin-bottom:14px;

    display:none;
}

.disponible{
    display:block;

    background:#dcfce7;
    color:#166534;
}

.no-disponible{
    display:block;

    background:#fee2e2;
    color:#991b1b;
}

@media(max-width:900px){

    .info-grid{
        grid-template-columns:
            repeat(3,1fr);
    }

}

@media(max-width:650px){

    main{
        padding:12px;
    }

    .top{
        flex-direction:column;
        align-items:flex-start;
    }

    .filters{
        grid-template-columns:1fr;
    }

    .info-grid{
        grid-template-columns:
            repeat(2,1fr);
    }

    .form-grid{
        grid-template-columns:1fr;
    }

    .form-group.full{
        grid-column:auto;
    }

}

</style>

</head>

<body>


<header>

    <div class="header-left">

        <div class="logo">
            📅
        </div>

        <div>

            <h1>
                GESBASE
            </h1>

            <p>
                Reservas de alquiler temporario
            </p>

        </div>

    </div>


    <button
        class="btn btn-secondary"
        onclick="volver()"
    >
        ← Volver
    </button>

</header>


<main>


    <div class="top">

        <div>

            <h2>
                Reservas
            </h2>

            <p>
                Administrá las reservas de tus propiedades.
            </p>

        </div>


        <button
            class="btn btn-primary"
            onclick="abrirNuevaReserva()"
        >
            + Nueva reserva
        </button>

    </div>


    <div
        id="alerta"
        class="alert"
    ></div>


    <div class="filters">

        <input
            id="buscar"
            type="search"
            placeholder="Buscar cliente o propiedad..."
        >


        <select id="filtroEstado">

            <option value="">
                Todos los estados
            </option>

            <option value="pendiente">
                Pendientes
            </option>

            <option value="confirmada">
                Confirmadas
            </option>

            <option value="cancelada">
                Canceladas
            </option>

            <option value="finalizada">
                Finalizadas
            </option>

        </select>


        <select id="filtroPropiedad">

            <option value="">
                Todas las propiedades
            </option>

        </select>

    </div>


    <div
        id="contenedorReservas"
        class="reservas"
    >

        <div class="empty">
            Cargando reservas...
        </div>

    </div>

</main>


<!-- =====================================================
     MODAL NUEVA RESERVA
====================================================== -->

<div
    id="modalReserva"
    class="modal"
>

    <div class="modal-content">

        <div class="modal-header">

            <h3>
                Nueva reserva
            </h3>

            <button
                class="close"
                onclick="cerrarModal()"
            >
                ×
            </button>

        </div>


        <div
            id="alertaModal"
            class="alert"
        ></div>


        <div class="form-grid">


            <div class="form-group">

                <label>
                    Propiedad
                </label>

                <select
                    id="formPropiedad"
                    required
                >

                    <option value="">
                        Seleccioná una propiedad
                    </option>

                </select>

            </div>


            <div class="form-group">

                <label>
                    Cliente
                </label>

                <select
                    id="formCliente"
                    required
                >

                    <option value="">
                        Seleccioná un cliente
                    </option>

                </select>

            </div>


            <div class="form-group">

                <label>
                    Fecha de entrada
                </label>

                <input
                    type="date"
                    id="formEntrada"
                    required
                >

            </div>


            <div class="form-group">

                <label>
                    Fecha de salida
                </label>

                <input
                    type="date"
                    id="formSalida"
                    required
                >

            </div>


            <div class="form-group">

                <label>
                    Huéspedes
                </label>

                <input
                    type="number"
                    id="formHuespedes"
                    min="1"
                    value="1"
                    required
                >

            </div>


            <div class="form-group">

                <label>
                    Importe total
                </label>

                <input
                    type="number"
                    id="formImporte"
                    min="0"
                    step="0.01"
                    placeholder="0.00"
                >

            </div>


            <div class="form-group full">

                <label>
                    Observaciones
                </label>

                <textarea
                    id="formObservaciones"
                    placeholder="Información privada de la reserva..."
                ></textarea>

            </div>

        </div>


        <div
            id="disponibilidad"
            class="disponibilidad"
        ></div>


        <div class="form-actions">

            <button
                class="btn btn-light"
                onclick="cerrarModal()"
            >
                Cancelar
            </button>

            <button
                id="btnGuardar"
                class="btn btn-primary"
                onclick="guardarReserva()"
            >
                Guardar reserva
            </button>

        </div>

    </div>

</div>


<script type="module">

import {
    auth,
    db
} from "./Js/firebase.js";

import {
    onAuthStateChanged
} from "https://www.gstatic.com/firebasejs/12.18.0/firebase-auth.js";

import {
    collection,
    query,
    where,
    getDocs,
    getDoc,
    doc,
    addDoc,
    updateDoc,
    serverTimestamp,
    limit
} from "https://www.gstatic.com/firebasejs/12.18.0/firebase-firestore.js";


let usuarioActual = null;

let empresaActual = null;

let empresaIdActual = null;

let propiedades = [];

let clientes = [];

let reservas = [];


/* =====================================================
   UTILIDADES
===================================================== */

function normalizarRubro(valor){

    return String(valor || "")
        .trim()
        .toLowerCase()
        .normalize("NFD")
        .replace(/[\u0300-\u036f]/g,"");

}


function esRubroAlquileres(rubro){

    return [

        "alquileres",
        "alquiler",
        "alquiler temporario",
        "alquileres temporarios"

    ].includes(
        normalizarRubro(rubro)
    );

}


function escapar(valor){

    return String(valor ?? "")
        .replace(/&/g,"&amp;")
        .replace(/</g,"&lt;")
        .replace(/>/g,"&gt;")
        .replace(/"/g,"&quot;")
        .replace(/'/g,"&#039;");

}


function fechaTexto(valor){

    if(!valor){
        return "-";
    }

    try{

        if(
            typeof valor.toDate ===
            "function"
        ){

            return valor
                .toDate()
                .toLocaleDateString(
                    "es-AR"
                );

        }

        return new Date(valor)
            .toLocaleDateString(
                "es-AR"
            );

    }catch{

        return "-";

    }

}


function mostrarAlerta(
    mensaje,
    tipo="success"
){

    const alerta =
        document.getElementById(
            "alerta"
        );

    alerta.textContent =
        mensaje;

    alerta.className =
        "alert " + tipo;

    setTimeout(()=>{

        alerta.className =
            "alert";

    },4000);

}


function mostrarAlertaModal(
    mensaje,
    tipo="error"
){

    const alerta =
        document.getElementById(
            "alertaModal"
        );

    alerta.textContent =
        mensaje;

    alerta.className =
        "alert " + tipo;

}


/* =====================================================
   EMPRESA
===================================================== */

async function obtenerEmpresa(){

    const uid =
        usuarioActual.uid;


    const usuarioSnap =
        await getDoc(
            doc(
                db,
                "usuarios",
                uid
            )
        );


    if(
        usuarioSnap.exists()
    ){

        const datos =
            usuarioSnap.data();


        const id =
            datos.empresaId ||
            datos.idEmpresa ||
            datos.empresa;


        if(id){

            const empresaSnap =
                await getDoc(
                    doc(
                        db,
                        "empresas",
                        id
                    )
                );


            if(
                empresaSnap.exists()
            ){

                return {
                    id:id,
                    ...empresaSnap.data()
                };

            }

        }

    }


    const q =
        query(
            collection(
                db,
                "empresas"
            ),
            where(
                "propietarioUid",
                "==",
                uid
            ),
            limit(1)
        );


    const snap =
        await getDocs(q);


    if(snap.empty){
        return null;
    }


    const d =
        snap.docs[0];


    return {
        id:d.id,
        ...d.data()
    };

}


/* =====================================================
   CARGAR PROPIEDADES
===================================================== */

async function cargarPropiedades(){

    const q =
        query(
            collection(
                db,
                "propiedadesAlquiler"
            ),
            where(
                "empresaId",
                "==",
                empresaIdActual
            )
        );


    const snap =
        await getDocs(q);


    propiedades =
        snap.docs.map(
            d => ({
                id:d.id,
                ...d.data()
            })
        );


    propiedades =
        propiedades.filter(
            p =>
                p.estado !== "inactiva"
        );


    const selects = [

        document.getElementById(
            "formPropiedad"
        ),

        document.getElementById(
            "filtroPropiedad"
        )

    ];


    selects.forEach(
        select => {

            while(
                select.options.length > 1
            ){

                select.remove(1);

            }

        }
    );


    propiedades.forEach(
        p => {

            const nombre =
                p.nombre ||
                p.titulo ||
                "Propiedad";


            const option1 =
                document.createElement(
                    "option"
                );

            option1.value =
                p.id;

            option1.textContent =
                nombre;


            document
                .getElementById(
                    "formPropiedad"
                )
                .appendChild(
                    option1
                );


            const option2 =
                document.createElement(
                    "option"
                );

            option2.value =
                p.id;

            option2.textContent =
                nombre;


            document
                .getElementById(
                    "filtroPropiedad"
                )
                .appendChild(
                    option2
                );

        }
    );

}


/* =====================================================
   CARGAR CLIENTES
===================================================== */

async function cargarClientes(){

    const q =
        query(
            collection(
                db,
                "clientesAlquiler"
            ),
            where(
                "empresaId",
                "==",
                empresaIdActual
            )
        );


    const snap =
        await getDocs(q);


    clientes =
        snap.docs.map(
            d => ({
                id:d.id,
                ...d.data()
            })
        );


    clientes =
        clientes.filter(
            c =>
                c.estado !== "inactivo"
        );


    const select =
        document.getElementById(
            "formCliente"
        );


    while(
        select.options.length > 1
    ){

        select.remove(1);

    }


    clientes.forEach(
        c => {

            const option =
                document.createElement(
                    "option"
                );


            option.value =
                c.id;


            option.textContent =
                [
                    c.nombre,
                    c.apellido
                ]
                .filter(Boolean)
                .join(" ") ||
                c.email ||
                c.telefono ||
                "Cliente";


            select.appendChild(
                option
            );

        }
    );

}


/* =====================================================
   CARGAR RESERVAS
===================================================== */

async function cargarReservas(){

    const contenedor =
        document.getElementById(
            "contenedorReservas"
        );


    try{

        const q =
            query(
                collection(
                    db,
                    "reservasAlquiler"
                ),
                where(
                    "empresaId",
                    "==",
                    empresaIdActual
                )
            );


        const snap =
            await getDocs(q);


        reservas =
            snap.docs.map(
                d => ({
                    id:d.id,
                    ...d.data()
                })
            );


        reservas.sort(
            (a,b) =>
                String(
                    a.fechaEntrada || ""
                )
                .localeCompare(
                    String(
                        b.fechaEntrada || ""
                    )
                )
        );


        renderizarReservas();


    }catch(error){

        console.error(error);

        contenedor.innerHTML =
            `<div class="empty">
                No se pudieron cargar las reservas.
            </div>`;

    }

}


/* =====================================================
   RENDERIZAR
===================================================== */

function renderizarReservas(){

    const contenedor =
        document.getElementById(
            "contenedorReservas"
        );


    const texto =
        document.getElementById(
            "buscar"
        ).value
        .trim()
        .toLowerCase();


    const estado =
        document.getElementById(
            "filtroEstado"
        ).value;


    const propiedad =
        document.getElementById(
            "filtroPropiedad"
        ).value;


    const filtradas =
        reservas.filter(
            r => {

                const datos = [

                    r.clienteNombre,
                    r.propiedadNombre,
                    r.telefono,
                    r.email

                ]
                .join(" ")
                .toLowerCase();


                return (

                    (!texto ||
                     datos.includes(texto))

                    &&

                    (!estado ||
                     r.estado === estado)

                    &&

                    (!propiedad ||
                     r.propiedadId === propiedad)

                );

            }
        );


    if(!filtradas.length){

        contenedor.innerHTML =
            `<div class="empty">

                <div style="font-size:38px;">
                    📅
                </div>

                <strong>
                    No hay reservas
                </strong>

                <div style="margin-top:6px;">
                    Creá una reserva para comenzar.
                </div>

            </div>`;

        return;

    }


    contenedor.innerHTML =
        filtradas
        .map(crearTarjeta)
        .join("");

}


/* =====================================================
   TARJETA
===================================================== */

function crearTarjeta(r){

    const estado =
        r.estado ||
        "pendiente";


    return `

        <div class="card">

            <div class="card-header">

                <div>

                    <div class="nombre">
                        ${escapar(
                            r.clienteNombre ||
                            "Cliente"
                        )}
                    </div>

                    <div class="sub">
                        ${escapar(
                            r.propiedadNombre ||
                            "Propiedad"
                        )}
                    </div>

                </div>


                <span
                    class="estado estado-${estado}"
                >
                    ${textoEstado(estado)}
                </span>

            </div>


            <div class="info-grid">

                <div class="info">

                    <small>
                        Entrada
                    </small>

                    <strong>
                        ${escapar(
                            r.fechaEntrada ||
                            "-"
                        )}
                    </strong>

                </div>


                <div class="info">

                    <small>
                        Salida
                    </small>

                    <strong>
                        ${escapar(
                            r.fechaSalida ||
                            "-"
                        )}
                    </strong>

                </div>


                <div class="info">

                    <small>
                        Huéspedes
                    </small>

                    <strong>
                        ${escapar(
                            r.cantidadHuespedes ||
                            "-"
                        )}
                    </strong>

                </div>


                <div class="info">

                    <small>
                        Total
                    </small>

                    <strong>
                        ${
                            r.importeTotal != null
                            ?
                            "$ " +
                            Number(
                                r.importeTotal
                            )
                            .toLocaleString(
                                "es-AR",
                                {
                                    minimumFractionDigits:2
                                }
                            )
                            :
                            "-"
                        }
                    </strong>

                </div>


                <div class="info">

                    <small>
                        Origen
                    </small>

                    <strong>
                        ${escapar(
                            r.origen ||
                            "Manual"
                        )}
                    </strong>

                </div>

            </div>


            ${
                r.observaciones
                ?
                `<div
                    style="
                        margin-top:10px;
                        background:#f9fafb;
                        padding:10px;
                        border-radius:8px;
                        font-size:12px;
                    "
                >
                    <strong>
                        Observaciones:
                    </strong>

                    ${escapar(
                        r.observaciones
                    )}

                </div>`
                :
                ""
            }


            <div class="acciones">

                <button
                    class="btn btn-light"
                    onclick="cambiarEstado('${r.id}')"
                >
                    🔄 Estado
                </button>


                ${
                    estado === "pendiente"
                    ?
                    `<button
                        class="btn btn-primary"
                        onclick="confirmarReserva('${r.id}')"
                    >
                        ✓ Confirmar
                    </button>`
                    :
                    ""
                }


                ${
                    estado !== "cancelada" &&
                    estado !== "finalizada"
                    ?
                    `<button
                        class="btn btn-danger"
                        onclick="cancelarReserva('${r.id}')"
                    >
                        Cancelar
                    </button>`
                    :
                    ""
                }

            </div>

        </div>

    `;

}


function textoEstado(estado){

    return {

        pendiente:"Pendiente",

        confirmada:"Confirmada",

        cancelada:"Cancelada",

        finalizada:"Finalizada"

    }[estado] || estado;

}


/* =====================================================
   DISPONIBILIDAD
===================================================== */

function fechasSeSuperponen(
    entradaA,
    salidaA,
    entradaB,
    salidaB
){

    /*
     * Entrada nueva < salida existente
     * Y
     * salida nueva > entrada existente
     */

    return (
        entradaA < salidaB &&
        salidaA > entradaB
    );

}


function comprobarDisponibilidad(){

    const propiedadId =
        document.getElementById(
            "formPropiedad"
        ).value;


    const entrada =
        document.getElementById(
            "formEntrada"
        ).value;


    const salida =
        document.getElementById(
            "formSalida"
        ).value;


    const caja =
        document.getElementById(
            "disponibilidad"
        );


    if(
        !propiedadId ||
        !entrada ||
        !salida
    ){

        caja.className =
            "disponibilidad";

        caja.textContent =
            "";

        return false;

    }


    if(
        salida <= entrada
    ){

        caja.className =
            "disponibilidad no-disponible";

        caja.textContent =
            "La fecha de salida debe ser posterior a la entrada.";

        return false;

    }


    const ocupada =
        reservas.some(
            r => {

                if(
                    r.propiedadId !==
                    propiedadId
                ){

                    return false;

                }


                if(
                    [
                        "cancelada",
                        "finalizada"
                    ].includes(
                        r.estado
                    )
                ){

                    return false;

                }


                return fechasSeSuperponen(

                    entrada,
                    salida,

                    r.fechaEntrada,
                    r.fechaSalida

                );

            }
        );


    if(ocupada){

        caja.className =
            "disponibilidad no-disponible";

        caja.textContent =
            "⚠️ La propiedad ya tiene una reserva para parte de esas fechas.";

        return false;

    }


    caja.className =
        "disponibilidad disponible";

    caja.textContent =
        "✓ La propiedad está disponible para esas fechas.";

    return true;

}


document
    .getElementById(
        "formPropiedad"
    )
    .addEventListener(
        "change",
        comprobarDisponibilidad
    );


document

        comprobarDisponibilidad
    );


document

/* =====================================================
   GUARDAR RESERVA
===================================================== */

window.guardarReserva =
async function(){

    const propiedadId =
        document.getElementById(
            "formPropiedad"
        ).value;


    const clienteId =
        document.getElementById(
            "formCliente"
        ).value;


    const fechaEntrada =
        document.getElementById(
            "formEntrada"
        ).value;


    const fechaSalida =
        document.getElementById(
            "formSalida"
        ).value;


    const cantidadHuespedes =
        Number(
            document.getElementById(
                "formHuespedes"
            ).value
        );


    const importeTotal =
        Number(
            document.getElementById(
                "formImporte"
            ).value || 0
        );


    const observaciones =
        document.getElementById(
            "formObservaciones"
        ).value
        .trim();


    if(
        !propiedadId ||
        !clienteId ||
        !fechaEntrada ||
        !fechaSalida
    ){

        mostrarAlertaModal(
            "Completá todos los campos obligatorios."
        );

        return;

    }


    if(
        !comprobarDisponibilidad()
    ){

        mostrarAlertaModal(
            "La propiedad no está disponible para esas fechas."
        );

        return;

    }


    const propiedad =
        propiedades.find(
            p =>
                p.id ===
                propiedadId
        );


    const cliente =
        clientes.find(
            c =>
                c.id ===
                clienteId
        );


    if(
        !propiedad ||
        !cliente
    ){

        mostrarAlertaModal(
            "No se encontraron los datos seleccionados."
        );

        return;

    }


    const btn =
        document.getElementById(
            "btnGuardar"
        );


    btn.disabled =
        true;

    btn.textContent =
        "Guardando...";


    try{

        await addDoc(

            collection(
                db,
                "reservasAlquiler"
            ),

            {

                empresaId:
                    empresaIdActual,

                propiedadId:
                    propiedadId,

                propiedadNombre:
                    propiedad.nombre ||
                    propiedad.titulo ||
                    "",

                clienteId:
                    clienteId,

                clienteNombre:
                    [
                        cliente.nombre,
                        cliente.apellido
                    ]
                    .filter(Boolean)
                    .join(" "),

                telefono:
                    cliente.telefono ||
                    "",

                email:
                    cliente.email ||
                    "",

                dni:
                    cliente.dni ||
                    "",

                fechaEntrada:
                    fechaEntrada,

                fechaSalida:
                    fechaSalida,

                cantidadHuespedes:
                    cantidadHuespedes,

                importeTotal:
                    importeTotal,

                importePagado:
                    0,

                saldoPendiente:
                    importeTotal,

                estado:
                    "pendiente",

                origen:
                    "manual",

                observaciones:
                    observaciones,

                fechaCreacion:
                    serverTimestamp(),

                createdAt:
                    serverTimestamp(),

                actualizadoEn:
                    serverTimestamp()

            }

        );


        cerrarModal();


        await cargarReservas();


        mostrarAlerta(
            "Reserva creada correctamente."
        );


    }catch(error){

        console.error(error);

        mostrarAlertaModal(
            "No se pudo guardar la reserva."
        );

    }finally{

        btn.disabled =
            false;

        btn.textContent =
            "Guardar reserva";

    }

};


/* =====================================================
   CONFIRMAR
===================================================== */

window.confirmarReserva =
async function(id){

    const reserva =
        reservas.find(
            r =>
                r.id === id
        );


    if(!reserva){
        return;
    }


    /*
     * Volvemos a comprobar disponibilidad
     * antes de confirmar.
     */

    const ocupada =
        reservas.some(
            r => {

                if(
                    r.id === id
                ){
                    return false;
                }

                if(
                    r.propiedadId !==
                    reserva.propiedadId
                ){
                    return false;
                }

                if(
                    [
                        "cancelada",
                        "finalizada"
                    ].includes(
                        r.estado
                    )
                ){
                    return false;
                }

                return fechasSeSuperponen(

                    reserva.fechaEntrada,
                    reserva.fechaSalida,

                    r.fechaEntrada,
                    r.fechaSalida

                );

            }
        );


    if(ocupada){

        mostrarAlerta(
            "No se puede confirmar porque existe otra reserva para esas fechas.",
            "error"
        );

        return;

    }


    try{

        await updateDoc(

            doc(
                db,
                "reservasAlquiler",
                id
            ),

            {

                estado:
                    "confirmada",

                actualizadoEn:
                    serverTimestamp()

            }

        );


        await cargarReservas();


        mostrarAlerta(
            "Reserva confirmada."
        );

    }catch(error){

        console.error(error);

        mostrarAlerta(
            "No se pudo confirmar la reserva.",
            "error"
        );

    }

};

/* =====================================================
   CAMBIAR ESTADO
===================================================== */

window.cambiarEstado =
async function(id){

    const reserva =
        reservas.find(
            r =>
                r.id === id
        );


    if(!reserva){
        return;
    }


    const nuevo =
        prompt(

            "Estado de la reserva:\n\n" +
            "pendiente\n" +
            "confirmada\n" +
            "cancelada\n" +
            "finalizada",

            reserva.estado ||
            "pendiente"

        );


    if(!nuevo){
        return;
    }


    const estado =
        nuevo
        .trim()
        .toLowerCase();


    if(
        ![
            "pendiente",
            "confirmada",
            "cancelada",
            "finalizada"
        ].includes(
            estado
        )
    ){

        alert(
            "Estado no válido."
        );

        return;

    }


    try{

        await updateDoc(

            doc(
                db,
                "reservasAlquiler",
                id
            ),

            {

                estado:
                    estado,

                actualizadoEn:
                    serverTimestamp()

            }

        );


        await cargarReservas();


        mostrarAlerta(
            "Estado actualizado."
        );

    }catch(error){

        console.error(error);

        mostrarAlerta(
            "No se pudo actualizar el estado.",
            "error"
        );

    }

};

    auth,

    async user => {

        if(!user){

            window.location.href =
                "index.html";

            return;

        }


        usuarioActual =
            user;


        try{

            empresaActual =
                await obtenerEmpresa();


            if(!empresaActual){

                alert(
                    "No se encontró la empresa."
                );

                window.location.href =
                    "index.html";

                return;

            }


            empresaIdActual =
                empresaActual.id ||
                empresaActual.idEmpresa;


            const rubro =
                empresaActual.rubro ||
                empresaActual.tipoNegocio;


            if(
                !esRubroAlquileres(
                    rubro
                )
            ){

                alert(
                    "Este módulo pertenece al rubro Alquileres temporarios."
                );

                window.location.href =
                    "index.html";

                return;

            }


            if(
                empresaActual.accesoHabilitado === false
            ){

                alert(
                    "El acceso de la empresa está bloqueado."
                );

                window.location.href =
                    "index.html";

                return;

            }


            await cargarPropiedades();

            await cargarClientes();

            await cargarReservas();


        }catch(error){

            console.error(error);

            alert(
                "No se pudo cargar el módulo de reservas."
            );

        }

    }

);
