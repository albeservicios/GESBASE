<!DOCTYPE html>
<html lang="es-AR">

<head>

<meta charset="UTF-8">

<meta
    name="viewport"
    content="width=device-width, initial-scale=1.0, viewport-fit=cover"
>

<meta name="theme-color" content="#111827">

<title>GESBASE - Reservas</title>

<style>

*{
    box-sizing:border-box;
}

body{
    margin:0;
    font-family:Arial,Helvetica,sans-serif;
    background:#f3f4f6;
    color:#111827;
}

header{
    background:#111827;
    color:white;
    padding:18px;
}

.header-inner{
    max-width:1150px;
    margin:auto;
    display:flex;
    justify-content:space-between;
    align-items:center;
    gap:15px;
}

.brand{
    font-size:20px;
    font-weight:700;
}

.brand small{
    display:block;
    font-size:12px;
    color:#9ca3af;
    font-weight:400;
    margin-top:3px;
}

.container{
    max-width:1150px;
    margin:auto;
    padding:20px;
}

.page-head{
    display:flex;
    justify-content:space-between;
    align-items:center;
    gap:15px;
    flex-wrap:wrap;
    margin-bottom:20px;
}

.page-head h1{
    margin:0;
    font-size:25px;
}

.page-head p{
    margin:5px 0 0;
    color:#6b7280;
    font-size:14px;
}

button{
    border:0;
    border-radius:9px;
    padding:11px 15px;
    cursor:pointer;
    font-weight:700;
}

button:disabled{
    opacity:.6;
    cursor:not-allowed;
}

.btn-primary{
    background:#16a34a;
    color:white;
}

.btn-primary:hover{
    background:#15803d;
}

.btn-secondary{
    background:#e5e7eb;
    color:#111827;
}

.btn-edit{
    background:#dcfce7;
    color:#166534;
}

.btn-danger{
    background:#fee2e2;
    color:#991b1b;
}

.card{
    background:white;
    border-radius:16px;
    padding:20px;
    box-shadow:0 5px 20px rgba(0,0,0,.06);
    margin-bottom:20px;
}

.form-grid{
    display:grid;
    grid-template-columns:repeat(2,1fr);
    gap:15px;
}

.form-group{
    display:flex;
    flex-direction:column;
    gap:6px;
}

.full{
    grid-column:1/-1;
}

label{
    font-size:13px;
    font-weight:700;
    color:#374151;
}

input,
select,
textarea{
    width:100%;
    padding:12px;
    border:1px solid #d1d5db;
    border-radius:9px;
    background:white;
    font-size:14px;
}

textarea{
    min-height:90px;
    resize:vertical;
}

input:focus,
select:focus,
textarea:focus{
    outline:none;
    border-color:#16a34a;
    box-shadow:0 0 0 2px rgba(22,163,74,.12);
}

.resumen{
    background:#f0fdf4;
    border:1px solid #bbf7d0;
    border-radius:14px;
    padding:16px;
    display:grid;
    grid-template-columns:repeat(4,1fr);
    gap:12px;
}

.resumen-item{
    background:white;
    border-radius:10px;
    padding:12px;
}

.resumen-item span{
    display:block;
    color:#6b7280;
    font-size:12px;
}

.resumen-item strong{
    display:block;
    margin-top:5px;
    color:#166534;
    font-size:18px;
}

.form-actions{
    display:flex;
    justify-content:flex-end;
    gap:10px;
    margin-top:20px;
    flex-wrap:wrap;
}

#mensaje{
    display:none;
    padding:12px;
    border-radius:9px;
    margin-bottom:15px;
    font-size:14px;
}

.mensaje-ok{
    background:#dcfce7;
    color:#166534;
}

.mensaje-error{
    background:#fee2e2;
    color:#991b1b;
}

.table-wrap{
    overflow-x:auto;
}

table{
    width:100%;
    border-collapse:collapse;
    min-width:850px;
}

th,
td{
    padding:12px 10px;
    border-bottom:1px solid #e5e7eb;
    text-align:left;
    font-size:13px;
}

th{
    color:#6b7280;
    font-size:12px;
    text-transform:uppercase;
}

.estado{
    display:inline-block;
    padding:5px 9px;
    border-radius:20px;
    font-size:10px;
    font-weight:800;
}

.pendiente{
    background:#fef3c7;
    color:#92400e;
}

.confirmada{
    background:#dbeafe;
    color:#1d4ed8;
}

.enCurso{
    background:#dcfce7;
    color:#166534;
}

.finalizada{
    background:#e5e7eb;
    color:#374151;
}

.cancelada{
    background:#fee2e2;
    color:#991b1b;
}

.acciones{
    display:flex;
    gap:6px;
    flex-wrap:wrap;
}

.acciones button{
    padding:7px 9px;
    font-size:11px;
}

.vacio{
    text-align:center;
    padding:40px;
    color:#6b7280;
}

.oculto{
    display:none!important;
}

.precio-total{
    color:#166534;
    font-weight:800;
}

.alerta-fechas{
    display:none;
    background:#fee2e2;
    color:#991b1b;
    border-radius:9px;
    padding:10px;
    font-size:13px;
    margin-top:10px;
}

@media(max-width:800px){

    .form-grid{
        grid-template-columns:1fr;
    }

    .full{
        grid-column:auto;
    }

    .resumen{
        grid-template-columns:repeat(2,1fr);
    }

}

@media(max-width:600px){

    .container{
        padding:14px;
    }

    .page-head{
        align-items:stretch;
    }

    .page-head button{
        width:100%;
    }

    .resumen{
        grid-template-columns:1fr 1fr;
    }

}

</style>

</head>

<body>

<header>

    <div class="header-inner">

        <div class="brand">

            GESBASE

            <small>
                Alquileres temporarios · Reservas
            </small>

        </div>

        <button
            class="btn-secondary"
            onclick="volver()"
        >
            ← Volver
        </button>

    </div>

</header>


<main class="container">

    <div class="page-head">

        <div>

            <h1>
                📅 Reservas
            </h1>

            <p>
                Administrá las reservas de tus alojamientos.
            </p>

        </div>

        <button
            class="btn-primary"
            onclick="nuevaReserva()"
        >
            + Nueva reserva
        </button>

    </div>


    <div id="mensaje"></div>


    <!-- ==========================================
         FORMULARIO
    =========================================== -->

    <section
        id="formularioCard"

    >

        <h2 id="tituloFormulario">

        </h2>


        <div
            class="form-grid"

        >

            <div class="form-group">

                <label>
                    Alojamiento *
                </label>

                <select id="propiedadId">

                    <option value="">

                    </option>

                </select>

            </div>


            <div class="form-group">

                <label>
                    Cliente *
                </label>

                <select id="clienteId">

                    <option value="">
                        Seleccioná un cliente
                    </option>

                </select>

            </div>


            <div class="form-group">

                <label>
                    Fecha de entrada *
                </label>

                <input
                    id="fechaEntrada"

                >

            </div>


            <div class="form-group">

                <label>
                    Fecha de salida *
                </label>

                <input

            </div>


            <div class="form-group">

            <div class="form-group">

            <div class="form-group">

                <label>
                    Estado

                <select id="estado">

                    <option value="confirmada">

                    Noches

                <strong id="resumenNoches">
                    0

            </div>


            <div class="resumen-item">

                <span>
                    Total
                </span>

                    $ 0
                </strong>

            </div>


            <div class="resumen-item">

                <span>
                    Pagado

                <strong id="resumenPagado">
                    $ 0
                </strong>

            <div class="resumen-item">

                <span>

                </span>

                <strong id="resumenSaldo">

        <div class="form-actions">

            <button

    <!-- ==========================================
         LISTADO
    =========================================== -->

    <section class="card">

        <div class="table-wrap">

            <table>

                <thead>

                    <tr>

                        <th>
                            Alojamiento
                        </th>

                        <th>
                            Cliente
                        </th>

                        <th>
                            Entrada
                        </th>

                        <th>
                            Salida
                        </th>

                        <th>
                            Noches
                        </th>

                        <th>
                            Total
                        </th>

                        <th>
                            Saldo
                        </th>

                        <th>
                            Estado
                        </th>

                            Acciones

</main>


<script type="module">

import {
    auth,
    db
} from "./Js/firebase.js";

import {
    onAuthStateChanged
} from "https://www.gstatic.com/firebasejs/12.18.0/firebase-auth.js";

import {
    collection,
    addDoc,
    getDocs,
    getDoc,
    doc,
    updateDoc,
    deleteDoc,
    query,
    where,
    serverTimestamp
} from "https://www.gstatic.com/firebasejs/12.18.0/firebase-firestore.js";


/* ==========================================
   VARIABLES
========================================== */

let usuarioActual = null;
let empresaActual = null;

let propiedades = [];
let clientes = [];

let reservas = [];

let reservaEditando = null;


/* ==========================================
   ELEMENTOS
========================================== */

const formularioCard =
    document.getElementById(
        "formularioCard"
    );

const reservasBody =
    document.getElementById(
        "reservasBody"
    );

const loading =
    document.getElementById(
        "loading"
    );

const mensaje =
    document.getElementById(
        "mensaje"
    );


/* ==========================================
   UTILIDADES
========================================== */

function normalizarRubro(valor){

    return String(valor || "")
        .trim()
        .toLowerCase()
        .normalize("NFD")
        .replace(/[\u0300-\u036f]/g,"");

}


function esRubroAlquileres(rubro){

    const r =
        normalizarRubro(rubro);

    return [
        "alquileres",
        "alquiler",
        "alquiler temporario",
        "alquileres temporarios"
    ].includes(r);

}


function mostrarMensaje(
    texto,
    tipo="ok"
){

    mensaje.textContent =
        texto;

    mensaje.className =
        tipo === "error"
        ? "mensaje-error"
        : "mensaje-ok";

    mensaje.style.display =
        "block";

    window.scrollTo({
        top:0,
        behavior:"smooth"
    });

    setTimeout(
        () => {
            mensaje.style.display =
                "none";
        },
        5000
    );

}


function escaparHTML(texto){

    return String(texto ?? "")
        .replace(/&/g,"&amp;")
        .replace(/</g,"&lt;")
        .replace(/>/g,"&gt;")
        .replace(/"/g,"&quot;")
        .replace(/'/g,"&#039;");

}


/* ==========================================
   EMPRESA
========================================== */

async function obtenerEmpresa(){

    const usuarioRef =
        doc(
            db,
            "usuarios",
            usuarioActual.uid
        );

    const usuarioSnap =
        await getDoc(
            usuarioRef
        );


    if(usuarioSnap.exists()){

        const datos =
            usuarioSnap.data();

        const empresaId =
            datos.empresaId ||
            datos.idEmpresa ||
            datos.empresa;


        if(empresaId){

            const empresaSnap =
                await getDoc(
                    doc(
                        db,
                        "empresas",
                        empresaId
                    )
                );


            if(empresaSnap.exists()){

                return {
                    id:empresaSnap.id,
                    ...empresaSnap.data()
                };

            }

        }

    }


    const q =
        query(
            collection(
                db,
                "empresas"
            ),
            where(
                "propietarioUid",
                "==",
                usuarioActual.uid
            )
        );


    const resultado =
        await getDocs(q);


    if(!resultado.empty){

        const empresa =
            resultado.docs[0];

        return {
            id:empresa.id,
            ...empresa.data()
        };

    }


    return null;

}


/* ==========================================
   AUTENTICACIÓN
========================================== */

onAuthStateChanged(
    auth,
    async usuario => {

        if(!usuario){

            window.location.href =
                "index.html";

            return;

        }


        usuarioActual =
            usuario;


        try{

            empresaActual =
                await obtenerEmpresa();


            if(!empresaActual){

                mostrarMensaje(
                    "No se encontró la empresa asociada.",
                    "error"
                );

                return;

            }


            const rubro =
                empresaActual.rubro ||
                empresaActual.tipoNegocio ||
                empresaActual.tipoEmpresa;


            if(
                !esRubroAlquileres(
                    rubro
                )
            ){

                mostrarMensaje(
                    "Este módulo corresponde a alquileres temporarios.",
                    "error"
                );

                return;

            }


            if(
                empresaActual.accesoHabilitado === false
            ){

                mostrarMensaje(
                    "El acceso de la empresa está bloqueado.",
                    "error"
                );

                return;

            }


            await cargarPropiedades();

            await cargarClientes();

            await cargarReservas();

        }catch(error){

            console.error(error);

            mostrarMensaje(
                "No se pudo cargar el módulo.",
                "error"
            );

        }

    }
);


/* ==========================================
   CARGAR PROPIEDADES
========================================== */

async function cargarPropiedades(){

    propiedades = [];


    const q =
        query(
            collection(
                db,
                "propiedadesAlquiler"
            ),
            where(
                "empresaId",
                "==",
                empresaActual.id
            )
        );


    const resultado =
        await getDocs(q);


    resultado.docs.forEach(
        documento => {

            propiedades.push({
                id:documento.id,
                ...documento.data()
            });

        }
    );


    cargarSelectPropiedades();

}


/* ==========================================
   SELECT PROPIEDADES
========================================== */

function cargarSelectPropiedades(){

    const select =
        document.getElementById(
            "propiedadId"
        );


    select.innerHTML = `
        <option value="">
            Seleccioná un alojamiento
        </option>
    `;


    propiedades
        .filter(
            propiedad =>
                propiedad.estado !== "inactiva"
        )
        .forEach(
            propiedad => {

                const option =
                    document.createElement(
                        "option"
                    );

                option.value =
                    propiedad.id;

                option.textContent =
                    `${propiedad.nombre} · ${
                        propiedad.localidad || ""
                    }`;

                select.appendChild(
                    option
                );

            }
        );

}


/* ==========================================
   CARGAR CLIENTES
========================================== */

async function cargarClientes(){

    clientes = [];


    const q =
        query(
            collection(
                db,
                "clientesAlquiler"
            ),
            where(
                "empresaId",
                "==",
                empresaActual.id
            )
        );


    const resultado =
        await getDocs(q);


    resultado.docs.forEach(
        documento => {

            clientes.push({
                id:documento.id,
                ...documento.data()
            });

        }
    );


    cargarSelectClientes();

}


/* ==========================================
   SELECT CLIENTES
========================================== */

function cargarSelectClientes(){

    const select =
        document.getElementById(
            "clienteId"
        );


    select.innerHTML = `
        <option value="">
            Seleccioná un cliente
        </option>
    `;


    clientes
        .filter(
            cliente =>
                cliente.estado !== "inactivo"
        )
        .forEach(
            cliente => {

                const option =
                    document.createElement(
                        "option"
                    );

                option.value =
                    cliente.id;

                option.textContent =
                    `${cliente.nombre || ""} ${
                        cliente.apellido || ""
                    } · ${
                        cliente.dni || "Sin DNI"
                    }`;

                select.appendChild(
                    option
                );

            }
        );

}


/* ==========================================
   CAMBIO DE PROPIEDAD
========================================== */

document.getElementById(
    "propiedadId"
).addEventListener(
    "change",
    () => {

        const propiedad =
            propiedades.find(
                p =>
                    p.id ===
                    document.getElementById(
                        "propiedadId"
                    ).value
            );


        if(propiedad){

            document.getElementById(
                "precioNoche"
            ).value =
                propiedad.precioNoche || 0;

        }


        comprobarDisponibilidad();

        calcularResumen();

    }
);


/* ==========================================
   CAMBIOS DE FECHA
========================================== */

document.getElementById(
    "fechaEntrada"
).addEventListener(
    "change",
    () => {

        calcularResumen();

        comprobarDisponibilidad();

    }
);


document.getElementById(
    "fechaSalida"
).addEventListener(
    "change",
    () => {

        calcularResumen();

        comprobarDisponibilidad();

    }
);


document.getElementById(
    "precioNoche"
).addEventListener(
    "input",
    calcularResumen
);


document.getElementById(
    "importePagado"
).addEventListener(
    "input",
    calcularResumen
);


/* ==========================================
   CALCULAR NOCHES
========================================== */

function calcularNoches(
    entrada,
    salida
){

    if(
        !entrada ||
        !salida
    ){

        return 0;

    }


    const inicio =
        new Date(
            entrada + "T00:00:00"
        );

    const fin =
        new Date(
            salida + "T00:00:00"
        );


    const diferencia =
        fin.getTime() -
        inicio.getTime();


    const noches =
        Math.round(
            diferencia /
            (1000 * 60 * 60 * 24)
        );


    return noches > 0
        ? noches
        : 0;

}


/* ==========================================
   RESUMEN
========================================== */

function calcularResumen(){

    const entrada =
        document.getElementById(
            "fechaEntrada"
        ).value;

    const salida =
        document.getElementById(
            "fechaSalida"
        ).value;


    const noches =
        calcularNoches(
            entrada,
            salida
        );


    const precio =
        Number(
            document.getElementById(
                "precioNoche"
            ).value
        ) || 0;


    const pagado =
        Number(
            document.getElementById(
                "importePagado"
            ).value
        ) || 0;


    const total =
        noches *
        precio;


    const saldo =
        Math.max(
            0,
            total - pagado
        );


    document.getElementById(
        "resumenNoches"
    ).textContent =
        noches;


    document.getElementById(
        "resumenTotal"
    ).textContent =
        formatearDinero(total);


    document.getElementById(
        "resumenPagado"
    ).textContent =
        formatearDinero(pagado);


    document.getElementById(
        "resumenSaldo"
    ).textContent =
        formatearDinero(saldo);

}


/* ==========================================
   FORMATEAR DINERO
========================================== */

function formatearDinero(
    numero
){

    return "$ " +
        Number(
            numero || 0
        ).toLocaleString(
            "es-AR",
            {
                minimumFractionDigits:2,
                maximumFractionDigits:2
            }
        );

}


/* ==========================================
   COMPROBAR DISPONIBILIDAD
========================================== */

async function comprobarDisponibilidad(){

    const propiedadId =
        document.getElementById(
            "propiedadId"
        ).value;

    const entrada =
        document.getElementById(
            "fechaEntrada"
        ).value;

    const salida =
        document.getElementById(
            "fechaSalida"
        ).value;


    const alerta =
        document.getElementById(
            "alertaFechas"
        );


    alerta.style.display =
        "none";


    if(
        !propiedadId ||
        !entrada ||
        !salida
    ){

        return true;

    }


    const noches =
        calcularNoches(
            entrada,
            salida
        );


    if(noches <= 0){

        alerta.textContent =
            "La fecha de salida debe ser posterior a la fecha de entrada.";

        alerta.style.display =
            "block";

        return false;

    }


    try{

        const q =
            query(
                collection(
                    db,
                    "reservasAlquiler"
                ),
                where(
                    "empresaId",
                    "==",
                    empresaActual.id
                ),
                where(
                    "propiedadId",
                    "==",
                    propiedadId
                )
            );


        const resultado =
            await getDocs(q);


        let conflicto =
            null;


        resultado.docs.forEach(
            documento => {

                const reserva =
                    documento.data();


                /*
                 * Una reserva cancelada
                 * no bloquea las fechas.
                 */

                if(
                    reserva.estado ===
                    "cancelada"
                ){

                    return;

                }


                /*
                 * Si estamos editando
                 * la misma reserva,
                 * no debe compararse consigo misma.
                 */

                if(
                    reservaEditando &&
                    documento.id ===
                    reservaEditando.id
                ){

                    return;

                }


                const entradaExistente =
                    reserva.fechaEntrada;

                const salidaExistente =
                    reserva.fechaSalida;


                if(
                    !entradaExistente ||
                    !salidaExistente
                ){

                    return;

                }


                /*
                 * Regla:
                 *
                 * Nueva entrada < salida existente
                 * Y
                 * Nueva salida > entrada existente
                 */

                const hayCruce =
                    entrada <
                    salidaExistente &&
                    salida >
                    entradaExistente;


                if(hayCruce){

                    conflicto = reserva;

                }

            }
        );


        if(conflicto){

            alerta.innerHTML = `
                ⚠️ El alojamiento ya tiene
                una reserva entre
                <strong>
                    ${escaparHTML(
                        conflicto.fechaEntrada
                    )}
                </strong>
                y
                <strong>
                    ${escaparHTML(
                        conflicto.fechaSalida
                    )}
                </strong>.
            `;

            alerta.style.display =
                "block";

            return false;

        }


        return true;

    }catch(error){

        console.error(
            "Error comprobando disponibilidad:",
            error
        );

        alerta.textContent =
            "No se pudo comprobar la disponibilidad.";

        alerta.style.display =
            "block";

        return false;

    }

}


/* ==========================================
   CARGAR RESERVAS
========================================== */

async function cargarReservas(){

    loading.style.display =
        "block";

    reservasBody.innerHTML =
        "";


    reservas = [];


    try{

        const q =
            query(
                collection(
                    db,
                    "reservasAlquiler"
                ),
                where(
                    "empresaId",
                    "==",
                    empresaActual.id
                )
            );


        const resultado =
            await getDocs(q);


        resultado.docs.forEach(
            documento => {

                reservas.push({
                    id:documento.id,
                    ...documento.data()
                });

            }
        );


        reservas.sort(
            (a,b) =>
                String(
                    a.fechaEntrada || ""
                ).localeCompare(
                    String(
                        b.fechaEntrada || ""
                    )
                )
        );


        renderReservas();


    }catch(error){

        console.error(error);

        mostrarMensaje(
            "No se pudieron cargar las reservas.",
            "error"
        );

    }finally{

        loading.style.display =
            "none";

    }

}


/* ==========================================
   RENDER RESERVAS
========================================== */

function renderReservas(){

    reservasBody.innerHTML =
        "";


    if(reservas.length === 0){

        reservasBody.innerHTML = `
            <tr>
                <td
                    colspan="9"
                    class="vacio"
                >
                    📅 Todavía no hay reservas.
                </td>
            </tr>
        `;

        return;

    }


    reservas.forEach(
        reserva => {

            const tr =
                document.createElement(
                    "tr"
                );


            const total =
                Number(
                    reserva.importeTotal || 0
                );


            const saldo =
                Number(
                    reserva.saldoPendiente || 0
                );


            const estado =
                reserva.estado ||
                "pendiente";


            tr.innerHTML = `

                <td>
                    <strong>
                        ${escaparHTML(
                            reserva.propiedadNombre ||
                            "Sin alojamiento"
                        )}
                    </strong>
                </td>

                <td>
                    ${escaparHTML(
                        reserva.clienteNombre ||
                        "Sin cliente"
                    )}
                </td>

                <td>
                    ${escaparHTML(
                        reserva.fechaEntrada ||
                        "-"
                    )}
                </td>

                <td>
                    ${escaparHTML(
                        reserva.fechaSalida ||
                        "-"
                    )}
                </td>

                <td>
                    ${reserva.cantidadNoches || 0}
                </td>

                <td class="precio-total">
                    ${formatearDinero(total)}
                </td>

                <td>
                    ${formatearDinero(saldo)}
                </td>

                <td>

                    <span
                        class="estado ${estado}"
                    >
                        ${textoEstado(estado)}
                    </span>

                </td>

                <td>

                    <div class="acciones">

                        <button
                            class="btn-edit"
                            onclick="editarReserva('${reserva.id}')"
                        >
                            ✏️
                        </button>

                        <button
                            class="btn-danger"
                            onclick="eliminarReserva('${reserva.id}')"
                        >
                            🗑
                        </button>

                    </div>

                </td>

            `;


            reservasBody.appendChild(
                tr
            );

        }
    );

}


/* ==========================================
   ESTADO
========================================== */

function textoEstado(
    estado
){

    const estados = {

        pendiente:"PENDIENTE",

        confirmada:"CONFIRMADA",

        enCurso:"EN CURSO",

        finalizada:"FINALIZADA",

        cancelada:"CANCELADA"

    };


    return estados[estado] ||
        String(
            estado
        ).toUpperCase();

}


/* ==========================================
   NUEVA RESERVA
========================================== */

window.nuevaReserva =
function(){

    reservaEditando =
        null;


    document.getElementById(
        "tituloFormulario"
    ).textContent =
        "Nueva reserva";


    limpiarFormulario();


    formularioCard.classList.remove(

    );


    window.scrollTo({
        top:0,
        behavior:"smooth"
    });

};


/* ==========================================
   LIMPIAR
========================================== */

    document.getElementById(
        "propiedadId"
    ).value = "";

    document.getElementById(
        "clienteId"
    ).value = "";

    document.getElementById(
        "fechaEntrada"
    ).value = "";

    document.getElementById(
        "fechaSalida"
    ).value = "";

    document.getElementById(
        "cantidadHuespedes"
    ).value = "1";

    document.getElementById(
        "precioNoche"
    ).value = "";

    document.getElementById(
        "importePagado"
    ).value = "0";

    document.getElementById(
        "estado"
    ).value =
        "pendiente";

    document.getElementById(
        "observacionesInternas"
    ).value = "";

    document.getElementById(
        "alertaFechas"
    ).style.display =
        "none";


    calcularResumen();

}


/* ==========================================
   EDITAR RESERVA
========================================== */

window.editarReserva =
async function(id){

    try{

        const snap =
            await getDoc(
                doc(
                    db,
                    "reservasAlquiler",
                    id
                )
            );


        if(!snap.exists()){

            mostrarMensaje(
                "La reserva no existe.",
                "error"
            );

            return;

        }


        const reserva =
            snap.data();


        reservaEditando = {
            id,
            ...reserva
        };


        document.getElementById(
            "tituloFormulario"
        ).textContent =
            "Editar reserva";


        document.getElementById(
            "propiedadId"
        ).value =
            reserva.propiedadId || "";


        document.getElementById(
            "clienteId"
        ).value =
            reserva.clienteId || "";


        document.getElementById(
            "fechaEntrada"
        ).value =
            reserva.fechaEntrada || "";


        document.getElementById(
            "fechaSalida"
        ).value =
            reserva.fechaSalida || "";


        document.getElementById(
            "cantidadHuespedes"
        ).value =
            reserva.cantidadHuespedes || 1;


        document.getElementById(
            "precioNoche"
        ).value =
            reserva.precioNoche || 0;


        document.getElementById(
            "importePagado"
        ).value =
            reserva.importePagado || 0;


        document.getElementById(
            "estado"
        ).value =
            reserva.estado ||
            "pendiente";


        document.getElementById(
            "observacionesInternas"
        ).value =
            reserva.observacionesInternas ||
            "";


        formularioCard.classList.remove(
            "oculto"
        );


        calcularResumen();


        comprobarDisponibilidad();


        window.scrollTo({
            top:0,
            behavior:"smooth"
        });


    }catch(error){

        console.error(error);

        mostrarMensaje(
            "No se pudo cargar la reserva.",
            "error"
        );

    }

};


/* ==========================================
   GUARDAR
========================================== */

window.guardarReserva =
async function(){

    const propiedadId =
        document.getElementById(
            "propiedadId"
        ).value;


    const clienteId =
        document.getElementById(
            "clienteId"
        ).value;


    const fechaEntrada =
        document.getElementById(
            "fechaEntrada"
        ).value;


    const fechaSalida =
        document.getElementById(
            "fechaSalida"
        ).value;


    if(
        !propiedadId ||
        !clienteId ||
        !fechaEntrada ||
        !fechaSalida
    ){

        mostrarMensaje(
            "Completá alojamiento, cliente y fechas.",
            "error"
        );

        return;

    }


    const disponible =
        await comprobarDisponibilidad();


    if(!disponible){

        mostrarMensaje(
            "No se puede guardar la reserva porque las fechas están ocupadas o son inválidas.",
            "error"
        );

        return;

    }


    const propiedad =
        propiedades.find(
            p =>
                p.id ===
                propiedadId
        );


    const cliente =
        clientes.find(
            c =>
                c.id ===
                clienteId
        );


    if(!propiedad){

        mostrarMensaje(
            "No se encontró el alojamiento.",
            "error"
        );

        return;

    }


    if(!cliente){

        mostrarMensaje(
            "No se encontró el cliente.",
            "error"
        );

        return;

    }


    const cantidadNoches =
        calcularNoches(
            fechaEntrada,
            fechaSalida
        );


    const precioNoche =
        Number(
            document.getElementById(
                "precioNoche"
            ).value
        ) || 0;


    const importePagado =
        Number(
            document.getElementById(
                "importePagado"
            ).value
        ) || 0;


    const importeTotal =
        cantidadNoches *
        precioNoche;


    const saldoPendiente =
        Math.max(
            0,
            importeTotal -
            importePagado
        );


    const datos = {

        empresaId:
            empresaActual.id,

        propiedadId,

        propiedadNombre:
            propiedad.nombre || "",

        clienteId,

        clienteNombre:
            `${cliente.nombre || ""} ${
                cliente.apellido || ""
            }`.trim(),

        clienteDni:
            cliente.dni || "",

        fechaEntrada,

        fechaSalida,

        cantidadNoches,

        cantidadHuespedes:
            Number(
                document.getElementById(
                    "cantidadHuespedes"
                ).value
            ) || 1,

        precioNoche,

        moneda:
            propiedad.moneda ||
            "ARS",

        importeTotal,

        importePagado,

        saldoPendiente,

        estado:
            document.getElementById(
                "estado"
            ).value,

        observacionesInternas:
            document.getElementById(
                "observacionesInternas"
            ).value.trim(),

        actualizadoEn:
            serverTimestamp()

    };


    const btn =
        document.getElementById(
            "btnGuardar"
        );


    btn.disabled =
        true;

    btn.textContent =
        "Guardando...";


    try{

        if(reservaEditando){

            await updateDoc(
                doc(
                    db,
                    "reservasAlquiler",
                    reservaEditando.id
                ),
                datos
            );


            mostrarMensaje(
                "Reserva actualizada correctamente."
            );

        }else{

            await addDoc(
                collection(
                    db,
                    "reservasAlquiler"
                ),
                {

                    ...datos,

                    fechaCreacion:
                        serverTimestamp(),

                    createdAt:
                        serverTimestamp()

                }
            );


            mostrarMensaje(
                "Reserva creada correctamente."
            );

        }


        formularioCard.classList.add(
            "oculto"
        );


        reservaEditando =
            null;


        await cargarReservas();


    }catch(error){

        console.error(error);

        mostrarMensaje(
            "No se pudo guardar la reserva: " +
            (
                error.message || ""
            ),
            "error"
        );

    }finally{

        btn.disabled =
            false;

        btn.textContent =
            "Guardar reserva";

    }

};


/* ==========================================
   CANCELAR FORMULARIO
========================================== */

window.cancelarFormulario =
function(){

    formularioCard.classList.add(
        "oculto"
    );

    reservaEditando =
        null;

};


/* ==========================================
   ELIMINAR
========================================== */

window.eliminarReserva =
async function(id){

    if(
        !confirm(
            "¿Querés eliminar esta reserva?"
        )
    ){

        return;

    }


    try{

        await deleteDoc(
            doc(
                db,
                "reservasAlquiler",
                id
            )
        );


        mostrarMensaje(
            "Reserva eliminada correctamente."
        );


        await cargarReservas();


    }catch(error){

        console.error(error);

        mostrarMensaje(
            "No se pudo eliminar la reserva.",
            "error"
        );

    }

};


/* ==========================================
   VOLVER
========================================== */

window.volver =
function(){

    window.location.href =
        "alquileres.html";

};
