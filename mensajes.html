<style>

*{
    box-sizing:border-box;
    margin:0;
    padding:0;
}

html,
body{

button,

/* =========================
   HEADER
========================= */

.header{

    min-height:64px;

    color:white;

}

.back-btn{

    height:42px;
    border:0;
    border-radius:50%;
    background:rgba(255,255,255,.1);
    color:white;
    font-size:22px;
}

.header-title{
    flex:1;
    min-width:0;
}

.header-title strong{
    display:block;
    font-size:16px;
    white-space:nowrap;
    overflow:hidden;
    text-overflow:ellipsis;
}

.header-title span{
    display:block;
    font-size:12px;
    color:#cbd5e1;
    margin-top:3px;
}

.header-actions{
    display:flex;
    gap:7px;
}

.icon-btn{
    width:42px;
    height:42px;
    border:0;
    border-radius:50%;

    font-size:19px;
}

/* =========================
   MAIN
========================= */

.main{

    display:flex;
}

/* =========================
   CONTACTOS
========================= */

.contacts{
    width:330px;
    min-width:280px;
    background:white;
    border-right:1px solid #e5e7eb;
    display:flex;
    flex-direction:column;
}

.contacts-header{
    padding:16px;
    border-bottom:1px solid #e5e7eb;
}

.contacts-header h2{
    font-size:18px;
    margin-bottom:10px;
}

.search-box{
    width:100%;
    border:1px solid #d1d5db;
    border-radius:12px;
    padding:11px 13px;
    outline:none;
    background:#f9fafb;
}

.search-box:focus{
    border-color:#2563eb;
    background:white;
}

.contacts-list{
    flex:1;
    overflow-y:auto;
}

.contact{
    width:100%;
    border:0;
    background:white;
    padding:12px 14px;
    display:flex;
    align-items:center;
    gap:11px;
    text-align:left;
    border-bottom:1px solid #f1f5f9;
}

.contact:hover{
    background:#f8fafc;
}

.contact.active{
    background:#eff6ff;
}

.avatar{
    width:46px;
    height:46px;
    min-width:46px;
    border-radius:50%;
    background:#1d4ed8;
    color:white;
    display:flex;
    align-items:center;
    justify-content:center;
    overflow:hidden;
    font-weight:bold;
}

.avatar img{
    width:100%;
    height:100%;
    object-fit:cover;
}

.contact-info{
    min-width:0;
    flex:1;
}

.contact-name{
    font-weight:bold;
    font-size:14px;
    white-space:nowrap;
    overflow:hidden;
    text-overflow:ellipsis;
}

.contact-type{
    color:#64748b;
    font-size:12px;
    margin-top:3px;
}

.online{
    color:#16a34a;
}

/* =========================
   CHAT
========================= */

.chat{
    flex:1;
    min-width:0;
    display:flex;
    flex-direction:column;
    background:#e5e7eb;
}

.empty-chat{
    flex:1;
    display:flex;
    align-items:center;
    justify-content:center;
    text-align:center;
    padding:30px;
    color:#64748b;
}

.empty-chat-icon{
    font-size:52px;
    margin-bottom:12px;
}

.messages{
    flex:1;
    overflow-y:auto;
    padding:18px;
    display:flex;
    flex-direction:column;
    gap:8px;
}

.message{
    max-width:min(75%,520px);
    padding:9px 12px;
    border-radius:15px;
    word-wrap:break-word;
    line-height:1.4;
    font-size:14px;
}

.message.mine{
    align-self:flex-end;
    background:#2563eb;
    color:white;
    border-bottom-right-radius:5px;
}

.message.theirs{
    align-self:flex-start;
    background:white;
    color:#111827;
    border-bottom-left-radius:5px;
}

.message-time{
    display:block;
    font-size:10px;
    opacity:.7;
    text-align:right;
    margin-top:4px;
}

.message-media,
.message-video{
    max-width:100%;
    max-height:300px;
    border-radius:10px;
    display:block;
}

/* =========================
   COMPOSER
========================= */

.composer{
    padding:10px;
    background:white;
    border-top:1px solid #d1d5db;
    display:flex;
    align-items:flex-end;
    gap:8px;
}

.attach-btn{
    width:42px;
    height:42px;
    min-width:42px;
    border:0;
    border-radius:50%;
    background:#e5e7eb;
}

.message-input{
    flex:1;
    min-height:42px;
    max-height:120px;
    resize:none;
    border:1px solid #d1d5db;
    border-radius:20px;
    padding:10px 14px;
    outline:none;
}

.message-input:focus{

}

.send-btn{
    width:42px;
    height:42px;
    min-width:42px;
    border:0;
    border-radius:50%;
    background:#2563eb;
    color:white;
    font-size:18px;
}

input[type="file"]{
    display:none;
}

/* =========================
   CALL
========================= */

.call-overlay{
    position:fixed;
    inset:0;
    background:rgba(15,23,42,.96);
    z-index:100;
    display:none;
    flex-direction:column;
    color:white;
}

.call-overlay.show{
    display:flex;
}

.call-header{
    padding:18px;
    text-align:center;
}

.call-header strong{
    font-size:20px;
}

.call-header span{
    display:block;
    margin-top:6px;
    color:#cbd5e1;
    font-size:13px;
}

.video-area{
    flex:1;
    position:relative;
    display:flex;
    align-items:center;
    justify-content:center;
    overflow:hidden;
}

.remote-video{
    width:100%;
    height:100%;
    object-fit:cover;
    background:#020617;
}

.local-video{
    position:absolute;
    right:15px;
    bottom:15px;
    width:140px;
    height:190px;
    object-fit:cover;
    border-radius:12px;
    border:2px solid white;
    background:#020617;
}

.call-actions{
    padding:20px;
    display:flex;
    justify-content:center;
    gap:14px;
}

.call-action{
    width:58px;
    height:58px;
    border:0;
    border-radius:50%;
    color:white;
    font-size:23px;
}

.call-end{
    background:#dc2626;
}

.call-muted{
    background:#475569;
}

/* =========================
   INCOMING
========================= */

.incoming{
    position:fixed;
    inset:0;
    z-index:200;
    display:none;
    align-items:center;
    justify-content:center;
    background:rgba(15,23,42,.82);
    padding:20px;
}

.incoming.show{
    display:flex;
}

.incoming-card{
    width:min(380px,100%);
    background:white;
    border-radius:22px;
    padding:28px;
    text-align:center;
    box-shadow:0 20px 60px rgba(0,0,0,.35);
}

.incoming-avatar{
    width:82px;
    height:82px;
    margin:0 auto 14px;
    border-radius:50%;
    background:#2563eb;
    color:white;
    display:flex;
    align-items:center;
    justify-content:center;
    overflow:hidden;
    font-size:28px;
    font-weight:bold;
}

.incoming-avatar img{
    width:100%;
    height:100%;
    object-fit:cover;
}

.incoming-card h2{
    font-size:21px;
}

.incoming-card p{
    color:#64748b;
    margin-top:7px;
}

.incoming-actions{
    display:flex;
    gap:12px;
    margin-top:24px;
}

.incoming-actions button{
    flex:1;
    padding:13px;
    border:0;
    border-radius:12px;
    color:white;
    font-weight:bold;
}

.reject{
    background:#dc2626;
}

.accept{
    background:#16a34a;

/* =========================
   TOAST
========================= */

.toast{
    position:fixed;
    left:50%;
    bottom:25px;
    transform:translate(-50%,20px);
    background:#111827;
    color:white;
    padding:12px 18px;
    border-radius:12px;
    opacity:0;
    pointer-events:none;
    transition:.25s;
    z-index:500;
    max-width:90%;
    text-align:center;
}

.toast.show{
    opacity:1;
    transform:translate(-50%,0);
}

/* =========================
   MOBILE
========================= */

@media(max-width:760px){

    .contacts{

    }

    .main.chat-open .chat{

    }

    .header{

        min-height:60px;
    }

    .message{
        max-width:86%;
    }

    .local-video{
        width:105px;
        height:145px;
    }

}

</style>

<script type="module">

/* ============================================================
   FIREBASE
============================================================ */

import {
    auth,
    db,
    almacenamiento
} from "./Js/firebase.js";

import {
    onAuthStateChanged
} from "https://www.gstatic.com/firebasejs/12.18.0/firebase-auth.js";

import {
    collection,
    doc,
    getDoc,
    getDocs,
    query,
    where,
    onSnapshot,
    addDoc,
    updateDoc,
    setDoc,
    serverTimestamp
} from "https://www.gstatic.com/firebasejs/12.18.0/firebase-firestore.js";

import {
    ref,
    uploadBytes,
    getDownloadURL
} from "https://www.gstatic.com/firebasejs/12.18.0/firebase-storage.js";

import {
    getMessaging,
    getToken,
    onMessage,
    isSupported
} from "https://www.gstatic.com/firebasejs/12.18.0/firebase-messaging.js";


/* ============================================================
   ESTADO
============================================================ */

let usuarioActual = null;
let perfilActual = null;

let contactoSeleccionado = null;
let contactoPerfil = null;

let contactos = [];
let contactosOriginales = [];

let mensajesActuales = [];

let unsubscribeMensajes = null;
let unsubscribeLlamadas = null;
let unsubscribeRespuestaLlamada = null;
let unsubscribeCandidatesCaller = null;
let unsubscribeCandidatesCallee = null;

let llamadaActualId = null;
let llamadaEntrante = null;

let peerConnection = null;
let localStream = null;
let remoteStream = null;

let isMuted = false;

const handledIncomingCalls = new Set();


/* ============================================================
   ELEMENTOS
============================================================ */

const main = document.getElementById("main");
const contactsList = document.getElementById("contactsList");
const contactSearch = document.getElementById("contactSearch");

const emptyChat = document.getElementById("emptyChat");
const messagesBox = document.getElementById("messages");
const composer = document.getElementById("composer");

const messageInput = document.getElementById("messageInput");
const sendBtn = document.getElementById("sendBtn");
const mediaInput = document.getElementById("mediaInput");

const headerName = document.getElementById("headerName");
const headerStatus = document.getElementById("headerStatus");

const voiceCallBtn = document.getElementById("voiceCallBtn");
const videoCallBtn = document.getElementById("videoCallBtn");

const callOverlay = document.getElementById("callOverlay");
const callName = document.getElementById("callName");
const callStatus = document.getElementById("callStatus");

const remoteVideo = document.getElementById("remoteVideo");
const localVideo = document.getElementById("localVideo");

const muteBtn = document.getElementById("muteBtn");
const endCallBtn = document.getElementById("endCallBtn");

const incomingCall = document.getElementById("incomingCall");
const incomingName = document.getElementById("incomingName");
const incomingType = document.getElementById("incomingType");
const incomingAvatar = document.getElementById("incomingAvatar");

const rejectCallBtn = document.getElementById("rejectCallBtn");
const acceptCallBtn = document.getElementById("acceptCallBtn");

const toast = document.getElementById("toast");


/* ============================================================
   UTILIDADES
============================================================ */

function mostrarToast(texto){

    toast.textContent = texto;

    toast.classList.add("show");

    setTimeout(() => {
        toast.classList.remove("show");
    },2800);

}


function escaparHTML(texto){

    return String(texto || "")
        .replace(/&/g,"&amp;")
        .replace(/</g,"&lt;")
        .replace(/>/g,"&gt;")
        .replace(/"/g,"&quot;")
        .replace(/'/g,"&#039;");

}


function nombrePerfil(perfil){

    if(!perfil){
        return "Usuario GESBASE";
    }

    const nombreCompleto =
        perfil.nombreCompleto ||
        `${perfil.nombre || ""} ${perfil.apellido || ""}`.trim();

    if(nombreCompleto){
        return nombreCompleto;
    }

    if(perfil.nombreEmpresa){
        return perfil.nombreEmpresa;
    }

    if(perfil.empresa){
        return perfil.empresa;
    }

    return "Usuario GESBASE";

}


function iniciales(nombre){

    const partes =
        String(nombre || "U")
            .trim()
            .split(/\s+/)
            .filter(Boolean);

    if(!partes.length){
        return "U";
    }

    if(partes.length === 1){
        return partes[0]
            .substring(0,2)
            .toUpperCase();
    }

    return (
        partes[0][0] +
        partes[1][0]
    ).toUpperCase();

}


function fotoPerfil(perfil){

    return (
        perfil?.fotoPerfil ||
        perfil?.fotoURL ||
        perfil?.photoURL ||
        perfil?.foto ||
        perfil?.avatar ||
        perfil?.imagen ||
        ""
    );

}


function tipoPerfil(perfil){

    if(!perfil){
        return "Usuario GESBASE";
    }

    return (
        perfil.rubro ||
        perfil.profesion ||
        perfil.categoria ||
        perfil.tipo ||
        perfil.perfilTipo ||
        "Usuario GESBASE"
    );

}


/* ============================================================
   PERFIL ÚNICO
   SIEMPRE usuarios/{uid}
============================================================ */

async function obtenerPerfil(uid){

    if(!uid){
        return null;
    }

    try{

        const snap =
            await getDoc(
                doc(db,"usuarios",uid)
            );

        if(!snap.exists()){
            return null;
        }

        return {
            uid,
            ...snap.data()
        };

    }catch(error){

        console.error(
            "Error obteniendo perfil:",
            error
        );

        return null;

    }

}


/* ============================================================
   PRESENCIA
============================================================ */

async function actualizarPresencia(enLinea){

    if(!usuarioActual){
        return;
    }

    try{

        await setDoc(
            doc(
                db,
                "usuarios",
                usuarioActual.uid
            ),
            {
                enLinea,
                ultimaConexion:
                    serverTimestamp()
            },
            {
                merge:true
            }
        );

    }catch(error){

        console.error(
            "Error de presencia:",
            error
        );

    }

}


/* ============================================================
   NOTIFICACIONES FCM
============================================================ */

async function registrarNotificaciones(){

    if(!usuarioActual){
        return;
    }

    try{

        const soportado =
            await isSupported();

        if(!soportado){

            console.log(
                "FCM no es compatible con este navegador."
            );

            return;

        }


        if(!("Notification" in window)){
            return;
        }


        const permiso =
            await Notification.requestPermission();


        if(permiso !== "granted"){

            console.log(
                "Permiso de notificaciones no concedido."
            );

            return;

        }


        /*
         * IMPORTANTE:
         *
         * Colocar aquí la clave pública VAPID
         * de Firebase Cloud Messaging.
         */

        const VAPID_KEY =
            "REEMPLAZAR_CON_TU_CLAVE_VAPID";


        if(
            !VAPID_KEY ||
            VAPID_KEY.includes("REEMPLAZAR")
        ){

            console.warn(
                "FCM: falta configurar VAPID."
            );

            return;

        }


        const messaging =
            getMessaging();


        const token =
            await getToken(
                messaging,
                {
                    vapidKey:
                        VAPID_KEY,

                    serviceWorkerRegistration:
                        await navigator.serviceWorker
                            .getRegistration()
                }
            );


        if(!token){

            console.warn(
                "FCM: no se obtuvo token."
            );

            return;

        }


        /*
         * IMPORTANTE:
         *
         * Se guarda el token dentro del mismo
         * usuarios/{uid}.
         *
         * NO se crea usuariosRed.
         * NO se crea directorio_red.
         */

        await setDoc(
            doc(
                db,
                "usuarios",
                usuarioActual.uid
            ),
            {
                fcmTokens:{
                    [token]:true
                },

                notificacionesPush:true,

                fechaActualizacionNotificaciones:
                    serverTimestamp()

            },
            {
                merge:true
            }
        );


        console.log(
            "FCM registrado."
        );


        onMessage(
            messaging,
            payload => {

                console.log(
                    "Mensaje FCM:",
                    payload
                );


                const titulo =
                    payload?.notification?.title ||
                    payload?.data?.title ||
                    "GESBASE";


                const cuerpo =
                    payload?.notification?.body ||
                    payload?.data?.body ||
                    "Tenés una nueva notificación.";


                mostrarToast(
                    `${titulo}: ${cuerpo}`
                );

            }
        );


    }catch(error){

        console.error(
            "Error registrando FCM:",
            error
        );

    }

}


/* ============================================================
   AUTENTICACIÓN
============================================================ */

onAuthStateChanged(
    auth,
    async usuario => {

        if(!usuario){

            window.location.href =
                "login.html";

            return;

        }


        usuarioActual =
            usuario;


        perfilActual =
            await obtenerPerfil(
                usuario.uid
            );


        if(!perfilActual){

            mostrarToast(
                "No se encontró tu perfil GESBASE."
            );

            return;

        }


        await actualizarPresencia(true);

        /*
         * Si todavía no está configurado VAPID,
         * no rompe mensajes ni llamadas.
         */

        await registrarNotificaciones();

        await cargarContactos();

        iniciarEscuchaLlamadas();

    }
);


/* ============================================================
   CONTACTOS
============================================================ */

async function cargarContactos(){

    if(!usuarioActual){
        return;
    }

    try{

async function cargarMensajes(){

    if(
        !usuarioActual ||
        !contactoSeleccionado
    ){
        return;
    }


    if(unsubscribeMensajes){

        unsubscribeMensajes();

        unsubscribeMensajes =
            null;

    }


    try{

        const enviadosQuery =
            query(
                collection(
                    db,
                    "mensajes"
                ),
                where(
                    "emisorUid",
                    "==",
                    usuarioActual.uid
                ),
                where(
                    "receptorUid",
                    "==",
                    contactoSeleccionado
                )
            );


        const recibidosQuery =
            query(
                collection(
                    db,
                    "mensajes"
                ),
                where(
                    "emisorUid",
                    "==",
                    contactoSeleccionado
                ),
                where(
                    "receptorUid",
                    "==",
                    usuarioActual.uid
                )
            );


        let enviados = [];
        let recibidos = [];


        const render =
            () => {

                const todos = [
                    ...enviados,
                    ...recibidos
                ];


                todos.sort(
                    (a,b) => {

                        const ta =
                            a.fechaCliente ||
                            a.fecha?.seconds * 1000 ||
                            0;


                        const tb =
                            b.fechaCliente ||
                            b.fecha?.seconds * 1000 ||
                            0;


                        return ta - tb;

                    }
                );


                mensajesActuales =
                    todos;


                renderizarMensajes();

            };


        const unsub1 =
            onSnapshot(
                enviadosQuery,
                snapshot => {

                    enviados =
                        snapshot.docs.map(
                            d => ({
                                id:d.id,
                                ...d.data()
                            })
                        );


                    render();

                }
            );


        const unsub2 =
            onSnapshot(
                recibidosQuery,
                snapshot => {

                    recibidos =
                        snapshot.docs.map(
                            d => ({
                                id:d.id,
                                ...d.data()
                            })
                        );


                    marcarRecibidosComoLeidos(
                        snapshot
                    );


                    render();

                }
            );


        unsubscribeMensajes =
            () => {

                unsub1();
                unsub2();

            };


    }catch(error){

        console.error(
            "Error cargando mensajes:",
            error
        );

        mostrarToast(
            "No se pudieron cargar los mensajes."
        );

    }

}

/* ============================================================
   HORA
============================================================ */

function formatearHora(mensaje){

    let fecha = null;


    if(mensaje.fechaCliente){

        fecha =
            new Date(
                mensaje.fechaCliente
            );

    }else if(
        mensaje.fecha &&
        mensaje.fecha.seconds
    ){

        fecha =
            new Date(
                mensaje.fecha.seconds * 1000
            );

    }


    if(!fecha){
        return "";
    }


    return fecha.toLocaleTimeString(
        "es-AR",
        {
            hour:"2-digit",
            minute:"2-digit"
        }
    );

}

async function marcarRecibidosComoLeidos(snapshot){

    if(!usuarioActual){

    snapshot.docs.forEach(
        item => {

            const data =
                item.data();


            if(
                data.leido === false &&
                data.receptorUid ===
                usuarioActual.uid
            ){

                operaciones.push(
                    updateDoc(
                        doc(
                            db,
                            "mensajes",
                            item.id
                        ),
                        {
                            leido:true,
                            fechaLectura:
                                serverTimestamp()
                        }
                    )
                );

            }

        }
    );


    if(operaciones.length){

        await Promise.allSettled(
            operaciones
        );

    }

}

/* ============================================================
   WEBRTC
============================================================ */

const rtcConfig = {

    iceServers:[
        {
            urls:
                "stun:stun.l.google.com:19302"
        }
    ]

};


/* ============================================================
   CREAR PEER
============================================================ */

function crearPeerConnection(){

    const pc =
        new RTCPeerConnection(
            rtcConfig
        );


    remoteStream =
        new MediaStream();


    remoteVideo.srcObject =
        remoteStream;


    pc.ontrack =
        event => {

            event.streams[0]
                ?.getTracks()
                .forEach(
                    track => {

                        remoteStream.addTrack(
                            track
                        );

                    }
                );

        };


    pc.onconnectionstatechange =
        () => {

            const estado =
                pc.connectionState;


            if(
                estado === "connected"
            ){

                callStatus.textContent =
                    "Conectado";

            }


            if(
                estado === "failed"
            ){

                callStatus.textContent =
                    "Conexión fallida";

            }


            if(
                estado === "disconnected"
            ){

                callStatus.textContent =
                    "Conexión perdida";

            }

        };


    return pc;

}


/* ============================================================
   LLAMADA SALIENTE
============================================================ */

async function iniciarLlamada(video){

    if(
        !contactoSeleccionado ||
        !usuarioActual
    ){

        mostrarToast(
            "Seleccioná una conexión."
        );

        return;

    }


    if(!navigator.mediaDevices){

        mostrarToast(
            "Tu navegador no permite acceder a cámara/micrófono."
        );

        return;

    }


    try{

        const tipo =
            video
            ? "videollamada"
            : "llamada";


        localStream =
            await navigator.mediaDevices
                .getUserMedia({

                    audio:true,
                    video:video

                });


        localVideo.srcObject =
            localStream;


        localVideo.style.display =
            video
            ? "block"
            : "none";


        remoteVideo.style.display =
            video
            ? "block"
            : "none";


        peerConnection =
            crearPeerConnection();


        localStream
            .getTracks()
            .forEach(
                track => {

                    peerConnection.addTrack(
                        track,
                        localStream
                    );

                }
            );


        const llamadaRef =
            await addDoc(
                collection(
                    db,
                    "llamadas"
                ),
                {

                    callerId:
                        usuarioActual.uid,

                    calleeId:
                        contactoSeleccionado,

                    callerName:
                        nombrePerfil(
                            perfilActual
                        ),

                    tipo,

                    status:"ringing",

                    fechaCliente:
                        Date.now(),

                    fecha:
                        serverTimestamp()

                }
            );


        llamadaActualId =
            llamadaRef.id;


        peerConnection.onicecandidate =
            async event => {

                if(
                    !event.candidate ||
                    !llamadaActualId
                ){
                    return;
                }


                try{

                    await addDoc(
                        collection(
                            db,
                            "llamadas",
                            llamadaActualId,
                            "callerCandidates"
                        ),
                        event.candidate.toJSON()
                    );

                }catch(error){

                    console.error(
                        "Error ICE caller:",
                        error
                    );

                }

            };


        const offer =
            await peerConnection
                .createOffer();


        await peerConnection
            .setLocalDescription(
                offer
            );


        await updateDoc(
            llamadaRef,
            {

                offer:{
                    type:offer.type,
                    sdp:offer.sdp
                }

            }
        );


        callName.textContent =
            nombrePerfil(
                contactoPerfil
            );


        callStatus.textContent =
            video
            ? "Videollamando..."
            : "Llamando...";


        callOverlay.classList.add(
            "show"
        );


        escucharRespuesta(
            llamadaActualId
        );


    }catch(error){

        console.error(
            "Error iniciando llamada:",
            error
        );


        cerrarLlamadaLocal();


        mostrarToast(
            "No se pudo iniciar la llamada."
        );

    }

}


/* ============================================================
   RESPUESTA
============================================================ */

function escucharRespuesta(llamadaId){

    if(unsubscribeRespuestaLlamada){

        unsubscribeRespuestaLlamada();

        unsubscribeRespuestaLlamada =
            null;

    }


    const llamadaRef =
        doc(
            db,
            "llamadas",
            llamadaId
        );


    unsubscribeRespuestaLlamada =
        onSnapshot(
            llamadaRef,
            async snapshot => {

                const data =
                    snapshot.data();


                if(!data){
                    return;
                }


                if(
                    data.answer &&
                    peerConnection &&
                    !peerConnection.currentRemoteDescription
                ){

                    try{

                        await peerConnection
                            .setRemoteDescription(
                                new RTCSessionDescription(
                                    data.answer
                                )
                            );


                        callStatus.textContent =
                            "Conectando...";


                        escucharCandidatosCallee(
                            llamadaId
                        );

                    }catch(error){

                        console.error(
                            "Error answer:",
                            error
                        );

                    }

                }


                if(
                    data.status ===
                    "rejected"
                ){

                    mostrarToast(
                        "La llamada fue rechazada."
                    );


                    cerrarLlamadaLocal();

                }


                if(
                    data.status ===
                    "ended"
                ){

                    cerrarLlamadaLocal();

                }

            }
        );

}


/* ============================================================
   CANDIDATOS DEL CALLEE
============================================================ */

function escucharCandidatosCallee(llamadaId){

    if(unsubscribeCandidatesCallee){

        unsubscribeCandidatesCallee();

        unsubscribeCandidatesCallee =
            null;

    }


    const candidatosRef =
        collection(
            db,
            "llamadas",
            llamadaId,
            "calleeCandidates"
        );


    unsubscribeCandidatesCallee =
        onSnapshot(
            candidatosRef,
            snapshot => {

                snapshot.docChanges()
                    .forEach(
                        async change => {

                            if(
                                change.type !==
                                "added"
                            ){
                                return;
                            }


                            if(!peerConnection){
                                return;
                            }


                            try{

                                await peerConnection
                                    .addIceCandidate(
                                        change.doc.data()
                                    );

                            }catch(error){

                                console.error(
                                    "Error agregando ICE:",
                                    error
                                );

                            }

                        }
                    );

            }
        );

}


/* ============================================================
   LLAMADAS ENTRANTES
============================================================ */

function iniciarEscuchaLlamadas(){

    if(!usuarioActual){
        return;
    }


    if(unsubscribeLlamadas){

        unsubscribeLlamadas();

        unsubscribeLlamadas =
            null;

    }


    const llamadasQuery =
        query(
            collection(
                db,
                "llamadas"
            ),
            where(
                "calleeId",
                "==",
                usuarioActual.uid
            ),
            where(
                "status",
                "==",
                "ringing"
            )
        );


    unsubscribeLlamadas =
        onSnapshot(
            llamadasQuery,
            async snapshot => {

                for(
                    const change
                    of snapshot.docChanges()
                ){

                    if(
                        change.type !==
                        "added"
                    ){
                        continue;
                    }


                    const llamada = {

                        id:
                            change.doc.id,

                        ...change.doc.data()

                    };


                    if(
                        handledIncomingCalls.has(
                            llamada.id
                        )
                    ){
                        continue;
                    }


                    handledIncomingCalls.add(
                        llamada.id
                    );


                    const perfil =
                        await obtenerPerfil(
                            llamada.callerId
                        );


                    mostrarLlamadaEntrante(
                        llamada,
                        perfil
                    );

                }

            }
        );

}

                        collection(
                            db,
                            "llamadas",
                            llamada.id,
                            "calleeCandidates"
                        ),
                        event.candidate.toJSON()
                    );

                }catch(error){

                    console.error(
                        "Error ICE callee:",
                        error
                    );

                }

            };


        await peerConnection
            .setRemoteDescription(
                new RTCSessionDescription(
                    llamada.offer
                )
            );


        const answer =
            await peerConnection
                .createAnswer();


        await peerConnection
            .setLocalDescription(
                answer
            );


        await updateDoc(
            doc(
                db,
                "llamadas",
                llamada.id
            ),
            {

                answer:{
                    type:answer.type,
                    sdp:answer.sdp
                },

                status:"accepted",

                fechaAceptacion:
                    serverTimestamp()

            }
        );


        escucharCandidatosCaller(
            llamada.id
        );


        const perfilCaller =
            await obtenerPerfil(
                llamada.callerId
            );


        callName.textContent =
            nombrePerfil(
                perfilCaller
            );


        callStatus.textContent =
            "Conectando...";


        callOverlay.classList.add(
            "show"
        );


        llamadaEntrante =
            null;


    }catch(error){

        console.error(
            "Error aceptando llamada:",
            error
        );


        mostrarToast(
            "No se pudo aceptar la llamada."
        );


        try{

            await rechazarLlamada(
                llamada.id
            );

        }catch(e){

            console.error(e);

        }


        llamadaEntrante =
            null;

    }

}


/* ============================================================
   CANDIDATOS DEL CALLER
============================================================ */

function escucharCandidatosCaller(llamadaId){

    if(unsubscribeCandidatesCaller){

        unsubscribeCandidatesCaller();

        unsubscribeCandidatesCaller =
            null;

    }


    const candidatosRef =
        collection(
            db,
            "llamadas",
            llamadaId,
            "callerCandidates"
        );


    unsubscribeCandidatesCaller =
        onSnapshot(
            candidatosRef,
            snapshot => {

                snapshot.docChanges()
                    .forEach(
                        async change => {

                            if(
                                change.type !==
                                "added"
                            ){
                                return;
                            }


                            if(!peerConnection){
                                return;
                            }


                            try{

                                await peerConnection
                                    .addIceCandidate(
                                        change.doc.data()
                                    );

                            }catch(error){

                                console.error(
                                    "Error ICE caller:",
                                    error
                                );

                            }

                        }
                    );

            }
        );

}


/* ============================================================
   RECHAZAR
============================================================ */

rejectCallBtn.addEventListener(
    "click",
    async () => {

        if(!llamadaEntrante){
            return;
        }


        const id =
            llamadaEntrante.id;


        await rechazarLlamada(id);


        llamadaEntrante =
            null;


        incomingCall.classList.remove(
            "show"
        );

    }
);


async function rechazarLlamada(llamadaId){

    try{

        await updateDoc(
            doc(
                db,
                "llamadas",
                llamadaId
            ),
            {

                status:"rejected",

                fechaFin:
                    serverTimestamp()

            }
        );

    }catch(error){

        console.error(
            "Error rechazando llamada:",
            error
        );

    }

}


/* ============================================================
   FINALIZAR
============================================================ */

endCallBtn.addEventListener(
    "click",
    finalizarLlamada
);


async function finalizarLlamada(){

    const id =
        llamadaActualId;


    if(id){

        try{

            await updateDoc(
                doc(
                    db,
                    "llamadas",
                    id
                ),
                {

                    status:"ended",

                    fechaFin:
                        serverTimestamp()

                }
            );

        }catch(error){

            console.error(
                "Error finalizando:",
                error
            );

        }

    }


    cerrarLlamadaLocal();

}


/* ============================================================
   CERRAR LLAMADA LOCAL
============================================================ */

function cerrarLlamadaLocal(){

    if(unsubscribeRespuestaLlamada){

        unsubscribeRespuestaLlamada();

        unsubscribeRespuestaLlamada =
            null;

    }


    if(unsubscribeCandidatesCaller){

        unsubscribeCandidatesCaller();

        unsubscribeCandidatesCaller =
            null;

    }


    if(unsubscribeCandidatesCallee){

        unsubscribeCandidatesCallee();

        unsubscribeCandidatesCallee =
            null;

    }


    if(localStream){

        localStream
            .getTracks()
            .forEach(
                track => track.stop()
            );

    }


    if(remoteStream){

        remoteStream
            .getTracks()
            .forEach(
                track => track.stop()
            );

    }


    if(peerConnection){

        peerConnection.close();

    }


    localStream =
        null;

    remoteStream =
        null;

    peerConnection =
        null;

    llamadaActualId =
        null;

    isMuted =
        false;


    remoteVideo.srcObject =
        null;

    localVideo.srcObject =
        null;


    muteBtn.textContent =
        "🎙️";


    callOverlay.classList.remove(
        "show"
    );

}


/* ============================================================
   SILENCIAR
============================================================ */

muteBtn.addEventListener(
    "click",
    () => {

        if(!localStream){
            return;
        }


        const pistas =
            localStream.getAudioTracks();


        pistas.forEach(
            pista => {

                pista.enabled =
                    !pista.enabled;

            }
        );


        isMuted =
            !pistas[0]?.enabled;


        muteBtn.textContent =
            isMuted
            ? "🔇"
            : "🎙️";

    }
);


/* ============================================================
   BOTONES
============================================================ */

voiceCallBtn.addEventListener(
    "click",
    () => {

        iniciarLlamada(false);

    }
);


videoCallBtn.addEventListener(
    "click",
    () => {

        iniciarLlamada(true);

    }
);


/* ============================================================
   VOLVER
============================================================ */

document
.getElementById("backBtn")
.addEventListener(
    "click",
    () => {

        if(
            main.classList.contains(
                "chat-open"
            )
        ){

            main.classList.remove(
                "chat-open"
            );


            contactoSeleccionado =
                null;


            contactoPerfil =
                null;


            headerName.textContent =
                "Mensajes";


            headerStatus.textContent =
                "Seleccioná una conexión";


            voiceCallBtn.style.display =
                "none";


            videoCallBtn.style.display =
                "none";


            emptyChat.style.display =
                "flex";


            messagesBox.style.display =
                "none";


            composer.style.display =
                "none";


            if(unsubscribeMensajes){

                unsubscribeMensajes();

                unsubscribeMensajes =
                    null;

            }


            return;

        }


        window.location.href =
            "red.html";

    }
);


/* ============================================================
   PRESENCIA AL SALIR
============================================================ */

window.addEventListener(
    "pagehide",
    () => {

        if(usuarioActual){

            setDoc(
                doc(
                    db,
                    "usuarios",
                    usuarioActual.uid
                ),
                {

                    enLinea:false,

                    ultimaConexion:
                        serverTimestamp()

                },
                {
                    merge:true
                }
            ).catch(
                console.error
            );

        }

    }
);

</script>
