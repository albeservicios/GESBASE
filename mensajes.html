<!DOCTYPE html>
<html lang="es-AR">

<head>

<meta charset="UTF-8">

<meta
    name="viewport"
    content="width=device-width, initial-scale=1.0, viewport-fit=cover"
>

<meta
    name="theme-color"
    content="#111827"
>

<meta
    name="description"
    content="Mensajes de Red GESBASE"
>

<title>Mensajes - Red GESBASE</title>

<style>

*{
    box-sizing:border-box;
}

html,
body{
    margin:0;
    padding:0;
    width:100%;
    min-height:100%;
    font-family:Arial,Helvetica,sans-serif;
    background:#f3f4f6;
    color:#111827;
}

body{
    min-height:100vh;
}


/* =========================
   HEADER
========================= */

.header{
    position:sticky;
    top:0;
    z-index:100;
    height:64px;
    background:#111827;
    color:white;
    display:flex;
    align-items:center;
    gap:8px;
    padding:8px 12px;
    box-shadow:0 2px 10px rgba(0,0,0,.15);
}

.back-btn{
    width:42px;
    height:42px;
    border:0;
    background:transparent;
    color:white;
    font-size:25px;
    cursor:pointer;
}

.contact-header{
    display:none;
    align-items:center;
    gap:10px;
    flex:1;
    min-width:0;
    cursor:pointer;
}

.contact-header.visible{
    display:flex;
}

.header-avatar{
    width:44px;
    height:44px;
    min-width:44px;
    border-radius:50%;
    object-fit:cover;
    background:#374151;
}

.header-info{
    min-width:0;
}

.header-name{
    font-weight:bold;
    white-space:nowrap;
    overflow:hidden;
    text-overflow:ellipsis;
}

.header-status{
    font-size:12px;
    opacity:.8;
    margin-top:2px;
}

.header-actions{
    display:none;
    margin-left:auto;
}

.header-actions.visible{
    display:flex;
}

.video-call-button{
    width:44px;
    height:44px;
    border:0;
    border-radius:50%;
    background:#1f2937;
    color:white;
    font-size:21px;
    cursor:pointer;
}


/* =========================
   CONTENEDOR
========================= */

.page{
    width:100%;
    max-width:1050px;
    margin:auto;
    padding:15px;
}


/* =========================
   CONTACTOS
========================= */

.contacts-panel{
    background:white;
    border-radius:18px;
    overflow:hidden;
    box-shadow:0 2px 12px rgba(0,0,0,.08);
}

.contacts-title{
    padding:18px;
    border-bottom:1px solid #e5e7eb;
}

.contacts-title h1{
    margin:0;
    font-size:23px;
}

.contacts-title p{
    margin:6px 0 0;
    color:#6b7280;
    font-size:14px;
}

.contact-item{
    width:100%;
    border:0;
    border-bottom:1px solid #e5e7eb;
    background:white;
    padding:13px 15px;
    display:flex;
    align-items:center;
    gap:12px;
    cursor:pointer;
    text-align:left;
}

.contact-item:hover{
    background:#f9fafb;
}

.avatar-container{
    position:relative;
    flex:none;
}

.contact-avatar{
    width:55px;
    height:55px;
    border-radius:50%;
    object-fit:cover;
    background:#e5e7eb;
}

.online-dot{
    position:absolute;
    right:1px;
    bottom:1px;
    width:14px;
    height:14px;
    border-radius:50%;
    background:#9ca3af;
    border:3px solid white;
}

.online-dot.online{
    background:#22c55e;
}

.contact-data{
    min-width:0;
    flex:1;
}

.contact-name{
    font-weight:bold;
    font-size:16px;
    white-space:nowrap;
    overflow:hidden;
    text-overflow:ellipsis;
}

.contact-type{
    font-size:13px;
    color:#6b7280;
    margin-top:3px;
}

.contact-status{
    font-size:12px;
    margin-top:4px;
    color:#6b7280;
}

.unread{
    min-width:23px;
    height:23px;
    border-radius:50%;
    background:#2563eb;
    color:white;
    display:flex;
    align-items:center;
    justify-content:center;
    padding:0 6px;
    font-size:11px;
    font-weight:bold;
}

.unread.hidden{
    display:none;
}

.loading,
.empty{
    padding:35px;
    text-align:center;
    color:#6b7280;
}

.error{
    margin:15px;
    padding:15px;
    border-radius:12px;
    background:#fee2e2;
    color:#991b1b;
}


/* =========================
   CHAT
========================= */

.chat-panel{
    display:none;
    height:calc(100vh - 90px);
    min-height:500px;
    background:white;
    border-radius:18px;
    overflow:hidden;
    position:relative;
    box-shadow:0 2px 12px rgba(0,0,0,.08);
}

.chat-panel.visible{
    display:flex;
    flex-direction:column;
}

.messages{
    flex:1;
    overflow-y:auto;
    padding:15px 12px 85px;
    background:#f9fafb;
}

.message-row{
    display:flex;
    margin:7px 0;
}

.message-row.mine{
    justify-content:flex-end;
}

.message-row.theirs{
    justify-content:flex-start;
}

.message-bubble{
    max-width:min(80%,600px);
    padding:9px 12px;
    border-radius:17px;
    box-shadow:0 1px 3px rgba(0,0,0,.08);
    word-break:break-word;
}

.mine .message-bubble{
    background:#2563eb;
    color:white;
    border-bottom-right-radius:5px;
}

.theirs .message-bubble{
    background:white;
    color:#111827;
    border-bottom-left-radius:5px;
}

.message-text{
    white-space:pre-wrap;
    font-size:15px;
    line-height:1.35;
}

.message-time{
    font-size:10px;
    opacity:.7;
    margin-top:4px;
    text-align:right;
}

.message-image{
    display:block;
    max-width:100%;
    max-height:350px;
    border-radius:12px;
    cursor:pointer;
}

.message-video{
    display:block;
    width:100%;
    max-width:430px;
    max-height:350px;
    border-radius:12px;
    background:#000;
}

.composer{
    position:absolute;
    left:0;
    right:0;
    bottom:0;
    display:flex;
    align-items:center;
    gap:7px;
    padding:9px;
    background:white;
    border-top:1px solid #e5e7eb;
}

.media-button,
.send-button{
    width:43px;
    height:43px;
    min-width:43px;
    border:0;
    border-radius:50%;
    cursor:pointer;
    font-size:19px;
}

.media-button{
    background:#eef2ff;
    color:#2563eb;
}

.send-button{
    background:#2563eb;
    color:white;
}

#mensaje{
    flex:1;
    min-width:0;
    min-height:43px;
    max-height:110px;
    resize:none;
    border:1px solid #d1d5db;
    border-radius:22px;
    padding:11px 14px;
    font-family:inherit;
    font-size:15px;
    outline:none;
}


/* =========================
   VIDEOLLAMADA
========================= */

.call-overlay{
    position:fixed;
    inset:0;
    z-index:1000;
    display:none;
    align-items:center;
    justify-content:center;
    background:rgba(0,0,0,.88);
    padding:10px;
}

.call-overlay.visible{
    display:flex;
}

.call-box{
    width:100%;
    max-width:1000px;
    height:92vh;
    background:#030712;
    border-radius:18px;
    overflow:hidden;
    position:relative;
}

.remote-video{
    width:100%;
    height:100%;
    object-fit:cover;
    background:#030712;
}

.local-video{
    position:absolute;
    right:15px;
    top:15px;
    width:160px;
    height:210px;
    object-fit:cover;
    border-radius:14px;
    border:2px solid white;
    background:#000;
    z-index:5;
}

.call-info{
    position:absolute;
    top:15px;
    left:15px;
    z-index:5;
    background:rgba(0,0,0,.55);
    color:white;
    padding:8px 12px;
    border-radius:12px;
}

.call-controls{
    position:absolute;
    bottom:20px;
    left:0;
    right:0;
    z-index:6;
    display:flex;
    justify-content:center;
    gap:15px;
}

.call-control{
    width:58px;
    height:58px;
    border:0;
    border-radius:50%;
    background:#374151;
    color:white;
    font-size:22px;
    cursor:pointer;
}

.call-control.end{
    background:#dc2626;
}


/* =========================
   LLAMADA ENTRANTE
========================= */

.incoming{
    position:fixed;
    z-index:1100;
    left:50%;
    top:50%;
    transform:translate(-50%,-50%);
    width:min(92%,390px);
    background:white;
    border-radius:20px;
    padding:25px;
    box-shadow:0 20px 70px rgba(0,0,0,.4);
    text-align:center;
    display:none;
}

.incoming.visible{
    display:block;
}

.incoming-avatar{
    width:85px;
    height:85px;
    border-radius:50%;
    object-fit:cover;
}

.incoming-name{
    margin-top:10px;
    font-size:20px;
    font-weight:bold;
}

.incoming-text{
    color:#6b7280;
    margin:7px 0 20px;
}

.incoming-buttons{
    display:flex;
    gap:10px;
}

.incoming-buttons button{
    flex:1;
    border:0;
    border-radius:12px;
    padding:13px;
    font-weight:bold;
    cursor:pointer;
}

.reject{
    background:#fee2e2;
    color:#991b1b;
}

.accept{
    background:#dcfce7;
    color:#166534;
}


/* =========================
   ESPERA OFERTA
========================= */

.waiting-call{
    position:fixed;
    inset:0;
    z-index:1200;
    display:none;
    align-items:center;
    justify-content:center;
    background:rgba(0,0,0,.75);
    padding:20px;
}

.waiting-call.visible{
    display:flex;
}

.waiting-box{
    width:min(92%,380px);
    background:white;
    border-radius:18px;
    padding:25px;
    text-align:center;
}

.spinner{
    width:40px;
    height:40px;
    margin:0 auto 15px;
    border:4px solid #e5e7eb;
    border-top-color:#2563eb;
    border-radius:50%;
    animation:girar 1s linear infinite;
}

@keyframes girar{
    to{
        transform:rotate(360deg);
    }
}


@media(max-width:600px){

    .page{
        padding:0;
    }

    .contacts-panel,
    .chat-panel{
        border-radius:0;
    }

    .chat-panel{
        height:calc(100vh - 64px);
        min-height:0;
    }

    .message-bubble{
        max-width:87%;
    }

    .local-video{
        width:105px;
        height:145px;
    }

}

</style>

</head>


<body>

<script type="module">


/* =========================================================
   FIREBASE
========================================================= */

import {
    auth,
    db,
    almacenamiento
} from "./Js/firebase.js";


import {
    onAuthStateChanged
} from "https://www.gstatic.com/firebasejs/12.18.0/firebase-auth.js";


import {
    collection,
    query,
    where,
    getDocs,
    getDoc,
    doc,
    addDoc,
    updateDoc,
    setDoc,
    onSnapshot,
    serverTimestamp
} from "https://www.gstatic.com/firebasejs/12.18.0/firebase-firestore.js";


import {
    ref,
    uploadBytes,
    getDownloadURL
} from "https://www.gstatic.com/firebasejs/12.18.0/firebase-storage.js";


/* =========================================================
   ELEMENTOS
========================================================= */

const contactsPanel =
    document.getElementById("contactsPanel");

const contactList =
    document.getElementById("contactList");

const chatPanel =
    document.getElementById("chatPanel");

const messages =
    document.getElementById("messages");

const mensaje =
    document.getElementById("mensaje");

const btnEnviar =
    document.getElementById("btnEnviar");

const btnMedia =
    document.getElementById("btnMedia");

const fileMedia =
    document.getElementById("fileMedia");

const btnVolver =
    document.getElementById("btnVolver");

const contactHeader =
    document.getElementById("contactHeader");

const headerAvatar =
    document.getElementById("headerAvatar");

const headerName =
    document.getElementById("headerName");

const headerStatus =
    document.getElementById("headerStatus");

const headerActions =
    document.getElementById("headerActions");

const btnVideoCall =
    document.getElementById("btnVideoCall");

const callOverlay =
    document.getElementById("callOverlay");

const callInfo =
    document.getElementById("callInfo");

const remoteVideo =
    document.getElementById("remoteVideo");

const localVideo =
    document.getElementById("localVideo");

const btnMute =
    document.getElementById("btnMute");

const btnCamera =
    document.getElementById("btnCamera");

const btnEndCall =
    document.getElementById("btnEndCall");

const incoming =
    document.getElementById("incoming");

const incomingAvatar =
    document.getElementById("incomingAvatar");

const incomingName =
    document.getElementById("incomingName");

const btnAccept =
    document.getElementById("btnAccept");

const btnReject =
    document.getElementById("btnReject");

const waitingCall =
    document.getElementById("waitingCall");


/* =========================================================
   VARIABLES
========================================================= */

let usuarioActual = null;

let contactos = [];

let contactoSeleccionado = null;

let unsubscribeUnread = null;

let unsubscribeIncoming = null;

let unsubscribeCall = null;

let unsubscribeRemoteIce = null;

let peerConnection = null;

let localStream = null;

let currentCallId = null;

let incomingCallData = null;

let pendingRemoteCandidates = [];

let remoteDescriptionReady = false;

let muted = false;

let cameraOff = false;


/* =========================================================
   URL
========================================================= */

const params =
    new URLSearchParams(
        window.location.search
    );


const uidSolicitado =
    params.get("usuario");


/* =========================================================
   WEBRTC
========================================================= */

const rtcConfig = {

    iceServers:[

        {
            urls:[
                "stun:stun.l.google.com:19302",
                "stun:stun1.l.google.com:19302"
            ]
        }

    ],

    iceCandidatePoolSize:10

};


/* =========================================================
   UTILIDADES
========================================================= */

function fotoPredeterminada(){

    return "data:image/svg+xml;charset=UTF-8," +
        encodeURIComponent(`
            <svg xmlns="http://www.w3.org/2000/svg"
                 width="100"
                 height="100">

                <rect
                    width="100"
                    height="100"
                    fill="#e5e7eb"
                />

                <text
                    x="50"
                    y="58"
                    text-anchor="middle"
                    font-size="42"
                    fill="#6b7280"
                >
                    👤
                </text>

            </svg>
        `);

}


function nombrePerfil(perfil){

    if(!perfil){
        return "Usuario";
    }


    return (
        perfil.nombreCompleto ||
        (
            [
                perfil.nombre,
                perfil.apellido
            ]
            .filter(Boolean)
            .join(" ")
        ) ||
        perfil.empresa ||
        "Usuario"
    );

}


function tipoPerfil(perfil){

    if(!perfil){
        return "Usuario";
    }


    return (
        perfil.rubro ||
        perfil.profesion ||
        perfil.tipo ||
        perfil.categoria ||
        "Usuario de Red GESBASE"
    );

}


function fotoPerfil(perfil){

    if(!perfil){
        return "";
    }


    return (
        perfil.fotoURL ||
        perfil.foto ||
        perfil.avatar ||
        perfil.imagen ||
        ""
    );

}


function estaActivo(perfil){

    if(!perfil){
        return false;
    }


    if(perfil.enLinea === true){
        return true;
    }


    let fecha = 0;


    if(
        perfil.ultimaConexion &&
        typeof perfil.ultimaConexion.toMillis ===
        "function"
    ){

        fecha =
            perfil.ultimaConexion.toMillis();

    }


    if(
        typeof perfil.ultimaConexion ===
        "number"
    ){

        fecha =
            perfil.ultimaConexion;

    }


    if(!fecha){
        return false;
    }


    return (
        Date.now() - fecha
    ) < 90000;

}


function horaMensaje(data){

    let fecha = null;


    if(
        data.fecha &&
        typeof data.fecha.toDate ===
        "function"
    ){

        fecha =
            data.fecha.toDate();

    }


    if(
        !fecha &&
        data.fechaCliente
    ){

        fecha =
            new Date(
                data.fechaCliente
            );

    }


    if(!fecha){
        return "";
    }


    return fecha.toLocaleTimeString(
        "es-AR",
        {
            hour:"2-digit",
            minute:"2-digit"
        }
    );

}


/* =========================================================
   AUTH
========================================================= */

onAuthStateChanged(
    auth,
    async usuario => {

        if(!usuario){

            window.location.href =
                "login.html";

            return;

        }


        usuarioActual =
            usuario;


        /*
         * IMPORTANTE:
         * ESTA ESCUCHA SE ACTIVA PARA
         * CUALQUIER USUARIO AUTENTICADO.
         */

        iniciarEscuchaLlamadas();


        iniciarEscuchaNoLeidos();


        actualizarPresencia();


        setInterval(
            actualizarPresencia,
            30000
        );


        await cargarContactos();


        if(uidSolicitado){

            const encontrado =
                contactos.find(
                    c =>
                        c.uid ===
                        uidSolicitado
                );


            if(encontrado){

                seleccionarContacto(
                    encontrado
                );

            }

        }

    }
);


/* =========================================================
   PRESENCIA
========================================================= */

async function actualizarPresencia(){

    if(!usuarioActual){
        return;
    }


    try{

        await setDoc(
            doc(
                db,
                "usuariosRed",
                usuarioActual.uid
            ),
            {

                enLinea:true,

                ultimaConexion:
                    serverTimestamp()

            },
            {
                merge:true
            }
        );

    }catch(error){

        console.warn(
            "Presencia:",
            error
        );

    }

}


/* =========================================================
   PERFIL
========================================================= */

async function obtenerPerfil(uid){

    try{

        const snap =
            await getDoc(
                doc(
                    db,
                    "directorio_red",
                    uid
                )
            );


        if(snap.exists()){

            return {

                uid,

                ...snap.data()

            };

        }

    }catch(error){

async function cargarContactos(){

    contactList.innerHTML =
        `<div class="loading">
            Cargando contactos...
        </div>`;


    try{

        const enviados =
            await getDocs(
                query(
                    collection(
                        db,
                        "conexiones"
                    ),
                    where(
                        "emisor",
                        "==",
                        usuarioActual.uid
                    )
                )
            );


        const recibidos =
            await getDocs(
                query(
                    collection(
                        db,
                        "conexiones"
                    ),
                    where(
                        "receptor",
                        "==",
                        usuarioActual.uid
                    )
                )
            );


        const ids =
            new Set();


        enviados.forEach(
            snap => {

                const d =
                    snap.data();


                if(
                    d.estado ===
                    "aceptada" ||
                    d.estado ===
                    "aceptado"
                ){

                    if(d.receptor){

                        ids.add(
                            d.receptor
                        );

                    }

                }

            }
        );


        recibidos.forEach(
            snap => {

                const d =
                    snap.data();


                if(
                    d.estado ===
                    "aceptada" ||
                    d.estado ===
                    "aceptado"
                ){

                    if(d.emisor){

                        ids.add(
                            d.emisor
                        );

                    }

                }

            }
        );


        contactos = [];


        for(
            const uid
            of ids
        ){

            contactos.push({

                uid,

                perfil:
                    await obtenerPerfil(
                        uid
                    )

            });

        }


        renderizarContactos();


    }catch(error){

        console.error(error);


        contactList.innerHTML =
            `<div class="error">

                No se pudieron cargar
                los contactos.

                <br><br>

                ${error.message}

            </div>`;

    }

}


/* =========================================================

========================================================= */

function iniciarEscuchaNoLeidos(){

    if(unsubscribeUnread){

        unsubscribeUnread();

    }


    const q =
        query(
            collection(
                db,
                "mensajes"
            ),
            where(
                "receptorUid",
                "==",
                usuarioActual.uid
            )
        );


    unsubscribeUnread =
        onSnapshot(
            q,
            snapshot => {

                const mapa =
                    new Map();


                snapshot.forEach(
                    snap => {

                        const d =
                            snap.data();


                        if(
                            d.leido === false &&
                            d.emisorUid
                        ){

                            mapa.set(
                                d.emisorUid,
                                (
                                    mapa.get(
                                        d.emisorUid
                                    ) || 0
                                ) + 1
                            );

                        }

                    }
                );


                window.unreadMap =
                    mapa;


                renderizarContactos();

            },
            error => {

                console.warn(
                    "No leídos:",
                    error
                );

            }
        );

}

async function cargarMensajes(){

    if(!contactoSeleccionado){
        return;
    }


    messages.innerHTML =
        `<div class="loading">
            Cargando conversación...
        </div>`;


    try{

        const enviados =
            await getDocs(
                query(
                    collection(
                        db,
                        "mensajes"
                    ),
                    where(
                        "emisorUid",
                        "==",
                        usuarioActual.uid
                    )
                )
            );


        const recibidos =
            await getDocs(
                query(
                    collection(
                        db,
                        "mensajes"
                    ),
                    where(
                        "receptorUid",
                        "==",
                        usuarioActual.uid
                    )
                )
            );


        const lista = [];


        enviados.forEach(
            snap => {

                const d =
                    snap.data();


                if(
                    d.receptorUid ===
                    contactoSeleccionado.uid
                ){

                    lista.push({

                        id:
                            snap.id,

                        ...d

                    });

                }

            }
        );


        recibidos.forEach(
            snap => {

                const d =
                    snap.data();


                if(
                    d.emisorUid ===
                    contactoSeleccionado.uid
                ){

                    lista.push({

                        id:
                            snap.id,

                        ...d

                    });

                }

            }
        );


        lista.sort(
            (a,b) =>
                (
                    a.fechaCliente || 0
                ) -
                (
                    b.fechaCliente || 0
                )
        );


        messages.innerHTML =
            "";


        if(!lista.length){

            messages.innerHTML =
                `<div class="empty">

                    Todavía no hay mensajes.

                    <br>

                    Comenzá la conversación.

                </div>`;

            return;

        }


        lista.forEach(
            renderMensaje
        );


        messages.scrollTop =
            messages.scrollHeight;


    }catch(error){

        console.error(error);


        messages.innerHTML =
            `<div class="error">

                Error cargando mensajes:

                <br><br>

                ${error.message}

            </div>`;

    }

}

function renderMensaje(data){

    const mio =
        data.emisorUid ===
        usuarioActual.uid;


    const fila =
        document.createElement(
            "div"
        );


    fila.className =
        "message-row " +
        (
            mio
            ? "mine"
            : "theirs"
        );


    const burbuja =
        document.createElement(
            "div"
        );


    burbuja.className =
        "message-bubble";


    if(
        data.tipo ===
        "imagen" &&
        data.mediaUrl
    ){

        const img =
            document.createElement(
                "img"
            );


        img.className =
            "message-image";


        img.src =
            data.mediaUrl;


        img.alt =
            data.mediaNombre ||
            "Imagen";


        img.onclick =
            () =>
                window.open(
                    data.mediaUrl,
                    "_blank"
                );


        burbuja.appendChild(
            img
        );


    }else if(
        data.tipo ===
        "video" &&
        data.mediaUrl
    ){

        const video =
            document.createElement(
                "video"
            );


        video.className =
            "message-video";


        video.src =
            data.mediaUrl;


        video.controls =
            true;


        video.playsInline =
            true;


        burbuja.appendChild(
            video
        );


    }else{

        const texto =
            document.createElement(
                "div"
            );


        texto.className =
            "message-text";


        texto.textContent =
            data.contenido ||
            "";


        burbuja.appendChild(
            texto
        );

    }


    const hora =
        document.createElement(
            "div"
        );


    hora.className =
        "message-time";


    hora.textContent =
        horaMensaje(
            data
        );


    burbuja.appendChild(
        hora
    );


    fila.appendChild(
        burbuja
    );


    messages.appendChild(
        fila
    );

}

async function enviarArchivo(
    archivo
){

    if(
        !archivo.type.startsWith(
            "image/"
        ) &&
        !archivo.type.startsWith(
            "video/"
        )
    ){

        alert(
            "Solo se permiten fotos y videos."
        );

        return;

    }


    const esVideo =
        archivo.type.startsWith(
            "video/"
        );


    const limite =
        esVideo
        ? 50 * 1024 * 1024
        : 10 * 1024 * 1024;


    if(
        archivo.size >
        limite
    ){

        alert(
            esVideo
            ? "El video supera el límite de 50 MB."
            : "La imagen supera el límite de 10 MB."
        );

        return;

    }


    if(!almacenamiento){

        alert(
            "Firebase Storage no está disponible."
        );

        return;

    }


    try{

        btnMedia.disabled =
            true;


        const extension =
            archivo.name
                .split(".")
                .pop()
                .toLowerCase();


        const nombre =
            Date.now() +
            "_" +
            Math.random()
                .toString(36)
                .substring(2) +
            "." +
            extension;


        const storageRef =
            ref(
                almacenamiento,
                `mensajes-media/${usuarioActual.uid}/${nombre}`
            );


        await uploadBytes(
            storageRef,
            archivo,
            {
                contentType:
                    archivo.type
            }
        );


        const url =
            await getDownloadURL(
                storageRef
            );


        await addDoc(
            collection(
                db,
                "mensajes"
            ),
            {

                emisorUid:
                    usuarioActual.uid,

                receptorUid:
                    contactoSeleccionado.uid,

                contenido:
                    "",

                tipo:
                    esVideo
                    ? "video"
                    : "imagen",

                mediaUrl:
                    url,

                mediaNombre:
                    archivo.name,

                mediaTipo:
                    archivo.type,

                fecha:
                    serverTimestamp(),

                fechaCliente:
                    Date.now(),

                leido:
                    false

            }
        );


    }catch(error){

        console.error(error);


        alert(
            "Error enviando archivo:\n" +
            error.message
        );

    }finally{

        btnMedia.disabled =
            false;

    }

}

/* =========================================================
   PREPARAR CÁMARA
========================================================= */

async function prepararCamara(){

    if(
        !navigator.mediaDevices ||
        !navigator.mediaDevices.getUserMedia
    ){

        throw new Error(
            "El navegador no permite acceder a cámara y micrófono."
        );

    }


    localStream =
        await navigator.mediaDevices.getUserMedia(
            {
                video:{
                    facingMode:"user"
                },
                audio:true
            }
        );


    localVideo.srcObject =
        localStream;


    try{

        await localVideo.play();

    }catch(error){}

}


/* =========================================================
   CREAR PEER
========================================================= */

function crearPeer(){

    peerConnection =
        new RTCPeerConnection(
            rtcConfig
        );


    pendingRemoteCandidates =
        [];


    remoteDescriptionReady =
        false;


    if(localStream){

        localStream
            .getTracks()
            .forEach(
                track => {

                    peerConnection.addTrack(
                        track,
                        localStream
                    );

                }
            );

    }


    peerConnection.ontrack =
        evento => {

            console.log(
                "📺 STREAM REMOTO RECIBIDO"
            );


            if(
                evento.streams &&
                evento.streams[0]
            ){

                remoteVideo.srcObject =
                    evento.streams[0];


                remoteVideo.muted =
                    false;


                remoteVideo
                    .play()
                    .catch(
                        error => {

                            console.warn(
                                "Play remoto:",
                                error
                            );

                        }
                    );

            }

        };


    peerConnection.onconnectionstatechange =
        () => {

            if(!peerConnection){
                return;
            }


            console.log(
                "WebRTC:",
                peerConnection.connectionState
            );


            if(
                peerConnection.connectionState ===
                "connected"
            ){

                callInfo.textContent =
                    "🟢 Llamada conectada";

            }


            if(
                peerConnection.connectionState ===
                "failed"
            ){

                callInfo.textContent =
                    "❌ Error de conexión";

            }

        };


    peerConnection.oniceconnectionstatechange =
        () => {

            if(!peerConnection){
                return;
            }


            console.log(
                "ICE:",
                peerConnection.iceConnectionState
            );

        };

}


/* =========================================================
   ICE SEGURO
========================================================= */

async function agregarCandidatoRemoto(
    candidate
){

    if(!candidate){
        return;
    }


    if(
        !peerConnection ||
        !remoteDescriptionReady
    ){

        pendingRemoteCandidates.push(
            candidate
        );

        return;

    }


    try{

        await peerConnection.addIceCandidate(
            new RTCIceCandidate(
                candidate
            )
        );


    }catch(error){

        console.warn(
            "ICE remoto:",
            error
        );

    }

}


/* =========================================================
   APLICAR ICE PENDIENTES
========================================================= */

async function agregarCandidatosPendientes(){

    if(
        !peerConnection ||
        !remoteDescriptionReady
    ){

        return;

    }


    const pendientes =
        [
            ...pendingRemoteCandidates
        ];


    pendingRemoteCandidates =
        [];


    for(
        const candidate
        of pendientes
    ){

        try{

            await peerConnection.addIceCandidate(
                new RTCIceCandidate(
                    candidate
                )
            );

        }catch(error){

            console.warn(
                "ICE pendiente:",
                error
            );

        }

    }

}


/* =========================================================
   ESCUCHAR ICE
========================================================= */

function escucharICE(
    callId,
    subcoleccion
){

    if(unsubscribeRemoteIce){

        unsubscribeRemoteIce();

    }


    unsubscribeRemoteIce =
        onSnapshot(
            collection(
                db,
                "llamadas",
                callId,
                subcoleccion
            ),
            snapshot => {

                snapshot.docChanges()
                    .forEach(
                        cambio => {

                            if(
                                cambio.type ===
                                "added"
                            ){

                                agregarCandidatoRemoto(
                                    cambio.doc.data()
                                );

                            }

                        }
                    );

            },
            error => {

                console.error(
                    "Error escuchando ICE:",
                    error
                );

            }
        );

}


/* =========================================================
   ESTADO DE LLAMADA
========================================================= */

function escucharEstadoLlamada(
    callId
){

    if(unsubscribeCall){

        unsubscribeCall();

    }


    unsubscribeCall =
        onSnapshot(
            doc(
                db,
                "llamadas",
                callId
            ),
            async snapshot => {

                if(!snapshot.exists()){

                    finalizarLlamadaLocal();

                    return;

                }


                const data =
                    snapshot.data();


                /*
                 * CALLER:
                 * ESPERAR ANSWER
                 */

                if(
                    data.answer &&
                    peerConnection &&
                    !remoteDescriptionReady
                ){

                    try{

                        await peerConnection.setRemoteDescription(
                            new RTCSessionDescription(
                                data.answer
                            )
                        );


                        remoteDescriptionReady =
                            true;


                        await agregarCandidatosPendientes();


                    }catch(error){

                        console.error(
                            "Error aplicando answer:",
                            error
                        );

                    }

                }


                if(
                    data.status ===
                    "rejected"
                ){

                    alert(
                        "La llamada fue rechazada."
                    );


                    finalizarLlamadaLocal();

                }


                if(
                    data.status ===
                    "ended"
                ){

                    finalizarLlamadaLocal();

                }

            },
            error => {

                console.error(
                    "Estado llamada:",
                    error
                );

            }
        );

}


/* =========================================================
   INICIAR VIDEOLLAMADA
========================================================= */

btnVideoCall.addEventListener(
    "click",

async function iniciarVideollamada(){

    if(
        !usuarioActual ||
        !contactoSeleccionado
    ){

        return;

    }


    if(currentCallId){

        alert(
            "Ya hay una llamada activa."
        );

        return;

    }


    try{

        await prepararCamara();


        crearPeer();


        /*
         * IMPORTANTE:
         * CREAMOS EL DOCUMENTO DE LLAMADA.
         */

        const llamada =
            await addDoc(
                collection(
                    db,
                    "llamadas"
                ),
                {

                    callerId:
                        usuarioActual.uid,

                    calleeId:
                        contactoSeleccionado.uid,

                    callerName:
                        usuarioActual.displayName ||
                        "Usuario",

                    status:
                        "ringing",

                    fechaCliente:
                        Date.now(),

                    fecha:
                        serverTimestamp()

                }
            );


        currentCallId =
            llamada.id;


        mostrarLlamada(
            "Llamando a " +
            nombrePerfil(
                contactoSeleccionado.perfil
            )
        );


        /*
         * ICE CALLER
         */

        peerConnection.onicecandidate =
            async evento => {

                if(
                    !evento.candidate ||
                    !currentCallId
                ){

                    return;

                }


                try{

                    await addDoc(
                        collection(
                            db,
                            "llamadas",
                            currentCallId,
                            "callerCandidates"
                        ),
                        evento.candidate.toJSON()
                    );

                }catch(error){

                    console.warn(
                        "ICE caller:",
                        error
                    );

                }

            };


        escucharEstadoLlamada(
            currentCallId
        );


        escucharICE(
            currentCallId,
            "calleeCandidates"
        );


        /*
         * CREAR OFERTA
         */

        const offer =
            await peerConnection.createOffer(
                {
                    offerToReceiveAudio:true,
                    offerToReceiveVideo:true
                }
            );


        /*
         * GUARDAR LOCAL
         */

        await peerConnection.setLocalDescription(
            offer
        );


        /*
         * AHORA GUARDAMOS LA OFERTA.
         *
         * EL RECEPTOR NO PODRÁ ACEPTAR
         * SIN ESPERAR ESTA OFERTA.
         */

        await updateDoc(
            doc(
                db,
                "llamadas",
                currentCallId
            ),
            {

                offer:{

                    type:
                        offer.type,

                    sdp:
                        offer.sdp

                }

            }
        );


    }catch(error){

        console.error(error);


        alert(
            "No se pudo iniciar la videollamada:\n" +
            error.message
        );


        finalizarLlamadaLocal();

    }

}


/* =========================================================
   ESCUCHAR LLAMADAS ENTRANTES
========================================================= */

function iniciarEscuchaLlamadas(){

    if(unsubscribeIncoming){

        unsubscribeIncoming();

    }


    const q =
        query(
            collection(
                db,
                "llamadas"
            ),
            where(
                "calleeId",
                "==",
                usuarioActual.uid
            )
        );


    unsubscribeIncoming =
        onSnapshot(
            q,
            async snapshot => {

                for(
                    const cambio
                    of snapshot.docChanges()
                ){

                    if(
                        cambio.type !==
                        "added" &&
                        cambio.type !==
                        "modified"
                    ){

                        continue;

                    }


                    const data =
                        cambio.doc.data();


                    if(
                        data.status !==
                        "ringing"
                    ){

                        continue;

                    }


                    /*
                     * EVITAR MOSTRAR DOS VECES
                     */

                    if(
                        incomingCallData &&
                        incomingCallData.id ===
                        cambio.doc.id
                    ){

                        continue;

                    }


                    incomingCallData = {

                        id:
                            cambio.doc.id,

                        ...data

                    };


                    const perfil =
                        await obtenerPerfil(
                            data.callerId
                        );


                    incomingAvatar.src =
                        fotoPerfil(
                            perfil
                        ) ||
                        fotoPredeterminada();


                    incomingName.textContent =
                        nombrePerfil(
                            perfil
                        );


                    incoming.classList.add(
                        "visible"
                    );


                    if(
                        navigator.vibrate
                    ){

                        try{

                            navigator.vibrate(
                                [
                                    300,
                                    150,
                                    300
                                ]
                            );

                        }catch(error){}

                    }

                }

            },
            error => {

                console.error(
                    "❌ Error escuchando llamadas:",
                    error
                );

            }
        );

}


/* =========================================================
   ESPERAR OFFER
========================================================= */

async function esperarOferta(
    callId,
    tiempoMaximo = 15000
){

    const inicio =
        Date.now();


    while(
        Date.now() - inicio <
        tiempoMaximo
    ){

        try{

            const snap =
                await getDoc(
                    doc(
                        db,
                        "llamadas",
                        callId
                    )
                );


            if(snap.exists()){

                const data =
                    snap.data();


                if(
                    data.offer &&
                    data.offer.sdp &&
                    data.offer.type
                ){

                    return data;

                }


                if(
                    data.status ===
                    "ended" ||
                    data.status ===
                    "rejected"
                ){

                    return null;

                }

            }

        }catch(error){

            console.warn(
                "Esperando oferta:",
                error
            );

        }


        await new Promise(
            resolve =>
                setTimeout(
                    resolve,
                    400
                )
        );

    }


    return null;

}


/* =========================================================
   ACEPTAR LLAMADA
========================================================= */

btnAccept.addEventListener(
    "click",
    aceptarLlamada
);


async function aceptarLlamada(){

    if(!incomingCallData){

        return;

    }


    const llamada =
        {
            ...incomingCallData
        };


    incoming.classList.remove(
        "visible"
    );


    incomingCallData =
        null;


    waitingCall.classList.add(
        "visible"
    );


    try{

        /*
         * BUSCAR CONTACTO
         */

        contactoSeleccionado =
            contactos.find(
                c =>
                    c.uid ===
                    llamada.callerId
            );


        if(!contactoSeleccionado){

            contactoSeleccionado = {

                uid:
                    llamada.callerId,

                perfil:
                    await obtenerPerfil(
                        llamada.callerId
                    )

            };

        }


        /*
         * ESPERAR OFERTA.
         *
         * ESTA ES LA CORRECCIÓN
         * PRINCIPAL DEL ERROR.
         */

        const datosActualizados =
            await esperarOferta(
                llamada.id,
                15000
            );


        if(
            !datosActualizados ||
            !datosActualizados.offer
        ){

            throw new Error(
                "No se recibió la oferta WebRTC del llamante."
            );

        }


        currentCallId =
            llamada.id;


        await prepararCamara();


        crearPeer();


        mostrarLlamada(
            "Conectando con " +
            nombrePerfil(
                contactoSeleccionado.perfil
            )
        );


        /*
         * ICE CALLEE
         */

        peerConnection.onicecandidate =
            async evento => {

                if(
                    !evento.candidate ||
                    !currentCallId
                ){

                    return;

                }


                try{

                    await addDoc(
                        collection(
                            db,
                            "llamadas",
                            currentCallId,
                            "calleeCandidates"
                        ),
                        evento.candidate.toJSON()
                    );

                }catch(error){

                    console.warn(
                        "ICE callee:",
                        error
                    );

                }

            };


        escucharEstadoLlamada(
            currentCallId
        );


        escucharICE(
            currentCallId,
            "callerCandidates"
        );


        /*
         * REMOTE OFFER
         */

        await peerConnection.setRemoteDescription(
            new RTCSessionDescription(
                datosActualizados.offer
            )
        );


        remoteDescriptionReady =
            true;


        await agregarCandidatosPendientes();


        /*
         * CREAR ANSWER
         */

        const answer =
            await peerConnection.createAnswer(
                {
                    offerToReceiveAudio:true,
                    offerToReceiveVideo:true
                }
            );


        await peerConnection.setLocalDescription(
            answer
        );


        /*
         * GUARDAR ANSWER
         */

        await updateDoc(
            doc(
                db,
                "llamadas",
                currentCallId
            ),
            {

                answer:{

                    type:
                        answer.type,

                    sdp:
                        answer.sdp

                },

                status:
                    "accepted"

            }
        );


    }catch(error){

        console.error(
            "Aceptar llamada:",
            error
        );


        alert(
            "No se pudo conectar la llamada:\n" +
            error.message
        );


        finalizarLlamadaLocal();

    }finally{

        waitingCall.classList.remove(
            "visible"
        );

    }

}


/* =========================================================
   RECHAZAR
========================================================= */

btnReject.addEventListener(
    "click",
    async () => {

        if(!incomingCallData){

            return;

        }


        const id =
            incomingCallData.id;


        incoming.classList.remove(
            "visible"
        );


        incomingCallData =
            null;


        try{

            await updateDoc(
                doc(
                    db,
                    "llamadas",
                    id
                ),
                {
                    status:
                        "rejected"
                }
            );

        }catch(error){

            console.error(
                "Rechazo:",
                error
            );

        }

    }
);


/* =========================================================
   MOSTRAR LLAMADA
========================================================= */

function mostrarLlamada(
    texto
){

    callInfo.textContent =
        texto;


    callOverlay.classList.add(
        "visible"
    );

}


/* =========================================================
   FINALIZAR LLAMADA
========================================================= */

btnEndCall.addEventListener(
    "click",
    finalizarLlamada
);


async function finalizarLlamada(){

    if(currentCallId){

        try{

            await updateDoc(
                doc(
                    db,
                    "llamadas",
                    currentCallId
                ),
                {
                    status:
                        "ended"
                }
            );

        }catch(error){

            console.warn(
                "Finalizar llamada:",
                error
            );

        }

    }


    finalizarLlamadaLocal();

}


function finalizarLlamadaLocal(){

    if(unsubscribeCall){

        unsubscribeCall();

        unsubscribeCall =
            null;

    }


    if(unsubscribeRemoteIce){

        unsubscribeRemoteIce();

        unsubscribeRemoteIce =
            null;

    }


    if(peerConnection){

        try{

            peerConnection.onicecandidate =
                null;

            peerConnection.ontrack =
                null;

            peerConnection.close();

        }catch(error){}

        peerConnection =
            null;

    }


    if(localStream){

        localStream
            .getTracks()
            .forEach(
                track =>
                    track.stop()
            );

        localStream =
            null;

    }


    localVideo.srcObject =
        null;


    remoteVideo.srcObject =
        null;


    currentCallId =
        null;


    pendingRemoteCandidates =
        [];


    remoteDescriptionReady =
        false;


    muted =
        false;


    cameraOff =
        false;


    btnMute.textContent =
        "🎙️";


    btnCamera.textContent =
        "📷";


    callOverlay.classList.remove(
        "visible"
    );


    waitingCall.classList.remove(
        "visible"
    );

}


/* =========================================================
   MICRÓFONO
========================================================= */

btnMute.addEventListener(
    "click",
    () => {

        if(!localStream){
            return;
        }


        muted =
            !muted;


        localStream
            .getAudioTracks()
            .forEach(
                track =>
                    track.enabled =
                        !muted
            );


        btnMute.textContent =
            muted
            ? "🔇"
            : "🎙️";

    }
);


/* =========================================================
   CÁMARA
========================================================= */

btnCamera.addEventListener(
    "click",
    () => {

        if(!localStream){
            return;
        }


        cameraOff =
            !cameraOff;


        localStream
            .getVideoTracks()
            .forEach(
                track =>
                    track.enabled =
                        !cameraOff
            );


        btnCamera.textContent =
            cameraOff
            ? "🚫"
            : "📷";

    }
);


/* =========================================================
   SALIDA
========================================================= */

window.addEventListener(
    "pagehide",
    () => {

        if(!usuarioActual){
            return;
        }


        try{

            setDoc(
                doc(
                    db,
                    "usuariosRed",
                    usuarioActual.uid
                ),
                {

                    enLinea:false,

                    ultimaConexion:
                        serverTimestamp()

                },
                {
                    merge:true
                }
            );

        }catch(error){}

    }
);
