<!DOCTYPE html>
<html lang="es-AR">

<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="theme-color" content="#111827">
<meta name="description" content="Mensajes de Red GESBASE. Comunicate con tus conexiones profesionales.">
<title>Mensajes - Red GESBASE</title>

<style>
*{box-sizing:border-box}

html,body{
    margin:0;
    padding:0;
    width:100%;
    min-height:100%;
    font-family:Arial,Helvetica,sans-serif;
    background:#f3f4f6;
    color:#111827;
}

body{min-height:100vh}

.header{
    position:sticky;
    top:0;
    z-index:100;
    background:#111827;
    color:white;
    min-height:64px;
    padding:10px 14px;
    display:flex;
    align-items:center;
    gap:10px;
    box-shadow:0 2px 10px rgba(0,0,0,.15);
}

.back-btn{
    border:0;
    background:transparent;
    color:white;
    font-size:25px;
    cursor:pointer;
    padding:6px;
}

.contact-header{
    display:none;
    align-items:center;
    gap:10px;
    flex:1;
    min-width:0;
    cursor:pointer;
}

.contact-header.visible{display:flex}

.header-avatar{
    width:44px;
    height:44px;
    min-width:44px;
    border-radius:50%;
    object-fit:cover;
    background:#374151;
    border:2px solid rgba(255,255,255,.35);
}

.header-info{min-width:0}

.header-name{
    font-weight:bold;
    font-size:16px;
    white-space:nowrap;
    overflow:hidden;
    text-overflow:ellipsis;
}

.header-status{
    font-size:12px;
    opacity:.85;
    margin-top:2px;
}

.header-actions{
    margin-left:auto;
    display:none;
    gap:6px;
}

.header-actions.visible{display:flex}

.header-action{
    width:42px;
    height:42px;
    border:0;
    border-radius:50%;
    background:#1f2937;
    color:white;
    font-size:20px;
    cursor:pointer;
}

.page{
    width:100%;
    max-width:1100px;
    margin:0 auto;
    padding:16px;
}

.contacts-panel{
    background:white;
    border-radius:18px;
    box-shadow:0 2px 12px rgba(0,0,0,.08);
    overflow:hidden;
}

.contacts-title{
    padding:18px;
    border-bottom:1px solid #e5e7eb;
}

.contacts-title h1{
    margin:0;
    font-size:23px;
}

.contacts-title p{
    margin:6px 0 0;
    color:#6b7280;
    font-size:14px;
}

.contact-list{
    display:flex;
    flex-direction:column;
}

.contact-item{
    width:100%;
    border:0;
    border-bottom:1px solid #e5e7eb;
    background:white;
    padding:13px 15px;
    display:flex;
    align-items:center;
    gap:12px;
    cursor:pointer;
    text-align:left;
}

.contact-item:hover{background:#f9fafb}

.contact-avatar-wrap{
    position:relative;
    flex:none;
}

.contact-avatar{
    width:55px;
    height:55px;
    border-radius:50%;
    object-fit:cover;
    background:#e5e7eb;
}

.online-dot{
    position:absolute;
    right:1px;
    bottom:1px;
    width:14px;
    height:14px;
    border-radius:50%;
    background:#9ca3af;
    border:3px solid white;
}

.online-dot.online{background:#22c55e}

.contact-data{
    min-width:0;
    flex:1;
}

.contact-name{
    font-weight:bold;
    font-size:16px;
    white-space:nowrap;
    overflow:hidden;
    text-overflow:ellipsis;
}

.contact-type{
    color:#6b7280;
    font-size:13px;
    margin-top:3px;
    white-space:nowrap;
    overflow:hidden;
    text-overflow:ellipsis;
}

.contact-last{
    color:#9ca3af;
    font-size:12px;
    margin-top:4px;
}

.contact-right{
    display:flex;
    align-items:center;
    gap:8px;
}

.unread-badge{
    min-width:23px;
    height:23px;
    border-radius:50%;
    background:#2563eb;
    color:white;
    display:none;
    align-items:center;
    justify-content:center;
    font-size:11px;
    font-weight:bold;
    padding:0 6px;
}

.unread-badge.visible{display:flex}

.chat-panel{
    display:none;
    height:calc(100vh - 80px);
    min-height:500px;
    background:white;
    border-radius:18px;
    box-shadow:0 2px 12px rgba(0,0,0,.08);
    overflow:hidden;
    position:relative;
}

.chat-panel.visible{
    display:flex;
    flex-direction:column;
}

.messages{
    flex:1;
    overflow-y:auto;
    padding:18px 14px 95px;
    background:#f9fafb;
}

.empty-chat{
    height:100%;
    display:flex;
    align-items:center;
    justify-content:center;
    text-align:center;
    color:#6b7280;
    padding:30px;
}

.message-row{
    display:flex;
    margin:7px 0;
}

.message-row.mine{justify-content:flex-end}
.message-row.theirs{justify-content:flex-start}

.message-bubble{
    max-width:min(78%,620px);
    border-radius:17px;
    padding:9px 12px;
    box-shadow:0 1px 3px rgba(0,0,0,.08);
    word-wrap:break-word;
}

.mine .message-bubble{
    background:#2563eb;
    color:white;
    border-bottom-right-radius:5px;
}

.theirs .message-bubble{
    background:white;
    color:#111827;
    border-bottom-left-radius:5px;
}

.message-text{
    white-space:pre-wrap;
    font-size:15px;
    line-height:1.35;
}

.message-time{
    font-size:10px;
    opacity:.7;
    margin-top:4px;
    text-align:right;
}

.media-image{
    display:block;
    max-width:100%;
    max-height:330px;
    border-radius:12px;
    object-fit:cover;
    cursor:pointer;
}

.media-video{
    display:block;
    width:100%;
    max-width:430px;
    max-height:330px;
    border-radius:12px;
    background:#000;
}

.composer{
    position:absolute;
    left:0;
    right:0;
    bottom:0;
    background:white;
    border-top:1px solid #e5e7eb;
    padding:9px;
    display:flex;
    align-items:center;
    gap:7px;
}

.media-btn{
    width:43px;
    height:43px;
    flex:none;
    border:0;
    border-radius:50%;
    background:#eef2ff;
    color:#2563eb;
    font-size:20px;
    cursor:pointer;
}

#mensaje{
    flex:1;
    min-width:0;
    border:1px solid #d1d5db;
    border-radius:22px;
    padding:11px 14px;
    outline:none;
    font-size:15px;
    resize:none;
    min-height:43px;
    max-height:110px;
    font-family:inherit;
}

.send-btn{
    width:43px;
    height:43px;
    flex:none;
    border:0;
    border-radius:50%;
    background:#2563eb;
    color:white;
    font-size:19px;
    cursor:pointer;
}

.loading{
    padding:30px;
    text-align:center;
    color:#6b7280;
}

.no-contacts{
    padding:35px 20px;
    text-align:center;
    color:#6b7280;
}

.error-box{
    margin:15px;
    padding:14px;
    border-radius:12px;
    background:#fef2f2;
    color:#991b1b;
    font-size:14px;
}

/* LLAMADA */

.call-overlay{
    position:fixed;
    inset:0;
    z-index:1000;
    background:rgba(0,0,0,.82);
    display:none;
    align-items:center;
    justify-content:center;
    padding:15px;
}

.call-overlay.visible{display:flex}

.call-box{
    width:100%;
    max-width:900px;
    height:min(760px,92vh);
    background:#111827;
    border-radius:20px;
    overflow:hidden;
    position:relative;
}

.remote-video{
    width:100%;
    height:100%;
    object-fit:cover;
    background:#030712;
}

.local-video{
    position:absolute;
    right:15px;
    top:15px;
    width:150px;
    height:205px;
    object-fit:cover;
    background:#000;
    border-radius:14px;
    border:2px solid white;
    z-index:4;
}

.call-info{
    position:absolute;
    left:15px;
    top:15px;
    color:white;
    background:rgba(0,0,0,.5);
    padding:8px 12px;
    border-radius:12px;
    z-index:5;
}

.call-controls{
    position:absolute;
    bottom:20px;
    left:0;
    right:0;
    display:flex;
    justify-content:center;
    gap:15px;
    z-index:5;
}

.call-control{
    width:58px;
    height:58px;
    border:0;
    border-radius:50%;
    background:#374151;
    color:white;
    font-size:23px;
    cursor:pointer;
}

.call-control.end{background:#dc2626}

.incoming-call{
    position:fixed;
    left:50%;
    top:50%;
    transform:translate(-50%,-50%);
    z-index:1100;
    width:min(90%,390px);
    background:white;
    border-radius:20px;
    padding:25px;
    box-shadow:0 15px 60px rgba(0,0,0,.35);
    display:none;
    text-align:center;
}

.incoming-call.visible{display:block}

.incoming-avatar{
    width:80px;
    height:80px;
    border-radius:50%;
    object-fit:cover;
    margin-bottom:12px;
}

.incoming-name{
    font-size:20px;
    font-weight:bold;
}

.incoming-text{
    color:#6b7280;
    margin:7px 0 20px;
}

.incoming-actions{
    display:flex;
    gap:10px;
}

.incoming-actions button{
    flex:1;
    border:0;
    border-radius:12px;
    padding:13px;
    font-weight:bold;
    cursor:pointer;
}

.reject-call{
    background:#fee2e2;
    color:#991b1b;
}

.accept-call{
    background:#dcfce7;
    color:#166534;
}

@media(min-width:700px){
    .page{padding:22px}
    .contacts-panel{max-width:750px;margin:0 auto}
    .chat-panel{height:calc(100vh - 105px)}
}

@media(min-width:1000px){
    .page{max-width:1150px}
    .contacts-panel{max-width:850px}
}

@media(max-width:600px){
    .page{padding:8px}

    .contacts-panel,
    .chat-panel{
        border-radius:0;
    }

    .chat-panel{
        height:calc(100vh - 64px);
        min-height:0;
    }

    .message-bubble{
        max-width:85%;
    }

    .local-video{
        width:105px;
        height:145px;
    }
}
</style>
</head>

<body>

<script type="module">

/* =========================================================
   FIREBASE
========================================================= */

import {
    auth,
    db,
    almacenamiento
} from "./Js/firebase.js";

import {
    onAuthStateChanged
} from "https://www.gstatic.com/firebasejs/12.18.0/firebase-auth.js";

import {
    collection,
    query,
    where,
    getDocs,
    getDoc,
    doc,
    addDoc,
    updateDoc,
    setDoc,
    onSnapshot,
    serverTimestamp
} from "https://www.gstatic.com/firebasejs/12.18.0/firebase-firestore.js";

import {
    ref,
    uploadBytes,
    getDownloadURL
} from "https://www.gstatic.com/firebasejs/12.18.0/firebase-storage.js";


/* =========================================================
   ELEMENTOS
========================================================= */

const contactsPanel =
    document.getElementById("contactsPanel");

const contactList =
    document.getElementById("contactList");

const chatPanel =
    document.getElementById("chatPanel");

const messages =
    document.getElementById("messages");

const mensaje =
    document.getElementById("mensaje");

const btnEnviar =
    document.getElementById("btnEnviar");

const btnMedia =
    document.getElementById("btnMedia");

const fileMedia =
    document.getElementById("fileMedia");

const contactHeader =
    document.getElementById("contactHeader");

const headerAvatar =
    document.getElementById("headerAvatar");

const headerName =
    document.getElementById("headerName");

const headerStatus =
    document.getElementById("headerStatus");

const headerActions =
    document.getElementById("headerActions");

const btnVideoCall =
    document.getElementById("btnVideoCall");

const btnVolver =
    document.getElementById("btnVolver");

const callOverlay =
    document.getElementById("callOverlay");

const remoteVideo =
    document.getElementById("remoteVideo");

const localVideo =
    document.getElementById("localVideo");

const callInfo =
    document.getElementById("callInfo");

const btnMute =
    document.getElementById("btnMute");

const btnCamera =
    document.getElementById("btnCamera");

const btnEndCall =
    document.getElementById("btnEndCall");

const incomingCall =
    document.getElementById("incomingCall");

const incomingAvatar =
    document.getElementById("incomingAvatar");

const incomingName =
    document.getElementById("incomingName");

const btnRejectCall =
    document.getElementById("btnRejectCall");

const btnAcceptCall =
    document.getElementById("btnAcceptCall");


/* =========================================================
   VARIABLES
========================================================= */

let usuarioActual = null;

let contactos = [];

let contactoSeleccionado = null;

let unsubscribeMensajes = null;
let unsubscribeUnread = null;
let unsubscribeIncomingCalls = null;
let unsubscribeCurrentCall = null;
let unsubscribeRemoteCandidates = null;

let peerConnection = null;
let localStream = null;

let currentCallId = null;
let incomingCallData = null;

let isMuted = false;
let isCameraOff = false;

const params =
    new URLSearchParams(window.location.search);

const uidSolicitado =
    params.get("usuario");


/* =========================================================
   UTILIDADES
========================================================= */

function escapeHtml(texto){

    return String(texto ?? "")
        .replace(/&/g,"&amp;")
        .replace(/</g,"&lt;")
        .replace(/>/g,"&gt;")
        .replace(/"/g,"&quot;")
        .replace(/'/g,"&#039;");

}


function nombrePerfil(perfil){

    if(!perfil){
        return "Usuario";
    }

    return (
        perfil.nombreCompleto ||
        perfil.nombre ||
        [
            perfil.nombre,
            perfil.apellido
        ].filter(Boolean).join(" ") ||
        perfil.empresa ||
        "Usuario"
    );

}


function tipoPerfil(perfil){

    if(!perfil){
        return "Usuario de Red GESBASE";
    }

    return (
        perfil.rubro ||
        perfil.tipo ||
        perfil.categoria ||
        perfil.profesion ||
        "Usuario de Red GESBASE"
    );

}


function fotoPerfil(perfil){

    if(!perfil){
        return "";
    }

    return (
        perfil.fotoURL ||
        perfil.foto ||
        perfil.avatar ||
        perfil.imagen ||
        ""
    );

}


function estaActivo(perfil){

    if(!perfil){
        return false;
    }

    if(perfil.enLinea === true){
        return true;
    }

    let fecha = null;

    if(
        perfil.ultimaConexion &&
        typeof perfil.ultimaConexion.toMillis === "function"
    ){
        fecha =
            perfil.ultimaConexion.toMillis();
    }

    if(
        perfil.ultimaConexion &&
        typeof perfil.ultimaConexion === "number"
    ){
        fecha =
            perfil.ultimaConexion;
    }

    if(!fecha){
        return false;
    }

    return Date.now() - fecha < 90000;

}


function mostrarImagenPredeterminada(){

    return "data:image/svg+xml;charset=UTF-8," +
        encodeURIComponent(
            `<svg xmlns="http://www.w3.org/2000/svg" width="100" height="100">
                <rect width="100" height="100" fill="#e5e7eb"/>
                <text x="50" y="56" text-anchor="middle"
                      font-size="42" fill="#6b7280">👤</text>
            </svg>`
        );

}


function formatearHora(data){

    let fecha = null;

    if(
        data.fecha &&
        typeof data.fecha.toDate === "function"
    ){
        fecha =
            data.fecha.toDate();
    }

    if(
        !fecha &&
        data.fechaCliente
    ){
        fecha =
            new Date(data.fechaCliente);
    }

    if(!fecha){
        return "";
    }

    return fecha.toLocaleTimeString(
        "es-AR",
        {
            hour:"2-digit",
            minute:"2-digit"
        }
    );

}


/* =========================================================
   AUTENTICACIÓN
========================================================= */

onAuthStateChanged(
    auth,
    async usuario => {

        if(!usuario){

            window.location.href =
                "login.html";

            return;

        }


        usuarioActual =
            usuario;


        /*
         * MUY IMPORTANTE:
         * Las llamadas se escuchan inmediatamente.
         * No dependen de la lista de contactos.
         */

        iniciarEscuchaLlamadasEntrantes();

        iniciarEscuchaNoLeidos();


        await actualizarPresencia();


        setInterval(
            actualizarPresencia,
            30000
        );


        await cargarContactos();


        if(uidSolicitado){

            const contacto =
                contactos.find(
                    c =>
                        c.uid ===
                        uidSolicitado
                );


            if(contacto){

                await seleccionarContacto(
                    contacto
                );

            }

        }

    }
);


/* =========================================================
   PRESENCIA
========================================================= */

async function actualizarPresencia(){

    if(!usuarioActual){
        return;
    }

    try{

        await setDoc(
            doc(
                db,
                "usuariosRed",
                usuarioActual.uid
            ),
            {
                enLinea:true,
                ultimaConexion:
                    serverTimestamp()
            },
            {
                merge:true
            }
        );

    }catch(error){

        console.warn(
            "No se pudo actualizar presencia:",
            error
        );

    }

}


/* =========================================================
   PERFIL
========================================================= */

async function obtenerPerfil(uid){

    try{

        const snap =
            await getDoc(
                doc(
                    db,
                    "directorio_red",
                    uid
                )
            );

        if(snap.exists()){

            return {
                uid,
                ...snap.data()
            };

        }

    }catch(error){

        console.warn(
            "Error directorio_red:",
            error
        );

    }


    try{

        const snap =
            await getDoc(
                doc(
                    db,
                    "usuariosRed",
                    uid
                )
            );

        if(snap.exists()){

            return {
                uid,
                ...snap.data()
            };

        }

    }catch(error){

        console.warn(
            "Error usuariosRed:",
            error
        );

    }


    return {
        uid,
        nombre:"Usuario"
    };

}


/* =========================================================
   CONTACTOS
========================================================= */

async function cargarContactos(){

    contactList.innerHTML =
        `<div class="loading">
            Cargando contactos...
        </div>`;


    try{

        const enviados =
            await getDocs(
                query(
                    collection(
                        db,
                        "conexiones"
                    ),
                    where(
                        "emisor",
                        "==",
                        usuarioActual.uid
                    )
                )
            );


        const recibidos =
            await getDocs(
                query(
                    collection(
                        db,
                        "conexiones"
                    ),
                    where(
                        "receptor",
                        "==",
                        usuarioActual.uid
                    )
                )
            );


        const ids =
            new Set();


        enviados.forEach(
            snap => {

                const data =
                    snap.data();

                if(
                    (
                        data.estado ===
                        "aceptada"
                    ) ||
                    (
                        data.estado ===
                        "aceptado"
                    )
                ){

                    if(data.receptor){

                        ids.add(
                            data.receptor
                        );

                    }

                }

            }
        );


        recibidos.forEach(
            snap => {

                const data =
                    snap.data();

                if(
                    (
                        data.estado ===
                        "aceptada"
                    ) ||
                    (
                        data.estado ===
                        "aceptado"
                    )
                ){

                    if(data.emisor){

                        ids.add(
                            data.emisor
                        );

                    }

                }

            }
        );


        contactos = [];


        for(
            const uid
            of ids
        ){

            contactos.push({

                uid,

                perfil:
                    await obtenerPerfil(uid)

            });

        }


        contactos.sort(
            (a,b) =>
                nombrePerfil(
                    a.perfil
                ).localeCompare(
                    nombrePerfil(
                        b.perfil
                    ),
                    "es"
                )
        );


        renderizarContactos();

    }catch(error){

        console.error(error);

        contactList.innerHTML =
            `<div class="error-box">
                No se pudieron cargar tus contactos.<br><br>
                ${escapeHtml(error.message)}
            </div>`;

    }

}


/* =========================================================
   CONTACTOS + NO LEÍDOS
========================================================= */

let unreadByUser =
    new Map();


function iniciarEscuchaNoLeidos(){

    if(unsubscribeUnread){

        unsubscribeUnread();

    }


    const q =
        query(
            collection(
                db,
                "mensajes"
            ),
            where(
                "receptorUid",
                "==",
                usuarioActual.uid
            )
        );


    unsubscribeUnread =
        onSnapshot(
            q,
            snapshot => {

                unreadByUser =
                    new Map();


                snapshot.forEach(
                    snap => {

                        const data =
                            snap.data();


                        if(
                            data.leido === false &&
                            data.emisorUid
                        ){

                            unreadByUser.set(
                                data.emisorUid,
                                (
                                    unreadByUser.get(
                                        data.emisorUid
                                    ) || 0
                                ) + 1
                            );

                        }

                    }
                );


                renderizarContactos();

            }
        );

}

async function cargarMensajes(){

    if(!contactoSeleccionado){
        return;
    }


    messages.innerHTML =
        `<div class="loading">
            Cargando conversación...
        </div>`;


    try{

        /*
         * Solo usamos consultas de un campo.
         * Esto evita depender de índices compuestos.
         */

        const enviados =
            await getDocs(
                query(
                    collection(
                        db,
                        "mensajes"
                    ),
                    where(
                        "emisorUid",
                        "==",
                        usuarioActual.uid
                    )
                )
            );


        const recibidos =
            await getDocs(
                query(
                    collection(
                        db,
                        "mensajes"
                    ),
                    where(
                        "receptorUid",
                        "==",
                        usuarioActual.uid
                    )
                )
            );


        const lista = [];


        enviados.forEach(
            snap => {

                const data =
                    snap.data();

                if(
                    data.receptorUid ===
                    contactoSeleccionado.uid
                ){

                    lista.push({
                        id:snap.id,
                        ...data
                    });

                }

            }
        );


        recibidos.forEach(
            snap => {

                const data =
                    snap.data();

                if(
                    data.emisorUid ===
                    contactoSeleccionado.uid
                ){

                    lista.push({
                        id:snap.id,
                        ...data
                    });

                }

            }
        );


        lista.sort(
            (a,b) =>
                (
                    a.fechaCliente || 0
                ) -
                (
                    b.fechaCliente || 0
                )
        );


        renderizarMensajes(
            lista
        );

    }catch(error){

        console.error(error);

        messages.innerHTML =
            `<div class="error-box">
                No se pudieron cargar los mensajes.<br><br>
                ${escapeHtml(error.message)}
            </div>`;

    }

}


/* =========================================================
   RENDER MENSAJES
========================================================= */

function renderizarMensajes(
    lista
){

    if(!lista.length){

        messages.innerHTML =
            `<div class="empty-chat">
                Todavía no hay mensajes.<br>
                ¡Comenzá la conversación!
            </div>`;

        return;

    }


    messages.innerHTML = "";


    lista.forEach(
        data => {

            const mio =
                data.emisorUid ===
                usuarioActual.uid;


            const row =
                document.createElement(
                    "div"
                );


            row.className =
                "message-row " +
                (
                    mio
                    ? "mine"
                    : "theirs"
                );


            const bubble =
                document.createElement(
                    "div"
                );


            bubble.className =
                "message-bubble";


            if(
                data.tipo === "imagen" &&
                data.mediaUrl
            ){

                const img =
                    document.createElement(
                        "img"
                    );


                img.className =
                    "media-image";


                img.src =
                    data.mediaUrl;


                img.alt =
                    data.mediaNombre ||
                    "Imagen";


                img.addEventListener(
                    "click",
                    () =>
                        window.open(
                            data.mediaUrl,
                            "_blank"
                        )
                );


                bubble.appendChild(
                    img
                );

            }else if(
                data.tipo === "video" &&
                data.mediaUrl
            ){

                const video =
                    document.createElement(
                        "video"
                    );


                video.className =
                    "media-video";


                video.src =
                    data.mediaUrl;


                video.controls =
                    true;


                video.playsInline =
                    true;


                bubble.appendChild(
                    video
                );

            }else{

                const text =
                    document.createElement(
                        "div"
                    );


                text.className =
                    "message-text";


                text.textContent =
                    data.contenido || "";


                bubble.appendChild(
                    text
                );

            }


            const time =
                document.createElement(
                    "div"
                );


            time.className =
                "message-time";


            time.textContent =
                formatearHora(
                    data
                );


            bubble.appendChild(
                time
            );


            row.appendChild(
                bubble
            );


            messages.appendChild(
                row
            );

        }
    );


    requestAnimationFrame(
        () => {

            messages.scrollTop =
                messages.scrollHeight;

        }
    );

}

        mensaje.value.trim();

        true;


    try{

        await addDoc(
            collection(
                db,
                "mensajes"
            ),
            {
                emisorUid:
                    usuarioActual.uid,

                receptorUid:
                    contactoSeleccionado.uid,

                    "texto",

                fecha:
                    serverTimestamp(),

                fechaCliente:

            }

========================================================= */

async function marcarMensajesComoLeidos(){

    if(
        !usuarioActual ||
        !contactoSeleccionado
    ){
        return;
    }


    try{

        const q =
            query(
                collection(
                    db,
                    "mensajes"
                ),
                where(
                    "receptorUid",
                    "==",
                    usuarioActual.uid
                )
            );


        const snapshot =
            await getDocs(q);


        const cambios = [];


        snapshot.forEach(
            snap => {

                const data =
                    snap.data();


                if(
                    data.emisorUid ===
                    contactoSeleccionado.uid &&
                    data.leido === false
                ){

                    cambios.push(
                        updateDoc(
                            doc(
                                db,
                                "mensajes",
                                snap.id
                            ),
                            {
                                leido:true
                            }
                        )
                    );

                }

            }
        );


        await Promise.all(
            cambios
        );

    }catch(error){

        console.warn(
            "No se pudieron marcar mensajes:",
            error
        );

    }

}

async function enviarArchivo(
    archivo
){

    const esImagen =
        archivo.type.startsWith(
            "image/"
        );


    const esVideo =
        archivo.type.startsWith(
            "video/"
        );


    if(
        !esImagen &&
        !esVideo
    ){

        alert(
            "Solo se pueden enviar imágenes o videos."
        );

        return;

    }


    const limite =
        esVideo
        ? 50 * 1024 * 1024
        : 10 * 1024 * 1024;


    if(
        archivo.size >
        limite
    ){

        alert(
            esVideo
            ? "El video no puede superar 50 MB."
            : "La imagen no puede superar 10 MB."
        );

        return;

    }


    if(!almacenamiento){

        alert(
            "Firebase Storage no está disponible."
        );

        return;

    }


    try{

        btnMedia.disabled =
            true;


        const extension =
            archivo.name.includes(".")
            ? archivo.name
                .split(".")
                .pop()
                .toLowerCase()
            : "bin";


        const nombreArchivo =
            Date.now() +
            "_" +
            Math.random()
                .toString(36)
                .slice(2) +
            "." +
            extension;


        const ruta =
            `mensajes-media/${usuarioActual.uid}/${nombreArchivo}`;


        const storageRef =
            ref(
                almacenamiento,
                ruta
            );


        await uploadBytes(
            storageRef,
            archivo,
            {
                contentType:
                    archivo.type
            }
        );


        const mediaUrl =
            await getDownloadURL(
                storageRef
            );


        await addDoc(
            collection(
                db,
                "mensajes"
            ),
            {
                emisorUid:
                    usuarioActual.uid,

                receptorUid:
                    contactoSeleccionado.uid,

                contenido:
                    "",

                tipo:
                    esImagen
                    ? "imagen"
                    : "video",

                mediaUrl,

                mediaNombre:
                    archivo.name,

                mediaTipo:
                    archivo.type,

                fecha:
                    serverTimestamp(),

                fechaCliente:
                    Date.now(),

                leido:
                    false
            }
        );


    }catch(error){

        console.error(error);

        alert(
            "No se pudo subir el archivo:\n" +
            error.message
        );

    }finally{

        btnMedia.disabled =
            false;

    }

}

const rtcConfig = {

    iceServers:[
        {
            urls:
                "stun:stun.l.google.com:19302"

};


/* =========================================================
   INICIAR VIDEOLLAMADA
========================================================= */

btnVideoCall.addEventListener(
    "click",
    iniciarVideollamada
);


async function iniciarVideollamada(){

    if(
        !usuarioActual ||
        !contactoSeleccionado
    ){
        return;
    }


    if(currentCallId){

        alert(
            "Ya tenés una llamada en curso."
        );

        return;

    }


    try{

        await prepararMediaLocal();


        crearPeerConnection();


        /*
         * Primero creamos la llamada.
         */
        const llamadaRef =
            await addDoc(
                collection(
                    db,
                    "llamadas"
                ),
                {
                    callerId:
                        usuarioActual.uid,

                    calleeId:
                        contactoSeleccionado.uid,

                    callerName:
                        usuarioActual.displayName ||
                        nombrePerfil(
                            contactoSeleccionado.perfil
                        ),

                    status:
                        "ringing",

                    fechaCliente:
                        Date.now(),

                    fecha:
                        serverTimestamp()
                }
            );


        currentCallId =
            llamadaRef.id;


        mostrarVentanaLlamada(
            "Llamando a " +
            nombrePerfil(
                contactoSeleccionado.perfil
            )
        );


        /*
         * ICE DEL LLAMANTE.
         * Se registra antes de crear la oferta.
         */
        peerConnection.onicecandidate =
            async evento => {

                if(
                    !evento.candidate ||
                    !currentCallId
                ){
                    return;
                }


                try{

                    await addDoc(
                        collection(
                            db,
                            "llamadas",
                            currentCallId,
                            "callerCandidates"
                        ),
                        evento.candidate.toJSON()
                    );

                }catch(error){

                    console.error(
                        "Error ICE caller:",
                        error
                    );

                }

            };


        /*
         * Escuchar respuesta.
         */
        escucharLlamadaActual(
            currentCallId
        );


        /*
         * Escuchar candidatos del receptor.
         */
        escucharCandidatosRemotos(
            currentCallId,
            "calleeCandidates"
        );


        const offer =
            await peerConnection.createOffer();


        await peerConnection.setLocalDescription(
            offer
        );


        await updateDoc(
            llamadaRef,
            {
                offer:{
                    type:
                        offer.type,

                    sdp:
                        offer.sdp
                }
            }
        );


    }catch(error){

        console.error(error);

        alert(
            "No se pudo iniciar la videollamada:\n" +
            error.message
        );


        finalizarLlamadaLocal();

    }

}


/* =========================================================
   MEDIA
========================================================= */

async function prepararMediaLocal(){

    if(
        !navigator.mediaDevices ||
        !navigator.mediaDevices.getUserMedia
    ){

        throw new Error(
            "Este navegador no permite usar cámara y micrófono."
        );

    }


    localStream =
        await navigator.mediaDevices.getUserMedia(
            {
                video:true,
                audio:true
            }
        );


    localVideo.srcObject =
        localStream;

}


/* =========================================================
   PEER
========================================================= */

function crearPeerConnection(){

    peerConnection =
        new RTCPeerConnection(
            rtcConfig
        );


    if(localStream){

        localStream
            .getTracks()
            .forEach(
                track => {

                    peerConnection.addTrack(
                        track,
                        localStream
                    );

                }
            );

    }


    peerConnection.ontrack =
        evento => {

            if(
                evento.streams &&
                evento.streams[0]
            ){

                remoteVideo.srcObject =
                    evento.streams[0];

            }

        };

}


/* =========================================================
   LLAMADA ACTUAL
========================================================= */

function escucharLlamadaActual(
    callId
){

    if(unsubscribeCurrentCall){

        unsubscribeCurrentCall();

    }


    unsubscribeCurrentCall =
        onSnapshot(
            doc(
                db,
                "llamadas",
                callId
            ),
            async snapshot => {

                if(!snapshot.exists()){

                    finalizarLlamadaLocal();

                    return;

                }


                const data =
                    snapshot.data();


                /*
                 * El caller recibe el answer.
                 */
                if(
                    data.answer &&
                    peerConnection &&
                    !peerConnection.currentRemoteDescription
                ){

                    try{

                        await peerConnection.setRemoteDescription(
                            new RTCSessionDescription(
                                data.answer
                            )
                        );

                    }catch(error){

                        console.warn(
                            "Error aplicando answer:",
                            error
                        );

                    }

                }


                if(
                    data.status ===
                    "ended"
                ){

                    finalizarLlamadaLocal();

                }


                if(
                    data.status ===
                    "rejected"
                ){

                    alert(
                        "La llamada fue rechazada."
                    );

                    finalizarLlamadaLocal();

                }

            },
            error => {

                console.error(
                    "Error escuchando llamada:",
                    error
                );

            }
        );

}


/* =========================================================
   CANDIDATOS
========================================================= */

function escucharCandidatosRemotos(
    callId,
    subcoleccion
){

    if(unsubscribeRemoteCandidates){

        unsubscribeRemoteCandidates();

    }


    unsubscribeRemoteCandidates =
        onSnapshot(
            collection(
                db,
                "llamadas",
                callId,
                subcoleccion
            ),
            snapshot => {

                snapshot.docChanges()
                    .forEach(
                        async cambio => {

                            if(
                                cambio.type !==
                                "added"
                            ){
                                return;
                            }


                            if(!peerConnection){
                                return;
                            }


                            try{

                                await peerConnection.addIceCandidate(
                                    new RTCIceCandidate(
                                        cambio.doc.data()
                                    )
                                );

                            }catch(error){

                                console.warn(
                                    "Error agregando ICE:",
                                    error
                                );

                            }

                        }
                    );

            },
            error => {

                console.warn(
                    "Error escuchando ICE:",
                    error
                );

            }
        );

}


/* =========================================================
   LLAMADAS ENTRANTES
========================================================= */

function iniciarEscuchaLlamadasEntrantes(){

    if(unsubscribeIncomingCalls){

        unsubscribeIncomingCalls();

    }


    if(!usuarioActual){

        return;

    }


    console.log(
        "📞 Escuchando llamadas para:",
        usuarioActual.uid
    );


    /*
     * IMPORTANTE:
     * Solo usamos calleeId.
     * El status se filtra localmente.
     */
    const q =
        query(
            collection(
                db,
                "llamadas"
            ),
            where(
                "calleeId",
                "==",
                usuarioActual.uid
            )
        );


    unsubscribeIncomingCalls =
        onSnapshot(
            q,
            async snapshot => {

                console.log(
                    "📞 Cambios de llamadas:",
                    snapshot.docChanges().length
                );


                for(
                    const cambio
                    of snapshot.docChanges()
                ){

                    if(
                        cambio.type !==
                        "added" &&
                        cambio.type !==
                        "modified"
                    ){

                        continue;

                    }


                    const data =
                        cambio.doc.data();


                    console.log(
                        "📞 Llamada detectada:",
                        cambio.doc.id,
                        data
                    );


                    if(
                        data.status !==
                        "ringing"
                    ){

                        continue;

                    }


                    if(
                        incomingCallData &&
                        incomingCallData.id ===
                        cambio.doc.id
                    ){

                        continue;

                    }


                    incomingCallData = {

                        id:
                            cambio.doc.id,

                        ...data

                    };


                    let perfil;


                    try{

                        perfil =
                            await obtenerPerfil(
                                data.callerId
                            );

                    }catch(error){

                        perfil = {

                            uid:
                                data.callerId,

                            nombre:
                                data.callerName ||
                                "Usuario"

                        };

                    }


                    incomingAvatar.src =
                        fotoPerfil(
                            perfil
                        ) ||
                        mostrarImagenPredeterminada();


                    incomingName.textContent =
                        nombrePerfil(
                            perfil
                        );


                    incomingCall.classList.add(
                        "visible"
                    );


                    if(
                        navigator.vibrate
                    ){

                        try{

                            navigator.vibrate(
                                [
                                    300,
                                    150,
                                    300,
                                    150,
                                    500
                                ]
                            );

                        }catch(error){}

                    }

                }

            },
            error => {

                console.error(
                    "❌ ERROR ESCUCHANDO LLAMADAS:",
                    error
                );

            }
        );

}


/* =========================================================
   ACEPTAR
========================================================= */

btnAcceptCall.addEventListener(
    "click",
    aceptarLlamada
);


async function aceptarLlamada(){

    if(!incomingCallData){
        return;
    }


    const llamada =
        incomingCallData;


    incomingCall.classList.remove(
        "visible"
    );


    incomingCallData =
        null;


    try{

        contactoSeleccionado =
            contactos.find(
                c =>
                    c.uid ===
                    llamada.callerId
            ) || {

                uid:
                    llamada.callerId,

                perfil:
                    await obtenerPerfil(
                        llamada.callerId
                    )

            };


        await prepararMediaLocal();


        crearPeerConnection();


        currentCallId =
            llamada.id;


        mostrarVentanaLlamada(
            "Videollamada con " +
            nombrePerfil(
                contactoSeleccionado.perfil
            )
        );


        /*
         * ICE DEL RECEPTOR.
         */
        peerConnection.onicecandidate =
            async evento => {

                if(
                    !evento.candidate ||
                    !currentCallId
                ){
                    return;
                }


                try{

                    await addDoc(
                        collection(
                            db,
                            "llamadas",
                            currentCallId,
                            "calleeCandidates"
                        ),
                        evento.candidate.toJSON()
                    );

                }catch(error){

                    console.error(
                        "Error ICE callee:",
                        error
                    );

                }

            };


        escucharLlamadaActual(
            currentCallId
        );


        escucharCandidatosRemotos(
            currentCallId,
            "callerCandidates"
        );


        if(
            llamada.offer
        ){

            await peerConnection.setRemoteDescription(
                new RTCSessionDescription(
                    llamada.offer
                )
            );

        }else{

            throw new Error(
                "La llamada todavía no tiene una oferta."
            );

        }


        const answer =
            await peerConnection.createAnswer();


        await peerConnection.setLocalDescription(
            answer
        );


        await updateDoc(
            doc(
                db,
                "llamadas",
                currentCallId
            ),
            {
                answer:{
                    type:
                        answer.type,

                    sdp:
                        answer.sdp
                },

                status:
                    "accepted"
            }
        );


    }catch(error){

        console.error(error);

        alert(
            "No se pudo aceptar la llamada:\n" +
            error.message
        );


        finalizarLlamadaLocal();

    }

}


/* =========================================================
   RECHAZAR
========================================================= */

btnRejectCall.addEventListener(
    "click",
    async () => {

        if(!incomingCallData){
            return;
        }


        const callId =
            incomingCallData.id;


        try{

            await updateDoc(
                doc(
                    db,
                    "llamadas",
                    callId
                ),
                {
                    status:
                        "rejected"
                }
            );

        }catch(error){

            console.warn(
                "No se pudo rechazar:",
                error
            );

        }


        incomingCall.classList.remove(
            "visible"
        );


        incomingCallData =
            null;

    }
);


/* =========================================================
   MOSTRAR LLAMADA
========================================================= */

function mostrarVentanaLlamada(
    texto
){

    callInfo.textContent =
        texto ||
        "Videollamada";


    callOverlay.classList.add(
        "visible"
    );

}


/* =========================================================
   FINALIZAR
========================================================= */

btnEndCall.addEventListener(
    "click",
    finalizarLlamada
);


async function finalizarLlamada(){

    if(currentCallId){

        try{

            await updateDoc(
                doc(
                    db,
                    "llamadas",
                    currentCallId
                ),
                {
                    status:
                        "ended"
                }
            );

        }catch(error){

            console.warn(
                "Error finalizando:",
                error
            );

        }

    }


    finalizarLlamadaLocal();

}


function finalizarLlamadaLocal(){

    if(unsubscribeCurrentCall){

        unsubscribeCurrentCall();

        unsubscribeCurrentCall =
            null;

    }


    if(unsubscribeRemoteCandidates){

        unsubscribeRemoteCandidates();

        unsubscribeRemoteCandidates =
            null;

    }


    if(peerConnection){

        try{

            peerConnection.close();

        }catch(error){}

        peerConnection =
            null;

    }


    if(localStream){

        localStream
            .getTracks()
            .forEach(
                track =>
                    track.stop()
            );

        localStream =
            null;

    }


    localVideo.srcObject =
        null;

    remoteVideo.srcObject =
        null;


    currentCallId =
        null;


    callOverlay.classList.remove(
        "visible"
    );


    isMuted =
        false;

    isCameraOff =
        false;


    btnMute.textContent =
        "🎙️";

    btnCamera.textContent =
        "📷";

}


/* =========================================================
   MICRÓFONO
========================================================= */

btnMute.addEventListener(
    "click",
    () => {

        if(!localStream){
            return;
        }


        isMuted =
            !isMuted;


        localStream
            .getAudioTracks()
            .forEach(
                track =>
                    track.enabled =
                        !isMuted
            );


        btnMute.textContent =
            isMuted
            ? "🔇"
            : "🎙️";

    }
);


/* =========================================================
   CÁMARA
========================================================= */

btnCamera.addEventListener(
    "click",
    () => {

        if(!localStream){
            return;
        }


        isCameraOff =
            !isCameraOff;


        localStream
            .getVideoTracks()
            .forEach(
                track =>
                    track.enabled =
                        !isCameraOff
            );


        btnCamera.textContent =
            isCameraOff
            ? "🚫"
            : "📷";

    }
);


/* =========================================================
   SALIDA
========================================================= */

window.addEventListener(
    "pagehide",
    () => {

        if(
            usuarioActual
        ){

            try{

                setDoc(
                    doc(
                        db,
                        "usuariosRed",
                        usuarioActual.uid
                    ),
                    {
                        enLinea:false,
                        ultimaConexion:
                            serverTimestamp()
                    },
                    {
                        merge:true
                    }
                );

            }catch(error){}

        }

    }
);

</script>
