<title>Mensajes - Red GESBASE</title>

<style>

*{
    box-sizing:border-box;
    margin:0;
    padding:0;
}

html,
body{
    width:100%;
    height:100%;
    font-family:Arial,Helvetica,sans-serif;
    background:#f3f4f6;
    color:#111827;
}

body{
    overflow:hidden;
}

button,
input,
textarea{
    font:inherit;
}

button{
    cursor:pointer;
}

.app{
    width:100%;
    height:100dvh;
    display:flex;
    flex-direction:column;
}

/* =========================
   HEADER
========================= */

.header{
    height:64px;
    min-height:64px;
    background:#111827;
    color:white;
    display:flex;
    align-items:center;
    padding:0 14px;
    gap:10px;
    box-shadow:0 2px 8px rgba(0,0,0,.15);
    z-index:10;
}

.back-btn{
    width:42px;
    height:42px;
    border:0;
    border-radius:50%;
    background:rgba(255,255,255,.1);
    color:white;
    font-size:22px;
}

.header-title{
    flex:1;
    min-width:0;
}

.header-title strong{
    display:block;
    font-size:16px;
    white-space:nowrap;
    overflow:hidden;
    text-overflow:ellipsis;
}

.header-title span{
    display:block;
    font-size:12px;
    color:#cbd5e1;
    margin-top:3px;
}

.header-actions{
    display:flex;
    gap:7px;
}

.icon-btn{
    width:42px;
    height:42px;
    border:0;
    border-radius:50%;
    background:rgba(255,255,255,.1);
    color:white;
    font-size:19px;
}

/* =========================
   MAIN
========================= */

.main{
    flex:1;
    min-height:0;
    display:flex;
}

/* =========================
   CONTACTOS
========================= */

.contacts{
    width:330px;
    min-width:280px;
    background:white;
    border-right:1px solid #e5e7eb;
    display:flex;
    flex-direction:column;
}

.contacts-header{
    padding:16px;
    border-bottom:1px solid #e5e7eb;
}

.contacts-header h2{
    font-size:18px;
    margin-bottom:10px;
}

.search-box{
    width:100%;
    border:1px solid #d1d5db;
    border-radius:12px;
    padding:11px 13px;
    outline:none;
    background:#f9fafb;
}

.search-box:focus{
    border-color:#2563eb;
    background:white;
}

.contacts-list{
    flex:1;
    overflow-y:auto;
}

.contact{
    width:100%;
    border:0;
    background:white;
    padding:12px 14px;
    display:flex;
    align-items:center;
    gap:11px;
    text-align:left;
    border-bottom:1px solid #f1f5f9;
}

.contact:hover{
    background:#f8fafc;
}

.contact.active{
    background:#eff6ff;
}

.avatar{
    width:46px;
    height:46px;
    min-width:46px;
    border-radius:50%;
    background:#1d4ed8;
    color:white;
    display:flex;
    align-items:center;
    justify-content:center;
    overflow:hidden;
    font-weight:bold;
}

.avatar img{
    width:100%;
    height:100%;
    object-fit:cover;
}

.contact-info{
    min-width:0;
    flex:1;
}

.contact-name{
    font-weight:bold;
    font-size:14px;
    white-space:nowrap;
    overflow:hidden;
    text-overflow:ellipsis;
}

.contact-type{
    color:#64748b;
    font-size:12px;
    margin-top:3px;
}

.online{
    color:#16a34a;
}

.unread{
    width:21px;
    height:21px;
    border-radius:50%;
    background:#2563eb;
    color:white;
    display:flex;
    align-items:center;
    justify-content:center;
    font-size:11px;
    font-weight:bold;
}

/* =========================
   CHAT
========================= */

.chat{
    flex:1;
    min-width:0;
    display:flex;
    flex-direction:column;
    background:#e5e7eb;
}

.empty-chat{
    flex:1;
    display:flex;
    align-items:center;
    justify-content:center;
    text-align:center;
    padding:30px;
    color:#64748b;
}

.empty-chat-icon{
    font-size:52px;
    margin-bottom:12px;
}

.messages{
    flex:1;
    overflow-y:auto;
    padding:18px;
    display:flex;
    flex-direction:column;
    gap:8px;
}

.message{
    max-width:min(75%,520px);
    padding:9px 12px;
    border-radius:15px;
    word-wrap:break-word;
    line-height:1.4;
    font-size:14px;
}

.message.mine{
    align-self:flex-end;
    background:#2563eb;
    color:white;
    border-bottom-right-radius:5px;
}

.message.theirs{
    align-self:flex-start;
    background:white;
    color:#111827;
    border-bottom-left-radius:5px;
}

.message-time{
    display:block;
    font-size:10px;
    opacity:.7;
    text-align:right;
    margin-top:4px;
}

.message-media{
    max-width:100%;
    max-height:300px;
    border-radius:10px;
    display:block;
}

.message-video{
    max-width:100%;
    max-height:300px;
    border-radius:10px;
    display:block;
}

/* =========================
   COMPOSER
========================= */

.composer{
    padding:10px;
    background:white;
    border-top:1px solid #d1d5db;
    display:flex;
    align-items:flex-end;
    gap:8px;
}

.attach-btn{
    width:42px;
    height:42px;
    min-width:42px;
    border:0;
    border-radius:50%;
    background:#e5e7eb;
}

.message-input{
    flex:1;
    min-height:42px;
    max-height:120px;
    resize:none;
    border:1px solid #d1d5db;
    border-radius:20px;
    padding:10px 14px;
    outline:none;
}

.message-input:focus{
    border-color:#2563eb;
}

.send-btn{
    width:42px;
    height:42px;
    min-width:42px;
    border:0;
    border-radius:50%;
    background:#2563eb;
    color:white;
    font-size:18px;
}

input[type="file"]{
    display:none;
}

/* =========================
   CALL OVERLAY
========================= */

.call-overlay{
    position:fixed;
    inset:0;
    background:rgba(15,23,42,.96);
    z-index:100;
    display:none;
    flex-direction:column;
    color:white;
}

.call-overlay.show{
    display:flex;
}

.call-header{
    padding:18px;
    text-align:center;
}

.call-header strong{
    font-size:20px;
}

.call-header span{
    display:block;
    margin-top:6px;
    color:#cbd5e1;
    font-size:13px;
}

.video-area{
    flex:1;
    position:relative;
    display:flex;
    align-items:center;
    justify-content:center;
    overflow:hidden;
}

.remote-video{
    width:100%;
    height:100%;
    object-fit:cover;
    background:#020617;
}

.local-video{
    position:absolute;
    right:15px;
    bottom:15px;
    width:140px;
    height:190px;
    object-fit:cover;
    border-radius:12px;
    border:2px solid white;
    background:#020617;
}

.call-actions{
    padding:20px;
    display:flex;
    justify-content:center;
    gap:14px;
}

.call-action{
    width:58px;
    height:58px;
    border:0;
    border-radius:50%;
    color:white;
    font-size:23px;
}

.call-end{
    background:#dc2626;
}

.call-accept{
    background:#16a34a;
}

.call-muted{
    background:#475569;
}

/* =========================
   INCOMING CALL
========================= */

.incoming{
    position:fixed;
    inset:0;
    z-index:200;
    display:none;
    align-items:center;
    justify-content:center;
    background:rgba(15,23,42,.82);
    padding:20px;
}

.incoming.show{
    display:flex;
}

.incoming-card{
    width:min(380px,100%);
    background:white;
    border-radius:22px;
    padding:28px;
    text-align:center;
    box-shadow:0 20px 60px rgba(0,0,0,.35);
}

.incoming-avatar{
    width:82px;
    height:82px;
    margin:0 auto 14px;
    border-radius:50%;
    background:#2563eb;
    color:white;
    display:flex;
    align-items:center;
    justify-content:center;
    overflow:hidden;
    font-size:28px;
    font-weight:bold;
}

.incoming-avatar img{
    width:100%;
    height:100%;
    object-fit:cover;
}

.incoming-card h2{
    font-size:21px;
}

.incoming-card p{
    color:#64748b;
    margin-top:7px;
}

.incoming-actions{
    display:flex;
    gap:12px;
    margin-top:24px;
}

.incoming-actions button{
    flex:1;
    padding:13px;
    border:0;
    border-radius:12px;
    color:white;
    font-weight:bold;
}

.reject{
    background:#dc2626;
}

.accept{
    background:#16a34a;
}

/* =========================
   TOAST
========================= */

.toast{
    position:fixed;
    left:50%;
    bottom:25px;
    transform:translate(-50%,20px);
    background:#111827;
    color:white;
    padding:12px 18px;
    border-radius:12px;
    opacity:0;
    pointer-events:none;
    transition:.25s;
    z-index:500;
    max-width:90%;
    text-align:center;
}

.toast.show{
    opacity:1;
    transform:translate(-50%,0);
}

/* =========================
   MOBILE
========================= */

@media(max-width:760px){

    .contacts{
        width:100%;
        min-width:0;
    }

    .chat{
        display:none;
    }

    .main.chat-open .contacts{
        display:none;
    }

    .main.chat-open .chat{
        display:flex;
    }

    .header{
        height:60px;
        min-height:60px;
    }

    .message{
        max-width:86%;
    }

    .local-video{
        width:105px;
        height:145px;
    }

}

</style>
</head>

<script type="module">

/* ============================================================
   FIREBASE
============================================================ */

import {
    auth,
    db,
    almacenamiento
} from "./Js/firebase.js";


import {
    onAuthStateChanged
} from "https://www.gstatic.com/firebasejs/12.18.0/firebase-auth.js";


import {
    collection,
    doc,
    getDoc,
    getDocs,
    query,
    where,
    onSnapshot,
    addDoc,
    updateDoc,
    setDoc,
    serverTimestamp
} from "https://www.gstatic.com/firebasejs/12.18.0/firebase-firestore.js";


import {
    ref,
    uploadBytes,
    getDownloadURL
} from "https://www.gstatic.com/firebasejs/12.18.0/firebase-storage.js";


/* ============================================================
   FCM
============================================================ */

import {
    getMessaging,
    getToken,
    onMessage
} from "https://www.gstatic.com/firebasejs/12.18.0/firebase-messaging.js";

import {
    getApp
} from "https://www.gstatic.com/firebasejs/12.18.0/firebase-app.js";


/* ============================================================
   ESTADO
============================================================ */

let usuarioActual = null;

let perfilActual = null;

let contactoSeleccionado = null;

let contactoPerfil = null;

let contactos = [];

let contactosOriginales = [];

let mensajesActuales = [];

let unsubscribeMensajes = null;

let unsubscribeLlamadas = null;

let unsubscribeCallDocument = null;

let unsubscribeCallerCandidates = null;

let unsubscribeCalleeCandidates = null;

let llamadaActualId = null;

let llamadaEntrante = null;

let peerConnection = null;

let localStream = null;

let remoteStream = null;

let isMuted = false;

const handledIncomingCalls = new Set();


/* ============================================================
   ELEMENTOS
============================================================ */

const main =
    document.getElementById("main");

const contactsList =
    document.getElementById("contactsList");

const contactSearch =
    document.getElementById("contactSearch");

const emptyChat =
    document.getElementById("emptyChat");

const messagesBox =
    document.getElementById("messages");

const composer =
    document.getElementById("composer");

const messageInput =
    document.getElementById("messageInput");

const sendBtn =
    document.getElementById("sendBtn");

const mediaInput =
    document.getElementById("mediaInput");

const headerName =
    document.getElementById("headerName");

const headerStatus =
    document.getElementById("headerStatus");

const voiceCallBtn =
    document.getElementById("voiceCallBtn");

const videoCallBtn =
    document.getElementById("videoCallBtn");

const callOverlay =
    document.getElementById("callOverlay");

const callName =
    document.getElementById("callName");

const callStatus =
    document.getElementById("callStatus");

const remoteVideo =
    document.getElementById("remoteVideo");

const localVideo =
    document.getElementById("localVideo");

const muteBtn =
    document.getElementById("muteBtn");

const endCallBtn =
    document.getElementById("endCallBtn");

const incomingCall =
    document.getElementById("incomingCall");

const incomingName =
    document.getElementById("incomingName");

const incomingType =
    document.getElementById("incomingType");

const incomingAvatar =
    document.getElementById("incomingAvatar");

const rejectCallBtn =
    document.getElementById("rejectCallBtn");

const acceptCallBtn =
    document.getElementById("acceptCallBtn");

const toast =
    document.getElementById("toast");


/* ============================================================
   UTILIDADES
============================================================ */

function mostrarToast(texto){

    toast.textContent = texto;

    toast.classList.add("show");

    setTimeout(() => {

        toast.classList.remove("show");

    },2800);

}


function escaparHTML(texto){

    return String(texto || "")
        .replace(/&/g,"&amp;")
        .replace(/</g,"&lt;")
        .replace(/>/g,"&gt;")
        .replace(/"/g,"&quot;")
        .replace(/'/g,"&#039;");

}


function nombrePerfil(perfil){

    if(!perfil){

        return "Usuario GESBASE";

    }


    const nombreCompleto =
        perfil.nombreCompleto ||
        `${perfil.nombre || ""} ${perfil.apellido || ""}`.trim();


    if(nombreCompleto){

        return nombreCompleto;

    }


    if(perfil.nombreEmpresa){

        return perfil.nombreEmpresa;

    }


    if(perfil.empresa){

        return perfil.empresa;

    }


    return "Usuario GESBASE";

}


function iniciales(nombre){

    const partes =
        String(nombre || "U")
        .trim()
        .split(/\s+/)
        .filter(Boolean);


    if(!partes.length){

        return "U";

    }


    if(partes.length === 1){

        return partes[0]
            .substring(0,2)
            .toUpperCase();

    }


    return (
        partes[0][0] +
        partes[1][0]
    ).toUpperCase();

}


function fotoPerfil(perfil){

    return (
        perfil?.fotoPerfil ||
        perfil?.fotoURL ||
        perfil?.photoURL ||
        perfil?.foto ||
        perfil?.avatar ||
        perfil?.imagen ||
        ""
    );

}


function tipoPerfil(perfil){

    if(!perfil){

        return "Usuario GESBASE";

    }


    return (
        perfil.rubro ||
        perfil.profesion ||
        perfil.categoria ||
        perfil.tipo ||
        perfil.perfilTipo ||
        "Usuario GESBASE"
    );

}


function tiempoMensaje(mensaje){

    if(mensaje.fechaCliente){

        return Number(
            mensaje.fechaCliente
        );

    }


    if(
        mensaje.fecha &&
        typeof mensaje.fecha.seconds === "number"
    ){

        return mensaje.fecha.seconds * 1000;

    }


    return 0;

}


/* ============================================================
   PERFIL ÚNICO
   SOLO usuarios/{uid}
============================================================ */

async function obtenerPerfil(uid){

    if(!uid){

        return null;

    }


    try{

        const referencia =
            doc(
                db,
                "usuarios",
                uid
            );


        const snapshot =
            await getDoc(
                referencia
            );


        if(!snapshot.exists()){

            return null;

        }


        return {
            uid,
            ...snapshot.data()
        };


    }catch(error){

        console.error(
            "Error obteniendo perfil:",
            error
        );

        return null;

    }

}


/* ============================================================
   PRESENCIA
============================================================ */

async function actualizarPresencia(enLinea){

    if(!usuarioActual){

        return;

    }


    try{

        await setDoc(
            doc(
                db,
                "usuarios",
                usuarioActual.uid
            ),
            {
                enLinea,
                ultimaConexion:
                    serverTimestamp()
            },
            {
                merge:true
            }
        );

    }catch(error){

        console.error(
            "Error actualizando presencia:",
            error
        );

    }

}


/* ============================================================
   NOTIFICACIONES FCM
============================================================ */

/*
 * IMPORTANTE:
 *
 * Para activar completamente FCM Web:
 *
 * 1. Crear/configurar firebase-messaging-sw.js
 * 2. Obtener la clave Web Push/VAPID desde Firebase.
 * 3. Reemplazar la constante VAPID_KEY.
 *
 * Si todavía no está configurado:
 * el resto de Mensajes, llamadas y videollamadas
 * seguirá funcionando.
 */

const VAPID_KEY = "";


async function registrarNotificaciones(){

    if(!usuarioActual){

        return;

    }


    if(
        !("Notification" in window)
    ){

        console.log(
            "El navegador no soporta notificaciones."
        );

        return;

    }


    try{

        const permiso =
            await Notification.requestPermission();


        if(permiso !== "granted"){

            console.log(
                "Permiso de notificaciones no concedido."
            );

            return;

        }


        if(!VAPID_KEY){

            console.warn(
                "FCM pendiente: falta configurar VAPID_KEY."
            );

            return;

        }


        const app =
            getApp();


        const messaging =
            getMessaging(app);


        const token =
            await getToken(
                messaging,
                {
                    vapidKey:VAPID_KEY
                }
            );


        if(!token){

            console.warn(
                "No se obtuvo token FCM."
            );

            return;

        }


        /*
         * El token queda asociado
         * al MISMO UID.
         *
         * No crea usuarios nuevos.
         */

        await setDoc(
            doc(
                db,
                "usuarios",
                usuarioActual.uid
            ),
            {
                fcmTokens:{
                    [token]:true
                },
                notificacionesPush:true,
                fechaActualizacionNotificaciones:
                    serverTimestamp()
            },
            {
                merge:true
            }
        );


        onMessage(
            messaging,
            payload => {

                console.log(
                    "FCM recibido:",
                    payload
                );


                const titulo =

async function cargarContactos(){

    if(!usuarioActual){

        return;

    }


    try{

        const lista =
            new Map();


        /* =========================
           ENVIADAS
        ========================= */

        const enviadasSnapshot =
            await getDocs(
                query(
                    collection(
                        db,
                        "conexiones"
                    ),
                    where(
                        "emisor",
                        "==",
                        usuarioActual.uid
                    ),
                    where(
                        "estado",
                        "==",
                        "aceptada"
                    )
                )
            );


        enviadasSnapshot.forEach(
            item => {

                const data =
                    item.data();


                if(data.receptor){

                    lista.set(
                        data.receptor,
                        true
                    );

                }

            }
        );


        /* =========================
           RECIBIDAS
        ========================= */

        const recibidasSnapshot =
            await getDocs(
                query(
                    collection(
                        db,
                        "conexiones"
                    ),
                    where(
                        "receptor",
                        "==",
                        usuarioActual.uid
                    ),
                    where(
                        "estado",
                        "==",
                        "aceptada"
                    )
                )
            );


        recibidasSnapshot.forEach(
            item => {

                const data =
                    item.data();


                if(data.emisor){

                    lista.set(
                        data.emisor,
                        true
                    );

                }

            }
        );


        contactos = [];


        for(
            const uid
            of lista.keys()
        ){

            if(
                uid ===
                usuarioActual.uid
            ){

                continue;

            }


            const perfil =
                await obtenerPerfil(
                    uid
                );


            if(perfil){

                contactos.push(
                    perfil
                );

            }

        }


        contactos.sort(
            (a,b) =>
                nombrePerfil(a)
                .localeCompare(
                    nombrePerfil(b),
                    "es"
                )
        );


        contactosOriginales =
            [...contactos];


        renderizarContactos();


    }catch(error){

        console.error(
            "Error cargando contactos:",
            error
        );


        mostrarToast(
            "No se pudieron cargar tus conexiones."
        );

    }

}

async function cargarMensajes(){

    if(
        !usuarioActual ||
        !contactoSeleccionado
    ){

        return;

    }


    if(unsubscribeMensajes){

        unsubscribeMensajes();

        unsubscribeMensajes =
            null;

    }


    try{

        let enviados = [];

        let recibidos = [];


        const enviadosQuery =
            query(
                collection(
                    db,
                    "mensajes"
                ),
                where(
                    "emisorUid",
                    "==",
                    usuarioActual.uid
                ),
                where(
                    "receptorUid",
                    "==",
                    contactoSeleccionado
                )
            );


        const recibidosQuery =
            query(
                collection(
                    db,
                    "mensajes"
                ),
                where(
                    "emisorUid",
                    "==",
                    contactoSeleccionado
                ),
                where(
                    "receptorUid",
                    "==",
                    usuarioActual.uid
                )
            );


        const render =
            () => {

                const mapa =
                    new Map();


                [
                    ...enviados,
                    ...recibidos
                ]
                .forEach(
                    mensaje => {

                        mapa.set(
                            mensaje.id,
                            mensaje
                        );

                    }
                );


                const todos =
                    [...mapa.values()]
                    .sort(
                        (a,b) =>
                            tiempoMensaje(a) -
                            tiempoMensaje(b)
                    );


                mensajesActuales =
                    todos;


                renderizarMensajes();

            };


        const unsubscribeEnviados =
            onSnapshot(
                enviadosQuery,
                snapshot => {

                    enviados =
                        snapshot.docs.map(
                            item => ({
                                id:item.id,
                                ...item.data()
                            })
                        );


                    render();

                },
                error => {

                    console.error(
                        "Error escuchando enviados:",
                        error
                    );

                }
            );


        const unsubscribeRecibidos =
            onSnapshot(
                recibidosQuery,
                snapshot => {

                    recibidos =
                        snapshot.docs.map(
                            item => ({
                                id:item.id,
                                ...item.data()
                            })
                        );


                    marcarRecibidosComoLeidos(
                        snapshot
                    );


                    render();

                },
                error => {

                    console.error(
                        "Error escuchando recibidos:",
                        error
                    );

                }
            );


        unsubscribeMensajes =
            () => {

                unsubscribeEnviados();

                unsubscribeRecibidos();

            };


    }catch(error){

        console.error(
            "Error cargando mensajes:",
            error
        );


        mostrarToast(
            "No se pudieron cargar los mensajes."
        );

    }

}

/* ============================================================
   HORA
============================================================ */

function formatearHora(
    mensaje
){

    const tiempo =
        tiempoMensaje(
            mensaje
        );


    if(!tiempo){

        return "";

    }


    return new Date(
        tiempo
    ).toLocaleTimeString(
        "es-AR",
        {
            hour:"2-digit",
            minute:"2-digit"
        }
    );

}

============================================================ */

async function marcarRecibidosComoLeidos(
    snapshot
){

    if(!usuarioActual){

        return;

    }


    const operaciones = [];


    snapshot.docs.forEach(
        item => {

            const data =
                item.data();


            if(
                data.leido === false &&
                data.receptorUid ===
                usuarioActual.uid
            ){

                operaciones.push(
                    updateDoc(
                        doc(
                            db,
                            "mensajes",
                            item.id
                        ),
                        {
                            leido:true,
                            fechaLectura:
                                serverTimestamp()
                        }
                    )
                );

            }

        }
    );


    if(operaciones.length){

        await Promise.allSettled(
            operaciones
        );

    }

}

/* ============================================================
   WEBRTC
============================================================ */

const rtcConfig = {

    iceServers:[
        {
            urls:
                "stun:stun.l.google.com:19302"
        }
    ]

};


/* ============================================================
   CREAR PEER CONNECTION
============================================================ */

function crearPeerConnection(
    llamadaId,
    rol
){

    const pc =
        new RTCPeerConnection(
            rtcConfig
        );


    remoteStream =
        new MediaStream();


    remoteVideo.srcObject =
        remoteStream;


    pc.ontrack =
        event => {

            if(
                event.streams &&
                event.streams[0]
            ){

                event.streams[0]
                .getTracks()
                .forEach(
                    track => {

                        if(
                            !remoteStream
                            .getTracks()
                            .some(
                                t =>
                                    t.id ===
                                    track.id
                            )
                        ){

                            remoteStream.addTrack(
                                track
                            );

                        }

                    }
                );

            }

        };


    pc.onicecandidate =
        async event => {

            if(
                !event.candidate
            ){

                return;

            }


            try{

                const coleccion =
                    rol === "caller"
                    ? "callerCandidates"
                    : "calleeCandidates";


                await addDoc(
                    collection(
                        db,
                        "llamadas",
                        llamadaId,
                        coleccion
                    ),
                    event.candidate.toJSON()
                );


            }catch(error){

                console.error(
                    "Error guardando candidato ICE:",
                    error
                );

            }

        };


    pc.onconnectionstatechange =
        () => {

            const estado =
                pc.connectionState;


            if(
                estado ===
                "connected"
            ){

                callStatus.textContent =
                    "Conectado";

            }


            if(
                estado ===
                "connecting"
            ){

                callStatus.textContent =
                    "Conectando...";

            }


            if(
                estado ===
                "disconnected"
            ){

                callStatus.textContent =
                    "Conexión perdida";

            }


            if(
                estado ===
                "failed"
            ){

                callStatus.textContent =
                    "Error de conexión";

            }


            if(
                estado ===
                "closed"
            ){

                callStatus.textContent =
                    "Llamada finalizada";

            }

        };


    return pc;

}


/* ============================================================
   ESCUCHAR CANDIDATOS
============================================================ */

function escucharCandidatos(
    llamadaId,
    coleccion
){

    const candidatosRef =
        collection(
            db,
            "llamadas",
            llamadaId,
            coleccion
        );


    return onSnapshot(
        candidatosRef,
        snapshot => {

            snapshot.docChanges()
            .forEach(
                async change => {

                    if(
                        change.type !==
                        "added"
                    ){

                        return;

                    }


                    if(!peerConnection){

                        return;

                    }


                    try{

                        await peerConnection
                            .addIceCandidate(
                                new RTCIceCandidate(
                                    change.doc.data()
                                )
                            );


                    }catch(error){

                        /*
                         * Puede llegar un candidato
                         * antes de que el peer esté
                         * completamente listo.
                         */

                        console.warn(
                            "ICE pendiente:",
                            error
                        );

                    }

                }
            );

        },
        error => {

            console.error(
                "Error escuchando ICE:",
                error
            );

        }
    );

}


/* ============================================================
   INICIAR LLAMADA
============================================================ */

async function iniciarLlamada(
    video
){

    if(
        !usuarioActual ||
        !contactoSeleccionado
    ){

        mostrarToast(
            "Seleccioná una conexión."
        );

        return;

    }


    if(
        peerConnection ||
        llamadaActualId
    ){

        mostrarToast(
            "Ya hay una llamada activa."
        );

        return;

    }


    try{

        const tipo =
            video
            ? "videollamada"
            : "llamada";


        localStream =
            await navigator.mediaDevices
            .getUserMedia(
                {
                    audio:true,
                    video:video
                }
            );


        localVideo.srcObject =
            localStream;


        localVideo.style.display =
            video
            ? "block"
            : "none";


        remoteVideo.style.display =
            video
            ? "block"
            : "none";


        const llamadaRef =
            await addDoc(
                collection(
                    db,
                    "llamadas"
                ),
                {

                    callerId:
                        usuarioActual.uid,

                    calleeId:
                        contactoSeleccionado,

                    callerName:
                        nombrePerfil(
                            perfilActual
                        ),

                    tipo,

                    status:
                        "ringing",

                    fechaCliente:
                        Date.now(),

                    fecha:
                        serverTimestamp()

                }
            );


        llamadaActualId =
            llamadaRef.id;


        peerConnection =
            crearPeerConnection(
                llamadaActualId,
                "caller"
            );


        localStream
        .getTracks()
        .forEach(
            track => {

                peerConnection.addTrack(
                    track,
                    localStream
                );

            }
        );


        unsubscribeCallerCandidates =
            escucharCandidatos(
                llamadaActualId,
                "calleeCandidates"
            );


        const offer =
            await peerConnection
            .createOffer();


        await peerConnection
            .setLocalDescription(
                offer
            );


        await updateDoc(
            llamadaRef,
            {

                offer:{
                    type:
                        offer.type,

                    sdp:
                        offer.sdp
                }

            }
        );


        callName.textContent =
            nombrePerfil(
                contactoPerfil
            );


        callStatus.textContent =
            video
            ? "Videollamando..."
            : "Llamando...";


        callOverlay.classList.add(
            "show"
        );


        escucharDocumentoLlamada(
            llamadaActualId
        );


    }catch(error){

        console.error(
            "Error iniciando llamada:",
            error
        );


        mostrarToast(
            obtenerMensajeErrorMedia(
                error
            )
        );


        await limpiarLlamada(
            false
        );

    }

}


/* ============================================================
   ESCUCHAR DOCUMENTO DE LLAMADA
============================================================ */

function escucharDocumentoLlamada(
    llamadaId
){

    if(unsubscribeCallDocument){

        unsubscribeCallDocument();

        unsubscribeCallDocument =
            null;

    }


    const llamadaRef =
        doc(
            db,
            "llamadas",
            llamadaId
        );


    unsubscribeCallDocument =
        onSnapshot(
            llamadaRef,
            async snapshot => {

                const data =
                    snapshot.data();


                if(!data){

                    return;

                }


                if(
                    data.answer &&
                    peerConnection &&
                    !peerConnection
                    .currentRemoteDescription
                ){

                    try{

                        await peerConnection
                            .setRemoteDescription(
                                new RTCSessionDescription(
                                    data.answer
                                )
                            );


                        callStatus.textContent =
                            "Conectando...";


                    }catch(error){

                        console.error(
                            "Error configurando respuesta:",
                            error
                        );

                    }

                }


                if(
                    data.status ===
                    "rejected"
                ){

                    mostrarToast(
                        "La llamada fue rechazada."
                    );


                    await limpiarLlamada(
                        false
                    );

                }


                if(
                    data.status ===
                    "ended"
                ){

                    await limpiarLlamada(
                        false
                    );

                }

            },
            error => {

                console.error(
                    "Error escuchando llamada:",
                    error
                );

            }
        );

}


/* ============================================================
   LLAMADAS ENTRANTES
============================================================ */

function iniciarEscuchaLlamadas(){

    if(!usuarioActual){

        return;

    }


    if(unsubscribeLlamadas){

        unsubscribeLlamadas();

        unsubscribeLlamadas =
            null;

    }


    const llamadasQuery =
        query(
            collection(
                db,
                "llamadas"
            ),
            where(
                "calleeId",
                "==",
                usuarioActual.uid
            ),
            where(
                "status",
                "==",
                "ringing"
            )
        );


    unsubscribeLlamadas =
        onSnapshot(
            llamadasQuery,
            async snapshot => {

                for(
                    const change
                    of snapshot.docChanges()
                ){

                    if(
                        change.type !==
                        "added"
                    ){

                        continue;

                    }


                    const llamada = {
                        id:
                            change.doc.id,

                        ...change.doc.data()

                    };


                    if(
                        handledIncomingCalls
                        .has(
                            llamada.id
                        )
                    ){

                        continue;

                    }


                    handledIncomingCalls.add(
                        llamada.id
                    );


                    if(
                        llamada.callerId ===
                        usuarioActual.uid
                    ){

                        continue;

                    }


                    const perfil =
                        await obtenerPerfil(
                            llamada.callerId
                        );


                    mostrarLlamadaEntrante(
                        llamada,
                        perfil
                    );

                }

            },
            error => {

                console.error(
                    "Error escuchando llamadas:",
                    error
                );

            }
        );

}


/* ============================================================
   MOSTRAR LLAMADA ENTRANTE
============================================================ */

function mostrarLlamadaEntrante(
    llamada,
    perfil
){

    if(
        llamadaEntrante &&
        llamadaEntrante.id !==
        llamada.id
    ){

        return;

    }


    llamadaEntrante =
        llamada;


    const nombre =
        nombrePerfil(
            perfil
        );


    incomingName.textContent =
        nombre;


    incomingType.textContent =
        llamada.tipo ===
        "videollamada"
        ? "Videollamada entrante"
        : "Llamada entrante";


    const foto =
        fotoPerfil(
            perfil
        );


    if(foto){

        incomingAvatar.innerHTML = `

            <img
                src="${escaparHTML(foto)}"
                alt=""
            >

        `;

    }else{

        incomingAvatar.textContent =
            iniciales(
                nombre
            );

    }


    incomingCall.classList.add(
        "show"
    );

}


/* ============================================================
   ACEPTAR LLAMADA
============================================================ */

acceptCallBtn.addEventListener(
    "click",
    aceptarLlamada
);


async function aceptarLlamada(){

    if(!llamadaEntrante){

        return;

    }


    const llamada =
        llamadaEntrante;


    incomingCall.classList.remove(
        "show"
    );


    try{

        const esVideo =
            llamada.tipo ===
            "videollamada";


        localStream =
            await navigator.mediaDevices
            .getUserMedia(
                {
                    audio:true,
                    video:esVideo
                }
            );


        localVideo.srcObject =
            localStream;


        localVideo.style.display =
            esVideo
            ? "block"
            : "none";


        remoteVideo.style.display =
            esVideo
            ? "block"
            : "none";


        llamadaActualId =
            llamada.id;


        peerConnection =
            crearPeerConnection(
                llamada.id,
                "callee"
            );


        localStream
        .getTracks()
        .forEach(
            track => {

                peerConnection.addTrack(
                    track,
                    localStream
                );

            }
        );


        await peerConnection
            .setRemoteDescription(
                new RTCSessionDescription(
                    llamada.offer
                )
            );


        unsubscribeCalleeCandidates =
            escucharCandidatos(
                llamada.id,
                "callerCandidates"
            );


        const answer =
            await peerConnection
            .createAnswer();


        await peerConnection
            .setLocalDescription(
                answer
            );


        await updateDoc(
            doc(
                db,
                "llamadas",
                llamada.id
            ),
            {

                answer:{
                    type:
                        answer.type,

                    sdp:
                        answer.sdp
                },

                status:
                    "accepted",

                fechaAceptacion:
                    serverTimestamp()

            }
        );


        const perfilCaller =
            await obtenerPerfil(
                llamada.callerId
            );


        callName.textContent =
            nombrePerfil(
                perfilCaller
            );


        callStatus.textContent =
            esVideo
            ? "Conectando..."
            : "Conectando...";


        callOverlay.classList.add(
            "show"
        );


        escucharDocumentoLlamada(
            llamada.id
        );


        llamadaEntrante =
            null;


    }catch(error){

        console.error(
            "Error aceptando llamada:",
            error
        );


        mostrarToast(
            obtenerMensajeErrorMedia(
                error
            )
        );


        try{

            await rechazarLlamada(
                llamada.id
            );

        }catch(e){

            console.error(e);

        }


        await limpiarLlamada(
            false
        );

    }

}


/* ============================================================
   RECHAZAR
============================================================ */

rejectCallBtn.addEventListener(
    "click",
    async () => {

        if(!llamadaEntrante){

            return;

        }


        const llamadaId =
            llamadaEntrante.id;


        await rechazarLlamada(
            llamadaId
        );


        llamadaEntrante =
            null;


        incomingCall.classList.remove(
            "show"
        );

    }
);


async function rechazarLlamada(
    llamadaId
){

    if(!llamadaId){

        return;

    }


    try{

        await updateDoc(
            doc(
                db,
                "llamadas",
                llamadaId
            ),
            {

                status:
                    "rejected",

                fechaFin:
                    serverTimestamp()

            }
        );


    }catch(error){

        console.error(
            "Error rechazando llamada:",
            error
        );

    }

}


/* ============================================================
   FINALIZAR LLAMADA
============================================================ */

endCallBtn.addEventListener(
    "click",
    finalizarLlamada
);


async function finalizarLlamada(){

    const id =
        llamadaActualId;


    if(id){

        try{

            await updateDoc(
                doc(
                    db,
                    "llamadas",
                    id
                ),
                {

                    status:
                        "ended",

                    fechaFin:
                        serverTimestamp()

                }
            );


        }catch(error){

            console.error(
                "Error finalizando llamada:",
                error
            );

        }

    }


    await limpiarLlamada(
        false
    );

}


/* ============================================================
   LIMPIAR LLAMADA
============================================================ */

async function limpiarLlamada(
    actualizarFirestore = false
){

    const id =
        llamadaActualId;


    if(
        actualizarFirestore &&
        id
    ){

        try{

            await updateDoc(
                doc(
                    db,
                    "llamadas",
                    id
                ),
                {

                    status:
                        "ended",

                    fechaFin:
                        serverTimestamp()

                }
            );

        }catch(error){

            console.error(
                error
            );

        }

    }


    if(unsubscribeCallDocument){

        unsubscribeCallDocument();

        unsubscribeCallDocument =
            null;

    }


    if(unsubscribeCallerCandidates){

        unsubscribeCallerCandidates();

        unsubscribeCallerCandidates =
            null;

    }


    if(unsubscribeCalleeCandidates){

        unsubscribeCalleeCandidates();

        unsubscribeCalleeCandidates =
            null;

    }


    if(localStream){

        localStream
        .getTracks()
        .forEach(
            track => {

                track.stop();

            }
        );

    }


    if(remoteStream){

        remoteStream
        .getTracks()
        .forEach(
            track => {

                track.stop();

            }
        );

    }


    if(peerConnection){

        peerConnection.close();

    }


    localStream =
        null;


    remoteStream =
        null;


    peerConnection =
        null;


    llamadaActualId =
        null;


    isMuted =
        false;


    muteBtn.textContent =
        "🎙️";


    remoteVideo.srcObject =
        null;


    localVideo.srcObject =
        null;


    callOverlay.classList.remove(
        "show"
    );

}


/* ============================================================
   ERROR MEDIA
============================================================ */

function obtenerMensajeErrorMedia(
    error
){

    if(
        error?.name ===
        "NotAllowedError"
    ){

        return "Tenés que permitir el acceso a cámara y micrófono.";

    }


    if(
        error?.name ===
        "NotFoundError"
    ){

        return "No se encontró cámara o micrófono.";

    }


    if(
        error?.name ===
        "NotReadableError"
    ){

        return "La cámara o el micrófono están siendo usados por otra aplicación.";

    }


    return "No se pudo iniciar la llamada.";

}


/* ============================================================
   SILENCIAR MICRÓFONO
============================================================ */

muteBtn.addEventListener(
    "click",
    () => {

        if(!localStream){

            return;

        }


        const pistas =
            localStream
            .getAudioTracks();


        if(!pistas.length){

            return;

        }


        pistas.forEach(
            pista => {

                pista.enabled =
                    !pista.enabled;

            }
        );


        isMuted =
            !pistas[0].enabled;


        muteBtn.textContent =
            isMuted
            ? "🔇"
            : "🎙️";

    }
);


/* ============================================================
   BOTONES LLAMADA
============================================================ */

voiceCallBtn.addEventListener(
    "click",
    () => {

        iniciarLlamada(
            false
        );

    }
);


videoCallBtn.addEventListener(
    "click",
    () => {

            true
        );

    }
);

                unsubscribeMensajes();

                unsubscribeMensajes =

            }

    }
);
