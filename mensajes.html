<!DOCTYPE html>
<html lang="es-AR">

<head>

<meta charset="UTF-8">

<meta
    name="viewport"
    content="width=device-width, initial-scale=1.0, viewport-fit=cover"
>

<meta
    name="theme-color"
    content="#111827"
>

<meta
    name="description"
    content="Mensajes de Red GESBASE. Comunicate con tus conexiones profesionales."
>

<title>Mensajes - Red GESBASE</title>


<style>

*{
    box-sizing:border-box;
    margin:0;
    padding:0;
}

html,
body{
    width:100%;
    height:100%;
}

body{
    font-family:Arial,Helvetica,sans-serif;
    background:#f3f4f6;
    color:#111827;
    overflow:hidden;
}

button,
input,
textarea{
    font:inherit;
}


/* =========================================================
   APP
========================================================= */

.app{
    width:100%;
    height:100vh;
    height:100dvh;

    display:flex;
    flex-direction:column;
}


/* =========================================================
   HEADER
========================================================= */

header{
    flex-shrink:0;

    background:#111827;
    color:white;

    padding:
        max(10px,env(safe-area-inset-top))
        12px
        10px;

    box-shadow:
        0 2px 8px rgba(0,0,0,.18);

    z-index:20;
}

.header-inner{
    width:100%;
    max-width:1100px;

    margin:auto;

    display:flex;
    align-items:center;

    gap:9px;
}

.btn-volver{
    width:40px;
    height:40px;

    border:0;
    border-radius:50%;

    background:#374151;
    color:white;

    font-size:27px;

    line-height:1;

    cursor:pointer;

    flex-shrink:0;
}

.header-contact{
    display:flex;
    align-items:center;

    gap:9px;

    min-width:0;

    flex:1;
}

.header-avatar{
    width:42px;
    height:42px;

    border-radius:50%;

    background:#e5e7eb;
    color:#111827;

    display:flex;
    align-items:center;
    justify-content:center;

    font-size:18px;
    font-weight:bold;

    overflow:hidden;

    flex-shrink:0;

    cursor:pointer;
}

.header-avatar img{
    width:100%;
    height:100%;

    object-fit:cover;
}

.header-info{
    min-width:0;
}

.header-name{
    font-size:16px;
    font-weight:700;

    white-space:nowrap;
    overflow:hidden;
    text-overflow:ellipsis;
}

.header-status{
    font-size:12px;
    color:#d1d5db;

    margin-top:2px;
}

.header-actions{
    display:flex;
    align-items:center;
    gap:5px;
}

.header-button{
    width:39px;
    height:39px;

    border:0;
    border-radius:50%;

    background:#374151;

    color:white;

    font-size:18px;

    display:flex;
    align-items:center;
    justify-content:center;
}

.header-button:disabled{
    opacity:.45;
}


/* =========================================================
   CONTADOR
========================================================= */

.header-unread{
    min-width:24px;
    height:24px;

    padding:0 7px;

    border-radius:20px;

    background:#ef4444;
    color:white;

    display:none;
    align-items:center;
    justify-content:center;

    font-size:11px;
    font-weight:bold;

    flex-shrink:0;
}

.header-unread.visible{
    display:flex;
}


/* =========================================================
   CONTENIDO
========================================================= */

.chat{
    flex:1;
    min-height:0;

    width:100%;

    display:flex;
    justify-content:center;
}

.chat-inner{
    width:100%;
    max-width:1100px;

    display:flex;
    flex-direction:column;

    min-height:0;
}


/* =========================================================
   CONTACTOS
========================================================= */

.contacts-panel{
    width:100%;
    height:100%;

    overflow-y:auto;

    background:#f3f4f6;

    padding:15px;
}

.contacts-title{
    font-size:20px;
    font-weight:900;

    margin-bottom:5px;
}

.contacts-subtitle{
    color:#6b7280;
    font-size:13px;

    margin-bottom:14px;
}

.contact-search{
    width:100%;

    height:43px;

    border:1px solid #d1d5db;

    border-radius:22px;

    padding:
        0
        15px;

    outline:none;

    background:white;

    margin-bottom:12px;
}

.contact-search:focus{
    border-color:#111827;
}

.contacts-list{
    display:grid;
    gap:7px;
}

.contact-card{
    width:100%;

    border:0;

    background:white;

    border-radius:13px;

    padding:11px;

    display:flex;
    align-items:center;

    gap:11px;

    text-align:left;

    cursor:pointer;

    box-shadow:
        0 1px 3px rgba(0,0,0,.08);
}

.contact-card:hover{
    background:#f9fafb;
}

.contact-avatar{
    width:50px;
    height:50px;

    flex:0 0 50px;

    border-radius:50%;

    background:#111827;
    color:white;

    display:flex;
    align-items:center;
    justify-content:center;

    font-weight:900;

    overflow:hidden;

    position:relative;
}

.contact-avatar img{
    width:100%;
    height:100%;
    object-fit:cover;
}

.online-dot{
    position:absolute;

    width:13px;
    height:13px;

    right:0;
    bottom:0;

    border-radius:50%;

    background:#22c55e;

    border:2px solid white;
}

.contact-info{
    min-width:0;
    flex:1;
}

.contact-name{
    font-size:14px;
    font-weight:800;

    white-space:nowrap;
    overflow:hidden;
    text-overflow:ellipsis;
}

.contact-type{
    font-size:12px;
    color:#6b7280;

    margin-top:3px;

    white-space:nowrap;
    overflow:hidden;
    text-overflow:ellipsis;
}

.contact-unread{
    min-width:22px;
    height:22px;

    padding:0 6px;

    border-radius:50px;

    background:#ef4444;
    color:white;

    display:none;
    align-items:center;
    justify-content:center;

    font-size:10px;
    font-weight:900;
}


/* =========================================================
   MENSAJES
========================================================= */

.messages{
    flex:1;
    min-height:0;

    overflow-y:auto;

    padding:18px 14px;

    display:flex;
    flex-direction:column;

    gap:8px;

    scroll-behavior:smooth;
}

.message-row{
    width:100%;
    display:flex;
}

.message-row.mine{
    justify-content:flex-end;
}

.message-row.theirs{
    justify-content:flex-start;
}

.message{
    max-width:min(78%,600px);

    padding:10px 13px;

    border-radius:16px;

    font-size:14px;
    line-height:1.4;

    word-break:break-word;

    box-shadow:
        0 1px 3px rgba(0,0,0,.08);
}

.message.mine{
    background:#111827;
    color:white;

    border-bottom-right-radius:5px;
}

.message.theirs{
    background:white;
    color:#111827;

    border-bottom-left-radius:5px;
}

.message-time{
    display:block;

    font-size:10px;

    margin-top:5px;

    opacity:.65;

    text-align:right;
}


/* =========================================================
   TEXTO MENSAJE
========================================================= */

.message-text{
    white-space:pre-wrap;
}


/* =========================================================
   FOTOS
========================================================= */

.message-image{
    display:block;

    width:min(280px,70vw);

    max-height:350px;

    object-fit:cover;

    border-radius:10px;

    cursor:pointer;
}


/* =========================================================
   VIDEOS
========================================================= */

.message-video{
    display:block;

    width:min(320px,75vw);

    max-height:360px;

    border-radius:10px;

    background:#000;
}


/* =========================================================
   ARCHIVO
========================================================= */

.file-message{
    display:flex;

    align-items:center;

    gap:8px;

    text-decoration:none;

    color:inherit;

    font-weight:700;
}


/* =========================================================
   ESTADOS
========================================================= */

.chat-empty{
    flex:1;

    display:flex;

    align-items:center;
    justify-content:center;

    text-align:center;

    padding:30px;

    color:#6b7280;
}

.chat-empty-box{
    max-width:380px;
}

.chat-empty-icon{
    font-size:45px;
    margin-bottom:12px;
}

.chat-empty-title{
    font-size:18px;

    font-weight:700;

    color:#111827;

    margin-bottom:7px;
}

.chat-empty-text{
    font-size:14px;
    line-height:1.5;
}


/* =========================================================
   COMPOSER
========================================================= */

.composer{
    flex-shrink:0;

    background:white;

    border-top:1px solid #e5e7eb;

    padding:
        8px 10px
        max(8px,env(safe-area-inset-bottom));
}

.composer-tools{
    display:flex;

    align-items:center;

    gap:5px;

    margin-bottom:7px;
}

.tool-button{
    width:36px;
    height:36px;

    border:0;

    border-radius:50%;

    background:#f3f4f6;

    display:flex;

    align-items:center;
    justify-content:center;

    font-size:18px;
}

.tool-button:hover{
    background:#e5e7eb;
}

.composer-inner{
    width:100%;

    display:flex;

    align-items:flex-end;

    gap:8px;
}

.message-input{
    flex:1;

    min-width:0;

    resize:none;

    min-height:42px;

    max-height:120px;

    border:1px solid #d1d5db;

    border-radius:21px;

    padding:11px 15px;

    outline:none;

    font-family:inherit;

    font-size:14px;

    line-height:1.35;

    background:#f9fafb;
}

.message-input:focus{
    border-color:#6b7280;

    background:white;
}

.btn-enviar{
    width:44px;
    height:44px;

    border:0;

    border-radius:50%;

    background:#111827;

    color:white;

    font-size:19px;

    cursor:pointer;

    flex-shrink:0;
}

.btn-enviar:disabled{
    opacity:.5;
}


/* =========================================================
   INPUTS OCULTOS
========================================================= */

.hidden-input{
    display:none;
}


/* =========================================================
   LLAMADA
========================================================= */

.call-overlay{
    position:fixed;

    inset:0;

    z-index:5000;

    background:#050505;

    display:none;

    flex-direction:column;
}

.call-overlay.open{
    display:flex;
}

.call-header{
    flex-shrink:0;

    padding:
        max(12px,env(safe-area-inset-top))
        15px
        10px;

    color:white;

    display:flex;

    justify-content:space-between;

    align-items:center;
}

.call-title{
    font-size:16px;
    font-weight:800;
}

.call-status{
    font-size:12px;
    opacity:.75;
    margin-top:2px;
}

.call-videos{
    flex:1;

    min-height:0;

    position:relative;

    display:flex;

    align-items:center;
    justify-content:center;

    overflow:hidden;
}

.remote-video{
    width:100%;
    height:100%;

    object-fit:contain;

    background:#050505;
}

.local-video{
    position:absolute;

    right:15px;
    bottom:15px;

    width:120px;
    height:170px;

    object-fit:cover;

    background:#111;

    border-radius:12px;

    border:2px solid white;

    z-index:3;
}

.call-controls{
    flex-shrink:0;

    display:flex;

    justify-content:center;

    align-items:center;

    gap:12px;

    padding:
        14px
        15px
        max(14px,env(safe-area-inset-bottom));
}

.call-button{
    width:52px;
    height:52px;

    border:0;

    border-radius:50%;

    background:#374151;

    color:white;

    font-size:21px;
}

.call-button.active{
    background:#111827;
}

.call-button.danger{
    background:#dc2626;
}


/* =========================================================
   LLAMADA ENTRANTE
========================================================= */

.incoming-call{
    position:fixed;

    inset:0;

    z-index:6000;

    background:rgba(0,0,0,.78);

    display:none;

    align-items:center;
    justify-content:center;

    padding:20px;
}

.incoming-call.open{
    display:flex;
}

.incoming-box{
    width:100%;
    max-width:360px;

    background:white;

    border-radius:20px;

    padding:25px;

    text-align:center;
}

.incoming-avatar{
    width:75px;
    height:75px;

    margin:0 auto 12px;

    border-radius:50%;

    overflow:hidden;

    background:#111827;

    color:white;

    display:flex;

    align-items:center;
    justify-content:center;

    font-size:28px;

    font-weight:900;
}

.incoming-avatar img{
    width:100%;
    height:100%;
    object-fit:cover;
}

.incoming-title{
    font-size:19px;
    font-weight:900;
}

.incoming-text{
    color:#6b7280;

    font-size:13px;

    margin-top:5px;
}

.incoming-actions{
    display:flex;

    justify-content:center;

    gap:12px;

    margin-top:20px;
}

.incoming-button{
    border:0;

    border-radius:12px;

    padding:11px 20px;

    color:white;

    font-weight:800;
}

.incoming-reject{
    background:#dc2626;
}

.incoming-accept{
    background:#16a34a;
}


/* =========================================================
   TOAST
========================================================= */

.toast{
    position:fixed;

    left:50%;
    bottom:90px;

    transform:translateX(-50%);

    background:#111827;

    color:white;

    padding:11px 16px;

    border-radius:10px;

    font-size:13px;

    display:none;

    z-index:10000;

    max-width:90%;

    text-align:center;
}

.toast.show{
    display:block;
}


/* =========================================================
   TABLET
========================================================= */

@media(min-width:700px){

    .messages{
        padding:22px;
    }

    .composer{
        padding:
            10px
            22px
            max(10px,env(safe-area-inset-bottom));
    }

    .contacts-panel{
        padding:22px;

        max-width:800px;

        margin:auto;
    }

}


/* =========================================================
   CELULAR
========================================================= */

@media(max-width:600px){

    .header-name{
        font-size:15px;
    }

    .message{
        max-width:84%;
    }

    .messages{
        padding:14px 10px;
    }

    .header-button{
        width:36px;
        height:36px;
        font-size:16px;
    }

    .local-video{
        width:95px;
        height:140px;
    }

}


/* =========================================================
   CELULAR PEQUEÑO
========================================================= */

@media(max-width:390px){

    .btn-volver{
        width:36px;
        height:36px;
        font-size:24px;
    }

    .header-avatar{
        width:38px;
        height:38px;
    }

    .message{
        max-width:88%;
    }

}

</style>

</head>


<body>


<div class="app">


<header>

    <div class="header-inner">


        <button
            type="button"
            class="btn-volver"
            id="btnVolver"
            aria-label="Volver"
        >
            ‹
        </button>


        <div class="header-contact">


            <div
                class="header-avatar"
                id="headerAvatar"
            >
                👤
            </div>


            <div class="header-info">

                <div
                    class="header-name"
                    id="headerName"
                >
                    Mensajes
                </div>

                <div
                    class="header-status"
                    id="headerStatus"
                >
                    Red GESBASE
                </div>

            </div>


        </div>


        <div class="header-actions">


            <button
                type="button"
                class="header-button"
                id="btnVideoCall"
                title="Videollamada"
                aria-label="Videollamada"
                style="display:none;"
            >
                📹
            </button>


            <button
                type="button"
                class="header-button"
                id="btnAudioCall"
                title="Llamada"
                aria-label="Llamada"
                style="display:none;"
            >
                📞
            </button>


            <div
                id="headerUnread"
                class="header-unread"
            >
                0
            </div>

        </div>

    </div>

</header>



<main class="chat">

    <div class="chat-inner">


        <!-- =================================================
             CONTACTOS
        ================================================== -->

        <section
            id="contactsPanel"
            class="contacts-panel"
        >

            <div class="contacts-title">
                💬 Mensajes
            </div>

            <div class="contacts-subtitle">
                Elegí una conexión para comenzar una conversación.
            </div>


            <input
                id="contactSearch"
                class="contact-search"
                type="search"
                placeholder="🔎 Buscar contacto..."
                autocomplete="off"
            >


            <div
                id="contactsList"
                class="contacts-list"
            >

                <div class="chat-empty">

                    <div class="chat-empty-box">

                        <div class="chat-empty-icon">
                            ⏳
                        </div>

                        <div class="chat-empty-title">
                            Cargando contactos
                        </div>

                    </div>

                </div>

            </div>

        </section>



        <!-- =================================================
             CHAT
        ================================================== -->

        <section
            id="chatPanel"
            style="display:none; flex:1; min-height:0; flex-direction:column;"
        >


            <div
                id="messages"
                class="messages"
            >

                <div class="loading">
                    Cargando conversación...
                </div>

            </div>



            <div
                id="composer"
                class="composer"
            >


                <div class="composer-tools">


                    <button
                        type="button"
                        class="tool-button"
                        id="btnFoto"
                        title="Enviar foto"
                        aria-label="Enviar foto"
                    >
                        📷
                    </button>


                    <button
                        type="button"
                        class="tool-button"
                        id="btnVideo"
                        title="Enviar video"
                        aria-label="Enviar video"
                    >
                        🎥
                    </button>


                    <button
                        type="button"
                        class="tool-button"
                        id="btnArchivo"
                        title="Enviar archivo"
                        aria-label="Enviar archivo"
                    >
                        📎
                    </button>


                </div>


                <div class="composer-inner">


                    <textarea
                        id="messageInput"
                        class="message-input"
                        placeholder="Escribí un mensaje..."
                        rows="1"
                        maxlength="5000"
                        autocomplete="off"
                    ></textarea>


                    <button
                        type="button"
                        id="btnEnviar"
                        class="btn-enviar"
                        aria-label="Enviar mensaje"
                        title="Enviar mensaje"
                    >
                        ➤
                    </button>


                </div>


                <input
                    type="file"
                    id="photoInput"
                    class="hidden-input"
                    accept="image/*"
                >


                <input
                    type="file"
                    id="videoInput"
                    class="hidden-input"
                    accept="video/*"
                >


                <input
                    type="file"
                    id="fileInput"
                    class="hidden-input"
                    accept="*/*"
                >


            </div>


        </section>


    </div>

</main>



<!-- =========================================================
     VIDEOLLAMADA
========================================================= -->

<div
    id="callOverlay"
    class="call-overlay"
>


    <div class="call-header">

        <div>

            <div
                id="callTitle"
                class="call-title"
            >
                Videollamada
            </div>

            <div
                id="callStatus"
                class="call-status"
            >
                Conectando...
            </div>

        </div>

    </div>


    <div class="call-videos">


        <video
            id="remoteVideo"
            class="remote-video"
            autoplay
            playsinline
        ></video>


        <video
            id="localVideo"
            class="local-video"
            autoplay
            muted
            playsinline
        ></video>


    </div>


    <div class="call-controls">


        <button
            type="button"
            class="call-button"
            id="btnToggleMic"
            title="Micrófono"
        >
            🎤
        </button>


        <button
            type="button"
            class="call-button"
            id="btnToggleCamera"
            title="Cámara"
        >
            📷
        </button>


        <button
            type="button"
            class="call-button danger"
            id="btnEndCall"
            title="Finalizar"
        >
            📞
        </button>


    </div>

</div>



<!-- =========================================================
     LLAMADA ENTRANTE
========================================================= -->

<div
    id="incomingCall"
    class="incoming-call"
>


    <div class="incoming-box">


        <div
            id="incomingAvatar"
            class="incoming-avatar"
        >
            👤
        </div>


        <div
            id="incomingName"
            class="incoming-title"
        >
            Usuario GESBASE
        </div>


        <div class="incoming-text">
            Te está llamando por videollamada
        </div>


        <div class="incoming-actions">


            <button
                type="button"
                class="incoming-button incoming-reject"
                id="btnRejectCall"
            >
                Rechazar
            </button>


            <button
                type="button"
                class="incoming-button incoming-accept"
                id="btnAcceptCall"
            >
                Aceptar
            </button>


        </div>

    </div>

</div>



<div
    id="toast"
    class="toast"
></div>



<script type="module">


/* =========================================================
   FIREBASE
========================================================= */

import {
    auth,
    db,
    almacenamiento
} from "./Js/firebase.js";


import {
    onAuthStateChanged
} from "https://www.gstatic.com/firebasejs/12.18.0/firebase-auth.js";


import {
    collection,
    query,
    where,
    getDocs,
    getDoc,
    doc,
    addDoc,
    updateDoc,
    setDoc,
    serverTimestamp,
    onSnapshot
} from "https://www.gstatic.com/firebasejs/12.18.0/firebase-firestore.js";


import {
    ref,
    uploadBytes,
    getDownloadURL
} from "https://www.gstatic.com/firebasejs/12.18.0/firebase-storage.js";



/* =========================================================
   ELEMENTOS
========================================================= */

const contactsPanel =
    document.getElementById(
        "contactsPanel"
    );

const contactsList =
    document.getElementById(
        "contactsList"
    );

const contactSearch =
    document.getElementById(
        "contactSearch"
    );

const chatPanel =
    document.getElementById(
        "chatPanel"
    );

const messagesContainer =
    document.getElementById(
        "messages"
    );

const messageInput =
    document.getElementById(
        "messageInput"

async function cargarContactos(){

    contactsPanel.style.display =
        "block";

    chatPanel.style.display =
        "none";


    contactsList.innerHTML =
        `<div class="chat-empty">

            <div class="chat-empty-box">

                <div class="chat-empty-icon">
                    ⏳
                </div>

                <div class="chat-empty-title">
                    Cargando contactos
                </div>

            </div>

        </div>`;


    try{

        /*
         * Buscamos conexiones enviadas.
         */

        const qEnviadas =
            query(
                collection(
                    db,
                    "conexiones"
                ),
                where(
                    "emisor",
                    "==",
                    usuarioActual.uid
                )
            );


        /*
         * Buscamos conexiones recibidas.
         */

        const qRecibidas =
            query(
                collection(
                    db,
                    "conexiones"
                ),
                where(
                    "receptor",
                    "==",
                    usuarioActual.uid
                )
            );


        const [
            enviadas,
            recibidas
        ] =
            await Promise.all([
                getDocs(qEnviadas),
                getDocs(qRecibidas)
            ]);


        const uids =
            new Set();


        enviadas.forEach(
            documento => {

                const datos =
                    documento.data();


                if(
                    datos.estado ===
                    "aceptada"
                ){

                    if(
                        datos.receptor
                    ){

                        uids.add(
                            datos.receptor
                        );

                    }

                }

            }
        );


        recibidas.forEach(
            documento => {

                const datos =
                    documento.data();


                if(
                    datos.estado ===
                    "aceptada"
                ){

                    if(
                        datos.emisor
                    ){

                        uids.add(
                            datos.emisor
                        );

                    }

                }

            }
        );


        contactos = [];


        /*
         * Cargamos el perfil de cada contacto.
         */

        for(
            const uid of uids
        ){

            try{

                let datos =
                    null;


                const refDirectorio =
                    doc(
                        db,
                        "directorio_red",
                        uid
                    );


                const snapDirectorio =
                    await getDoc(
                        refDirectorio
                    );


                if(
                    snapDirectorio.exists()
                ){

                    datos =
                        snapDirectorio.data();

                }else{

                    const refUsuario =
                        doc(
                            db,
                            "usuariosRed",
                            uid
                        );


                    const snapUsuario =
                        await getDoc(
                            refUsuario
                        );


                    if(
                        snapUsuario.exists()
                    ){

                        datos =
                            snapUsuario.data();

                    }

                }


                if(!datos){

                    datos = {};

                }


                contactos.push({

                    uid:
                        uid,

                    ...datos

                });


            }catch(error){

                console.error(
                    "Error cargando contacto:",
                    uid,
                    error
                );

            }

        }


        contactos.sort(
            (a,b) =>
                obtenerNombreContacto(a)
                    .localeCompare(
                        obtenerNombreContacto(b),
                        "es"
                    )
        );


        renderizarContactos(
            contactos
        );


    }catch(error){

        console.error(
            "Error cargando contactos:",
            error
        );


        contactsList.innerHTML =
            `<div class="chat-empty">

                <div class="chat-empty-box">

                    <div class="chat-empty-icon">
                        ⚠️
                    </div>

                    <div class="chat-empty-title">
                        No se pudieron cargar tus contactos
                    </div>

                    <div class="chat-empty-text">
                        Intentá nuevamente.
                    </div>

                </div>

            </div>`;

    }

}



/* =========================================================
   NOMBRE CONTACTO
========================================================= */

function obtenerNombreContacto(
    contacto
){

    if(
        contacto.nombreCompleto
    ){

        return contacto.nombreCompleto;

    }


    if(
        contacto.nombre
    ){

        const nombre =
            (
                contacto.nombre +
                " " +
                (
                    contacto.apellido ||
                    ""
                )
            ).trim();


        if(nombre){

            return nombre;

        }

    }


    return "Usuario GESBASE";

}

function renderizarContactos(

){

    }


    lista.forEach(
        contacto => {

            const button =

            button.className =

            const nombre =

            if(foto){

                const img =

                img.onerror =

                        avatar.innerHTML =

                            );

                    };


                avatar.appendChild(
                    img
                );

            }else{

                avatar.textContent =

                    );

            }


            /*
             * Indicador visual.

             * Se considera activo si el perfil
             * informa activo === true.
             */

            if(

                true ||

            ){

                const dot =
                    document.createElement(
                        "span"

                dot.className =

                avatar.appendChild(

                    "span"
                );


            unread.className =

            unread.dataset.uid =

            button.appendChild(
                avatar
            );


            button.appendChild(

            button.appendChild(

            button.addEventListener(

/* =========================================================
   FECHA
========================================================= */

function obtenerFechaMensaje(
    mensaje
){

    if(
        typeof mensaje.fechaCliente ===
        "number"
    ){

        return mensaje.fechaCliente;

    }


    if(
        mensaje.fecha &&
        typeof mensaje.fecha.toMillis ===
        "function"
    ){

        return mensaje.fecha.toMillis();

    }


    if(
        mensaje.fecha &&
        typeof mensaje.fecha.seconds ===
        "number"
    ){

        return mensaje.fecha.seconds *
            1000;

    }


    return 0;

}



/* =========================================================
   RENDER MENSAJE
========================================================= */

function renderMensaje(
    mensaje
){

    if(
        mensajesMostrados.has(
            mensaje.id
        )
    ){

        return;

    }


    mensajesMostrados.add(
        mensaje.id
    );


    const esMio =
        mensaje.emisorUid ===
        usuarioActual.uid;


    const fila =
        document.createElement(
            "div"
        );


    fila.className =
        "message-row " +
        (
            esMio
                ? "mine"
                : "theirs"
        );


    const burbuja =
        document.createElement(
            "div"
        );


    burbuja.className =
        "message " +
        (
            esMio
                ? "mine"
                : "theirs"
        );


    /*
     * FOTO
     */

    if(
        mensaje.tipo ===
        "foto" &&
        mensaje.archivoUrl
    ){

        const img =
            document.createElement(
                "img"
            );


        img.className =
            "message-image";


        img.src =
            mensaje.archivoUrl;


        img.alt =
            "Foto";


        img.loading =
            "lazy";


        img.onclick =
            () => {

                window.open(
                    mensaje.archivoUrl,
                    "_blank"
                );

            };


        burbuja.appendChild(
            img
        );

    }


    /*
     * VIDEO
     */

    else if(
        mensaje.tipo ===
        "video" &&
        mensaje.archivoUrl
    ){

        const video =
            document.createElement(
                "video"
            );


        video.className =
            "message-video";


        video.src =
            mensaje.archivoUrl;


        video.controls =
            true;


        video.playsInline =
            true;


        burbuja.appendChild(
            video
        );

    }


    /*
     * ARCHIVO
     */

    else if(
        mensaje.tipo ===
        "archivo" &&
        mensaje.archivoUrl
    ){

        const link =
            document.createElement(
                "a"
            );


        link.className =
            "file-message";


        link.href =
            mensaje.archivoUrl;


        link.target =
            "_blank";


        link.rel =
            "noopener";


        link.textContent =
            "📎 " +
            (
                mensaje.nombreArchivo ||
                "Abrir archivo"
            );


        burbuja.appendChild(
            link
        );

    }


    /*
     * MENSAJE DE TEXTO
     */

    else{

        const texto =
            document.createElement(
                "div"
            );


        texto.className =
            "message-text";


        texto.textContent =
            mensaje.contenido ||
            "";


        burbuja.appendChild(
            texto
        );

    }


    const hora =
        document.createElement(
            "span"
        );


    hora.className =
        "message-time";


    hora.textContent =
        formatearHora(
            mensaje
        );


    burbuja.appendChild(
        hora
    );


    fila.appendChild(
        burbuja
    );


    messagesContainer.appendChild(
        fila
    );

}



/* =========================================================
   HORA
========================================================= */

function formatearHora(
    mensaje
){

    const timestamp =
        obtenerFechaMensaje(
            mensaje
        );


    if(!timestamp){

        return "";

    }


    return new Intl.DateTimeFormat(
        "es-AR",
        {
            hour:
                "2-digit",

            minute:
                "2-digit"
        }
    ).format(
        new Date(
            timestamp
        )
    );

}

/* =========================================================
   SUBIR ARCHIVO
========================================================= */

async function subirArchivo(
    archivo,
    tipo
){

    if(
        !usuarioConversacion ||
        !archivo
    ){

        return;

    }


    try{

        mostrarToast(
            "Subiendo archivo..."
        );


        /*
         * Límite razonable para evitar
         * subidas accidentales gigantes.
         */

        const limite =
            tipo === "video"
                ? 100 * 1024 * 1024
                : 25 * 1024 * 1024;


        if(
            archivo.size >
            limite
        ){

            mostrarToast(
                tipo === "video"
                    ? "El video supera los 100 MB."
                    : "El archivo supera los 25 MB."
            );


            return;

        }


        const extension =
            archivo.name.includes(".")
                ? archivo.name
                    .split(".")
                    .pop()
                : "archivo";


        const ruta =
            "mensajes/" +
            usuarioActual.uid +
            "/" +
            usuarioConversacion +
            "/" +
            Date.now() +
            "_" +
            Math.random()
                .toString(36)
                .slice(2) +
            "." +
            extension;


        const referenciaStorage =
            ref(
                almacenamiento,
                ruta
            );


        await uploadBytes(
            referenciaStorage,
            archivo
        );


        const url =
            await getDownloadURL(
                referenciaStorage
            );


        const referenciaMensaje =
            await addDoc(
                collection(
                    db,
                    "mensajes"
                ),
                {

                    emisorUid:
                        usuarioActual.uid,

                    receptorUid:
                        usuarioConversacion,

                    tipo:
                        tipo,

                    archivoUrl:
                        url,

                    nombreArchivo:
                        archivo.name,

                    mimeType:
                        archivo.type,

                    tamano:
                        archivo.size,

                    fecha:
                        serverTimestamp(),

                    fechaCliente:
                        Date.now(),

                    leido:
                        false

                }
            );


        const vacio =
            messagesContainer.querySelector(
                ".chat-empty"
            );


        if(vacio){

            messagesContainer.innerHTML =
                "";

            mensajesMostrados.clear();

        }


        renderMensaje({

            id:
                referenciaMensaje.id,

            emisorUid:
                usuarioActual.uid,

            receptorUid:
                usuarioConversacion,

            tipo:
                tipo,

            archivoUrl:
                url,

            nombreArchivo:
                archivo.name,

            fechaCliente:
                Date.now(),

            leido:
                false

        });


        desplazarAlFinal();


        mostrarToast(
            tipo === "foto"
                ? "Foto enviada."
                : (
                    tipo === "video"
                        ? "Video enviado."
                        : "Archivo enviado."
                )
        );


    }catch(error){

        console.error(
            "Error subiendo archivo:",
            error
        );


        mostrarToast(
            "No se pudo enviar el archivo."
        );

    }

}

/* =========================================================
   WEBRTC: CREAR PEER
========================================================= */

function crearPeerConnection(){

    const pc =
        new RTCPeerConnection(
            configuracionRTC
        );


    pc.ontrack =
        evento => {

            if(
                evento.streams &&
                evento.streams[0]
            ){

                remoteVideo.srcObject =
                    evento.streams[0];

            }

        };


    pc.onicecandidate =
        async evento => {

            if(
                !evento.candidate ||
                !llamadaActual
            ){

                return;

            }


            try{

                await addDoc(
                    collection(
                        db,
                        "llamadas",
                        llamadaActual.id,
                        "candidatos"
                    ),
                    {

                        uid:
                            usuarioActual.uid,

                        candidate:
                            evento.candidate.toJSON(),

                        fecha:
                            serverTimestamp()

                    }
                );

            }catch(error){

                console.error(
                    "Error ICE:",
                    error
                );

            }

        };


    return pc;

}

/* =========================================================
   INICIAR LLAMADA
========================================================= */

async function iniciarLlamada(
    video
){

    if(
        !usuarioConversacion
    ){

        return;

    }


    try{

        if(
            !navigator.mediaDevices ||
            !navigator.mediaDevices.getUserMedia
        ){

            mostrarToast(
                "Tu navegador no permite llamadas desde esta conexión."
            );

            return;

        }


        callOverlay.classList.add(
            "open"
        );


        callTitle.textContent =
            video
                ? "📹 Videollamada"
                : "📞 Llamada";


        callStatus.textContent =
            "Solicitando cámara y micrófono...";


        localStream =
            await navigator.mediaDevices.getUserMedia({

                video:
                    video,

                audio:
                    true

            });


        localVideo.srcObject =
            localStream;


        peerConnection =
            crearPeerConnection();


        localStream
            .getTracks()
            .forEach(
                track => {

                    peerConnection.addTrack(
                        track,
                        localStream
                    );

                }
            );


        const llamadaRef =
            await addDoc(
                collection(
                    db,
                    "llamadas"
                ),
                {

                    emisorUid:
                        usuarioActual.uid,

                    receptorUid:
                        usuarioConversacion,

                    tipo:
                        video
                            ? "video"
                            : "audio",

                    estado:
                        "llamando",

                    fecha:
                        serverTimestamp(),

                    fechaCliente:
                        Date.now()

                }
            );


        llamadaActual = {

            id:
                llamadaRef.id,

            emisorUid:
                usuarioActual.uid,

            receptorUid:
                usuarioConversacion,

            tipo:
                video
                    ? "video"
                    : "audio"

        };


        /*
         * Escuchar cambios de la llamada.
         */

        escucharEstadoLlamada(
            llamadaRef.id
        );


        /*
         * Escuchar candidatos remotos.
         */

        escucharCandidatos(
            llamadaRef.id,
            usuarioActual.uid
        );


        const oferta =
            await peerConnection.createOffer();


        await peerConnection.setLocalDescription(
            oferta
        );


        await updateDoc(
            llamadaRef,
            {

                oferta: {

                    type:
                        oferta.type,

                    sdp:
                        oferta.sdp

                }

            }
        );


        callStatus.textContent =
            "Llamando a " +
            obtenerNombreContacto(
                perfilConversacion ||
                {}
            ) +
            "...";


    }catch(error){

        console.error(
            "Error iniciando llamada:",
            error
        );


        cerrarLlamada();


        mostrarToast(
            "No se pudo iniciar la llamada. Revisá permisos de cámara y micrófono."
        );

    }

}



/* =========================================================
   ESCUCHAR LLAMADAS ENTRANTES
========================================================= */

function escucharLlamadasEntrantes(){

    if(
        unsubscribeIncomingCall
    ){

        unsubscribeIncomingCall();

    }


    const consulta =
        query(
            collection(
                db,
                "llamadas"
            ),
            where(
                "receptorUid",
                "==",
                usuarioActual.uid
            )
        );


    unsubscribeIncomingCall =
        onSnapshot(
            consulta,
            async snapshot => {

                for(
                    const cambio of
                    snapshot.docChanges()
                ){

                    if(
                        cambio.type !==
                        "added"
                    ){

                        continue;

                    }


                    const datos =
                        cambio.doc.data();


                    if(
                        datos.estado !==
                        "llamando"
                    ){

                        continue;

                    }


                    /*
                     * Evitamos mostrar llamadas
                     * antiguas.
                     */

                    const fecha =
                        datos.fechaCliente ||
                        0;


                    if(
                        fecha &&
                        Date.now() -
                        fecha >
                        120000
                    ){

                        continue;

                    }


                    mostrarLlamadaEntrante({

                        id:
                            cambio.doc.id,

                        ...datos

                    });

                }

            },
            error => {

                console.error(
                    "Error escuchando llamadas:",
                    error
                );

            }
        );

}

/* =========================================================
   ESTADO LLAMADA
========================================================= */

function escucharEstadoLlamada(
    llamadaId
){

    if(
        unsubscribeCall
    ){

        unsubscribeCall();

    }


    unsubscribeCall =
        onSnapshot(

            doc(
                db,
                "llamadas",
                llamadaId
            ),

            async snapshot => {

                if(
                    !snapshot.exists()
                ){

                    cerrarLlamada();

                    return;

                }


                const datos =
                    snapshot.data();


                if(
                    datos.estado ===
                    "finalizada" ||
                    datos.estado ===
                    "rechazada"
                ){

                    cerrarLlamada();

                    return;

                }


                /*
                 * El emisor recibe la respuesta.
                 */

                if(
                    usuarioActual.uid ===
                    datos.emisorUid &&
                    datos.respuesta &&
                    peerConnection
                ){

                    try{

                        const descripcion =
                            peerConnection
                                .currentRemoteDescription;


                        if(
                            !descripcion
                        ){

                            await peerConnection.setRemoteDescription(
                                datos.respuesta
                            );


                            callStatus.textContent =
                                "Llamada conectada.";

                        }

                    }catch(error){

                        console.error(
                            "Error respuesta:",
                            error
                        );

                    }

                }

            },

            error => {

                console.error(
                    "Error estado llamada:",
                    error
                );

            }

        );

}



/* =========================================================
   CANDIDATOS ICE
========================================================= */

function escucharCandidatos(
    llamadaId,
    miUid
){

    const consulta =
        query(
            collection(
                db,
                "llamadas",
                llamadaId,
                "candidatos"
            )
        );


    onSnapshot(
        consulta,
        snapshot => {

            snapshot.docChanges()
                .forEach(
                    async cambio => {

                        if(
                            cambio.type !==
                            "added"
                        ){

                            return;

                        }


                        const datos =
                            cambio.doc.data();


                        /*
                         * Ignoramos nuestros propios
                         * candidatos.
                         */

                        if(
                            datos.uid ===
                            miUid
                        ){

                            return;

                        }


                        if(
                            !peerConnection ||
                            !datos.candidate
                        ){

                            return;

                        }


                        try{

                            await peerConnection.addIceCandidate(
                                datos.candidate
                            );

                        }catch(error){

                            console.error(
                                "Error ICE remoto:",
                                error
                            );

                        }

                    }
                );

        },
        error => {

            console.error(
                "Error escuchando ICE:",
                error
            );

        }
    );

}



/* =========================================================
   MIC
========================================================= */

btnToggleMic.addEventListener(
    "click",
    () => {

        if(
            !localStream
        ){

            return;

        }


        const tracks =
            localStream.getAudioTracks();


        tracks.forEach(
            track => {

                track.enabled =
                    !track.enabled;

            }
        );


        const activo =
            tracks.some(
                track =>
                    track.enabled
            );


        btnToggleMic.textContent =
            activo
                ? "🎤"
                : "🔇";

    }
);



/* =========================================================
   CAMARA
========================================================= */

btnToggleCamera.addEventListener(
    "click",
    () => {

        if(
            !localStream
        ){

            return;

        }


        const tracks =
            localStream.getVideoTracks();


        if(
            tracks.length ===
            0
        ){

            mostrarToast(
                "Esta llamada es solo de audio."
            );

            return;

        }


        tracks.forEach(
            track => {

                track.enabled =
                    !track.enabled;

            }
        );


        const activa =
            tracks.some(
                track =>
                    track.enabled
            );


        btnToggleCamera.textContent =
            activa
                ? "📷"
                : "🚫";

    }
);



/* =========================================================
   FINALIZAR
========================================================= */

btnEndCall.addEventListener(
    "click",
    async () => {

        if(
            llamadaActual
        ){

            try{

                await updateDoc(
                    doc(
                        db,
                        "llamadas",
                        llamadaActual.id
                    ),
                    {

                        estado:
                            "finalizada",

                        finalizadaPor:
                            usuarioActual.uid,

                        fechaFin:
                            serverTimestamp()

                    }
                );

            }catch(error){

                console.error(
                    error
                );

            }

        }


        cerrarLlamada();

    }
);



/* =========================================================
   CERRAR LLAMADA
========================================================= */

function cerrarLlamada(){

    if(
        unsubscribeCall
    ){

        unsubscribeCall();

        unsubscribeCall =
            null;

    }


    if(
        peerConnection
    ){

        try{

            peerConnection.close();

        }catch(error){

            console.error(
                error
            );

        }

        peerConnection =
            null;

    }


    if(
        localStream
    ){

        localStream
            .getTracks()
            .forEach(
                track => {

                    track.stop();

                }
            );


        localStream =
            null;

    }


    localVideo.srcObject =
        null;


    remoteVideo.srcObject =
        null;


    llamadaActual =
        null;


    callOverlay.classList.remove(
        "open"
    );


    callStatus.textContent =
        "Conectando...";

}



/* =========================================================
   ESCAPE
========================================================= */

document.addEventListener(
    "keydown",
    evento => {

        if(
            evento.key ===
            "Escape"
        ){

            if(
                callOverlay.classList.contains(
                    "open"
                )
            ){

                btnEndCall.click();

            }

        }

    }
);


</script>
