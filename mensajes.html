<!DOCTYPE html>
<html lang="es-AR">

<head>

<meta charset="UTF-8">

<meta
    name="viewport"
    content="width=device-width, initial-scale=1.0, viewport-fit=cover"
>

<meta
    name="theme-color"
    content="#111827"
>

<meta
    name="description"
    content="Mensajes de Red GESBASE. Comunicate con tus conexiones profesionales."
>

<title>Mensajes - Red GESBASE</title>


<style>

*{
    box-sizing:border-box;
    margin:0;
    padding:0;
}

html,
body{
    width:100%;
    height:100%;
}

body{
    font-family:Arial,Helvetica,sans-serif;
    background:#f3f4f6;
    color:#111827;
    overflow:hidden;
}


/* =========================
   APP
========================= */

.app{
    width:100%;
    height:100vh;
    height:100dvh;
    display:flex;
    flex-direction:column;
}


/* =========================
   HEADER
========================= */

header{
    flex-shrink:0;
    background:#111827;
    color:white;
    padding:
        max(10px, env(safe-area-inset-top))
        14px
        12px;
    box-shadow:0 2px 8px rgba(0,0,0,.18);
    z-index:20;
}

.header-inner{
    width:100%;
    max-width:1000px;
    margin:auto;
    display:flex;
    align-items:center;
    gap:10px;
}

.btn-volver{
    width:40px;
    height:40px;
    border:0;
    border-radius:50%;
    background:#374151;
    color:white;
    font-size:27px;
    line-height:1;
    cursor:pointer;
    flex-shrink:0;
}

.header-contact{
    display:flex;
    align-items:center;
    gap:10px;
    min-width:0;
    flex:1;
}

.header-avatar{
    width:42px;
    height:42px;
    border-radius:50%;
    background:#e5e7eb;
    color:#111827;
    display:flex;
    align-items:center;
    justify-content:center;
    font-size:18px;
    font-weight:bold;
    overflow:hidden;
    flex-shrink:0;
}

.header-avatar img{
    width:100%;
    height:100%;
    object-fit:cover;
}

.header-info{
    min-width:0;
}

.header-name{
    font-size:16px;
    font-weight:700;
    white-space:nowrap;
    overflow:hidden;
    text-overflow:ellipsis;
}

.header-status{
    font-size:12px;
    color:#d1d5db;
    margin-top:2px;
}


/* =========================
   CONTADOR MENSAJES
========================= */

.header-unread{
    min-width:24px;
    height:24px;
    padding:0 7px;
    border-radius:20px;
    background:#ef4444;
    color:white;
    display:none;
    align-items:center;
    justify-content:center;
    font-size:11px;
    font-weight:bold;
    flex-shrink:0;
}

.header-unread.visible{
    display:flex;
}


/* =========================
   CHAT
========================= */

.chat{
    flex:1;
    min-height:0;
    width:100%;
    display:flex;
    justify-content:center;
}

.chat-inner{
    width:100%;
    max-width:1000px;
    display:flex;
    flex-direction:column;
    min-height:0;
}


/* =========================
   MENSAJES
========================= */

.messages{
    flex:1;
    min-height:0;
    overflow-y:auto;
    padding:18px 14px;
    display:flex;
    flex-direction:column;
    gap:8px;
    scroll-behavior:smooth;
}

.message-row{
    width:100%;
    display:flex;
}

.message-row.mine{
    justify-content:flex-end;
}

.message-row.theirs{
    justify-content:flex-start;
}

.message{
    max-width:min(78%, 600px);
    padding:10px 13px;
    border-radius:16px;
    font-size:14px;
    line-height:1.4;
    word-break:break-word;
    white-space:pre-wrap;
    box-shadow:0 1px 3px rgba(0,0,0,.08);
}

.message.mine{
    background:#111827;
    color:white;
    border-bottom-right-radius:5px;
}

.message.theirs{
    background:white;
    color:#111827;
    border-bottom-left-radius:5px;
}

.message-time{
    display:block;
    font-size:10px;
    margin-top:5px;
    opacity:.65;
    text-align:right;
}


/* =========================
   ESTADO VACIO
========================= */

.chat-empty{
    flex:1;
    display:flex;
    align-items:center;
    justify-content:center;
    text-align:center;
    padding:30px;
    color:#6b7280;
}

.chat-empty-box{
    max-width:350px;
}

.chat-empty-icon{
    font-size:45px;
    margin-bottom:12px;
}

.chat-empty-title{
    font-size:18px;
    font-weight:700;
    color:#111827;
    margin-bottom:7px;
}

.chat-empty-text{
    font-size:14px;
    line-height:1.5;
}


/* =========================
   LOADING
========================= */

.loading{
    flex:1;
    display:flex;
    align-items:center;
    justify-content:center;
    color:#6b7280;
    font-size:14px;
}


/* =========================
   COMPOSER
========================= */

.composer{
    flex-shrink:0;
    background:white;
    border-top:1px solid #e5e7eb;
    padding:10px;
    padding-bottom:
        max(10px, env(safe-area-inset-bottom));
}

.composer-inner{
    width:100%;
    display:flex;
    align-items:flex-end;
    gap:8px;
}

.message-input{
    flex:1;
    min-width:0;
    resize:none;
    min-height:42px;
    max-height:120px;
    border:1px solid #d1d5db;
    border-radius:21px;
    padding:11px 15px;
    outline:none;
    font-family:inherit;
    font-size:14px;
    line-height:1.35;
    background:#f9fafb;
}

.message-input:focus{
    border-color:#6b7280;
    background:white;
}

.btn-enviar{
    width:44px;
    height:44px;
    border:0;
    border-radius:50%;
    background:#111827;
    color:white;
    font-size:19px;
    cursor:pointer;
    flex-shrink:0;
}

.btn-enviar:disabled{
    opacity:.5;
    cursor:not-allowed;
}


/* =========================
   TOAST
========================= */

.toast{
    position:fixed;
    left:50%;
    bottom:90px;
    transform:translateX(-50%);
    background:#111827;
    color:white;
    padding:11px 16px;
    border-radius:10px;
    font-size:13px;
    display:none;
    z-index:1000;
    max-width:90%;
    text-align:center;
}

.toast.show{
    display:block;
}


/* =========================
   TABLET / PC
========================= */

@media(min-width:700px){

    .messages{
        padding:22px;
    }

    .composer{
        padding:12px 22px;
    }

}


/* =========================
   CELULAR
========================= */

@media(max-width:600px){

    .header-name{
        font-size:15px;
    }

    .message{
        max-width:84%;
    }

    .messages{
        padding:14px 10px;
    }

}


/* =========================
   CELULAR PEQUEÑO
========================= */

@media(max-width:390px){

    .btn-volver{
        width:36px;
        height:36px;
        font-size:24px;
    }

    .header-avatar{
        width:38px;
        height:38px;
    }

    .message{
        max-width:88%;
    }

}

</style>

</head>


<body>


<div class="app">


<header>

    <div class="header-inner">


        <button
            type="button"
            class="btn-volver"
            id="btnVolver"
            aria-label="Volver"
        >
            ‹
        </button>


        <div class="header-contact">


            <div
                class="header-avatar"
                id="headerAvatar"
            >
                👤
            </div>


            <div class="header-info">

                <div
                    class="header-name"
                    id="headerName"
                >
                    Mensajes
                </div>

                <div
                    class="header-status"
                    id="headerStatus"
                >
                    Red GESBASE
                </div>

            </div>


        </div>


        <div
            id="headerUnread"
            class="header-unread"
        >
            0
        </div>


    </div>

</header>



<main class="chat">

    <div class="chat-inner">


        <div
            id="messages"
            class="messages"
        >

            <div class="loading">
                Cargando conversación...
            </div>

        </div>



        <div
            id="composer"
            class="composer"
        >

            <div class="composer-inner">


                <textarea
                    id="messageInput"
                    class="message-input"
                    placeholder="Escribí un mensaje..."
                    rows="1"
                    maxlength="5000"
                    autocomplete="off"
                ></textarea>


                <button
                    type="button"
                    id="btnEnviar"
                    class="btn-enviar"
                    aria-label="Enviar mensaje"
                    title="Enviar mensaje"
                >
                    ➤
                </button>


            </div>

        </div>


    </div>

</main>



<div
    id="toast"
    class="toast"
></div>


</div>



<script type="module">


/* =========================
   FIREBASE
========================= */

import {
    auth,
    db
} from "./Js/firebase.js";


import {
    onAuthStateChanged
} from "https://www.gstatic.com/firebasejs/12.18.0/firebase-auth.js";


import {
    collection,
    query,
    where,
    getDocs,
    getDoc,
    doc,
    addDoc,
    updateDoc,
    serverTimestamp
} from "https://www.gstatic.com/firebasejs/12.18.0/firebase-firestore.js";



/* =========================
   ELEMENTOS
========================= */

const messagesContainer =
    document.getElementById(
        "messages"
    );


const messageInput =
    document.getElementById(
        "messageInput"
    );


const btnEnviar =
    document.getElementById(
        "btnEnviar"
    );


const btnVolver =
    document.getElementById(
        "btnVolver"
    );


const headerName =
    document.getElementById(
        "headerName"
    );


const headerStatus =
    document.getElementById(
        "headerStatus"
    );


const headerAvatar =
    document.getElementById(
        "headerAvatar"
    );


const headerUnread =
    document.getElementById(
        "headerUnread"
    );


const toast =
    document.getElementById(
        "toast"
    );



/* =========================
   VARIABLES
========================= */

let usuarioActual = null;

let usuarioConversacion = null;

let perfilConversacion = null;

let cargandoMensajes = false;


/*
 * Guardamos los mensajes ya mostrados
 * para evitar duplicados.
 */

const mensajesMostrados =
    new Set();



/* =========================
   UID DE LA URL
========================= */

const parametros =
    new URLSearchParams(
        window.location.search
    );


const uidConversacion =
    parametros.get(
        "usuario"
    );



/* =========================
   TOAST
========================= */

function mostrarToast(
    mensaje
){

    toast.textContent =
        mensaje;

    toast.classList.add(
        "show"
    );


    setTimeout(
        () => {

            toast.classList.remove(
                "show"
            );

        },
        2500
    );

}



/* =========================
   AUTENTICACION
========================= */

onAuthStateChanged(
    auth,
    async (user) => {

        if(!user){

            window.location.href =
                "red-login.html";

            return;

        }


        usuarioActual =
            user;


        /*
         * Si se abrió:
         *
         * mensajes.html?usuario=UID
         *
         * cargamos directamente
         * esa conversación.
         */

        if(uidConversacion){

            if(
                uidConversacion ===
                usuarioActual.uid
            ){

                mostrarError(
                    "No podés abrir una conversación con vos mismo."
                );

                return;

            }


            usuarioConversacion =
                uidConversacion;


            await cargarPerfilConversacion();


            await cargarMensajes();


            await marcarMensajesComoLeidos();


            /*
             * Actualizamos el contador
             * después de abrir la conversación.
             */

            await actualizarContadorNoLeidos();

        }else{

            mostrarSinConversacion();

            /*
             * En mensajes sin conversación
             * también mostramos si existen
             * mensajes pendientes.
             */

            await actualizarContadorNoLeidos();

        }

    }
);



/* =========================
   PERFIL CONTACTO
========================= */

async function cargarPerfilConversacion(){

    if(!usuarioConversacion){

        return;

    }


    try{

        /*
         * Primero buscamos en directorio_red,
         * que es la información pública
         * utilizada por Red GESBASE.
         */

        const referencia =
            doc(
                db,
                "directorio_red",
                usuarioConversacion
            );


        const snapshot =
            await getDoc(
                referencia
            );


        if(
            snapshot.exists()
        ){

            perfilConversacion =
                {
                    uid:
                        usuarioConversacion,

                    ...snapshot.data()
                };

        }else{

            /*
             * Fallback a usuariosRed.
             */

            const referenciaRed =
                doc(
                    db,
                    "usuariosRed",
                    usuarioConversacion
                );


            const snapshotRed =
                await getDoc(
                    referenciaRed
                );


            if(
                snapshotRed.exists()
            ){

                perfilConversacion =
                    {
                        uid:
                            usuarioConversacion,

                        ...snapshotRed.data()
                    };

            }else{

                perfilConversacion =
                    {
                        uid:
                            usuarioConversacion,

                        nombreCompleto:
                            "Usuario GESBASE",

                        fotoURL:
                            "",

                        tipo:
                            "Usuario GESBASE"

                    };

            }

        }


        mostrarPerfilHeader();


    }catch(error){

        console.error(
            "Error cargando perfil:",
            error
        );


        perfilConversacion =
            {
                uid:
                    usuarioConversacion,

                nombreCompleto:
                    "Usuario GESBASE",

                fotoURL:
                    ""

            };


        mostrarPerfilHeader();

    }

}



/* =========================
   HEADER PERFIL
========================= */

function mostrarPerfilHeader(){

    const nombre =
        perfilConversacion?.nombreCompleto ||
        perfilConversacion?.nombre ||
        "Usuario GESBASE";


    headerName.textContent =
        nombre;


    const tipo =
        perfilConversacion?.tipo ||
        perfilConversacion?.rubro ||
        "Conexión de Red GESBASE";


    headerStatus.textContent =
        tipo;


    const foto =
        perfilConversacion?.fotoURL ||
        perfilConversacion?.fotoPerfil ||
        "";


    headerAvatar.innerHTML =
        "";


    if(foto){

        const img =
            document.createElement(
                "img"
            );


        img.src =
            foto;


        img.alt =
            "";


        img.onerror =
            () => {

                headerAvatar.innerHTML =
                    "";

                headerAvatar.textContent =
                    nombre
                        .charAt(0)
                        .toUpperCase();

            };


        headerAvatar.appendChild(
            img
        );

    }else{

        headerAvatar.textContent =
            nombre
                .charAt(0)
                .toUpperCase();

    }


    /*
     * Al tocar la foto/nombre del
     * contacto abrimos su perfil.
     */

    headerAvatar.style.cursor =
        "pointer";


    headerAvatar.onclick =
        () => {

            abrirPerfil(
                usuarioConversacion
            );

        };


    headerName.style.cursor =
        "pointer";


    headerName.onclick =
        () => {

            abrirPerfil(
                usuarioConversacion
            );

        };

}



/* =========================
   ABRIR PERFIL
========================= */

function abrirPerfil(
    uid
){

    if(!uid){

        return;

    }


    window.location.href =
        "red-perfil.html?uid=" +
        encodeURIComponent(
            uid
        );

}



/* =========================
   CARGAR MENSAJES
========================= */

async function cargarMensajes(){

    if(
        !usuarioActual ||
        !usuarioConversacion ||
        cargandoMensajes
    ){

        return;

    }


    cargandoMensajes =
        true;


    messagesContainer.innerHTML =
        `<div class="loading">
            Cargando conversación...
        </div>`;


    try{

        /*
         * Mensajes enviados por mí.
         */

        const qEnviados =
            query(
                collection(
                    db,
                    "mensajes"
                ),
                where(
                    "emisorUid",
                    "==",
                    usuarioActual.uid
                ),
                where(
                    "receptorUid",
                    "==",
                    usuarioConversacion
                )
            );


        /*
         * Mensajes recibidos.
         */

        const qRecibidos =
            query(
                collection(
                    db,
                    "mensajes"
                ),
                where(
                    "emisorUid",
                    "==",
                    usuarioConversacion
                ),
                where(
                    "receptorUid",
                    "==",
                    usuarioActual.uid
                )
            );


        /*
         * Hacemos las dos consultas
         * por separado para evitar
         * consultas compuestas.
         */

        const [
            snapshotEnviados,
            snapshotRecibidos
        ] =
            await Promise.all([
                getDocs(qEnviados),
                getDocs(qRecibidos)
            ]);


        const mensajes =
            [];


        snapshotEnviados.forEach(
            documento => {

                mensajes.push({

                    id:
                        documento.id,

                    ...documento.data()

                });

            }
        );


        snapshotRecibidos.forEach(
            documento => {

                mensajes.push({

                    id:
                        documento.id,

                    ...documento.data()

                });

            }
        );


        /*
         * Orden local por fecha.
         */

        mensajes.sort(
            (a,b) => {

                const fechaA =
                    obtenerFechaMensaje(
                        a
                    );


                const fechaB =
                    obtenerFechaMensaje(
                        b
                    );


                return fechaA -
                    fechaB;

            }
        );


        messagesContainer.innerHTML =
            "";


        mensajesMostrados.clear();


        if(
            mensajes.length === 0
        ){

            mostrarVacio();

        }else{

            mensajes.forEach(
                mensaje => {

                    renderMensaje(
                        mensaje
                    );

                }
            );

        }


        desplazarAlFinal();


    }catch(error){

        console.error(
            "Error cargando mensajes:",
            error
        );


        messagesContainer.innerHTML =
            `<div class="chat-empty">

                <div class="chat-empty-box">

                    <div class="chat-empty-icon">
                        ⚠️
                    </div>

                    <div class="chat-empty-title">
                        No se pudieron cargar los mensajes
                    </div>

                    <div class="chat-empty-text">
                        Intentá nuevamente.
                    </div>

                </div>

            </div>`;

    }finally{

        cargandoMensajes =
            false;

    }

}



/* =========================
   FECHA MENSAJE
========================= */

function obtenerFechaMensaje(
    mensaje
){

    if(
        typeof mensaje.fechaCliente ===
        "number"
    ){

        return mensaje.fechaCliente;

    }


    if(
        mensaje.fecha &&
        typeof mensaje.fecha.toMillis ===
        "function"
    ){

        return mensaje.fecha.toMillis();

    }


    if(
        mensaje.fecha &&
        mensaje.fecha.seconds
    ){

        return mensaje.fecha.seconds *
            1000;

    }


    return 0;

}



/* =========================
   RENDER MENSAJE
========================= */

function renderMensaje(
    mensaje
){

    if(
        mensajesMostrados.has(
            mensaje.id
        )
    ){

        return;

    }


    mensajesMostrados.add(
        mensaje.id
    );


    const esMio =
        mensaje.emisorUid ===
        usuarioActual.uid;


    const fila =
        document.createElement(
            "div"
        );


    fila.className =
        "message-row " +
        (
            esMio
                ? "mine"
                : "theirs"
        );


    const burbuja =
        document.createElement(
            "div"
        );


    burbuja.className =
        "message " +
        (
            esMio
                ? "mine"
                : "theirs"
        );


    const contenido =
        document.createElement(
            "span"
        );


    contenido.textContent =
        mensaje.contenido ||
        "";


    burbuja.appendChild(
        contenido
    );


    const hora =
        document.createElement(
            "span"
        );


    hora.className =
        "message-time";


    hora.textContent =
        formatearHora(
            mensaje
        );


    burbuja.appendChild(
        hora
    );


    fila.appendChild(
        burbuja
    );


    messagesContainer.appendChild(
        fila
    );

}



/* =========================
   HORA
========================= */

function formatearHora(
    mensaje
){

    const timestamp =
        obtenerFechaMensaje(
            mensaje
        );


    if(!timestamp){

        return "";

    }


    try{

        return new Intl.DateTimeFormat(
            "es-AR",
            {
                hour:
                    "2-digit",

                minute:
                    "2-digit"
            }
        ).format(
            new Date(
                timestamp
            )
        );

    }catch(error){

        return "";

    }

}



/* =========================
   MENSAJE VACIO
========================= */

function mostrarVacio(){

    messagesContainer.innerHTML =
        `<div class="chat-empty">

            <div class="chat-empty-box">

                <div class="chat-empty-icon">
                    💬
                </div>

                <div class="chat-empty-title">
                    Iniciá la conversación
                </div>

                <div class="chat-empty-text">
                    Enviá un mensaje para comenzar a hablar.
                </div>

            </div>

        </div>`;

}



/* =========================
   SIN CONVERSACION
========================= */

function mostrarSinConversacion(){

    headerName.textContent =
        "Mensajes";


    headerStatus.textContent =
        "Red GESBASE";


    messagesContainer.innerHTML =
        `<div class="chat-empty">

            <div class="chat-empty-box">

                <div class="chat-empty-icon">
                    💬
                </div>

                <div class="chat-empty-title">
                    Tus mensajes
                </div>

                <div class="chat-empty-text">
                    Abrí una conversación desde
                    tus conexiones para comenzar a chatear.
                </div>

            </div>

        </div>`;

}



/* =========================
   ENVIAR
========================= */

async function enviarMensaje(){

    if(
        !usuarioActual ||
        !usuarioConversacion
    ){

        mostrarToast(
            "Seleccioná una conversación."
        );

        return;

    }


    const contenido =
        messageInput.value.trim();


    if(!contenido){

        return;

    }


    if(
        contenido.length >
        5000
    ){

        mostrarToast(
            "El mensaje es demasiado largo."
        );

        return;

    }


    btnEnviar.disabled =
        true;


    try{

        /*
         * IMPORTANTE:
         *
         * El mensaje se guarda solamente
         * en "mensajes".
         *
         * NO se crea una notificación
         * en "notificaciones".
         */

        const referencia =
            await addDoc(
                collection(
                    db,
                    "mensajes"
                ),
                {

                    emisorUid:
                        usuarioActual.uid,

                    receptorUid:
                        usuarioConversacion,

                    contenido:
                        contenido,

                    fecha:
                        serverTimestamp(),

                    fechaCliente:
                        Date.now(),

                    leido:
                        false

                }
            );


        /*
         * Limpiamos el campo.
         */

        messageInput.value =
            "";


        ajustarTextarea();


        /*
         * Renderizamos inmediatamente
         * sin esperar una recarga.
         */

        const mensajeNuevo = {

            id:
                referencia.id,

            emisorUid:
                usuarioActual.uid,

            receptorUid:
                usuarioConversacion,

            contenido:
                contenido,

            fechaCliente:
                Date.now(),

            leido:
                false

        };


        /*
         * Si estaba mostrando
         * el estado vacío, lo quitamos.
         */

        const estadoVacio =
            messagesContainer.querySelector(
                ".chat-empty"
            );


        if(estadoVacio){

            messagesContainer.innerHTML =
                "";

            mensajesMostrados.clear();

        }


        renderMensaje(
            mensajeNuevo
        );


        desplazarAlFinal();


    }catch(error){

        console.error(
            "Error enviando mensaje:",
            error
        );


        mostrarToast(
            "No se pudo enviar el mensaje."
        );

    }finally{

        btnEnviar.disabled =
            false;

        messageInput.focus();

    }

}



/* =========================
   MARCAR LEIDOS
========================= */

async function marcarMensajesComoLeidos(){

    if(
        !usuarioActual ||
        !usuarioConversacion
    ){

        return;

    }


    try{

        const consulta =
            query(
                collection(
                    db,
                    "mensajes"
                ),
                where(
                    "emisorUid",
                    "==",
                    usuarioConversacion
                ),
                where(
                    "receptorUid",
                    "==",
                    usuarioActual.uid
                ),
                where(
                    "leido",
                    "==",
                    false
                )
            );


        const snapshot =
            await getDocs(
                consulta
            );


        /*
         * Actualizamos uno por uno.
         * Así evitamos necesitar un índice
         * compuesto adicional.
         */

        for(
            const documento of
            snapshot.docs
        ){

            try{

                await updateDoc(
                    doc(
                        db,
                        "mensajes",
                        documento.id
                    ),
                    {
                        leido:
                            true
                    }
                );

            }catch(errorUpdate){

                console.error(
                    "Error marcando mensaje:",
                    documento.id,
                    errorUpdate
                );

            }

        }


    }catch(error){

        console.error(
            "Error buscando mensajes no leídos:",
            error
        );

    }

}



/* =========================
   CONTADOR NO LEIDOS
========================= */

async function actualizarContadorNoLeidos(){

    if(!usuarioActual){

        return;

    }


    try{

        /*
         * Buscamos mensajes recibidos.
         */

        const consulta =
            query(
                collection(
                    db,
                    "mensajes"
                ),
                where(
                    "receptorUid",
                    "==",
                    usuarioActual.uid
                ),
                where(
                    "leido",
                    "==",
                    false
                )
            );


        const snapshot =
            await getDocs(
                consulta
            );


        const cantidad =
            snapshot.size;


        if(cantidad > 0){

            headerUnread.textContent =
                cantidad > 99
                    ? "99+"
                    : cantidad;


            headerUnread.classList.add(
                "visible"
            );

        }else{

            headerUnread.textContent =
                "0";


            headerUnread.classList.remove(
                "visible"
            );

        }


    }catch(error){

        console.error(
            "Error contador mensajes:",
            error
        );

        headerUnread.textContent =
            "0";

        headerUnread.classList.remove(
            "visible"
        );

    }

}



/* =========================
   SCROLL
========================= */

function desplazarAlFinal(){

    requestAnimationFrame(
        () => {

            messagesContainer.scrollTop =
                messagesContainer.scrollHeight;

        }
    );

}



/* =========================
   TEXTAREA
========================= */

function ajustarTextarea(){

    messageInput.style.height =
        "auto";


    const altura =
        Math.min(
            messageInput.scrollHeight,
            120
        );


    messageInput.style.height =
        altura + "px";

}



/* =========================
   BOTON ENVIAR
========================= */

btnEnviar.addEventListener(
    "click",
    enviarMensaje
);



/* =========================
   ENTER
========================= */

messageInput.addEventListener(
    "keydown",
    evento => {

        if(
            evento.key ===
            "Enter" &&
            !evento.shiftKey
        ){

            evento.preventDefault();

            enviarMensaje();

        }

    }
);



/* =========================
   TEXTAREA INPUT
========================= */

messageInput.addEventListener(
    "input",
    ajustarTextarea
);



/* =========================
   VOLVER
========================= */

btnVolver.addEventListener(
    "click",
    () => {

        /*
         * Si venimos desde conexiones,
         * volvemos a conexiones.
         */

        window.location.href =
            "conexiones.html";

    }
);


function mostrarError(
    mensaje
){

    messagesContainer.innerHTML =
        `<div class="chat-empty">

            <div class="chat-empty-box">

                <div class="chat-empty-icon">
                    ⚠️
                </div>

                <div class="chat-empty-title">
                    No se puede abrir esta conversación
                </div>

                <div class="chat-empty-text">
                    ${mensaje}
                </div>

            </div>

        </div>`;


    document.getElementById(
        "composer"
    ).style.display =
        "none";

}



</script>
