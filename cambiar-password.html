<!DOCTYPE html>
<html lang="es">

<head>

<meta charset="UTF-8">

<meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
>

<meta
    name="theme-color"
    content="#111827"
>

<title>GESBASE - Cambiar contraseña</title>

<style>

*{
    box-sizing:border-box;
    margin:0;
    padding:0;
}

body{

    font-family:
        Arial,
        sans-serif;

    background:
        linear-gradient(
            135deg,
            #111827,
            #1f2937
        );

    min-height:100vh;

    display:flex;

    align-items:center;

    justify-content:center;

    padding:20px;

}

.contenedor{

    width:100%;

    max-width:430px;

    background:#ffffff;

    border-radius:22px;

    padding:30px 25px;

    box-shadow:
        0 20px 50px
        rgba(0,0,0,.30);

}

.logo{

    text-align:center;

    font-size:30px;

    font-weight:bold;

    color:#111827;

    margin-bottom:8px;

}

.subtitulo{

    text-align:center;

    color:#6b7280;

    font-size:15px;

    margin-bottom:25px;

}

.alerta{

    background:#fff7ed;

    border:1px solid #fed7aa;

    color:#9a3412;

    padding:15px;

    border-radius:12px;

    font-size:14px;

    line-height:1.5;

    margin-bottom:22px;

}

label{

    display:block;

    font-weight:bold;

    color:#374151;

    margin-bottom:7px;

    font-size:14px;

}

.grupo{

    margin-bottom:18px;

}

input{

    width:100%;

    padding:14px;

    border:

        1px solid #d1d5db;

    border-radius:11px;

    font-size:16px;

    outline:none;

}

input:focus{

    border-color:#111827;

    box-shadow:
        0 0 0 3px
        rgba(17,24,39,.10);

}

.requisitos{

    background:#f3f4f6;

    padding:13px;

    border-radius:10px;

    font-size:13px;

    color:#4b5563;

    line-height:1.6;

    margin-bottom:20px;

}

button{

    width:100%;

    border:none;

    padding:15px;

    border-radius:12px;

    background:#111827;

    color:white;

    font-size:16px;

    font-weight:bold;

    cursor:pointer;

}

button:disabled{

    opacity:.6;

    cursor:not-allowed;

}

.mensaje{

    display:none;

    margin-top:18px;

    padding:13px;

    border-radius:10px;

    font-size:14px;

    text-align:center;

}

.exito{

    display:block;

    background:#ecfdf5;

    color:#047857;

    border:1px solid #a7f3d0;

}

.error{

    display:block;

    background:#fef2f2;

    color:#b91c1c;

    border:1px solid #fecaca;

}

</style>

</head>


<body>


<div class="contenedor">

    <div class="logo">
        GESBASE
    </div>

    <div class="subtitulo">
        Tu empresa. Todo organizado.
    </div>


    <div class="alerta">

        🔐 <strong>Primer acceso</strong><br>

        La contraseña que utilizaste es
        temporal.

        Por seguridad, tenés que crear
        una nueva contraseña antes de
        continuar.

    </div>


    <div class="grupo">

        <label for="nuevaPassword">
            Nueva contraseña
        </label>

        <input
            type="password"
            id="nuevaPassword"
            placeholder="Ingresá tu nueva contraseña"
            autocomplete="new-password"
        >

    </div>


    <div class="grupo">

        <label for="repetirPassword">
            Repetir nueva contraseña
        </label>

        <input
            type="password"
            id="repetirPassword"
            placeholder="Repetí tu nueva contraseña"
            autocomplete="new-password"
        >

    </div>


    <div class="requisitos">

        <strong>La contraseña debe tener:</strong><br>

        • Mínimo 8 caracteres<br>
        • Se recomienda combinar letras y números<br>
        • Las dos contraseñas deben coincidir

    </div>


    <button
        id="btnCambiar"
    >
        🔐 CAMBIAR CONTRASEÑA
    </button>


    <div
        id="mensaje"
        class="mensaje"
    ></div>

</div>


<script type="module">

import {
    auth,
    db
} from "./Js/firebase.js";


import {
    onAuthStateChanged,
    updatePassword
} from "https://www.gstatic.com/firebasejs/12.18.0/firebase-auth.js";


import {
    collection,
    query,
    where,
    getDocs,
    limit,
    updateDoc,
    serverTimestamp
} from "https://www.gstatic.com/firebasejs/12.18.0/firebase-firestore.js";


const nuevaPassword =
    document.getElementById(
        "nuevaPassword"
    );


const repetirPassword =
    document.getElementById(
        "repetirPassword"
    );


const btnCambiar =
    document.getElementById(
        "btnCambiar"
    );


const mensaje =
    document.getElementById(
        "mensaje"
    );


let usuarioActual = null;
let empleadoDoc = null;


/*
=========================================================
 MOSTRAR MENSAJE
=========================================================
*/

function mostrarMensaje(
    texto,
    tipo
){

    mensaje.textContent =
        texto;

    mensaje.className =
        "mensaje " + tipo;

}


/*
=========================================================
 BUSCAR EMPLEADO
=========================================================
*/

async function buscarEmpleado(
    usuario
){

    const consulta =
        query(

            collection(
                db,
                "empleados"
            ),

            where(
                "authUid",
                "==",
                usuario.uid
            ),

            limit(1)

        );


    const resultado =
        await getDocs(
            consulta
        );


    if(
        resultado.empty
    ){

        throw new Error(
            "No encontramos tu registro de empleado."
        );

    }


    empleadoDoc =
        resultado.docs[0];


    const empleado =
        empleadoDoc.data();


    /*
    =============================================
    VERIFICAR EMPRESA
    =============================================
    */

    if(
        !empleado.empresaId
    ){

        throw new Error(
            "El empleado no tiene una empresa asociada."
        );

    }


    /*
    =============================================
    VERIFICAR SI REALMENTE NECESITA CAMBIAR
    =============================================
    */

    if(
        empleado.passwordTemporal !== true
    ){

        redirigirEmpleado(
            empleado
        );

    }

}


/*
=========================================================
 REDIRECCIÓN
=========================================================
*/

function redirigirEmpleado(
    empleado
){

    const tipo =
        String(
            empleado.tipoEmpleado ||
            empleado.tipo ||
            "empleado"
        )
        .toLowerCase();


    if(
        tipo === "chofer"
    ){

        window.location.href =
            "modo-chofer.html";

    }
    else{

        window.location.href =
            "fichaje.html";

    }

}


/*
=========================================================
 CAMBIAR CONTRASEÑA
=========================================================
*/

async function cambiarPassword(){

    const nueva =
        nuevaPassword.value.trim();


    const repetida =
        repetirPassword.value.trim();


    /*
    =============================================
    VALIDACIONES
    =============================================
    */

    if(
        !nueva ||
        !repetida
    ){

        mostrarMensaje(
            "Completá los dos campos.",
            "error"
        );

        return;

    }


    if(
        nueva.length < 8
    ){

        mostrarMensaje(
            "La contraseña debe tener al menos 8 caracteres.",
            "error"
        );

        return;

    }


    if(
        nueva !== repetida
    ){

        mostrarMensaje(
            "Las contraseñas no coinciden.",
            "error"
        );

        return;

    }


    if(
        !usuarioActual
    ){

        mostrarMensaje(
            "Tu sesión no está disponible. Volvé a ingresar.",
            "error"
        );

        return;

    }


    try{

        btnCambiar.disabled =
            true;

        btnCambiar.textContent =
            "CAMBIANDO...";


        /*
        =============================================
        ACTUALIZAR PASSWORD DE FIREBASE AUTH
        =============================================
        */

        await updatePassword(
            usuarioActual,
            nueva
        );


        /*
        =============================================
        ACTUALIZAR EMPLEADO
        =============================================
        */

        if(
            empleadoDoc
        ){

            await updateDoc(
                empleadoDoc.ref,
                {

                    passwordTemporal:
                        false,

                    passwordCambiadaEn:
                        serverTimestamp(),

                    actualizadoEn:
                        serverTimestamp()

                }
            );

        }


        mostrarMensaje(
            "✅ Contraseña cambiada correctamente. Redirigiendo...",
            "exito"
        );


        /*
        =============================================
        REDIRIGIR
        =============================================
        */

        setTimeout(
            () => {

                redirigirEmpleado(
                    empleadoDoc.data()
                );

            },
            1200
        );


    }
    catch(error){

        console.error(
            error
        );


        let texto =
            "No pudimos cambiar la contraseña.";


        if(
            error.code ===
            "auth/requires-recent-login"
        ){

            texto =
                "La sesión expiró. Cerrá sesión e ingresá nuevamente.";

        }


        mostrarMensaje(
            texto,
            "error"
        );


        btnCambiar.disabled =
            false;

        btnCambiar.textContent =
            "🔐 CAMBIAR CONTRASEÑA";

    }

}


/*
=========================================================
 BOTÓN
=========================================================
*/

btnCambiar.addEventListener(
    "click",
    cambiarPassword
);


/*
=========================================================
 ENTER
=========================================================
*/

document.addEventListener(
    "keydown",
    (event) => {

        if(
            event.key === "Enter"
        ){

            cambiarPassword();

        }

    }
);


/*
=========================================================
 VERIFICAR SESIÓN
=========================================================
*/

onAuthStateChanged(
    auth,
    async (usuario) => {

        if(!usuario){

            window.location.href =
                "acceso-empleado.html";

            return;

        }


        usuarioActual =
            usuario;


        try{

            await buscarEmpleado(
                usuario
            );

        }
        catch(error){

            console.error(
                error
            );


            mostrarMensaje(
                error.message ||
                "No se pudo verificar el empleado.",
                "error"
            );

        }

    }
);

</script>


</body>

</html>
