<!DOCTYPE html>
<html lang="es">

<head>

<meta charset="UTF-8">

<meta name="viewport" content="width=device-width, initial-scale=1.0">

<meta name="theme-color" content="#111827">

<meta name="description" content="Mis presupuestos - GESBASE">

<title>Mis presupuestos - GESBASE</title>

<style>

*{
    box-sizing:border-box;
    margin:0;
    padding:0;
}

body{
    font-family:Arial,sans-serif;
    background:#f3f4f6;
    color:#111827;
}

.contenedor{
    max-width:700px;
    margin:auto;
    min-height:100vh;
    background:white;
}

header{
    background:#111827;
    color:white;
    padding:25px 20px;
}

header h1{
    font-size:25px;
}

header p{
    margin-top:6px;
    color:#d1d5db;
    font-size:14px;
}

main{
    padding:20px;
}

.usuario{
    background:#f3f4f6;
    padding:13px;
    border-radius:10px;
    margin-bottom:15px;
    font-size:14px;
}

.empresa{
    background:#f9fafb;
    border:1px solid #e5e7eb;
    padding:13px;
    border-radius:10px;
    margin-bottom:15px;
    font-size:14px;
}

.acciones{
    display:flex;
    gap:10px;
    margin-bottom:15px;
}

.boton-nuevo,
.boton-actualizar{
    flex:1;
    padding:14px;
    border-radius:10px;
    font-size:15px;
    font-weight:bold;
    text-align:center;
    cursor:pointer;
}

.boton-nuevo{
    background:#111827;
    color:white;
    text-decoration:none;
}

.boton-actualizar{
    background:#374151;
    color:white;
    border:none;
}

.buscador{
    width:100%;
    padding:14px;
    border:1px solid #d1d5db;
    border-radius:10px;
    font-size:15px;
    margin-bottom:18px;
    outline:none;
}

.buscador:focus{
    border-color:#2563eb;
}

.cargando{
    text-align:center;
    padding:35px;
    color:#6b7280;
}

.lista{
    display:flex;
    flex-direction:column;
    gap:15px;
}

.presupuesto{
    border:1px solid #d1d5db;
    border-radius:14px;
    padding:18px;
    background:white;
    box-shadow:0 3px 10px rgba(0,0,0,.08);
}

.numero{
    font-size:14px;
    font-weight:bold;
    color:#6b7280;
    margin-bottom:8px;
}

.cliente{
    font-size:21px;
    font-weight:bold;
    margin-bottom:12px;
}

.dato{
    margin-top:7px;
    font-size:14px;
    color:#4b5563;
}

.descripcion{
    margin-top:12px;
    padding-top:12px;
    border-top:1px solid #e5e7eb;
    line-height:1.5;
    color:#374151;
}

.total{
    margin-top:15px;
    padding-top:13px;
    border-top:2px solid #111827;
    font-size:21px;
    font-weight:bold;
}

.boton{
    display:block;
    width:100%;
    margin-top:10px;
    padding:14px;
    border-radius:10px;
    text-align:center;
    text-decoration:none;
    font-size:15px;
    font-weight:bold;
    cursor:pointer;
}

.boton-ver{
    background:#111827;
    color:white;
}

.boton-editar{
    background:#2563eb;
    color:white;
}

.boton-eliminar{
    background:#fee2e2;
    color:#991b1b;
    border:1px solid #fecaca;
}

.sin-presupuestos,
.sin-busqueda{
    text-align:center;
    padding:35px 20px;
    color:#6b7280;
}

.sin-busqueda{
    display:none;
}

.error{
    display:none;
    background:#fee2e2;
    color:#991b1b;
    padding:14px;
    border-radius:10px;
    margin-bottom:15px;
    line-height:1.5;
}

.boton-volver{
    display:block;
    width:100%;
    padding:15px;
    margin-top:20px;
    border-radius:10px;
    background:#e5e7eb;
    color:#111827;
    text-align:center;
    text-decoration:none;
    font-size:16px;
    font-weight:bold;
}

@media(max-width:480px){

    main{
        padding:15px;
    }

    .acciones{
        flex-direction:column;
    }

}

</style>

</head>

<body>

<div class="contenedor">

<header>

<h1>Mis presupuestos</h1>

<p>GESBASE</p>

</header>

<main>

<div id="usuario" class="usuario">
Verificando usuario...
</div>

<div id="empresa" class="empresa">
Empresa: cargando...
</div>

<div id="error" class="error"></div>

<div class="acciones">

<a
    href="presupuesto.html"
    class="boton-nuevo"
>
+ NUEVO PRESUPUESTO
</a>

<button
    type="button"
    id="btnActualizar"
    class="boton-actualizar"
>
🔄 ACTUALIZAR
</button>

</div>

<input
    type="search"
    id="buscador"
    class="buscador"
    placeholder="🔎 Buscar por cliente, agenda o lugar..."
>

<div
    id="cargando"
    class="cargando"
>
Cargando presupuestos...
</div>

<div
    id="lista"
    class="lista"
></div>

<div
    id="sinPresupuestos"
    class="sin-presupuestos"
    style="display:none;"
>
Todavía no tenés presupuestos.
</div>

<div
    id="sinBusqueda"
    class="sin-busqueda"
>
No se encontraron presupuestos.
</div>

<a
    href="index.html"
    class="boton-volver"
>
⬅️ VOLVER A GESBASE
</a>

</main>

</div>

<script type="module">

// =====================================================
// FIREBASE
// =====================================================

import {
    auth,
    db
} from "./Js/firebase.js";

import {
    onAuthStateChanged
} from "https://www.gstatic.com/firebasejs/12.18.0/firebase-auth.js";

import {
    collection,
    query,
    where,
    getDocs,
    doc,
    getDoc,
    deleteDoc
} from "https://www.gstatic.com/firebasejs/12.18.0/firebase-firestore.js";


// =====================================================
// ELEMENTOS
// =====================================================

const usuarioElemento =
document.getElementById("usuario");

const empresaElemento =
document.getElementById("empresa");

const cargando =
document.getElementById("cargando");

const lista =
document.getElementById("lista");

const sinPresupuestos =
document.getElementById("sinPresupuestos");

const sinBusqueda =
document.getElementById("sinBusqueda");

const errorElemento =
document.getElementById("error");

const buscador =
document.getElementById("buscador");

const btnActualizar =
document.getElementById("btnActualizar");


// =====================================================
// VARIABLES
// =====================================================

let usuarioActual = null;

let empresaIdActual = "";

let presupuestos = [];


// =====================================================
// ESCAPAR HTML
// =====================================================

function escaparHTML(valor){

    const div =
    document.createElement("div");

    div.textContent =
    valor ?? "";

    return div.innerHTML;

}


// =====================================================
// DINERO
// =====================================================

function dinero(valor){

    return Number(valor || 0).toLocaleString(
        "es-AR",
        {
            minimumFractionDigits:2,
            maximumFractionDigits:2
        }
    );

}


// =====================================================
// NÚMERO PRESUPUESTO
// =====================================================

function numeroPresupuesto(id){

    let suma = 0;

    for(
        let i = 0;
        i < id.length;
        i++
    ){

        suma +=
        id.charCodeAt(i);

    }

    return String(
        suma % 1000000
    ).padStart(
        6,
        "0"
    );

}


// =====================================================
// MOSTRAR ERROR
// =====================================================

function mostrarError(mensaje){

    errorElemento.textContent =
    mensaje;

    errorElemento.style.display =
    "block";

}


// =====================================================
// OBTENER EMPRESA DEL USUARIO
// =====================================================

async function obtenerEmpresa(){

    if(!usuarioActual){

        throw new Error(
            "No hay un usuario autenticado."
        );

    }

    const referenciaUsuario =
    doc(
        db,
        "usuarios",
        usuarioActual.uid
    );

    const resultadoUsuario =
    await getDoc(
        referenciaUsuario
    );

    if(
        !resultadoUsuario.exists()
    ){

        throw new Error(
            "No se encontró el registro del usuario en Firestore."
        );

    }

    const datosUsuario =
    resultadoUsuario.data();

    /*
     * TU REGISTRO.HTML GUARDA:
     *
     * empresaId: uid
     *
     * Por eso usamos exactamente
     * ese campo.
     */

    empresaIdActual =
    datosUsuario.empresaId ||
    usuarioActual.uid;

    const referenciaEmpresa =
    doc(
        db,
        "empresas",
        empresaIdActual
    );

    const resultadoEmpresa =
    await getDoc(
        referenciaEmpresa
    );

    if(
        resultadoEmpresa.exists()
    ){

        const datosEmpresa =
        resultadoEmpresa.data();

        empresaElemento.innerHTML =
        "<strong>Empresa:</strong> " +
        escaparHTML(
            datosEmpresa.nombreEmpresa ||
            datosUsuario.nombreEmpresa ||
            "Sin informar"
        ) +
        "<br>" +
        "<strong>Razón social:</strong> " +
        escaparHTML(
            datosEmpresa.razonSocial ||
            datosUsuario.razonSocial ||
            "Sin informar"
        );

    }
    else{

        empresaElemento.innerHTML =
        "<strong>Empresa:</strong> " +
        escaparHTML(
            datosUsuario.nombreEmpresa ||
            "Sin informar"
        );

    }

}


// =====================================================
// ELIMINAR PRESUPUESTO
// =====================================================

async function eliminarPresupuesto(id){

    if(!usuarioActual){

        return;

    }

    const confirmar =
    confirm(
        "¿Seguro que querés eliminar este presupuesto?\n\nEsta acción no se puede deshacer."
    );

    if(!confirmar){

        return;

    }

    try{

        const referencia =
        doc(
            db,
            "presupuestos",
            id
        );

        const resultado =
        await getDoc(
            referencia
        );

        if(
            !resultado.exists()
        ){

            alert(
                "El presupuesto ya no existe."
            );

            await cargarPresupuestos();

            return;

        }

        const datos =
        resultado.data();

        /*
         * Verificación de seguridad.
         *
         * Aceptamos el presupuesto si pertenece
         * al usuario actual o a su empresa.
         */

        const perteneceUsuario =
        datos.uid ===
        usuarioActual.uid;

        const perteneceEmpresa =
        empresaIdActual &&
        datos.empresaId ===
        empresaIdActual;

        if(
            !perteneceUsuario &&
            !perteneceEmpresa
        ){

            alert(
                "No tenés permiso para eliminar este presupuesto."
            );

            return;

        }

        await deleteDoc(
            referencia
        );

        alert(
            "Presupuesto eliminado correctamente."
        );

        await cargarPresupuestos();

    }
    catch(error){

        console.error(
            "Error eliminando presupuesto:",
            error
        );

        alert(
            "No se pudo eliminar el presupuesto:\n" +
            error.message
        );

    }

}


// =====================================================
// CREAR TARJETA
// =====================================================

function crearTarjeta(
    datos,
    id
){

    const tarjeta =
    document.createElement("div");

    tarjeta.className =
    "presupuesto";

    const numero =
    numeroPresupuesto(id);

    const cliente =
    escaparHTML(
        datos.cliente ||
        "Cliente sin nombre"
    );

    const fecha =
    escaparHTML(
        datos.fecha ||
        "-"
    );

    const agenda =
    escaparHTML(
        datos.numeroAgenda ||
        "-"
    );

    const lugar =
    escaparHTML(
        datos.lugarTrabajo ||
        "-"
    );

    const descripcion =
    escaparHTML(
        datos.descripcion ||
        "Sin descripción"
    );

    tarjeta.innerHTML = `

        <div class="numero">
            PRESUPUESTO #${numero}
        </div>

        <div class="cliente">
            👤 ${cliente}
        </div>

        <div class="dato">
            📋 N.º de agenda:
            ${agenda}
        </div>

        <div class="dato">
            📅 Fecha:
            ${fecha}
        </div>

        <div class="dato">
            📍 Lugar:
            ${lugar}
        </div>

        <div class="descripcion">
            📝 ${descripcion}
        </div>

        <div class="dato">
            🧱 Materiales:
            $${dinero(datos.materiales)}
        </div>

        <div class="dato">
            🔨 Mano de obra:
            $${dinero(datos.manoObra)}
        </div>

        <div class="dato">
            🚗 Viáticos:
            $${dinero(datos.viaticos)}
        </div>

        <div class="total">
            TOTAL:
            $${dinero(datos.total)}
        </div>

        <a
            href="ver-presupuesto.html?id=${encodeURIComponent(id)}"
            class="boton boton-ver"
        >
            👁️ VER PRESUPUESTO
        </a>

        <a
            href="editar-presupuesto.html?id=${encodeURIComponent(id)}"
            class="boton boton-editar"
        >
            ✏️ EDITAR PRESUPUESTO
        </a>

        <button
            type="button"
            class="boton boton-eliminar"
        >
            🗑️ ELIMINAR PRESUPUESTO
        </button>

    `;

    const botonEliminar =
    tarjeta.querySelector(
        ".boton-eliminar"
    );

    botonEliminar.addEventListener(
        "click",
        function(){

            eliminarPresupuesto(id);

        }
    );

    return tarjeta;

}


// =====================================================
// MOSTRAR PRESUPUESTOS
// =====================================================

function mostrarPresupuestos(){

    lista.innerHTML =
    "";

    sinBusqueda.style.display =
    "none";

    const termino =
    buscador.value
        .trim()
        .toLowerCase();

    let filtrados =
    presupuestos;

    if(termino){

        filtrados =
        presupuestos.filter(
            function(item){

                const datos =
                item.datos;

                const cliente =
                String(
                    datos.cliente ||
                    ""
                ).toLowerCase();

                const agenda =
                String(
                    datos.numeroAgenda ||
                    ""
                ).toLowerCase();

                const lugar =
                String(
                    datos.lugarTrabajo ||
                    ""
                ).toLowerCase();

                const descripcion =
                String(
                    datos.descripcion ||
                    ""
                ).toLowerCase();

                return (
                    cliente.includes(termino) ||
                    agenda.includes(termino) ||
                    lugar.includes(termino) ||
                    descripcion.includes(termino)
                );

            }
        );

    }

    if(
        filtrados.length === 0
    ){

        if(
            presupuestos.length > 0
        ){

            sinBusqueda.style.display =
            "block";

        }

        return;

    }

    filtrados.forEach(
        function(item){

            lista.appendChild(
                crearTarjeta(
                    item.datos,
                    item.id
                )
            );

        }
    );

}


// =====================================================
// CARGAR PRESUPUESTOS
// =====================================================

async function cargarPresupuestos(){

    if(!usuarioActual){

        return;

    }

    try{

        errorElemento.style.display =
        "none";

        cargando.style.display =
        "block";

        lista.innerHTML =
        "";

        sinPresupuestos.style.display =
        "none";

        sinBusqueda.style.display =
        "none";

        usuarioElemento.textContent =
        "Usuario: " +
        (
            usuarioActual.email ||
            "Usuario autenticado"
        );

        /*
         * Primero obtenemos el empresaId
         * guardado por registro.html.
         */

        await obtenerEmpresa();

        /*
         * Buscamos los presupuestos por UID.
         *
         * Esto coincide con presupuesto.html,
         * que actualmente guarda:
         *
         * uid: usuarioActual.uid
         */

        const referencia =
        collection(
            db,
            "presupuestos"
        );

        const consulta =
        query(
            referencia,
            where(
                "uid",
                "==",
                usuarioActual.uid
            )
        );

        const resultado =
        await getDocs(
            consulta
        );

        presupuestos =
        [];

        resultado.forEach(
            function(documento){

                presupuestos.push({

                    id:
                    documento.id,

                    datos:
                    documento.data()

                });

            }
        );

        /*
         * Ordenar por fecha.
         */

        presupuestos.sort(
            function(a,b){

                const fechaA =
                String(
                    a.datos.fecha ||
                    ""
                );

                const fechaB =
                String(
                    b.datos.fecha ||
                    ""
                );

                if(
                    fechaA ===
                    fechaB
                ){

                    return 0;

                }

                return fechaA >
                    fechaB
                    ? -1
                    : 1;

            }
        );

        cargando.style.display =
        "none";

        if(
            presupuestos.length === 0
        ){

            sinPresupuestos.style.display =
            "block";

            return;

        }

        mostrarPresupuestos();

    }
    catch(error){

        console.error(
            "ERROR CARGANDO PRESUPUESTOS:",
            error
        );

        cargando.style.display =
        "none";

        let mensajeError =
        error.message ||
        "Error desconocido.";

        if(
            error.code ===
            "permission-denied"
        ){

            mensajeError =
            "Firebase rechazó la lectura de los presupuestos. Revisá las reglas de Firestore.";

        }

        mostrarError(
            "No se pudieron cargar los presupuestos: " +
            mensajeError
        );

    }

}


// =====================================================
// BUSCADOR
// =====================================================

buscador.addEventListener(
    "input",
    function(){

        mostrarPresupuestos();

    }
);


// =====================================================
// ACTUALIZAR
// =====================================================

btnActualizar.addEventListener(
    "click",
    async function(){

        btnActualizar.disabled =
        true;

        btnActualizar.textContent =
        "⏳ CARGANDO...";

        await cargarPresupuestos();

        btnActualizar.disabled =
        false;

        btnActualizar.textContent =
        "🔄 ACTUALIZAR";

    }
);


// =====================================================
// AUTENTICACIÓN
// =====================================================

onAuthStateChanged(
    auth,
    async function(usuario){

        if(!usuario){

            window.location.replace(
                "login.html"
            );

            return;

        }

        usuarioActual =
        usuario;

        usuarioElemento.textContent =
        "Usuario: " +
        (
            usuario.email ||
            "Usuario autenticado"
        );

        await cargarPresupuestos();

    }
);

</script>

</body>

</html>
