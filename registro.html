<!DOCTYPE html>
<html lang="es">

<head>

<meta charset="UTF-8">

<meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
>

<meta
    name="theme-color"
    content="#111827"
>

<title>Crear cuenta - GESBASE</title>

<style>

*{
    box-sizing:border-box;
    margin:0;
    padding:0;
}

body{
    font-family:Arial,sans-serif;
    background:#f3f4f6;
    color:#111827;
    min-height:100vh;
}

.contenedor{
    width:100%;
    max-width:500px;
    min-height:100vh;
    margin:auto;
    background:white;
}

header{
    background:#111827;
    color:white;
    padding:30px 20px;
    text-align:center;
}

.logo{
    font-size:34px;
    font-weight:bold;
    letter-spacing:1px;
}

.subtitulo{
    margin-top:8px;
    font-size:14px;
    color:#d1d5db;
}

main{
    padding:25px 20px 35px;
}

h1{
    font-size:24px;
    margin-bottom:8px;
}

.descripcion{
    color:#6b7280;
    font-size:14px;
    line-height:1.5;
    margin-bottom:25px;
}

.campo{
    margin-bottom:18px;
}

label{
    display:block;
    font-size:14px;
    font-weight:bold;
    margin-bottom:7px;
}

input{
    width:100%;
    padding:14px;
    border:1px solid #d1d5db;
    border-radius:10px;
    font-size:16px;
    outline:none;
    background:white;
}

input:focus{
    border-color:#111827;
}

.boton{
    width:100%;
    border:none;
    border-radius:11px;
    padding:15px;
    font-size:16px;
    font-weight:bold;
    cursor:pointer;
    margin-top:8px;
}

.boton-principal{
    background:#111827;
    color:white;
}

.boton-principal:disabled{
    opacity:.6;
    cursor:not-allowed;
}

.boton-secundario{
    background:#e5e7eb;
    color:#111827;
}

.mensaje{
    display:none;
    margin-top:18px;
    padding:13px;
    border-radius:10px;
    font-size:14px;
    line-height:1.4;
}

.mensaje.error{
    display:block;
    background:#fee2e2;
    color:#991b1b;
}

.mensaje.exito{
    display:block;
    background:#dcfce7;
    color:#166534;
}

.login{
    text-align:center;
    margin-top:25px;
    color:#6b7280;
    font-size:14px;
}

.login a{
    color:#111827;
    font-weight:bold;
    text-decoration:none;
}

.ayuda{
    font-size:12px;
    color:#6b7280;
    margin-top:5px;
}

</style>

</head>


<body>

<div class="contenedor">

<header>

<div class="logo">
GESBASE
</div>

<div class="subtitulo">
Tu empresa. Todo organizado.
</div>

</header>


<main>

<h1>
Crear cuenta
</h1>

<p class="descripcion">
Registrá los datos de tu empresa para comenzar a utilizar GESBASE.
</p>


<form id="formRegistro">


<!-- NOMBRE -->

<div class="campo">

<label for="nombre">
Nombre
</label>

<input
    type="text"
    id="nombre"
    placeholder="Tu nombre"
    autocomplete="given-name"
    required
>

</div>


<!-- APELLIDO -->

<div class="campo">

<label for="apellido">
Apellido
</label>

<input
    type="text"
    id="apellido"
    placeholder="Tu apellido"
    autocomplete="family-name"
    required
>

</div>


<!-- RAZÓN SOCIAL -->

<div class="campo">

<label for="razonSocial">
Razón social
</label>

<input
    type="text"
    id="razonSocial"
    placeholder="Nombre o razón social de la empresa"
    autocomplete="organization"
    required
>

</div>


<!-- CUIT -->

<div class="campo">

<label for="cuit">
CUIT
</label>

<input
    type="text"
    id="cuit"
    placeholder="Ejemplo: 20-12345678-9"
    inputmode="numeric"
    autocomplete="off"
    maxlength="13"
    required
>

<div class="ayuda">
Ingresá el CUIT de la empresa o titular.
</div>

</div>


<!-- TELÉFONO -->

<div class="campo">

<label for="telefono">
Teléfono
</label>

<input
    type="tel"
    id="telefono"
    placeholder="Tu teléfono"
    autocomplete="tel"
    inputmode="tel"
    required
>

</div>


<!-- EMAIL -->

<div class="campo">

<label for="email">
Email
</label>

<input
    type="email"
    id="email"
    placeholder="ejemplo@email.com"
    autocomplete="email"
    required
>

</div>


<!-- CONTRASEÑA -->

<div class="campo">

<label for="password">
Contraseña
</label>

<input
    type="password"
    id="password"
    placeholder="Mínimo 6 caracteres"
    autocomplete="new-password"
    minlength="6"
    required
>

</div>


<!-- CONFIRMAR CONTRASEÑA -->

<div class="campo">

<label for="passwordConfirmar">
Confirmar contraseña
</label>

<input
    type="password"
    id="passwordConfirmar"
    placeholder="Repetí tu contraseña"
    autocomplete="new-password"
    minlength="6"
    required
>

</div>


<!-- MENSAJE -->

<div
    id="mensaje"
    class="mensaje"
></div>


<!-- CREAR CUENTA -->

<button
    type="submit"
    id="btnRegistro"
    class="boton boton-principal"
>
Crear cuenta
</button>


<!-- VOLVER -->

<button
    type="button"
    id="btnVolver"
    class="boton boton-secundario"
>
Volver al login
</button>


</form>


<div class="login">

¿Ya tenés una cuenta?

<a href="login.html">
Iniciar sesión
</a>

</div>


</main>

</div>


<script>

const formRegistro =
document.getElementById(
    "formRegistro"
);


const btnVolver =
document.getElementById(
    "btnVolver"
);


const cuit =
document.getElementById(
    "cuit"
);


/*
==================================================
FORMATO CUIT
==================================================
Permite ingresar solamente números y agrega
automáticamente los guiones.
==================================================
*/

cuit.addEventListener(
    "input",
    function(){

        let valor =
            this.value.replace(
                /\D/g,
                ""
            );

        if(valor.length > 11){

            valor =
                valor.substring(
                    0,
                    11
                );

        }

        if(valor.length > 2){

            valor =
                valor.substring(0,2)
                + "-"
                + valor.substring(2);

        }

        if(valor.length > 11){

            valor =
                valor.substring(0,11)
                + "-"
                + valor.substring(11);

        }

        this.value =
            valor;

    }
);


/*
==================================================
VOLVER AL LOGIN
==================================================
*/

btnVolver.addEventListener(
    "click",
    function(){

        window.location.href =
            "login.html";

    }
);


/*
==================================================
REGISTRO
==================================================
Por ahora solamente comprobamos el formulario.
Firebase se conectará en el siguiente paso.
==================================================
*/

formRegistro.addEventListener(
    "submit",
    function(evento){

        evento.preventDefault();


        const password =
            document.getElementById(
                "password"
            ).value;


        const passwordConfirmar =
            document.getElementById(
                "passwordConfirmar"
            ).value;


        const mensaje =
            document.getElementById(
                "mensaje"
            );


        if(password !== passwordConfirmar){

            mensaje.textContent =
                "Las contraseñas no coinciden.";

            mensaje.className =
                "mensaje error";

            return;

        }


        mensaje.textContent =
            "Los datos están completos. La conexión con Firebase se realizará en el siguiente paso.";

        mensaje.className =
            "mensaje exito";

    }
);

</script>


</body>

</html>
