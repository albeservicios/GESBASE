<!DOCTYPE html>
<html lang="es">

<head>

<meta charset="UTF-8">

<meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
>

<meta
    name="theme-color"
    content="#111827"
>

<title>Crear cuenta - GESBASE</title>

<style>

* {
    box-sizing: border-box;
    margin: 0;
    padding: 0;
}

body {
    font-family: Arial, sans-serif;
    background: #f3f4f6;
    color: #111827;
    min-height: 100vh;
}

.contenedor {
    width: 100%;
    max-width: 500px;
    margin: auto;
    min-height: 100vh;
    background: white;
}

header {
    background: #111827;
    color: white;
    padding: 30px 20px;
    text-align: center;
}

.logo {
    font-size: 34px;
    font-weight: bold;
}

.subtitulo {
    margin-top: 8px;
    font-size: 14px;
    color: #d1d5db;
}

main {
    padding: 24px 20px 35px;
}

h1 {
    font-size: 24px;
    margin-bottom: 8px;
}

.descripcion {
    color: #6b7280;
    font-size: 14px;
    margin-bottom: 25px;
    line-height: 1.5;
}

.campo {
    margin-bottom: 17px;
}

label {
    display: block;
    font-size: 14px;
    font-weight: bold;
    margin-bottom: 7px;
}

input {
    width: 100%;
    padding: 14px;
    border: 1px solid #d1d5db;
    border-radius: 10px;
    font-size: 16px;
    outline: none;
}

.fila {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 12px;
}

.boton {
    width: 100%;
    border: none;
    border-radius: 11px;
    padding: 15px;
    font-size: 16px;
    font-weight: bold;
    cursor: pointer;
    margin-top: 8px;
}

.boton-principal {
    background: #111827;
    color: white;
}

.boton-principal:disabled {
    opacity: .6;
}

.boton-secundario {
    background: #e5e7eb;
    color: #111827;
}

.mensaje {
    display: none;
    margin-top: 18px;
    padding: 13px;
    border-radius: 10px;
    font-size: 14px;
}

.mensaje.error {
    display: block;
    background: #fee2e2;
    color: #991b1b;
}

.mensaje.exito {
    display: block;
    background: #dcfce7;
    color: #166534;
}

.login {
    text-align: center;
    margin-top: 25px;
    font-size: 14px;
    color: #6b7280;
}

.login a {
    color: #111827;
    font-weight: bold;
    text-decoration: none;
}

.obligatorio {
    color: #dc2626;
}

@media (max-width: 380px) {

    .fila {
        grid-template-columns: 1fr;
    }

}

</style>

</head>

<body>

<div class="contenedor">

<header>

<div class="logo">
GESBASE
</div>

<div class="subtitulo">
Gestión para empresas y profesionales
</div>

</header>

<main>

<h1>
Crear cuenta
</h1>

<p class="descripcion">
Registrá tu cuenta para comenzar a gestionar
presupuestos, trabajos, gastos y clientes.
</p>

<form id="formRegistro">

<div class="fila">

<div class="campo">

<label>
Nombre <span class="obligatorio">*</span>
</label>

<input
type="text"
id="nombre"
required
>

</div>

<div class="campo">

<label>
Apellido <span class="obligatorio">*</span>
</label>

<input
type="text"
id="apellido"
required
>

</div>

</div>


<div class="campo">

<label>
Email <span class="obligatorio">*</span>
</label>

<input
type="email"
id="email"
required
>

</div>


<div class="campo">

<label>
Contraseña <span class="obligatorio">*</span>
</label>

<input
type="password"
id="password"
minlength="6"
required
>

</div>


<div class="campo">

<label>
Confirmar contraseña
<span class="obligatorio">*</span>
</label>

<input
type="password"
id="confirmarPassword"
minlength="6"
required
>

</div>


<div class="campo">

<label>
Teléfono <span class="obligatorio">*</span>
</label>

<input
type="tel"
id="telefono"
required
>

</div>


<div class="campo">

<label>
Nombre de empresa
<span class="obligatorio">*</span>
</label>

<input
type="text"
id="empresa"
required
>

</div>


<div
id="mensaje"
class="mensaje"
></div>


<button
type="submit"
id="btnRegistrarse"
class="boton boton-principal"
>
Crear cuenta
</button>


<button
type="button"
id="btnVolver"
class="boton boton-secundario"
>
Volver
</button>

</form>


<div class="login">

¿Ya tenés una cuenta?

<a href="login.html">
Iniciar sesión
</a>

</div>

</main>

</div>


<script type="module">

// ==========================================
// FIREBASE
// ==========================================

import {
    auth,
    db
} from "./Js/firebase.js";


import {
    createUserWithEmailAndPassword,
    updateProfile
} from "https://www.gstatic.com/firebasejs/12.1.0/firebase-auth.js";


import {
    doc,
    setDoc,
    serverTimestamp
} from "https://www.gstatic.com/firebasejs/12.1.0/firebase-firestore.js";


// ==========================================
// ELEMENTOS
// ==========================================

const formulario =
document.getElementById("formRegistro");

const mensaje =
document.getElementById("mensaje");

const boton =
document.getElementById("btnRegistrarse");


// ==========================================
// MENSAJES
// ==========================================

function mostrarMensaje(texto, tipo) {

    mensaje.textContent = texto;

    mensaje.className =
        "mensaje " + tipo;

}


// ==========================================
// REGISTRO
// ==========================================

formulario.addEventListener(
"submit",
async function(evento) {

    evento.preventDefault();


    const nombre =
        document.getElementById("nombre").value.trim();

    const apellido =
        document.getElementById("apellido").value.trim();

    const email =
        document.getElementById("email").value.trim();

    const password =
        document.getElementById("password").value;

    const confirmarPassword =
        document.getElementById("confirmarPassword").value;

    const telefono =
        document.getElementById("telefono").value.trim();

    const empresa =
        document.getElementById("empresa").value.trim();


    if (password.length < 6) {

        mostrarMensaje(
            "La contraseña debe tener al menos 6 caracteres.",
            "error"
        );

        return;
    }


    if (password !== confirmarPassword) {

        mostrarMensaje(
            "Las contraseñas no coinciden.",
            "error"
        );

        return;
    }


    boton.disabled = true;

    boton.textContent =
        "Creando cuenta...";


    try {

        // ======================================
        // CREAR CUENTA
        // ======================================

        const resultado =
            await createUserWithEmailAndPassword(
                auth,
                email,
                password
            );


        const usuario =
            resultado.user;


        // ======================================
        // NOMBRE EN FIREBASE AUTH
        // ======================================

        await updateProfile(
            usuario,
            {
                displayName:
                    nombre + " " + apellido
            }
        );


        // ======================================
        // CREAR DOCUMENTO EN FIRESTORE
        // ======================================

        await setDoc(
            doc(
                db,
                "usuarios",
                usuario.uid
            ),
            {

                uid:
                    usuario.uid,

                nombre:
                    nombre,

                apellido:
                    apellido,

                email:
                    email,

                telefono:
                    telefono,

                empresa:
                    empresa,

                creado:
                    serverTimestamp()

            }
        );


        // ======================================
        // ÉXITO
        // ======================================

        mostrarMensaje(
            "Cuenta creada correctamente.",
            "exito"
        );


        // ======================================
        // ENTRAR A GESBASE
        // ======================================

        setTimeout(
            function() {

                window.location.href =
                    "index.html";

            },
            700
        );


    } catch (error) {

        console.error(
            "Error:",
            error
        );


        mostrarMensaje(
            "Error: " + error.message,
            "error"
        );


        boton.disabled = false;

        boton.textContent =
            "Crear cuenta";

    }

});


// ==========================================
// VOLVER
// ==========================================

document
.getElementById("btnVolver")
.addEventListener(
"click",
function() {

    window.location.href =
        "index.html";

});

</script>

</body>

</html>
