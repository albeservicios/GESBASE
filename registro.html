<!DOCTYPE html>
<html lang="es">

<head>

<meta charset="UTF-8">

<meta name="viewport" content="width=device-width, initial-scale=1.0">

<meta name="theme-color" content="#111827">

<title>Registro - GESBASE</title>

<style>

*{
    box-sizing:border-box;
    margin:0;
    padding:0;
}

body{
    font-family:Arial,sans-serif;
    background:#f3f4f6;
    color:#111827;
    min-height:100vh;
}

.contenedor{
    max-width:520px;
    margin:auto;
    padding:20px;
}

.tarjeta{
    background:white;
    padding:25px;
    border-radius:15px;
    box-shadow:0 4px 15px rgba(0,0,0,.08);
}

h1{
    text-align:center;
    margin-bottom:8px;
    font-size:27px;
}

.subtitulo{
    text-align:center;
    color:#6b7280;
    margin-bottom:25px;
    font-size:14px;
}

.campo{
    margin-bottom:17px;
}

label{
    display:block;
    font-size:14px;
    font-weight:bold;
    margin-bottom:7px;
}

input{
    width:100%;
    padding:13px;
    border:1px solid #d1d5db;
    border-radius:9px;
    font-size:16px;
    outline:none;
}

input:focus{
    border-color:#2563eb;
}

button{
    width:100%;
    padding:15px;
    border:none;
    border-radius:10px;
    background:#111827;
    color:white;
    font-size:16px;
    font-weight:bold;
    cursor:pointer;
    margin-top:8px;
}

button:disabled{
    opacity:.6;
    cursor:not-allowed;
}

.mensaje{
    display:none;
    margin-top:15px;
    padding:13px;
    border-radius:9px;
    font-size:14px;
}

.exito{
    display:block;
    background:#dcfce7;
    color:#166534;
}

.error{
    display:block;
    background:#fee2e2;
    color:#991b1b;
}

.login{
    text-align:center;
    margin-top:20px;
    font-size:14px;
}

.login a{
    color:#2563eb;
    font-weight:bold;
    text-decoration:none;
}

.nota{
    margin-top:18px;
    padding:12px;
    background:#f3f4f6;
    border-radius:9px;
    font-size:12px;
    color:#4b5563;
    line-height:1.5;
}

</style>

</head>

<body>

<div class="contenedor">

<div class="tarjeta">

<h1>Crear cuenta</h1>

<div class="subtitulo">
Registrá tu empresa en GESBASE
</div>


<!-- NOMBRE -->

<div class="campo">

<label for="nombre">
Nombre
</label>

<input
    type="text"
    id="nombre"
    placeholder="Nombre"
    autocomplete="given-name"
>

</div>


<!-- APELLIDO -->

<div class="campo">

<label for="apellido">
Apellido
</label>

<input
    type="text"
    id="apellido"
    placeholder="Apellido"
    autocomplete="family-name"
>

</div>


<!-- EMPRESA -->

<div class="campo">

<label for="empresa">
Empresa
</label>

<input
    type="text"
    id="empresa"
    placeholder="Nombre comercial de la empresa"
>

</div>


<!-- RAZÓN SOCIAL -->

<div class="campo">

<label for="razonSocial">
Razón social
</label>

<input
    type="text"
    id="razonSocial"
    placeholder="Razón social"
>

</div>


<!-- CUIT -->

<div class="campo">

<label for="cuit">
CUIT
</label>

<input
    type="text"
    id="cuit"
    placeholder="Ej.: 20-12345678-9"
    inputmode="numeric"
>

</div>


<!-- TELÉFONO -->

<div class="campo">

<label for="telefono">
Teléfono
</label>

<input
    type="tel"
    id="telefono"
    placeholder="Teléfono"
    autocomplete="tel"
>

</div>


<!-- EMAIL -->

<div class="campo">

<label for="email">
Correo electrónico
</label>

<input
    type="email"
    id="email"
    placeholder="correo@empresa.com"
    autocomplete="email"
>

</div>


<!-- CONTRASEÑA -->

<div class="campo">

<label for="password">
Contraseña
</label>

<input
    type="password"
    id="password"
    placeholder="Mínimo 6 caracteres"
    autocomplete="new-password"
>

</div>


<!-- CONFIRMAR CONTRASEÑA -->

<div class="campo">

<label for="confirmarPassword">
Confirmar contraseña
</label>

<input
    type="password"
    id="confirmarPassword"
    placeholder="Repetí la contraseña"
    autocomplete="new-password"
>

</div>


<button
    type="button"
    id="btnRegistrar"
>
Crear cuenta
</button>


<div
    id="mensaje"
    class="mensaje"
></div>


<div class="nota">

Los datos de la empresa quedan asociados automáticamente a la cuenta creada. Cada empresa tendrá sus propios presupuestos y sus propios datos.

</div>


<div class="login">

¿Ya tenés una cuenta?

<a href="login.html">
Iniciar sesión
</a>

</div>

</div>

</div>


<script type="module">

import {
    auth,
    db
} from "./Js/firebase.js";

import {
    createUserWithEmailAndPassword
} from "https://www.gstatic.com/firebasejs/12.1.0/firebase-auth.js";

import {
    doc,
    setDoc,
    serverTimestamp
} from "https://www.gstatic.com/firebasejs/12.1.0/firebase-firestore.js";


const nombre =
document.getElementById("nombre");

const apellido =
document.getElementById("apellido");

const empresa =
document.getElementById("empresa");

const razonSocial =
document.getElementById("razonSocial");

const cuit =
document.getElementById("cuit");

const telefono =
document.getElementById("telefono");

const email =
document.getElementById("email");

const password =
document.getElementById("password");

const confirmarPassword =
document.getElementById("confirmarPassword");

const btnRegistrar =
document.getElementById("btnRegistrar");

const mensaje =
document.getElementById("mensaje");


function mostrarMensaje(
    texto,
    tipo
){

    mensaje.textContent =
    texto;

    mensaje.className =
    "mensaje " + tipo;
}


function limpiarCuit(valor){

    return valor
        .replace(/\D/g,"")
        .trim();

}


btnRegistrar.addEventListener(
    "click",
    async function(){

        const nombreValor =
        nombre.value.trim();

        const apellidoValor =
        apellido.value.trim();

        const empresaValor =
        empresa.value.trim();

        const razonSocialValor =
        razonSocial.value.trim();

        const cuitValor =
        limpiarCuit(
            cuit.value
        );

        const telefonoValor =
        telefono.value.trim();

        const emailValor =
        email.value.trim()
        .toLowerCase();

        const passwordValor =
        password.value;

        const confirmarValor =
        confirmarPassword.value;


        /* VALIDACIONES */

        if(
            nombreValor === "" ||
            apellidoValor === ""
        ){

            mostrarMensaje(
                "Completá nombre y apellido.",
                "error"
            );

            return;
        }


        if(
            empresaValor === ""
        ){

            mostrarMensaje(
                "Ingresá el nombre de la empresa.",
                "error"
            );

            return;
        }


        if(
            razonSocialValor === ""
        ){

            mostrarMensaje(
                "Ingresá la razón social.",
                "error"
            );

            return;
        }


        if(
            cuitValor === ""
        ){

            mostrarMensaje(
                "Ingresá el CUIT.",
                "error"
            );

            return;
        }


        if(
            telefonoValor === ""
        ){

            mostrarMensaje(
                "Ingresá el teléfono.",
                "error"
            );

            return;
        }


        if(
            emailValor === ""
        ){

            mostrarMensaje(
                "Ingresá el correo electrónico.",
                "error"
            );

            return;
        }


        if(
            passwordValor.length < 6
        ){

            mostrarMensaje(
                "La contraseña debe tener al menos 6 caracteres.",
                "error"
            );

            return;
        }


        if(
            passwordValor !== confirmarValor
        ){

            mostrarMensaje(
                "Las contraseñas no coinciden.",
                "error"
            );

            return;
        }


        btnRegistrar.disabled =
        true;

        btnRegistrar.textContent =
        "Creando cuenta...";


        try{

            /* CREAR USUARIO */

            const resultado =
            await createUserWithEmailAndPassword(
                auth,
                emailValor,
                passwordValor
            );


            const usuario =
            resultado.user;


            /*
             * GUARDAR DATOS DE LA EMPRESA
             *
             * Cada empresa queda vinculada
             * exclusivamente a su propio UID.
             */

            await setDoc(
                doc(
                    db,
                    "usuarios",
                    usuario.uid
                ),
                {

                    uid:
                    usuario.uid,

                    nombre:
                    nombreValor,

                    apellido:
                    apellidoValor,

                    empresa:
                    empresaValor,

                    razonSocial:
                    razonSocialValor,

                    cuit:
                    cuitValor,

                    telefono:
                    telefonoValor,

                    email:
                    emailValor,

                    rol:
                    "usuario",

                    estado:
                    "activo",

                    fechaRegistro:
                    new Date()
                    .toISOString(),

                    creado:
                    serverTimestamp()

                }
            );


            mostrarMensaje(
                "Cuenta creada correctamente. Redirigiendo...",
                "exito"
            );


            setTimeout(
                function(){

                    window.location.href =
                    "index.html";

                },
                1000
            );


        }catch(error){

            console.error(
                "Error de registro:",
                error
            );


            let textoError =
            "No se pudo crear la cuenta.";


            if(
                error.code ===
                "auth/email-already-in-use"
            ){

                textoError =
                "Ese correo ya está registrado.";

            }
            else if(
                error.code ===
                "auth/invalid-email"
            ){

                textoError =
                "El correo electrónico no es válido.";

            }
            else if(
                error.code ===
                "auth/weak-password"
            ){

                textoError =
                "La contraseña es demasiado débil.";

            }
            else if(
                error.code ===
                "permission-denied"
            ){

                textoError =
                "Firebase rechazó el acceso a los datos. Revisá las reglas de Firestore.";

            }
            else if(
                error.message
            ){

                textoError +=
                " " +
                error.message;

            }


            mostrarMensaje(
                textoError,
                "error"
            );


            btnRegistrar.disabled =
            false;

            btnRegistrar.textContent =
            "Crear cuenta";

        }

    }
);

</script>

</body>

</html>
