<!DOCTYPE html>
<html lang="es">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <meta
        name="theme-color"
        content="#111827"
    >

    <title>Crear cuenta - GESBASE</title>

    <style>

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: Arial, sans-serif;
            background: #f3f4f6;
            color: #111827;
            min-height: 100vh;
        }

        .contenedor {
            width: 100%;
            max-width: 500px;
            margin: auto;
            min-height: 100vh;
            background: white;
        }

        header {
            background: #111827;
            color: white;
            padding: 30px 20px;
            text-align: center;
        }

        .logo {
            font-size: 34px;
            font-weight: bold;
            letter-spacing: 1px;
        }

        .subtitulo {
            margin-top: 8px;
            font-size: 14px;
            color: #d1d5db;
        }

        main {
            padding: 24px 20px 35px;
        }

        h1 {
            font-size: 24px;
            margin-bottom: 8px;
        }

        .descripcion {
            color: #6b7280;
            font-size: 14px;
            margin-bottom: 25px;
            line-height: 1.5;
        }

        .campo {
            margin-bottom: 17px;
        }

        label {
            display: block;
            font-size: 14px;
            font-weight: bold;
            margin-bottom: 7px;
        }

        input {
            width: 100%;
            padding: 14px;
            border: 1px solid #d1d5db;
            border-radius: 10px;
            font-size: 16px;
            outline: none;
            background: white;
        }

        input:focus {
            border-color: #111827;
        }

        .fila {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 12px;
        }

        .boton {
            width: 100%;
            border: none;
            border-radius: 11px;
            padding: 15px;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            margin-top: 8px;
        }

        .boton-principal {
            background: #111827;
            color: white;
        }

        .boton-principal:disabled {
            opacity: .6;
            cursor: not-allowed;
        }

        .boton-secundario {
            background: #e5e7eb;
            color: #111827;
        }

        .mensaje {
            display: none;
            margin-top: 18px;
            padding: 13px;
            border-radius: 10px;
            font-size: 14px;
            line-height: 1.4;
        }

        .mensaje.error {
            display: block;
            background: #fee2e2;
            color: #991b1b;
        }

        .mensaje.exito {
            display: block;
            background: #dcfce7;
            color: #166534;
        }

        .login {
            text-align: center;
            margin-top: 25px;
            font-size: 14px;
            color: #6b7280;
        }

        .login a {
            color: #111827;
            font-weight: bold;
            text-decoration: none;
        }

        .obligatorio {
            color: #dc2626;
        }

        @media (max-width: 380px) {

            .fila {
                grid-template-columns: 1fr;
                gap: 0;
            }

        }

    </style>

</head>


<body>

<div class="contenedor">

    <header>

        <div class="logo">
            GESBASE
        </div>

        <div class="subtitulo">
            Gestión para empresas y profesionales
        </div>

    </header>


    <main>

        <h1>
            Crear cuenta
        </h1>

        <p class="descripcion">
            Registrá tu cuenta para comenzar a gestionar
            presupuestos, trabajos, gastos y clientes.
        </p>


        <form id="formRegistro">


            <!-- NOMBRE Y APELLIDO -->

            <div class="fila">

                <div class="campo">

                    <label for="nombre">
                        Nombre
                        <span class="obligatorio">*</span>
                    </label>

                    <input
                        type="text"
                        id="nombre"
                        name="nombre"
                        placeholder="Tu nombre"
                        autocomplete="given-name"
                        required
                    >

                </div>


                <div class="campo">

                    <label for="apellido">
                        Apellido
                        <span class="obligatorio">*</span>
                    </label>

                    <input
                        type="text"
                        id="apellido"
                        name="apellido"
                        placeholder="Tu apellido"
                        autocomplete="family-name"
                        required
                    >

                </div>

            </div>


            <!-- EMAIL -->

            <div class="campo">

                <label for="email">
                    Email
                    <span class="obligatorio">*</span>
                </label>

                <input
                    type="email"
                    id="email"
                    name="email"
                    placeholder="ejemplo@email.com"
                    autocomplete="email"
                    required
                >

            </div>


            <!-- CONTRASEÑA -->

            <div class="campo">

                <label for="password">
                    Contraseña
                    <span class="obligatorio">*</span>
                </label>

                <input
                    type="password"
                    id="password"
                    name="password"
                    placeholder="Mínimo 6 caracteres"
                    autocomplete="new-password"
                    minlength="6"
                    required
                >

            </div>


            <!-- CONFIRMAR CONTRASEÑA -->

            <div class="campo">

                <label for="confirmarPassword">
                    Confirmar contraseña
                    <span class="obligatorio">*</span>
                </label>

                <input
                    type="password"
                    id="confirmarPassword"
                    name="confirmarPassword"
                    placeholder="Repetí tu contraseña"
                    autocomplete="new-password"
                    minlength="6"
                    required
                >

            </div>


            <!-- TELEFONO -->

            <div class="campo">

                <label for="telefono">
                    Teléfono
                    <span class="obligatorio">*</span>
                </label>

                <input
                    type="tel"
                    id="telefono"
                    name="telefono"
                    placeholder="Ej. 299 1234567"
                    autocomplete="tel"
                    required
                >

            </div>


            <!-- EMPRESA -->

            <div class="campo">

                <label for="empresa">
                    Nombre de empresa
                    <span class="obligatorio">*</span>
                </label>

                <input
                    type="text"
                    id="empresa"
                    name="empresa"
                    placeholder="Nombre comercial"
                    autocomplete="organization"
                    required
                >

            </div>


            <!-- MENSAJE -->

            <div
                id="mensaje"
                class="mensaje"
            ></div>


            <!-- BOTON -->

            <button
                type="submit"
                id="btnRegistrarse"
                class="boton boton-principal"
            >
                Crear cuenta
            </button>


            <button
                type="button"
                id="btnVolver"
                class="boton boton-secundario"
            >
                Volver
            </button>


        </form>


        <div class="login">

            ¿Ya tenés una cuenta?

            <a href="login.html">
                Iniciar sesión
            </a>

        </div>

    </main>

</div>


<script>

    /*
     * ==========================================
     * GESBASE
     * REGISTRO - INTERFAZ BETA 1
     * ==========================================
     *
     * La conexión con Firebase se agregará
     * en el siguiente paso.
     *
     */


    const formulario =
        document.getElementById(
            "formRegistro"
        );


    const mensaje =
        document.getElementById(
            "mensaje"
        );


    const boton =
        document.getElementById(
            "btnRegistrarse"
        );


    function mostrarMensaje(
        texto,
        tipo
    ) {

        mensaje.textContent =
            texto;

        mensaje.className =
            "mensaje " + tipo;

    }


    formulario.addEventListener(
        "submit",
        function(evento) {

            evento.preventDefault();


            const nombre =
                document.getElementById(
                    "nombre"
                ).value.trim();


            const apellido =
                document.getElementById(
                    "apellido"
                ).value.trim();


            const email =
                document.getElementById(
                    "email"
                ).value.trim();


            const password =
                document.getElementById(
                    "password"
                ).value;


            const confirmarPassword =
                document.getElementById(
                    "confirmarPassword"
                ).value;


            const telefono =
                document.getElementById(
                    "telefono"
                ).value.trim();


            const empresa =
                document.getElementById(
                    "empresa"
                ).value.trim();


            if (
                password.length < 6
            ) {

                mostrarMensaje(
                    "La contraseña debe tener al menos 6 caracteres.",
                    "error"
                );

                return;

            }


            if (
                password !==
                confirmarPassword
            ) {

                mostrarMensaje(
                    "Las contraseñas no coinciden.",
                    "error"
                );

                return;

            }


            if (
                !nombre ||
                !apellido ||
                !email ||
                !telefono ||
                !empresa
            ) {

                mostrarMensaje(
                    "Completá todos los campos obligatorios.",
                    "error"
                );

                return;

            }


            /*
             * Por ahora solamente comprobamos
             * que el formulario esté correcto.
             *
             * Firebase Authentication se conectará
             * en el próximo paso.
             */

            mostrarMensaje(
                "Formulario correcto. La conexión con Firebase se realizará en el siguiente paso.",
                "exito"
            );


            console.log(
                "Datos preparados para registro:",
                {
                    nombre,
                    apellido,
                    email,
                    telefono,
                    empresa
                }
            );

        }
    );


    document
        .getElementById(
            "btnVolver"
        )
        .addEventListener(
            "click",
            function() {

                window.location.href =
                    "index.html";

            }
        );

</script>


</body>

</html>
