<!DOCTYPE html>
<html lang="es">

<head>

<meta charset="UTF-8">

<meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
>

<meta
    name="theme-color"
    content="#111827"
>

<title>Crear cuenta - GESBASE</title>

<style>

*{
    box-sizing:border-box;
    margin:0;
    padding:0;
}

body{
    font-family:Arial,sans-serif;
    background:#f3f4f6;
    color:#111827;
    min-height:100vh;
}

.contenedor{
    width:100%;
    max-width:500px;
    min-height:100vh;
    margin:auto;
    background:white;
}

header{
    background:#111827;
    color:white;
    padding:30px 20px;
    text-align:center;
}

.logo{
    font-size:34px;
    font-weight:bold;
    letter-spacing:1px;
}

.subtitulo{
    margin-top:8px;
    font-size:14px;
    color:#d1d5db;
}

main{
    padding:25px 20px 35px;
}

h1{
    font-size:24px;
    margin-bottom:8px;
}

.descripcion{
    color:#6b7280;
    font-size:14px;
    line-height:1.5;
    margin-bottom:25px;
}

.campo{
    margin-bottom:18px;
}

label{
    display:block;
    font-size:14px;
    font-weight:bold;
    margin-bottom:7px;
}

input{
    width:100%;
    padding:14px;
    border:1px solid #d1d5db;
    border-radius:10px;
    font-size:16px;
    outline:none;
    background:white;
}

input:focus{
    border-color:#111827;
}

.boton{
    width:100%;
    border:none;
    border-radius:11px;
    padding:15px;
    font-size:16px;
    font-weight:bold;
    cursor:pointer;
    margin-top:8px;
}

.boton-principal{
    background:#111827;
    color:white;
}

.boton-principal:disabled{
    opacity:.6;
    cursor:not-allowed;
}

.boton-secundario{
    background:#e5e7eb;
    color:#111827;
}

.mensaje{
    display:none;
    margin-top:18px;
    padding:13px;
    border-radius:10px;
    font-size:14px;
    line-height:1.4;
}

.mensaje.error{
    display:block;
    background:#fee2e2;
    color:#991b1b;
}

.mensaje.exito{
    display:block;
    background:#dcfce7;
    color:#166534;
}

.login{
    text-align:center;
    margin-top:25px;
    color:#6b7280;
    font-size:14px;
}

.login a{
    color:#111827;
    font-weight:bold;
    text-decoration:none;
}

.ayuda{
    font-size:12px;
    color:#6b7280;
    margin-top:5px;
}

</style>

</head>


<body>

<div class="contenedor">

<header>

<div class="logo">
GESBASE
</div>

<div class="subtitulo">
Tu empresa. Todo organizado.
</div>

</header>


<main>

<h1>
Crear cuenta
</h1>

<p class="descripcion">
Registrá los datos de tu empresa para comenzar a utilizar GESBASE.
</p>


<form id="formRegistro">


<div class="campo">

<label for="nombre">
Nombre
</label>

<input
    type="text"
    id="nombre"
    placeholder="Tu nombre"
    autocomplete="given-name"
    required
>

</div>


<div class="campo">

<label for="apellido">
Apellido
</label>

<input
    type="text"
    id="apellido"
    placeholder="Tu apellido"
    autocomplete="family-name"
    required
>

</div>


<div class="campo">

<label for="razonSocial">
Razón social
</label>

<input
    type="text"
    id="razonSocial"
    placeholder="Nombre o razón social de la empresa"
    autocomplete="organization"
    required
>

</div>


<div class="campo">

<label for="cuit">
CUIT
</label>

<input
    type="text"
    id="cuit"
    placeholder="Ejemplo: 20-12345678-9"
    inputmode="numeric"
    autocomplete="off"
    maxlength="13"
    required
>

<div class="ayuda">
Ingresá el CUIT de la empresa o titular.
</div>

</div>


<div class="campo">

<label for="telefono">
Teléfono
</label>

<input
    type="tel"
    id="telefono"
    placeholder="Tu teléfono"
    autocomplete="tel"
    inputmode="tel"
    required
>

</div>


<div class="campo">

<label for="email">
Email
</label>

<input
    type="email"
    id="email"
    placeholder="ejemplo@email.com"
    autocomplete="email"
    required
>

</div>


<div class="campo">

<label for="password">
Contraseña
</label>

<input
    type="password"
    id="password"
    placeholder="Mínimo 6 caracteres"
    autocomplete="new-password"
    minlength="6"
    required
>

</div>


<div class="campo">

<label for="passwordConfirmar">
Confirmar contraseña
</label>

<input
    type="password"
    id="passwordConfirmar"
    placeholder="Repetí tu contraseña"
    autocomplete="new-password"
    minlength="6"
    required
>

</div>


<div
    id="mensaje"
    class="mensaje"
></div>


<button
    type="submit"
    id="btnRegistro"
    class="boton boton-principal"
>
Crear cuenta
</button>


<button
    type="button"
    id="btnVolver"
    class="boton boton-secundario"
>
Volver al login
</button>


</form>


<div class="login">

¿Ya tenés una cuenta?

<a href="login.html">
Iniciar sesión
</a>

</div>


</main>

</div>


<script type="module">

// ==========================================
// FIREBASE
// ==========================================

import {
    auth,
    db
} from "./Js/firebase.js";


import {
    createUserWithEmailAndPassword
} from
"https://www.gstatic.com/firebasejs/12.1.0/firebase-auth.js";


import {
    doc,
    setDoc,
    serverTimestamp
} from
"https://www.gstatic.com/firebasejs/12.1.0/firebase-firestore.js";


// ==========================================
// ELEMENTOS
// ==========================================

const formRegistro =
document.getElementById(
    "formRegistro"
);


const btnRegistro =
document.getElementById(
    "btnRegistro"
);


const btnVolver =
document.getElementById(
    "btnVolver"
);


const mensaje =
document.getElementById(
    "mensaje"
);


const cuit =
document.getElementById(
    "cuit"
);


// ==========================================
// FORMATO CUIT
// ==========================================

cuit.addEventListener(
    "input",
    function(){

        let valor =
        this.value.replace(
            /\D/g,
            ""
        );


        if(valor.length > 11){

            valor =
            valor.substring(
                0,
                11
            );

        }


        if(valor.length > 2){

            valor =
            valor.substring(
                0,
                2
            )
            +
            "-"
            +
            valor.substring(
                2
            );

        }


        if(valor.length > 11){

            valor =
            valor.substring(
                0,
                11
            )
            +
            "-"
            +
            valor.substring(
                11
            );

        }


        this.value =
        valor;

    }
);


// ==========================================
// MENSAJE
// ==========================================

function mostrarMensaje(
    texto,
    tipo
){

    mensaje.textContent =
    texto;

    mensaje.className =
    "mensaje " + tipo;

}


// ==========================================
// VOLVER AL LOGIN
// ==========================================

btnVolver.addEventListener(
    "click",
    function(){

        window.location.href =
        "login.html";

    }
);


// ==========================================
// REGISTRO
// ==========================================

formRegistro.addEventListener(
    "submit",
    async function(evento){

        evento.preventDefault();


        const nombre =
        document
        .getElementById("nombre")
        .value
        .trim();


        const apellido =
        document
        .getElementById("apellido")
        .value
        .trim();


        const razonSocial =
        document
        .getElementById("razonSocial")
        .value
        .trim();


        const cuitValor =
        cuit.value.trim();


        const telefono =
        document
        .getElementById("telefono")
        .value
        .trim();


        const email =
        document
        .getElementById("email")
        .value
        .trim();


        const password =
        document
        .getElementById("password")
        .value;


        const passwordConfirmar =
        document
        .getElementById("passwordConfirmar")
        .value;


        // ======================================
        // VALIDACIONES
        // ======================================

        if(password !== passwordConfirmar){

            mostrarMensaje(
                "Las contraseñas no coinciden.",
                "error"
            );

            return;

        }


        if(password.length < 6){

            mostrarMensaje(
                "La contraseña debe tener al menos 6 caracteres.",
                "error"
            );

            return;

        }


        btnRegistro.disabled =
        true;

        btnRegistro.textContent =
        "Creando cuenta...";


        try{

            // ==================================
            // CREAR USUARIO
            // ==================================

            const resultado =
            await createUserWithEmailAndPassword(
                auth,
                email,
                password
            );


            const usuario =
            resultado.user;


            // ==================================
            // GUARDAR PERFIL EN FIRESTORE
            // ==================================

            await setDoc(

                doc(
                    db,
                    "usuarios",
                    usuario.uid
                ),

                {

                    uid:
                    usuario.uid,

                    nombre:
                    nombre,

                    apellido:
                    apellido,

                    razonSocial:
                    razonSocial,

                    cuit:
                    cuitValor,

                    telefono:
                    telefono,

                    email:
                    email,

                    creado:
                    serverTimestamp()

                }

            );


            // ==================================
            // ÉXITO
            // ==================================

            mostrarMensaje(
                "Cuenta creada correctamente.",
                "exito"
            );


            setTimeout(
                function(){

                    window.location.href =
                    "index.html";

                },
                1200
            );


        }catch(error){

            console.error(
                "Error Firebase:",
                error
            );


            let texto =
            "No se pudo crear la cuenta.";


            switch(error.code){

                case "auth/email-already-in-use":

                    texto =
                    "Ya existe una cuenta con ese email.";

                    break;


                case "auth/invalid-email":

                    texto =
                    "El email no es válido.";

                    break;


                case "auth/weak-password":

                    texto =
                    "La contraseña es demasiado débil.";

                    break;


                case "auth/operation-not-allowed":

                    texto =
                    "El registro con email y contraseña no está habilitado en Firebase.";

                    break;


                case "permission-denied":

                    texto =
                    "Firebase rechazó el acceso a los datos.";

                    break;


                default:

                    texto =
                    "Error al crear la cuenta: " +
                    error.message;

            }


            mostrarMensaje(
                texto,
                "error"
            );


            btnRegistro.disabled =
            false;

            btnRegistro.textContent =
            "Crear cuenta";

        }

    }
);

</script>


</body>

</html>
