<!DOCTYPE html>
<html lang="es">

<head>

<meta charset="UTF-8">

<meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
>

<meta
    name="theme-color"
    content="#111827"
>

<meta
    name="description"
    content="Registro de usuario - GESBASE"
>

<title>Crear cuenta - GESBASE</title>

<style>

*{
    box-sizing:border-box;
    margin:0;
    padding:0;
}

body{
    font-family:Arial,sans-serif;
    background:#f3f4f6;
    color:#111827;
    min-height:100vh;
}

.contenedor{
    width:100%;
    max-width:600px;
    min-height:100vh;
    margin:auto;
    background:white;
}

header{
    background:#111827;
    color:white;
    padding:28px 20px;
}

header h1{
    font-size:26px;
}

header p{
    margin-top:7px;
    font-size:14px;
    color:#d1d5db;
}

main{
    padding:20px;
}

.tarjeta{
    background:white;
    border:1px solid #e5e7eb;
    border-radius:14px;
    padding:20px;
    margin-bottom:18px;
}

.titulo{
    font-size:19px;
    font-weight:bold;
    margin-bottom:18px;
}

.campo{
    margin-bottom:16px;
}

label{
    display:block;
    font-size:14px;
    font-weight:bold;
    margin-bottom:7px;
}

input{
    width:100%;
    padding:14px;
    border:1px solid #d1d5db;
    border-radius:9px;
    font-size:16px;
    outline:none;
}

input:focus{
    border-color:#2563eb;
}

button{
    width:100%;
    padding:15px;
    border:none;
    border-radius:10px;
    background:#111827;
    color:white;
    font-size:16px;
    font-weight:bold;
    cursor:pointer;
    margin-top:5px;
}

button:disabled{
    opacity:.6;
    cursor:not-allowed;
}

.mensaje{
    display:none;
    padding:14px;
    border-radius:10px;
    margin-bottom:18px;
    font-size:14px;
    line-height:1.5;
}

.mensaje.error{
    display:block;
    background:#fee2e2;
    color:#991b1b;
}

.mensaje.exito{
    display:block;
    background:#dcfce7;
    color:#166534;
}

.mensaje.cargando{
    display:block;
    background:#f3f4f6;
    color:#374151;
}

.nota{
    margin-top:7px;
    font-size:12px;
    color:#6b7280;
    line-height:1.4;
}

.volver{
    display:block;
    width:100%;
    padding:15px;
    margin-top:10px;
    border-radius:10px;
    background:#e5e7eb;
    color:#111827;
    text-align:center;
    text-decoration:none;
    font-size:16px;
    font-weight:bold;
}

@media(max-width:480px){

    main{
        padding:15px;
    }

    .tarjeta{
        padding:17px;
    }

}

</style>

</head>

<body>

<div class="contenedor">

<header>

<h1>
🚀 Crear cuenta
</h1>

<p>
GESBASE — Gestión empresarial
</p>

</header>

<main>

<div
id="mensaje"
class="mensaje"
>
</div>


<div class="tarjeta">

<div class="titulo">
Datos personales
</div>


<div class="campo">

<label for="nombre">
Nombre
</label>

<input
type="text"
id="nombre"
placeholder="Tu nombre"
autocomplete="given-name"
>

</div>


<div class="campo">

<label for="apellido">
Apellido
</label>

<input
type="text"
id="apellido"
placeholder="Tu apellido"
autocomplete="family-name"
>

</div>


<div class="campo">

<label for="telefono">
Teléfono
</label>

<input
type="tel"
id="telefono"
placeholder="Ej.: 2991234567"
autocomplete="tel"
>

</div>

</div>


<div class="tarjeta">

<div class="titulo">
Datos de la empresa
</div>


<div class="campo">

<label for="nombreEmpresa">
Nombre de empresa
</label>

<input
type="text"
id="nombreEmpresa"
placeholder="Ej.: Mi Empresa"
autocomplete="organization"
>

</div>


<div class="campo">

<label for="razonSocial">
Razón social
</label>

<input
type="text"
id="razonSocial"
placeholder="Ej.: Battauz Julián Ezequiel"
autocomplete="organization"
>

</div>


<div class="campo">

<label for="cuit">
CUIT
</label>

<input
type="text"
id="cuit"
placeholder="Ej.: 20-00000000-0"
inputmode="numeric"
>

</div>

</div>


<div class="tarjeta">

<div class="titulo">
Datos de acceso
</div>


<div class="campo">

<label for="email">
Email
</label>

<input
type="email"
id="email"
placeholder="email@empresa.com"
autocomplete="email"
>

</div>


<div class="campo">

<label for="password">
Contraseña
</label>

<input
type="password"
id="password"
placeholder="Mínimo 6 caracteres"
autocomplete="new-password"
>

<div class="nota">
La contraseña debe tener al menos 6 caracteres.
</div>

</div>


<div class="campo">

<label for="password2">
Repetir contraseña
</label>

<input
type="password"
id="password2"
placeholder="Repetí tu contraseña"
autocomplete="new-password"
>

</div>


<button
type="button"
id="btnRegistrar"
>
CREAR CUENTA
</button>

</div>


<a
href="login.html"
class="volver"
>
⬅️ YA TENGO UNA CUENTA
</a>

</main>

</div>


<script type="module">

// =====================================================
// FIREBASE
// =====================================================

import {
    auth,
    db
} from "./Js/firebase.js";


import {
    createUserWithEmailAndPassword
} from
"https://www.gstatic.com/firebasejs/12.18.0/firebase-auth.js";


import {
    doc,
    setDoc,
    serverTimestamp
} from
"https://www.gstatic.com/firebasejs/12.18.0/firebase-firestore.js";


// =====================================================
// ELEMENTOS
// =====================================================

const nombre =
document.getElementById("nombre");

const apellido =
document.getElementById("apellido");

const telefono =
document.getElementById("telefono");

const nombreEmpresa =
document.getElementById("nombreEmpresa");

const razonSocial =
document.getElementById("razonSocial");

const cuit =
document.getElementById("cuit");

const email =
document.getElementById("email");

const password =
document.getElementById("password");

const password2 =
document.getElementById("password2");

const btnRegistrar =
document.getElementById("btnRegistrar");

const mensaje =
document.getElementById("mensaje");


// =====================================================
// MENSAJES
// =====================================================

function mostrarMensaje(
    texto,
    tipo
){

    mensaje.textContent =
    texto;

    mensaje.className =
    "mensaje " + tipo;

}


// =====================================================
// TEXTO
// =====================================================

function texto(valor){

    return String(
        valor || ""
    ).trim();

}


// =====================================================
// EMAIL
// =====================================================

function emailValido(valor){

    return /^[^\s@]+@[^\s@]+\.[^\s@]+$/
        .test(valor);

}


// =====================================================
// REGISTRAR
// =====================================================

async function registrar(){

    const nombreValor =
    texto(
        nombre.value
    );

    const apellidoValor =
    texto(
        apellido.value
    );

    const telefonoValor =
    texto(
        telefono.value
    );

    const nombreEmpresaValor =
    texto(
        nombreEmpresa.value
    );

    const razonSocialValor =
    texto(
        razonSocial.value
    );

    const cuitValor =
    texto(
        cuit.value
    );

    const emailValor =
    texto(
        email.value
    ).toLowerCase();

    const passwordValor =
    password.value;

    const password2Valor =
    password2.value;


    // =================================================
    // VALIDACIONES
    // =================================================

    if(!nombreValor){

        mostrarMensaje(
            "Ingresá tu nombre.",
            "error"
        );

        nombre.focus();

        return;

    }


    if(!apellidoValor){

        mostrarMensaje(
            "Ingresá tu apellido.",
            "error"
        );

        apellido.focus();

        return;

    }


    if(!telefonoValor){

        mostrarMensaje(
            "Ingresá tu teléfono.",
            "error"
        );

        telefono.focus();

        return;

    }


    if(!nombreEmpresaValor){

        mostrarMensaje(
            "Ingresá el nombre de la empresa.",
            "error"
        );

        nombreEmpresa.focus();

        return;

    }


    if(!razonSocialValor){

        mostrarMensaje(
            "Ingresá la razón social.",
            "error"
        );

        razonSocial.focus();

        return;

    }


    if(!emailValor){

        mostrarMensaje(
            "Ingresá tu email.",
            "error"
        );

        email.focus();

        return;

    }


    if(!emailValido(emailValor)){

        mostrarMensaje(
            "Ingresá un email válido.",
            "error"
        );

        email.focus();

        return;

    }


    if(passwordValor.length < 6){

        mostrarMensaje(
            "La contraseña debe tener al menos 6 caracteres.",
            "error"
        );

        password.focus();

        return;

    }


    if(passwordValor !== password2Valor){

        mostrarMensaje(
            "Las contraseñas no coinciden.",
            "error"
        );

        password2.focus();

        return;

    }


    // =================================================
    // BLOQUEAR BOTÓN
    // =================================================

    btnRegistrar.disabled =
    true;

    btnRegistrar.textContent =
    "CREANDO CUENTA...";


    mostrarMensaje(
        "Creando tu cuenta en GESBASE...",
        "cargando"
    );


    try{

        // =================================================
        // CREAR CUENTA FIREBASE AUTH
        // =================================================

        const resultado =
        await createUserWithEmailAndPassword(
            auth,
            emailValor,
            passwordValor
        );


        const usuario =
        resultado.user;


        const uid =
        usuario.uid;


        /*
         * IMPORTANTE:
         *
         * La empresa tendrá como ID
         * el mismo UID del propietario.
         *
         * Esto mantiene compatible:
         *
         * usuarios/{uid}
         * empresas/{uid}
         */

        const empresaId =
        uid;


        // =================================================
        // CREAR DOCUMENTO DEL USUARIO
        // =================================================

        await setDoc(

            doc(
                db,
                "usuarios",
                uid
            ),

            {

                uid:
                uid,

                nombre:
                nombreValor,

                apellido:
                apellidoValor,

                email:
                emailValor,

                telefono:
                telefonoValor,

                empresaId:
                empresaId,

                nombreEmpresa:
                nombreEmpresaValor,

                razonSocial:
                razonSocialValor,

                cuit:
                cuitValor,

                perfil:
                "administrador",

                rol:
                "administrador",

                plan:
                "prueba",

                estadoSuscripcion:
                "prueba",

                fechaInicio:
                serverTimestamp(),

                fechaVencimiento:
                null,

                numeracionPresupuestos:
                1,

                creado:
                serverTimestamp(),

                actualizado:
                serverTimestamp()

            }

        );


        // =================================================
        // CREAR DOCUMENTO DE EMPRESA
        // =================================================

        await setDoc(

            doc(
                db,
                "empresas",
                empresaId
            ),

            {

                empresaId:
                empresaId,

                uid:
                uid,

                ownerUid:
                uid,

                nombreEmpresa:
                nombreEmpresaValor,

                razonSocial:
                razonSocialValor,

                cuit:
                cuitValor,

                telefono:
                telefonoValor,

                email:
                emailValor,

                direccion:
                "",

                logoUrl:
                "",

                creado:
                serverTimestamp(),

                actualizado:
                serverTimestamp()

            }

        );


        // =================================================
        // ÉXITO
        // =================================================

        mostrarMensaje(
            "✅ Cuenta creada correctamente. Entrando a GESBASE...",
            "exito"
        );


        setTimeout(
            function(){

                window.location.replace(
                    "empresa.html"
                );

            },
            1000
        );


    }
    catch(error){

        console.error(
            "ERROR REGISTRANDO USUARIO:",
            error
        );


        let mensajeError =
        "No se pudo crear la cuenta.";


        if(
            error.code ===
            "auth/email-already-in-use"
        ){

            mensajeError =
            "Ese email ya está registrado. Iniciá sesión.";

        }
        else if(
            error.code ===
            "auth/invalid-email"
        ){

            mensajeError =
            "El email no es válido.";

        }
        else if(
            error.code ===
            "auth/weak-password"
        ){

            mensajeError =
            "La contraseña es demasiado débil. Usá al menos 6 caracteres.";

        }
        else if(
            error.code ===
            "auth/api-key-not-valid"
        ){

            mensajeError =
            "La configuración de Firebase no es válida. Revisá firebase.js.";

        }
        else if(
            error.code ===
            "permission-denied"
        ){

            mensajeError =
            "Firebase rechazó el acceso a Firestore. Revisá las reglas.";

        }
        else if(
            error.message
        ){

            mensajeError =
            error.message;

        }


        mostrarMensaje(
            "❌ " +
            mensajeError,
            "error"
        );


        btnRegistrar.disabled =
        false;

        btnRegistrar.textContent =
        "CREAR CUENTA";

    }

}


// =====================================================
// BOTÓN
// =====================================================

btnRegistrar.addEventListener(
    "click",
    registrar
);


// =====================================================
// ENTER
// =====================================================

document.addEventListener(
    "keydown",
    function(evento){

        if(
            evento.key ===
            "Enter"
        ){

            registrar();

        }

    }
);

</script>

</body>

</html>
