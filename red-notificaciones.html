<!DOCTYPE html>
<html lang="es-AR">

<head>

<meta charset="UTF-8">

<meta
    name="viewport"
    content="width=device-width, initial-scale=1.0, viewport-fit=cover"
>

<meta name="theme-color" content="#111827">

<meta
    name="description"
    content="Notificaciones de Red GESBASE"
>

<title>Notificaciones - Red GESBASE</title>

<style>

*{
    box-sizing:border-box;
    margin:0;
    padding:0;
}

html,
body{
    width:100%;
    min-height:100%;
}

body{
    font-family:
        -apple-system,
        BlinkMacSystemFont,
        "Segoe UI",
        Roboto,
        Arial,
        sans-serif;

    background:#f3f4f6;
    color:#111827;

    padding-bottom:90px;
}

/* =========================
   HEADER
========================= */

.header{
    position:sticky;
    top:0;
    z-index:100;

    width:100%;

    background:#111827;
    color:white;

    padding:
        calc(14px + env(safe-area-inset-top))
        18px
        14px;

    box-shadow:0 2px 12px rgba(0,0,0,.15);
}

.header-inner{
    width:100%;
    max-width:1100px;
    margin:auto;

    display:flex;
    align-items:center;
    justify-content:space-between;
    gap:12px;
}

.header-title{
    display:flex;
    align-items:center;
    gap:10px;
}

.header-icon{
    width:42px;
    height:42px;

    border-radius:50%;

    background:#1f2937;

    display:flex;
    align-items:center;
    justify-content:center;

    font-size:21px;
}

.header-title h1{
    font-size:20px;
    font-weight:700;
}

.header-title p{
    font-size:12px;
    color:#9ca3af;
    margin-top:2px;
}

.header-count{
    min-width:28px;
    height:28px;

    padding:0 8px;

    border-radius:20px;

    background:#ef4444;
    color:white;

    display:none;
    align-items:center;
    justify-content:center;

    font-size:13px;
    font-weight:700;
}

/* =========================
   CONTENEDOR
========================= */

.container{
    width:100%;
    max-width:900px;

    margin:0 auto;

    padding:18px 14px 30px;
}

/* =========================
   RESUMEN
========================= */

.summary{
    background:white;

    border-radius:16px;

    padding:18px;

    margin-bottom:16px;

    box-shadow:0 2px 10px rgba(0,0,0,.06);

    display:flex;
    align-items:center;
    justify-content:space-between;

    gap:15px;
}

.summary-text h2{
    font-size:18px;
    margin-bottom:5px;
}

.summary-text p{
    font-size:13px;
    color:#6b7280;
}

.summary-number{
    width:52px;
    height:52px;

    border-radius:50%;

    background:#eef2ff;
    color:#3730a3;

    display:flex;
    align-items:center;
    justify-content:center;

    font-size:20px;
    font-weight:800;

    flex-shrink:0;
}

/* =========================
   LISTA
========================= */

#listaNotificaciones{
    display:flex;
    flex-direction:column;
    gap:10px;
}

/* =========================
   NOTIFICACIÓN
========================= */

.notification{
    position:relative;

    width:100%;

    background:white;

    border-radius:16px;

    padding:15px;

    display:flex;
    align-items:flex-start;

    gap:13px;

    box-shadow:0 2px 9px rgba(0,0,0,.05);

    border:1px solid transparent;

    cursor:pointer;

    transition:
        transform .15s ease,
        box-shadow .15s ease,
        background .15s ease;
}

.notification:active{
    transform:scale(.99);
}

.notification.unread{
    background:#eef2ff;
    border-color:#c7d2fe;
}

.notification.unread::before{
    content:"";

    position:absolute;

    left:0;
    top:14px;
    bottom:14px;

    width:4px;

    border-radius:0 5px 5px 0;

    background:#4f46e5;
}

/* =========================
   ICONO
========================= */

.notification-icon{
    width:46px;
    height:46px;

    min-width:46px;

    border-radius:50%;

    background:#f3f4f6;

    display:flex;
    align-items:center;
    justify-content:center;

    font-size:21px;
}

.notification.unread .notification-icon{
    background:#e0e7ff;
}

/* =========================
   CONTENIDO
========================= */

.notification-content{
    flex:1;
    min-width:0;
}

.notification-title{
    font-size:15px;
    font-weight:700;

    color:#111827;

    margin-bottom:4px;
}

.notification-message{
    font-size:14px;
    line-height:1.45;

    color:#4b5563;

    word-break:break-word;
}

.notification-date{
    font-size:11px;

    color:#9ca3af;

    margin-top:7px;
}

.notification-status{
    width:9px;
    height:9px;

    min-width:9px;

    border-radius:50%;

    background:#4f46e5;

    margin-top:7px;
}

.notification:not(.unread) .notification-status{
    visibility:hidden;
}

/* =========================
   VACÍO
========================= */

.empty{
    background:white;

    border-radius:18px;

    padding:45px 22px;

    text-align:center;

    box-shadow:0 2px 10px rgba(0,0,0,.05);
}

.empty-icon{
    font-size:48px;
    margin-bottom:12px;
}

.empty h3{
    font-size:18px;
    margin-bottom:7px;
}

.empty p{
    font-size:14px;
    color:#6b7280;
}

/* =========================
   CARGANDO
========================= */

.loading{
    background:white;

    border-radius:16px;

    padding:35px 20px;

    text-align:center;

    color:#6b7280;

    box-shadow:0 2px 10px rgba(0,0,0,.05);
}

.spinner{
    width:30px;
    height:30px;

    border:3px solid #e5e7eb;
    border-top-color:#4f46e5;

    border-radius:50%;

    margin:0 auto 12px;

    animation:girar .8s linear infinite;
}

@keyframes girar{
    to{
        transform:rotate(360deg);
    }
}

/* =========================
   ERROR
========================= */

.error{
    background:#fff1f2;

    color:#be123c;

    border:1px solid #fecdd3;

    border-radius:14px;

    padding:16px;

    font-size:14px;

    line-height:1.5;

    margin-bottom:12px;
}

/* =========================
   BOTÓN
========================= */

.read-all{
    width:100%;

    border:0;

    background:#111827;
    color:white;

    border-radius:12px;

    padding:13px 16px;

    font-size:14px;
    font-weight:700;

    cursor:pointer;

    margin-top:5px;
}

.read-all:active{
    transform:scale(.99);
}

.read-all:disabled{
    opacity:.5;
    cursor:not-allowed;
}

/* =========================
   NAVEGACIÓN
========================= */

.bottom-nav{
    position:fixed;

    left:0;
    right:0;
    bottom:0;

    z-index:200;

    background:white;

    border-top:1px solid #e5e7eb;

    padding:
        8px
        8px
        calc(8px + env(safe-area-inset-bottom));

    box-shadow:0 -3px 15px rgba(0,0,0,.08);
}

.bottom-nav-inner{
    width:100%;
    max-width:700px;

    margin:auto;

    display:grid;

    grid-template-columns:
        repeat(5, 1fr);

    gap:3px;
}

.nav-item{
    position:relative;

    border:0;
    background:transparent;

    color:#6b7280;

    padding:7px 2px;

    border-radius:10px;

    cursor:pointer;

    display:flex;
    flex-direction:column;
    align-items:center;
    justify-content:center;

    gap:3px;

    font-size:10px;
}

.nav-item span:first-child{
    font-size:21px;
    line-height:22px;
}

.nav-item.active{
    color:#111827;
    background:#f3f4f6;
}

.nav-badge{
    position:absolute;

    top:1px;
    right:calc(50% - 18px);

    min-width:16px;
    height:16px;

    padding:0 4px;

    border-radius:20px;

    background:#ef4444;
    color:white;

    display:none;
    align-items:center;
    justify-content:center;

    font-size:9px;
    font-weight:800;

    border:2px solid white;
}

/* =========================
   TABLET
========================= */

@media (min-width:700px){

    .container{
        padding:25px 22px 35px;
    }

    .header{
        padding-left:24px;
        padding-right:24px;
    }

    .notification{
        padding:18px;
    }

    .notification-title{
        font-size:16px;
    }

}

/* =========================
   DESKTOP
========================= */

@media (min-width:1000px){

    body{
        padding-bottom:20px;
    }

    .header{
        padding-top:15px;
        padding-bottom:15px;
    }

    .container{
        padding-top:30px;
    }

    .bottom-nav{
        position:static;

        background:transparent;

        border:0;

        box-shadow:none;

        padding:0 20px 25px;
    }

    .bottom-nav-inner{
        background:white;

        border-radius:15px;

        padding:7px;

        box-shadow:0 2px 10px rgba(0,0,0,.05);
    }

}

</style>

</head>

<body>


<!-- =========================
     HEADER
========================= -->

<header class="header">

    <div class="header-inner">

        <div class="header-title">

            <div class="header-icon">
                🔔
            </div>

            <div>

                <h1>Notificaciones</h1>

                <p>Red GESBASE</p>

            </div>

        </div>

        <div
            id="contadorHeader"
            class="header-count"
        >
            0
        </div>

    </div>

</header>


<!-- =========================
     CONTENIDO
========================= -->

<main class="container">

    <section class="summary">

        <div class="summary-text">

            <h2>Tus notificaciones</h2>

            <p id="textoResumen">
                Cargando notificaciones...
            </p>

        </div>

        <div
            id="contadorGrande"
            class="summary-number"
        >
            0
        </div>

    </section>


    <button
        id="btnLeerTodas"
        class="read-all"
        disabled
    >
        ✓ Marcar todas como leídas
    </button>

    <div id="mensaje"></div>

        <div class="loading">

            <div class="spinner"></div>

        </div>

    </section>

</main>


<!-- =========================
     NAVEGACIÓN
========================= -->

<nav class="bottom-nav">

    <div class="bottom-nav-inner">

        <button
            class="nav-item"
            onclick="irA('red.html')"
        >
            <span>🏠</span>
            <span>Inicio</span>
        </button>


        <button
            class="nav-item"
            onclick="irA('red-buscar.html')"
        >
            <span>🔎</span>
            <span>Buscar</span>
        </button>

            class="nav-item"
            onclick="irA('conexiones.html')"
        >
            <span>👥</span>

        </button>


        <button
            class="nav-item active"
            onclick="irA('red-notificaciones.html')"
        >

            <span>Notificaciones</span>

            <span
                id="badgeNav"

            >

            </span>

        </button>


        <button
            class="nav-item"

        >
            <span>👤</span>
            <span>Perfil</span>
        </button>

    </div>

</nav>


<!-- =========================
     FIREBASE
========================= -->

<script type="module">

import {
    auth,
    db
} from "./Js/firebase.js";


import {
    onAuthStateChanged
} from "https://www.gstatic.com/firebasejs/12.18.0/firebase-auth.js";


import {
    collection,
    query,
    where,
    onSnapshot,
    updateDoc,
    doc,
    writeBatch
} from "https://www.gstatic.com/firebasejs/12.18.0/firebase-firestore.js";


/* =========================
   ELEMENTOS
========================= */

const lista =
    document.getElementById(
        "listaNotificaciones"
    );

const mensaje =
    document.getElementById(
        "mensaje"
    );

const contadorHeader =
    document.getElementById(
        "contadorHeader"
    );

const contadorGrande =
    document.getElementById(
        "contadorGrande"
    );

const badgeNav =
    document.getElementById(
        "badgeNav"
    );

const textoResumen =
    document.getElementById(
        "textoResumen"
    );

const btnLeerTodas =
    document.getElementById(
        "btnLeerTodas"
    );


let usuarioActual = null;

let notificacionesActuales = [];

let detenerEscucha = null;


/* =========================
   NAVEGACIÓN
========================= */

window.irA = function(ruta){

    window.location.href = ruta;

};


/* =========================
   AUTENTICACIÓN
========================= */

onAuthStateChanged(
    auth,
    (user) => {

        if(!user){

            window.location.href =
                "red-login.html";

            return;

        }

        usuarioActual = user;

        escucharNotificaciones();

    }
);


/* =========================
   ESCUCHAR NOTIFICACIONES
========================= */

function escucharNotificaciones(){

    if(detenerEscucha){

        detenerEscucha();

    }


    /*
     * IMPORTANTE:
     *
     * No usamos orderBy("fecha").
     *
     * Esto evita el índice compuesto
     * que Firebase estaba solicitando.
     */

    const consulta =
        query(

            collection(
                db,
                "notificaciones"
            ),

            where(
                "receptorUid",
                "==",
                usuarioActual.uid
            )

        );


    detenerEscucha =
        onSnapshot(

            consulta,

            (snapshot) => {

                notificacionesActuales =
                    snapshot.docs.map(
                        documento => ({

                            id:
                                documento.id,

                            ...documento.data()

                        })
                    );


                /*
                 * Ordenamos localmente por fecha.
                 */

                notificacionesActuales.sort(
                    (a,b) => {

                        return obtenerMilisegundos(
                            b.fecha
                        )
                        -
                        obtenerMilisegundos(
                            a.fecha
                        );

                    }
                );


                renderizarNotificaciones();

            },

            (error) => {

                console.error(
                    "Error notificacions:",
                    error
                );


                lista.innerHTML = "";

                mensaje.innerHTML = `

                    <div class="error">

                        <strong>
                            No se pudieron cargar las notificaciones.
                        </strong>

                        <br><br>

                        ${escaparHTML(error.message)}

                    </div>

                `;

            }

        );

}


/* =========================
   RENDERIZAR
========================= */

function renderizarNotificaciones(){

    lista.innerHTML = "";

    mensaje.innerHTML = "";


    const total =
        notificacionesActuales.length;


    const noLeidas =
        notificacionesActuales.filter(
            n => n.leida !== true
        ).length;


    actualizarContadores(
        noLeidas
    );


    if(total === 0){

        textoResumen.textContent =
            "No tenés notificaciones nuevas.";


        btnLeerTodas.disabled =
            true;


        lista.innerHTML = `

            <div class="empty">

                <div class="empty-icon">
                    🔔
                </div>

                <h3>
                    No hay notificaciones
                </h3>

                <p>
                    Cuando alguien interactúe con vos,
                    las notificaciones aparecerán acá.
                </p>

            </div>

        `;

        return;

    }


    textoResumen.textContent =
        noLeidas === 0
            ? "Todas tus notificaciones están leídas."
            : `${noLeidas} ${noLeidas === 1 ? "notificación no leída" : "notificaciones no leídas"}.`;


    btnLeerTodas.disabled =
        noLeidas === 0;


    notificacionesActuales.forEach(
        notificacion => {

            lista.appendChild(
                crearNotificacion(
                    notificacion
                )
            );

        }
    );

}


/* =========================
   CREAR NOTIFICACIÓN
========================= */

function crearNotificacion(
    notificacion
){

    const elemento =
        document.createElement(
            "article"
        );


    const estaLeida =
        notificacion.leida === true;


    elemento.className =
        "notification" +
        (
            estaLeida
                ? ""
                : " unread"
        );


    elemento.dataset.id =
        notificacion.id;


    const tipo =
        notificacion.tipo ||
        "general";


    const icono =
        obtenerIcono(tipo);


    const titulo =
        notificacion.titulo ||
        obtenerTitulo(tipo);


    const texto =
        notificacion.mensaje ||
        "Tenés una nueva notificación.";


    const fecha =
        formatearFecha(
            notificacion.fecha
        );


    elemento.innerHTML = `

        <div class="notification-icon">
            ${icono}
        </div>

        <div class="notification-content">

            <div class="notification-title">
                ${escaparHTML(titulo)}
            </div>

            <div class="notification-message">
                ${escaparHTML(texto)}
            </div>

            <div class="notification-date">
                ${fecha}
            </div>

        </div>

        <div class="notification-status"></div>

    `;


    elemento.addEventListener(
        "click",
        () => {

            abrirNotificacion(
                notificacion
            );

        }
    );


    return elemento;

}


/* =========================
   ABRIR
========================= */

async function abrirNotificacion(
    notificacion
){

    try{

        /*
         * AQUÍ ocurre la lectura automática.
         *
         * Si estaba sin leer,
         * inmediatamente pasa a leída.
         */

        if(
            notificacion.leida !== true
        ){

            await updateDoc(

                doc(
                    db,
                    "notificaciones",
                    notificacion.id
                ),

                {
                    leida:true
                }

            );

        }


        /*
         * Si tiene URL,
         * vamos al destino.
         */

        if(
            notificacion.url
        ){

            window.location.href =
                notificacion.url;

            return;

        }


        /*
         * Publicación.
         */

        if(
            notificacion.tipo ===
            "publicacion"
            &&
            notificacion.referenciaId
        ){

            window.location.href =
                "red.html?publicacion=" +
                encodeURIComponent(
                    notificacion.referenciaId
                );

            return;

        }


        /*
         * Conexiones.
         */

        if(
            notificacion.tipo ===
                "solicitud_conexion"
            ||
            notificacion.tipo ===
                "conexion_aceptada"
        ){

            window.location.href =
                "conexiones.html";

            return;

        }


        /*
         * Si no tiene destino,
         * permanece en notificaciones.
         */

        renderizarNotificaciones();

    }
    catch(error){

        console.error(
            "Error al marcar:",
            error
        );


        mostrarError(
            "No se pudo actualizar la notificación."
        );

    }

}


/* =========================
   MARCAR TODAS
========================= */

btnLeerTodas.addEventListener(
    "click",
    async () => {

        const pendientes =
            notificacionesActuales.filter(
                n => n.leida !== true
            );


        if(
            pendientes.length === 0
        ){

            return;

        }


        btnLeerTodas.disabled =
            true;


        btnLeerTodas.textContent =
            "Marcando...";


        try{

            const lote =
                writeBatch(db);


            pendientes.forEach(
                notificacion => {

                    lote.update(

                        doc(
                            db,
                            "notificaciones",
                            notificacion.id
                        ),

                        {
                            leida:true
                        }

                    );

                }
            );


            await lote.commit();

        }
        catch(error){

            console.error(
                "Error:",
                error
            );


            mostrarError(
                "No se pudieron marcar todas como leídas."
            );

        }
        finally{

            btnLeerTodas.textContent =
                "✓ Marcar todas como leídas";

        }

    }
);


/* =========================
   CONTADORES
========================= */

function actualizarContadores(
    cantidad
){

    contadorGrande.textContent =
        cantidad;


    if(cantidad > 0){

        contadorHeader.style.display =
            "flex";


        contadorHeader.textContent =
            cantidad > 99
                ? "99+"
                : cantidad;


        badgeNav.style.display =
            "flex";


        badgeNav.textContent =
            cantidad > 99
                ? "99+"
                : cantidad;

    }
    else{

        contadorHeader.style.display =
            "none";


        badgeNav.style.display =
            "none";

    }

}


/* =========================
   ICONOS
========================= */

function obtenerIcono(tipo){

    switch(tipo){

        case "solicitud_conexion":
            return "👤";

        case "conexion_aceptada":
            return "🤝";

        case "publicacion":
            return "📝";

        case "me_gusta":
            return "👍";

        case "comentario":
            return "💬";

        case "mencion":
            return "📣";

        case "mensaje":
            return "💬";

        default:
            return "🔔";

    }

}


/* =========================
   TÍTULOS
========================= */

function obtenerTitulo(tipo){

    switch(tipo){

        case "solicitud_conexion":
            return "Nueva solicitud de conexión";

        case "conexion_aceptada":
            return "Solicitud de conexión aceptada";

        case "publicacion":
            return "Nueva publicación";

        case "me_gusta":
            return "A alguien le gusta tu publicación";

        case "comentario":
            return "Nuevo comentario";

        case "mencion":
            return "Te mencionaron";

        case "mensaje":
            return "Nuevo mensaje";

        default:
            return "Nueva notificación";

    }

}


/* =========================
   FECHA → MILISEGUNDOS
========================= */

function obtenerMilisegundos(
    fecha
){

    if(!fecha){

        return 0;

    }


    try{

        if(
            typeof fecha.toDate ===
            "function"
        ){

            return fecha.toDate().getTime();

        }


        if(
            typeof fecha.seconds ===
            "number"
        ){

            return fecha.seconds * 1000;

        }


        const fechaConvertida =
            new Date(fecha);


        const tiempo =
            fechaConvertida.getTime();


        return Number.isNaN(tiempo)
            ? 0
            : tiempo;

    }
    catch{

        return 0;

    }

}


/* =========================
   FORMATEAR FECHA
========================= */

function formatearFecha(
    fecha
){

    const tiempo =
        obtenerMilisegundos(
            fecha
        );


    if(!tiempo){

        return "Ahora";

    }


    try{

        return new Date(
            tiempo
        ).toLocaleString(
            "es-AR",
            {
                day:"2-digit",
                month:"2-digit",
                year:"numeric",
                hour:"2-digit",
                minute:"2-digit"
            }
        );

    }
    catch{

        return "Ahora";

    }

}


/* =========================
   ESCAPAR HTML
========================= */

function escaparHTML(
    texto
){

    return String(
        texto ?? ""
    )
    .replaceAll(
        "&",
        "&amp;"
    )
    .replaceAll(
        "<",
        "&lt;"
    )
    .replaceAll(
        ">",
        "&gt;"
    )
    .replaceAll(
        '"',
        "&quot;"
    )
    .replaceAll(
        "'",
        "&#039;"
    );

}


/* =========================
   ERROR
========================= */

function mostrarError(
    texto
){

    mensaje.innerHTML = `

        <div class="error">

            ${escaparHTML(texto)}

        </div>

    `;

}
