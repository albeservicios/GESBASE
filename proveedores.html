<!DOCTYPE html>
<html lang="es">

<head>

<meta charset="UTF-8">

<meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
>

<meta
    name="theme-color"
    content="#111827"
>

<meta
    name="description"
    content="GESBASE - Gestión de proveedores"
>

<title>Proveedores - GESBASE</title>

<style>

*{
    box-sizing:border-box;
    margin:0;
    padding:0;
}

body{
    font-family:Arial,Helvetica,sans-serif;
    background:#f3f4f6;
    color:#111827;
    min-height:100vh;
}

header{
    background:#111827;
    color:white;
    padding:20px 16px;
    text-align:center;
}

header h1{
    font-size:25px;
    margin-bottom:6px;
}

header p{
    color:#d1d5db;
    font-size:14px;
}

.contenedor{
    width:100%;
    max-width:1100px;
    margin:auto;
    padding:18px;
}

.volver{
    display:inline-block;
    margin-bottom:16px;
    color:#2563eb;
    text-decoration:none;
    font-weight:bold;
    font-size:14px;
}

.volver:hover{
    text-decoration:underline;
}

.card{
    background:white;
    border-radius:15px;
    padding:18px;
    margin-bottom:18px;
    box-shadow:0 2px 9px rgba(0,0,0,.08);
}

.card h2{
    font-size:19px;
    margin-bottom:16px;
}

.grid{
    display:grid;
    grid-template-columns:1fr 1fr;
    gap:14px;
}

.full{
    grid-column:1 / -1;
}

.campo label{
    display:block;
    font-size:13px;
    font-weight:bold;
    color:#374151;
    margin-bottom:6px;
}

input,
textarea{
    width:100%;
    border:1px solid #d1d5db;
    border-radius:10px;
    padding:12px 13px;
    font-size:15px;
    font-family:Arial,Helvetica,sans-serif;
    color:#111827;
    background:white;
}

input:focus,
textarea:focus{
    outline:none;
    border-color:#2563eb;
    box-shadow:0 0 0 3px rgba(37,99,235,.12);
}

textarea{
    min-height:90px;
    resize:vertical;
}

.botones{
    display:flex;
    gap:10px;
    margin-top:4px;
}

button{
    border:0;
    border-radius:10px;
    padding:13px 16px;
    font-size:15px;
    font-weight:bold;
    cursor:pointer;
}

.btn-principal{
    background:#2563eb;
    color:white;
    flex:1;
}

.btn-principal:hover{
    background:#1d4ed8;
}

.btn-principal:disabled{
    opacity:.6;
    cursor:not-allowed;
}

.btn-cancelar{
    background:#e5e7eb;
    color:#111827;
    display:none;
}

.busqueda{
    margin-bottom:14px;
}

.tabla-contenedor{
    width:100%;
    overflow-x:auto;
}

table{
    width:100%;
    min-width:800px;
    border-collapse:collapse;
}

th,
td{
    padding:11px 10px;
    border-bottom:1px solid #e5e7eb;
    text-align:left;
    font-size:14px;
    vertical-align:middle;
}

th{
    background:#f9fafb;
    font-size:13px;
    color:#374151;
}

td strong{
    display:block;
    margin-bottom:3px;
}

.secundario{
    color:#6b7280;
    font-size:12px;
}

.acciones{
    display:flex;
    gap:6px;
}

.btn-editar{
    background:#dbeafe;
    color:#1d4ed8;
    padding:8px 10px;
}

.btn-eliminar{
    background:#fee2e2;
    color:#b91c1c;
    padding:8px 10px;
}

.estado{
    text-align:center;
    padding:20px;
    color:#6b7280;
}

.mensaje{
    display:none;
    padding:13px 15px;
    border-radius:10px;
    margin-bottom:16px;
    font-size:14px;
    line-height:1.5;
    font-weight:bold;
}

.mensaje.exito{
    display:block;
    background:#dcfce7;
    color:#166534;
    border:1px solid #bbf7d0;
}

.mensaje.error{
    display:block;
    background:#fee2e2;
    color:#991b1b;
    border:1px solid #fecaca;
}

.mensaje.info{
    display:block;
    background:#dbeafe;
    color:#1e40af;
    border:1px solid #bfdbfe;
}

.resumen{
    display:grid;
    grid-template-columns:repeat(3,1fr);
    gap:12px;
    margin-bottom:18px;
}

.resumen-card{
    background:#f9fafb;
    border:1px solid #e5e7eb;
    border-radius:12px;
    padding:15px;
}

.resumen-card .numero{
    font-size:23px;
    font-weight:bold;
    margin-top:5px;
}

.resumen-card .titulo{
    color:#6b7280;
    font-size:13px;
}

.cargando{
    text-align:center;
    padding:20px;
    color:#6b7280;
}

.oculto{
    display:none !important;
}

@media(max-width:768px){

    .contenedor{
        padding:14px;
    }

    .grid{
        grid-template-columns:1fr;
    }

    .full{
        grid-column:auto;
    }

    .resumen{
        grid-template-columns:1fr;
    }

    .botones{
        flex-direction:column;
    }

    .btn-cancelar{
        width:100%;
    }

    .card{
        padding:15px;
    }

}

@media(max-width:480px){

    header{
        padding:18px 12px;
    }

    header h1{
        font-size:22px;
    }

    .contenedor{
        padding:10px;
    }

    .card{
        border-radius:12px;
        padding:13px;
    }

    input,
    textarea{
        font-size:16px;
    }

}

</style>

</head>

<body>

<header>

    <h1>🏢 Proveedores</h1>

    <p>
        GESBASE Comercio
    </p>

</header>


<div class="contenedor">

    <a
        href="index.html"
        class="volver"
    >
        ← Volver al panel
    </a>


    <div
        id="mensaje"
        class="mensaje"
    ></div>


    <!-- =====================================================
         RESUMEN
    ====================================================== -->

    <div class="resumen">

        <div class="resumen-card">

            <div class="titulo">
                Proveedores registrados
            </div>

            <div
                class="numero"
                id="totalProveedores"
            >
                0
            </div>

        </div>


        <div class="resumen-card">

            <div class="titulo">
                Proveedores activos
            </div>

            <div
                class="numero"
                id="proveedoresActivos"
            >
                0
            </div>

        </div>


        <div class="resumen-card">

            <div class="titulo">
                Última actualización
            </div>

            <div
                class="numero"
                id="ultimaActualizacion"
                style="font-size:16px;"
            >
                —
            </div>

        </div>

    </div>


    <!-- =====================================================
         FORMULARIO
    ====================================================== -->

    <div class="card">

        <h2 id="tituloFormulario">
            ➕ Nuevo proveedor
        </h2>


        <form id="proveedorForm">

            <div class="grid">


                <div class="campo">

                    <label for="nombre">
                        Nombre / Razón social *
                    </label>

                    <input
                        type="text"
                        id="nombre"
                        placeholder="Ej. Distribuidora del Sur"
                        maxlength="150"
                        required
                    >

                </div>


                <div class="campo">

                    <label for="cuit">
                        CUIT
                    </label>

                    <input
                        type="text"
                        id="cuit"
                        placeholder="Ej. 30-12345678-9"
                        maxlength="20"
                    >

                </div>


                <div class="campo">

                    <label for="contacto">
                        Persona de contacto
                    </label>

                    <input
                        type="text"
                        id="contacto"
                        placeholder="Nombre del contacto"
                        maxlength="100"
                    >

                </div>


                <div class="campo">

                    <label for="telefono">
                        Teléfono
                    </label>

                    <input
                        type="tel"
                        id="telefono"
                        placeholder="Ej. 299 1234567"
                        maxlength="40"
                    >

                </div>


                <div class="campo">

                    <label for="email">
                        Correo electrónico
                    </label>

                    <input
                        type="email"
                        id="email"
                        placeholder="proveedor@email.com"
                        maxlength="150"
                    >

                </div>


                <div class="campo">

                    <label for="direccion">
                        Dirección
                    </label>

                    <input
                        type="text"
                        id="direccion"
                        placeholder="Calle y número"
                        maxlength="200"
                    >

                </div>


                <div class="campo full">

                    <label for="observaciones">
                        Observaciones
                    </label>

                    <textarea
                        id="observaciones"
                        placeholder="Condiciones de pago, horarios, información adicional..."
                        maxlength="1000"
                    ></textarea>

                </div>


                <div class="campo full">

                    <div class="botones">

                        <button
                            type="submit"
                            class="btn-principal"
                            id="btnGuardar"
                        >
                            Guardar proveedor
                        </button>


                        <button
                            type="button"
                            class="btn-cancelar"
                            id="btnCancelar"
                        >
                            Cancelar edición
                        </button>

                    </div>

                </div>

            </div>

        </form>

    </div>


    <!-- =====================================================
         LISTADO
    ====================================================== -->

    <div class="card">

        <h2>
            📋 Mis proveedores
        </h2>


        <input
            type="search"
            id="buscar"
            class="busqueda"
            placeholder="🔎 Buscar por nombre, CUIT, teléfono o contacto..."
        >


        <div
            id="cargando"
            class="cargando"
        >
            Cargando proveedores...
        </div>


        <div
            class="tabla-contenedor"
            id="contenedorTabla"
            style="display:none;"
        >

            <table>

                <thead>

                    <tr>

                        <th>
                            Proveedor
                        </th>

                        <th>
                            CUIT
                        </th>

                        <th>
                            Contacto
                        </th>

                        <th>
                            Teléfono
                        </th>

                        <th>
                            Email
                        </th>

                        <th>
                            Acciones
                        </th>

                    </tr>

                </thead>

                <tbody
                    id="listaProveedores"
                ></tbody>

            </table>

        </div>

    </div>

</div>


<script type="module">

/* =========================================================
   FIREBASE
========================================================= */

import {
    auth,
    db
} from "./Js/firebase.js";


import {
    onAuthStateChanged
} from "https://www.gstatic.com/firebasejs/12.18.0/firebase-auth.js";


import {
    collection,
    addDoc,
    getDocs,
    getDoc,
    updateDoc,
    deleteDoc,
    doc,
    query,
    where,
    serverTimestamp
} from "https://www.gstatic.com/firebasejs/12.18.0/firebase-firestore.js";


/* =========================================================
   ELEMENTOS
========================================================= */

const proveedorForm =
    document.getElementById("proveedorForm");

const nombreInput =
    document.getElementById("nombre");

const cuitInput =
    document.getElementById("cuit");

const contactoInput =
    document.getElementById("contacto");

const telefonoInput =
    document.getElementById("telefono");

const emailInput =
    document.getElementById("email");

const direccionInput =
    document.getElementById("direccion");

const observacionesInput =
    document.getElementById("observaciones");

const btnGuardar =
    document.getElementById("btnGuardar");

const btnCancelar =
    document.getElementById("btnCancelar");

const tituloFormulario =
    document.getElementById("tituloFormulario");

const buscarInput =
    document.getElementById("buscar");

const listaProveedores =
    document.getElementById("listaProveedores");

const cargando =
    document.getElementById("cargando");

const contenedorTabla =
    document.getElementById("contenedorTabla");

const mensaje =
    document.getElementById("mensaje");

const totalProveedores =
    document.getElementById("totalProveedores");

const proveedoresActivos =
    document.getElementById("proveedoresActivos");

const ultimaActualizacion =
    document.getElementById("ultimaActualizacion");


/* =========================================================
   VARIABLES
========================================================= */

let usuarioActual = null;

let empresaId = null;

let proveedores = [];

let proveedorEditandoId = null;


/* =========================================================
   ESCAPAR HTML
========================================================= */

function escaparHTML(valor){

    return String(valor ?? "")
        .replace(/&/g,"&amp;")
        .replace(/</g,"&lt;")
        .replace(/>/g,"&gt;")
        .replace(/"/g,"&quot;")
        .replace(/'/g,"&#039;");

}


/* =========================================================
   MENSAJES
========================================================= */

function mostrarMensaje(texto,tipo){

    mensaje.textContent = texto;

    mensaje.className =
        "mensaje " + tipo;

    window.scrollTo({
        top:0,
        behavior:"smooth"
    });

}


function ocultarMensaje(){

    mensaje.textContent = "";

    mensaje.className =
        "mensaje";

}


/* =========================================================
   LIMPIAR FORMULARIO
========================================================= */

function limpiarFormulario(){

    proveedorForm.reset();

    proveedorEditandoId = null;

    tituloFormulario.textContent =
        "➕ Nuevo proveedor";

    btnGuardar.textContent =
        "Guardar proveedor";

    btnCancelar.style.display =
        "none";

}


/* =========================================================
   OBTENER DATOS
========================================================= */

function obtenerDatosFormulario(){

    return {

        nombre:
            nombreInput.value.trim(),

        cuit:
            cuitInput.value.trim(),

        contacto:
            contactoInput.value.trim(),

        telefono:
            telefonoInput.value.trim(),

        email:
            emailInput.value.trim().toLowerCase(),

        direccion:
            direccionInput.value.trim(),

        observaciones:
            observacionesInput.value.trim()

    };

}


/* =========================================================
   VALIDAR
========================================================= */

function validarDatos(datos){

    if(!datos.nombre){

        return "Ingresá el nombre o razón social del proveedor.";

    }


    if(datos.email){

        const emailValido =
            /^[^\s@]+@[^\s@]+\.[^\s@]+$/
            .test(datos.email);


        if(!emailValido){

            return "El correo electrónico no es válido.";

        }

    }


    return null;

}


/* =========================================================
   GUARDAR / ACTUALIZAR
========================================================= */

async function guardarProveedor(evento){

    evento.preventDefault();

    ocultarMensaje();


    if(!usuarioActual){

        mostrarMensaje(
            "No hay una sesión iniciada.",
            "error"
        );

        return;

    }


    if(!empresaId){

        mostrarMensaje(
            "No se pudo identificar la empresa.",
            "error"
        );

        return;

    }


    const datos =
        obtenerDatosFormulario();


    const errorValidacion =
        validarDatos(datos);


    if(errorValidacion){

        mostrarMensaje(
            errorValidacion,
            "error"
        );

        return;

    }


    btnGuardar.disabled = true;


    const editando =
        Boolean(proveedorEditandoId);


    btnGuardar.textContent =
        editando
        ?
        "Guardando cambios..."
        :
        "Guardando...";


    try{


        if(editando){

            await updateDoc(
                doc(
                    db,
                    "proveedores",
                    proveedorEditandoId
                ),
                {

                    nombre:
                        datos.nombre,

                    cuit:
                        datos.cuit,

                    contacto:
                        datos.contacto,

                    telefono:
                        datos.telefono,

                    email:
                        datos.email,

                    direccion:
                        datos.direccion,

                    observaciones:
                        datos.observaciones,

                    fechaActualizacion:
                        serverTimestamp()

                }
            );


            mostrarMensaje(
                "✅ Proveedor actualizado correctamente.",
                "exito"
            );

        }
        else{

            await addDoc(
                collection(
                    db,
                    "proveedores"
                ),
                {

                    empresaId:
                        empresaId,

                    propietarioId:
                        usuarioActual.uid,

                    nombre:
                        datos.nombre,

                    razonSocial:
                        datos.nombre,

                    cuit:
                        datos.cuit,

                    contacto:
                        datos.contacto,

                    telefono:
                        datos.telefono,

                    email:
                        datos.email,

                    direccion:
                        datos.direccion,

                    observaciones:
                        datos.observaciones,

                    estado:
                        "activo",

                    fechaCreacion:
                        serverTimestamp(),

                    fechaActualizacion:
                        serverTimestamp()

                }
            );


            mostrarMensaje(
                "✅ Proveedor guardado correctamente.",
                "exito"
            );

        }


        limpiarFormulario();

        await cargarProveedores();


    }
    catch(error){

        console.error(
            "ERROR GUARDANDO PROVEEDOR:",
            error
        );


        mostrarMensaje(
            "No se pudo guardar el proveedor.\n\n" +
            (
                error.message ||
                "Error desconocido."
            ),
            "error"
        );

    }
    finally{

        btnGuardar.disabled = false;


        if(!proveedorEditandoId){

            btnGuardar.textContent =
                "Guardar proveedor";

        }

    }

}


/* =========================================================
   CARGAR PROVEEDORES
========================================================= */

async function cargarProveedores(){

    if(!empresaId){

        return;

    }


    cargando.style.display =
        "block";

    contenedorTabla.style.display =
        "none";


    try{

        const consulta =
            query(
                collection(
                    db,
                    "proveedores"
                ),
                where(
                    "empresaId",
                    "==",
                    empresaId
                )
            );


        const snapshot =
            await getDocs(
                consulta
            );


        proveedores = [];


        snapshot.forEach(
            documento => {

                proveedores.push({

                    id:
                        documento.id,

                    ...documento.data()

                });

            }
        );


        proveedores.sort(
            (a,b) =>
                String(
                    a.nombre || ""
                ).localeCompare(
                    String(
                        b.nombre || ""
                    ),
                    "es"
                )
        );


        actualizarResumen();

        mostrarProveedores();


    }
    catch(error){

        console.error(
            "ERROR CARGANDO PROVEEDORES:",
            error
        );


        listaProveedores.innerHTML = `
            <tr>
                <td colspan="6" class="estado">
                    No se pudieron cargar los proveedores.
                    <br><br>
                    ${escaparHTML(error.message || "Error desconocido")}
                </td>
            </tr>
        `;

        contenedorTabla.style.display =
            "block";

    }
    finally{

        cargando.style.display =
            "none";

    }

}


/* =========================================================
   RESUMEN
========================================================= */

function actualizarResumen(){

    totalProveedores.textContent =
        proveedores.length;


    const activos =
        proveedores.filter(
            proveedor =>
                String(
                    proveedor.estado || "activo"
                ).toLowerCase()
                ===
                "activo"
        ).length;


    proveedoresActivos.textContent =
        activos;


    if(proveedores.length > 0){

        const fechas =
            proveedores
                .map(
                    proveedor =>
                        proveedor.fechaActualizacion ||
                        proveedor.fechaCreacion
                )
                .filter(Boolean);


        if(fechas.length){

            ultimaActualizacion.textContent =
                "Registrado";

        }

    }
    else{

        ultimaActualizacion.textContent =
            "—";

    }

}


/* =========================================================
   MOSTRAR PROVEEDORES
========================================================= */

function mostrarProveedores(){

    const busqueda =
        buscarInput.value
            .trim()
            .toLowerCase();


    const filtrados =
        proveedores.filter(
            proveedor => {

                const texto = (

                    String(
                        proveedor.nombre || ""
                    ) +

                    " " +

                    String(
                        proveedor.razonSocial || ""
                    ) +

                    " " +

                    String(
                        proveedor.cuit || ""
                    ) +

                    " " +

                    String(
                        proveedor.contacto || ""
                    ) +

                    " " +

                    String(
                        proveedor.telefono || ""
                    ) +

                    " " +

                    String(
                        proveedor.email || ""
                    )

                ).toLowerCase();


                return texto.includes(
                    busqueda
                );

            }
        );


    if(filtrados.length === 0){

        listaProveedores.innerHTML = `
            <tr>
                <td
                    colspan="6"
                    class="estado"
                >
                    ${
                        proveedores.length === 0
                        ?
                        "Todavía no tenés proveedores registrados."
                        :
                        "No se encontraron proveedores."
                    }
                </td>
            </tr>
        `;

        contenedorTabla.style.display =
            "block";

        return;

    }


    listaProveedores.innerHTML =
        filtrados
        .map(
            proveedor => `

                <tr>

                    <td>

                        <strong>
                            ${
                                escaparHTML(
                                    proveedor.nombre ||
                                    "-"
                                )
                            }
                        </strong>

                        ${
                            proveedor.direccion
                            ?
                            `
                            <span class="secundario">
                                📍 ${
                                    escaparHTML(
                                        proveedor.direccion
                                    )
                                }
                            </span>
                            `
                            :
                            ""
                        }

                    </td>


                    <td>
                        ${
                            escaparHTML(
                                proveedor.cuit ||
                                "-"
                            )
                        }
                    </td>


                    <td>
                        ${
                            escaparHTML(
                                proveedor.contacto ||
                                "-"
                            )
                        }
                    </td>


                    <td>
                        ${
                            escaparHTML(
                                proveedor.telefono ||
                                "-"
                            )
                        }
                    </td>


                    <td>
                        ${
                            proveedor.email
                            ?
                            escaparHTML(
                                proveedor.email
                            )
                            :
                            "-"
                        }
                    </td>


                    <td>

                        <div class="acciones">

                            <button
                                type="button"
                                class="btn-editar"
                                data-editar="${proveedor.id}"
                            >
                                ✏️
                            </button>

                            <button
                                type="button"
                                class="btn-eliminar"
                                data-eliminar="${proveedor.id}"
                            >
                                🗑️
                            </button>

                        </div>

                    </td>

                </tr>

            `
        )
        .join("");


    contenedorTabla.style.display =
        "block";


    document
        .querySelectorAll(
            "[data-editar]"
        )
        .forEach(
            boton => {

                boton.addEventListener(
                    "click",
                    () => {

                        editarProveedor(
                            boton.dataset.editar
                        );

                    }
                );

            }
        );


    document
        .querySelectorAll(
            "[data-eliminar]"
        )

/* =========================================================
   ELIMINAR
========================================================= */

async function eliminarProveedor(
    proveedorId
){

    const proveedor =
        proveedores.find(
            item =>
                item.id === proveedorId
        );


    if(!proveedor){

        return;

    }


    const confirmar =
        confirm(
            "¿Querés eliminar este proveedor?\n\n" +
            proveedor.nombre +
            "\n\n" +
            "Esta acción no se puede deshacer."
        );


    if(!confirmar){

        return;

    }


    try{

        await deleteDoc(
            doc(
                db,
                "proveedores",
                proveedorId
            )
        );


        mostrarMensaje(
            "✅ Proveedor eliminado correctamente.",
            "exito"
        );


        await cargarProveedores();


    }
    catch(error){

        console.error(
            "ERROR ELIMINANDO PROVEEDOR:",
            error
        );


        mostrarMensaje(
            "No se pudo eliminar el proveedor.\n\n" +
            (
                error.message ||
                "Error desconocido."
            ),
            "error"
        );

    }

}

/* =========================================================
   OBTENER EMPRESA
========================================================= */

async function obtenerEmpresaUsuario(
    usuario
){

    /*
     * Primero buscamos el documento
     * usuarios/{uid}.
     */

    const referenciaUsuario =
        doc(
            db,
            "usuarios",
            usuario.uid
        );


    const documentoUsuario =
        await getDoc(
            referenciaUsuario
        );


    if(
        documentoUsuario.exists()
    ){

        const datos =
            documentoUsuario.data();


        const id =
            String(
                datos.empresaId ||
                datos.idEmpresa ||
                datos.empresa ||
                ""
            ).trim();


        if(id){

            return id;

        }

    }


    /*
     * Compatibilidad con instalaciones
     * que utilizan propietarioId.
     */

    const consultaEmpresa =
        query(
            collection(
                db,
                "empresas"
            ),
            where(
                "propietarioId",
                "==",
                usuario.uid
            )
        );


    const empresasSnapshot =
        await getDocs(
            consultaEmpresa
        );


    if(
        !empresasSnapshot.empty
    ){

        return empresasSnapshot
            .docs[0]
            .id;

    }


    /*
     * Último respaldo:
     * EMP-{UID}
     */

    const empresaAntigua =
        "EMP-" +
        usuario.uid;


    const referenciaEmpresa =
        doc(
            db,
            "empresas",
            empresaAntigua
        );


    const documentoEmpresa =
        await getDoc(
            referenciaEmpresa
        );


    if(
        documentoEmpresa.exists()
    ){

        return empresaAntigua;

    }


    return null;

}
