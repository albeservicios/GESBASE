/* =========================================

let usuarioSesion = null;

let empresaId = "";

/* =========================================
   UTILIDADES
========================================= */

function texto(valor){

    if(
        valor === undefined ||
        valor === null
    ){

        return "";

    }

    return String(valor);

}


function escaparHTML(valor){

    return texto(valor)
    .replace(/&/g,"&amp;")
    .replace(/</g,"&lt;")
    .replace(/>/g,"&gt;")
    .replace(/"/g,"&quot;")
    .replace(/'/g,"&#039;");

}


function mostrarError(textoError){

    mensajeError.textContent =
    textoError;

    mensajeError.style.display =
    "block";

    mensajeExito.style.display =
    "none";

}


function mostrarExito(textoExito){

    mensajeExito.textContent =
    textoExito;

    mensajeExito.style.display =
    "block";

    mensajeError.style.display =
    "none";

}


function limpiarMensajes(){

    mensajeError.style.display =
    "none";

    mensajeExito.style.display =
    "none";

}


function nombreCompleto(datos){

    const nombre =
    texto(datos.nombre).trim();

    const apellido =
    texto(datos.apellido).trim();

    return (
        nombre +
        " " +
        apellido
    ).trim();

}


function fechaActual(){

    const ahora =
    new Date();

    return (
        ahora.getFullYear() +

        ).padStart(2,"0") +

        ).padStart(2,"0")
    );

}


function horaActual(){

    const ahora =
    new Date();

    return (
        String(
            ahora.getHours()
        ).padStart(2,"0") +

}


/* =========================================
   CARGAR EMPLEADO
========================================= */

async function cargarEmpleado(){

    if(!usuarioSesion){

        throw new Error(
            "No hay una sesión activa."
        );

    }


    let resultados = null;


    /*
       PRIMERA OPCIÓN:
       authUid
    */

    try{

        const consulta =
        query(
            collection(
                db,
                "empleados"
            ),
            where(
                "authUid",
                "==",
                usuarioSesion.uid
            ),
            limit(1)
        );


        resultados =
        await getDocs(
            consulta
        );

    }
    catch(error){

        console.warn(
            "No se pudo buscar por authUid:",
            error
        );

    }


    /*
       SEGUNDA OPCIÓN:
       email
    */

    if(
        !resultados ||
        resultados.empty
    ){

        try{

            const consultaEmail =
            query(
                collection(
                    db,
                    "empleados"
                ),
                where(
                    "email",
                    "==",
                    usuarioSesion.email
                ),
                limit(1)
            );


            resultados =
            await getDocs(
                consultaEmail
            );

        }
        catch(error){

            console.warn(
                "No se pudo buscar por email:",
                error
            );

        }

    }


    /*
       SI NO EXISTE
    */

    if(
        !resultados ||
        resultados.empty
    ){

        throw new Error(
            "No encontramos el perfil de empleado vinculado a esta cuenta."
        );

    }


    const documento =
    resultados.docs[0];


    empleadoId =
    documento.id;


    empleadoActual = {

        id:
        documento.id,

        ...documento.data()

    };


    empresaId =
    texto(
        empleadoActual.empresaId
    ).trim();


    /*
       SOLAMENTE INFORMACIÓN
       NECESARIA PARA EL USUARIO.
    */

    const nombre =
    nombreCompleto(
        empleadoActual
    ) ||
    "Empleado";


    const puesto =
    texto(
        empleadoActual.puesto
    ) ||
    "Empleado";


    usuarioActual.innerHTML = `
        <strong>
            ${escaparHTML(nombre)}
        </strong>
        <br>
        Puesto:
        ${escaparHTML(puesto)}
    `;

}


/* =========================================
   CARGAR EMPRESA
========================================= */

async function cargarEmpresa(){

    empresaActual = null;


    if(!empresaId){

        return;

    }


    try{

        const empresaRef =
        doc(
            db,
            "empresas",
            empresaId
        );


        /*
           getDocs no se utiliza aquí
           para evitar consultas innecesarias.
        */

        const resultado =
        await getDocs(
            query(
                collection(
                    db,
                    "empresas"
                ),
                where(
                    "__name__",
                    "==",
                    empresaId
                ),
                limit(1)
            )
        );


        if(
            !resultado.empty
        ){

            empresaActual =
            {
                id: empresaId,
                ...resultado.docs[0].data()
            };

        }

    }
    catch(error){

        console.warn(
            "No se pudo cargar empresa:",
            error
        );

    }

}


/* =========================================
   AGREGAR DESTINATARIO
========================================= */

function agregarDestinatario(persona){

    if(!persona){

        return;

    }


    const existe =
    destinatarios.some(
        item =>
        (
            persona.authUid &&
            item.authUid ===
            persona.authUid
        ) ||
        (
            persona.id &&
            item.id ===
            persona.id
        )
    );


    if(existe){

        return;

    }


    destinatarios.push(
        persona
    );

}


/* =========================================
   CARGAR DESTINATARIOS
========================================= */

async function cargarDestinatarios(){

    destinatarios = [];


    /*
       1. EMPLEADOS DE LA MISMA EMPRESA
    */

    if(empresaId){

        try{

            const consulta =
            query(
                collection(
                    db,
                    "empleados"
                ),
                where(
                    "empresaId",
                    "==",
                    empresaId
                )
            );


            const resultados =
            await getDocs(
                consulta
            );


            resultados.forEach(
                documento => {

                    if(
                        documento.id ===
                        empleadoId
                    ){

                        return;

                    }


                    const datos =
                    documento.data();


                    agregarDestinatario({

                        id:
                        documento.id,

                        authUid:
                        texto(
                            datos.authUid
                        ),

                        nombre:
                        nombreCompleto(
                            datos
                        ) ||
                        texto(
                            datos.email
                        ) ||
                        "Empleado",

                        email:
                        texto(
                            datos.email
                        ),

                        tipo:
                        "Empleado"

                    });

                }
            );

        }
        catch(error){

            console.warn(
                "No se pudieron cargar empleados:",
                error
            );

        }

    }


    /*
       2. ADMINISTRADORES
    */

    if(empresaId){

        try{

            const consulta =
            query(
                collection(
                    db,
                    "administradores"
                ),
                where(
                    "empresaId",
                    "==",
                    empresaId
                )
            );


            const resultados =
            await getDocs(
                consulta
            );


            resultados.forEach(
                documento => {

                    const datos =
                    documento.data();


                    agregarDestinatario({

                        id:
                        documento.id,

                        authUid:
                        texto(
                            datos.authUid
                        ) ||
                        texto(
                            datos.uid
                        ),

                        nombre:
                        nombreCompleto(
                            datos
                        ) ||
                        texto(
                            datos.nombre
                        ) ||
                        "Administración",

                        email:
                        texto(
                            datos.email
                        ),

                        tipo:
                        "Administración"

                    });

                }
            );

        }
        catch(error){

            console.warn(
                "No se pudieron cargar administradores:",
                error
            );

        }

    }


    /*
       3. PROPIETARIO DE LA EMPRESA
       Se toma propietarioUid del documento
       de empresa cuando existe.
    */

    if(
        empresaActual &&
        empresaActual.propietarioUid
    ){

        const propietarioUid =
        texto(
            empresaActual.propietarioUid
        ).trim();


        if(
            propietarioUid &&
            propietarioUid !==
            usuarioSesion.uid
        ){

            agregarDestinatario({

                id:
                empresaId,

                authUid:
                propietarioUid,

                nombre:
                texto(
                    empresaActual.nombreEmpresa
                ) ||
                texto(
                    empresaActual.razonSocial
                ) ||
                "Administración",

                email:
                texto(
                    empresaActual.email
                ),

                tipo:
                "Empresa"

            });

        }

    }


    /*
       4. SI EL PROPIETARIO ESTÁ
       EN EMPLEADOS O ADMINISTRADORES,
       BUSCAR SU NOMBRE/CORREO.
    */

    if(
        empresaActual &&
        empresaActual.propietarioUid
    ){

        const propietarioUid =
        texto(
            empresaActual.propietarioUid
        );


        const propietarioEncontrado =
        destinatarios.find(
            persona =>
            persona.authUid ===
            propietarioUid
        );


        if(
            propietarioEncontrado
        ){

            /*
               Ya existe.
            */

        }

    }


    /*
       ARMAR SELECT
    */

    destinatario.innerHTML = "";


    if(
        destinatarios.length === 0
    ){

        destinatario.innerHTML = `
            <option value="">
                No hay destinatarios disponibles
            </option>
        `;

        btnEnviar.disabled =
        true;

        return;

    }


    destinatario.innerHTML = `
        <option value="">
            Seleccionar destinatario...
        </option>
    `;


    destinatarios.forEach(
        persona => {

            const option =
            document.createElement(
                "option"
            );


            /*
               Guardamos el ID local.
            */

            option.value =
            persona.id;


            option.textContent =

/* =========================================
   AUDIO
========================================= */

btnAudio.addEventListener(
    "click",
    async function(){

        /*
           SI YA ESTÁ GRABANDO,
           DETENER.
        */

        if(
            mediaRecorder &&
            mediaRecorder.state ===
            "recording"
        ){

            mediaRecorder.stop();

            return;

        }


        /*
           COMPROBAR SOPORTE
        */

        if(
            !navigator.mediaDevices ||
            !navigator.mediaDevices.getUserMedia
        ){

            mostrarError(
                "Este navegador no permite grabar audio."
            );

            return;

        }


        try{

            const stream =
            await navigator.mediaDevices.getUserMedia({
                audio:true
            });


            const tiposAudio = [

                "audio/webm;codecs=opus",
                "audio/webm",
                "audio/ogg;codecs=opus",
                "audio/mp4"

            ];


            let tipoAudio =
            "";


            for(
                const tipo of tiposAudio
            ){

                if(
                    MediaRecorder.isTypeSupported(
                        tipo
                    )
                ){

                    tipoAudio =
                    tipo;

                    break;

                }

            }


            mediaRecorder =
            tipoAudio
            ?
            new MediaRecorder(
                stream,
                {
                    mimeType:
                    tipoAudio
                }
            )
            :
            new MediaRecorder(
                stream
            );


            audioChunks = [];


            mediaRecorder.ondataavailable =
            function(event){

                if(
                    event.data &&
                    event.data.size > 0
                ){

                    audioChunks.push(
                        event.data
                    );

                }

            };


            mediaRecorder.onstop =
            function(){

                const mime =
                mediaRecorder.mimeType ||
                "audio/webm";


                const audioBlob =
                new Blob(
                    audioChunks,
                    {
                        type:mime
                    }
                );


                let extension =
                "webm";


                if(
                    mime.includes("ogg")
                ){

                    extension =
                    "ogg";

                }
                else if(
                    mime.includes("mp4")
                ){

                    extension =
                    "mp4";

                }


                archivoAdjunto =
                new File(
                    [audioBlob],
                    "audio-" +
                    Date.now() +
                    "." +
                    extension,
                    {
                        type:mime
                    }
                );


                tipoAdjunto =
                "audio";


                estadoGrabacion.classList.add(
                    "oculto"
                );


                btnAudio.textContent =
                "🎤 GRABAR AUDIO";


                archivoSeleccionado.classList.remove(
                    "oculto"
                );


                archivoSeleccionado.innerHTML = `
                    🎤 Audio grabado correctamente.
                    <br>
                    <audio
                        class="audio-reproductor"
                        controls
                        src="${URL.createObjectURL(audioBlob)}"
                    ></audio>
                `;


                stream
                .getTracks()
                .forEach(
                    track =>
                    track.stop()
                );

            };


            mediaRecorder.start();


            estadoGrabacion.classList.remove(
                "oculto"
            );


            btnAudio.textContent =
            "⏹️ DETENER AUDIO";


            mostrarExito(
                "Grabando audio. Tocá nuevamente para detener."
            );

        }
        catch(error){

            console.error(
                "Error micrófono:",
                error
            );


            mostrarError(
                "No se pudo acceder al micrófono. Verificá el permiso del navegador."
            );

        }

    }
);


/* =========================================
   SUBIR ADJUNTO
========================================= */

async function subirAdjunto(){

    if(!archivoAdjunto){

        return null;

    }


    const extension =
    archivoAdjunto.name
    .split(".")
    .pop()
    .toLowerCase();


    const nombreSeguro =
    Date.now() +
    "-" +
    Math.random()
    .toString(36)
    .substring(2) +
    "." +
    extension;


    const ruta =
    "correos/" +
    usuarioSesion.uid +
    "/" +
    nombreSeguro;


    const referencia =
    ref(
        almacenamiento,
        ruta
    );


    await uploadBytes(
        referencia,
        archivoAdjunto
    );


    const url =
    await getDownloadURL(
        referencia
    );


    return {

        url:
        url,

        nombre:
        archivoAdjunto.name,

        tipo:
        archivoAdjunto.type,

        categoria:
        tipoAdjunto

    };

}

/* =========================================
   CARGAR RECIBIDOS
========================================= */

async function cargarRecibidos(){

    recibidos.innerHTML = `
        <div class="cargando">
            Cargando mensajes...
        </div>
    `;


    try{

        const consulta =
        query(
            collection(
                db,
                "correos"
            ),
            where(
                "destinatarioUid",
                "==",
                usuarioSesion.uid
            ),
            limit(50)
        );


        const resultados =
        await getDocs(
            consulta
        );


        correosRecibidos = [];


        resultados.forEach(
            documento => {

                correosRecibidos.push({

                    id:
                    documento.id,

                    ...documento.data()

                });

            }
        );


        correosRecibidos.sort(
            (a,b) => {

                const aFecha =
                texto(a.fecha) +
                " " +
                texto(a.hora);

                const bFecha =
                texto(b.fecha) +
                " " +
                texto(b.hora);


                return bFecha.localeCompare(
                    aFecha
                );

            }
        );


        mostrarRecibidos();

    }
    catch(error){

        console.error(
            "ERROR RECIBIDOS:",
            error
        );


        recibidos.innerHTML = `
            <div class="sin-registros">
                No se pudieron cargar los mensajes.
            </div>
        `;

    }

}

/* =========================================
   MOSTRAR ADJUNTO
========================================= */

function htmlAdjunto(adjunto){

    if(
        !adjunto ||
        !adjunto.url
    ){

        return "";

    }


    const categoria =
    texto(
        adjunto.categoria
    );


    const tipo =
    texto(
        adjunto.tipo
    );


    /*
       FOTO
    */

    if(
        categoria === "foto" ||
        tipo.startsWith("image/")
    ){

        return `

            <div class="adjunto">

                <div class="nombre-adjunto">
                    📷 Foto
                </div>

                <img
                    src="${escaparHTML(
                        adjunto.url
                    )}"
                    alt="Foto adjunta"
                >

                <br>

                <a
                    href="${escaparHTML(
                        adjunto.url
                    )}"
                    target="_blank"
                    rel="noopener"
                >
                    🔗 Abrir foto
                </a>

            </div>

        `;

    }


    /*
       AUDIO
    */

    if(
        categoria === "audio" ||
        tipo.startsWith("audio/")
    ){

        return `

            <div class="adjunto">

                <div class="nombre-adjunto">
                    🎤 Audio
                </div>

                <audio
                    class="audio-reproductor"
                    controls
                    preload="metadata"
                    src="${escaparHTML(
                        adjunto.url
                    )}"
                ></audio>

                <br>

                <a
                    href="${escaparHTML(
                        adjunto.url
                    )}"
                    target="_blank"
                    rel="noopener"
                >
                    🔊 Abrir audio
                </a>

            </div>

        `;

    }


    /*
       ARCHIVO
    */

    return `

        <div class="adjunto">

            <div class="nombre-adjunto">

                📎
                ${escaparHTML(
                    adjunto.nombre ||
                    "Archivo"
                )}

            </div>

            <a
                href="${escaparHTML(
                    adjunto.url
                )}"
                target="_blank"
                rel="noopener"
            >
                ⬇️ ABRIR / DESCARGAR ARCHIVO
            </a>

        </div>

    `;

}


/* =========================================
   ABRIR CORREO
========================================= */

async function abrirCorreo(
    correo,
    esRecibido
){

    const remitente =
    correo.remitenteNombre ||
    correo.de ||
    "Usuario";


    const destinatarioNombre =
    correo.destinatarioNombre ||
    correo.para ||
    "Usuario";


    detalleCorreo.innerHTML = `

        <div class="detalle-linea">

            <strong>De:</strong>
            ${escaparHTML(
                remitente
            )}

        </div>


        <div class="detalle-linea">

            <strong>Para:</strong>
            ${escaparHTML(
                destinatarioNombre
            )}

        </div>


        <div class="detalle-linea">

            <strong>Asunto:</strong>
            ${escaparHTML(
                correo.asunto ||
                "(Sin asunto)"
            )}

        </div>


        <div class="detalle-linea">

            <strong>Fecha:</strong>
            ${escaparHTML(
                correo.fecha
            )}
            ${escaparHTML(
                correo.hora
            )}

        </div>


        <div class="separador"></div>


        <div class="detalle-mensaje">

            ${escaparHTML(
                correo.mensaje
            )}

        </div>


        ${htmlAdjunto(
            correo.adjunto
        )}


        ${
            esRecibido
            ?
            `
            <div class="responder-box">

                <button
                    id="btnResponder"
                    class="boton boton-responder"
                >
                    ↩️ RESPONDER
                </button>

            </div>
            `
            :
            ""
        }

    `;


    tarjetaDetalle.classList.remove(
        "oculto"
    );


    tarjetaDetalle.scrollIntoView({
        behavior:"smooth"
    });


    /*
       BOTÓN RESPONDER
    */

    if(esRecibido){

        const botonResponder =
        document.getElementById(
            "btnResponder"
        );


        if(botonResponder){

            botonResponder.addEventListener(
                "click",
                function(){

                    responderCorreo(
                        correo
                    );

                }
            );

        }

    }


    /*
       MARCAR LEÍDO
    */

    if(
        esRecibido &&
        !correo.leido
    ){

        try{

            await updateDoc(
                doc(
                    db,
                    "correos",
                    correo.id
                ),
                {
                    leido:true
                }
            );


            correo.leido =
            true;


            mostrarRecibidos();

        }
        catch(error){

            console.warn(
                "No se pudo marcar leído:",
                error
            );

        }

    }

}


/* =========================================
   RESPONDER
========================================= */

function responderCorreo(correo){

    tarjetaDetalle.classList.add(
        "oculto"
    );


    /*
       BUSCAR AL REMITENTE
    */

    let persona =
    destinatarios.find(
        item =>
        (
            correo.remitenteId &&
            item.id ===
            correo.remitenteId
        ) ||
        (
            correo.remitenteUid &&
            item.authUid ===
            correo.remitenteUid
        )
    );


    /*
       SI NO ESTÁ EN LA LISTA,
       CREAR DESTINATARIO TEMPORAL.
    */

    if(
        !persona &&
        correo.remitenteUid
    ){

        persona = {

            id:
            correo.remitenteId ||
            correo.remitenteUid,

            authUid:
            correo.remitenteUid,

            nombre:
            correo.remitenteNombre ||
            "Usuario",

            email:
            correo.remitenteEmail ||
            "",

            tipo:
            "Usuario"

        };


        /*
           Agregarlo al select.
        */

        destinatarios.push(
            persona
        );


        const option =
        document.createElement(
            "option"
        );


        option.value =
        persona.id;


        option.textContent =
        persona.nombre +
        " — " +
        persona.tipo;


        destinatario.appendChild(
            option
        );

    }


    if(persona){

        destinatario.value =
        persona.id;

    }


    asunto.value =
    "Re: " +
    texto(
        correo.asunto
    );


    mensaje.value =
    "\n\n--- Mensaje original ---\n" +
    texto(
        correo.mensaje
    );


    archivoAdjunto =
    null;


    tipoAdjunto =
    "";


    inputFoto.value =
    "";


    inputArchivo.value =
    "";


    archivoSeleccionado.classList.add(
        "oculto"
    );


    archivoSeleccionado.innerHTML =
    "";


    mostrarExito(
        "Respuesta preparada. Podés escribir y agregar foto, audio o archivo."
    );


    window.scrollTo({
        top:0,
        behavior:"smooth"
    });

}

        window.history.back();

    }
);


/* =========================================
   CERRAR SESIÓN
========================================= */

btnCerrarSesion.addEventListener(
    "click",
    async function(){

        if(
            !confirm(
                "¿Querés cerrar la sesión?"
            )
        ){

            return;

        }


        try{

            await signOut(
                auth
            );


            window.location.replace(
                "empleado-login.html"
            );

        }
        catch(error){

            mostrarError(
                "No se pudo cerrar la sesión: " +
                error.message
            );

        }

    }
);


/* =========================================
   INICIO
========================================= */

onAuthStateChanged(
    auth,
    async function(usuario){

        if(!usuario){

            window.location.replace(
                "empleado-login.html"
            );

            return;

        }


        usuarioSesion =
        usuario;


        try{

            limpiarMensajes();


            usuarioActual.textContent =
            "Cargando usuario...";


            await cargarEmpleado();


            await cargarEmpresa();


            await cargarDestinatarios();


            await cargarRecibidos();


            console.log(
                "GESBASE CORREO INICIALIZADO"
            );

        }
        catch(error){

            console.error(
                "ERROR INICIANDO CORREO:",
                error
            );


            btnEnviar.disabled =
            true;


            usuarioActual.textContent =
            "No se pudo cargar el usuario";


            mostrarError(
                error.message
            );

        }

    }
);

</script>
