.correo-asunto{

<script type="module">


/* =========================================
   FIREBASE
========================================= */

import {
    auth,
    db
} from "./Js/firebase.js";


import {
    onAuthStateChanged,
    signOut
} from
"https://www.gstatic.com/firebasejs/12.1.0/firebase-auth.js";


import {
    collection,
    addDoc,
    getDocs,
    updateDoc,
    doc,
    query,
    where,
    limit,
    serverTimestamp
} from
"https://www.gstatic.com/firebasejs/12.1.0/firebase-firestore.js";


/* =========================================
   ELEMENTOS
========================================= */

const usuarioActual =
document.getElementById(
    "usuarioActual"
);

const destinatario =
document.getElementById(
    "destinatario"
);

const asunto =
document.getElementById(
    "asunto"
);

const mensaje =
document.getElementById(
    "mensaje"
);

const btnEnviar =
document.getElementById(
    "btnEnviar"
);

const btnRecibidos =
document.getElementById(
    "btnRecibidos"
);

const btnEnviados =
document.getElementById(
    "btnEnviados"
);

const recibidos =
document.getElementById(
    "recibidos"
);

const enviados =
document.getElementById(
    "enviados"
);

const tarjetaDetalle =
document.getElementById(
    "tarjetaDetalle"
);

const detalleCorreo =
document.getElementById(
    "detalleCorreo"
);

const btnCerrarDetalle =
document.getElementById(
    "btnCerrarDetalle"
);

const btnVolver =
document.getElementById(
    "btnVolver"
);

const btnCerrarSesion =
document.getElementById(
    "btnCerrarSesion"
);

const mensajeError =
document.getElementById(
    "mensajeError"
);

const mensajeExito =
document.getElementById(
    "mensajeExito"
);


/* =========================================
   VARIABLES
========================================= */

let usuarioSesion = null;

let empleadoActual = null;

let empleadoId = "";

let empresaId = "";

let emailActual = "";

let destinatarios = [];

let correosRecibidos = [];

let correosEnviados = [];


/* =========================================
   UTILIDADES
========================================= */

function texto(valor){

    if(
        valor === undefined ||
        valor === null
    ){

        return "";

    }

    return String(valor);

}


function escaparHTML(valor){

    return texto(valor)
    .replace(/&/g,"&amp;")
    .replace(/</g,"&lt;")
    .replace(/>/g,"&gt;")
    .replace(/"/g,"&quot;")
    .replace(/'/g,"&#039;");

}


function nombreCompleto(datos){

    return (

        texto(datos.nombre) +
        " " +
        texto(datos.apellido)

    ).trim();

}


function mostrarError(textoError){

    mensajeError.textContent =
    textoError;

    mensajeError.style.display =
    "block";

    mensajeExito.style.display =
    "none";

}


function mostrarExito(textoExito){

    mensajeExito.textContent =
    textoExito;

    mensajeExito.style.display =
    "block";

    mensajeError.style.display =
    "none";

}


function limpiarMensajes(){

    mensajeError.style.display =
    "none";

    mensajeExito.style.display =
    "none";

}


function fechaHora(valor){

    if(
        valor &&
        typeof valor.toDate ===
        "function"
    ){

        return valor
        .toDate()
        .toLocaleString(
            "es-AR"
        );

    }

    return texto(valor);

}


/* =========================================
   CARGAR EMPLEADO
========================================= */

async function cargarEmpleado(){

    const consulta =
    query(
        collection(
            db,
            "empleados"
        ),
        where(
            "authUid",
            "==",
            usuarioSesion.uid
        ),
        limit(1)
    );


    const resultados =
    await getDocs(
        consulta
    );


    if(
        resultados.empty
    ){

        throw new Error(
            "No encontramos el empleado vinculado a esta cuenta."
        );

    }


    const documento =
    resultados.docs[0];


    empleadoId =
    documento.id;


    empleadoActual = {

        id:
        documento.id,

        ...documento.data()

    };


    empresaId =
    texto(
        empleadoActual.empresaId
    ).trim();


    emailActual =
    texto(
        empleadoActual.email
    ).trim()
    ||
    texto(
        usuarioSesion.email
    ).trim();


    const nombre =
    nombreCompleto(
        empleadoActual
    )
    ||
    "Empleado";


    usuarioActual.innerHTML = `

        <strong>
        ${escaparHTML(nombre)}
        </strong>

        <br>

        Puesto:
        ${escaparHTML(
            texto(
                empleadoActual.puesto
            ) ||
            "Empleado"
        )}

        <br>

        Empresa:
        ${escaparHTML(
            texto(
                empleadoActual.empresa
            ) ||
            "Empresa"
        )}

        <br>

        Correo:
        ${escaparHTML(
            emailActual
        )}

    `;

}


/* =========================================
   AGREGAR DESTINATARIO
========================================= */

function agregarDestinatario(
    id,
    nombre,
    email,
    tipo,
    authUid=""
){

    email =
    texto(email)
    .trim()
    .toLowerCase();


    if(!email){

        return;

    }


    if(
        email ===
        emailActual.toLowerCase()
    ){

        return;

    }


    const existe =
    destinatarios.some(
        persona =>
        persona.email.toLowerCase()
        ===
        email
    );


    if(existe){

        return;

    }


    destinatarios.push({

        id:
        texto(id),

        nombre:
        nombre ||
        email,

        email:
        email,

        tipo:
        tipo,

        authUid:
        texto(authUid)

    });

}


/* =========================================
   CARGAR DESTINATARIOS
========================================= */

async function cargarDestinatarios(){

    destinatarios = [];


    /*
       ================================
       EMPLEADOS
       ================================
    */

    try{

        const consulta =
        query(
            collection(
                db,
                "empleados"
            ),
            where(
                "empresaId",
                "==",
                empresaId
            )
        );


        const resultados =
        await getDocs(
            consulta
        );


        resultados.forEach(
            documento => {

                const datos =
                documento.data();


                agregarDestinatario(

                    documento.id,

                    nombreCompleto(
                        datos
                    ) ||
                    "Empleado",

                    datos.email,

                    "Empleado",

                    datos.authUid

                );

            }
        );

    }
    catch(error){

        console.warn(
            "Error cargando empleados:",
            error
        );

    }


    /*
       ================================
       ADMINISTRADORES
       ================================
    */

    try{

        const consulta =
        query(
            collection(
                db,
                "administradores"
            ),
            where(
                "empresaId",
                "==",
                empresaId
            )
        );


        const resultados =
        await getDocs(
            consulta
        );


        resultados.forEach(
            documento => {

                const datos =
                documento.data();


                agregarDestinatario(

                    documento.id,

                    nombreCompleto(
                        datos
                    ) ||
                    texto(
                        datos.nombre
                    ) ||
                    "Administración",

                    datos.email,

                    "Administración",

                    datos.authUid

                );

            }
        );

    }
    catch(error){

        console.warn(
            "No se pudo cargar colección administradores:",
            error
        );

    }


    /*
       ================================
       COLECCIÓN ADMINISTRACION
       ================================
    */

    try{

        const consulta =
        query(
            collection(
                db,
                "administracion"
            ),
            where(
                "empresaId",
                "==",
                empresaId
            )
        );


        const resultados =
        await getDocs(
            consulta
        );


        resultados.forEach(
            documento => {

                const datos =
                documento.data();


                agregarDestinatario(

                    documento.id,

                    nombreCompleto(
                        datos
                    ) ||
                    texto(
                        datos.nombre
                    ) ||
                    "Administración",

                    datos.email,

                    "Administración",

                    datos.authUid

                );

            }
        );

    }
    catch(error){

        console.warn(
            "No se pudo cargar colección administracion:",
            error
        );

    }


    /*
       ================================
       ARMAR SELECT
       ================================
    */

    destinatario.innerHTML = "";


    if(
        destinatarios.length === 0
    ){

        destinatario.innerHTML = `

            <option value="">
            No hay destinatarios disponibles
            </option>

        `;

        btnEnviar.disabled =
        true;

        return;

    }


    destinatario.innerHTML = `

        <option value="">
        Seleccionar destinatario...
        </option>

    `;


    destinatarios.forEach(
        persona => {

            const option =
            document.createElement(
                "option"
            );


            option.value =
            persona.email;


            option.textContent =
            persona.nombre +
            " — " +
            persona.tipo;


            destinatario.appendChild(
                option
            );

        }
    );


    btnEnviar.disabled =
    false;

}


/* =========================================
   OBTENER DESTINATARIO
========================================= */

function obtenerDestinatario(){

    const email =
    destinatario.value;


    return destinatarios.find(
        persona =>
        persona.email === email
    );

}


/* =========================================
   ENVIAR CORREO
========================================= */

btnEnviar.addEventListener(
    "click",
    async function(){

        limpiarMensajes();


        const persona =
        obtenerDestinatario();


        const asuntoTexto =
        asunto.value.trim();


        const mensajeTexto =
        mensaje.value.trim();


        if(!persona){

            mostrarError(
                "Seleccioná un destinatario."
            );

            return;

        }


        if(!asuntoTexto){

            mostrarError(
                "Escribí un asunto."
            );

            asunto.focus();

            return;

        }


        if(!mensajeTexto){

            mostrarError(
                "Escribí el mensaje."
            );

            mensaje.focus();

            return;

        }


        btnEnviar.disabled =
        true;


        btnEnviar.textContent =
        "📤 ENVIANDO...";


        try{

            /*
               ESTRUCTURA REAL
               DE TU FIRESTORE
            */

            await addDoc(

                collection(
                    db,
                    "correos"
                ),

                {

                    asunto:
                    asuntoTexto,

                    mensaje:
                    mensajeTexto,

                    de:
                    emailActual,

                    para:
                    persona.email,

                    empresaId:
                    empresaId,

                    usuarioId:
                    usuarioSesion.uid,

                    carpeta:
                    "enviados",

                    estado:
                    "pendiente",

                    creado:
                    serverTimestamp(),

                    enviado:
                    serverTimestamp()

                }

            );


            asunto.value =
            "";

            mensaje.value =
            "";

            destinatario.value =
            "";


            mostrarExito(
                "Mensaje enviado correctamente."
            );


            await cargarEnviados();

        }
        catch(error){

            console.error(
                "ERROR ENVIANDO:",
                error
            );


            mostrarError(
                "No se pudo enviar el mensaje: " +
                error.message
            );

        }
        finally{

            btnEnviar.disabled =
            false;

            btnEnviar.textContent =
            "📤 ENVIAR MENSAJE";

        }

    }
);


/* =========================================
   CARGAR RECIBIDOS
========================================= */

async function cargarRecibidos(){

    recibidos.innerHTML = `

        <div class="cargando">
        Cargando mensajes...
        </div>

    `;


    try{

        const consulta =
        query(

            collection(
                db,
                "correos"
            ),

            where(
                "para",
                "==",
                emailActual
            ),

            limit(100)

        );


        const resultados =
        await getDocs(
            consulta
        );


        correosRecibidos = [];


        resultados.forEach(
            documento => {

                correosRecibidos.push({

                    id:
                    documento.id,

                    ...documento.data()

                });

            }
        );


        correosRecibidos.sort(
            function(a,b){

                const fechaA =
                a.creado &&
                typeof a.creado.toMillis ===
                "function"
                ?
                a.creado.toMillis()
                :
                0;


                const fechaB =
                b.creado &&
                typeof b.creado.toMillis ===
                "function"
                ?
                b.creado.toMillis()
                :
                0;


                return fechaB - fechaA;

            }
        );


        mostrarRecibidos();

    }
    catch(error){

        console.error(
            "ERROR RECIBIDOS:",
            error
        );


        recibidos.innerHTML = `

            <div class="sin-registros">

            No se pudieron cargar los mensajes.

            <br><br>

            ${escaparHTML(
                error.message
            )}

            </div>

        `;

    }

}


/* =========================================
   MOSTRAR RECIBIDOS
========================================= */

function mostrarRecibidos(){

    if(
        correosRecibidos.length === 0
    ){

        recibidos.innerHTML = `

            <div class="sin-registros">
            No tenés mensajes recibidos.
            </div>

        `;

        return;

    }


    recibidos.innerHTML = "";


    correosRecibidos.forEach(
        correo => {

            const item =
            document.createElement(
                "div"
            );


            const leido =
            correo.leido === true;


            item.className =
            "correo-item" +
            (
                leido
                ?
                ""
                :
                " no-leido"
            );


            item.innerHTML = `

                <div class="correo-cabecera">

                    <div class="correo-persona">

                        De:
                        ${escaparHTML(
                            correo.de
                        )}

                    </div>

                    <div class="correo-fecha">

                        ${escaparHTML(
                            fechaHora(
                                correo.creado
                            )
                        )}

                    </div>

                </div>


                <div class="correo-asunto">

                    ${escaparHTML(
                        correo.asunto
                    )}

                </div>


                <div class="correo-resumen">

                    ${escaparHTML(
                        texto(
                            correo.mensaje
                        ).substring(
                            0,
                            180
                        )
                    )}

                    ${
                        texto(
                            correo.mensaje
                        ).length > 180
                        ?
                        "..."
                        :
                        ""
                    }

                </div>


                <span
                    class="estado-correo ${
                        leido
                        ?
                        ""
                        :
                        "estado-no-leido"
                    }"
                >

                    ${
                        leido
                        ?
                        "LEÍDO"
                        :
                        "NO LEÍDO"
                    }

                </span>

            `;


            item.addEventListener(
                "click",
                function(){

                    abrirCorreo(
                        correo,
                        true
                    );

                }
            );


            recibidos.appendChild(
                item
            );

        }
    );

}


/* =========================================
   CARGAR ENVIADOS
========================================= */

async function cargarEnviados(){

    enviados.innerHTML = `

        <div class="cargando">
        Cargando mensajes...
        </div>

    `;


    try{

        const consulta =
        query(

            collection(
                db,
                "correos"
            ),

            where(
                "de",
                "==",
                emailActual
            ),

            limit(100)

        );


        const resultados =
        await getDocs(
            consulta
        );


        correosEnviados = [];


        resultados.forEach(
            documento => {

                correosEnviados.push({

                    id:
                    documento.id,

                    ...documento.data()

                });

            }
        );


        correosEnviados.sort(
            function(a,b){

                const fechaA =
                a.creado &&
                typeof a.creado.toMillis ===
                "function"
                ?
                a.creado.toMillis()
                :
                0;


                const fechaB =
                b.creado &&
                typeof b.creado.toMillis ===
                "function"
                ?
                b.creado.toMillis()
                :
                0;


                return fechaB - fechaA;

            }
        );


        mostrarEnviados();

    }
    catch(error){

        console.error(
            "ERROR ENVIADOS:",
            error
        );


        enviados.innerHTML = `

            <div class="sin-registros">

            No se pudieron cargar los enviados.

            <br><br>

            ${escaparHTML(
                error.message
            )}

            </div>

        `;

    }

}


/* =========================================
   MOSTRAR ENVIADOS
========================================= */

function mostrarEnviados(){

    if(
        correosEnviados.length === 0
    ){

        enviados.innerHTML = `

            <div class="sin-registros">
            No tenés mensajes enviados.
            </div>

        `;

        return;

    }


    enviados.innerHTML = "";


    correosEnviados.forEach(
        correo => {

            const item =
            document.createElement(
                "div"
            );


            item.className =
            "correo-item";


            item.innerHTML = `

                <div class="correo-cabecera">

                    <div class="correo-persona">

                        Para:
                        ${escaparHTML(
                            correo.para
                        )}

                    </div>


                    <div class="correo-fecha">

                        ${escaparHTML(
                            fechaHora(
                                correo.creado
                            )
                        )}

                    </div>

                </div>


                <div class="correo-asunto">

                    ${escaparHTML(
                        correo.asunto
                    )}

                </div>


                <div class="correo-resumen">

                    ${escaparHTML(
                        texto(
                            correo.mensaje
                        ).substring(
                            0,
                            180
                        )
                    )}

                    ${
                        texto(
                            correo.mensaje
                        ).length > 180
                        ?
                        "..."
                        :
                        ""
                    }

                </div>


                <span class="estado-correo">

                    ${escaparHTML(
                        correo.estado ||
                        "enviado"
                    )}

                </span>

            `;


            item.addEventListener(
                "click",
                function(){

                    abrirCorreo(
                        correo,
                        false
                    );

                }
            );


            enviados.appendChild(
                item
            );

        }
    );

}


/* =========================================
   ABRIR CORREO
========================================= */

async function abrirCorreo(
    correo,
    esRecibido
){

    detalleCorreo.innerHTML = `

        <div class="detalle-linea">

            <strong>De:</strong>

            ${escaparHTML(
                correo.de
            )}

        </div>


        <div class="detalle-linea">

            <strong>Para:</strong>

            ${escaparHTML(
                correo.para
            )}

        </div>


        <div class="detalle-linea">

            <strong>Asunto:</strong>

            ${escaparHTML(
                correo.asunto
            )}

        </div>


        <div class="detalle-linea">

            <strong>Fecha:</strong>

            ${escaparHTML(
                fechaHora(
                    correo.creado
                )
            )}

        </div>


        <div class="detalle-linea">

            <strong>Estado:</strong>

            ${escaparHTML(
                correo.estado ||
                "pendiente"
            )}

        </div>


        <div class="separador"></div>


        <div class="detalle-mensaje">

            ${escaparHTML(
                correo.mensaje
            )}

        </div>

    `;


    tarjetaDetalle.classList.remove(
        "oculto"
    );


    tarjetaDetalle.scrollIntoView({
        behavior:"smooth"
    });


    /*
       MARCAR COMO LEÍDO
    */

    if(
        esRecibido &&
        correo.leido !== true
    ){

        try{

            await updateDoc(

                doc(
                    db,
                    "correos",
                    correo.id
                ),

                {
                    leido:true
                }

            );


            correo.leido =
            true;


            mostrarRecibidos();

        }
        catch(error){

            console.warn(
                "No se pudo marcar como leído:",
                error
            );

        }

    }

}
