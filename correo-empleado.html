function texto(valor){

    if(
        valor === undefined ||
        valor === null
    ){
        return "";
    }

    return String(valor);
}


function escaparHTML(valor){

    return texto(valor)
    .replace(/&/g,"&amp;")
    .replace(/</g,"&lt;")
    .replace(/>/g,"&gt;")
    .replace(/"/g,"&quot;")
    .replace(/'/g,"&#039;");

}


function nombreCompleto(datos){

    return (
        texto(datos.nombre) +
        " " +
        texto(datos.apellido)
    ).trim();

}

}


/* =========================================
   CARGAR EMPLEADO
========================================= */

async function cargarEmpleado(){

    const consulta =
    query(
        collection(
            db,
            "empleados"
        ),
        where(
            "authUid",
            "==",
            usuarioSesion.uid
        ),
        limit(1)
    );

    const resultados =
    await getDocs(
        consulta
    );

    if(
        resultados.empty
    ){

        throw new Error(
            "No encontramos el perfil de empleado vinculado a esta cuenta."
        );

    }

    const documento =
    resultados.docs[0];

    empleadoId =
    documento.id;

    empleadoActual = {

        id:
        documento.id,

        ...documento.data()

    };

    empresaId =
    texto(
        empleadoActual.empresaId
    ).trim();


    if(!empresaId){

        throw new Error(
            "El empleado no tiene empresaId vinculado. Hay que vincularlo con la empresa desde Administración."
        );

    }


    const nombre =
    nombreCompleto(
        empleadoActual
    ) ||
    "Empleado";


    const empresa =
    texto(
        empleadoActual.empresa
    ) ||
    texto(
        empleadoActual.empresaNombre
    ) ||
    "Empresa";


    usuarioActual.innerHTML = `
        <strong>
            ${escaparHTML(nombre)}
        </strong>
        <br>
        Puesto:
        ${escaparHTML(
            texto(
                empleadoActual.puesto
            ) || "Empleado"
        )}
        <br>
        Empresa:
        ${escaparHTML(empresa)}
        <br>
        Correo:
        ${escaparHTML(
            texto(
                empleadoActual.email
            ) ||
            texto(
                usuarioSesion.email
            )
        )}
    `;

}


/* =========================================
   CARGAR DESTINATARIOS
========================================= */

async function cargarDestinatarios(){

    destinatarios = [];


    /* =====================================
       OTROS EMPLEADOS
    ===================================== */

    const consultaEmpleados =
    query(
        collection(
            db,
            "empleados"
        ),
        where(
            "empresaId",
            "==",
            empresaId
        )
    );


    const resultadosEmpleados =
    await getDocs(
        consultaEmpleados
    );


    resultadosEmpleados.forEach(
        documento => {

            const datos =
            documento.data();


            if(
                documento.id ===
                empleadoId
            ){
                return;
            }


            destinatarios.push({

                id:
                documento.id,

                authUid:
                texto(
                    datos.authUid
                ),

                nombre:
                nombreCompleto(
                    datos
                ) ||
                "Empleado",

                email:
                texto(
                    datos.email
                ),

                tipo:
                "Empleado"

            });

        }
    );


    /* =====================================
       ADMINISTRACIÓN
    ===================================== */

    try{

        const consultaAdmin =
        query(
            collection(
                db,
                "administradores"
            ),
            where(
                "empresaId",
                "==",
                empresaId
            )
        );


        const resultadosAdmin =
        await getDocs(
            consultaAdmin
        );


        resultadosAdmin.forEach(
            documento => {

                const datos =
                documento.data();


                destinatarios.push({

                    id:
                    documento.id,

                    authUid:
                    texto(
                        datos.authUid
                    ),

                    nombre:
                    nombreCompleto(
                        datos
                    ) ||
                    texto(
                        datos.nombre
                    ) ||
                    "Administración",

                    email:
                    texto(
                        datos.email
                    ),

                    tipo:
                    "Administración"

                });

            }
        );

    }
    catch(error){

        console.warn(
            "No se pudo cargar administración:",
            error
        );

    }


    /* =====================================
       EMPRESA
       También permite que una empresa
       pueda aparecer como destinatario
       si tiene un usuarioAuthUid.
    ===================================== */

    try{

        const consultaEmpresa =
        query(
            collection(
                db,
                "empresas"
            ),
            where(
                "empresaId",
                "==",
                empresaId
            ),
            limit(1)
        );


        const resultadoEmpresa =
        await getDocs(
            consultaEmpresa
        );


        resultadoEmpresa.forEach(
            documento => {

                const datos =
                documento.data();


                const authUid =
                texto(
                    datos.authUid
                ) ||
                texto(
                    datos.usuarioUid
                ) ||
                texto(
                    datos.propietarioUid
                );


                if(
                    authUid
                ){

                    destinatarios.push({

                        id:
                        documento.id,

                        authUid:
                        authUid,

                        nombre:
                        texto(
                            datos.nombreEmpresa
                        ) ||
                        texto(
                            datos.razonSocial
                        ) ||
                        "Administración",

                        email:
                        texto(
                            datos.email
                        ),

                        tipo:
                        "Empresa"

                    });

                }

            }
        );

    }
    catch(error){

        console.warn(
            "No se pudo cargar empresa:",
            error
        );

    }


    /* =====================================
       QUITAR DUPLICADOS
    ===================================== */

    const mapa =
    new Map();


    destinatarios.forEach(
        persona => {

            const clave =
            persona.authUid ||
            persona.id;


            if(
                clave &&
                !mapa.has(clave)
            ){

                mapa.set(
                    clave,
                    persona
                );

            }

        }
    );


    destinatarios =
    Array.from(
        mapa.values()
    );


    destinatario.innerHTML = "";


    if(
        destinatarios.length === 0
    ){

        destinatario.innerHTML = `
            <option value="">
                No hay destinatarios disponibles
            </option>
        `;

        btnEnviar.disabled =
        true;

        return;

    }


    destinatario.innerHTML = `
        <option value="">
            Seleccionar destinatario...
        </option>
    `;


    destinatarios.forEach(
        persona => {

            const option =
            document.createElement(
                "option"
            );


            option.value =
            persona.id;


            option.textContent =
            persona.nombre +
            " — " +
            persona.tipo;


            destinatario.appendChild(
                option
            );

        }
    );


    btnEnviar.disabled =
    false;

}

/* =========================================
   SUBIR ARCHIVO
========================================= */

async function subirArchivo(
    archivo,
    carpeta
){

    if(!archivo){
        return null;
    }


    if(
        !storage
    ){

        throw new Error(
            "Firebase Storage no está configurado."
        );

    }


    const nombreSeguro =
    archivo.name.replace(
        /[^a-zA-Z0-9._-]/g,
        "_"
    );


    const ruta =
    "correos/" +
    empresaId +
    "/" +
    usuarioSesion.uid +
    "/" +
    carpeta +
    "/" +
    Date.now() +
    "_" +
    nombreSeguro;


    const referencia =
    ref(
        storage,
        ruta
    );


    await uploadBytes(
        referencia,
        archivo
    );


    const url =
    await getDownloadURL(
        referencia
    );


    return {

        url:
        url,

        nombre:
        archivo.name,

        tipo:
        archivo.type,

        tamano:
        archivo.size

    };

}

/* =========================================
   GRABAR AUDIO
========================================= */

async function iniciarGrabacion(
    modo
){

    try{

        const stream =
        await navigator.mediaDevices
        .getUserMedia({
            audio:true
        });


        audioChunks = [];


        mediaRecorder =
        new MediaRecorder(
            stream
        );


        mediaRecorder.ondataavailable =
        function(event){

            if(
                event.data.size > 0
            ){

                audioChunks.push(
                    event.data
                );

            }

        };


        mediaRecorder.onstop =
        function(){

            const blob =
            new Blob(
                audioChunks,
                {
                    type:
                    "audio/webm"
                }
            );


            if(
                modo ===
                "nuevo"
            ){

                audioBlobNuevo =
                blob;

                audioEstado.textContent =
                "🎤 Audio grabado. Se enviará junto con el mensaje.";

                audioEstado.style.display =
                "block";

            }
            else{

                audioBlobRespuesta =
                blob;

                audioRespuestaEstado.textContent =
                "🎤 Audio grabado. Se enviará junto con la respuesta.";

                audioRespuestaEstado.style.display =
                "block";

            }


            stream.getTracks()
            .forEach(
                track =>
                track.stop()
            );

        };


        mediaRecorder.start();


        if(
            modo ===
            "nuevo"
        ){

            btnAudio.textContent =
            "⏹️ DETENER AUDIO";

            btnAudio.classList.add(
                "grabando"
            );

        }
        else{

            btnAudioRespuesta.textContent =
            "⏹️ DETENER AUDIO";

            btnAudioRespuesta.classList.add(
                "grabando"
            );

        }

    }
    catch(error){

        mostrarError(
            "No se pudo acceder al micrófono. Revisá los permisos del navegador."
        );

    }

}


function detenerGrabacion(
    modo
){

    if(
        mediaRecorder &&
        mediaRecorder.state !==
        "inactive"
    ){

        mediaRecorder.stop();

    }


    if(
        modo ===
        "nuevo"
    ){

        btnAudio.textContent =
        "🎤 GRABAR AUDIO";

        btnAudio.classList.remove(
            "grabando"
        );

    }
    else{

        btnAudioRespuesta.textContent =
        "🎤 GRABAR AUDIO";

        btnAudioRespuesta.classList.remove(
            "grabando"
        );

    }

}


btnAudio.addEventListener(
    "click",
    function(){

        if(
            mediaRecorder &&
            mediaRecorder.state ===
            "recording"
        ){

            detenerGrabacion(
                "nuevo"
            );

        }
        else{

            iniciarGrabacion(
                "nuevo"
            );

        }

    }
);

async function cargarRecibidos(){

    recibidos.innerHTML = `
        <div class="cargando">
            Cargando mensajes...
        </div>
    `;


    try{

        const consulta =
        query(
            collection(
                db,
                "correos"
            ),
            where(
                "destinatarioUid",
                "==",
                usuarioSesion.uid
            ),
            limit(50)
        );


        const resultados =
        await getDocs(
            consulta
        );


        correosRecibidos = [];


        resultados.forEach(
            documento => {

                correosRecibidos.push({

                    id:
                    documento.id,

                    ...documento.data()

                });

            }
        );


        correosRecibidos.sort(
            (a,b) => {

                const fechaA =
                texto(a.fecha) +
                " " +
                texto(a.hora);

                const fechaB =
                texto(b.fecha) +
                " " +
                texto(b.hora);

                return fechaB.localeCompare(
                    fechaA
                );

            }
        );


        mostrarRecibidos();

    }
    catch(error){

        console.error(
            "Error recibidos:",
            error
        );


        recibidos.innerHTML = `
            <div class="sin-registros">
                No se pudieron cargar los mensajes.
            </div>
        `;

    }

}

/* =========================================
   ENVIAR RESPUESTA
========================================= */

btnEnviarRespuesta.addEventListener(
    "click",
    async function(){

        limpiarMensajes();


        if(
            !correoActual
        ){

            mostrarError(
                "No hay un mensaje seleccionado."
            );

            return;

        }


        const textoRespuesta =
        respuestaTexto.value.trim();


        if(
            !textoRespuesta &&
            !archivoRespuesta &&
            !audioBlobRespuesta
        ){

            mostrarError(
                "Escribí una respuesta o adjuntá un archivo/audio."
            );

            return;

        }


        btnEnviarRespuesta.disabled =
        true;


        btnEnviarRespuesta.textContent =
        "📤 ENVIANDO...";


        try{

            let destinatarioUid =
            texto(
                correoActual.remitenteUid
            );


            let destinatarioId =
            texto(
                correoActual.remitenteId
            );


            let destinatarioNombre =
            texto(
                correoActual.remitenteNombre
            );


            let destinatarioEmail =
            texto(
                correoActual.remitenteEmail
            );


            let destinatarioTipo =
            "Empleado";


            if(
                !destinatarioUid
            ){

                throw new Error(
                    "El mensaje original no tiene vinculado el usuario destinatario."
                );

            }


            let adjunto =
            null;


            if(
                archivoRespuesta
            ){

                adjunto =
                await subirArchivo(
                    archivoRespuesta,
                    "respuestas"
                );

            }


            let audio =
            null;


            if(
                audioBlobRespuesta
            ){

                const audioArchivo =
                new File(
                    [
                        audioBlobRespuesta
                    ],
                    "audio-respuesta-" +
                    Date.now() +
                    ".webm",
                    {
                        type:
                        "audio/webm"
                    }
                );


                audio =
                await subirArchivo(
                    audioArchivo,
                    "audios"
                );

            }


            await addDoc(
                collection(
                    db,
                    "correos"
                ),
                {

                    empresaId:
                    empresaId,

                    conversacionId:
                    correoActual.conversacionId ||
                    crypto.randomUUID(),

                    replyToId:
                    correoActual.id,

                    remitenteUid:
                    usuarioSesion.uid,

                    remitenteId:
                    empleadoId,

                    remitenteNombre:
                    nombreCompleto(
                        empleadoActual
                    ) ||
                    "Empleado",

                    remitenteEmail:
                    texto(
                        empleadoActual.email
                    ) ||
                    texto(
                        usuarioSesion.email
                    ),

                    destinatarioUid:
                    destinatarioUid,

                    destinatarioId:
                    destinatarioId,

                    destinatarioNombre:
                    destinatarioNombre,

                    destinatarioEmail:
                    destinatarioEmail,

                    destinatarioTipo:
                    destinatarioTipo,

                    asunto:
                    correoActual.asunto,

                    mensaje:
                    textoRespuesta,

                    fecha:
                    fechaActual(),

                    hora:
                    horaActual(),

                    creado:
                    serverTimestamp(),

                    leido:
                    false,

                    tipo:
                    "interno",

                    tipoMensaje:
                    audio
                    ? "audio"
                    : adjunto
                    ? "archivo"
                    : "respuesta",

                    adjunto:
                    adjunto,

                    audio:
                    audio,

                    estado:
                    "enviado"

                }
            );


            respuestaTexto.value =
            "";

            archivoRespuesta =
            null;

            audioBlobRespuesta =
            null;

            inputFotoRespuesta.value =
            "";

            inputArchivoRespuesta.value =
            "";

            archivoRespuestaSeleccionado.style.display =
            "none";

            audioRespuestaEstado.style.display =
            "none";


            mostrarExito(
                "Respuesta enviada correctamente."
            );


            await cargarConversacion(
                correoActual
            );


            await cargarEnviados();

        }
        catch(error){

            console.error(
                "Error enviando respuesta:",
                error
            );


            mostrarError(
                "No se pudo enviar la respuesta: " +
                error.message
            );

        }
        finally{

            btnEnviarRespuesta.disabled =
            false;

            btnEnviarRespuesta.textContent =
            "↩️ ENVIAR RESPUESTA";

        }

    }
);

            )

        }

            await signOut(
                auth
            );


            window.location.href =
            "empleado-login.html";

            mostrarError(
                "No se pudo cerrar la sesión: " +
                error.message
            );

        }

    }
);


/* =========================================
   INICIO
========================================= */

onAuthStateChanged(
    auth,
    async function(usuario){

        if(!usuario){

            window.location.href =
            "empleado-login.html";

            return;

        }


        usuarioSesion =
        usuario;


        try{

            limpiarMensajes();


            usuarioActual.textContent =
            "Cargando usuario...";


            await cargarEmpleado();


            await cargarDestinatarios();


            await cargarRecibidos();


            console.log(
                "CORREO EMPLEADO GESBASE INICIALIZADO"
            );

        }
        catch(error){

            console.error(
                "ERROR CORREO EMPLEADO:",
                error
            );


            btnEnviar.disabled =
            true;


            mostrarError(
                error.message
            );

        }

    }
);
