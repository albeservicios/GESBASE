/* =========================================

========================================= */

let usuarioSesion = null;

let empleadoId = "";

/* =========================================
   UTILIDADES
========================================= */

function texto(valor){

    if(
        valor === undefined ||
        valor === null
    ){
        return "";
    }

    return String(valor);

}


function escaparHTML(valor){

    return texto(valor)
    .replace(/&/g,"&amp;")
    .replace(/</g,"&lt;")
    .replace(/>/g,"&gt;")
    .replace(/"/g,"&quot;")
    .replace(/'/g,"&#039;");

}


function mostrarError(mensajeTexto){

    mensajeError.textContent =
    mensajeTexto;

    mensajeError.style.display =
    "block";

    mensajeExito.style.display =
    "none";

}


function mostrarExito(mensajeTexto){

    mensajeExito.textContent =
    mensajeTexto;

    mensajeExito.style.display =
    "block";

    mensajeError.style.display =
    "none";

}


function limpiarMensajes(){

    mensajeError.style.display =
    "none";

    mensajeExito.style.display =
    "none";

}


function nombreCompleto(datos){

    const nombre =
    texto(datos.nombre).trim();

    const apellido =
    texto(datos.apellido).trim();

    return (
        nombre +
        " " +
        apellido
    ).trim();

}


function fechaActual(){

    return (

function horaActual(){

/* =========================================
   CARGAR EMPLEADO
========================================= */

async function cargarEmpleado(){

    if(!usuarioSesion){

        throw new Error(
            "No hay una sesión activa."
        );

    }

    const consulta =
    query(
        collection(
            db,
            "empleados"
        ),
        where(
            "authUid",
            "==",
            usuarioSesion.uid
        ),
        limit(1)
    );

    const resultados =
    await getDocs(
        consulta
    );

    if(resultados.empty){

        throw new Error(
            "No encontramos el perfil de empleado vinculado a esta cuenta."
        );

    }

    const documento =
    resultados.docs[0];

    empleadoId =
    documento.id;

    empleadoActual = {
        id: documento.id,
        ...documento.data()
    };

    empresaId =
    texto(
        empleadoActual.empresaId
    ).trim();


    /*
       SOLAMENTE SE MUESTRA
       INFORMACIÓN DEL USUARIO.
       empresaId, CUIT y datos internos
       nunca se muestran.
    */

    const nombre =
    nombreCompleto(
        empleadoActual
    ) ||
    "Empleado";

    const puesto =
    texto(
        empleadoActual.puesto
    ) ||
    "Empleado";

    usuarioActual.innerHTML = `
        <strong>
            ${escaparHTML(nombre)}
        </strong>
        <br>
        Puesto:
        ${escaparHTML(puesto)}
    `;

}


/* =========================================
   CARGAR DESTINATARIOS
========================================= */

async function cargarDestinatarios(){

    destinatarios = [];

    if(!empresaId){

        destinatario.innerHTML = `
            <option value="">
                No hay empresa vinculada
            </option>
        `;

        btnEnviar.disabled =
        true;

        return;

    }


    /*
       EMPLEADOS DE LA MISMA EMPRESA
    */

    try{

        const consulta =
        query(
            collection(
                db,
                "empleados"
            ),
            where(
                "empresaId",
                "==",
                empresaId
            )
        );

        const resultados =
        await getDocs(
            consulta
        );

        resultados.forEach(
            documento => {

                if(
                    documento.id ===
                    empleadoId
                ){
                    return;
                }

                const datos =
                documento.data();

                const email =
                texto(
                    datos.email
                ).trim();

                /*
                   Solo agregamos usuarios
                   que tengan correo.
                */

                if(!email){
                    return;
                }

                destinatarios.push({

                    id:
                    documento.id,

                    authUid:
                    texto(
                        datos.authUid
                    ).trim(),

                    nombre:
                    nombreCompleto(
                        datos
                    ) ||
                    "Empleado",

                    email:
                    email,

                    tipo:
                    "Empleado"

                });

            }
        );

    }
    catch(error){

        console.error(
            "Error cargando empleados:",
            error
        );

    }


    /*
       ADMINISTRADORES DE LA EMPRESA
    */

    try{

        const consulta =
        query(
            collection(
                db,
                "administradores"
            ),
            where(
                "empresaId",
                "==",
                empresaId
            )
        );

        const resultados =
        await getDocs(
            consulta
        );

        resultados.forEach(
            documento => {

                const datos =
                documento.data();

                const email =
                texto(
                    datos.email
                ).trim();

                if(!email){
                    return;
                }

                destinatarios.push({

                    id:
                    documento.id,

                    authUid:
                    texto(
                        datos.authUid
                    ).trim(),

                    nombre:
                    nombreCompleto(
                        datos
                    ) ||
                    texto(
                        datos.nombre
                    ) ||
                    "Administración",

                    email:
                    email,

                    tipo:
                    "Administración"

                });

            }
        );

    }
    catch(error){

        console.warn(
            "No se pudo cargar administración:",
            error
        );

    }


    /*
       EVITAR DUPLICADOS
    */

    const unicos = [];

    const vistos = new Set();

    destinatarios.forEach(
        persona => {

            const clave =
            persona.id ||
            persona.authUid ||
            persona.email;

            if(
                !vistos.has(clave)
            ){

                vistos.add(clave);

                unicos.push(
                    persona
                );

            }

        }
    );

    destinatarios =
    unicos;


    /*
       MOSTRAR DESTINATARIOS
    */

    destinatario.innerHTML = "";

    if(
        destinatarios.length === 0
    ){

        destinatario.innerHTML = `
            <option value="">
                No hay destinatarios disponibles
            </option>
        `;

        btnEnviar.disabled =
        true;

        return;

    }


    destinatario.innerHTML = `
        <option value="">
            Seleccionar destinatario...
        </option>
    `;


    destinatarios.forEach(
        persona => {

            const option =
            document.createElement(
                "option"
            );

            option.value =
            persona.id;

            option.textContent =
            persona.nombre +
            " — " +
            persona.tipo;

            destinatario.appendChild(
                option
            );

        }
    );

}


/* =========================================
   DESTINATARIO SELECCIONADO
========================================= */

function obtenerDestinatario(){

        persona =>
        persona.id ===

    );

}

/* =========================================
   AUDIO
========================================= */

btnAudio.addEventListener(
    "click",
    async function(){

        /*
           Si ya está grabando,
           detener.
        */

        if(
            mediaRecorder &&
            mediaRecorder.state ===
            "recording"
        ){

            mediaRecorder.stop();

            return;

        }


        if(
            !navigator.mediaDevices ||
            !navigator.mediaDevices.getUserMedia
        ){

            mostrarError(
                "Este navegador no permite grabar audio."
            );

            return;

        }


        try{

            const stream =
            await navigator.mediaDevices.getUserMedia({
                audio:true
            });


            audioChunks = [];


            /*
               Usamos un formato compatible.
            */

            let mimeType =
            "audio/webm";


            if(
                !MediaRecorder.isTypeSupported(
                    "audio/webm"
                )
            ){

                mimeType =
                "";

            }


            mediaRecorder =
            mimeType
            ?
            new MediaRecorder(
                stream,
                {
                    mimeType:
                    mimeType
                }
            )
            :
            new MediaRecorder(
                stream
            );


            mediaRecorder.ondataavailable =
            function(event){

                if(
                    event.data &&
                    event.data.size > 0
                ){

                    audioChunks.push(
                        event.data
                    );

                }

            };


            mediaRecorder.onstop =
            function(){

                const tipo =
                mediaRecorder.mimeType ||
                "audio/webm";


                const extension =
                tipo.includes(
                    "ogg"
                )
                ?
                "ogg"
                :
                "webm";


                const audioBlob =
                new Blob(
                    audioChunks,
                    {
                        type:
                        tipo
                    }
                );


                archivoAdjunto =
                new File(
                    [audioBlob],
                    "audio-" +
                    Date.now() +
                    "." +
                    extension,
                    {
                        type:
                        tipo
                    }
                );


                tipoAdjunto =
                "audio";


                estadoGrabacion.classList.add(
                    "oculto"
                );


                btnAudio.textContent =
                "🎤 GRABAR AUDIO";


                archivoSeleccionado.classList.remove(
                    "oculto"
                );


                archivoSeleccionado.textContent =
                "🎤 Audio grabado correctamente. Se enviará con el mensaje.";


                stream.getTracks().forEach(
                    track =>
                    track.stop()
                );

            };


            mediaRecorder.start();


            estadoGrabacion.classList.remove(
                "oculto"
            );


            btnAudio.textContent =
            "⏹️ DETENER AUDIO";

        }
        catch(error){

            console.error(
                "Error de micrófono:",
                error
            );

            mostrarError(
                "No se pudo acceder al micrófono. Permití el acceso al micrófono del navegador."
            );

        }

    }
);


/* =========================================
   SUBIR ARCHIVO A FIREBASE STORAGE
========================================= */

async function subirAdjunto(){

    if(!archivoAdjunto){

        return null;

    }


    const nombreOriginal =
    archivoAdjunto.name ||
    "archivo";


    const partes =
    nombreOriginal.split(".");


    const extension =
    partes.length > 1
    ?
    partes.pop()
    :
    "bin";


    const nombreSeguro =
    Date.now() +
    "-" +
    Math.random()
    .toString(36)
    .substring(2) +
    "." +
    extension;


    const ruta =
    "correos/" +
    usuarioSesion.uid +
    "/" +
    nombreSeguro;


    const referencia =
    ref(
        almacenamiento,
        ruta
    );


    await uploadBytes(
        referencia,
        archivoAdjunto
    );


    const url =
    await getDownloadURL(
        referencia
    );


    return {

        url:
        url,

        nombre:
        nombreOriginal,

        tipo:
        archivoAdjunto.type ||
        "application/octet-stream",

        categoria:
        tipoAdjunto

    };

}

btnEnviar.addEventListener(
    "click",
    async function(){

        limpiarMensajes();

        obtenerDestinatario();


        const asuntoTexto =
        asunto.value.trim();


        const mensajeTexto =
        mensaje.value.trim();


        if(!persona){

            mostrarError(
                "Seleccioná un destinatario."
            );

            return;

        }


        if(!asuntoTexto){

            mostrarError(
                "Escribí un asunto."
            );

            return;

        }


        if(
            !mensajeTexto &&
            !archivoAdjunto
        ){

            mostrarError(

            );

            return;

        /*

           no permitimos enviar.
        */

            mediaRecorder &&
            mediaRecorder.state ===
            "recording"
        ){

            mostrarError(

            );

            return;

        }


        btnEnviar.disabled =
        true;

        btnEnviar.textContent =

                empleadoActual

            texto(
                empleadoActual.email
            ) ||
            texto(
                usuarioSesion.email
            );


            let adjunto =
            null;


            if(archivoAdjunto){

                adjunto =
                await subirAdjunto();

            }


            /*
               Documento nuevo.
               Conservamos también campos
               compatibles con tu estructura
               anterior.
            */

            await addDoc(
                collection(
                    db,
                    "correos"
                ),
                {

                    empresaId:
                    empresaId,

                    remitenteUid:
                    usuarioSesion.uid,

                    remitenteId:
                    empleadoId,

                    remitenteNombre:
                    nombreRemitente,

                    remitenteEmail:
                    emailRemitente,

                    destinatarioUid:
                    persona.authUid,

                    destinatarioId:
                    persona.id,

                    destinatarioNombre:
                    persona.nombre,

                    destinatarioEmail:
                    persona.email,

                    destinatarioTipo:
                    persona.tipo,

                    /*
                       Campos antiguos compatibles
                    */

                    de:
                    emailRemitente,

                    para:
                    persona.email,

                    asunto:
                    asuntoTexto,

                    mensaje:
                    mensajeTexto,

                    carpeta:
                    "enviados",

                    estado:
                    "enviado",

                    leido:
                    false,

                    tipo:
                    "interno",

                    fecha:
                    fechaActual(),

                    hora:
                    horaActual(),

                    creado:
                    serverTimestamp(),

                    enviado:
                    serverTimestamp(),

                    adjunto:
                    adjunto

                }
            );


            limpiarFormulario();


            mostrarExito(
                "Mensaje enviado correctamente."

                "ERROR ENVIANDO CORREO:",

            );


            mostrarError(
                "No se pudo enviar el mensaje: " +

            );

        }
        finally{

            btnEnviar.disabled =
            false;

            btnEnviar.textContent =
            "📤 ENVIAR MENSAJE";

        }

    }

/* =========================================
   RECIBIDOS
========================================= */

async function cargarRecibidos(){

    recibidos.innerHTML = `
        <div class="cargando">
            Cargando mensajes...
        </div>
    `;


    try{

        const consulta =
        query(
            collection(
                db,
                "correos"
            ),
            where(
                "destinatarioUid",
                "==",
                usuarioSesion.uid
            ),
            limit(100)
        );


        const resultados =
        await getDocs(
            consulta
        );


        correosRecibidos = [];


        resultados.forEach(
            documento => {

                correosRecibidos.push({

                    id:
                    documento.id,

                    ...documento.data()

                });

            }
        );


        correosRecibidos.sort(
            ordenarCorreos
        );


        mostrarRecibidos();

    }
    catch(error){

        console.error(
            "ERROR RECIBIDOS:",
            error
        );


        recibidos.innerHTML = `
            <div class="sin-registros">
                No se pudieron cargar los mensajes.
            </div>
        `;

    }

}

/* =========================================
   ORDENAR
========================================= */

function ordenarCorreos(a,b){

    const aFecha =
    texto(a.fecha) +
    " " +
    texto(a.hora);

    const bFecha =
    texto(b.fecha) +
    " " +
    texto(b.hora);

    return bFecha.localeCompare(
        aFecha
    );

}

/* =========================================
   MOSTRAR ADJUNTO
========================================= */

function htmlAdjunto(adjunto){

    if(
        !adjunto ||
        !adjunto.url
    ){

        return "";

    }


    const url =
    escaparHTML(
        adjunto.url
    );


    const nombre =
    escaparHTML(
        adjunto.nombre ||
        "Archivo"
    );


    const tipo =
    texto(
        adjunto.tipo
    );


    const categoria =
    texto(
        adjunto.categoria
    );


    /*
       FOTO
    */

    if(
        categoria === "foto" ||
        tipo.startsWith(
            "image/"
        )
    ){

        return `

            <div class="adjunto">

                <div class="nombre-adjunto">
                    📷 Foto adjunta
                </div>

                <img
                    src="${url}"
                    alt="Foto adjunta"
                    loading="lazy"
                >

                <br>

                <a
                    href="${url}"
                    target="_blank"
                    rel="noopener">
                    🔗 ABRIR FOTO
                </a>

            </div>

        `;

    }


    /*
       AUDIO
    */

    if(
        categoria === "audio" ||
        tipo.startsWith(
            "audio/"
        )
    ){

        return `

            <div class="adjunto">

                <div class="nombre-adjunto">
                    🎤 Audio
                </div>

                <audio
                    controls
                    preload="metadata">
                    <source
                        src="${url}"
                        type="${escaparHTML(tipo)}">
                    Tu navegador no puede reproducir este audio.
                </audio>

                <br>

                <a
                    href="${url}"
                    target="_blank"
                    rel="noopener">
                    🔊 ABRIR AUDIO
                </a>

            </div>

        `;

    }


    /*
       ARCHIVO
    */

    return `

        <div class="adjunto">

            <div class="nombre-adjunto">
                📎 ${nombre}
            </div>

            <a
                href="${url}"
                target="_blank"
                rel="noopener">
                ⬇️ ABRIR / DESCARGAR ARCHIVO
            </a>

        </div>

    `;

}


/* =========================================
   ABRIR CORREO
========================================= */

async function abrirCorreo(
    correo,
    esRecibido
){

    const nombreRemitente =
    correo.remitenteNombre ||
    correo.de ||
    "Usuario";


    const nombreDestinatario =
    correo.destinatarioNombre ||
    correo.para ||
    "Usuario";


    detalleCorreo.innerHTML = `

        <div class="detalle-linea">

            <strong>De:</strong>
            ${escaparHTML(
                nombreRemitente
            )}

        </div>

        <div class="detalle-linea">

            <strong>Para:</strong>
            ${escaparHTML(
                nombreDestinatario
            )}

        </div>

        <div class="detalle-linea">

            <strong>Asunto:</strong>
            ${escaparHTML(
                correo.asunto ||
                "(Sin asunto)"
            )}

        </div>

        <div class="detalle-linea">

            <strong>Fecha:</strong>
            ${escaparHTML(
                correo.fecha
            )}
            ${escaparHTML(
                correo.hora
            )}

        </div>

        <div class="separador"></div>

        <div class="detalle-mensaje">

            ${escaparHTML(
                correo.mensaje ||
                ""
            )}

        </div>

        ${htmlAdjunto(
            correo.adjunto
        )}

        ${
            esRecibido
            ?
            `
            <div class="responder-box">

                <button
                    id="btnResponder"
                    class="boton boton-responder"
                    type="button">

                    ↩️ RESPONDER

                </button>

            </div>
            `
            :
            ""
        }

    `;


    tarjetaDetalle.classList.remove(
        "oculto"
    );


    tarjetaDetalle.scrollIntoView({
        behavior:"smooth"
    });


    /*
       RESPONDER
    */

    if(esRecibido){

        const boton =
        document.getElementById(
            "btnResponder"
        );


        if(boton){

            boton.addEventListener(
                "click",
                function(){

                    prepararRespuesta(
                        correo
                    );

                }
            );

        }

    }


    /*
       MARCAR COMO LEÍDO
    */

    if(
        esRecibido &&
        !correo.leido
    ){

        try{

            await updateDoc(
                doc(
                    db,
                    "correos",
                    correo.id
                ),
                {
                    leido:true
                }
            );


            correo.leido =
            true;


            mostrarRecibidos();

        }
        catch(error){

            console.error(
                "Error marcando leído:",
                error
            );

        }

    }

}


/* =========================================
   PREPARAR RESPUESTA
========================================= */

function prepararRespuesta(correo){

    tarjetaDetalle.classList.add(
        "oculto"
    );


    /*
       Buscar al remitente dentro
       de los destinatarios.
    */

    let persona =
    destinatarios.find(
        p =>
        p.id ===
        correo.remitenteId
    );


    /*
       Si no coincide por ID,
       intentar por UID.
    */

    if(
        !persona &&
        correo.remitenteUid
    ){

        persona =
        destinatarios.find(
            p =>
            p.authUid ===
            correo.remitenteUid
        );

    }


    /*
       Si no está en la lista,
       intentamos localizarlo por email.
    */

    if(
        !persona &&
        correo.remitenteEmail
    ){

        persona =
        destinatarios.find(
            p =>
            p.email ===
            correo.remitenteEmail
        );

    }


    if(!persona){

        mostrarError(
            "No se encontró al remitente entre los destinatarios disponibles."
        );

        return;

    }


    destinatario.value =
    persona.id;


    asunto.value =
    texto(
        correo.asunto
    ).startsWith("Re:")
    ?
    texto(
        correo.asunto
    )
    :
    "Re: " +
    texto(
        correo.asunto
    );


    mensaje.value =
    "\n\n--- Mensaje original ---\n" +
    texto(
        correo.mensaje
    );


    archivoAdjunto =
    null;

    tipoAdjunto =
    "";


    inputFoto.value =
    "";

    inputArchivo.value =
    "";


    archivoSeleccionado.classList.add(
        "oculto"
    );


    respuestaInfo.textContent =
    "↩️ Respondiendo a " +
    persona.nombre;


    respuestaInfo.classList.remove(
        "oculto"
    );


    respondiendoA =
    correo.id;


    window.scrollTo({
        top:0,
        behavior:"smooth"
    });


    mostrarExito(
        "Respuesta preparada. Podés agregar texto, foto, audio o archivo."
    );

}
