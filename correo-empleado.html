*{

body{

.contenedor{

    margin-bottom:15px;
    font-size:14px;

}

.correo-item{
    border:1px solid #e5e7eb;

}

.correo-item:hover{

}

}

.correo-cabecera{

}

.correo-persona{
    font-weight:bold;
}

.correo-fecha{
    font-size:12px;

}

.correo-asunto{
    font-weight:bold;
    margin-bottom:6px;
}

.correo-resumen{
    font-size:14px;

    line-height:1.4;
}

.estado-correo{
    display:inline-block;
    font-size:11px;
    font-weight:bold;
    padding:4px 7px;
    border-radius:6px;
    background:#e5e7eb;
    color:#374151;
    margin-top:8px;
}

.estado-no-leido{
    background:#dbeafe;
    color:#1d4ed8;
}

.sin-registros,
.cargando{
    text-align:center;
    padding:25px;
    color:#6b7280;
}

.oculto{
    display:none !important;
}

.detalle{
    background:#fff;
    border:1px solid #d1d5db;

}

.detalle-linea{
    padding:8px 0;
    border-bottom:1px solid #e5e7eb;

}

.detalle-mensaje{

    line-height:1.6;
    margin-top:15px;

}

.separador{
    height:1px;
    background:#e5e7eb;
    margin:18px 0;
}

@media(max-width:600px){

    main{

    }

    .tarjeta{
        padding:16px;
    }

    .correo-cabecera{
        flex-direction:column;
        gap:3px;
    }

}

</style>

<script type="module">


/* =========================================
   FIREBASE
========================================= */

import {
    auth,
    db
} from "./Js/firebase.js";


import {
    onAuthStateChanged,
    signOut
} from
"https://www.gstatic.com/firebasejs/12.1.0/firebase-auth.js";


import {
    collection,
    addDoc,
    getDocs,
    updateDoc,
    doc,
    query,
    where,
    limit,
    serverTimestamp
} from
"https://www.gstatic.com/firebasejs/12.1.0/firebase-firestore.js";


/* =========================================
   ELEMENTOS
========================================= */

const usuarioActual =
document.getElementById(
    "usuarioActual"
);

const destinatario =
document.getElementById(
    "destinatario"
);

const asunto =
document.getElementById(
    "asunto"
);

const mensaje =
document.getElementById(
    "mensaje"
);

const btnEnviar =
document.getElementById(
    "btnEnviar"
);

const btnRecibidos =
document.getElementById(
    "btnRecibidos"
);

const btnEnviados =
document.getElementById(
    "btnEnviados"
);

const recibidos =
document.getElementById(
    "recibidos"
);

const enviados =
document.getElementById(
    "enviados"
);

const tarjetaDetalle =
document.getElementById(
    "tarjetaDetalle"
);

const detalleCorreo =
document.getElementById(
    "detalleCorreo"
);

const btnCerrarDetalle =
document.getElementById(
    "btnCerrarDetalle"
);

const btnVolver =
document.getElementById(
    "btnVolver"
);

const btnCerrarSesion =
document.getElementById(
    "btnCerrarSesion"
);

const mensajeError =
document.getElementById(
    "mensajeError"
);

const mensajeExito =
document.getElementById(
    "mensajeExito"
);


/* =========================================
   VARIABLES
========================================= */

let usuarioSesion = null;

let empleadoActual = null;

let empleadoId = "";

let empresaId = "";

let destinatarios = [];

let correosRecibidos = [];

let correosEnviados = [];


/* =========================================
   UTILIDADES
========================================= */

function texto(valor){

    if(
        valor === undefined ||
        valor === null
    ){

        return "";

    }

    return String(valor);

}


function escaparHTML(valor){

    return texto(valor)
    .replace(/&/g,"&amp;")
    .replace(/</g,"&lt;")
    .replace(/>/g,"&gt;")
    .replace(/"/g,"&quot;")
    .replace(/'/g,"&#039;");

}


function mostrarError(mensajeTexto){

    mensajeError.textContent =
    mensajeTexto;

    mensajeError.style.display =
    "block";

    mensajeExito.style.display =
    "none";

}


function mostrarExito(mensajeTexto){

    mensajeExito.textContent =
    mensajeTexto;

    mensajeExito.style.display =
    "block";

    mensajeError.style.display =
    "none";

}


function limpiarMensajes(){

    mensajeError.style.display =
    "none";

    mensajeExito.style.display =
    "none";

}


function nombreCompleto(datos){

    return (
        texto(datos.nombre) +
        " " +
        texto(datos.apellido)
    ).trim();

}


function fechaActual(){

    const ahora =
    new Date();

    return (
        ahora.getFullYear() +
        "-" +
        String(
            ahora.getMonth()+1
        ).padStart(2,"0") +
        "-" +
        String(
            ahora.getDate()
        ).padStart(2,"0")
    );

}


function horaActual(){

    const ahora =
    new Date();

    return (
        String(
            ahora.getHours()
        ).padStart(2,"0") +
        ":" +
        String(
            ahora.getMinutes()
        ).padStart(2,"0")
    );

}


function fechaCorreo(correo){

    if(
        correo.creado &&
        typeof correo.creado.toDate ===
        "function"
    ){

        return correo.creado
        .toDate()
        .toLocaleString("es-AR");

    }

    return (
        texto(correo.fecha) +
        " " +
        texto(correo.hora)
    ).trim();

}


/* =========================================
   CARGAR EMPLEADO
========================================= */

async function cargarEmpleado(){

    if(!usuarioSesion){

        throw new Error(
            "No hay una sesión activa."
        );

    }


    const consulta =
    query(
        collection(
            db,
            "empleados"
        ),
        where(
            "authUid",
            "==",
            usuarioSesion.uid
        ),
        limit(1)
    );


    const resultados =
    await getDocs(
        consulta
    );


    if(
        resultados.empty
    ){

        throw new Error(
            "No encontramos el perfil de empleado vinculado a esta cuenta."
        );

    }


    const documento =
    resultados.docs[0];


    empleadoId =
    documento.id;


    empleadoActual = {

        id:
        documento.id,

        ...documento.data()

    };


    empresaId =
    texto(
        empleadoActual.empresaId
    ).trim();


    if(!empresaId){

        throw new Error(
            "El empleado no tiene empresaId asignado."
        );

    }


    const nombre =
    nombreCompleto(
        empleadoActual
    ) ||
    "Empleado";


    const empresa =
    texto(
        empleadoActual.empresa
    ) ||
    texto(
        empleadoActual.empresaNombre
    ) ||
    "Empresa";


    usuarioActual.innerHTML = `

        <strong>
        ${escaparHTML(nombre)}
        </strong>

        <br>

        Puesto:
        ${escaparHTML(
            texto(
                empleadoActual.puesto
            ) || "Empleado"
        )}

        <br>

        Empresa:
        ${escaparHTML(empresa)}

        <br>

        Correo:
        ${escaparHTML(
            texto(
                empleadoActual.email
            ) ||
            texto(
                usuarioSesion.email
            )
        )}

    `;

}


/* =========================================
   CARGAR DESTINATARIOS
========================================= */

async function cargarDestinatarios(){

    destinatarios = [];


    /* =====================================
       ADMINISTRACIÓN
    ===================================== */

    try{

        const consultaAdmin =
        query(
            collection(
                db,
                "administradores"
            ),
            where(
                "empresaId",
                "==",
                empresaId
            )
        );


        const resultadosAdmin =
        await getDocs(
            consultaAdmin
        );


        resultadosAdmin.forEach(
            documento => {

                const datos =
                documento.data();


                destinatarios.push({

                    id:
                    documento.id,

                    authUid:
                    texto(
                        datos.authUid
                    ),

                    nombre:
                    nombreCompleto(
                        datos
                    ) ||
                    texto(
                        datos.nombre
                    ) ||
                    "Administración",

                    email:
                    texto(
                        datos.email
                    ),

                    tipo:
                    "Administración"

                });

            }
        );

    }
    catch(error){

        console.error(
            "Error cargando administración:",
            error
        );

    }


    /* =====================================
       OTROS EMPLEADOS
    ===================================== */

    try{

        const consultaEmpleados =
        query(
            collection(
                db,
                "empleados"
            ),
            where(
                "empresaId",
                "==",
                empresaId
            )
        );


        const resultadosEmpleados =
        await getDocs(
            consultaEmpleados
        );


        resultadosEmpleados.forEach(
            documento => {

                if(
                    documento.id ===
                    empleadoId
                ){

                    return;

                }


                const datos =
                documento.data();


                destinatarios.push({

                    id:
                    documento.id,

                    authUid:
                    texto(
                        datos.authUid
                    ),

                    nombre:
                    nombreCompleto(
                        datos
                    ) ||
                    "Empleado",

                    email:
                    texto(
                        datos.email
                    ),

                    tipo:
                    "Empleado"

                });

            }
        );

    }
    catch(error){

        console.error(
            "Error cargando empleados:",
            error
        );

    }


    /* =====================================
       MOSTRAR DESTINATARIOS
    ===================================== */

    destinatario.innerHTML = "";


    if(
        destinatarios.length === 0
    ){

        destinatario.innerHTML = `

            <option value="">
            No hay destinatarios disponibles
            </option>

        `;

        btnEnviar.disabled =
        true;

        return;

    }


    destinatario.innerHTML = `

        <option value="">
        Seleccionar destinatario...
        </option>

    `;


    destinatarios.forEach(
        persona => {

            const option =
            document.createElement(
                "option"
            );


            option.value =
            persona.id;


            option.textContent =
            persona.nombre +
            " — " +
            persona.tipo;


            destinatario.appendChild(
                option
            );

        }
    );


    btnEnviar.disabled =
    false;

}


/* =========================================
   OBTENER DESTINATARIO
========================================= */

function obtenerDestinatario(){

    return destinatarios.find(
        persona =>
        persona.id ===
        destinatario.value
    );

}


/* =========================================
   ENVIAR CORREO
========================================= */

btnEnviar.addEventListener(
    "click",
    async function(){

        limpiarMensajes();


        const persona =
        obtenerDestinatario();


        const asuntoTexto =
        asunto.value.trim();


        const mensajeTexto =
        mensaje.value.trim();


        if(!persona){

            mostrarError(
                "Seleccioná un destinatario."
            );

            return;

        }


        if(!asuntoTexto){

            mostrarError(
                "Escribí un asunto."
            );

            return;

        }


        if(!mensajeTexto){

            mostrarError(
                "Escribí el mensaje."
            );

            return;

        }


        if(!persona.authUid){

            mostrarError(
                "El destinatario no tiene authUid vinculado."
            );

            return;

        }


        btnEnviar.disabled =
        true;


        btnEnviar.textContent =
        "📤 ENVIANDO...";


        try{

            const nombreRemitente =
            nombreCompleto(
                empleadoActual
            ) ||
            "Empleado";


            const emailRemitente =
            texto(
                empleadoActual.email
            ) ||
            texto(
                usuarioSesion.email
            );


            /*
             * ESTRUCTURA COMPATIBLE
             * CON FIRESTORE
             */

            await addDoc(
                collection(
                    db,
                    "correos"
                ),
                {

                    empresaId:
                    empresaId,

                    usuarioId:
                    usuarioSesion.uid,

                    remitenteUid:
                    usuarioSesion.uid,

                    remitenteId:
                    empleadoId,

                    remitenteNombre:
                    nombreRemitente,

                    remitenteEmail:
                    emailRemitente,

                    destinatarioUid:
                    persona.authUid,

                    destinatarioId:
                    persona.id,

                    destinatarioNombre:
                    persona.nombre,

                    destinatarioEmail:
                    persona.email,

                    destinatarioTipo:
                    persona.tipo,

                    asunto:
                    asuntoTexto,

                    mensaje:
                    mensajeTexto,

                    carpeta:
                    "enviados",

                    estado:
                    "enviado",

                    leido:
                    false,

                    fecha:
                    fechaActual(),

                    hora:
                    horaActual(),

                    creado:
                    serverTimestamp(),

                    enviado:
                    serverTimestamp(),

                    tipo:
                    "interno"

                }
            );


            asunto.value =
            "";

            mensaje.value =
            "";

            destinatario.value =
            "";


            mostrarExito(
                "Mensaje enviado correctamente."
            );


            await cargarEnviados();

        }
        catch(error){

            console.error(
                "ERROR ENVIANDO:",
                error
            );


            mostrarError(
                "No se pudo enviar el mensaje: " +
                error.message
            );

        }
        finally{

            btnEnviar.disabled =
            false;

            btnEnviar.textContent =
            "📤 ENVIAR MENSAJE";

        }

    }
);


/* =========================================
   RECIBIDOS
========================================= */

async function cargarRecibidos(){

    recibidos.innerHTML = `

        <div class="cargando">
        Cargando mensajes...
        </div>

    `;


    try{

        const consulta =
        query(
            collection(
                db,
                "correos"
            ),
            where(
                "destinatarioUid",
                "==",
                usuarioSesion.uid
            ),
            limit(50)
        );


        const resultados =
        await getDocs(
            consulta
        );


        correosRecibidos = [];


        resultados.forEach(
            documento => {

                correosRecibidos.push({

                    id:
                    documento.id,

                    ...documento.data()

                });

            }
        );


        correosRecibidos.sort(
            (a,b) => {

                return fechaCorreo(b)
                .localeCompare(
                    fechaCorreo(a)
                );

            }
        );


        mostrarRecibidos();

    }
    catch(error){

        console.error(
            "ERROR RECIBIDOS:",
            error
        );


        recibidos.innerHTML = `

            <div class="sin-registros">
            No se pudieron cargar los mensajes.
            </div>

        `;

    }

}


/* =========================================
   MOSTRAR RECIBIDOS
========================================= */

function mostrarRecibidos(){

    if(
        correosRecibidos.length === 0
    ){

        recibidos.innerHTML = `

            <div class="sin-registros">
            No tenés mensajes recibidos.
            </div>

        `;

        return;

    }


    recibidos.innerHTML = "";


    correosRecibidos.forEach(
        correo => {

            const item =
            document.createElement(
                "div"
            );


            item.className =
            "correo-item" +
            (
                correo.leido
                ? ""
                : " no-leido"
            );


            item.innerHTML = `

                <div class="correo-cabecera">

                    <div class="correo-persona">

                        De:
                        ${escaparHTML(
                            correo.remitenteNombre ||
                            "Administración"
                        )}

                    </div>

                    <div class="correo-fecha">

                        ${escaparHTML(
                            fechaCorreo(correo)
                        )}

                    </div>

                </div>


                <div class="correo-asunto">

                    ${escaparHTML(
                        correo.asunto
                    )}

                </div>


                <div class="correo-resumen">

                    ${escaparHTML(
                        texto(
                            correo.mensaje
                        ).substring(0,180)
                    )}

                    ${
                        texto(
                            correo.mensaje
                        ).length > 180
                        ? "..."
                        : ""
                    }

                </div>


                <span
                    class="estado-correo ${
                        correo.leido
                        ? ""
                        : "estado-no-leido"
                    }"
                >

                    ${
                        correo.leido
                        ? "LEÍDO"
                        : "NO LEÍDO"
                    }

                </span>

            `;


            item.addEventListener(
                "click",
                function(){

                    abrirCorreo(
                        correo,
                        true
                    );

                }
            );


            recibidos.appendChild(
                item
            );

        }
    );

}


/* =========================================
   ENVIADOS
========================================= */

async function cargarEnviados(){

    enviados.innerHTML = `

        <div class="cargando">
        Cargando mensajes...
        </div>

    `;


    try{

        const consulta =
        query(
            collection(
                db,
                "correos"
            ),
            where(
                "usuarioId",
                "==",
                usuarioSesion.uid
            ),
            limit(50)
        );


        const resultados =
        await getDocs(
            consulta
        );


        correosEnviados = [];


        resultados.forEach(
            documento => {

                const datos =
                documento.data();


                if(
                    datos.carpeta ===
                    "enviados"
                ){

                    correosEnviados.push({

                        id:
                        documento.id,

                        ...datos

                    });

                }

            }
        );


        correosEnviados.sort(
            (a,b) => {

                return fechaCorreo(b)
                .localeCompare(
                    fechaCorreo(a)
                );

            }
        );


        mostrarEnviados();

    }
    catch(error){

        console.error(
            "ERROR ENVIADOS:",
            error
        );


        enviados.innerHTML = `

            <div class="sin-registros">
            No se pudieron cargar los mensajes enviados.
            </div>

        `;

    }

}


/* =========================================
   MOSTRAR ENVIADOS
========================================= */

function mostrarEnviados(){

    if(
        correosEnviados.length === 0
    ){

        enviados.innerHTML = `

            <div class="sin-registros">
            No tenés mensajes enviados.
            </div>

        `;

        return;

    }


    enviados.innerHTML = "";


    correosEnviados.forEach(
        correo => {

            const item =
            document.createElement(
                "div"
            );


            item.className =
            "correo-item";


            item.innerHTML = `

                <div class="correo-cabecera">

                    <div class="correo-persona">

                        Para:
                        ${escaparHTML(
                            correo.destinatarioNombre ||
                            correo.destinatarioEmail ||
                            "Destinatario"
                        )}

                    </div>


                    <div class="correo-fecha">

                        ${escaparHTML(
                            fechaCorreo(correo)
                        )}

                    </div>

                </div>


                <div class="correo-asunto">

                    ${escaparHTML(
                        correo.asunto
                    )}

                </div>


                <div class="correo-resumen">

                    ${escaparHTML(
                        texto(
                            correo.mensaje
                        ).substring(0,180)
                    )}

                    ${
                        texto(
                            correo.mensaje
                        ).length > 180
                        ? "..."
                        : ""
                    }

                </div>

            `;


            item.addEventListener(
                "click",
                function(){

                    abrirCorreo(
                        correo,
                        false
                    );

                }
            );


            enviados.appendChild(
                item
            );

        }
    );

}


/* =========================================
   ABRIR CORREO
========================================= */

async function abrirCorreo(
    correo,
    esRecibido
){

    detalleCorreo.innerHTML = `

        <div class="detalle-linea">

            <strong>De:</strong>

            ${escaparHTML(
                correo.remitenteNombre ||
                "Administración"
            )}

        </div>


        <div class="detalle-linea">

            <strong>Para:</strong>

            ${escaparHTML(
                correo.destinatarioNombre ||
                correo.destinatarioEmail ||
                "Destinatario"
            )}

        </div>


        <div class="detalle-linea">

            <strong>Asunto:</strong>

            ${escaparHTML(
                correo.asunto
            )}

        </div>


        <div class="detalle-linea">

            <strong>Fecha:</strong>

            ${escaparHTML(
                fechaCorreo(correo)
            )}

        </div>


        <div class="separador"></div>


        <div class="detalle-mensaje">

            ${escaparHTML(
                correo.mensaje
            )}

        </div>

    `;


    tarjetaDetalle.classList.remove(
        "oculto"
    );


    tarjetaDetalle.scrollIntoView({
        behavior:"smooth"
    });


    if(
        esRecibido &&
        !correo.leido
    ){

        try{

            await updateDoc(
                doc(
                    db,
                    "correos",
                    correo.id
                ),
                {
                    leido:true
                }
            );


            correo.leido =
            true;


            mostrarRecibidos();

        }
        catch(error){

            console.error(
                "Error marcando leído:",
                error
            );

        }

    }

}

btnCerrarSesion.addEventListener(
    "click",
    async function(){

        if(
            !confirm(
                "¿Querés cerrar la sesión?"
            )
        ){

            return;

        }


        try{

            await signOut(
                auth
            );


            window.location.replace(
                "empleado-login.html"
            );

        }
        catch(error){

            mostrarError(
                "No se pudo cerrar la sesión: " +
                error.message
            );

        }

    }
);


/* =========================================
   INICIO
========================================= */

onAuthStateChanged(
    auth,
    async function(usuario){

        if(!usuario){

            window.location.replace(
                "empleado-login.html"
            );

            return;

        }


        usuarioSesion =
        usuario;


        try{

            limpiarMensajes();


            await cargarEmpleado();


            await cargarDestinatarios();


            await cargarRecibidos();


            await cargarEnviados();


            console.log(
                "CORREO EMPLEADO GESBASE INICIALIZADO"
            );

        }
        catch(error){

            console.error(
                "ERROR INICIANDO CORREO:",
                error
            );


            btnEnviar.disabled =
            true;


            mostrarError(
                error.message
            );

        }

    }
);
