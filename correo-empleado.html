/* =========================================

========================================= */

function texto(valor){

    if(
        valor === undefined ||
        valor === null
    ){

        return "";

    }

    return String(valor);

}


function mostrarError(mensaje){

    mensajeError.textContent =

    mensajeError.style.display =
    "block";

    mensajeExito.style.display =
    "none";

}


function mostrarExito(mensaje){

    mensajeExito.textContent =
    mensaje;

    mensajeExito.style.display =
    "block";

    mensajeError.style.display =
    "none";

}


function limpiarMensajes(){

    mensajeError.style.display =
    "none";

    mensajeExito.style.display =
    "none";

}


function escaparHTML(valor){

    return texto(valor)
    .replace(/&/g,"&amp;")
    .replace(/</g,"&lt;")
    .replace(/>/g,"&gt;")
    .replace(/"/g,"&quot;")
    .replace(/'/g,"&#039;");

}


function nombreCompleto(datos){

    return (
        texto(datos.nombre) +
        " " +
        texto(datos.apellido)
    ).trim();

}


function fechaActual(){

    new Date();

function horaActual(){

}


/* =========================================
   CARGAR PERFIL DEL EMPLEADO
========================================= */

async function cargarEmpleado(){

    if(!usuarioSesion){

        throw new Error(
            "No hay una sesión activa."
        );

    }


    const consulta =
    query(
        collection(
            db,
            "empleados"
        ),
        where(
            "authUid",
            "==",
            usuarioSesion.uid
        ),
        limit(1)
    );


    const resultados =
    await getDocs(
        consulta
    );


    if(
        resultados.empty
    ){

        throw new Error(
            "No encontramos el perfil de empleado vinculado a esta cuenta."
        );

    }


    const documento =
    resultados.docs[0];


    empleadoId =
    documento.id;


    empleadoActual = {

        id:
        documento.id,

        ...documento.data()

    };


    empresaId =
    texto(
        empleadoActual.empresaId
    ).trim();


    if(!empresaId){

        throw new Error(
            "El empleado no tiene una empresa vinculada."
        );

    }


    /*
     * IMPORTANTE:
     * No mostramos empresaId,
     * puesto ni demás información
     * interna.
     */

    const email =
    texto(
        empleadoActual.email
    ) ||
    texto(
        usuarioSesion.email
    );


    usuarioActual.innerHTML = `
        <strong>Correo interno</strong>
        <br>
        ${escaparHTML(email)}
    `;

}


/* =========================================
   AGREGAR DESTINATARIO
========================================= */

function agregarDestinatario(
    persona
){

    if(
        !persona ||
        !persona.id
    ){

        return;

    }


    if(
        persona.id === empleadoId
    ){

        return;

    }


    if(
        !persona.authUid
    ){

        return;

    }


    if(
        destinatarios.some(
            item =>
            item.id === persona.id &&
            item.tipo === persona.tipo
        )
    ){

        return;

    }


    destinatarios.push(
        persona
    );

}


/* =========================================
   CARGAR DESTINATARIOS
========================================= */

async function cargarDestinatarios(){

    destinatarios = [];


    /*
     * ==============================
     * EMPLEADOS
     * ==============================
     */

    try{

        const consultaEmpleados =
        query(
            collection(
                db,
                "empleados"
            ),
            where(
                "empresaId",
                "==",
                empresaId
            )
        );


        const resultadosEmpleados =
        await getDocs(
            consultaEmpleados
        );


        resultadosEmpleados.forEach(
            documento => {

                const datos =
                documento.data();


                agregarDestinatario({

                    id:
                    documento.id,

                    authUid:
                    texto(
                        datos.authUid
                    ),

                    nombre:
                    nombreCompleto(
                        datos
                    ) ||
                    "Empleado",

                    email:
                    texto(
                        datos.email
                    ),

                    tipo:
                    "Empleado"

                });

            }
        );

    }
    catch(error){

        console.warn(
            "No se pudieron cargar empleados:",
            error
        );

    }


    /*
     * ==============================
     * ADMINISTRACIÓN
     * ==============================
     */

    try{

        const consultaAdministradores =
        query(
            collection(
                db,
                "administradores"
            ),
            where(
                "empresaId",
                "==",
                empresaId
            )
        );


        const resultadosAdmin =
        await getDocs(
            consultaAdministradores
        );


        resultadosAdmin.forEach(
            documento => {

                const datos =
                documento.data();


                agregarDestinatario({

                    id:
                    documento.id,

                    authUid:
                    texto(
                        datos.authUid
                    ),

                    nombre:
                    nombreCompleto(
                        datos
                    ) ||
                    texto(
                        datos.nombre
                    ) ||
                    "Administración",

                    email:
                    texto(
                        datos.email
                    ),

                    tipo:
                    "Administración"

                });

            }
        );

    }
    catch(error){

        console.warn(
            "No se pudo cargar administración:",
            error
        );

    }


    /*
     * ==============================
     * ARMAR SELECT
     * ==============================
     */

    destinatario.innerHTML =
    "";


    if(
        destinatarios.length === 0
    ){

        destinatario.innerHTML = `
            <option value="">
                No hay destinatarios disponibles
            </option>
        `;

        btnEnviar.disabled =
        true;

        return;

    }


    destinatario.innerHTML = `
        <option value="">
            Seleccionar destinatario...
        </option>
    `;


    /*
     * Administración primero
     */

    destinatarios.sort(
        function(a,b){

            if(
                a.tipo ===
                "Administración"
            ){

                return -1;

            }

            if(
                b.tipo ===
                "Administración"
            ){

                return 1;

            }

            return a.nombre.localeCompare(
                b.nombre
            );

        }
    );


    destinatarios.forEach(
        persona => {

            const option =
            document.createElement(
                "option"
            );


            option.value =
            persona.id +
            "|" +
            persona.tipo;


            option.textContent =
            persona.nombre +
            " — " +
            persona.tipo;


            destinatario.appendChild(
                option
            );

        }
    );


    btnEnviar.disabled =
    false;

}


/* =========================================
   OBTENER DESTINATARIO
========================================= */

function obtenerDestinatario(){

    const valor =
    destinatario.value;


    if(!valor){

        return null;

    }


    const partes =
    valor.split("|");


    const id =
    partes[0];

    const tipo =
    partes[1];


    return destinatarios.find(
        persona =>
        persona.id === id &&
        persona.tipo === tipo
    ) || null;

}

/* =========================================
   SUBIR ARCHIVOS
========================================= */

async function subirArchivos(){

    const adjuntos = [];


    /*
     * ARCHIVOS NORMALES
     */

    for(
        const file
        of archivosParaEnviar
    ){

        const ruta =
        "correos/" +
        empresaId +
        "/" +
        usuarioSesion.uid +
        "/" +
        Date.now() +
        "_" +
        file.name;


        const referencia =
        ref(
            storage,
            ruta
        );


        const resultado =
        await uploadBytes(
            referencia,
            file
        );


        const url =
        await getDownloadURL(
            resultado.ref
        );


        adjuntos.push({

            nombre:
            file.name,

            tipo:
            file.type ||
            "archivo",

            url:
            url,

            ruta:
            ruta

        });

    }


    /*
     * AUDIO GRABADO
     */

    if(audioBlob){

        const nombreAudio =
        "audio_" +
        Date.now() +
        ".webm";


        const rutaAudio =
        "correos/" +
        empresaId +
        "/" +
        usuarioSesion.uid +
        "/" +
        nombreAudio;


        const referenciaAudio =
        ref(
            storage,
            rutaAudio
        );


        const resultadoAudio =
        await uploadBytes(
            referenciaAudio,
            audioBlob,
            {
                contentType:
                "audio/webm"
            }
        );


        const urlAudio =
        await getDownloadURL(
            resultadoAudio.ref
        );


        adjuntos.push({

            nombre:
            "Audio",

            tipo:
            "audio/webm",

            url:
            urlAudio,

            ruta:
            rutaAudio

        });

    }


    return adjuntos;

}


/* =========================================
   GRABAR AUDIO
========================================= */

btnGrabarAudio.addEventListener(
    "click",
    async function(){

        limpiarMensajes();


        if(
            mediaRecorder &&
            mediaRecorder.state ===
            "recording"
        ){

            detenerGrabacion();

            return;

        }


        try{

            const stream =
            await navigator.mediaDevices
            .getUserMedia({
                audio:true
            });


            audioChunks = [];


            mediaRecorder =
            new MediaRecorder(
                stream
            );


            mediaRecorder.ondataavailable =
            function(event){

                if(
                    event.data.size > 0
                ){

                    audioChunks.push(
                        event.data
                    );

                }

            };


            mediaRecorder.onstop =
            function(){

                audioBlob =
                new Blob(
                    audioChunks,
                    {
                        type:
                        "audio/webm"
                    }
                );


                const url =
                URL.createObjectURL(
                    audioBlob
                );


                audioPreview.src =
                url;


                audioPreview.classList.remove(
                    "oculto"
                );


                btnCancelarAudio.classList.remove(
                    "oculto"
                );


                estadoAudio.classList.add(
                    "oculto"
                );


                btnGrabarAudio.classList.remove(
                    "boton-grabando"
                );


                btnGrabarAudio.classList.add(
                    "boton-grabar"
                );


                btnGrabarAudio.textContent =
                "🎤 GRABAR AUDIO";


                stream.getTracks().forEach(
                    track =>
                    track.stop()
                );

            };


            mediaRecorder.start();


            estadoAudio.textContent =
            "🔴 Grabando audio... Tocá el botón nuevamente para detener.";


            estadoAudio.classList.remove(
                "oculto"
            );


            btnGrabarAudio.classList.remove(
                "boton-grabar"
            );


            btnGrabarAudio.classList.add(
                "boton-grabando"
            );


            btnGrabarAudio.textContent =
            "⏹️ DETENER GRABACIÓN";

        }
        catch(error){

            console.error(
                error
            );


            mostrarError(
                "No se pudo acceder al micrófono."
            );

        }

    }
);


function detenerGrabacion(){

    if(
        mediaRecorder &&
        mediaRecorder.state ===
        "recording"
    ){

        mediaRecorder.stop();

    }

}

async function cargarRecibidos(){

    recibidos.innerHTML = `
        <div class="cargando">
            Cargando mensajes...
        </div>
    `;


    try{

        const consulta =
        query(
            collection(
                db,
                "correos"
            ),
            where(
                "destinatarioUid",
                "==",
                usuarioSesion.uid
            ),
            limit(100)
        );


        const resultados =
        await getDocs(
            consulta
        );


        correosRecibidos = [];


        resultados.forEach(
            documento => {

                correosRecibidos.push({

                    id:
                    documento.id,

                    ...documento.data()

                });

            }
        );


        /*
         * COMPATIBILIDAD CON
         * MENSAJES ANTIGUOS
         */

        try{

            const consultaAntigua =
            query(
                collection(
                    db,
                    "correos"
                ),
                where(
                    "para",
                    "==",
                    usuarioSesion.email
                ),
                limit(100)
            );


            const antiguos =
            await getDocs(
                consultaAntigua
            );


            antiguos.forEach(
                documento => {

                    const existe =
                    correosRecibidos.some(
                        correo =>
                        correo.id ===
                        documento.id
                    );


                    if(!existe){

                        correosRecibidos.push({

                            id:
                            documento.id,

                            ...documento.data()

                        });

                    }

                }
            );

        }
        catch(error){

            console.warn(
                "No se pudieron consultar mensajes antiguos:",
                error
            );

        }


        correosRecibidos.sort(
            function(a,b){

                const fechaA =
                texto(a.fecha) +
                " " +
                texto(a.hora);


                const fechaB =
                texto(b.fecha) +
                " " +
                texto(b.hora);


                return fechaB.localeCompare(
                    fechaA
                );

            }
        );


        mostrarRecibidos();

    }
    catch(error){

        console.error(
            "Error recibidos:",
            error
        );


        recibidos.innerHTML = `
            <div class="sin-registros">
                No se pudieron cargar los mensajes.
            </div>
        `;

    }

}

/* =========================================

function mostrarAdjuntos(
    adjuntos
){

    if(
        !Array.isArray(adjuntos) ||
        adjuntos.length === 0
    ){

        return "";

    }


    let html =
    `<div class="adjunto">
        <strong>📎 Archivos adjuntos</strong>`;


    adjuntos.forEach(
        archivo => {

            const nombre =
            escaparHTML(
                archivo.nombre ||
                "Archivo"
            );


            const url =
            escaparHTML(
                archivo.url ||
                "#"
            );


            const tipo =
            texto(
                archivo.tipo
            );


            if(
                tipo.startsWith(
                    "image/"
                )
            ){

                html += `

                    <div style="margin-top:12px;">

                        <div>
                            ${nombre}
                        </div>

                        <a
                            href="${url}"
                            target="_blank"
                            rel="noopener"
                        >

                            <img
                                src="${url}"
                                alt="${nombre}"
                            >

                        </a>

                    </div>

                `;

            }
            else if(
                tipo.startsWith(
                    "audio/"
                )
            ){

                html += `

                    <div style="margin-top:12px;">

                        <div>
                            🎤 ${nombre}
                        </div>

                        <audio
                            controls
                            src="${url}"
                        ></audio>

                    </div>

                `;

            }
            else{

                html += `

                    <div style="margin-top:12px;">

                        📎 ${nombre}

                        <br>

                        <a
                            href="${url}"
                            target="_blank"
                            rel="noopener"
                        >
                            ABRIR / DESCARGAR
                        </a>

                    </div>

                `;

            }

        }
    );


    html +=
    "</div>";


    return html;

}

        "oculto"
    );

}

);

========================================= */

btnCerrarSesion.addEventListener(
    "click",
    async function(){

        if(
            !confirm(
                "¿Querés cerrar la sesión?"
            )
        ){

            return;

        }


        try{

            await signOut(
                auth
            );


            window.location.href =
            "empleado-login.html";

        }
        catch(error){

            mostrarError(
                "No se pudo cerrar la sesión: " +
                error.message
            );

        }

    }
);


/* =========================================
   INICIO
========================================= */

onAuthStateChanged(
    auth,
    async function(usuario){

        if(!usuario){

            window.location.href =
            "empleado-login.html";

            return;

        }


        usuarioSesion =
        usuario;


        try{

            limpiarMensajes();


            usuarioActual.textContent =
            "Cargando correo...";


            await cargarEmpleado();


            await cargarDestinatarios();


            await cargarRecibidos();


            console.log(
                "CORREO EMPLEADO GESBASE INICIALIZADO"
            );

        }
        catch(error){

            console.error(
                "ERROR INICIANDO CORREO:",
                error
            );


            btnEnviar.disabled =
            true;


            mostrarError(
                error.message
            );

        }

    }
);
