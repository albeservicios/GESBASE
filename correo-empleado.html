function texto(valor){

    if(
        valor === undefined ||
        valor === null
    ){

        return "";

    }

    return String(valor);

}


function escaparHTML(valor){

    return texto(valor)

        .replace(/&/g,"&amp;")
        .replace(/</g,"&lt;")
        .replace(/>/g,"&gt;")
        .replace(/"/g,"&quot;")
        .replace(/'/g,"&#039;");

}


function nombreCompleto(datos){

    return (

        texto(datos.nombre) +
        " " +
        texto(datos.apellido)

}

/* =========================================
   BUSCAR USUARIO POR UID
========================================= */

async function buscarUsuario(){

    /*
     * PRIMERO:
     * Documento cuyo ID sea el UID
     */

    try{

        const referencia =
        doc(
            db,
            "usuarios",
            usuarioSesion.uid
        );

        const resultado =
        await getDoc(
            referencia
        );

        if(
            resultado.exists()
        ){

            return {

                id:
                resultado.id,

                ...resultado.data()

            };

        }

    }
    catch(error){

        console.warn(
            "No se pudo buscar usuario por ID:",
            error
        );

    }


    /*
     * SEGUNDO:
     * Buscar por campo uid
     */

    try{

        const consulta =
        query(

            collection(
                db,
                "usuarios"
            ),

            where(
                "uid",
                "==",
                usuarioSesion.uid
            ),

            limit(1)

        );


        const resultado =
        await getDocs(
            consulta
        );


        if(
            !resultado.empty
        ){

            const documento =
            resultado.docs[0];

            return {

                id:
                documento.id,

                ...documento.data()

            };

        }

    }
    catch(error){

        console.warn(
            "No se pudo buscar usuario por uid:",
            error
        );

    }


    /*
     * TERCERO:
     * Compatibilidad con authUid
     */

    try{

        const consulta =
        query(

            collection(
                db,
                "usuarios"
            ),

            where(
                "authUid",
                "==",
                usuarioSesion.uid
            ),

            limit(1)

        );


        const resultado =
        await getDocs(
            consulta
        );


        if(
            !resultado.empty
        ){

            const documento =
            resultado.docs[0];

            return {

                id:
                documento.id,

                ...documento.data()

            };

        }

    }
    catch(error){

        console.warn(
            "No se pudo buscar usuario por authUid:",
            error
        );

    }


    return null;

}


/* =========================================
   CARGAR PERFIL
========================================= */

async function cargarPerfil(){

    if(!usuarioSesion){

        throw new Error(
            "No hay una sesión activa."
        );

    }


    const usuario =
    await buscarUsuario();


    if(!usuario){

        throw new Error(
            "No encontramos el usuario en la colección usuarios."
        );

    }


    perfilActual =
    usuario;

    perfilId =
    usuario.id;


    /*
     * ======================================
     * DETECTAR EMPRESA
     * ======================================
     *
     * Las empresas GESBASE tienen:
     *
     * cuit
     * nombreEmpresa
     * razonSocial
     * logoUrl
     *
     * y pueden no tener empresaId.
     *
     * En ese caso su propio UID
     * será el ID raíz de la empresa.
     */

    const esEmpresa =

        Boolean(
            texto(
                usuario.nombreEmpresa
            ).trim()
        ) ||

        Boolean(
            texto(
                usuario.razonSocial
            ).trim()
        ) ||

        Boolean(
            texto(
                usuario.cuit
            ).trim()
        ) ||

        (
            texto(
                usuario.tipo
            ).toLowerCase()
            ===
            "empresa"
        ) ||

        (
            texto(
                usuario.rol
            ).toLowerCase()
            ===
            "empresa"
        );


    if(esEmpresa){

        tipoPerfil =
        "Empresa";


        empresaId =
        texto(
            usuario.empresaId
        ).trim();


        /*
         * LA EMPRESA ES SU PROPIO
         * IDENTIFICADOR SI NO TIENE
         * empresaId.
         */

        if(!empresaId){

            empresaId =
            texto(
                usuario.uid
            ).trim();

        }


        /*
         * Si por alguna razón tampoco
         * existe uid en el documento,
         * usamos el UID de Firebase.
         */

        if(!empresaId){

            empresaId =
            usuarioSesion.uid;

        }

    }
    else{

        tipoPerfil =
        texto(
            usuario.rol
        ) ||

        texto(
            usuario.tipo
        ) ||

        "Usuario";


        empresaId =
        texto(
            usuario.empresaId
        ).trim();

    }


    /*
     * ======================================
     * MOSTRAR INFORMACIÓN
     * ======================================
     */

    let nombre;


    if(esEmpresa){

        nombre =

        texto(
            usuario.nombreEmpresa
        ).trim() ||

        texto(
            usuario.razonSocial
        ).trim() ||

        nombreCompleto(
            usuario
        ) ||

        "Empresa";

    }
    else{

        nombre =

        nombreCompleto(
            usuario
        ) ||

        texto(
            usuario.nombre
        ) ||

        "Usuario";

    }


    const email =

    texto(
        usuario.email
    ) ||

    texto(
        usuarioSesion.email
    );


    const identificacion =

    texto(
        usuario.cuit
    );


    usuarioActual.innerHTML = `

        <strong>
        ${escaparHTML(nombre)}
        </strong>

        <br>

        Tipo:
        ${escaparHTML(
            tipoPerfil
        )}

        ${
            identificacion
            ?
            `
            <br>
            CUIT:
            ${escaparHTML(
                identificacion
            )}
            `
            :
            ""
        }

        <br>

        Correo:
        ${escaparHTML(email)}

        <br>

        Empresa ID:
        ${escaparHTML(
            empresaId
        )}

    `;


    if(!empresaId){

        throw new Error(
            "No se pudo determinar el identificador de la empresa."
        );

    }


    console.log(
        "GESBASE - PERFIL:",
        perfilActual
    );


    console.log(
        "GESBASE - TIPO:",
        tipoPerfil
    );


    console.log(
        "GESBASE - EMPRESA ID:",
        empresaId
    );

}


/* =========================================
   AGREGAR DESTINATARIO
========================================= */

function agregarDestinatario(datos){

    if(!datos){

        return;

    }


    const id =
    texto(
        datos.id
    ).trim();


    if(!id){

        return;

    }


    /*
     * No mostrar la propia empresa
     */

    if(
        id === perfilId
    ){

        return;

    }


    if(
        datos.uid &&
        texto(datos.uid) ===
        usuarioSesion.uid
    ){

        return;

    }


    if(
        datos.authUid &&
        texto(datos.authUid) ===
        usuarioSesion.uid
    ){

        return;

    }


    /*
     * Evitar duplicados
     */

    const existe =
    destinatarios.some(
        persona =>

        persona.id === id ||

        (
            persona.uid &&
            datos.uid &&
            persona.uid === datos.uid
        ) ||

        (
            persona.authUid &&
            datos.authUid &&
            persona.authUid ===
            datos.authUid
        )

    );


    if(existe){

        return;

    }


    const nombre =

    nombreCompleto(
        datos
    ) ||

    texto(
        datos.nombre
    ) ||

    texto(
        datos.nombreEmpresa
    ) ||

    texto(
        datos.razonSocial
    ) ||

    texto(
        datos.email
    ) ||

    "Usuario";


    destinatarios.push({

        id:
        id,

        uid:
        texto(
            datos.uid
        ),

        authUid:
        texto(
            datos.authUid
        ),

        nombre:
        nombre,

        email:
        texto(
            datos.email
        ),

        tipo:
        texto(
            datos.tipo
        ) ||

        texto(
            datos.rol
        ) ||

        texto(
            datos.puesto
        ) ||

        "Usuario"

    });

}


/* =========================================
   EMPLEADOS DE LA EMPRESA
========================================= */

async function cargarEmpleadosDestinatarios(){

    try{

        const consulta =
        query(

            collection(
                db,
                "empleados"
            ),

            where(
                "empresaId",
                "==",
                empresaId
            )

        );


        const resultados =
        await getDocs(
            consulta
        );


        resultados.forEach(
            documento => {

                const datos =
                documento.data();


                agregarDestinatario({

                    id:
                    documento.id,

                    ...datos,

                    tipo:
                    "Empleado"

                });

            }
        );

    }
    catch(error){

        console.warn(
            "No se pudieron cargar empleados:",
            error
        );

    }

}


/* =========================================
   USUARIOS DE LA EMPRESA
========================================= */

async function cargarUsuariosDestinatarios(){

    try{

        const consulta =
        query(

            collection(
                db,
                "usuarios"
            ),

            where(
                "empresaId",
                "==",
                empresaId
            )

        );


        const resultados =
        await getDocs(
            consulta
        );


        resultados.forEach(
            documento => {

                const datos =
                documento.data();


                /*
                 * No mostrar cuentas de empresa
                 * que sean la misma cuenta actual.
                 */

                let tipo =
                "Usuario";


                const rol =
                texto(
                    datos.rol
                ).toLowerCase();


                if(
                    rol.includes("admin") ||
                    rol.includes("administr")
                ){

                    tipo =
                    "Administración";

                }


                if(
                    rol.includes("empresa")
                ){

                    tipo =
                    "Empresa";

                }


                agregarDestinatario({

                    id:
                    documento.id,

                    ...datos,

                    tipo:
                    tipo

                });

            }
        );

    }
    catch(error){

        console.warn(
            "No se pudieron cargar usuarios:",
            error
        );

    }

}

/* =========================================
   CARGAR DESTINATARIOS
========================================= */

async function cargarDestinatarios(){

    destinatarios = [];


    if(!empresaId){

        destinatario.innerHTML = `

            <option value="">
            Empresa no identificada
            </option>

        `;

        btnEnviar.disabled =
        true;

        return;

    }


    destinatario.innerHTML = `

        <option value="">
        Cargando destinatarios...
        </option>

    `;


    /*
     * Cargar empleados
     */

    await cargarEmpleadosDestinatarios();


    /*
     * Cargar usuarios
     */

    await cargarUsuariosDestinatarios();


    /*
     * Cargar administradores
     */

    await cargarAdministracion();


    /*
     * Preparar selector
     */

    destinatario.innerHTML = `

        <option value="">
        Seleccionar destinatario...
        </option>

    `;


    if(
        destinatarios.length === 0
    ){

        destinatario.innerHTML = `

            <option value="">
            No hay destinatarios vinculados a esta empresa
            </option>

        `;

        btnEnviar.disabled =
        true;

        return;

    }


    /*
     * Orden alfabético
     */

    destinatarios.sort(
        function(a,b){

            return a.nombre.localeCompare(
                b.nombre,
                "es",
                {
                    sensitivity:"base"
                }
            );

        }
    );


    /*
     * Crear opciones
     */

    destinatarios.forEach(
        persona => {

            const option =
            document.createElement(
                "option"
            );


            option.value =
            persona.id;


            option.textContent =

            persona.nombre +

            " — " +

            persona.tipo;


            destinatario.appendChild(
                option
            );

        }
    );


    btnEnviar.disabled =
    false;


    console.log(
        "Destinatarios cargados:",
        destinatarios
    );

}


/* =========================================
   OBTENER DESTINATARIO
========================================= */

function obtenerDestinatario(){

    const id =
    destinatario.value;


    return destinatarios.find(

        persona =>

        persona.id === id

    );

}

/* =========================================
   CARGAR RECIBIDOS
========================================= */

async function cargarRecibidos(){

    recibidos.innerHTML = `

        <div class="cargando">
        Cargando mensajes...
        </div>

    `;


    try{

        const correos = [];


        /*
         * Por destinatarioUid
         */

        const consultaUid =
        query(

            collection(
                db,
                "correos"
            ),

            where(
                "destinatarioUid",
                "==",
                usuarioSesion.uid
            ),

            limit(50)

        );


        const resultadosUid =
        await getDocs(
            consultaUid
        );


        resultadosUid.forEach(
            documento => {

                correos.push({

                    id:
                    documento.id,

                    ...documento.data()

                });

            }
        );


        /*
         * Compatibilidad con correos
         * dirigidos al email.
         */

        const emailActual =

        texto(
            perfilActual.email
        ) ||

        texto(
            usuarioSesion.email
        );


        if(emailActual){

            try{

                const consultaEmail =
                query(

                    collection(
                        db,
                        "correos"
                    ),

                    where(
                        "para",
                        "==",
                        emailActual
                    ),

                    limit(50)

                );


                const resultadosEmail =
                await getDocs(
                    consultaEmail
                );


                resultadosEmail.forEach(
                    documento => {

                        const existe =
                        correos.some(
                            correo =>
                            correo.id ===
                            documento.id
                        );


                        if(!existe){

                            correos.push({

                                id:
                                documento.id,

                                ...documento.data()

                            });

                        }

                    }
                );

            }
            catch(error){

                console.warn(
                    "No se pudieron cargar correos por email:",
                    error
                );

            }

        }


        correosRecibidos =
        correos;


        correosRecibidos.sort(
            function(a,b){

                return obtenerTiempo(b) -
                obtenerTiempo(a);

            }
        );


        mostrarRecibidos();

    }
    catch(error){

        console.error(
            "ERROR RECIBIDOS:",
            error
        );


        recibidos.innerHTML = `

            <div class="sin-registros">

            No se pudieron cargar los mensajes.

            <br><br>

            ${escaparHTML(
                error.message
            )}

            </div>

        `;

    }

}

            );

}


/* =========================================
   OBTENER TIEMPO
========================================= */

function obtenerTiempo(correo){

    if(
        correo.creado &&
        typeof correo.creado.toMillis ===
        "function"
    ){

        return correo.creado.toMillis();

    }


    const fecha =
    texto(
        correo.fecha
    );


    const hora =
    texto(
        correo.hora
    );


    const valor =
    new Date(
        `${fecha}T${hora || "00:00:00"}`
    ).getTime();


    if(
        !isNaN(valor)
    ){

        return valor;

    }


    return 0;

}
