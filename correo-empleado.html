/* =========================================

========================================= */

function texto(valor){

    if(
        valor === undefined ||
        valor === null
    ){

        return "";

    }

    return String(valor);

}


function escaparHTML(valor){

    return texto(valor)
        .replace(/&/g,"&amp;")
        .replace(/</g,"&lt;")
        .replace(/>/g,"&gt;")
        .replace(/"/g,"&quot;")
        .replace(/'/g,"&#039;");

}


function nombreCompleto(datos){

    return (
        texto(datos.nombre) +
        " " +
        texto(datos.apellido)
    ).trim();

}


function mostrarError(textoError){

function mostrarExito(textoExito){

    mensajeExito.style.display =

function fechaActual(){

/* =========================================
   BUSCAR USUARIO
========================================= */

async function buscarUsuario(){

    try{

        const referencia =
        doc(
            db,
            "usuarios",
            usuarioSesion.uid
        );

        const resultado =
        await getDoc(
            referencia
        );

        if(resultado.exists()){

            return {
                id:resultado.id,
                ...resultado.data()
            };

        }

    }
    catch(error){

        console.warn(
            "No se pudo buscar usuario por ID:",
            error
        );

    }


    try{

        const consulta =
        query(
            collection(db,"usuarios"),
            where(
                "uid",
                "==",
                usuarioSesion.uid
            ),
            limit(1)
        );

        const resultado =
        await getDocs(consulta);

        if(!resultado.empty){

            const documento =
            resultado.docs[0];

            return {
                id:documento.id,
                ...documento.data()
            };

        }

    }
    catch(error){

        console.warn(
            "No se pudo buscar usuario por uid:",
            error
        );

    }


    try{

        const consulta =
        query(
            collection(db,"usuarios"),
            where(
                "authUid",
                "==",
                usuarioSesion.uid
            ),
            limit(1)
        );

        const resultado =
        await getDocs(consulta);

        if(!resultado.empty){

            const documento =
            resultado.docs[0];

            return {
                id:documento.id,
                ...documento.data()
            };

        }

    }
    catch(error){

        console.warn(
            "No se pudo buscar usuario por authUid:",
            error
        );

    }


    return null;

}


/* =========================================
   CARGAR PERFIL
========================================= */

async function cargarPerfil(){

    if(!usuarioSesion){

        throw new Error(
            "No hay una sesión activa."
        );

    }

    const usuario =
    await buscarUsuario();

    if(!usuario){

        throw new Error(
            "No encontramos el usuario en la colección usuarios."
        );

    }

    perfilActual =
    usuario;

    perfilId =
    usuario.id;


    const esEmpresa =

        Boolean(
            texto(
                usuario.nombreEmpresa
            ).trim()
        ) ||

        Boolean(
            texto(
                usuario.razonSocial
            ).trim()
        ) ||

        Boolean(
            texto(
                usuario.cuit
            ).trim()
        ) ||

        texto(usuario.tipo)
        .toLowerCase() === "empresa" ||

        texto(usuario.rol)
        .toLowerCase() === "empresa";


    if(esEmpresa){

        tipoPerfil =
        "Empresa";

        empresaId =
        texto(
            usuario.empresaId
        ).trim();

        if(!empresaId){

            empresaId =
            texto(usuario.uid).trim();

        }

        if(!empresaId){

            empresaId =
            usuarioSesion.uid;

        }

    }
    else{

        tipoPerfil =
        texto(usuario.rol) ||
        texto(usuario.tipo) ||
        "Usuario";

        empresaId =
        texto(
            usuario.empresaId
        ).trim();

    }


    let nombre;

    if(esEmpresa){

        nombre =

        texto(
            usuario.nombreEmpresa
        ).trim() ||

        texto(
            usuario.razonSocial
        ).trim() ||

        nombreCompleto(usuario) ||

        "Empresa";

    }
    else{

        nombre =
        nombreCompleto(usuario) ||
        texto(usuario.nombre) ||
        "Usuario";

    }


    const email =
    texto(usuario.email) ||
    texto(usuarioSesion.email);


    const identificacion =
    texto(usuario.cuit);


    usuarioActual.innerHTML = `

        <strong>
        ${escaparHTML(nombre)}
        </strong>

        <br>

        Tipo:
        ${escaparHTML(tipoPerfil)}

        ${
            identificacion
            ?
            `
            <br>
            CUIT:
            ${escaparHTML(identificacion)}
            `
            :
            ""
        }

        <br>

        Correo:
        ${escaparHTML(email)}

        <br>

        Empresa ID:
        ${escaparHTML(empresaId)}

    `;


    if(!empresaId){

        throw new Error(
            "No se pudo determinar el identificador de la empresa."
        );

    }

}


/* =========================================
   DESTINATARIOS
========================================= */

function agregarDestinatario(datos){

    if(!datos){

        return;

    }

    const id =
    texto(datos.id).trim();

    if(!id){

        return;

    }

    if(id === perfilId){

        return;

    }

    if(
        datos.uid &&
        texto(datos.uid) ===
        usuarioSesion.uid
    ){

        return;

    }

    if(
        datos.authUid &&
        texto(datos.authUid) ===
        usuarioSesion.uid
    ){

        return;

    }

    const existe =
    destinatarios.some(
        persona =>
        persona.id === id ||
        (
            persona.uid &&
            datos.uid &&
            persona.uid === datos.uid
        ) ||
        (
            persona.authUid &&
            datos.authUid &&
            persona.authUid === datos.authUid
        )
    );

    if(existe){

        return;

    }

    const nombre =

    nombreCompleto(datos) ||

    texto(datos.nombre) ||

    texto(datos.nombreEmpresa) ||

    texto(datos.razonSocial) ||

    texto(datos.email) ||

    "Usuario";


    destinatarios.push({

        id:id,

        uid:texto(datos.uid),

        authUid:texto(datos.authUid),

        nombre:nombre,

        email:texto(datos.email),

        tipo:
        texto(datos.tipo) ||
        texto(datos.rol) ||
        texto(datos.puesto) ||
        "Usuario"

    });

}


async function cargarEmpleadosDestinatarios(){

    try{

        const consulta =
        query(
            collection(db,"empleados"),
            where(
                "empresaId",
                "==",
                empresaId
            )
        );

        const resultados =
        await getDocs(consulta);

        resultados.forEach(
            documento => {

                const datos =
                documento.data();

                agregarDestinatario({

                    id:documento.id,

                    ...datos,

                    tipo:"Empleado"

                });

            }
        );

    }
    catch(error){

        console.warn(
            "No se pudieron cargar empleados:",
            error
        );

    }

}

/* =========================================
   GRABAR AUDIO
========================================= */

btnGrabar.addEventListener(
    "click",
    async function(){

        limpiarMensajes();


        if(
            !navigator.mediaDevices ||
            !navigator.mediaDevices.getUserMedia
        ){

            mostrarError(
                "Tu dispositivo o navegador no permite grabar audio."
            );

            return;

        }


        try{

            const stream =
            await navigator.mediaDevices.getUserMedia({
                audio:true
            });


            audioChunks = [];

            audioBlob = null;


            mediaRecorder =
            new MediaRecorder(stream);


            mediaRecorder.addEventListener(
                "dataavailable",
                function(event){

                    if(event.data.size > 0){

                        audioChunks.push(
                            event.data
                        );

                    }

                }
            );


            mediaRecorder.addEventListener(
                "stop",
                function(){

                    audioBlob =
                    new Blob(
                        audioChunks,
                        {
                            type:
                            mediaRecorder.mimeType ||
                            "audio/webm"
                        }
                    );


                    if(audioURL){

                        URL.revokeObjectURL(
                            audioURL
                        );

                    }


                    audioURL =
                    URL.createObjectURL(
                        audioBlob
                    );


                    audioPreview.src =
                    audioURL;

                    audioPreview.style.display =
                    "block";


                    estadoGrabacion.style.display =
                    "none";

                    btnGrabar.disabled =
                    false;

                    btnDetener.disabled =
                    true;


                    stream.getTracks()
                    .forEach(
                        track =>
                        track.stop()
                    );

                }
            );


            mediaRecorder.start();


            estadoGrabacion.style.display =
            "block";

            btnGrabar.disabled =
            true;

            btnDetener.disabled =
            false;

        }
        catch(error){

            console.error(
                "ERROR AUDIO:",
                error
            );

            mostrarError(
                "No se pudo acceder al micrófono. Permití el acceso al micrófono e intentá nuevamente."
            );

        }

    }
);

);


/* =========================================
   SUBIR ARCHIVO
========================================= */

async function subirArchivo(file){

    if(!file){

        return null;

    }


    const nombreSeguro =
    file.name.replace(
        /[^a-zA-Z0-9._-]/g,
        "_"
    );


    const ruta =

    "correos/" +
    empresaId +
    "/" +
    usuarioSesion.uid +
    "/" +
    Date.now() +
    "_" +
    nombreSeguro;


    const referencia =
    ref(
        storage,
        ruta
    );


    await uploadBytes(
        referencia,
        file
    );


    const url =
    await getDownloadURL(
        referencia
    );


    return {

        tipo:"archivo",

        nombre:
        file.name,

        mimeType:
        file.type,

        tamanio:
        file.size,

        url:url,

        ruta:ruta

    };

}


/* =========================================
   SUBIR AUDIO
========================================= */

async function subirAudio(){

    if(!audioBlob){

        return null;

    }


    const extension =
    audioBlob.type.includes("ogg")
    ? "ogg"
    : "webm";


    const nombre =
    "audio_" +
    Date.now() +
    "." +
    extension;


    const ruta =

    "correos/" +
    empresaId +
    "/" +
    usuarioSesion.uid +
    "/" +
    nombre;


    const referencia =
    ref(
        storage,
        ruta
    );


    await uploadBytes(
        referencia,
        audioBlob,
        {
            contentType:
            audioBlob.type
        }
    );


    const url =
    await getDownloadURL(
        referencia
    );


    return {

        tipo:"audio",

        nombre:nombre,

        mimeType:
        audioBlob.type,

        tamanio:
        audioBlob.size,

        url:url,

        ruta:ruta

    };

}

    ){

    }


    let html = `

    correo.adjuntos.forEach(

            ){

                html += `

                    <div style="margin-top:12px;">

                        <strong>
                        🎙️ Audio
                        </strong>

                        <audio
                            controls
                            src="${escaparHTML(
                                adjunto.url
                            )}"
                        ></audio>

                    </div>

                `;

            }
            else{

                html += `

                    <div style="margin-top:12px;">

                        <strong>

                        </strong>

    );

async function cargarRecibidos(){

    recibidos.innerHTML = `

        <div class="cargando">
        Cargando mensajes...
        </div>

    `;


    try{

        const correos = [];


        const consultaUid =
        query(

            collection(db,"correos"),

            where(
                "destinatarioUid",
                "==",
                usuarioSesion.uid
            ),

            limit(50)

        );


        const resultadosUid =
        await getDocs(
            consultaUid
        );


        resultadosUid.forEach(
            documento => {

                correos.push({

                    id:
                    documento.id,

                    ...documento.data()

                });

            }
        );


        const emailActual =

        texto(
            perfilActual.email
        ) ||

        texto(
            usuarioSesion.email
        );


        if(emailActual){

            try{

                const consultaEmail =
                query(

                    collection(db,"correos"),

                    where(
                        "para",
                        "==",
                        emailActual
                    ),

                    limit(50)

                );


                const resultadosEmail =
                await getDocs(
                    consultaEmail
                );


                resultadosEmail.forEach(
                    documento => {

                        const existe =
                        correos.some(
                            correo =>
                            correo.id ===
                            documento.id
                        );


                        if(!existe){

                            correos.push({

                                id:
                                documento.id,

                                ...documento.data()

                            });

                        }

                    }
                );

            }
            catch(error){

                console.warn(
                    "No se pudieron cargar correos por email:",
                    error
                );

            }

        }


        correosRecibidos =
        correos;


        correosRecibidos.sort(
            function(a,b){

                return obtenerTiempo(b) -
                obtenerTiempo(a);

            }
        );


        mostrarRecibidos();

    }
    catch(error){

        console.error(
            "ERROR RECIBIDOS:",
            error
        );


        recibidos.innerHTML = `

            <div class="sin-registros">

            No se pudieron cargar los mensajes.

            <br><br>

            ${escaparHTML(
                error.message
            )}

            </div>

        `;

    }

}

            true;


            mostrarRecibidos();

        }
        catch(error){

            );

    }

}


/* =========================================
   OBTENER TIEMPO
========================================= */

function obtenerTiempo(correo){

    if(
        correo.creado &&
        typeof correo.creado.toMillis ===
        "function"
    ){

        return correo.creado.toMillis();

    }


    const fecha =
    texto(correo.fecha);

    const hora =
    texto(correo.hora);


    const valor =
    new Date(
        `${fecha}T${hora || "00:00:00"}`
    ).getTime();


    if(!isNaN(valor)){

        return valor;

    }


    return 0;

}
