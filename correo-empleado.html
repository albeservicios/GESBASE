/* =========================================
   UTILIDADES
========================================= */

function texto(valor){

    if(
        valor === undefined ||
        valor === null
    ){

        return "";

    }

    return String(valor);

}


function escaparHTML(valor){

    return texto(valor)
    .replace(/&/g,"&amp;")
    .replace(/</g,"&lt;")
    .replace(/>/g,"&gt;")
    .replace(/"/g,"&quot;")
    .replace(/'/g,"&#039;");

}


function nombreCompleto(datos){

    const nombre =
    texto(datos?.nombre);

    const apellido =
    texto(datos?.apellido);

    return (
        nombre +
        " " +
        apellido
    ).trim();

}

    mensajeError.style.display =

function mostrarExito(mensaje){

    mensajeExito.style.display =

/* =========================================
   BUSCAR PERFIL
========================================= */

async function buscarPerfil(){

    if(!usuarioSesion){

        throw new Error(
            "No hay una sesión activa."
        );

    }


    /*
     * 1. BUSCAR EN EMPLEADOS
     */

    try{

        const consulta =
        query(
            collection(
                db,
                "empleados"
            ),
            where(
                "authUid",
                "==",
                usuarioSesion.uid
            ),
            limit(1)
        );


        const resultado =
        await getDocs(
            consulta
        );


        if(
            !resultado.empty
        ){

            const documento =
            resultado.docs[0];


            perfilActual = {

                id:
                documento.id,

                coleccion:
                "empleados",

                ...documento.data()

            };


            empleadoId =
            documento.id;


            empresaId =
            texto(
                perfilActual.empresaId
            ).trim();


            return;

        }

    }
    catch(error){

        console.warn(
            "No se pudo consultar empleados:",
            error
        );

    }


    /*
     * 2. BUSCAR EN USUARIOS
     */

    try{

        const consulta =
        query(
            collection(
                db,
                "usuarios"
            ),
            where(
                "authUid",
                "==",
                usuarioSesion.uid
            ),
            limit(1)
        );


        const resultado =
        await getDocs(
            consulta
        );


        if(
            !resultado.empty
        ){

            const documento =
            resultado.docs[0];


            perfilActual = {

                id:
                documento.id,

                coleccion:
                "usuarios",

                ...documento.data()

            };


            empleadoId =
            documento.id;


            empresaId =
            texto(
                perfilActual.empresaId
            ).trim();


            return;

        }

    }
    catch(error){

        console.warn(
            "No se pudo consultar usuarios:",
            error
        );

    }


    /*
     * 3. BUSCAR EN ADMINISTRADORES
     */

    try{

        const consulta =
        query(
            collection(
                db,
                "administradores"
            ),
            where(
                "authUid",
                "==",
                usuarioSesion.uid
            ),
            limit(1)
        );


        const resultado =
        await getDocs(
            consulta
        );


        if(
            !resultado.empty
        ){

            const documento =
            resultado.docs[0];


            perfilActual = {

                id:
                documento.id,

                coleccion:
                "administradores",

                ...documento.data()

            };


            empleadoId =
            documento.id;


            empresaId =
            texto(
                perfilActual.empresaId
            ).trim();


            return;

        }

    }
    catch(error){

        console.warn(
            "No se pudo consultar administradores:",
            error
        );

    }


    /*
     * 4. SI NO HAY PERFIL
     *
     * Usamos los datos de Authentication.
     */

    perfilActual = {

        id:
        usuarioSesion.uid,

        authUid:
        usuarioSesion.uid,

        nombre:
        usuarioSesion.displayName ||
        "Usuario",

        apellido:
        "",

        email:
        usuarioSesion.email ||
        "",

        empresaId:
        ""

    };


    /*
     * Sin empresa no podemos determinar
     * destinatarios de la empresa.
     */

    empresaId = "";

}


/* =========================================

function mostrarUsuario(){

/* =========================================
   CARGAR DESTINATARIOS
========================================= */

async function cargarDestinatarios(){

    destinatarios = [];


    /*
     * EVITAR DUPLICADOS
     */

    const idsAgregados =
    new Set();


    /*
     * =====================================
     * EMPLEADOS
     * =====================================
     */

    if(empresaId){

        try{

            const consulta =
            query(
                collection(
                    db,
                    "empleados"
                ),
                where(
                    "empresaId",
                    "==",
                    empresaId
                )
            );


            const resultados =
            await getDocs(
                consulta
            );


            resultados.forEach(
                documento => {

                    const datos =
                    documento.data();


                    if(
                        documento.id ===
                        empleadoId
                    ){

                        return;

                    }


                    const nombre =
                    nombreCompleto(
                        datos
                    ) ||
                    "Empleado";


                    const clave =
                    "empleado-" +
                    documento.id;


                    if(
                        idsAgregados.has(
                            clave
                        )
                    ){

                        return;

                    }


                    idsAgregados.add(
                        clave
                    );


                    destinatarios.push({

                        id:
                        documento.id,

                        authUid:
                        texto(
                            datos.authUid
                        ),

                        nombre:
                        nombre,

                        email:
                        texto(
                            datos.email
                        ),

                        tipo:
                        "Empleado"

                    });

                }
            );

        }
        catch(error){

            console.warn(
                "Error cargando empleados:",
                error
            );

        }

    }


    /*
     * =====================================
     * ADMINISTRADORES
     * =====================================
     */

    if(empresaId){

        try{

            const consulta =
            query(
                collection(
                    db,
                    "administradores"
                ),
                where(
                    "empresaId",
                    "==",
                    empresaId
                )
            );


            const resultados =
            await getDocs(
                consulta
            );


            resultados.forEach(
                documento => {

                    const datos =
                    documento.data();


                    const nombre =
                    nombreCompleto(
                        datos
                    ) ||
                    texto(
                        datos.nombre
                    ) ||
                    "Administración";


                    const clave =
                    "admin-" +
                    documento.id;


                    if(
                        idsAgregados.has(
                            clave
                        )
                    ){

                        return;

                    }


                    idsAgregados.add(
                        clave
                    );


                    destinatarios.push({

                        id:
                        documento.id,

                        authUid:
                        texto(
                            datos.authUid
                        ),

                        nombre:
                        nombre,

                        email:
                        texto(
                            datos.email
                        ),

                        tipo:
                        "Administración"

                    });

                }
            );

        }
        catch(error){

            console.warn(
                "Error cargando administración:",
                error
            );

        }

    }


    /*
     * =====================================
     * USUARIOS
     * =====================================
     *
     * Esto permite encontrar usuarios
     * administrativos que estén guardados
     * en la colección usuarios.
     */

    if(empresaId){

        try{

            const consulta =
            query(
                collection(
                    db,
                    "usuarios"
                ),
                where(
                    "empresaId",
                    "==",
                    empresaId
                )
            );


            const resultados =
            await getDocs(
                consulta
            );


            resultados.forEach(
                documento => {

                    const datos =
                    documento.data();


                    if(
                        texto(
                            datos.authUid
                        ) ===
                        usuarioSesion.uid
                    ){

                        return;

                    }


                    const nombre =
                    nombreCompleto(
                        datos
                    ) ||
                    texto(
                        datos.nombre
                    ) ||
                    "Usuario";


                    const clave =
                    "usuario-" +
                    documento.id;


                    if(
                        idsAgregados.has(
                            clave
                        )
                    ){

                        return;

                    }


                    idsAgregados.add(
                        clave
                    );


                    destinatarios.push({

                        id:
                        documento.id,

                        authUid:
                        texto(
                            datos.authUid
                        ),

                        nombre:
                        nombre,

                        email:
                        texto(
                            datos.email
                        ),

                        tipo:
                        "Administración"

                    });

                }
            );

        }
        catch(error){

            console.warn(
                "Error cargando usuarios:",
                error
            );

        }

    }


    /*
     * =====================================
     * ARMAR SELECT
     * =====================================
     */

    destinatario.innerHTML = "";


    if(
        destinatarios.length === 0
    ){

        destinatario.innerHTML = `

        <option value="">
        No hay destinatarios disponibles
        </option>

        `;

        btnEnviar.disabled =
        true;

        return;

    }


    destinatario.innerHTML = `

    <option value="">
    Seleccionar destinatario...
    </option>

    `;


    destinatarios.forEach(
        persona => {

            const option =
            document.createElement(
                "option"
            );


            option.value =
            persona.id +
            "|" +
            persona.tipo;


            option.textContent =
            persona.nombre +
            " — " +
            persona.tipo;


            destinatario.appendChild(
                option
            );

        }
    );


    btnEnviar.disabled =
    false;

}


/* =========================================
   OBTENER DESTINATARIO
========================================= */

function obtenerDestinatario(){

    const valor =
    destinatario.value;


    if(!valor){

        return null;

    }


    const partes =
    valor.split("|");


    const id =
    partes[0];


    const tipo =
    partes[1];


    return destinatarios.find(
        persona =>
            persona.id === id &&
            persona.tipo === tipo
    ) || null;

}

archivo.addEventListener(

            "No hay archivo seleccionado.";

            return;

        }

        (
            archivoActual.size /
            1024 /

        archivoActual.name +

/* =========================================
   SUBIR ARCHIVO
========================================= */

async function subirArchivo(){

    if(!archivoActual){

        return null;

    }


    /*
     * Límite de seguridad: 25 MB
     */

    if(
        archivoActual.size >
        25 * 1024 * 1024
    ){

        throw new Error(
            "El archivo supera el límite de 25 MB."
        );

    }


    const nombreSeguro =
    archivoActual.name
    .replace(
        /[^a-zA-Z0-9._-]/g,
        "_"
    );


    const ruta =
    "correos/" +
    empresaId +
    "/" +
    usuarioSesion.uid +
    "/" +
    Date.now() +
    "_" +
    nombreSeguro;


    const referencia =
    ref(
        storage,
        ruta
    );


    await uploadBytes(
        referencia,
        archivoActual
    );


    const url =
    await getDownloadURL(
        referencia
    );


    let tipo =
    "archivo";


    if(
        archivoActual.type
        .startsWith("image/")
    ){

        tipo =
        "imagen";

    }
    else if(
        archivoActual.type
        .startsWith("audio/")
    ){

        tipo =
        "audio";

    }


    return {

        nombre:
        archivoActual.name,

        tipo:
        tipo,

        mime:
        archivoActual.type,

        url:
        url,

        ruta:
        ruta

    };

}

/* =========================================
   CARGAR RECIBIDOS
========================================= */

async function cargarRecibidos(){

    recibidos.innerHTML = `

    <div class="cargando">
    Cargando mensajes...
    </div>

    `;


    try{

        const consulta =
        query(
            collection(
                db,
                "correos"
            ),
            where(
                "destinatarioUid",
                "==",
                usuarioSesion.uid
            ),
            limit(100)
        );


        const resultados =
        await getDocs(
            consulta
        );


        correosRecibidos = [];


        resultados.forEach(
            documento => {

                correosRecibidos.push({

                    id:
                    documento.id,

                    ...documento.data()

                });

            }
        );


        correosRecibidos.sort(
            (a,b) => {

                const fechaA =
                texto(a.fecha) +
                " " +
                texto(a.hora);


                const fechaB =
                texto(b.fecha) +
                " " +
                texto(b.hora);


                return fechaB.localeCompare(
                    fechaA
                );

            }
        );


        mostrarRecibidos();

    }
    catch(error){

        console.error(
            "Error recibidos:",
            error
        );


        recibidos.innerHTML = `

        <div class="sin-registros">

        No se pudieron cargar los mensajes.

        <br><br>

        ${escaparHTML(error.message)}

        </div>

        `;

    }

}

/* =========================================
   MOSTRAR ADJUNTO
========================================= */

function htmlAdjunto(adjunto){

    if(!adjunto){

        return "";

    }


    const nombre =
    escaparHTML(
        adjunto.nombre ||
        "Archivo adjunto"
    );


    const url =
    escaparHTML(
        adjunto.url
    );


    if(
        adjunto.tipo ===
        "imagen"
    ){

        return `

        <div class="adjuntos">

            <strong>
            📷 Foto
            </strong>

            <br>

            <img
                src="${url}"
                class="preview-imagen"
                alt="${nombre}"
            >

            <a
                class="adjunto"
                href="${url}"
                target="_blank"
                rel="noopener"
            >
            📥 Abrir foto
            </a>

        </div>

        `;

    }


    if(
        adjunto.tipo ===
        "audio"
    ){

        return `

        <div class="adjuntos">

            <strong>
            🎵 Audio
            </strong>

            <audio
                class="preview-audio"
                controls
                src="${url}"
            ></audio>

            <a
                class="adjunto"
                href="${url}"
                target="_blank"
                rel="noopener"
            >
            📥 Abrir audio
            </a>

        </div>

        `;

    }


    return `

    <div class="adjuntos">

        <strong>
        📎 Archivo
        </strong>

        <a
            class="adjunto"
            href="${url}"
            target="_blank"
            rel="noopener"
        >

        📥 ${nombre}

        </a>

    </div>

    `;

}

    correo,
    esRecibido
){

    detalleCorreo.innerHTML = `

    <div class="detalle-linea">

        <strong>De:</strong>

        ${escaparHTML(
            correo.remitenteNombre
        )}

    </div>


    <div class="detalle-linea">

        <strong>Para:</strong>

        ${escaparHTML(
            correo.destinatarioNombre
        )}

    </div>


    <div class="detalle-linea">

        <strong>Asunto:</strong>

        ${escaparHTML(
            correo.asunto
        )}

    </div>


    <div class="detalle-linea">

        <strong>Fecha:</strong>

        ${escaparHTML(
            correo.fecha
        )}

        ${escaparHTML(
            correo.hora
        )}

    </div>


    <div class="separador"></div>


    <div class="detalle-mensaje">

        ${escaparHTML(
            correo.mensaje
        )}

    </div>


    ${htmlAdjunto(
        correo.adjunto
    )}

    `;


    tarjetaDetalle.classList.remove(
        "oculto"
    );


    tarjetaDetalle.scrollIntoView({
        behavior:"smooth"
    });


    /*
     * MARCAR LEÍDO
     */

    if(
        esRecibido &&
        !correo.leido
    ){

        try{

            await updateDoc(
                doc(
                    db,
                    "correos",
                    correo.id
                ),
                {
                    leido:true
                }
            );


            correo.leido =
            true;


            mostrarRecibidos();

        }
        catch(error){

            console.error(
                "Error marcando leído:",
                error
            );

        }

    }

}


/* =========================================

btnResponder.addEventListener(
    "click",
    function(){

        if(!correoAbierto){

            return;

        }


        const remitente =
        destinatarios.find(
            persona =>
            persona.authUid ===
            correoAbierto.remitenteUid
        );


        if(remitente){

            destinatario.value =
            remitente.id +
            "|" +
            remitente.tipo;

        }
        else{

            /*
             * Si no aparece en el listado,
             * agregamos temporalmente el remitente.
             */

            const existe =
            destinatarios.some(
                persona =>
                persona.authUid ===
                correoAbierto.remitenteUid
            );


            if(!existe){

                const temporal = {

                    id:
                    correoAbierto.remitenteId,

                    authUid:
                    correoAbierto.remitenteUid,

                    nombre:
                    correoAbierto.remitenteNombre,

                    email:
                    correoAbierto.remitenteEmail,

                    tipo:
                    "Empleado"

                };


                destinatarios.push(
                    temporal
                );


                const option =
                document.createElement(
                    "option"
                );


                option.value =
                temporal.id +
                "|" +
                temporal.tipo;


                option.textContent =
                temporal.nombre +
                " — " +
                temporal.tipo;


                destinatario.appendChild(
                    option
                );


                destinatario.value =
                option.value;

            }

        }


        asunto.value =
        correoAbierto.asunto
        ? "Re: " +
          correoAbierto.asunto
        : "Re:";


        mensaje.value =
        "\n\n--- Mensaje original ---\n" +
        texto(
            correoAbierto.mensaje
        );


        respuestaInfo.innerHTML = `

        ↩️ Respondiendo a:

        <strong>
        ${escaparHTML(
            correoAbierto.remitenteNombre

        </strong>

        btnCancelarRespuesta.classList.remove(
            "oculto"
        );


        window.scrollTo({
            top:0,

    }
);
