<style>

*{

    padding:0;
}

body{

}

.contenedor{

    padding:12px;
    margin-top:-5px;
    margin-bottom:15px;
    font-size:13px;
    color:#4b5563;
}

.correo-item{
    border:1px solid #e5e7eb;
    border-radius:12px;
    padding:15px;
    margin-bottom:10px;

    cursor:pointer;
}

.correo-item:hover{

}

.correo-item.no-leido{
    border-left:5px solid #2563eb;

}

.correo-cabecera{
    display:flex;

}

.correo-persona{

}

.correo-fecha{

}

.correo-asunto{
    font-weight:bold;

}

.correo-resumen{
    font-size:14px;

}

.estado-correo{
    display:inline-block;
    font-size:11px;
    font-weight:bold;

}

.estado-no-leido{

    color:#1d4ed8;
}

.sin-registros,

    text-align:center;
    padding:25px;

}

.oculto{
    display:none !important;
}

.detalle{
    background:#fff;

}

.detalle-linea{
    padding:8px 0;
    border-bottom:1px solid #e5e7eb;

}

.detalle-mensaje{
    white-space:pre-wrap;

    font-size:15px;
}

.separador{
    height:1px;
    background:#e5e7eb;
    margin:18px 0;
}

@media(max-width:600px){

    }

        padding:16px;
    }

    .correo-cabecera{
        flex-direction:column;
        gap:3px;
    }

}

<script type="module">

/* =========================================
   FIREBASE
========================================= */

import {
    auth,
    db
} from "./Js/firebase.js";

import {
    onAuthStateChanged,
    signOut
} from
"https://www.gstatic.com/firebasejs/12.1.0/firebase-auth.js";

import {
    collection,
    addDoc,
    getDocs,
    updateDoc,
    doc,
    query,
    where,
    limit,
    serverTimestamp
} from
"https://www.gstatic.com/firebasejs/12.1.0/firebase-firestore.js";


/* =========================================
   ELEMENTOS
========================================= */

const usuarioActual =
document.getElementById("usuarioActual");

const destinatario =
document.getElementById("destinatario");

const destinatarioInfo =
document.getElementById("destinatarioInfo");

const asunto =
document.getElementById("asunto");

const mensaje =
document.getElementById("mensaje");

const btnEnviar =
document.getElementById("btnEnviar");

const btnRecibidos =
document.getElementById("btnRecibidos");

const btnEnviados =
document.getElementById("btnEnviados");

const recibidos =
document.getElementById("recibidos");

const enviados =
document.getElementById("enviados");

const tarjetaDetalle =
document.getElementById("tarjetaDetalle");

const detalleCorreo =
document.getElementById("detalleCorreo");

const btnCerrarDetalle =
document.getElementById("btnCerrarDetalle");

const btnVolver =
document.getElementById("btnVolver");

const btnCerrarSesion =
document.getElementById("btnCerrarSesion");

const mensajeError =
document.getElementById("mensajeError");

const mensajeExito =
document.getElementById("mensajeExito");


/* =========================================
   VARIABLES
========================================= */

let usuarioSesion = null;

let empleadoActual = null;

let empleadoId = "";

let empresaId = "";

let administracion = null;

let correosRecibidos = [];

let correosEnviados = [];


/* =========================================
   UTILIDADES
========================================= */

function texto(valor){

    if(
        valor === undefined ||
        valor === null
    ){
        return "";
    }

    return String(valor);
}


function escaparHTML(valor){

    return texto(valor)
    .replace(/&/g,"&amp;")
    .replace(/</g,"&lt;")
    .replace(/>/g,"&gt;")
    .replace(/"/g,"&quot;")
    .replace(/'/g,"&#039;");

}


function nombreCompleto(datos){

    return (
        texto(datos.nombre) +
        " " +
        texto(datos.apellido)
    ).trim();

}


function mostrarError(textoError){

    mensajeError.textContent =
    textoError;

    mensajeError.style.display =
    "block";

    mensajeExito.style.display =
    "none";

}


function mostrarExito(textoExito){

    mensajeExito.textContent =
    textoExito;

    mensajeExito.style.display =
    "block";

    mensajeError.style.display =
    "none";

}


function limpiarMensajes(){

    mensajeError.style.display =
    "none";

    mensajeExito.style.display =
    "none";

}


function fechaActual(){

    const ahora =
    new Date();

    return (
        ahora.getFullYear() +
        "-" +
        String(
            ahora.getMonth()+1
        ).padStart(2,"0") +
        "-" +
        String(
            ahora.getDate()
        ).padStart(2,"0")
    );

}


function horaActual(){

    const ahora =
    new Date();

    return (
        String(
            ahora.getHours()
        ).padStart(2,"0") +
        ":" +
        String(
            ahora.getMinutes()
        ).padStart(2,"0")
    );

}


function fechaCorreo(correo){

    if(
        correo.creado &&
        typeof correo.creado.toDate ===
        "function"
    ){

        return correo.creado
        .toDate()
        .toLocaleString("es-AR");

    }

    return (
        texto(correo.fecha) +
        " " +
        texto(correo.hora)
    ).trim();

}


/* =========================================
   CARGAR EMPLEADO
========================================= */

async function cargarEmpleado(){

    if(!usuarioSesion){

        throw new Error(
            "No hay una sesión activa."
        );

    }


    const consulta =
    query(
        collection(
            db,
            "empleados"
        ),
        where(
            "authUid",
            "==",
            usuarioSesion.uid
        ),
        limit(1)
    );


    const resultados =
    await getDocs(
        consulta
    );


    if(resultados.empty){

        throw new Error(
            "No encontramos el empleado vinculado a esta cuenta."
        );

    }


    const documento =
    resultados.docs[0];


    empleadoId =
    documento.id;


    empleadoActual = {

        id:
        documento.id,

        ...documento.data()

    };


    empresaId =
    texto(
        empleadoActual.empresaId
    ).trim();


    if(!empresaId){

        throw new Error(
            "El empleado no tiene empresaId."
        );

    }


    const nombre =
    nombreCompleto(
        empleadoActual
    ) ||
    "Empleado";


    usuarioActual.innerHTML = `

        <strong>
        ${escaparHTML(nombre)}
        </strong>

        <br>

        Puesto:
        ${escaparHTML(
            texto(
                empleadoActual.puesto
            ) || "Empleado"
        )}

        <br>

        Empresa:
        ${escaparHTML(
            texto(
                empleadoActual.empresa
            ) ||
            texto(
                empleadoActual.empresaNombre
            ) ||
            "GESBASE"
        )}

        <br>

        Correo:
        ${escaparHTML(
            texto(
                empleadoActual.email
            ) ||
            texto(
                usuarioSesion.email
            )
        )}

    `;

}


/* =========================================
   CARGAR ADMINISTRACIÓN
========================================= */

async function cargarAdministracion(){

    administracion = null;

    destinatario.innerHTML = `
        <option value="">
        Buscando Administración...
        </option>
    `;

    destinatarioInfo.textContent =
    "Buscando Administración...";


    /*
     * IMPORTANTE:
     *
     * El registro que mostraste tiene:
     *
     * empresaId
     * email
     * nombreEmpresa
     * razonSocial
     * propietarioUid
     *
     * Por eso se busca en la colección
     * "empresas".
     */

    try{

        const consulta =
        query(
            collection(
                db,
                "empresas"
            ),
            where(
                "empresaId",
                "==",
                empresaId
            ),
            limit(1)
        );


        const resultados =
        await getDocs(
            consulta
        );


        if(
            resultados.empty
        ){

            throw new Error(
                "No se encontró la empresa."
            );

        }


        const documento =
        resultados.docs[0];


        const datos =
        documento.data();


        administracion = {

            id:
            documento.id,

            empresaId:
            texto(
                datos.empresaId
            ),

            email:
            texto(
                datos.email
            ),

            nombreEmpresa:
            texto(
                datos.nombreEmpresa
            ) ||
            texto(
                datos.razonSocial
            ) ||
            "Administración",

            propietarioUid:
            texto(
                datos.propietarioUid
            )

        };


        if(
            !administracion.email
        ){

            throw new Error(
                "La empresa no tiene correo electrónico."
            );

        }


        /*
         * MOSTRAR DESTINATARIO
         */

        destinatario.innerHTML = `

            <option value="administracion">
            🏢 Administración — ${
                escaparHTML(
                    administracion.nombreEmpresa
                )
            }
            </option>

        `;


        destinatarioInfo.innerHTML = `

            🏢 <strong>Administración</strong>
            <br>
            📧 ${escaparHTML(
                administracion.email
            )}

        `;


        btnEnviar.disabled =
        false;

    }
    catch(error){

        console.error(
            "ERROR CARGANDO ADMINISTRACIÓN:",
            error
        );


        destinatario.innerHTML = `

            <option value="">
            Administración no disponible
            </option>

        `;


        destinatarioInfo.textContent =
        "No se encontró la Administración vinculada a esta empresa.";


        btnEnviar.disabled =
        true;


        throw error;

    }

}


/* =========================================
   ENVIAR MENSAJE
========================================= */

btnEnviar.addEventListener(
    "click",
    async function(){

        limpiarMensajes();


        if(
            !administracion ||
            !administracion.email
        ){

            mostrarError(
                "No hay una Administración disponible como destinatario."
            );

            return;

        }


        const asuntoTexto =
        asunto.value.trim();


        const mensajeTexto =
        mensaje.value.trim();


        if(!asuntoTexto){

            mostrarError(
                "Escribí un asunto."
            );

            asunto.focus();

            return;

        }


        if(!mensajeTexto){

            mostrarError(
                "Escribí el mensaje."
            );

            mensaje.focus();

            return;

        }


        btnEnviar.disabled =
        true;

        btnEnviar.textContent =
        "📤 ENVIANDO...";


        try{

            const emailEmpleado =
            texto(
                empleadoActual.email
            ) ||
            texto(
                usuarioSesion.email
            );


            const nombreEmpleado =
            nombreCompleto(
                empleadoActual
            ) ||
            "Empleado";


            /*
             * ESTRUCTURA DEL CORREO
             *
             * NO usamos el campo "de".
             *
             * Se mantiene la estructura
             * que ya tenés:
             *
             * para
             * usuarioId
             * empresaId
             * carpeta
             * estado
             * asunto
             * mensaje
             */

            await addDoc(
                collection(
                    db,
                    "correos"
                ),
                {

                    para:
                    administracion.email,

                    usuarioId:
                    usuarioSesion.uid,

                    empresaId:
                    empresaId,

                    carpeta:
                    "enviados",

                    estado:
                    "pendiente",

                    asunto:
                    asuntoTexto,

                    mensaje:
                    mensajeTexto,

                    creado:
                    serverTimestamp(),

                    enviado:
                    serverTimestamp(),

                    /*
                     * Estos campos permiten
                     * identificar al empleado
                     * sin usar "de".
                     */

                    remitenteUid:
                    usuarioSesion.uid,

                    remitenteId:
                    empleadoId,

                    remitenteNombre:
                    nombreEmpleado,

                    remitenteEmail:
                    emailEmpleado,

                    destinatarioEmail:
                    administracion.email,

                    destinatarioTipo:
                    "Administración",

                    leido:
                    false

                }
            );


            asunto.value =
            "";

            mensaje.value =
            "";


            mostrarExito(
                "Mensaje enviado correctamente a Administración."
            );


            await cargarEnviados();

        }
        catch(error){

            console.error(
                "ERROR ENVIANDO CORREO:",
                error
            );


            mostrarError(
                "No se pudo enviar el mensaje: " +
                error.message
            );

        }
        finally{

            btnEnviar.disabled =
            false;

            btnEnviar.textContent =
            "📤 ENVIAR MENSAJE";

        }

    }
);


/* =========================================
   CARGAR RECIBIDOS
========================================= */

async function cargarRecibidos(){

    recibidos.innerHTML = `

        <div class="cargando">
        Cargando mensajes...
        </div>

    `;


    try{

        const consulta =
        query(
            collection(
                db,
                "correos"
            ),
            where(
                "para",
                "==",
                texto(
                    empleadoActual.email
                ) ||
                texto(
                    usuarioSesion.email
                )
            ),
            limit(50)
        );


        const resultados =
        await getDocs(
            consulta
        );


        correosRecibidos = [];


        resultados.forEach(
            documento => {

                correosRecibidos.push({

                    id:
                    documento.id,

                    ...documento.data()

                });

            }
        );


        mostrarRecibidos();

    }
    catch(error){

        console.error(
            "ERROR RECIBIDOS:",
            error
        );


        recibidos.innerHTML = `

            <div class="sin-registros">
            No se pudieron cargar los mensajes recibidos.
            </div>

        `;

    }

}


/* =========================================
   MOSTRAR RECIBIDOS
========================================= */

function mostrarRecibidos(){

    if(
        correosRecibidos.length === 0
    ){

        recibidos.innerHTML = `

            <div class="sin-registros">
            No tenés mensajes recibidos.
            </div>

        `;

        return;

    }


    recibidos.innerHTML = "";


    correosRecibidos.forEach(
        correo => {

            const item =
            document.createElement(
                "div"
            );


            item.className =
            "correo-item";


            item.innerHTML = `

                <div class="correo-cabecera">

                    <div class="correo-persona">

                        📩 Administración

                    </div>

                    <div class="correo-fecha">

                        ${escaparHTML(
                            fechaCorreo(correo)
                        )}

                    </div>

                </div>


                <div class="correo-asunto">

                    ${escaparHTML(
                        correo.asunto
                    )}

                </div>


                <div class="correo-resumen">

                    ${escaparHTML(
                        texto(
                            correo.mensaje
                        ).substring(0,180)
                    )}

                </div>

            `;


            item.addEventListener(
                "click",
                function(){

                    abrirCorreo(
                        correo
                    );

                }
            );


            recibidos.appendChild(
                item
            );

        }
    );

}


/* =========================================
   CARGAR ENVIADOS
========================================= */

async function cargarEnviados(){

    enviados.innerHTML = `

        <div class="cargando">
        Cargando mensajes...
        </div>

    `;


    try{

        const consulta =
        query(
            collection(
                db,
                "correos"
            ),
            where(
                "usuarioId",
                "==",
                usuarioSesion.uid
            ),
            limit(50)
        );


        const resultados =
        await getDocs(
            consulta
        );


        correosEnviados = [];


        resultados.forEach(
            documento => {

                const datos =
                documento.data();


                if(
                    datos.carpeta ===
                    "enviados"
                ){

                    correosEnviados.push({

                        id:
                        documento.id,

                        ...datos

                    });

                }

            }
        );


        mostrarEnviados();

    }
    catch(error){

        console.error(
            "ERROR ENVIADOS:",
            error
        );


        enviados.innerHTML = `

            <div class="sin-registros">
            No se pudieron cargar los enviados.
            </div>

        `;

    }

}


/* =========================================
   MOSTRAR ENVIADOS
========================================= */

function mostrarEnviados(){

    if(
        correosEnviados.length === 0
    ){

        enviados.innerHTML = `

            <div class="sin-registros">
            No tenés mensajes enviados.
            </div>

        `;

        return;

    }


    enviados.innerHTML = "";


    correosEnviados.forEach(
        correo => {

            const item =
            document.createElement(
                "div"
            );


            item.className =
            "correo-item";


            item.innerHTML = `

                <div class="correo-cabecera">

                    <div class="correo-persona">

                        Para:
                        Administración

                    </div>

                    <div class="correo-fecha">

                        ${escaparHTML(
                            fechaCorreo(correo)
                        )}

                    </div>

                </div>


                <div class="correo-asunto">

                    ${escaparHTML(
                        correo.asunto
                    )}

                </div>


                <div class="correo-resumen">

                    ${escaparHTML(
                        texto(
                            correo.mensaje
                        ).substring(0,180)
                    )}

                </div>

                <span class="estado-correo">

                    ${escaparHTML(
                        correo.estado ||
                        "pendiente"
                    ).toUpperCase()}

                </span>

            `;


            item.addEventListener(
                "click",
                function(){

                    abrirCorreo(
                        correo
                    );

                }
            );


            enviados.appendChild(
                item
            );

        }
    );

}


/* =========================================
   ABRIR CORREO
========================================= */

function abrirCorreo(correo){

    detalleCorreo.innerHTML = `

        <div class="detalle-linea">

            <strong>Para:</strong>

            ${escaparHTML(
                correo.para ||
                "Administración"
            )}

        </div>


        <div class="detalle-linea">

            <strong>Asunto:</strong>

            ${escaparHTML(
                correo.asunto
            )}

        </div>


        <div class="detalle-linea">

            <strong>Fecha:</strong>

            ${escaparHTML(
                fechaCorreo(correo)
            )}

        </div>


        <div class="detalle-linea">

            <strong>Estado:</strong>

            ${escaparHTML(
                correo.estado ||
                "pendiente"
            )}

        </div>


        <div class="separador"></div>


        <div class="detalle-mensaje">

            ${escaparHTML(
                correo.mensaje
            )}

        </div>

    `;


    tarjetaDetalle.classList.remove(
        "oculto"
    );


    tarjetaDetalle.scrollIntoView({
        behavior:"smooth"
    });

}


/* =========================================
   BOTONES
========================================= */

btnRecibidos.addEventListener(
    "click",
    async function(){

        limpiarMensajes();

        await cargarRecibidos();

    }
);


btnEnviados.addEventListener(
    "click",
    async function(){

        limpiarMensajes();

        await cargarEnviados();

    }
);


btnCerrarDetalle.addEventListener(
    "click",
    function(){

        tarjetaDetalle.classList.add(
            "oculto"
        );

    }
);


btnVolver.addEventListener(
    "click",
    function(){

        window.history.back();

    }
);


btnCerrarSesion.addEventListener(
    "click",
    async function(){

        if(
            !confirm(
                "¿Querés cerrar la sesión?"
            )
        ){

            return;

        }


        try{

            await signOut(
                auth
            );


            window.location.replace(
                "empleado-login.html"
            );

        }
        catch(error){

            mostrarError(
                "No se pudo cerrar la sesión: " +
                error.message
            );

        }

    }
);


/* =========================================
   INICIO
========================================= */

onAuthStateChanged(
    auth,
    async function(usuario){

        if(!usuario){

            window.location.replace(
                "empleado-login.html"
            );

            return;

        }


        usuarioSesion =
        usuario;


        try{

            limpiarMensajes();

            await cargarEmpleado();

            await cargarAdministracion();

            await cargarRecibidos();

            await cargarEnviados();

        }
        catch(error){

            console.error(
                "ERROR INICIANDO CORREO:",
                error
            );

            btnEnviar.disabled =
            true;

            mostrarError(
                error.message
            );

        }

    }
);

</script>
