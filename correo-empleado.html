function texto(valor){

        valor === null

    }

}

function mostrarExito(mensaje){

function limpiarMensajes(){

function escaparHTML(valor){

    return texto(valor)
    .replace(/&/g,"&amp;")
    .replace(/</g,"&lt;")
    .replace(/>/g,"&gt;")
    .replace(/"/g,"&quot;")
    .replace(/'/g,"&#039;");

}


function nombreCompleto(datos){

    return (
        texto(datos.nombre) +
        " " +
        texto(datos.apellido)
    ).trim();

}

/* =========================================
   CARGAR EMPLEADO
========================================= */

async function cargarEmpleado(){

    if(!usuarioSesion){

        throw new Error(
            "No hay una sesión activa."
        );

    }


    const consulta =
    query(
        collection(
            db,
            "empleados"
        ),
        where(
            "authUid",
            "==",
            usuarioSesion.uid
        ),
        limit(1)
    );


    const resultados =
    await getDocs(
        consulta
    );


    if(
        resultados.empty
    ){

        throw new Error(
            "No encontramos el perfil de empleado vinculado a esta cuenta."
        );

    }


    const documento =
    resultados.docs[0];


    empleadoId =
    documento.id;


    empleadoActual = {

        id:
        documento.id,

        ...documento.data()

    };


    empresaId =
    texto(
        empleadoActual.empresaId
    ).trim();


    /*
       INFORMACIÓN VISIBLE
       Se muestra solamente
       nombre y puesto.
    */

    const nombre =
    nombreCompleto(
        empleadoActual
    ) || "Empleado";


    usuarioActual.innerHTML = `
        <strong>
            ${escaparHTML(nombre)}
        </strong>
        <br>
        Puesto:
        ${escaparHTML(
            texto(
                empleadoActual.puesto
            ) || "Empleado"
        )}
    `;

}


/* =========================================
   CARGAR DESTINATARIOS
========================================= */

async function cargarDestinatarios(){

    destinatarios = [];


    /*
       EMPLEADOS DE LA MISMA EMPRESA
    */

    try{

        if(empresaId){

            const consulta =
            query(
                collection(
                    db,
                    "empleados"
                ),
                where(
                    "empresaId",
                    "==",
                    empresaId
                )
            );


            const resultados =
            await getDocs(
                consulta
            );


            resultados.forEach(
                documento => {

                    if(
                        documento.id ===
                        empleadoId
                    ){
                        return;
                    }


                    const datos =
                    documento.data();


                    destinatarios.push({

                        id:
                        documento.id,

                        authUid:
                        texto(
                            datos.authUid
                        ),

                        nombre:
                        nombreCompleto(
                            datos
                        ) || "Empleado",

                        email:
                        texto(
                            datos.email
                        ),

                        tipo:
                        "Empleado"

                    });

                }
            );

        }

    }
    catch(error){

        console.error(
            "Error empleados:",
            error
        );

    }


    /*
       ADMINISTRACIÓN
    */

    try{

        if(empresaId){

            const consultaAdmin =
            query(
                collection(
                    db,
                    "administradores"
                ),
                where(
                    "empresaId",
                    "==",
                    empresaId
                )
            );


            const resultadosAdmin =
            await getDocs(
                consultaAdmin
            );


            resultadosAdmin.forEach(
                documento => {

                    const datos =
                    documento.data();


                    destinatarios.push({

                        id:
                        documento.id,

                        authUid:
                        texto(
                            datos.authUid
                        ),

                        nombre:
                        nombreCompleto(
                            datos
                        ) ||
                        texto(
                            datos.nombre
                        ) ||
                        "Administración",

                        email:
                        texto(
                            datos.email
                        ),

                        tipo:
                        "Administración"

                    });

                }
            );

        }

    }
    catch(error){

        console.warn(
            "No se pudo cargar administración:",
            error
        );

    }


    /*
       ARMAR SELECT
    */

    destinatario.innerHTML = "";


    if(
        destinatarios.length === 0
    ){

        destinatario.innerHTML = `
            <option value="">
                No hay destinatarios disponibles
            </option>
        `;

        btnEnviar.disabled =
        true;

        return;

    }


    destinatario.innerHTML = `
        <option value="">
            Seleccionar destinatario...
        </option>
    `;


    destinatarios.forEach(
        persona => {

            const option =
            document.createElement(
                "option"
            );


            option.value =
            persona.id;


            option.textContent =
            persona.nombre +
            " — " +
            persona.tipo;


            destinatario.appendChild(
                option
            );

        }
    );


    btnEnviar.disabled =
    false;

}

/* =========================================
   AUDIO
========================================= */

btnAudio.addEventListener(
    "click",
    async function(){

        if(
            mediaRecorder &&
            mediaRecorder.state ===
            "recording"
        ){

            mediaRecorder.stop();

            return;

        }


        try{

            const stream =
            await navigator.mediaDevices.getUserMedia({
                audio:true
            });


            audioChunks = [];


            mediaRecorder =
            new MediaRecorder(
                stream
            );


            mediaRecorder.ondataavailable =
            function(event){

                if(
                    event.data.size > 0
                ){

                    audioChunks.push(
                        event.data
                    );

                }

            };


            mediaRecorder.onstop =
            function(){

                audioBlob =
                new Blob(
                    audioChunks,
                    {
                        type:
                        "audio/webm"
                    }
                );


                tipoAdjunto =
                "audio";


                archivoAdjunto =
                new File(
                    [audioBlob],
                    "audio-" +
                    Date.now() +
                    ".webm",
                    {
                        type:
                        "audio/webm"
                    }
                );


                estadoGrabacion.classList.add(
                    "oculto"
                );


                btnAudio.textContent =
                "🎤 GRABAR AUDIO";


                archivoSeleccionado.classList.remove(
                    "oculto"
                );


                archivoSeleccionado.textContent =
                "🎤 Audio grabado correctamente";


                stream.getTracks().forEach(
                    track =>
                    track.stop()
                );

            };


            mediaRecorder.start();


            estadoGrabacion.classList.remove(
                "oculto"
            );


            btnAudio.textContent =
            "⏹️ DETENER AUDIO";

        }
        catch(error){

            console.error(
                "Error micrófono:",
                error
            );


            mostrarError(
                "No se pudo acceder al micrófono. Verificá el permiso del navegador."
            );

        }

    }
);

    const extension =

    const nombreSeguro =
    Date.now() +
    "-" +
    Math.random()
    .toString(36)
    .substring(2) +
    "." +
    extension;


    const ruta =
    "correos/" +
    usuarioSesion.uid +
    "/" +
    nombreSeguro;


    const referencia =
    ref(
        almacenamiento,
        ruta
    );


    await uploadBytes(
        referencia,
        archivoAdjunto
    );


    const url =
    await getDownloadURL(
        referencia
    );


    return {

        url:
        url,

        nombre:
        archivoAdjunto.name,

        tipo:
        archivoAdjunto.type,

        categoria:
        tipoAdjunto

    };

}

/* =========================================
   RECIBIDOS
========================================= */

async function cargarRecibidos(){

    recibidos.innerHTML = `
        <div class="cargando">
            Cargando mensajes...
        </div>
    `;


    try{

        const consulta =
        query(
            collection(
                db,
                "correos"
            ),
            where(
                "destinatarioUid",
                "==",
                usuarioSesion.uid
            ),
            limit(50)
        );


        const resultados =
        await getDocs(
            consulta
        );


        correosRecibidos = [];


        resultados.forEach(
            documento => {

                correosRecibidos.push({

                    id:
                    documento.id,

                    ...documento.data()

                });

            }
        );


        correosRecibidos.sort(
            (a,b) => {

                const fechaA =
                texto(a.fecha) +
                " " +
                texto(a.hora);


                const fechaB =
                texto(b.fecha) +
                " " +
                texto(b.hora);


                return fechaB.localeCompare(
                    fechaA
                );

            }
        );


        mostrarRecibidos();

    }
    catch(error){

        console.error(
            "Error recibidos:",
            error
        );


        recibidos.innerHTML = `
            <div class="sin-registros">
                No se pudieron cargar los mensajes.
            </div>
        `;

    }

}


/* =========================================
   MOSTRAR RECIBIDOS
========================================= */

function mostrarRecibidos(){

    if(
        correosRecibidos.length === 0
    ){

        recibidos.innerHTML = `
            <div class="sin-registros">
                No tenés mensajes recibidos.
            </div>
        `;

        return;

    }


    recibidos.innerHTML = "";


    correosRecibidos.forEach(
        correo => {

            const item =
            document.createElement(
                "div"
            );


            item.className =
            "correo-item" +
            (
                correo.leido
                ? ""
                : " no-leido"
            );


            item.innerHTML = `

                <div class="correo-cabecera">

                    <div class="correo-persona">

                    <div class="correo-fecha">

                        ${escaparHTML(
                            correo.fecha
                        )}

                        ${escaparHTML(
                            correo.hora
                        )}

                    </div>

                <div class="correo-asunto">

                    ${escaparHTML(
                        correo.asunto
                    )}

                </div>


                <div class="correo-resumen">

                    ${escaparHTML(
                        texto(

                    )}

                </div>


                ${
                    correo.adjunto

                    `<span class="estado-correo">
                        📎 ADJUNTO

                }


                <span class="estado-correo ${

/* =========================================
   MOSTRAR ADJUNTO
========================================= */

function htmlAdjunto(adjunto){

    if(
        !adjunto ||
        !adjunto.url
    ){

        return "";

    }


    const categoria =
    texto(
        adjunto.categoria
    );


    if(
        categoria === "foto" ||
        texto(
            adjunto.tipo
        ).startsWith(
            "image/"
        )
    ){

        return `

            <div class="adjunto">

                <div class="nombre-adjunto">
                    📷 Foto
                </div>

                <img
                    src="${escaparHTML(
                        adjunto.url
                    )}"
                    alt="Foto adjunta"
                >

                <br>

                <a
                    href="${escaparHTML(
                        adjunto.url
                    )}"
                    target="_blank"
                    rel="noopener"
                >
                    🔗 Abrir foto
                </a>

            </div>

        `;

    }


    if(
        categoria === "audio" ||
        texto(
            adjunto.tipo
        ).startsWith(
            "audio/"
        )
    ){

        return `

            <div class="adjunto">

                <div class="nombre-adjunto">
                    🎤 Audio
                </div>

                <audio
                    controls
                    preload="metadata"
                    src="${escaparHTML(
                        adjunto.url
                    )}"
                >
                </audio>

                <br>

                <a
                    href="${escaparHTML(
                        adjunto.url
                    )}"
                    target="_blank"
                    rel="noopener"
                >
                    🔊 Abrir audio
                </a>

            </div>

        `;

    }


    return `

        <div class="adjunto">

            <div class="nombre-adjunto">
                📎 ${escaparHTML(
                    adjunto.nombre ||
                    "Archivo"
                )}
            </div>

            <a
                href="${escaparHTML(
                    adjunto.url
                )}"
                target="_blank"
                rel="noopener"
                download
            >
                ⬇️ ABRIR / DESCARGAR ARCHIVO
            </a>

        </div>

    `;

}


/* =========================================
   ABRIR CORREO
========================================= */

async function abrirCorreo(
    correo,
    esRecibido
){

    detalleCorreo.innerHTML = `

        <div class="detalle-linea">

            <strong>De:</strong>
            ${escaparHTML(
                correo.remitenteNombre
            )}

        </div>


        <div class="detalle-linea">

            <strong>Para:</strong>
            ${escaparHTML(
                correo.destinatarioNombre
            )}

        </div>


        <div class="detalle-linea">

            <strong>Asunto:</strong>
            ${escaparHTML(
                correo.asunto
            )}

        </div>


        <div class="detalle-linea">

            <strong>Fecha:</strong>
            ${escaparHTML(
                correo.fecha
            )}
            ${escaparHTML(
                correo.hora
            )}

        </div>


        <div class="separador"></div>


        <div class="detalle-mensaje">

            ${escaparHTML(
                correo.mensaje
            )}

        </div>


        ${
            htmlAdjunto(
                correo.adjunto
            )
        }


        ${
            esRecibido
            ?
            `
            <div class="responder-box">

                <button
                    id="btnResponder"
                    class="boton boton-responder"
                >
                    ↩️ RESPONDER
                </button>

            </div>
            `
            :
            ""
        }

    `;


    tarjetaDetalle.classList.remove(
        "oculto"
    );


    tarjetaDetalle.scrollIntoView({
        behavior:"smooth"
    });


    /*
       RESPONDER
    */

    if(esRecibido){

        const btnResponder =
        document.getElementById(
            "btnResponder"
        );


        if(btnResponder){

            btnResponder.addEventListener(
                "click",
                function(){

                    responderCorreo(
                        correo
                    );

                }
            );

        }

    }


    /*
       MARCAR COMO LEÍDO
    */

    if(
        esRecibido &&
        !correo.leido
    ){

        try{

            await updateDoc(
                doc(
                    db,
                    "correos",
                    correo.id
                ),
                {
                    leido:true
                }
            );


            correo.leido =
            true;


            mostrarRecibidos();

        }
        catch(error){

            console.error(
                "Error marcando leído:",
                error
            );

        }

    }

}


/* =========================================
   RESPONDER
========================================= */

function responderCorreo(correo){

    tarjetaDetalle.classList.add(
        "oculto"
    );


    destinatario.value =
    correo.remitenteId ||
    "";


    asunto.value =
    "Re: " +
    texto(
        correo.asunto
    );


    mensaje.value =
    "\n\n--- Mensaje original ---\n" +
    texto(
        correo.mensaje
    );


    archivoAdjunto =
    null;

    tipoAdjunto =
    "";


    archivoSeleccionado.classList.add(
        "oculto"
    );


    inputFoto.value =
    "";

    inputArchivo.value =
    "";


    window.scrollTo({
        top:0,
        behavior:"smooth"
    });


    mostrarExito(
        "Respuesta preparada. Podés agregar texto, foto, audio o archivo."
    );

}
