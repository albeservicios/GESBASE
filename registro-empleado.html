<!DOCTYPE html>
<html lang="es">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#111827">

<title>GESBASE - Registrar empleado</title>

<style>

*{
    box-sizing:border-box;
    margin:0;
    padding:0;
}

body{
    font-family:Arial,sans-serif;
    background:#f3f4f6;
    color:#111827;
    min-height:100vh;
}

header{
    background:#111827;
    color:white;
    padding:18px;
    text-align:center;
}

header h1{
    font-size:22px;
}

header p{
    margin-top:5px;
    color:#cbd5e1;
    font-size:14px;
}

.contenedor{
    max-width:800px;
    margin:25px auto;
    padding:15px;
}

.card{
    background:white;
    border-radius:18px;
    padding:22px;
    box-shadow:0 8px 25px rgba(0,0,0,.08);
}

h2{
    margin-bottom:20px;
}

.grupo{
    margin-bottom:15px;
}

label{
    display:block;
    font-weight:bold;
    margin-bottom:6px;
}

input,
select{
    width:100%;
    padding:12px;
    border:1px solid #d1d5db;
    border-radius:10px;
    font-size:16px;
}

.grid{
    display:grid;
    grid-template-columns:1fr 1fr;
    gap:15px;
}

button{
    width:100%;
    border:0;
    border-radius:12px;
    padding:14px;
    font-size:16px;
    font-weight:bold;
    cursor:pointer;
    margin-top:10px;
}

.btn-guardar{
    background:#111827;
    color:white;
}

.btn-volver{
    background:#e5e7eb;
    color:#111827;
}

.mensaje{
    margin-top:15px;
    padding:13px;
    border-radius:10px;
    display:none;
}

.exito{
    background:#dcfce7;
    color:#166534;
}

.error{
    background:#fee2e2;
    color:#991b1b;
}

.aviso{
    background:#fef3c7;
    color:#92400e;
}

.acceso-generado{
    margin-top:25px;
    padding:20px;
    background:#ecfdf5;
    border:2px solid #10b981;
    border-radius:16px;
}

.acceso-generado h3{
    color:#047857;
    margin-bottom:10px;
}

.acceso-generado p{
    margin-bottom:15px;
    line-height:1.5;
}

.dato-acceso{
    background:white;
    padding:12px;
    border-radius:10px;
    margin-top:10px;
    word-break:break-word;
}

.password{
    font-size:20px;
    font-weight:bold;
    letter-spacing:1px;
    color:#111827;
}

.btn-copiar{
    background:#10b981;
    color:white;
}

.oculto{
    display:none;
}

@media(max-width:650px){

    .grid{
        grid-template-columns:1fr;
    }

    .contenedor{
        margin:10px auto;
    }

}

</style>

</head>

<body>

<header>

    <h1>GESBASE</h1>

    <p>Registrar empleado</p>

</header>


<div class="contenedor">

<div class="card">

<h2>👤 Datos del empleado</h2>


<div class="grid">

    <div class="grupo">
        <label for="nombre">Nombre</label>
        <input id="nombre" type="text">
    </div>

    <div class="grupo">
        <label for="apellido">Apellido</label>
        <input id="apellido" type="text">
    </div>

</div>


<div class="grid">

    <div class="grupo">
        <label for="dni">DNI</label>
        <input id="dni" type="text">
    </div>

    <div class="grupo">
        <label for="telefono">Teléfono</label>
        <input id="telefono" type="tel">
    </div>

</div>


<div class="grupo">

    <label for="email">
        Email del empleado
    </label>

    <input
        id="email"
        type="email"
        placeholder="empleado@email.com"
    >

</div>


<div class="grid">

    <div class="grupo">

        <label for="puesto">
            Puesto
        </label>

        <input
            id="puesto"
            type="text"
            placeholder="Ej.: Oficial, ayudante..."
        >

    </div>


    <div class="grupo">

        <label for="tipoEmpleado">
            Tipo de empleado
        </label>

        <select id="tipoEmpleado">

            <option value="empleado">
                Empleado
            </option>

            <option value="chofer">
                Chofer
            </option>

        </select>

    </div>

</div>


<div class="grid">

    <div class="grupo">

        <label for="estado">
            Estado
        </label>

        <select id="estado">

            <option value="activo">
                Activo
            </option>

            <option value="inactivo">
                Inactivo
            </option>

        </select>

    </div>


    <div class="grupo">

        <label for="fechaIngreso">
            Fecha de ingreso
        </label>

        <input
            id="fechaIngreso"
            type="date"
        >

    </div>

</div>


<div class="grid">

    <div class="grupo">

        <label for="pagoDiario">
            Pago diario
        </label>

        <input
            id="pagoDiario"
            type="number"
            min="0"
            step="0.01"
        >

    </div>


    <div class="grupo">

        <label for="adicionales">
            Adicionales
        </label>

        <input
            id="adicionales"
            type="number"
            min="0"
            step="0.01"
            value="0"
        >

    </div>

</div>


<div class="grupo">

    <label for="descuentos">
        Descuentos
    </label>

    <input
        id="descuentos"
        type="number"
        min="0"
        step="0.01"
        value="0"
    >

</div>


<!-- DATOS DEL CHOFER -->

<div id="datosChofer" class="oculto">

    <h2>🚛 Datos del chofer</h2>


    <div class="grupo">

        <label for="unidadId">
            Unidad
        </label>

        <select id="unidadId">

            <option value="">
                Seleccionar unidad
            </option>

        </select>

    </div>


    <div class="grid">

        <div class="grupo">

            <label for="licencia">
                Licencia
            </label>

            <input id="licencia" type="text">

        </div>


        <div class="grupo">

            <label for="categoriaLicencia">
                Categoría
            </label>

            <input
                id="categoriaLicencia"
                type="text"
                placeholder="Ej.: C"
            >

        </div>

    </div>


    <div class="grupo">

        <label for="vencimientoLicencia">
            Vencimiento de licencia
        </label>

        <input
            id="vencimientoLicencia"
            type="date"
        >

    </div>

</div>


<button
    id="btnGuardar"
    class="btn-guardar"
    type="button"
>
    💾 REGISTRAR EMPLEADO
</button>


<button
    id="btnVolver"
    class="btn-volver"
    type="button"
>
    ↩️ VOLVER
</button>


<div
    id="mensaje"
    class="mensaje"
></div>


<!-- ACCESO GENERADO -->

<div
    id="accesoGenerado"
    class="acceso-generado"
    style="display:none;"
>

    <h3>🔐 ACCESO DEL EMPLEADO</h3>

    <p>
        El acceso fue creado correctamente.
        Entregale estos datos al empleado.
        La contraseña es momentánea y deberá cambiarla
        en su primer ingreso.
    </p>


    <div class="dato-acceso">

        <strong>Email:</strong>

        <span id="accesoEmail"></span>

    </div>


    <div class="dato-acceso">

        <strong>
            Contraseña momentánea:
        </strong>

        <div
            id="accesoPassword"
            class="password"
        ></div>

    </div>


    <div class="dato-acceso">

        <strong>
            Validez:
        </strong>

        24 horas

    </div>


    <button
        id="btnCopiarAcceso"
        class="btn-copiar"
        type="button"
    >
        📋 COPIAR ACCESO
    </button>

</div>


</div>

</div>


<script type="module">

import {
    auth,
    db
} from "./Js/firebase.js";


import {
    onAuthStateChanged
} from "https://www.gstatic.com/firebasejs/12.18.0/firebase-auth.js";


import {
    collection,
    getDocs,
    query,
    where,
    addDoc,
    doc,
    getDoc,
    updateDoc,
    serverTimestamp
} from "https://www.gstatic.com/firebasejs/12.18.0/firebase-firestore.js";


import {
    getFunctions,
    httpsCallable
} from "https://www.gstatic.com/firebasejs/12.18.0/firebase-functions.js";


const functions = getFunctions();

const crearAccesoEmpleado =
    httpsCallable(
        functions,
        "crearAccesoEmpleado"
    );


let usuarioActual = null;

let empresaActualId = null;

let empresaActual = null;


/* ELEMENTOS */

const nombre =
    document.getElementById("nombre");

const apellido =
    document.getElementById("apellido");

const dni =
    document.getElementById("dni");

const telefono =
    document.getElementById("telefono");

const email =
    document.getElementById("email");

const puesto =
    document.getElementById("puesto");

const tipoEmpleado =
    document.getElementById("tipoEmpleado");

const estado =
    document.getElementById("estado");

const pagoDiario =
    document.getElementById("pagoDiario");

const adicionales =
    document.getElementById("adicionales");

const descuentos =
    document.getElementById("descuentos");

const fechaIngreso =
    document.getElementById("fechaIngreso");

const unidadId =
    document.getElementById("unidadId");

const licencia =
    document.getElementById("licencia");

const categoriaLicencia =
    document.getElementById("categoriaLicencia");

const vencimientoLicencia =
    document.getElementById("vencimientoLicencia");

const datosChofer =
    document.getElementById("datosChofer");

const mensaje =
    document.getElementById("mensaje");

const accesoGenerado =
    document.getElementById("accesoGenerado");

const accesoEmail =
    document.getElementById("accesoEmail");

const accesoPassword =
    document.getElementById("accesoPassword");


/* FUNCIONES */

function texto(valor){

    return String(valor || "").trim();

}


function numero(valor){

    return Number(valor) || 0;

}


function mostrarMensaje(
    textoMensaje,
    tipo = "exito"
){

    mensaje.textContent =
        textoMensaje;

    mensaje.className =
        "mensaje " + tipo;

    mensaje.style.display =
        "block";

}


function ocultarMensaje(){

    mensaje.style.display =
        "none";

}


/* MOSTRAR / OCULTAR CHOFER */

tipoEmpleado.addEventListener(
    "change",
    () => {

        if(
            tipoEmpleado.value === "chofer"
        ){

            datosChofer.classList.remove(
                "oculto"
            );

            cargarUnidades();

        }else{

            datosChofer.classList.add(
                "oculto"
            );

        }

    }
);


/* OBTENER EMPRESA DEL ADMINISTRADOR */

async function obtenerEmpresa(){

    const usuarioRef =
        doc(
            db,
            "usuarios",
            usuarioActual.uid
        );


    const usuarioSnap =
        await getDoc(usuarioRef);


    if(!usuarioSnap.exists()){

        throw new Error(
            "No se encontró tu usuario."
        );

    }


    const usuarioData =
        usuarioSnap.data();


    const rol =
        String(
            usuarioData.rol || ""
        )
        .trim()
        .toLowerCase();


    const esAdmin =
        usuarioActual.email ===
            "julianbattauz006@gmail.com"
        ||
        rol === "admin"
        ||
        rol === "administrador";


    if(!esAdmin){

        throw new Error(
            "Solo un administrador puede registrar empleados."
        );

    }


    let empresaId =
        usuarioData.empresaId
        ||
        usuarioData.idEmpresa
        ||
        usuarioData.empresa
        ||
        "";


    empresaId =
        texto(empresaId);


    if(!empresaId){

        const q =
            query(
                collection(db,"empresas"),
                where(
                    "propietarioUid",
                    "==",
                    usuarioActual.uid
                )
            );


        const snap =
            await getDocs(q);


        if(!snap.empty){

            empresaId =
                snap.docs[0].id;

        }

    }


    if(!empresaId){

        throw new Error(
            "No se encontró la empresa asociada a tu cuenta."
        );

    }


    empresaActualId =
        empresaId;


    const empresaSnap =
        await getDoc(
            doc(
                db,
                "empresas",
                empresaActualId
            )
        );


    if(
        empresaSnap.exists()
    ){

        empresaActual =
            empresaSnap.data();

    }

}


/* CARGAR UNIDADES */

async function cargarUnidades(){

    if(!empresaActualId){

        return;

    }


    unidadId.innerHTML = `
        <option value="">
            Seleccionar unidad
        </option>
    `;


    const q =
        query(
            collection(db,"unidades"),
            where(
                "empresaId",
                "==",
                empresaActualId
            )
        );


    const snap =
        await getDocs(q);


    snap.forEach(
        documento => {

            const unidad =
                documento.data();


            if(
                unidad.choferId
            ){

                return;

            }


            const option =
                document.createElement(
                    "option"
                );


            option.value =
                documento.id;


            option.textContent =
                unidad.patente
                ||
                unidad.nombre
                ||
                documento.id;


            unidadId.appendChild(
                option
            );

        }
    );

}


/* REGISTRAR EMPLEADO */

async function registrarEmpleado(){

    ocultarMensaje();

    accesoGenerado.style.display =
        "none";


    if(!usuarioActual){

        mostrarMensaje(
            "No hay una sesión de administrador activa.",
            "error"
        );

        return;

    }


    if(!empresaActualId){

        mostrarMensaje(
            "No se pudo determinar la empresa.",
            "error"
        );

        return;

    }


    const nombreTexto =
        texto(nombre.value);

    const apellidoTexto =
        texto(apellido.value);

    const emailTexto =
        texto(email.value).toLowerCase();


    if(!nombreTexto){

        mostrarMensaje(
            "Ingresá el nombre del empleado.",
            "error"
        );

        return;

    }


    if(!apellidoTexto){

        mostrarMensaje(
            "Ingresá el apellido del empleado.",
            "error"
        );

        return;

    }


    if(!emailTexto){

        mostrarMensaje(
            "El empleado necesita un email para generar su acceso.",
            "error"
        );

        return;

    }


    const btn =
        document.getElementById(
            "btnGuardar"
        );


    btn.disabled = true;

    btn.textContent =
        "⏳ REGISTRANDO...";


    try{

        /* CREAR FICHA */

        const datosEmpleado = {

            empresaId:
                empresaActualId,

            nombre:
                nombreTexto,

            apellido:
                apellidoTexto,

            dni:
                texto(dni.value),

            telefono:
                texto(telefono.value),

            email:
                emailTexto,

            puesto:
                texto(puesto.value),

            tipoEmpleado:
                tipoEmpleado.value,

            estado:
                estado.value,

            pagoDiario:
                numero(pagoDiario.value),

            adicionales:
                numero(adicionales.value),

            descuentos:
                numero(descuentos.value),

            fechaIngreso:
                texto(fechaIngreso.value),

            authUid:
                "",

            usuarioId:
                "",

            passwordTemporal:
                false,

            creadoPor:
                usuarioActual.uid,

            creadoEn:
                serverTimestamp(),

            actualizadoEn:
                serverTimestamp()

        };


        const referenciaEmpleado =
            await addDoc(
                collection(
                    db,
                    "empleados"
                ),
                datosEmpleado
            );


        /* SI ES CHOFER */

        if(
            tipoEmpleado.value === "chofer"
        ){

            const datosChofer = {

                empresaId:
                    empresaActualId,

                empleadoId:
                    referenciaEmpleado.id,

                empleadoNombre:
                    `${nombreTexto} ${apellidoTexto}`.trim(),

                unidadId:
                    texto(unidadId.value),

                licencia:
                    texto(licencia.value),

                categoriaLicencia:
                    texto(categoriaLicencia.value),

                vencimientoLicencia:
                    texto(
                        vencimientoLicencia.value
                    ),

                creadoPor:
                    usuarioActual.uid,

                creadoEn:
                    serverTimestamp(),

                actualizadoEn:
                    serverTimestamp()

            };


            await addDoc(
                collection(
                    db,
                    "choferes"
                ),
                datosChofer
            );


            /* ASIGNAR CHOFER A UNIDAD */

            if(
                texto(unidadId.value)
            ){

                await updateDoc(
                    doc(
                        db,
                        "unidades",
                        unidadId.value
                    ),
                    {

                        choferId:
                            referenciaEmpleado.id,

                        choferUsuarioId:
                            "",

                        choferNombre:
                            `${nombreTexto} ${apellidoTexto}`.trim(),

                        actualizadoEn:
                            serverTimestamp()

                    }
                );

            }

        }


        /* GENERAR ACCESO */

        mostrarMensaje(
            "Empleado registrado. Generando acceso...",
            "exito"
        );


        const respuesta =
            await crearAccesoEmpleado({

                empleadoId:
                    referenciaEmpleado.id

            });


        const acceso =
            respuesta.data;


        if(
            !acceso ||
            !acceso.ok
        ){

            throw new Error(
                "El empleado fue registrado, pero no se pudo generar el acceso."
            );

        }


        /* MOSTRAR CONTRASEÑA */

        accesoEmail.textContent =
            acceso.email;

        accesoPassword.textContent =
            acceso.passwordTemporal;


        accesoGenerado.style.display =
            "block";


        mostrarMensaje(
            "✅ Empleado registrado y acceso generado correctamente.",
            "exito"
        );


        /* LIMPIAR FORMULARIO */

        nombre.value = "";

        apellido.value = "";

        dni.value = "";

        telefono.value = "";

        email.value = "";

        puesto.value = "";

        pagoDiario.value = "";

        adicionales.value = "0";

        descuentos.value = "0";

        fechaIngreso.value = "";

        licencia.value = "";

        categoriaLicencia.value = "";

        vencimientoLicencia.value = "";

        unidadId.value = "";

        tipoEmpleado.value =
            "empleado";

        datosChofer.classList.add(
            "oculto"
        );


    }catch(error){

        console.error(error);


        mostrarMensaje(
            error.message
            ||
            "Ocurrió un error al registrar el empleado.",
            "error"
        );

    }finally{

        btn.disabled = false;

        btn.textContent =
            "💾 REGISTRAR EMPLEADO";

    }

}


/* COPIAR ACCESO */

document
.getElementById("btnCopiarAcceso")
.addEventListener(
    "click",
    async () => {

        const textoAcceso =
`GESBASE - Acceso de empleado

Email: ${accesoEmail.textContent}

Contraseña momentánea: ${accesoPassword.textContent}

Ingresá a GESBASE con estos datos.
La contraseña deberá cambiarse en el primer ingreso.`;


        try{

            await navigator.clipboard.writeText(
                textoAcceso
            );


            mostrarMensaje(
                "📋 Acceso copiado.",
                "exito"
            );

        }catch(error){

            mostrarMensaje(
                "No se pudo copiar automáticamente.",
                "aviso"
            );

        }

    }
);


/* BOTONES */

document
.getElementById("btnGuardar")
.addEventListener(
    "click",
    registrarEmpleado
);


document
.getElementById("btnVolver")
.addEventListener(
    "click",
    () => {

        window.location.href =
            "panel-administracion.html";

    }
);


/* SESIÓN */

onAuthStateChanged(
    auth,
    async usuario => {

        if(!usuario){

            window.location.replace(
                "index.html"
            );

            return;

        }


        usuarioActual =
            usuario;


        try{

            await obtenerEmpresa();

            await cargarUnidades();

        }catch(error){

            console.error(error);


            mostrarMensaje(
                error.message,
                "error"
            );

        }

    }
);

</script>

</body>

</html>
