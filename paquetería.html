<!DOCTYPE html>
<html lang="es">

<head>

<meta charset="UTF-8">

<meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
>

<meta
    name="theme-color"
    content="#111827"
>

<meta
    name="description"
    content="GESBASE - Gestión de paquetería"
>

<title>Paquetería - GESBASE</title>

<style>

*{
    box-sizing:border-box;
}

body{
    margin:0;
    font-family:
        -apple-system,
        BlinkMacSystemFont,
        "Segoe UI",
        Roboto,
        Arial,
        sans-serif;
    background:#f3f4f6;
    color:#111827;
}

header{
    background:#111827;
    color:white;
    padding:15px 20px;
    display:flex;
    align-items:center;
    justify-content:space-between;
    gap:15px;
    position:sticky;
    top:0;
    z-index:100;
}

.logo{
    font-size:21px;
    font-weight:800;
}

.subtitulo{
    font-size:12px;
    opacity:.7;
}

.btn-volver{
    border:none;
    background:#374151;
    color:white;
    padding:9px 14px;
    border-radius:9px;
    cursor:pointer;
}

main{
    max-width:1150px;
    margin:auto;
    padding:20px;
}

.titulo{
    margin-bottom:20px;
}

.titulo h1{
    margin:0;
    font-size:27px;
}

.titulo p{
    color:#6b7280;
    margin-top:5px;
}

.card{
    background:white;
    border-radius:16px;
    padding:20px;
    margin-bottom:20px;
    box-shadow:0 4px 15px rgba(0,0,0,.06);
}

.card h2{
    margin-top:0;
    font-size:19px;
}

.grid{
    display:grid;
    grid-template-columns:repeat(2,1fr);
    gap:15px;
}

.full{
    grid-column:1/-1;
}

.campo{
    display:flex;
    flex-direction:column;
    gap:6px;
}

label{
    font-size:13px;
    font-weight:700;
}

input,
select,
textarea{
    width:100%;
    padding:11px;
    border:1px solid #d1d5db;
    border-radius:9px;
    font-size:14px;
    background:white;
}

textarea{
    min-height:80px;
    resize:vertical;
}

.acciones{
    display:flex;
    gap:8px;
    flex-wrap:wrap;
    margin-top:18px;
}

.btn{
    border:none;
    padding:10px 14px;
    border-radius:9px;
    cursor:pointer;
    font-weight:700;
}

.btn-primary{
    background:#111827;
    color:white;
}

.btn-green{
    background:#16a34a;
    color:white;
}

.btn-blue{
    background:#2563eb;
    color:white;
}

.btn-orange{
    background:#ea580c;
    color:white;
}

.btn-red{
    background:#dc2626;
    color:white;
}

.btn-gray{
    background:#6b7280;
    color:white;
}

.resumen{
    display:grid;
    grid-template-columns:repeat(5,1fr);
    gap:12px;
}

.resumen-box{
    background:#f9fafb;
    border-radius:12px;
    padding:15px;
    text-align:center;
}

.resumen-box strong{
    display:block;
    font-size:25px;
}

.resumen-box span{
    color:#6b7280;
    font-size:12px;
}

.lista{
    display:grid;
    gap:14px;
}

.envio{
    border:1px solid #e5e7eb;
    border-radius:14px;
    padding:17px;
}

.envio-cabecera{
    display:flex;
    align-items:center;
    justify-content:space-between;
    gap:10px;
    flex-wrap:wrap;
}

.numero{
    font-size:17px;
    font-weight:800;
}

.estado{
    padding:5px 10px;
    border-radius:20px;
    font-size:12px;
    font-weight:800;
}

.estado-pendiente{
    background:#fef3c7;
    color:#92400e;
}

.estado-recibido{
    background:#dbeafe;
    color:#1d4ed8;
}

.estado-en-viaje{
    background:#dcfce7;
    color:#166534;
}

.estado-entregado{
    background:#e5e7eb;
    color:#374151;
}

.estado-cancelado{
    background:#fee2e2;
    color:#991b1b;
}

.info{
    display:grid;
    grid-template-columns:repeat(3,1fr);
    gap:10px;
    margin-top:14px;
}

.info-item{
    background:#f9fafb;
    padding:10px;
    border-radius:9px;
}

.info-item small{
    display:block;
    color:#6b7280;
    font-size:11px;
}

.info-item strong{
    font-size:14px;
}

.mensaje{
    padding:12px;
    border-radius:10px;
    margin-bottom:15px;
    display:none;
}

.exito{
    background:#dcfce7;
    color:#166534;
}

.error{
    background:#fee2e2;
    color:#991b1b;
}

.vacio{
    text-align:center;
    padding:30px;
    color:#6b7280;
}

.busqueda{
    margin-bottom:15px;
}

@media(max-width:800px){

    .grid{
        grid-template-columns:1fr;
    }

    .resumen{
        grid-template-columns:repeat(2,1fr);
    }

    .info{
        grid-template-columns:1fr;
    }

    .full{
        grid-column:auto;
    }

}

</style>

</head>


<body>


<header>

    <div>

        <div class="logo">
            GESBASE
        </div>

        <div class="subtitulo">
            Gestión de paquetería
        </div>

    </div>


    <button
        class="btn-volver"
        onclick="volver()"
    >
        ← Volver
    </button>

</header>


<main>


    <div class="titulo">

        <h1>
            📦 Paquetería
        </h1>

        <p>
            Registrá, asigná y controlá los envíos de tu empresa.
        </p>

    </div>


    <div
        id="mensaje"
        class="mensaje"
    ></div>


    <!-- RESUMEN -->

    <div class="card">

        <div class="resumen">

            <div class="resumen-box">

                <strong id="totalEnvios">
                    0
                </strong>

                <span>
                    Total
                </span>

            </div>


            <div class="resumen-box">

                <strong id="totalPendientes">
                    0
                </strong>

                <span>
                    Pendientes
                </span>

            </div>


            <div class="resumen-box">

                <strong id="totalEnViaje">
                    0
                </strong>

                <span>
                    En viaje
                </span>

            </div>


            <div class="resumen-box">

                <strong id="totalEntregados">
                    0
                </strong>

                <span>
                    Entregados
                </span>

            </div>


            <div class="resumen-box">

                <strong id="totalCancelados">
                    0
                </strong>

                <span>
                    Cancelados
                </span>

            </div>

        </div>

    </div>


    <!-- NUEVO ENVÍO -->

    <div class="card">

        <h2>
            ➕ Nuevo envío
        </h2>


        <div class="grid">


            <div class="campo">

                <label>
                    Fecha
                </label>

                <input
                    type="date"
                    id="fecha"
                >

            </div>


            <div class="campo">

                <label>
                    Número de envío
                </label>

                <input
                    type="text"
                    id="numeroEnvio"
                    placeholder="Se genera automáticamente"
                >

            </div>


            <div class="campo">

                <label>
                    Remitente
                </label>

                <input
                    type="text"
                    id="remitente"
                    placeholder="Nombre del remitente"
                >

            </div>


            <div class="campo">

                <label>
                    Teléfono remitente
                </label>

                <input
                    type="tel"
                    id="telefonoRemitente"
                    placeholder="Teléfono"
                >

            </div>


            <div class="campo">

                <label>
                    Destinatario
                </label>

                <input
                    type="text"
                    id="destinatario"
                    placeholder="Nombre del destinatario"
                >

            </div>


            <div class="campo">

                <label>
                    Teléfono destinatario
                </label>

                <input
                    type="tel"
                    id="telefonoDestinatario"
                    placeholder="Teléfono"
                >

            </div>


            <div class="campo">

                <label>
                    Localidad origen
                </label>

                <input
                    type="text"
                    id="origen"
                    placeholder="Ej: Catriel"
                >

            </div>


            <div class="campo">

                <label>
                    Localidad destino
                </label>

                <input
                    type="text"
                    id="destino"
                    placeholder="Ej: Neuquén"
                >

            </div>


            <div class="campo">

                <label>
                    Viaje
                </label>

                <select id="viaje">

                    <option value="">
                        Sin asignar
                    </option>

                </select>

            </div>


            <div class="campo">

                <label>
                    Tipo de envío
                </label>

                <select id="tipoEnvio">

                    <option value="Paquete">
                        📦 Paquete
                    </option>

                    <option value="Sobre">
                        ✉️ Sobre
                    </option>

                    <option value="Documentación">
                        📄 Documentación
                    </option>

                    <option value="Mercadería">
                        🛒 Mercadería
                    </option>

                    <option value="Otro">
                        📦 Otro
                    </option>

                </select>

            </div>


            <div class="campo">

                <label>
                    Cantidad
                </label>

                <input
                    type="number"
                    id="cantidad"
                    min="1"
                    value="1"
                >

            </div>


            <div class="campo">

                <label>
                    Peso aproximado (kg)
                </label>

                <input
                    type="number"
                    id="peso"
                    min="0"
                    step="0.01"
                    placeholder="Kg"
                >

            </div>


            <div class="campo">

                <label>
                    Estado
                </label>

                <select id="estado">

                    <option value="Pendiente">
                        Pendiente
                    </option>

                    <option value="Recibido">
                        Recibido
                    </option>

                </select>

            </div>


            <div class="campo">

                <label>
                    Monto / valor declarado
                </label>

                <input
                    type="number"
                    id="valor"
                    min="0"
                    step="0.01"
                    placeholder="0"
                >

            </div>


            <div class="campo full">

                <label>
                    Dirección / referencia de entrega
                </label>

                <input
                    type="text"
                    id="direccionEntrega"
                    placeholder="Dirección, domicilio, empresa o referencia"
                >

            </div>


            <div class="campo full">

                <label>
                    Observaciones
                </label>

                <textarea
                    id="observaciones"
                    placeholder="Información adicional del envío"
                ></textarea>

            </div>

        </div>


        <div class="acciones">

            <button
                class="btn btn-primary"
                onclick="crearEnvio()"
            >
                📦 Registrar envío
            </button>

        </div>

    </div>


    <!-- BUSCADOR -->

    <div class="card">

        <h2>
            🔎 Buscar envío
        </h2>

        <div class="busqueda">

            <input
                type="text"
                id="buscar"
                placeholder="Número de envío, remitente, destinatario o localidad..."
            >

        </div>

    </div>


    <!-- LISTADO -->

    <div class="card">

        <h2>
            📋 Envíos registrados
        </h2>

        <div
            id="listaEnvios"
            class="lista"
        >

            <div class="vacio">
                Cargando envíos...
            </div>

        </div>

    </div>


</main>


<script type="module">


import {
    auth,
    db
} from "./Js/firebase.js";


import {
    onAuthStateChanged
} from "https://www.gstatic.com/firebasejs/12.18.0/firebase-auth.js";


import {
    collection,
    query,
    where,
    getDocs,
    getDoc,
    doc,
    addDoc,
    updateDoc,
    serverTimestamp
} from "https://www.gstatic.com/firebasejs/12.18.0/firebase-firestore.js";


let usuarioActual = null;

let empresaActualId = null;

let viajes = [];

let envios = [];


/* =========================================================
   FECHA
========================================================= */

document.getElementById("fecha").value =
    new Date()
        .toISOString()
        .split("T")[0];


/* =========================================================
   MENSAJE
========================================================= */

function mostrarMensaje(
    texto,
    tipo = "exito"
){

    const elemento =
        document.getElementById("mensaje");

    elemento.textContent =
        texto;

    elemento.className =
        "mensaje " + tipo;

    elemento.style.display =
        "block";


    setTimeout(() => {

        elemento.style.display =
            "none";

    },4000);

}


/* =========================================================
   AUTENTICACIÓN
========================================================= */

onAuthStateChanged(
    auth,
    async usuario => {

        if(!usuario){

            window.location.href =
                "acceso-empleado.html";

            return;
        }


        usuarioActual =
            usuario;


        try{

            const usuarioSnap =
                await getDoc(
                    doc(
                        db,
                        "usuarios",
                        usuario.uid
                    )
                );


            if(!usuarioSnap.exists()){

                mostrarMensaje(
                    "No se encontró el usuario.",
                    "error"
                );

                return;
            }


            const datosUsuario =
                usuarioSnap.data();


            empresaActualId =
                datosUsuario.empresaId ||
                datosUsuario.idEmpresa ||
                datosUsuario.empresa ||
                usuario.uid;


            const empresaSnap =
                await getDoc(
                    doc(
                        db,
                        "empresas",
                        empresaActualId
                    )
                );


            if(!empresaSnap.exists()){

                mostrarMensaje(
                    "No se encontró la empresa.",
                    "error"
                );

                return;
            }


            const empresa =
                empresaSnap.data();


            if(
                empresa.modulos &&
                empresa.modulos.paqueteria === false
            ){

                mostrarMensaje(
                    "El módulo de paquetería no está habilitado.",
                    "error"
                );

                return;
            }


            await cargarTodo();


        }catch(error){

            console.error(error);

            mostrarMensaje(
                "Error al cargar Paquetería.",
                "error"
            );

        }

    }
);


/* =========================================================
   CARGAR TODO
========================================================= */

async function cargarTodo(){

    await Promise.all([

        cargarViajes(),

        cargarEnvios()

    ]);

}


/* =========================================================
   CARGAR VIAJES
========================================================= */

async function cargarViajes(){

    const q =
        query(
            collection(
                db,
                "viajes"
            ),
            where(
                "empresaId",
                "==",
                empresaActualId
            )
        );


    const snap =
        await getDocs(q);


    viajes = [];


    const select =
        document.getElementById(
            "viaje"
        );


    select.innerHTML = `
        <option value="">
            Sin asignar
        </option>
    `;


    snap.forEach(item => {

        const data =
            item.data();


        viajes.push({

            id:item.id,

            ...data

        });


        const option =
            document.createElement(
                "option"
            );


        option.value =
            item.id;


        option.textContent =
            `${data.numeroViaje || "Viaje"} - ${data.origen || ""} → ${data.destino || ""}`;


        select.appendChild(
            option
        );

    });

}


/* =========================================================
   AUTOCOMPLETAR DESDE VIAJE
========================================================= */

document
    .getElementById("viaje")
    .addEventListener(
        "change",
        () => {

            const viajeId =
                document.getElementById(
                    "viaje"
                ).value;


            if(!viajeId){

                return;
            }


            const viaje =
                viajes.find(
                    v => v.id === viajeId
                );


            if(!viaje){

                return;
            }


            document.getElementById(
                "origen"
            ).value =
                viaje.origen || "";


            document.getElementById(
                "destino"
            ).value =
                viaje.destino || "";

        }
    );


/* =========================================================
   CREAR ENVÍO
========================================================= */

window.crearEnvio =
    async function(){

        try{

            const fecha =
                document.getElementById(
                    "fecha"
                ).value;


            const numeroIngresado =
                document.getElementById(
                    "numeroEnvio"
                ).value.trim();


            const remitente =
                document.getElementById(
                    "remitente"
                ).value.trim();


            const telefonoRemitente =
                document.getElementById(
                    "telefonoRemitente"
                ).value.trim();


            const destinatario =
                document.getElementById(
                    "destinatario"
                ).value.trim();


            const telefonoDestinatario =
                document.getElementById(
                    "telefonoDestinatario"
                ).value.trim();


            const origen =
                document.getElementById(
                    "origen"
                ).value.trim();


            const destino =
                document.getElementById(
                    "destino"
                ).value.trim();


            const viajeId =
                document.getElementById(
                    "viaje"
                ).value;


            const tipoEnvio =
                document.getElementById(
                    "tipoEnvio"
                ).value;


            const cantidad =
                Number(
                    document.getElementById(
                        "cantidad"
                    ).value
                ) || 1;


            const peso =
                Number(
                    document.getElementById(
                        "peso"
                    ).value
                ) || 0;


            const estado =
                document.getElementById(
                    "estado"
                ).value;


            const valor =
                Number(
                    document.getElementById(
                        "valor"
                    ).value
                ) || 0;


            const direccionEntrega =
                document.getElementById(
                    "direccionEntrega"
                ).value.trim();


            const observaciones =
                document.getElementById(
                    "observaciones"
                ).value.trim();


            if(!fecha){

                mostrarMensaje(
                    "Seleccioná una fecha.",
                    "error"
                );

                return;
            }


            if(!remitente){

                mostrarMensaje(
                    "Ingresá el remitente.",
                    "error"
                );

                return;
            }


            if(!destinatario){

                mostrarMensaje(
                    "Ingresá el destinatario.",
                    "error"
                );

                return;
            }


            if(!origen || !destino){

                mostrarMensaje(
                    "Ingresá origen y destino.",
                    "error"
                );

                return;
            }


            let numeroEnvio =
                numeroIngresado;


            if(!numeroEnvio){

                numeroEnvio =
                    "ENV-" +
                    Date.now()
                        .toString()
                        .slice(-9);

            }


            const viaje =
                viajes.find(
                    v => v.id === viajeId
                );


            const datosEnvio = {

                empresaId:
                    empresaActualId,

                numeroEnvio,

                fecha,

                remitente,

                telefonoRemitente,

                destinatario,

                telefonoDestinatario,

                origen,

                destino,

                viajeId:
                    viajeId || null,

                numeroViaje:
                    viaje?.numeroViaje || "",

                unidadId:
                    viaje?.unidadId || null,

                patente:
                    viaje?.patente || "",

                unidadTipo:
                    viaje?.unidadTipo || "",

                choferId:
                    viaje?.choferId || null,

                choferNombre:
                    viaje?.choferNombre || "",

                tipoEnvio,

                cantidad,

                peso,

                estado,

                valor,

                direccionEntrega,

                observaciones,

                creadoPor:
                    usuarioActual.uid,

                creadoEn:
                    serverTimestamp(),

                actualizadoEn:
                    serverTimestamp()

            };


            await addDoc(

                collection(
                    db,
                    "paqueteria"
                ),

                datosEnvio

            );


            mostrarMensaje(
                `Envío ${numeroEnvio} registrado correctamente.`
            );


            limpiarFormulario();


            await cargarEnvios();


        }catch(error){

            console.error(error);

            mostrarMensaje(
                "No se pudo registrar el envío.",
                "error"
            );

        }

    };


/* =========================================================
   LIMPIAR FORMULARIO
========================================================= */

function limpiarFormulario(){

    document.getElementById(
        "numeroEnvio"
    ).value = "";

    document.getElementById(
        "remitente"
    ).value = "";

    document.getElementById(
        "telefonoRemitente"
    ).value = "";

    document.getElementById(
        "destinatario"
    ).value = "";

    document.getElementById(
        "telefonoDestinatario"
    ).value = "";

    document.getElementById(
        "origen"
    ).value = "";

    document.getElementById(
        "destino"
    ).value = "";

    document.getElementById(
        "viaje"
    ).value = "";

    document.getElementById(
        "cantidad"
    ).value = "1";

    document.getElementById(
        "peso"
    ).value = "";

    document.getElementById(
        "valor"
    ).value = "";

    document.getElementById(
        "direccionEntrega"
    ).value = "";

    document.getElementById(
        "observaciones"
    ).value = "";

}


/* =========================================================
   CARGAR ENVÍOS
========================================================= */

async function cargarEnvios(){

    const q =
        query(
            collection(
                db,
                "paqueteria"
            ),
            where(
                "empresaId",
                "==",
                empresaActualId
            )
        );


    const snap =
        await getDocs(q);


    envios = [];


    snap.forEach(item => {

        envios.push({

            id:item.id,

            ...item.data()

        });

    });


    envios.sort(
        (a,b) =>
            String(b.fecha || "")
                .localeCompare(
                    String(a.fecha || "")
                )
    );


    mostrarEnvios();

    actualizarResumen();

}


/* =========================================================
   MOSTRAR ENVÍOS
========================================================= */

function mostrarEnvios(){

    const contenedor =
        document.getElementById(
            "listaEnvios"
        );


    const busqueda =
        document.getElementById(
            "buscar"
        ).value
        .trim()
        .toLowerCase();


    const filtrados =
        envios.filter(
            envio => {

                if(!busqueda){

                    return true;

                }


                const texto = [

                    envio.numeroEnvio,

                    envio.remitente,

                    envio.destinatario,

                    envio.origen,

                    envio.destino,

                    envio.numeroViaje,

                    envio.patente

                ]
                .join(" ")
                .toLowerCase();


                return texto.includes(
                    busqueda
                );

            }
        );


    if(filtrados.length === 0){

        contenedor.innerHTML = `
            <div class="vacio">
                No se encontraron envíos.
            </div>
        `;

        return;
    }


    contenedor.innerHTML = "";


    filtrados.forEach(
        envio => {

            const div =
                document.createElement(
                    "div"
                );


            div.className =
                "envio";


            let claseEstado =
                "estado-pendiente";


            if(
                envio.estado ===
                "Recibido"
            ){

                claseEstado =
                    "estado-recibido";

            }


            if(
                envio.estado ===
                "En viaje"
            ){

                claseEstado =
                    "estado-en-viaje";

            }


            if(
                envio.estado ===
                "Entregado"
            ){

                claseEstado =
                    "estado-entregado";

            }


            if(
                envio.estado ===
                "Cancelado"
            ){

                claseEstado =
                    "estado-cancelado";

            }


            let acciones = "";


            if(
                envio.estado ===
                "Pendiente" ||
                envio.estado ===
                "Recibido"
            ){

                acciones += `
                    <button
                        class="btn btn-green"
                        onclick="ponerEnViaje('${envio.id}')"
                    >
                        🚛 Enviar
                    </button>
                `;

            }


            if(
                envio.estado ===
                "En viaje"
            ){

                acciones += `
                    <button
                        class="btn btn-blue"
                        onclick="marcarEntregado('${envio.id}')"
                    >
                        ✓ Entregado
                    </button>
                `;

            }


            if(
                envio.estado !==
                    "Entregado" &&
                envio.estado !==
                    "Cancelado"
            ){

                acciones += `
                    <button
                        class="btn btn-red"
                        onclick="cancelarEnvio('${envio.id}')"
                    >
                        ✕ Cancelar
                    </button>
                `;

            }


            div.innerHTML = `

                <div class="envio-cabecera">

                    <div class="numero">
                        📦
                        ${envio.numeroEnvio || "Sin número"}
                    </div>

                    <span
                        class="estado ${claseEstado}"
                    >
                        ${envio.estado || "Pendiente"}
                    </span>

                </div>


                <div class="info">

                    <div class="info-item">

                        <small>
                            Fecha
                        </small>

                        <strong>
                            ${envio.fecha || "-"}
                        </strong>

                    </div>


                    <div class="info-item">

                        <small>
                            Remitente
                        </small>

                        <strong>
                            ${envio.remitente || "-"}
                        </strong>

                    </div>


                    <div class="info-item">

                        <small>
                            Destinatario
                        </small>

                        <strong>
                            ${envio.destinatario || "-"}
                        </strong>

                    </div>


                    <div class="info-item">

                        <small>
                            Origen
                        </small>

                        <strong>
                            ${envio.origen || "-"}
                        </strong>

                    </div>


                    <div class="info-item">

                        <small>
                            Destino
                        </small>

                        <strong>
                            ${envio.destino || "-"}
                        </strong>

                    </div>


                    <div class="info-item">

                        <small>
                            Tipo
                        </small>

                        <strong>
                            ${envio.tipoEnvio || "-"}
                        </strong>

                    </div>


                    <div class="info-item">

                        <small>
                            Viaje
                        </small>

                        <strong>
                            ${envio.numeroViaje || "Sin asignar"}
                        </strong>

                    </div>


                    <div class="info-item">

                        <small>
                            Unidad
                        </small>

                        <strong>
                            ${envio.patente || "Sin asignar"}
                        </strong>

                    </div>


                    <div class="info-item">

                        <small>
                            Chofer
                        </small>

                        <strong>
                            ${envio.choferNombre || "Sin asignar"}
                        </strong>

                    </div>


                    <div class="info-item">

                        <small>
                            Cantidad
                        </small>

                        <strong>
                            ${envio.cantidad || 1}
                        </strong>

                    </div>


                    <div class="info-item">

                        <small>
                            Peso
                        </small>

                        <strong>
                            ${envio.peso || 0} kg
                        </strong>

                    </div>


                    <div class="info-item">

                        <small>
                            Valor declarado
                        </small>

                        <strong>
                            $ ${Number(
                                envio.valor || 0
                            ).toLocaleString(
                                "es-AR"
                            )}
                        </strong>

                    </div>

                </div>


                ${
                    envio.direccionEntrega
                    ?
                    `
                    <p>
                        📍
                        <strong>
                            Entrega:
                        </strong>
                        ${envio.direccionEntrega}
                    </p>
                    `
                    :
                    ""
                }


                ${
                    envio.observaciones
                    ?
                    `
                    <p>
                        📝
                        ${envio.observaciones}
                    </p>
                    `
                    :
                    ""
                }


                <div class="acciones">

                    ${acciones}

                </div>

            `;


            contenedor.appendChild(
                div
            );

        }
    );

}


/* =========================================================
   BUSCADOR
========================================================= */

document
    .getElementById("buscar")
    .addEventListener(
        "input",
        mostrarEnvios
    );


/* =========================================================
   PONER EN VIAJE
========================================================= */

window.ponerEnViaje =
    async function(id){

        try{

            const envio =
                envios.find(
                    e => e.id === id
                );


            if(!envio){

                return;
            }


            if(!envio.viajeId){

                mostrarMensaje(
                    "Primero asigná el envío a un viaje.",
                    "error"
                );

                return;
            }


            const viaje =
                viajes.find(
                    v => v.id === envio.viajeId
                );


            if(
                viaje &&
                viaje.estado === "Planificado"
            ){

                await updateDoc(

                    doc(
                        db,
                        "viajes",
                        envio.viajeId
                    ),

                    {

                        estado:"En curso",

                        horaSalida:
                            viaje.horaSalida ||
                            new Date()
                                .toTimeString()
                                .slice(0,5),

                        actualizadoEn:
                            serverTimestamp()

                    }

                );

            }


            await updateDoc(

                doc(
                    db,
                    "paqueteria",
                    id
                ),

                {

                    estado:"En viaje",

                    actualizadoEn:
                        serverTimestamp()

                }

            );


            mostrarMensaje(
                `El envío ${envio.numeroEnvio} está en viaje.`
            );


            await cargarTodo();


        }catch(error){

            console.error(error);

            mostrarMensaje(
                "No se pudo actualizar el envío.",
                "error"
            );

        }

    };


/* =========================================================
   ENTREGAR
========================================================= */

window.marcarEntregado =
    async function(id){

        if(
            !confirm(
                "¿Confirmás que el envío fue entregado?"
            )
        ){

            return;
        }


        try{

            await updateDoc(

                doc(
                    db,
                    "paqueteria",
                    id
                ),

                {

                    estado:"Entregado",

                    fechaEntrega:
                        new Date()
                            .toISOString()
                            .split("T")[0],

                    horaEntrega:
                        new Date()
                            .toTimeString()
                            .slice(0,5),

                    actualizadoEn:
                        serverTimestamp()

                }

            );


            mostrarMensaje(
                "Envío marcado como entregado."
            );


            await cargarEnvios();


        }catch(error){

            console.error(error);

            mostrarMensaje(
                "No se pudo marcar como entregado.",
                "error"
            );

        }

    };


/* =========================================================
   CANCELAR
========================================================= */

window.cancelarEnvio =
    async function(id){

        if(
            !confirm(
                "¿Querés cancelar este envío?"
            )
        ){

            return;
        }


        try{

            await updateDoc(

                doc(
                    db,
                    "paqueteria",
                    id
                ),

                {

                    estado:"Cancelado",

                    actualizadoEn:
                        serverTimestamp()

                }

            );


            mostrarMensaje(
                "Envío cancelado."
            );


            await cargarEnvios();


        }catch(error){

            console.error(error);

            mostrarMensaje(
                "No se pudo cancelar el envío.",
                "error"
            );

        }

    };


/* =========================================================
   RESUMEN
========================================================= */

function actualizarResumen(){

    document.getElementById(
        "totalEnvios"
    ).textContent =
        envios.length;


    document.getElementById(
        "totalPendientes"
    ).textContent =
        envios.filter(
            e =>
                e.estado === "Pendiente" ||
                e.estado === "Recibido"
        ).length;


    document.getElementById(
        "totalEnViaje"
    ).textContent =
        envios.filter(
            e =>
                e.estado === "En viaje"
        ).length;


    document.getElementById(
        "totalEntregados"
    ).textContent =
        envios.filter(
            e =>
                e.estado === "Entregado"
        ).length;


    document.getElementById(
        "totalCancelados"
    ).textContent =
        envios.filter(
            e =>
                e.estado === "Cancelado"
        ).length;

}


/* =========================================================
   VOLVER
========================================================= */

window.volver =
    function(){

        window.location.href =
            "index.html";

    };


</script>
