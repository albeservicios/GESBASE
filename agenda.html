<!DOCTYPE html>
<html lang="es">

<head>

<meta charset="UTF-8">

<meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
>

<meta
    name="theme-color"
    content="#111827"
>

<meta
    name="description"
    content="GESBASE - Agenda de trabajos"
>

<title>Agenda - GESBASE</title>

<style>

*{
    box-sizing:border-box;
    margin:0;
    padding:0;
}

body{
    font-family:Arial,Helvetica,sans-serif;
    background:#f3f4f6;
    color:#111827;
}

.contenedor{
    max-width:600px;
    margin:auto;
    min-height:100vh;
    background:white;
}

header{
    background:#111827;
    color:white;
    padding:25px 20px;
}

header h1{
    font-size:25px;
}

header p{
    margin-top:6px;
    font-size:14px;
    color:#d1d5db;
}

main{
    padding:20px;
}

.estado-sesion{
    margin-bottom:18px;
    padding:12px;
    border-radius:10px;
    background:#f3f4f6;
    color:#4b5563;
    font-size:13px;
}

.campo{
    margin-bottom:18px;
}

label{
    display:block;
    font-weight:bold;
    font-size:14px;
    margin-bottom:7px;
}

input,
textarea,
select{
    width:100%;
    padding:13px;
    border:1px solid #d1d5db;
    border-radius:9px;
    font-size:16px;
    background:white;
    color:#111827;
}

input:focus,
textarea:focus,
select:focus{
    outline:none;
    border-color:#2563eb;
}

textarea{
    min-height:110px;
    resize:vertical;
}

button{
    width:100%;
    padding:15px;
    border:none;
    border-radius:10px;
    font-size:16px;
    font-weight:bold;
    cursor:pointer;
    margin-top:10px;
}

.guardar{
    background:#111827;
    color:white;
}

.volver{
    background:#e5e7eb;
    color:#111827;
}

button:disabled{
    opacity:.6;
    cursor:not-allowed;
}

.mensaje{
    display:none;
    margin-top:15px;
    padding:13px;
    border-radius:10px;
    font-size:14px;
    line-height:1.5;
}

.mensaje.exito{
    display:block;
    background:#dcfce7;
    color:#166534;
}

.mensaje.error{
    display:block;
    background:#fee2e2;
    color:#991b1b;
}

@media(max-width:600px){

    main{
        padding:15px;
    }

}

</style>

</head>

<body>

<div class="contenedor">

<header>

<h1>
Nueva agenda
</h1>

<p>
GESBASE
</p>

</header>

<main>


<div
    id="estadoSesion"
    class="estado-sesion"
>
Verificando sesión...
</div>


<!-- =========================================
     NÚMERO DE AGENDA
========================================= -->

<div class="campo">

<label for="numeroAgenda">
N.º de agenda
</label>

<input
    type="text"
    id="numeroAgenda"
    placeholder="Opcional: número enviado por la empresa"
    inputmode="numeric"
>

</div>


<!-- =========================================
     CLIENTE
========================================= -->

<div class="campo">

<label for="cliente">
Cliente
</label>

<input
    type="text"
    id="cliente"
    placeholder="Nombre del cliente"
    autocomplete="off"
>

</div>


<!-- =========================================
     FECHA
========================================= -->

<div class="campo">

<label for="fecha">
Fecha
</label>

<input
    type="date"
    id="fecha"
>

</div>


<!-- =========================================
     HORA
========================================= -->

<div class="campo">

<label for="hora">
Hora
</label>

<input
    type="time"
    id="hora"
>

</div>


<!-- =========================================
     LUGAR
========================================= -->

<div class="campo">

<label for="lugar">
Lugar de trabajo
</label>

<input
    type="text"
    id="lugar"
    placeholder="Dirección o localidad"
>

</div>


<!-- =========================================
     ESTADO
========================================= -->

<div class="campo">

<label for="estado">
Estado
</label>

<select id="estado">

<option value="pendiente">
Pendiente
</option>

<option value="en_curso">
En curso
</option>

<option value="finalizada">
Finalizada
</option>

</select>

</div>


<!-- =========================================
     OBSERVACIONES
========================================= -->

<div class="campo">

<label for="observaciones">
Observaciones
</label>

<textarea
    id="observaciones"
    placeholder="Detalles de la agenda..."
></textarea>

</div>


<div
    id="mensaje"
    class="mensaje"
></div>


<!-- =========================================
     GUARDAR
========================================= -->

<button
    type="button"
    class="guardar"
    id="btnGuardar"
>
Guardar agenda
</button>


<!-- =========================================
     VOLVER
========================================= -->

<button
    type="button"
    class="volver"
    id="btnVolver"
>
Volver
</button>


</main>

</div>


<script type="module">


/* =====================================================
   FIREBASE
   Utiliza la configuración central de GESBASE.
===================================================== */

import {
    auth,
    db
} from "./Js/firebase.js";


import {
    onAuthStateChanged
} from "https://www.gstatic.com/firebasejs/12.18.0/firebase-auth.js";


import {
    collection,
    addDoc,
    serverTimestamp,
    doc,
    getDoc
} from "https://www.gstatic.com/firebasejs/12.18.0/firebase-firestore.js";


/* =====================================================
   ELEMENTOS
===================================================== */

const estadoSesion =
document.getElementById(
    "estadoSesion"
);

const numeroAgenda =
document.getElementById(
    "numeroAgenda"
);

const cliente =
document.getElementById(
    "cliente"
);

const fecha =
document.getElementById(
    "fecha"
);

const hora =
document.getElementById(
    "hora"
);

const lugar =
document.getElementById(
    "lugar"
);

const estado =
document.getElementById(
    "estado"
);

const observaciones =
document.getElementById(
    "observaciones"
);

const mensaje =
document.getElementById(
    "mensaje"
);

const btnGuardar =
document.getElementById(
    "btnGuardar"
);

const btnVolver =
document.getElementById(
    "btnVolver"
);


/* =====================================================
   VARIABLES
===================================================== */

let usuarioActual = null;

let empresaIdActual = "";


/* =====================================================
   UTILIDADES
===================================================== */

function texto(valor){

    if(
        valor === undefined ||
        valor === null
    ){

        return "";

    }

    return String(valor).trim();

}


function mostrarMensaje(
    textoMensaje,
    tipo
){

    mensaje.textContent =
    textoMensaje;

    mensaje.className =
    "mensaje " + tipo;

}


/* =====================================================
   FECHA ACTUAL
===================================================== */

function establecerFechaActual(){

    const hoy =
    new Date();

    fecha.value =
        hoy.getFullYear() +
        "-" +
        String(
            hoy.getMonth() + 1
        ).padStart(2,"0") +
        "-" +
        String(
            hoy.getDate()
        ).padStart(2,"0");

}

establecerFechaActual();


/* =====================================================
   OBTENER EMPRESA DEL USUARIO
===================================================== */

async function obtenerEmpresaId(){

    if(!usuarioActual){

        return "";

    }


    try{

        const referenciaUsuario =
        doc(
            db,
            "usuarios",
            usuarioActual.uid
        );


        const resultado =
        await getDoc(
            referenciaUsuario
        );


        if(
            resultado.exists()
        ){

            const datos =
            resultado.data();


            const empresaId =
            texto(
                datos.empresaId ||
                datos.empresa ||
                datos.idEmpresa
            );


            if(empresaId){

                return empresaId;

            }

        }

    }
    catch(error){

        console.warn(
            "No se pudo obtener empresaId:",
            error
        );

    }


    /*
     * Compatibilidad con la estructura
     * anterior de GESBASE.
     */

    return usuarioActual.uid;

}


/* =====================================================
   GENERAR NÚMERO DE AGENDA
===================================================== */

function generarNumeroAgenda(){

    return String(

        Math.floor(

            100000 +
            Math.random() * 900000

        )

    );

}


/* =====================================================
   OBTENER NÚMERO
===================================================== */

function obtenerNumeroAgenda(){

    const ingresado =
    texto(
        numeroAgenda.value
    );


    if(ingresado){

        return ingresado;

    }


    return generarNumeroAgenda();

}


/* =====================================================
   AUTENTICACIÓN
===================================================== */

onAuthStateChanged(

    auth,

    async function(usuario){

        if(!usuario){

            window.location.replace(
                "./login.html"
            );

            return;

        }


        usuarioActual =
        usuario;


        estadoSesion.textContent =
        "Sesión activa: " +
        (
            usuario.email ||
            "usuario autenticado"
        );


        try{

            empresaIdActual =
            await obtenerEmpresaId();

        }
        catch(error){

            console.warn(
                "No se pudo determinar empresaId:",
                error
            );

        }

    }

);


/* =====================================================
   GUARDAR AGENDA
===================================================== */

btnGuardar.addEventListener(

    "click",

    async function(){

        if(!usuarioActual){

            mostrarMensaje(
                "Esperá unos segundos mientras se verifica la sesión.",
                "error"
            );

            return;

        }


        const clienteValor =
        texto(
            cliente.value
        );


        const fechaValor =
        texto(
            fecha.value
        );


        const horaValor =
        texto(
            hora.value
        );


        const lugarValor =
        texto(
            lugar.value
        );


        const observacionesValor =
        texto(
            observaciones.value
        );


        if(!clienteValor){

            mostrarMensaje(
                "Ingresá el nombre del cliente.",
                "error"
            );

            cliente.focus();

            return;

        }


        if(!fechaValor){

            mostrarMensaje(
                "Seleccioná una fecha.",
                "error"
            );

            fecha.focus();

            return;

        }


        if(!horaValor){

            mostrarMensaje(
                "Seleccioná una hora.",
                "error"
            );

            hora.focus();

            return;

        }


        if(!lugarValor){

            mostrarMensaje(
                "Ingresá el lugar de trabajo.",
                "error"
            );

            lugar.focus();

            return;

        }


        const numeroAgendaFinal =
        obtenerNumeroAgenda();


        btnGuardar.disabled =
        true;

        btnGuardar.textContent =
        "Guardando...";


        try{

            /*
             * Si por alguna razón todavía
             * no tenemos empresaId, lo
             * intentamos obtener nuevamente.
             */

            if(!empresaIdActual){

                empresaIdActual =
                await obtenerEmpresaId();

            }


            const datosAgenda = {

                uid:
                usuarioActual.uid,

                empresaId:
                empresaIdActual,

                numeroAgenda:
                numeroAgendaFinal,

                cliente:
                clienteValor,

                fecha:
                fechaValor,

                hora:
                horaValor,

                lugar:
                lugarValor,

                estado:
                texto(
                    estado.value
                ) ||
                "pendiente",

                observaciones:
                observacionesValor,

                creado:
                serverTimestamp()

            };


            await addDoc(

                collection(
                    db,
                    "agendas"
                ),

                datosAgenda

            );


            mostrarMensaje(

                "Agenda guardada correctamente. N.º de agenda: " +
                numeroAgendaFinal,

                "exito"

            );


            btnGuardar.textContent =
            "Agenda guardada";


            setTimeout(

                function(){

                    window.location.href =
                    "./index.html";

                },

                800

            );

        }
        catch(error){

            console.error(
                "ERROR GUARDANDO AGENDA:",
                error
            );


            let detalle =
            error.message ||
            error.code ||
            "Error desconocido";


            if(
                error.code ===
                "permission-denied"
            ){

                detalle =
                "Firebase rechazó el acceso. Revisá las reglas de Firestore para la colección agendas.";

            }


            mostrarMensaje(

                "No se pudo guardar la agenda: " +
                detalle,

                "error"

            );


            btnGuardar.disabled =
            false;

            btnGuardar.textContent =
            "Guardar agenda";

        }

    }

);


/* =====================================================
   VOLVER
===================================================== */

btnVolver.addEventListener(

    "click",

    function(){

        window.location.href =
        "./index.html";

    }

);

</script>

</body>

</html>
