<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#111827">

<title>Agenda - GESBASE</title>

<style>

*{
    box-sizing:border-box;
    margin:0;
    padding:0;
}

body{
    font-family:Arial,sans-serif;
    background:#f3f4f6;
    color:#111827;
}

.contenedor{
    max-width:600px;
    margin:auto;
    min-height:100vh;
    background:white;
}

header{
    background:#111827;
    color:white;
    padding:25px 20px;
}

header h1{
    font-size:25px;
}

header p{
    margin-top:6px;
    color:#d1d5db;
}

main{
    padding:20px;
}

.campo{
    margin-bottom:18px;
}

label{
    display:block;
    font-weight:bold;
    font-size:14px;
    margin-bottom:7px;
}

input,
textarea,
select{
    width:100%;
    padding:13px;
    border:1px solid #d1d5db;
    border-radius:9px;
    font-size:16px;
    background:white;
}

textarea{
    min-height:110px;
    resize:vertical;
}

button{
    width:100%;
    padding:15px;
    border:none;
    border-radius:10px;
    font-size:16px;
    font-weight:bold;
    cursor:pointer;
    margin-top:10px;
}

.guardar{
    background:#111827;
    color:white;
}

.volver{
    background:#e5e7eb;
    color:#111827;
}

button:disabled{
    opacity:.6;
}

.mensaje{
    display:none;
    margin-top:15px;
    padding:13px;
    border-radius:10px;
}

.exito{
    display:block;
    background:#dcfce7;
    color:#166534;
}

.error{
    display:block;
    background:#fee2e2;
    color:#991b1b;
}

</style>
</head>

<body>

<div class="contenedor">

<header>

<h1>Nueva agenda</h1>

<p>GESBASE</p>

</header>

<main>

<!-- NÚMERO DE AGENDA -->

<div class="campo">

<label for="numeroAgenda">
N.º de agenda
</label>

<input
    type="text"
    id="numeroAgenda"
    placeholder="Opcional: número enviado por la empresa"
    inputmode="numeric"
>

</div>


<!-- CLIENTE -->

<div class="campo">

<label for="cliente">
Cliente
</label>

<input
    type="text"
    id="cliente"
    placeholder="Nombre del cliente"
>

</div>


<!-- FECHA -->

<div class="campo">

<label for="fecha">
Fecha
</label>

<input
    type="date"
    id="fecha"
>

</div>


<!-- HORA -->

<div class="campo">

<label for="hora">
Hora
</label>

<input
    type="time"
    id="hora"
>

</div>


<!-- LUGAR -->

<div class="campo">

<label for="lugar">
Lugar de trabajo
</label>

<input
    type="text"
    id="lugar"
    placeholder="Dirección o localidad"
>

</div>


<!-- ESTADO -->

<div class="campo">

<label for="estado">
Estado
</label>

<select id="estado">

<option value="pendiente">
Pendiente
</option>

<option value="en_curso">
En curso
</option>

<option value="finalizada">
Finalizada
</option>

</select>

</div>


<!-- OBSERVACIONES -->

<div class="campo">

<label for="observaciones">
Observaciones
</label>

<textarea
    id="observaciones"
    placeholder="Detalles de la agenda..."
></textarea>

</div>


<div
    id="mensaje"
    class="mensaje"
></div>


<button
    type="button"
    class="guardar"
    id="btnGuardar"
>
Guardar agenda
</button>


<button
    type="button"
    class="volver"
    id="btnVolver"
>
Volver
</button>

</main>

</div>


<script type="module">

/*
====================================================
FIREBASE
====================================================
*/

import {
    auth,
    db
} from "./Js/firebase.js";


import {
    onAuthStateChanged
} from "https://www.gstatic.com/firebasejs/12.1.0/firebase-auth.js";


import {
    collection,
    addDoc,
    serverTimestamp
} from "https://www.gstatic.com/firebasejs/12.1.0/firebase-firestore.js";


/*
====================================================
ELEMENTOS
====================================================
*/

const numeroAgenda =
document.getElementById("numeroAgenda");

const cliente =
document.getElementById("cliente");

const fecha =
document.getElementById("fecha");

const hora =
document.getElementById("hora");

const lugar =
document.getElementById("lugar");

const estado =
document.getElementById("estado");

const observaciones =
document.getElementById("observaciones");

const mensaje =
document.getElementById("mensaje");

const btnGuardar =
document.getElementById("btnGuardar");

const btnVolver =
document.getElementById("btnVolver");


let usuarioActual = null;


/*
====================================================
FECHA ACTUAL
====================================================
*/

const hoy = new Date();

fecha.value =
hoy.getFullYear() +
"-" +
String(hoy.getMonth() + 1).padStart(2,"0") +
"-" +
String(hoy.getDate()).padStart(2,"0");


/*
====================================================
AUTENTICACIÓN
====================================================
*/

onAuthStateChanged(
    auth,
    function(usuario){

        if(!usuario){

            window.location.replace(
                "login.html"
            );

            return;
        }

        usuarioActual = usuario;

    }
);


/*
====================================================
NÚMERO DE AGENDA
====================================================

Si la empresa entregó un número,
se utiliza ese.

Si queda vacío,
GESBASE genera uno automáticamente.

====================================================
*/

function obtenerNumeroAgenda(){

    const numero =
    numeroAgenda.value.trim();


    if(numero !== ""){

        return numero;

    }


    return String(

        Math.floor(

            100000 +
            Math.random() * 900000

        )

    );

}


/*
====================================================
MENSAJE
====================================================
*/

function mostrarMensaje(
    texto,
    tipo
){

    mensaje.textContent =
    texto;

    mensaje.className =
    "mensaje " + tipo;

}


/*
====================================================
GUARDAR AGENDA
====================================================
*/

btnGuardar.addEventListener(
    "click",
    async function(){

        if(!usuarioActual){

            mostrarMensaje(
                "Esperá unos segundos mientras se verifica la sesión.",
                "error"
            );

            return;

        }


        if(
            cliente.value.trim() === ""
        ){

            mostrarMensaje(
                "Ingresá el nombre del cliente.",
                "error"
            );

            cliente.focus();

            return;

        }


        if(
            fecha.value === ""
        ){

            mostrarMensaje(
                "Seleccioná una fecha.",
                "error"
            );

            fecha.focus();

            return;

        }


        if(
            hora.value === ""
        ){

            mostrarMensaje(
                "Seleccioná una hora.",
                "error"
            );

            hora.focus();

            return;

        }


        if(
            lugar.value.trim() === ""
        ){

            mostrarMensaje(
                "Ingresá el lugar de trabajo.",
                "error"
            );

            lugar.focus();

            return;

        }


        const numeroAgendaFinal =
        obtenerNumeroAgenda();


        btnGuardar.disabled =
        true;

        btnGuardar.textContent =
        "Guardando...";


        try{

            await addDoc(

                collection(
                    db,
                    "agendas"
                ),

                {

                    uid:
                    usuarioActual.uid,

                    numeroAgenda:
                    numeroAgendaFinal,

                    cliente:
                    cliente.value.trim(),

                    fecha:
                    fecha.value,

                    hora:
                    hora.value,

                    lugar:
                    lugar.value.trim(),

                    estado:
                    estado.value,

                    observaciones:
                    observaciones.value.trim(),

                    creado:
                    serverTimestamp()

                }

            );


            mostrarMensaje(

                "Agenda guardada correctamente. N.º de agenda: " +
                numeroAgendaFinal,

                "exito"

            );


            setTimeout(
                function(){

                    window.location.href =
                    "index.html";

                },
                800
            );


        }catch(error){

            console.error(
                error
            );


            mostrarMensaje(

                "No se pudo guardar: " +
                error.message,

                "error"

            );


            btnGuardar.disabled =
            false;

            btnGuardar.textContent =
            "Guardar agenda";

        }

    }
);


/*
====================================================
VOLVER
====================================================
*/

btnVolver.addEventListener(
    "click",
    function(){

        window.location.href =
        "index.html";

    }
);

</script>

</body>
</html>
