<style>

*{
    box-sizing:border-box;
}

html,
body{
    margin:0;
    padding:0;
    min-height:100%;
    font-family:Arial,Helvetica,sans-serif;
    background:#111827;
    color:#f9fafb;
}

body{
    min-height:100vh;
}

button{
    font-family:inherit;
}

a{
    color:inherit;
    text-decoration:none;
}

.app{
    width:100%;
    max-width:1150px;
    margin:auto;
    padding:16px;
}

/* =========================
   CABECERA
========================= */

.header{
    background:#1f2937;
    border:1px solid #374151;
    border-radius:18px;
    padding:18px;
    margin-bottom:18px;
    box-shadow:0 10px 30px rgba(0,0,0,.22);
}

.header-top{
    display:flex;
    justify-content:space-between;
    align-items:center;
    gap:15px;
}

.logo{
    width:48px;
    height:48px;
    border-radius:14px;
    background:#2563eb;
    display:flex;
    align-items:center;
    justify-content:center;
    font-size:25px;
    font-weight:800;
    flex-shrink:0;
}

.brand{
    display:flex;
    align-items:center;
    gap:12px;
}

.brand h1{
    margin:0;
    font-size:21px;
}

.brand p{
    margin:4px 0 0;
    color:#9ca3af;
    font-size:13px;
}

.btn-salir{
    border:1px solid #4b5563;
    background:#111827;
    color:#f9fafb;
    padding:10px 14px;
    border-radius:10px;
    cursor:pointer;
}

.btn-salir:hover{
    background:#374151;
}

.usuario{
    margin-top:18px;
    padding-top:16px;
    border-top:1px solid #374151;
}

.usuario-nombre{
    font-size:22px;
    font-weight:700;
}

.usuario-datos{
    display:flex;
    flex-wrap:wrap;
    gap:8px;
    margin-top:9px;
}

.badge{
    display:inline-flex;
    align-items:center;
    padding:6px 10px;
    border-radius:999px;
    background:#374151;
    color:#d1d5db;
    font-size:12px;
}

.badge.rubro{
    background:#1d4ed8;
    color:white;
}

.badge.rol{
    background:#065f46;
    color:#d1fae5;
}

/* =========================
   SECCIONES
========================= */

.seccion{
    margin-bottom:22px;
}

.seccion-titulo{
    display:flex;
    align-items:center;
    gap:10px;
    margin-bottom:10px;
}

.seccion-titulo h2{
    margin:0;
    font-size:18px;
}

.seccion-linea{
    flex:1;
    height:1px;
    background:#374151;
}

.grid{
    display:grid;
    grid-template-columns:repeat(auto-fit,minmax(180px,1fr));
    gap:12px;
}

/* =========================
   TARJETAS
========================= */

.modulo{
    min-height:112px;
    background:#1f2937;
    border:1px solid #374151;
    border-radius:15px;
    padding:15px;
    cursor:pointer;
    transition:.18s ease;
    display:flex;
    flex-direction:column;
    justify-content:center;
    gap:8px;
}

.modulo:hover{
    transform:translateY(-2px);
    border-color:#2563eb;
    background:#243244;
}

.modulo:active{
    transform:scale(.98);
}

.modulo-icono{
    font-size:27px;
}

.modulo-titulo{
    font-size:15px;
    font-weight:700;
}

.modulo-descripcion{
    font-size:12px;
    color:#9ca3af;
    line-height:1.4;
}

.modulo.rubro{
    border-left:4px solid #2563eb;
}

.modulo.comunicacion{
    border-left:4px solid #8b5cf6;
}

.modulo.cuenta{
    border-left:4px solid #64748b;
}

.modulo.transporte{
    border-left:4px solid #f59e0b;
}

/* =========================
   SIN PERMISOS
========================= */

.sin-permisos{
    display:none;
    background:#1f2937;
    border:1px solid #374151;
    border-radius:16px;
    padding:30px 20px;
    text-align:center;
}

.sin-permisos .icono{
    font-size:42px;
    margin-bottom:10px;
}

.sin-permisos h2{
    margin:0 0 8px;
}

.sin-permisos p{
    color:#9ca3af;
    margin:0;
}

/* =========================
   CARGANDO
========================= */

.loading{
    position:fixed;
    inset:0;
    background:#111827;
    display:flex;
    align-items:center;
    justify-content:center;
    z-index:9999;
}

.loading-box{
    text-align:center;
}

.spinner{
    width:42px;
    height:42px;
    border:4px solid #374151;
    border-top-color:#2563eb;
    border-radius:50%;
    animation:girar .8s linear infinite;
    margin:auto auto 15px;
}

@keyframes girar{
    to{
        transform:rotate(360deg);
    }
}

/* =========================
   MENSAJE
========================= */

.mensaje{
    position:fixed;
    left:16px;
    right:16px;
    bottom:18px;
    max-width:500px;
    margin:auto;
    background:#1f2937;
    border:1px solid #374151;
    border-radius:13px;
    padding:14px 16px;
    box-shadow:0 10px 30px rgba(0,0,0,.35);
    display:none;
    z-index:10000;
}

.mensaje.error{
    border-color:#ef4444;
}

.mensaje.exito{
    border-color:#10b981;
}

/* =========================
   RESPONSIVE
========================= */

@media(max-width:600px){

    .app{
        padding:10px;
    }

    .header{
        border-radius:14px;
        padding:15px;
    }

    .header-top{
        align-items:flex-start;
    }

    .brand h1{
        font-size:18px;
    }

    .usuario-nombre{
        font-size:19px;
    }

    .grid{
        grid-template-columns:repeat(2,1fr);
        gap:9px;
    }

    .modulo{

        padding:12px;
    }

    .modulo-icono{
        font-size:23px;
    }

    .modulo-titulo{
        font-size:13px;
    }

    .modulo-descripcion{
        font-size:11px;
    }

    .btn-salir{
        padding:8px 10px;
        font-size:12px;
    }
}

</style>

</head>

/* =========================================================
   NORMALIZAR RUBRO
========================================================= */

function normalizarRubro(valor){

    if(!valor){
        return "";
    }

    const texto = String(valor)
        .toLowerCase()
        .trim()
        .normalize("NFD")
        .replace(/[\u0300-\u036f]/g,"");

    if(
        texto.includes("constru")
        || texto.includes("obra")
    ){
        return "construccion";
    }

    if(
        texto.includes("comerc")
        || texto.includes("venta")
        || texto.includes("distrib")
    ){
        return "comercio";
    }

    if(
        texto.includes("transport")
        || texto.includes("paqueter")
        || texto.includes("logistic")
    ){
        return "transporte";
    }

    if(
        texto.includes("manten")
        || texto.includes("tecnico")
        || texto.includes("tecnica")
    ){
        return "mantenimiento";
    }

    if(
        texto.includes("alquiler")
        || texto.includes("tempor")
        || texto.includes("inmobili")
    ){
        return "alquileres";
    }

    if(
        texto.includes("servicio")
        || texto.includes("servicios")
    ){
        return "servicios";
    }

    return texto;

}


/* =========================================================
   NORMALIZAR CLAVE DE PERMISO
========================================================= */

function normalizarClave(clave){

    if(!clave){
        return "";
    }

    return String(clave)
        .trim();

}


/* =========================================================
   LEER PERMISO ANIDADO
========================================================= */

function leerPermiso(objeto,ruta){

    if(!objeto || !ruta){
        return false;
    }

    const partes =
        ruta.split(".");

    let actual =
        objeto;

    for(const parte of partes){

        if(
            actual === null
            ||
            actual === undefined
        ){
            return false;
        }

        if(
            typeof actual !== "object"
            ||
            !(parte in actual)
        ){
            return false;
        }

        actual =
            actual[parte];

    }

    return actual === true;

}


/* =========================================================
   PERMISO CON SOPORTE PLANO / ANIDADO
========================================================= */

function tienePermiso(clave){

    const permisos =
        datosEmpleado?.permisos || {};

    const normalizada =
        normalizarClave(clave);

    if(!normalizada){
        return false;
    }

    /* formato anidado */

    if(
        normalizada.includes(".")
        &&
        leerPermiso(permisos,normalizada)
    ){
        return true;
    }

    /* formato plano */

    if(
        permisos[normalizada] === true
    ){
        return true;
    }

    return false;

}


/* =========================================================
   PERMISOS LEGACY
========================================================= */

function usarPermisosLegacy(){

    /*
       IMPORTANTE:

       Si el administrador configuró permisos
       explícitamente, aunque estén todos en false,
       NO se aplica ningún permiso automático.

       Sólo se usan estos valores para empleados
       antiguos que todavía no tengan configuración.
    */

    if(
        datosEmpleado?.permisosConfigurados === true
    ){
        return;
    }

    const permisos =
        datosEmpleado?.permisos || {};

    if(
        Object.keys(permisos).length > 0
    ){
        return;
    }

    permisos.fichaje = true;
    permisos.comunicacion = true;
    permisos.perfil = true;
    permisos.notificaciones = true;
    permisos.personalizar = true;

    if(
        datosEmpleado?.tipoEmpleado === "chofer"
        ||
        datosEmpleado?.esChofer === true
    ){
        permisos.modoChofer = true;
        permisos.viajes = true;
        permisos.hojaRuta = true;
    }

    datosEmpleado.permisos =
        permisos;

}


/* =========================================================
   CREAR TARJETA
========================================================= */

function crearModulo(
    clave,
    modulo,
    claseExtra = ""
){

    const tarjeta =
        document.createElement("div");

    tarjeta.className =
        `modulo ${claseExtra}`;

    tarjeta.dataset.permiso =
        clave;

    tarjeta.innerHTML = `

        <div class="modulo-icono">
            ${modulo.icono || "📌"}
        </div>

        <div class="modulo-titulo">
            ${modulo.titulo}
        </div>

        <div class="modulo-descripcion">
            ${modulo.descripcion || ""}
        </div>

    `;

    tarjeta.addEventListener(
        "click",
        () => {

            /*
               Se vuelve a comprobar el permiso
               antes de navegar.
            */

            if(!tienePermiso(clave)){

                mostrarMensaje(
                    "No tenés permiso para acceder a este módulo.",
                    "error"
                );

                return;
            }

            if(
                !modulo.url
                ||
                modulo.url === "#"
            ){

                mostrarMensaje(
                    "Este módulo está habilitado pero todavía no tiene una pantalla conectada.",
                    "error"
                );

                return;
            }

            window.location.href =
                modulo.url;

        }
    );

    return tarjeta;

}


/* =========================================================
   AGREGAR MÓDULO
========================================================= */

function agregarModulo(
    contenedor,
    clave,
    claseExtra = ""
){

    if(!tienePermiso(clave)){
        return false;
    }

    const modulo =
        MODULOS[clave];

    if(!modulo){
        return false;
    }

    contenedor.appendChild(
        crearModulo(
            clave,
            modulo,
            claseExtra
        )
    );

    return true;

}


/* =========================================================
   CARGAR MI TRABAJO
========================================================= */

function cargarTrabajo(){

    const grid =
        document.getElementById("gridTrabajo");

    grid.innerHTML = "";

    let cantidad = 0;

    [
        "fichaje",
        "tareas",
        "trabajos",
        "fotos"
    ].forEach(clave => {

        if(
            agregarModulo(
                grid,
                clave
            )
        ){
            cantidad++;
        }

    });

    document.getElementById(
        "seccionTrabajo"
    ).style.display =
        cantidad > 0
        ? "block"
        : "none";

    return cantidad;

}


/* =========================================================
   CARGAR RUBRO
========================================================= */

function cargarRubro(){

    const grid =
        document.getElementById("gridRubro");

    grid.innerHTML = "";

    const rubro =
        normalizarRubro(
            datosEmpleado?.rubro
        );

    if(!rubro){
        document.getElementById(
            "seccionRubro"
        ).style.display = "none";

        return 0;
    }

    const nombre =
        NOMBRES_RUBRO[rubro]
        ||
        rubro.charAt(0).toUpperCase()
        +
        rubro.slice(1);

    const icono =
        ICONOS_RUBRO[rubro]
        ||
        "📊";

    document.getElementById(
        "tituloRubro"
    ).textContent =
        `${icono} ${nombre}`;

    let cantidad = 0;

    const prefijo =
        `${rubro}.`;

    Object.keys(MODULOS).forEach(clave => {

        if(
            !clave.startsWith(prefijo)
        ){
            return;
        }

        if(
            agregarModulo(
                grid,
                clave,
                "rubro"
            )
        ){
            cantidad++;
        }

    });

    document.getElementById(
        "seccionRubro"
    ).style.display =
        cantidad > 0
        ? "block"
        : "none";

    return cantidad;

}


/* =========================================================
   CARGAR TRANSPORTE
========================================================= */

function cargarTransporte(){

    const grid =
        document.getElementById(
            "gridTransporte"

    grid.innerHTML = "";

    let cantidad = 0;

    [
        "modoChofer",

       transporte.* si fueron otorgados.
    */

    const rubro =
        normalizarRubro(
            datosEmpleado?.rubro
        );

    if(
        rubro === "transporte"
    ){

        Object.keys(MODULOS)
            .filter(
                clave =>
                    clave.startsWith(

                    )
            )
            .forEach(clave => {

                if(
                    agregarModulo(
                        grid,
                        clave,
                        "transporte"
                    )
                ){
                    cantidad++;

            });

    }

    document.getElementById(
        "seccionTransporte"
    ).style.display =
        cantidad > 0
        ? "block"
        : "none";

    return cantidad;

}

/* =========================================================

========================================================= */

function cargarPanel(){

    usarPermisosLegacy();

    total += cargarTrabajo();

/* =========================================================
   ACTUALIZAR SESIÓN
========================================================= */

function actualizarSesion(){

    if(!datosEmpleado){
        return;
    }

    sesionEmpleado = {

        uid:
            usuarioActual?.uid || "",

        empleadoId:
            datosEmpleado.id || "",

        empresaId:
            datosEmpleado.empresaId || "",

        perfil:
            "empleado",

        tipoEmpleado:
            datosEmpleado.tipoEmpleado || "empleado",

        esChofer:
            datosEmpleado.tipoEmpleado === "chofer"
            ||
            datosEmpleado.esChofer === true,

        nombre:
            datosEmpleado.nombre || "",

        apellido:
            datosEmpleado.apellido || "",

        email:
            datosEmpleado.email
            ||
            usuarioActual?.email
            ||
            "",

        puesto:
            datosEmpleado.puesto || "",

        rol:
            datosEmpleado.rol || "",

        rubro:
            datosEmpleado.rubro || "",

        pagoDiario:
            datosEmpleado.pagoDiario || 0,

        unidadId:
            datosEmpleado.unidadId || "",

        licencia:
            datosEmpleado.licencia || "",

        categoriaLicencia:
            datosEmpleado.categoriaLicencia || "",

        permisos:
            datosEmpleado.permisos || {},

        permisosConfigurados:
            datosEmpleado.permisosConfigurados === true,

        passwordTemporal:
            datosEmpleado.passwordTemporal === true

    };

    sessionStorage.setItem(
        "gesbaseEmpleado",
        JSON.stringify(
            sesionEmpleado
        )
    );

}

   MOSTRAR DATOS
========================================================= */

function mostrarDatos(){

        `${datosEmpleado.nombre || ""} ${datosEmpleado.apellido || ""}`

    nombreEmpleado.textContent =
        nombre || "Empleado";

}


/* =========================================================
   BUSCAR EMPRESA DEL EMPLEADO
========================================================= */

async function verificarEmpresa(){

    const empresaId =
        datosEmpleado?.empresaId;

    if(!empresaId){
        return false;
    }

    try{

        const empresaSnap =
            await getDoc(
                doc(
                    db,
                    "empresas",
                    empresaId
                )
            );

        if(
            !empresaSnap.exists()
        ){
            return false;
        }

        const empresa =
            empresaSnap.data();

        /*
           Si el empleado no tiene rubro,
           usamos el rubro de la empresa.
        */

        if(
            !datosEmpleado.rubro
        ){

            datosEmpleado.rubro =
                empresa.rubro
                ||
                empresa.tipoRubro
                ||
                empresa.tipoNegocio
                ||
                empresa.actividad
                ||
                "";

        }

        return true;

    }catch(error){

        console.error(
            "Error verificando empresa:",
            error
        );

        return false;

    }

}


/* =========================================================
   CARGAR EMPLEADO
========================================================= */

async function cargarEmpleado(){

    if(!usuarioActual){
        throw new Error(
            "No hay usuario autenticado."
        );
    }

    const sesionGuardada =
        sessionStorage.getItem(
            "gesbaseEmpleado"
        );

    if(!sesionGuardada){

        throw new Error(
            "No existe una sesión de empleado."
        );

    }

    let sesionGuardadaObj;

    try{

        sesionGuardadaObj =
            JSON.parse(
                sesionGuardada
            );

    }catch(error){

        sessionStorage.removeItem(
            "gesbaseEmpleado"
        );

        throw new Error(
            "La sesión del empleado es inválida."
        );

    }


    const empleadoId =
        sesionGuardadaObj.empleadoId;

    if(!empleadoId){

        throw new Error(
            "No se encontró el empleado."
        );

    }


    /*
       Siempre volvemos a Firestore.

       Esto es importante porque si el administrador
       cambia los permisos, el panel recibe los nuevos
       permisos sin depender solamente de sessionStorage.
    */

    const empleadoSnap =
        await getDoc(
            doc(
                db,
                "empleados",
                empleadoId
            )
        );


    if(
        !empleadoSnap.exists()
    ){

        throw new Error(
            "El empleado ya no existe."
        );

    }


    datosEmpleado = {

        id:
            empleadoSnap.id,

        ...empleadoSnap.data()

    };


    /* =========================
       VALIDAR EMPRESA
    ========================== */

    if(
        !datosEmpleado.empresaId
    ){

        throw new Error(
            "El empleado no tiene empresa asignada."
        );

    }


    /* =========================
       VALIDAR ESTADO
    ========================== */

    if(
        datosEmpleado.estado
        &&
        String(
            datosEmpleado.estado
        ).toLowerCase()
        !== "activo"
    ){

        throw new Error(
            "Tu acceso se encuentra inactivo. Consultá con el administrador."
        );

    }


    /* =========================
       VALIDAR AUTH UID
    ========================== */

    if(
        datosEmpleado.authUid
        &&
        datosEmpleado.authUid
        !== usuarioActual.uid
    ){

        throw new Error(
            "Esta cuenta no está vinculada correctamente al empleado."
        );

    }


    /* =========================
       EMPRESA
    ========================== */

    const empresaValida =
        await verificarEmpresa();

    if(!empresaValida){

        throw new Error(
            "No se pudo verificar la empresa."
        );

    }


    /*
       Si el empleado no tiene rubro propio,
       queda utilizando el de la empresa.
    */

    datosEmpleado.rubro =
        normalizarRubro(
            datosEmpleado.rubro
        );


    /* =========================
       ACTUALIZAR SESIÓN
    ========================== */

    actualizarSesion();

    mostrarDatos();

    cargarPanel();

}


/* =========================================================
   CERRAR SESIÓN
========================================================= */

async function cerrarSesion(){

    try{

        await signOut(auth);

    }catch(error){

        console.error(
            "Error cerrando sesión:",
            error
        );

    }

    sessionStorage.removeItem(
        "gesbaseEmpleado"
    );

    window.location.href =
        "acceso-empleado.html";

}


/* =========================================================
   MENSAJES
========================================================= */

let timeoutMensaje = null;

function mostrarMensaje(
    texto,
    tipo = ""
){

    mensaje.textContent =
        texto;

    mensaje.className =
        `mensaje ${tipo}`;

    mensaje.style.display =
        "block";

    clearTimeout(
        timeoutMensaje
    );

    timeoutMensaje =
        setTimeout(
            () => {

                mensaje.style.display =
                    "none";

            },
            3500
        );

}


/* =========================================================
   BOTÓN SALIR
========================================================= */

document
    .getElementById("btnSalir")
    .addEventListener(
        "click",
        cerrarSesion
    );


/* =========================================================
   AUTENTICACIÓN
========================================================= */

onAuthStateChanged(
    auth,
    async usuario => {

        try{

            if(!usuario){

                sessionStorage.removeItem(
                    "gesbaseEmpleado"
                );

                window.location.href =
                    "acceso-empleado.html";

                return;

            }


            usuarioActual =
                usuario;


            await cargarEmpleado();


            loading.style.display =
                "none";

            app.style.display =
                "block";


        }catch(error){

            console.error(
                "Error cargando panel de empleado:",
                error
            );

            loading.style.display =
                "none";

            app.style.display =
                "block";

            mostrarMensaje(
                error.message
                ||
                "No se pudo cargar el panel.",
                "error"
            );


            /*
               Si el acceso es inválido,
               volvemos al login después de un momento.
            */

            setTimeout(
                () => {

                    sessionStorage.removeItem(
                        "gesbaseEmpleado"
                    );

                    window.location.href =
                        "acceso-empleado.html";

                },
                2500
            );

        }

    }
);
