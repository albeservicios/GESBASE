<!DOCTYPE html>
<html lang="es">

<head>

<meta charset="UTF-8">

<meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
>

<meta
    name="theme-color"
    content="#111827"
>

<title>Nuevo cliente - GESBASE</title>


<style>

*{
    box-sizing:border-box;
    margin:0;
    padding:0;
}

body{
    font-family:Arial,sans-serif;
    background:#f3f4f6;
    color:#111827;
}

.contenedor{
    max-width:700px;
    margin:auto;
    min-height:100vh;
    background:white;
}

header{
    background:#111827;
    color:white;
    padding:25px 20px;
}

header h1{
    font-size:25px;
}

header p{
    margin-top:6px;
    color:#d1d5db;
    font-size:14px;
}

main{
    padding:20px;
}

.usuario{
    background:#f3f4f6;
    padding:13px;
    border-radius:10px;
    margin-bottom:18px;
    font-size:14px;
}

.formulario{
    border:1px solid #d1d5db;
    border-radius:14px;
    padding:20px;
    background:white;
}

.seccion{
    margin-bottom:22px;
}

.seccion-titulo{
    font-size:16px;
    font-weight:bold;
    margin-bottom:14px;
    padding-bottom:7px;
    border-bottom:1px solid #d1d5db;
}

.campo{
    margin-bottom:15px;
}

label{
    display:block;
    font-size:14px;
    font-weight:bold;
    margin-bottom:6px;
}

input,
select,
textarea{
    width:100%;
    padding:13px;
    border:1px solid #d1d5db;
    border-radius:9px;
    font-size:15px;
    font-family:Arial,sans-serif;
    outline:none;
    background:white;
}

input:focus,
select:focus,
textarea:focus{
    border-color:#2563eb;
}

textarea{
    min-height:110px;
    resize:vertical;
}

.ayuda{
    font-size:12px;
    color:#6b7280;
    margin-top:5px;
}

.obligatorio{
    color:#dc2626;
}

.botones{
    margin-top:20px;
}

.boton{
    display:block;
    width:100%;
    padding:15px;
    border:none;
    border-radius:10px;
    font-size:16px;
    font-weight:bold;
    cursor:pointer;
    text-align:center;
    text-decoration:none;
    margin-top:12px;
}

.guardar{
    background:#111827;
    color:white;
}

.guardar:disabled{
    background:#9ca3af;
    cursor:not-allowed;
}

.volver{
    background:#e5e7eb;
    color:#111827;
}

.error{
    display:none;
    background:#fee2e2;
    color:#991b1b;
    padding:14px;
    border-radius:10px;
    margin-bottom:15px;
    line-height:1.4;
}

.exito{
    display:none;
    background:#dcfce7;
    color:#166534;
    padding:14px;
    border-radius:10px;
    margin-bottom:15px;
    line-height:1.4;
}

.cargando{
    text-align:center;
    padding:35px;
    color:#6b7280;
}

.formulario-oculto{
    display:none;
}

@media(max-width:480px){

    main{
        padding:15px;
    }

    .formulario{
        padding:16px;
    }

}

</style>

</head>


<body>


<div class="contenedor">


<header>

<h1>
Nuevo cliente
</h1>

<p>
GESBASE
</p>

</header>


<main>


<div
    id="usuario"
    class="usuario"
>
Verificando usuario...
</div>


<div
    id="cargando"
    class="cargando"
>
Verificando acceso...
</div>


<div
    id="error"
    class="error"
></div>


<div
    id="exito"
    class="exito"
></div>


<div
    id="formulario"
    class="formulario formulario-oculto"
>


<!-- ================================= -->
<!-- DATOS DEL CLIENTE -->
<!-- ================================= -->

<div class="seccion">

<div class="seccion-titulo">
DATOS DEL CLIENTE
</div>


<div class="campo">

<label for="nombre">
Nombre / Empresa
<span class="obligatorio">*</span>
</label>

<input
    type="text"
    id="nombre"
    placeholder="Ej.: Juan Pérez / Empresa ABC"
    autocomplete="organization"
>

<div class="ayuda">
Ingresá el nombre del cliente o empresa.
</div>

</div>


<div class="campo">

<label for="cuit">
CUIT
</label>

<input
    type="text"
    id="cuit"
    placeholder="Ej.: 20-12345678-9"
    inputmode="numeric"
    autocomplete="off"
>

</div>


<div class="campo">

<label for="telefono">
Teléfono
</label>

<input
    type="tel"
    id="telefono"
    placeholder="Ej.: 299 1234567"
    autocomplete="tel"
>

</div>


<div class="campo">

<label for="email">
Email
</label>

<input
    type="email"
    id="email"
    placeholder="Ej.: cliente@email.com"
    autocomplete="email"
>

</div>

</div>


<!-- ================================= -->
<!-- UBICACIÓN -->
<!-- ================================= -->

<div class="seccion">

<div class="seccion-titulo">
UBICACIÓN
</div>


<div class="campo">

<label for="direccion">
Dirección
</label>

<input
    type="text"
    id="direccion"
    placeholder="Ej.: Av. San Martín 123"
    autocomplete="street-address"
>

</div>


<div class="campo">

<label for="provincia">
Provincia
</label>

<select id="provincia">

<option value="">
Seleccionar provincia
</option>

<option value="Buenos Aires">
Buenos Aires
</option>

<option value="Catamarca">
Catamarca
</option>

<option value="Chaco">
Chaco
</option>

<option value="Chubut">
Chubut
</option>

<option value="Córdoba">
Córdoba
</option>

<option value="Corrientes">
Corrientes
</option>

<option value="Entre Ríos">
Entre Ríos
</option>

<option value="Formosa">
Formosa
</option>

<option value="Jujuy">
Jujuy
</option>

<option value="La Pampa">
La Pampa
</option>

<option value="La Rioja">
La Rioja
</option>

<option value="Mendoza">
Mendoza
</option>

<option value="Misiones">
Misiones
</option>

<option value="Neuquén">
Neuquén
</option>

<option value="Río Negro">
Río Negro
</option>

<option value="Salta">
Salta
</option>

<option value="San Juan">
San Juan
</option>

<option value="San Luis">
San Luis
</option>

<option value="Santa Cruz">
Santa Cruz
</option>

<option value="Santa Fe">
Santa Fe
</option>

<option value="Santiago del Estero">
Santiago del Estero
</option>

<option value="Tierra del Fuego">
Tierra del Fuego
</option>

<option value="Tucumán">
Tucumán
</option>

</select>

</div>


<div class="campo">

<label for="localidad">
Localidad
</label>

<input
    type="text"
    id="localidad"
    placeholder="Ej.: Catriel"
    autocomplete="address-level2"
>

</div>

</div>


<!-- ================================= -->
<!-- OBSERVACIONES -->
<!-- ================================= -->

<div class="seccion">

<div class="seccion-titulo">
OBSERVACIONES
</div>


<div class="campo">

<label for="observaciones">
Observaciones
</label>

<textarea
    id="observaciones"
    placeholder="Información adicional del cliente..."
></textarea>

</div>

</div>


<!-- ================================= -->
<!-- BOTONES -->
<!-- ================================= -->

<div class="botones">

<button
    type="button"
    id="btnGuardar"
    class="boton guardar"
>
💾 GUARDAR CLIENTE
</button>


<a
    href="clientes.html"
    class="boton volver"
>
⬅️ VOLVER A CLIENTES
</a>

</div>


</div>


</main>

</div>


<script type="module">


// ==========================================
// FIREBASE
// ==========================================

import {
    auth,
    db
} from "./Js/firebase.js";


import {
    onAuthStateChanged
} from
"https://www.gstatic.com/firebasejs/12.1.0/firebase-auth.js";


import {
    collection,
    addDoc,
    serverTimestamp
} from
"https://www.gstatic.com/firebasejs/12.1.0/firebase-firestore.js";


// ==========================================
// ELEMENTOS
// ==========================================

const usuarioElemento =
document.getElementById("usuario");

const cargando =
document.getElementById("cargando");

const formulario =
document.getElementById("formulario");

const errorElemento =
document.getElementById("error");

const exitoElemento =
document.getElementById("exito");

const btnGuardar =
document.getElementById("btnGuardar");


const nombre =
document.getElementById("nombre");

const cuit =
document.getElementById("cuit");

const telefono =
document.getElementById("telefono");

const email =
document.getElementById("email");

const direccion =
document.getElementById("direccion");

const provincia =
document.getElementById("provincia");

const localidad =
document.getElementById("localidad");

const observaciones =
document.getElementById("observaciones");


// ==========================================
// USUARIO ACTUAL
// ==========================================

let usuarioActual = null;


// ==========================================
// MOSTRAR ERROR
// ==========================================

function mostrarError(mensaje){

    exitoElemento.style.display =
    "none";

    errorElemento.textContent =
    mensaje;

    errorElemento.style.display =
    "block";

}


// ==========================================
// MOSTRAR ÉXITO
// ==========================================

function mostrarExito(mensaje){

    errorElemento.style.display =
    "none";

    exitoElemento.textContent =
    mensaje;

    exitoElemento.style.display =
    "block";

}


// ==========================================
// LIMPIAR MENSAJES
// ==========================================

function limpiarMensajes(){

    errorElemento.style.display =
    "none";

    exitoElemento.style.display =
    "none";

}


// ==========================================
// GUARDAR CLIENTE
// ==========================================

async function guardarCliente(){

    limpiarMensajes();


    if(!usuarioActual){

        mostrarError(
            "No hay un usuario autenticado."
        );

        return;

    }


    // ======================================
    // DATOS
    // ======================================

    const nombreValor =
    nombre.value.trim();


    const cuitValor =
    cuit.value.trim();


    const telefonoValor =
    telefono.value.trim();


    const emailValor =
    email.value.trim();


    const direccionValor =
    direccion.value.trim();


    const provinciaValor =
    provincia.value;


    const localidadValor =
    localidad.value.trim();


    const observacionesValor =
    observaciones.value.trim();


    // ======================================
    // VALIDACIÓN
    // ======================================

    if(!nombreValor){

        mostrarError(
            "Ingresá el nombre del cliente o empresa."
        );

        nombre.focus();

        return;

    }


    // ======================================
    // BOTÓN
    // ======================================

    btnGuardar.disabled =
    true;

    btnGuardar.textContent =
    "⏳ GUARDANDO CLIENTE...";


    try{


        // ==================================
        // GUARDAR EN FIRESTORE
        // ==================================

        const referencia =
        collection(
            db,
            "clientes"
        );


        const nuevoCliente = {

            nombre:
            nombreValor,

            cuit:
            cuitValor,

            telefono:
            telefonoValor,

            email:
            emailValor,

            direccion:
            direccionValor,

            provincia:
            provinciaValor,

            localidad:
            localidadValor,

            observaciones:
            observacionesValor,

            uid:
            usuarioActual.uid,

            creado:
            serverTimestamp()

        };


        const resultado =
        await addDoc(
            referencia,
            nuevoCliente
        );


        console.log(
            "Cliente creado:",
            resultado.id
        );


        // ==================================
        // ÉXITO
        // ==================================

        mostrarExito(
            "Cliente guardado correctamente."
        );


        btnGuardar.textContent =
        "✅ CLIENTE GUARDADO";


        // ==================================
        // VOLVER A CLIENTES
        // ==================================

        setTimeout(
            function(){

                window.location.href =
                "clientes.html";

            },
            1000
        );


    }
    catch(error){

        console.error(
            "Error guardando cliente:",
            error
        );


        mostrarError(
            "No se pudo guardar el cliente:\n" +
            error.message
        );


        btnGuardar.disabled =
        false;


        btnGuardar.textContent =
        "💾 GUARDAR CLIENTE";

    }

}


// ==========================================
// BOTÓN GUARDAR
// ==========================================

btnGuardar.addEventListener(
    "click",
    guardarCliente
);


// ==========================================
// AUTENTICACIÓN
// ==========================================

onAuthStateChanged(
    auth,
    function(usuario){

        if(!usuario){

            window.location.replace(
                "login.html"
            );

            return;

        }


        usuarioActual =
        usuario;


        usuarioElemento.textContent =
        "Usuario: " +
        (
            usuario.email ||
            "Usuario autenticado"
        );


        cargando.style.display =
        "none";


        formulario.classList.remove(
            "formulario-oculto"
        );

    }
);

</script>


</body>

</html>
