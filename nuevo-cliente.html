<!DOCTYPE html>
<html lang="es">

<head>

<meta charset="UTF-8">

<meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
>

<meta
    name="theme-color"
    content="#111827"
>

<meta
    name="description"
    content="GESBASE - Nuevo cliente"
>

<title>Nuevo cliente - GESBASE</title>

<style>

*{
    box-sizing:border-box;
    margin:0;
    padding:0;
}

body{
    font-family:Arial,sans-serif;
    background:#f3f4f6;
    color:#111827;
    min-height:100vh;
}

.contenedor{
    width:100%;
    max-width:700px;
    margin:auto;
    min-height:100vh;
    background:#fff;
}

header{
    background:#111827;
    color:white;
    padding:25px 20px;
}

.header-superior{
    display:flex;
    align-items:center;
    gap:12px;
}

.btn-volver{
    width:42px;
    height:42px;
    border:none;
    border-radius:10px;
    background:rgba(255,255,255,.12);
    color:white;
    font-size:22px;
    cursor:pointer;
}

header h1{
    font-size:25px;
}

header p{
    margin-top:6px;
    margin-left:54px;
    color:#d1d5db;
    font-size:14px;
}

main{
    padding:20px;
}

.usuario{
    background:#f3f4f6;
    padding:13px;
    border-radius:10px;
    margin-bottom:18px;
    font-size:14px;
    word-break:break-word;
}

.formulario{
    border:1px solid #d1d5db;
    border-radius:14px;
    padding:20px;
    background:white;
}

.seccion{
    margin-bottom:22px;
}

.seccion-titulo{
    font-size:16px;
    font-weight:bold;
    margin-bottom:14px;
    padding-bottom:7px;
    border-bottom:1px solid #d1d5db;
}

.campo{
    margin-bottom:15px;
}

label{
    display:block;
    font-size:14px;
    font-weight:bold;
    margin-bottom:6px;
}

input,
select,
textarea{
    width:100%;
    padding:13px;
    border:1px solid #d1d5db;
    border-radius:9px;
    font-size:15px;
    font-family:Arial,sans-serif;
    outline:none;
    background:white;
    color:#111827;
}

input:focus,
select:focus,
textarea:focus{
    border-color:#2563eb;
}

textarea{
    min-height:110px;
    resize:vertical;
}

.ayuda{
    font-size:12px;
    color:#6b7280;
    margin-top:5px;
    line-height:1.4;
}

.obligatorio{
    color:#dc2626;
}

.botones{
    margin-top:20px;
}

.boton{
    display:block;
    width:100%;
    padding:15px;
    border:none;
    border-radius:10px;
    font-size:16px;
    font-weight:bold;
    cursor:pointer;
    text-align:center;
    text-decoration:none;
    margin-top:12px;
}

.guardar{
    background:#111827;
    color:white;
}

.guardar:disabled{
    background:#9ca3af;
    cursor:not-allowed;
}

.volver{
    background:#e5e7eb;
    color:#111827;
}

.error,
.exito{
    display:none;
    padding:14px;
    border-radius:10px;
    margin-bottom:15px;
    line-height:1.4;
    white-space:pre-line;
    word-break:break-word;
}

.error{
    background:#fee2e2;
    color:#991b1b;
    border:1px solid #fecaca;
}

.exito{
    background:#dcfce7;
    color:#166534;
    border:1px solid #bbf7d0;
}

.cargando{
    text-align:center;
    padding:35px;
    color:#6b7280;
}

.formulario-oculto{
    display:none;
}

@media(max-width:480px){

    main{
        padding:15px;
    }

    .formulario{
        padding:16px;
    }

    header{
        padding:20px 15px;
    }

    header h1{
        font-size:23px;
    }

}

</style>

</head>

<body>

<div class="contenedor">

<header>

<div class="header-superior">

<button
    type="button"
    class="btn-volver"
    id="btnVolver"
    aria-label="Volver"
>
←
</button>

<h1>
Nuevo cliente
</h1>

</div>

<p>
GESBASE
</p>

</header>

<main>

<div
    id="usuario"
    class="usuario"
>
Verificando usuario...
</div>

<div
    id="cargando"
    class="cargando"
>
Verificando acceso...
</div>

<div
    id="error"
    class="error"
></div>

<div
    id="exito"
    class="exito"
></div>

<div
    id="formulario"
    class="formulario formulario-oculto"
>

<!-- ================================= -->
<!-- DATOS DEL CLIENTE -->
<!-- ================================= -->

<div class="seccion">

<div class="seccion-titulo">
DATOS DEL CLIENTE
</div>

<div class="campo">

<label for="nombre">

Nombre / Empresa

<span class="obligatorio">*</span>

</label>

<input
    type="text"
    id="nombre"
    placeholder="Ej.: Juan Pérez / Empresa ABC"
    autocomplete="organization"
    required
>

<div class="ayuda">
Ingresá el nombre del cliente o empresa.
</div>

</div>

<div class="campo">

<label for="cuit">
CUIT
</label>

<input
    type="text"
    id="cuit"
    placeholder="Ej.: 20-12345678-9"
    inputmode="numeric"
    autocomplete="off"
>

</div>

<div class="campo">

<label for="telefono">
Teléfono
</label>

<input
    type="tel"
    id="telefono"
    placeholder="Ej.: 299 1234567"
    autocomplete="tel"
>

</div>

<div class="campo">

<label for="email">
Email
</label>

<input
    type="email"
    id="email"
    placeholder="Ej.: cliente@email.com"
    autocomplete="email"
>

</div>

</div>


<!-- ================================= -->
<!-- UBICACIÓN -->
<!-- ================================= -->

<div class="seccion">

<div class="seccion-titulo">
UBICACIÓN
</div>

<div class="campo">

<label for="direccion">
Dirección
</label>

<input
    type="text"
    id="direccion"
    placeholder="Ej.: Av. San Martín 123"
    autocomplete="street-address"
>

</div>

<div class="campo">

<label for="provincia">
Provincia
</label>

<select id="provincia">

<option value="">
Seleccionar provincia
</option>

<option value="Buenos Aires">Buenos Aires</option>
<option value="Catamarca">Catamarca</option>
<option value="Chaco">Chaco</option>
<option value="Chubut">Chubut</option>
<option value="Córdoba">Córdoba</option>
<option value="Corrientes">Corrientes</option>
<option value="Entre Ríos">Entre Ríos</option>
<option value="Formosa">Formosa</option>
<option value="Jujuy">Jujuy</option>
<option value="La Pampa">La Pampa</option>
<option value="La Rioja">La Rioja</option>
<option value="Mendoza">Mendoza</option>
<option value="Misiones">Misiones</option>
<option value="Neuquén">Neuquén</option>
<option value="Río Negro">Río Negro</option>
<option value="Salta">Salta</option>
<option value="San Juan">San Juan</option>
<option value="San Luis">San Luis</option>
<option value="Santa Cruz">Santa Cruz</option>
<option value="Santa Fe">Santa Fe</option>
<option value="Santiago del Estero">Santiago del Estero</option>
<option value="Tierra del Fuego">Tierra del Fuego</option>
<option value="Tucumán">Tucumán</option>

</select>

</div>

<div class="campo">

<label for="localidad">
Localidad
</label>

<input
    type="text"
    id="localidad"
    placeholder="Ej.: Catriel"
    autocomplete="address-level2"
>

</div>

</div>


<!-- ================================= -->
<!-- OBSERVACIONES -->
<!-- ================================= -->

<div class="seccion">

<div class="seccion-titulo">
OBSERVACIONES
</div>

<div class="campo">

<label for="observaciones">
Observaciones
</label>

<textarea
    id="observaciones"
    placeholder="Información adicional del cliente..."
></textarea>

</div>

</div>


<!-- ================================= -->
<!-- BOTONES -->
<!-- ================================= -->

<div class="botones">

<button
    type="button"
    id="btnGuardar"
    class="boton guardar"
>
💾 GUARDAR CLIENTE
</button>

<button
    type="button"
    id="btnVolverClientes"
    class="boton volver"
>
⬅️ VOLVER A CLIENTES
</button>

</div>

</div>

</main>

</div>


<script type="module">

// ==========================================
// FIREBASE
// ==========================================

import {
    auth,
    db
} from "./Js/firebase.js";

import {
    onAuthStateChanged
} from
"https://www.gstatic.com/firebasejs/12.18.0/firebase-auth.js";

import {
    doc,
    getDoc,
    collection,
    addDoc,
    serverTimestamp
} from
"https://www.gstatic.com/firebasejs/12.18.0/firebase-firestore.js";


// ==========================================
// ELEMENTOS
// ==========================================

const usuarioElemento =
document.getElementById("usuario");

const cargando =
document.getElementById("cargando");

const formulario =
document.getElementById("formulario");

const errorElemento =
document.getElementById("error");

const exitoElemento =
document.getElementById("exito");

const btnGuardar =
document.getElementById("btnGuardar");

const btnVolver =
document.getElementById("btnVolver");

const btnVolverClientes =
document.getElementById("btnVolverClientes");

const nombre =
document.getElementById("nombre");

const cuit =
document.getElementById("cuit");

const telefono =
document.getElementById("telefono");

const email =
document.getElementById("email");

const direccion =
document.getElementById("direccion");

const provincia =
document.getElementById("provincia");

const localidad =
document.getElementById("localidad");

const observaciones =
document.getElementById("observaciones");


// ==========================================
// VARIABLES
// ==========================================

let usuarioActual = null;

let datosUsuarioActual = {};

let empresaIdActual = "";


// ==========================================
// MENSAJES
// ==========================================

function mostrarError(texto){

    exitoElemento.style.display =
    "none";

    errorElemento.textContent =
    texto;

    errorElemento.style.display =
    "block";

}

function mostrarExito(texto){

    errorElemento.style.display =
    "none";

    exitoElemento.textContent =
    texto;

    exitoElemento.style.display =
    "block";

}

function limpiarMensajes(){

    errorElemento.style.display =
    "none";

    exitoElemento.style.display =
    "none";

    errorElemento.textContent =
    "";

    exitoElemento.textContent =
    "";

}


// ==========================================
// OBTENER DATOS DEL USUARIO
// ==========================================

async function cargarDatosUsuario(usuario){

    datosUsuarioActual = {};

    try{

        const referenciaUsuario =
        doc(
            db,
            "usuarios",
            usuario.uid
        );

        const documentoUsuario =
        await getDoc(
            referenciaUsuario
        );

        if(
            documentoUsuario.exists()
        ){

            datosUsuarioActual =
            documentoUsuario.data();

        }

    }
    catch(error){

        console.warn(
            "No se pudo cargar el documento del usuario:",
            error
        );

    }


    /*
     * GESBASE utiliza empresaId para
     * separar los datos de cada empresa.
     *
     * Compatibilidad con estructuras
     * anteriores:
     *
     * empresaId
     * empresa
     * uid
     */

    empresaIdActual =
    String(
        datosUsuarioActual.empresaId ||
        datosUsuarioActual.empresa ||
        usuario.uid
    ).trim();


    return empresaIdActual;

}


// ==========================================
// GUARDAR CLIENTE
// ==========================================

async function guardarCliente(){

    limpiarMensajes();


    if(!usuarioActual){

        mostrarError(
            "No hay un usuario autenticado."
        );

        return;

    }


    if(!empresaIdActual){

        mostrarError(
            "No se pudo identificar la empresa de tu cuenta."
        );

        return;

    }


    // ======================================
    // DATOS
    // ======================================

    const nombreValor =
    nombre.value.trim();

    const cuitValor =
    cuit.value.trim();

    const telefonoValor =
    telefono.value.trim();

    const emailValor =
    email.value.trim();

    const direccionValor =
    direccion.value.trim();

    const provinciaValor =
    provincia.value;

    const localidadValor =
    localidad.value.trim();

    const observacionesValor =
    observaciones.value.trim();


    // ======================================
    // VALIDACIÓN
    // ======================================

    if(!nombreValor){

        mostrarError(
            "Ingresá el nombre del cliente o empresa."
        );

        nombre.focus();

        return;

    }


    // ======================================
    // VALIDACIÓN EMAIL
    // ======================================

    if(emailValor){

        const emailValido =
        /^[^\s@]+@[^\s@]+\.[^\s@]+$/
        .test(emailValor);

        if(!emailValido){

            mostrarError(
                "Ingresá un email válido."
            );

            email.focus();

            return;

        }

    }


    // ======================================
    // BOTÓN
    // ======================================

    btnGuardar.disabled =
    true;

    btnGuardar.textContent =
    "⏳ GUARDANDO CLIENTE...";


    try{

        // ==================================
        // DATOS DEL CLIENTE
        // ==================================

        const nuevoCliente = {

            empresaId:
                empresaIdActual,

            nombre:
                nombreValor,

            cuit:
                cuitValor,

            telefono:
                telefonoValor,

            email:
                emailValor,

            direccion:
                direccionValor,

            provincia:
                provinciaValor,

            localidad:
                localidadValor,

            observaciones:
                observacionesValor,

            usuarioId:
                usuarioActual.uid,

            uid:
                usuarioActual.uid,

            creado:
                serverTimestamp(),

            creadoEn:
                serverTimestamp()

        };


        // ==================================
        // GUARDAR
        // ==================================

        const referencia =
        collection(
            db,
            "clientes"
        );


        const resultado =
        await addDoc(
            referencia,
            nuevoCliente
        );


        console.log(
            "GESBASE - Cliente creado:",
            resultado.id
        );


        // ==================================
        // ÉXITO
        // ==================================

        mostrarExito(
            "✅ Cliente guardado correctamente."
        );


        btnGuardar.textContent =
        "✅ CLIENTE GUARDADO";


        // ==================================
        // REDIRECCIÓN
        // ==================================

        setTimeout(
            function(){

                window.location.replace(
                    "clientes.html"
                );

            },
            900
        );


    }
    catch(error){

        console.error(
            "GESBASE - Error guardando cliente:",
            error
        );


        let mensajeError =
        "No se pudo guardar el cliente.";


        if(
            error.code ===
            "permission-denied"
        ){

            mensajeError =
            "Firebase rechazó el guardado por permisos. Revisá las reglas de Firestore para la colección clientes.";

        }
        else if(
            error.code ===
            "unavailable"
        ){

            mensajeError =
            "Firebase no está disponible en este momento. Revisá tu conexión.";

        }
        else if(
            error.code ===
            "failed-precondition"
        ){

            mensajeError =
            "Firebase requiere una configuración adicional.";

        }
        else if(
            error.message
        ){

            mensajeError +=
            "\n\n" +
            error.message;

        }


        mostrarError(
            mensajeError
        );


        btnGuardar.disabled =
        false;

        btnGuardar.textContent =
        "💾 GUARDAR CLIENTE";

    }

}


// ==========================================
// BOTÓN GUARDAR
// ==========================================

btnGuardar.addEventListener(
    "click",
    guardarCliente
);


// ==========================================
// VOLVER
// ==========================================

function volverClientes(){

    window.location.href =
    "clientes.html";

}

btnVolver.addEventListener(
    "click",
    volverClientes
);

btnVolverClientes.addEventListener(
    "click",
    volverClientes
);


// ==========================================
// AUTENTICACIÓN
// ==========================================

onAuthStateChanged(
    auth,
    async function(usuario){

        if(!usuario){

            window.location.replace(
                "login.html"
            );

            return;

        }


        usuarioActual =
        usuario;


        try{

            // ==================================
            // CARGAR DATOS DE USUARIO
            // ==================================

            const empresaId =
            await cargarDatosUsuario(
                usuario
            );


            const nombreUsuario =
            datosUsuarioActual.nombre ||
            datosUsuarioActual.nombreCompleto ||
            usuario.displayName ||
            "Usuario";


            const nombreEmpresa =
            datosUsuarioActual.nombreEmpresa ||
            datosUsuarioActual.empresaNombre ||
            "";


            usuarioElemento.innerHTML =
            "<strong>Usuario:</strong> " +
            nombreUsuario +
            "<br>" +
            "<strong>Email:</strong> " +
            (
                usuario.email ||
                "Sin email"
            ) +
            (
                nombreEmpresa
                ? "<br><strong>Empresa:</strong> " +
                  nombreEmpresa
                : ""
            ) +
            "<br><strong>ID empresa:</strong> " +
            empresaId;


            // ==================================
            // MOSTRAR FORMULARIO
            // ==================================

            cargando.style.display =
            "none";

            formulario.classList.remove(
                "formulario-oculto"
            );


        }
        catch(error){

            console.error(
                "GESBASE - Error inicializando página:",
                error
            );


            cargando.style.display =
            "none";


            mostrarError(
                "No se pudo cargar la información de tu cuenta.\n\n" +
                (
                    error.message ||
                    "Error desconocido."
                )
            );

        }

    }
);

</script>

</body>

</html>
