<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#111827">

<title>Facturación - GESBASE</title>

<style>
*{
    box-sizing:border-box;
}

body{
    margin:0;
    font-family:Arial,Helvetica,sans-serif;
    background:#f3f4f6;
    color:#111827;
}

header{
    background:#111827;
    color:white;
    padding:20px;
    text-align:center;
}

header h1{
    margin:0;
    font-size:24px;
}

header p{
    margin:6px 0 0;
    color:#d1d5db;
}

.container{
    width:100%;
    max-width:1100px;
    margin:auto;
    padding:20px;
}

.card{
    background:white;
    border-radius:14px;
    padding:20px;
    margin-bottom:20px;
    box-shadow:0 3px 12px rgba(0,0,0,.08);
}

.card h2{
    margin-top:0;
    font-size:20px;
}

.grid{
    display:grid;
    grid-template-columns:repeat(2,1fr);
    gap:15px;
}

.field{
    display:flex;
    flex-direction:column;
}

.field.full{
    grid-column:1 / -1;
}

label{
    font-weight:bold;
    margin-bottom:6px;
}

input,
select{
    width:100%;
    padding:12px;
    border:1px solid #d1d5db;
    border-radius:8px;
    font-size:16px;
    background:white;
}

input:focus,
select:focus{
    outline:none;
    border-color:#2563eb;
}

.buttons{
    display:flex;
    gap:10px;
    flex-wrap:wrap;
    margin-top:18px;
}

button{
    border:0;
    border-radius:8px;
    padding:12px 18px;
    font-size:15px;
    font-weight:bold;
    cursor:pointer;
}

.btn-primary{
    background:#2563eb;
    color:white;
}

.btn-secondary{
    background:#374151;
    color:white;
}

.btn-danger{
    background:#dc2626;
    color:white;
}

.btn-success{
    background:#16a34a;
    color:white;
}

.resumen{
    display:grid;
    grid-template-columns:repeat(3,1fr);
    gap:15px;
}

.resumen-box{
    background:#f9fafb;
    border:1px solid #e5e7eb;
    border-radius:12px;
    padding:18px;
}

.resumen-box span{
    display:block;
    color:#6b7280;
    font-size:14px;
    margin-bottom:8px;
}

.resumen-box strong{
    font-size:24px;
}

.tabla-container{
    overflow-x:auto;
}

table{
    width:100%;
    border-collapse:collapse;
    min-width:850px;
}

th,
td{
    padding:12px;
    border-bottom:1px solid #e5e7eb;
    text-align:left;
}

th{
    background:#f9fafb;
}

.estado{
    display:inline-block;
    padding:5px 9px;
    border-radius:20px;
    font-size:13px;
    font-weight:bold;
}

.pendiente{
    background:#fef3c7;
    color:#92400e;
}

.vencida{
    background:#fee2e2;
    color:#991b1b;
}

.cobrada{
    background:#dcfce7;
    color:#166534;
}

.fecha-cobro{
    font-weight:bold;
}

.aviso{
    background:#eff6ff;
    border-left:4px solid #2563eb;
    padding:12px;
    margin-bottom:15px;
    border-radius:6px;
}

@media(max-width:700px){

    .grid{
        grid-template-columns:1fr;
    }

    .field.full{
        grid-column:auto;
    }

    .resumen{
        grid-template-columns:1fr;
    }

    .container{
        padding:12px;
    }

    .card{
        padding:15px;
    }

    button{
        width:100%;
    }
}
</style>
</head>

<body>

<header>
    <h1>🧾 GESBASE</h1>
    <p>Facturación y control de cobros</p>
</header>

<div class="container">

    <div class="card">

        <h2>➕ Nueva factura</h2>

        <div class="aviso">
            Seleccioná en cuántos días querés cobrar. GESBASE calculará automáticamente la fecha de cobro.
        </div>

        <form id="formFactura">

            <div class="grid">

                <div class="field">
                    <label for="numeroFactura">
                        Número de factura
                    </label>

                    <input
                        type="text"
                        id="numeroFactura"
                        placeholder="Ej: A-0002-00001234"
                        required
                    >
                </div>

                <div class="field">
                    <label for="fechaFactura">
                        Fecha de factura
                    </label>

                    <input
                        type="date"
                        id="fechaFactura"
                        required
                    >
                </div>

                <div class="field">
                    <label for="cliente">
                        Cliente
                    </label>

                    <input
                        type="text"
                        id="cliente"
                        placeholder="Nombre del cliente"
                        required
                    >
                </div>

                <div class="field">
                    <label for="cuit">
                        CUIT
                    </label>

                    <input
                        type="text"
                        id="cuit"
                        placeholder="CUIT del cliente"
                    >
                </div>

                <div class="field">
                    <label for="importe">
                        Importe total
                    </label>

                    <input
                        type="number"
                        id="importe"
                        min="0"
                        step="0.01"
                        placeholder="0.00"
                        required
                    >
                </div>

                <div class="field">
                    <label for="diasCobro">
                        Cobrar en
                    </label>

                    <select id="diasCobro" required>

                        <option value="1">
                            1 día
                        </option>

                        <option value="15">
                            15 días
                        </option>

                        <option value="30">
                            30 días
                        </option>

                        <option value="60">
                            60 días
                        </option>

                    </select>
                </div>

                <div class="field">
                    <label for="fechaCobro">
                        Fecha de cobro
                    </label>

                    <input
                        type="date"
                        id="fechaCobro"
                        readonly
                    >
                </div>

                <div class="field">
                    <label for="estado">
                        Estado
                    </label>

                    <select id="estado">

                        <option value="pendiente">
                            Pendiente
                        </option>

                        <option value="cobrada">
                            Cobrada
                        </option>

                    </select>
                </div>

                <div class="field full">
                    <label for="pdfFactura">
                        PDF de la factura
                    </label>

                    <input
                        type="file"
                        id="pdfFactura"
                        accept="application/pdf"
                    >
                </div>

            </div>

            <div class="buttons">

                <button
                    type="submit"
                    class="btn-primary"
                >
                    💾 Guardar factura
                </button>

                <button
                    type="button"
                    class="btn-secondary"
                    onclick="limpiarFormulario()"
                >
                    Limpiar
                </button>

            </div>

        </form>

    </div>


    <div class="card">

        <h2>📊 Resumen</h2>

        <div class="resumen">

            <div class="resumen-box">

                <span>
                    Facturado
                </span>

                <strong id="totalFacturado">
                    $ 0
                </strong>

            </div>

            <div class="resumen-box">

                <span>
                    Cobrado
                </span>

                <strong id="totalCobrado">
                    $ 0
                </strong>

            </div>

            <div class="resumen-box">

                <span>
                    Pendiente
                </span>

                <strong id="totalPendiente">
                    $ 0
                </strong>

            </div>

        </div>

    </div>


    <div class="card">

        <h2>📅 Próximos cobros</h2>

        <div class="tabla-container">

            <table>

                <thead>

                    <tr>
                        <th>Factura</th>
                        <th>Cliente</th>
                        <th>Importe</th>
                        <th>Fecha de cobro</th>
                        <th>Estado</th>
                        <th>Acciones</th>
                    </tr>

                </thead>

                <tbody id="tablaFacturas"></tbody>

            </table>

        </div>

    </div>

</div>


<script>

const STORAGE_KEY = "gesbase_facturas";

let facturas = [];


/* =========================
   FECHA ACTUAL
========================= */

function fechaHoy(){

    const fecha = new Date();

    const año = fecha.getFullYear();

    const mes = String(fecha.getMonth() + 1).padStart(2,"0");

    const dia = String(fecha.getDate()).padStart(2,"0");

    return `${año}-${mes}-${dia}`;
}


/* =========================
   INICIALIZAR
========================= */

document.addEventListener("DOMContentLoaded", () => {

    document.getElementById("fechaFactura").value = fechaHoy();

    cargarFacturas();

    calcularFechaCobro();

    document
        .getElementById("fechaFactura")
        .addEventListener("change", calcularFechaCobro);

    document
        .getElementById("diasCobro")
        .addEventListener("change", calcularFechaCobro);

});


/* =========================
   CALCULAR FECHA DE COBRO
========================= */

function calcularFechaCobro(){

    const fechaFactura =
        document.getElementById("fechaFactura").value;

    const dias =
        Number(document.getElementById("diasCobro").value);

    if(!fechaFactura){
        return;
    }

    const fecha = new Date(fechaFactura + "T00:00:00");

    fecha.setDate(
        fecha.getDate() + dias
    );

    const año = fecha.getFullYear();

    const mes =
        String(fecha.getMonth() + 1).padStart(2,"0");

    const dia =
        String(fecha.getDate()).padStart(2,"0");

    document.getElementById("fechaCobro").value =
        `${año}-${mes}-${dia}`;
}


/* =========================
   GUARDAR FACTURA
========================= */

document
.getElementById("formFactura")
.addEventListener("submit", function(e){

    e.preventDefault();

    calcularFechaCobro();

    const factura = {

        id: Date.now(),

        numero:
            document.getElementById("numeroFactura").value.trim(),

        fechaFactura:
            document.getElementById("fechaFactura").value,

        cliente:
            document.getElementById("cliente").value.trim(),

        cuit:
            document.getElementById("cuit").value.trim(),

        importe:
            Number(document.getElementById("importe").value),

        diasCobro:
            Number(document.getElementById("diasCobro").value),

        fechaCobro:
            document.getElementById("fechaCobro").value,

        estado:
            document.getElementById("estado").value

    };

    facturas.push(factura);

    guardarFacturas();

    mostrarFacturas();

    actualizarResumen();

    alert("Factura guardada correctamente.");

    limpiarFormulario();

});


/* =========================
   GUARDAR LOCALMENTE
========================= */

function guardarFacturas(){

    localStorage.setItem(
        STORAGE_KEY,
        JSON.stringify(facturas)
    );

}


/* =========================
   CARGAR FACTURAS
========================= */

function cargarFacturas(){

    const datos =
        localStorage.getItem(STORAGE_KEY);

    if(datos){

        try{

            facturas = JSON.parse(datos);

        }catch(error){

            facturas = [];

        }

    }

    mostrarFacturas();

    actualizarResumen();

}


/* =========================
   MOSTRAR FACTURAS
========================= */

function mostrarFacturas(){

    const tabla =
        document.getElementById("tablaFacturas");

    tabla.innerHTML = "";

    if(facturas.length === 0){

        tabla.innerHTML = `
            <tr>
                <td colspan="6">
                    No hay facturas cargadas.
                </td>
            </tr>
        `;

        return;
    }


    const ordenadas =
        [...facturas].sort(
            (a,b) =>
                new Date(a.fechaCobro) -
                new Date(b.fechaCobro)
        );


    ordenadas.forEach(factura => {

        const hoy =
            new Date(fechaHoy() + "T00:00:00");

        const fechaCobro =
            new Date(factura.fechaCobro + "T00:00:00");

        let estadoTexto =
            factura.estado === "cobrada"
            ? "Cobrada"
            : "Pendiente";

        let claseEstado =
            factura.estado === "cobrada"
            ? "cobrada"
            : "pendiente";


        if(
            factura.estado !== "cobrada" &&
            fechaCobro < hoy
        ){

            estadoTexto = "Vencida";

            claseEstado = "vencida";

        }


        tabla.innerHTML += `

            <tr>

                <td>
                    <strong>
                        ${escapeHTML(factura.numero)}
                    </strong>
                </td>

                <td>
                    ${escapeHTML(factura.cliente)}
                </td>

                <td>
                    ${formatearDinero(factura.importe)}
                </td>

                <td class="fecha-cobro">
                    ${formatearFecha(factura.fechaCobro)}
                </td>

                <td>

                    <span class="estado ${claseEstado}">
                        ${estadoTexto}
                    </span>

                </td>

                <td>

                    ${
                        factura.estado !== "cobrada"

                        ?

                        `
                        <button
                            class="btn-success"
                            onclick="marcarCobrada(${factura.id})"
                        >
                            ✓ Cobrada
                        </button>
                        `

                        :

                        ""
                    }

                    <button
                        class="btn-danger"
                        onclick="eliminarFactura(${factura.id})"
                    >
                        🗑
                    </button>

                </td>

            </tr>

        `;

    });

}


/* =========================
   MARCAR COBRADA
========================= */

function marcarCobrada(id){

    const factura =
        facturas.find(
            f => f.id === id
        );

    if(!factura){
        return;
    }

    factura.estado = "cobrada";

    guardarFacturas();

    mostrarFacturas();

    actualizarResumen();

}


/* =========================
   ELIMINAR
========================= */

function eliminarFactura(id){

    if(
        !confirm(
            "¿Querés eliminar esta factura?"
        )
    ){

        return;

    }

    facturas =
        facturas.filter(
            f => f.id !== id
        );

    guardarFacturas();

    mostrarFacturas();

    actualizarResumen();

}


/* =========================
   RESUMEN
========================= */

function actualizarResumen(){

    let facturado = 0;

    let cobrado = 0;

    let pendiente = 0;


    facturas.forEach(factura => {

        const importe =
            Number(factura.importe) || 0;

        facturado += importe;

        if(factura.estado === "cobrada"){

            cobrado += importe;

        }else{

            pendiente += importe;

        }

    });


    document.getElementById("totalFacturado")
        .textContent =
        formatearDinero(facturado);


    document.getElementById("totalCobrado")
        .textContent =
        formatearDinero(cobrado);


    document.getElementById("totalPendiente")
        .textContent =
        formatearDinero(pendiente);

}


/* =========================
   LIMPIAR FORMULARIO
========================= */

function limpiarFormulario(){

    document
        .getElementById("formFactura")
        .reset();

    document
        .getElementById("fechaFactura")
        .value = fechaHoy();

    document
        .getElementById("diasCobro")
        .value = "1";

    calcularFechaCobro();

}


/* =========================
   FORMATO DINERO
========================= */

function formatearDinero(valor){

    return new Intl.NumberFormat(
        "es-AR",
        {
            style:"currency",
            currency:"ARS",
            maximumFractionDigits:2
        }
    ).format(valor);

}


/* =========================
   FORMATO FECHA
========================= */

function formatearFecha(fecha){

    if(!fecha){
        return "";
    }

    const partes = fecha.split("-");

    if(partes.length !== 3){
        return fecha;
    }

    return `${partes[2]}/${partes[1]}/${partes[0]}`;

}


/* =========================
   SEGURIDAD HTML
========================= */

function escapeHTML(text){

    return String(text)
        .replace(/&/g,"&amp;")
        .replace(/</g,"&lt;")
        .replace(/>/g,"&gt;")
        .replace(/"/g,"&quot;")
        .replace(/'/g,"&#039;");

}

</script>

</body>
</html>
